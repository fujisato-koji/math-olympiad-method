  text: 'ある家に子どもが 30 人いました。15 人は いまのお母さんの実の子、15 人は前のお母さんの子（継子）です。お母さんは 30 人を輪に並べ、決まった人から数えて 10 人目ごとに輪から ぬけさせ、最後に残った 1 人に あとを つがせることにしました。

    (1) お母さんは、はじめに ぬける 14 人が全部 継子 になるように並べました。数え始めの人を 1 番として、時計回りに 1〜30 番とすると、継子 を何番に並べればよいでしょう。

    (2) 14 人続けて 継子 がぬけたので、残った 継子 が「今度は わたしから数えてください」と言いました。そうすると、実の子が 15 人続けて ぬけ、継子 が残りました。なぜでしょう。

    '
  answer: '(1) ぬける順は 10、20、30、11、22、3、15、27、9、24、7、23、8、26、… なので、3、7、8、9、10、11、15、20、22、23、24、26、27、30 番に 継子 を置く。（15 人目の 継子 は、残りのどこでもよい）

    (2) 16 人の輪で、ある人から数えて 10 人目ごとに ぬけさせると、数え始めの人が最後に残る。だから、数え始めた 継子 が残る。

    '
  paths:
  - - (1) 1〜30 を輪に書き、10 番目ごとに印をつけて消していく。ぬけた番号を順に 14 こ書きとめる
  - - (2) 16 人に、言い出した 継子 を 1 番として 1〜16 の番号をつける
    - 1 から数えて 10 人目ごとに ぬけさせると、10、4、15、11、7、5、3、6、9、14、8、2、13、16、12 の順に ぬけて、最後に 1 番が残る
  stage: 3
  note: 1 世紀のユダヤの歴史家ヨセフスの話にちなみ、世界では「ヨセフスの問題」と呼ばれる。人数を 1 人ずつふやしたときの、最後に残る番号の きまり（漸化式）もある。
- id: CL-JINKOKI-YAKUSHI
  source: 吉田光由『塵劫記』薬師算（寛永 6 年ごろ以降の版）
  units:
  - L-001
  - C-001
  - N-013
  missing: []
  url:
  - https://www.tosho-bunko.jp/column/research/column11.html
  pd: 吉田光由は 1673 年没で、著作権はない。薬師算が『塵劫記』の遊戯の題の 1 つであることは東書文庫の解説による。並べ方の細部は版の画像と照合しておらず、広く伝わる形で書いた。
  text: '相手に、碁石を正方形の わく の形（中は からっぽ）に並べてもらいます。1 辺に何こ並べるかは、相手が勝手に決めます（5 こ以上）。

    次に、1 辺だけを残して ほかの石を くずし、くずした石を、残した辺と同じ長さの列にして、残した辺のとなりに並べていってもらいます。最後の列が足りずに半ぱになったら、その半ぱの石の数だけを教えてもらいます。

    半ぱの数が r このとき、石は全部で 4 × r + 12 こ。なぜでしょう。

    '
  answer: 1 辺 n この わく の石は 4n − 4 こ。1 辺 n こを残すと、くずすのは 3n − 4 = 2n + (n − 4) こなので、n この列が 2 本できて n − 4 こ余る。r = n − 4 だから、全部は 4n − 4 = 4(r + 4) − 4 = 4r + 12 こ。
  paths:
  - - 1 辺 5 こ、6 こ、7 こ、… で試して、全部の数と半ぱの数を表にする（16 と 1、20 と 2、24 と 3、…）
    - 半ぱが 1 ふえると、全部は 4 ふえる。半ぱが 1 のとき 16 なので、全部は 4 × r + 12
  - - （段 4、A-010）1 辺 n とおいて式で示す。全部 4n − 4、くずす石 3n − 4 = 2 × n + (n − 4)
  stage: 3
  note: 12 という数が、薬師如来を守る十二神将と同じなので「薬師算」と呼ばれる。相手の石の数を当てる手品として、江戸の人々が楽しんだ。
- id: CL-SEKI-SUMS
  source: 関孝和『括要算法』巻元 垛積術（1712 年刊。関の没後に弟子が刊行）
  units:
