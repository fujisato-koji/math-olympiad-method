  text: '6 の約数のうち 6 より小さいものは 1、2、3 で、たすと 6 になります。28 も 1 + 2 + 4 + 7 + 14 = 28。このような数を「完全数」と言います。

    ユークリッドは、完全数をつくる方法を書きました。「1、2、4、8、… と倍にしながらたしていき、和が素数になったら、その和に、最後にたした数をかける。」

    (1) 1 + 2 = 3（素数）から 3 × 2 = 6、1 + 2 + 4 = 7（素数）から 7 × 4 = 28 が出ることを確かめましょう。

    (2) この方法で 28 の次の完全数を見つけ、本当に完全数か確かめましょう。

    '
  answer: 496（1 + 2 + 4 + 8 + 16 = 31 が素数なので 31 × 16 = 496。496 より小さい約数 1、2、4、8、16、31、62、124、248 の和が 496）
  paths:
  - - 1 + 2 + 4 + 8 = 15 は素数でないので飛ばす
    - 1 + 2 + 4 + 8 + 16 = 31 は素数。31 × 16 = 496
    - 496 = 2⁴ × 31 の約数は、1、2、4、8、16 と、その 31 倍の 31、62、124、248、496
    - 496 より小さい約数の和は (1 + 2 + 4 + 8 + 16) + 31 × (1 + 2 + 4 + 8) = 31 + 465 = 496
  - - 約数の和の公式で。496 = 2⁴ × 31 の約数の和は (1 + 2 + 4 + 8 + 16)(1 + 31) = 31 × 32 = 992 = 2 × 496
  stage: 3
  note: その次は 1 + 2 + … + 64 = 127 から 127 × 64 = 8128。偶数の完全数はすべてこの形であることを、2000 年後にオイラーが示した（没後の 1849 年刊）。奇数の完全数があるかどうかは、いまも誰にも分からない未解決問題。
- id: CL-ARCHIMEDES-1
  source: アルキメデス『円の計測』命題 3（前 250 年ごろ）
  units:
  - G-010
  - G-019
  - A-016
  missing: []
  url:
  - https://archive.org/details/worksofarchimede00arch
  pd: 原典は約 2250 年前。Heath『The Works of Archimedes』（1897 年刊、Heath は 1940 年没）は、日本・米国とも保護期間が切れている。問題は命題 3 の考えをもとに、易しい形に自分で作り直した。
  text: '円周の長さは、直径の何倍でしょう（この倍率を円周率 π と言います）。

    (1) 半径 1 の円に、ぴったり入る正六角形と、円がぴったり入る正方形をかきます。円周は、正六角形のまわりより長く、正方形のまわりより短いことを使って、3 < π < 4 を示しましょう。

    (2) 正六角形のかわりに、円にぴったり入る正十二角形を使うと、π は 3.1 より大きいと言えます。確かめましょう。

    '
  answer: '(1) 正六角形のまわりは 6、正方形のまわりは 8。円周 2π について 6 < 2π < 8 なので 3 < π < 4。

    (2) 正十二角形の 1 辺は √(2 − √3) = 0.5176…。まわりは 6.2116… なので π > 3.105…。

    '
  paths:
  - - (1) 正六角形は、中心と頂点を結ぶと 1 辺 1 の正三角形 6 つに分かれるので、まわりは 6
    - 円がぴったり入る正方形の 1 辺は直径の 2 なので、まわりは 8
    - 2 点を結ぶ線は まっすぐ がいちばん短いので、円周は正六角形のまわりより長い。外から包む正方形のまわりより短いことは、認めて使う
  - - (2) 正六角形の 1 辺 AB の真上にある円周の点を M とする。中心 O から AB までの距離は √3/2、M から AB までは 1 − √3/2
    - AM² = (1/2)² + (1 − √3/2)² = 2 − √3。AM = √(2 − √3) ≒ 0.5176
    - 12 倍して 6.21 > 6.2 なので、2π > 6.2、π > 3.1
  stage: 4
  note: アルキメデスは正 96 角形まで計算を進め、3 10/71 < π < 3 1/7（3.1408 < π < 3.1429）を示した。辺の数を倍、倍にしていく同じ方法は、中国でも劉徽（263 年）や祖沖之（5 世紀）が使った。
- id: CL-ANTHOLOGY-DIOPHANTUS
  source: ギリシア詞華集 第 14 巻 126 番「ディオファントスの墓碑銘」（メトロドロスの集、500 年ごろ）
  units:
  - N-019
  - A-005
  - N-018
  missing: []
  url:
  - https://archive.org/details/greekanthologyin0005wrtr
  pd: 原典は約 1500 年前。Paton の英訳（Loeb 叢書 第 5 巻、1918 年初刷、Paton は 1921 年没）は、日本・米国とも保護期間が切れている。archive.org の画像は 1926 年の刷。問題文は訳を写さず、内容から書き直した。
  text: 'ディオファントスのお墓に、こんな なぞ が書かれていたと伝えられます。

    「かれは一生の 6 分の 1 を子どもとして過ごし、さらに 12 分の 1 たって ひげ がはえ、さらに 7 分の 1 たって結婚した。その 5 年後に息子が生まれた。息子は、父の一生の半分の年まで生きて亡くなった。父は そのあと 4 年生きて亡くなった。」

    ディオファントスは 何さい まで生きたでしょう。

    '
  answer: 84 さい
  paths:
  - - 一生を 1 とすると、1/6 + 1/12 + 1/7 + 1/2 = 14/84 + 7/84 + 12/84 + 42/84 = 75/84
    - 残りの 9/84 が 5 年 + 4 年 = 9 年
    - 1/84 が 1 年なので、一生は 84 年
  - - 一生の年数は 6、12、7、2 のどれでもわり切れるはず。その最小公倍数は 84
    - 人の一生として 84 がちょうどよい。確かめると合う
  stage: 3
  note: ディオファントスは 3 世紀ごろのアレクサンドリアの数学者で、『算術』で、わからない数を記号で書く工夫を始めた。なぞの答えから、ひげ は 21 さい、結婚は 33 さい、息子は 42 さいで亡くなったことになる。生きた年が、このなぞ以外にほとんど伝わっていない。
- id: CL-DIOPHANTUS-II8
  source: ディオファントス『算術』第 2 巻 問題 8（3 世紀ごろ）
  units:
  - A-015
  - A-017
  missing: []
  url:
  - https://archive.org/details/diophantusofalex00heatiala
  pd: 原典は約 1750 年前。Heath『Diophantus of Alexandria』第 2 版（1910 年刊、Heath は 1940 年没）は、日本・米国とも保護期間が切れている。フェルマーの書き込みは 1670 年刊。問題文は書き直した。
  text: '16 は 4 × 4 で、平方数です。16 を、2 つの平方数（分数の 2 乗でもよい）の和に分けましょう。0 は使いません。

    ディオファントスのヒント。一方を x²、もう一方を (2x − 4)² とおいてみる。

    '
  answer: 16 = 256/25 + 144/25（= (16/5)² + (12/5)²）
  paths:
  - - x² + (2x − 4)² = 16 とおく
    - 展開して 5x² − 16x + 16 = 16、つまり 5x² = 16x
    - x は 0 でないので x = 16/5。2x − 4 = 12/5
    - (16/5)² + (12/5)² = 256/25 + 144/25 = 400/25 = 16
  - - 三平方の定理で（G-019）。3、4、5 の直角三角形を 4/5 倍すると、辺は 12/5、16/5、4
    - (12/5)² + (16/5)² = 4² = 16
  stage: 4
  note: 1630 年代にフェルマーは、この問題の余白に「立方数を 2 つの立方数に分けることはできない。驚くべき証明を見つけたが、余白が狭すぎて書けない」と書いた（息子が 1670 年に刊行）。この「フェルマーの最終定理」は、350 年以上たった 1995 年に、ワイルズの論文で証明が完成した。
- id: CL-ZENO-1
  source: ゼノンの逆説「アキレスと亀」（前 5 世紀。アリストテレス『自然学』第 6 巻 9 章、前 350 年ごろに記録）
  units:
  - A-007
  - N-019
  missing:
  - 無限級数の和（極限）
  url:
  - http://classics.mit.edu/Aristotle/physics.6.vi.html
  pd: 原典は 2300 年以上前。MIT の Internet Classics Archive にある Hardie と Gaye の英訳（1930 年刊）は参照しただけで、問題には使っていない。速さ 10 倍と 100 m の数は、アリストテレスの記録になく自分で置いた。
  text: '足の速いアキレスが、100 m 先にいる亀を追いかけます。アキレスは秒速 10 m、亀は秒速 1 m です。

    ゼノンはこう言いました。「アキレスが亀のいた所に着くと、亀は少し先にいる。そこに着くと、亀はまた少し先にいる。これが いつまでも 続くので、アキレスは亀に追いつけない。」

    本当でしょうか。追いつくなら、何秒後に、出発点から何 m の所で追いつきますか。

    '
  answer: 追いつく。100/9 秒後（約 11.1 秒後）、出発点から 1000/9 m（約 111.1 m）の所。
  paths:
  - - 1 秒ごとに、2 人の間は 10 − 1 = 9 m ずつ ちぢむ
    - 100 m ちぢむのは 100 ÷ 9 = 100/9 秒後
    - そのときアキレスは 10 × 100/9 = 1000/9 m 走っている
  - - ゼノンの区切り方のまま たす。アキレスが走るのは 100 + 10 + 1 + 0.1 + … m
    - 111.111… = 1000/9 で、区切りが無限にあっても、和は決まった数になる
  stage: 3
  note: 答えの数を出すのは易しいが、ゼノンが問うたのは「無限にたくさんの区切りが、ある時間で終わる」ことの ふしぎ。無限に多くの数をたすとはどういうことかを、きちんと定められたのは 19 世紀（極限の考え）になってから。
- id: CL-JIUZHANG-REED
  source: 『九章算術』句股章 第 6 問（後 1 世紀ごろまでに成立、劉徽の注は 263 年）
  units:
  - G-019
  - A-015
  - A-011
  missing: []
  url:
  - https://zh.wikisource.org/wiki/九章算術
  pd: 著者不詳の約 2000 年前の書で、著作権はない。原文は中国語版ウィキソース（パブリックドメインとして収載）で読んだ。問題文は原文から自分で訳し直した。
  text: '1 辺が 1 丈（10 尺）の正方形の池があります。池の まん中 に アシ が 1 本はえていて、水面から 1 尺出ています。この アシ を岸のほうへ引きよせると、先がちょうど岸の水ぎわに とどきました。

    池の深さと アシ の長さは、それぞれ何尺でしょう。

    '
  answer: 水の深さ 12 尺、アシ の長さ 13 尺
  paths:
  - - 深さを x 尺とすると、アシ の長さは x + 1 尺
    - まん中から岸までは 5 尺。引きよせた アシ、深さ、5 尺で直角三角形ができる
    - (x + 1)² = x² + 5² から 2x + 1 = 25、x = 12
  - - 原典の術。5 × 5 = 25 から 1 × 1 = 1 を引いて 24。それを 1 の 2 倍の 2 でわった 12 が深さ。1 をたした 13 が アシ
    - 5、12、13 の直角三角形になっている
  stage: 4
  note: 「句股」は直角三角形の短い辺（句）と長い辺（股）のこと。中国では三平方の定理を「句股の定理」と呼ぶ。水から出た植物を倒す同じ形の問題は、12 世紀インドのバースカラの本（池のハス）にも出てくる。
- id: CL-JIUZHANG-VINE
  source: 『九章算術』句股章 第 5 問（後 1 世紀ごろまでに成立）
  units:
  - G-021
  - G-019
  missing: []
  url:
  - https://zh.wikisource.org/wiki/九章算術
  pd: CL-JIUZHANG-REED と同じ。
  text: '高さ 2 丈（20 尺）、まわり 3 尺の木があります。根もとから つる草（クズ）がはえ、木に 7 回まきついて、ちょうど てっぺん に とどきました。

    つる草の長さは何尺でしょう。

    '
  answer: 29 尺
  paths:
  - - 木を円柱と見て、側面を たてに切り開くと長方形になる
    - 7 回分を横に並べると、横 3 × 7 = 21 尺、たて 20 尺の長方形
    - つる草は その対角線になるので、√(21² + 20²) = √841 = 29 尺
  stage: 4
  note: 立体を切り開いて平面にする考えは、20 世紀のデュードニーの「クモとハエ」（CL-DUDENEY-SPIDER）と同じ。21、20、29 は、辺がすべて整数の直角三角形。
- id: CL-JIUZHANG-BIRDS
  source: 『九章算術』均輸章 第 20 問（後 1 世紀ごろまでに成立）
  units:
  - A-007
  - N-019
  missing: []
  url:
  - https://zh.wikisource.org/wiki/九章算術
  pd: CL-JIUZHANG-REED と同じ。
  text: 'カモは南の海を飛び立って 7 日で北の海に着きます。ガンは北の海を飛び立って 9 日で南の海に着きます。カモとガンが同時に飛び立つと、何日後に出会うでしょう。

    '
  answer: 3 と 15/16 日後（63/16 日後）
  paths:
  - - 海と海の間を 1 とすると、カモは 1 日に 1/7、ガンは 1/9 進む
    - 2 羽 合わせて 1 日に 1/7 + 1/9 = 16/63 ちぢむ
    - 1 ÷ 16/63 = 63/16 = 3 と 15/16 日
  - - 原典の術。7 × 9 = 63 を 7 + 9 = 16 でわる
    - （間を 63 とすると、カモは 1 日に 9、ガンは 1 日に 7 進み、合わせて 16 ずつ近づく）
  stage: 3
  note: いまの「旅人算」「仕事算」と同じ形。原典の術「日数の積を、日数の和でわる」は、2 本の管で水そうに水をためる問題にも そのまま使える。
- id: CL-JIUZHANG-YINGBUZU
  source: 『九章算術』盈不足章 第 1 問（後 1 世紀ごろまでに成立）
  units:
  - A-014
  - A-011
  missing: []
  url:
  - https://zh.wikisource.org/wiki/九章算術
  pd: CL-JIUZHANG-REED と同じ。
  text: '何人かで品物を共同で買います。1 人 8 銭ずつ出すと 3 銭あまり、1 人 7 銭ずつ出すと 4 銭足りません。人数と品物の値段はいくらでしょう。

    '
  answer: 7 人、53 銭
  paths:
  - - 人数を x とすると、値段は 8x − 3 とも 7x + 4 とも書ける
    - 8x − 3 = 7x + 4 から x = 7、値段は 8 × 7 − 3 = 53
  - - 過不足算。1 人あたり 8 − 7 = 1 銭ちがうと、全体では 3 + 4 = 7 銭ちがう
    - だから人数は 7 ÷ 1 = 7 人、値段は 8 × 7 − 3 = 53 銭
  stage: 4
  note: 『九章算術』には「盈不足（あまりと不足）」という章がまるごとある。この考えは中国からイスラム圏を通ってヨーロッパへ伝わったと言われ、「二重仮定法」として教えられた。日本の算数の「過不足算」と同じ。
- id: CL-JIUZHANG-FANGCHENG
  source: 『九章算術』方程章 第 1 問（後 1 世紀ごろまでに成立）
  units:
  - A-012
  missing: []
  url:
  - https://zh.wikisource.org/wiki/九章算術
  pd: CL-JIUZHANG-REED と同じ。
  text: '上・中・下の 3 種類のイネのたば があります。

    上 3 たば、中 2 たば、下 1 たば で、実（もみ）は 39 斗。

    上 2 たば、中 3 たば、下 1 たば で、34 斗。

    上 1 たば、中 2 たば、下 3 たば で、26 斗。

    1 たばずつの実は、それぞれ何斗でしょう。

    '
  answer: 上 9 と 1/4 斗、中 4 と 1/4 斗、下 2 と 3/4 斗
  paths:
  - - 上、中、下の 1 たばを x、y、z 斗として、3 つの式を立てる
    - 式どうしを何倍かして引き、x を消す。残った 2 つの式から y を消すと 36z = 99、z = 11/4
    - もどして y = 17/4、x = 37/4
  - - 原典の「方程」。係数を算木で たての列に並べ、列どうしを何倍かして引く操作をくり返す
    - 最後の列が「下 36 たば で 99 斗」になり、下 = 99/36 = 2 と 3/4
  stage: 4
  note: いまの「消去法（ガウスの消去法）」と同じ手順が、約 2000 年前の中国で使われていた。「方程」という言葉は この章の名前から来ている。負の数の計算のきまり（正負術）も、この章に初めて書かれた。
- id: CL-JIUZHANG-WEAVER
  source: 『九章算術』衰分章 第 4 問（後 1 世紀ごろまでに成立）
  units:
