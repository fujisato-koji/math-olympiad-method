  text: '線分 AB が 1 本あります。定規（目もりは使わない）とコンパスだけで、AB を 1 辺とする正三角形をかきましょう。かいたあと、なぜ 3 つの辺が同じ長さになるのかを説明しましょう。

    '
  answer: A を中心に B を通る円と、B を中心に A を通る円をかき、2 つの円が交わる点を C とする。三角形 ABC が正三角形。
  paths:
  - - A を中心に B を通る円をかく。B を中心に A を通る円をかく
    - 2 つの円が交わる点の 1 つを C とし、C と A、C と B を結ぶ
    - C は 1 つ目の円の上にあるので AC = AB。2 つ目の円の上にあるので BC = BA
    - 同じものに等しいものどうしは等しいので AC = BC。3 辺が等しい
  stage: 4
  note: 『原論』のいちばん最初の命題。2000 年以上、世界中で幾何の教科書として読まれた。ユークリッドは「2 つの円が本当に交わる」理由を公理から示しておらず、この穴などをうめるために、19 世紀の終わりにヒルベルトが幾何の公理を作り直した。
- id: CL-EUCLID-VII2
  source: ユークリッド『原論』第 7 巻 命題 2（前 300 年ごろ）
  units:
  - N-018
  - N-029
  missing: []
  url:
  - https://mathcs.clarku.edu/~djoyce/java/elements/bookVII/propVII2.html
  pd: CL-EUCLID-I1 と同じ（Heath 訳は全 3 巻、1908）。数 391 と 323 は自分で選んだ。
  text: '391 と 323 の両方をわり切る数のうち、いちばん大きい数（最大公約数）を求めましょう。

    約数を全部書き出すのではなく、ユークリッドのやり方「大きいほうから小さいほうを、引けるだけ引く。残りと小さいほうで、また同じことをする」を使います。

    '
  answer: '17'
  paths:
  - - 391 − 323 = 68
    - 323 から 68 を 4 回引くと 51 が残る
    - 68 − 51 = 17
    - 51 から 17 はちょうど 3 回引けて 0。最後に残った 17 が最大公約数
  - - わり算でまとめる（互除法）。391 ÷ 323 = 1 あまり 68、323 ÷ 68 = 4 あまり 51、68 ÷ 51 = 1 あまり 17、51 ÷ 17 = 3 あまり 0
  - - 図で見る。たて 323、横 391 の長方形から、できるだけ大きい正方形を切り取っていくと、最後に 1 辺 17 の正方形でぴったり終わる
  stage: 4
  note: 2300 年前に書かれた「手順」で、いまも計算機の中で毎日使われている、最も古いアルゴリズムの 1 つ。最後に残る数が答えになるのは、「2 つの数をわり切る数は、その差もわり切る」から。
- id: CL-EUCLID-IX20
  source: ユークリッド『原論』第 9 巻 命題 20（前 300 年ごろ）
  units:
  - N-021
  - N-022
  missing: []
  url:
  - https://mathcs.clarku.edu/~djoyce/java/elements/bookIX/propIX20.html
  pd: CL-EUCLID-I1 と同じ。(1) の入口の小問は自分で足した。
  text: '素数（1 とその数自身でしかわり切れない、2 以上の数）は、2、3、5、7、11、… と続きます。素数は どこかで終わってしまうでしょうか。

    (1) 2 × 3 × 5 × 7 + 1 を計算し、この数が 2、3、5、7 のどれでもわり切れない わけを言いましょう。

    (2) 素数がいくつか並んだリストがあれば、必ず そのリストにない素数がある、と説明しましょう。

    '
  answer: '(1) 211。2、3、5、7 のどれでわっても 1 あまる。（211 は素数）

    (2) リストの素数を全部かけて 1 をたした数 N は、リストのどの素数でわっても 1 あまる。N を素数の積に分けると、出てくる素数はリストにない。だから素数は限りなくある。

    '
  paths:
  - - リストの素数を全部かけて 1 をたし、N とする
    - リストのどの素数 p でわっても、N は p の倍数より 1 大きいので 1 あまる
    - N は 2 以上なので素数の積に分けられる。その素数はリストのどれとも違う
    - どんなリストにも入っていない素数があるので、素数は終わらない
  - - 背理法で書く（段 4、L-011）。素数が有限個しかないとし、全部かけて 1 をたすと、どの素数でもわり切れない 2 以上の数ができて矛盾する
  stage: 3
  note: N 自身が素数とはかぎらない。2 × 3 × 5 × 7 × 11 × 13 + 1 = 30031 = 59 × 509。それでも 59 も 509 もリストにない新しい素数なので、話はちゃんと成り立つ。ユークリッドの書き方は「素数は、どれだけ多く並べた素数よりも多い」で、新しい素数をつくって見せる形。
