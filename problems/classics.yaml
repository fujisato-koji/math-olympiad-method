  text: 'A さん と B さん が、先に 3 回勝ったほうが賭け金 64 枚を全部もらう、という勝負をしています。どちらも勝つ見込みは同じです。A さん が 2 回、B さん が 1 回勝ったところで、勝負をやめなければならなくなりました。

    64 枚を、どう分けるのが公平でしょう。

    '
  answer: A さん 48 枚、B さん 16 枚（3 対 1）
  paths:
  - - 後ろから考える。次の勝負で A さん が勝てば、A さん が 64 枚
    - B さん が勝てば 2 対 2。そこから先は五分五分なので 32 枚ずつ
    - A さん は「64 か 32 が半々」なので、その真ん中の 48 枚。B さん は 16 枚
  - - あと 2 回やったとして、出方 4 通り（AA、AB、BA、BB）を書き出す
    - A さん が勝負に勝つのは BB 以外の 3 通り。64 枚を 3 対 1 に分けて 48 と 16
  stage: 3
  note: 15 世紀のパチョーリは「すでに勝った回数の比（2 対 1）」で分けると書いたが、それでは おかしいことを、パスカルとフェルマーが手紙で示した。この手紙のやりとりが、確率論の始まりとされる。
- id: CL-PASCAL-DEMERE
  source: パスカルからフェルマーへの手紙（1654 年 7 月 29 日）にある、ド・メレの問題
  units:
