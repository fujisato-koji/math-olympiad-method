  pd: リュカは 1891 年没で、著作権はない。第 3 巻（1893 年刊）は archive.org で読める。1883 年の初出は確かめていない。問題文は書き直した。
  text: '3 本の棒があり、1 本に大きさのちがう円板が、下から大きい順に n 枚重なっています。1 回に 1 枚ずつ、ほかの棒へ移します。小さい円板の上に大きい円板を のせてはいけません。全部を別の棒へ移すのに、最少で何回かかるでしょう。

    (1) n = 3 のとき。

    (2) n = 64 のとき。1 秒に 1 回動かすと何年かかるでしょう。

    '
  answer: (1) 7 回。(2) 2⁶⁴ − 1 = 18446744073709551615 回。1 秒に 1 回で約 5850 億年。
  paths:
  - - n 枚を移すには、上の n − 1 枚を よそ へ移し、いちばん大きい円板を動かし、n − 1 枚を その上へ移す
    - 回数を a(n) とすると a(n) = 2a(n − 1) + 1、a(1) = 1。a(2) = 3、a(3) = 7、a(4) = 15 と、いつも 2ⁿ − 1
    - これより少なくできないことは、いちばん大きい円板が動く前に、上の n − 1 枚が全部 1 本の棒にそろっていなければならないことから、帰納法で示す
  stage: 4
  note: このパズルには「インドの寺院で僧が 64 枚の金の円板を動かしていて、終わると世界が終わる」という作り話が添えられて広まった。かかる年数は、宇宙の年齢（約 138 億年）の 40 倍をこえる。
