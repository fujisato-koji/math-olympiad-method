  pd: アルクインは 804 年没で、著作権はない（最古の写本は 9 世紀末）。ラテン語の本文はラテン語版ウィキソースで読んだ。Hadley と Singmaster の英訳（1992）には権利があるので使わず、ラテン語の内容から書き直した。
  text: 'ある人が、オオカミ と ヤギ と キャベツ 1 玉 をつれて川をわたります。舟には、その人のほかに 1 つしか のせられません。その人がいないと、オオカミ は ヤギ を食べ、ヤギ は キャベツ を食べてしまいます。

    みんなを無事に向こう岸へ わたすには、どうすればよいでしょう。

    '
  answer: ヤギ を運ぶ → 1 人でもどる → オオカミ を運ぶ → ヤギ をつれてもどる → キャベツ を運ぶ → 1 人でもどる → ヤギ を運ぶ（オオカミ と キャベツ を入れかえてもよい）。7 回でわたれる。
  paths:
  - - オオカミ と キャベツ は いっしょ にいても平気。危ないのは ヤギ
    - だから最初は ヤギ を運ぶしかない
    - 次に オオカミ を運ぶと、向こう岸で ヤギ が危ない。そこで ヤギ をつれて帰るのが かぎ
    - ヤギ を置いて キャベツ を運び、最後に ヤギ をむかえに行く
  - - （段 3、C-012）岸の様子を「だれが どちらの岸にいるか」で書き、危なくない様子どうしを、1 回の舟で行き来できれば線で結ぶ。はじめから終わりへの道をさがす
  stage: 1
  note: 1200 年以上前、カール大帝の宮廷の学校で使われたと言われる問題集にある。同じ本には「3 人の兄弟とその妹たち」の川わたりなどもあり、世界で最も古い川わたりパズルとされる。
- id: CL-ALCUIN-12
  source: アルクイン（と伝えられる）『若者を鍛えるための問題集』第 12 問（800 年ごろ）
  units:
  - C-002
