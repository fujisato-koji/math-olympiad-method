  answer: たとえば 9 回で分けられる。（おけ、7 升ます、3 升ます）が（10、0、0）→（3、7、0）→（3、4、3）→（6、4、0）→（6、1、3）→（9、1、0）→（9、0、1）→（2、7、1）→（2、5、3）→（5、5、0）
  paths:
