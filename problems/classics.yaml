  pd: 約 3500 年前の写本で、著作権は初めからない。数と筋は Wikipedia の項による。英訳の Peet（1923 年刊、Peet は 1934 年没）と Chace（1927・1929 年刊、Chace は 1932 年没）は、日本では没後 50 年で満了、米国でも 1927 年より前の刊行または保護の切れた年の刊行。問題文は訳を写さず、内容から書き直した。
  text: '家が 7 けんあります。どの家にも ねこが 7 ひき います。どの ねこも ねずみを 7 ひき つかまえます。どの ねずみも 麦の穂を 7 本 食べるはずでした。どの穂からも 麦が 7 ます とれるはずでした。

    家、ねこ、ねずみ、穂、ます を ぜんぶ 合わせると いくつ でしょう。

    '
  answer: 19607（家 7、ねこ 49、ねずみ 343、穂 2401、ます 16807）
  paths:
  - - 7 を 1 回、2 回、… とかけて、7、49、343、2401、16807 を出す
    - 5 つをたす。7 + 49 + 343 + 2401 + 16807 = 19607
  - - パピルスのやり方。まず 1 + 7 + 49 + 343 + 2401 = 2801 をつくる
    - 5 つの数は、どれも 7 に 1、7、49、343、2401 をかけたものなので、和は 2801 × 7 = 19607
  stage: 3
  note: 約 3500 年前のエジプトの「7 の山」。同じ形の数え歌は、1202 年のフィボナッチ『算盤の書』（ローマへ行く 7 人のおばあさん、6 段で合計 137256）や、英語の童謡「セント・アイヴスへ行く道で」にも出てくる。
