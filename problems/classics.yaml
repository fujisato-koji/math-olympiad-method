  pd: 関孝和は 1708 年没で、著作権はない。国立国会図書館デジタルコレクションの正徳 2 年（1712）版の画像による。問題は内容（べき乗の和）をもとに自分で作った。
  text: '(1) 1² + 2² + 3² + … + 10² と、1³ + 2³ + … + 10³ を求めましょう。

    (2) 1³ + 2³ + … + n³ が、いつも (1 + 2 + … + n)² になることを確かめ、その わけ を考えましょう。

    (3)（挑戦）1² + 2² + … + n² を、n の式で表しましょう。

    '
  answer: (1) 385、3025。(2) たとえば n = 10 で 55² = 3025。(3) n(n + 1)(2n + 1)/6
  paths:
  - - (1) 1、4、9、…、100 と 1、8、27、…、1000 を順にたす
    - (2) 1 + 2 + … + n = n(n + 1)/2 を T(n) とする。T(n)² − T(n − 1)² = (T(n) − T(n − 1))(T(n) + T(n − 1)) = n × n² = n³
    - n³ を 1 から n まで たすと、T(n)² − T(0)² = T(n)² になる
  - - (3) (k + 1)³ − k³ = 3k² + 3k + 1 を k = 1〜n で たすと、左は (n + 1)³ − 1
    - ここから 3(1² + … + n²) = (n + 1)³ − 1 − 3n(n + 1)/2 − n を整理する
  stage: 4
  note: 関孝和は、べき乗の和を一般の次数まで表に整理し、そこに現れる係数の数（いまの「ベルヌーイ数」）を見つけていた。ヤコブ・ベルヌーイの本（1713 年刊）と ほぼ同じころで、日本とヨーロッパで別々に見つかった。
- id: CL-SANGAKU-3CIRCLES
  source: 群馬県の算額（1824 年、文政 7 年）
  units:
  - G-019
  - A-016
  - G-010
  missing: []
  url:
  - https://en.wikipedia.org/wiki/Sangaku
  pd: 江戸時代の算額で、著作権はない。年と県は英語版 Wikipedia の Sangaku の項による（神社名と作者は確かめていない）。半径 9 と 4 は自分で選んだ。
  text: 'まっすぐな線の上に、半径 9 の円と半径 4 の円がのっていて、2 つの円は おたがいに接しています。

    (1) 2 つの円が線と接する点どうしの距離はいくつでしょう。

    (2) 2 つの円の すき間 に、両方の円と線に接する小さな円を入れます。小さな円の半径はいくつでしょう。

    '
  answer: (1) 12。(2) 36/25（= 1.44）
  paths:
  - - (1) 2 つの中心を結ぶと長さ 9 + 4 = 13。中心の高さの差は 9 − 4 = 5
    - 中心を結ぶ線を斜辺とする直角三角形で、横は √(13² − 5²) = 12
  - - (2) 同じ考えで、半径 a と b の 2 円が接して線にのるとき、接点どうしの距離は 2√(ab)
    - 小さな円の半径を c とすると、2√(9c) + 2√(4c) = 12。6√c + 4√c = 12 から √c = 6/5、c = 36/25
    - 一般に 1/√c = 1/√a + 1/√b。ここでは 1/√c = 1/3 + 1/2 = 5/6
  stage: 4
  note: 算額は、江戸時代の人が解けた問題を絵馬にして、神社や お寺に奉納したもの。この 3 つの円の式は、すき間に円を次々と入れていく「円の列」の研究につながる。
- id: CL-SANGAKU-JAPANESE-THM
  source: 算額に由来する「日本の定理」（円に内接する多角形の内接円の半径の和。1800 年＝寛政 12 年ごろの算額とされる）
  units:
  - G-028
  - G-018
  missing:
  - カルノーの定理（外心から 3 辺への符号つき距離の和 = R + r）
  url:
  - https://en.wikipedia.org/wiki/Japanese_theorem_for_cyclic_polygons
  - https://www.ms.u-tokyo.ac.jp/~oshima/lecture/sangaku0.pdf
  pd: 江戸時代の算額で、著作権はない。定理の内容は英語版 Wikipedia の項による。年は大島利雄氏の講義資料による（文字化けした取り出しで読んだので、場所と作者とあわせて確かめていない）。問題は自分で作った。
  text: '円に内接する四角形 ABCD があります。対角線 AC で 2 つの三角形 ABC、ACD に分け、それぞれの内接円の半径をたします。対角線 BD で ABD、BCD に分けても、同じように半径をたします。

    (1) 半径 5/2 の円に内接する、たて 3、横 4 の長方形で、2 つの和をくらべましょう。

    (2) どんな円に内接する四角形でも、2 つの和は等しいことを示しましょう。

    '
  answer: (1) どちらの分け方でも 1 + 1 = 2（3、4、5 の直角三角形の内接円の半径は 1）。(2) 和は、どちらの分け方でも「外接円の中心から 4 辺への符号つき距離の和 − 2 × 外接円の半径」に等しく、分け方によらない。
  paths:
  - - (1) 長方形は、どちらの対角線で切っても 3、4、5 の直角三角形 2 つ
    - 直角三角形の内接円の半径は (3 + 4 − 5)/2 = 1。どちらも 1 + 1 = 2
  - - (2) カルノーの定理。円に内接する三角形では、外接円の中心 O から 3 辺への距離の和（O が辺の外側にあれば負）は R + r
    - 三角形 ABC と ACD に使って たすと、対角線 AC への距離は 2 つの三角形で符号が反対になって消える
    - r₁ + r₂ = (O から 4 辺への距離の和) − 2R。もう一方の対角線でも同じ式になる
  stage: 6
  note: 多角形を どう三角形に分けても、内接円の半径の和は変わらない、という形に広がる。和算家は、図形の量のあいだの きれいな関係を見つけるのが得意だった。
- id: CL-GAUSS-100
  source: ガウスの少年時代の逸話（ザルトリウス・フォン・ヴァルタースハウゼン『ガウスの思い出』1856）と、アルクイン（と伝えられる）『若者を鍛えるための問題集』第 42 問（800 年ごろ）
