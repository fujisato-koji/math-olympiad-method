  text: '2 人の旅人が午後 3 時に出発し、平らな道を歩いて山に登り、同じ道を通って帰り、9 時に着きました。歩く速さは、平らな道で時速 4 マイル、上り坂で時速 3 マイル、下り坂で時速 6 マイルです。

    (1) 全部で何マイル歩いたでしょう。

    (2) 山の頂上に着いたのは何時ごろでしょう（30 分の はば で答えましょう）。

    '
  answer: (1) 24 マイル。(2) 6 時から 7 時の間、つまり 6 時 30 分の前後 30 分以内。
  paths:
  - - (1) 坂を 1 マイル上って下ると 1/3 + 1/6 = 1/2 時間。平らな道を 1 マイル行って帰っても 1/4 + 1/4 = 1/2 時間
    - どこでも「1 マイル行って帰る」と 1/2 時間なので、6 時間で 12 マイルを往復。全部で 24 マイル
  - - (2) 片道 12 マイルが全部平らなら、頂上まで 12 ÷ 4 = 3 時間（6 時）。全部坂なら 12 ÷ 3 = 4 時間（7 時）
    - 本当は その間なので、6 時 30 分の前後 30 分以内
  stage: 4
  note: 作者は『不思議の国のアリス』を書いたオックスフォードの数学の先生。雑誌の読者から送られた答えに、物語の形で点をつけて講評した。
