    - 取り出したのが その 3 枚のどれかで、残りも金貨なのは 金金 の箱の 2 枚のとき。だから 2/3
  - - 樹形図。箱の選び方 3 通り × 取り出し方 2 通り = 6 通りを書き、「金が出た」3 通りだけに目をつける
