  text: 'ある量に、その 7 分の 1 をたすと 19 になりました。もとの量は いくつ でしょう。

    '
  answer: 16 と 5/8（パピルスでは 16 + 1/2 + 1/8 と書く）
  paths:
  - - 仮に 7 だとしてみる。7 の 7 分の 1 は 1 で、たすと 8
    - ほんとうは 19。19 は 8 の 19/8 倍
    - もとの量も 7 の 19/8 倍で、7 × 19/8 = 133/8 = 16 と 5/8
  - - もとの量を x とすると x + x/7 = 19。8x/7 = 19 なので x = 133/8（段 4、A-011）
  stage: 3
  note: 「仮に置いてみて、比例で直す」やり方を仮置き法（false position）と言う。文字の方程式がない時代の工夫で、ヨーロッパの算術書でも長く教えられた。エジプトでは 2/3 のほかは、分数を 1/n の和で書いた。
