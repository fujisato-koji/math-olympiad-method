  pd: CL-LILAVATI-BEES と同じ。
  text: '高さ 9 ハスタ の柱があり、その根もとに ヘビ の穴があります。柱の てっぺん に クジャク がとまっています。クジャク は、柱の高さの 3 倍はなれた所から穴へ向かってくる ヘビ を見つけ、ななめに まっすぐ 飛びかかりました。ヘビ と クジャク が同じ道のりを進んで出会ったとすると、穴から何 ハスタ の所で出会ったでしょう。（ハスタ は、ひじから指先までの長さ）

    '
  answer: 穴から 12 ハスタ
  paths:
  - - 穴から出会う点までを x とする。ヘビ の進んだ道のりは 27 − x
    - クジャク の道のりは、たて 9、横 x の直角三角形の斜辺で √(81 + x²)
    - 81 + x² = (27 − x)² から 81 = 729 − 54x、x = 12
    - クジャク も 15 進んでいる。9、12、15 の直角三角形
  stage: 4
  note: 9、12、15 は 3、4、5 の 3 倍。古代インドでは、祭壇を作るための縄の測量（『シュルバ・スートラ』）のころから、直角三角形がよく調べられていた。
- id: CL-BRAHMAGUPTA-1
  source: ブラーマグプタ『ブラーフマスプタ・シッダーンタ』第 18 章（628 年）
  units:
  - N-041
  - A-015
  missing: []
  url:
  - https://archive.org/details/algebrawitharith00brahuoft
  pd: 約 1400 年前の書で、著作権はない。Colebrooke の英訳（1817 年刊、Colebrooke は 1837 年没）は保護期間が切れている（p.364 で 92 と 83 を 1 つの問題として出す）。問題文は訳を写さず書き直した。
  text: '(1) 83 × x² + 1 が平方数（ある整数の 2 乗）になる正の整数 x を見つけましょう。

    (2) 92 × x² + 1 が平方数になる正の整数 x を見つけましょう。ブラーマグプタは「これを 1 年のうちに解ける人は数学者である」と書きました。

    ヒント。92 × 1² + 8 = 10²。「あまりが 8 になる組」を 2 つかけ合わせる方法を考えます。

    '
  answer: (1) x = 9（83 × 81 + 1 = 6724 = 82²）。(2) x = 120（92 × 14400 + 1 = 1324801 = 1151²）。
  paths:
  - - (1) x = 1、2、… と順に試すと、x = 9 で 6724 = 82²
  - - (2) ブラーマグプタの「組み合わせ」。92a² + k = b² と 92c² + l = d² から 92(ad + bc)² + kl = (bd + 92ac)² ができる
    - a = c = 1、b = d = 10、k = l = 8 として 92 × 20² + 64 = 192²
    - 両辺を 64 でわると 92 × (5/2)² + 1 = 24²
    - （5/2、24）をもう一度 自分と組み合わせて 92 × 120² + 1 = 1151²
  stage: 6
  note: この形の式は、ヨーロッパでは のちに「ペル方程式」と呼ばれたが、ペルは関係がない。1657 年にフェルマーは同じ形の 61x² + 1 = y² を挑戦問題として出した（いちばん小さい答えは x = 226153980）。12 世紀インドのバースカラ 2 世は、これを解く「チャクラヴァーラ法」を書いていた。
- id: CL-KHWARIZMI-1
  source: アル＝フワーリズミー『ジャブルとムカーバラの書』（820 年ごろ、バグダード）
  units:
  - A-017
  - G-008
  - A-016
  missing: []
  url:
