  pd: 約 3700 年前の粘土板で、著作権はない。数 1;24,51,10 は CDLI の目録と Wikipedia の項による。問題は内容をもとに自分で作った。
  text: 'バビロニアの人は、60 ずつでくり上がる数（60 進法）を使いました。正方形と対角線がかかれた粘土板に、1;24,51,10 という数が書いてあります。これは 1 + 24/60 + 51/60² + 10/60³ のことです。

    (1) この数を小数になおし、2 乗すると 2 にどれだけ近いか 調べましょう。

    (2) 2 乗すると 2 になる数（√2）に近づく方法があります。1.5 から始めて「a と 2/a の平均をとる」をくり返すと、どんな数が出てくるでしょう。

    '
  answer: '(1) 1.4142129…。2 乗すると 1.9999983… で、2 との差は 0.0000017 ほど。（√2 = 1.4142135…）

    (2) 3/2 → 17/12 → 577/408 → …。577/408 = 1.4142156… で、もう粘土板の値と同じくらい近い。

    '
  paths:
  - - (1) 24/60 = 0.4、51/3600 = 0.014166…、10/216000 = 0.0000462…
    - たして 1.4142129…。2 乗して 2 とくらべる
  - - (2) a が √2 より大きければ 2/a は √2 より小さいので、2 つの平均は もっと √2 に近い
    - 3/2 と 4/3 の平均は 17/12、17/12 と 24/17 の平均は 577/408
    - 対角線が √2 になるのは、対角線を 1 辺とする正方形が、もとの正方形 2 つ分の面積だから（三平方の定理、G-019）
  stage: 4
  note: 粘土板の値は √2 を 60 進法で小数第 3 位まで正しく書いたもの。どう計算したかは書かれていない。(2) のやり方は 1 世紀にアレクサンドリアのヘロンが書きのこしたもので、いまの計算機の平方根の計算（ニュートン法）にもつながる。
