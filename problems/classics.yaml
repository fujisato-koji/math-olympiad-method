  text: 'ド・メレ という人が、パスカルに相談しました。

    (ア) 1 この さいころ を 4 回ふって、少なくとも 1 回 6 が出るほうに賭ける。

    (イ) 2 この さいころ を 24 回ふって、少なくとも 1 回 6 のぞろ目が出るほうに賭ける。

    それぞれ、勝つ見込みは半分より大きいでしょうか、小さいでしょうか。

    '
  answer: (ア) 671/1296 ≒ 0.518 で、半分より大きい（有利）。(イ) 1 − (35/36)²⁴ ≒ 0.491 で、半分より小さい（不利）。
  paths:
  - - (ア) 4 回の目の出方は 6⁴ = 1296 通り。6 が 1 回も出ないのは 5⁴ = 625 通り
    - 少なくとも 1 回 6 が出るのは 1296 − 625 = 671 通りで、半分の 648 より多い
  - - (イ) 1 回で 6 のぞろ目が出ない見込みは 35/36。24 回続けて出ない見込みは (35/36)²⁴
    - (35/36)² = 0.9452…、4 乗 0.8934…、8 乗 0.7982…、16 乗 0.6372…。24 乗は 16 乗 × 8 乗 ≒ 0.5086
    - 少なくとも 1 回出る見込みは 1 − 0.5086 = 0.4914 で、半分より小さい
  stage: 3
  note: ド・メレは「(ア) で勝てるのだから、6 倍出にくい ぞろ目 を 6 倍の回数ふる (イ) も勝てるはず」と考えたが、実際には よく負けたという。見込みは、回数に比例してふえるわけではない。
- id: CL-NEWTON-OXEN
  source: ニュートン『普遍算術』（ラテン語 1707、英訳 1720）問題 11 の例
  units:
  - A-012
  - A-007
  missing: []
  url:
  - https://archive.org/details/b30538579
  pd: ニュートンは 1727 年没で、著作権はない。1720 年の英訳（archive.org の画像、pp.79–80）による。英訳の問題文は「36 エーカー」と読めるが、同じ頁の解は「24 エーカーなら 36 頭」と結んでいるので、解に合わせて 24 エーカーとした（36 エーカーなら答えは 54 頭）。問題文は書き直した。
  text: '牧場の草は、毎週 同じ速さで のびます（どの牧場も、はじめの草の量と のび方 は 1 エーカーあたり同じ）。

    牛 12 頭は、3 と 1/3 エーカーの牧場の草を 4 週間で食べつくします。

    牛 21 頭は、10 エーカーの牧場の草を 9 週間で食べつくします。

    24 エーカーの牧場の草を 18 週間で食べつくすのは、牛何頭でしょう。

    '
  answer: 36 頭
  paths:
  - - 牛 1 頭が 1 週間に食べる草を 1 とする。1 エーカーあたり、はじめの草を g、1 週間に のびる草を r とする
    - 12 × 4 = (10/3)(g + 4r) から g + 4r = 14.4。21 × 9 = 10(g + 9r) から g + 9r = 18.9
    - 引いて 5r = 4.5、r = 0.9、g = 10.8
    - 24 エーカーを 18 週なら、草は 24 × (10.8 + 18 × 0.9) = 24 × 27 = 648。648 ÷ 18 = 36 頭
  - - ニュートンの比例の筋。12 頭が 3 と 1/3 エーカーを 4 週なら、草が のびなければ 10 エーカーは 36 頭で 4 週、16 頭で 9 週、8 頭で 18 週
    - 実際は 9 週に 21 頭なので、4 週目から 9 週目までの 5 週分の のび が、5 頭を 9 週やしなう
    - 同じ割合で、18 週のうち 14 週分の のび は 7 頭を 18 週やしなう。8 + 7 = 15 頭で 10 エーカー
    - 24 エーカーなら 15 × 24/10 = 36 頭
  stage: 4
  note: 日本の中学受験の算数で「ニュートン算」と呼ばれる型は、この問題から名前がついた。この本は、ニュートンがケンブリッジ大学で行った講義をもとに、後任の教授ホイストンが出版した。
- id: CL-EULER-BRIDGES
  source: オイラー「位置の幾何学に関する問題の解」（E53、1736 年に発表、1741 年刊）
  units:
  - C-012
  - L-005
  missing: []
  url:
  - https://scholarlycommons.pacific.edu/euler-works/53/
  pd: オイラーは 1783 年没で、著作権はない。原論文は Euler Archive で読める。問題文は書き直した。
  text: 'ケーニヒスベルクの町には川が流れ、4 つの陸地（A は中州の島、B と C は川の両岸、D は川が分かれた間の陸地）を 7 本の橋が結んでいます。A と B の間に 2 本、A と C の間に 2 本、A と D、B と D、C と D の間に 1 本ずつです。

    どの橋も ちょうど 1 回ずつ わたって、町を散歩することは できるでしょうか。

    '
  answer: できない
  paths:
  - - 陸地を点、橋を線にした図にする。点から出ている線の数は A が 5、B・C・D が 3
    - 通りぬけるだけの点では、入る線と出る線が組になるので、線の数は偶数になる
    - 線の数が奇数の点は、出発点か終点にしかなれない。奇数の点が 4 つもあるので、散歩はできない
  - - オイラーの書き方。橋をわたるたびに、着いた陸地の文字を書くと、7 本わたる散歩は 8 文字の列になる
    - 橋が 5 本の A は 3 回、3 本の B・C・D は 2 回ずつ現れるはずで、合わせて 9 文字。8 に合わない
  stage: 3
  note: オイラーは「どんな町でも、陸地ごとの橋の数だけで決まる」ことを示した。長さや形でなく、つながり方だけを見るこの考えが、グラフ理論とトポロジーの始まりとされる。ケーニヒスベルクは、いまのロシアのカリーニングラード。
- id: CL-EULER-BASEL
  source: オイラー「逆数の級数の和について」（E41、1734/35 年に発表、1740 年刊）
  units:
  - N-026
  - A-018
  - A-013
  missing:
  - 無限級数の和（極限）
  - sin x の無限積への分解
  url:
  - https://scholarlycommons.pacific.edu/euler-works/41/
  pd: オイラーは 1783 年没で、著作権はない。(1) の入口の問題は自分で作った。
  text: '1 + 1/4 + 1/9 + 1/16 + … のように、平方数の逆数を限りなく たしていきます。

    (1) どこまで たしても、和は 2 をこえないことを示しましょう。ヒント。1/(2 × 2) < 1/(1 × 2)、1/(3 × 3) < 1/(2 × 3)、… と、1/(1 × 2) = 1 − 1/2 のような分け方を使います。

    (2)（大人向け）和が限りなく近づく数を、オイラーは 1735 年ごろに見つけました。その数は何でしょう。

    '
  answer: (1) n 項までの和は 2 − 1/n より小さい。(2) π²/6 = 1.6449…
  paths:
  - - (1) 2 項目から先を、大きいほうへ取りかえる。1/k² < 1/((k − 1)k) = 1/(k − 1) − 1/k
    - n 項までの和 < 1 + (1 − 1/2) + (1/2 − 1/3) + … + (1/(n − 1) − 1/n) = 2 − 1/n < 2
  - - (2) オイラーの筋。sin x / x は x = ±π、±2π、… で 0 になるので、(1 − x²/π²)(1 − x²/4π²)(1 − x²/9π²) … と書けると考える
    - 一方で sin x / x = 1 − x²/6 + …。x² の係数をくらべて 1/π² + 1/4π² + 1/9π² + … = 1/6
  stage: 4
  note: バーゼルの数学者ベルヌーイ兄弟も解けなかったので「バーゼル問題」と呼ばれる。オイラーの (2) の筋は当時は理由づけが足りなかったが、答えは正しく、のちにきちんと証明された。3 乗の逆数の和 1 + 1/8 + 1/27 + … は、無理数であることだけが 1978 年にアペリーによって示され、どんな数で書けるかは、いまも分かっていない。
- id: CL-EULER-HEIRS
  source: オイラー『代数学完全入門』（E387、1770）第 1 部 第 4 篇 第 3 章 問 21（§604）
  units:
  - A-011
  - A-014
  missing: []
  url:
  - https://scholarlycommons.pacific.edu/euler-works/387/
  - https://archive.org/details/elementsofalgebr00euleuoft
  pd: オイラーは 1783 年没で、著作権はない。Hewlett の英訳（1822 年の第 3 版）も保護期間が切れている。英訳の単位はポンドで、ここでは「金貨」にした。問題文は書き直した。
  text: 'あるお父さんが亡くなり、子どもたちに財産を次のように分けるよう言い残しました。

    1 番目の子は金貨 100 枚と、残りの 10 分の 1。

    2 番目の子は、その残りから金貨 200 枚と、さらにその残りの 10 分の 1。

    3 番目の子は 300 枚と残りの 10 分の 1。… と続けて、最後の子まで分けました。

    すると、全員が同じ枚数をもらいました。子どもは何人で、財産は全部で何枚でしょう。

    '
  answer: 子ども 9 人、1 人 900 枚、財産 8100 枚
  paths:
  - - 財産を T とすると、1 番目の分は 100 + (T − 100)/10 = (T + 900)/10
    - 2 番目の分は 200 + (T − (T + 900)/10 − 200)/10。これが 1 番目の分と等しいとして解くと T = 8100
    - 1 人 900 枚、8100 ÷ 900 = 9 人
  - - 後ろから考える（L-010）。最後の子のあとには何も残らないので、最後の子は決まった枚数だけをもらい、残りの 10 分の 1 は 0
    - その 1 つ前の子は、最後の子より 100 枚少ない決まった枚数をもらうので、残りの 10 分の 1 が 100 枚。残りは 1000 枚
    - その 9/10 の 900 枚が最後の子の分。だから 1 人 900 枚で、900 = 100 × 9 なので 9 人
  stage: 4
  note: オイラーは目が見えなくなってから、この本を口で語って書き取らせた。だから説明が ていねいで、何か国語にも訳され、広く読まれた。
- id: CL-BUFFON-NEEDLE
  source: ビュフォン『道徳算術試論』（1777）
  units:
  - C-020
  - G-025
  - G-010
  missing:
  - 幾何確率（連続な一様分布）
  - 積分（曲線の下の面積）
  url:
  - https://archive.org/details/india.history.resource.107106
  - http://www.numdam.org/item/JMPA_1860_2_5__273_0/
  pd: ビュフォンは 1788 年没で、著作権はない。『博物誌』補遺 第 4 巻（1777、archive.org の画像）による。バルビエの別証明（1860、バルビエは 1889 年没）も保護期間が切れている。問題文は書き直した。
  text: '床に、間かくが L の平行な線が たくさん引いてあります。長さ L の針を、でたらめに床に落とします。

    針が線のどれかと交わる確率はいくつでしょう。

    '
  answer: 2/π（約 0.637）
  paths:
  - - 針の真ん中から いちばん近い線までの距離を y（0〜L/2）、針と線の角度を θ（0〜π/2）とする。どちらも一様に でたらめ
    - 交わるのは y ≤ (L/2) sin θ のとき
    - 長方形 0 ≤ y ≤ L/2、0 ≤ θ ≤ π/2 のうち、曲線 y = (L/2) sin θ の下の面積は L/2。長方形の面積 πL/4 との比は 2/π
  - - バルビエの筋。針を曲げてもよい「ひも」にすると、交わる回数の期待値は長さに比例する（期待値の線形性）
    - 直径 L の円の ひも は、どう落ちても必ず 2 回交わる。長さ πL で期待値 2
    - だから長さ L の まっすぐな針の期待値は 2/π。まっすぐな針は 0 回か 1 回しか交わらないので、期待値が そのまま確率
  stage: 7
  note: 針を たくさん落として数えれば、π を「実験で」求められる。乱数で答えを求める「モンテカルロ法」の祖先とも言える。
- id: CL-JINKOKI-NEZUMI
  source: 吉田光由『塵劫記』ねずみ算（寛永 4 年 1627 の初版にはなく、寛永 6 年ごろ以降の版で加わった）
