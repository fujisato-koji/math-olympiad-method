  pd: 約 1200 年前の書で、著作権はない。Rosen の英訳（1831 年刊、Rosen は 1837 年没）は保護期間が切れている。問題文は書き直した。
  text: '「ある正方形と、その 1 辺の 10 倍をたすと 39 になる。正方形の 1 辺はいくつか。」（いまの書き方なら x² + 10x = 39）

    アル＝フワーリズミーと同じように、図を使って解きましょう。

    '
  answer: 3（正方形の面積は 9）
  paths:
  - - 1 辺 x の正方形の 4 辺に、たて x、横 10/4 = 5/2 の長方形を 1 つずつつける。ここまでで面積は 39
    - 4 すみ の あいた所に 1 辺 5/2 の正方形を 4 つ足すと、面積 39 + 25 = 64 の大きな正方形になる
    - 大きな正方形の 1 辺は 8。x = 8 − 5/2 − 5/2 = 3
  - - 平方完成で。x² + 10x + 25 = 64、(x + 5)² = 64、x + 5 = 8（長さなので正）、x = 3
  stage: 4
  note: 書名の「アル＝ジャブル」から algebra（代数）、著者の名前から algorithm（アルゴリズム）という言葉が生まれた。この本は負の答え（−13）を考えていない。約 3700 年前のバビロニアの粘土板にも、正方形と辺をたす同じ形の問題がある。
- id: CL-KHALLIKAN-CHESS
  source: イブン・ハッリカーン『名士列伝』アブー・バクル・アッスーリーの項（13 世紀。イブン・ハッリカーンは 1282 年没）
  units:
  - A-009
  - L-001
  missing: []
  url:
  - https://archive.org/details/india.history.resource.53346
  pd: 約 750 年前の書で、著作権はない。de Slane の英訳 第 3 巻（1868 年刊、de Slane は 1878 年没）は保護期間が切れている（pp.68–72 にシッサの話）。原典は麦つぶの数そのものを書いておらず、問題は話の筋をもとに自分で作った。
  text: 'チェスを発明したシッサという人に、王さまが ほうび を聞きました。シッサは言いました。「チェス盤の 1 つ目の ます に麦を 1 つぶ、2 つ目に 2 つぶ、3 つ目に 4 つぶ と、前の ます の 2 倍ずつ置いて、64 の ます 全部の麦をください。」

    (1) 10 番目の ます には何つぶでしょう。1 番目から 10 番目までで、合わせて何つぶでしょう。

    (2) 64 の ます 全部で何つぶでしょう。

    '
  answer: '(1) 10 番目は 512 つぶ、合わせて 1023 つぶ。

    (2) 2⁶⁴ − 1 = 18446744073709551615 つぶ（約 1845 京つぶ）。

    '
  paths:
  - - ます の数は 1、2、4、8、… と 2 倍ずつ。n 番目は 2 を n − 1 回かけた数
    - 合わせた数を並べると 1、3、7、15、31、… で、いつも「次の ます の数 − 1」
    - 64 番目までの合計は、65 番目にあたる 2⁶⁴ から 1 を引いた数
  - - 和を S とすると、2S = 2 + 4 + … + 2⁶⁴。2S − S = 2⁶⁴ − 1（段 5、A-022 の等比数列の和）
  stage: 3
  note: 麦 1 つぶを 0.04 g とすると、全部で約 7400 億トン。世界で 1 年にとれる小麦（8 億トンほど）の 900 年分をこえる。イブン・ハッリカーンは、この量の大きさを町の数を使ったたとえで言い表している。
- id: CL-ALCUIN-18
  source: アルクイン（と伝えられる）『若者を鍛えるための問題集』第 18 問（800 年ごろ）
  units:
  - L-002
  - C-002
  missing: []
  url:
