  text: '次の 3 つが全部正しいとします。

    ・赤ちゃんは、筋道を立てて考えられない。

    ・ワニを手なずけられる人は、ばかにされない。

    ・筋道を立てて考えられない人は、ばかにされる。

    ここから、赤ちゃん と ワニ について何が言えるでしょう。

    '
  answer: 赤ちゃんは、ワニを手なずけられない。
  paths:
  - - つなげる。赤ちゃん → 筋道を立てて考えられない → ばかにされる
    - 「ワニを手なずけられる → ばかにされない」の対偶は「ばかにされる → ワニを手なずけられない」
    - つなげて、赤ちゃん → ワニを手なずけられない
  - - ベン図。「ばかにされる人」の円と「ワニを手なずけられる人」の円は重ならない。赤ちゃんの円は「筋道を立てて考えられない人」の円の中にあり、それは「ばかにされる人」の円の中にある
  stage: 4
  note: キャロルは、ちょっと おかしな前提を いくつもつなぐ問題（連鎖式）を たくさん作り、子どもに論理を教えようとした。前提が おかしくても、つなぎ方が正しければ、結論は正しく出てくる。
