  text: 'イヌ が ウサギ を追いかけます。はじめ、ウサギ は イヌ の 150 フィート前にいます。1 回とぶごとに、イヌ は 9 フィート、ウサギ は 7 フィート進みます（同じ回数ずつとぶ）。イヌ は何回とんだら ウサギ に追いつくでしょう。

    '
  answer: 75 回（そのとき イヌ は 675 フィート、ウサギ は 525 フィート進んでいる）
  paths:
  - - 1 回とぶごとに、間は 9 − 7 = 2 フィート ちぢむ
    - 150 フィート ちぢむのは 150 ÷ 2 = 75 回
  - - 原典のやり方。150 の半分の 75 回とすると、イヌ は 75 × 9 = 675、ウサギ は 75 × 7 = 525 進み、差が ちょうど 150
  stage: 3
  note: いまの「旅人算」。アキレスと亀（CL-ZENO-1）とならべると、ゼノンの言う ふしぎ が どこにあるのかが見えやすい。
- id: CL-FIBONACCI-RABBITS
  source: フィボナッチ（ピサのレオナルド）『算盤の書』（1202、改訂 1228）
  units:
