  text: '長さ 30 フィート、はば 12 フィート、高さ 12 フィートの直方体の部屋があります。片方の はし の壁の まん中、天井から 1 フィート下に クモ がいます。反対側の はし の壁の まん中、床から 1 フィート上に ハエ がいます。ハエ は動きません。

    クモ が壁や天井や床を はって（空中は通れない）ハエ のところへ行く、いちばん短い道のりは何フィートでしょう。

    '
  answer: 40 フィート（すぐ思いつく 天井 → はし の壁 の道は 1 + 30 + 11 = 42 フィート）
  paths:
  - - 部屋を切り開いて展開図にすると、はう道は まっすぐな線になる
    - 開き方によって長さがちがう。天井の まん中 を まっすぐ 通ると 42
    - はし の壁、天井、横の壁、床、はし の壁と 5 つの面を通る開き方では、横 32、たて 24 の直角三角形の斜辺になり、√(32² + 24²) = 40
  stage: 4
  note: 答えの道は、6 つの面のうち 5 つを通る。いちばん短い道が、いちばん遠回りに見えるのが、このパズルの おもしろさ。
- id: CL-DUDENEY-REVE
  source: デュードニー『カンタベリー・パズル』（1907）第 1 問「荘園差配人のパズル」
  units:
  - C-009
  - L-007
  - A-009
  missing: []
  url:
  - https://www.gutenberg.org/ebooks/27635
  pd: CL-DUDENEY-SPIDER と同じ。
  text: '腰かけ が 4 つあります。1 つ目の腰かけに、大きさのちがう チーズ が 8 こ、下から大きい順に積んであります。1 回に 1 こずつ動かし、小さい チーズ の上に大きい チーズ を のせてはいけません。

    全部を 4 つ目の腰かけへ移すのに、33 回でできることを示しましょう。（棒が 3 本のハノイの塔なら 255 回かかります）

    '
  answer: 上の 4 こを、4 つの腰かけを使って 2 つ目へ移す（9 回）→ 下の 4 こを、残り 3 つの腰かけで 4 つ目へ移す（15 回）→ 上の 4 こを、4 つの腰かけを使って 4 つ目へ移す（9 回）。9 + 15 + 9 = 33 回。
  paths:
  - - まず小さい数で調べる。4 つの腰かけで、1 こは 1 回、2 こは 3 回、3 こは 5 回、4 こは 9 回でできる
    - 3 つの腰かけ（ハノイの塔）では k こで 2ᵏ − 1 回
    - 8 こを「上の k こ」と「下の 8 − k こ」に分け、2 ×（上の k こを 4 つで）+（下を 3 つで）を k = 1〜7 でくらべると、k = 4 か 5 のとき 33 で いちばん少ない
  stage: 3
  note: このやり方（フレーム＝スチュワートの方法）が 4 本のとき本当に最少であることは、2014 年に ようやく証明された。5 本以上では、いまも分かっていない。子どもでも試せるのに、研究の最前線につながる問題。
- id: CL-DUDENEY-SENDMORE
  source: デュードニー「SEND + MORE = MONEY」（Strand Magazine 第 68 巻、1924 年 7 月）
  units:
  - N-012
  - L-007
  - N-007
  missing: []
  url:
  - https://en.wikipedia.org/wiki/Verbal_arithmetic
  pd: デュードニーは 1930 年没。日本では 1980 年に満了、米国でも 1924 年の刊行物は 2020 年に保護が切れた。巻と頁は英語版 Wikipedia の項による（原誌は確かめていない）。問題文は書き直した。
  text: '  S E N D

    + M O R E

    ---------

    M O N E Y

    同じ文字には同じ数字、ちがう文字には ちがう数字（0〜9）が入ります。いちばん上の けた の S と M は 0 ではありません。それぞれの文字に入る数字を求めましょう。

    '
  answer: 9567 + 1085 = 10652（S = 9、E = 5、N = 6、D = 7、M = 1、O = 0、R = 8、Y = 2。答えは これ 1 つ）
  paths:
  - - 4 けた + 4 けた は 19998 以下なので、5 けた目の M は 1
    - S + 1（+ くり上がり）が 10 以上で、O は 0 か 1。M = 1 なので O = 0。S は 9（8 では合わない）
    - 百の位。E + 0（+ くり上がり）が N で、E と N はちがうので、くり上がりがあって N = E + 1
    - 十の位。N + R（+ くり上がり）= E + 10。N = E + 1 を入れると R = 9 か 8。S = 9 なので R = 8 で、一の位から くり上がりがある
    - 一の位。D + E = Y + 10。残りの数字 2〜7 で、N = E + 1 と D + E ≥ 12 を満たすのは E = 5、N = 6、D = 7、Y = 2
  stage: 3
  note: 「もっと お金を送って」という手紙の しゃれ。デュードニーは これを新しい種類のパズルとして紹介し、この形（覆面算）は世界中に広まった。
- id: CL-LOYD-1415
  source: サム・ロイド『パズル百科』（1914）の「14-15 パズル」
  units:
  - L-016
  - L-005
  missing:
  - 置換の偶奇（互換の回数の偶奇が、作り方によらず決まること）
  url:
  - https://archive.org/details/CyclopediaOfPuzzlesLoyd
  pd: ロイドは 1911 年没、本は息子（1934 年没とされるが確かめていない）が 1914 年に刊行。日本では両者とも保護期間が切れ、米国でも 1927 年より前の刊行で保護がない。archive.org の画像（解答は pp.234–240 のあたり）による。問題文は書き直した。
  text: '4 × 4 の わく に、1〜15 の札と 1 つの あき があります。あき の となりの札を すべらせて動かします。

    はじめは 1〜13 が順に並び、最後の列だけ 13、15、14、あき と、14 と 15 が入れかわっています。札を動かして、1〜15 が順に並ぶ形（最後の列が 13、14、15、あき）にできるでしょうか。

    '
  answer: できない
  paths:
  - - あき も 16 番目の札と見る。札を 1 回動かすことは、あき と札の入れかえ 1 回
    - 盤を市松もように色分けすると、1 回動かすたびに あき の色が変わる。あき が はじめと同じ場所に もどるには、動かす回数は偶数
    - だから、できる並びは、はじめの並びから「入れかえ 偶数回」で作れるものだけ
    - 14 と 15 だけを入れかえた並びは、入れかえ 1 回（奇数）で作れるので、偶数回では作れない（入れかえの回数の偶奇は、作り方によらず決まる）
  stage: 6
  note: このパズルは 1874 年ごろアメリカのチャップマンが作り、1880 年に世界中で大流行した。ロイドは後に「自分が作り、解けた人に 1000 ドル出すと言った」と書いたが、作り話と考えられている。
- id: CL-LANGLEY-1
  source: ラングレー「思いがけない角」（Mathematical Gazette 第 11 巻、1922 年 10 月、p.173、問題 644）
  units:
  - G-023
  - G-017
  - G-016
  missing: []
  url:
  - https://doi.org/10.1017/mag.2023.113
  pd: ラングレーは 1933 年没。日本では没後 50 年で 1983 年に満了、英国でも没後 70 年で 2003 年に満了、米国でも 1927 年より前の刊行で保護がない。書誌は Bardelang と Murphy（2023）による。問題文は書き直した。
  text: '三角形 ABC で、AB = AC、角 B = 角 C = 80° です。辺 AB の上に点 F を、角 FCB = 50° となるようにとり、辺 AC の上に点 E を、角 EBC = 60° となるようにとります。

    角 BEF は何度でしょう。分度器ではなく、補助線を引いて、理由とともに答えましょう。

    '
  answer: 30°
  paths:
  - - 三角形 FBC は、角 FBC = 80°、角 BFC = 180° − 80° − 50° = 50° なので、BF = BC
    - 辺 AC の上に点 G を、角 GBC = 20° となるようにとる。角 BGC = 80° なので BG = BC
    - BF = BG で、角 FBG = 80° − 20° = 60° なので、三角形 BFG は正三角形。FG = BG
    - 三角形 EBC で角 BEC = 40°。三角形 GBE は角 GBE = 60° − 20° = 40°、角 GEB = 40° なので GE = GB
    - GF = GE で、角 FGE = 角 BGE − 角 BGF = 100° − 60° = 40°。だから角 GEF = 70°
    - 角 BEF = 70° − 40° = 30°
  - - （大人向け、G-024）BC = 1 として正弦定理で BE と BF を出し、三角形 BEF の角を計算して確かめる
  stage: 4
  note: 角度を足し引きするだけでは解けず、うまい補助線が要る。「いちばん難しい、やさしい幾何の問題」と呼ばれることもあり、100 年たったいまも愛されている。
