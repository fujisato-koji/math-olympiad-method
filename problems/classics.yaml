  text: '正月に、ねずみ の父母が子を 12 ひき生み、親と合わせて 14 ひきになりました。2 月には、親も子も、それぞれの つがい が 12 ひきずつ生むので、98 ひきになります。このように、毎月、どの つがい も 12 ひきずつ生むとすると、12 月には全部で何びきになるでしょう。

    '
  answer: 276 億 8257 万 4402 ひき（2 × 7¹²）
  paths:
  - - つがい 1 組（2 ひき）が 12 ひき生むと、2 ひきが 14 ひき、つまり 7 倍になる
    - 正月 14 = 2 × 7、2 月 98 = 2 × 7²、…、12 月は 2 × 7¹²
    - 7¹² = 13841287201。2 倍して 27682574402
  stage: 3
