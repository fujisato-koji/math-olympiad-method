  pd: バシェは 1638 年没で、著作権はない。1612 年の初版（archive.org の画像、p.143）による。原典の単位はリーブル。問題文は書き直した。
  text: 'てんびん で、1 kg、2 kg、3 kg、…、40 kg までの、すべての整数の重さを量りたいと思います。分銅は、てんびん の両側の皿に のせてよいとします。

    いちばん少ない数の分銅で量るには、何 kg の分銅を何こ用意すればよいでしょう。

    '
  answer: 1 kg、3 kg、9 kg、27 kg の 4 こ
  paths:
  - - 1 kg があれば 1 が量れる。次に 3 kg があれば、2 = 3 − 1、3、4 = 3 + 1 が量れる
    - 9 kg を足すと 5 = 9 − 3 − 1 から 13 = 9 + 3 + 1 まで、27 kg を足すと 14 から 40 まで量れる
    - 分銅は 3 倍ずつで、量れる上限は 1、4、13、40 と のびる
  - - 4 この分銅は、それぞれ「品物と反対の皿」「使わない」「品物と同じ皿」の 3 通り
    - 3⁴ = 81 通りのうち、全部使わないを除き、左右を入れかえたものを同じと見ると (81 − 1) ÷ 2 = 40 通り
    - だから 4 こでは 40 通りより多くは量れない。1〜40 を ちょうど量れる
  stage: 3
  note: 重さを 3 進法で書き、各けたを −1、0、1 にしたもの（平衡 3 進法）と同じ考え。片方の皿にしか のせられないなら、1、2、4、8、16、32 の 6 こ（2 進法）がいる。
- id: CL-PASCAL-POINTS
