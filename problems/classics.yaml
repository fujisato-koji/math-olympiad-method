  pd: CL-ALCUIN-18 と同じ。「全部で何通り」の挑戦は自分で足した。
  text: 'お父さんが亡くなり、3 人のむすこに 30 本のびんを残しました。10 本は油でいっぱい、10 本は半分だけ、10 本は からっぽ です。

    油も びん も、3 人が同じだけ もらえるように分けましょう。（びんの油を ほかのびんに移してはいけません）

    挑戦：分け方は全部で何通りあるでしょう。

    '
  answer: '1 人 10 本で、油は「いっぱい のびん 5 本分」ずつ。原典の答えは、1 人目が半分のびん 10 本、2 人目と 3 人目が いっぱい 5 本と から 5 本ずつ。

    挑戦の答えは 5 通り。（いっぱい、半分、から）の本数で

    ・（0、10、0）（5、0、5）（5、0、5）

    ・（1、8、1）（4、2、4）（5、0、5）

    ・（2、6、2）（3、4、3）（5、0、5）

    ・（2、6、2）（4、2、4）（4、2、4）

    ・（3、4、3）（3、4、3）（4、2、4）

    '
  paths:
  - - 半分のびんの油を 1 とすると、いっぱい は 2、から は 0。油は全部で 20 + 10 = 30 なので、1 人 10
    - 1 人が 10 本で油 10 になるのは、いっぱい と から が同じ本数のとき。（0、10、0）（1、8、1）（2、6、2）（3、4、3）（4、2、4）（5、0、5）
    - この 6 つから、いっぱい・半分・から が それぞれ合わせて 10 本になる 3 つを選ぶ
  stage: 2
  note: 原典の答えは 1 つだけ。「全部で何通り」と問い直すと、場合分け（段 3、L-007）の練習になる。
- id: CL-ALCUIN-26
  source: アルクイン（と伝えられる）『若者を鍛えるための問題集』第 26 問（800 年ごろ）
