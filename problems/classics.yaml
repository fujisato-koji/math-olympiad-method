  text: 'はた織りの上手な女の人が、毎日、前の日の 2 倍の長さを織ります。5 日間で合わせて 5 尺織りました。1 日目から 5 日目まで、それぞれ何尺織ったでしょう。

    '
  answer: 1 日目 5/31 尺、2 日目 10/31 尺、3 日目 20/31 尺、4 日目 40/31 尺、5 日目 80/31 尺
  paths:
  - - 1 日目を 1 とすると、5 日で 1 + 2 + 4 + 8 + 16 = 31
    - 31 が 5 尺にあたるので、1 は 5/31 尺
    - 2 日目からは 2 倍ずつ
  stage: 3
  note: 原典の答えは寸（1 尺 = 10 寸）で「1 日目 1 寸と 31 分の 19 寸」のように書く。1 + 2 + 4 + 8 + 16 = 32 − 1 となる きまりは、チェス盤の麦（CL-KHALLIKAN-CHESS）やハノイの塔（CL-LUCAS-HANOI）にも出てくる。
- id: CL-SUNZI-1
  source: 『孫子算経』巻下 雉兎同籠（3〜5 世紀ごろ、著者不詳）
  units:
  - A-014
  - A-011
  missing: []
  url:
  - https://zh.wikisource.org/wiki/孫子算經
  pd: 1500 年以上前の書で、著作権はない。原文は中国語版ウィキソースで読んだ。問題文は原文から自分で訳し直した。
  text: 'キジ と ウサギ が同じかごに入っています。上から数えると頭が 35、下から数えると足が 94 あります。キジ と ウサギ は、それぞれ何羽（何びき）でしょう。

    '
  answer: キジ 23 羽、ウサギ 12 ひき
  paths:
  - - キジ を x 羽とすると、ウサギ は 35 − x ひき
    - 足は 2x + 4(35 − x) = 94。140 − 2x = 94 から x = 23
  - - 全部 キジ だとすると足は 70 本で、24 本足りない
    - キジ 1 羽を ウサギ にかえると足は 2 本ふえるので、ウサギ は 24 ÷ 2 = 12 ひき（段 3 でもできる）
  - - 原典の術。足を半分にして 47（キジ は 1 本、ウサギ は 2 本になる）
    - 47 から頭の 35 を引いた 12 が ウサギ
  stage: 4
  note: 日本では江戸時代の後期に、めでたい「ツル と カメ」に置きかえられて「つるかめ算」になった。原典の「足を半分にする」術は、ウサギ に後ろ足で立ってもらう話として説明されることもある。
- id: CL-SUNZI-2
  source: 『孫子算経』巻下 物不知数（3〜5 世紀ごろ、著者不詳）
  units:
  - N-022
  - N-018
  missing: []
  url:
  - https://zh.wikisource.org/wiki/孫子算經
  pd: CL-SUNZI-1 と同じ。
  text: '数の分からない品物があります。3 つずつ数えると 2 あまり、5 つずつ数えると 3 あまり、7 つずつ数えると 2 あまります。品物はいくつでしょう（いちばん少ない数で答えましょう）。

    '
  answer: 23（ほかに 23 + 105 = 128、233、… も条件に合う）
  paths:
  - - 7 でわって 2 あまる数を並べる。2、9、16、23、30、…
    - その中で 5 でわって 3 あまるのは 23（次は 58）。23 は 3 でわって 2 あまるので合う
    - 3、5、7 の最小公倍数は 105 なので、答えは 105 ごとにくり返す
  - - 原典の術。3 のあまり 1 につき 70、5 のあまり 1 につき 21、7 のあまり 1 につき 15 を使う
    - 70 × 2 + 21 × 3 + 15 × 2 = 233。105 を引けるだけ引いて 23
    - 70 は 5 と 7 でわり切れて 3 でわると 1 あまる数。21 と 15 も同じしくみ（段 6、N-036）
  stage: 3
  note: 「中国の剰余定理」という名前は、この問題から来ている。日本では江戸時代に、3、5、7 でわったあまりを聞いて相手の数を当てる「百五減算」という遊びになった。
- id: CL-SUNZI-3
  source: 『孫子算経』巻下 婦人河上蕩杯（3〜5 世紀ごろ、著者不詳）
  units:
  - N-018
  - A-006
  missing: []
  url:
  - https://zh.wikisource.org/wiki/孫子算經
  pd: CL-SUNZI-1 と同じ。
  text: '川で、おばさんが たくさんの おわん を洗っています。役人が「どうして そんなに おわん が多いのか」とたずねると、おばさんは答えました。「家に お客さん が来ているのです。ごはん は 2 人で 1 つ、スープ は 3 人で 1 つ、肉 は 4 人で 1 つの おわん を使います。全部で 65 こ使いました。」

    お客さん は何人でしょう。

    '
  answer: 60 人
  paths:
  - - 2、3、4 の最小公倍数の 12 人いると、おわん は 6 + 4 + 3 = 13 こ
    - 65 こは 13 この 5 倍なので、お客さん は 12 × 5 = 60 人
  - - お客さん を x 人とすると x/2 + x/3 + x/4 = 65。13x/12 = 65 から x = 60（段 4、A-011）
  stage: 3
  note: 1500 年前の暮らしが見える問題。原典の字は「桮」（さかずき、わん）。
- id: CL-ZHANG-1
  source: 張丘建『張丘建算経』巻下 第 38 問「百鶏」（5 世紀ごろ）
  units:
  - A-012
  - N-029
  - L-007
  missing: []
  url:
  - https://zh.wikipedia.org/zh-tw/百雞問題
  - https://ctext.org/zhang-qiujian-suan-jing
  pd: 約 1500 年前の書で、著作権はない。問題と 3 組の答えは中国語版ウィキペディア「百雞問題」による（原典の頁は確かめていない）。問題文は書き直した。
  text: 'おんどり 1 羽は 5 銭、めんどり 1 羽は 3 銭、ひよこ は 3 羽で 1 銭です。100 銭で ちょうど 100 羽の にわとり を買います。おんどり、めんどり、ひよこ は、それぞれ何羽でしょう。どの種類も少なくとも 1 羽は買うとします。

    '
  answer: 3 通り。（おんどり、めんどり、ひよこ）=（4、18、78）、（8、11、81）、（12、4、84）
  paths:
  - - おんどり x、めんどり y、ひよこ z 羽とすると、x + y + z = 100、5x + 3y + z/3 = 100
    - 2 つ目を 3 倍して 15x + 9y + z = 300。1 つ目を引いて 14x + 8y = 200、つまり 7x + 4y = 100
    - y = (100 − 7x)/4 が整数になるのは x が 4 の倍数のとき。x = 4、8、12 で y = 18、11、4（x = 16 では y が負）
    - z = 100 − x − y
  - - 入れかえで考える。「おんどり を 4 羽ふやし、めんどり を 7 羽へらし、ひよこ を 3 羽ふやす」と、羽数も代金も変わらない
    - 1 つの答え（4、18、78）から、この入れかえで残りの答えが出る
  stage: 4
  note: 原典も 3 組の答えを全部あげている。（0、25、75）も式には合うが、おんどり を買わないので外した。同じ形の問題はインドやイスラム圏、フィボナッチ『算盤の書』（30 銭で 30 羽の鳥）にもあり、世界を旅した問題と言われる。
- id: CL-SUANFA-1
  source: 程大位『算法統宗』（1592）に載ると伝えられる詩の問題「百僧分饅頭」
  units:
  - A-014
  - A-011
  missing: []
  url:
  - https://en.wikipedia.org/wiki/Suanfa_tongzong
  pd: 明代の書で、程大位は 1606 年没。著作権はない。ただし『算法統宗』の巻と丁は確かめておらず、詩は広く伝わる形（一百饅頭一百僧…）による。問題文は自分の言葉で書き直した。
  text: 'まんじゅう が 100 こ、お坊さん が 100 人います。大きい お坊さん は 1 人 3 こずつ、小さい お坊さん は 3 人で 1 こを分けます。ちょうど分けきれました。

    大きい お坊さん と小さい お坊さん は、それぞれ何人でしょう。

    '
  answer: 大きい お坊さん 25 人、小さい お坊さん 75 人
  paths:
  - - 大きい お坊さん を x 人とすると、小さい お坊さん は 100 − x 人
    - 3x + (100 − x)/3 = 100。3 倍して 9x + 100 − x = 300、x = 25
  - - 大きい お坊さん 1 人と小さい お坊さん 3 人を 1 組にすると、4 人で 3 + 1 = 4 こ食べる
    - 人も まんじゅう も 4 ずつなので、100 ÷ 4 = 25 組。大きい お坊さん は 25 人、小さい お坊さん は 75 人（段 3 でもできる）
  stage: 4
  note: 原文は 7 文字ずつの詩。そろばん の本『算法統宗』は江戸時代の日本にも伝わり、吉田光由の『塵劫記』のお手本の 1 つになった。
- id: CL-YANGHUI-1
  source: 楊輝『続古摘奇算法』（1275）の「洛書」の方陣
  units:
  - N-012
  - C-002
  missing: []
  url:
  - https://zh.wikipedia.org/zh-tw/幻方
  pd: 約 750 年前の書で、著作権はない。作り方の句「九子斜排、上下対易、左右相更、四維挺出」は、中国語版ウィキペディア「幻方」の引用による（原典の頁は確かめていない。京都大学の宜稼堂叢書本は、この部分が欠けているとされる）。問題は内容をもとに書き直した。
  text: '1 から 9 までの数を 3 × 3 の ます に 1 つずつ入れて、たて、横、ななめ の どの 3 つをたしても同じ数になるようにしましょう。

    楊輝の作り方。「9 つの数を ななめ に並べ、上と下を入れかえ、左と右を入れかえ、四すみ を外へ押し出す。」

    '
  answer: 'たとえば

    4 9 2

    3 5 7

    8 1 6

    （どの列も 15。これを回したり裏返したりした 8 通りが、答えの全部）

    '
  paths:
  - - 1 列の和を出す。1 から 9 の和は 45 で、横の列 3 本で 45 なので、1 列は 15
    - 15 になる 3 つの数の組を書き出す（1 と 5 と 9、2 と 6 と 7 など 8 組）
    - 書き出した組を、たて、横、ななめ に当てはめて置いてみる
  - - まん中を先に決める（段 3、L-007）。まん中は 4 本の線（たて、横、ななめ 2 本）に入る。4 本の和 60 は「全部の和 45 + まん中 × 3」なので、まん中は 5
    - 1 を角に置くと、1 を通る 3 本の線を 15 にできないので、1 は辺のまん中
  - - 楊輝の作り方。1〜9 をひし形に並べる（上から 1 / 4 2 / 7 5 3 / 8 6 / 9）
    - 上の 1 と下の 9、左の 7 と右の 3 を入れかえる
    - 角になる 4、2、8、6 を外へ出して正方形にすると、4 9 2 / 3 5 7 / 8 1 6 になる
  stage: 2
  note: 昔の伝説では、洛水という川から出てきた亀の甲らに この模様があったといい、「洛書」と呼ばれる。楊輝は 4 × 4 から 10 × 10 までの方陣も書きのこした。
- id: CL-LILAVATI-BEES
  source: バースカラ 2 世『リーラーヴァティー』（1150 年ごろ）
  units:
  - N-019
  - A-005
  missing: []
  url:
  - https://archive.org/details/algebrawitharith00brahuoft
  pd: 約 870 年前の書で、著作権はない。Colebrooke の英訳（1817 年刊、Colebrooke は 1837 年没）は、日本・米国とも保護期間が切れている。問題文は訳を写さず書き直した。
  text: 'ミツバチの群れがいます。5 分の 1 はカダンバの花へ、3 分の 1 はシリンドラの花へ行きました。その 2 つの数の差の 3 倍のハチは、クタジャの花へ行きました。残りの 1 ぴきは、ジャスミンの花の香りに さそわれて、空を行ったり来たりしています。

    かわいい人よ、ハチは全部で何びきでしょう。

    '
  answer: 15 ひき
  paths:
  - - 全体を 1 とすると、1/5 + 1/3 + 3 × (1/3 − 1/5) = 3/15 + 5/15 + 6/15 = 14/15
    - 残りの 1/15 が 1 ぴきなので、全体は 15 ひき
  - - 5 でも 3 でもわり切れる 15 で試す。3 + 5 + 3 × 2 + 1 = 15 で合う
  stage: 3
  note: 『リーラーヴァティー』は、書名が著者の娘の名とも伝えられる算数の本で、問題の多くが詩で書かれ、読む人に「かわいい人よ」と呼びかける。花の名前は、どれもインドの本物の花。
- id: CL-LILAVATI-PEACOCK
  source: バースカラ 2 世『リーラーヴァティー』（1150 年ごろ）
  units:
