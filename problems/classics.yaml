  pd: ザルトリウスは 1876 年没、1856 年刊で、著作権はない。この本は「算術級数の和」とだけ書き、「1 から 100」とは書いていない（pp.12–13）。1 から 100 は後の言い伝えの形。アルクインの第 42 問（100 段のはしごの鳩）はラテン語版ウィキソースで読んだ。問題文は書き直した。
  text: '1 + 2 + 3 + … + 99 + 100 は いくつ でしょう。1 つずつ たさずに、くふうして求めましょう。

    '
  answer: '5050'
  paths:
  - - ガウスの言い伝えのやり方。1 + 100、2 + 99、3 + 98、… と両はしから組にすると、どの組も 101
    - 組は 50 組なので 101 × 50 = 5050
  - - アルクインのやり方。1 + 99、2 + 98、…、49 + 51 で 100 が 49 組。残った 50 と 100 を たす
    - 4900 + 50 + 100 = 5050
  - - 同じ式を逆に並べて上下に たすと、101 が 100 こ。それを半分にして 5050
  stage: 3
  note: 小学生のガウスが、先生の出した長い たし算 を一瞬で解いたという話は有名だが、もとの記録には「1 から 100」とは書かれていない。その 1000 年前のアルクインは、100 段のはしごに 1 羽、2 羽、… と鳩がとまる問題を、別の組の作り方で解いていた。
- id: CL-KIRKMAN-1
  source: カークマン「女学生の問題」（Lady's and Gentleman's Diary 1850、Query VI）
  units:
  - C-018
  - C-007
  - L-018
  missing:
  - 有限幾何やシュタイナー三重系による構成
  url:
  - https://en.wikipedia.org/wiki/Kirkman%27s_schoolgirl_problem
  pd: カークマンは 1895 年没で、著作権はない。出題の年と番号は英語版 Wikipedia の項による（原誌は確かめていない）。答えの並べ方は、自分で計算機の探索で作り、どの 2 人も 1 回しか組まないことを確かめた。
  text: '15 人の女学生が、毎日 3 人ずつ 5 列に並んで散歩します。7 日間、どの 2 人も、同じ列で 2 回いっしょにならないようにするには、どう並べればよいでしょう。

    (1) 7 日が ちょうどの日数である わけを、2 人の組の数から説明しましょう。

    (2) 並べ方を 1 つ見つけましょう。

    '
  answer: '(1) 1 人は残りの 14 人と 1 回ずつ組になり、1 日に 2 人と組むので 14 ÷ 2 = 7 日。2 人の組は全部で 15 × 14 ÷ 2 = 105 組、1 日に 5 列 × 3 組 = 15 組なので 105 ÷ 15 = 7 日。

    (2) たとえば（15 人を A〜O とする）

    1 日目 ABC DEF GHI JKL MNO

    2 日目 ADG BEH CJM FKN ILO

    3 日目 AEJ BFL CHO DIN GKM

    4 日目 AFO BDM CGL EIK HJN

    5 日目 AHK BGN CFI DJO ELM

    6 日目 AIM BKO CEN DHL FGJ

    7 日目 ALN BIJ CDK EGO FHM

    '
  paths:
  - - (1) 2 通りに数える。「1 人が組む相手の数」と「全部の組の数」から、どちらも 7 日が出る
  - - (2) 1 日目を ABC DEF GHI JKL MNO と決める。2 日目からは A の列から順に、まだ組んでいない人を選んで うめていく
    - 行きづまったら 1 つもどって選び直す。組んだ 2 人に印をつける 15 × 15 の表を使う
  - - （大人向け）15 人を、0 と 1 の 4 けたの列（0000 以外）と見る。けたごとに 2 でわったあまりで たして 0000 になる 3 つを 1 列とし、その列を 7 日に分ける作り方（有限幾何）もある
  stage: 6
  note: 本質的にちがう答えは 7 通りあることが知られている。ここから「組合せデザイン」という分野が育ち、いまは実験の計画や、データの誤りを直す符号に使われている。
- id: CL-LUCAS-HANOI
  source: リュカ「ハノイの塔」（1883 年に N. クラウス・ド・シアムの名で売り出したパズル。『数学の楽しみ』第 3 巻 1893 に解説）
  units:
