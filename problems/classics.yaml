  text: '箱が 3 つあります。1 つには金貨 2 枚、1 つには銀貨 2 枚、1 つには金貨 1 枚と銀貨 1 枚が入っています。どの箱かを見ずに 1 つ選び、中から見ずに 1 枚取り出すと、金貨でした。

