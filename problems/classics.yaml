  text: '平面に、有限個の点があります。全部が 1 本の直線の上に のってはいません。

    このとき「ちょうど 2 つの点だけを通る直線」が必ずあることを示しましょう。（言いかえると、どの 2 点を通る直線にも 3 つ目の点がのっている、ということは ありえない）

    '
  answer: 必ずある（シルベスター＝ガライの定理）
  paths:
  - - 2 点を通る直線と、その直線に のっていない点の組を全部考え、点と直線の距離が いちばん小さい組（P、ℓ）を選ぶ。組は有限個なので選べる
    - ℓ に ちょうど 2 点しかないことを示す。もし 3 点以上あれば、P から ℓ に下ろした垂線の足の片側（足の上も含む）に 2 点 Q、R がある（Q が足に近い側）
    - R と P を結ぶ直線と Q の距離は、P と ℓ の距離より小さくなる（相似な直角三角形をくらべる）。いちばん小さく選んだことに反する
  stage: 6
  note: シルベスターは 1893 年に問いを出したが、きちんとした証明は 1944 年のガライまで待った。上の短い証明は「極端なものに目をつける」方法の名作として知られる。
