  text: '高さ 30 歩と 40 歩の 2 つの塔が、50 歩はなれて立っています。2 つの塔の間の地面に泉があります。2 羽の鳥が、それぞれの塔の てっぺん から同時に、同じ速さで泉へ まっすぐ 飛び、同時に着きました。

    泉は、それぞれの塔から何歩の所にあるでしょう。

    '
  answer: 低い塔（30 歩）から 32 歩、高い塔（40 歩）から 18 歩
  paths:
  - - 低い塔から泉までを x 歩とすると、高い塔からは 50 − x 歩
    - 2 羽の飛ぶ長さが同じなので、30² + x² = 40² + (50 − x)²
    - 900 + x² = 1600 + 2500 − 100x + x² から 100x = 3200、x = 32
  - - （G-022）泉は 2 つの てっぺん から同じ距離の点なので、てっぺん どうしを結ぶ線分の垂直二等分線と地面の交わる点として作図できる
  stage: 4
  note: 鳥が飛ぶ長さは、どちらも √1924 ≒ 43.9 歩。斜辺が同じで、形のちがう 2 つの直角三角形ができている。
- id: CL-BACHET-WEIGHTS
  source: バシェ『数の楽しく愉快な問題』（Problèmes plaisans et délectables、リヨン 1612）その他の問題 第 5 問
  units:
  - A-001
  - N-025
  - C-005
  - N-010
  missing: []
  url:
