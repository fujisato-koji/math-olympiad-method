# 外の物差し：地理学の中の抜けを測る（D-117）。米国地理学会（AAG）の Specialty Groups を、一覧の並びの通し番号 01〜81 で項目にした。一覧のページ（aag.org/groups/）は JavaScript で読み込むので、ページが使う問い合わせ（get_groups、types=specialty_group）の応答から名前を取った。aag.org/community/ は専門部会を 69 と書くが、応答には 81 の名前があり、会員の集まり（学生、退職者など）が混じっているらしい。混じったものは none にした。部会の説明文は写さず、名前だけを使う。
# 地域で分けた集まり（Africa、Asian Geography など）は分類の便宜の見出しなので none にし、中身は各分野の単元で扱う。
# 書き方と確かめ方は docs/yardsticks.md。地図（roadmap.yaml）は変えず、足りない単元は gap に案を書くだけ（D-117）。
