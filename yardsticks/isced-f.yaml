# UNESCO ISCED-F 2013（教育分野分類）の網羅表（D-117）
# 記号と名前は UIS/2015/INS/6 の Appendix I（List of possible codes）の原文のとおり。説明文は写していない。
# 採った範囲：大分野 11（00〜10）、細分野 29、詳細分野 80 と、本文に中身のある 0619（人工知能）と 0719（ナノテクノロジー）。
# 採らなかった範囲：細分野・詳細分野の 0（未定義）・9（他に分類されない）・8（学際）の残余区分と 99（分野不明）。符号は raw/isced-f.tsv に残す。
# 取得の経緯：UIS の英語 PDF の直リンクは 404、UNESDOC は curl・WebFetch とも 403、web.archive.org は 429 だった。そのため記号と名前は、同じ文書の写し（Y01 に記載）の Appendix I から取った。公式の PDF そのものとの突き合わせは未了（docs/research/yardstick-broad.md）。
title: UNESCO ISCED Fields of Education and Training 2013（ISCED-F 2013）
version: "2013"
sources:
  Y01: {title: "International Standard Classification of Education: Fields of education and training 2013 (ISCED-F 2013) - Detailed field descriptions（UNESCO UIS、UIS/2015/INS/6、ISBN 978-92-9189-179-5、Appendix I: List of possible codes）。実際に読んだのは同じ文書の写し（omu.edu.tr、rmutr.ac.th、hec.gov.pk の三つ。前二者は本文が完全に一致、hec は空白の差のみ。表紙裏の ISBN・DOI・CC 表記が一致）", url: "https://doi.org/10.15220/978-92-9189-179-5-en", date: 2026-11-12, license: "CC BY-SA 3.0 IGO（文書の表紙裏に記載。UNESCO オープンアクセスの利用条件 http://www.unesco.org/open-access/terms-use-ccbysa-en に従う）。この URL は文書の DOI で、公式の PDF は読めなかった。写しの個別の URL は取得の記録に残っていない"}
