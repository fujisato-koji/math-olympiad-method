# 外の物差し：社会学の中の抜けを測る（D-117）。米国社会学会（ASA）の部会（Sections）55 を項目にした。公式のページは自動の取得を断る（403）ので Internet Archive の写しから取った。ページの更新日は 2022-10-19。ページの本文は 53 部会と 2 つの設立中の部会と書くが、一覧には 55 の名前（設立中の Creative Sociology を含む）がある。id は一覧の並びの通し番号。部会の説明文は写さず、名前だけを使う。
# 書き方と確かめ方は docs/yardsticks.md。地図（roadmap.yaml）は変えず、足りない単元は gap に案を書くだけ（D-117）。社会科学は実証の部分だけを入れ、解釈と規範の判断は入れない（D-115、D-118）。
