  - id: "1203"
    parent: "area:Arts and Humanities"
    name: "Language and Linguistics"
    ja: "言語と言語学"
    none: "人文の記述と理論（統語・意味・類型・社会言語）は範囲の外。測れる部分は音声（Q-026）、心理言語（Q-008）、計算言語（K-216、K-217）、形式言語（L-028）。"
    sources: [Y01]
  - id: "1204"
    parent: "area:Arts and Humanities"
    name: "Archeology (arts and humanities)"
    ja: "考古学（人文）"
    none: "人文（考古学）の解釈と編年の議論は範囲の外。測れる部分は年代測定（W-010）、古代 DNA（B-188）、人類の進化（B-187）、空間データの解析（W-114）。"
    sources: [Y01]
