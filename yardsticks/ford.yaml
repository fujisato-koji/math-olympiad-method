  - id: "6.2"
    parent: "6"
    name: Languages and literature
    ja: 言語・文学
    none: "人文（言語・語学、文学）（D-115）。測れる部分：言語の理解と獲得は Q-008・Q-010、音声の物理は P-022・E-149、計算言語学は K-216・K-217、言語モデルは K-161、形式言語は L-027・L-028"
