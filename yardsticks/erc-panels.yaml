# 外の物差し：ERC（欧州研究会議）の助成審査のパネルと細目で、研究の分野の抜けを測る（ERC・OpenAlex の回）。3 つの領域（PE・LS・SH）と 28 のパネルを group にし、403 の細目を項目にした。2024 年の公募の構造（最新のパネルは 28 で同じ）。細目の説明文は写していない。
# 書き方と確かめ方は docs/yardsticks.md。地図（roadmap.yaml）は変えず、足りない単元は gap に案を書くだけ（D-117）。判定の根拠は docs/research/yardstick-erc-openalex.md。
