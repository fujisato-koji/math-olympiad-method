  - W-110
- id: T-02
  field: プレート
  topic: プレートテクトニクスはいつ、なぜ、どう始まったか（未解決。表面が約 1 億年ごとに作り直されて証拠が消えるため、始まりの説は約 30 億年前から約 10 億年前まで分かれる）
  sources:
  - OP100
  - OP104
  units:
  - W-012
  - W-028
  - W-036
  - W-031
- id: T-03
  field: 地磁気
  topic: 地球の磁場はどう生まれ、どう変わるか：外核のダイナモと内核の回転（一部解決。内核は 2008〜2023 年に地球に対して来た道を逆に戻ったと報告された（2024）が、原因は確定していない）
  sources:
  - OP100
  - OP103
  units:
  - W-039
  - W-037
  - W-011
- id: T-04
  field: 火山
  topic: 火山の噴火を動かすもの：噴火の時期、規模、続く長さを予測できるか（一部解決。監視の厚い火山では予報できるが、一般化はできていない）
  sources:
  - OP100
  - OP106
  units:
  - W-030
  - W-016
  - W-029
  - W-112
  - W-113
- id: T-05
  field: 気候
  topic: 気候感度：二酸化炭素が 2 倍になると地球は何度暖まるか（一部解決。IPCC AR6 で可能性が高い範囲は 2.5〜4 °C、最良推定 3 °C と狭まったが、幅は残る）
  sources:
  - OP100
  - OP102
  units:
