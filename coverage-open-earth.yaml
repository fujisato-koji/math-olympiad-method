items:
- id: T-01
  field: 地震
  topic: 地震とは何か、地震は予知できるか：いつ、どこで、どの大きさの地震が起きるかを前もって言えるか（未解決。USGS は大地震を予知した人はいないとし、一定の年数のうちに起きる確率だけを出す）
  sources:
  - OP100
  - OP101
  units:
  - W-025
