- id: T-06
  field: 気候
  topic: 気候の転換点：大西洋の深い循環（AMOC）は止まるか（未解決。IPCC AR6 は 21 世紀に弱まる可能性が非常に高いとし、2100 年までに突然止まらないことの確信度は中程度とした）
  sources:
