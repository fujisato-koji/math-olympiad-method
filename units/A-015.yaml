        choices: [4x − 23, 4x + 7, 4x − 7]
        answer: 4x − 7
        check: "[c for c, f in {'4x − 7': lambda x: 4 * x - 7, '4x − 23': lambda x: 4 * x - 23, '4x + 7': lambda x: 4 * x + 7}.items() if all(f(x) == 3 * (2 * x - 5) - 2 * (x - 4) for x in range(-5, 6))][0]"
        hints:
          - text: かっこの中の 1 つ 1 つに、外の数をかけます。−2 は x にも −4 にもかけます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="86" y="40" width="112" height="40" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="198" y="40" width="112" height="40" fill="#7bc96f" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><text x="142" y="65.2" font-size="15" text-anchor="middle" fill="currentColor">3 × 2x</text><text x="254" y="65.2" font-size="15" text-anchor="middle" fill="currentColor">3 × (−5)</text><text x="142" y="31" font-size="16" text-anchor="middle" fill="currentColor">2x</text><text x="254" y="31" font-size="16" text-anchor="middle" fill="currentColor">−5</text><text x="77" y="65.5" font-size="16" text-anchor="end" fill="currentColor">3</text><text x="77" y="31" font-size="15" text-anchor="end" fill="currentColor" fill-opacity=".6">×</text><rect x="86" y="122" width="112" height="40" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="198" y="122" width="112" height="40" fill="#7bc96f" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><text x="142" y="147.2" font-size="15" text-anchor="middle" fill="currentColor">(−2) × x</text><text x="254" y="147.2" font-size="15" text-anchor="middle" fill="currentColor">(−2) × (−4)</text><text x="142" y="113" font-size="16" text-anchor="middle" fill="currentColor">x</text><text x="254" y="113" font-size="16" text-anchor="middle" fill="currentColor">−4</text><text x="77" y="147.5" font-size="16" text-anchor="end" fill="currentColor">−2</text><text x="77" y="113" font-size="15" text-anchor="end" fill="currentColor" fill-opacity=".6">×</text><rect x="89" y="125" width="106" height="34" rx="4" fill="none" stroke="#f08080" stroke-width="3.5"/><rect x="201" y="125" width="106" height="34" rx="4" fill="none" stroke="#f08080" stroke-width="3.5"/></svg>'
          - (−2) × (−4) のふ号に気をつけましょう。
          - x の項どうし、数の項どうしをまとめましょう。
        paths:
          - [6x − 15 − 2x + 8, 4x − 7]
        note: −2 × (−4) を −8 として 4x − 23 としやすい（N-027）。
      - part: 思い出す
