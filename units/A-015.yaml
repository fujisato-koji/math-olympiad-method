        text: (a + b)² = a² + 2ab + b² が、どんな数 a、b についても成り立つことを、分配法則を使って、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="102.8" y="29" width="90" height="90" fill="#f3c969" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="192.8" y="29" width="50" height="90" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="102.8" y="119" width="90" height="50" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="192.8" y="119" width="50" height="50" fill="#7bc96f" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><text x="147.8" y="79.2" font-size="15" text-anchor="middle" fill="currentColor">a²</text><text x="217.8" y="79.2" font-size="15" text-anchor="middle" fill="currentColor">ab</text><text x="147.8" y="149.2" font-size="15" text-anchor="middle" fill="currentColor">ab</text><text x="217.8" y="149.2" font-size="15" text-anchor="middle" fill="currentColor">b²</text><text x="147.8" y="20" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="217.8" y="20" font-size="16" text-anchor="middle" fill="currentColor">b</text><text x="93.8" y="79.5" font-size="16" text-anchor="end" fill="currentColor">a</text><text x="93.8" y="149.5" font-size="16" text-anchor="end" fill="currentColor">b</text><text x="93.8" y="20" font-size="15" text-anchor="end" fill="currentColor" fill-opacity=".6">×</text><text x="160" y="193" font-size="15" text-anchor="middle" fill="currentColor">1 辺 a + b の正方形</text></svg>'
        explain: 例：「a、b を数とする。累乗の意味から (a + b)² = (a + b)(a + b) である。a + b をひとまとまりと見て分配法則を使うと、(a + b)(a + b) = a(a + b) + b(a + b)。もう一度分配法則を使うと a² + ab + ba + b²。かけ算の交かん法則で ba = ab なので、同類項をまとめて ab + ab = 2ab。よって (a + b)² = a² + 2ab + b² である。」と書ければよい。①「〜とする」で a、b を決める、② 式を変形する、③ 約束した事実（累乗の意味、分配法則、交かん法則）で結ぶ、の 3 つがそろっているかを見る。a = 2、b = 3 で 25 = 4 + 12 + 9 とたしかめただけで終わっていたら、例だけでは、すべての a、b について成り立つとは言えないことを話す。
        hints:
