        id: "85dff66a6a"
        text: (x + a)(x + b) を面積図で 4 つに分けると、x²、ax、bx、ab です。まとめると (x + a)(x + b) = x² + (a + b)x + ab。このように、いつでも使える式を乗法公式といいます。同じように、(x + a)² = x² + 2ax + a²（ax が 2 つ）、(x − a)² = x² − 2ax + a²、(x + a)(x − a) = x² − a² です。
