        paths:
          - [2n、2n + 2 とし間の奇数は 2n + 1, 2n(2n + 2) + 1 = 4n² + 4n + 1, (2n + 1)² も 4n² + 4n + 1, 同じなので成り立つ]
      - part: わけ
        text: 図のように、横 x + 3、たて x + 2 の長方形を 4 つに分けます。(x + 3)(x + 2) = x² + 5x + 6 となるわけを、図を使って文で書きましょう。
        svg: |
          <svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="50" y="25" width="140" height="105" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <line x1="150" y1="25" x2="150" y2="130" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="50" y1="95" x2="190" y2="95" stroke="currentColor" fill="none" stroke-width="2"/>
            <text x="100" y="18" font-size="14" text-anchor="middle">x</text>
            <text x="170" y="18" font-size="14" text-anchor="middle">3</text>
            <text x="38" y="65" font-size="14" text-anchor="middle">x</text>
            <text x="38" y="117" font-size="14" text-anchor="middle">2</text>
          </svg>
        explain: 例：「長方形全体の面積は (x + 3)(x + 2)。4 つに分けると、x × x の正方形が x²、横 3・たて x の長方形が 3x、横 x・たて 2 の長方形が 2x、3 × 2 の長方形が 6 になる。3x と 2x を合わせると 5x なので、4 つの面積の和は x² + 5x + 6。全体の面積と 4 つの面積の和は等しいので、(x + 3)(x + 2) = x² + 5x + 6。」と書ければよい。「全体の面積と、分けた 4 つの面積の和は等しい」が書けているかを見る（代表の例で書くわけ ②）。x の係数 5 が 3 + 2、数の項 6 が 3 × 2 から来ていることに気づかせ、(x + a)(x + b) の公式とつなげる。
