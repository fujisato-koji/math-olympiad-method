        explain: 多項式を、いくつかの式の積の形に表すことを因数分解といいます（展開の逆）。3x² − 6x は、どの項にも 3x がふくまれるので、この共通な因数 3x をかっこの外にくくり出して 3x(x − 2) です。x² + 7x + 12 は、乗法公式 x² + (a + b)x + ab を逆に使います。積が 12、和が 7 になる 2 つの数をさがすと 3 と 4 なので、x² + 7x + 12 = (x + 3)(x + 4) です。積から先にさがすと見つけやすくなります。x² − 10x + 25 = (x − 5)²、x² − 49 = (x + 7)(x − 7) のように、ほかの乗法公式も逆に使えます。共通な因数があるときは、先にくくり出します。因数分解したら、展開して元の式にもどるかをたしかめます。
