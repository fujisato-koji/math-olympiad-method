# A-015 展開と因数分解
#
# 書き方は N-001 の頭の注のとおり。答えの形は A-011 に合わせる（負の数は「−」U+2212）。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。ヒントは答えを書かず、図の付いたヒントは答えの手前までを絵で見せる（D-129〜D-131）。
# 図は面積図（かけ算の表）：上と左に 2 つのかっこの項を書き、ますにその積を入れる。色は 文字×文字 が黄、文字×数 が空色、数×数 が緑。
#   項が正の数だけのときは面積の大きさに合わせ、数の長さは 1 ずつ目もりで区切る（x の長さは目もりなし）。負の数があるときや数が大きいときは、ますの大きさをそろえた表にする。
#   因数分解は、表を逆に読む図（ますから左と上の項をさがす）、かけて □ になる 2 つの数の表、数と文字にばらしたタイル（共通な因数を赤でかこむ）で見せる。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：単項式どうしのかけ算（3x × 4x = 12x²）、単項式 × 多項式、多項式 × 多項式（(a + b)(c + d)、長方形の面積図）。
#   2 日目：乗法公式（(x + a)(x + b)、(x + a)²、(x − a)²、(x + a)(x − a)）。
#   3 日目：因数分解（共通な因数をくくり出す、乗法公式を逆に使う、両方を続けて使う）。
#   4 日目：わけ（計算のくふうも少し）。5 日目：A-010、A-009、N-027 と混ぜる（式の値、計算のくふう）。6 日目：確認。
# 前提は A-010（文字と式）、N-027（正負の数のかけ算）、A-009（累乗）。方程式（A-011）は前提にないので、
#   2 次方程式を因数分解で解くことは扱わない（A-017）。前提の道に小数（N-020）がないので、数は整数と分数にした。
# 累乗は上つきの数字（x²、a²b）で書く（A-009）。式の答えは鍵盤で打てないので choices にし、check は選択肢ごとの式（lambda）に
#   −5〜5 の整数を入れて、元の式とどの数でも等しいものを選び出す（文字が 2 つなら −4〜4 の組で確かめる）。
#   係数を打つ問題の check は、元の式に数を入れて係数を取り出す（定数項は x = 0 の値、2 次の式の x の係数は
#   (f(1) − f(−1)) ÷ 2）。計算のくふうと式の値は、そのまま計算する。
# 因数分解の選択肢は、元の式と等しいものが 1 つだけになるようにした（くくり出し方がちがうだけの、同じ式の選択肢は入れない）。
# 展開と因数分解は、2 次方程式（A-017）、平方根の計算（A-016）、二項定理（C-016）、整数の性質の証明の道具になる（D-026）。
# ただし腕だめしの最難関（n(n + 1)(n + 2)(n + 3) + 2025 が平方数）だけは例外で、uses に N-017 と L-005 を挙げて、約数の組と、2 でわり切れるかどうか（偶数と奇数）を使う。

id: A-015
days:
  - day: 1
    items:
      - part: 見本
        id: "6030e419ce"
        text: (a + b)(c + d) は、横 a + b、たて c + d の長方形の面積です。4 つに分けた面積を足すと、(a + b)(c + d) = ac + ad + bc + bd。このように、かっこのない和の形にすることを、展開するといいます。項に − がついていても、表の 4 つのますで同じようにかけ算します（x × x = x²）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="82.8" y="39" width="110" height="70" fill="#f3c969" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="192.8" y="39" width="70" height="70" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="82.8" y="109" width="110" height="50" fill="#7bc96f" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="192.8" y="109" width="70" height="50" fill="#b39ddb" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><text x="137.8" y="79.2" font-size="15" text-anchor="middle" fill="currentColor">ac</text><text x="227.8" y="79.2" font-size="15" text-anchor="middle" fill="currentColor">bc</text><text x="137.8" y="139.2" font-size="15" text-anchor="middle" fill="currentColor">ad</text><text x="227.8" y="139.2" font-size="15" text-anchor="middle" fill="currentColor">bd</text><text x="137.8" y="30" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="227.8" y="30" font-size="16" text-anchor="middle" fill="currentColor">b</text><text x="73.8" y="79.5" font-size="16" text-anchor="end" fill="currentColor">c</text><text x="73.8" y="139.5" font-size="16" text-anchor="end" fill="currentColor">d</text><text x="73.8" y="30" font-size="15" text-anchor="end" fill="currentColor" fill-opacity=".6">×</text><text x="160" y="185" font-size="15" text-anchor="middle" fill="currentColor">(a + b)(c + d) = ac + ad + bc + bd</text></svg>'
        explain: 横 a + b、たて c + d の長方形の面積は (a + b)(c + d) です。図のように 4 つの長方形に分けると、面積は ac、bc、ad、bd なので、(a + b)(c + d) = ac + ad + bc + bd です。c + d をひとまとまりと見て、分配法則（A-010）で a(c + d) + b(c + d)、さらに分配法則で ac + ad + bc + bd としても同じです。このように、かっこのある積を、かっこのない和の形に表すことを、式を展開するといいます。文字どうしのかけ算では、係数どうし、文字どうしをかけます。x × x = x²（A-009）なので、3x × 4x = 3 × 4 × x × x = 12x²、2x(x − 5) = 2x² − 10x です。
      - part: 思い出す
        id: "c6f88d50a5"
        text: 3(2x − 5) − 2(x − 4) を計算すると、どれになりますか。
