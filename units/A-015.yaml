="125.2" font-size="15" text-anchor="middle" fill="currentColor">ax</text><text x="286" y="125.2" font-size="15" text-anchor="middle" fill="currentColor">a²</text><text x="238" y="31" font-size="16" text-anchor="middle" fill="currentColor">x</text><text x="286" y="31" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="197" y="77.5" font-size="16" text-anchor="end" fill="currentColor">x</text><text x="197" y="125.5" font-size="16" text-anchor="end" fill="currentColor">a</text><text x="197" y="31" font-size="15" text-anchor="end" fill="currentColor" fill-opacity=".6">×</text><rect x="273" y="43" width="26" height="58" rx="4" fill="none" stroke="#f08080" stroke-width="3.5"/><rect x="209" y="107" width="58" height="26" rx="4" fill="none" stroke="#f08080" stroke-width="3.5"/><text x="95" y="184" font-size="14" text-anchor="middle" fill="currentColor">(x + a)(x + b)</text><text x="254" y="162" font-size="14" text-anchor="middle" fill="currentColor">(x + a)²</text><text x="254" y="184" font-size="14" text-anchor="middle" fill="currentColor">ax が 2 つ</text></svg>'
        explain: (x + a)(x + b) = x² + bx + ax + ab = x² + (a + b)x + ab です。x の係数は a と b の和、数の項は a と b の積になります。たとえば (x + 3)(x + 5) = x² + 8x + 15、(x + 4)(x − 6) = x² − 2x − 24 です。b = a とすると (x + a)² = x² + 2ax + a²、a の代わりに −a とすると (x − a)² = x² − 2ax + a²、b = −a とすると (x + a)(x − a) = x² − a² です。この 4 つを乗法公式といいます。(x + a)² は x² + a² ではないことに注意します（2ax の項があります）。x の代わりに 2x や 3y のような式を入れても使えます。
