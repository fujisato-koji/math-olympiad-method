  - part: 離
    id: "cee2fe8001"
    kinds: [総動員, 道筋]
    uses: [L-005]
    text: x² − y² = 48 を満たす自然数 x、y の組は、全部で何組ありますか。
    answer: 3
    check: "sum(1 for x in range(1, 100) for y in range(1, 100) if x * x - y * y == 48)"
    hints:
      - text: x² − y² を因数分解しよう。1 辺 x の正方形から 1 辺 y の正方形を切りとった形は、1 つの長方形につなぎかえられるね。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="16" y="44" width="84" height="38" fill="#f3c969" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="16" y="82" width="38" height="46" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="54" y="82" width="46" height="46" fill="#c8ccd6" fill-opacity=".12" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="58" y="36" font-size="15" text-anchor="middle" fill="currentColor">x</text><text x="106" y="110" font-size="15" text-anchor="start" fill="currentColor">y</text><line x1="128" y1="82" x2="144" y2="82" stroke="currentColor" stroke-width="2"/><polygon points="152,82 144,86.8 144,77.2" fill="currentColor" stroke="currentColor" stroke-width="1"/><rect x="160" y="64" width="84" height="38" fill="#f3c969" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="244" y="64" width="46" height="38" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><text x="225" y="54" font-size="15" text-anchor="middle" fill="currentColor">横 x + y</text><text x="225" y="124" font-size="15" text-anchor="middle" fill="currentColor">たて x − y</text></svg>'
      - (x + y)(x − y) = 48 で、x + y と x − y はどちらも自然数だね。かけて 48 になる組を書き出そう。
      - x + y と x − y を足すと 2x で偶数になるね。x + y と x − y は、偶数と奇数のどちらどうしかな。
    paths:
      - [(x + y)(x − y) = 48, x + y の方が大きいので 48 × 1、24 × 2、16 × 3、12 × 4、8 × 6, x + y と x − y はどちらも偶数か どちらも奇数, 使えるのは 24 × 2、12 × 4、8 × 6 で x と y は 13 と 11、8 と 4、7 と 1 の 3 組]
      - [x − y = k とおくと x² − y² = k(2y + k) = 48, k = 2 は 2y + 2 = 24 で y = 11、k = 4 は 2y + 4 = 12 で y = 4、k = 6 は 2y + 6 = 8 で y = 1, k = 1、3 は y が整数にならず、k = 5 は 48 をわり切れず、k が 7 以上では k(2y + k) が 48 より大きい, 3 組]
    note: 因数分解した形から《約数》の組を書き出し、偶奇（L-005）でしぼる。48 × 1 や 16 × 3 から x が《整数》にならないことをたしかめずに、5 組と答えやすい。x − y は 0 にならない（y が自然数なので）ことにもふれたい。
