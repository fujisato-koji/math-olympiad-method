# A-015 展開と因数分解
#
# 書き方は N-001 の頭の注のとおり。答えの形は A-011 に合わせる（負の数は「−」U+2212）。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：単項式どうしのかけ算（3x × 4x = 12x²）、単項式 × 多項式、多項式 × 多項式（(a + b)(c + d)、長方形の面積図）。
#   2 日目：乗法公式（(x + a)(x + b)、(x + a)²、(x − a)²、(x + a)(x − a)）。
#   3 日目：因数分解（共通な因数をくくり出す、乗法公式を逆に使う、両方を続けて使う）。
#   4 日目：わけ（計算のくふうも少し）。5 日目：A-010、A-009、N-027 と混ぜる（式の値、計算のくふう）。6 日目：確認。
# 前提は A-010（文字と式）、N-027（正負の数のかけ算）、A-009（累乗）。方程式（A-011）は前提にないので、
#   2 次方程式を因数分解で解くことは扱わない（A-017）。前提の道に小数（N-020）がないので、数は整数と分数にした。
# 累乗は上つきの数字（x²、a²b）で書く（A-009）。式の答えは鍵盤で打てないので choices にし、check は選択肢ごとの式（lambda）に
#   −5〜5 の整数を入れて、元の式とどの数でも等しいものを選び出す（文字が 2 つなら −4〜4 の組で確かめる）。
#   係数を打つ問題の check は、元の式に数を入れて係数を取り出す（定数項は x = 0 の値、2 次の式の x の係数は
#   (f(1) − f(−1)) ÷ 2）。計算のくふうと式の値は、そのまま計算する。
# 因数分解の選択肢は、元の式と等しいものが 1 つだけになるようにした（くくり出し方がちがうだけの、同じ式の選択肢は入れない）。
# 展開と因数分解は、2 次方程式（A-017）、平方根の計算（A-016）、二項定理（C-016）、整数の性質の証明の道具になる（D-026）。

id: A-015
days:
  - day: 1
    items:
      - part: 見本
        text: (a + b)(c + d) を、長方形の面積を使って展開してみましょう。
        svg: |
          <svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
            <rect x="40" y="25" width="160" height="100" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <line x1="140" y1="25" x2="140" y2="125" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="40" y1="85" x2="200" y2="85" stroke="currentColor" fill="none" stroke-width="2"/>
            <text x="90" y="18" font-size="14" text-anchor="middle">a</text>
            <text x="170" y="18" font-size="14" text-anchor="middle">b</text>
            <text x="28" y="60" font-size="14" text-anchor="middle">c</text>
            <text x="28" y="110" font-size="14" text-anchor="middle">d</text>
            <text x="90" y="60" font-size="14" text-anchor="middle">ac</text>
            <text x="170" y="60" font-size="14" text-anchor="middle">bc</text>
            <text x="90" y="110" font-size="14" text-anchor="middle">ad</text>
            <text x="170" y="110" font-size="14" text-anchor="middle">bd</text>
          </svg>
        explain: 横 a + b、たて c + d の長方形の面積は (a + b)(c + d) です。図のように 4 つの長方形に分けると、面積は ac、bc、ad、bd なので、(a + b)(c + d) = ac + ad + bc + bd です。c + d をひとまとまりと見て、分配法則（A-010）で a(c + d) + b(c + d)、さらに分配法則で ac + ad + bc + bd としても同じです。このように、かっこのある積を、かっこのない和の形に表すことを、式を展開するといいます。文字どうしのかけ算では、係数どうし、文字どうしをかけます。x × x = x²（A-009）なので、3x × 4x = 3 × 4 × x × x = 12x²、2x(x − 5) = 2x² − 10x です。
      - part: 思い出す
        text: 3(2x − 5) − 2(x − 4) を計算すると、どれになりますか。
        choices: [4x − 7, 4x − 23, 4x + 7]
        answer: 4x − 7
        check: "[c for c, f in {'4x − 7': lambda x: 4 * x - 7, '4x − 23': lambda x: 4 * x - 23, '4x + 7': lambda x: 4 * x + 7}.items() if all(f(x) == 3 * (2 * x - 5) - 2 * (x - 4) for x in range(-5, 6))][0]"
        hints:
          - 2 つのかっこを、それぞれ分配法則で外しましょう。
          - −2(x − 4) の − 4 には、−2 をかけます。
          - x の項どうし、数の項どうしをまとめましょう。
        paths:
          - [6x − 15 − 2x + 8, 4x − 7]
        note: −2 × (−4) を −8 として 4x − 23 としやすい（N-027）。
      - part: 思い出す
        text: 2³ × 2⁴ は、2 の何乗ですか。
        answer: 7
        check: "[k for k in range(1, 20) if 2 ** k == 2 ** 3 * 2 ** 4][0]"
        hints:
          - 2³ は 2 を 3 回かけた数です。
          - 2³ × 2⁴ では、2 を全部で何回かけるでしょう。
          - 指数どうしを足しましょう。
        paths:
          - [2 を 3 回と 4 回, 合わせて 7 回, 2⁷]
      - part: 今日
        text: 3x × (−4x) を計算すると、どれになりますか。
        choices: [−12x², −12x, 12x²]
        answer: −12x²
        check: "[c for c, f in {'−12x²': lambda x: -12 * x ** 2, '−12x': lambda x: -12 * x, '12x²': lambda x: 12 * x ** 2}.items() if all(f(x) == 3 * x * (-4 * x) for x in range(-5, 6))][0]"
        hints:
          - 係数どうし、文字どうしを、それぞれかけましょう。
          - 3 × (−4) の符号に気をつけましょう。
          - x × x は、累乗で書くとどうなるでしょう。
        paths:
          - [3 × (−4) = −12, x × x = x², −12x²]
        note: x × x を 2x としやすい。2x は x + x のこと。
      - part: 今日
        text: 2a(3a − 5b) を展開すると、どれになりますか。
        choices: [6a² − 10ab, 6a² − 5b, 6a − 10ab]
        answer: 6a² − 10ab
        check: "[c for c, f in {'6a² − 10ab': lambda a, b: 6 * a ** 2 - 10 * a * b, '6a² − 5b': lambda a, b: 6 * a ** 2 - 5 * b, '6a − 10ab': lambda a, b: 6 * a - 10 * a * b}.items() if all(f(a, b) == 2 * a * (3 * a - 5 * b) for a in range(-4, 5) for b in range(-4, 5))][0]"
        hints:
          - 分配法則で、3a にも −5b にも 2a をかけます。
          - 2a × 3a は、係数どうし、文字どうしをかけましょう。
          - 2a × (−5b) の符号に気をつけましょう。
        paths:
          - [2a × 3a = 6a², 2a × (−5b) = −10ab, 6a² − 10ab]
        note: 後ろの項にかけ忘れて 6a² − 5b としやすい。
      - part: 今日
        text: (x + 3)(y − 2) を展開すると、どれになりますか。
        choices: [xy − 2x + 3y − 6, xy + 3y − 6, xy − 2x + 3y + 6]
        answer: xy − 2x + 3y − 6
        check: "[c for c, f in {'xy − 2x + 3y − 6': lambda x, y: x * y - 2 * x + 3 * y - 6, 'xy + 3y − 6': lambda x, y: x * y + 3 * y - 6, 'xy − 2x + 3y + 6': lambda x, y: x * y - 2 * x + 3 * y + 6}.items() if all(f(x, y) == (x + 3) * (y - 2) for x in range(-4, 5) for y in range(-4, 5))][0]"
        hints:
          - 前のかっこの x と 3 を、後ろのかっこの y と −2 に、それぞれかけます。
          - 全部で 4 つの項ができます。
          - 3 × (−2) の符号に気をつけましょう。
        paths:
          - [x × y、x × (−2)、3 × y、3 × (−2), xy − 2x + 3y − 6]
        note: 4 つのかけ算のうち 1 つを落としやすい。面積図の 4 つの部分を思い出させる。
      - part: 挑戦
        text: (2x + 1)(3x − 4) を展開して同類項をまとめると、x の係数はいくつになりますか。
        answer: −5
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda p: Fraction(p(1) - p(-1), 2))(lambda x: (2 * x + 1) * (3 * x - 4)))"
        hints:
          - 4 つのかけ算をして、展開しましょう。
          - x の項は 2 つできます。
          - 2 つの x の項をまとめましょう。
        paths:
          - [6x² − 8x + 3x − 4, −8x + 3x をまとめる, 6x² − 5x − 4 で係数は −5]
    extra:
      - part: 今日
        text: −2x(x − 3y) を展開すると、どれになりますか。
        choices: [−2x² + 6xy, −2x² − 6xy, −2x + 6xy]
        answer: −2x² + 6xy
        check: "[c for c, f in {'−2x² + 6xy': lambda x, y: -2 * x ** 2 + 6 * x * y, '−2x² − 6xy': lambda x, y: -2 * x ** 2 - 6 * x * y, '−2x + 6xy': lambda x, y: -2 * x + 6 * x * y}.items() if all(f(x, y) == -2 * x * (x - 3 * y) for x in range(-4, 5) for y in range(-4, 5))][0]"
        hints:
          - 分配法則で、x にも −3y にも −2x をかけます。
          - (−2x) × (−3y) の符号は、どうなるでしょう。
          - x × x は x² です。
        paths:
          - [(−2x) × x = −2x², (−2x) × (−3y) = 6xy, −2x² + 6xy]
      - part: 今日
        text: (a + 2)(b + 5) を展開すると、どれになりますか。
        choices: [ab + 5a + 2b + 10, ab + 2a + 5b + 10, ab + 10]
        answer: ab + 5a + 2b + 10
        check: "[c for c, f in {'ab + 5a + 2b + 10': lambda a, b: a * b + 5 * a + 2 * b + 10, 'ab + 2a + 5b + 10': lambda a, b: a * b + 2 * a + 5 * b + 10, 'ab + 10': lambda a, b: a * b + 10}.items() if all(f(a, b) == (a + 2) * (b + 5) for a in range(-4, 5) for b in range(-4, 5))][0]"
        hints:
          - 前のかっこの a と 2 を、後ろのかっこの b と 5 に、それぞれかけます。
          - a × 5 は 5a、2 × b は 2b です。
          - 4 つの項を書き出しましょう。
        paths:
          - [ab、5a、2b、10, ab + 5a + 2b + 10]
      - part: 挑戦
        text: (3x − 2)(x + 4) を展開したとき、数だけの項（定数項）はいくつですか。
        answer: −8
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((3 * 0 - 2) * (0 + 4))"
        hints:
          - 数だけの項は、数どうしをかけてできます。
          - それぞれのかっこの、数の項はどれでしょう。
          - (−2) × 4 の符号に気をつけましょう。
        paths:
          - [数どうしの積は (−2) × 4, −8]

  - day: 2
    items:
      - part: 見本
        text: (x + a)(x + b) を展開して、乗法公式をつくってみましょう。
        explain: (x + a)(x + b) = x² + bx + ax + ab = x² + (a + b)x + ab です。x の係数は a と b の和、数の項は a と b の積になります。たとえば (x + 3)(x + 5) = x² + 8x + 15、(x + 4)(x − 6) = x² − 2x − 24 です。b = a とすると (x + a)² = x² + 2ax + a²、a の代わりに −a とすると (x − a)² = x² − 2ax + a²、b = −a とすると (x + a)(x − a) = x² − a² です。この 4 つを乗法公式といいます。(x + a)² は x² + a² ではないことに注意します（2ax の項があります）。x の代わりに 2x や 3y のような式を入れても使えます。
      - part: 思い出す
        text: (x + 2)(y + 7) を展開すると、どれになりますか。
        choices: [xy + 7x + 2y + 14, xy + 2x + 7y + 14, xy + 14]
        answer: xy + 7x + 2y + 14
        check: "[c for c, f in {'xy + 7x + 2y + 14': lambda x, y: x * y + 7 * x + 2 * y + 14, 'xy + 2x + 7y + 14': lambda x, y: x * y + 2 * x + 7 * y + 14, 'xy + 14': lambda x, y: x * y + 14}.items() if all(f(x, y) == (x + 2) * (y + 7) for x in range(-4, 5) for y in range(-4, 5))][0]"
        hints:
          - 4 つのかけ算をしましょう。
          - x × 7 は 7x、2 × y は 2y です。
          - 文字と係数の組み合わせを確かめましょう。
        paths:
          - [xy、7x、2y、14, xy + 7x + 2y + 14]
      - part: 思い出す
        text: (x − 4)(3x + 2) を展開して同類項をまとめると、x の係数はいくつになりますか。
        answer: −10
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda p: Fraction(p(1) - p(-1), 2))(lambda x: (x - 4) * (3 * x + 2)))"
        hints:
          - 4 つのかけ算をして、展開しましょう。
          - x の項は 2 つできます。
          - (−4) × 3x の符号に気をつけましょう。
        paths:
          - [3x² + 2x − 12x − 8, 2x − 12x をまとめる, 係数は −10]
      - part: 今日
        text: (x + 4)(x − 7) を展開すると、どれになりますか。
        choices: [x² − 3x − 28, x² + 3x − 28, x² − 3x + 28]
        answer: x² − 3x − 28
        check: "[c for c, f in {'x² − 3x − 28': lambda x: x ** 2 - 3 * x - 28, 'x² + 3x − 28': lambda x: x ** 2 + 3 * x - 28, 'x² − 3x + 28': lambda x: x ** 2 - 3 * x + 28}.items() if all(f(x) == (x + 4) * (x - 7) for x in range(-5, 6))][0]"
        hints:
          - (x + a)(x + b) の公式で、a = 4、b = −7 です。
          - x の係数は a と b の和です。
          - 数の項は a と b の積です。符号に気をつけましょう。
        paths:
          - [和は 4 + (−7) = −3, 積は 4 × (−7) = −28, x² − 3x − 28]
      - part: 今日
        text: (x − 5)² を展開すると、どれになりますか。
        choices: [x² − 10x + 25, x² − 25, x² − 10x − 25]
        answer: x² − 10x + 25
        check: "[c for c, f in {'x² − 10x + 25': lambda x: x ** 2 - 10 * x + 25, 'x² − 25': lambda x: x ** 2 - 25, 'x² − 10x − 25': lambda x: x ** 2 - 10 * x - 25}.items() if all(f(x) == (x - 5) ** 2 for x in range(-5, 6))][0]"
        hints:
          - (x − 5)² は (x − 5)(x − 5) のことです。
          - (x − a)² = x² − 2ax + a² の公式を使いましょう。
          - (−5) × (−5) の符号は、どうなるでしょう。
        paths:
          - [x² − 2 × 5 × x + 5², x² − 10x + 25]
        note: x² − 25 としやすい。x = 1 を入れると (1 − 5)² = 16、1 − 25 = −24 で、ちがうことがわかる。
      - part: 今日
        text: (2x + 3)(2x − 3) を展開すると、どれになりますか。
        choices: [4x² − 9, 2x² − 9, 4x² − 12x − 9]
        answer: 4x² − 9
        check: "[c for c, f in {'4x² − 9': lambda x: 4 * x ** 2 - 9, '2x² − 9': lambda x: 2 * x ** 2 - 9, '4x² − 12x − 9': lambda x: 4 * x ** 2 - 12 * x - 9}.items() if all(f(x) == (2 * x + 3) * (2 * x - 3) for x in range(-5, 6))][0]"
        hints:
          - 2x をひとまとまりと見ましょう。
          - (a + b)(a − b) = a² − b² の公式で、a = 2x、b = 3 です。
          - (2x)² は 2x × 2x です。
        paths:
          - [(2x)² − 3², 4x² − 9]
        note: (2x)² を 2x² としやすい。係数も 2 乗する。
      - part: 挑戦
        text: (3x + 2y)² を展開すると、xy の係数はいくつになりますか。
        answer: 12
        check: "(lambda f: Fraction(f(1, 1) - f(1, -1), 2))(lambda x, y: (3 * x + 2 * y) ** 2)"
        hints:
          - (a + b)² = a² + 2ab + b² の公式で、a = 3x、b = 2y です。
          - xy の項は 2ab の部分です。
          - 2 × 3x × 2y を計算しましょう。
        paths:
          - [9x² + 2 × 3x × 2y + 4y², xy の項は 12xy, 係数は 12]
    extra:
      - part: 今日
        text: (x + 6)² を展開すると、どれになりますか。
        choices: [x² + 12x + 36, x² + 36, x² + 6x + 36]
        answer: x² + 12x + 36
        check: "[c for c, f in {'x² + 12x + 36': lambda x: x ** 2 + 12 * x + 36, 'x² + 36': lambda x: x ** 2 + 36, 'x² + 6x + 36': lambda x: x ** 2 + 6 * x + 36}.items() if all(f(x) == (x + 6) ** 2 for x in range(-5, 6))][0]"
        hints:
          - (x + a)² = x² + 2ax + a² の公式を使いましょう。
          - x の係数は 2 × a です。
          - 数の項は a の 2 乗です。
        paths:
          - [x² + 2 × 6 × x + 6², x² + 12x + 36]
      - part: 今日
        text: (a − 8)(a + 8) を展開すると、どれになりますか。
        choices: [a² − 64, a² + 64, a² − 16a − 64]
        answer: a² − 64
        check: "[c for c, f in {'a² − 64': lambda a: a ** 2 - 64, 'a² + 64': lambda a: a ** 2 + 64, 'a² − 16a − 64': lambda a: a ** 2 - 16 * a - 64}.items() if all(f(a) == (a - 8) * (a + 8) for a in range(-5, 6))][0]"
        hints:
          - (a + b)(a − b) の形です。
          - a の項は、−8a と 8a で消えます。
          - 数の項は (−8) × 8 です。
        paths:
          - [a² + 8a − 8a − 64, a² − 64]
      - part: 挑戦
        text: (x − 9)(x + 4) を展開したとき、数だけの項（定数項）はいくつですか。
        answer: −36
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((0 - 9) * (0 + 4))"
        hints:
          - (x + a)(x + b) の公式で、数の項は a と b の積です。
          - a と b は、それぞれいくつでしょう。
          - 積の符号に気をつけましょう。
        paths:
          - [a = −9、b = 4, 積は (−9) × 4, −36]

  - day: 3
    items:
      - part: 見本
        text: x² + 7x + 12 と 3x² − 6x を、かけ算の形に表してみましょう。
        explain: 多項式を、いくつかの式の積の形に表すことを因数分解といいます（展開の逆）。3x² − 6x は、どの項にも 3x がふくまれるので、この共通な因数 3x をかっこの外にくくり出して 3x(x − 2) です。x² + 7x + 12 は、乗法公式 x² + (a + b)x + ab を逆に使います。積が 12、和が 7 になる 2 つの数をさがすと 3 と 4 なので、x² + 7x + 12 = (x + 3)(x + 4) です。積から先にさがすと見つけやすくなります。x² − 10x + 25 = (x − 5)²、x² − 49 = (x + 7)(x − 7) のように、ほかの乗法公式も逆に使えます。共通な因数があるときは、先にくくり出します。因数分解したら、展開して元の式にもどるかを確かめます。
      - part: 思い出す
        text: (x − 3)(x + 8) を展開すると、どれになりますか。
        choices: [x² + 5x − 24, x² − 5x − 24, x² + 5x + 24]
        answer: x² + 5x − 24
        check: "[c for c, f in {'x² + 5x − 24': lambda x: x ** 2 + 5 * x - 24, 'x² − 5x − 24': lambda x: x ** 2 - 5 * x - 24, 'x² + 5x + 24': lambda x: x ** 2 + 5 * x + 24}.items() if all(f(x) == (x - 3) * (x + 8) for x in range(-5, 6))][0]"
        hints:
          - (x + a)(x + b) の公式で、a = −3、b = 8 です。
          - x の係数は a と b の和です。
          - 数の項は a と b の積です。
        paths:
          - [和は 5、積は −24, x² + 5x − 24]
      - part: 思い出す
        text: (2a − b)² を展開すると、どれになりますか。
        choices: [4a² − 4ab + b², 4a² + b², 4a² − 2ab + b²]
        answer: 4a² − 4ab + b²
        check: "[c for c, f in {'4a² − 4ab + b²': lambda a, b: 4 * a ** 2 - 4 * a * b + b ** 2, '4a² + b²': lambda a, b: 4 * a ** 2 + b ** 2, '4a² − 2ab + b²': lambda a, b: 4 * a ** 2 - 2 * a * b + b ** 2}.items() if all(f(a, b) == (2 * a - b) ** 2 for a in range(-4, 5) for b in range(-4, 5))][0]"
        hints:
          - (x − y)² = x² − 2xy + y² の公式で、x = 2a、y = b です。
          - (2a)² は 2a × 2a です。
          - まん中の項は 2 × 2a × b です。
