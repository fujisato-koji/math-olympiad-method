        explain: 例：「n を《整数》として、連続する 2 つの偶数を 2n、2n + 2 とする。その間の奇数は 2n + 1 である。積に 1 を足すと 2n(2n + 2) + 1 = 4n² + 4n + 1（分配法則で展開）。一方、乗法公式で (2n + 1)² = 4n² + 4n + 1。2 つは同じ式なので、2n(2n + 2) + 1 = (2n + 1)² である。よって、連続する 2 つの偶数の積に 1 を足すと、間の奇数の 2 乗になる。」と書ければよい。①「〜とする」で文字を決める、② 展開する、③ 約束した事実（偶数と奇数の表し方 A-010、乗法公式）で結ぶ、がそろっているかを見る。4n² + 4n + 1 を因数分解して (2n + 1)² としてもよい。4 × 6 + 1 = 25 のような例だけで終わっていたら、例だけでは、すべての場合に成り立つとは言えないことを話す。
