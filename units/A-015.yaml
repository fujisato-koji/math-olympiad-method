# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数]
    text: 101 × 99 × 10001 を計算しましょう。
    answer: 99999999
    check: "101 * 99 * 10001"
    hints:
      - 101 = 100 + 1、99 = 100 − 1 と見てみよう。
      - (a + b)(a − b) = a² − b² が使えるね。
      - 101 × 99 の答えと 10001 も、同じ形に見えないかな。
    paths:
      - [101 × 99 = (100 + 1)(100 − 1) = 10000 − 1, (10000 − 1)(10000 + 1) = 100000000 − 1, 99999999]
    note: そのまま筆算すると桁が多く間ちがえやすい。(a + b)(a − b) = a² − b² を 2 回続けて使えば、暗算でできる。答えの 9 の個数（8 こ）を数えまちがえやすい。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [L-005]
    text: x² − y² = 48 を満たす自然数 x、y の組は、全部で何組ありますか。
    answer: 3
    check: "sum(1 for x in range(1, 100) for y in range(1, 100) if x * x - y * y == 48)"
    hints:
      - x² − y² を因数分解しよう。
      - (x + y)(x − y) = 48 で、x + y と x − y はどちらも自然数だね。かけて 48 になる組を書き出そう。
      - x + y と x − y を足すと 2x で偶数になるね。x + y と x − y は、偶数と奇数のどちらどうしかな。
    paths:
      - [(x + y)(x − y) = 48, x + y の方が大きいので 48 × 1、24 × 2、16 × 3、12 × 4、8 × 6, x + y と x − y はどちらも偶数か どちらも奇数, 使えるのは 24 × 2、12 × 4、8 × 6 で x と y は 13 と 11、8 と 4、7 と 1 の 3 組]
    note: 因数分解した形から《約数》の組を書き出し、偶奇（L-005）でしぼる。48 × 1 や 16 × 3 から x が《整数》にならないことを確かめずに、5 組と答えやすい。x − y は 0 にならない（y が自然数なので）ことにもふれたい。
  - part: 離
    kinds: [手数]
    text: (x + 1)(x + 2)(x + 3)(x + 4) を展開したとき、x² の係数はいくつですか。
    answer: 35
    check: "(lambda f: Fraction(f(1) + f(-1), 2) - f(0) - 1)(lambda x: (x + 1) * (x + 2) * (x + 3) * (x + 4))"
    hints:
      - 4 つを一度に展開するのは大変だね。2 つずつ組にしよう。
      - (x + 1)(x + 4) と (x + 2)(x + 3) を展開すると、共通な部分があるよ。
      - 共通な部分を A とおいて展開してから、もとにもどそう。
    paths:
      - [(x + 1)(x + 4) = x² + 5x + 4、(x + 2)(x + 3) = x² + 5x + 6, x² + 5x = A とおくと (A + 4)(A + 6) = A² + 10A + 24, A² の中の x² の項は 25x²、10A の中は 10x², 25 + 10 = 35]
      - [順に展開する, (x + 1)(x + 2)(x + 3) = x³ + 6x² + 11x + 6, これに (x + 4) をかけると x² の係数は 6 × 4 + 11 = 35]
    note: 途中の式（x² + 5x など）を覚えたまま展開を続ける手数の多い問題。A² = (x² + 5x)² の中の 25x² を落として 10 と答えやすい。組の作り方で計算の量が変わることも話したい。

  - part: 離
