      - 入れかえてもよく、まとめる組を変えてもよいので、たし算やかけ算と同じく、どの順でまとめても結果は同じ（数が 4 つ、5 つでも、この 2 つの性質をくり返し使えば、どの順も 1 つの順に直せる）
      - だから 1 つの順で計算すればよい
      - 1 と 2 で 7、7 と 3 で 52、52 と 4 で 472、472 と 5 で 5197
    note: くふうは 3 つ：①小さい場合で試して、順番によらないと見当をつける、②2 倍して 1 を足すと積に分かれる（(2a + 1)(2b + 1)）と見ぬく、③そのかけ算の値を、変わらない量として使う。check は、5 つの数から 2 つを選ぶ順を全部たどって最後に残る数の集まりを作り、5197 の 1 種類だけになることをたしかめる。型は「変わらない量を見つける」（不変量）。
  - part: 離
    id: "dc0ea472a4"
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - N-017
    - L-005
    text: n を正の整数とします。n(n + 1)(n + 2)(n + 3) + 2025 が平方数になるような n を求めましょう。そのような n は 1 つだけあります。
    answer: 21
    check: '(lambda L: L[0] if len(L) == 1 else -1)([n for n in range(1, 3000) if math.isqrt(n * (n + 1) * (n + 2) * (n + 3) + 2025) ** 2 == n * (n + 1) * (n + 2) * (n + 3) + 2025])'
    hints:
    - n = 1、2、3 … と、小さい数でためしてみよう。4 つの数をそのままかけるとたいへんだね。4 つの数のくみ合わせをかえて、うまくまとまらないかな。
    - 4 つの数を 2 こずつの組に分けて、かけてみよう。分け方は 3 通りあるね。
    - 2 つのかけ算の答えのちがいは小さいね。まん中の数を 1 つの文字 A でおいてみよう。
    paths:
    - - n(n + 3) = n² + 3n、(n + 1)(n + 2) = n² + 3n + 2。A = n² + 3n + 1 とおくと、4 つの数の積は (A − 1)(A + 1) = A² − 1
      - 式は A² − 1 + 2025 = A² + 2024。これが平方数 m² に等しいとすると、m² − A² = 2024 で、(m − A)(m + A) = 2024
      - m − A と m + A の差は 2A なので、2 でわり切れる。つまり 2 つは、どちらも 2 でわり切れるか、どちらもわり切れないか。積の 2024 は 2 でわり切れるので、どちらも 2 でわり切れる。m − A = 2p、m + A = 2q とおくと pq = 506 = 2 × 11 × 23 で、p < q
      - (p, q) は (1, 506)、(2, 253)、(11, 46)、(22, 23)。A = q − p なので A は 505、251、35、1
      - n(n + 3) = A − 1 は 504、250、34、0。n(n + 3) = 504 = 21 × 24 は n = 21。250 は 14 × 17 = 238 と 15 × 18 = 270 のあいだ、34 は 4 × 7 = 28 と 5 × 8 = 40 のあいだなのでだめ。0 は n = 0 で正の整数ではない。答えは 21（21 × 22 × 23 × 24 + 2025 = 507²）
    - - 2025 = 45 × 45。4 つの数の積が、ちがいが 90 の 2 つの数のかけ算 X × (X + 90) になっていれば、X × (X + 90) + 45 × 45 = (X + 45) × (X + 45) で平方数になる（右がわを展開してたしかめる）。そこで、4 つの数の積を、ちがいが 90 の 2 つの数のかけ算にする n をさがす
      - 4 つの数を 2 こずつかけると、分け方は 3 通り：n(n + 3) と (n + 1)(n + 2) はちがいが 2、n(n + 2) と (n + 1)(n + 3) はちがいが 2n + 3、n(n + 1) と (n + 2)(n + 3) はちがいが 4n + 6
      - ちがいが 90 になるのは、2 は 90 でなく、2n + 3 はいつも 2 でわり切れないので 90 にならず、4n + 6 = 90 の n = 21 だけ
      - n = 21 なら、21 × 22 = 462、23 × 24 = 552 で、ちがいは 90。m − 45 = 462 から m = 507 で、4 つの数の積 + 2025 = (507 − 45)(507 + 45) + 45 × 45 = 507 × 507 になり、たしかに平方数
      - 問題から、そのような n は 1 つだけなので、答えは 21（1 つだけであることは、1 本目の約数の組でたしかめられる）
    note: 考えどころは 3 つ：①4 つの数を、両はしの組 n(n + 3) とまん中の組 (n + 1)(n + 2) に分けると n² + 3n がそろい、A = n² + 3n + 1 とおくと積は A² − 1、式は A² + 2024 になる（組みかえ）、②m² − A² = 2024 を (m − A)(m + A) に分け、2 つとも 2 でわり切れることから 506 の約数の組にしぼる（2 乗の差の因数分解）、③A が 505、251、35、1 の 4 通りになり、n(n + 3) = A − 1 を満たす整数 n を調べると A = 505 の n = 21 だけ（A = 1 は n = 0）。check は n を 1 から 2999 まで全部、n(n + 1)(n + 2)(n + 3) + 2025 をほんとうに計算して平方数かどうかを調べ、ちょうど 1 つのときだけ n を返す（0 こか 2 つ以上なら −1）。上限のわけ：n ≥ 31 なら A ≥ 1055 で 2A + 1 > 2024 だから A² < 式 < (A + 1)² となり平方数にならない。だから n は 30 までで十分で、ゆとりをみて 2999 まで調べる（みちすじの A の限りは使わない）。似た既出（n² + 11 が平方数になる n）とのちがい：そちらは 2 乗の差が 11 で 1 回の因数分解ですむが、こちらは先に 4 つの積を組みかえて A でおきかえるだんと、両方 2 でわり切れる、約数の組から A、A から n と 2 回の選別がある。 2 本目は A でおきかえず、2025 = 45 × 45 から、4 つの数の積が「ちがいが 90 の 2 つの数の積」(m − 45)(m + 45) になる形をさがし、2 こずつの組の 3 通りの分け方のちがい（2、2n + 3、4n + 6）から n = 21 を見つける（1 本目は 2 乗の差 2024 の約数の組で全部をしぼり、2 本目は 45 の 2 乗の差で組の分け方をしぼる）。2 本目は「1 つだけある」という問題の文を使って答えを決めるので、1 つだけであることのたしかめは 1 本目による。
