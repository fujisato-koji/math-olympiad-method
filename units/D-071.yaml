  - part: 見本
    id: "b3eb7b69d5"
    text: |-
      曲線を小さな線分に分けて、その長さを足すと、曲線の長さになります（図）。
      t が dt だけ進むと、点は横に x′dt、たてに y′dt 進むので、1 本の線分の長さは √(x′² + y′²) dt です（三平方の定理）。
      これを足し合わせて、長さは L = ∫(a→b) √(x′² + y′²) dt。速さを積分した道のりと同じです。
      例：x = 5t、y = 12t（0 ≦ t ≦ 1）は速さ 13 なので、長さは 13 です。
