    id: "35e66f0501"
    text: |-
      t を時間とみると、点は曲線の上を動きます。そのときの速度ベクトル (x′(t), y′(t)) は、点の進む向きと速さを表す矢印です（図の青い矢印）。
      矢印の長さ √(x′² + y′²) が速さで、速さを時間で積分したものが道のりです。
      図は x = 2t、y = t² の t = 1 のときです。x′ = 2、y′ = 2t = 2 なので、速度 (2, 2)、速さ √8 = 2√2 です。
