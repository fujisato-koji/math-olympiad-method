.5,100.7 128.6,99 129.6,97.3 130.7,95.5 131.8,93.7 132.8,91.9 133.9,90.1 134.9,88.2 136,86.4 137.1,84.5 138.1,82.6 139.2,80.7 140.2,78.7 141.3,76.8 142.4,74.8 143.4,72.8 144.5,70.8 145.5,68.8 146.6,66.7 147.7,64.6 148.7,62.5 149.8,60.4 150.8,58.3 151.9,56.2 153,54 154,51.8 155.1,49.6 156.1,47.4 157.2,45.2" fill="none" stroke="#d9534f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="90" y1="150" x2="150" y2="150" stroke="#2f7fc1" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="150" y1="150" x2="150" y2="90" stroke="#2f7fc1" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="90" y1="150" x2="141.5" y2="98.5" stroke="#2f7fc1" stroke-width="3" stroke-linecap="round"/><polygon points="150,90 145.3,102.3 137.7,94.7" fill="#2f7fc1" stroke="none"/><circle cx="90" cy="150" r="5" fill="#d9534f" stroke="currentColor" stroke-width="1.2"/><text x="84" y="140" font-size="14" text-anchor="end" fill="currentColor">P</text><text x="120" y="168" font-size="14" text-anchor="middle" fill="#2f7fc1">x′ = 2</text><text x="156" y="125" font-size="14" text-anchor="start" fill="#2f7fc1">y′ = 2</text><text x="205" y="30" font-size="13" text-anchor="start" fill="currentColor">x = 2t、y = t²</text><text x="205" y="54" font-size="13" text-anchor="start" fill="currentColor">t = 1 で P (2, 1)</text><text x="205" y="86" font-size="15" text-anchor="start" fill="#2f7fc1" font-weight="bold">速度 (2, 2)</text><text x="205" y="112" font-size="13" text-anchor="start" fill="currentColor">速さ＝矢印の長さ</text><text x="205" y="134" font-size="13" text-anchor="start" fill="currentColor">√(2² + 2²) = 2√2</text></svg>'
    explain: |-
      x′ は横向きに 1 秒あたりどれだけ進むか、y′ はたて向きに 1 秒あたりどれだけ進むかです。2 つを合わせた矢印が速度ベクトル（G-027）で、その長さが速さです。
      曲線の上の点では、速度ベクトルは曲線にそう向き（接線の向き）になります。
      道のりは「速さ × 短い時間」を足し合わせたものなので、速さの積分です。円 x = cos t、y = sin t の速度は (−sin t, cos t)、速さはいつも 1 です。
    note: 速度 (x′, y′)、速さ √(x′² + y′²)。道のりは速さの積分。
