    explain: |-
      【定義】媒介変数表示は、点の位置を t の関数として表す方法です。t を時こくと見ると、点が動いて線をえがくようすがわかります。
      t の値を表にして点を打つと形が見え、t を消すと x と y の関係式になります。
      円 x = cos t、y = sin t は、cos²t + sin²t = 1 から x² + y² = 1 です（今日の 1 問目）。
    note: x = x(t)、y = y(t)。t を消すと x、y の関係式。
