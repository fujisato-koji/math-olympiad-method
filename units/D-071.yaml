    explain: |-
      円が角 t だけ回ると、地面にふれている点は at だけ進み、円の中心は (at, a) にあります。円の上の点は中心から見て (−a sin t, −a cos t) の所にあるので、x = a(t − sin t)、y = a(1 − cos t) です。
      速度は (a(1 − cos t), a sin t)、速さは a√(2 − 2cos t) = 2a|sin(t/2)| で、t = 0、2π（点が地面にふれる所）で 0 になり、そこでサイクロイドはとがります。
      1 回転分の長さは 8a で、まっすぐ進んだ 2πa より長くなります（6 日目）。
    note: サイクロイド x = a(t − sin t)、y = a(1 − cos t)。高さ 2a、1 回転で 2πa 進む。
