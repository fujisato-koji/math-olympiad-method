    hints:
    - t が dt だけ進むと、x と y がどれだけ動くかを考えます。
    - text: 小さな線分の長さを、三平方の定理で表します。
      svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="160" x2="220" y2="160" stroke="#2f7fc1" stroke-width="3" stroke-linecap="round"/><line x1="220" y1="160" x2="220" y2="50" stroke="#c98512" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="160" x2="220" y2="50" stroke="#d9534f" stroke-width="3" stroke-linecap="round"/><polyline points="209,160 209,149 220,149" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="140" y="182" font-size="15" text-anchor="middle" fill="#2f7fc1" font-weight="bold">dx = x′dt</text><text x="230" y="110" font-size="15" text-anchor="start" fill="#c98512" font-weight="bold">dy = y′dt</text><text x="128" y="92" font-size="15" text-anchor="end" fill="#d9534f" font-weight="bold">?</text><text x="160" y="24" font-size="14" text-anchor="middle" fill="currentColor">t が dt だけ進むとき</text></svg>'
    - 小さな線分を全部足すと、積分になります。
    paths:
    - [x′dt、y′dt, √(x′² + y′²) dt, 積分]
    - [円 x = cos t、y = sin t で試す, √(sin²t + cos²t) = 1, 0 から 2π で 2π]
    explain: 「t が dt だけ動くと、x は x′dt、y は y′dt だけ動く。その小さな線分の長さは √((x′dt)² + (y′dt)²) = √(x′² + y′²) dt。これを足し合わせたものが曲線の長さ。」と書ければよい。① 小さな線分、② 三平方の定理、③ 積分で足す。子どもには、円で確かめさせます。
