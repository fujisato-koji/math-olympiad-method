    explain: |-
      極座標は、原点からのきょりと角で点を表します。r が一定なら円、θ が一定なら原点を通る直線です（r が負のときは、θ の向きと反対の向きに −r だけ進んだ点とみなす。r ≧ 0 だけなら原点から出る半直線になる）。
      r² = x² + y²、r cos θ = x、r sin θ = y を使うと、x、y の式に直せます。r = 2cos θ は、x² + y² = 2x、つまり (x − 1)² + y² = 1 の円です。
    note: x = r cos θ、y = r sin θ。r が一定なら円、θ が一定なら直線（r は負の数もとる）。
