# D-071 媒介変数表示と曲線
#
# 段 6・水準 3・8 日。前提は D-005（微分の計算）、G-025（三角関数）、G-027（ベクトル）。
# 媒介変数表示、速度と道のり、曲線の長さ、サイクロイド、極座標と曲線を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: D-071
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          媒介変数表示：x = x(t)、y = y(t) と、t を使って曲線を表します。
          円：x = cos t、y = sin t（0 ≦ t < 2π）。
          直線：x = t、y = 2t。放物線：x = t、y = t²。
          t を消去すると、x と y の関係式になります。
        explain: |-
          【定義】媒介変数表示は、点の位置を t の関数として表す方法です。
          円 x=cos t、y=sin t は、x²+y²=1 を満たします。
          直線 x=t、y=2t は、y=2x です。
          t を消すと、なじみのある式になります。
        note: x=x(t)、y=y(t)。t を消すと x,y の関係式。
      - part: 今日
        text: x = cos t、y = sin t が表す曲線はどれですか。
        choices: [円, 直線, 放物線, 楕円]
        answer: 円
        check: "'円'"
        hints:
          - x²+y² を計算します。
          - cos²t + sin²t を考えます。
          - 半径 1 の円になります。
        paths:
          - [x²+y², cos²+sin²=1, 円]
      - part: 今日
        text: x = t、y = 2t が表す曲線はどれですか。
        choices: ["直線 y = 2x", "放物線 y = x²", "円", "双曲線"]
        answer: "直線 y = 2x"
        check: "'直線 y = 2x'"
        hints:
          - t を消します。
          - x=t を y=2t に入れます。
          - y と x の関係を書きます。
        paths:
          - [t=x, y=2x, 直線]
      - part: 挑戦
        text: x = t、y = t² が表す曲線はどれですか。
        choices: ["放物線 y = x²", "直線 y = x", "円", "双曲線"]
        answer: "放物線 y = x²"
        check: "'放物線 y = x²'"
        hints:
          - t を消します。
          - x=t を y=t² に入れます。
          - y と x の関係を書きます。
        paths:
          - [t=x, y=x², 放物線]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          速度ベクトル：(x'(t), y'(t))。速さは √(x'² + y'²)。
          道のりは、速さを時間で積分したものです。
          例：x=t、y=t² なら、速度 (1, 2t)、速さ √(1+4t²)。
          t=1 での速度は (1, 2)、速さは √5。
        explain: |-
          媒介変数表示の曲線では、t を時間とみると、速度は (x', y') です。
          速さは速度ベクトルの長さ。道のりは速さの積分です。
          円 x=cos t、y=sin t は、速度 (−sin t, cos t)、速さ 1 です。
        note: 速度 (x',y')、速さ √(x'²+y'²)。道のりは速さの積分。
      - part: 今日
        text: x = t、y = t² の t=1 での速度ベクトルはどれですか。
        choices: ["(1, 2)", "(2, 1)", "(1, 1)", "(0, 2)"]
        answer: "(1, 2)"
        check: "'(1, 2)'"
        hints:
          - x' と y' を求めます。
          - t=1 を入れます。
          - 成分を並べます。
        paths:
          - [x'=1、y'=2t, t=1, (1,2)]
      - part: 今日
        text: x = t、y = t² の t=1 での速さはどれですか。
        choices: ["√5", "5", "√3", "3"]
        answer: "√5"
        check: "'√5'"
        hints:
          - 速度の成分を求めます。
          - 速さは √(x'²+y'²) です。
          - 成分を入れます。
        paths:
          - [(1,2), √(1+4), √5]
      - part: 挑戦
        text: 円 x = cos t、y = sin t の速さはいくつですか。
        choices: [1, 2, π, "2π"]
        answer: 1
        check: "1"
        hints:
          - x' と y' を求めます。
          - √(x'²+y'²) を計算します。
          - sin²+cos² を使います。
        paths:
          - [x'=−sin t、y'=cos t, √(sin²+cos²), 1]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          曲線の長さ：媒介変数表示 x(t)、y(t)（a ≦ t ≦ b）の長さは
          L = ∫(a→b) √(x'² + y'²) dt。
          円 x=a cos t、y=a sin t（0 ≦ t < 2π）の長さは 2πa。
          直線 x=3t、y=4t（0 ≦ t ≦ 2）の速さは 5 なので、長さは 10。
        explain: |-
          曲線の長さは、小さな線分の長さ √(dx²+dy²) を足し合わせたものです。
          dx=x' dt、dy=y' dt なので、√(x'²+y'²) dt を積分します。
          円の速さは一定なので、速さ × 時間で長さが出ます。
        note: L=∫√(x'²+y'²)dt。円は 2πa、直線は速さ×時間。
      - part: 今日
        text: 半径 2 の円 x=2cos t、y=2sin t の長さはいくつですか。
        choices: ["2π", "4π", "8π", "π"]
        answer: "4π"
        check: "'4π'"
        hints:
          - 半径 a の円の長さは 2πa です。
          - a=2 を入れます。
          - 2π×2 を計算します。
        paths:
          - [2πa, a=2, 4π]
      - part: 今日
        text: x=3t、y=4t（0 ≦ t ≦ 2）の曲線の長さはいくつですか。
        choices: [5, 10, 14, 20]
        answer: 10
        check: "10"
        hints:
          - 速度を求めます。
          - 速さを求めます。
          - 速さ×時間で長さを出します。
        paths:
          - [速度 (3,4), 速さ 5, 5×2=10]
      - part: 挑戦
        text: 曲線の長さの式はどれですか。
        choices: ["∫√(x'²+y'²)dt", "∫(x'+y')dt", "∫√(x²+y²)dt", "∫(x'²+y'²)dt"]
        answer: "∫√(x'²+y'²)dt"
        check: "\"∫√(x'²+y'²)dt\""
        hints:
          - 小さな線分の長さを考えます。
          - √(dx²+dy²) を足します。
          - x' dt、y' dt を入れます。
        paths:
          - [√(dx²+dy²), dx=x'dt、dy=y'dt, √(x'²+y'²)dt]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          サイクロイド：半径 a の円が直線上を転がるとき、円上の 1 点が描く曲線。
          x = a(t − sin t)、y = a(1 − cos t)。
          速度は (a(1−cos t), a sin t)、速さは a√(2−2cos t) = 2a|sin(t/2)|。
          1 回転分（0 ≦ t ≦ 2π）の長さは 8a。
        explain: |-
          サイクロイドは、転がる円の 1 点の軌跡です。
          速さは t=0 と t=2π で 0、t=π で最大 2a。
          1 回転分の長さは 8a で、円の円周 2πa より長くなります。
        note: サイクロイド x=a(t−sin t)、y=a(1−cos t)。1 回転の長さ 8a。
      - part: 今日
        text: サイクロイド x=a(t−sin t)、y=a(1−cos t) の速度はどれですか。
        choices: ["(a(1−cos t), a sin t)", "(a sin t, a cos t)", "(a cos t, a sin t)", "(a, a)"]
        answer: "(a(1−cos t), a sin t)"
        check: "'(a(1−cos t), a sin t)'"
        hints:
          - x を t で微分します。
          - y を t で微分します。
          - 成分を並べます。
        paths:
          - [x'=a(1−cos t), y'=a sin t, 速度]
      - part: 今日
        text: 半径 a のサイクロイドの 1 回転分の長さはいくつですか。
        choices: [2a, 4a, 8a, 2πa]
        answer: "8a"
        check: "'8a'"
        hints:
          - サイクロイドの長さの公式を おもいだします。
          - 1 回転分は 0 から 2π までです。
          - 1 回転分の長さの公式を おもいだそう。
        paths:
          - [0 から 2π, 長さ 8a]
      - part: 挑戦
        text: サイクロイドの速さが 0 になるのはどんなときですか。
        choices: ["t=0 と t=2π", "t=π", "いつも", "t=π/2"]
        answer: "t=0 と t=2π"
        check: "'t=0 と t=2π'"
        hints:
          - 速さの式を 0 とおきます。
          - sin(t/2)=0 となる t を考えます。
          - 0 と 2π です。
        paths:
          - [速さ 2a|sin(t/2)|, sin(t/2)=0, t=0、2π]
    extra: []

  - day: 5
    items:
      - part: 見本
        text: |-
          極座標と曲線：r = r(θ) のとき、x = r cos θ、y = r sin θ。
          円 r = a は、x²+y²=a²。
          螺旋 r = θ は、θ が増えるほど遠くへ回ります。
          極方程式は、原点からの距離 r と角度 θ で曲線を表します。
        explain: |-
          極座標は、原点からの距離と角度で点を表します。
          r=一定 なら円、θ=一定 なら直線。
          r=2cosθ は、x²+y²=2x、つまり (x−1)²+y²=1 の円です。
        note: x=r cosθ、y=r sinθ。r=一定は円、θ=一定は直線。
      - part: 今日
        text: 極方程式 r = 2 が表す曲線はどれですか。
        choices: [円, 直線, 放物線, 螺旋]
        answer: 円
        check: "'円'"
        hints:
          - r は原点からの距離です。
          - 距離がいつも 2 の点を考えます。
          - 半径 2 の円です。
        paths:
          - [r=距離, いつも 2, 円]
      - part: 今日
        text: 極方程式 θ = π/4 が表す曲線はどれですか。
        choices: [直線, 円, 放物線, 螺旋]
        answer: 直線
        check: "'直線'"
        hints:
          - θ は角度です。
          - 角度がいつも同じ点を考えます。
          - 原点を通る直線です。
        paths:
          - [θ=角度, いつも同じ, 直線]
      - part: 挑戦
        text: r = 2cosθ が表す曲線はどれですか。
        choices: ["円 (x−1)²+y²=1", "円 x²+y²=2", "直線 y=x", "螺旋"]
        answer: "円 (x−1)²+y²=1"
        check: "'円 (x−1)²+y²=1'"
        hints:
          - r²=2r cosθ と変形します。
          - x=r cosθ、r²=x²+y² を使います。
          - 平方完成します。
        paths:
          - [r²=2r cosθ, x²+y²=2x, (x−1)²+y²=1]
    extra: []

  - day: 6
    items:
      - part: わけ
        text: 曲線の長さが ∫√(x'²+y'²)dt になるわけを説明しましょう。
        explain: 「t が dt だけ動くと、x は x'dt、y は y'dt だけ動く。その小さな線分の長さは √((x'dt)²+(y'dt)²) = √(x'²+y'²) dt。これを足し合わせたものが曲線の長さ。」と書ければよい。① 小さな線分、② 三平方の定理、③ 積分で足す。子どもには、円で確かめさせます。
        hints:
          - t の小さな変化で、x と y がどれだけ動くか を考えます。
          - 小さな線分の長さを 三平方の定理で表します。
          - 足し合わせます。
        paths:
          - [x'dt、y'dt, √(x'²+y'²)dt, 積分]
      - part: わけ
        text: サイクロイドの 1 回転分の長さが 8a になるわけを説明しましょう。
        explain: 「サイクロイドの速さは 2a|sin(t/2)|。0 から 2π まで積分すると、∫2a sin(t/2)dt = 8a。円の円周 2πa より長いのは、点が回りながら進むため。」と書ければよい。① 速さの式、② 積分、③ 8a。子どもには、a=1 のサイクロイドで確かめさせます。
        hints:
          - サイクロイドの速さを求めます。
          - 0 から 2π まで積分します。
          - 積分の結果を整理します。
        paths:
          - [速さ 2a sin(t/2), 積分, 8a]
      - part: わけ
        text: 極方程式 r = 2cosθ が円になるわけを説明しましょう。
        explain: 「r=2cosθ の両辺に r をかけると r²=2r cosθ。x=r cosθ、r²=x²+y² を使うと、x²+y²=2x。平方完成すると (x−1)²+y²=1。だから円。」と書ければよい。① r をかける、② x,y に直す、③ 平方完成。子どもには、θ をいくつか入れて確かめさせます。
        hints:
          - 両辺に r をかけます。
          - x=r cosθ、r²=x²+y² を使います。
          - 平方完成します。
        paths:
          - [r²=2r cosθ, x²+y²=2x, (x−1)²+y²=1]

