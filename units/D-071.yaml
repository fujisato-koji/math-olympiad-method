ntColor" stroke-width="1.2"/><line x1="52" y1="126.4" x2="88" y2="126.4" stroke="#2f7fc1" stroke-width="2.4" stroke-linecap="round"/><line x1="88" y1="126.4" x2="88" y2="89.3" stroke="#c98512" stroke-width="2.4" stroke-linecap="round"/><text x="84" y="28" font-size="13" text-anchor="middle" fill="currentColor">曲線を小さな線分に分ける</text><text x="84" y="192" font-size="13" text-anchor="middle" fill="currentColor">線分の長さを足す</text><line x1="52" y1="126.4" x2="186" y2="160" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="88" y1="89.3" x2="276" y2="76" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="186" y1="160" x2="276" y2="160" stroke="#2f7fc1" stroke-width="3" stroke-linecap="round"/><line x1="276" y1="160" x2="276" y2="76" stroke="#c98512" stroke-width="3" stroke-linecap="round"/><line x1="186" y1="160" x2="276" y2="76" stroke="#d9534f" stroke-width="3" stroke-linecap="round"/><polyline points="266,160 266,150 276,150" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="231" y="180" font-size="15" text-anchor="middle" fill="#2f7fc1" font-weight="bold">x′dt</text><text x="282" y="124" font-size="15" text-anchor="start" fill="#c98512" font-weight="bold">y′dt</text><text x="232" y="56" font-size="14" text-anchor="middle" fill="#d9534f" font-weight="bold">√(x′² + y′²) dt</text></svg>'
    explain: |-
      曲線の長さは、小さな線分の長さ √(dx² + dy²) を足し合わせたものです。dx = x′dt、dy = y′dt なので、√(x′² + y′²) dt を積分します。
      速さが一定なら、速さ × 時間で長さが出ます。半径 a の円 x = a cos t、y = a sin t（0 ≦ t < 2π）は速さ a で時間 2π なので、長さ 2πa です。
    note: L = ∫√(x′² + y′²)dt。速さが一定なら速さ × 時間。
