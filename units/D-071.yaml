# D-071 媒介変数表示と曲線
#
# 水準 4・8 日。前提は D-005（微分の計算）、G-025（三角関数）、G-027（ベクトル）。
# 媒介変数表示、速度と道のり、曲線の長さ、サイクロイド、極座標と曲線を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図とイラストの多い形に直した（D-131、直す係 3）：見本 5 つすべてに図（t の表と点、速度の矢印、小さな線分の三角形、転がる円、極座標）。
#   答える問題も図を見て解く形にし（t の表をうめて点を打つ、方眼で矢印を読む、ア〜エの図から選ぶ）、ヒントの 1〜2 段に図を付けた。
#   7・8 日目と腕だめしは、前の日のくり返しだったので、数や場面を変えた新しい問題にした（D-191、id を消した）。

id: D-071
days:
- day: 1
  items:
  - part: 見本
    id: "82ee97a1b0"
    text: |-
      x = x(t)、y = y(t) のように、点の位置を t を使って表すしかたを媒介変数表示といい、t を媒介変数といいます。
      t を 0、1、2 と動かして点を打つと、点が通る線が見えてきます（図）。
      図は x = t + 1、y = 2t です。x の式から t = x − 1。これを y の式に入れて t を消すと y = 2x − 2 となり、直線だとわかります。
