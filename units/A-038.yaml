        answer: x ≧ 4
        check: "[c for c, g in {'x ≧ 4': lambda x: x >= 4, 'x ≧ −4': lambda x: x >= -4, 'x ≦ 4': lambda x: x <= 4, 'x ≧ 0': lambda x: x >= 0}.items() if all(g(x) == (x - 4 >= 0) for x in [Fraction(k, 2) for k in range(-20, 21)])][0]"
        hints:
          - √ の中が 0 以上になる範囲です。
          - x − 4 は x = 4 で 0 になります。
          - 傾きが正なので、4 より右で正になります。
        paths:
          - [x − 4 は x = 4 で 0, 傾きが正, 定義域は x ≧ 4]
