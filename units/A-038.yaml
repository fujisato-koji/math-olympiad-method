      - part: 挑戦
        id: "d8f7a6ff5c"
        text: 分数関数 y = (2x + 1)/(x − 1) のグラフの漸近線はどれですか。
        choices: [x = 1 と y = 2, x = 1 と y = 3, x = −1 と y = 2, x = 2 と y = 1]
        answer: x = 1 と y = 2
        check: "[c for c, (p, q) in {'x = 1 と y = 2': (1, 2), 'x = 1 と y = 3': (1, 3), 'x = −1 と y = 2': (-1, 2), 'x = 2 と y = 1': (2, 1)}.items() if p - 1 == 0 and abs((2 * 10 ** 6 + 1) / (10 ** 6 - 1) - q) < 1e-5][0]"
        hints:
          - 分子 2x + 1 を、2(x − 1) + □ の形に書きかえましょう（A-037）。
          - text: テープで見ると、2x + 1 は (x − 1) 2 つ分と □ です。2(x − 1) = 2x − 2 とくらべましょう。
            svg: '<svg viewBox="0 0 320 156" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="22" width="280" height="34" rx="4" fill="#f3c969" fill-opacity=".5" stroke="currentColor" stroke-width="1.5"/><text x="160" y="45" font-size="16" text-anchor="middle" fill="currentColor">2x + 1</text><rect x="20" y="82" width="117" height="34" rx="4" fill="#7fc8f8" fill-opacity=".4" stroke="currentColor" stroke-width="1.5"/><text x="78.5" y="105" font-size="15" text-anchor="middle" fill="currentColor">x − 1</text><rect x="137" y="82" width="117" height="34" rx="4" fill="#7fc8f8" fill-opacity=".4" stroke="currentColor" stroke-width="1.5"/><text x="195.5" y="105" font-size="15" text-anchor="middle" fill="currentColor">x − 1</text><rect x="254" y="82" width="46" height="34" rx="4" fill="#f08080" fill-opacity=".5" stroke="currentColor" stroke-width="1.5"/><text x="277" y="105" font-size="16" text-anchor="middle" fill="currentColor">□</text><line x1="300" y1="16" x2="300" y2="122" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/><text x="160" y="146" font-size="15" text-anchor="middle" fill="currentColor">2x + 1 = (x − 1) が 2 つ + □</text></svg>'
          - x の絶対値を大きくすると、□/(x − 1) は 0 に近づきます。y はどんな数に近づくでしょう。
        paths:
          - [2x + 1 = 2(x − 1) + 3, y = 3/(x − 1) + 2, 漸近線は x = 1 と y = 2]
          - ["x = 1 で分母が 0 になるので、たての漸近線は x = 1", "x = 1001 で y = 2003/1000、x を大きくすると y は 2 に近づく", "漸近線は x = 1 と y = 2"]
        note: 分子の 3（書きかえたあとの数）を横の漸近線とまちがえやすい。x を大きくすると (2x + 1)/(x − 1) は 2 に近づく（x = 1001 で 2003/1000）ことで確かめさせる。
