# A-038 分数関数と無理関数
#
# 書き方は N-001 の頭の注のとおり。段 5 の決まりは A-019 の頭の注と同じ（思い出す 2・今日 2・挑戦 1、わけの深さ ③、各日に予備 3 問）。
#   練習の日は新しい決まりが出るので頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 8 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：分数関数 y = k/x（双曲線、漸近線）、y = k/(x − p) + q は平行移動、y = (ax + b)/(x − p) を標準の形にする（A-037）。
#   2 日目：無理関数 y = √x、y = √(a(x − p))、y = −√x、定義域と値域、平行移動。
#   3 日目：分数関数・無理関数と直線の共有点（分母をはらう、2 乗する）、2 乗して出た解を元の式で確かめる。
#   4 日目：わけ（3 問とも ③：平行移動、y = q の値をとらない、2 乗すると解が増えることがある）。
#   5 日目：A-020、A-037 と混ぜる（変域での最大・最小、√ の中の 2 次式、平行移動と漸近線）。6 日目：確認。
# 前提は A-020（2 次関数）と A-037（分数式）。たどると A-017、A-019、A-016、A-015、A-011、A-012、A-006 まで使える。
#   不等式の性質（A-013）は前提のたどりにないので、分数不等式・無理不等式は扱わない。定義域の「x ≧ −2」は書き方を読むだけにし、
#   √ の中の 1 次式が 0 以上になる範囲は「x = −2 で 0、傾きが正なので右側で正（A-019）」と 1 次関数のグラフで考える。
#   逆関数と合成関数は、題にないので扱わない（地図に受け持つ単元がない。報告に書いた）。
#   関数の極限（D-003）は先取りしないので、漸近線は「x が p に近いと y の絶対値がいくらでも大きくなる、x の絶対値が大きいと y は q に近づく」と
#   表と図で言うだけにし、極限の記号は使わない。
# グラフは svg で描く（方眼の 1 めもり、原点 O、軸に矢印、漸近線は点線。曲線は 120〜160 区間の折れ線で、双曲線は枝ごとに描く）。
#   答えの式や漸近線の式、交点の座標は図に書かない。見本の 2 つのグラフは ①、② の印で式と結ぶ。
# 式・漸近線・定義域は choices。漸近線の check は、選択肢の x = p で分母が 0 になり、x = 10⁶ での値が q に近いものを選ぶ。
#   定義域の check は、選択肢の条件と「√ の中が 0 以上」が、−10〜10 の 1/2 きざみのどの x でも同じ真偽になるものを選ぶ。
#   式を選ぶ check は、平行移動した点や図の格子点を選択肢の式がすべて満たすかで調べる。値を打つ問題は Fraction か math.isclose で求める。
# 分数関数と無理関数は、関数の極限（D-003）、微分（D-004、D-005）、物理の逆 2 乗の法則やレンズの式、濃度や平均の速さのモデルにつながる（D-026）。

