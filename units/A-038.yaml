      - part: 今日
        text: 分数関数 y = 3/(x + 2) − 1 のグラフの漸近線はどれですか。
        choices: [x = −2 と y = −1, x = 2 と y = −1, x = −2 と y = 1, x = 3 と y = −1]
        answer: x = −2 と y = −1
        check: "[c for c, (p, q) in {'x = −2 と y = −1': (-2, -1), 'x = 2 と y = −1': (2, -1), 'x = −2 と y = 1': (-2, 1), 'x = 3 と y = −1': (3, -1)}.items() if p + 2 == 0 and abs(3 / (10 ** 6 + 2) - 1 - q) < 1e-5][0]"
        hints:
          - y = k/(x − p) + q の形と見くらべましょう。
          - x + 2 は x − (−2) です。
          - 漸近線は直線 x = p と直線 y = q です。
        paths:
          - [y = 3/(x − (−2)) + (−1), p = −2、q = −1, 漸近線は x = −2 と y = −1]
        note: x + 2 を見て x = 2 としやすい。分母が 0 になる x が縦の漸近線だと確かめさせる。
      - part: 今日
        text: y = 6/x のグラフを、x 軸方向に −3、y 軸方向に 2 だけ平行移動したグラフの式はどれですか。
        choices: [y = 6/(x + 3) + 2, y = 6/(x − 3) + 2, y = 6/(x + 3) − 2, y = 6/(x + 2) − 3]
        answer: y = 6/(x + 3) + 2
        check: "[c for c, f in {'y = 6/(x + 3) + 2': lambda x: 6 / (x + 3) + 2, 'y = 6/(x − 3) + 2': lambda x: 6 / (x - 3) + 2, 'y = 6/(x + 3) − 2': lambda x: 6 / (x + 3) - 2, 'y = 6/(x + 2) − 3': lambda x: 6 / (x + 2) - 3}.items() if all(f(t - 3) == 6 / t + 2 for t in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 漸近線 x = 0、y = 0 は、どこへ動くでしょう。
          - x 軸方向に −3 動かすと、縦の漸近線は x = −3 になります。
          - 漸近線が x = p、y = q の双曲線は y = k/(x − p) + q です。
        paths:
          - [漸近線は x = −3 と y = 2 に動く, y = 6/(x − (−3)) + 2, y = 6/(x + 3) + 2]
      - part: 挑戦
        text: 分数関数 y = (2x + 1)/(x − 1) のグラフの漸近線はどれですか。
        choices: [x = 1 と y = 2, x = 1 と y = 3, x = −1 と y = 2, x = 2 と y = 1]
        answer: x = 1 と y = 2
        check: "[c for c, (p, q) in {'x = 1 と y = 2': (1, 2), 'x = 1 と y = 3': (1, 3), 'x = −1 と y = 2': (-1, 2), 'x = 2 と y = 1': (2, 1)}.items() if p - 1 == 0 and abs((2 * 10 ** 6 + 1) / (10 ** 6 - 1) - q) < 1e-5][0]"
        hints:
          - 分子 2x + 1 を、2(x − 1) + □ の形に書きかえましょう（A-037）。
          - y = 3/(x − 1) + 2 の形になります。
          - y = k/(x − p) + q の漸近線を読みましょう。
        paths:
          - [2x + 1 = 2(x − 1) + 3, y = 3/(x − 1) + 2, 漸近線は x = 1 と y = 2]
        note: 分子の 3（書きかえたあとの数）を横の漸近線とまちがえやすい。x を大きくすると (2x + 1)/(x − 1) は 2 に近づく（x = 1001 で 2003/1000）ことで確かめさせる。
