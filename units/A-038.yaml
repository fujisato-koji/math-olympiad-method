/text><text x="119" y="9" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">y</text><text x="108" y="137" font-size="13" text-anchor="end" fill="currentColor">O</text><text x="16" y="116" font-size="13" text-anchor="middle" fill="currentColor">−6</text><text x="48" y="116" font-size="13" text-anchor="middle" fill="currentColor">−4</text><text x="80" y="116" font-size="13" text-anchor="middle" fill="currentColor">−2</text><text x="144" y="137" font-size="13" text-anchor="middle" fill="currentColor">2</text><text x="176" y="137" font-size="13" text-anchor="middle" fill="currentColor">4</text><text x="208" y="137" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="240" y="137" font-size="13" text-anchor="middle" fill="currentColor">8</text><text x="107" y="62.5" font-size="13" text-anchor="end" fill="currentColor">4</text><text x="107" y="30.5" font-size="13" text-anchor="end" fill="currentColor">6</text><line x1="112" y1="122" x2="125.2" y2="82.5" stroke="#7fc8f8" stroke-width="3"/><polygon points="128,74 129.8,84.1 120.5,81" fill="#7fc8f8"/><circle cx="128" cy="74" r="3.5" fill="#f08080"/><text x="216" y="108.1" font-size="16" text-anchor="middle" fill="currentColor">①</text><text x="216" y="59.2" font-size="16" text-anchor="middle" fill="currentColor">②</text><text x="133" y="22.8" font-size="13" text-anchor="start" fill="currentColor">x = 1</text><text x="18" y="69" font-size="13" text-anchor="start" fill="currentColor">y = 3</text></g></svg>'
        explain: 反比例 y = k/x（k は 0 でない数、A-006）のグラフは、双曲線とよばれる 2 つの曲線です。x が 0 に近いと y の絶対値はいくらでも大きくなり、x の絶対値が大きくなると y は 0 に近づきます。グラフが限りなく近づく直線を漸近線といい、y = k/x の漸近線は x 軸と y 軸です。k が正なら第 1、第 3 象限に、負なら第 2、第 4 象限にあります。② の y = 2/(x − 1) + 3 は、x − 1 = t とおくと y − 3 = 2/t なので、① を x 軸方向に 1、y 軸方向に 3 だけ平行移動したグラフです（A-020 の放物線と同じ考え。わけは 4 日目）。漸近線も動いて、直線 x = 1 と直線 y = 3 になります。いっぱんに、y = k/(x − p) + q のグラフは、y = k/x のグラフを x 軸方向に p、y 軸方向に q だけ平行移動した双曲線で、漸近線は直線 x = p と直線 y = q です。x のとりうる値の範囲を定義域、y のとりうる値の範囲を値域といい、この関数の定義域は x ≠ p、値域は y ≠ q です。x の《分数》式で表される関数を分数関数といいます。y = (3x − 1)/(x − 2) のような式は、分子を 3(x − 2) + 5 と書きかえて y = 5/(x − 2) + 3 の形にすると（A-037）、グラフがわかります。
