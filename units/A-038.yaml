        id: "2f57506e0d"
        text: 方程式 √(x + 2) = x を、両辺を 2 乗して解くと x = 2、−1 が出ますが、x = −1 は解ではありません。2 乗すると解でない数が出てくることがあるわけを、すじ道を立てて書きましょう。
        explain: 例：「A、B を数とする。A = B ならば、両辺を 2 乗して A² = B² である。しかし逆に、A² = B² ならば A² − B² = (A + B)(A − B) = 0（A-015）なので、A = B または A = −B である。つまり、2 乗した方程式 x + 2 = x² の解は、√(x + 2) = x の解と、√(x + 2) = −x の解を合わせたものになる。x = −1 は √(−1 + 2) = 1 = −(−1) なので、√(x + 2) = −x の解であって、√(x + 2) = x の解ではない。よって、2 乗して出た数は、元の式に代入して確かめる必要がある。」と書ければよい。①「〜とする」で A、B を決める、② A² = B² を (A + B)(A − B) = 0 と変形する、③ 約束した事実（AB = 0 ならば A = 0 または B = 0、A-017）で結ぶ、の 3 つがそろっているかを見る。「A = B ならば A² = B²」は正しいが、逆は正しくないことが要点。3 日目の見本の図（点線の y = −√(x + 2) と直線の交点が (−1, −1)）と結びつける。√ の値は 0 以上なので、右辺 x が負の解はのぞいてよい、という確かめ方も話す。
        hints:
          - A = B ならば A² = B² は正しいでしょうか。逆はどうでしょう。
          - A² = B² を、A² − B² = 0 と変形して因数分解しましょう。
