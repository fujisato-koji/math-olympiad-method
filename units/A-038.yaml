        explain: 共有点では 2 つの式の y が等しいので、2/(x − 1) = x − 2 を解きます。両辺に x − 1 をかけると 2 = (x − 1)(x − 2)、x² − 3x = 0、x(x − 3) = 0 で、x = 0、3 です。どちらも x = 1 ではないので分母は 0 にならず、共有点は (0, −2) と (3, 1) です。次に、√(x + 2) = x の両辺を 2 乗すると x + 2 = x²、x² − x − 2 = 0、(x − 2)(x + 1) = 0 で、x = 2、−1 です。ところが x = −1 を元の式に入れると、左辺は √1 = 1、右辺は −1 で、等しくありません。2 乗した式 x + 2 = x² は、√(x + 2) = x の解だけでなく、−√(x + 2) = x の解もふくむからです（図の点線と直線の交点、わけは 4 日目）。よって解は x = 2 だけです。√ をふくむ方程式（無理方程式）を 2 乗して解いたときは、出てきた解を必ず元の式に代入して確かめます。√ の値は 0 以上なので、右辺の x も 0 以上でなければならない、と考えて x = −1 を除いてもかまいません。図で見ても、y = √(x + 2) と y = x の共有点はただ 1 つです。
