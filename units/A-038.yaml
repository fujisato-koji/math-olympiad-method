          - 出てきた解を、元の式に代入して確かめましょう。
        paths:
          - [x + 6 = x², x² − x − 6 = 0 で x = 3、−2, x = −2 は √4 = 2 で右辺の −2 と等しくない, 解は x = 3]
        note: x = −2 も答えにしやすい。2 乗した式の解をそのまま答えにせず、元の式で確かめる習慣をつけさせる。
      - part: 挑戦
        text: 曲線 y = 1/(x − 1) + 2 と直線 y = −x + k の共有点がただ 1 つになる k は 2 つあります。そのうち大きいほうはいくつですか。
        answer: 5
        check: "max(k for k in range(-20, 21) if (1 - k) ** 2 - 4 * (k - 1) == 0 and Fraction(k - 1, 2) != 1)"
        hints:
          - 2 つの式の y を等しいとおき、両辺に x − 1 をかけましょう。
          - 整理すると、x の 2 次方程式になります。
          - 解がただ 1 つになるのは、b² − 4ac = 0 のときです（A-017）。
        paths:
          - [1/(x − 1) + 2 = −x + k の両辺に x − 1 をかけて整理すると x² + (1 − k)x + k − 1 = 0, b² − 4ac = (k − 1)² − 4(k − 1) = (k − 1)(k − 5), (k − 1)(k − 5) = 0 で k = 1、5, 大きいほうは 5]
          - [X = x − 1、Y = y − 2 とおくと曲線は Y = 1/X、直線は Y = −X + (k − 3), 1/X = −X + m は X² − mX + 1 = 0 で m = ±2 のとき 1 つ, k − 3 = 2 より k = 5]
        note: k = 5 のとき共有点は (2, 3)、k = 1 のとき (0, 1)。どちらも x = 1（分母が 0）ではないので、ほんとうに共有点になる。2 本目は平行移動で y = 1/x にもどす道。
