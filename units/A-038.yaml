  - part: 離
    kinds: [総動員, 読み取り]
    uses: [A-007]
    text: 濃度 20 % の食塩水 300 g に、濃度 5 % の食塩水を x g 混ぜると、濃度が y % の食塩水になります。y は x の分数関数です。y = 8 になるのは、x がいくつのときですか。
    answer: 1200
    check: "[x for x in range(0, 5001) if Fraction(300 * 20 + 5 * x, 300 + x) == 8][0]"
    hints:
      - 食塩の重さは、食塩水の重さ × 濃度 ÷ 100 だね（A-007）。混ぜたあとの食塩と食塩水の重さを x で表そう。
      - y = (食塩の重さ) ÷ (食塩水の重さ) × 100 を、x の分数式で書こう。
      - y = 8 とおいて、分母をはらって解こう。
    paths:
      - [食塩は 60 + 0.05x g、食塩水は 300 + x g, y = (6000 + 5x)/(300 + x), (6000 + 5x)/(300 + x) = 8 より 6000 + 5x = 2400 + 8x, 3x = 3600 で x = 1200]
    note: 濃度の式（A-007）を立てる読み取りが鍵。y = 5 + 4500/(300 + x) と書きかえると、x をどれだけ大きくしても y は 5 % より大きいまま、横の漸近線が y = 5 であることもわかる（混ぜる食塩水の濃度に近づく）。
