        text: 分数関数 y = k/(x − p) + q（k は 0 でない数）は、y = q という値をとりません。このわけを、筋道を立てて書きましょう。
        explain: 例：「x を p でないどんな数でもよいとする。y − q = k/(x − p) である。k は 0 でないので、k/(x − p) は 0 にならない（0 でない数を 0 でない数でわった商は 0 でない、N-027）。よって y − q は 0 にならず、y は q と等しくならない。したがって、y = k/(x − p) + q は y = q という値をとらない。」と書ければよい。①「〜とする」で x を決める（x は p でない）、② y − q = k/(x − p) と式を変形する、③ 約束した事実（0 でない数どうしの商は 0 でない）で結ぶ、の 3 つがそろっているかを見る。「y = q とすると k/(x − p) = 0 となり、両辺に x − p をかけると k = 0 で、k が 0 でないことに反する」と、y = q と仮定して矛盾を出す書き方でもよい。値域が y ≠ q になること、横の漸近線が y = q であることの裏づけになると話す。y = 3/(x − 1) + 2 で、y = 2 となる x をさがさせると、3/(x − 1) = 0 となる x がないことで確かめられる。
