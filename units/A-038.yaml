    hints:
      - P の x 座標を 2 + a（a は正の数）とおくと、長方形の 2 辺の長さは a で表せるね。
      - 2 辺の長さは a と 6/a だよ。面積はいつも同じだね。周の長さは 2(a + 6/a)。
      - a + 6/a を、(√a − √(6/a))² + □ の形に変えてみよう。2 乗は 0 以上だね。
    paths:
      - [漸近線は x = 2 と y = 1, P の x 座標を 2 + a とすると PA = a、PB = 6/a, a + 6/a = (√a − √(6/a))² + 2√6, √a = √(6/a) つまり a = √6 のとき最小で 周の長さは 2 × 2√6 = 4√6]
    note: 長方形の面積は P によらず 6 で一定、周の長さは a + 6/a の最小になる。平方完成（A-020）の考えを √ の式に使うのが道筋のかなめ（相加平均と相乗平均の不等式 A-025 の入口）。12 は a = 2 や a = 3 のときの値で、最小ではない。
