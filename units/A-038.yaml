        text: 分数関数 y = k/(x − p) + q（k は 0 でない数）のグラフは、y = k/x のグラフを x 軸方向に p、y 軸方向に q だけ平行移動したものです。このわけを、筋道を立てて書きましょう。
        explain: 例：「y = k/x のグラフの上の点を (s, k/s) とする（s は 0 でないどんな数でもよい）。この点を x 軸方向に p、y 軸方向に q だけ動かした点は (s + p, k/s + q) である。X = s + p とおくと s = X − p なので、この点の y 座標は k/(X − p) + q となり、点 (X, k/(X − p) + q) は y = k/(x − p) + q のグラフの上にある。逆に、y = k/(x − p) + q のグラフの上の点 (X, Y) では X − p は 0 でなく、s = X − p とおくと Y = k/s + q なので、y = k/x の上の点 (s, k/s) を動かした点である。よって、2 つのグラフは平行移動でちょうど重なる。」と書ければよい。①「〜とする」で点 (s, k/s) を決める、② 動かした点の座標を X で表す（s = X − p と式を変形する）、③ 約束した事実（点がグラフの上にあることと座標が式を満たすことは同じ、A-020 の放物線の平行移動と同じ筋道）で結ぶ、の 3 つがそろっているかを見る。s が 0 でないこと（X が p でないこと）を書けていれば、漸近線 x = p も一緒に動くことに気づける。漸近線 y = 0 が y = q に動くことにも触れる。
