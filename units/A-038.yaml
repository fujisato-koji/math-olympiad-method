        id: "3e45985672"
        text: 曲線 y = 2/(x − 1) と直線 y = x − 2 の共有点を求めてみましょう（左の図）。また、方程式 √(x + 2) = x を解いてみましょう（右の図）。右の図の点線は y = −√(x + 2) で、白い丸は 2 乗したときだけ出てくる点です。
        svg: '<svg viewBox="0 0 296 192" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0 0)"><path d="M20 128V18M40 128V18M60 128V18M80 128V18M100 128V18M120 128V18M10 128H120M10 108H120M10 88H120M10 68H120M10 48H120M10 28H120" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="1"/><line x1="4" y1="68" x2="128" y2="68" stroke="currentColor" stroke-width="2"/><polygon points="136,68 128,63.5 128,72.5" fill="currentColor"/><line x1="40" y1="134" x2="40" y2="10" stroke="currentColor" stroke-width="2"/><polygon points="40,2 35.5,10 44.5,10" fill="currentColor"/><line x1="60" y1="128" x2="60" y2="18" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4"/><polyline points="10,84 17.6,86.9 24.1,90.3 29.6,94.3 34.2,99 38.1,104.6 41.4,111.1 44.2,118.8 46.7,128" fill="none" stroke="#f08080" stroke-width="3" stroke-linejoin="round"/><polyline points="76,18 78.9,25.6 82.3,32.1 86.2,37.5 91,42.2 96.6,46.1 103.1,49.4 110.9,52.3 120,54.7" fill="none" stroke="#f08080" stroke-width="3" stroke-linejoin="round"/><line x1="20" y1="128" x2="120" y2="28" stroke="currentColor" stroke-width="2.5"/><text x="138" y="73" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">x</text><text x="47" y="9" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">y</text><text x="36" y="83" font-size="13" text-anchor="end" fill="currentColor">O</text><text x="83" y="83" font-size="13" text-anchor="start" fill="currentColor">2</text><text x="100" y="83" font-size="13" text-anchor="middle" fill="currentColor">3</text><text x="120" y="83" font-size="13" text-anchor="middle" fill="currentColor">4</text><text x="35" y="52.5" font-size="13" text-anchor="end" fill="currentColor">1</text><text x="35" y="32.5" font-size="13" text-anchor="end" fill="currentColor">2</text><circle cx="40" cy="108" r="4" fill="currentColor"/><circle cx="100" cy="48" r="4" fill="currentColor"/><text x="73" y="161" font-size="13" text-anchor="middle" fill="currentColor">赤：y = 2/(x − 1)</text><text x="73" y="182" font-size="13" text-anchor="middle" fill="currentColor">黒：y = x − 2</text></g><g transform="translate(156 10)"><path d="M14 118V18M34 118V18M54 118V18M74 118V18M94 118V18M114 118V18M10 118H114M10 98H114M10 78H114M10 58H114M10 38H114M10 18H114" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="1"/><line x1="4" y1="78" x2="122" y2="78" stroke="currentColor" stroke-width="2"/><polygon points="130,78 122,73.5 122,82.5" fill="currentColor"/><line x1="54" y1="124" x2="54" y2="10" stroke="currentColor" stroke-width="2"/><polygon points="54,2 49.5,10 58.5,10" fill="currentColor"/><polyline points="14,78 14.3,80.5 15.3,83 19,88 25.3,93 34,98 45.2,103 59,108 75.2,113 94,118" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" stroke-opacity=".7" stroke-linejoin="round"/><polyline points="14,78 14.4,75.3 15.6,72.4 17.5,69.6 20.3,66.8 28.1,61.2 39,55.6 53.1,50 70.2,44.5 90.6,38.9 114,33.3" fill="none" stroke="#f08080" stroke-width="3" stroke-linejoin="round"/><line x1="14" y1="118" x2="114" y2="18" stroke="currentColor" stroke-width="2.5"/><text x="132" y="83" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">x</text><text x="61" y="9" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">y</text><text x="58" y="93" font-size="13" text-anchor="start" fill="currentColor">O</text><text x="77" y="93" font-size="13" text-anchor="start" fill="currentColor">1</text><text x="94" y="93" font-size="13" text-anchor="middle" fill="currentColor">2</text><text x="114" y="93" font-size="13" text-anchor="middle" fill="currentColor">3</text><text x="49" y="122.5" font-size="13" text-anchor="end" fill="currentColor">−2</text><text x="49" y="42.5" font-size="13" text-anchor="end" fill="currentColor">2</text><circle cx="94" cy="38" r="4.5" fill="#f08080"/><circle cx="34" cy="98" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><text x="70" y="151" font-size="13" text-anchor="middle" fill="currentColor">赤：y = √(x + 2)</text><text x="70" y="172" font-size="13" text-anchor="middle" fill="currentColor">黒：y = x</text></g><line x1="151" y1="8" x2="151" y2="184" stroke="currentColor" stroke-opacity=".3" stroke-width="1"/></svg>'
        explain: 共有点では 2 つの式の y が等しいので、2/(x − 1) = x − 2 を解きます。両辺に x − 1 をかけると 2 = (x − 1)(x − 2)、x² − 3x = 0、x(x − 3) = 0 で、x = 0、3 です。どちらも x = 1 ではないので分母は 0 にならず、共有点は (0, −2) と (3, 1) です。次に、√(x + 2) = x の両辺を 2 乗すると x + 2 = x²、x² − x − 2 = 0、(x − 2)(x + 1) = 0 で、x = 2、−1 です。ところが x = −1 を元の式に入れると、左辺は √1 = 1、右辺は −1 で、等しくありません。2 乗した式 x + 2 = x² は、√(x + 2) = x の解だけでなく、−√(x + 2) = x の解もふくむからです（図の点線と直線の交点、わけは 4 日目）。よって解は x = 2 だけです。√ をふくむ方程式（無理方程式）を 2 乗して解いたときは、出てきた解を必ず元の式に代入して確かめます。√ の値は 0 以上なので、右辺の x も 0 以上でなければならない、と考えて x = −1 をのぞいてもかまいません。図で見ても、y = √(x + 2) と y = x の共有点はただ 1 つです。
