        id: "cd4270b44a"
        text: y = √x（①、黒）と y = √(2x + 4)（②、赤）のグラフをくらべてみましょう。どちらのグラフも、√ の中が 0 になる点（はしの点）から右へのびます。
        svg: '<svg viewBox="0 0 262 160" xmlns="http://www.w3.org/2000/svg"><path d="M16 138V18M36 138V18M56 138V18M76 138V18M96 138V18M116 138V18M136 138V18M156 138V18M176 138V18M196 138V18M216 138V18M236 138V18M16 138H236M16 118H236M16 98H236M16 78H236M16 58H236M16 38H236M16 18H236" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="1"/><line x1="10" y1="118" x2="244" y2="118" stroke="currentColor" stroke-width="2"/><polygon points="252,118 244,113.5 244,122.5" fill="currentColor"/><line x1="96" y1="144" x2="96" y2="10" stroke="currentColor" stroke-width="2"/><polygon points="96,2 91.5,10 100.5,10" fill="currentColor"/><polyline points="96,118 96.5,114.8 98.2,111.4 100.9,108.1 104.8,104.8 109.7,101.5 115.7,98.2 131,91.5 150.7,84.9 174.8,78.3 203.2,71.7 236,65.1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-opacity=".55" stroke-linejoin="round"/><polyline points="56,118 56.7,112.8 58.8,107.4 62.3,102.1 67.2,96.8 73.5,91.5 81.3,86.2 90.4,80.9 101,75.6 112.9,70.3 126.3,65 157.2,54.4 193.8,43.8 236,33.1" fill="none" stroke="#f08080" stroke-width="3" stroke-linejoin="round"/><text x="254" y="123" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">x</text><text x="103" y="9" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">y</text><text x="16" y="133" font-size="13" text-anchor="middle" fill="currentColor">−4</text><text x="36" y="133" font-size="13" text-anchor="middle" fill="currentColor">−3</text><text x="76" y="133" font-size="13" text-anchor="middle" fill="currentColor">−1</text><text x="116" y="133" font-size="13" text-anchor="middle" fill="currentColor">1</text><text x="136" y="133" font-size="13" text-anchor="middle" fill="currentColor">2</text><text x="156" y="133" font-size="13" text-anchor="middle" fill="currentColor">3</text><text x="176" y="133" font-size="13" text-anchor="middle" fill="currentColor">4</text><text x="196" y="133" font-size="13" text-anchor="middle" fill="currentColor">5</text><text x="216" y="133" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="236" y="133" font-size="13" text-anchor="middle" fill="currentColor">7</text><text x="91" y="102.5" font-size="13" text-anchor="end" fill="currentColor">1</text><text x="91" y="62.5" font-size="13" text-anchor="end" fill="currentColor">3</text><text x="91" y="42.5" font-size="13" text-anchor="end" fill="currentColor">4</text><circle cx="96" cy="118" r="4" fill="currentColor"/><circle cx="56" cy="118" r="4.5" fill="#f08080"/><text x="220" y="60.2" font-size="16" text-anchor="middle" fill="currentColor">①</text><text x="196" y="32.1" font-size="16" text-anchor="end" fill="currentColor">②</text><text x="49" y="110" font-size="13" text-anchor="end" fill="currentColor">はしの点</text></svg>'
        explain: √ の中に文字をふくむ式を無理式といい、x の無理式で表される関数を無理関数といいます。y = √x は、√ の中が 0 以上でないと値が決まらないので、定義域は x ≧ 0、値域は y ≧ 0 です。x = 0、1、4、9 のとき y = 0、1、2、3 で、グラフは ① のように原点から右上へのびる曲線です。y = √x の両辺を 2 乗すると x = y² なので、① は、x 軸を軸とし原点をちょう点とする放物線 x = y² の、y が 0 以上の部分です。② の y = √(2x + 4) = √(2(x + 2)) は、y = √(2x) のグラフを x 軸方向に −2 だけ平行移動したものです。2x + 4 は x = −2 で 0 になり、傾きが正なので、x が −2 以上のとき 0 以上です（A-019）。よって定義域は x ≧ −2、値域は y ≧ 0 で、グラフは点 (−2, 0) から右へのびます。いっぱんに、y = √(a(x − p)) のグラフは y = √(ax) のグラフを x 軸方向に p だけ平行移動したもので、a が正なら点 (p, 0) から右へ、a が負なら左へのびます。y = −√x のグラフは y = √x を x 軸について対称に移したもので、値域は y ≦ 0 です。y = √x + q なら、y 軸方向に q だけ動きます。
