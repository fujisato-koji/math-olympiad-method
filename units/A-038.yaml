        id: "23fc3f63c9"
        text: 分数関数 y = (3x − 1)/(x + 1) のグラフの漸近線はどれですか。
        choices: [x = −1 と y = 3, x = 1 と y = 3, x = −1 と y = −1, x = −1 と y = −4]
        answer: x = −1 と y = 3
        check: "[c for c, (p, q) in {'x = −1 と y = 3': (-1, 3), 'x = 1 と y = 3': (1, 3), 'x = −1 と y = −1': (-1, -1), 'x = −1 と y = −4': (-1, -4)}.items() if p + 1 == 0 and abs((3 * 10 ** 6 - 1) / (10 ** 6 + 1) - q) < 1e-5][0]"
        hints:
          - 分子 3x − 1 を、3(x + 1) + □ の形に書きかえましょう。
          - text: テープで見ると、3x − 1 は (x + 1) 3 つ分より短くなります。3(x + 1) = 3x + 3 とくらべましょう。
            svg: '<svg viewBox="0 0 320 156" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="22" width="234" height="34" rx="4" fill="#f3c969" fill-opacity=".5" stroke="currentColor" stroke-width="1.5"/><text x="137" y="45" font-size="16" text-anchor="middle" fill="currentColor">3x − 1</text><rect x="20" y="82" width="93.3" height="34" rx="4" fill="#7fc8f8" fill-opacity=".4" stroke="currentColor" stroke-width="1.5"/><text x="66.7" y="105" font-size="15" text-anchor="middle" fill="currentColor">x + 1</text><rect x="113.3" y="82" width="93.3" height="34" rx="4" fill="#7fc8f8" fill-opacity=".4" stroke="currentColor" stroke-width="1.5"/><text x="160" y="105" font-size="15" text-anchor="middle" fill="currentColor">x + 1</text><rect x="206.7" y="82" width="93.3" height="34" rx="4" fill="#7fc8f8" fill-opacity=".4" stroke="currentColor" stroke-width="1.5"/><text x="253.3" y="105" font-size="15" text-anchor="middle" fill="currentColor">x + 1</text><rect x="254" y="22" width="46" height="34" rx="4" fill="#f08080" fill-opacity=".3" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="277" y="45" font-size="16" text-anchor="middle" fill="currentColor">□</text><line x1="300" y1="16" x2="300" y2="122" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/><text x="160" y="146" font-size="15" text-anchor="middle" fill="currentColor">3x − 1 = (x + 1) が 3 つ − □</text></svg>'
          - x の絶対値を大きくすると、□/(x + 1) は 0 に近づきます。y はどんな数に近づくでしょう。
        paths:
