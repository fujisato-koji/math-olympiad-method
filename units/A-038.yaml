        text: 分数関数 y = (2x + 3)/(x + 1) のグラフを、x 軸方向に 1 だけ平行移動したグラフの漸近線はどれですか。
        choices: [x = 0 と y = 2, x = −2 と y = 2, x = 0 と y = 3, x = 1 と y = 2]
        answer: x = 0 と y = 2
