        explain: 反比例 y = k/x（k は 0 でない数、A-006）のグラフは、双曲線とよばれる 2 つの曲線です。x が 0 に近いと y の絶対値はいくらでも大きくなり、x の絶対値が大きくなると y は 0 に近づきます。グラフが限りなく近づく直線を漸近線といい、y = k/x の漸近線は x 軸と y 軸です。k が正なら第 1、第 3 象限に、負なら第 2、第 4 象限にあります。② の y = 2/(x − 1) + 3 は、x − 1 = t とおくと y − 3 = 2/t なので、① を x 軸方向に 1、y 軸方向に 3 だけ平行移動したグラフです（A-020 の放物線と同じ考え。わけは 4 日目）。漸近線も動いて、直線 x = 1 と直線 y = 3 になります。一般に、y = k/(x − p) + q のグラフは、y = k/x のグラフを x 軸方向に p、y 軸方向に q だけ平行移動した双曲線で、漸近線は直線 x = p と直線 y = q です。x のとりうる値の範囲を定義域、y のとりうる値の範囲を値域といい、この関数の定義域は x ≠ p、値域は y ≠ q です。x の分数式で表される関数を分数関数といいます。y = (3x − 1)/(x − 2) のような式は、分子を 3(x − 2) + 5 と書きかえて y = 5/(x − 2) + 3 の形にすると（A-037）、グラフがわかります。
      - part: 思い出す
        text: 放物線 y = (x + 2)² − 1 を、x 軸方向に 3、y 軸方向に −2 だけ平行移動した放物線の頂点はどれですか。
        choices:
          - (1, −3)
          - (−5, −3)
          - (1, 1)
          - (−5, 1)
        answer: (1, −3)
        check: "[c for c, (p, q) in {'(1, −3)': (1, -3), '(−5, −3)': (-5, -3), '(1, 1)': (1, 1), '(−5, 1)': (-5, 1)}.items() if (p, q) == (-2 + 3, -1 - 2)][0]"
        hints:
          - もとの放物線の頂点を読みましょう（A-020）。
          - 頂点を、右へ 3、下へ 2 動かしましょう。
          - x 座標に 3 を、y 座標に −2 を足します。
        paths:
          - ["もとの頂点は (−2, −1)", "(−2 + 3, −1 − 2)", "(1, −3)"]
      - part: 思い出す
        text: y は x に反比例し、x = 2 のとき y = −6 です。x = 3 のとき、y はいくつですか。
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(2 * (-6), 3))"
        hints:
          - 反比例では、x × y がいつも同じ数になります（A-006）。
          - x = 2、y = −6 のとき、x × y はいくつでしょう。
          - 3 × y がその数になる y をさがしましょう。
        paths:
