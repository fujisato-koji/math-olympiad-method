        explain: √ の中に文字をふくむ式を無理式といい、x の無理式で表される関数を無理関数といいます。y = √x は、√ の中が 0 以上でないと値が決まらないので、定義域は x ≧ 0、値域は y ≧ 0 です。x = 0、1、4、9 のとき y = 0、1、2、3 で、グラフは ① のように原点から右上へのびる曲線です。y = √x の両辺を 2 乗すると x = y² なので、① は、x 軸を軸とし原点を頂点とする放物線 x = y² の、y が 0 以上の部分です。② の y = √(2x + 4) = √(2(x + 2)) は、y = √(2x) のグラフを x 軸方向に −2 だけ平行移動したものです。2x + 4 は x = −2 で 0 になり、傾きが正なので、x が −2 以上のとき 0 以上です（A-019）。よって定義域は x ≧ −2、値域は y ≧ 0 で、グラフは点 (−2, 0) から右へのびます。一般に、y = √(a(x − p)) のグラフは y = √(ax) のグラフを x 軸方向に p だけ平行移動したもので、a が正なら点 (p, 0) から右へ、a が負なら左へのびます。y = −√x のグラフは y = √x を x 軸について対称に移したもので、値域は y ≦ 0 です。y = √x + q なら、y 軸方向に q だけ動きます。
      - part: 思い出す
        text: √18 + √8 を計算した式はどれですか。
        choices: [5√2, √26, 6√2, 2√13]
        answer: 5√2
        check: "[c for c, v in {'5√2': 5 * math.sqrt(2), '√26': math.sqrt(26), '6√2': 6 * math.sqrt(2), '2√13': 2 * math.sqrt(13)}.items() if math.isclose(v, math.sqrt(18) + math.sqrt(8))][0]"
        hints:
          - √ の中の 2 乗の因数を外に出しましょう（A-016）。
          - √18 = 3√2、√8 = 2√2 です。
          - √2 の何個分かを足しましょう。
        paths:
          - [√18 = 3√2、√8 = 2√2, 3√2 + 2√2 = 5√2]
        note: √18 + √8 = √26 とするまちがいが多い。√ のたし算は、√ の中が同じものだけまとめられる。
      - part: 思い出す
        text: 分数関数 y = 4/(x − 2) + 3 のグラフの漸近線はどれですか。
        choices: [x = 2 と y = 3, x = −2 と y = 3, x = 3 と y = 2, x = 2 と y = −3]
        answer: x = 2 と y = 3
        check: "[c for c, (p, q) in {'x = 2 と y = 3': (2, 3), 'x = −2 と y = 3': (-2, 3), 'x = 3 と y = 2': (3, 2), 'x = 2 と y = −3': (2, -3)}.items() if p - 2 == 0 and abs(4 / (10 ** 6 - 2) + 3 - q) < 1e-5][0]"
        hints:
          - y = k/(x − p) + q の形と見くらべましょう。
          - 分母が 0 になる x は、縦の漸近線です。
          - 足している数 q は、横の漸近線です。
        paths:
          - [p = 2、q = 3, 漸近線は x = 2 と y = 3]
      - part: 今日
        text: 無理関数 y = √(3x + 6) の定義域はどれですか。
        choices: [x ≧ −2, x ≧ 2, x ≧ −6, x ≦ −2]
        answer: x ≧ −2
        check: "[c for c, g in {'x ≧ −2': lambda x: x >= -2, 'x ≧ 2': lambda x: x >= 2, 'x ≧ −6': lambda x: x >= -6, 'x ≦ −2': lambda x: x <= -2}.items() if all(g(x) == (3 * x + 6 >= 0) for x in [Fraction(k, 2) for k in range(-20, 21)])][0]"
        hints:
          - √ の中が 0 以上になる x の範囲です。
          - 3x + 6 は、x がいくつのとき 0 になるでしょう。
          - 3x + 6 は傾きが正なので、その x より右で正になります。
        paths:
          - [3x + 6 は x = −2 で 0, 傾きが正なので x が −2 以上で 0 以上, 定義域は x ≧ −2]
        note: √ の中の 6 から x ≧ −6 としやすい。√ の中を 0 にする x を求めさせる。
      - part: 今日
        text: 無理関数 y = √(x + 3) のグラフの上で、y 座標が 4 の点の x 座標はいくつですか。
        answer: 13
        check: "[x for x in range(-3, 100) if math.isclose(math.sqrt(x + 3), 4)][0]"
        hints:
          - √(x + 3) = 4 をみたす x をさがしましょう。
          - 2 乗すると 16 になる数は 4 です。
          - x + 3 = 16 を解きましょう。
        paths:
          - [√(x + 3) = 4, x + 3 = 16, x = 13]
      - part: 挑戦
        text: 無理関数 y = −√(4 − 2x) の定義域と値域の組はどれですか。
        choices: [x ≦ 2、y ≦ 0, x ≧ 2、y ≦ 0, x ≦ 2、y ≧ 0, x ≦ −2、y ≦ 0]
        answer: x ≦ 2、y ≦ 0
        check: "[c for c, (g, h) in {'x ≦ 2、y ≦ 0': (lambda x: x <= 2, lambda y: y <= 0), 'x ≧ 2、y ≦ 0': (lambda x: x >= 2, lambda y: y <= 0), 'x ≦ 2、y ≧ 0': (lambda x: x <= 2, lambda y: y >= 0), 'x ≦ −2、y ≦ 0': (lambda x: x <= -2, lambda y: y <= 0)}.items() if all(g(x) == (4 - 2 * x >= 0) for x in [Fraction(k, 2) for k in range(-20, 21)]) and all(h(-math.sqrt(4 - 2 * x)) for x in [Fraction(k, 2) for k in range(-20, 5)]) and not h(1)][0]"
        hints:
          - √ の中の 4 − 2x が 0 以上になる範囲が定義域です。
          - 4 − 2x は x = 2 で 0 になり、傾きが負なので、x が 2 より小さいと正になります。
          - √ の値は 0 以上なので、−√ の値はどうなるでしょう。
        paths:
          - [4 − 2x は x = 2 で 0、傾きが負, 定義域は x ≦ 2, √(4 − 2x) は 0 以上なので −√(4 − 2x) は 0 以下, 値域は y ≦ 0]
        note: 傾きが負の 1 次式なので、√ の中が 0 以上になるのは左側。グラフは点 (2, 0) から左下へのびる。
