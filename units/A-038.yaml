        answer: x = 3、x = −2
        check: "[c for c, rs in {'x = 3、x = −2': {3, -2}, 'x = −3、x = 2': {-3, 2}, 'x = 6、x = −1': {6, -1}, 'x = 1、x = −6': {1, -6}}.items() if rs == set(x for x in range(-30, 31) if x * x - x - 6 == 0)][0]"
        hints:
          - 左辺を因数分解しましょう（A-017）。
          - かけて −6、足して −1 になる 2 つの数をさがしましょう。
          - AB = 0 なら A = 0 または B = 0 です。
