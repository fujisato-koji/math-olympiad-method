 cx="136" cy="108" r="3.5" fill="currentColor"/><text x="71" y="71" font-size="14" text-anchor="end" fill="currentColor">P</text><text x="141" y="124" font-size="14" text-anchor="start" fill="currentColor">A</text></svg>'
    choices: [(√11)/2, √11, 11/4, √3]
    answer: (√11)/2
    check: "[c for c, v in {'(√11)/2': math.sqrt(11) / 2, '√11': math.sqrt(11), '11/4': 11 / 4, '√3': math.sqrt(3)}.items() if abs(v - min(math.sqrt((t - 3) ** 2 + t) for t in [k / 1000 for k in range(0, 6001)])) < 1e-9][0]"
    hints:
      - P の座標を (t, √t) とおこう。
      - text: 図の直角三角形で、三平方の定理（G-019）を使って PA² を t の式で表そう。
        svg: '<svg viewBox="0 0 266 180" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="122" x2="248" y2="122" stroke="currentColor" stroke-width="2"/><polygon points="256,122 248,117.5 248,126.5" fill="currentColor"/><line x1="40" y1="164" x2="40" y2="10" stroke="currentColor" stroke-width="2"/><polygon points="40,2 35.5,10 44.5,10" fill="currentColor"/><polyline points="40,122 40.8,116.5 43.1,110.8 47,105.3 52.5,99.6 59.5,94.1 68.1,88.5 78.2,82.9 90,77.3 103.2,71.7 118.1,66.1 152.5,54.9 193.1,43.7 240,32.6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-opacity=".5" stroke-linejoin="round"/><line x1="96" y1="74.7" x2="160" y2="122" stroke="#f08080" stroke-width="3"/><line x1="96" y1="122" x2="96" y2="74.7" stroke="#7fc8f8" stroke-width="3"/><line x1="96" y1="122" x2="160" y2="122" stroke="#7fc8f8" stroke-width="3"/><text x="258" y="127" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">x</text><text x="47" y="9" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">y</text><text x="36" y="137" font-size="13" text-anchor="end" fill="currentColor">O</text><path d="M106 122V112H96" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="96" cy="74.7" r="4" fill="currentColor"/><circle cx="160" cy="122" r="4" fill="currentColor"/><text x="88" y="68.7" font-size="14" text-anchor="end" fill="currentColor">P(t, √t)</text><text x="164" y="140" font-size="14" text-anchor="start" fill="currentColor">A(3, 0)</text><text x="89" y="103.3" font-size="14" text-anchor="end" fill="currentColor">√t</text><text x="128" y="140" font-size="14" text-anchor="middle" fill="currentColor">3 − t</text></svg>'
      - PA² は t の 2 次関数になるね。平方完成しよう。
    paths:
      - ["P(t, √t)（t は 0 以上）とする", "PA² = (t − 3)² + (√t)² = t² − 5t + 9", "= (t − 5/2)² + 11/4 で t = 5/2 のとき最小", "最小値は √(11/4) = (√11)/2"]
      - ["PA² = t² − 5t + 9 を t = 2、5/2、3 で計算すると 3、11/4、3", "PA² のグラフは t = 5/2 を軸とする谷の形", "最小値は √(11/4) = (√11)/2"]
    note: 2 点間のきょり（三平方の定理）、無理関数、2 次関数の最小を合わせる。きょりそのものではなく 2 乗を最小にするのが道。(√t)² = t で √ が消えることに気づかせる。最も近い点 P は (5/2, (√10)/2) で、A の真上（t = 3）ではない。
  - part: 離
    id: "98e77352ce"
    kinds: [総動員, 読み取り]
    uses: [A-007]
    text: 濃度 20 % の食塩水 300 g に、濃度 5 % の食塩水を x g 混ぜると、濃度が y % の食塩水になります。y は x の《分数》関数です。y = 8 になるのは、x がいくつのときですか。
    svg: '<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="22" y="76" width="56" height="56" fill="#7fc8f8" fill-opacity=".45"/><path d="M18 40 L22 44 V132 H78 V44 L82 40" fill="none" stroke="currentColor" stroke-width="2"/><text x="50" y="30" font-size="15" text-anchor="middle" fill="currentColor">20 %</text><text x="50" y="152" font-size="14" text-anchor="middle" fill="currentColor">300 g</text><text x="103" y="98" font-size="22" text-anchor="middle" fill="currentColor">+</text><rect x="128" y="88" width="56" height="44" fill="#7fc8f8" fill-opacity=".45"/><path d="M124 40 L128 44 V132 H184 V44 L188 40" fill="none" stroke="currentColor" stroke-width="2"/><text x="156" y="30" font-size="15" text-anchor="middle" fill="currentColor">5 %</text><text x="156" y="152" font-size="14" text-anchor="middle" fill="currentColor">x g</text><line x1="196" y1="92" x2="217" y2="92" stroke="currentColor" stroke-width="2.5"/><polygon points="226,92 217,97 217,87" fill="currentColor"/><rect x="240" y="52" width="66" height="80" fill="#7fc8f8" fill-opacity=".45"/><path d="M236 40 L240 44 V132 H306 V44 L310 40" fill="none" stroke="currentColor" stroke-width="2"/><text x="273" y="30" font-size="15" text-anchor="middle" fill="currentColor">y %</text><text x="273" y="152" font-size="14" text-anchor="middle" fill="currentColor">(300 + x) g</text></svg>'
    answer: 1200
    check: "[x for x in range(0, 5001) if Fraction(300 * 20 + 5 * x, 300 + x) == 8][0]"
    hints:
      - 食塩の重さは、食塩水の重さ × 濃度 ÷ 100 だね（A-007）。混ぜたあとの食塩と食塩水の重さを x で表そう。
      - text: 面積図で見ると、横が食塩水の重さ、たてが濃度で、長方形の面積が食塩の重さだよ。8 % の線より上の赤い部分と、下の青い部分の面積が等しくなるね。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="122" width="45" height="48" fill="#c8ccd6" fill-opacity=".35" stroke="currentColor" stroke-width="1.5"/><rect x="60" y="50" width="45" height="72" fill="#f08080" fill-opacity=".55" stroke="currentColor" stroke-width="1.5"/><rect x="105" y="140" width="180" height="30" fill="#c8ccd6" fill-opacity=".35" stroke="currentColor" stroke-width="1.5"/><rect x="105" y="122" width="180" height="18" fill="#7fc8f8" fill-opacity=".55" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="56" y1="122" x2="291" y2="122" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><line x1="60" y1="170" x2="291" y2="170" stroke="currentColor" stroke-width="2"/><text x="54" y="55" font-size="14" text-anchor="end" fill="currentColor">20 %</text><text x="54" y="123" font-size="14" text-anchor="end" fill="currentColor">8 %</text><text x="54" y="149" font-size="14" text-anchor="end" fill="currentColor">5 %</text><text x="82.5" y="188" font-size="14" text-anchor="middle" fill="currentColor">300 g</text><text x="195" y="188" font-size="14" text-anchor="middle" fill="currentColor">x g</text><text x="115" y="66" font-size="14" text-anchor="start" fill="currentColor">赤と青の面積が等しい</text></svg>'
      - y = 8 とおいて、分母をはらって解こう。赤と青の面積を式にしてもよいよ。
    paths:
      - [食塩は 60 + 0.05x g、食塩水は 300 + x g, y = (6000 + 5x)/(300 + x), (6000 + 5x)/(300 + x) = 8 より 6000 + 5x = 2400 + 8x, 3x = 3600 で x = 1200]
      - ["面積図で、赤の面積 (20 − 8) × 300 と青の面積 (8 − 5) × x が等しい", "3600 = 3x", "x = 1200"]
    note: 濃度の式（A-007）を立てる読み取りがかぎ。y = 5 + 4500/(300 + x) と書きかえると、x をどれだけ大きくしても y は 5 % より大きいまま、横の漸近線が y = 5 であることもわかる（混ぜる食塩水の濃度に近づく）。
