# P-029 電流と回路
#
# 段 5・水準 2・8 日。前提は A-012（比例と反比例）。P-183（電流の正体）はまだ作っていないが、
# 電流を「1 秒に流れる電気の量」として扱えば、この単元は始められる。
# オームの法則、直列と並列、抵抗と抵抗率、電力と電力量、キルヒホッフの法則、電池と計器（起電力・内部抵抗・端子電圧、電流計と電圧計）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の決まり：電圧は青、電流は赤（三角は電流の向き）、抵抗は黄の四角。電池は長い線が +。点線の四角は内部抵抗のある電池。
#   ヒントの図：オームの法則の円（上に V、下に R と I）、電力の長方形（たて V・横 I・面積 P）、電位のグラフ（電池で上がり抵抗で下がる）。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-029
days:
  - day: 1
    items:
      - part: 見本
        id: "f4b58c58bd"
        text: |-
          電流 I は 1 秒間に流れる電気の量（A）、電圧 V は電流を流そうとするはたらき（V）、電気抵抗 R は電流の流れにくさ（Ω）です。
          図の下は水のたとえです（電池＝ポンプ、電流＝水の流れ、抵抗＝細い管）。図では、電圧を青、電流を赤、抵抗を黄でぬります。
          オームの法則：V = R I。例：R = 4 Ω に I = 3 A 流れると、V = 4 × 3 = 12 V。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="80" y1="22" x2="80" y2="51" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="59" x2="80" y2="88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="65" y1="51" x2="95" y2="51" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="72" y1="59" x2="88" y2="59" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/><text x="102" y="48" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="80" y1="22" x2="240" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="22" x2="240" y2="38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="72" x2="240" y2="88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="231" y="38" width="18" height="34" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.55"/><line x1="80" y1="88" x2="240" y2="88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="167,22 153,16.4 153,27.6" fill="#f08080" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><polygon points="153,88 167,82.4 167,93.6" fill="#f08080" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><rect x="6.8" y="45" width="54.2" height="21" rx="5" fill="#7fc8f8" fill-opacity="0.4"/><text x="56" y="60" font-size="14" text-anchor="end" fill="currentColor">電圧 V</text><rect x="253" y="45" width="54.2" height="21" rx="5" fill="#f3c969" fill-opacity="0.4"/><text x="258" y="60" font-size="14" text-anchor="start" fill="currentColor">抵抗 R</text><rect x="132.9" y="43" width="54.2" height="21" rx="5" fill="#f08080" fill-opacity="0.4"/><text x="160" y="58" font-size="14" text-anchor="middle" fill="currentColor">電流 I</text><text x="160" y="113" font-size="13" text-anchor="middle" fill="currentColor">水でたとえると</text><path d="M240 142 V130 H80 V185 H240 V173" fill="none" stroke="#7fc8f8" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.45"/><line x1="240" y1="142" x2="240" y2="173" stroke="#7fc8f8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.9"/><circle cx="80" cy="157" r="14" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.8"/><line x1="80" y1="166" x2="80" y2="154" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="80,147 83.8,154 76.2,154" fill="currentColor"/><polygon points="168,130 154,123 154,137" fill="#7fc8f8" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><polygon points="152,185 166,178 166,192" fill="#7fc8f8" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><rect x="11" y="147" width="52" height="21" rx="5" fill="#7fc8f8" fill-opacity="0.4"/><text x="58" y="162" font-size="14" text-anchor="end" fill="currentColor">ポンプ</text><rect x="253" y="147" width="52" height="21" rx="5" fill="#f3c969" fill-opacity="0.4"/><text x="258" y="162" font-size="14" text-anchor="start" fill="currentColor">細い管</text><rect x="127" y="147" width="66" height="21" rx="5" fill="#f08080" fill-opacity="0.4"/><text x="160" y="162" font-size="14" text-anchor="middle" fill="currentColor">水の流れ</text></svg>'
        explain: |-
          V = R I は、電圧が大きいほど電流が多く、抵抗が大きいほど電流が少ないことを表します。
          I = V/R、R = V/I と変形できます。ヒントの円（上に V、下に R と I）で求める量をかくすと、残りのならび方が計算の形になります（上下ならわり算、横ならかけ算）。
          例：12 V の電池に 4 Ω をつなぐと、I = 12/4 = 3 A。
        note: V = R I。I = V/R、R = V/I。単位は V、A、Ω。
