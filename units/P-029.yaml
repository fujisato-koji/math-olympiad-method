  - day: 4
    items:
      - part: 見本
        id: "4567580762"
        text: |-
          キルヒホッフの法則：
          ① 電流則：分かれ目に入る電流の和 = 出る電流の和。
          ② 電圧則：1 つのとじた回路を 1 周すると、電圧の変化の和は 0。
          電池は電圧を上げ、抵抗は電圧を下げる。向きを決めて、上がる向きを +、下がる向きを − とします。
