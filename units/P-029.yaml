"/><text x="120" y="33" font-size="15" text-anchor="middle" fill="currentColor">I</text><polygon points="170,73 164.4,59 175.6,59" fill="#f08080" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="160" y="71" font-size="14" text-anchor="end" fill="currentColor">V/R₁</text><polygon points="250,73 244.4,59 255.6,59" fill="#f08080" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="240" y="71" font-size="14" text-anchor="end" fill="currentColor">V/R₂</text></svg>'
