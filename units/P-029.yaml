  - day: 3
    items:
      - part: 見本
        id: "8d25b0ab72"
        text: |-
          抵抗率 ρ、長さ L、断面積 A の導線の抵抗は R = ρL/A です（長いほど大きく、太いほど小さい）。
          電力 P は 1 秒あたりに使う電気のエネルギーで、P = V I。図の右の長方形の面積です。
          V = R I を使うと、P = I²R = V²/R とも書けます。電力量は電力 × 時間。1 kW を 1 時間使うと 1 kWh。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="172" y1="12" x2="172" y2="196" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="34" y="50" width="116" height="44" fill="#c9a36b" fill-opacity="0.45"/><line x1="34" y1="50" x2="150" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="34" y1="94" x2="150" y2="94" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M150 50 A8.8 22 0 0 1 150 94" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="34" cy="72" rx="8.8" ry="22" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.7"/><line x1="34" y1="40" x2="34" y2="48" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="26" y="34" font-size="14" text-anchor="start" fill="currentColor">断面積 A</text><line x1="41" y1="108" x2="143" y2="108" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="34,108 41,111.5 41,104.5" fill="currentColor"/><polygon points="150,108 143,111.5 143,104.5" fill="currentColor"/><text x="92" y="128" font-size="14" text-anchor="middle" fill="currentColor">長さ L</text><text x="92" y="160" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">R = ρL/A</text><text x="92" y="184" font-size="13" text-anchor="middle" fill="currentColor">ρ は抵抗率</text><text x="250" y="30" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">電力</text><rect x="215" y="50" width="80" height="90" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity="0.35"/><text x="255" y="100" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">P = V I</text><rect x="191.3" y="84" width="18.7" height="22" rx="5" fill="#7fc8f8" fill-opacity="0.4"/><text x="205" y="100" font-size="15" text-anchor="end" fill="currentColor">V</text><rect x="245.7" y="146" width="18.7" height="22" rx="5" fill="#f08080" fill-opacity="0.4"/><text x="255" y="162" font-size="15" text-anchor="middle" fill="currentColor">I</text><text x="248" y="190" font-size="13" text-anchor="middle" fill="currentColor">電力量 = P × 時間</text></svg>'
        explain: |-
          R は抵抗、ρ は抵抗率、L は導線の長さ、A は断面積、V は電圧、I は電流、P は電力です。
          R = ρL/A：長いほど抵抗が大きく、太いほど小さい。ρ は物質で決まる抵抗率。
          P = V I：電圧が高いほど、電流が大きいほど、電力が大きい。
          P = I²R は、P = V I に V = R I を代入。P = V²/R は、P = V I に I = V/R を代入。
        note: R = ρL/A。P = VI = I²R = V²/R。電力量は電力 × 時間。
