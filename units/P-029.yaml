      - part: わけ
        text: 電力が P = I²R とも書けるわけを説明しましょう。
        explain: 「P = V I で、オームの法則 V = R I を代入すると、P = (R I) I = I²R。電圧と抵抗からでも、電流と抵抗からでも電力を求められる。」と書ければよい。① P = VI、② V = RI、③ 代入して I²R。子どもには、具体的な数で確かめさせます。
        hints:
          - 電力は P = V I です。
          - オームの法則から V = R I です。
          - 代入すると P = (R I) I = I²R です。
        paths:
