          - [P = I²R, 4 × 5 = 20 W]
      - part: 今日
        text: 抵抗率が同じで、長さを 2 倍、断面積をそのままにすると、抵抗は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - R = ρL/A です。
          - L が 2 倍になると、R はどうなりますか。
