  - day: 5
    items:
      - part: 見本
        id: "0672c00bfa"
        text: |-
          電池には、起電力 E（電池が生み出す電圧）と、内部抵抗 r があります（図の点線の中）。
          回路に流れる電流を I とすると、電池の両はしの電圧（端子電圧）は V = E − r I です。
          電流計は回路に直列に入れ、電圧計は測る部分に並列に入れます。
          理想的な電流計は抵抗 0、理想的な電圧計は抵抗無限大です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="68" y="56" width="54" height="94" rx="6" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" fill="#c8ccd6" fill-opacity="0.18"/><line x1="95" y1="45" x2="95" y2="64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="95" y1="100" x2="95" y2="126" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="95" y1="134" x2="95" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="85" y="64" width="20" height="36" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.55"/><line x1="80" y1="126" x2="110" y2="126" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="87" y1="134" x2="103" y2="134" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/><text x="117" y="123" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="280" y1="45" x2="280" y2="83" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="280" y1="131" x2="280" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="269" y="83" width="22" height="48" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.55"/><line x1="95" y1="45" x2="203" y2="45" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="227" y1="45" x2="280" y2="45" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="95" y1="170" x2="280" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="60" y="87" font-size="15" text-anchor="end" fill="currentColor">r</text><text x="60" y="135" font-size="15" text-anchor="end" fill="currentColor">E</text><text x="295" y="112" font-size="15" text-anchor="start" fill="currentColor">R</text><circle cx="215" cy="45" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.35"/><text x="215" y="50" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">A</text><text x="215" y="25" font-size="14" text-anchor="middle" fill="currentColor">電流計（直列）</text><line x1="150" y1="45" x2="150" y2="95" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="119" x2="150" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="150" cy="107" r="12" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.35"/><text x="150" y="112" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">V</text><circle cx="150" cy="45" r="3.5" fill="currentColor" fill-opacity="1"/><circle cx="150" cy="170" r="3.5" fill="currentColor" fill-opacity="1"/><text x="167" y="104" font-size="13" text-anchor="start" fill="currentColor">電圧計（並列）</text><text x="167" y="122" font-size="13" text-anchor="start" fill="currentColor">＝端子電圧</text><text x="60" y="62" font-size="13" text-anchor="end" fill="currentColor">電池</text><text x="175" y="194" font-size="13" text-anchor="middle" fill="currentColor">点線の中が電池（起電力 E と内部抵抗 r）</text></svg>'
        explain: |-
          電池の中で電流が流れると、内部抵抗 r でも電圧が下がります。だから外に取り出せる電圧は E − rI。
          例：E=12 V、r=1 Ω、外の抵抗 R=5 Ω。I = E/(R+r) = 12/6 = 2 A。端子電圧 V = 12 − 1×2 = 10 V。
          電流計は直列（電流をそのまま通す）、電圧計は並列（電圧をそのまま測る）。
        note: 端子電圧 V = E − rI。電流計は直列、電圧計は並列。
