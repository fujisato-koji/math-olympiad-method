    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="68" y="56" width="54" height="94" rx="6" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" fill="#c8ccd6" fill-opacity="0.18"/><line x1="95" y1="45" x2="95" y2="64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="95" y1="100" x2="95" y2="126" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="95" y1="134" x2="95" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="85" y="64" width="20" height="36" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.55"/><line x1="80" y1="126" x2="110" y2="126" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="87" y1="134" x2="103" y2="134" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/><text x="117" y="123" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="255" y1="45" x2="255" y2="83" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="255" y1="131" x2="255" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="244" y="83" width="22" height="48" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.55"/><line x1="95" y1="45" x2="255" y2="45" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="95" y1="170" x2="255" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="60" y="87" font-size="15" text-anchor="end" fill="currentColor">1 Ω</text><text x="60" y="135" font-size="15" text-anchor="end" fill="currentColor">9 V</text><text x="270" y="112" font-size="15" text-anchor="start" fill="currentColor">8 Ω</text><line x1="150" y1="45" x2="150" y2="95" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="119" x2="150" y2="170" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="150" cy="107" r="12" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.35"/><text x="150" y="112" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">V</text><circle cx="150" cy="45" r="3.5" fill="currentColor" fill-opacity="1"/><circle cx="150" cy="170" r="3.5" fill="currentColor" fill-opacity="1"/><text x="167" y="112" font-size="15" text-anchor="start" fill="currentColor">? V</text></svg>'
    choices: [1, 7, 8, 9]
    answer: 8
    check: "f'{9 - 1 * (9 / (1 + 8)):.0f}'"
    hints:
      - まず回路に流れる電流を求めます。電池の中の 1 Ω も通ります。
      - text: 電位（電気の高さ）のグラフです。電池で上がり、中の r と外の抵抗で下がって、もとの高さにもどります。9 V が中の 1 Ω と外の 8 Ω に分かれます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="28" y1="168" x2="300" y2="168" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="62" y1="56" x2="300" y2="56" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5" stroke-opacity="0.5"/><path d="M28 168 L62 168 L62 56 L84 56 L168 68.4 L190 68.4 L274 168 L300 168" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="126" y="186" font-size="13" text-anchor="middle" fill="currentColor">中の 1 Ω</text><text x="232" y="186" font-size="13" text-anchor="middle" fill="currentColor">外の 8 Ω</text><line x1="281" y1="74.4" x2="281" y2="162" stroke="#f08080" stroke-width="1.5" stroke-linecap="round"/><polygon points="281,68.4 278,74.4 284,74.4" fill="#f08080"/><polygon points="281,168 278,162 284,162" fill="#f08080"/><text x="287" y="123.2" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">?</text><line x1="190" y1="68.4" x2="284" y2="68.4" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="50" y1="165" x2="50" y2="68" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="50,59 55,68 45,68" fill="#7fc8f8"/><text x="44" y="117" font-size="14" text-anchor="end" fill="currentColor">9 V</text><text x="62" y="186" font-size="13" text-anchor="middle" fill="currentColor">電池</text><text x="170" y="26" font-size="14" text-anchor="middle" fill="currentColor">電位（電気の高さ）</text></svg>'
      - 端子電圧は、外の 8 Ω にかかる電圧と同じです。
    paths:
      - [I = 9/(1+8) = 1 A, V = 9 − 1 × 1 = 8 V]
      - ["9 V が 1 Ω と 8 Ω に 1 : 8 で分かれる", 外の 8 Ω に 8 V]
    note: 電池の内部抵抗でも電圧が下がる。端子電圧は E − rI。
