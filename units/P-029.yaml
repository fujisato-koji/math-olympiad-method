# P-029 電流と回路
#
# 段 5・水準 2・8 日。前提は A-012（比例と反比例）。P-183（電流の正体）はまだ作っていないが、
# 電流を「1 秒に流れる電気の量」として扱えば、この単元は始められる。
# オームの法則、直列と並列、抵抗率と電力、キルヒホッフの法則、電池と計器を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-029
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          電流 I は 1 秒間に流れる電気の量（A）、電圧 V は電流を流そうとするはたらき（V）、
          電気抵抗 R は電流の流れにくさ（Ω）です。
          オームの法則：V = R I。電圧は抵抗と電流の積です。
          例：R = 4 Ω に I = 3 A 流れると、V = 4 × 3 = 12 V。
        explain: |-
          V = R I は、電圧が大きいほど電流が多く、抵抗が大きいほど電流が少ないことを表します。
          I = V/R、R = V/I と変形できます。
          例：12 V の電源に 4 Ω をつなぐと、I = 12/4 = 3 A。
        note: V = R I。I = V/R、R = V/I。単位は V、A、Ω。
      - part: 思い出す
        text: 比例式 y = 2x で、x = 3 のとき y はいくつですか。
        choices: [3, 5, 6, 9]
        answer: 6
        check: "2 * 3"
        hints:
          - y = 2x に x = 3 を入れましょう。
          - 2 × 3 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [y = 2x, 2 × 3 = 6]
      - part: 今日
        text: 電圧 12 V、抵抗 4 Ω のとき、電流はいくつですか。
        choices: [0.33, 3, 8, 48]
        answer: 3
        check: "f'{12 / 4:.0f}'"
        hints:
          - V = R I を I = V/R に直しましょう。
          - 12 ÷ 4 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [I = V/R, 12/4 = 3 A]
      - part: 今日
        text: 電流 0.5 A、抵抗 10 Ω のとき、電圧はいくつですか。
        choices: [0.05, 5, 10.5, 20]
        answer: 5
        check: "f'{0.5 * 10:.0f}'"
        hints:
          - V = R I です。
          - 10 × 0.5 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [V = RI, 10 × 0.5 = 5 V]
      - part: 今日
        text: 電圧 6 V、電流 2 A のとき、抵抗はいくつですか。
        choices: [0.33, 3, 8, 12]
        answer: 3
        check: "f'{6 / 2:.0f}'"
        hints:
          - V = R I を R = V/I に直しましょう。
          - 6 ÷ 2 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [R = V/I, 6/2 = 3 Ω]
      - part: 挑戦
        text: 電圧 9 V、抵抗 3 Ω のとき、消費電力 P = V I はいくつですか。
        choices: [3, 9, 27, 81]
        answer: 27
        check: "f'{9 * (9 / 3):.0f}'"
        hints:
          - まず電流 I = V/R を求めましょう。
          - I = 9/3 = 3 A です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [I = 9/3 = 3 A, P = VI = 9 × 3 = 27 W]
    extra:
      - part: 今日
        text: 電圧 8 V、抵抗 2 Ω のとき、電流はいくつですか。
        choices: [2, 4, 6, 16]
        answer: 4
        check: "f'{8 / 2:.0f}'"
        hints:
          - I = V/R です。
          - 8 ÷ 2 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [8/2 = 4 A]
      - part: 今日
        text: 電流 3 A、抵抗 5 Ω のとき、電圧はいくつですか。
        choices: [1.67, 8, 15, 45]
        answer: 15
        check: "3 * 5"
        hints:
          - V = R I です。
          - 5 × 3 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [5 × 3 = 15 V]
      - part: わけ
        text: オームの法則 V = R I が成り立つわけを、比例の言葉で説明しましょう。
        explain: 「同じ抵抗に流れる電流を 2 倍、3 倍にすると、必要な電圧も 2 倍、3 倍になる。電圧は電流に比例し、その比例定数が抵抗 R。だから V = R I。」と書ければよい。① 電流を倍にすると電圧も倍、② 比例定数が R、③ V = RI。子どもには、具体的な数で確かめさせます。
        hints:
          - 同じ抵抗で、電流を 2 倍にすると、電圧はどうなりますか。
          - 電圧は電流に比例します。
          - 比例定数が抵抗 R です。
        paths:
          - [電流 2 倍で電圧 2 倍, 電圧は電流に比例, 比例定数 R, V = RI]

  - day: 2
    items:
      - part: 見本
        text: |-
          直列：抵抗を一列につなぐ。どの抵抗にも同じ電流が流れ、電圧は分かれて足し合わさる。
          合成抵抗は R = R₁ + R₂。
          並列：抵抗を分かれてつなぐ。どの抵抗にも同じ電圧がかかり、電流は分かれて足し合わさる。
          合成抵抗は 1/R = 1/R₁ + 1/R₂。
        explain: |-
          ・直列：電流の通り道が 1 本なので、電流は同じ。
          ・直列の電圧は R₁I と R₂I に分かれ、V = (R₁ + R₂)I。
          ・並列：両方に同じ電圧がかかり、電流は V/R₁ と V/R₂ に分かれる。
          ｜つなぎ方｜電流｜電圧｜合成抵抗｜
          ｜直列｜同じ｜分かれて足す｜R = R₁ + R₂｜
          ｜並列｜分かれて足す｜同じ｜1/R = 1/R₁ + 1/R₂｜
          ・例：2 Ω と 3 Ω の直列は 5 Ω。並列は 6/5 Ω。
        note: 直列は電流が同じで R = R₁ + R₂。並列は電圧が同じで 1/R = 1/R₁ + 1/R₂。
      - part: 思い出す
        text: 2 Ω と 3 Ω の抵抗を直列につなぐと、合成抵抗はいくつですか。
        choices: [1.2, 5, 6, 2.5]
        answer: 5
        check: "2 + 3"
        hints:
          - 直列の合成抵抗は、足し算です。
          - 2 + 3 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [直列は足す, 2 + 3 = 5 Ω]
      - part: 今日
        text: 2 Ω と 3 Ω を直列につなぎ、10 V の電圧をかけると、電流はいくつですか。
        choices: [2, 5, 10, 20]
        answer: 2
        check: "f'{10 / (2 + 3):.0f}'"
        hints:
          - 直列の合成抵抗は 2 + 3 = 5 Ω です。
          - I = V/R です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [R = 5 Ω, I = 10/5 = 2 A]
      - part: 今日
        text: 2 Ω と 3 Ω を並列につなぐと、合成抵抗はいくつですか。
        choices: ["5/6", "6/5", "5", "6"]
        answer: "6/5"
        check: "Fraction(6, 5)"
        hints:
          - 並列は 1/R = 1/R₁ + 1/R₂ です。
          - 1/2 + 1/3 = 5/6 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/R = 1/2 + 1/3 = 5/6, R = 6/5 Ω]
      - part: 挑戦
        text: 2 Ω と 6 Ω を並列につなぎ、12 V の電圧をかけたとき、6 Ω に流れる電流はいくつですか。
        choices: [1, 2, 4, 6]
        answer: 2
        check: "f'{12 / 6:.0f}'"
        hints:
          - 並列では、どの抵抗にも同じ 12 V がかかります。
          - 6 Ω の電流は I = V/R です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [並列は電圧が同じ, I = 12/6 = 2 A]
    extra:
      - part: 今日
        text: 4 Ω と 4 Ω を並列につなぐと、合成抵抗はいくつですか。
        choices: [1, 2, 4, 8]
        answer: 2
        check: "f'{1 / (1 / 4 + 1 / 4):.0f}'"
        hints:
          - 1/R = 1/4 + 1/4 です。
          - 1/R = 1/2 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/R = 1/4 + 1/4 = 1/2, R = 2 Ω]
      - part: 今日
        text: 2 Ω と 3 Ω を直列につなぎ 10 V をかけたとき、2 Ω にかかる電圧はいくつですか。
        choices: [2, 4, 6, 10]
        answer: 4
        check: "f'{2 * (10 / (2 + 3)):.0f}'"
        hints:
          - 電流は 10/5 = 2 A です。
          - 2 Ω の電圧は V = R I です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [I = 2 A, V = 2 × 2 = 4 V]
      - part: わけ
        text: 並列の合成抵抗が 1/R = 1/R₁ + 1/R₂ になるわけを説明しましょう。
        explain: 「並列では、どちらの抵抗にも同じ電圧 V がかかる。R₁ に流れる電流は V/R₁、R₂ は V/R₂。全体の電流は I = V/R₁ + V/R₂ = V(1/R₁ + 1/R₂)。合成抵抗を R とすると I = V/R なので、1/R = 1/R₁ + 1/R₂。」と書ければよい。① 同じ電圧、② 電流が分かれる、③ 全体の電流から合成抵抗。子どもには、具体的な数で確かめさせます。
        hints:
          - 並列では、どちらの抵抗にも同じ電圧がかかります。
          - それぞれの電流は V/R₁、V/R₂ です。
          - 全体の電流 V/R が、2 つの電流の和になります。
        paths:
          - [同じ電圧 V, 電流 V/R₁ と V/R₂, 全体 V/R, 1/R = 1/R₁ + 1/R₂]

  - day: 3
    items:
      - part: 見本
        text: |-
          抵抗率 ρ、長さ L、断面積 A の導線の抵抗は R = ρL/A です。
          電力 P は 1 秒あたりに使う電気のエネルギーで、P = V I。
          V = R I を使うと、P = I²R = V²/R とも書けます。
          電力量は電力 × 時間。1 kW を 1 時間使うと 1 kWh。
        explain: |-
          R は抵抗、ρ は抵抗率、L は導線の長さ、A は断面積、V は電圧、I は電流、P は電力です。
          R = ρL/A：長いほど抵抗が大きく、太いほど小さい。ρ は物質で決まる抵抗率。
          P = V I：電圧が高いほど、電流が大きいほど、電力が大きい。
          P = I²R は、I = V/R を代入。P = V²/R は、I = V/R を代入。
        note: R = ρL/A。P = VI = I²R = V²/R。電力量は電力 × 時間。
      - part: 思い出す
        text: 電圧 12 V、電流 2 A のとき、電力はいくつですか。
        choices: [6, 14, 24, 144]
        answer: 24
        check: "12 * 2"
        hints:
          - P = V I です。
          - 12 × 2 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [P = VI, 12 × 2 = 24 W]
      - part: 今日
        text: 抵抗率 1 × 10⁻⁶ Ω·m、長さ 2 m、断面積 1 × 10⁻⁶ m² の導線の抵抗はいくつですか。
        choices: [0.5, 1, 2, 4]
        answer: 2
        check: "f'{(1e-6 * 2) / 1e-6:.0f}'"
        hints:
          - R = ρL/A です。
          - 1 × 10⁻⁶ × 2 ÷ (1 × 10⁻⁶) を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [R = ρL/A, (1e-6 × 2)/1e-6 = 2 Ω]
      - part: 今日
        text: 電圧 6 V、抵抗 3 Ω のとき、電力 P = V²/R はいくつですか。
        choices: [2, 6, 12, 18]
        answer: 12
        check: "f'{(6 * 6) / 3:.0f}'"
        hints:
          - P = V²/R です。
          - 6² = 36、36 ÷ 3 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [P = V²/R, 36/3 = 12 W]
      - part: 挑戦
        text: 100 W、200 V の電球に流れる電流はいくつですか。
        choices: [0.5, 2, 50, 20000]
        answer: 0.5
        check: "100 / 200"
        hints:
          - P = V I を I = P/V に直します。
          - 100 ÷ 200 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [I = P/V, 100/200 = 0.5 A]
    extra:
      - part: 今日
        text: 電流 2 A、抵抗 5 Ω のとき、電力 P = I²R はいくつですか。
        choices: [7, 10, 20, 100]
        answer: 20
        check: "2 * 2 * 5"
        hints:
          - P = I²R です。
          - 2² × 5 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
