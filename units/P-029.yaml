  - day: 4
    items:
      - part: 見本
        text: |-
          キルヒホッフの法則：
          ① 電流則：分かれ目に入る電流の和 = 出る電流の和。
          ② 電圧則：1 つの閉じた回路を 1 周すると、電圧の変化の和は 0。
          電池は電圧を上げ、抵抗は電圧を下げる。向きを決めて、上がる向きを +、下がる向きを − とします。
        explain: |-
          電流則は、電気がたまらないことから。入る量と出る量が同じ。
          電圧則は、1 周して出発点に戻ると電位がもとに戻ることから。電池で上がった分と、抵抗で下がった分が等しい。
          例：12 V の電池に 2 Ω と 4 Ω を直列。電流 I は 12 = (2 + 4)I から 2 A。2 Ω で 4 V 下がり、4 Ω で 8 V 下がる。
        note: 電流則は分かれ目で足し引き。電圧則は 1 周で 0。
      - part: 思い出す
        text: 2 Ω と 4 Ω を直列につなぐと、合成抵抗はいくつですか。
        choices: [2, 6, 8, 1.33]
        answer: 6
        check: "2 + 4"
        hints:
          - 直列は足し算です。
          - 2 + 4 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [2 + 4 = 6 Ω]
      - part: 今日
        text: 分かれ目に 3 A 入り、一方の枝に 1 A 流れます。もう一方の枝には何 A 流れますか。
        choices: [1, 2, 3, 4]
        answer: 2
        check: "3 - 1"
        hints:
          - 入る電流の和 = 出る電流の和です。
          - 3 = 1 + x です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [電流則, 3 = 1 + x, x = 2 A]
      - part: 今日
        text: 12 V の電池に 2 Ω と 4 Ω を直列につなぐと、電流はいくつですか。
        choices: [2, 3, 4, 6]
        answer: 2
        check: "f'{12 / (2 + 4):.0f}'"
        hints:
          - 電圧則から、12 = (2 + 4)I です。
          - 12 = 6I を解きます。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [12 = (2+4)I, 12 = 6I, I = 2 A]
      - part: 挑戦
        text: 12 V の電池と 4 V の電池を逆向きにつなぎ、4 Ω の抵抗をつなぐと、電流はいくつですか。
        choices: [2, 4, 8, 16]
        answer: 2
        check: "f'{(12 - 4) / 4:.0f}'"
        hints:
          - 2 つの電池は逆向きなので、電圧は 12 − 4 = 8 V になります。
          - 電圧則から、8 = 4I です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [逆向きの電池は引く, 12 − 4 = 8 V, 8 = 4I, I = 2 A]
    extra:
      - part: 今日
        text: 12 V の電池に 2 Ω と 4 Ω を直列につないだとき、2 Ω にかかる電圧はいくつですか。
        choices: [2, 4, 6, 8]
        answer: 4
        check: "f'{2 * (12 / (2 + 4)):.0f}'"
        hints:
          - 電流は 12/6 = 2 A です。
          - 2 Ω の電圧は V = R I です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [I = 2 A, V = 2 × 2 = 4 V]
      - part: 今日
        text: 1 つの閉じた回路を 1 周したとき、電圧の変化の和はいくつですか。
        choices: [0, 1, 電池の電圧, 抵抗の電圧]
        answer: 0
        check: "0"
        hints:
          - 電圧則は、1 周して出発点に戻ることを表します。
          - 出発点の電位と、戻ったときの電位は同じです。
          - 和は 0 です。
        paths:
          - [1 周して同じ電位, 変化の和は 0]
      - part: わけ
        text: キルヒホッフの電圧則（1 周すると電圧の変化の和が 0）が成り立つわけを説明しましょう。
        explain: 「電圧は電位の差。回路を 1 周して出発点に戻ると、電位はもとの値に戻る。途中で上がった分と下がった分を足すと、差し引き 0 になる。だから電圧の変化の和は 0。」と書ければよい。① 電圧は電位の差、② 1 周して戻る、③ 上がる分と下がる分が等しい。子どもには、電池と抵抗 1 つの回路で確かめさせます。
        hints:
          - 電圧は、2 点の電位の差です。
          - 1 周して出発点に戻ると、電位はもとに戻ります。
          - 上がった分と下がった分が等しくなります。
        paths:
          - [電圧は電位の差, 1 周して戻る, 上がる分 = 下がる分, 和は 0]

  - day: 5
    items:
      - part: 見本
        text: |-
          電池には、起電力 E（電池が生み出す電圧）と、内部抵抗 r があります。
          回路に流れる電流を I とすると、電池の両端の電圧（端子電圧）は V = E − r I です。
          電流計は回路に直列に入れ、電圧計は測る部分に並列に入れます。
          理想的な電流計は抵抗 0、理想的な電圧計は抵抗無限大です。
