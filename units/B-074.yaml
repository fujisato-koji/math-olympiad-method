        explain: |-
          ヨーグルトの 中には「にゅうさんきん」と いう 小さな 生きものが います。にゅうさんきんは 牛にゅうの あまみを 食べて ふえ、すっぱい もとを 作ります。すっぱく なると 牛にゅうの 中の たんぱくしつが かたまり、どろっと します。40 ど ぐらいで よく ふえ、れいぞうこの 中では ほとんど ふえません。
          かびが パンを だめに するのも、にゅうさんきんが 牛にゅうを ヨーグルトに するのも、小さな 生きものが ふえて 食べものを かえる ことです。人の やくに たつ ときに「はっこう」と よびます。
          ためす ときは、あけた ばかりの 牛にゅうと、ねっとうで あらった 入れものを つかいます。ヨーグルトを 大さじ 1 ぱい ほど まぜ、ヨーグルト メーカーか、40 ど ぐらいに たもてる ところに 8 時間 ほど おきます（おゆを つかう ときは おうちの ひとと いっしょに）。
