        explain: |-
          「あらう 前の ゆびで さわった かんてんには 点が たくさん、せっけんで あらった あとの ゆびでは 点が すこし しか ない。点 1 つは、ゆびに ついて いた 小さな 生きもの 1 つが ふえた もの。だから、せっけんで 手を あらうと、手の 小さな 生きものが へる。」と いえれば よい。① 点は 小さな 生きものが ふえた かたまり、② あらうと 点が へる、③ だから あらうと 小さな 生きものが へる、の 3 つが 入れば よい。点 1 つが かならず 1 つの 生きものから できるとは かぎりませんが、点の 数は、ゆびに ついて いた 数の めやすに なります。
          手の 小さな 生きものの 中には、口から 入ると おなかを こわす ものも います。食べる 前、トイレの あと、そとから 帰った ときに、せっけんで ゆびの 間や つめの まわりまで あらうと よい わけが ここに あります。
          ためす ときは、かんてんに さとうと コンソメを すこし まぜて にとかし、ねっとうで あらった 入れものに 入れて かためます（火を つかうので おうちの ひとと いっしょに）。さわった あとは ふたを テープで とめ、あたたかい ところに 2〜3 日 おきます。そだてた あとは ふたを あけずに、おうちの ひとが ごみに すてます。
