      - part: わけ
        text: |-
          手には、目に 見えない 小さな 生きものが ついて います。
          「かんてん」は、小さな 生きものの 食べものを まぜて かためた ものです。ゆびで そっと さわって ふたを し、あたたかい ところに 2 日 おくと、点が ぽつぽつ 出て きます。点 1 つは、小さな 生きもの 1 つが ふえて できた かたまりです。
          せっけんで 手を あらう 前の ゆびと、あらった あとの ゆびで くらべました。手を あらうと よい わけを、えを 見ながら くちで せつめいして みよう。
