        explain: |-
          かびは、目に 見えない ほど 小さな「ほうし」（たねの ような もの）が 空気の 中を とんで きて パンに つき、水と あたたかさが あると、ほそい 糸の ような からだを のばして ふえます。たくさん ふえると、ふわふわ した かたまり（みどり、白、黒 など）として 目に 見える ように なります。かびも 生きものなので、水と ほどよい あたたかさが いります。
          かびの はえた パンは、見える ところの まわりにも 糸が のびて いる ことが あるので、その ところを とっても 食べません。ふくろを あけて においを かぐと、ほうしを すいこむ ことが あるので、ふくろは あけずに おうちの ひとが すてます。
          かんさつ するなら、パンに 水を すこし かけて ふくろに 入れ、くちを とじて へやに おき、毎日 ふくろの そとから 見ます（ふくろは あけない）。
