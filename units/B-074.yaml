# B-074 目に見えない小さな生き物
#
# 水準 1・5 日。目に見えないほど小さな生きものがいて、たくさんふえると目に見えるようになること、パンのかび（しめったところ・あたたかいところでよくふえる、かびのはえたパンは食べない）、ヨーグルトとはっこう（牛にゅうにヨーグルトを少し入れてあたたかいところにおくと、小さな生きものがふえてヨーグルトになる）、手あらいでへらす（せっけんでよくあらうと手の小さな生きものがへる）、かんてんでそだてて数える（点 1 つは生きもの 1 つがふえたかたまり。点を数えてくらべる）を扱う。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。1 日目 パンのかび、2 日目 ヨーグルトとはっこう、3 日目 わけ（手あらいとかんてん。手をあらうとよいわけを点の数でたしかめる）、4 日目 混ぜる、5 日目 確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の約束：小さな生きものは「大きくすると」の丸の中にだけ、むらさきの小さなつぶでかく。かんてんの点（生きもののかたまり）もむらさきの丸。かびはみどりのふわふわした丸（まわりに短い毛）。
# 牛にゅうはうすい灰色、ヨーグルトはクリーム色で上がでこぼこ、スプーンが立つ。スプーンにのせたクリーム色は「ヨーグルトを少し入れた」しるし。水のつぶは空色のしずく。へやは家の形、れいぞうこは空色の箱。赤いてんせんの丸は「見るところ」。
# かんてんを作るところ（火を使う）は explain に書き、「おうちのひとといっしょに」を付けた。子の問題の場面は、あたたかいところにおく・さわる・数えるだけ。
# 食べものを長もちさせるくふうは V-003、びょうきがうつる道すじは I-007、はっこうのくわしいしくみは B-083、ふえ方とそだて方のくわしいことは B-043 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも読み取り（日がたったじゅんにパンの絵をならべる、丸のグラフを読む）。

id: B-074
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          目に 見えない ほど 小さな 生きものが、いろいろな ところに います。たくさん ふえると、かたまりに なって 目に 見えます。
          パンに はえる「かび」も その なかまです。虫めがねで 見ると、ほそい 糸の ような ものが あつまって います。
          かびは、しめった ところや あたたかい ところで よく ふえます。
          かびの はえた パンは 食べません。
