      - part: 見本
        text: |-
          牛にゅうに ヨーグルトを すこし 入れて まぜ、あたたかい ところに ひと ばん おくと、どろっと した ヨーグルトに なります。あじも すっぱく なります。
          ヨーグルトの 中には、目に 見えない 小さな 生きものが います。この 生きものが 牛にゅうの 中で ふえて、牛にゅうを ヨーグルトに かえるのです。
          小さな 生きものが、食べものを 人の やくに たつ ものに かえる ことを「はっこう」と いいます。まめから 作る なっとうや みそも、はっこうで できます。
