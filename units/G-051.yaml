# G-051 結び目と折りたたみ（紐と紙の空間での動き）
#
# 書き方は N-001 の頭の注のとおり。
# ことば：折り目、重なり（何まい重なっているか）、じゃばら折り、結び目、交わり（ひもが重なって交わる所）、上を通る・下を通る、
#   輪、つながっている・はずれる。
# 考え方の水準は 1（体で分かる）。どの日も、紙のテープ・折り紙・ひも（くつひもや毛糸、60 cm ほど）を手元に置き、
#   折って、穴をあけて、結んで確かめる。穴は穴あけパンチか、えんぴつの先でつついてあける。はさみを使う問題は「おとなといっしょに」。
# 前提は G-004（折る、映す、回す）と G-002（形を分ける、組み合わせる）で、数の単元は N-001（10 まで）だけがつながる。
#   そのため、答えは 10 までの数を数えて出す形にし、たし算・かけ算の式は子の文に出さない（「倍」も使わない）。
#   紙を半分に折るのは 3 回まで（重なり 8 まい、折り目 7 本）。check の式（2 ** n など）は保護者が確かめるためのもの。
# 段 3 なので文は学年に合う漢字にした（ひも、はさみはかな）。わけは、代表の例を使って短い文で書く。
# 最先端へのつながり（D-026）：結び目は、ひもの結び目を数で区別する結び目理論（T-056）や DNA の結び目へ、
#   折りたたみは人工衛星の太陽電池パネルや、折り紙を使った工学（ミウラ折り）へつながる。ここでは名前は出さない。
# 図は svg（D-040）。ひもの図は、下を通る所を切って描いた（すき間のある方が下）。両はしの黒い点はひものはし。
#   紙の図の点線は折り目、太い線は折ってできた辺（折り目）、小さい丸は穴。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 テープを折る（重なりと折り目）　2 日目 折って穴をあけて広げる（G-004 の折ると重なる形）　3 日目 ひもの交わりと結び目
#   4 日目 わけ（折り目がふえるわけ、穴の位置、上ばかり通るひもはほどける）と 2 つの輪　5 日目 G-004・G-002 と 1〜4 日目を混ぜる　6 日目 確認
# check：重なりは 2 ** n、折り目は 2 ** n − 1（n は半分に折った回数）。穴の数は、穴の位置を 2 つの折り目について写した位置の集まりの数
#   （折り目の上の穴は、写しても同じ位置なので 1 つに重なる）。広げた紙を選ぶ問題は、写した位置の集まりと候補を比べる。
#   ひもは、図を作るときに片はしからたどって読んだ「交わり（a、b、c…）の上（O）と下（U）」の列を使う。交わりの数は列の長さ ÷ 4。
#   どの交わりでも先に上を通る（または、どの交わりでも先に下を通る）ひもは、持ち上げるとほどける。そうでない図は、ひと結び（交わり 3）と
#   8 の字結び（交わり 4）の、上下が交互の図だけを使った（どちらもほどけないことが知られている）。
#   2 つの輪は、片方の輪が 2 つの交わりで両方とも上（または両方とも下）ならはずれる。3 つの輪がいくつに分かれるかは、
#   つながった組の数から出す（ボロメオの輪のように、どの 2 つもはずれるのに 3 つははずれない輪は、この式では出せないので check を付けない）。

id: G-051
days:
  - day: 1
    items:
      - part: 見本
        text: 紙のテープを半分に折って、また広げてみよう。
        svg: '<svg viewBox="0 0 240 174" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="10" width="200" height="20" stroke="currentColor" stroke-width="1.8" fill="#f3c969" fill-opacity=".35"/><text x="120" y="45.9" font-size="11" text-anchor="middle">① テープ</text><line x1="120" y1="50" x2="120" y2="62" stroke="currentColor" stroke-width="1.5" fill="none"/><polyline points="116,56 120,62 124,56" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="73" y="71" width="100" height="20" stroke="currentColor" stroke-width="1.2" fill="#f3c969" fill-opacity=".35"/><rect x="70" y="68" width="100" height="20" stroke="currentColor" stroke-width="1.8" fill="#f3c969" fill-opacity=".35"/><text x="120" y="107.8" font-size="11" text-anchor="middle">② 半分に折る</text><line x1="120" y1="110" x2="120" y2="122" stroke="currentColor" stroke-width="1.5" fill="none"/><polyline points="116,116 120,122 124,116" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="20" y="128" width="200" height="20" stroke="currentColor" stroke-width="1.8" fill="#f3c969" fill-opacity=".35"/><line x1="120" y1="124" x2="120" y2="152" stroke="currentColor" stroke-width="1.4" fill="none" stroke-dasharray="5 4"/><text x="120" y="169.8" font-size="11" text-anchor="middle">③ 広げる</text></svg>'
        explain: テープを半分に折ると、テープが 2 まい重なります。広げると、まん中に折り目が 1 本できています。重なったまま、もう一度半分に折ると、重なりは 4 まいになります。折るたびに、重なった紙ぜんぶを一度に折るので、重なりも折り目もふえていきます。じっさいにテープを折って、はしを指でさわって数えてみましょう。
      - part: 思い出す
        text: まん中のたての線で折ると、ぴったり重なる並びはどれですか。
        choices: [🟦🟦🟥, 🟦🟥🟦, 🟥🟦🟦]
        answer: 🟦🟥🟦
        check: "[c for c in ['🟦🟦🟥', '🟦🟥🟦', '🟥🟦🟦'] if c == c[::-1]][0]"
        hints:
          - 折ると、左のはしと右のはしが重なるよ。
          - 左のはしと右のはしの色をくらべよう。
          - 左から読んでも右から読んでも同じ並びをさがそう。
        paths:
          - [はしとはしの色が同じ, 🟦🟥🟦]
      - part: 思い出す
        text: この形は、四角の色板が何まいでできていますか。
        figure: "🟥🟥🟥\n🟥🟥⬜"
        answer: 5
        check: "n('🟥')"
        hints:
          - 色板を 1 まいずつ指でさそう。
          - 上の列から数えよう。
          - ⬜ は色板のない所だよ。
        paths:
          - [上の列 3 まい, 下の列に続けて 4、5, 5 まい]
      - part: 今日
        text: テープを半分に折り、重なったまま、もう一度半分に折りました。テープは何まい重なっていますか。
        answer: 4
        check: "2 ** 2"
        hints:
          - 1 回折ると、何まい重なるかな。
          - 2 回目は、重なったテープを一度に折るね。
          - テープを折って、はしを数えてみよう。
        paths:
          - [1 回で 2 まい, 2 まいがもう一度重なって 4 まい]
        note: 2 回折ったから 2 まい、と答えやすい。じっさいに折って、はしの紙を数える。
      - part: 今日
        text: 前の問題のように 2 回折ったテープを、広げました。折り目は何本ありますか。
        answer: 3
        check: "2 ** 2 - 1"
        hints:
          - 1 回目の折り目は、どこにできたかな。
          - 2 回目に折ると、新しい折り目はいくつできるかな。
          - テープを広げて、折り目を指でなぞって数えよう。
        paths:
          - [まん中に 1 本, 2 回目で左右に 1 本ずつ, ぜんぶで 3 本]
        note: 2 回折ったから 2 本、と答えやすい。広げて数えると確かめられる。
      - part: 今日
        text: テープを半分に折るのを、3 回くり返しました。テープは何まい重なっていますか。
        answer: 8
        check: "2 ** 3"
        hints:
          - 2 回折ったときは、何まい重なったかな。
          - 3 回目は、その重なりを一度に折るね。
          - テープを 3 回折って、はしを数えよう。
        paths:
          - [2 回で 4 まい, 3 回目でその 4 まいがもう一度重なる, 8 まい]
      - part: 挑戦
        text: テープを半分に折るのを 3 回くり返してから、広げました。折り目は何本ありますか。
        answer: 7
        check: "2 ** 3 - 1"
        hints:
          - 3 回折ったテープは、何まい重なっていたかな。
          - 広げると、テープはいくつの部分に分かれて見えるかな。
          - となりの部分のさかい目が折り目だね。
        paths:
          - [8 まい重なる, 広げると 8 つの部分, さかい目は 7 本]
          - [じっさいに 3 回折って広げ、折り目を数える]
        note: 部分の数と折り目の数は 1 ちがう。植木算と同じ考え。
