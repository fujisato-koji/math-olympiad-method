        explain: 図はひもで作った「ひと結び」です。黒い点がひもの両はしです。交わりでは、1 本が上を、もう 1 本が下を通ります。図ですき間がある方が下を通るひもです。この結び目には交わりが 3 つあり、左のはしからたどると、上、下、上、下…と交互に通ります。両はしを持ったまま、手をはなさずに引っぱると、結び目はほどけずに小さくしまります。ひもで同じ形を作って、確かめてみましょう。
