# G-014 立体の切断
#
# 書き方は N-001 の頭の注のとおり。
# 立方体を 1 つの平面で切ったときの切り口の形を、3 つの点から決める。切り口の線のきまりは 2 つ：
#   ① 同じ面の上にある 2 つの点は、まっすぐ結ぶ。② 向かい合う平行な面にできる切り口の線は、平行になる。
# 立方体の頂点の名前：上の面が ABCD（A が手前の左、B が手前の右、C が奥の右、D が奥の左）、下の面が EFGH（A の真下が E、B の真下が F…）。
#   図にはいつも名前を書いた。点線は見えない辺。辺の「まん中の点」を P、Q、R とした。
# ことば：切り口、正三角形（3 つの辺の長さがみな等しい三角形）、二等辺三角形（2 つの辺の長さが等しい三角形）、
#   ひし形（4 つの辺の長さがみな等しい四角形）、台形（G-008）、正六角形（6 つの辺の長さがみな等しく、6 つの角がみな等しい六角形）。
#   ことばは問題文で約束して使い、二等辺三角形やひし形の性質（G-017）は使わない。長さが等しいことは「同じ大きさの正方形の対角線」などで見る。
# 前提は G-011（体積と表面積）だけ。計算は G-011 と同じく九九と何十 × 1 けた、2 けたの数を数回たすまで。
#   角すい（立方体の角を切りとった立体）の体積は G-011 で扱っていないので求めない。のこった立体は面・辺・頂点の数を数える。
#   切り口の面積は、正方形・長方形の辺がわかるものだけ（ななめの辺の長さは三平方の定理 G-019 が要るので求めない）。
# 円柱の切り口（底面に平行なら円、軸をふくむ平面なら長方形）は、面積の問題として 3 日目と 5 日目に入れた。
# 図は svg（D-040）。形を答える問題の図には、通る点だけをかき、切り口はかかない（図を見て答えがわからないように）。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 切り口の形（頂点や辺のまん中を通る、三角形と四角形）　2 日目 切り口の線のきまり（台形、五角形、六角形）
#   3 日目 切ったあとの立体（体積、面・辺・頂点の数）、円柱の切り口　4 日目 わけ（正三角形になる、平行になる、七角形にならない）
#   5 日目 G-011（体積・表面積）と混ぜる、色をぬった立方体を切り分ける　6 日目 確認
# check：切り口は、1 辺 4 の立方体（頂点の座標は 0 か 4）と 3 つの点の座標から、切る平面と 12 本の辺が交わる点を求め、
#   点の数と辺・対角線の長さから形の名前を出す式（同じ式を各問題に書いた）。体積と数は式。

id: G-014
