        explain: |-
          p は光子の運動量、h はプランク定数、λ は波長です。
          光子の運動量 p = h/λ。波長が長いほど、運動量は小さい。
          コンプトン散乱では、光子が電子にエネルギーをわたすので、光子のエネルギーはへり、E = hc/λ から波長は長くなります。
          電子は、受け取ったエネルギーで動き出します。図の左がぶつかる前、右がぶつかった後です。
        note: 光子の運動量 p = h/λ。コンプトン散乱では、波長が長くなる。
