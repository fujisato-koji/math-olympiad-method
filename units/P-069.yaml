        text: |-
          原子の中の電子は、とびとびのエネルギー準位をもちます。
          水素原子のエネルギー準位は E_n = −13.6/n² eV（n = 1、2、3、…）。
          n = 1 がもっとも低い（基底状態）。n が大きいほどエネルギーが高く、0 に近づきます。
          電子が高い準位から低い準位へ移るとき、エネルギー差の光子を出します。hf = E_high − E_low。
          光を当てて、ちょうどエネルギー差に合う光子だけが吸収され、線スペクトルになります。
        explain: |-
          E_n = −13.6/n² eV。n=1 で −13.6 eV、n=2 で −3.4 eV、n=3 で約 −1.51 eV。
          光子のエネルギーは、2 つの準位の差。n=2 → n=1 なら、−3.4 − (−13.6) = 10.2 eV。
          準位がとびとびなので、出る光の振動数もとびとびになり、線スペクトルになります。
        note: 水素の準位 E_n = −13.6/n² eV。光子のエネルギーは準位の差。
      - part: 思い出す
