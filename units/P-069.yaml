        id: "f5291421f5"
        text: 水素の n=2 から n=1 の光子のエネルギーが 10.2 eV になるわけを説明しましょう。
        explain: 「水素の準位は E_n = −13.6/n² eV。n=1 は −13.6 eV、n=2 は −3.4 eV。高い準位から低い準位へ移るとき、差のエネルギーを光子として出す。−3.4 − (−13.6) = 10.2 eV。」と書ければよい。① 準位の式、② 2 つの値、③ 差をとる。子どもには、n=3 → 2 の 1.89 eV も確かめさせます。
        hints:
          - E_n = −13.6/n² eV に、n = 1 と n = 2 を入れます。
          - text: 2 つの準位の高さの差が、光子のエネルギーです。
