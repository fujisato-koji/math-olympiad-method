    items:
      - part: わけ
        text: 光電効果の式 Kmax = hf − W が成り立つわけを、エネルギーの保存で説明しましょう。
        explain: 「光子 1 つが電子 1 つに hf のエネルギーを渡す。電子が金属から出るには、仕事関数 W のエネルギーが要る。残りが運動エネルギーになる。最大の運動エネルギーは、取り出しに余分なエネルギーを使わなかったときなので、Kmax = hf − W。」と書ければよい。① 光子 1 つと電子 1 つ、② 取り出す仕事 W、③ 残りが Kmax。子どもには、具体的な数で確かめさせます。
        hints:
