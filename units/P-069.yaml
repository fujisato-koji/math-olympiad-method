 stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.7"/><text x="265" y="172" font-size="13" text-anchor="middle" fill="currentColor">大きい</text><text x="160" y="194" font-size="13" text-anchor="middle" fill="currentColor">1 eV = 1.6 × 10⁻¹⁹ J</text></svg>'
        explain: |-
          c = fλ から f = c/λ。E = hf = hc/λ。
          例：λ = 600 nm = 6 × 10⁻⁷ m なら、E = 1.98 × 10⁻²⁵ ÷ (6 × 10⁻⁷) = 3.3 × 10⁻¹⁹ J。
          eV に直すには、1.6 × 10⁻¹⁹ でわります。3.3 × 10⁻¹⁹ J は約 2.06 eV。
          図の右のぼうは、600 nm と 400 nm の光子のエネルギーを、同じ目もりでくらべたものです。
        note: E = hf = hc/λ。波長が短いほどエネルギーが大きい。1 eV = 1.6 × 10⁻¹⁹ J。
