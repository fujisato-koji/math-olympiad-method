    text: 図の光子を金属に当てたとき、飛び出す光電子を止める電圧は何 V ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="13" text-anchor="middle" fill="currentColor">光子 1 つのエネルギー（単位 eV）</text><rect x="148" y="126" width="60" height="56" rx="0" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.7"/><rect x="148" y="42" width="60" height="84" rx="0" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.6"/><text x="178" y="159" font-size="14" text-anchor="middle" fill="currentColor">W = 2</text><text x="178" y="89" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="217" y="159" font-size="13" text-anchor="start" fill="currentColor">出るのに使う</text><text x="217" y="89" font-size="13" text-anchor="start" fill="currentColor">運動エネルギー</text><line x1="98" y1="182" x2="98" y2="42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="93" y1="182" x2="103" y2="182" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="93" y1="42" x2="103" y2="42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="89" y="117" font-size="14" text-anchor="end" fill="currentColor">hf = 5</text></svg>'
    choices: ["2", "3", "5", "7"]
    answer: 3
    check: "5 - 2"
    hints:
      - まず、光電子の最大の運動エネルギー Kmax を求めます。
      - text: 電子は、電圧 1 V 分の坂を上るごとに、1 eV のエネルギーを失います。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="14" text-anchor="middle" fill="currentColor">電子を止める電圧（坂で表す）</text><polygon points="40,176 300,176 300,62" fill="#c8ccd6" fill-opacity=".25"/><rect x="8" y="70" width="18" height="110" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.7"/><text x="17" y="196" font-size="13" text-anchor="middle" fill="currentColor">金属</text><line x1="40" y1="176" x2="300" y2="62" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="101" y1="138.5" x2="109" y2="156.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="99" y="135.5" font-size="13" text-anchor="end" fill="currentColor">1 V</text><line x1="166" y1="110" x2="174" y2="128" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="164" y="107" font-size="13" text-anchor="end" fill="currentColor">2 V</text><line x1="231" y1="81.5" x2="239" y2="99.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="229" y="78.5" font-size="13" text-anchor="end" fill="currentColor">3 V</text><line x1="296" y1="53" x2="304" y2="71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="294" y="50" font-size="13" text-anchor="end" fill="currentColor">4 V</text><text x="225" y="152" font-size="13" text-anchor="middle" fill="currentColor">1 V 上るごとに</text><text x="225" y="170" font-size="13" text-anchor="middle" fill="currentColor">1 eV へる</text></svg>'
      - 7 は 5 と 2 をたした数です。止める電圧は、Kmax の大きさで決まります。
    paths:
      - [Kmax = 5 − 2 = 3 eV, eV = Kmax, V = 3 V]
      - [ぼうの黄色の部分は 3 eV, 1 eV ごとに 1 V, 3 V]
    note: 光電効果の式 Kmax = hf − W と、止める電圧 eV = Kmax を続けて使う。
