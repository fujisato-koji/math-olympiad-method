# P-069 量子論の始まり
#
# 水準 4・8 日。前提は P-021（波の性質）、P-030（電荷と電場・電位）、P-004（仕事とエネルギー）。
# 光の粒子性と光電効果、光子のエネルギー、コンプトン散乱、物質波、線スペクトルとボーア模型を扱う。
# 日の並び：1 日目 導入（光電効果）、2 日目 練習（光子のエネルギー E = hc/λ と eV）、3 日目 練習（コンプトン散乱と光子の運動量）、4 日目 練習（物質波）、5 日目 練習（水素のエネルギー準位）、6 日目 わけ、7 日目 混ぜる（止める電圧も）、8 日目 確認。
# h = 6.6 × 10⁻³⁴ J·s、c = 3.0 × 10⁸ m/s、e = 1.6 × 10⁻¹⁹ C を使う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の決まり：光子は波打つ矢印（振動数が小さい光は赤、大きい光はむらさき）、電子は「−」の入った水色の丸、金属は灰色の板、エネルギーはぼうの高さ。
#   水素の準位は横線のはしごで、間かくは見やすさのため実際の比にしていない（数は横に書いた）。反比例は「たて × 横 が同じ長方形」の面積図で見せる。
# 用語の説明は《用語》で明示する（D-063）。

id: P-069
days:
  - day: 1
    items:
      - part: 見本
        id: "189c02ec31"
        text: |-
          光は、《光子》という小さなつぶの集まりのようにふるまうことがあります。
          《光子》 1 つのエネルギーは E = hf です（h はプランク定数 6.6 × 10⁻³⁴ J·s、f は《振動数》）。
          金属に光を当てると、電子が飛び出すことがあります。これを《光電効果》、出た電子を《光電子》といいます。
          電子 1 つを金属から取り出すのに要る最小のエネルギーを《仕事関数》 W といいます。
          図の左のように hf が W より小さいと、光をどんなに強くしても電子は出ません。電子が出はじめる振動数を《限界振動数》といいます。
