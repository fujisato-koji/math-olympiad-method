        explain: |-
          例：光子のエネルギー 3 eV、仕事関数 2 eV なら、Kmax = 1 eV。止める電圧は 1 V。
          運動量 2 × 10⁻²⁴ kg·m/s の電子の物質波は、λ = 6.6 × 10⁻³⁴ ÷ (2 × 10⁻²⁴) = 3.3 × 10⁻¹⁰ m。
