      - part: わけ
        text: ボールの物質波が見えないわけを、λ = h/p を使って説明しましょう。
        explain: 「λ = h/p。ボールは質量が大きいので運動量 p がとても大きく、λ は 10⁻³⁴ m ほどととても小さい。原子（10⁻¹⁰ m ほど）よりはるかに小さく、それほど細かいすき間はないので、回折や干渉が起きず、波の性質は見えない。電子は質量が小さく、λ が原子くらいになるので、原子のならびで回折が見える。」と書ければよい。① λ = h/p、② ボールは p が大きく λ がとても小さい、③ 回折にはすき間と同じくらいの波長が要る。子どもには、電子とボールの波長を数直線でくらべさせます。
        hints:
          - λ = h/p で、ボールと電子の運動量をくらべましょう。
          - text: 長さを、10 の何乗かでならべました。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">長さ（m）を 10 の何乗かでならべる</text><line x1="20" y1="112" x2="297.7" y2="112" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="304,112 295,117 295,107" fill="currentColor"/><line x1="66" y1="106" x2="66" y2="118" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="66" y="136" font-size="13" text-anchor="middle" fill="currentColor">10⁻³⁰</text><line x1="142" y1="106" x2="142" y2="118" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="142" y="136" font-size="13" text-anchor="middle" fill="currentColor">10⁻²⁰</text><line x1="218" y1="106" x2="218" y2="118" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="218" y="136" font-size="13" text-anchor="middle" fill="currentColor">10⁻¹⁰</text><line x1="294" y1="106" x2="294" y2="118" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="294" y="136" font-size="13" text-anchor="middle" fill="currentColor"></text><circle cx="35.6" cy="112" r="5" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.9"/><text x="26" y="82" font-size="13" text-anchor="start" fill="currentColor">ボールの λ</text><line x1="35.6" y1="86" x2="35.6" y2="105" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="218" cy="112" r="5" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.9"/><text x="218" y="66" font-size="13" text-anchor="middle" fill="currentColor">電子の λ</text><text x="218" y="84" font-size="13" text-anchor="middle" fill="currentColor">原子の大きさ</text><circle cx="286.4" cy="112" r="5" stroke="currentColor" stroke-width="2" fill="#c9a36b" fill-opacity="0.9"/><text x="300" y="166" font-size="13" text-anchor="end" fill="currentColor">ボールの大きさ</text><line x1="286.4" y1="119" x2="286.4" y2="152" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>'
          - 波が回折しやすいのは、すき間の大きさと波長が同じくらいのときです。
        paths:
          - [λ = h/p, ボールは p が大きく λ は 10⁻³⁴ m ほど, 原子よりはるかに小さく回折しない, 波の性質は見えない]
          - [電子は p が小さく λ が原子くらい, 原子のならびで回折する, ボールではそれが起きない]

  - day: 5
    items:
      - part: 見本
        id: "8f1da0ac7e"
        text: |-
          原子の中の電子は、とびとびのエネルギーしか持てません。このとびとびの高さを、エネルギー準位といいます。
          水素原子では E_n = −13.6/n² eV（n = 1、2、3、…）。n = 1 がいちばん低く、n が大きいほど高くなって 0 に近づきます。
          0 より上は原子の外です。電子を外へ出すことを《イオン化》といいます。
          図のように、電子が高い準位 E_H から低い準位 E_L へ下りるとき、差のエネルギーの光子を 1 つ出します。hf = E_H − E_L。
          とびとびの差の光だけが出るので、光を分けると何本かの線（線スペクトル）になります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="70" y1="28" x2="200" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="62" y="33" font-size="13" text-anchor="end" fill="currentColor">外</text><text x="208" y="33" font-size="13" text-anchor="start" fill="currentColor">0 eV</text><line x1="70" y1="165" x2="200" y2="165" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="62" y="170" font-size="13" text-anchor="end" fill="currentColor">n = 1</text><text x="208" y="170" font-size="13" text-anchor="start" fill="currentColor">−13.6 eV</text><line x1="70" y1="107" x2="200" y2="107" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="62" y="112" font-size="13" text-anchor="end" fill="currentColor">n = 2</text><text x="208" y="112" font-size="13" text-anchor="start" fill="currentColor">−3.4 eV</text><line x1="70" y1="74" x2="200" y2="74" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="62" y="79" font-size="13" text-anchor="end" fill="currentColor">n = 3</text><text x="208" y="79" font-size="13" text-anchor="start" fill="currentColor">−1.51 eV</text><line x1="115" y1="78" x2="115" y2="96.7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="115,103 110,94 120,94" fill="currentColor"/><circle cx="115" cy="62" r="9" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.7"/><text x="115" y="67" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><polyline points="122,91 123.5,87.5 125,87.5 126.5,91 128,94.5 129.5,94.5 131,91 132.5,87.5 134,87.5 135.5,91 137,94.5 138.5,94.5 140,91 141.5,87.5 143,87.5 144.5,91 146,94.5 147.5,94.5 149,91 150.5,87.5 152,87.5 153.5,91 155,94.5 156.5,94.5 158,91 159.5,87.5 161,87.5 161.4,88.2" fill="none" stroke="#b39ddb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="161.4" y1="88.2" x2="167.7" y2="91" stroke="#b39ddb" stroke-width="2.5" stroke-linecap="round"/><polygon points="174,91 165,96 165,86" fill="#b39ddb"/><text x="180" y="96" font-size="13" text-anchor="start" fill="currentColor">光子</text><text x="160" y="192" font-size="14" text-anchor="middle" fill="currentColor">hf = E_H − E_L</text></svg>'
        explain: |-
          E_n = −13.6/n² eV。n=1 で −13.6 eV、n=2 で −3.4 eV、n=3 で約 −1.51 eV。
          光子のエネルギーは、2 つの準位の差。n=2 → n=1 なら、−3.4 − (−13.6) = 10.2 eV。
          準位がとびとびなので、出る光の振動数もとびとびになり、線スペクトルになります。
          図の準位の間かくは、見やすさのため実際の比にしていません（数は横に書きました）。
        note: 水素の準位 E_n = −13.6/n² eV。光子のエネルギーは準位の差。
      - part: 思い出す
