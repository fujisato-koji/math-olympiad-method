      - part: わけ
        id: "381c15ac30"
        text: 物質波の波長が λ = h/p になるわけを、光子の関係から説明しましょう。
        explain: 「光子では、エネルギー E = hf と運動量 p の間に E = pc がある。p = E/c = hf/c。c = fλ なので、p = h/λ、つまり λ = h/p。ド・ブロイは、この関係をすべてのつぶに広げた。」と書ければよい。① 光子の E = pc、② p = h/λ、③ すべてのつぶに広げる。子どもには、電子とボールの波長をくらべさせます。
        hints:
          - 光子では E = pc です。
          - text: E = hf、c = fλ を使って、式をつなげます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="50" y="14" width="220" height="26" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="160" y="33" font-size="14" text-anchor="middle" fill="currentColor">E = pc</text><line x1="160" y1="41" x2="160" y2="43.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,48 156.2,41 163.8,41" fill="currentColor"/><rect x="50" y="49" width="220" height="26" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="160" y="68" font-size="14" text-anchor="middle" fill="currentColor">p = E/c = hf/c</text><line x1="160" y1="76" x2="160" y2="78.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,83 156.2,76 163.8,76" fill="currentColor"/><rect x="50" y="84" width="220" height="26" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="160" y="103" font-size="14" text-anchor="middle" fill="currentColor">c = fλ を入れる</text><line x1="160" y1="111" x2="160" y2="113.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,118 156.2,111 163.8,111" fill="currentColor"/><rect x="50" y="119" width="220" height="26" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="160" y="138" font-size="14" text-anchor="middle" fill="currentColor">p = h/λ</text><line x1="160" y1="146" x2="160" y2="148.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,153 156.2,146 163.8,146" fill="currentColor"/><rect x="50" y="154" width="220" height="26" rx="3" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.35"/><text x="160" y="173" font-size="14" text-anchor="middle" fill="currentColor">電子などのつぶにも λ = h/p</text></svg>'
          - 光子で見つけた関係を、電子などのつぶにも使えると考えたのがド・ブロイです。
        paths:
          - [光子 E = pc, p = h/λ, すべてのつぶに広げる, λ = h/p]
          - [電子線回折で波長を測る, λ = h/p と合う, 考えが正しいと確かめられた]
      - part: わけ
        id: "13197101c8"
        text: 原子のエネルギー準位がとびとびだと、線スペクトルになるわけを説明しましょう。
        explain: 「電子はとびとびの準位の間しか移れない。移るときに出る光子のエネルギーは、準位の差で決まる。差がとびとびなので、光子の振動数 f = ΔE/h もとびとびになる。だから、連続したにじではなく、決まった振動数の線だけが現れる。」と書ければよい。① 準位がとびとび、② 光子のエネルギーは差、③ 振動数もとびとび。子どもには、水素の 10.2 eV の例で確かめさせます。
        hints:
          - 電子は、とびとびの準位の間しか移れません。
          - text: 準位の差の矢印 1 本ごとに、1 つの色の線が出ます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="58" y1="28" x2="160" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="52" y="33" font-size="13" text-anchor="end" fill="currentColor">外</text><line x1="58" y1="48" x2="160" y2="48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="52" y="53" font-size="13" text-anchor="end" fill="currentColor">n = 5</text><line x1="58" y1="68" x2="160" y2="68" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="52" y="73" font-size="13" text-anchor="end" fill="currentColor">n = 4</text><line x1="58" y1="96" x2="160" y2="96" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="52" y="101" font-size="13" text-anchor="end" fill="currentColor">n = 3</text><line x1="58" y1="166" x2="160" y2="166" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="52" y="171" font-size="13" text-anchor="end" fill="currentColor">n = 2</text><line x1="88" y1="100" x2="88" y2="155" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="88,162 82.5,152 93.5,152" fill="#f08080"/><line x1="112" y1="72" x2="112" y2="155" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="112,162 106.5,152 117.5,152" fill="#7fc8f8"/><line x1="136" y1="52" x2="136" y2="155" stroke="#b39ddb" stroke-width="3" stroke-linecap="round"/><polygon points="136,162 130.5,152 141.5,152" fill="#b39ddb"/><rect x="190" y="70" width="120" height="54" rx="2" stroke="currentColor" stroke-width="2" fill="#2b2f3a" fill-opacity="0.9"/><line x1="288.2" y1="74" x2="288.2" y2="120" stroke="#f08080" stroke-width="4" stroke-linecap="round"/><line x1="227" y1="74" x2="227" y2="120" stroke="#7fc8f8" stroke-width="4" stroke-linecap="round"/><line x1="208.2" y1="74" x2="208.2" y2="120" stroke="#b39ddb" stroke-width="4" stroke-linecap="round"/><text x="250" y="56" font-size="13" text-anchor="middle" fill="currentColor">光を分けると</text><text x="250" y="146" font-size="13" text-anchor="middle" fill="currentColor">とびとびの線</text><line x1="168" y1="110" x2="181.7" y2="102.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="186,100 181.8,106.8 178,100" fill="currentColor"/></svg>'
          - 振動数は f = ΔE/h です。ΔE がとびとびなら、f はどうなるでしょう。
        paths:
          - [準位がとびとび, 光子は準位の差, f = ΔE/h, 線スペクトル]
          - [もし準位がなめらかにつながっていたら, どんな差もあり得る, 光はにじのように続く]

  - day: 7
    items:
      - part: 見本
        id: "991d39b356"
        text: |-
          光電効果・物質波・ボーア模型を、1 つの問題で組み合わせます。
          ・光子のエネルギー：E = hf = hc/λ
          ・《光電効果》：Kmax = hf − W
          ・電子を止める電圧（そし電圧）V：飛び出した電子は、図の坂のように、電圧 1 V 分上るごとに 1 eV のエネルギーを失います。Kmax が 1.5 eV なら 1.5 V で止まります（eV = Kmax）。
          ・物質波：λ = h/p
          ・水素の準位：E_n = −13.6/n² eV、光子のエネルギーは準位の差
