        text: |-
          光子のエネルギーは、波長 λ でも書けます。E = hc/λ（c は光の速さ 3.0 × 10⁸ m/s）。
          hc = 6.6 × 10⁻³⁴ × 3.0 × 10⁸ = 1.98 × 10⁻²⁵ J·m です。
          図のように、波長が短いほど、光子のエネルギーは大きくなります。
