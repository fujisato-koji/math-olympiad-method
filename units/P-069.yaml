    text: 水素原子で、n=2（−3.4 eV）から n=1（−13.6 eV）へ移るときに出る光子のエネルギーは何 eV ですか。
    choices: [3.4, 10.2, 13.6, 17.0]
    answer: 10.2
    check: "-3.4 - (-13.6)"
    hints:
      - 準位の差をとります。
      - −3.4 − (−13.6) を計算します。
      - 10.2 eV です。
    paths:
