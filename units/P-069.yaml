      - part: わけ
        id: "09c7702db2"
        text: 光電効果の式 Kmax = hf − W が成り立つわけを、エネルギーの出入りで説明しましょう。
        explain: 「光子 1 つが電子 1 つに hf のエネルギーをわたす。電子が金属から出るには、仕事関数 W のエネルギーが要る。残りが運動エネルギーになる。最大の運動エネルギーは、出るのにちょうど W だけ使ったときなので、Kmax = hf − W。」と書ければよい。① 光子 1 つと電子 1 つ、② 取り出す仕事 W、③ 残りが Kmax。子どもには、具体的な数で確かめさせます。
        hints:
          - 光子 1 つが、電子 1 つにエネルギー hf をわたします。
          - text: わたされた hf を、電子は 2 つに分けて使います。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="140" y="98" width="60" height="80" rx="0" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.7"/><rect x="140" y="38" width="60" height="60" rx="0" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.6"/><text x="209" y="135" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">W</text><text x="209" y="153" font-size="13" text-anchor="start" fill="currentColor">出るのに使う</text><text x="209" y="65" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">Kmax</text><text x="209" y="83" font-size="13" text-anchor="start" fill="currentColor">運動エネルギー</text><line x1="110" y1="178" x2="110" y2="38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="105" y1="178" x2="115" y2="178" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="105" y1="38" x2="115" y2="38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="101" y="113" font-size="14" text-anchor="end" fill="currentColor">hf</text></svg>'
          - 残りがいちばん多くなるのは、出るのにちょうど W だけ使ったときです。
