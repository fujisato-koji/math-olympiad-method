        explain: |-
          【現象】光電効果では、光子 1 つが電子 1 つにエネルギーをわたします。光子のエネルギー hf が仕事関数 W より小さいと、電子は金属から出られません。
          光を強くすると光子の数はふえますが、光子 1 つのエネルギーは変わらないので、限界振動数より下では電子が出ません。
          振動数が大きいほど、飛び出す電子の最大の運動エネルギー Kmax = hf − W は大きくなります。図の左は赤い光（f が小さい）、右はむらさきの光（f が大きい）です。
        note: 光は光子の粒。E = hf。光電効果は、光子 1 つと電子 1 つのやりとり。
      - part: 思い出す
        id: "441a9b0b08"
        text: 振動数 f の光子のエネルギーを表す式はどれですか。
        choices: ["E = h/f", "E = hf", "E = f/h", "E = h + f"]
        answer: "E = hf"
        check: "'E = hf'"
        hints:
          - 見本の式を思い出しましょう。h はプランク定数という、とても小さな決まった数です。
          - text: 図は、振動数を 2 倍、3 倍にしたときの、光子 1 つのエネルギーのぼうです。それぞれの式の f を 2f にかえて、E が図と同じように変わるかをくらべましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">光子 1 つのエネルギー（ぼうの高さ）</text><rect x="72" y="130" width="36" height="35" rx="0" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.6"/><text x="90" y="123" font-size="14" text-anchor="middle" fill="currentColor">E</text><text x="90" y="185" font-size="13" text-anchor="middle" fill="currentColor">振動数 f</text><rect x="142" y="95" width="36" height="70" rx="0" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.6"/><text x="160" y="88" font-size="14" text-anchor="middle" fill="currentColor">2E</text><text x="160" y="185" font-size="13" text-anchor="middle" fill="currentColor">振動数 2f</text><rect x="212" y="60" width="36" height="105" rx="0" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.6"/><text x="230" y="53" font-size="14" text-anchor="middle" fill="currentColor">3E</text><text x="230" y="185" font-size="13" text-anchor="middle" fill="currentColor">振動数 3f</text><line x1="45" y1="165" x2="285" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
          - 単位でも確かめられます。E は J、h は J·s、f は 1 秒あたりの回数（1/s）です。かけたりわったりして J になるのはどれでしょう。
        paths:
          - [エネルギーは振動数に比例, 比例の数が h, E = hf]
