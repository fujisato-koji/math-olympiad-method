      - part: わけ
        id: "8ee522831c"
        text: 光子のエネルギーが E = hc/λ と書けるわけを説明しましょう。
        explain: 「光の速さは c = fλ なので、f = c/λ。光子のエネルギーは E = hf。f に c/λ を入れると、E = hc/λ。」と書ければよい。① c = fλ、② E = hf、③ 入れかえる。子どもには、具体的な波長で確かめさせます。
        hints:
          - 1 秒間に、光は c だけ進みます。その中に、長さ λ の波が f こ入ります。
