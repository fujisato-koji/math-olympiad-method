          - かけ算の答えが「□ × 10⁻²⁰」の形で出たら、10⁻²⁰ は 10⁻¹⁹ の 1/10 であることを使って直します。
        paths:
          - [E = hf, 6.6 × 5 = 33 と 10⁻³⁴ × 10¹⁴ = 10⁻²⁰, 33 × 10⁻²⁰ = 3.3 × 10⁻¹⁹ J]
