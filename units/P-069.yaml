      - part: わけ
        text: 限界振動数より低い振動数の光は、どんなに強くしても光電子を出せません。そのわけを説明しましょう。
        explain: 「光を強くすると光子の数はふえるが、光子 1 つのエネルギー hf は変わらない。電子 1 つは光子 1 つからエネルギーをもらう。hf が仕事関数 W より小さいと、どの電子も金属から出られない。だから強さを変えても出ない。」と書ければよい。① 強さで変わるのは光子の数、② 光子 1 つと電子 1 つのやりとり、③ hf < W。子どもには、図の 1 つずつのぼうと W の高さをくらべさせます。
        hints:
          - 光を強くすると、何がふえて、何が変わらないでしょう。
          - text: 電子 1 つがもらえるのは、光子 1 つ分のエネルギーです。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="14" text-anchor="middle" fill="currentColor">光子 1 つずつのエネルギー</text><line x1="30" y1="62" x2="300" y2="62" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="34" y="53" font-size="13" text-anchor="start" fill="currentColor">W（金属から出るのに要る高さ）</text><rect x="59" y="108" width="32" height="64" rx="0" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.55"/><text x="75" y="101" font-size="14" text-anchor="middle" fill="currentColor">hf</text><text x="75" y="190" font-size="13" text-anchor="middle" fill="currentColor">光子 1</text><rect x="117" y="108" width="32" height="64" rx="0" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.55"/><text x="133" y="101" font-size="14" text-anchor="middle" fill="currentColor">hf</text><text x="133" y="190" font-size="13" text-anchor="middle" fill="currentColor">光子 2</text><rect x="175" y="108" width="32" height="64" rx="0" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.55"/><text x="191" y="101" font-size="14" text-anchor="middle" fill="currentColor">hf</text><text x="191" y="190" font-size="13" text-anchor="middle" fill="currentColor">光子 3</text><rect x="233" y="108" width="32" height="64" rx="0" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.55"/><text x="249" y="101" font-size="14" text-anchor="middle" fill="currentColor">hf</text><text x="249" y="190" font-size="13" text-anchor="middle" fill="currentColor">光子 4</text><line x1="30" y1="172" x2="300" y2="172" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
