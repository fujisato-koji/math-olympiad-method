      - part: 見本
        id: "ab766f6c19"
        text: |-
          光子は、運動量 p も持っています。p = h/λ。
          《コンプトン散乱》：X 線の光子を電子に当てると、光子は電子をはね飛ばし、エネルギーと運動量の一部を電子にわたします。
          図のように、はね返った光子はエネルギーがへるので、波長がもとより長くなります。
