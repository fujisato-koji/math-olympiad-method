# P-069 量子論の始まり
#
# 段 5・水準 3・8 日。前提は P-021（波の性質）、P-030（電荷と電場・電位）、P-004（仕事とエネルギー）。
# 光の粒子性と光電効果、光子のエネルギー、コンプトン散乱、物質波、線スペクトルとボーア模型を扱う。
# h = 6.6 × 10⁻³⁴ J·s、c = 3.0 × 10⁸ m/s、e = 1.6 × 10⁻¹⁹ C を使う。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-069
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          光は、光子（photon）という粒の集まりとしてふるまうことがあります。
          光子 1 つのエネルギーは E = h f。h はプランク定数（6.6 × 10⁻³⁴ J·s）、f は振動数です。
          光電効果：金属に光を当てると、電子が飛び出します。
          振動数が小さいと、光を強くしても電子は出ません（限界振動数）。振動数が大きいと、強さに関係なく電子が出ます。
        explain: |-
          光電効果では、光子 1 つが電子 1 つにエネルギーを渡します。光子のエネルギー hf が、電子を金属から取り出すのに必要な仕事 W（仕事関数）より小さいと、電子は出られません。
          光を強くしても、光子 1 つのエネルギーは変わらないので、限界振動数より下では電子が出ません。
          振動数が大きいほど、飛び出す電子の最大の運動エネルギーは大きくなります。
        note: 光は光子の粒。E = hf。光電効果は、光子 1 つと電子 1 つのやりとり。
      - part: 思い出す
        text: 振動数 f の光子のエネルギーはどれですか。
        choices: ["E = h/f", "E = hf", "E = f/h", "E = h + f"]
        answer: "E = hf"
        check: "'E = hf'"
        hints:
          - 光子のエネルギーは、振動数に比例します。
          - 比例定数がプランク定数 h です。
          - E = hf です。
        paths:
          - [エネルギーは振動数に比例, 比例定数 h, E = hf]
      - part: 今日
        text: 振動数 5 × 10¹⁴ Hz の光子のエネルギーは、何 × 10⁻¹⁹ J ですか。h = 6.6 × 10⁻³⁴ J·s とします。
        choices: [1.32, 3.3, 33, 1.32 × 10⁻¹⁹]
        answer: 3.3
        check: "f'{6.6e-34 * 5e14 / 1e-19:.1f}'"
        hints:
          - E = hf です。
          - 6.6 × 10⁻³⁴ × 5 × 10¹⁴ を計算します。
          - 3.3 × 10⁻¹⁹ J です。
        paths:
          - [E = hf, 6.6e-34 × 5e14 = 3.3e-19 J]
      - part: 今日
        text: 限界振動数より低い振動数の光を、強くして当てると、光電子はどうなりますか。
        choices: ["たくさん出る", "少し出る", "出ない", "速く出る"]
        answer: "出ない"
        check: "'出ない'"
        hints:
          - 光を強くしても、光子 1 つのエネルギーは変わりません。
          - 光子 1 つのエネルギーが仕事関数より小さいと、電子は出られません。
          - 出ません。
        paths:
          - [強くしても光子 1 つのエネルギーは同じ, 仕事関数より小さい, 出ない]
      - part: 今日
        text: 光子のエネルギーが 5 × 10⁻¹⁹ J、仕事関数が 3 × 10⁻¹⁹ J のとき、光電子の最大の運動エネルギーは何 × 10⁻¹⁹ J ですか。
        choices: [1, 2, 3, 8]
        answer: 2
        check: "f'{(5e-19 - 3e-19) / 1e-19:.0f}'"
        hints:
          - 光子のエネルギーから仕事関数を引きます。
          - 5 − 3 を計算します。
          - 2 × 10⁻¹⁹ J です。
        paths:
          - [Kmax = hf − W, 5e-19 − 3e-19 = 2e-19 J]
      - part: 挑戦
        text: 限界振動数より高い振動数の光で、光の強さを 2 倍にすると、飛び出す電子の数と最大の運動エネルギーはどうなりますか。
        choices: ["数は 2 倍、エネルギーは変わらない", "数もエネルギーも 2 倍", "数は変わらず、エネルギーが 2 倍", "どちらも変わらない"]
        answer: "数は 2 倍、エネルギーは変わらない"
        check: "'数は 2 倍、エネルギーは変わらない'"
        hints:
          - 光を強くすると、光子の数が増えます。
          - 光子 1 つのエネルギー hf は変わりません。
          - 電子の数は増えますが、最大の運動エネルギーは変わりません。
        paths:
          - [強さ 2 倍は光子 2 倍, hf は同じ, 電子の数 2 倍、Kmax 同じ]
    extra:
      - part: 今日
        text: 光子のエネルギーは、振動数に比例しますか、反比例しますか。
        choices: ["比例", "反比例", "2 乗に比例", "関係ない"]
        answer: "比例"
        check: "'比例'"
        hints:
          - E = hf です。
          - f が 2 倍になると、E はどうなりますか。
          - 比例します。
        paths:
          - [E = hf, f に比例]
      - part: 今日
        text: 仕事関数 W とは何ですか。
        choices: ["電子を金属から取り出すのに必要なエネルギー", "光子のエネルギー", "電子の運動エネルギー", "光の速さ"]
        answer: "電子を金属から取り出すのに必要なエネルギー"
        check: "'電子を金属から取り出すのに必要なエネルギー'"
        hints:
          - 光電効果で、電子が金属の中から出てきます。
          - 出るためには、束縛を切るエネルギーが要ります。
          - それが仕事関数です。
        paths:
          - [電子を金属から取り出す, 必要なエネルギー, 仕事関数]
      - part: わけ
        text: 光電効果で、光電子の最大の運動エネルギーが Kmax = hf − W になるわけを説明しましょう。
        explain: 「光子 1 つが電子 1 つに hf のエネルギーを渡す。電子が金属から出るのに W の仕事が必要。残りが運動エネルギーになる。最大の運動エネルギーは、仕事が最小のときなので Kmax = hf − W。」と書ければよい。① 光子 1 つと電子 1 つ、② 取り出す仕事 W、③ 残りが運動エネルギー。子どもには、具体的な数で確かめさせます。
        hints:
          - 光子 1 つが電子 1 つにエネルギーを渡します。
          - 金属から出るのに W の仕事が要ります。
          - 残りが運動エネルギーになります。
        paths:
          - [光子のエネルギー hf, 取り出す仕事 W, 残りが Kmax, Kmax = hf − W]

  - day: 2
    items:
      - part: 見本
        text: |-
          光子のエネルギーは、波長で書くと E = hc/λ。
          c = 3.0 × 10⁸ m/s、h = 6.6 × 10⁻³⁴ J·s なので、hc = 1.98 × 10⁻²⁵ J·m。
          波長が短いほど、光子のエネルギーは大きい。
          エネルギーを eV（電子ボルト）で表すと、1 eV = 1.6 × 10⁻¹⁹ J。
        explain: |-
          c = fλ から f = c/λ。E = hf = hc/λ。
          例：λ = 600 nm = 6 × 10⁻⁷ m なら、E = 1.98 × 10⁻²⁵ / 6 × 10⁻⁷ = 3.3 × 10⁻¹⁹ J。
          eV に直すには、1.6 × 10⁻¹⁹ でわります。3.3 × 10⁻¹⁹ J は約 2.06 eV。
        note: E = hf = hc/λ。波長が短いほどエネルギーが大きい。1 eV = 1.6 × 10⁻¹⁹ J。
      - part: 思い出す
        text: 波長 λ と振動数 f の関係はどれですか。
        choices: ["f = cλ", "f = c/λ", "f = λ/c", "f = c + λ"]
        answer: "f = c/λ"
        check: "'f = c/λ'"
        hints:
          - 波の速さは v = fλ です。
          - 光の速さは c です。
          - c = fλ から f = c/λ です。
        paths:
          - [c = fλ, f = c/λ]
      - part: 今日
        text: 波長 600 nm の光子のエネルギーは、何 × 10⁻¹⁹ J ですか。hc = 1.98 × 10⁻²⁵ J·m とします。
        choices: [1.98, 3.3, 5.0, 33]
        answer: 3.3
        check: "f'{1.98e-25 / 6e-7 / 1e-19:.1f}'"
        hints:
          - E = hc/λ です。
          - 600 nm = 6 × 10⁻⁷ m です。
          - 1.98 × 10⁻²⁵ ÷ (6 × 10⁻⁷) = 3.3 × 10⁻¹⁹ J です。
        paths:
          - [E = hc/λ, 1.98e-25/6e-7 = 3.3e-19 J]
      - part: 今日
        text: エネルギー 3.2 × 10⁻¹⁹ J の光子は、何 eV ですか。1 eV = 1.6 × 10⁻¹⁹ J とします。
        choices: [0.5, 1, 2, 5]
        answer: 2
        check: "f'{3.2e-19 / 1.6e-19:.0f}'"
        hints:
          - eV に直すには、1.6 × 10⁻¹⁹ でわります。
          - 3.2 ÷ 1.6 を計算します。
          - 2 eV です。
        paths:
          - [E(eV) = E(J)/1.6e-19, 3.2/1.6 = 2 eV]
      - part: 挑戦
        text: 波長 400 nm の光子のエネルギーは、何 × 10⁻¹⁹ J ですか。hc = 1.98 × 10⁻²⁵ J·m とします。
        choices: [1.98, 3.3, 4.95, 9.9]
        answer: 4.95
        check: "f'{1.98e-25 / 4e-7 / 1e-19:.2f}'"
        hints:
          - E = hc/λ です。
          - 400 nm = 4 × 10⁻⁷ m です。
          - 1.98 × 10⁻²⁵ ÷ (4 × 10⁻⁷) = 4.95 × 10⁻¹⁹ J です。
        paths:
          - [E = hc/λ, 1.98e-25/4e-7 = 4.95e-19 J]
    extra:
      - part: 今日
        text: 波長が短くなると、光子のエネルギーはどうなりますか。
        choices: ["小さくなる", "大きくなる", "変わらない", "0 になる"]
        answer: "大きくなる"
        check: "'大きくなる'"
        hints:
          - E = hc/λ です。
          - λ が分母にあります。
          - 波長が短いほど、エネルギーは大きくなります。
        paths:
          - [E = hc/λ, λ が小さい, E は大きい]
      - part: 今日
        text: 振動数が 2 倍になると、光子のエネルギーは何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - E = hf です。
          - f が 2 倍になると、E はどうなりますか。
          - 2 倍になります。
        paths:
          - [E = hf, f が 2 倍, E も 2 倍]
      - part: わけ
        text: 光子のエネルギーが E = hc/λ と書けるわけを説明しましょう。
        explain: 「光の速さは c = fλ なので、f = c/λ。光子のエネルギーは E = hf。f に c/λ を入れると、E = hc/λ。」と書ければよい。① c = fλ、② E = hf、③ 代入。子どもには、具体的な波長で確かめさせます。
        hints:
          - 光の速さは c = fλ です。
          - 光子のエネルギーは E = hf です。
          - f = c/λ を代入します。
        paths:
          - [c = fλ, f = c/λ, E = hf, E = hc/λ]

  - day: 3
    items:
      - part: 見本
        text: |-
          光子は運動量をもちます。p = h/λ。
          コンプトン散乱：X 線（光子）を電子に当てると、光子はエネルギーと運動量の一部を電子に渡し、
          散乱された光子の波長はもとの波長より長くなります。
          エネルギーと運動量は、衝突の前後で保存されます。
        explain: |-
          光子の運動量 p = h/λ。波長が長いほど、運動量は小さい。
          コンプトン散乱では、光子が電子にエネルギーを渡すので、光子のエネルギーは減り、波長は長くなる。
          電子は、受け取ったエネルギーで運動します。
        note: 光子の運動量 p = h/λ。コンプトン散乱では、波長が長くなる。
      - part: 思い出す
        text: 光子の運動量 p はどれですか。
        choices: ["p = hλ", "p = h/λ", "p = λ/h", "p = h + λ"]
        answer: "p = h/λ"
        check: "'p = h/λ'"
        hints:
          - 光子の運動量は、波長に反比例します。
          - 比例定数が h です。
          - p = h/λ です。
        paths:
          - [運動量は波長に反比例, p = h/λ]
      - part: 今日
        text: 波長 500 nm の光子の運動量は、何 × 10⁻²⁷ kg·m/s ですか。h = 6.6 × 10⁻³⁴ J·s とします。
        choices: [1.32, 3.3, 13.2, 33]
        answer: 1.32
        check: "f'{6.6e-34 / 5e-7 / 1e-27:.2f}'"
        hints:
          - p = h/λ です。
          - 500 nm = 5 × 10⁻⁷ m です。
          - 6.6 × 10⁻³⁴ ÷ (5 × 10⁻⁷) = 1.32 × 10⁻²⁷ kg·m/s です。
        paths:
          - [p = h/λ, 6.6e-34/5e-7 = 1.32e-27]
      - part: 今日
        text: コンプトン散乱で、散乱された光子の波長は、もとの波長とくらべてどうなりますか。
        choices: ["長くなる", "短くなる", "変わらない", "0 になる"]
        answer: "長くなる"
        check: "'長くなる'"
        hints:
          - 光子は、エネルギーと運動量の一部を電子に渡します。
          - エネルギーが減ると、波長はどうなりますか。
          - 波長は長くなります。
        paths:
          - [光子がエネルギーを渡す, エネルギーが減る, 波長は長くなる]
      - part: 挑戦
        text: 光子の波長が 2 倍になると、光子の運動量は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "1/2 倍"
        check: "'1/2 倍'"
        hints:
          - p = h/λ です。
          - λ が 2 倍になると、p はどうなりますか。
          - 1/2 倍になります。
        paths:
          - [p = h/λ, λ が 2 倍, p は 1/2 倍]
    extra:
      - part: 今日
        text: コンプトン散乱で、光子が電子に渡すものは何ですか。
        choices: ["エネルギーと運動量", "電荷", "質量", "波長"]
        answer: "エネルギーと運動量"
        check: "'エネルギーと運動量'"
        hints:
          - 光子と電子の衝突です。
          - 衝突の前後で保存される量は何ですか。
          - エネルギーと運動量です。
        paths:
          - [光子と電子の衝突, エネルギーと運動量を渡す]
      - part: 今日
        text: 波長が長い光子ほど、運動量はどうなりますか。
        choices: ["大きい", "小さい", "変わらない", "0 になる"]
        answer: "小さい"
        check: "'小さい'"
        hints:
          - p = h/λ です。
          - λ が大きくなると、p はどうなりますか。
          - 小さくなります。
        paths:
          - [p = h/λ, λ が大きい, p は小さい]
      - part: わけ
        text: 光子の運動量が p = h/λ になるわけを、E = pc と E = hf から説明しましょう。
        explain: 「光のエネルギーは E = hf。光の運動量 p とは E = pc の関係がある。だから p = E/c = hf/c。c = fλ なので、p = hf/(fλ) = h/λ。」と書ければよい。① E = hf、② E = pc、③ c = fλ。子どもには、次元を確かめさせます。
        hints:
          - 光子のエネルギーは E = hf です。
          - 光では E = pc が成り立ちます。
          - p = E/c = hf/c、c = fλ を使います。
        paths:
          - [E = hf, E = pc, p = hf/c, c = fλ, p = h/λ]

  - day: 4
    items:
      - part: 見本
        text: |-
          物質波（ド・ブロイ波）：運動量 p をもつ粒子は、波長 λ = h/p の波としてふるまいます。
          電子を電圧 V で加速すると、運動エネルギー eV = p²/(2m) から p = √(2meV)、λ = h/√(2meV)。
          電子線回折のように、電子が波として回折・干渉することが確かめられています。
          ボールのような大きな物体では、λ が極端に小さく、波としての性質は見えません。
        explain: |-
          ド・ブロイは、光子の p = h/λ を、すべての粒子に広げました。λ = h/p。
          運動量が大きいほど、波長は短い。
          電子は質量が小さいので、身近な運動量でも波長が原子の大きさくらいになり、回折が見えます。
          ボールは質量が大きく、λ が 10⁻³⁴ m ほどで、観測できません。
        note: 物質波は λ = h/p。運動量が大きいほど波長が短い。
      - part: 思い出す
        text: 運動量 p は、質量 m と速さ v を使ってどう書けますか。
        choices: ["p = m/v", "p = mv", "p = v/m", "p = m + v"]
        answer: "p = mv"
        check: "'p = mv'"
        hints:
          - 運動量は、質量 × 速さです。
          - m と v をかけます。
          - p = mv です。
        paths:
          - [運動量 = 質量 × 速さ, p = mv]
      - part: 今日
        text: 運動量 2 × 10⁻²⁴ kg·m/s の電子の物質波の波長は、何 × 10⁻¹⁰ m ですか。h = 6.6 × 10⁻³⁴ J·s とします。
        choices: [1.32, 3.3, 6.6, 13.2]
        answer: 3.3
        check: "f'{6.6e-34 / 2e-24 / 1e-10:.1f}'"
        hints:
          - λ = h/p です。
          - 6.6 × 10⁻³⁴ ÷ (2 × 10⁻²⁴) を計算します。
          - 3.3 × 10⁻¹⁰ m です。
        paths:
          - [λ = h/p, 6.6e-34/2e-24 = 3.3e-10 m]
      - part: 今日
        text: 粒子の運動量が 2 倍になると、物質波の波長は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "1/2 倍"
        check: "'1/2 倍'"
        hints:
          - λ = h/p です。
          - p が 2 倍になると、λ はどうなりますか。
          - 1/2 倍になります。
        paths:
          - [λ = h/p, p が 2 倍, λ は 1/2 倍]
      - part: 挑戦
        text: 質量 0.1 kg のボールが 10 m/s で動くとき、物質波の波長は何 × 10⁻³⁴ m ですか。
        choices: [0.66, 6.6, 66, 660]
        answer: 6.6
        check: "f'{6.6e-34 / (0.1 * 10) / 1e-34:.1f}'"
        hints:
          - 運動量 p = mv = 0.1 × 10 = 1 kg·m/s です。
          - λ = h/p です。
          - 6.6 × 10⁻³⁴ m です。
        paths:
          - [p = 0.1 × 10 = 1, λ = 6.6e-34/1 = 6.6e-34 m]
    extra:
      - part: 今日
        text: 物質波の波長は、運動量が大きいほどどうなりますか。
        choices: ["長い", "短い", "変わらない", "0 になる"]
        answer: "短い"
        check: "'短い'"
        hints:
          - λ = h/p です。
          - p が大きいと、λ はどうなりますか。
          - 短くなります。
        paths:
          - [λ = h/p, p が大きい, λ は短い]
      - part: 今日
        text: 電子線回折は、電子が何としてふるまうことを示していますか。
        choices: ["粒", "波", "光", "電荷"]
        answer: "波"
        check: "'波'"
