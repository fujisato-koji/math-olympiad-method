          - 金属から出すのに W が要ります。
          - 残りが運動エネルギーです。
        paths:
          - [光子のエネルギー hf, 取り出す仕事 W, 残り Kmax, Kmax = hf − W]
      - part: わけ
        text: 物質波の波長が λ = h/p になるわけを、光子の関係から説明しましょう。
        explain: 「光子では、エネルギー E = hf と運動量 p の間に E = pc がある。p = E/c = hf/c。c = fλ なので、p = h/λ、つまり λ = h/p。ド・ブロイは、この関係をすべての粒子に広げた。」と書ければよい。① 光子の E = pc、② p = h/λ、③ すべての粒子に広げる。子どもには、電子とボールの波長をくらべさせます。
        hints:
          - 光子では E = pc です。
          - E = hf、c = fλ を使うと、p = h/λ になります。
          - これをすべての粒子に広げると、λ = h/p です。
        paths:
          - [光子 E = pc, p = h/λ, すべての粒子に広げる, λ = h/p]
      - part: わけ
        text: 原子のエネルギー準位がとびとびだと、線スペクトルになるわけを説明しましょう。
        explain: 「電子はとびとびの準位の間しか移れない。移るときに出る光子のエネルギーは、準位の差で決まる。差がとびとびなので、光子の振動数 f = ΔE/h もとびとびになる。だから、連続した虹ではなく、決まった振動数の線だけが現れる。」と書ければよい。① 準位がとびとび、② 光子のエネルギーは差、③ 振動数もとびとび。子どもには、水素の 10.2 eV の例で確かめさせます。
        hints:
