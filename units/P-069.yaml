troke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="146,158 137,162.9 137,153.1" fill="currentColor"/><text x="106" y="148" font-size="13" text-anchor="middle" fill="currentColor">2v</text><text x="262" y="163" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2 倍</text></svg>'
          - 単位は kg·m/s です。kg と m/s をどう組み合わせると、この形になるでしょう。
