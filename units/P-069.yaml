      - part: わけ
        id: "1e650bc16c"
        text: 光子の運動量が p = h/λ になるわけを、E = pc と E = hf から説明しましょう。
        explain: 「光のエネルギーは E = hf。光の運動量 p とは E = pc の関係がある。だから p = E/c = hf/c。c = fλ なので、p = hf/(fλ) = h/λ。」と書ければよい。① E = hf、② E = pc、③ c = fλ。子どもには、単位を確かめさせます。
        hints:
          - 光子のエネルギーは E = hf です。光では、E = pc も成り立ちます。
          - text: 式を、矢印の順につなげます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="50" y="14" width="220" height="28" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="160" y="33" font-size="14" text-anchor="middle" fill="currentColor">E = hf</text><line x1="160" y1="43" x2="160" y2="49.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,54 156.2,47 163.8,47" fill="currentColor"/><rect x="50" y="55" width="220" height="28" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="160" y="74" font-size="14" text-anchor="middle" fill="currentColor">p = E/c = hf/c</text><line x1="160" y1="84" x2="160" y2="90.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,95 156.2,88 163.8,88" fill="currentColor"/><rect x="50" y="96" width="220" height="28" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="160" y="115" font-size="14" text-anchor="middle" fill="currentColor">c = fλ を入れる</text><line x1="160" y1="125" x2="160" y2="131.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,136 156.2,129 163.8,129" fill="currentColor"/><rect x="50" y="137" width="220" height="28" rx="3" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.35"/><text x="160" y="156" font-size="14" text-anchor="middle" fill="currentColor">p = h/λ</text></svg>'
          - p = hf/c の c に fλ を入れると、f が消えます。
        paths:
          - [E = hf, E = pc, p = hf/c, c = fλ, p = h/λ]
          - [500 nm の光子で E = 3.96 × 10⁻¹⁹ J, p = E/c = 1.32 × 10⁻²⁷, h/λ も 1.32 × 10⁻²⁷]

  - day: 4
    items:
      - part: 見本
        id: "d7d8f921e2"
        text: |-
          《物質波》：運動量 p を持つ電子などのつぶも、波長 λ = h/p の波のようにふるまいます（ド・ブロイ波）。
          電子の流れ（電子線）を、原子がきちんとならんだうすい板に当てると、波と同じように《回折》して、しまもようができます。
          運動量 p が大きいほど、波長 λ は短くなります。
          図のように、ボールのような重い物では λ がとても小さく、波の性質は見えません。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="62" r="9" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.7"/><text x="32" y="67" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><polyline points="52,62 53.5,59 55,56.2 56.5,53.9 58,52.2 59.5,51.2 61,51 62.5,51.7 64,53.2 65.5,55.4 67,58 68.5,61 70,64 71.5,66.9 73,69.4 74.5,71.4 76,72.6 77.5,73 79,72.6 80.5,71.4 82,69.4 83.5,66.9 85,64 86.5,61 88,58 89.5,55.4 91,53.2 92.5,51.7 94,51 95.5,51.2 97,52.2 98.5,53.9 100,56.2 101.5,59 103,62 104.5,65 106,67.8 107.5,70.1 109,71.8 110.5,72.8 112,73 113.5,72.3 115,70.8 116.5,68.6 118,66 119.5,63 121,60 122.5,57.1 124,54.6 125.5,52.6 127,51.4 128.5,51 130,51.4 131.5,52.6 133,54.6 134.5,57.1 136,60 137.5,63 139,66 140.5,68.6 142,70.8 143.5,72.3 145,73 146.5,72.8 148,71.8 149.5,70.1 151,67.8 152.5,65 154,62 155.5,59 157,56.2 158.5,53.9 160,52.2 161.5,51.2 163,51 164.5,51.7 166,53.2 167.5,55.4 169,58 170.5,61 172,64 173.5,66.9 175,69.4 176.5,71.4 178,72.6 179.5,73 181,72.6 182.5,71.4 184,69.4 185.5,66.9 187,64 187.4,63.2" fill="none" stroke="#7fc8f8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="187.4" y1="63.2" x2="193.7" y2="62" stroke="#7fc8f8" stroke-width="2.5" stroke-linecap="round"/><polygon points="200,62 191,67 191,57" fill="#7fc8f8"/><text x="262" y="56" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">電子</text><text x="262" y="76" font-size="13" text-anchor="middle" fill="currentColor">λ は原子ほど</text><circle cx="48" cy="148" r="26" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.5"/><path d="M30 130 Q48 148 30 166" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="84,148 85.5,148 87,148 88.5,148 90,148 91.5,148 93,148 94.5,148 96,148 97.5,148 99,148 100.5,148 102,148 103.5,148 105,148 106.5,148 108,148 109.5,148 111,148 112.5,148 114,148 115.5,148 117,148 118.5,148 120,148 121.5,148 123,148 124.5,148 126,148 127.5,148 129,148 130.5,148 132,148 133.5,148 135,148 136.5,148 138,148 139.5,148 141,148 142.5,148 144,148 145.5,148 147,148 148.5,148 150,148 151.5,148 153,148 154.5,148 156,148 157.5,148 159,148 160.5,148 162,148 163.5,148 165,148 166.5,148 168,148 169.5,148 171,148 172.5,148 174,148 175.5,148 177,148 178.5,148 180,148 181.5,148 183,148 184.5,148 186,148 187.4,147.8" fill="none" stroke="#f08080" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="187.4" y1="147.8" x2="193.7" y2="148" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="200,148 191,152.9 191,143.1" fill="#f08080"/><text x="262" y="142" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">ボール</text><text x="262" y="162" font-size="13" text-anchor="middle" fill="currentColor">λ はとても小さい</text><text x="160" y="194" font-size="13" text-anchor="middle" fill="currentColor">λ = h/p（p が大きいほど λ は短い）</text></svg>'
        explain: |-
          p はつぶの運動量、m は質量、h はプランク定数、λ は物質波の波長です。
          ド・ブロイは、光子の p = h/λ を、すべてのつぶに広げました。λ = h/p。
          運動量が大きいほど、波長は短い。
          電子は質量が小さいので、波長が原子の大きさ（10⁻¹⁰ m ほど）くらいになり、回折が見えます。
          ボールは質量が大きく、λ が 10⁻³⁴ m ほどで、観測できません。
          電圧 V で加速した電子では、eV = p²/(2m) から p = √(2meV)、λ = h/√(2meV) です（この単元の問題では使いません）。
        note: 物質波は λ = h/p。運動量が大きいほど波長が短い。
      - part: 思い出す
        id: "9e48fdd2e5"
        text: 図の物の運動量 p は、質量 m と速さ v を使ってどう書けますか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="88" cy="100" r="32" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.5"/><path d="M66 77 Q88 100 66 123" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="92" y="106" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">m</text><line x1="130" y1="100" x2="203.7" y2="100" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="210,100 201,105 201,95" fill="currentColor"/><text x="170" y="88" font-size="14" text-anchor="middle" fill="currentColor">v</text><rect x="222" y="78" width="90" height="44" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><text x="267" y="106" font-size="15" text-anchor="middle" fill="currentColor">p = ?</text></svg>'
        choices: ["p = m/v", "p = mv", "p = v/m", "p = m + v"]
        answer: "p = mv"
        check: "'p = mv'"
        hints:
          - 運動量の式を思い出しましょう。運動量は、動いている物の「止めにくさ」です。
          - text: 図は、質量や速さを 2 倍にしたときの運動量です。それぞれの式の m を 2m に、v を 2v にかえて、図と同じになるかを確かめましょう。
