      - part: わけ
        id: "08af0c2af0"
        text: 水素のエネルギー準位が E_n = −13.6/n² eV になるわけを、ボーアの考えで説明しましょう。
        explain: 「ボーアは、電子の角運動量が h/2π の整数倍に限られると考えた。電子が回る円の半径と速さがとびとびになり、エネルギーもとびとびになる。クーロン力と円運動を解くと、E_n = −13.6/n² eV が出る。n が大きいほど外側の円で、エネルギーは 0 に近づく。」と書ければよい。① 角運動量の量子化、② 円の半径がとびとび、③ エネルギーもとびとび。子どもには、n=1、2、3 の値を確かめさせます。
        hints:
          - ボーアは、電子が原子の中心のまわりを回る円は、とびとびの大きさしか取れないと考えました。
          - text: "n = 1、2、3 の円の半径は、1 : 4 : 9 になります。"
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="100" r="5" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.9"/><circle cx="110" cy="100" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="110" y="86" font-size="13" text-anchor="middle" fill="currentColor">n = 1</text><circle cx="110" cy="100" r="36" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="110" y="59" font-size="13" text-anchor="middle" fill="currentColor">n = 2</text><circle cx="110" cy="100" r="81" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="110" y="14" font-size="13" text-anchor="middle" fill="currentColor">n = 3</text><text x="262" y="92" font-size="14" text-anchor="middle" fill="currentColor">半径の比</text><text x="262" y="116" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">1 : 4 : 9</text></svg>'
          - 円の大きさがとびとびなら、エネルギーもとびとびです。n = 1、2、3 で −13.6/n² を計算して確かめましょう。
        paths:
          - [角運動量がとびとび, 円の半径がとびとび, エネルギーもとびとび, E_n = −13.6/n²]
          - [n = 1 で −13.6 eV, n = 2 で −3.4 eV, n = 3 で約 −1.51 eV, n が大きいほど 0 に近い]

