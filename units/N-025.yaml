          - 十の位が 0 のときは、0 を書くよ。
          - 100 が 4 こと、1 が 6 こだね。
        paths:
          - [100 が 4 こで 400, 10 が 0 こ, 1 が 6 こで 406]
        note: 0 をとばして 46 と書きやすい（N-009）。
