  - part: 離
    kinds: [総動員, 道筋]
    uses: [N-017]
    text: 2 進法で書いたとき、一の位から 0 がちょうど 3 こ続く数（2 進法で …1000 となる数）のうち、100 より小さいものは何こありますか。
    answer: 6
    check: "sum(1 for k in range(1, 100) if k % 8 == 0 and k % 16 != 0)"
    hints:
      - 2 進法で一の位が 0 になるのは、どんな数かな。一の位から 0 が 2 こ続くのはどうかな。
      - 2 進法の位は右から 1、2、4、8、16、… だね。一の位から 0 が 3 こ以上続く数は、何の倍数かな。
      - 0 が「ちょうど」3 こなので、4 こ以上続く数は入らないよ。それは何の倍数かな。
    paths:
      - [一の位から 0 が 3 こ以上続くのは 8 の倍数, 4 こ以上続くのは 16 の倍数, 8 の倍数で 16 の倍数でない数を数える, 8、24、40、56、72、88 の 6 こ]
    note: 2 進法の末尾の 0 の数を、2、4、8、16 の倍数（N-017）に言いかえる。「ちょうど 3 こ」なので 16 の倍数をのぞく。8 の倍数の数（12 こ）で答えやすい。
