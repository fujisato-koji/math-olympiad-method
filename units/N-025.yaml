# N-025 n 進法
#
# 書き方は N-001 の頭の注、文の漢字は N-017 にそろえた（段 3。分かち書きはしない）。
# 前提は N-009（1000 までの数と位）、N-014（わり算とあまり）、A-009（累乗）。数は 1000 まで。
# ふだんの数の書き方を「10 進法」とよび、2 進法を中心に、3 進法と 5 進法を少し入れた。
#   8 進法・16 進法（A〜F の数字）と、計算機の中の数は K-142 にまわす。
#   n 進法の位は右から 1、n、n²、n³、…（A-009 の累乗）。「2 進法の 1011」のように書き、答えも数字だけを打つ（8 字まで）。
# 10 進法から n 進法へは、大きい位からひいていく方法を 1 本目にし、わり算をくり返してあまりを下から読む方法を 2 本目にした。
#   N-014 のわり算は商が 1 けたまでなので、わり算のくり返しは、はじめの商が 9 までになる数（2 進法なら 19 まで）で見せる。
# n 進法のたし算は、くり上がりのしくみを見るところまで（2 進法で 2 になったら次の位へ 1 くり上がる）。
#   ひき算・かけ算と、小数の n 進法は扱わない。
# 位ごとの数字をたすと何まいのカードを使うかがわかる問題（1、2、4、8、… のカード）は、2 進法の入口として置いた（計算機の 2 進数、K-130、K-142 へ）。
# check は 2 つの形：n 進法の数字の並びを 10 進法になおす sum((x // 10 ** i) % 10 * n ** i for i in range(8))、
#   10 進法の数を n 進法の数字の並びにする sum((x // n ** i) % n * 10 ** i for i in range(8))。
# 日の並び（既定）：1 日目 n 進法を 10 進法になおす、2 日目 10 進法を n 進法になおす、3 日目 わけ、
#   4 日目 N-009（位）・N-014（あまり）・A-009（累乗）と混ぜる（2 進法のたし算、カードで数をつくる）、5 日目 確認。

