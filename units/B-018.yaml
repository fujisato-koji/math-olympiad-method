        explain: |-
          くらべる ときは、足の 数、はねが あるか、体の 色や 形 など、目で 見て たしかめられる ところを 1 つ えらんで、2 ひきを じゅんに 見ます。同じ ところを 見つけて まとめるのが、なかま分けの はじめの 一歩です。
          ふだん 見る ありは「はたらきあり」で、はねが ありません。こうえんや 草むらで 見つけた 生きものを 2 ひき えらび、「同じ ところ さがし」「ちがう ところ さがし」を いっしょに すると よい。
