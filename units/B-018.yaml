        explain: |-
          なかま分けは、だれが 見ても 同じ 答えに なる しつもんを 1 つ きめて、はい と いいえ の 2 つに 分ける ことから はじめます。分けた あとの はこの 中では、きまりに した ところが かならず 同じに なります。
          ぎゃくに、はこの 中の 生きものに 同じ ところを 見つければ、どんな きまりで 分けたのかを 当てる ことも できます。家に ある おもちゃや 文ぼうぐを「赤い？」「音が 出る？」などで 分けて みると、きまりの 考え方が つかめます。
