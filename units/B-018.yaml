# B-018 生き物のなかま分け
#
# 段 2・水準 2・5 日。生き物を見くらべて同じところとちがうところを見つけること、きまりを 1 つ決めて「はい」「いいえ」で 2 つのなかまに分けること（はこの中を見てきまりを当てる、新しい生き物を入れる）、はい・いいえの問いを順にたどって名前を 1 つに決める「しらべる図」（検索表の入口）を扱う。
# 日の並びは 導入（同じところとちがうところ）・練習（1 つのきまりで 2 つに分ける）・わけ（しらべる図。問いをたどると 1 つに決まるわけ）・混ぜる・確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の約束：虫・くも・だんごむし・かえる・へびは上から見た形、鳥・魚・ねこは横から見た形でかく。きまりは黄色の札、はこは「はい」を左・「いいえ」を右に置く。しらべる図は、はいを左（はしごの形では右）、いいえを右（はしごの形では下）へ進む。赤いてんせんの丸は「見るところ」、赤いやじるしはたどった道。
# 毛・うろこ・つるつるの肌は、虫めがねの丸の中にだけかく。ちょうととんぼは足をかかないので、足の数を問う問題には出さない。
# なかま分けのきまりは、だれが見ても同じ答えになるものだけを使う（すき・かわいい・大きいは使えない、を 2 日目と 5 日目の挑戦で問う）。
# 腕だめし（離）は 2 問とも読み取り（かんさつのひょうと、かんさつカードを図にあてはめて読む）。
# 体の形とすみか・食べ物は B-072、一生は B-070、系統（大きななかま）は B-025 で扱うので、ここでは問わない。

id: B-018
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          生きものを 2 ひき ならべて、1 つずつ 見くらべて みよう。
          ありも ばったも、足は 6 本です。ここは「同じ ところ」です。
          ばったには はねが ありますが、ありには ありません。ここは「ちがう ところ」です。
