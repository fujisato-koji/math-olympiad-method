        explain: |-
          「1 つの しつもんで、生きものが 2 つに 分かれる。つぎの しつもんで、のこった 中が また 2 つに 分かれる。分かれる たびに のこりが へって、さいごは 1 ぴきに なる。しつもんは 足の 数や はねの ように、だれが 見ても 同じ 答えに なる ものだから、だれが たどっても 同じ 名前に つく。」と いえれば よい。
          ① 1 つの しつもんで 2 つに 分かれる、② 分かれる たびに のこりが へる、③ さいごは 1 つに なる、の 3 つが 入れば よい。図かんの はじめに ある「しらべかた」の ページも、この しくみで できて います。しらべる 図は、本では「けんさくひょう」とも よばれます。
