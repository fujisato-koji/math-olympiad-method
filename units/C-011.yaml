# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 手数]
    uses: [N-021]
    text: 3 つのサイコロ A、B、C を同時に投げます。どのサイコロも 1〜6 の目が同じ程度に出ます。3 つの目をかけた数が素数（そすう）になる確率を求めましょう。
    answer: 1/24
    check: "Fraction(sum(1 for p in itertools.product(range(1, 7), repeat=3) if (lambda x: x > 1 and all(x % d for d in range(2, x)))(p[0] * p[1] * p[2])), 216)"
    hints:
      - 全部の出方は何通りかな。
      - 3 つの目のうち 2 つが 2 以上だと、かけた数は素数になるかな。
      - かけた数が素数になるのは、2 つの目が 1 のときだけだね。どのサイコロが 1 でないかでも分けよう。
    paths:
      - [全部の出方は 6 × 6 × 6 = 216 通り, かけた数が素数になるのは、2 つの目が 1 で、のこりの 1 つが 2、3、5 のとき, 1 でないサイコロのえらび方 3 通り × 目 3 通り = 9 通り, 9/216 = 1/24]
    note: 素数（N-021）は、1 とその数のほかに《約数》がない数（1 は素数ではない）。かけた数が素数になるのは「1、1、素数」の組だけ、と気づくのが要点。1 を素数に入れたり、どのサイコロが素数の目かの 3 通りを落としたりしやすい。
  - part: 離
    kinds: [道筋]
    text: 袋の中に、赤玉が 4 個、白玉が 3 個入っています。よくまぜて、1 個ずつ全部取り出します。4 番目に取り出す玉が白玉である確率を求めましょう。
    answer: 3/7
    check: "Fraction(sum(1 for c in itertools.combinations(range(7), 3) if 3 in c), sum(1 for c in itertools.combinations(range(7), 3)))"
    hints:
      - 玉に番号をつけて、7 個の玉を取り出すじゅん番を考えよう。
      - 4 番目に出てくる玉は、7 個のうちのどの玉も同じ程度に起こるかな。
      - 白玉が何番目に出るかの組（7 か所から 3 か所）を数えて確かめてもよいよ。
    paths:
      - [どの玉も 4 番目に出ることは同じ程度に起こる, 4 番目の玉は 7 個のうちの 1 個で、白玉はそのうち 3 個, 3/7]
      - [白玉 3 個が何番目に出るかの組は、7 か所から 3 か所をえらんで 35 通り, そのうち 4 番目がふくまれるのは、のこり 6 か所から 2 か所で 15 通り, 15/35 = 3/7]
    note: 1 番目、2 番目…と順に追うと場合分けが多くなる。何番目でも、その位置に来る玉はどの玉も同じ程度に起こる（対称）と見ると、1 個だけ引く確率と同じになる。2 本目は組合せ（C-007）で確かめる道。
  - part: 離
    kinds: [総動員, 数, 読み取り]
    uses: [C-008]
    text: 1 から 120 までの数を 1 つずつ書いたカードが 120 枚あります。よくまぜて 1 枚引くとき、3 でも 5 でもわり切れない数のカードを引く確率を求めましょう。
    answer: 8/15
    check: "Fraction(len(set(range(1, 121)) - set(range(3, 121, 3)) - set(range(5, 121, 5))), 120)"
    hints:
      - 3 でわり切れる数、5 でわり切れる数のカードは、それぞれ何枚かな。
      - 3 でも 5 でもわり切れる数は、何でわり切れる数かな。2 回数えていないかな。
      - どちらかでわり切れるカードの枚数を出してから、全部の枚数からひこう。
    paths:
      - [3 の《倍数》は 40 枚、5 の倍数は 24 枚, 両方の倍数は 15 の倍数で 8 枚, どちらかの倍数は 40 + 24 − 8 = 56 枚, わり切れないのは 120 − 56 = 64 枚, 64/120 = 8/15]
    note: 重なりを数える（C-008）を、確率の「起こる場合の数」に使う。15 の倍数の重なりをひき忘れて、わり切れないカードを 56 枚（確率 7/15）にしたり、64/120 の約分を忘れたりしやすい。
  - part: 離
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - N-073
    text: コインを 10 回投げます。表とうらは同じように出ます。はじめの 6 回で表が出た回数が、あとの 4 回で表が出た回数より多くなる確率（かくりつ）を、約分した分数で答えましょう。
    answer: 319/512
    check: '(lambda f: f''{f.numerator}/{f.denominator}'')(Fraction(sum(1 for s in itertools.product((0, 1), repeat=10) if sum(s[:6]) > sum(s[6:])), 1024))'
    hints:
    - 全部の出方は何通りかな。はじめの 6 回とあとの 4 回で、表の数の出方をべつべつに調べることはできるかな。
    - くらべるかわりに、たして決められる形にできないかな。
    - 「はじめの表の数 > あとの表の数」を、10 回全部の表の数で言いかえよう。5 回ちょうどの出方の数と、5 回より多い出方の数は、どう出せるかな。
    paths:
    - - 全部の出方は、1 回ごとに表とうらの 2 通りで、10 回なので 2 を 10 回かけて 1024 通り。どの出方も同じように起こる
      - あとの 4 回だけ、表とうらを入れかえる。出方 1 つに、入れかえた出方がちょうど 1 つ組になるので、出方の数はかわらない。入れかえると、あとの 4 回の表の数は「4 − もとの表の数」になる
      - はじめの表の数がもとのあとの表の数より多いとは、はじめの表の数が 4 − (入れかえたあとの表の数) より多いこと。つまり、はじめの表の数と入れかえたあとの表の数をたした、10 回全部の表の数が 4 より多いこと、つまり 5 回か、5 回より多いこと
      - 10 回全部の表が 5 回より多い出方と、5 回より少ない出方は、10 回全部の表とうらを入れかえると 1 つずつ組になるので、同じ数。ちょうど 5 回の出方は、10 回から表になる 5 回をえらぶ数で、(10 ÷ 5) × (9 ÷ 3) × (8 ÷ 4) × (6 ÷ 2) × 7 = 2 × 3 × 2 × 3 × 7 = 252 通り。だから 5 回より多い出方は (1024 − 252) ÷ 2 = 386 通りで、5 回か、5 回より多い出方は 386 + 252 = 638 通り
      - 確率は 638/1024。2 でわって約分すると 319/512
    - - 全部の出方は 2 を 10 回かけて 1024 通り。はじめの 6 回の表が 1 回、2 回、…、6 回の出方は、6 回から表になる回をえらぶ数で、6、15、20、15、6、1 通り（表が 0 回だと、あとの 4 回より多くならない）
      - あとの 4 回の表が 0 回、1 回、2 回、3 回、4 回の出方は、1、4、6、4、1 通り。はじめの表の数より少ないのは、はじめが 1 回なら 0 回の 1 通り、2 回なら 0 回か 1 回の 1 + 4 = 5 通り、3 回なら 11 通り、4 回なら 15 通り、5 回なら 16 通り、6 回も 16 通り
      - はじめの表の数ごとに、はじめの出方の数とあとの出方の数をかけて、たす。6 × 1 = 6、15 × 5 = 75、20 × 11 = 220、15 × 15 = 225、6 × 16 = 96、1 × 16 = 16。6 + 75 + 220 + 225 + 96 + 16 = 638 通り
      - 確率は 638/1024。2 でわって約分すると 319/512
    note: 考えどころは 3 つ：①あとの 4 回の表とうらを入れかえて、1 対 1 で結びつける、②「はじめの表の数 > あとの表の数」を「10 回全部の表の数が 5 回か、5 回より多い」と言いかえる、③表の数が 5 回より多いものと少ないものは同じ数なので、ちょうど 5 回の 252 通りを引いて 2 でわり、252 を足す。2 本目は、はじめの表の数ごとに、あとの表の数がそれより少ない出方をそのままかけて足す。「n + 1 回と n 回で、はじめの表が多い確率は 1/2」という定番の入れかえの手を、6 回と 4 回にして、同じ数の場合がのこる形にした。答えの 1024 は 1000 をこえ、頭注の「数は 1000 まで」の例外なので、uses に N-073 を挙げた（5 回ちょうどの 252 通りは C-007 の選び方）。check は、10 回の表うらを itertools.product で 1024 通り全部作り、はじめの 6 回の表の数が、あとの 4 回の表の数より多いものを数えて、1024 で割った分数を約分した形で出す（319/512）。この単元の既出は、サイコロ 3 つでそすう、袋の玉の 4 番めの色、カードの倍数で、コインの表の数をくらべる問題はない。 入れかえの手は「n + 1 回と n 回で表が多い確率は 1/2」の昔からある問題（海外の大会や問題集に見られる形）による。
