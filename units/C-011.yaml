# C-011 確率の入口（場合の数の比）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く（前提の A-005 までの漢字。確率は「確率（かくりつ）」とよみをそえる）。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 1 つのもの（サイコロ 1 個、カード 1 枚、袋の玉 1 個）で、確率 = そのことが起こる場合の数 ÷ 全部の場合の数、
#   2 日目 2 つ・3 つのものを同時に投げる（コイン、大小のサイコロ。区別して数え、積の法則で全部の場合を出す）、
#   3 日目 組合せ（C-007）で数える（袋から 2 個、くじで選ぶ）と、起こらない確率（全部 − 起こる場合）、
#   4 日目 わけ（なぜ区別して数えるか、なぜ 1 − 起こる確率か、なぜ同じ色の玉にも番号をつけるか）、
#   5 日目 C-007（選び方）・A-005（割合と百分率）と混ぜる、6 日目 確認。
# 確率は、どの場合も同じ程度に起こる（同様に確からしい）ときだけ「場合の数の比」で求められる。サイコロは 1〜6 の目が同じ程度に出る、
#   コインは表とうらが同じ程度に出る、袋の玉とくじは「よくまぜて」引く、と毎回書く。
# 答えは約分した分数（A-005 と同じく Fraction で確かめる）。「分数で」と決めているので accept に小数は入れない。百分率を問う問題は % の数を打つ。
# 前提は C-007 と A-005（→ N-009、N-074、N-075、N-019 など）。数は 1000 まで。2 つのサイコロは 6 × 6 = 36 通りの表で数える。
# ただし腕だめしの最難関（コイン 10 回の表の数くらべ）だけは例外で、uses に N-073 を挙げて 1000 をこえる数（1024）を使う。
# 確率のたし算・かけ算の規則（排反と独立、C-043）、期待値（C-020）は後ろの単元なので出さない。「およそ何回」は A-005 の「比べる量 = もとにする量 × 割合」の見積もりだけ。
# check は、itertools.product（コイン、サイコロ）、itertools.combinations（袋、くじ）、itertools.permutations（並ぶ順）で全部の場合を作り、
#   Fraction(当てはまる場合の数, 全部の場合の数) を出す。

id: C-011
days:
  - day: 1
    items:
      - part: 見本
        text: サイコロを 1 回投げます。偶数の目が出る確率（かくりつ）を求めましょう。
        figure: "🎲 の目：１　２　３　４　５　６"
        explain: サイコロの目は 1、2、3、4、5、6 の 6 通りで、どの目が出ることも同じ程度に起こります。偶数の目は 2、4、6 の 3 通りです。全部の場合 6 通りのうち、偶数の目が出る場合は 3 通りなので、偶数の目が出る確率は 3/6 = 1/2 です。確率は「そのことが起こる場合の数 ÷ 全部の場合の数」を《分数》で表したもので、約分して答えます。どの場合も同じ程度に起こるときだけ、この求め方が使えます。
      - part: 思い出す
        text: 6 人の中から、代表を 2 人選びます。選び方は何通りですか。
        answer: 15
        check: "len(set(itertools.combinations(range(6), 2)))"
        hints:
          - 順番をつけて並べると、何通りかな。
          - 「アとイ」と「イとア」は、同じ選び方かな。
          - 同じ選び方を何回ずつ数えているかを考えよう。
        paths:
          - [並べると 6 × 5 = 30 通り, どの選び方も 2 回ずつ数えている, 30 ÷ 2 = 15 通り]
      - part: 思い出す
        text: クラスの 18 人のうち 12 人が、電車で来ました。電車で来た人の割合を、約分した分数で答えましょう。
        answer: 2/3
        check: "Fraction(12, 18)"
        hints:
          - もとにする量は、何人かな。
          - 割合は「比べる量 ÷ もとにする量」だね。
          - 分子と分母を、同じ数でわって約分しよう。
        paths:
          - [もとにする量は 18 人, 12/18, 6 でわって 2/3]
      - part: 今日
        text: サイコロを 1 回投げます。5 以上の目が出る確率を求めましょう。
        answer: 1/3
        check: "Fraction(sum(1 for d in range(1, 7) if d >= 5), 6)"
        hints:
          - 全部の場合は何通りかな。
          - 5 以上の目は、どれとどれかな。
          - 「起こる場合の数 ÷ 全部の場合の数」を約分しよう。
        paths:
          - [全部で 6 通り, 5 以上は 5 と 6 の 2 通り, 2/6 = 1/3]
        note: 「5 以上」に 5 を入れわすれて 1/6 としやすい。以上はその数をふくむ。
      - part: 今日
        text: 1 から 10 までの数を 1 つずつ書いたカードが 10 枚あります。よくまぜて 1 枚引くとき、3 の《倍数》のカードを引く確率を求めましょう。
        answer: 3/10
        check: "Fraction(sum(1 for k in range(1, 11) if k % 3 == 0), 10)"
        hints:
          - 全部の場合は何通りかな。
          - 10 までの 3 の倍数を書き出そう。
          - 約分できるかも確かめよう。
        paths:
          - [全部で 10 通り, 3 の倍数は 3、6、9 の 3 通り, 3/10]
      - part: 今日
        text: 袋に赤玉が 3 個、白玉が 5 個入っています。よくまぜて 1 個取り出すとき、赤玉が出る確率を求めましょう。
        figure: 🔴🔴🔴⚪⚪⚪⚪⚪
        answer: 3/8
        check: "Fraction(sum(1 for b in '赤赤赤白白白白白' if b == '赤'), 8)"
        hints:
          - 玉は全部で何個かな。
          - どの玉も同じ程度に出るね。赤玉は何個かな。
          - 赤玉の数を、全部の玉の数でわった分数にしよう。
        paths:
          - [全部で 3 + 5 = 8 個, 赤玉は 3 個, 3/8]
        note: 赤玉 3 個と白玉 5 個を比べて 3/5 としやすい。分母は全部の数（8）にする。
      - part: 挑戦
        text: 1 から 30 までの数を 1 つずつ書いたカードが 30 枚あります。よくまぜて 1 枚引くとき、30 の《約数》のカードを引く確率を求めましょう。
        answer: 4/15
        check: "Fraction(sum(1 for k in range(1, 31) if 30 % k == 0), 30)"
        hints:
          - 30 の約数を、小さい順にもれなく書き出そう。
          - 1 と 30 も約数だよ。
          - 分数にしたら、約分をわすれないようにしよう。
        paths:
          - [30 の約数は 1、2、3、5、6、10、15、30 の 8 個, 8/30, 2 でわって 4/15]
        note: 1 と 30 をわすれやすい。約数は 2 つずつ組（1 と 30、2 と 15、3 と 10、5 と 6）にすると、もれなく出せる。
    extra:
      - part: 今日
        text: サイコロを 1 回投げます。6 の約数の目が出る確率を求めましょう。
        answer: 2/3
        check: "Fraction(sum(1 for d in range(1, 7) if 6 % d == 0), 6)"
        hints:
          - 全部の場合は何通りかな。
          - 6 の約数を書き出そう。
          - 分数にして約分しよう。
        paths:
          - [全部で 6 通り, 6 の約数は 1、2、3、6 の 4 通り, 4/6 = 2/3]
      - part: 今日
        text: 袋に赤玉が 2 個、青玉が 4 個、黄玉が 6 個入っています。よくまぜて 1 個取り出すとき、赤玉が出る確率を求めましょう。
        figure: 🔴🔴🔵🔵🔵🔵🟡🟡🟡🟡🟡🟡
        answer: 1/6
        check: "Fraction(sum(1 for b in '赤赤青青青青黄黄黄黄黄黄' if b == '赤'), 12)"
        hints:
          - 玉は全部で何個かな。
          - 赤玉は何個かな。
          - 分数にして約分しよう。
        paths:
          - [全部で 2 + 4 + 6 = 12 個, 赤玉は 2 個, 2/12 = 1/6]
        note: 色が 3 つなので 1/3 と答えやすい。色ごとに玉の数がちがうので、色は同じ程度には出ない。
      - part: 挑戦
        text: 1 から 9 までの数を 1 つずつ書いたカードが 9 枚あります。よくまぜて 1 枚引くとき、7 より大きい数のカードを引く確率を求めましょう。
        answer: 2/9
        check: "Fraction(sum(1 for k in range(1, 10) if k > 7), 9)"
        hints:
          - 全部の場合は何通りかな。
          - 7 より大きい数に、7 は入るかな。
          - 当てはまるカードを書き出そう。
        paths:
          - [全部で 9 通り, 7 より大きいのは 8 と 9 の 2 通り, 2/9]
        note: 7 も入れて 3/9 としやすい。「より大きい」はその数をふくまない。

  - day: 2
    items:
      - part: 見本
        text: 10 円玉と 100 円玉を 1 枚ずつ同時に投げます。2 枚とも表が出る確率を求めましょう。
        figure: "10 円　100 円\n表　　表\n表　　うら\nうら　表\nうら　うら"
        explain: 2 枚を区別して書き出すと、表と表、表とうら、うらと表、うらとうらの 4 通りで、どれも同じ程度に起こります。10 円玉が 2 通り、そのそれぞれに 100 円玉が 2 通りなので、積の法則で 2 × 2 = 4 通りと数えることもできます。2 枚とも表は 1 通りなので、確率は 1/4 です。2 つのものを同時に投げるときも、1 つずつ区別して数えます。
      - part: 思い出す
        text: 袋に赤玉が 4 個、白玉が 6 個入っています。よくまぜて 1 個取り出すとき、赤玉が出る確率を求めましょう。
        answer: 2/5
        check: "Fraction(4, 4 + 6)"
        hints:
          - 玉は全部で何個かな。
          - 赤玉は何個かな。
          - 《分数》にして約分しよう。
        paths:
          - [全部で 10 個, 赤玉は 4 個, 4/10 = 2/5]
      - part: 思い出す
        text: 大小 2 つのサイコロを同時に投げます。目の出方は全部で何通りですか。
        answer: 36
        check: "len(set(itertools.product(range(1, 7), repeat=2)))"
        hints:
          - 大きいサイコロの目の出方は何通りかな。
          - そのそれぞれに、小さいサイコロの目の出方は何通りかな。
          - 積の法則を使おう。
        paths:
          - [大 6 通り, そのそれぞれに小 6 通り, 6 × 6 = 36 通り]
      - part: 今日
        text: 10 円玉と 100 円玉を 1 枚ずつ同時に投げます。1 枚が表で 1 枚がうらになる確率を求めましょう。
        answer: 1/2
        check: "Fraction(sum(1 for c in itertools.product('表う', repeat=2) if c.count('表') == 1), 4)"
        hints:
          - 2 枚を区別して、出方を全部書き出そう。
          - 「表とうら」と「うらと表」は、別の出方かな。
          - 当てはまる出方を数えて、全部の出方でわろう。
        paths:
          - [出方は 4 通り, 表とうら・うらと表の 2 通り, 2/4 = 1/2]
        note: 「1 枚が表」を 1 通りと数えて 1/4 としやすい。10 円玉が表のときと 100 円玉が表のときの 2 通りある。
      - part: 今日
        text: 10 円玉、50 円玉、100 円玉を 1 枚ずつ同時に投げます。ちょうど 2 枚が表になる確率を求めましょう。
        answer: 3/8
        check: "Fraction(sum(1 for c in itertools.product('表う', repeat=3) if c.count('表') == 2), 8)"
        hints:
          - 出方は全部で何通りかな。積の法則を使おう。
          - うらになる 1 枚がどれかで分けて考えよう。
          - 当てはまる出方を数えて分数にしよう。
        paths:
          - [出方は 2 × 2 × 2 = 8 通り, うらになるのが 10 円・50 円・100 円の 3 通り, 3/8]
      - part: 今日
        text: 大小 2 つのサイコロを同時に投げます。目の和が 7 になる確率を求めましょう。表の左は大きいサイコロの目、上は小さいサイコロの目です。
        figure: "　１２３４５６\n１□□□□□□\n２□□□□□□\n３□□□□□□\n４□□□□□□\n５□□□□□□\n６□□□□□□"
        answer: 1/6
        check: "Fraction(sum(1 for a, b in itertools.product(range(1, 7), repeat=2) if a + b == 7), 36)"
        hints:
          - 表のますは全部で何こかな。
          - 和が 7 になるますに、しるしをつけよう。
          - しるしの数を、全部のますの数でわろう。
        paths:
          - [全部で 36 通り, （1、6）（2、5）（3、4）（4、3）（5、2）（6、1）の 6 通り, 6/36 = 1/6]
        note: （1、6）と（6、1）を同じと考えて 3 通りとしやすい。大と小を区別すると、どのますも同じ程度に起こる。
      - part: 挑戦
        text: 大小 2 つのサイコロを同時に投げます。2 つの目の差が 2 になる確率を求めましょう。
        figure: "　１２３４５６\n１□□□□□□\n２□□□□□□\n３□□□□□□\n４□□□□□□\n５□□□□□□\n６□□□□□□"
        answer: 2/9
        check: "Fraction(sum(1 for a, b in itertools.product(range(1, 7), repeat=2) if abs(a - b) == 2), 36)"
        hints:
          - 差が 2 になる 2 つの目の組を考えよう。1 と 3 はそうだね。
          - 大きいサイコロが 1 で小さいサイコロが 3 と、その反対は別の出方だよ。
          - 当てはまるますを数えて、約分しよう。
        paths:
          - [差が 2 の組は 1 と 3、2 と 4、3 と 5、4 と 6, 大小を入れかえて 4 × 2 = 8 通り, 8/36 = 2/9]
    extra:
      - part: 今日
        text: 10 円玉と 100 円玉を 1 枚ずつ同時に投げます。少なくとも 1 枚が表になる確率を求めましょう。
        answer: 3/4
        check: "Fraction(sum(1 for c in itertools.product('表う', repeat=2) if '表' in c), 4)"
        hints:
          - 2 枚を区別して、出方を全部書き出そう。
          - 「少なくとも 1 枚が表」は、1 枚でも表があればよいということだよ。
          - 当てはまらないのは、どの出方かな。
        paths:
          - [出方は 4 通り, 当てはまらないのはうらとうらの 1 通り, 当てはまるのは 3 通りで 3/4]
      - part: 今日
        text: 大小 2 つのサイコロを同時に投げます。目の和が 5 になる確率を求めましょう。
        answer: 1/9
        check: "Fraction(sum(1 for a, b in itertools.product(range(1, 7), repeat=2) if a + b == 5), 36)"
        hints:
          - 全部の出方は何通りかな。
          - 和が 5 になる（大、小）の組を書き出そう。
          - 分数にして約分しよう。
        paths:
          - [全部で 36 通り, （1、4）（2、3）（3、2）（4、1）の 4 通り, 4/36 = 1/9]
      - part: 今日
        text: 10 円玉、50 円玉、100 円玉を 1 枚ずつ同時に投げます。3 枚ともうらになる確率を求めましょう。
        answer: 1/8
        check: "Fraction(sum(1 for c in itertools.product('表う', repeat=3) if '表' not in c), 8)"
        hints:
          - 出方は全部で何通りかな。
          - 3 枚ともうらになる出方は、いくつあるかな。
          - 分数にしよう。
        paths:
          - [出方は 2 × 2 × 2 = 8 通り, 3 枚ともうらは 1 通り, 1/8]

  - day: 3
    items:
      - part: 見本
        text: 袋に赤玉が 2 個、白玉が 3 個入っています。よくまぜて同時に 2 個取り出すとき、2 個とも白玉になる確率を求めましょう。
        figure: 🔴🔴⚪⚪⚪
        explain: 同じ色の玉にも番号をつけて、赤 1、赤 2、白 1、白 2、白 3 と区別します。5 個から 2 個を選ぶ選び方は、5 × 4 = 20 を 2 でわって 10 通りで、どの組も同じ程度に起こります。2 個とも白になるのは、白 3 個から 2 個を選ぶ 3 × 2 ÷ 2 = 3 通りです。確率は 3/10 です。取り出す玉の組を、組合せ（C-007）で数えます。
      - part: 思い出す
        text: 大小 2 つのサイコロを同時に投げます。目の和が 6 になる確率を求めましょう。
        answer: 5/36
        check: "Fraction(sum(1 for a, b in itertools.product(range(1, 7), repeat=2) if a + b == 6), 36)"
        hints:
          - 全部の出方は何通りかな。
          - 和が 6 になる（大、小）の組を書き出そう。
          - 約分できるか確かめよう。
        paths:
          - [全部で 36 通り, （1、5）（2、4）（3、3）（4、2）（5、1）の 5 通り, 5/36]
        note: （3、3）は大小を入れかえても同じ出方なので 1 通り。ほかの組は入れかえると別の出方になる。
      - part: 思い出す
        text: 6 人の中から、3 人を選びます。選び方は何通りですか。
        answer: 20
        check: "len(set(itertools.combinations(range(6), 3)))"
        hints:
          - 順番をつけて並べると、何通りかな。
          - 3 人の組 1 つは、並べ方の中に何回出てくるかな。
          - 並べ方の数を、その回数でわろう。
        paths:
          - [並べると 6 × 5 × 4 = 120 通り, 3 人の組は 3 × 2 × 1 = 6 回ずつ, 120 ÷ 6 = 20 通り]
      - part: 今日
        text: ア、イ、ウ、エの 4 人の中から、くじで 2 人の係を選びます。アが係に選ばれる確率を求めましょう。
        answer: 1/2
        check: "Fraction(sum(1 for c in itertools.combinations('アイウエ', 2) if 'ア' in c), len(set(itertools.combinations('アイウエ', 2))))"
        hints:
          - 4 人から 2 人の選び方は、全部で何通りかな。
          - アが入る選び方は、アと組むもう 1 人を決めればよいね。
          - 当てはまる選び方を、全部の選び方でわろう。
        paths:
          - [全部で 4 × 3 ÷ 2 = 6 通り, アが入るのはアイ・アウ・アエの 3 通り, 3/6 = 1/2]
      - part: 今日
        text: 袋に赤玉が 3 個、白玉が 2 個入っています。よくまぜて同時に 2 個取り出すとき、赤玉と白玉が 1 個ずつになる確率を求めましょう。
        figure: 🔴🔴🔴⚪⚪
        answer: 3/5
        check: "Fraction(sum(1 for i, j in itertools.combinations(range(5), 2) if ('赤赤赤白白'[i] + '赤赤赤白白'[j]).count('赤') == 1), 10)"
        hints:
          - 玉に番号をつけて、2 個の選び方を全部数えよう。
          - 赤玉 1 個の選び方と、白玉 1 個の選び方は何通りかな。
          - 赤も白も両方選ぶね。積の法則を使おう。
        paths:
          - [全部で 5 × 4 ÷ 2 = 10 通り, 赤 3 通り × 白 2 通り = 6 通り, 6/10 = 3/5]
      - part: 今日
        text: 大小 2 つのサイコロを同時に投げます。目の和が 7 にならない確率を求めましょう。
        answer: 5/6
        check: "Fraction(sum(1 for a, b in itertools.product(range(1, 7), repeat=2) if a + b != 7), 36)"
        hints:
          - 和が 7 になる出方は何通りだったかな。
          - 全部の出方から、和が 7 になる出方をひこう。
          - 残った出方の数を、全部の出方でわろう。
        paths:
          - [全部で 36 通り, 和が 7 は 6 通り, ならないのは 36 − 6 = 30 通りで 30/36 = 5/6]
          - [和が 7 になる確率は 1/6, ならない確率は 1 − 1/6 = 5/6]
        note: 和が 7 にならない出方を 1 つずつ数えると大変。起こる場合を全部からひくと早い。
      - part: 挑戦
