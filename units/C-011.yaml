          - くじに番号をつけて、2 本の引き方を全部数えよう。
          - はずれ 4 本から 2 本の引き方は何通りかな。
          - 分数にして約分しよう。
        paths:
          - [全部で 6 × 5 ÷ 2 = 15 通り, はずれ 2 本は 4 × 3 ÷ 2 = 6 通り, 6/15 = 2/5]
    extra:
      - part: 今日
        text: 10 円玉と 100 円玉を 1 枚ずつ同時に投げます。2 枚ともうらになる確率を求めましょう。
        answer: 1/4
        check: "Fraction(sum(1 for c in itertools.product('表う', repeat=2) if '表' not in c), 4)"
        hints:
          - 2 枚を区別して、出方を全部書き出そう。
          - 2 枚ともうらは何通りかな。
          - 分数にしよう。
        paths:
