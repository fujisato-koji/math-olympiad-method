      - part: 今日
        text: 大小 2 つのサイコロを同時に投げます。目の和が 3 になる確率を求めましょう。
        answer: 1/18
        check: "Fraction(sum(1 for a, b in itertools.product(range(1, 7), repeat=2) if a + b == 3), 36)"
        hints:
          - 全部の出方は何通りかな。
          - 和が 3 になる（大、小）の組を書き出そう。
          - 分数にして約分しよう。
        paths:
          - [全部で 36 通り, （1、2）（2、1）の 2 通り, 2/36 = 1/18]
      - part: 今日
        text: 袋に赤玉が 2 個、白玉が 2 個入っています。よくまぜて同時に 2 個取り出すとき、2 個の色がちがう確率を求めましょう。
        answer: 2/3
        check: "Fraction(sum(1 for i, j in itertools.combinations(range(4), 2) if '赤赤白白'[i] != '赤赤白白'[j]), 6)"
        hints:
