        check: "[c for c, k in {'0 人': 0, '2 人': 2, '5 人': 5, '10 人': 10}.items() if k % 2 == 1][0]"
        hints:
          - 1 人 1 人の握手の回数の和は、偶数でしょうか。
          - 回数が奇数の人たちの回数の和も、偶数でなければなりません。
          - 奇数を奇数個足すと、和は奇数になります。
        paths:
          - [回数の和は偶数, 奇数の人は偶数人, 5 人はありえない]
      - part: 今日
        text: 9 人から 6 人の班をつくり、その中から班長を 1 人決めます。決め方は何通りですか。
        answer: 504
        check: "len([(s, c) for s in itertools.combinations(range(9), 6) for c in s])"
        hints:
          - 先に班長を選ぶと、何通りでしょう。
          - 残りの 8 人から 5 人を選びましょう。
          - ₈C₅ = ₈C₃ を使うと計算が楽です。
        paths:
          - [班長 9 通り, ₈C₅ = ₈C₃ = 56, 9 × 56 = 504]
          - [₉C₆ = ₉C₃ = 84、班長 6 通り, 84 × 6 = 504]
      - part: 今日
        text: ₆C₀ × ₅C₄ + ₆C₁ × ₅C₃ + ₆C₂ × ₅C₂ + ₆C₃ × ₅C₁ + ₆C₄ × ₅C₀ はいくつですか。
        answer: 330
        check: "sum(math.comb(6, k) * math.comb(5, 4 - k) for k in range(5))"
        hints:
          - 6 人と 5 人の 2 つの組から、合わせて 4 人を選ぶ選び方を考えましょう。
          - 1 つ目の組から選ぶ人数で分けると、式の各項になります。
          - 分けずに数えましょう。
        paths:
          - [11 人から 4 人を選ぶ, ₁₁C₄ = 330]
      - part: 今日
        text: 1 から 25 までの数から 2 つを選ぶ選び方を、大きいほうの数で分けて数えます。この考えを使って、1 + 2 + 3 + … + 24 を求めましょう。
        answer: 300
        check: "len([s for s in itertools.combinations(range(25), 2)])"
        hints:
          - 大きいほうの数が k のとき、小さいほうは何通りでしょう。
          - 1 + 2 + … + 24 は、どんな選び方の数と等しいでしょう。
          - ₂₅C₂ を計算しましょう。
        paths:
          - [大きいほうが k なら小さいほうは k − 1 通り, 1 + 2 + … + 24 = ₂₅C₂, 25 × 24 ÷ 2 = 300]
      - part: 今日
        text: 15 人の生徒が、それぞれちょうど 4 つの委員会に入っています。どの委員会も 6 人です。委員会はいくつありますか。
        answer: 10
        check: "[k for k in range(1, 100) if 6 * k == 15 * 4][0]"
        hints:
          - 「生徒と、その生徒が入っている委員会」の組を考えましょう。
          - 生徒の側から数えると、15 × 4 組です。
          - 委員会の側から数えると、委員会の数 × 6 組です。
        paths:
          - [生徒から数えると 60 組, 6 × □ = 60, □ = 10]
    extra:
      - part: 今日
        text: 正八面体は、8 枚の正三角形でできた立体で、どの辺もちょうど 2 つの面の境目になっています。辺は何本ありますか。
        answer: 12
        check: "8 * 3 // 2"
        hints:
          - 「面と、その面の辺」の組を、面の側から数えましょう。
          - 1 本の辺は、何回数えられているでしょう。
          - 8 × 3 を 2 でわりましょう。
        paths:
          - [8 × 3 = 24 組, 24 ÷ 2 = 12]
      - part: 今日
        text: 1 × ₄C₁ + 2 × ₄C₂ + 3 × ₄C₃ + 4 × ₄C₄ はいくつですか。
        answer: 32
        check: "sum(k * math.comb(4, k) for k in range(1, 5))"
        hints:
          - 4 人から 1 人以上を選び、その中からリーダーを決める決め方を考えましょう。
          - 先にリーダーを決めると、残り 3 人は選ぶか選ばないかです。
          - 4 × 2³ を計算しましょう。
        paths:
          - [リーダー 4 通り、残り 2³ = 8 通り, 32]
          - [4 + 12 + 12 + 4 = 32]
      - part: 今日
        text: ₂C₂ + ₃C₂ + ₄C₂ + … + ₁₀C₂ はいくつですか。
        answer: 165
        check: "sum(math.comb(k, 2) for k in range(2, 11))"
        hints:
          - 1 から 11 までの数から 3 つを選ぶ選び方を考えましょう。
          - いちばん大きい数で分けて数えましょう。
          - ₁₁C₃ を計算しましょう。
        paths:
          - [いちばん大きい数が 3〜11 の場合に分けると ₂C₂、…、₁₀C₂, 合計は ₁₁C₃ = 165]

# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋, 数]
    text: 集合 {1, 2, 3, …, 10} の部分集合は、空集合もふくめて 1024 個あります。1 つ 1 つの部分集合の要素をすべて足した和を求め、それを 1024 個の部分集合すべてについて足すと、いくつになりますか（空集合の和は 0 とします）。
    answer: 28160
    check: "sum(sum(s) for k in range(11) for s in itertools.combinations(range(1, 11), k))"
    hints:
      - 部分集合ごとに足すのではなく、数ごとに考えましょう。
      - 数 1 は、何個の部分集合に入っているでしょう。
      - どの数も同じ個数の部分集合に入っています。
    paths:
      - [どの数も 2⁹ = 512 個の部分集合に入る, 合計は (1 + 2 + … + 10) × 512, 55 × 512 = 28160]
    note: 「部分集合と、その要素」の組を、数の側から数えるのが二通りに数える見方。1 つの数をふくむ部分集合は、残り 9 個を入れるか入れないかで 2⁹ 個。1024 個を順に足そうとすると終わらない。
  - part: 離
    kinds: [総動員, 手数]
    uses: [G-021]
    text: 正二十面体は、20 枚の正三角形でできた立体で、どの辺もちょうど 2 つの面の境目になっていて、どの頂点にも 5 つの面が集まっています。2 つの頂点を結ぶ線分のうち、辺でないものは、すべて立体の内部を通ります。そのような線分は何本ありますか。
    answer: 36
    check: "math.comb(20 * 3 // 5, 2) - 20 * 3 // 2"
    hints:
      - まず、頂点の数と辺の数を、それぞれ二通りに数えて求めましょう。
      - 2 つの頂点を結ぶ線分は、全部で何本あるでしょう。
      - 面はすべて三角形なので、面の上を通る対角線はありません。
    paths:
      - [頂点は 20 × 3 ÷ 5 = 12, 辺は 20 × 3 ÷ 2 = 30, 2 頂点を結ぶ線分は ₁₂C₂ = 66, 66 − 30 = 36]
      - [1 つの頂点から辺でない線分は 12 − 1 − 5 = 6 本, 12 × 6 ÷ 2 = 36]
    note: 空間図形（G-021）の立体を、面・辺・頂点の二通りの数え方と組合せ（₁₂C₂）でまとめる。2 本目も、各頂点から数えて 2 でわる二通りの数え方。面の上の対角線（三角形にはない）を引き忘れる心配がないことも確かめさせる。
  - part: 離
    kinds: [読み取り]
    text: 9 チームが試合をします。どのチームも、ほかのちょうど 4 チームと 1 回ずつ試合をしました。1 試合ごとに、勝ったチームに 3 点、負けたチームに 0 点、引き分けなら両方に 1 点ずつ入ります。試合が終わって、9 チームの点数をすべて足すと 48 点でした。引き分けの試合は何試合ありましたか。
    answer: 6
    check: "[d for d in range(0, 19) if 3 * (9 * 4 // 2 - d) + 2 * d == 48][0]"
    hints:
      - まず、試合の数を二通りに数えて求めましょう。
      - 勝ち負けが決まった試合と引き分けの試合では、2 チームに入る点数の合計がそれぞれ何点でしょう。
      - 全部の試合で勝ち負けが決まったとすると、点数の合計は何点でしょう。
    paths:
      - [試合は 9 × 4 ÷ 2 = 18 試合, 勝ち負けの試合は 3 点、引き分けは 2 点, 全部勝ち負けなら 54 点で 6 点多い, 引き分けは 6 試合]
    note: 試合の数（チームの側から数えて 2 でわる）と、点数の合計（試合の側から数える）の 2 か所で二通りに数える。9 × 4 = 36 を試合の数としやすい。
