線 1 本を 2 人が数える</text><text x="240" y="198" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">あく手は 30 ÷ 2 ＝ 15 回</text></svg>'
        explain: 表の ○ を行ごと（生徒ごと）に数えると 3 + 2 + 4 + 2 + 3 = 14、列ごと（問題ごと）に数えると 3 + 4 + 3 + 4 = 14 です。同じものを 2 つの順に数えたので、答えは等しくなります。これを、二通りに数えるといいます。一方の数え方がかんたんで、もう一方に求めたい量が入っているとき、2 つを等しいとおくと、求めたい量がわかります。たとえば、6 人がそれぞれ全員と 1 回ずつあく手するときのあく手の回数を考えます。1 人あたり 5 回あく手するので、「人と、その人がしたあく手」の組は 6 × 5 = 30 組です。一方、1 回のあく手には 2 人がかかわるので、どのあく手もこの組の中で 2 回ずつ数えられています。あく手の回数を □ とすると 2 × □ = 30 で、□ = 15 です。これは 6 人から 2 人を選ぶ選び方の数 ₆C₂ = 15（C-015）と同じです。いっぱんに、何人かであく手をしたとき、1 人 1 人のあく手の回数をすべて足した和は、あく手の回数の 2 倍になります。立体でも、「面と、その面のまわりの辺」の組を、面から数えるか辺から数えるかで、辺の数が求められます。
