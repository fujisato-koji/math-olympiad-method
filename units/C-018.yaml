ound"/><rect x="262" y="31" width="40" height="22" rx="6" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="1.8"/><rect x="262" y="75" width="40" height="22" rx="6" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="1.8"/><rect x="262" y="119" width="40" height="22" rx="6" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="1.8"/><text x="282" y="160" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">クラブ</text><text x="240" y="180" font-size="13" text-anchor="middle" fill="#3d8fd1">人から：6 × 2 ＝ 12 本</text><text x="240" y="199" font-size="13" text-anchor="middle" fill="#3e9a4e">クラブから：3 × 4 ＝ 12 本</text></svg>'
        explain: 1 人 1 人のあく手の回数の和は、あく手の回数の 2 倍なので、いつも偶数です。あく手の回数が偶数の人たちの回数の和は偶数なので、残りの、回数が奇数の人たちの回数の和も偶数でなければなりません。奇数をいくつか足して偶数になるのは、足す奇数の個数が偶数のときだけです。よって、あく手の回数が奇数である人は、いつも偶数人です。たとえば、7 人全員が 3 回ずつあく手することはできません（回数の和 3 × 7 = 21 が奇数になるから）。このように二通りに数えると、「できないこと」もわかります。また、人と集まりの関係も、二通りに数えられます。15 人の生徒がそれぞれ 2 つのクラブに入り、どのクラブも 6 人のとき、「生徒と、その生徒が入っているクラブ」の組を、生徒の側から数えると 15 × 2 = 30 組、クラブの側から数えると（クラブの数）× 6 組です。よって、クラブは 30 ÷ 6 = 5 つです。
