# C-018 二通りに数える
#
# 書き方は N-001 の頭の注のとおり。記号と計算の書き方は C-015 に合わせる（₅C₂ のように下つきの数字、式の中は「÷」、n! は使わない）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目 導入：表の ○ を行ごとと列ごとに数える。握手の回数（1 人 1 人の回数の和 ＝ 2 × 握手の回数）。立体の面と辺と頂点。
#   2 日目 練習：握手の回数が奇数の人は偶数人（できないことを示す）、人と集まり（クラブ、班）の組を両側から数える。頭に見本。
#   3 日目 練習：二項係数の等式を 2 通りの数え方で見る（委員と委員長 r × ₙCᵣ = n × ₙ₋₁Cᵣ₋₁、1 + 2 + … + (n − 1) = ₙC₂、
#     男子と女子から選ぶ ₘ₊ₙCᵣ の分け方、部分集合の数 2ⁿ）。頭に見本。
#   4 日目 わけ（3 問とも ③：握手の回数が奇数の人は偶数人、r × ₙCᵣ = n × ₙ₋₁Cᵣ₋₁、ₘ₊ₙCᵣ = ₘC₀ × ₙCᵣ + … + ₘCᵣ × ₙC₀）。
#   5 日目 混ぜる：C-015（道順、パスカルの三角形）、C-006（順列）、C-007（組合せ）と 1〜3 日目の型。6 日目 確認。
# 前提は C-015 だけ。たどると C-007（組合せ）、C-006（順列）、C-005（和と積の法則）、C-004（道順）、A-010（文字と式）、
#   A-009（累乗）、A-002（□ を使った式）、N-073（大きな数）までなので、これらを道具にする。
#   1 次方程式（A-011）は前提にないので、「委員会の数を □ とすると 5 × □ = 60」のように □ の式（A-002）で求める。
#   対応させて数える（C-014）と全単射（C-019）は前提にないので、「1 対 1 に対応させる」数え方は使わず、
#   どの問題も「同じものを 2 つの順に数えて等しいとおく」形にした。
#   グラフの用語（頂点の次数など、C-029）は使わず、握手と人の言葉で言う。
#   立体（G-021）も前提にないので、立体の問題では「どの辺もちょうど 2 つの面の境目になっている」「1 つの頂点に 3 つの面が集まる」を問題文に書き、
#   面・辺・頂点の言葉だけで解けるようにした。オイラーの多面体定理は使わない。
#   二項定理（C-016）は前提にないので、ₙC₀ + ₙC₁ + … + ₙCₙ = 2ⁿ は部分集合を 2 通りに数えて出す（C-015 の段の和と同じ）。
# 表の図は figure に全角の文字で書く（○ が正解、全角の空白が不正解）。
# check：握手や組の数は、片方の数え方の式（人数 × 1 人あたり ÷ 2 など）で出す。□ を求める問題は、□ を 1 から順にためして合うものをさがす。
#   二項係数は itertools.combinations で数えるか math.comb で計算し、等式は両辺を別々に計算して確かめる。
#   並べ方の合計は itertools.permutations で全部作って足す。
# 二通りに数えることは、グラフ理論（C-029、握手補題）、母関数（C-026）、組合せ論の恒等式、確率の期待値の線形性（S の流れ）、
#   計算量の見積もり（K の流れ）の入口になる（D-026）。

id: C-018
days:
  - day: 1
    items:
      - part: 見本
        text: 5 人の生徒が 4 問のテストを受け、正解した問題に ○ をつけた表をつくりました。○ の数を 2 通りに数えてみましょう。
        figure: "　｜１｜２｜３｜４\nＡ｜○｜○｜　｜○\nＢ｜　｜○｜○｜　\nＣ｜○｜○｜○｜○\nＤ｜○｜　｜　｜○\nＥ｜　｜○｜○｜○"
        explain: 表の ○ を行ごと（生徒ごと）に数えると 3 + 2 + 4 + 2 + 3 = 14、列ごと（問題ごと）に数えると 3 + 4 + 3 + 4 = 14 です。同じものを 2 つの順に数えたので、答えは等しくなります。これを、二通りに数えるといいます。片方の数え方が簡単で、もう片方に求めたい量が入っているとき、2 つを等しいとおくと、求めたい量がわかります。たとえば、6 人がそれぞれ全員と 1 回ずつ握手するときの握手の回数を考えます。1 人あたり 5 回握手するので、「人と、その人がした握手」の組は 6 × 5 = 30 組です。一方、1 回の握手には 2 人がかかわるので、どの握手もこの組の中で 2 回ずつ数えられています。握手の回数を □ とすると 2 × □ = 30 で、□ = 15 です。これは 6 人から 2 人を選ぶ選び方の数 ₆C₂ = 15（C-015）と同じです。一般に、何人かで握手をしたとき、1 人 1 人の握手の回数をすべて足した和は、握手の回数の 2 倍になります。立体でも、「面と、その面のまわりの辺」の組を、面から数えるか辺から数えるかで、辺の数が求められます。
      - part: 思い出す
        text: ₇C₂ はいくつですか。
        answer: 21
        check: "len([s for s in itertools.combinations(range(7), 2)])"
        hints:
          - 7 個から 2 個を選ぶ選び方の数です。
          - 7 × 6 を、2 × 1 でわります。
          - 約分してから計算すると楽になります。
        paths:
          - [7 × 6 ÷ (2 × 1), 42 ÷ 2, 21]
      - part: 思い出す
        text: ₆C₃ はいくつですか。
        answer: 20
        check: "len([s for s in itertools.combinations(range(6), 3)])"
        hints:
          - 6 から 1 ずつ小さくした数を、3 個かけます。
          - わる数は 3 × 2 × 1 です。
          - 6 × 5 × 4 ÷ 6 を計算しましょう。
        paths:
          - [6 × 5 × 4 ÷ (3 × 2 × 1), 120 ÷ 6, 20]
      - part: 今日
        text: 8 人が、それぞれちょうど 3 人と 1 回ずつ握手をしました。握手は全部で何回ですか。
        answer: 12
        check: "8 * 3 // 2"
        hints:
          - 1 人 1 人の握手の回数を、すべて足しましょう。
          - 1 回の握手は、何人の回数に入っているでしょう。
          - 和を 2 でわりましょう。
        paths:
          - [回数の和は 8 × 3 = 24, 1 回の握手は 2 人の回数に入る, 24 ÷ 2 = 12]
        note: 8 × 3 = 24 で止めやすい。1 回の握手を 2 人の側から 2 回数えている。
      - part: 今日
        text: 20 人の生徒が、それぞれちょうど 3 つの委員会に入っています。どの委員会も 5 人です。委員会はいくつありますか。
        answer: 12
        check: "[k for k in range(1, 100) if 5 * k == 20 * 3][0]"
        hints:
          - 「生徒と、その生徒が入っている委員会」の組を考えましょう。
          - 生徒の側から数えると、組はいくつでしょう。
          - 委員会の側から数えると、委員会の数 × 5 です。
        paths:
          - [生徒から数えると 20 × 3 = 60 組, 委員会の数を □ とすると 5 × □ = 60, □ = 12]
      - part: 挑戦
        text: 正十二面体は、12 枚の正五角形でできた立体です。どの辺もちょうど 2 つの面の境目になっていて、どの頂点にも 3 つの面が集まっています。頂点はいくつありますか。
        answer: 20
        check: "12 * 5 // 3"
        hints:
          - 「面と、その面の頂点」の組を考えましょう。
          - 面の側から数えると、12 × 5 組です。
          - 頂点の側から数えると、1 つの頂点は何回数えられているでしょう。
        paths:
          - [面から数えると 12 × 5 = 60 組, どの頂点も 3 つの面で数えられる, 60 ÷ 3 = 20]
          - [辺は 60 ÷ 2 = 30 本、1 つの頂点から 3 本の辺が出るので 30 × 2 ÷ 3 = 20]
        note: 12 × 5 = 60 を頂点の数としやすい。1 つの頂点は、集まっている 3 つの面それぞれで数えられている。
    extra:
      - part: 今日
        text: 10 人が、全員とちょうど 1 回ずつ握手をしました。握手は全部で何回ですか。
        answer: 45
        check: "len([s for s in itertools.combinations(range(10), 2)])"
        hints:
          - 1 人が握手する回数は何回でしょう。
          - 回数の和は、握手の回数の 2 倍です。
          - 10 人から 2 人を選ぶ選び方の数と同じになります。
        paths:
          - [1 人 9 回なので和は 90, 90 ÷ 2 = 45]
          - [₁₀C₂ = 10 × 9 ÷ 2 = 45]
      - part: 今日
        text: サッカーボールの形の立体は、12 枚の正五角形と 20 枚の正六角形でできています。どの辺もちょうど 2 つの面の境目になっています。辺は何本ありますか。
        answer: 90
        check: "(12 * 5 + 20 * 6) // 2"
        hints:
          - 「面と、その面の辺」の組を、面の側から数えましょう。
          - 正五角形の辺と正六角形の辺を合わせます。
          - 1 本の辺は、何回数えられているでしょう。
        paths:
          - [12 × 5 + 20 × 6 = 180, どの辺も 2 回数えられる, 180 ÷ 2 = 90]
      - part: 挑戦
        text: 何人かで握手をしました。どの人もちょうど 4 回握手をし、握手は全部で 18 回でした。全部で何人いましたか。
        answer: 9
        check: "[n for n in range(1, 50) if n * 4 == 2 * 18][0]"
        hints:
          - 1 人 1 人の握手の回数の和を、2 通りに表しましょう。
          - 人数を □ とすると、回数の和は 4 × □ です。
          - 回数の和は、握手の回数の 2 倍でもあります。
        paths:
          - [回数の和は 2 × 18 = 36, 4 × □ = 36, □ = 9]
        note: 18 ÷ 4 としやすい。まず回数の和（36）を出す。

  - day: 2
    items:
      - part: 見本
        text: 7 人で握手をしたとき、握手の回数が奇数である人の人数について調べてみましょう。
        explain: 1 人 1 人の握手の回数の和は、握手の回数の 2 倍なので、いつも偶数です。握手の回数が偶数の人たちの回数の和は偶数なので、残りの、回数が奇数の人たちの回数の和も偶数でなければなりません。奇数をいくつか足して偶数になるのは、足す奇数の個数が偶数のときだけです。よって、握手の回数が奇数である人は、いつも偶数人です。たとえば、7 人全員が 3 回ずつ握手することはできません（回数の和 3 × 7 = 21 が奇数になるから）。このように二通りに数えると、「できないこと」もわかります。また、人と集まりの関係も、二通りに数えられます。15 人の生徒がそれぞれ 2 つのクラブに入り、どのクラブも 6 人のとき、「生徒と、その生徒が入っているクラブ」の組を、生徒の側から数えると 15 × 2 = 30 組、クラブの側から数えると（クラブの数）× 6 組です。よって、クラブは 30 ÷ 6 = 5 つです。
      - part: 思い出す
        text: 9 人が、それぞれちょうど 4 人と 1 回ずつ握手をしました。握手は全部で何回ですか。
        answer: 18
        check: "9 * 4 // 2"
        hints:
          - 1 人 1 人の握手の回数の和を求めましょう。
          - 1 回の握手は、2 人の回数に入っています。
          - 和を 2 でわりましょう。
        paths:
          - [回数の和は 36, 36 ÷ 2 = 18]
      - part: 思い出す
        text: ₈C₂ はいくつですか。
        answer: 28
        check: "len([s for s in itertools.combinations(range(8), 2)])"
        hints:
          - 8 × 7 を 2 × 1 でわります。
          - 8 人の総当たりの試合の数と同じです。
          - 約分してから計算しましょう。
        paths:
          - [8 × 7 ÷ 2, 28]
      - part: 今日
        text: 9 人で握手をしました。握手の回数が奇数である人の人数として、ありえないものは、どれですか。
        choices: [0 人, 4 人, 7 人, 8 人]
        answer: 7 人
        check: "[c for c, k in {'0 人': 0, '4 人': 4, '7 人': 7, '8 人': 8}.items() if k % 2 == 1][0]"
        hints:
          - 1 人 1 人の握手の回数の和は、偶数でしょうか、奇数でしょうか。
          - 回数が奇数の人たちの回数の和も、偶数でなければなりません。
          - 奇数を何個足すと偶数になるでしょう。
        paths:
          - [回数の和は握手の回数の 2 倍で偶数, 奇数の人の回数の和も偶数, 奇数の人は偶数人, 7 人はありえない]
        note: 9 人が奇数だから奇数回の人も奇数人、と考えやすい。人数全体の偶奇は関係がない。
      - part: 今日
        text: どの面も三角形の立体があり、辺は 30 本です。どの辺もちょうど 2 つの面の境目になっています。面はいくつありますか。
        answer: 20
        check: "[f for f in range(1, 100) if 3 * f == 2 * 30][0]"
        hints:
          - 「面と、その面の辺」の組を考えましょう。
          - 面の側から数えると、面の数 × 3 組です。
          - 辺の側から数えると、30 × 2 組です。
        paths:
          - [辺から数えると 30 × 2 = 60 組, 面の数を □ とすると 3 × □ = 60, □ = 20]
      - part: 挑戦
        text: 10 人で握手をしました。どの人も握手の回数は 3 回か 5 回で、握手は全部で 19 回でした。5 回握手をした人は何人ですか。
        answer: 4
        check: "[k for k in range(0, 11) if 3 * (10 - k) + 5 * k == 2 * 19][0]"
        hints:
          - 1 人 1 人の握手の回数の和は、いくつでしょう。
          - 全員が 3 回だとすると、和はいくつ足りないでしょう。
          - 3 回の人を 5 回の人にかえると、和は 2 ずつ増えます。
        paths:
          - [回数の和は 2 × 19 = 38, 全員 3 回なら 30 で 8 足りない, 8 ÷ 2 = 4 人]
        note: 5 回の人が偶数人（回数が奇数の人は偶数人）になっていることも確かめられる。

    extra:
      - part: 今日
        text: 12 人の生徒が、4 つの班のうちちょうど 2 つずつに入っています。どの班も同じ人数です。1 つの班は何人ですか。
        answer: 6
        check: "[k for k in range(1, 50) if 4 * k == 12 * 2][0]"
        hints:
          - 「生徒と、その生徒が入っている班」の組を考えましょう。
          - 生徒の側から数えると、12 × 2 組です。
          - 班の側から数えると、4 × （1 つの班の人数）組です。
        paths:
          - [生徒から数えると 24 組, 4 × □ = 24, □ = 6]
      - part: 今日
        text: 正八面体は、8 枚の正三角形でできた立体です。どの頂点にも 4 つの面が集まっています。頂点はいくつありますか。
        answer: 6
        check: "8 * 3 // 4"
        hints:
          - 「面と、その面の頂点」の組を考えましょう。
          - 面の側から数えると、8 × 3 組です。
          - 1 つの頂点は、何回数えられているでしょう。
        paths:
          - [面から数えると 24 組, どの頂点も 4 回数えられる, 24 ÷ 4 = 6]
      - part: 挑戦
        text: 13 人で握手をしました。どの人も握手の回数は 3 回か 4 回で、握手は全部で 22 回でした。3 回握手をした人は何人ですか。
        answer: 8
        check: "[a for a in range(0, 14) if 3 * a + 4 * (13 - a) == 2 * 22][0]"
        hints:
          - 1 人 1 人の握手の回数の和は、いくつでしょう。
          - 全員が 4 回だとすると、和はいくつ多すぎるでしょう。
          - 4 回の人を 3 回の人にかえると、和は 1 ずつ減ります。
        paths:
          - [回数の和は 44, 全員 4 回なら 52 で 8 多い, 3 回の人は 8 人]

  - day: 3
    items:
      - part: 見本
        text: 6 人から 3 人の委員を選び、その中から委員長を 1 人決めます。決め方の数を、2 通りに数えてみましょう。
        explain: 1 つ目の数え方：先に 3 人の委員を選ぶと ₆C₃ = 20 通りで、そのそれぞれで委員長の決め方が 3 通りあるので、3 × ₆C₃ = 60 通りです。2 つ目の数え方：先に委員長を 6 人から 1 人選び（6 通り）、残りの 5 人から委員を 2 人選ぶと ₅C₂ = 10 通りなので、6 × ₅C₂ = 60 通りです。同じものを数えているので、3 × ₆C₃ = 6 × ₅C₂ です。人数を n 人、委員を r 人にしても同じように数えられるので、r × ₙCᵣ = n × ₙ₋₁Cᵣ₋₁ が成り立ちます（わけは 4 日目）。また、1 から n までの数から 2 つを選ぶ選び方を、選んだ 2 つのうち大きいほうの数で分けて数えると、大きいほうが 2 なら 1 通り、3 なら 2 通り、…、n なら n − 1 通りなので、1 + 2 + … + (n − 1) = ₙC₂ です。このように、等式の両辺を「同じものの 2 通りの数え方」とみると、計算しなくても等式が成り立つわけがわかります。
      - part: 思い出す
        text: 14 人の生徒が、それぞれちょうど 3 つの班に入っています。どの班も 6 人です。班はいくつありますか。
        answer: 7
        check: "[k for k in range(1, 100) if 6 * k == 14 * 3][0]"
        hints:
          - 「生徒と、その生徒が入っている班」の組を考えましょう。
          - 生徒の側から数えると、14 × 3 組です。
          - 班の側から数えると、班の数 × 6 組です。
        paths:
          - [生徒から数えると 42 組, 6 × □ = 42, □ = 7]
      - part: 思い出す
        text: ₅C₂ + ₅C₃ はいくつですか。
        answer: 20
        check: "len([s for s in itertools.combinations(range(5), 2)]) + len([s for s in itertools.combinations(range(5), 3)])"
        hints:
          - ₅C₂ と ₅C₃ を、それぞれ計算しましょう。
          - パスカルの三角形では、上の 2 つの和が下の数になります（C-015）。
          - ₅C₂ + ₅C₃ = ₆C₃ です。
        paths:
          - [₅C₂ = 10、₅C₃ = 10, 10 + 10 = 20]
          - [₅C₂ + ₅C₃ = ₆C₃ = 20]
      - part: 今日
        text: 8 人から 3 人の委員を選び、その中から委員長を 1 人決めます。決め方は何通りですか。
        answer: 168
        check: "len([(s, c) for s in itertools.combinations(range(8), 3) for c in s])"
        hints:
          - 先に委員を選ぶか、先に委員長を選ぶかの 2 通りの数え方があります。
          - 先に委員長を選ぶと、8 通りです。
          - 残りの 7 人から委員を 2 人選びましょう。
        paths:
          - [委員長は 8 通り, 残り 7 人から 2 人は ₇C₂ = 21 通り, 8 × 21 = 168]
          - [委員は ₈C₃ = 56 通り, 委員長は 3 通り, 56 × 3 = 168]
      - part: 今日
        text: 1 + 2 + 3 + … + 19 に等しいものは、どれですか。
        choices: [₂₀C₂, ₁₉C₂, ₂₀C₃, ₁₉C₁₈]
        answer: ₂₀C₂
        check: "[c for c, v in {'₂₀C₂': len([s for s in itertools.combinations(range(20), 2)]), '₁₉C₂': len([s for s in itertools.combinations(range(19), 2)]), '₂₀C₃': len([s for s in itertools.combinations(range(20), 3)]), '₁₉C₁₈': len([s for s in itertools.combinations(range(19), 18)])}.items() if v == sum(range(1, 20))][0]"
        hints:
          - 1 から n までの数から 2 つを選ぶ選び方を、大きいほうの数で分けて数えましょう。
          - 大きいほうが 20 のとき、小さいほうは何通りでしょう。
          - 1 + 2 + … + 19 は、大きいほうが 2 から何までのときの和でしょう。
