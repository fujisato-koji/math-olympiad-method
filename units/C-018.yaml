<rect x="174.0" y="68.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><text x="10.0" y="87.0" font-size="12" text-anchor="middle" fill="currentColor">3</text><rect x="24.0" y="98.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="54.0" y="98.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="84.0" y="98.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="114.0" y="98.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="144.0" y="98.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="174.0" y="98.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><text x="10.0" y="117.0" font-size="12" text-anchor="middle" fill="currentColor">4</text><rect x="24.0" y="128.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="54.0" y="128.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="84.0" y="128.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="114.0" y="128.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="144.0" y="128.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><rect x="174.0" y="128.0" width="30.0" height="30.0" stroke="currentColor" stroke-width="1" fill="none"/><text x="10.0" y="147.0" font-size="12" text-anchor="middle" fill="currentColor">5</text></svg>
