        text: n 人から r 人を選ぶとき（1 ≦ r ≦ n）、r × ₙCᵣ = n × ₙ₋₁Cᵣ₋₁ が成り立ちます。このわけを、二通りに数えて、すじ道を立てて書きましょう。
        explain: 例：「n 人から r 人の委員を選び、その中から委員長を 1 人決める決め方の数を N とする。先に委員を選ぶと ₙCᵣ 通りで、そのそれぞれで委員長の決め方が r 通りあるので、積の法則で N = r × ₙCᵣ。先に委員長を選ぶと n 通りで、そのそれぞれで、残りの n − 1 人から委員長以外の委員 r − 1 人を選ぶ選び方が ₙ₋₁Cᵣ₋₁ 通りあるので、N = n × ₙ₋₁Cᵣ₋₁。同じ N を 2 通りに数えたので、r × ₙCᵣ = n × ₙ₋₁Cᵣ₋₁ である。」と書ければよい。①「〜とする」で数える対象（委員と委員長の決め方）とその数 N を決める、② 2 つの順で数えて式にする、③ 約束した事実（積の法則 C-005、ₙCᵣ の意味）で結ぶ、の 3 つがそろっているかを見る。n = 6、r = 3 のような例で両辺を計算しただけで終わっていたら、例ではすべての n、r を示せないことを話す。ₙCᵣ の計算の式から両辺を変形して示してもよいが、二通りに数えると、なぜその等式になるかが見えることにふれる。
