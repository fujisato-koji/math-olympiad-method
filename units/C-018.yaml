      - part: わけ
        id: "6f15ef65e5"
        text: 男子 m 人と女子 n 人から r 人を選ぶとき（r ≦ m、r ≦ n）、ₘ₊ₙCᵣ = ₘC₀ × ₙCᵣ + ₘC₁ × ₙCᵣ₋₁ + … + ₘCᵣ × ₙC₀ が成り立ちます。このわけを、二通りに数えて、すじ道を立てて書きましょう。
        explain: 例：「男子 m 人と女子 n 人の合わせて m + n 人から r 人を選ぶ選び方の数を N とする。男女を区別せずに選ぶと N = ₘ₊ₙCᵣ。一方、選んだ r 人のうち男子が k 人（k は 0 から r まで）である選び方は、男子 m 人から k 人、女子 n 人から r − k 人を選ぶので、積の法則で ₘCₖ × ₙCᵣ₋ₖ 通りである。男子の人数が k = 0、1、…、r のどれかにちょうど 1 つ決まるので、和の法則で N = ₘC₀ × ₙCᵣ + ₘC₁ × ₙCᵣ₋₁ + … + ₘCᵣ × ₙC₀。同じ N を 2 通りに数えたので、等式が成り立つ。」と書ければよい。①「〜とする」で数える対象と N を決める、② 男子の人数で場合を分けて、それぞれを積の法則で式にする、③ 約束した事実（和の法則と積の法則 C-005、場合が重ならずもれないこと）で結ぶ、の 3 つがそろっているかを見る。和の法則を使うには、場合が重ならずもれがないこと（男子の人数はただ 1 つに決まる）を言う必要があることを話す。5 日目の道順の問題（右と上の道順を、とちゅうで通る点で分ける）も、同じ形の等式になることにふれる。
        hints:
          - 「m + n 人から r 人を選ぶ選び方の数を N とする」から書き始めましょう。
