      - part: わけ
        text: 何人かで握手をしたとき、握手の回数が奇数である人は、いつも偶数人です。このわけを、筋道を立てて書きましょう。
        explain: 例：「握手の回数を m 回とし、1 人 1 人の握手の回数をすべて足した和を S とする。『人と、その人がした握手』の組を、人の側から数えると S 組、握手の側から数えると、1 回の握手には 2 人がかかわるので 2m 組である。同じものを数えているので S = 2m で、S は偶数である。回数が偶数の人たちの回数の和を T、奇数の人たちの回数の和を U とすると、S = T + U で、T は偶数どうしの和なので偶数、よって U = S − T も偶数である。U は奇数を、回数が奇数の人の人数だけ足した数で、奇数を奇数個足すと奇数になるので、その人数は偶数である。」と書ければよい。①「〜とする」で m、S、T、U を決める、② 同じ組を 2 通りに数えて S = 2m とする、③ 約束した事実（偶数どうしの和は偶数、奇数を奇数個足すと奇数）で結ぶ、の 3 つがそろっているかを見る。4 人や 5 人の例で確かめただけで終わっていたら、例ではすべての握手の仕方を示せないことを話す。「奇数を奇数個足すと奇数」は、奇数を 2k + 1 と書けば（A-010）、和が 2 × (k の和) + 個数 になることからわかる、と補ってもよい。
        hints:
          - 握手の回数を m、1 人 1 人の回数の和を S として、S を 2 通りに表しましょう。
          - S を、回数が偶数の人たちの和と、奇数の人たちの和に分けましょう。
          - 奇数を何個足すと偶数になるかを使って、結論を書きましょう。
        paths:
          - [組を 2 通りに数えて S = 2m で偶数, 偶数の人たちの和は偶数なので奇数の人たちの和も偶数, 奇数を奇数個足すと奇数, 奇数の人は偶数人]
      - part: わけ
        text: n 人から r 人を選ぶとき（1 ≦ r ≦ n）、r × ₙCᵣ = n × ₙ₋₁Cᵣ₋₁ が成り立ちます。このわけを、二通りに数えて、筋道を立てて書きましょう。
        explain: 例：「n 人から r 人の委員を選び、その中から委員長を 1 人決める決め方の数を N とする。先に委員を選ぶと ₙCᵣ 通りで、そのそれぞれで委員長の決め方が r 通りあるので、積の法則で N = r × ₙCᵣ。先に委員長を選ぶと n 通りで、そのそれぞれで、残りの n − 1 人から委員長以外の委員 r − 1 人を選ぶ選び方が ₙ₋₁Cᵣ₋₁ 通りあるので、N = n × ₙ₋₁Cᵣ₋₁。同じ N を 2 通りに数えたので、r × ₙCᵣ = n × ₙ₋₁Cᵣ₋₁ である。」と書ければよい。①「〜とする」で数える対象（委員と委員長の決め方）とその数 N を決める、② 2 つの順で数えて式にする、③ 約束した事実（積の法則 C-005、ₙCᵣ の意味）で結ぶ、の 3 つがそろっているかを見る。n = 6、r = 3 のような例で両辺を計算しただけで終わっていたら、例ではすべての n、r を示せないことを話す。ₙCᵣ の計算の式から両辺を変形して示してもよいが、二通りに数えると、なぜその等式になるかが見えることに触れる。
        hints:
          - 「n 人から r 人の委員を選び、その中から委員長を 1 人決める決め方の数を N とする」から書き始めましょう。
          - 先に委員を選ぶ数え方で、N を式にしましょう。
          - 先に委員長を選ぶ数え方で、もう一度 N を式にしましょう。
        paths:
          - [委員と委員長の決め方を N とする, 先に委員を選ぶと N = r × ₙCᵣ, 先に委員長を選ぶと N = n × ₙ₋₁Cᵣ₋₁, 同じ N なので等しい]
      - part: わけ
        text: 男子 m 人と女子 n 人から r 人を選ぶとき（r ≦ m、r ≦ n）、ₘ₊ₙCᵣ = ₘC₀ × ₙCᵣ + ₘC₁ × ₙCᵣ₋₁ + … + ₘCᵣ × ₙC₀ が成り立ちます。このわけを、二通りに数えて、筋道を立てて書きましょう。
        explain: 例：「男子 m 人と女子 n 人の合わせて m + n 人から r 人を選ぶ選び方の数を N とする。男女を区別せずに選ぶと N = ₘ₊ₙCᵣ。一方、選んだ r 人のうち男子が k 人（k は 0 から r まで）である選び方は、男子 m 人から k 人、女子 n 人から r − k 人を選ぶので、積の法則で ₘCₖ × ₙCᵣ₋ₖ 通りである。男子の人数が k = 0、1、…、r のどれかにちょうど 1 つ決まるので、和の法則で N = ₘC₀ × ₙCᵣ + ₘC₁ × ₙCᵣ₋₁ + … + ₘCᵣ × ₙC₀。同じ N を 2 通りに数えたので、等式が成り立つ。」と書ければよい。①「〜とする」で数える対象と N を決める、② 男子の人数で場合を分けて、それぞれを積の法則で式にする、③ 約束した事実（和の法則と積の法則 C-005、場合が重ならずもれないこと）で結ぶ、の 3 つがそろっているかを見る。和の法則を使うには、場合が重ならずもれがないこと（男子の人数はただ 1 つに決まる）を言う必要があることを話す。5 日目の道順の問題（右と上の道順を、途中で通る点で分ける）も、同じ形の等式になることに触れる。
        hints:
          - 「m + n 人から r 人を選ぶ選び方の数を N とする」から書き始めましょう。
          - 選んだ r 人のうち男子が k 人である選び方は、何通りでしょう。
          - 男子の人数で分けた場合が、重ならずもれもないことを書いて、和の法則を使いましょう。
        paths:
          - [m + n 人から r 人の選び方を N とする, 区別せずに N = ₘ₊ₙCᵣ, 男子 k 人の場合は ₘCₖ × ₙCᵣ₋ₖ 通り, k = 0〜r の和も N なので等しい]
