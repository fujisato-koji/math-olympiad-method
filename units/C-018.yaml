    check: max(sum(sum(c >> i & 1 for i in range(5)) for c in cols) for cols in itertools.combinations_with_replacement(range(32), 6) if all((a & b) & ((a & b) - 1) == 0 for a, b in itertools.combinations(cols, 2)))
    hints:
    - 小さい方眼（たて 3 マス、横 3 マスなど）で、きまりを守りながら ● をできるだけ多くかいてみよう。「4 つのかどがそろう」とは、2 本の列がどうなっているときかな。
    - 2 本の列が、同じ行に ● をもつとき、その行はいくつまで許されるかな。そのことから、1 本の列の ● が、ほかの列とぶつからないためには何が必要か考えよう。
    - 1 本の列の中の ● を 2 こずつ組にしてみよう。その組と、ほかの列には、どんな関係があるかな。
    paths:
    - - 4 つのかどがそろうのは、2 本の列が、同じ 2 つの行の両方に ● をもつとき。だから、5 つの行から 2 つえらぶ ₅C₂ = 10 組のどれも、その 2 つの行に ● を両方もつ列は、1 本まででなければならない。
      - ● が k こある列は、その中から 2 こえらぶ k × (k − 1) ÷ 2 組の行の組を使う。6 本の列で使う組は、どれも別の組だから、合計は 10 以下。
      - ● が 15 こかけたとする。6 本に 15 こを分けたとき、使う組が最も少ないのは、できるだけ同じ数にした 3、3、3、2、2、2 のとき。わけ：2 本の列の ● の数が a と b で、a が b より 2 以上大きいなら、a の列から 1 こ b の列へ移すと、使う組は (a − 1) 組へり、b 組ふえる。a − 1 は b より大きいので、合計はへる。だから、いちばん少ないのは、差が 1 以下にそろったとき。
      - そのときの合計は 3 + 3 + 3 + 1 + 1 + 1 = 12。12 は 10 より多いので、15 こはかけない。16 こ以上かけたなら、そこから ● を 15 こまでへらしてもきまりは守られるので、これもかけない。だから 14 こ以下。
      - 14 こかける例：列ごとの ● の行を、左の列から順に {1, 2, 3}、{1, 4, 5}、{2, 4}、{2, 5}、{3, 4}、{3, 5} とする。使う組は 12、13、23、14、15、45、24、25、34、35 で、10 組をちょうど 1 回ずつ使い、重ならない。● は 3 + 3 + 2 + 2 + 2 + 2 = 14 こ。だから答えは 14。
    - - 4 つのかどがそろうのは、2 本の列が、同じ 2 つの行の両方に ● をもつとき。だから、どの 2 本の列も、● が同じ行で重なるのは 1 行まで。
      - ● が 5 こある列があるとき。ほかの列に ● が 2 こあれば、その 2 こは 5 つの行のどれかだから、5 この列と 2 行で重なってしまう。だから、ほかの列は ● が 1 こ以下。合計は 5 + 5 × 1 = 10 以下。
      - ● が 4 こある列があるとき（5 この列はない）。ほかの列に ● が 3 こあれば、4 + 3 = 7 は行の数 5 より 2 多いので、4 この列と 2 行以上重なってしまう。だから、ほかの列は 2 こ以下。合計は 4 + 2 × 5 = 14 以下。
      - どの列も 3 こ以下のとき。3 この列が 3 本あるとする。そのうち 2 本（A、B）の重なりは 1 行までだから、A と B を合わせると 3 + 3 − 1 以上で 5 行、つまり 5 つの行が全部ふくまれる。3 本目の列 C の 3 行は、どれも A か B のどちらかには入る（両方に入る行もある）。だから、C が A と重なる行の数と B と重なる行の数をたすと 3 以上になり、どちらかは 2 以上。これは 1 行までという決まりにあわない。だから、3 この列は 2 本まで。
      - 3 この列が 2 本までなら、合計は 3 + 3 + 2 × 4 = 14 以下。(3 この列が 1 本以下なら、もっと少ない。) どの場合も 14 以下。14 こかける例は 1 本目と同じ（列ごとの ● の行が {1, 2, 3}、{1, 4, 5}、{2, 4}、{2, 5}、{3, 4}、{3, 5}）。だから答えは 14。
    note: 考えどころは 3 つ：①「4 つのかどがそろう」を「2 本の列が、同じ 2 つの行の両方に ● をもつ」と言いかえ、列と列がぶつかる条件にする、②数える向きを列でなく行の組にして、5 つの行から 2 つえらぶ ₅C₂ = 10 組を、列ごとに k × (k − 1) ÷ 2 組ずつ使い、合計が 10 以下という式を作り、15 こをならして 12 組になることで上の 14 を出す、③10 組をちょうど 1 回ずつ使う 14 この ● のかき方を見つける。2 本目は、1 本目のように全体の組をまとめて数えるのではなく、● がいちばん多い列の大きさ（5 こ、4 こ、3 こ以下）で場合を分け、ほかの列が何こまでかけるかを順に上からおさえる。check は、列を 5 けたの 2 進の数（ある行に ● があるかどうかを 1 けたずつ）で表し、どの 2 本の列の共通の行も 1 つ以下になる 6 本の列の組を全部ためして、● の数の合計がいちばん多いものを求める（約 2.3 秒で 14）。既出：これはザランキェヴィッチの問題の小さい場合。4 × 4 の 9 と 5 × 5 の 12 は知られた小問だが、5 × 6 の 14 はパズルとしてはあまり出ない（小さい値の表は R. K. Guy の 1969 年のまとめなどにある。海外の本や大会に同じ形の既出がある見こみもある）。わな：15 こ、あるいはもっと多くかけると予想する。また、反対の向き（6 つの列から 2 つえらぶ 15 組を、行ごとに数える）では、15 こでも 3 こずつ 5 行で 15 組ちょうどになり、15 こを落とせない。数える向きに工夫がいる。
