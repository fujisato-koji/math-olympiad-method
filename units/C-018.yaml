            svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="74" width="170" height="36" rx="10" fill="#7bc96f" fill-opacity="0.25" stroke="#3e9a4e" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="22" cy="92" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="22" y="97" font-size="13" text-anchor="middle" fill="currentColor">1</text><circle cx="68" cy="92" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="68" y="97" font-size="13" text-anchor="middle" fill="currentColor">2</text><circle cx="114" cy="92" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="114" y="97" font-size="13" text-anchor="middle" fill="currentColor">3</text><circle cx="160" cy="92" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="160" y="97" font-size="13" text-anchor="middle" fill="currentColor">4</text><circle cx="206" cy="92" r="12" fill="#f3c969" fill-opacity="0.7" stroke="#d9534f" stroke-width="3"/><text x="206" y="97" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">5</text><circle cx="252" cy="92" r="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/><text x="252" y="97" font-size="13" text-anchor="middle" fill="currentColor">6</text><circle cx="298" cy="92" r="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/><text x="298" y="97" font-size="13" text-anchor="middle" fill="currentColor">7</text><line x1="206" y1="54" x2="206" y2="68" stroke="#d9534f" stroke-width="2" stroke-linecap="round"/><polygon points="206,76 202,68 210,68" fill="#d9534f"/><text x="206" y="46" font-size="14" text-anchor="middle" fill="#d9534f" font-weight="bold">いちばん大きい数</text><text x="160" y="138" font-size="14" text-anchor="middle" fill="#3e9a4e" font-weight="bold">残りの 2 つは、緑のわくの中から</text></svg>'
          - k × （k − 1 個から 2 個を選ぶ数）を、k = 3 から 7 まで足しましょう。
        paths:
          - [いちばん大きい数が k の選び方は ₖ₋₁C₂ 通り, 3 × 1 + 4 × 3 + 5 × 6 + 6 × 10 + 7 × 15, 3 + 12 + 30 + 60 + 105 = 210]
          - ["k × ₖ₋₁C₂ ＝ 3 × ₖC₃", "3 × (₃C₃ + ₄C₃ + … + ₇C₃) ＝ 3 × ₈C₄", "3 × 70 ＝ 210"]
        note: 35 通りを 1 つずつ書き出さず、いちばん大きい数で分けて数える。k × ₖ₋₁C₂ = 3 × ₖC₃ に気づくと、合計は 3 × ₈C₄ = 210 とも求められる。

