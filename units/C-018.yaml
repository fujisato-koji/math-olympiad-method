    text: 集合 {1, 2, 3, …, 10} の《部分集合》は、空集合もふくめて 1024 個あります。1 つ 1 つの部分集合の要素をすべて足した和を求め、それを 1024 個の部分集合すべてについて足すと、いくつになりますか（空集合の和は 0 とします）。
