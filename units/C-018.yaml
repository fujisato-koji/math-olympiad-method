      - part: わけ
        id: "7d2ce623a3"
        text: 何人かであく手をしたとき、あく手の回数が奇数である人は、いつも偶数人です。このわけを、すじ道を立てて書きましょう。
        explain: 例：「あく手の回数を m 回とし、1 人 1 人のあく手の回数をすべて足した和を S とする。『人と、その人がしたあく手』の組を、人の側から数えると S 組、あく手の側から数えると、1 回のあく手には 2 人がかかわるので 2m 組である。同じものを数えているので S = 2m で、S は偶数である。回数が偶数の人たちの回数の和を T、奇数の人たちの回数の和を U とすると、S = T + U で、T は偶数どうしの和なので偶数、よって U = S − T も偶数である。U は奇数を、回数が奇数の人の人数だけ足した数で、奇数を奇数個足すと奇数になるので、その人数は偶数である。」と書ければよい。①「〜とする」で m、S、T、U を決める、② 同じ組を 2 通りに数えて S = 2m とする、③ 約束した事実（偶数どうしの和は偶数、奇数を奇数個足すと奇数）で結ぶ、の 3 つがそろっているかを見る。4 人や 5 人の例で確かめただけで終わっていたら、例ではすべてのあく手の仕方を示せないことを話す。「奇数を奇数個足すと奇数」は、奇数を 2k + 1 と書けば（A-010）、和が 2 × (k の和) + 個数になることからわかる、とおぎなってもよい。
        hints:
          - text: あく手の回数を m、1 人 1 人の回数の和を S として、S を 2 通りに表しましょう。
