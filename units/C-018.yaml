        text: 5 人の生徒が 4 問のテストを受け、正解した問題に ○ をつけた表をつくりました（左の図）。○ の数は、行ごと（生徒ごと）に数えても、列ごと（問題ごと）に数えても 14 こです。同じものを 2 通りに数えると、答えは等しくなります。右の図のあく手の回数も、「人と、その人がしたあく手」の組を 2 通りに数えて求めます。
