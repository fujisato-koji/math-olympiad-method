troke-linecap="round" stroke-linejoin="round"/><text x="160" y="150" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">4 つ分（4 皿）</text><text x="160" y="180" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">3 × 4 = 12</text></svg>'
        explain: 1 皿に 3 こずつ、4 皿分あります。このようなとき「3 × 4」と書いて「3 かける 4」と読みます。3 + 3 + 3 + 3 = 12 なので、3 × 4 = 12 です。× の前の 3 は 1 つ分の数、× の後ろの 4 はいくつ分を表します。このような計算をかけ算といいます。
