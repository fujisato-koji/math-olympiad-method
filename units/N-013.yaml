# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 数, 道筋]
    uses: [N-008]
    text: 九九の表には、1 × 1 から 9 × 9 まで、81 この答えがあります。このうち、答えがきすうになるものは何こありますか。
    answer: 25
    check: "sum(1 for a in range(1, 10) for b in range(1, 10) if a * b % 2 == 1)"
    hints:
      - 2 のだん、4 のだん、6 のだん、8 のだんの答えは、ぐうすうかな、きすうかな。
      - 3 のだんの答え 3、6、9、12、15、… では、ぐうすうときすうがどうならんでいるかな。
      - きすうのだんは何だんあるかな。1 つのだんに、きすうの答えはいくつあるかな。
    paths:
      - [2、4、6、8 のだんの答えはどれもぐうすう, 1、3、5、7、9 のだんは かける数がきすうのときだけ答えがきすう, かける数のきすうは 1、3、5、7、9 の 5 こ, 5 だんに 5 こずつで 5 × 5 = 25]
      - [九九の表で答えがきすうのますに色をぬる, ぬれるのは きすうのだんの行と きすうのかける数の列がまじわるところ, 5 だんと 5 つのかける数で 5 × 5 = 25]
    note: 81 こを 1 つずつ調べるのではなく、「かけられる数とかける数の両方が奇数のときだけ答えが奇数」に気づくのが要点（偶数のいくつ分は、2 こずつ組にできるので偶数）。N-013 の文の漢字は小 3 までなので、偶数・奇数はかなで書いた。
  - part: 離
    kinds: [道筋, 読み取り]
    text: 子どもたちにあめを配ります。1 人に 6 こずつ配ると 5 こあまります。1 人に 8 こずつ配ろうとすると 9 こ足りません。あめは何こありますか。
    answer: 47
    check: "[6 * k + 5 for k in range(1, 10) if 6 * k + 5 == 8 * k - 9][0]"
    hints:
      - 1 人分を 6 こから 8 こにすると、1 人について何こ多くいるかな。
      - あまっていた 5 こを使っても、まだ 9 こ足りない。8 こずつにするには、ぜんぶで何こ多くいったのかな。
      - 1 人について多くいる数の何人分が、その数になるかな。九九で考えよう。
    paths:
      - [8 こずつにすると 1 人について 2 こ多くいる, 多くいったのは あまりの 5 こと足りない 9 こで 14 こ, 2 のだんで 14 になるのは 2 × 7 なので 7 人, 6 × 7 = 42、42 + 5 = 47]
      - [人数を 1 人、2 人、… とためして表にする, 6 こずつのときの数と 8 こずつのときの数をくらべる, 7 人のとき どちらも 47 になる, 47]
    note: 過不足算の型。1 人分の差（2 こ）と全体の差（5 + 9 = 14 こ）を結びつけるのが道筋の要点。わり算（N-014）は前提にないので、「2 のだんで 14 になるのは」と九九でさがす。2 本目のためす表でも解ける。
