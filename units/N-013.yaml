        explain: 1 皿に 3 こずつ、4 皿分あります。このようなとき「3 × 4」と書いて「3 かける 4」と読みます。3 + 3 + 3 + 3 = 12 なので、3 × 4 = 12 です。× の前の 3 は 1 つ分の数、× の後ろの 4 はいくつ分を表します。このような計算をかけ算といいます。
      - part: 思い出す
        text: 5 + 5 + 5 + 5 はいくつですか。
        answer: 20
        check: "5 + 5 + 5 + 5"
        hints:
          - 前からじゅんにたしていこう。
          - はじめの 5 + 5 はいくつかな。
          - その答えに、のこりの 5 を 1 つずつたしていこう。
        paths:
          - [5 + 5 = 10, 10 + 5 = 15, 15 + 5 = 20]
          - [5、10、15、20 と 5 ずつ数える, 20]
