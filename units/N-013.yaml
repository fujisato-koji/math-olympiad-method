        explain: たとえば「7 × 6 は 7 が 6 こ分で、図の青い 6 行。7 × 7 は 7 が 7 こ分で、青い 6 行に赤い 1 行をたしたもの。7 × 7 は 7 × 6 より 7 が 1 こ分多いので、42 に 7 をたして 49 になる。」と書ければよい。「かける数が 1 ふえると、答えはかけられる数だけふえる」というきまりまで書ければなおよい。この問題は 7 のだんだが、ほかのだんでも同じように言えることにふれるとよい。
        hints:
          - 7 × 6 と 7 × 7 は、それぞれ 7 が何こ分かな。
          - 図の青い行と赤い行は、何を表しているかな。
          - 「7 × 7 は 7 × 6 より〜だから」と書こう。
        paths:
          - [7 × 6 は 7 が 6 こ分, 7 × 7 は 7 が 7 こ分, 7 が 1 こ分多い, だから 42 + 7 = 49]
          - [7 × 7 は 7 を 7 回たす, 7 × 6 は 7 を 6 回たす, たす回数が 1 回多い, だから 42 + 7 = 49]
