        text: 1 皿にりんごが 3 こずつ、4 皿あります。1 皿の 3 こを「1 つ分」、4 皿を「4 つ分」といいます。全部の数は 3 × 4 と書いて「3 かける 4」と読みます。3 + 3 + 3 + 3 = 12 なので、3 × 4 = 12 です。
