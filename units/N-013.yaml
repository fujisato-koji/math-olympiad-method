# N-013 かけ算（九九）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は小 3 までの漢字で書く（個・枚・残・増・減・比・選・並 などの
#   小 4 より後の字はかなで書く）。分かち書きはしない。数の前後には空白を入れる。
# かけ算の式は「1 つ分の数 × いくつ分 = 全部の数」で読む。「×」は U+00D7、check では「*」。
#   場面の式を選ぶ問題は「1 つ分の数 × いくつ分」の形を正しい答えにし、入れかえた式（3 × 4 と 4 × 3）を両方は選択肢に入れない。
#   入れかえても答えが同じこと（交換のきまり）は N-015 なので、この単元では九九をつくるのにも使わない。
# 図は 1 行を 1 つ分にして描く（🍎🍎🍎 の行が 4 つで 3 × 4）。check は n(c) で全部の数を数える。
# 九九は「かける数が 1 ふえると、答えはかけられる数だけふえる」でつくる（2〜5 日目）。6 日目のわけの日に、同じきまりで × 10 と × 0 まで
#   のばす（N-015 の「分ける」で 12 × 4 を 10 × 4 と 2 × 4 にするときに × 10 を使う）。
# 前提は N-007 だけ。100 より大きい数（N-009）、お金（N-060）、長さの単位（G-046）、わり算（N-014）は使わない。
#   2 けた × 1 けた（12 × 3 など）はここでは扱わない（N-015 の分けるで 100 までを扱う）。
#   × と + がまじった式（3 × 4 + 2 など）の計算の順序は N-015 で決めるので、ここでは 2 つの式に分けて書く。
# 地図の日の並びは既定（導入・練習 4 日・わけ・混ぜる・確認）。練習の日はどれも新しい段が出るので、その日の頭に見本を置く。

