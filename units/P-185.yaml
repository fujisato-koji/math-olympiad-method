# P-185 押す力・引く力とゴム
#
# 段 1・水準 1・4 日。おす力とひく力、力でものの形と動きが変わること、ゴムを長くのばすほど車が遠くへ走ること、風で動かすことを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 日の並び：1 日目 導入（おす力・ひく力、形と動きが変わる）、2 日目 練習（ゴムののびと車の走るきょり、風の力）、3 日目 わけ（ゴムの力）、4 日目 確認。
# ゴムで動く車は、2 本のぼうにかけたゴムに車をかけて引き、手をはなして走らせる。図は横から見たもので、ぼうは 1 本だけ描いた。
# ゴムはのばしすぎると切れてあぶないので、ほどほどにのばす（見本の explain にも書いた）。
# 腕だめし（離）の kinds は読み取り（絵の中の様子を読み取って答える）。

