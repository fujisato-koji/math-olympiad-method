# P-185 押す力・引く力とゴム
#
# 段 1・水準 1・4 日。力で形と動きが変わること、ゴムを長くのばすほど遠くへ走ること、風で動かすことを扱う。
# 子の画面には text、figure、choices、ヒントだけを出す。answer、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。

id: P-185
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          ものを 押すと、力が はたらきます。ものを 引いても、力が はたらきます。
          力を 加えると、ものの 形が 変わったり、動きが 変わったりします。
          押す 力と 引く 力は、向きが ちがいます。
        explain: |-
          【性質】ボールを 押すと、ボールが 転がります。ひもを 引くと、ものが 近づきます。
          力を 加えると、形が へこんだり、のびたりします。
          力の 向きで、ものの 動きが 変わります。
        note: 押す力と引く力。力で形や動きが変わる。
      - part: 今日
        text: ドアを 開ける とき、どんな 力を つかうかな。
        figure: 🚪
        choices: [押す 力, 引く 力, どちらでも よい, 力は いらない]
        answer: 押す 力
        check: "'押す 力'"
        hints:
          - ドアを 開ける とき、手を どう 動かすかな。
          - ドアを 向こうへ 動かします。
          - ドアを 向こうへ 動かす 向きを 考えよう。
        paths:
          - [ドアを 開ける, 向こうへ 動かす, 押す 力]
      - part: 今日
        text: ゴムを 引っぱると、どうなるかな。
        figure: 🪀
        choices: [のびる, ちぢむ, 光る, こわれる]
        answer: のびる
        check: "'のびる'"
        hints:
          - ゴムを 引っぱった ときの ことを おもいだそう。
          - 引く 力で、ゴムは 長く なります。
          - 引っぱった あとの ゴムの 長さを たしかめよう。
        paths:
          - [引っぱる, 長く なる, のびる]
      - part: 挑戦
        text: 力を 加えると、ものは どうなるかな。
        choices: [形や 動きが 変わる, 必ず こわれる, 色が 変わる, 何も 変わらない]
        answer: 形や 動きが 変わる
        check: "'形や 動きが 変わる'"
        hints:
          - ボールを 押した ときの ことを おもいだそう。
          - 形が 変わったり、動いたりします。
          - ボールを 押した ときの ようすを おもいだそう。
        paths:
          - [力を 加える, 形, 動き, 変わる]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          ゴムを 長く のばすと、元に 戻ろうとする 力が 大きく なります。
          ゴムで ものを 飛ばす とき、長く のばすほど、遠くまで 飛びます。
          風も、ものを 動かす 力に なります。
        explain: |-
          ゴムは、のばすと 元に 戻ろうとします。長く のばすほど、戻る 力が 大きく なります。
          ゴムで 紙を 飛ばす とき、長く のばすと 遠くまで 飛びます。
          風で 風車が 回るのも、力が はたらく からです。
        note: ゴムは長くのばすほど強い力で戻る。風も力になる。
      - part: 今日
        text: ゴムを 長く のばすと、飛ぶ ものは どうなるかな。
        choices: [遠くまで 飛ぶ, 近くで 止まる, 上に だけ 飛ぶ, 飛ばない]
        answer: 遠くまで 飛ぶ
        check: "'遠くまで 飛ぶ'"
        hints:
          - 長く のばした ときの 力を 考えよう。
          - 元に 戻る 力が 大きく なります。
          - 長く のばした ときの 戻る 力を 考えよう。
        paths:
          - [長く のばす, 戻る 力が 大きい, 遠くまで 飛ぶ]
      - part: 今日
        text: ゴムを のばすと、ゴムは どうしようと するかな。
        choices: [元に 戻ろうと する, もっと のびようと する, 光ろうと する, 小さく なろうと する]
        answer: 元に 戻ろうと する
        check: "'元に 戻ろうと する'"
        hints:
          - のばした ゴムを 手で 持って みよう。
          - 手を はなすと、ゴムは どう なるかな。
          - 手を はなした あとの ゴムの ようすを おもいだそう。
        paths:
          - [のばす, はなす, 元に 戻る, 戻る 力]
      - part: 挑戦
        text: 風で 風車が 回るのは、なぜかな。
        choices: [風が 力を はたらかせるから, 風車が 光るから, 風が 音を 出すから, 風車が 自分で 回るから]
        answer: 風が 力を はたらかせるから
        check: "'風が 力を はたらかせるから'"
        hints:
          - 風は ものを 動かす ことが あります。
          - 風が 風車の 羽を 押します。
          - 風が 風車の 羽に 何を しているか を 考えよう。
        paths:
          - [風, 羽を 押す, 力, 回る]
    extra: []

