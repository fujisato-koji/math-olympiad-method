  - day: 2
    items:
      - part: 見本
        text: ものをまわすときの「まわしにくさ」を慣性モーメントといい、I と書きます。軸から r はなれた所にある質量 m の玉 1 つなら、I = m × r × r です。軸から遠いほど、まわしにくくなります。玉がいくつかあるときは、それぞれの I をたします。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="70" cy="100" r="9" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="70" cy="100" r="3" fill="currentColor"/><text x="70" y="130" font-size="14" text-anchor="middle" fill="currentColor">軸</text><line x1="79" y1="100" x2="216" y2="100" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="230" cy="100" r="16" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="230" y="105" font-size="13" text-anchor="middle" fill="currentColor">m</text><line x1="78" y1="140" x2="222" y2="140" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="230,140 222,144 222,136" fill="currentColor"/><polygon points="70,140 78,136 78,144" fill="currentColor"/><text x="150" y="134" font-size="13" text-anchor="middle" fill="currentColor">r</text></svg>'
