        text: ぼうのはしを支点にして、はなれた所をおすと、ぼうはまわります。まわす働きをトルクといいます。ぼうに直角におすとき、トルク = 支点からのきょり × 力です。同じ力でも、支点から遠いほど、よくまわります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="50" y="90" width="230" height="12" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><polygon points="50,100 38,124 62,124" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="96" r="5" fill="currentColor"/><line x1="220" y1="34" x2="220" y2="78" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="220,88 215,78 225,78" fill="currentColor"/><text x="220" y="26" font-size="14" text-anchor="middle" fill="currentColor">力 F = 9 N</text><line x1="58" y1="146" x2="212" y2="146" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="220,146 212,150 212,142" fill="currentColor"/><polygon points="50,146 58,142 58,150" fill="currentColor"/><text x="135" y="140" font-size="14" text-anchor="middle" fill="currentColor">きょり r = 2 m</text></svg>'
        explain: トルク（力のモーメント）は τ = r F sinθ。直角におすなら sinθ = 1 なので τ = r F。この図では 2 × 9 = 18 N·m。
