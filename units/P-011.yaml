ri:
  - part: 離
    kinds: [数, 道筋]
    text: 長さ 1.2 m、質量 3 kg の一様なぼうの上のはしを軸でとめ、水平にして静かにはなします。ぼうの先が真下に来たとき、ゆかの上の質量 1 kg の小さな玉にまっすぐ当たり、はね返り係数 1（エネルギーを失わない）でぶつかりました。玉はあらいゆか（動まさつ係数 0.2）をすべって止まります。玉がすべる道のりは何 m ですか。g = 10 m/s²、ぼうの軸まわりの慣性モーメントは M L²/3 とします。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="160" x2="300" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><line x1="80" y1="30" x2="200" y2="30" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="80" y1="30" x2="80" y2="150" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="80" cy="30" r="5" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="96" cy="150" r="8" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="110" y1="150" x2="140" y2="150" fill="none" stroke="#2f86d6" stroke-width="2"/><polygon points="150,150 140,155 140,145" fill="#2f86d6"/><text x="150" y="20" font-size="13" text-anchor="middle" fill="currentColor">水平から静かにはなす</text><text x="48" y="95" font-size="13" text-anchor="middle" fill="currentColor">ぼう 3 kg</text><text x="48" y="112" font-size="13" text-anchor="middle" fill="currentColor">1.2 m</text><text x="150" y="142" font-size="13" text-anchor="middle" fill="currentColor">玉 1 kg</text><text x="230" y="145" font-size="13" text-anchor="middle" fill="currentColor">あらいゆか 0.2</text></svg>'
    answer: "9"
    check: "f'{(lambda L, M, m, mu, g: (2 * (M * L**2 / 3) * (M * g * L / ((M * L**2 / 3))) ** 0.5 * L / ((M * L**2 / 3) + m * L**2)) ** 2 / (2 * mu * g))(1.2, 3, 1, 0.2, 10):.0f}'"
    hints:
      - 場面は 3 つです。ぼうがふれおりる、ぼうと玉がぶつかる、玉がゆかをすべる。ぶつかる直前のぼうの先の速さから考えます。
      - text: ぼうの位置エネルギーが回転のエネルギー 1/2 I ω² になります。ぼうは先に集まった重さではないので、ぶつかり合いでは「ぼうの先から見た重さ」を考えます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="160" x2="300" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><line x1="80" y1="30" x2="80" y2="150" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="80" cy="30" r="5" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><path d="M130 40 Q95 90 124.3 131.8" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="130,140 120.2,134.7 128.4,128.9" fill="currentColor"/><text x="215" y="90" font-size="14" text-anchor="middle" fill="currentColor">I / L² は</text><text x="215" y="110" font-size="14" text-anchor="middle" fill="currentColor">先から見た重さ</text><circle cx="80" cy="150" r="16" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - ぼうの先から見た重さ I / L² を出して、玉の 1 kg とくらべましょう。同じ重さどうしのエネルギーを失わないぶつかりでは、速さが入れかわります。
    paths:
      - [ぼうのエネルギー M g L / 2 = 1/2 I ω₀² から ω₀ = 5 rad/s, ぶつかる前後の角運動量とエネルギーの式を立てる, 玉の速さ v = 6 m/s, すべる道のり v² / (2 μ g) = 9 m]
      - [ぼうの先から見た重さは I / L² = 1 kg で玉と同じ, 同じ重さのエネルギーを失わないぶつかりで速さが入れかわる, 玉の速さはぼうの先の速さ ω₀ L = 6 m/s, 道のりは 36 / 4 = 9 m]
    note: 構造 S03 対称性（同じ重さで速さが入れかわる）、S19 置きかえ（ぼうを先の 1 点の重さにおきかえる）。種なし。エネルギー、ぶつかり、まさつの 3 段で、ぼうのおきかえに気づかないと式が重くなる。
  - part: 離
    kinds: [手数, 数, 道筋]
    text: なめらかなゆかの上に質量 4 kg の長い板があり、その上に質量 6 kg の円柱（中身がつまっている）がのっています。円柱は板の上をすべらずにころがります。板を水平に 30 N の力で引き続けると、円柱は板の上を後ろへずれていきます。円柱の中心が板に対して 2.4 m 後ろへずれるまでに、板はゆかに対して何 m 進みますか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="175" x2="310" y2="175" fill="none" stroke="currentColor" stroke-width="2"/><rect x="40" y="140" width="220" height="15" fill="#c9a36b" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="163" r="8" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="120" cy="163" r="8" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="190" cy="163" r="8" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="110" cy="110" r="30" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="110" y1="110" x2="135" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><line x1="260" y1="148" x2="295" y2="148" fill="none" stroke="#e0555a" stroke-width="3"/><polygon points="305,148 295,153 295,143" fill="#e0555a"/><text x="285" y="135" font-size="14" text-anchor="middle" fill="#e0555a">30 N</text><text x="190" y="100" font-size="13" text-anchor="middle" fill="currentColor">円柱 6 kg</text><text x="150" y="195" font-size="13" text-anchor="middle" fill="currentColor">板 4 kg</text></svg>'
    answer: "3.6"
    check: "f'{(lambda F, M, m, d: (lambda A: A * (2 * d / (2 * A / 3)) / 2)(F / (M + m / 3)))(30, 4, 6, 2.4):.1f}'"
    hints:
      - 円柱の下の点は、いつも板と同じ速さで動きます。円柱の中心と板の動きの関係を、回転も入れて考えます。
      - text: 円柱にはたらく横向きの力は板からのまさつ力だけです。この力が、中心を進ませる役と、まわす役の両方をします。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="100" r="36" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="110" y1="100" x2="146" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><line x1="110" y1="136" x2="150" y2="136" fill="none" stroke="#e0555a" stroke-width="3"/><polygon points="160,136 150,141 150,131" fill="#e0555a"/><circle cx="110" cy="136" r="12" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="180" y="142" font-size="14" text-anchor="middle" fill="#e0555a">まさつ力 f</text><line x1="110" y1="100" x2="110" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="110,100 110,100 110,100" fill="currentColor"/></svg>'
      - 円柱の中心の加速度が板の何分の 1 になるかが決まれば、中心が板に対してずれる量は、板の進んだ道のりの何倍かが決まります。
    paths:
      - [板 F − f = M A、円柱 f = m a、まわる式 f R = 1/2 m R² α、すべらない A = a + R α, a = A / 3 と A = 5 m/s², ずれる加速度 A − a = 10/3 m/s², 2.4 = 1/2 × 10/3 × t² から t² = 1.44, 板の道のり 1/2 × 5 × 1.44 = 3.6 m]
      - [板の速さ V のとき円柱の中心は V/3、まわる速さは R ω = 2V/3 × 3 に注意して運動エネルギーの合計を出す, F × 道のり = 運動エネルギーの合計から A = 5 m/s², ずれは板の道のりの 2/3 倍だと分かる, 板の道のり 2.4 × 3/2 = 3.6 m]
    note: 構造 S19 置きかえ（ずれは板の進みの 2/3 で、力や質量によらない）、S25 式を立てる。種なし。力・質量の数は答えに効かない。力、まわる式、すべらない条件の 3 本をつなぐ手数が要る。
  - part: 離
    kinds: [数, 道筋]
    text: 長さ 3.6 m の一様なはしごを、なめらかなかべとなめらかなゆかに、ほぼ真っすぐ立てかけます。かすかにおすと、はしごの下のはしがかべから遠ざかる向きにすべり出し、あるところで上のはしがかべからはなれます。はなれる瞬間の、下のはしの速さは何 m/s ですか。g = 10 m/s²、はしごの重心まわりの慣性モーメントは M L²/12 とします。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="170" x2="310" y2="170" fill="none" stroke="currentColor" stroke-width="2"/><line x1="60" y1="20" x2="60" y2="170" fill="none" stroke="currentColor" stroke-width="4"/><line x1="60" y1="40" x2="60" y2="170" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><line x1="60" y1="76" x2="150" y2="170" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="105" cy="123" r="5" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="150" y1="185" x2="180" y2="185" fill="none" stroke="#2f86d6" stroke-width="2"/><polygon points="190,185 180,190 180,180" fill="#2f86d6"/><text x="210" y="190" font-size="13" text-anchor="middle" fill="currentColor">下のはしがすべる</text><text x="160" y="120" font-size="13" text-anchor="middle" fill="currentColor">はしご 3.6 m</text><text x="30" y="100" font-size="13" text-anchor="middle" fill="currentColor">かべ</text></svg>'
    answer: "4"
    check: "f'{(lambda L, g: (2 / 3) * (g * L) ** 0.5)(3.6, 10):.0f}'"
    hints:
      - 上のはしがかべにふれているあいだ、かべは重心を横におし続けます。かべからはなれるのは、そのおす力がゼロになるときです。
      - text: かべにふれているあいだは、はしごの重心は、かべの下のかどを中心とする半径 L/2 の円の上を動きます。はなれたあとは、かべは力をおよぼせません。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="20" x2="60" y2="170" fill="none" stroke="currentColor" stroke-width="4"/><line x1="10" y1="170" x2="310" y2="170" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 60 40 A 65 65 0 0 1 125 105" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><line x1="60" y1="76" x2="150" y2="170" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="105" cy="123" r="5" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="105" cy="123" r="14" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - 角度 θ（真上からの）をとり、重心の横の速さを θ で表して、その大きさがいちばん大きくなる θ をさがしましょう。そのあと下のはしの速さを出します。
    paths:
      - [エネルギーから ω² = 3 g (1 − cos θ) / L, 重心の横向きの加速度が 0 になる条件, cos θ = 2/3, 下のはしの速さ L ω cos θ = 2/3 × 6 = 4 m/s]
      - [かべがおすあいだ重心の横の速さはふえ続ける, はなれる瞬間に横の速さが最大, 重心の横の速さ ∝ cos θ √(1 − cos θ) が最大になるのは cos θ = 2/3, ω² = g / L = 1 / 0.36 × 10 より下のはしの速さ 4 m/s]
    note: 構造 S07 極はしなもの（横の速さの最大で力がゼロ）、S19 置きかえ（瞬間回転中心まわりの回転）。種なし。エネルギーを回転中心で考える段と、はなれる条件を見つける段の 2 段。
