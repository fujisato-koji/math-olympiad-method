  - day: 6
    items:
      - part: わけ
        text: 回転の式は、直線の式と同じ形です。直線では「質量 m が小さいほど、同じ力で加速しやすい」、回転では「慣性モーメント I が小さいほど、同じトルクで速くまわせる」。質量も半径も同じ、輪・円板・球の 3 つを、同じ高さのしゃめんからすべらずに転がします。輪は I = M × R × R、円板は I = 1/2 × M × R × R、球は I = 2/5 × M × R × R です。いちばん先に下に着くのはどれですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="14" width="140" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="90" y="31.9" font-size="14" text-anchor="middle" fill="currentColor">直線</text><rect x="160" y="14" width="140" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="230" y="31.9" font-size="14" text-anchor="middle" fill="currentColor">回転</text><rect x="20" y="40" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="90" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">質量 m</text><rect x="160" y="40" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">慣性モーメント I</text><rect x="20" y="66" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="90" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">加速度 a</text><rect x="160" y="66" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">角加速度 α</text><rect x="20" y="92" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="90" y="109.9" font-size="14" text-anchor="middle" fill="currentColor">力 F</text><rect x="160" y="92" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230" y="109.9" font-size="14" text-anchor="middle" fill="currentColor">トルク τ</text><rect x="20" y="118" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="90" y="135.9" font-size="14" text-anchor="middle" fill="currentColor">m a = F</text><rect x="160" y="118" width="140" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230" y="135.9" font-size="14" text-anchor="middle" fill="currentColor">I α = τ</text></svg>'
        choices: [輪, 円板, 球]
        answer: 球
        check: "'球'"
        explain: 転がり下りるとき、位置エネルギーの減った分が、進む運動エネルギーと回転の運動エネルギーに分かれる。I が小さい（質量が中心に集まっている）ほど、回転に回るエネルギーが少なく、進む分が多くなるので速い。加速度は a = g sinθ ÷ (1 + I ÷ (M R²))。輪 1/2、円板 2/3、球 5/7 の順に大きくなり、質量と半径にはよらない。
        hints:
          - 同じ高さから下りるので、減る位置エネルギーは同じです。
          - text: そのエネルギーは、進む分と回る分に分かれます。回る分が少ないほど、進む分が多くなります。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="20" width="90" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><rect x="130" y="20" width="50" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="155" y="39.9" font-size="14" text-anchor="middle" fill="currentColor">輪</text><rect x="180" y="20" width="60" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="210" y="39.9" font-size="14" text-anchor="middle" fill="currentColor">円板</text><rect x="240" y="20" width="50" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="265" y="39.9" font-size="14" text-anchor="middle" fill="currentColor">球</text><rect x="40" y="50" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="85" y="69.9" font-size="14" text-anchor="middle" fill="currentColor">I ÷ (M R R)</text><rect x="130" y="50" width="50" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="155" y="69.9" font-size="14" text-anchor="middle" fill="currentColor">1</text><rect x="180" y="50" width="60" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="210" y="69.9" font-size="14" text-anchor="middle" fill="currentColor">1/2</text><rect x="240" y="50" width="50" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="265" y="69.9" font-size="14" text-anchor="middle" fill="currentColor">2/5</text></svg>'
          - I ÷ (M × R × R) がいちばん小さいものが、回る分がいちばん少ないものです。
        paths:
          - [エネルギーで下での速さを比べる, M g h = 1/2 M v v + 1/2 I ω ω, ω = v ÷ R を入れて v v を出す, v が大きいほど先に着く]
          - [加速度で比べる, a = g × かたむき ÷ (1 + I ÷ (M R R)), 3 つの a を出す, a が大きいほど先に着く]
