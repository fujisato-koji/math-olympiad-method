    - 2025 は 2 でわり切れないね。こ数がわり切れないときはこ数が、わり切れるときは組の数が、2025 の約数になるよ。2025 の約数はいくつあるかな。
    - はじめの数が 1 いじょうになるか、約数ごとにたしかめよう。こ数が多すぎると、はじめの数が 0 いかになってしまうね。
    paths:
    - - こ数が 2 でわり切れないとき、和は真ん中の数 × こ数なので、こ数は 2025 の約数
      - 2025 = 3⁴ × 5² の約数は 5 × 3 = 15 こ。1 をのぞき、はじめの数が 1 いじょうになる、つまり真ん中の数がこ数 + 1 の半分いじょうになるのは、こ数が 3、5、9、15、25、27、45 の 7 通り
      - こ数が 2 でわり切れるとき、両はしから 2 つずつ組にすると、組の和は 2 でわり切れない数で、組の和 × 組の数 = 2025
      - 組の和が組の数 × 2 + 1 いじょうになるのは、組の数が 1、3、5、9、15、25、27 の 7 通り
      - 7 + 7 = 14 通り
    - - 和を 2 倍すると、はじめの数と終わりの数の和 × こ数 = 4050
      - はじめと終わりの和 = はじめ × 2 + こ数 − 1 なので、こ数が 2 でわり切れるなら和はわり切れず、こ数がわり切れないなら和はわり切れる。かたほうだけが 2 でわり切れ、はじめと終わりの和のほうが大きい
      - 4050 = 2 × 2025 なので、2 でわり切れないほうは 2025 の約数。2025 の約数を 1 つえらぶと、それと 4050 をそれでわった数の組が 1 つ決まる
      - 組の小さいほうをこ数、大きいほうをはじめと終わりの和にすると、はじめの数は、大きいほうから小さいほうを引いて 1 を足し、2 でわった数で、1 いじょうの整数になり、表し方が 1 つ決まる
      - 2025 の約数は 15 こ。約数が 1 のときはこ数が 1 になるのでのぞく
      - 15 − 1 = 14 通り
    note: 工夫は 3 段：①和を「真ん中の数 × 個数」（2 倍して「両はしの和 × 個数」）に言いかえる、②2025 の約数と表し方を 1 対 1 に対応させる、③個数が 1 の場合と、はじめの数が 0 以下になる場合をのぞく。check は、個数 k（2〜63）とはじめの数 a（1〜2025）を全部調べ、和が 2025 になる組を数える（14 通り）。型は「偶奇と上限で候補を絞る」。2 本目の道筋の終わりの 3 段は、前は字下げがずれて 1 つの文になっていたので、2 本目にもどした。
