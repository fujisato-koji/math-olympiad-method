# N-024 約数の個数と和、階乗の素因数の個数（割り算のくり返し）
#
# 書き方は N-001 の頭の注、文の漢字は N-017 にそろえた（段 3。分かち書きはしない）。
# 前提は N-021（素因数分解）、C-005（積の法則）、A-009（累乗）。数は 100 まで（N-009 は前提にない）。
#   100 をこえる数（5! = 120、6! = 720 など）は文に書かず、素因数分解の形（2³ × 3 × 5）のままで使う。check の中では計算してよい。
# 約数は、素因数分解の素数ごとに「何こ使うか」を 1 つずつえらんでかけた数。素数が 2 つなら表（C-005 の表と同じ）、
#   3 つなら積の法則で数える。表の「1 行の数 × 行の数」は C-005 にならい「1 つ分 × いくつ分」の順に書く。
#   表は全角の数字と全角の空白で位をそろえる（N-007 の書き方）。2 けたの数も全角で書く（１８）。
# 約数の和は、表の行ごとの和が 1 行目の和の何倍かで出す（7 × 4）。かっこの式（N-076）と分ける計算のきまり（N-015）は
#   前提にないので、「2 行目の数はどれも 1 行目の 3 倍なので、2 行目の和も 3 倍」と言い、かっこは使わない。
# 表のますに同じ数が 2 回出ないことは、素因数分解が 1 通りであること（N-021 の主張）によるとして、わけには求めない。
# 階乗は「1 から 10 までの数をぜんぶかけた数を 10! と書き、10 の階乗と読む」とこの単元で決める
#   （並べ方の数としての階乗は C-006 で、前提にないので出さない）。
#   10! の 2 の個数は「2 の倍数の数 + 4 の倍数の数 + 8 の倍数の数」。倍数の数は N-017 のとおりわり算の商で数え、
#   商をまた 2 でわるくり返しで求める（10 ÷ 2 = 5、5 ÷ 2 = 2 あまり 1、2 ÷ 2 = 1）。ガウス記号（N-023）は前提にないので使わない。
#   末尾の 0 の数は、10 = 2 × 5 で、2 より 5 のほうが少ないことから 5 の個数で決める。
#   階乗の check は、1 から n までの数それぞれが 2（や 3、5）を何こもつかを数えてたす（くり返しのわり算とは別の道で確かめる）。
# 日の並び（既定）：1 日目 約数の個数、2 日目 約数の和、3 日目 わけ（個数と和）、
#   4 日目 混ぜる：頭の見本で階乗の素因数の個数を入れ、1〜3 日目と N-021・C-005・A-009 の型と混ぜる（階乗のわけを 1 問）、5 日目 確認。
#   3 つの中身に 5 日は少ないので、階乗には 1 日しかとれていない（地図の点に書いた）。

id: N-024
days:
  - day: 1
    items:
      - part: 見本
        text: 12 = 2² × 3 です。12 の約数は、ぜんぶで何こありますか。
        figure: "　｜１　２　４\n１｜１　２　４\n３｜３　６　１２"
        explain: 12 の約数は、2 のほうから 1、2、4（2 を 0 こ、1 こ、2 こ使う）のどれか 1 つと、3 のほうから 1、3（3 を 0 こ、1 こ使う）のどれか 1 つをえらんでかけた数です。表にすると、1 行に 3 こ、それが 2 行あるので、ますは 3 × 2 = 6 こ。12 の約数は 1、2、3、4、6、12 の 6 こです。3 は 2² の右上の 2 に 1 をたした数、2 は 3 の右上の 1（3 = 3¹）に 1 をたした数です。
      - part: 思い出す
        text: 50 を素因数分解したものはどれですか。
        choices: [2 × 5², 5 × 10, 2 × 25]
        answer: 2 × 5²
        check: "[s for s, f in (('2 × 5²', (2, 5, 5)), ('5 × 10', (5, 10)), ('2 × 25', (2, 25))) if math.prod(f) == 50 and all(all(p % d for d in range(2, p)) for p in f)][0]"
        hints:
          - 素因数分解は、素数だけのかけ算だね。
          - 10 と 25 は素数かな。
          - 50 = 5 × 10 から、さらに分けていこう。
        paths:
          - [50 = 5 × 10, 10 = 2 × 5, 2 × 5²]
      - part: 思い出す
        text: パンが 3 しゅるい、のみものが 5 しゅるいあります。パンとのみものを 1 つずつえらぶ組み合わせは、何通りですか。
        answer: 15
        check: "len(set(itertools.product(range(3), range(5))))"
        hints:
          - どのパンをえらんでも、のみもののえらび方は同じ数だね。
          - じゅけい図をかくと、1 つのパンから えだが何本出るかな。
          - 積の法則を使おう。
        paths:
          - [どのパンからも のみものが 5 通り, 5 × 3 = 15 通り]
      - part: 今日
        text: 75 = 3 × 5² です。75 の約数は、ぜんぶで何こありますか。
        answer: 6
        check: "len([d for d in range(1, 76) if 75 % d == 0])"
        hints:
          - 3 のほうから 1、3 の 2 通り、5 のほうからは何通りかな。
          - 表にすると、1 行に何こ、何行になるかな。
          - ますの数を、かけ算で求めよう。
        paths:
          - [3 のほうは 1、3 の 2 通り, 5 のほうは 1、5、25 の 3 通り, 3 × 2 = 6 こ]
      - part: 今日
        text: 48 = 2⁴ × 3 です。48 の約数は、ぜんぶで何こありますか。
        answer: 10
        check: "len([d for d in range(1, 49) if 48 % d == 0])"
        hints:
          - 2 のほうは、2 を 0 こから 4 こまで使えるね。何通りかな。
          - 3 のほうは、何通りかな。
          - ますの数を、かけ算で求めよう。
        paths:
          - [2 のほうは 1、2、4、8、16 の 5 通り, 3 のほうは 1、3 の 2 通り, 5 × 2 = 10 こ]
        note: 2⁴ の 4 をそのまま使って 4 × 2 = 8 としやすい。2 を 0 こ使う（1 をえらぶ）場合を入れる。
      - part: 今日
        text: 30 = 2 × 3 × 5 です。30 の約数は、ぜんぶで何こありますか。
        answer: 8
        check: "len([d for d in range(1, 31) if 30 % d == 0])"
        hints:
          - 素数が 3 つあるね。2 のほうは 1、2 の 2 通り。
          - 3 のほう、5 のほうは、それぞれ何通りかな。
          - 積の法則で、3 つの数をかけよう。
        paths:
          - [2 は 1、2 の 2 通り、3 は 1、3 の 2 通り、5 は 1、5 の 2 通り, 2 × 2 × 2 = 8 こ]
      - part: 挑戦
        text: 約数がちょうど 9 こある数のうち、いちばん小さいものはいくつですか。
        answer: 36
        check: "min(x for x in range(1, 101) if len([d for d in range(1, x + 1) if x % d == 0]) == 9)"
        hints:
          - 9 を、かけ算で表してみよう。
          - 9 = 3 × 3 なら、2 つの素数をそれぞれ何こずつ使えばよいかな。
          - 小さい素数を使ったほうが、小さい数になるよ。
        paths:
          - [9 = 3 × 3, 2 つの素数を 2 こずつ使う, 2² × 3² = 4 × 9 = 36, 1 つの素数を 8 こ使う 2⁸ は 100 より大きい, 36]
    extra:
      - part: 今日
        text: 40 = 2³ × 5 です。40 の約数は、ぜんぶで何こありますか。
        answer: 8
        check: "len([d for d in range(1, 41) if 40 % d == 0])"
        hints:
