        explain: 12 の約数は、2 のほうの 1、2、4（2 を 0 こ、1 こ、2 こ使う）から 1 つと、3 のほうの 1、3（3 を 0 こ、1 こ使う）から 1 つをえらんでかけた数です。表にすると、1 行に 3 こ、それが 2 行あるので、ますは 3 × 2 = 6 こ。12 の約数は 1、2、3、4、6、12 の 6 こです。3 は 2² の右上の 2 に 1 をたした数、2 は 3 の右上の 1（3 = 3¹）に 1 をたした数です。
