        paths:
          - [99 = 9 × 11 = 3² × 11, 3 のほうは 3 通り、11 のほうは 2 通り, 3 × 2 = 6 こ, 99]
        note: 1 つの素数を 5 こ使う形（2⁵ = 32）もあるが、2 けたでいちばん大きいのは 99。

