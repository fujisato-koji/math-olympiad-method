        explain: 書けるとよい文：「18 の約数は、2 のほうから 1 か 2、3 のほうから 1、3、9 のどれかをえらんでかけた数。表にすると 1 行に 3 こで 2 行なので、ますは 3 × 2 = 6 こ。どのますの数も、18 の素因数の一部をかけた数なので 18 をわり切る。反対に、18 の約数を素因数分解すると、2 は 1 こまで、3 は 2 こまでしか使われていないので、どれも表のどこかに出てくる。だから約数の数は、ますの数と同じ 6 こ。」と書ければよい。「表のますの数を数えた」だけで終わったら、「どのますも約数」と「どの約数も表にある」の 2 つを一言ずつたしてもらう。同じ数が 2 つのますに出ないことは、素因数分解が 1 通りであること（N-021 で学んだこと）によるので、ここでは書けなくてよい。
