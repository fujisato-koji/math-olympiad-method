      - はじめと終わりの和 = はじめ × 2 + 個数 − 1 なので、個数が偶数なら和は奇数、個数が奇数なら和は偶数。片方が奇数でもう片方が偶数で、はじめと終わりの和のほうが大きい
      - 4050 = 2 × 2025 なので、奇数のほうは 2025 の約数。2025 の約数を 1 つ選ぶと、それと 4050 をそれでわった数の組が 1 つ決まる
    - 組の小さいほうを個数、大きいほうをはじめと終わりの和にすると、はじめの数は、大きいほうから小さいほうを引いて 1 を足し、2 でわった数で、1 以上の整数になり、表し方が 1 つ決まる
      - 2025 の約数は 15 こ。約数が 1 のときは個数が 1 になるのでのぞく
      - 15 − 1 = 14 通り
    note: 工夫は 3 段：①和を「真ん中の数 × 個数」（2 倍して「両はしの和 × 個数」）に言いかえる、②2025 の約数と表し方を 1 対 1 に対応させる、③個数が 1 の場合と、はじめの数が 0 以下になる場合をのぞく。check は、個数 k（2〜63）とはじめの数 a（1〜2025）を全部調べ、和が 2025 になる組を数える（14 通り）。型は「偶奇と上限で候補を絞る」。
  - part: 離
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - N-017
    - N-021
    - C-005
    - A-009
    text: 1 から 100 までの番号がついたランプが 100 こならんでいて、はじめは全部消えています。k = 1、2、3、…、100 の順に、k 回目の作業をします。k が 2 でわり切れない数の回には、番号が k の倍数のランプのスイッチを切りかえます（ついていれば消え、消えていればつきます）。k が 2 でわり切れる数の回には、何もしません。100 回目が終わったとき、ついているランプは何こですか。わけも書きましょう。
    answer: 17
    check: sum(sum(1 for d in range(1, n + 1, 2) if n % d == 0) % 2 for n in range(1, 101))
    hints:
    - 番号 n のランプは、何回スイッチを切りかえられるだろう。それが何回のとき、さいごについているかな。
    - n のスイッチを切りかえる回は、n の約数のうち、どんな数だろう。2 でわり切れない約数だけに目をつけると、何が言えるかな。
    - 約数の数が 2 でわり切れないのは、どんなときかな。素因数分解の形か、約数を 2 つずつ組にする方法で考えよう。
    paths:
    - - 番号 n のランプは、k が n の約数で、しかも 2 でわり切れないときだけ切りかわる。切りかわる回数が 2 でわり切れない数なら、さいごについている（はじめは消えていて、1 回ごとに入れかわるから）
      - n を 2 でわれるだけわった数を N とすると、n は「2 をいくつかかけた数 × N」で、N は 2 でわり切れない。n の約数のうち 2 でわり切れないものは、N の約数だけ。だから切りかわる回数は N の約数の数
      - N を素因数分解すると、約数は、素数ごとに「何こ使うか」を 1 つずつえらんでかけた数なので、約数の数は「（その素数の こ数 + 1）を素数ごとにかけた数」になる（たとえば 3² × 5 なら 3 × 2 = 6 こ）。このかけ算の答えが 2 でわり切れない数になるのは、どの「こ数 + 1」も 2 でわり切れないとき、つまり、どの素数も 2 でわり切れるこ数（2 こ、4 こ、…）ずつ入っているときだけ
      - どの素数も 2 でわり切れるこ数ずつ入っているということは、N は同じ数を 2 回かけた数（平方数）ということ。ぎゃくに N が平方数なら、どの素数のこ数も 2 でわり切れる。だから、ランプがさいごにつくのは、N が平方数のときだけ
      - n の中の 2 のこ数が 2 でわり切れるなら、n も平方数で、1、4、9、16、25、36、49、64、81、100 の 10 こ。2 のこ数が 2 でわり切れないなら、n は平方数の 2 倍で、2、8、18、32、50、72、98 の 7 こ。2 のこ数が 2 でわり切れるかどうかで分かれるので、この 2 つに同じ数はない。10 + 7 = 17 こ
    - - 番号 n のランプが切りかわる回は、n の約数のうち 2 でわり切れないもの。n を 2 でわれるだけわった数を N とすると、これは N の約数と同じ。切りかわる回数が 2 でわり切れない数なら、さいごについている
      - N の約数 d を、N ÷ d と組にする。d と N ÷ d はどちらも N の約数。d と N ÷ d が同じ数になるのは d × d = N のときだけ。そのほかは、約数が 2 つずつ組になる
      - だから、N が平方数でないと、約数は全部 2 つずつの組になり、数は 2 でわり切れる。N が平方数なら、組にならない約数（N の平方根）が 1 つだけあるので、約数の数は 2 でわり切れない。ランプがさいごにつく ⇔ N が平方数
      - N は 2 でわり切れない数で、100 までの平方数は 1、9、25、49、81 の 5 つ。それぞれに 2 を何回かかけてできる 100 までの数 n が、ついているランプ。n から N がただ 1 つ決まるので、ちがう N から同じ n はできない
      - N = 1 は 1、2、4、8、16、32、64 の 7 こ。N = 9 は 9、18、36、72 の 4 こ。N = 25 は 25、50、100 の 3 こ。N = 49 は 49、98 の 2 こ。N = 81 は 81 の 1 こ。7 + 4 + 3 + 2 + 1 = 17 こ
    note: 考えどころは 3 つ：①番号 n のランプが切りかわる回数を、n の約数のうち 2 でわり切れないものの数と見る、②n を 2 でわれるだけわった数 N の約数の数が、2 でわり切れない数になるのは N が平方数のときだと見る、③n が平方数か平方数の 2 倍になることを使って、100 までを 10 + 7 = 17 こ（かさならない）と数える。2 本目は 1 本目とちがい、素因数分解で約数の数を数えるきまりを使わず、N の約数を d と N ÷ d の組にして「組にならないのは d × d = N のときだけ」と見る。数え方もちがい、「平方数と平方数の 2 倍」でなく、N ごとに 2 をかけた数を数える。check は、ランプごとに 2 でわり切れない約数の数を数え、それが 2 でわり切れないランプを 100 まで全部数える式。全部の回で切りかえる「ロッカーの問題」（答えは平方数の 10 こ）を少しかえた問題。2 でわり切れる回を休むと、平方数の 2 倍のランプもついて 17 こになる。10 こと答えてしまうのがわな。L-005 の円の電球とはちがう場面。
