        explain: 1 から 10 までのうち、2 の《倍数》（2、4、6、8、10）は、2 を 1 こずつもっています。10 ÷ 2 = 5 で 5 こ。そのうち 4 の倍数（4、8）は、2 をもう 1 こもっています。4 の倍数は、2 の倍数を小さいじゅんにならべた 2 番目、4 番目なので、5 ÷ 2 = 2 あまり 1 で 2 こ。さらに 8 の倍数（8）は、2 をもう 1 こもっています。2 ÷ 2 = 1 で 1 こ。図のブロックを横に 1 だんずつ数えると、5 + 2 + 1 = 8 こです。商をまた 2 でわることをくり返し、商をぜんぶたします。
