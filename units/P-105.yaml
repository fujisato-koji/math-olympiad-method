        text: 陽子が素粒子ではなく複合粒子であるわけを説明しましょう。
        explain: 「陽子は uud の 3 つのクォークがグルーオンで結びついたものです。クォークの電荷を足すと +1 になり、陽子の電荷と一致します。だから陽子は、それ以上分けられない素粒子ではなく、クォークの複合粒子です。」と書ければよい。① uud、② 電荷の和 +1、③ 複合粒子。子どもには、電荷の計算で確かめさせます。
