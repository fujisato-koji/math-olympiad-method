        explain: "でんしと ニュートリノは ものを つくる つぶ（フェルミオン）、こうしは ちからを つたえる つぶ（ボソン）です。\nこうしは でんか 0、しつりょう 0 で、ひかりの はやさで すすみます。\nニュートリノは でんか 0 なので でんじきりょくを うけず、よわい ちからでだけ はんのうします。そのため、ほとんどの ものを すどおりします。\n＋と−の いたの あいだでは、−の でんきの つぶは ＋の いたへ、＋の でんきの つぶは −の いたへ ひかれて まがります。でんか 0 の つぶは まっすぐ すすみます。"
        note: 電子 −1・スピン 1/2、ニュートリノ 0・1/2、光子 0・1・質量 0。板の間で曲がるのは電荷のある粒だけ。
