        explain: "はんのうしきを かいたら、まえあとで でんかと りゅうしすうを くらべます。\nれい 1：e⁻ + e⁺ → γ + γ。でんか −1 + 1 = 0 → 0。レプトンすう 1 − 1 = 0 → 0。バリオンすう 0 → 0。\nれい 2：n → p + e⁻ + ν̄。でんか 0 → +1 − 1 + 0 = 0。バリオンすう 1 → 1。レプトンすう 0 → 1 − 1 = 0。"
