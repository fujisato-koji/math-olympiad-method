  - day: 5
    items:
      - part: 見本
        text: |-
          反粒子：質量が同じで、電荷などが反対の粒子です。電子の反粒子は陽電子（e⁺）。
          粒子と反粒子が出会うと、対消滅して光子などになります。
          保存則：電荷、エネルギー、運動量、《バリオン数》、《レプトン数》は反応の前後で保存されます。
          ベータ崩壊：中性子 → 陽子 + 電子 + 反電子ニュートリノ。
        explain: |-
          【定義】バリオン数は、陽子や中性子などの粒子の数を、反粒子を −1 として数えた量です。
          【定義】レプトン数は、電子やニュートリノなどの軽い粒子の数を、反粒子を −1 として数えた量です。
          ベータ崩壊では、中性子（udd）が陽子（uud）に変わり、電子と反ニュートリノを出します。
          電荷：0 → +1 − 1 + 0 = 0。バリオン数：1 → 1。レプトン数：0 → 1 − 1 = 0。
          反粒子は、電荷の符号が反対です。
        note: 反粒子は電荷が反対。ベータ崩壊 n → p + e⁻ + ν̄_e。保存則を確かめる。
      - part: 思い出す
        text: 電子の反粒子はどれですか。
        choices: ["陽子", "陽電子", "中性子", "光子"]
        answer: "陽電子"
        check: "'陽電子'"
        hints:
          - 電子は −1 の電荷です。
          - 反粒子は +1 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [電子 −1, 反粒子 +1, 陽電子]
      - part: 今日
