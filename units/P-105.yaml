# P-105 素粒子の存在
#
# 段 5・水準 3・8 日。前提は P-104（原子核と放射線）と P-069（量子論の始まり）。
# 素粒子、電子・ニュートリノ・光子、陽子と中性子の複合構造、電荷とスピン、反粒子と保存則を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-105
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          物質をどんどん分けていくと、それ以上分けられない粒に着きます。これを素粒子といいます。
          現在の標準模型では、電子、ニュートリノ、光子、クォーク、グルーオンなどが素粒子です。
          陽子と中性子は素粒子ではなく、クォークが集まった複合粒子です。
          原子は原子核と電子、原子核は陽子と中性子からできています。
        explain: |-
          【モデル】電子は素粒子。陽子は uud、中性子は udd のクォーク複合体。
          光子は電磁気力を伝える素粒子。グルーオンは強い力を伝えます。
          すべての物質が同じ素粒子からできている、というのが素粒子の考え方です。
        note: 素粒子はそれ以上分けられない粒。陽子・中性子はクォークの複合粒子。
