  - day: 3
    items:
      - part: 見本
        id: "f066e878eb"
        text: "ようしと ちゅうせいしの 中の クォークは、u（アップ）と d（ダウン）の 2 しゅるいです。\nu の でんかは +2/3（＋の しるし 2 つ）、d の でんかは −1/3（−の しるし 1 つ）。しるし 1 つが 1/3 の でんきです。\nようしは uud：2/3 + 2/3 − 1/3 = +1。ちゅうせいしは udd：2/3 − 1/3 − 1/3 = 0。\nクォークは グルーオンで つながって いて、1 つだけを とり出す ことは できません。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="26" cy="26" r="15" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="26" y="31.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><circle cx="54" cy="26" r="8" stroke="currentColor" stroke-width="1.5" fill="#f08080" fill-opacity=".4"/><text x="54" y="30.7" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><circle cx="74" cy="26" r="8" stroke="currentColor" stroke-width="1.5" fill="#f08080" fill-opacity=".4"/><text x="74" y="30.7" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="90" y="31" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">= +2/3</text><circle cx="182" cy="26" r="15" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity=".6"/><text x="182" y="31.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">d</text><circle cx="210" cy="26" r="8" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity=".4"/><text x="210" y="30.7" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><text x="226" y="31" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">= −1/3</text><text x="160" y="58" font-size="13" text-anchor="middle" fill="currentColor">しるし 1 つ ＝ 1/3 のでんき</text><circle cx="82" cy="136" r="42" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity=".22"/><circle cx="64" cy="122.5" r="14" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="64" y="127.9" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><circle cx="100" cy="122.5" r="14" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="100" y="127.9" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><circle cx="82" cy="154.9" r="14" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity=".6"/><text x="82" y="160.3" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">d</text><text x="82" y="86" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">ようし p</text><text x="82" y="194" font-size="13" text-anchor="middle" fill="currentColor">+2/3 +2/3 −1/3 = +1</text><circle cx="238" cy="136" r="42" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity=".22"/><circle cx="220" cy="122.5" r="14" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="220" y="127.9" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><circle cx="256" cy="122.5" r="14" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity=".6"/><text x="256" y="127.9" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">d</text><circle cx="238" cy="154.9" r="14" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity=".6"/><text x="238" y="160.3" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">d</text><text x="238" y="86" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">ちゅうせいし n</text><text x="238" y="194" font-size="13" text-anchor="middle" fill="currentColor">+2/3 −1/3 −1/3 = 0</text></svg>'
        explain: "・クォークは 6 しゅるい（u、d、s、c、b、t）ありますが、ふだんの ものを つくるのは u と d です。\n・u の でんかは +2/3、d の でんかは −1/3。＋の しるしと−の しるしが 1 つずつ うちけしあうと かんがえると、たしざんが 目で 見て わかります。\n｜りゅうし｜クォーク｜でんかの けいさん｜\n｜ようし｜uud｜+2/3 + 2/3 − 1/3 = +1｜\n｜ちゅうせいし｜udd｜+2/3 − 1/3 − 1/3 = 0｜\n・ようしも ちゅうせいしも クォーク 3 こから なり、5 日目の《バリオンすう》は どちらも 1 です。"
        note: u = +2/3、d = −1/3。陽子 uud、中性子 udd。印（1/3 の電気）で数える。
