      - part: わけ
        id: "6aa6255bd5"
        text: 陽子の電荷が +1 になるわけを、クォークの電荷から説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="160" cy="100" rx="148" ry="64" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity=".2"/><circle cx="78" cy="82" r="20" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="78" y="88.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><text x="78" y="134" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+2/3</text><circle cx="160" cy="82" r="20" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity=".6"/><text x="160" y="88.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">d</text><text x="160" y="134" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">−1/3</text><circle cx="242" cy="82" r="20" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="242" y="88.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><text x="242" y="134" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+2/3</text><text x="160" y="26" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">陽子 p</text><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">電荷の合計は？</text></svg>'
        explain: 「陽子は uud の 3 つのクォークからできている。u の電荷は +2/3、d の電荷は −1/3。2/3 + 2/3 − 1/3 = 3/3 = +1。だから陽子の電荷は +1。」と書ければよい。① uud、② 電荷の値、③ 足して +1。子どもには、中性子の udd も確かめさせます。
        hints:
          - 陽子の中のクォークの種類と数を書き出しましょう。
          - text: 印で表すと、こうなります。
