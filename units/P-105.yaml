      - part: 見本
        id: "217d212a93"
        text: "はんりゅうしは、しつりょうが おなじで でんかが はんたいの りゅうしです。でんし e⁻ の はんりゅうしは ようでんし e⁺ です。ずでは はんりゅうしを てんせんの まるで かきます。\nりゅうしと はんりゅうしが 出あうと、りょうほうが きえて こうしに なります（ついしょうめつ）。\n《バリオンすう》は ようしと ちゅうせいしを 1、《レプトンすう》は でんしと ニュートリノを 1 と かぞえ、はんりゅうしは −1 と かぞえます。\nベータほうかい n → p + e⁻ + ν̄（ν̄ は はんでんしニュートリノ）では、でんか・バリオンすう・レプトンすうの ごうけいが、まえと あとで おなじです（ほぞんそく）。"
