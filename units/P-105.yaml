  - day: 4
    items:
      - part: 見本
        id: "ab71f0a2bb"
        text: |-
          スピンは、粒がもつ回転のような量で、1/2、1、3/2 … のとびとびの値をとります。
          スピンが半整数（1/2、3/2 …）の粒をフェルミオン、整数（0、1、2 …）の粒をボソンといいます。電子・クォーク・ニュートリノはスピン 1/2、光子・グルーオンはスピン 1 です。
          フェルミオンは《パウリの原理》にしたがい、同じ状態に 1 個までしか入れません。電子の入る 1 つのきどうには、上向きと下向きの席が 1 つずつあるので、2 個までです。
          ボソンは、同じ状態にいくつでも入れます。
