iddle" fill="currentColor">バリオンすう</text><text x="44" y="151.7" font-size="13" text-anchor="middle" fill="currentColor">レプトンすう</text><rect x="154" y="93" width="156" height="72" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="154" y1="129" x2="310" y2="129" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="206" y1="93" x2="206" y2="165" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="258" y1="93" x2="258" y2="165" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
