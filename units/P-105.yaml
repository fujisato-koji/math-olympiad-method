        explain: "フェルミオンは ものを つくる つぶ、ボソンは 力を つたえる つぶです（ヒッグスりゅうしのように スピン 0 の ボソンも あります）。\nでんしは スピン 1/2 なので むきが 上と 下の 2 とおり あり、1 つの きどうに 2 こまで 入ります（上むき 1 こ、下むき 1 こ）。\nこうしは スピン 1 で、おなじ じょうたいに たくさん 入れます。レーザーの ひかりは その れいです。"
        note: 半整数スピンはフェルミオン、整数スピンはボソン。フェルミオンはパウリの原理。図は「きどうの席」と「光子の状態」。
