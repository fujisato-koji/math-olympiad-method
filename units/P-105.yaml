        explain: "【ていぎ】バリオンすうは、ようしや ちゅうせいしなどの りゅうしの かずを、はんりゅうしを −1 として かぞえた りょうです。\n【ていぎ】レプトンすうは、でんしや ニュートリノなどの かるい りゅうしの かずを、はんりゅうしを −1 として かぞえた りょうです。\nベータほうかいでは、ちゅうせいし（udd）の d が 1 つ u に かわって ようし（uud）に なり、でんしと はんでんしニュートリノが 出ます。\nでんか：0 → +1 − 1 + 0 = 0。バリオンすう：1 → 1 + 0 + 0 = 1。レプトンすう：0 → 0 + 1 − 1 = 0。\nついしょうめつでは、2 つの つぶの しつりょうが まるごと ひかりの エネルギーに なります（E = mc²）。"
