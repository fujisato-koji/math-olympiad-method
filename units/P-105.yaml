        answer: "素粒子"
        check: "'素粒子'"
        hints:
          - 電子はこれ以上分けられないと考えられています。
          - ここまでの考えを、自分の言葉でまとめましょう。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [電子は分けられない, 素粒子]
      - part: 今日
        text: 陽子は素粒子ですか、複合粒子ですか。
