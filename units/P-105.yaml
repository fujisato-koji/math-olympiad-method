        answer: "複合粒子"
        check: "'複合粒子'"
        hints:
          - 陽子はクォークからできています。
          - ここまでの考えを、自分の言葉でまとめましょう。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [陽子はクォークから, 複合粒子]
      - part: 挑戦
        text: 電磁気力を伝える素粒子はどれですか。
        choices: ["光子", "電子", "ニュートリノ", "クォーク"]
        answer: "光子"
        check: "'光子'"
        hints:
          - 光の粒です。
          - 電磁気力を伝えます。
