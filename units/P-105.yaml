# P-105 素粒子の存在
#
# 水準 1・8 日。前提は P-104（原子核と放射線）と P-069（量子論の始まり）。
# 素粒子、電子・ニュートリノ・光子、陽子と中性子の複合構造、電荷とスピン、反粒子と保存則を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。用語の説明は《用語》で明示する（D-063）。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の決まり：電子 e⁻ は空色、陽子 p は赤、中性子 n ははいいろ、u クォークは黄、d クォークは緑、ニュートリノ ν はむらさきの丸。
#   光子 γ は波の線、グルーオンはばねの線、反粒子（e⁺、ν̄）は点線の丸。電荷は＋と−の板の間の曲がり方で見せる。
#   クォークの電荷は「印」で数える（u は＋の印 2 つ、d は−の印 1 つ、印 1 つが 1/3）。
# 前の段 5 の字にないことばは、電じ気力・ベータほうかい・きどう・ついしょうめつのように、かなをまぜて書く。

id: P-105
days:
  - day: 1
    items:
      - part: 見本
        id: "0b90c1d1fc"
        text: "ものを どんどん わけて いくと、それ いじょう わけられない つぶに つきます。これを そりゅうしと いいます。\nでんしや クォークは ものを つくる そりゅうし、こうし（ひかりの つぶ）や グルーオンは ちからを つたえる そりゅうしです。\nようし p と ちゅうせいし n は、クォークが 3 つ あつまって できた ふくごうりゅうしです。\nずは、げんし → げんしかく → ようしと、大きく して 中を 見て いった ところです。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="56" cy="95" r="42" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><circle cx="52" cy="91" r="4.5" stroke="currentColor" stroke-width="1" fill="#f08080" fill-opacity=".85"/><circle cx="60" cy="91" r="4.5" stroke="currentColor" stroke-width="1" fill="#c8ccd6" fill-opacity=".85"/><circle cx="52" cy="99" r="4.5" stroke="currentColor" stroke-width="1" fill="#c8ccd6" fill-opacity=".85"/><circle cx="60" cy="99" r="4.5" stroke="currentColor" stroke-width="1" fill="#f08080" fill-opacity=".85"/><circle cx="14" cy="95" r="7" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity=".6"/><circle cx="86" cy="65" r="7" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity=".6"/><line x1="62" y1="87" x2="146" y2="65" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="62" y1="103" x2="146" y2="125" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="160" cy="83" r="14" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity=".6"/><text x="160" y="88.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">p</text><circle cx="184" cy="83" r="14" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity=".6"/><text x="184" y="88.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">n</text><circle cx="160" cy="107" r="14" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity=".6"/><text x="160" y="112.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">n</text><circle cx="184" cy="107" r="14" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity=".6"/><text x="184" y="112.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">p</text><line x1="194" y1="99" x2="244" y2="63" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="194" y1="115" x2="244" y2="127" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="270" cy="95" r="40" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity=".22"/><circle cx="256" cy="84.5" r="10" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><circle cx="284" cy="84.5" r="10" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><circle cx="270" cy="109.7" r="10" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity=".6"/><text x="56" y="160" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">げんし</text><text x="172" y="160" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">げんしかく</text><text x="270" y="160" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">ようし p</text><text x="96" y="44" font-size="13" text-anchor="middle" fill="currentColor">でんし</text><text x="270" y="44" font-size="13" text-anchor="middle" fill="currentColor">クォーク</text><text x="160" y="190" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">でんしとクォークはそりゅうし</text></svg>'
        explain: "【モデル】げんしは げんしかくと でんし、げんしかくは ようしと ちゅうせいし、ようしと ちゅうせいしは それぞれ クォーク 3 こから できています。\nいまの ひょうじゅんもけいでは、でんし・ニュートリノ・クォーク（ものを つくる つぶ）と、こうし・グルーオン（ちからを つたえる つぶ）などが そりゅうしです。\nこうしは でんきや じしゃくの ちから（でんじきりょく）を、グルーオンは クォークどうしを つなぐ つよい ちからを つたえます。\nようしが uud、ちゅうせいしが udd である ことは、3 日目に クォークの でんかを 足して たしかめます。"
        note: 素粒子はそれ以上分けられない粒。陽子・中性子はクォークの複合粒子。図は原子→原子核→陽子と大きくした図。
