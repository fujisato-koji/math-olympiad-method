  - day: 2
    items:
      - part: 見本
        id: "3f06444a93"
        text: |-
          電子 e⁻：電荷 −1、スピン 1/2。質量はとても小さい（9.1 × 10⁻³¹ kg）。
          電子ニュートリノ ν：電荷 0、スピン 1/2。質量はもっと小さく、弱い力（ベータほうかいを起こす力）でだけ反応します。
          光子 γ：電荷 0、スピン 1、質量 0。いつも光の速さで進みます。
          スピンは、粒がもつ回転のような量です。図のように、電荷のある粒だけが＋と−の板の間で曲がります（−の粒は＋の板へ）。
