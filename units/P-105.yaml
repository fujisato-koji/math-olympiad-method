        explain: 「陽子を大きくして調べると、中に 3 つのクォークがあり、グルーオンでつながっています。小さい粒が集まってできているので、それ以上分けられない素粒子ではなく、複合粒子です。」と書ければよい。① 中にクォークが 3 つ、② 小さい粒が集まっている、③ 複合粒子。3 日目に、クォークの電荷を足すと陽子の電荷 +1 になることも確かめます。
