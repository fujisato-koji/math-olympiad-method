nt-size="13" text-anchor="middle" fill="currentColor">+1</text><text x="284" y="186.2" font-size="13" text-anchor="middle" fill="currentColor">−1</text></svg>'
        explain: |-
          【定義】バリオン数は、陽子や中性子などの粒子の数を、反粒子を −1 として数えた量です。
          【定義】レプトン数は、電子やニュートリノなどの軽い粒子の数を、反粒子を −1 として数えた量です。
          ベータほうかいでは、中性子（udd）の d が 1 つ u に変わって陽子（uud）になり、電子と反電子ニュートリノが出ます。
          電荷：0 → +1 − 1 + 0 = 0。バリオン数：1 → 1 + 0 + 0 = 1。レプトン数：0 → 0 + 1 − 1 = 0。
          ついしょうめつでは、2 つの粒の質量がまるごと光のエネルギーになります（E = mc²）。
        note: 反粒子は電荷が反対。ベータほうかい n → p + e⁻ + ν̄_e。保存則を表で確かめる。
