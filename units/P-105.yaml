      - part: 見本
        id: "217d212a93"
        text: |-
          反粒子は、質量が同じで電荷が反対の粒子です。電子 e⁻ の反粒子は陽電子 e⁺ です。図では反粒子を点線の丸でかきます。
          粒子と反粒子が出会うと、両方が消えて光子になります（ついしょうめつ）。
          《バリオン数》は陽子と中性子を 1、《レプトン数》は電子とニュートリノを 1 と数え、反粒子は −1 と数えます。
          ベータほうかい n → p + e⁻ + ν̄（ν̄ は反電子ニュートリノ）では、電荷・バリオン数・レプトン数の合計が、前と後で同じです（保存則）。
