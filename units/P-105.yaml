  - day: 4
    items:
      - part: 見本
        text: |-
          スピンは、粒子の回転のような量です。値は 1/2、1、3/2、… のとびとびの値です。
          スピンが半整数（1/2、3/2、…）の粒子をフェルミオン、整数（0、1、2、…）をボソンといいます。
          電子、クォーク、ニュートリノはスピン 1/2 のフェルミオン。光子、グルーオンはスピン 1 のボソン。
          フェルミオンはパウリの原理に従い、同じ状態に 1 個まで。ボソンは何個でも同じ状態に入れます。
        explain: |-
          フェルミオンは物質の粒、ボソンは力を伝える粒です。
          電子はスピン 1/2 なので、1 つの軌道に 2 個まで（上向きと下向き）。
          光子はスピン 1 なので、同じ状態にたくさん入れます。レーザーの光はその例です。
        note: 半整数スピンはフェルミオン、整数スピンはボソン。フェルミオンはパウリの原理。
      - part: 思い出す
        text: スピン 1/2 の粒子はフェルミオンですか、ボソンですか。
        choices: ["フェルミオン", "ボソン", "どちらでもない", "光子"]
        answer: "フェルミオン"
