        explain: |-
          電子とニュートリノは物を作る粒（フェルミオン）、光子は力を伝える粒（ボソン）です。
          光子は電荷 0、質量 0 で、光の速さで進みます。
          ニュートリノは電荷 0 なので電じ気力を受けず、弱い力でだけ反応します。そのため、ほとんどの物を素通りします。
          ＋と−の板の間では、−の電気の粒は＋の板へ、＋の電気の粒は−の板へ引かれて曲がります。電荷 0 の粒はまっすぐ進みます。
        note: 電子 −1・スピン 1/2、ニュートリノ 0・1/2、光子 0・1・質量 0。板の間で曲がるのは電荷のある粒だけ。
