        text: "でんし e⁻：でんか −1、スピン 1/2。しつりょうは とても 小さい（9.1 × 10⁻³¹ kg）。\nでんしニュートリノ ν：でんか 0、スピン 1/2。しつりょうは もっと 小さく、よわい ちから（ベータほうかいを おこす ちから）でだけ はんのうします。\nこうし γ：でんか 0、スピン 1、しつりょう 0。いつも ひかりの はやさで すすみます。\nスピンは、つぶが もつ かいてんの ような りょうです。ずの ように、でんかの ある つぶだけが ＋と−の いたの あいだで まがります（−の つぶは ＋の いたへ）。"
