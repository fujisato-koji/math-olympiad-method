      - part: わけ
        id: "6aa6255bd5"
        text: ようしの でんかが +1 に なる わけを、クォークの でんかから せつめいしましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="160" cy="100" rx="148" ry="64" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity=".2"/><circle cx="78" cy="82" r="20" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="78" y="88.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><text x="78" y="134" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+2/3</text><circle cx="160" cy="82" r="20" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity=".6"/><text x="160" y="88.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">d</text><text x="160" y="134" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">−1/3</text><circle cx="242" cy="82" r="20" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".6"/><text x="242" y="88.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">u</text><text x="242" y="134" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+2/3</text><text x="160" y="26" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">ようし p</text><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">でんかのごうけいは？</text></svg>'
        explain: 「ようしは uud の 3 つの クォークから できている。u の でんかは +2/3、d の でんかは −1/3。2/3 + 2/3 − 1/3 = 3/3 = +1。だから ようしの でんかは +1。」と かければ よい。① uud、② でんかの あたい、③ たして +1。子どもには、ちゅうせいしの udd も たしかめさせます。
        hints:
