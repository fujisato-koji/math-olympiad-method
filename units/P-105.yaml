          ・陽子は uud、中性子は udd。
          ｜粒子｜クォーク｜電荷の計算｜
          ｜陽子｜uud｜+2/3 + 2/3 − 1/3 = +1｜
          ｜中性子｜udd｜+2/3 − 1/3 − 1/3 = 0｜
          ・《バリオン数》は、陽子や中性子などの粒子の数を、反粒子を −1 として数えた量。
          ・クォークの数は 3 個で、バリオン数は 1。
        note: u = +2/3、d = −1/3。陽子 uud、中性子 udd。
