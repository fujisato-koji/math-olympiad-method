        explain: |-
          フェルミオンは物を作る粒、ボソンは力を伝える粒です（ヒッグス粒子のようにスピン 0 のボソンもあります）。
          電子はスピン 1/2 なので向きが上と下の 2 通りあり、1 つのきどうに 2 個まで入ります（上向き 1 個、下向き 1 個）。
          光子はスピン 1 で、同じ状態にたくさん入れます。レーザーの光はその例です。
        note: 半整数スピンはフェルミオン、整数スピンはボソン。フェルミオンはパウリの原理。図は「きどうの席」と「光子の状態」。
