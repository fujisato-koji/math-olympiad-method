  - day: 4
    items:
      - part: 見本
        id: "ab71f0a2bb"
        text: "スピンは、つぶが もつ かいてんのような りょうで、1/2、1、3/2 … の とびとびの あたいを とります。\nスピンが はんせいすう（1/2、3/2 …）の つぶを フェルミオン、せいすう（0、1、2 …）の つぶを ボソンと いいます。でんし・クォーク・ニュートリノは スピン 1/2、こうし・グルーオンは スピン 1 です。\nフェルミオンは 《パウリのげんり》に したがい、おなじ じょうたいに 1 こまでしか 入れません。でんしの 入る 1 つの きどうには、上むきと 下むきの せきが 1 つずつ あるので、2 こまでです。\nボソンは、おなじ じょうたいに いくつでも 入れます。"
