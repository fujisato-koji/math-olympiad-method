          - ＋の電気をもつ粒と、電気をもたない粒の名前を、見本の図で確かめましょう。
        paths:
          - [原子核の中に 2 種類の粒, ＋の粒は陽子, 電気のない粒は中性子, 陽子と中性子]
      - part: 今日
        id: "237651ec5f"
        text: 電子をどんなに大きくして調べても、中から小さい粒は見つかっていません。電子は素粒子ですか、複合粒子ですか。
