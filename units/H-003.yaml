        explain: |-
          こおり（こたい）では つぶが きちんと ならんで その ばで ふるえ、水（えきたい）では つぶが くっついた まま いれかわり ながら うごき、すいじょうき（きたい）では つぶが はなれて とびまわって います。あたためると つぶの うごきが はげしく なり、ならびが くずれて とけ、さらに あたためると つぶが とびだして すいじょうきに なります。まどの 中の つぶの かずが ちがうのは、おなじ 大きさの まどに 入る かずが ちがう（つぶの 間が ひろい）からで、つぶが へった わけでは ありません。
          びんに とじこめた 空気を あたためると、空気の つぶが はげしく うごいて まわりを つよく おすので、空気が ふくらみ、口に かぶせた 風船が ふくらみます。ふくろや 風船に とじこめた 空気も おなじで、ひやすと うごきが ゆっくりに なって しぼみます。水が こおりに なる ときは、つぶが すきまの ある ならび方を するので かさが すこし ふえますが、これは とくべつな れいなので ここでは あつかいません。
