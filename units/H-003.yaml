        text: |-
          つぶは、いつも うごいて います。つぶの そばの みじかい やじるしは、うごく むきです。
          水に 赤い 色水を そっと 1 てき たらすと、かきまぜなくても、色は すこしずつ ひろがって、水 ぜんたいに まざります。赤い まるは 色水の つぶです。
          あたたかい ほど、つぶは はげしく うごきます。やじるしが ながい ほど、はげしい うごきです（ながさは おなじ えの 中で くらべます）。
          においが はなれた ところまで とどくのも、においの つぶ（むらさきの まる）が 空気の 中を うごいて ひろがる からです。
