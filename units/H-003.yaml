          - おもさは、つぶ 1 つ 1 つの おもさを あわせた もの だよ。つぶの かずは、とかす まえと あとで かわったかな。
        paths:
          - [とけても さとうの つぶは なくならない, つぶの かずが かわらない, おもさも かわらない]
          - [水 50 g と さとう 10 g が コップの 中に ある, 50 + 10 = 60, 見えなくても おもさは 60 g]
        explain: |-
          「さとうは とけると、小さな つぶに なって 水の 中に ちらばる だけで、つぶは 1 つも なくならない。つぶ 1 つ 1 つに おもさが あるので、つぶの かずが かわらなければ、ぜんぶの おもさも かわらない。だから、50 g と 10 g を あわせた 60 g の まま。」と いえれば よい。
          ① とけても つぶは なくならない（見えない だけ）、② つぶの かずが かわらない、③ だから おもさも かわらない、の 3 つが 入れば よい。こおりが とけて 水に なる ときや、とじた ふくろの 空気が ふくらむ ときも、つぶの かずが かわらないので おもさは かわりません。えの はかりは、コップや おさらの おもさを のぞいた 中みの おもさを 出して います。はかりが あれば、さとうと 水を べつべつに はかって から とかし、あわせた おもさに なる ことを いっしょに たしかめると よい。
