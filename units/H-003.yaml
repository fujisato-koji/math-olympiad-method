# H-003 物は粒でできている
#
# 段 2・水準 2・6 日。物は目に見えないほど小さな粒が集まってできていること、とける（粒がばらばらに離れて水の粒の間に散らばる）、まざる（粒はいつも動いていて、温かいほど激しく動く）、ふくらむ（温めると粒が激しく動いてまわりを押す）、すがたが変わる（氷・水・水蒸気の粒の並び方と動き方）を粒の動きで説明し、とけても・すがたが変わっても・ふくらんでも粒の数は変わらないので重さは変わらないことを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。1 日目 粒ととける、2 日目 まざる（温かいほど速い）、3 日目 すがたが変わるとふくらむ、4 日目 わけ（重さは変わらない）、5 日目 混ぜる、6 日目 確認。
# 図の約束：点線でつないだ大きな丸（まど）は、うんと大きくして見たところ。水の粒は水色、さとうの粒は黄色、色水の粒は赤、空気の粒は灰色、においの粒は紫、しおの粒は白。
#   粒のそばの短い矢印は動く向き（長いほど激しい）。氷の粒は格子に並べ、水の粒はくっついたまま乱れて並べ、水蒸気の粒は離して描く。赤い矢印は「あたためる」、青い矢印は「ひやす」（H-002 と同じ）。はかりは数字の出るはかりで、入れ物の重さを除いた中身の重さを出す。
#   H-002 で「水の つぶ」と呼んだ水滴は、この単元では「水てき」と書き、「つぶ」は粒子だけに使う。
# 火や湯を使う場面には「おうちの ひとと いっしょに」を付けた。
# 腕だめし（離）は 2 問とも、絵を読む読み取り（kinds: 読み取り）。
# 密度は H-007、燃え方は H-004、もどる変化は H-062、形を変えても重さが同じことは H-064、熱と温度の詳しいことは P-042 で扱うので、ここでは問わない。
# 水が氷になるとかさが増えること（例外）は、ふくらむ問題には使わない。氷が水に浮くこと（W-100）も問わない。

id: H-003
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          水も さとうも、目に 見えない ほど 小さな つぶが たくさん あつまって できて います。
          まるい まどの 中は、うんと 大きく して 見た ところです。水色の まるは 水の つぶ、黄色の まるは さとうの つぶです。
          さとうを 水に 入れて かきまぜると、さとうの つぶが かたまりから 1 つずつ はなれて、水の つぶの 間に ちらばって いきます。これが「とける」です。
          つぶが ばらばらに なると 見えなく なりますが、さとうは なくなって いません。
