        explain: |-
          水の つぶも 色水の つぶも、いつも ばらばらの むきに うごいて いて、ぶつかり あいながら まざって いきます（かくさん）。だから かきまぜなくても、色の つぶは じわじわと 水 ぜんたいに ちらばります。においが へやに ひろがるのも、空気の 中で においの つぶが うごいて ちらばる からです。
          あたたかい ほど つぶの うごきは はげしく なるので、おゆの ほうが 早く まざります。コップの 水と おゆに 1 てきずつ 色水（しょくべにや えのぐ）を たらして、ひろがり方を くらべると よい（おゆは おうちの ひとと いっしょに）。
