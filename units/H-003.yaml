  - day: 3
    items:
      - part: 見本
        text: |-
          つぶは、あたためると はげしく うごき、ひやすと ゆっくり うごきます。
          こおりの つぶは、きちんと ならんで、その ばで ふるえて います。あたためると ならびが くずれ、くっついた まま うごきまわって、水に なります。
          もっと あたためると、つぶは ばらばらに とびだして、すいじょうきに なります。まどは どれも おなじ 大きさです。つぶの 間が ひろい ほど、まどに 入る つぶは すくなく 見えます（ほかの つぶは まどの そと）。
          すこし あたためた だけでも、つぶは はげしく うごいて、まわりを つよく おします。だから、びんに とじこめた 空気を あたためると、空気が ふくらんで、びんの 口に かぶせた 風船が ふくらみます。はいいろの まるは 空気の つぶです。
