        explain: |-
          ものは、目にも 虫めがねにも 見えない ほど 小さな つぶ（ほんとうは 分子や イオン）が あつまって できて います。さとうの かたまりは、さとうの つぶが ぎっしり あつまった ものです。水に 入れると、水に ふれた ところから つぶが 1 つずつ はなれて、水の つぶの 間に ちらばります。これが とける ことです。
          ちらばった つぶは 1 つ 1 つが 小さすぎて 見えないので、さとうは 見えなく なりますが、水の 中に のこって いて、なめると あまいです。とうめいな コップの 水に さとうを とかして、見えなく なっても あまい ことを いっしょに たしかめると よい。
      - part: 今日
        text: さとうが すっかり とけた 水を、まどで 大きく して 見ました。どの まどかな。
