# D-081 定積分の応用（断面積による体積、回転体の体積）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011、A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   導入の日と、新しいきまりが出る 2 日目・3 日目は、頭に見本を 1 つ置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：断面積による体積 V = ∫(a→b) S(x) dx（見本は正四角錐）、断面が正方形・長方形・三角形・半円・円の立体、断面積が一定なら 底面積 × 高さ（G-011）。
#   2 日目：x 軸のまわりの回転体 V = π∫(a→b) {f(x)}² dx（見本は y = √x、円錐、球、y = x(2 − x)、y = sin x、y = 1/x）。
#   3 日目：2 つの曲線の間を回す（π∫(a→b) [{f(x)}² − {g(x)}²] dx）、y 軸のまわりの回転（x を y の式で表して π∫(c→d) x² dy）、器に入った水の量。
#   4 日目：わけ（錐体の体積は (1/3) × 底面積 × 高さ、球の体積は (4/3)πr³、x までの体積 V(x) の導関数は断面積 S(x)）。
#   5 日目：G-011（角柱・円柱）、D-006（置換積分・部分積分）と混ぜる（円すい台、くりぬいた立体、交わる 2 つの円柱の共通部分、断面が正三角形の立体）。
#   6 日目：確認。
# 前提は D-006（積分の考え）と G-011（体積と表面積）。D-006 は同時に別の係が作っているので、地図の題と前提から次の中身とみなした：
#   原始関数と不定積分、∫ xⁿ dx（n ≠ −1）、∫ sin x dx、∫ cos x dx、定積分 ∫(a→b) f(x) dx = F(b) − F(a) とその性質、
#   面積（面積の関数 S(x) について S′(x) = f(x)、帯を 2 つの長方形ではさむわけ）、置換積分、部分積分。
#   たどりにある D-003（はさみうちの原理）、G-025（2 倍角の公式 sin²x = (1 − cos 2x)/2）、G-026（円の方程式）、G-019（三平方の定理）、
#   G-020（相似な図形の面積の比は相似比の 2 乗）、G-010（円の面積）も使う。
#   錐体と球の体積（G-052）はたどりにないので、角錐・円錐・球の体積の公式はこの単元で積分から導く（1 日目の見本で正四角錐、4 日目のわけで一般の形）。
#   空間図形（G-021）もたどりにないので、角錐・円錐・円すい台・球の形は、問題の文で「…を結んでできる立体」「…を回してできる立体」と言葉で決めて使う。
#   指数・対数（D-001）はたどりにないので、∫ 1/x dx（log）の出る体積は扱わない（y = 1/x を回す問題は ∫ 1/x² dx = −1/x で済む）。
#   回転の軸は x 軸と y 軸だけにした（ほかの直線のまわりの回転と、円柱の殻で切る方法（バウムクーヘン積分）は扱わない）。
#   x 軸の上と下にまたがる部分を回す問題は、離で 1 問だけにした。
# 書き方：定積分は「∫(a→b) f(x) dx」、回転体の体積は「π∫(a→b) {f(x)}² dx」と 1 行で書く（1 日目の見本で、教科書では a を ∫ の下、b を上に書くと教える）。
#   原始関数の差は paths で「[(1/3)x³](0→9)」と書く。比は「x : 9」と書かず「x/9」とした（YAML の「: 」をさけるため）。
#   π を含む体積は「体積は aπ です。a はいくつですか」と係数を打たせ、π² や √ を含む値は choices にした。
# 図は svg（D-040）。立体は、軸を横にねかせた見取り図（奥の辺と、断面の円の奥の半分は点線）か、xy 平面の図（回す曲線、塗った領域、断面の位置）で描いた。
#   答え（体積の値）は図に書かない。図の文字は、与えた長さ、断面の位置 x、曲線の式、点の名前だけにした。
# check：体積は、断面積 S(x) か {f(x)}² をシンプソンの公式で数値積分し（N = 200〜4000）、Fraction(…).limit_denominator(100) で分数にそろえる（区分求積で確かめる）。
#   choices の問題は、数値積分に math.pi をかけた値と、選択肢の値（math.pi、math.sqrt）が近いものを選び出す。深さや長さを求める問題は、整数の候補を総当たりする。
# 体積の積分は、物理の重心と慣性モーメント（P-005、P-011）、流体の圧力と浮力（P-013）、確率密度と期待値（S-041 の先）、
#   容器・部品・構造物の設計で体積や重さを見積もる計算（E の流れ）の入口になる（D-026）。

id: D-081
days:
  - day: 1
    items:
      - part: 見本
        text: 底面が 1 辺 6 の正方形で、高さが 9 の正四角錐の体積を、積分で求めてみましょう。正四角錐は、正方形の底面の 4 つの頂点と、底面の中心の真上にある 1 つの点（頂点）を結んでできる立体です。
        svg: |
          <svg viewBox="0 0 300 245" xmlns="http://www.w3.org/2000/svg">
            <polygon points="122.1,89.7 144.0,67.7 144.0,130.4 122.1,152.4" fill="#f3c969" fill-opacity=".35" stroke="currentColor" stroke-width="1.5"/>
            <polygon points="188.6,73.4 228.0,33.9 228.0,146.7 188.6,186.2" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="39.0" y1="110.0" x2="188.6" y2="73.4" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="39.0" y1="110.0" x2="228.0" y2="33.9" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="39.0" y1="110.0" x2="188.6" y2="186.2" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="39.0" y1="110.0" x2="228.0" y2="146.7" stroke="currentColor" fill="none" stroke-width="1.2" stroke-dasharray="5 4"/>
            <line x1="39.0" y1="110.0" x2="208.3" y2="110.0" stroke="currentColor" fill="none" stroke-width="1.2" stroke-dasharray="5 4"/>
            <line x1="208.3" y1="110.0" x2="264.7" y2="110.0" stroke="currentColor" fill="none" stroke-width="1.5"/>
