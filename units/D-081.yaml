            <text x="227.0" y="36.4" font-size="13" text-anchor="start"><tspan font-style="italic">y</tspan> = 2<tspan font-style="italic">x</tspan></text>
            <text x="160.5" y="164.4" font-size="13" text-anchor="start"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">x</tspan>²</text>
          </svg>
        explain: 2 つの線の交点は、x² = 2x から x = 0、2 で、0 ≦ x ≦ 2 では直線が放物線より上にあります。(1) x の位置で x 軸に垂直に切ると、断面は、外側の半径が 2x、内側の半径が x² の、穴のあいた円（円の輪）です。断面積は π(2x)² − π(x²)² なので、V = π∫(0→2) (4x² − x⁴) dx = π[(4/3)x³ − (1/5)x⁵](0→2) = π(32/3 − 32/5) = (64/15)π です。π∫(0→2) (2x − x²)² dx としてはいけません。半径の差を 2 乗しても、輪の面積にはならないからです。(2) y 軸のまわりに回すときは、y の位置で y 軸に垂直に切ります。0 ≦ y ≦ 4 で、直線の上の点は x = y/2、放物線の上の点は x = √y なので、断面は外側の半径 √y、内側の半径 y/2 の輪です。V = π∫(0→4) {(√y)² − (y/2)²} dy = π∫(0→4) {y − (1/4)y²} dy = π[(1/2)y² − (1/12)y³](0→4) = π(8 − 16/3) = (8/3)π です。y 軸のまわりの回転体は、曲線の式を x について解き、x を y の式で表して、V = π∫(c→d) x² dy で求めます。同じ部分でも、回す軸がちがうと体積はちがいます。
      - part: 思い出す
        text: 曲線 y = 2√x と x 軸、直線 x = 5 で囲まれた部分を、x 軸のまわりに 1 回転させてできる立体の体積は aπ です。a はいくつですか。
        answer: 50
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: (2 * math.sqrt(x)) ** 2, 0, 5, 200)).limit_denominator(100)"
        hints:
          - 体積は π∫(0→5) (2√x)² dx です。
          - (2√x)² = 4x です。
          - 4x を 0 から 5 まで積分しましょう。
        paths:
          - ["V = π∫(0→5) 4x dx = π[2x²](0→5)", a = 50]
      - part: 思い出す
        text: 放物線 y = x² と直線 y = x + 2 で囲まれた部分の面積はいくつですか。
        answer: 9/2
        accept: [4.5]
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: x + 2 - x * x, -1, 2, 200)).limit_denominator(100)"
        hints:
          - 交点の x 座標を、x² = x + 2 から求めましょう。
          - 交点の間では、直線と放物線のどちらが上にあるでしょう。
          - (上の式) − (下の式) を、交点から交点まで積分しましょう（D-006）。
        paths:
          - [x² − x − 2 = 0 から x = −1、2, "∫(−1→2) (x + 2 − x²) dx", "[(1/2)x² + 2x − (1/3)x³](−1→2) = 10/3 + 7/6", 9/2]
