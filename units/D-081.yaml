          - 輪の面積は (外側の円) − (内側の円) です。(外側の半径)² − (内側の半径)² のかっこを外すと、x⁴ が消えます。
        paths:
          - [x² + 1 = 3 − x² から x = ±1, 外側の半径 3 − x²、内側の半径 x² + 1, (3 − x²)² − (x² + 1)² = 8 − 8x², V = π∫(−1→1) (8 − 8x²) dx = π(16 − 16/3), a = 32/3]
        note: 半径の差 2 − 2x² を 2 乗して π∫(−1→1) (2 − 2x²)² dx とすると 64/15 になる。輪の面積は、外側の円の面積から内側の円の面積をひいたもの。
