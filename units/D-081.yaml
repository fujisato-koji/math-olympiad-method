        explain: 例：「h > 0 とする。x から x + h までのうすい部分の体積は V(x + h) − V(x) である。S(x) は増加するので、この部分は、底面積 S(x)、高さ h の柱体をふくみ、底面積 S(x + h)、高さ h の柱体にふくまれる（柱体の体積は底面積 × 高さ、G-011）。よって S(x)h ≦ V(x + h) − V(x) ≦ S(x + h)h で、h でわると S(x) ≦ {V(x + h) − V(x)}/h ≦ S(x + h) となる。h → 0 のとき S(x + h) → S(x)（S は連続）なので、はさみうちの原理（D-003）から {V(x + h) − V(x)}/h → S(x)。h < 0 のときも同じようにできるので、V′(x) = S(x) である。つまり V(x) は S(x) の原始関数の 1 つで、V(a) = 0 だから、定積分の定義（D-006）から ∫(a→b) S(x) dx = V(b) − V(a) = V(b) となり、x = a から x = b までの体積に等しい。」と書ければよい。①「〜とする」で h と V(x) を決める、② 体積の差を 2 つの柱体ではさむ不等式にして h でわる、③ 約束した事実（柱体の体積、はさみうちの原理、導関数の定義、定積分は原始関数の差）で結ぶ、の 3 つ（とまとめ）がそろっているかを見る。D-006 の面積の関数 S′(x) = f(x) のわけと同じすじ道で、長方形が柱体に、高さ f(x) が断面積 S(x) に変わっただけであることを話す。1 日目の見本の「うすい板を集める」見方を、式で確かめたことになる。
