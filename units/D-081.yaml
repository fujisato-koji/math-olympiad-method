      - 部分が x じくをまたぐところでは、断面はあなのない円で、半径は x じくからいちばん遠い点までの長さだね。
      - 部分が x じくの下だけにあるところでは、断面は輪だよ。2 つの曲線のどちらが x じくから遠いかを、x のはんいごとに調べよう。
    paths:
      - [交点は x = −2、1, −2 ≦ x ≦ −1 は x じくの下だけで、外側の半径 1 − x、内側の半径 x² − 1 の輪, "π∫(−2→−1) {(1 − x)² − (x² − 1)²} dx = (19/5)π", −1 ≦ x ≦ 0 は半径 1 − x の円で π∫(−1→0) (1 − x)² dx = (7/3)π, 0 ≦ x ≦ 1 は半径 1 − x² の円で π∫(0→1) (1 − x²)² dx = (8/15)π, 合計 (19/5 + 7/3 + 8/15)π = (20/3)π]
      - [外側の半径は、−2 ≦ x ≦ 0 では 1 − x、0 ≦ x ≦ 1 では 1 − x², あなは −2 ≦ x ≦ −1 だけで、半径 x² − 1, "π{∫(−2→0) (1 − x)² dx + ∫(0→1) (1 − x²)² dx − ∫(−2→−1) (x² − 1)² dx} = π(26/3 + 8/15 − 38/15)", (20/3)π]
    note: 上の曲線から下の曲線をひいて π∫(−2→1) {(1 − x²)² − (x − 1)²} dx とすると負の値（−27/5）になり、まちがいに気づける。x 軸をまたぐ部分は、上と下の重なった像のうち外側だけが残る。x = −1（放物線が x 軸と交わる）と x = 0（2 つの線が x 軸から同じ遠さになる）で区間を分けるのがすじ道で、3 つの積分を計算して足す手数も多い。
