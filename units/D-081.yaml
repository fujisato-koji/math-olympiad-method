        id: "aab78dab8a"
        text: 底面積が S、高さが h のかくすいやえんすい（すいたい）の体積は (1/3)Sh です。このわけを、断面積による体積の式を使って、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 300 221" xmlns="http://www.w3.org/2000/svg"><line x1="44.8" y1="106.8" x2="229.8" y2="37.5" stroke="currentColor" fill="none" stroke-width="2"/><line x1="44.8" y1="106.8" x2="229.8" y2="176.2" stroke="currentColor" fill="none" stroke-width="2"/><line x1="33.2" y1="106.8" x2="266.8" y2="106.8" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M266.8 106.8 L258.8 102.8 L258.8 110.8 Z" fill="currentColor"/><polyline points="229.8,176.2 230.7,176.0 231.6,175.6 232.5,174.9 233.4,173.8 234.2,172.5 235.1,170.9 235.9,169.0 236.7,166.9 237.5,164.5 238.2,161.9 238.9,159.0 239.6,155.9 240.2,152.6 240.8,149.1 241.3,145.4 241.8,141.5 242.2,137.5 242.6,133.4 242.9,129.1 243.2,124.8 243.4,120.4 243.5,115.9 243.6,111.4 243.6,106.8 243.6,102.3 243.5,97.8 243.4,93.3 243.2,88.9 242.9,84.5 242.6,80.3 242.2,76.2 241.8,72.2 241.3,68.3 240.8,64.6 240.2,61.1 239.6,57.8 238.9,54.7 238.2,51.8 237.5,49.2 236.7,46.8 235.9,44.6 235.1,42.8 234.2,41.2 233.4,39.8 232.5,38.8 231.6,38.1 230.7,37.6 229.8,37.5" stroke="currentColor" fill="none" stroke-width="1.8"/><polyline points="229.8,37.5 228.9,37.6 228.0,38.1 227.1,38.8 226.2,39.8 225.3,41.2 224.5,42.8 223.6,44.6 222.8,46.8 222.1,49.2 221.3,51.8 220.6,54.7 220.0,57.8 219.3,61.1 218.8,64.6 218.2,68.3 217.7,72.2 217.3,76.2 216.9,80.3 216.6,84.5 216.4,88.9 216.2,93.3 216.0,97.8 215.9,102.3 215.9,106.8 215.9,111.4 216.0,115.9 216.2,120.4 216.4,124.8 216.6,129.1 216.9,133.4 217.3,137.5 217.7,141.5 218.2,145.4 218.8,149.1 219.3,152.6 220.0,155.9 220.6,159.0 221.3,161.9 222.1,164.5 222.8,166.9 223.6,169.0 224.5,170.9 225.3,172.5 226.2,173.8 227.1,174.9 228.0,175.6 228.9,176.0 229.8,176.2" stroke="currentColor" fill="none" stroke-width="1.2" stroke-dasharray="4 3"/><ellipse cx="160.4" cy="106.8" rx="8.7" ry="43.3" fill="#f3c969" fill-opacity=".35" stroke="currentColor" stroke-width="1.5"/><text fill="currentColor" x="39.0" y="99.9" font-size="13" text-anchor="end">O</text><text fill="currentColor" x="160.4" y="178.5" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan></text><text fill="currentColor" x="229.8" y="193.5" font-size="13" text-anchor="middle"><tspan font-style="italic">h</tspan></text><text fill="currentColor" x="269.1" y="125.3" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan></text></svg>'
        explain: 例：「すいたいのちょう点を O とし、O を通り底面に垂直な直線を x じくにとって、底面が x = h の平面になるように置く。O から x の位置（0 ≦ x ≦ h）で x じくに垂直に切った断面は底面と相似で、相似比は x/h である。相似な図形の面積の比は相似比の 2 乗なので（G-020）、断面積は S(x) = S × (x/h)² = (S/h²)x² である。断面積による体積の式から、V = ∫(0→h) (S/h²)x² dx = (S/h²) × [(1/3)x³](0→h) = (S/h²) × (1/3)h³ = (1/3)Sh。底面の形によらずに成り立つので、かくすいでもえんすいでも体積は (1/3)Sh である。」と書ければよい。①「〜とする」でちょう点 O、x じく、底面積 S、高さ h を決める、② 断面積を x の式で表して積分を計算する、③ 約束した事実（相似な図形の面積の比、V = ∫ S(x) dx、定積分の計算）で結ぶ、の 3 つ（とまとめ）がそろっているかを見る。1 日目の見本（せいしかくすいで 108）のような例で確かめただけで終わっていたら、例ではすべてのすいたいを示せないことを話す。同じ底面と高さの柱体（体積 Sh）のちょうど 1/3 になることにもふれる。
        hints:
          - ちょう点を原点 O に、底面に垂直な直線を x じくにとりましょう。
          - text: 横から見た図です。O から x の位置の断面（赤）と底面（青）は相似です。相似比と、面積の比を考えましょう。
