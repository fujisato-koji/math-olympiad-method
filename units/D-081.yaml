          - sin²x のままでは原始関数がわかりません。2 倍角の公式 cos 2x = 1 − 2sin²x（G-025）で、sin²x を cos 2x の式に直しましょう。
          - cos 2x の原始関数は (1/2)sin 2x です。最後に π をかけるのをわすれずに。
        paths:
          - [V = π∫(0→π) sin²x dx, sin²x = (1 − cos 2x)/2, "π[(1/2)x − (1/4)sin 2x](0→π) = π × (π/2)", π²/2]
          - [0 ≦ x ≦ π では、sin²x と cos²x のグラフの下の面積は同じ, sin²x + cos²x = 1 なので、2 つの面積の和は π, ∫(0→π) sin²x dx = π/2, V = π × (π/2) = π²/2]
        note: 2π は sin x を 2 乗せずに積分した値（π × 2）、π/2 は π をかけわすれた値、π² は 2 倍角の公式で 1/2 を落とした値。sin²x はそのままでは原始関数がわからないので、2 倍角の公式（G-025）で 1 次の式に直す。
