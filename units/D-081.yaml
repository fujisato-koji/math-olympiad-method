          - 断面積 S(x) を −2 から 2 まで積分しましょう。
        paths:
          - [x の位置での円柱の断面の帯のはばは 2√(4 − x²), "S(x) = {2√(4 − x²)}² = 4(4 − x²)", V = ∫(−2→2) 4(4 − x²) dx = 4(16 − 16/3), V = 128/3]
          - [同じ x で、半径 2 の球の断面は、正方形にちょうど入る円, 円の面積は正方形の面積の π/4 倍で、どの x でも同じ比, 共通部分の体積 = 球の体積 × (4/π) = (32/3)π × (4/π), V = 128/3]
        note: 円柱の体積には π が出るのに、共通部分の体積には π が出ない。どの向きで切ると断面がやさしい形になるかを選ぶのが要点。断面が円になると思いこむと進めない。
