      - [上半分は y = 3 + √(4 − x²)、下半分は y = 3 − √(4 − x²), (3 + √(4 − x²))² − (3 − √(4 − x²))² = 12√(4 − x²), V = 12π∫(−2→2) √(4 − x²) dx, ∫(−2→2) √(4 − x²) dx は半径 2 の半円の面積で 2π, V = 24π²]
      - [V = 12π∫(−2→2) √(4 − x²) dx までは同じ, x = 2 sin θ とおくと dx = 2 cos θ dθ、θ は −π/2 から π/2, ∫ 4cos²θ dθ = ∫ 2(1 + cos 2θ) dθ = 2π, V = 12π × 2π = 24π²]
    note: 円の方程式（G-026）で輪の外側と内側の半径を出し、2 乗の差で √ が 1 つになることに気づき、その積分を半円の面積（G-010）と読みかえる。√(4 − x²) の積分は x = 2 sin θ の置換（D-006）でもできる。円の面積 4π に、中心が回ってえがく円周の長さ 6π をかけた値と等しい（パップス・ギュルダンの定理）ことにふれてよい。12π² は 4 分の 1 円の面積 π を使った値、24π は π を 1 つ落とした値。
