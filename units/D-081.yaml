    text: 下の面が 1 辺 7.5 cm の正方形、上の面が 1 辺 4.5 cm の正方形で、2 つの面は平行で、高さが 5 cm の立体があります。この立体は、せいしかくすいを底面に平行な平面で切り、ちょう点をふくむ側を取りのぞいたもの（せいしかくすいだい）です。体積は何 cm³ ですか。
