            <line x1="39.0" y1="202.2" x2="208.3" y2="202.2" stroke="currentColor" fill="none" stroke-width="1"/>
            <line x1="39.0" y1="196.6" x2="39.0" y2="207.8" stroke="currentColor" fill="none" stroke-width="1"/>
            <line x1="208.3" y1="196.6" x2="208.3" y2="207.8" stroke="currentColor" fill="none" stroke-width="1"/>
