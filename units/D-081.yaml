        explain: 例：「座標平面で、原点を中心とする半径 r の円の方程式は x² + y² = r²（G-026）で、その上半分は y = √(r² − x²)（−r ≦ x ≦ r）である。この半円と x 軸で囲まれた部分を x 軸のまわりに 1 回転させると、半径 r の球になる。x の位置の断面は半径 √(r² − x²) の円なので、V = π∫(−r→r) (r² − x²) dx = π[r²x − (1/3)x³](−r→r) = π{(r³ − (1/3)r³) − (−r³ + (1/3)r³)} = π × (4/3)r³。よって、半径 r の球の体積は (4/3)πr³ である。」と書ければよい。①「〜とする」で円の式と半円を決める、② 断面の半径の 2 乗 r² − x² を積分して式を変形する（下の端が −r なので符号に気をつける）、③ 約束した事実（円の方程式または三平方の定理、回転体の体積の式）で結ぶ、の 3 つ（と結論）がそろっているかを見る。r = 3 の例（36π、2 日目の予備）だけで終わっていたら、例ではすべての r を示せないことを話す。r² − x² は x を −x にしても同じ値なので、2π∫(0→r) (r² − x²) dx としてもよい。底面の半径 r、高さ 2r の円柱の体積 2πr³ の 2/3 になること（アルキメデスが見つけた）にも触れる。
        hints:
          - 円 x² + y² = r² の上半分を、y = … の形で書きましょう。
          - x の位置の断面の円の、半径の 2 乗はいくつでしょう。
          - −r から r まで積分します。下の端を代入するときの符号に気をつけましょう。
        paths:
          - [半円 y = √(r² − x²) を x 軸のまわりに回す, "V = π∫(−r→r) (r² − x²) dx", "π[r²x − (1/3)x³](−r→r) = (4/3)πr³"]
      - part: わけ
        text: 立体を x 軸に垂直な平面で切ったときの断面積を S(x) とし、平面 x = a から x の位置までの部分の体積を V(x) とします。S(x) が増加するとき、V′(x) = S(x) となることを、筋道を立てて書きましょう。また、そこから、x = a から x = b までの部分の体積が ∫(a→b) S(x) dx になるわけも書きましょう。
        explain: 例：「h > 0 とする。x から x + h までのうすい部分の体積は V(x + h) − V(x) である。S(x) は増加するので、この部分は、底面積 S(x)、高さ h の柱体をふくみ、底面積 S(x + h)、高さ h の柱体にふくまれる（柱体の体積は 底面積 × 高さ、G-011）。よって S(x)h ≦ V(x + h) − V(x) ≦ S(x + h)h で、h でわると S(x) ≦ {V(x + h) − V(x)}/h ≦ S(x + h) となる。h → 0 のとき S(x + h) → S(x)（S は連続）なので、はさみうちの原理（D-003）から {V(x + h) − V(x)}/h → S(x)。h < 0 のときも同じようにできるので、V′(x) = S(x) である。つまり V(x) は S(x) の原始関数の 1 つで、V(a) = 0 だから、定積分の定義（D-006）から ∫(a→b) S(x) dx = V(b) − V(a) = V(b) となり、x = a から x = b までの体積に等しい。」と書ければよい。①「〜とする」で h と V(x) を決める、② 体積の差を 2 つの柱体ではさむ不等式にして h でわる、③ 約束した事実（柱体の体積、はさみうちの原理、導関数の定義、定積分は原始関数の差）で結ぶ、の 3 つ（と結論）がそろっているかを見る。D-006 の面積の関数 S′(x) = f(x) のわけと同じ筋道で、長方形が柱体に、高さ f(x) が断面積 S(x) に変わっただけであることを話す。1 日目の見本の「うすい板を集める」見方を、式で確かめたことになる。
        hints:
          - x から x + h までのうすい部分の体積は、V(x + h) − V(x) です。
          - その部分を、底面積 S(x) と S(x + h)、高さ h の 2 つの柱体ではさみましょう。
          - h でわって h → 0 とし、はさみうちの原理を使いましょう。
        paths:
          - ["S(x)h ≦ V(x + h) − V(x) ≦ S(x + h)h", h でわって h → 0 とすると V′(x) = S(x), "V(a) = 0 なので V(b) = ∫(a→b) S(x) dx"]
