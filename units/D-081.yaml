        explain: ちょう点を原点 O に、O を通り底面に垂直な直線を x じくにとり、底面が x = 9 の平面になるように置きます。O から x の位置（0 ≦ x ≦ 9）で x じくに垂直な平面で切ると、断面は底面と相似な正方形で、相似比は x/9 です。断面の 1 辺は 6 × (x/9) = (2/3)x なので、断面積は S(x) = (4/9)x² です。立体を x じくに垂直に厚さ Δx のうすい板に切り分けると、x の位置の板は、底面積 S(x)、高さ Δx の角柱（G-011）とほぼ同じで、体積はおよそ S(x)Δx です。板を 0 から 9 まで集め、板を限りなくうすくすると、体積は V = ∫(0→9) S(x) dx になります（わけは 4 日目）。V = ∫(0→9) (4/9)x² dx = (4/9) × [(1/3)x³](0→9) = (4/9) × 243 = 108 です。いっぱんに、x じくに垂直な平面で切った断面積が S(x) の立体の、x = a から x = b までの部分の体積は、V = ∫(a→b) S(x) dx です。定積分は、∫ の右下に a、右上に b を小さく組みます。断面積がどこでも同じ S なら、V = ∫(a→b) S dx = S(b − a) で、角柱や円柱の「底面積 × 高さ」と同じです。108 は、同じ底面と高さの角柱の体積 36 × 9 = 324 の 1/3 になっています。
