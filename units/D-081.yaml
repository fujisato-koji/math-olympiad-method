        text: 半径 r の球の体積は、図のように球がちょうど入る、底面の半径が r、高さが 2r の円柱の体積の何倍ですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><path d="M80 30 L80 170 A70 14 0 0 0 220 170 L220 30" fill="#c8ccd6" fill-opacity="0.2" stroke="currentColor" stroke-width="2"/><path d="M80 170 A70 14 0 0 1 220 170" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/><ellipse cx="150.0" cy="30.0" rx="70.0" ry="14.0" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><circle cx="150.0" cy="100.0" r="70.0" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><path d="M80 100 A70 16 0 0 0 220 100" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M80 100 A70 16 0 0 1 220 100" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3"/><circle cx="150.0" cy="100.0" r="2.5" fill="currentColor" stroke="none"/><line x1="150.0" y1="100.0" x2="220.0" y2="100.0" stroke="#e06666" stroke-width="3.5" stroke-linecap="round"/><text x="185.0" y="94.0" font-size="15" text-anchor="middle" fill="currentColor"><tspan font-style="italic">r</tspan></text><line x1="238.0" y1="30.0" x2="238.0" y2="166.4" stroke="currentColor" stroke-width="1.3"/><polygon points="238.0,170.0 234.9,164.8 241.1,164.8" fill="currentColor" stroke="none" stroke-linejoin="round"/><polygon points="238.0,30.0 241.1,35.2 234.9,35.2" fill="currentColor" stroke="none" stroke-linejoin="round"/><text x="254.2" y="105.0" font-size="14" text-anchor="start" fill="currentColor">2<tspan font-style="italic">r</tspan></text></svg>'
        answer: 2/3
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: 1 - x * x, -1, 1, 200) / 2).limit_denominator(100)"
        hints:
          - text: 円柱の底面は半径 r の円、高さは 2r です。円柱の体積を r の式で表しましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><path d="M80 30 L80 170 A70 14 0 0 0 220 170 L220 30" fill="#c8ccd6" fill-opacity="0.2" stroke="currentColor" stroke-width="2"/><path d="M80 170 A70 14 0 0 1 220 170" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/><ellipse cx="150.0" cy="30.0" rx="70.0" ry="14.0" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="150.0" cy="30.0" r="2.5" fill="currentColor" stroke="none"/><line x1="150.0" y1="30.0" x2="220.0" y2="30.0" stroke="#e06666" stroke-width="3.5" stroke-linecap="round"/><text x="185.0" y="24.0" font-size="15" text-anchor="middle" fill="currentColor"><tspan font-style="italic">r</tspan></text><line x1="238.0" y1="30.0" x2="238.0" y2="166.4" stroke="currentColor" stroke-width="1.3"/><polygon points="238.0,170.0 234.9,164.8 241.1,164.8" fill="currentColor" stroke="none" stroke-linejoin="round"/><polygon points="238.0,30.0 241.1,35.2 234.9,35.2" fill="currentColor" stroke="none" stroke-linejoin="round"/><text x="254.2" y="105.0" font-size="14" text-anchor="start" fill="currentColor">2<tspan font-style="italic">r</tspan></text></svg>'
          - 球の体積は (4/3)πr³ です。
          - 球の体積 ÷ 円柱の体積を計算しましょう。r と π は約分できます。
        paths:
          - [円柱は πr² × 2r = 2πr³, (4/3)πr³ ÷ 2πr³ = 2/3]
          - [x の位置の断面積は、球 π(r² − x²) = 円柱 πr² − えんすい πx², 球 = 円柱 − 2 つのえんすい（えんすい 1 つは底面の半径 r、高さ r で、円柱の 1/6）, 球は円柱の 1 − 1/6 − 1/6 = 2/3]
        note: どんな r でも同じ比になる（アルキメデスが墓にきざませたと伝えられる関係）。同じ底面と高さの円錐は円柱の 1/3 なので、円錐・球・円柱の体積の比は 1：2：3。

