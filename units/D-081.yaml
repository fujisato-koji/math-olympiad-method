      - [上の面から x cm の位置の断面の 1 辺は 4.5 + 0.6x, V = ∫(0→5) (4.5 + 0.6x)² dx, t = 4.5 + 0.6x とおくと (1/0.6)∫(4.5→7.5) t² dt = (7.5³ − 4.5³)/1.8, (421.875 − 91.125)/1.8 = 183.75]
      - [大きいせいしかくすいから小さいせいしかくすいをひく, 辺の比 4.5/7.5 = 3/5 から、ちょう点までの高さは 7.5 cm と 12.5 cm, (1/3)(56.25 × 12.5 − 20.25 × 7.5) = (1/3)(703.125 − 151.875) = 183.75]
    note: 小数の 2 乗と 3 乗が続く計算。長さをすべて 2 倍すると 1 辺 15 と 9、高さ 10 になり、(10/3)(225 + 135 + 81) = 1470 を 8 でわれば 183.75 と《整数》で計算できる。上と下の面積の平均 × 高さ（191.25）としやすい。答えは小数でも《分数》でもよい。
