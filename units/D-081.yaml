          - [体積は (π/2)h² で、深さの 2 乗に比例する, 深さ 4 cm なら (π/2) × 16 = 8π cm³, 32π は 8π の 4 倍なので、深さは 2 倍の 8 cm]
        note: 体積は深さの 2 乗に比例する（深さが 2 倍なら体積は 4 倍）。円柱の容器（体積は深さに比例）とのちがいにふれる。

