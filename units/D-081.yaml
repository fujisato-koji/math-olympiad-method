        id: "ad2df840e5"
        text: 放物線 y = x² と直線 y = 2x で囲まれた部分を、(1) x じくのまわりに、(2) y じくのまわりに、1 回転させてできる立体の体積を、それぞれ求めてみましょう。切った断面は、あなのあいた円（輪）になります。青が外側の半径、赤が内側の半径です。
