        explain: 例：「xy 平面で、原点を中心とする半径 r の円の方程式は x² + y² = r²（G-026）で、その上半分は y = √(r² − x²)（−r ≦ x ≦ r）である。この半円と x じくで囲まれた部分を x じくのまわりに 1 回転させると、半径 r の球になる。x の位置の断面は半径 √(r² − x²) の円なので、V = π∫(−r→r) (r² − x²) dx = π[r²x − (1/3)x³](−r→r) = π{(r³ − (1/3)r³) − (−r³ + (1/3)r³)} = π × (4/3)r³。よって、半径 r の球の体積は (4/3)πr³ である。」と書ければよい。①「〜とする」で円の式と半円を決める、② 断面の半径の 2 乗 r² − x² を積分して式を変形する（x = −r を入れるので、マイナスに気をつける）、③ 約束した事実（円の方程式または三平方の定理、回転体の体積の式）で結ぶ、の 3 つ（とまとめ）がそろっているかを見る。r = 3 の例（36π、2 日目の予備）だけで終わっていたら、例ではすべての r を示せないことを話す。r² − x² は x を −x にしても同じ値なので、2π∫(0→r) (r² − x²) dx としてもよい。底面の半径 r、高さ 2r の円柱の体積 2πr³ の 2/3 になること（アルキメデスが見つけた）にもふれる。
        hints:
          - 円 x² + y² = r² の上半分を、y = … の形で書きましょう。
          - text: x の位置の断面の円の半径は赤い線分です。図の直角三角形で、半径の 2 乗を考えましょう。
