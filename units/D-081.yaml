    text: 下の面が 1 辺 7.5 cm の正方形、上の面が 1 辺 4.5 cm の正方形で、2 つの面は平行で、その間の距離（高さ）が 5 cm の立体があります。この立体は、正四角錐を底面に平行な平面で切り、頂点をふくむ側を取りのぞいたもの（正四角錐台）です。体積は何 cm³ ですか。
    answer: 735/4
    accept: [183.75]
    check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: (4.5 + 0.6 * x) ** 2, 0, 5, 200)).limit_denominator(100)"
    hints:
      - 上の面から x cm 下の位置で、面に平行に切った断面は正方形だよ。その 1 辺の長さは x の 1 次式になるね。
      - 5 cm 下がると 1 辺が 3 cm 長くなるから、1 cm あたりにどれだけ長くなるかな。
      - 断面積 S(x) を 0 から 5 まで積分しよう。小数のままがつらければ、長さを 2 倍した立体で計算してから 8 でわってもいいよ。
    paths:
