            <text x="35.3" y="104.4" font-size="13" text-anchor="end">O</text>
            <text x="266.6" y="125.1" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan></text>
            <text x="133.1" y="218.2" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan></text>
            <text x="208.3" y="218.2" font-size="13" text-anchor="middle">9</text>
            <text x="233.7" y="93.1" font-size="13" text-anchor="start">6</text>
          </svg>
        explain: 頂点を原点 O に、O を通り底面に垂直な直線を x 軸にとり、底面が x = 9 の平面になるように置きます。O から x の位置（0 ≦ x ≦ 9）で x 軸に垂直な平面で切ると、断面は底面と相似な正方形で、相似比は x/9 です。断面の 1 辺は 6 × (x/9) = (2/3)x なので、断面積は S(x) = (4/9)x² です。立体を x 軸に垂直に厚さ Δx のうすい板に切り分けると、x の位置の板は、底面積 S(x)、高さ Δx の角柱（G-011）とほぼ同じで、体積はおよそ S(x)Δx です。板を 0 から 9 まで集め、板を限りなくうすくすると、体積は V = ∫(0→9) S(x) dx になります（わけは 4 日目）。V = ∫(0→9) (4/9)x² dx = (4/9) × [(1/3)x³](0→9) = (4/9) × 243 = 108 です。一般に、x 軸に垂直な平面で切った断面積が S(x) の立体の、x = a から x = b までの部分の体積は、V = ∫(a→b) S(x) dx です。定積分は画面では「∫(a→b) S(x) dx」と 1 行で書きます（教科書では a を ∫ の下、b を上に書きます）。断面積がどこでも同じ S なら、V = ∫(a→b) S dx = S(b − a) で、角柱や円柱の「底面積 × 高さ」と同じです。108 は、同じ底面と高さの角柱の体積 36 × 9 = 324 の 1/3 になっています。
      - part: 思い出す
        text: 定積分 ∫(1→4) x² dx の値はいくつですか。
        answer: 21
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: x * x, 1, 4, 200)).limit_denominator(100)"
        hints:
          - x² の原始関数の 1 つは (1/3)x³ です（D-006）。
          - 上の端 4 での値から、下の端 1 での値をひきましょう。
          - 4³ と 1³ を計算しましょう。
        paths:
          - ["[(1/3)x³](1→4)", (1/3)(64 − 1), 63/3 = 21]
      - part: 思い出す
        text: 底面の半径が 4 cm、高さが 5 cm の円柱の体積は aπ cm³ です。a はいくつですか。
        answer: 80
        check: "4 * 4 * 5"
        hints:
          - 円柱の体積は 底面積 × 高さ です（G-011）。
          - 底面は半径 4 cm の円です。円の面積は 半径 × 半径 × π です。
          - 底面積に高さ 5 cm をかけましょう。
        paths:
          - [底面積は 4 × 4 × π = 16π, 16π × 5 = 80π, a = 80]
      - part: 今日
        text: ある立体を x 軸に垂直な平面で切ると、x の位置（0 ≦ x ≦ 8）の断面は、1 辺の長さが √x の正方形になります。この立体の体積はいくつですか。
        answer: 32
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: math.sqrt(x) ** 2, 0, 8, 200)).limit_denominator(100)"
        hints:
          - まず、x の位置の断面積 S(x) を x の式で表しましょう。
          - 1 辺が √x の正方形の面積は (√x)² です。
          - 体積は V = ∫(0→8) S(x) dx です。
        paths:
          - [S(x) = (√x)² = x, "V = ∫(0→8) x dx", "[(1/2)x²](0→8) = 32"]
        note: 断面の 1 辺の長さ √x をそのまま積分しないように。積分するのは断面積（面積）である。
      - part: 今日
        text: ある立体を x 軸に垂直な平面で切ると、x の位置（0 ≦ x ≦ 3）の断面は、直角をはさむ 2 辺の長さがどちらも 2x の直角二等辺三角形になります。この立体の体積はいくつですか。
        answer: 18
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: (2 * x) * (2 * x) / 2, 0, 3, 200)).limit_denominator(100)"
        hints:
          - 直角二等辺三角形の面積は、直角をはさむ 2 辺の積の半分です。
          - 断面積 S(x) を x の式で表しましょう。
          - S(x) を 0 から 3 まで積分しましょう。
        paths:
          - [S(x) = (1/2) × 2x × 2x = 2x², "V = ∫(0→3) 2x² dx", "[(2/3)x³](0→3) = 18"]
        note: 三角形の面積の 1/2 を忘れて S(x) = 4x² とすると 36 になる。
      - part: 挑戦
        text: 座標平面で、放物線 y = x(4 − x) と x 軸で囲まれた部分を底面とする立体があります。x の位置で x 軸に垂直な平面で切った断面は、底面の上の線分（点 (x, 0) から放物線までの線分）を直径とする半円です。この立体の体積は aπ です。a はいくつですか。
