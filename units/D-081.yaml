        text: 立体を x じくに垂直な平面で切ったときの断面積を S(x) とし、平面 x = a から x の位置までの部分の体積を V(x) とします。S(x) が増加するとき、V′(x) = S(x) となることを、すじ道を立てて書きましょう。また、そこから、x = a から x = b までの部分の体積が ∫(a→b) S(x) dx になるわけも書きましょう。
