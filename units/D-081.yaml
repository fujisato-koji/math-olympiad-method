        explain: 2 つの線の交点は、x² = 2x から x = 0、2 で、0 ≦ x ≦ 2 では直線が放物線より上にあります。(1) x の位置で x じくに垂直に切ると、断面は、外側の半径が 2x、内側の半径が x² の、あなのあいた円（円の輪）です。断面積は π(2x)² − π(x²)² なので、V = π∫(0→2) (4x² − x⁴) dx = π[(4/3)x³ − (1/5)x⁵](0→2) = π(32/3 − 32/5) = (64/15)π です。π∫(0→2) (2x − x²)² dx としてはいけません。半径の差を 2 乗しても、輪の面積にはならないからです。(2) y じくのまわりに回すときは、y の位置で y じくに垂直に切ります。0 ≦ y ≦ 4 で、直線の上の点は x = y/2、放物線の上の点は x = √y なので、断面は外側の半径 √y、内側の半径 y/2 の輪です。V = π∫(0→4) {(√y)² − (y/2)²} dy = π∫(0→4) {y − (1/4)y²} dy = π[(1/2)y² − (1/12)y³](0→4) = π(8 − 16/3) = (8/3)π です。y じくのまわりの回転体は、曲線の式を x について解き、x を y の式で表して、V = π∫(c→d) x² dy で求めます。同じ部分でも、回すじくがちがうと体積はちがいます。
