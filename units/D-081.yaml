        paths:
          - [直径 d の半円の面積は (1/2)π(d/2)² = (π/8)d², S(x) = (π/8)(16x² − 8x³ + x⁴), "V = (π/8)[(16/3)x³ − 2x⁴ + (1/5)x⁵](0→4)", (π/8)(1024/3 − 512 + 1024/5) = (π/8) × (512/15), a = 64/15]
          - [t = x − 2 とおくと d = 4 − t²（さゆうたいしょう）, S = (π/8)(4 − t²)² = (π/8)(16 − 8t² + t⁴), V = (π/8)∫(−2→2) (16 − 8t² + t⁴) dt = (π/8)(64 − 128/3 + 64/5), (π/8) × (512/15) から a = 64/15]
        note: 半径を d としてしまう（4 倍の 256/15 になる）、半円の 1/2 をわすれる（128/15 になる）まちがいが多い。底面は xy 平面の領域で、断面はその上にすい直に立つ。
