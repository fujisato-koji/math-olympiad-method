        explain: 例：「錐体の頂点を O とし、O を通り底面に垂直な直線を x 軸にとって、底面が x = h の平面になるように置く。O から x の位置（0 ≦ x ≦ h）で x 軸に垂直に切った断面は底面と相似で、相似比は x/h である。相似な図形の面積の比は相似比の 2 乗なので（G-020）、断面積は S(x) = S × (x/h)² = (S/h²)x² である。断面積による体積の式から、V = ∫(0→h) (S/h²)x² dx = (S/h²) × [(1/3)x³](0→h) = (S/h²) × (1/3)h³ = (1/3)Sh。底面の形によらずに成り立つので、角錐でも円錐でも体積は (1/3)Sh である。」と書ければよい。①「〜とする」で頂点 O、x 軸、底面積 S、高さ h を決める、② 断面積を x の式で表して積分を計算する、③ 約束した事実（相似な図形の面積の比、V = ∫ S(x) dx、定積分の計算）で結ぶ、の 3 つ（と結論）がそろっているかを見る。1 日目の見本（正四角錐で 108）のような例で確かめただけで終わっていたら、例ではすべての錐体を示せないことを話す。同じ底面と高さの柱体（体積 Sh）のちょうど 1/3 になることにも触れる。
        hints:
          - 頂点を原点 O に、底面に垂直な直線を x 軸にとりましょう。
          - O から x の位置の断面と底面は相似です。相似比と面積の比を考えましょう。
