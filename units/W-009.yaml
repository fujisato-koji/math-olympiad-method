    items:
    - part: 見本
      text: 地球の 歴史は、化石の ちがいで、古生代・中生代・新生代に 分けられます（ちしつ年代）。古生代は 三葉虫や 魚、中生代は きょうりゅうや アンモナイト、新生代は ナウマンゾウや 人の 時代です。魚の あとに、両生類、は虫類、ほにゅう類の じゅんに 出てきました。両生類は カエルの なかま、は虫類は トカゲの なかまです。図は 3 つの 時代の 長さを そろえて かいてあります。
