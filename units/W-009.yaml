      text: 地球が できたのは 約 46 億年前です。この 46 億年を 1 年の カレンダーに ちぢめると、地球が できたのが 1 月 1 日、いまが 12 月 31 日の 夜 12 時です。最初の 生き物は 3 月はじめ、きょうりゅうが いなくなったのは 12 月 26 日、人が 生まれたのは 12 月 31 日の 夜の おわりごろです。
