      text: ちしつ年代の さかい目（古生代と 中生代の さかい目など）は、地そうの 化石が ガラッと かわる ところに 引かれています。なぜ、化石が ガラッと かわる ところを、時代の さかい目に すると よいのでしょうか。わけを 話して みましょう。
