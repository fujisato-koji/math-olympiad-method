      text: ある 生き物の なかまが、地球から ぜんぶ いなくなる ことを、ぜつめつと いいます。みじかい 間に、たくさんの なかまが ぜつめつする ことを、大量ぜつめつと いいます。古生代の おわりには 三葉虫や フズリナが、中生代の おわりには きょうりゅうや アンモナイトが ぜつめつしました。フズリナは 古生代の 海に いた 小さな 生き物です。
