# W-009 地球の歴史と地質年代（生物の移り変わりと大量絶滅、地球の年齢）
#
# 水準 2・6 日（付け直しで 1 だったが、億と万の数の答えと、腕だめし 3 問の W-003 を使うので 2 にし、前提に W-003 を戻した、D-224）。地球が約 46 億年前にできたこと、億と万の長さ、地質年代（古生代・中生代・新生代）と生き物の移り変わり、大量絶滅（古生代の終わりと中生代の終わり）、化石が入れかわる所が時代の境になるわけ。
# 日の並び：1 導入（地球の年齢、46 億年を 1 年のカレンダーに、億と万）、2 練習（古生代・中生代・新生代と生き物の出てくる順）、3 練習（大量ぜつめつ、きょうりゅうと人）、4 わけ（化石が入れかわる所が時代の境になるわけ）、5 混ぜる、6 確認。
# 図の約束：カレンダーの図は左が 1 月、右が 12 月。時代の目盛りの図は左が古く右が新しい（5.4 億年前から いま まで、長さは年数に比例）。柱の図（地そうの重なり）は上が新しく下が古い。生き物の絵は単元の中で同じ描き方。
# 数のおぼえ：地球ができた約 46 億年前、最初の生き物約 38 億年前、古生代のはじまり約 5 億 4000 万年前、中生代のはじまり約 2 億 5000 万年前、新生代のはじまり（きょうりゅうがいなくなった）約 6600 万年前、人（ホモ・サピエンス）約 30 万年前。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain は保護者用。
