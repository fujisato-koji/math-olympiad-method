          同じ カードの くみ合わせでも、ならべる 順番が かわると、とおる 道が かわります。とちゅうに 石（入れない マス）が あると、先に どちらへ 動くかで、花に 着くか 石に ぶつかるかが 分かれます。
          順番を かんがえる ことが、手順を 書く ことの まん中です。かみで カードを 作って ならべかえ、ロボット役で ためすと、ちがいが 目で 見えます。
