# K-122 手順を書く
#
# 段 1・水準 1・4 日。ロボット役で道案内をし、命令（カード）を順に並べ、手順のまちがいを見つけて直す。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 前提は N-001（10 までの数）。マスもカードも 10 までにし、たし算はさせず、マスを 1 つずつ数えれば答えが出るようにした。
# 命令は、向きの決まった矢印のカードだけにした（↑ 上へ、↓ 下へ、→ 右へ、← 左へ 1 マス）。ロボットは向きをかえず、
#   横へはかにのように歩く。「右を向く」のようにロボットについて回る向きは、左右の取りちがえが多いので、ここでは扱わない。
#   ロボットは花を見ても自分では止まらず、カードが終わるまで動く。石のマスには入れない（入ればそこで止まる）。
# 図：マス目（5 × 3 まで）に、ロボット（四角い頭とアンテナ）、花（行き先）、石（入れないマス）を描き、カードは黄色の札に
#   矢印を描く。ヒントの図は、とちゅうまでの道を点線でかき、見たカードを囲む（赤は見るところ、緑はそこまで正しい）。
#   場面は家でできるもの：ゆかにテープでマスをかき、おうちの人がロボット役になる。たねをうえる手順の絵も使う。
# 日の並び：1 日目 導入（カードどおりに動くとどこに着くか、何まいいるか、石をよける道）、2 日目 練習（同じカードでも
#   順番で道が変わる、1 まい目に置くカード、ぬけたカード、たねをうえる順番）、3 日目 わけ（頭に見本を 1 つ置く。
#   まちがったカードを見つけてかえる・2 まいを入れかえる・まい数を直す。最初にずれた所を見つけるわけを口で言う）、
#   4 日目 確認（1〜3 日目を混ぜる）。腕だめしはカードの長い列の読み取りと、よけいなカードを 1 まいとる直し方。
# check：選ぶ問題は答えをそのまま書く。数の問題は、ロボット・花・石のマスの位置（左から何列目、上から何行目）の差で
#   書いた。答えは作るときにカードを 1 まいずつ動かして確かめ、ほかの選択肢では着かないことも確かめた。

