        explain: |-
          ロボット役は、カードを 1 まいずつ、書かれた とおりに 動きます。近道を したり、カードを ぬかしたりは しません。これが、コンピュータへの 命令（プログラム）の かんがえ方の 入口です。
          カードは 向きの 決まった 矢印で、↑ は いつも 上へ 1 マスです。ロボットは 向きを かえずに、よこへは かにの ように 歩きます。
          おうちでは、ゆかに テープで 3 × 5 の マスを かき、↑ の 方を まどの 方などと 決めて、おうちの 人が ロボット役に なり、子が カードを ならべて 動かすと わかりやすい（役を 入れかえても よい）。
        note: カード 1 まいで 1 マス。カードの とおりにしか 動かない。
