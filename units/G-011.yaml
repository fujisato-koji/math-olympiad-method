# G-011 体積と表面積
#
# 書き方は N-001 の頭の注のとおり。
# 体積は「1 辺が 1 cm の立方体（1 cm³）のいくつ分」。G-008 の面積（1 cm² のいくつ分）を立体に広げる。
# ことば：直方体、立方体、体積、cm³（立方センチメートル）、角柱、円柱、底面、側面、底面積、表面積。
#   角柱は「同じ形の 2 つの面（底面）が向かい合い、まわりが長方形の面（側面）でかこまれた立体」と言う。底面は下にあるとはかぎらない。
#   m³ は扱わない（1 m³ = 1000000 cm³ は N-073 が前提にないため）。容積と L の換算（1 L = 1000 cm³）も G-046 が前提にないので扱わない。
# 前提の計算は九九（N-013）と、何十 × 1 けた（20 × 3 は 2 × 3 = 6 の 10 こ分。G-009 の「何十 ÷ 1 けた」と同じ考え）、
#   2 けたの数を 2〜3 回たす計算（N-007）まで。かけ算の筆算（N-074）は前提にないので、体積は「たて × 横」を九九で出し、
#   その数 × 高さが上の計算でできる数にした。表面積は、3 種類の面の面積をたして 2 倍（同じ数を 2 回たす）。
# 円周率は G-010 と同じく、かける計算を最後まで残して「（□ × 円周率）cm³」の形で答える。
#   3.14 を使って数で答えるのは、3.14 を 2〜3 回たす形だけ（G-010 と同じ）。
# 角すい・円すい・球の体積は、前提の道具でわけを示せないので扱わない（G-010 の頭の注は球を G-011 としていたが入れていない）。
# 立体の切断は G-014。
# 図は svg（D-040）。見取り図は斜めから見た図で、見えない辺は点線。長さの比はおおよそ合わせた。
#   細い線で 1 cm ごとに区切った図は、1 cm³ の立方体を数える図。三角柱は、底面（直角三角形）を手前に向けて横にねかせた図にした。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 体積と cm³、直方体と立方体の体積　2 日目 底面積 × 高さ（角柱と円柱）、組み合わせた立体
#   3 日目 表面積（直方体、立方体、円柱）　4 日目 わけ（たて × 横 × 高さ、底面積 × 高さ、体積が同じでも表面積はちがう）
#   5 日目 G-007（展開図）・G-008（面積）・G-010（円）と混ぜる　6 日目 確認
# check：体積と表面積の式。「□ × 円周率」の問題は □ の数の式。3.14 を使う答えは 100 倍した整数で計算して 100 でわる。
#   展開図の向かい合う面は、G-007 と同じく展開図を転がして調べる式（直方体の展開図も、面のつながり方は立方体と同じ）。

