        explain: もののかさ（大きさ）を体積といいます。1 辺が 1 cm の立方体の体積を 1 cm³（1 立方センチメートル）といいます。この直方体は、1 だん目に横 3 こ、おくに 2 列で 3 × 2 = 6 こ。それが 2 だんあるので 6 × 2 = 12 こ。体積は 12 cm³ です。1 だんのこ数は たて × 横、だんの数は高さなので、直方体の体積 = たて × 横 × 高さ、立方体の体積 = 1 辺 × 1 辺 × 1 辺 で求められます（わけは 4 日目）。
