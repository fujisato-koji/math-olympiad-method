      - part: 挑戦
        text: 数直線の 10 にいるカエルが、右か左に 1 ずつ、ちょうど 6 回とんで、14 に止まることはできますか。
        figure: "8─9─🐸─11─12─13─14─15─16"
        choices: [できる, できない]
        answer: できる
        check: "'できる' if any(10 + sum(c) == 14 for c in itertools.product([1, -1], repeat=6)) else 'できない'"
        hints:
          - 6 回とんだあとは、偶数の所かな、奇数の所かな。
          - 14 は偶数だね。偶奇は合っているね。
          - 右に何回、左に何回とべば 14 になるか、試してみよう。
        paths:
          - [6 回とぶと偶数の所に止まる, 14 は偶数, 右に 5 回と左に 1 回で 14, できる]
        note: 偶奇が合っても、いつもできるとはかぎらない（6 回では 20 に届かない）。偶奇が合わないときは、必ずできないと言える。

  - day: 3
    items:
      - part: 思い出す
        text: 消えている電気のスイッチを 8 回おしました。電気はついていますか、消えていますか。
        figure: 💡
        choices: [ついている, 消えている]
        answer: 消えている
        check: "['消えている', 'ついている'][[*itertools.accumulate(range(8), lambda a, k: 1 - a, initial=0)][-1]]"
        hints:
          - 2 回おすごとに、元にもどるね。
          - 8 回は、2 回ずつの組にすると《余り》が出るかな。
          - 余りが出なければ、どうなるかな。
        paths:
          - [2 回で元にもどる, 8 は偶数で余りが出ない, 消えている]
      - part: 思い出す
        text: 15 + 22 + 37 の答えは、偶数ですか、奇数ですか。計算しないで考えよう。
        choices: [偶数, 奇数]
        answer: 偶数
        check: "'偶数' if (15 + 22 + 37) % 2 == 0 else '奇数'"
        hints:
          - 3 つの数のうち、奇数はどれかな。
          - 余りはいくつ出るかな。
          - 余りどうしで組を作ると、最後に余りは残るかな。
        paths:
          - [奇数は 15 と 37, 余りが 2 つ, 1 組できて余りはない, 偶数]
      - part: わけ
        text: 奇数と奇数を足すと、いつも偶数になります。5 + 7 を例にして、なぜそうなるのかを文で書きましょう。
        figure: "5：🔵🔵　🔵🔵　🔵\n7：🔵🔵　🔵🔵　🔵🔵　🔵"
        explain: 例：「5 は 2 つずつの組が 2 組と 1 つ余り、7 は 2 つずつの組が 3 組と 1 つ余り。合わせると、余りの 1 つと 1 つで新しい組ができるので、余りがなくなる。だから 5 + 7 は偶数になる。ほかの奇数でも、余りはどれも 1 つなので、同じように組ができて偶数になる。」と書ければよい。5 + 7 = 12 を計算しただけで終わっていたら、それは 1 つの例で、ほかの奇数でもそうなるわけ（余りが 1 つずつ出て組になる）を足すように話す。
        hints:
          - 5 と 7 を、2 つずつの組に分けてみよう。
          - 余りはそれぞれいくつかな。
          - 余りどうしを合わせるとどうなるかを書こう。
        paths:
          - [5 も 7 も 1 つ余る, 余りの 1 つと 1 つで組ができる, 余りがなくなる, だから偶数]
      - part: わけ
        text: 消えている電気のスイッチを 15 回おすと、電気はついています。なぜかを文で書きましょう。
        figure: 💡
        explain: 例：「2 回おすと、ついて消えて元にもどる。15 回を 2 回ずつの組に分けると、1 回余る。組の分では元の消えた形にもどり、余りの 1 回でつく。だから電気はついている。」と書ければよい。「15 は奇数だから」だけで終わっていたら、奇数だとなぜつくのか（2 回で元にもどり、1 回余る）を足すように話す。
        hints:
          - 2 回おすと、電気はどうなるかな。
          - 15 回を 2 回ずつの組に分けると、余りはあるかな。
          - 組の分と余りの分で、電気がどうなるかを書こう。
        paths:
          - [2 回おすと元にもどる, 15 回は 2 回ずつの組と 1 回の余り, 余りの 1 回でつく, だからついている]
      - part: わけ
        text: 1、3、5、7、9 のカードから 3 まい選んで、合計を 20 にすることはできません。なぜかを文で書きましょう。
        figure: "［1］［3］［5］［7］［9］"
        explain: 例：「カードはどれも奇数。奇数を 3 つ足すと、余りが 3 つ出て、2 つで組を作ると 1 つ余るので、合計は奇数になる。20 は偶数なので、どう選んでも 20 にはならない。」と書ければよい。いくつか試して「なかった」と書いただけなら、まだ試していない選び方があるかもしれず、それだけでは言い切れないことを話す（選び方は 10 通りある）。
        hints:
          - カードの数は、偶数かな、奇数かな。
          - 3 まいの合計は、偶数と奇数のどちらになるかな。
          - 20 とくらべて、だからどう言えるかを書こう。
        paths:
          - [どのカードも奇数, 奇数 3 つの合計は奇数, 20 は偶数, だからできない]
      - part: 今日
        text: 奇数を 6 こ足すと、答えは偶数ですか、奇数ですか。
        choices: [偶数, 奇数]
        answer: 偶数
