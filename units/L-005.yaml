# L-005 偶奇で考える
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く。
# 前提は N-008（偶数と奇数）だけで、かけ算（N-013）は前提にないので、かけ算とわり算は使わない。
# 偶奇は「2 つずつ組にして余りが出るか」で考え、和は足し算で考える。数は 2 けたまで（N-007 の範囲）。
# 日の並びは地図の既定（導入、練習、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：いくつかの数の和が偶数か奇数かは、奇数が何こあるかで決まる。計算しないで答える。「できるか」を偶奇で決める。
#   2 日目 練習：交互に変わるもの（スイッチ、コインの表とうら、数直線を 1 ずつとぶ）。回数が偶数か奇数かで決まる。
#   3 日目 わけ：代表の例（5 + 7、15 回、3 まいのカード）で、偶奇で決まるわけを文に書く。
#   4 日目 混ぜる：N-008 の型（偶数と奇数を見分ける、2 人で分けられるか）と混ぜる。輪に交互に並べられるか。
#   5 日目 確認。
# 操作をくり返しても変わらない偶奇（不変量）は L-009、一筆書きの点の偶奇は C-012、盤面の塗り分けの論法は C-017 で扱うので、ここでは使わない。
# 数直線の問題は 10 から始め、0 より小さい数（N-004）が出ないようにした。
# check：和の偶奇は計算した和で決める。「どんな奇数でも」の問題は itertools で小さな奇数をすべて試して確かめる。
# 交互に変わる問題は、1 回ごとに入れかえる動きを itertools.accumulate でまねて、最後の様子を出す。
# 「できるか」の問題は、すべての選び方・とび方・色のぬり方を試して、できるものがあるかで決める。

id: L-005
days:
  - day: 1
    items:
      - part: 見本
        text: 3 + 5 + 7 は偶数か奇数か、計算しないで考えよう。
        figure: "3：🔵🔵　🔵\n5：🔵🔵　🔵🔵　🔵\n7：🔵🔵　🔵🔵　🔵🔵　🔵"
        explain: 奇数は、2 つずつ組にすると 1 つ余る数です。3、5、7 はどれも奇数なので、《余り》が 3 つ出ます。余りを 2 つずつ組にすると、1 組できて 1 つ余ります。だから 3 + 5 + 7 は奇数です（計算すると 15 で、たしかに奇数です）。
      - part: 思い出す
        text: 46 は偶数ですか、奇数ですか。
        choices: [偶数, 奇数]
        answer: 偶数
        check: "'偶数' if 46 % 2 == 0 else '奇数'"
        hints:
          - 一の位の数を見よう。
          - 一の位の 6 は、2 つずつ組にすると余りが出るかな。
          - 一の位が 0、2、4、6、8 なら偶数だったね。
        paths:
          - [一の位は 6, 6 は偶数, 偶数]
      - part: 思い出す
        text: 次の数のうち、奇数はどれですか。
        choices: [30, 52, 77, 18]
        answer: 77
        check: "[x for x in [30, 52, 77, 18] if x % 2 == 1][0]"
        hints:
          - それぞれの一の位を見よう。
          - 一の位が 1、3、5、7、9 の数をさがそう。
          - 2 人で同じ数ずつ分けると、1 つ余る数はどれかな。
        paths:
          - [一の位は 0、2、7、8, 一の位が 7 の数, 77]
      - part: 今日
        text: 11 + 13 + 15 + 17 の答えは、偶数ですか、奇数ですか。計算しないで考えよう。
        choices: [偶数, 奇数]
        answer: 偶数
        check: "'偶数' if (11 + 13 + 15 + 17) % 2 == 0 else '奇数'"
        hints:
          - 11、13、15、17 は、それぞれ偶数かな、奇数かな。
          - 奇数は 2 つずつ組にすると 1 つ余るね。余りはいくつ出るかな。
          - 余りどうしで組を作ると、最後に余りは残るかな。
        paths:
          - [4 つとも奇数, 余りが 4 つ出る, 余りどうしで 2 組できて余りはない, 偶数]
          - [計算する, 11 + 13 + 15 + 17 = 56, 一の位が 6 なので偶数]
        note: 「奇数を足すと奇数」と覚えてしまい、奇数と答えやすい。奇数がいくつあるかを数えさせる。
      - part: 今日
        text: 2 + 4 + 7 + 8 + 10 の答えは、偶数ですか、奇数ですか。計算しないで考えよう。
        choices: [偶数, 奇数]
        answer: 奇数
        check: "'偶数' if (2 + 4 + 7 + 8 + 10) % 2 == 0 else '奇数'"
        hints:
          - 5 つの数のうち、奇数はどれかな。
          - 偶数は、2 つずつ組にすると余りが出ないね。
          - 余りが出るのは何こかな。
        paths:
          - [奇数は 7 だけ, 余りは 1 つ, 奇数]
        note: 数が 5 つあるので、「5 は奇数だから奇数」と考えてしまうことがある。数えるのは奇数の個数だけ。
      - part: 今日
        text: 奇数を 5 こ足すと、答えは偶数ですか、奇数ですか。
        choices: [偶数, 奇数]
        answer: 奇数
        check: "[x for x in ['偶数', '奇数'] if all((sum(c) % 2 == 0) == (x == '偶数') for c in itertools.product(range(1, 10, 2), repeat=5))][0]"
        hints:
          - 1 + 3 + 5 + 7 + 9 のように、例で試してみよう。
          - 奇数 1 こにつき、余りが 1 つ出るね。
          - 余りが 5 つ。2 つずつ組にすると、どうなるかな。
        paths:
          - [余りが 5 つ出る, 2 組できて 1 つ余る, 奇数]
          - [例で試す, 1 + 3 + 5 + 7 + 9 = 25, 奇数]
        note: 例で試すのはよい始め方。ほかの奇数でも同じになるかは、余りの数で考えると分かる（3 日目のわけ）。
      - part: 挑戦
        text: 1、3、5、7、9 のカードが 1 まいずつあります。3 まい選んで、合計を 16 にできますか。
        figure: "［1］［3］［5］［7］［9］"
        choices: [できる, できない]
        answer: できない
        check: "'できる' if any(sum(c) == 16 for c in itertools.combinations([1, 3, 5, 7, 9], 3)) else 'できない'"
        hints:
          - カードの数は、どれも偶数かな、奇数かな。
          - 奇数を 3 つ足すと、答えは偶数かな、奇数かな。
          - 16 は偶数かな、奇数かな。
        paths:
          - [カードはどれも奇数, 奇数 3 つの合計は奇数, 16 は偶数, できない]
        note: 何通りか足してみて「見つからない」だけでは、できないとは言い切れない。偶奇なら、全部を試さなくても言い切れることを話す。
    extra:
      - part: 今日
        text: 21 + 23 + 25 の答えは、偶数ですか、奇数ですか。計算しないで考えよう。
        choices: [偶数, 奇数]
        answer: 奇数
        check: "'偶数' if (21 + 23 + 25) % 2 == 0 else '奇数'"
        hints:
          - 21、23、25 は、それぞれ偶数かな、奇数かな。
          - 余りはいくつ出るかな。
          - 余りどうしで組を作ると、最後に余りは残るかな。
        paths:
          - [3 つとも奇数, 余りが 3 つ, 1 組できて 1 つ余る, 奇数]
      - part: 今日
        text: 3 + 6 + 9 + 12 の答えは、偶数ですか、奇数ですか。計算しないで考えよう。
        choices: [偶数, 奇数]
        answer: 偶数
        check: "'偶数' if (3 + 6 + 9 + 12) % 2 == 0 else '奇数'"
        hints:
          - 4 つの数のうち、奇数はどれかな。
          - 余りはいくつ出るかな。
          - 余りどうしで組を作ると、最後に余りは残るかな。
        paths:
          - [奇数は 3 と 9, 余りが 2 つ, 1 組できて余りはない, 偶数]
      - part: 挑戦
        text: 2、4、6、8、10 のカードが 1 まいずつあります。4 まい選んで、合計を 25 にできますか。
        figure: "［2］［4］［6］［8］［10］"
        choices: [できる, できない]
        answer: できない
        check: "'できる' if any(sum(c) == 25 for c in itertools.combinations([2, 4, 6, 8, 10], 4)) else 'できない'"
        hints:
          - カードの数は、どれも偶数かな、奇数かな。
          - 偶数をいくつ足しても、余りは出るかな。
          - 25 は偶数かな、奇数かな。
        paths:
          - [カードはどれも偶数, 偶数の合計は偶数, 25 は奇数, できない]

  - day: 2
    items:
      - part: 見本
        text: 電気がついたり消えたりするきまりを考えよう。
        figure: 💡
        explain: 消えている電気のスイッチを 1 回おすとつき、もう 1 回おすと消えます。おすたびに「つく」「消える」が交互に入れかわります。2 回おすと元にもどるので、おした回数が偶数なら消えたまま、奇数ならついています。たとえば 3 回おすと、ついています。
      - part: 思い出す
        text: 5 + 7 + 9 + 11 + 13 の答えは、偶数ですか、奇数ですか。計算しないで考えよう。
        choices: [偶数, 奇数]
        answer: 奇数
        check: "'偶数' if (5 + 7 + 9 + 11 + 13) % 2 == 0 else '奇数'"
        hints:
          - 5 つの数は、それぞれ偶数かな、奇数かな。
          - 《余り》はいくつ出るかな。
          - 余りどうしで組を作ると、最後に余りは残るかな。
        paths:
          - [5 つとも奇数, 余りが 5 つ, 2 組できて 1 つ余る, 奇数]
      - part: 思い出す
        text: 偶数を 3 こと、奇数を 2 こ、全部足すと、答えは偶数ですか、奇数ですか。
        choices: [偶数, 奇数]
        answer: 偶数
        check: "[x for x in ['偶数', '奇数'] if all((sum(c) % 2 == 0) == (x == '偶数') for c in itertools.product([2, 4], [6, 8], [10, 12], [1, 3], [5, 7]))][0]"
        hints:
          - 偶数は、いくつ足しても余りが出ないね。
          - 余りが出るのは、奇数の 2 こだけだね。
          - 余りが 2 つなら、組にするとどうなるかな。
        paths:
          - [偶数からは余りが出ない, 奇数 2 こで余りが 2 つ, 1 組できて余りはない, 偶数]
      - part: 今日
        text: 消えている電気のスイッチを 12 回おしました。電気はついていますか、消えていますか。
        figure: 💡
        choices: [ついている, 消えている]
        answer: 消えている
        check: "['消えている', 'ついている'][[*itertools.accumulate(range(12), lambda a, k: 1 - a, initial=0)][-1]]"
        hints:
          - 1 回おすとつく、2 回おすと消えるね。
          - 2 回おすごとに、元にもどるね。
          - 12 回は、2 回ずつの組にすると余りが出るかな。
        paths:
          - [2 回で元にもどる, 12 は偶数で余りが出ない, 消えている]
      - part: 今日
        text: 表が上になっているコインを、1 回ずつひっくり返します。9 回ひっくり返すと、上は表ですか、うらですか。
        choices: [表, うら]
        answer: うら
        check: "['表', 'うら'][[*itertools.accumulate(range(9), lambda a, k: 1 - a, initial=0)][-1]]"
        hints:
          - 1 回でうら、2 回で表になるね。
          - 2 回ひっくり返すごとに、元にもどるね。
          - 9 は偶数かな、奇数かな。
        paths:
          - [2 回で元にもどる, 9 は奇数で 1 回余る, うら]
      - part: 今日
        text: 《数直線》の 10 にカエルがいます。右か左に 1 ずつ、ちょうど 7 回とびます。止まる所の数は、偶数ですか、奇数ですか。
        figure: "4─5─6─7─8─9─🐸─11─12─13─14─15─16"
        choices: [偶数, 奇数]
        answer: 奇数
        check: "[x for x in ['偶数', '奇数'] if all(((10 + sum(c)) % 2 == 0) == (x == '偶数') for c in itertools.product([1, -1], repeat=7))][0]"
        hints:
          - 1 回とぶと、止まる数は偶数から奇数、奇数から偶数に変わるね。
          - 10 は偶数。1 回目、2 回目…と、偶数か奇数かを順に書いてみよう。
          - 7 回とんだあとは、どちらかな。
        paths:
          - [1 回とぶたびに偶数と奇数が入れかわる, 10 は偶数, 7 は奇数なので入れかわったまま, 奇数]
        note: 右と左がまざると分からないと思いやすい。右でも左でも、1 回とぶと偶奇が入れかわることを確かめる。
      - part: 挑戦
        text: 数直線の 10 にいるカエルが、右か左に 1 ずつ、ちょうど 5 回とんで、12 に止まることはできますか。
        figure: "6─7─8─9─🐸─11─12─13─14"
        choices: [できる, できない]
        answer: できない
        check: "'できる' if any(10 + sum(c) == 12 for c in itertools.product([1, -1], repeat=5)) else 'できない'"
        hints:
          - 5 回とんだあとは、偶数の所かな、奇数の所かな。
          - 12 は偶数かな、奇数かな。
          - とんだあとの所と 12 をくらべよう。
        paths:
          - [10 から 5 回とぶと奇数の所に止まる, 12 は偶数, できない]
        note: 右に 3 回、左に 2 回などと試して見つからなくても、それだけでは言い切れない。偶奇で考えると、試さずに言い切れる。
    extra:
