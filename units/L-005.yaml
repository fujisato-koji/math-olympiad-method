    note: かけ算（N-013）を「いくつ分」とみて偶奇を考える。偶数のいくつ分は 2 つずつ組にできるので偶数、奇数の奇数こ分は奇数が奇数こなので奇数（1 日目の決まり）。81 こを全部調べなくても、奇数の段の奇数の列だけを数えればよい。
