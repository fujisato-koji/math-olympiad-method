ri:
  - part: 離
    kinds: [道筋, 手数]
    text: 《数直線》の 30 にカエルがいます。1 回目は 1、2 回目は 2、3 回目は 3、…、7 回目は 7 だけ、右か左にとびます（右か左かは毎回えらべます）。7 回とんで、30 にもどってくることはできますか。
    figure: "26─27─28─29─🐸─31─32─33─34"
    choices: [できる, できない]
    answer: できる
    check: "'できる' if any(sum(s[i] * (i + 1) for i in range(7)) == 0 for s in itertools.product([1, -1], repeat=7)) else 'できない'"
    hints:
      - 右へとんだ長さの合計と、左へとんだ長さの合計が、どうなっていればもどれますか。
      - 1 から 7 までの合計は、偶数ですか、奇数ですか。
      - 偶数なら、本当にできるかどうかを、右と左に分けて確かめましょう。
    paths:
      - [右の合計と左の合計が同じならもどれる, 1 から 7 までの合計は 28 で偶数, 右へ 1、2、4、7 で 14、左へ 3、5、6 で 14, できる]
    note: 偶奇で「できない」と決める問題（挑戦）とちがい、合計が偶数なので偶奇だけでは決まらない。そこで右と左に分けて、できる例を実際に作る。偶奇が合っても「できる」とは限らないので、例を作るところまでが答え（1 から 6 までなら合計 21 で、できない）。
  - part: 離
    kinds: [総動員]
    uses: [N-013]
    text: 九九の表には、1 の段から 9 の段まで、81 この答えがならんでいます。このうち、答えが奇数になるものはいくつありますか。
    answer: 25
    check: "len([1 for a in range(1, 10) for b in range(1, 10) if a * b % 2 == 1])"
    hints:
      - 偶数 × 奇数 の答えは、偶数ですか、奇数ですか。
      - 答えが奇数になるのは、かけられる数とかける数がどんなときですか。
      - 1 から 9 までに、奇数はいくつありますか。
    paths:
