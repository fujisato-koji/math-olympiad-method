    text: 100 この電球が、円の形にならんでいます。円なので、どの電球にも両どなりがあります。どの電球にもボタンが 1 つずつあります。ボタンをおすと、その電球と両どなりの 2 こ、あわせて 3 この電球が、ついていれば消え、消えていればつきます。はじめは全部消えています。さいごに 100 こ全部が同時についているようにするには、ボタンを少なくとも何回おせばよいですか。また、それより少ない回数ではできないわけを書きましょう。
    answer: 100
    check: 'min(sum(s[0] for s in t[:100]) for a in (0, 1) for b in (0, 1) for t in [[s for s in itertools.accumulate(range(101), lambda s, _: (s[1], (1 + s[0] + s[1]) % 2), initial=(a, b))]] if t[100] == (a, b))'
    hints:
    - 同じボタンを 2 回おすと、どうなるかな。おすじゅんばんをかえると、さいごのつき方はかわるかな。
    - 電球が 3 こから 7 こまでのときを調べよう。6 こと 7 こでは、何がちがうかな。
    - となり合う 2 この電球について、それぞれをつけたり消したりするボタンの組をくらべてみよう。
    paths:
    - - 同じボタンを 2 回おすと、3 この電球はもとにもどる。おすじゅんばんをかえても、それぞれの電球がかわる回数はかわらない。だから、どのボタンも「おす」か「おさない」かだけを考えればよい（2 回以上おしたボタンは、2 回ずつ取りのぞいても、さいごのつき方は同じで、回数はへるだけ）
      - 電球がさいごについているのは、つく・消えるがかわった回数が奇数のとき。ある電球をかえるのは、その電球と両どなりの 3 つのボタン
      - となり合う電球 ア と イ（ア の右が イ）を考える。ア をかえるのは ア の左・ア・イ のボタン、イ をかえるのは ア・イ・イ の右のボタン。ア の左と イ の右の一方だけをおすと、ア と イ のかわる回数は 1 ちがい、どちらかが偶数になってしまう。だから、ア の左のボタンと イ の右のボタンは、両方おすか、両方おさないかのどちらか。つまり、3 つはなれたボタンは、おす・おさないが同じ
      - ボタン 1 から 3 つずつ進むと、1、4、7、…、100、3、6、…、99、2、5、…、98 と進んで 1 にもどり、100 こ全部のボタンを通る（3 × 33 = 99 なので 100 は 3 でわり切れず、1 しゅうするたびに通りはじめる場所がずれる）。だから、全部のボタンが同じ
      - 全部おさないと 1 こもつかない。全部おすと、どの電球も 3 回かわってつく。100 回より少ないと、1 回もおさないボタンがのこるが、全部のボタンが同じでなければならないので、できない。だから、いちばん少ないのは 100 回
    - - 同じボタンを 2 回おすともとにもどり、じゅんばんにもよらないので、どのボタンも「おす」か「おさない」かだけを考えればよい
      - ボタン 1 と ボタン 2 をおすかどうかを決める（4 通り）。すると、電球 2 がつくように、ボタン 3 をおすかどうかが 1 通りに決まる。つぎに電球 3 から ボタン 4 が決まり、…と、ボタン 100 まで全部がじゅんに決まる
      - 4 通りを表にする（○はおす、×はおさない）。×× なら ××○××…、○× なら ○××○×…、×○ なら ×○××○…、○○ なら ○○○○○…。どれも、ボタン 4・5 がボタン 1・2 と同じになる。つぎのボタンは前の 2 つだけで決まるので、そこから先も同じ 3 つがくり返す
      - 円を 1 しゅうすると、ボタン 100 のつぎは ボタン 1、そのつぎは ボタン 2 にもどる。電球 100 と電球 1 がつくように同じきまりで決めた 101 番めと 102 番めは、はじめに決めた ボタン 1、2 と同じでなければならない。3 つごとのくり返しで、101 番めは 2 番めと、102 番めは 3 番めと同じなので、1 番め・2 番め・3 番めが同じでなければならない
      - 4 通りのうち、はじめの 3 つが同じになるのは ○○○○… の 1 通りだけ。だから全部の 100 回おすしかない
    note: 工夫は 3 段：①2 回おすともとにもどり、じゅんばんにもよらないので、どのボタンも「おす」か「おさない」かだけになる（偶奇）、②となり合う 2 この電球の条件をくらべると、3 つはなれたボタンは同じになる（周期性、docs/hardest-structures.md の S32）、③100 は 3 でわり切れないので、3 つずつ進むと全部のボタンを通り、全部おすしかない（全部おすと、どの電球も 3 回かわってつく）。電球が 3 の倍数のこ数なら 3 つおきにおして 3 分の 1 の回数ですむ（99 こなら 33 回）ので、100 こでも 34 回くらいと予想しやすく、わけを書かせる。「全部が同時についている」としたのは、「どの電球も一度はついた」と読むと 34 回でできてしまうから。2 本目は、はじめの 2 つのボタンを決めると残りが順に決まることを使い、4 通りを全部たどる。check は、どのボタンもおすかおさないかだけでよいことを使い、はじめの 2 つのボタンの 4 通りを全部調べて、電球の条件で残りを順に決め、1 しゅうしてはじめの 2 つと合うものの回数のいちばん少ない値を出す（100）。電球が 3 こから 16 このときは、おすボタンの組を全部調べ、この決め方と答えが同じになることを確かめた（評価役は 3〜20 こで組を全部、18 こまでは重ね押しとじゅんばんもふくめて調べた）。海外に先例がある（Levitin『Algorithmic Puzzles』の 41 番、2009 年のインドの Postal Coaching）。
