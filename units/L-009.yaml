    text: 円の形にならんだ 12 まいのコインがあります。場所には 1 番から 12 番までの番号がついていて、12 番のとなりは 1 番です。はじめは全部表（🌕）を向いています。1 回に、つづいてならぶ 4 まいを全部うら返します。何回かくり返してできる、表とうらの向きのならびは、はじめのならびもふくめて、全部で何通りありますか。
    answer: 512
    check: len(set(sum((sum((s >> i) & 1 for i in range(12) if (j - i) % 12 < 4) % 2) << j for j in range(12)) for s in range(4096)))
    hints:
    - 同じ場所を 2 回うら返すと、どうなるかな。うら返すじゅんばんをかえると、できるならびはかわるかな。
    - 1 回に返す 4 まいの場所の番号には、どんな数がならんでいるかな。
    - 2 回のうら返しで、返る場所が 2 まいだけになるえらび方はないかな。
    paths:
    - - 同じ場所のうら返しを 2 回すると元にもどり、するじゅんばんもできるならびにかかわらない。だから、12 か所のうら返しは、それぞれ「する」か「しない」かだけを考えればよい
      - 場所の番号を 4 でわったあまりで、コインを 3 まいずつの 4 つの組に分ける（1・5・9 番、2・6・10 番、3・7・11 番、4・8・12 番）。つづく 4 まいには、どの組のコインも 1 まいずつ入っている
      - 1 回うら返すと、4 つの組のどれも、うら向きのまい数が 1 まいだけかわる。だから、4 つの組のうら向きのまい数は、同時に偶数から奇数へ、奇数から偶数へとかわる。はじめは全部 0 まい（偶数）なので、4 つの組のうら向きのまい数は、いつも 4 つとも偶数か、4 つとも奇数のどちらか
      - 3 まいの組のうら向きのまい数は、偶数になるならびが 4 通り（0 まい 1 通り、2 まい 3 通り）、奇数になるならびが 4 通り（1 まい 3 通り、3 まい 1 通り）。4 つとも偶数なら 4 × 4 × 4 × 4 = 256 通り、4 つとも奇数も 256 通り。だから、できるならびは 256 + 256 = 512 通りより多くはない
      - となり合う 2 か所のうら返しをどちらもすると、重なる 3 まいは 2 回返って元にもどり、4 つはなれた 2 まい（同じ組の 2 まい）だけがうら返る。これで、どの組も、うら向きが偶数まいのならびが全部作れる。また 1 回のうら返しで、どの組も 1 まいだけうら返る。これを足せば、どの組も奇数まいのならびも全部作れる。だから 512 通りすべてができる
    - - 同じ場所のうら返しは 2 回すると元にもどり、じゅんばんにもよらないので、12 か所それぞれ「する」か「しない」か。全部で 2 を 12 回かけて 4096 通りのする・しないの組がある
      - ちがうする・しないの組 2 つが同じならびを作るとき、そのちがいがある場所だけをうら返すと、ならびはかわらない。だから、どのならびも同じ数の組から作られる。ならびがかわらない組（どのコインも偶数回うら返る）が何通りかを数えて、4096 をその数でわればよい
      - コイン 1 まいをうら返すのは、その番号とそのまえの 3 つの、あわせて 4 つの場所。となり合う 2 まいのコインでくらべると、ちがうのは 4 つはなれた 2 つの場所だけ。どちらのコインも偶数回返るなら、その 2 つの場所は、どちらもするか、どちらもしないか。つまり、4 つずつはなれた 3 つの場所は、する・しないが同じ
      - だから、1 番から 4 番の場所のする・しないを決めれば、全部の場所が決まる。どのコインも、つづく 4 つの場所のうち「する」場所の数の回数だけ返るので、その数が偶数になればよい。4 か所のうち「する」場所が 0、2、4 か所になるのは、1 + 6 + 1 = 8 通り
      - 8 でわるのは、半分にすることを 3 回くり返すのと同じ。4096 → 2048 → 1024 → 512 で、512 通り
    note: 工夫は 3 段：①同じ場所を 2 回すると元にもどり、じゅんばんにもよらないので、12 か所はそれぞれするかしないか（偶奇）、②場所を 4 でわったあまりで 4 つの組に分けると、1 回のうら返しは各組のコインを 1 まいずつ返すので、組どうしのうら向きのまい数の偶奇はそろったまま（不変量）。3 まいずつの組は偶数・奇数とも 4 通りなので、512 より多くはできない、③となり合う 2 か所のうら返しを重ねると、4 つはなれた 2 まいだけが返るので、この決まりを守るならびは全部作れる（構成）。2 本目は、ならびがかわらない組を数え、4096 を割る。その組は、4 つずつはなれた場所が同じになり、4 か所の組の「する」の数が偶数のもの（8 通り）。4096 ÷ 8 = 512。check は、する・しないの組 4096 通りを全部調べ、できるならび（向きの 12 けたの数）の種類を数える（512）。同じ円にならべるでも、すでにある円の赤白のカードは「ずらしても数が 1 までしかかわらない」を使う問題で、これは「決まった数のコインを返す操作でかわらない偶奇」と「全部作れること」を使う問題。数は 100 をこえる（512、4096）ので、かけ算とべき（2 を 12 回かける）で出す。
