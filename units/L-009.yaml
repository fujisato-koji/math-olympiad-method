# L-009 変わらないものを探す（不変量の入口）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く。
# 前提は L-005（偶奇で考える）で、たどると N-008、N-007 までなので、数は 100 まで、たし算とひき算だけにする（かけ算とわり算は使わない）。
# 偶数・奇数は N-008 のとおり「2 つずつ組にして余りが出るか」で考え、和の偶奇は L-005 の「奇数がいくつあるか」で決める。
# コインは 🌕 が表、🌑 がうら。電球は押すたびに、ついているものは消え、消えているものはつく。
# 日の並びは地図の既定（導入、練習、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：操作をしても変わらないものを探す。移しかえても合計は変わらない。1 回ごとに必ず 1 つずつふえる（へる）ものがあると、
#                回数はやり方によらず決まる（板チョコを割る、勝ちぬき戦）。黒板の 2 つの数を消して和を書くと、合計は変わらない。
#   2 日目 練習：偶数・奇数が変わらない操作（2 まいずつ裏返す、2 こずつスイッチを押す、2 つの数を消して差を書く）。変わらないものから「できない」を言う。
#   3 日目 わけ：代表の例で、合計が変わらないわけ、表のまい数の偶数・奇数が変わらないわけ（裏返し方の 3 つの場合）、割る回数が決まるわけを文に書く。
#   4 日目 混ぜる：L-005 の型（和の偶奇、交互に変わる、輪に交互に並べる、数直線をとぶ）と混ぜる。
#   5 日目 確認。偶奇が合っても「できる」とはかぎらないので、できる問題は実際の手順で確かめる。
# 盤面の塗り分けの論法は C-017、単調に変わる量とあまりで見る不変量は L-016 なので使わない。
# check：操作でたどり着ける様子を全部出し、たずねたことが成り立つかを調べる。
#   移しかえは、自分を呼ぶ lambda で 6 回までの移し方を全部たどる。黒板の数は、2 つの選び方を全部ためして最後の数の集まりを出す。
#   板チョコは、たてか横に割る割り方を全部たどって、割る回数の集まりを出す。勝ちぬき戦は、1 回にする試合の数を全部ためす。
#   裏返しとスイッチは、表（ついている）のまい数の集まりを itertools.accumulate で広げていき、たどり着ける数を全部出す。
#   数がちがう答えになる操作の順がないこと（集まりが 1 つの数だけ）も、これで確かめる。

id: L-009
days:
  - day: 1
    items:
      - part: 見本
        text: 2 つの箱に、あめが 9 こと 6 こ入っています。1 回に 1 こ、どちらかの箱からもう一方の箱へ移します。何回移しても変わらないものは何でしょう。
        figure: "📦🍬🍬🍬🍬🍬🍬🍬🍬🍬\n📦🍬🍬🍬🍬🍬🍬"
        explain: 1 回移すと、一方の箱は 1 こへり、もう一方は 1 こふえます。へった分とふえた分が同じなので、2 つの箱を合わせた数はいつも 15 こです。それぞれの箱の数は変わりますが、合計は変わりません。何をしても変わらないものを見つけると、「こうはならない」と言い切れるようになります。たとえば、10 こと 6 こになることはありません。
      - part: 思い出す
        text: 12 + 15 + 17 の答えは、偶数ですか、奇数ですか。計算しないで考えよう。
        choices: [偶数, 奇数]
        answer: 偶数
        check: "'偶数' if (12 + 15 + 17) % 2 == 0 else '奇数'"
        hints:
          - 3 つの数のうち、奇数はどれかな。
          - 奇数は 2 つずつ組にすると 1 つ余るね。《余り》はいくつ出るかな。
          - 余りどうしで組を作ると、最後に余りは残るかな。
        paths:
          - [奇数は 15 と 17, 余りが 2 つ, 1 組できて余りはない, 偶数]
      - part: 思い出す
        text: 消えている電気のスイッチを 7 回おしました。電気はついていますか、消えていますか。
        figure: 💡
        choices: [ついている, 消えている]
        answer: ついている
        check: "['消えている', 'ついている'][[*itertools.accumulate(range(7), lambda a, k: 1 - a, initial=0)][-1]]"
        hints:
          - 2 回おすごとに、元にもどるね。
          - 7 回は、2 回ずつの組にすると余りが出るかな。
          - 余りの 1 回で、電気はどうなるかな。
        paths:
          - [2 回で元にもどる, 7 は奇数で 1 回余る, ついている]
      - part: 今日
        text: 箱 A にあめが 8 こ、箱 B に 5 こ入っています。1 回に 1 こずつ、どちらかからもう一方へ、何回か移しました。今の様子としてありえるのはどれですか。
        choices: [A 7 こと B 7 こ, A 10 こと B 3 こ, A 9 こと B 5 こ]
        answer: A 10 こと B 3 こ
        check: "(lambda T: [x for x, s in [('A 7 こと B 7 こ', (7, 7)), ('A 10 こと B 3 こ', (10, 3)), ('A 9 こと B 5 こ', (9, 5))] if s in T(T, (8, 5), 6)][0])(lambda f, s, d: {s} if d == 0 else {s}.union(*[f(f, t, d - 1) for t in [(s[0] - 1, s[1] + 1), (s[0] + 1, s[1] - 1)] if min(t) >= 0]))"
        hints:
          - 1 回移すと、2 つの箱を合わせた数はどうなるかな。
          - はじめの合計は何こかな。
          - 選択肢の中で、合計が同じになっているのはどれかな。
        paths:
          - [移しても合計は変わらない, はじめの合計は 13 こ, 7 と 7 は 14、9 と 5 は 14、10 と 3 は 13, A 10 こと B 3 こ]
        note: A がふえたかへったかを 1 回ずつ追いかけようとすると、回数が分からないので決められない。変わらない合計を見るのがこつ。
      - part: 今日
        text: 小さいブロックが 2 だん 3 れつ、6 こつながった板チョコがあります。1 回に 1 まいを、みぞにそって 2 つに割ります。ばらばらの 6 こにするには、何回割ればよいですか。
        figure: "🟫🟫🟫\n🟫🟫🟫"
        answer: 5
        check: "(lambda B: (lambda s: s.pop() if len(s) == 1 else 'きまらない')(B(B, 2, 3)))(lambda f, r, c: {0} if r == 1 and c == 1 else set().union(*[{1 + x + y for x in f(f, i, c) for y in f(f, r - i, c)} for i in range(1, r)], *[{1 + x + y for x in f(f, r, j) for y in f(f, r, c - j)} for j in range(1, c)]))"
        hints:
          - 1 回割ると、板チョコのまい数はいくつふえるかな。
          - はじめは 1 まい。最後は何まいかな。
          - 何まいふえればよいかを考えよう。
        paths:
          - [1 回割ると 1 まいふえる, 1 まいから 6 まいにする, 5 まいふえればよい, 5 回]
        note: 割る順で回数が変わると思いやすい。たてに先に割っても、横に先に割っても 5 回になることを、紙を切って試させるとよい。
      - part: 今日
        text: 8 チームで勝ちぬき戦をします。1 試合ごとに負けたチームが 1 つぬけ、最後に残った 1 チームが優勝です。引き分けはありません。優勝が決まるまでに、試合は全部で何回ありますか。
        answer: 7
        check: "(lambda G: (lambda s: s.pop() if len(s) == 1 else 'きまらない')(G(G, 8)))(lambda f, n: {0} if n == 1 else set().union(*[{k + x for x in f(f, n - k)} for k in range(1, n // 2 + 1)]))"
        hints:
          - 1 試合で、残っているチームはいくつへるかな。
          - 優勝が決まるとき、残っているのは何チームかな。
          - 何チームがぬければよいかを考えよう。
        paths:
          - [1 試合で 1 チームぬける, 8 チームから 1 チームになるまで 7 チームぬける, 7 試合]
          - [1 回戦は 4 試合, 2 回戦は 2 試合, 決勝は 1 試合, 4 + 2 + 1 = 7]
        note: 組み合わせ表をかいて数えてもよい。「1 試合で必ず 1 チームぬける」と見ると、組み合わせ方を決めなくても数が分かる。
      - part: 挑戦
        text: 黒板に 1、2、3、4 と書いてあります。2 つの数を消して、その 2 つを足した数を書きます。数が 1 つになるまでくり返すと、最後の数はいくつですか。
        figure: 1　2　3　4
        answer: 10
        check: "(lambda R: (lambda s: s.pop() if len(s) == 1 else 'きまらない')(R(R, [1, 2, 3, 4])))(lambda f, s: {s[0]} if len(s) == 1 else set().union(*[f(f, [*s[:i], *s[i + 1:j], *s[j + 1:], s[i] + s[j]]) for i in range(len(s)) for j in range(i + 1, len(s))]))"
        hints:
          - 1 回の操作で、黒板の数を全部足した合計はどうなるかな。
          - はじめの合計はいくつかな。
          - 最後に残る 1 つの数は、合計とどんな関係かな。
        paths:
          - [消した 2 つの和を書くので合計は変わらない, はじめの合計は 10, 最後の数も 10]
          - [1 と 2 で 3、3 と 3 で 6、6 と 4 で 10, ほかの順でも合計は同じ, 10]
        note: どの 2 つから消しても答えは同じ。2 通りくらいの順で試させてから、なぜ同じになるのかを考えさせる。
    extra:
      - part: 今日
        text: 箱 A にあめが 6 こ、箱 B に 9 こ入っています。1 回に 1 こずつ、どちらかからもう一方へ、何回か移しました。今の様子としてありえるのはどれですか。
        choices: [A 3 こと B 12 こ, A 8 こと B 8 こ, A 5 こと B 9 こ]
        answer: A 3 こと B 12 こ
        check: "(lambda T: [x for x, s in [('A 3 こと B 12 こ', (3, 12)), ('A 8 こと B 8 こ', (8, 8)), ('A 5 こと B 9 こ', (5, 9))] if s in T(T, (6, 9), 6)][0])(lambda f, s, d: {s} if d == 0 else {s}.union(*[f(f, t, d - 1) for t in [(s[0] - 1, s[1] + 1), (s[0] + 1, s[1] - 1)] if min(t) >= 0]))"
        hints:
          - 1 回移すと、合計はどうなるかな。
          - はじめの合計は何こかな。
          - 合計が同じになっているのはどれかな。
        paths:
          - [合計は変わらない, はじめの合計は 15 こ, 3 と 12 は 15, A 3 こと B 12 こ]
      - part: 今日
        text: 小さいブロックが 2 だん 4 れつ、8 こつながった板チョコがあります。1 回に 1 まいを、みぞにそって 2 つに割ります。ばらばらの 8 こにするには、何回割ればよいですか。
        figure: "🟫🟫🟫🟫\n🟫🟫🟫🟫"
        answer: 7
        check: "(lambda B: (lambda s: s.pop() if len(s) == 1 else 'きまらない')(B(B, 2, 4)))(lambda f, r, c: {0} if r == 1 and c == 1 else set().union(*[{1 + x + y for x in f(f, i, c) for y in f(f, r - i, c)} for i in range(1, r)], *[{1 + x + y for x in f(f, r, j) for y in f(f, r, c - j)} for j in range(1, c)]))"
        hints:
          - 1 回割ると、まい数はいくつふえるかな。
          - はじめは 1 まい。最後は何まいかな。
          - 何まいふえればよいかを考えよう。
        paths:
          - [1 回割ると 1 まいふえる, 1 まいから 8 まいにする, 7 回]
      - part: 挑戦
        text: 黒板に 5、6、7、8、9 と書いてあります。2 つの数を消して、その 2 つを足した数を書きます。数が 1 つになるまでくり返すと、最後の数はいくつですか。
        figure: 5　6　7　8　9
        answer: 35
        check: "(lambda R: (lambda s: s.pop() if len(s) == 1 else 'きまらない')(R(R, [5, 6, 7, 8, 9])))(lambda f, s: {s[0]} if len(s) == 1 else set().union(*[f(f, [*s[:i], *s[i + 1:j], *s[j + 1:], s[i] + s[j]]) for i in range(len(s)) for j in range(i + 1, len(s))]))"
        hints:
          - 1 回の操作で、黒板の数の合計はどうなるかな。
          - はじめの合計を計算しよう。
          - 最後に残る数は、合計とどんな関係かな。
        paths:
          - [合計は変わらない, 5 + 6 + 7 + 8 + 9 = 35, 最後の数も 35]

  - day: 2
    items:
      - part: 見本
        text: コインが 5 まいあり、表（🌕）が 3 まい、うら（🌑）が 2 まいです。1 回に 2 まいを同時に裏返します。表のまい数について、変わらないものは何でしょう。
        figure: 🌕🌕🌕🌑🌑
        explain: 2 まいとも表を裏返すと、表は 2 まいへります。2 まいともうらなら、表は 2 まいふえます。表とうらを 1 まいずつなら、表は 1 まいへって 1 まいふえるので、変わりません。どの場合も、2 へるか、2 ふえるか、変わらないかなので、表のまい数が偶数か奇数かは変わりません。はじめは 3 まいで奇数なので、いつも奇数です。だから、全部うら（表が 0 まいで偶数）にはできません。
      - part: 思い出す
        text: 箱 A にあめが 7 こ、箱 B に 4 こ入っています。1 回に 1 こずつ、何回か移しかえました。A が 2 こになったとき、B は何こですか。
        answer: 9
        check: "(lambda T: [b for a, b in T(T, (7, 4), 6) if a == 2][0])(lambda f, s, d: {s} if d == 0 else {s}.union(*[f(f, t, d - 1) for t in [(s[0] - 1, s[1] + 1), (s[0] + 1, s[1] - 1)] if min(t) >= 0]))"
        hints:
          - 移しかえても変わらないものは何だったかな。
          - はじめの合計は何こかな。
          - 合計から A の数を引こう。
        paths:
          - [合計は変わらない, 7 + 4 = 11, 11 − 2 = 9]
      - part: 思い出す
        text: 偶数を 3 こと、奇数を 3 こ、全部足すと、答えは偶数ですか、奇数ですか。
        choices: [偶数, 奇数]
        answer: 奇数
        check: "[x for x in ['偶数', '奇数'] if all((sum(c) % 2 == 0) == (x == '偶数') for c in itertools.product([2, 4], [6, 8], [10, 12], [1, 3], [5, 7], [9, 11]))][0]"
        hints:
          - 偶数は、いくつ足しても《余り》が出ないね。
          - 余りが出るのは、奇数の 3 こだけだね。
          - 余りが 3 つなら、組にするとどうなるかな。
        paths:
          - [偶数からは余りが出ない, 奇数 3 こで余りが 3 つ, 1 組できて 1 つ余る, 奇数]
      - part: 今日
        text: コインが 7 まいあり、表（🌕）が 4 まい、うら（🌑）が 3 まいです。1 回に 2 まいを同時に裏返します。何回かくり返して、7 まい全部を表にできますか。
        figure: 🌕🌕🌕🌕🌑🌑🌑
        choices: [できる, できない]
        answer: できない
        check: "'できる' if 7 in [*itertools.accumulate(range(8), lambda S, _: S | {h + 2 - 2 * u for h in S for u in range(3) if u <= h and 2 - u <= 7 - h}, initial={4})][-1] else 'できない'"
        hints:
          - 2 まい裏返すと、表のまい数はどう変わるかな。3 つの場合を考えよう。
          - はじめの表のまい数は、偶数かな、奇数かな。
          - 全部表なら、表は何まい。偶数かな、奇数かな。
        paths:
          - [2 まい裏返すと表は 2 へるか 2 ふえるか変わらない, 表のまい数の偶数・奇数は変わらない, はじめは 4 まいで偶数, 全部表は 7 まいで奇数, できない]
        note: 何回か試して「できなかった」だけでは、もっと試せばできるかもしれない。変わらないもの（偶数・奇数）を見ると、試さなくても言い切れる。
      - part: 今日
        text: 黒板に 1、2、3、4、5 と書いてあります。2 つの数を消して、大きいほうから小さいほうを引いた数（同じなら 0）を書きます。数が 1 つになるまでくり返します。最後の数は、偶数ですか、奇数ですか。
        figure: 1　2　3　4　5
        choices: [偶数, 奇数]
        answer: 奇数
        check: "(lambda R: (lambda s: '偶数' if all(x % 2 == 0 for x in s) else ('奇数' if all(x % 2 == 1 for x in s) else 'きまらない'))(R(R, [1, 2, 3, 4, 5])))(lambda f, s: {s[0]} if len(s) == 1 else set().union(*[f(f, [*s[:i], *s[i + 1:j], *s[j + 1:], abs(s[i] - s[j])]) for i in range(len(s)) for j in range(i + 1, len(s))]))"
        hints:
          - 5 と 3 を消して 2 を書くと、黒板の数の合計はいくつへるかな。
          - 2 つを消して差を書くと、合計は小さいほうの数の 2 回分へるね。それは偶数かな、奇数かな。
          - はじめの合計は偶数かな、奇数かな。最後の数は、合計と同じように考えよう。
        paths:
          - [差を書くと合計は小さいほうの数 2 回分へる, 同じ数を 2 回分は偶数なので 合計の偶数・奇数は変わらない, はじめの合計は 15 で奇数, 最後の数は奇数]
        note: 消し方によって、最後の数は 1 や 3 や 5 などに変わるが、どれも奇数になる。数そのものは変わっても、偶数か奇数かは変わらない。
      - part: 今日
        text: 電球が 6 こあり、全部消えています。1 回に 2 このスイッチを同時におします（おすと、ついているものは消え、消えているものはつきます）。ちょうど 3 こがついている様子にできますか。
        figure: 💡💡💡💡💡💡
        choices: [できる, できない]
        answer: できない
        check: "'できる' if 3 in [*itertools.accumulate(range(7), lambda S, _: S | {h + 2 - 2 * u for h in S for u in range(3) if u <= h and 2 - u <= 6 - h}, initial={0})][-1] else 'できない'"
        hints:
          - 2 こおすと、ついている電球の数はどう変わるかな。
          - はじめについている数は、偶数かな、奇数かな。
          - 3 は偶数かな、奇数かな。
        paths:
          - [2 こおすと ついている数は 2 ふえるか 2 へるか変わらない, 偶数・奇数は変わらない, はじめは 0 こで偶数, 3 は奇数, できない]
      - part: 挑戦
        text: 黒板に 1、2、3、4、5 と書いてあります。2 つの数を消して、その 2 つの和か差（大きいほうから小さいほうを引く）のどちらかを書きます。どちらを書くかは毎回自分で選べます。数が 1 つになるまでくり返して、最後の数を 0 にできますか。
        figure: 1　2　3　4　5
        choices: [できる, できない]
        answer: できない
        check: "'できる' if 0 in (lambda R: R(R, [1, 2, 3, 4, 5]))(lambda f, s: {s[0]} if len(s) == 1 else set().union(*[f(f, [*s[:i], *s[i + 1:j], *s[j + 1:], v]) for i in range(len(s)) for j in range(i + 1, len(s)) for v in (s[i] + s[j], abs(s[i] - s[j]))])) else 'できない'"
        hints:
          - 和を書くとき、合計の偶数・奇数はどうなるかな。
          - 差を書くとき、合計の偶数・奇数はどうなるかな。
          - はじめの合計と 0 を、偶数か奇数かでくらべよう。
        paths:
          - [和なら合計は変わらない, 差なら小さいほうの 2 回分へる, どちらでも合計の偶数・奇数は変わらない, はじめは 15 で奇数, 0 は偶数, できない]
        note: 和と差を自由に選べても、変わらないものは残る。選べることがふえても言い切れるのが、変わらないものを見るよさ。
    extra:
      - part: 今日
        text: コインが 6 まいあり、表（🌕）が 2 まい、うら（🌑）が 4 まいです。1 回に 2 まいを同時に裏返します。何回かくり返して、6 まい全部を表にできますか。
        figure: 🌕🌕🌑🌑🌑🌑
        choices: [できる, できない]
        answer: できる
        check: "'できる' if 6 in [*itertools.accumulate(range(7), lambda S, _: S | {h + 2 - 2 * u for h in S for u in range(3) if u <= h and 2 - u <= 6 - h}, initial={2})][-1] else 'できない'"
        hints:
