        explain: |-
          もうてんは、目の おくで、見た ものを のうへ おくる くだが 出て いく ところです。ここには ひかりを うけとる しくみが ないので、そこに うつった ものは 見えません。みぎの 目の もうてんは 見つめた ところより みぎがわ、ひだりの 目の もうてんは ひだりがわに あります。
          カードは ＋ と ● を 7 センチ ほど はなして かき、うでを のばした くらいから ゆっくり ちかづけると、30 センチ ほどで ● が きえます。＋ から 目を はなさないのが こつ です。
          2 つの 目は 6 センチ ほど はなれて いるので、すこし ちがう えを 見ます。のうは その ちがいから ちかい・とおいを かんじとります。かための ときは それが つかえないので、ペンに キャップを はめる などが むずかしく なります。
