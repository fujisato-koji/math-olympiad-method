        explain: |-
          目に うつった ものは、のうで「どう 見えるか」に つくりかえられます。はしに そとむきの はねが ある せんは ながく、うちむきの はねが ある せんは みじかく 見えます（ミュラー・リヤーの さくし）。おなじ はいいろでも、くらい まわりの 中では あかるく、あかるい まわりの 中では くらく 見えます。
          ざんぞうは、目が 1 つの いろを 見つづけて その いろに なれ、白い かみを 見た ときに その いろだけ よわく かんじる ために おきます。あかを 見つづけた あとは、あかの はんたいの あおみどりが 見えます。30 かぞえる くらい 見つめると わかりやすい。
          きょうは「見た かんじと ほんとうの ようすが ちがう ことが ある」「ものさしや、まわりを かくす かみで たしかめられる」が つかめれば よい。
