# Q-001 見え方のふしぎ
#
# 段 1・水準 1・4 日。おなじ ながさ・おなじ あかるさ なのに ちがって 見える さくし、見つめた あとの ざんぞう、もうてんを 見つける、かため と りょうめで 見る ちかい とおい、見えかたは 目と のうが つくる ことを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 えで ためす（はねの ついた せん、まわりで かわる あかるさ、ざんぞう）、2 日目 目で ためす（もうてん、かため と りょうめ）、3 日目 わけ（見えかたは 目と のうが つくる。もうてんを うめる、かいて ない さんかく、せんろの ぼう）、4 日目 確認。
# 図の約束：目は 見る ひとの うしろから 見た ように かき、ひだりの 目を ひだり、みぎの 目を みぎに おく（つぶった 目は 下に まがった せんと まつげ）。ざんぞうは あおみどり か 白で、ふちを てんせんに する。ざんぞうの 図の 白い かみ・かべは うすい はいいろの しかく（白い ざんぞうが 見える ように）。ゆびは まるい ぼうに つめと ふしの せん（てを かく ときは、にぎった ての まるみから ゆびを 1 本 のばす）。
# あかるさの 図は、くろ・白・はいいろを いつも おなじ いろで かく（くらい 画面でも 見えかたが かわらない ように）。あかるさの 図の 白い かみ・あなの あいた かみは 白。かけた まるの 図の かみの ふちは うすい はいいろ（しかくの ふちの せんと まぎれない ように）。
# 腕だめし（離）は 2 問とも、絵を よむ 読み取り（kinds: 読み取り）。
# 目・耳・はな などの 5 つの かんかくは B-069、知覚の しくみ（閾値・恒常性など）は Q-004 で扱うので、ここでは問わない。

id: Q-001
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          おなじ ながさの せんでも、はしに つけた はねの むきで、ちがう ながさに 見えます。
          おなじ はいいろでも、まわりが くろいか 白いかで、あかるさが ちがって 見えます。
          ものさしで はかったり、まわりを かみで かくしたり すると、ほんとうは おなじ だと わかります。
          あかい ハートを じっと 見つめて から 白い かみを 見ると、あおみどりの ハートが 見えます。これを「ざんぞう」と いいます。
