        text: 1 + 2 + 3 + … + 9 のように、数が 9 このときは、組にすると 1 つ残ります。それでも和が求められるわけを、文で書きましょう。
        explain: 例：「1 と 9、2 と 8、3 と 7、4 と 6 で、和が 10 の組が 4 つできる。まん中の 5 は組にならずに残るので、それを足して 10 × 4 + 5 = 45。」と書ければよい。まん中の 5 を中心に、5 より小さい数と大きい数が同じだけはなれて並ぶので、全部 5 にならして 5 × 9 = 45 とする道（まん中の数 × こ数）もある。この道は、こ数が偶数のときにも「はじめと終わりの和の半分 × こ数」として使える。
        hints:
          - はしから組にしてみよう。どの数が残るかな。
          - 組の和と組の数を書こう。
          - 残った数をどうすればよいかを書こう。
        paths:
          - [10 の組が 4 つ, まん中の 5 が残る, 40 + 5 = 45]
          - [まん中の数は 5, 小さい数と大きい数をならすと全部 5, 5 × 9 = 45]
