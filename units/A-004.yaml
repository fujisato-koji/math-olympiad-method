# A-004 等差数列とその和
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：同じ数ずつふえる（へる）並び、次の数と間の数。2 日目：n 番目の数と、ある数が何番目か。
#   3 日目：はしから組にして和を求める。4 日目：わけ。5 日目：L-001、N-014、N-015 と混ぜる。6 日目：確認。
# 前提は N-015（計算のきまり）、L-001（きまりを見つける）、N-014（わり算とあまり）。
#   かけ算は九九と、N-015 の「分ける」でできる 2 けた × 1 けた（13 × 6 = 10 × 6 + 3 × 6）まで。わり算は九九の範囲。
#   N-009（大きな数）が前提にないので、数は 200 くらいまでにした。
# 和は「はしから組にする」を本線にした。数が奇数こなら、まん中の数が 1 つ残る（まん中の数 × こ数でもよい）。
#   逆の順に並べて足し、2 でわる道（ガウスの方法）は、2 でわる数が九九の範囲をこえるので、わけの日の別の道にだけ書いた。
# 「n 番目 = はじめの数 + ふえる数 × (n − 1)」は文字を使わず、数の例で言う（文字は A-010）。
# check は、和は sum(range(…))、n 番目は はじめの数 + ふえる数 × (番目 − 1) の式で確かめる。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-009 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-004
days:
  - day: 1
    items:
      - part: 見本
        text: 2、5、8、11、□ の □ に入る数はいくつかな。
        explain: となりどうしの差を調べると、5 − 2 = 3、8 − 5 = 3、11 − 8 = 3 で、どこも 3 ずつふえています。だから 11 の次は 11 + 3 = 14 です。このように、同じ数ずつふえる（またはへる）数の並びを等差数列といいます。となりどうしの差（ここでは 3）を公差といいます。
      - part: 思い出す
        text: 1、2、3、1、2、3、1、□ と、きまりにしたがって並んでいます。□ に入る数はいくつですか。
        answer: 2
        check: "[1, 2, 3][(8 - 1) % 3]"
        hints:
          - 何こで 1 回りしているかな。
          - 1、2、3 を 1 つのまとまりとして、くぎってみよう。
          - □ は、まとまりの何番目かな。
        paths:
          - [1、2、3 のくり返し, □ は 3 回目のまとまりの 2 番目, 2]
      - part: 思い出す
        text: 29 このあめを、1 人に 6 こずつ配ります。何こあまりますか。
        answer: 5
        check: "29 % 6"
        hints:
          - 6 のだんの九九で、29 をこえない数をさがそう。
          - 6 × 4 = 24 だね。
          - 29 から、配った数をひこう。
        paths:
          - [29 ÷ 6 = 4 あまり 5, 5 こ]
      - part: 今日
        text: 4、9、14、19、□ の □ に入る数はいくつですか。
        answer: 24
        check: "19 + (19 - 14)"
        hints:
          - となりどうしの差を調べよう。
          - いくつずつふえているかな。
          - 19 に、ふえる数をたそう。
        paths:
          - [5 ずつふえる, 19 + 5, 24]
      - part: 今日
        text: 7、11、□、19、23 の □ に入る数はいくつですか。
        answer: 15
        check: "11 + (23 - 19)"
        hints:
          - わかっているとなりどうしの差を見よう。
          - いくつずつふえているかな。
          - 11 の次は、11 にふえる数をたした数だよ。
        paths:
          - [4 ずつふえる, 11 + 4, 15]
          - [19 の前は 19 − 4, 15]
      - part: 今日
        text: 50、46、42、38、□ の □ に入る数はいくつですか。
        answer: 34
        check: "38 - (50 - 46)"
        hints:
          - 数はふえているかな、へっているかな。
          - いくつずつへっているかな。
          - 38 から、へる数をひこう。
        paths:
          - [4 ずつへる, 38 − 4, 34]
        note: へる並びも等差数列。差は「前の数 − 後ろの数」で 4。
      - part: 挑戦
        text: 3、7、11、15、… と続く数の並びがあります。8 番目の数はいくつですか。
        answer: 31
        check: "3 + 4 * (8 - 1)"
        hints:
          - いくつずつふえているかな。
          - 続きを 8 番目まで書いてみよう。
          - 1 番目から 8 番目までに、4 を何回たすかな。
        paths:
          - [3、7、11、15、19、23、27、31 と書く, 8 番目は 31]
          - [4 を 7 回たす, 3 + 4 × 7 = 31]
        note: 4 を 8 回たして 35 としやすい。2 日目に、たす回数が番目より 1 少ないことを学ぶ。
