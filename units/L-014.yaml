        text: マス目のそれぞれに、異なる数を 1 つずつ書きます。上下左右のどのとなりのマスよりも小さい数のマス（谷とよびます）は、必ずあるでしょうか。
        explain: 必ずあります。書いた数のうち、いちばん小さい数のマスを選ぶと、そのマスはどのとなりよりも小さいので谷です。マス目は有限個なので、いちばん小さい数は必ずあります。同じように、何人かの中で「自分より背の高い人がいる」と全員が言うことはできません。いちばん背の高い人には、自分より背の高い人がいないからです。有限個のものの中では、「どれにも、それより大きいものがある」は起こりません。
