t><rect x="253" y="31.5" width="30" height="23" rx="5" fill="#b39ddb" fill-opacity="0.6"/><path d="M216 26 Q208 56 216 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M286 26 Q294 56 286 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="234" y="48.5" font-size="16" text-anchor="middle" fill="currentColor">4</text><text x="268" y="48.5" font-size="16" text-anchor="middle" fill="currentColor">6</text><text x="234" y="74.5" font-size="16" text-anchor="middle" fill="currentColor">10</text><text x="268" y="74.5" font-size="16" text-anchor="middle" fill="currentColor">12</text><text x="251" y="19" font-size="15" text-anchor="middle" fill="currentColor">AB</text><text x="65" y="104" font-size="13" text-anchor="middle" fill="currentColor">1 行目</text><text x="147" y="104" font-size="13" text-anchor="middle" fill="currentColor">2 列目</text><rect x="81.2" y="131.6" width="49.1" height="25.5" rx="6" fill="none" stroke="#f08080" stroke-width="2.4"/><rect x="153.9" y="131.6" width="49.1" height="25.5" rx="6" fill="none" stroke="#7bc96f" stroke-width="2.4"/><text x="105.8" y="152.1" font-size="17" text-anchor="middle" fill="currentColor">1 × 0</text><text x="142.1" y="152.1" font-size="17" text-anchor="middle" fill="currentColor">+</text><text x="178.4" y="152.1" font-size="17" text-anchor="middle" fill="currentColor">2 × 3</text><text x="221.9" y="152.1" font-size="17" text-anchor="middle" fill="currentColor">= 6</text><text x="160" y="180" font-size="14" text-anchor="middle" fill="currentColor">1 行目と 2 列目 → AB の (1, 2) 成分</text></svg>'
        explain: 行列の積 AB は、B の列ごとに A をかけた列ベクトルをならべたものと決めます。B の 1 列目 (2；1) に A をかけると (1 × 2 + 2 × 1；3 × 2 + 4 × 1) = (4；10)、2 列目 (0；3) では (1 × 0 + 2 × 3；3 × 0 + 4 × 3) = (6；12) なので、AB = (4 6；10 12) です。成分で言うと、AB の (i, j) 成分は「A の i 行目と B の j 列目の成分を、順にかけて足したもの」です。このように決めるわけは、代入をつなぐことにあります。x = 2u、y = u + 3v、つまり (x；y) = B(u；v) を A(x；y) に入れると、A(x；y) = (x + 2y；3x + 4y) = (4u + 6v；10u + 12v) となり、これは (AB)(u；v) に等しくなります。逆の順の BA は (2 4；10 14) で、AB と BA はちがいます。A を 2 回かけた AA を A²、3 回かけたものを A³ と書きます。
