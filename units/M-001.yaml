      - part: わけ
        id: "b88aa642a2"
        text: A = (a b；c d) について、A² − (a + d)A + (ad − bc)E = O（ケーリー・ハミルトンの定理）が成り立つわけを、すじみちを立てて書きましょう。
        svg: '<svg viewBox="0 0 320 152" xmlns="http://www.w3.org/2000/svg"><text x="160" y="24" font-size="16" text-anchor="middle" fill="currentColor">A² − (a + d)A + (ad − bc)E = O</text><line x1="63" y1="86" x2="85" y2="106" stroke="#7bc96f" stroke-width="4" stroke-linecap="round"/><line x1="85" y1="86" x2="63" y2="106" stroke="#f08080" stroke-width="4" stroke-linecap="round"/><path d="M25 52 Q17 96 25 140" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M123 52 Q131 96 123 140" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="50" y="81.5" font-size="18" text-anchor="middle" fill="currentColor" font-style="italic">a</text><text x="98" y="81.5" font-size="18" text-anchor="middle" fill="currentColor" font-style="italic">b</text><text x="50" y="121.5" font-size="18" text-anchor="middle" fill="currentColor" font-style="italic">c</text><text x="98" y="121.5" font-size="18" text-anchor="middle" fill="currentColor" font-style="italic">d</text><text x="74" y="45" font-size="15" text-anchor="middle" fill="currentColor">A</text><text x="142" y="64" font-size="13" text-anchor="start" fill="currentColor">A = (a b；c d)</text><rect x="138" y="76" width="174" height="26" rx="6" fill="#7bc96f" fill-opacity="0.25"/><text x="142" y="94" font-size="13" text-anchor="start" fill="currentColor">a + d ＝ 緑の 2 つの和</text><rect x="138" y="106" width="174" height="26" rx="6" fill="#f08080" fill-opacity="0.2"/><text x="142" y="124" font-size="13" text-anchor="start" fill="currentColor">ad − bc ＝ 緑の積 − 赤の積</text></svg>'
        explain: 例：「A = (a b；c d) とする。A² の成分は、(1, 1) が a² + bc、(1, 2) が ab + bd、(2, 1) が ca + dc、(2, 2) が cb + d² である。(a + d)A の成分は、(1, 1) が a² + ad、(1, 2) が ab + bd、(2, 1) が ac + cd、(2, 2) が ad + d² である。(ad − bc)E は、(1, 1) と (2, 2) が ad − bc、ほかは 0 である。よって A² − (a + d)A + (ad − bc)E の (1, 1) 成分は a² + bc − a² − ad + ad − bc = 0、(1, 2) 成分は ab + bd − ab − bd = 0、(2, 1) 成分は ca + dc − ac − cd = 0、(2, 2) 成分は cb + d² − ad − d² + ad − bc = 0 である。4 つの成分がすべて 0 なので、O に等しい。」と書ければよい。①「〜とする」で成分を文字で置く、② A²、(a + d)A、(ad − bc)E を成分ごとに計算し、同じ文字の式をまとめる、③ 約束した事実（行列が等しいのは 4 つの成分がすべて等しいとき、和と実数倍は成分ごと）で結ぶ、の 3 つがそろっているかを見る。(1 2；3 4) で確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。x² − (a + d)x + (ad − bc) という 2 次式は、後の固有値の計算につながる。
        hints:
          - text: A² の (1, 1) 成分は、A の 1 行目と A の 1 列目から作ります。4 つの成分を、それぞれ文字の式で書きましょう。
