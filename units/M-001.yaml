        id: "06c60398e0"
        text: 図の A が逆行列をもたないとき、k が正の数なら k はいくつですか。
        svg: '<svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg"><text x="100.2" y="47.6" font-size="16" text-anchor="middle" fill="currentColor">A =</text><path d="M125.4 12 Q117.4 42 125.4 72" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M225 12 Q233 42 225 72" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="150.8" y="34.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">k</text><text x="199.6" y="34.5" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="150.8" y="60.5" font-size="16" text-anchor="middle" fill="currentColor">3</text><text x="199.6" y="60.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">k + 1</text><text x="160" y="100" font-size="15" text-anchor="middle" fill="currentColor">逆行列をもたない</text></svg>'
        answer: 2
        check: "[k for k in range(1, 50) if k * (k + 1) - 2 * 3 == 0][0]"
        hints:
          - text: 逆行列をもたないのは、ad − bc = 0 のときです。緑の線の積から赤の線の積をひいて、k の式にしましょう。
            svg: '<svg viewBox="0 0 320 128" xmlns="http://www.w3.org/2000/svg"><line x1="69.2" y1="62" x2="103.5" y2="82" stroke="#7bc96f" stroke-width="4" stroke-linecap="round"/><line x1="103.5" y1="62" x2="69.2" y2="82" stroke="#f08080" stroke-width="4" stroke-linecap="round"/><path d="M25 28 Q17 72 25 116" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M147.6 28 Q155.6 72 147.6 116" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="56.2" y="57.5" font-size="18" text-anchor="middle" fill="currentColor" font-style="italic">k</text><text x="116.5" y="57.5" font-size="18" text-anchor="middle" fill="currentColor">2</text><text x="56.2" y="97.5" font-size="18" text-anchor="middle" fill="currentColor">3</text><text x="116.5" y="97.5" font-size="18" text-anchor="middle" fill="currentColor" font-style="italic">k + 1</text><text x="86.3" y="21" font-size="15" text-anchor="middle" fill="currentColor">A</text><text x="166.6" y="40" font-size="13" text-anchor="start" fill="currentColor">A = (a b；c d)</text><rect x="162.6" y="52" width="149.4" height="26" rx="6" fill="#7bc96f" fill-opacity="0.25"/><text x="166.6" y="70" font-size="13" text-anchor="start" fill="currentColor">ad ＝ 緑の 2 つの積</text><rect x="162.6" y="82" width="149.4" height="26" rx="6" fill="#f08080" fill-opacity="0.2"/><text x="166.6" y="100" font-size="13" text-anchor="start" fill="currentColor">bc ＝ 赤の 2 つの積</text></svg>'
          - k(k + 1) − 6 = 0 を解きましょう（A-017）。
          - k² + k − 6 を因数分解しましょう。
        paths:
          - [k(k + 1) − 6 = 0, k² + k − 6 = 0, (k + 3)(k − 2) = 0, k > 0 なので k = 2]
          - [逆行列をもたない ⇔ 2 つの列 (k；3) と (2；k + 1) が平行, (2；k + 1) = t(k；3) とすると 2 = tk、k + 1 = 3t, t = 2/k を入れて k(k + 1) = 6, k > 0 なので k = 2]
