x="149" y="19" font-size="15" text-anchor="middle" fill="currentColor">A</text><text x="199" y="62.3" font-size="18" text-anchor="middle" fill="currentColor">=</text><path d="M218 26 Q210 56 218 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M284 26 Q292 56 284 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="224" y="32" width="22" height="22" rx="4" fill="#b39ddb" fill-opacity="0.7"/><text x="235" y="48.5" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><rect x="258" y="34" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.6"/><rect x="226" y="60" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.6"/><rect x="258" y="60" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.6"/><text x="251" y="19" font-size="15" text-anchor="middle" fill="currentColor">A²</text><text x="160" y="118" font-size="15" text-anchor="middle" fill="currentColor">(1, 1) 成分 ＝ a × a + b × c</text></svg>'
          - (a + d)A と (ad − bc)E の成分も書きましょう。
