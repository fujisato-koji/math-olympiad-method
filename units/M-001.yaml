      - part: 思い出す
        id: "8673a0e5d2"
        text: (x − 2)(x − 3) を展開した式はどれですか。
        choices:
          - x² + 5x + 6
          - x² − 5x + 6
          - x² − 5x − 6
          - x² − 6x + 5
        answer: x² − 5x + 6
        check: "[c for c, f in {'x² − 5x + 6': lambda x: x * x - 5 * x + 6, 'x² + 5x + 6': lambda x: x * x + 5 * x + 6, 'x² − 5x − 6': lambda x: x * x - 5 * x - 6, 'x² − 6x + 5': lambda x: x * x - 6 * x + 5}.items() if all(f(x) == (x - 2) * (x - 3) for x in range(-5, 6))][0]"
        hints:
          - (x + a)(x + b) = x² + (a + b)x + ab です（A-015）。
          - text: かけ合わせる組は、線でつないだ 4 つです。x どうしの積のほかに、x をふくむ積が 2 つあります。
            svg: '<svg viewBox="0 0 320 128" xmlns="http://www.w3.org/2000/svg"><text x="49.4" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">(</text><text x="74.8" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">x</text><text x="111" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">− 2</text><text x="147.3" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">)</text><text x="172.7" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">(</text><text x="198.2" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">x</text><text x="234.4" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">− 3</text><text x="270.6" y="80.6" font-size="24" text-anchor="middle" fill="currentColor">)</text><path d="M74.8 50 Q136.5 22 198.2 50" stroke="#f08080" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M74.8 50 Q154.6 2 234.4 50" stroke="#7bc96f" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M111 86 Q154.6 112 198.2 86" stroke="#7fc8f8" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M111 86 Q172.7 132 234.4 86" stroke="#b39ddb" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>'
