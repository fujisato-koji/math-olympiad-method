        explain: 係数行列 A = (2 3；1 2) を使うと、連立方程式 2x + 3y = 8、x + 2y = 5 は A(x；y) = (8；5) と書けます。ad − bc = 4 − 3 = 1 なので A⁻¹ = (2 −3；−1 2) です。両辺に左から A⁻¹ をかけると、A⁻¹A = E なので (x；y) = A⁻¹(8；5) = (16 − 15；−8 + 10) = (1；2)、つまり x = 1、y = 2 です。ad − bc ≠ 0 なら、この方法で解はただ 1 組に決まります。ad − bc = 0 のときは逆行列がなく、解がないか、解が限りなくあるかのどちらかです。たとえば x + 2y = 3 と 2x + 4y = 6 は、2 つ目の式が 1 つ目の 2 倍なので、x + 2y = 3 を満たす組はすべて解です（2 つの直線が重なる）。x + 2y = 3 と 2x + 4y = 7 では、1 つ目を 2 倍すると 2x + 4y = 6 となり、同時に 7 にはならないので解はありません（2 つの直線が平行）。列で見ると A(x；y) = x(2；1) + y(3；2) で、ad − bc = 0 は 2 つの列ベクトルが平行になることと同じです（G-027）。
