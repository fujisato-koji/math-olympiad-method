              <text x="120.9" y="37.8" font-size="16"> = </text>
              <path d="M150.4 7.0 Q143.4 32.2 150.4 57.4" stroke="currentColor" fill="none" stroke-width="1.6"/>
              <text x="166.4" y="26.2" font-size="16" text-anchor="middle">5</text>
              <text x="166.4" y="49.4" font-size="16" text-anchor="middle">10</text>
              <path d="M183.4 7.0 Q190.4 32.2 183.4 57.4" stroke="currentColor" fill="none" stroke-width="1.6"/>
            </g>
          </svg>
        explain: 数を長方形に並べてかっこでくくったものを行列といい、並べた数を成分といいます。横の並びを行、縦の並びを列といい、上から i 番目の行、左から j 番目の列にある成分を (i, j) 成分といいます。2 行 2 列の行列を 2 次の正方行列、1 列だけの行列を列ベクトルといいます。連立方程式の x と y の係数を並べた A = (2 1；3 4) を係数行列といいます（文の中では、行を「；」で区切り、成分を空白で区切って書きます。列ベクトルは (x；y) です）。行列 A と列ベクトル (x；y) の積を A(x；y) = (2x + y；3x + 4y) と決めます。1 行目の成分 2、1 を x、y にかけて足したものが上の成分、2 行目の 3、4 を x、y にかけて足したものが下の成分です。すると連立方程式は、図のように A(x；y) = (5；10) と 1 つの式で書けます。同じ型の行列の和と差は成分ごとに足したりひいたりし、実数倍 kA は成分をすべて k 倍します。たとえば (2 1；3 4) + (1 −1；0 2) = (3 0；3 6)、3(2 1；3 4) = (6 3；9 12) です。A(x；y) は、A の列 (2；3) と (1；4) を使って x(2；3) + y(1；4) とも書けます（ベクトルの実数倍と和、G-027）。
      - part: 思い出す
        text: 連立方程式を解きましょう。x はいくつですか。
        figure: "x + 2y = 7 …①\n3x − y = 7 …②"
        answer: 3
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if x + 2 * y == 7 and 3 * x - y == 7][0]"
        hints:
          - ② を 2 倍して ① に足すと、y が消えます（A-012）。
          - 7x = 21 になります。
          - x を求めたら、① に代入して y も確かめましょう。
        paths:
          - [② × 2 は 6x − 2y = 14, ① と足して 7x = 21, x = 3（y = 2）]
      - part: 思い出す
        text: ベクトル a = (1, 3)、b = (2, −1) のとき、2a + 3b の x 成分はいくつですか。
        answer: 8
        check: "2 * 1 + 3 * 2"
        hints:
          - 実数倍は、成分をそれぞれその倍にします（G-027）。
          - 2a = (2, 6)、3b = (6, −3) です。
          - 和は成分ごとに足します。
        paths:
          - ["2a + 3b = (2 + 6, 6 − 3) = (8, 3)", "8"]
