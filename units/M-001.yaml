      - part: わけ
        id: "ffe150e51d"
        text: A = (a b；c d) で ad − bc = 0 のとき、A は逆行列をもちません。このわけを、図の Y = (d −b；−c a) を使って、すじみちを立てて書きましょう。
        svg: '<svg viewBox="0 0 320 108" xmlns="http://www.w3.org/2000/svg"><text x="115" y="45.6" font-size="16" text-anchor="middle" fill="currentColor">Y =</text><path d="M140.2 10 Q132.2 40 140.2 70" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M210.2 10 Q218.2 40 210.2 70" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="158.2" y="32.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">d</text><text x="192.2" y="32.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">−b</text><text x="158.2" y="58.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">−c</text><text x="192.2" y="58.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">a</text><text x="160" y="96" font-size="16" text-anchor="middle" fill="currentColor">YA ＝ (ad − bc)E</text></svg>'
        explain: 例：「ad − bc = 0 とし、Y = (d −b；−c a) とする。前の問題（逆行列の公式のわけ）の計算から YA = (ad − bc)E = O である。もし A に逆行列 X があるとすると AX = E なので、《結合法則》より Y = YE = Y(AX) = (YA)X = OX = O となる。Y = O なので d = b = c = a = 0、つまり A = O である。すると AX = OX = O となって、AX = E に反する。よって A は逆行列をもたない。」と書ければよい。①「〜とする」で Y と、逆行列があると仮定した X を決める、② 結合法則で Y = (YA)X と変形する、③ 約束した事実（YA = (ad − bc)E、OX = O、O と E はちがう）で食いちがいを出して結ぶ、の 3 つがそろっているかを見る。「あると仮定して食いちがいを出す」書き方になることを話す。ad − bc = 0 は 2 つの列ベクトル (a；c)、(b；d) が平行になることで、5 日目の「解がただ 1 組に決まらない」と同じことだと結びつける。
        hints:
          - ad − bc = 0 のとき、YA はどうなるでしょう（逆行列の公式のわけの計算）。
          - text: 逆行列 X があると仮定して、Y を図のように変形しましょう。下の文字は、それぞれの = で使う事実です。
            svg: '<svg viewBox="0 0 320 96" xmlns="http://www.w3.org/2000/svg"><rect x="98.7" y="16.4" width="54.8" height="24" rx="6" fill="#f3c969" fill-opacity="0.55"/><rect x="166.5" y="16.4" width="54.8" height="24" rx="6" fill="#7fc8f8" fill-opacity="0.55"/><text x="35.4" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">Y</text><text x="51.4" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="71.8" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">YE</text><text x="92.2" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="126.1" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">Y(AX)</text><text x="160" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="193.9" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">(YA)X</text><text x="227.8" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="248.2" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">OX</text><text x="268.6" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="284.6" y="35.8" font-size="16" text-anchor="middle" fill="currentColor">O</text><text x="92.2" y="64" font-size="13" text-anchor="middle" fill="currentColor">E = AX</text><text x="160" y="84" font-size="13" text-anchor="middle" fill="currentColor">結合法則</text><text x="227.8" y="64" font-size="13" text-anchor="middle" fill="currentColor">YA = O</text><line x1="92.2" y1="44" x2="92.2" y2="52" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="160" y1="44" x2="160" y2="72" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="227.8" y1="44" x2="227.8" y2="52" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'
          - Y = O になると、A はどんな行列でしょう。そのとき AX = E は成り立つでしょうか。
        paths:
          - [ad − bc = 0、Y = (d −b；−c a) とする, YA = O, 逆行列 X があると Y = (YA)X = O で A = O, AX = O で E に反するので、逆行列はない]
          - [逆行列 X があれば、A(x；y) = (0；0) の解は (x；y) = X(0；0) = (0；0) だけ, ad − bc = 0 なら (d；−c) と (−b；a) はどちらも A(x；y) = (0；0) を満たす, A ≠ O ならこのどちらかは (0；0) でない解で食いちがう（A = O なら AX = O で E にならない）, 逆行列はない]
