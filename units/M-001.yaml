        explain: 例：「Δ = ad − bc（Δ ≠ 0）とし、Y = (d −b；−c a) とする。AY の (1, 1) 成分は ad + b(−c) = Δ、(1, 2) 成分は a(−b) + ba = 0、(2, 1) 成分は cd + d(−c) = 0、(2, 2) 成分は c(−b) + da = Δ なので、AY = ΔE である。YA の成分も、(1, 1) が da − bc = Δ、(1, 2) が db − bd = 0、(2, 1) が −ca + ac = 0、(2, 2) が −cb + ad = Δ で、YA = ΔE である。Δ ≠ 0 なので X = (1/Δ)Y とおくことができ、AX = (1/Δ)(AY) = (1/Δ)ΔE = E、同じく XA = E となる。よって X は A の逆行列である。」と書ければよい。①「〜とする」で Δ と Y を決める、② AY と YA を成分ごとに計算して ΔE にまとめる、③ 約束した事実（実数倍は積のどこに出してもよい、逆行列の定義）で結ぶ、の 3 つがそろっているかを見る。AY だけを計算して YA を忘れやすい（行列の積は順で変わるので、両方が要る）。(3 1；5 2) のような例で確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。
        hints:
          - Δ = ad − bc、Y = (d −b；−c a) として、AY の 4 つの成分を計算しましょう。
          - YA も計算しましょう。行列の積は順で変わるので、両方が要ります。
          - Δ が 0 でないことを使って、(1/Δ)Y が逆行列の決まりを満たすことを書きましょう。
        paths:
          - [Δ = ad − bc、Y = (d −b；−c a) とする, AY = ΔE、YA = ΔE, Δ ≠ 0 なので X = (1/Δ)Y で AX = XA = E, X は A の逆行列]
      - part: わけ
        text: A = (a b；c d) について、A² − (a + d)A + (ad − bc)E = O（ケーリー・ハミルトンの定理）が成り立つわけを、筋道を立てて書きましょう。
        explain: 例：「A = (a b；c d) とする。A² の成分は、(1, 1) が a² + bc、(1, 2) が ab + bd、(2, 1) が ca + dc、(2, 2) が cb + d² である。(a + d)A の成分は、(1, 1) が a² + ad、(1, 2) が ab + bd、(2, 1) が ac + cd、(2, 2) が ad + d² である。(ad − bc)E は、(1, 1) と (2, 2) が ad − bc、ほかは 0 である。よって A² − (a + d)A + (ad − bc)E の (1, 1) 成分は a² + bc − a² − ad + ad − bc = 0、(1, 2) 成分は ab + bd − ab − bd = 0、(2, 1) 成分は ca + dc − ac − cd = 0、(2, 2) 成分は cb + d² − ad − d² + ad − bc = 0 である。4 つの成分がすべて 0 なので、O に等しい。」と書ければよい。①「〜とする」で成分を文字で置く、② A²、(a + d)A、(ad − bc)E を成分ごとに計算し、同類項をまとめる、③ 約束した事実（行列が等しいのは 4 つの成分がすべて等しいとき、和と実数倍は成分ごと）で結ぶ、の 3 つがそろっているかを見る。(1 2；3 4) で確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。x² − (a + d)x + (ad − bc) という 2 次式は、後の固有値の計算につながる。
        hints:
          - A² を成分ごとに計算しましょう。
          - (a + d)A と (ad − bc)E の成分も書きましょう。
          - 4 つの成分ごとに A² − (a + d)A + (ad − bc)E を計算して、0 になるか調べましょう。
        paths:
          - [A = (a b；c d) とする, "A² の (1, 1) 成分は a² + bc など、成分ごとに計算する", どの成分も同類項が消えて 0, O に等しい]
      - part: わけ
        text: A = (a b；c d) で ad − bc = 0 のとき、A は逆行列をもちません。このわけを、Y = (d −b；−c a) を使って、筋道を立てて書きましょう。
        explain: 例：「ad − bc = 0 とし、Y = (d −b；−c a) とする。前の問題（逆行列の公式のわけ）の計算から YA = (ad − bc)E = O である。もし A に逆行列 X があるとすると AX = E なので、結合法則より Y = YE = Y(AX) = (YA)X = OX = O となる。Y = O なので d = b = c = a = 0、つまり A = O である。すると AX = OX = O となって、AX = E に反する。よって A は逆行列をもたない。」と書ければよい。①「〜とする」で Y と、逆行列があると仮定した X を決める、② 結合法則で Y = (YA)X と変形する、③ 約束した事実（YA = (ad − bc)E、OX = O、O と E はちがう）で食いちがいを出して結ぶ、の 3 つがそろっているかを見る。「あると仮定して食いちがいを出す」書き方（背理法）になることを話す。ad − bc = 0 は 2 つの列ベクトル (a；c)、(b；d) が平行になることで、5 日目の「解がただ 1 組に決まらない」と同じことだと結びつける。
