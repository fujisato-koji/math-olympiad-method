      - part: 見本
        id: "7b0dcc0f13"
        text: 単位行列 E = (1 0；0 1) は数の 1、れいぎょうれつ O は数の 0 のはたらきをします。A = (a b；c d) では、図の 2 つの数 a + d と ad − bc を使って A² − (a + d)A + (ad − bc)E = O が成り立ちます（ケーリー・ハミルトンの定理）。A = (1 2；3 4) で確かめてみましょう。
        svg: '<svg viewBox="0 0 320 218" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="17" text-anchor="middle" fill="currentColor">A² − 5A − 2E = O</text><line x1="61" y1="68" x2="87" y2="88" stroke="#7bc96f" stroke-width="4" stroke-linecap="round"/><line x1="87" y1="68" x2="61" y2="88" stroke="#f08080" stroke-width="4" stroke-linecap="round"/><path d="M27 36 Q19 78 27 120" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M121 36 Q129 78 121 120" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="51" y="64.5" font-size="18" text-anchor="middle" fill="currentColor">1</text><text x="97" y="64.5" font-size="18" text-anchor="middle" fill="currentColor">2</text><text x="51" y="102.5" font-size="18" text-anchor="middle" fill="currentColor">3</text><text x="97" y="102.5" font-size="18" text-anchor="middle" fill="currentColor">4</text><text x="9" y="50" font-size="15" text-anchor="middle" fill="currentColor">A</text><rect x="136" y="44" width="174" height="28" rx="6" fill="#7bc96f" fill-opacity="0.25"/><text x="140" y="63" font-size="14" text-anchor="start" fill="currentColor">a + d ＝ 1 + 4 ＝ 5</text><rect x="136" y="80" width="174" height="28" rx="6" fill="#f08080" fill-opacity="0.2"/><text x="140" y="99" font-size="14" text-anchor="start" fill="currentColor">ad − bc ＝ 4 − 6 ＝ −2</text><text x="47.8" y="167.6" font-size="16" text-anchor="middle" fill="currentColor">E =</text><path d="M73 132 Q65 162 73 192" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M135 132 Q143 162 135 192" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="89" y="154.5" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="119" y="154.5" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="89" y="180.5" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="119" y="180.5" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="190.2" y="167.6" font-size="16" text-anchor="middle" fill="currentColor">O =</text><path d="M215.4 132 Q207.4 162 215.4 192" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M277.4 132 Q285.4 162 277.4 192" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="231.4" y="154.5" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="261.4" y="154.5" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="231.4" y="180.5" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="261.4" y="180.5" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="160" y="210" font-size="13" text-anchor="middle" fill="currentColor">単位行列 E は数の 1、れいぎょうれつ O は数の 0 のはたらき</text></svg>'
        explain: E = (1 0；0 1) を単位行列といい、どの 2 次の正方行列 A についても AE = EA = A です（数の 1 のはたらき）。成分がすべて 0 の行列 O をれいぎょうれつといい、A + O = A、AO = OA = O です。行列の積には、(AB)C = A(BC)（《結合法則》）、A(B + C) = AB + AC（分配法則）が成り立ちますが、AB と BA は等しいとは限りません（2 日目）。また、A ≠ O、B ≠ O でも AB = O となることがあります。たとえば (1 1；1 1)(1 −1；−1 1) = O です。A = (1 2；3 4) では A² = (7 10；15 22) です。A² − 5A − 2E の (1, 1) 成分は 7 − 5 − 2 = 0、(1, 2) 成分は 10 − 10 = 0、(2, 1) 成分は 15 − 15 = 0、(2, 2) 成分は 22 − 20 − 2 = 0 で、O になります。どんな A = (a b；c d) についても、A² − (a + d)A + (ad − bc)E = O が成り立ちます。これをケーリー・ハミルトンの定理といいます（わけは 6 日目）。この式を A² = (a + d)A − (ad − bc)E と見ると、A² や A³ を A と E だけで表して計算できます。
