          - Y = O になると、A はどんな行列でしょう。そのとき AX = E は成り立つでしょうか。
        paths:
          - [ad − bc = 0、Y = (d −b；−c a) とする, YA = O, 逆行列 X があると Y = (YA)X = O で A = O, AX = O で E に反するので、逆行列はない]
