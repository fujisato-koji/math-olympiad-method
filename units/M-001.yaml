        text: 連立方程式 2x + 3y = 8、x + 2y = 5 は、A = (2 3；1 2) を使って A(x；y) = (8；5) と書けます。両辺に左から A⁻¹ をかけると (x；y) = A⁻¹(8；5) となって解けます。2 つの式を直線として見ると、ad − bc ≠ 0 なら交わる点が 1 つ、ad − bc = 0 なら平行か重なるかのどちらかです。
