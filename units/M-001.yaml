# M-001 連立 1 次方程式と行列（高校）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019、A-012 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜5 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# ことば：行列、成分、行と列、(i, j) 成分、2 次の正方行列、列ベクトル、係数行列、行列の和・差・実数倍・積、
#   単位行列 E、零行列 O、逆行列 A⁻¹、ケーリー・ハミルトンの定理。
# 前提は A-012（連立方程式）と G-027（ベクトル）。G-027 はまだ中身ができていないので、地図の題と前提から、平面のベクトルの成分、
#   和と実数倍、平行の条件（一方が他方の実数倍）、ベクトルを 2 つのベクトルの和で表すことを済んだものとした。
#   連立方程式の列の見方 x(a；c) + y(b；d) と、ad − bc = 0 が 2 つの列ベクトルの平行と同じであることに使う。
#   前提のたどりに A-017（2 次方程式）、A-015（展開）、G-026（直線の式、2 直線の交点と平行）がある。
# 行列は問題の svg に、かっこでくくった形で描く。文の中では「(2 1；3 4)」のように、行を「；」で区切り、成分を空白で区切って書く
#   （1 日目の見本で約束した）。列ベクトルは「(x；y)」。成分が式のときは「(1, 2) 成分は …」と成分ごとに言う。
#   行列そのものを答える問題は少なくし、成分を 1 つ聞いて数を打たせる。行列を選ぶ問題は、この書き方の choices にした。
# 2 次の正方行列だけを扱い、3 行 3 列の行列、掃き出し法、階数（M-003）は扱わない。ad − bc に名前（行列式）は付けず、
#   面積との関係と名前は M-002 で扱う。1 次変換（M-002）と固有値も先取りしない（ケーリー・ハミルトンの定理は計算の道具として使う）。
# わけの日は、(1) 逆行列の公式（ad − bc ≠ 0 のとき AX = XA = E）、(2) ケーリー・ハミルトンの定理、
#   (3) ad − bc = 0 のとき逆行列はない（あると仮定して O = E の食いちがいを出す）。
# 地図に plan がないので既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 行列と成分、和・差・実数倍、行列と列ベクトルの積、連立方程式を行列で書く
#   2 日目 行列の積（B の列ごとに A をかける、代入をつなぐ）、累乗　3 日目 積の性質（AB と BA、単位行列、零行列）、ケーリー・ハミルトンの定理
#   4 日目 逆行列（公式と、もたない条件）　5 日目 逆行列で連立方程式を解く、ad − bc = 0 のとき（解がない、解が限りなくある）
#   6 日目 わけ　7 日目 A-012・G-027 と混ぜる（買い物の連立方程式、ベクトルを 2 つのベクトルで表す、(AB)⁻¹）　8 日目 確認
# check：行列は入れ子の組にし、積は lambda（行と列の成分の積の和）で計算する。逆行列の成分は Fraction。累乗はくり返しかける。
#   連立方程式の解は、整数の総当たりか、逆行列の式（Fraction）で求める。
# 行列は、行列と 1 次変換（M-002）、掃き出し法と階数（M-003）、連立方程式を解く数値計算（K の流れ）、コンピュータグラフィックス、
#   回路と構造の計算、量子力学の状態の入口になる（D-026）。

id: M-001
days:
  - day: 1
    items:
      - part: 見本
        text: 連立方程式 2x + y = 5、3x + 4y = 10 を、行列を使って書いてみましょう。
        svg: |
          <svg viewBox="0 0 320.0 64.4" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(58.8 0)">
              <path d="M15.0 7.0 Q8.0 32.2 15.0 57.4" stroke="currentColor" fill="none" stroke-width="1.6"/>
