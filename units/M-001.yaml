              <text x="51.4" y="26.2" font-size="16" text-anchor="middle">1</text>
              <text x="26.5" y="49.4" font-size="16" text-anchor="middle">3</text>
              <text x="51.4" y="49.4" font-size="16" text-anchor="middle">4</text>
              <path d="M63.9 7.0 Q70.9 32.2 63.9 57.4" stroke="currentColor" fill="none" stroke-width="1.6"/>
              <path d="M83.9 7.0 Q76.9 32.2 83.9 57.4" stroke="currentColor" fill="none" stroke-width="1.6"/>
