text-anchor="middle" fill="currentColor">10</text><rect x="38.5" y="23" width="26" height="66" rx="7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3"/><text x="51.5" y="103" font-size="13" text-anchor="middle" fill="currentColor">1 列目</text><text x="233.5" y="48" font-size="13" text-anchor="start" fill="currentColor">← 1 行目</text><text x="233.5" y="74" font-size="13" text-anchor="start" fill="currentColor">← 2 行目</text><line x1="160" y1="108" x2="160" y2="116.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="160,122 156.7,115.8 163.3,115.8" fill="currentColor" stroke="none"/><rect x="42" y="126" width="236" height="28" rx="8" fill="#f3c969" fill-opacity="0.55"/><text x="160" y="145" font-size="16" text-anchor="middle" fill="currentColor">2 × x + 1 × y = 5</text><rect x="42" y="160" width="236" height="28" rx="8" fill="#7fc8f8" fill-opacity="0.55"/><text x="160" y="179" font-size="16" text-anchor="middle" fill="currentColor">3 × x + 4 × y = 10</text></svg>'
        explain: 数を長方形にならべてかっこでくくったものを行列といい、ならべた数を成分といいます。横のならびを行、たてのならびを列といい、上から i 番目の行、左から j 番目の列にある成分を (i, j) 成分といいます。2 行 2 列の行列を 2 次の正方行列、1 列だけの行列を列ベクトルといいます。文の中では、行を「；」で区切り、成分を空白で区切って A = (2 1；3 4)、列ベクトルを (x；y) と書きます。行列 A と列ベクトル (x；y) の積を A(x；y) = (2x + y；3x + 4y) と決めます。1 行目の 2、1 を x、y にかけて足したものが上の成分、2 行目の 3、4 を x、y にかけて足したものが下の成分です。すると連立方程式は、図のように A(x；y) = (5；10) と 1 つの式で書けます。この A を係数行列といいます。同じ型の行列の和と差は成分ごとに計算し、実数倍 kA は成分をすべて k 倍します。たとえば (2 1；3 4) + (1 −1；0 2) = (3 0；3 6)、3(2 1；3 4) = (6 3；9 12) です。A(x；y) は、A の列を使って x(2；3) + y(1；4) とも書けます（ベクトルの実数倍と和、G-027）。
