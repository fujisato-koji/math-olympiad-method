        explain: 正方行列 A に対して AX = XA = E となる行列 X があるとき、X を A の逆行列といい、A⁻¹ と書きます（数の《逆数》のはたらき）。A = (a b；c d) で ad − bc ≠ 0 のとき、A⁻¹ = (1/(ad − bc))(d −b；−c a) です。ad − bc = 0 のときは、逆行列はありません（わけは 6 日目）。A = (3 1；5 2) では ad − bc = 6 − 5 = 1 なので、A⁻¹ = (2 −1；−5 3) です。AA⁻¹ の (1, 1) 成分は 3 × 2 + 1 × (−5) = 1、(1, 2) 成分は 3 × (−1) + 1 × 3 = 0 のように 4 つの成分を確かめると、AA⁻¹ = E になります。「a と d を入れかえ、b と c を −b、−c にして、ad − bc でわる」と覚えます。
