        explain: E = (1 0；0 1) を単位行列といい、どの 2 次の正方行列 A についても AE = EA = A です（数の 1 のはたらき）。成分がすべて 0 の行列 O を零行列といい、A + O = A、AO = OA = O です。行列の積には、(AB)C = A(BC)（結合法則）、A(B + C) = AB + AC（分配法則）が成り立ちますが、AB と BA は等しいとは限りません（2 日目）。また、A ≠ O、B ≠ O でも AB = O となることがあります。たとえば (1 1；1 1)(1 −1；−1 1) = O です。A = (1 2；3 4) では A² = (7 10；15 22) です。A² − 5A − 2E の (1, 1) 成分は 7 − 5 − 2 = 0、(1, 2) 成分は 10 − 10 = 0、(2, 1) 成分は 15 − 15 = 0、(2, 2) 成分は 22 − 20 − 2 = 0 で、O になります。一般に、A = (a b；c d) について A² − (a + d)A + (ad − bc)E = O が成り立ちます。これをケーリー・ハミルトンの定理といいます（わけは 6 日目）。この式を A² = (a + d)A − (ad − bc)E と見ると、A² や A³ を A と E だけで表して計算できます。
