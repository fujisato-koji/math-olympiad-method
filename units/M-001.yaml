        text: A = (a b；c d) で ad − bc ≠ 0 のとき、X = (1/(ad − bc))(d −b；−c a) が AX = XA = E を満たすわけを、すじみちを立てて書きましょう。図の Y = (d −b；−c a) を使います。
        svg: '<svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg"><path d="M32 26 Q24 56 32 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M94 26 Q102 56 94 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="48" y="48.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">a</text><text x="78" y="48.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">b</text><text x="48" y="74.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">c</text><text x="78" y="74.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">d</text><text x="63" y="19" font-size="15" text-anchor="middle" fill="currentColor">A</text><path d="M114 26 Q106 56 114 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M184 26 Q192 56 184 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="132" y="48.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">d</text><text x="166" y="48.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">−b</text><text x="132" y="74.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">−c</text><text x="166" y="74.5" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">a</text><text x="149" y="19" font-size="15" text-anchor="middle" fill="currentColor">Y</text><text x="203" y="62.3" font-size="18" text-anchor="middle" fill="currentColor">=</text><path d="M222 26 Q214 56 222 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M288 26 Q296 56 288 86" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="230" y="34" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.6"/><rect x="262" y="34" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.6"/><rect x="230" y="60" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.6"/><rect x="262" y="60" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.6"/><text x="255" y="19" font-size="15" text-anchor="middle" fill="currentColor">AY</text></svg>'
        explain: 例：「Δ = ad − bc（Δ ≠ 0）とし、Y = (d −b；−c a) とする。AY の (1, 1) 成分は ad + b(−c) = Δ、(1, 2) 成分は a(−b) + ba = 0、(2, 1) 成分は cd + d(−c) = 0、(2, 2) 成分は c(−b) + da = Δ なので、AY = ΔE である。YA の成分も、(1, 1) が da − bc = Δ、(1, 2) が db − bd = 0、(2, 1) が −ca + ac = 0、(2, 2) が −cb + ad = Δ で、YA = ΔE である。Δ ≠ 0 なので X = (1/Δ)Y とおくことができ、AX = (1/Δ)(AY) = (1/Δ)ΔE = E、同じく XA = E となる。よって X は A の逆行列である。」と書ければよい。①「〜とする」で Δ と Y を決める、② AY と YA を成分ごとに計算して ΔE にまとめる、③ 約束した事実（実数倍は積のどこに出してもよい、逆行列の定義）で結ぶ、の 3 つがそろっているかを見る。AY だけを計算して YA をわすれやすい（行列の積は順で変わるので、両方が要る）。(3 1；5 2) のような例で確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。
