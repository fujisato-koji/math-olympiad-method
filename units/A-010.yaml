        explain: 例：「2 つの偶数を 2m、2n（m、n は整数）とする。和は 2m + 2n = 2(m + n)。m + n は整数なので、2(m + n) は 2 × 整数 で、偶数である。よって、偶数と偶数の和は偶数である。」と書ければよい。①「〜とする」で文字を決める、② 式を変形する、③「2 × 整数 だから偶数」と結ぶ、の 3 つがそろっているかを見る。2 つの偶数をどちらも 2n とすると同じ数どうしの和しか示せないことにも気づかせる。
