# A-010 文字と式（□から文字へ）
#
# 書き方は N-001 の頭の注のとおり。
# 答えを打つ鍵盤は 0〜9 だけ（3 けたまで）なので、式・分数・負の数の答えは choices にする。
# 式を選ぶ問題の check は、選択肢ごとの式（lambda）に数を入れ、場面の計算と合うもの、
# または元の式とどの数でも等しいものを選び出す。式の書き方のきまりだけを問う問題は計算で確かめられないので check を付けない。
# 作ったときは前提に N-027（正負の数のかけ算）と A-009（累乗）がなかったので、負の数を文字に入れるのはたし算とひき算の形だけにし、
# a × a を a² と書くきまりは扱っていない。2026-11-08 に 2 つを前提に足した。負の数のかけ算の代入と a² の問題は、足してよい。
# 方程式を解くのは A-011。ここでは □ を求めるところまで（A-002）。

id: A-010
days:
  - day: 1
    items:
      - part: 見本
        text: 1 個 □ 円のりんごを 3 個買うと、代金は □ × 3 円です。□ の代わりに文字を使って表してみましょう。
        explain: □ の代わりに文字 x を使うと、代金は x × 3 円と書けます。x には、いろいろな数を入れられます。x が 100 なら 100 × 3 = 300 円、x が 120 なら 120 × 3 = 360 円です。x × 3 という 1 つの式で、どの値段のときの代金も表せます。文字は「まだわからない数」にも「どんな数でも」にも使えます。
      - part: 思い出す
        text: □ + 7 = 15 のとき、□ にあてはまる数はいくつですか。
        answer: 8
        check: "15 - 7"
        hints:
          - □ にいくつを入れると 15 になるかを考えよう。
          - 線分図で、15 を 7 と □ に分けてみよう。
          - 全体から 7 をひくと、□ が残るね。
        paths:
          - [15 は 7 と □ に分かれる, □ = 15 − 7, 8]
      - part: 思い出す
        text: □ × 4 = 36 のとき、□ にあてはまる数はいくつですか。
        answer: 9
        check: "36 // 4"
        hints:
          - □ が 4 つ分で 36 になる、と読もう。
          - 4 の段の九九で、36 になるのはどれかな。
          - 36 を 4 つに同じだけ分けると考えてもよい。
        paths:
          - [□ の 4 つ分が 36, □ = 36 ÷ 4, 9]
      - part: 今日
        text: 1 本 a 円の鉛筆を 5 本買ったときの代金を、文字を使った式で表すと、どれですか。
        choices: [a × 5 円, a + 5 円, a ÷ 5 円]
        answer: a × 5 円
        check: "[c for c, f in {'a × 5 円': lambda a: a * 5, 'a + 5 円': lambda a: a + 5, 'a ÷ 5 円': lambda a: a / 5}.items() if f(80) == 80 + 80 + 80 + 80 + 80][0]"
        hints:
          - 1 本が 80 円だったら、5 本でいくらか考えよう。
          - そのときに使った計算の 80 を、a に置きかえよう。
          - 1 本の値段 × 本数 の形になっているかを見よう。
        paths:
          - [1 本 80 円なら 80 × 5, 80 を a にする, a × 5 円]
        note: 数で考えてから文字に置きかえる道を、くり返し使わせる。
      - part: 今日
        text: x 円のノートを買って、1000 円を出しました。おつりを表す式は、どれですか。
        choices: [1000 − x 円, x − 1000 円, 1000 × x 円]
        answer: 1000 − x 円
        check: "[c for c, f in {'1000 − x 円': lambda x: 1000 - x, 'x − 1000 円': lambda x: x - 1000, '1000 × x 円': lambda x: 1000 * x}.items() if f(150) == 850][0]"
        hints:
          - ノートが 150 円だったら、おつりはいくらかな。
          - そのときの計算の 150 を、x に置きかえよう。
          - 出したお金とノートの値段の、どちらからどちらをひくかに気をつけよう。
        paths:
          - [150 円なら 1000 − 150, 150 を x にする, 1000 − x 円]
        note: ひく順を逆にして x − 1000 を選びやすい。数を入れて、答えがおかしくならないかを確かめさせる。
      - part: 今日
        text: 1 辺が a cm の正方形があります。まわりの長さを表す式は、どれですか。
        choices: [a × 4 cm, a × a cm, a + 4 cm]
        answer: a × 4 cm
        check: "[c for c, f in {'a × 4 cm': lambda a: a * 4, 'a × a cm': lambda a: a * a, 'a + 4 cm': lambda a: a + 4}.items() if f(3) == 3 + 3 + 3 + 3][0]"
        hints:
          - 1 辺が 3 cm なら、まわりの長さは何 cm かな。
          - 正方形には、同じ長さの辺がいくつあるかな。
          - 3 を a に置きかえよう。
        paths:
          - [1 辺 3 cm なら 3 × 4, 3 を a にする, a × 4 cm]
        note: a × a は面積。まわりの長さと面積をまぜていないかを見る。
      - part: 挑戦
        text: マッチ棒で、正方形を横につなげて並べます。正方形が n 個のときに使うマッチ棒の本数を表す式は、どれですか。
        figure: "□ 4 本\n□□ 7 本\n□□□ 10 本"
        choices: [4 × n, 3 × n + 1, n + 3]
        answer: 3 × n + 1
        check: "[c for c, f in {'4 × n': lambda n: 4 * n, '3 × n + 1': lambda n: 3 * n + 1, 'n + 3': lambda n: n + 3}.items() if all(f(n) == 4 + 3 * (n - 1) for n in range(1, 10))][0]"
        hints:
          - 正方形が 1 個ふえると、マッチ棒は何本ふえるかな。
          - 左はしの 1 本を先に置いて、あとは何本ずつ足すと考えてみよう。
          - 正方形が n 個のとき、その「何本ずつ」のまとまりはいくつあるかな。
        paths:
          - [左はしに 1 本, 正方形 1 個ごとに 3 本, 3 × n + 1]
          - [1 個目は 4 本、あとは 3 本ずつ, 4 + 3 × (n − 1), 3 × n + 1 と同じ]
        note: 4 × n を選びやすい。となりどうしで 1 本を共有していることに気づかせる。2 本目の道の 4 + 3 × (n − 1) も正しい式で、まとめると 3 × n + 1 になる（5 日目）。
    extra:
      - part: 今日
        text: 1 個 x g のおもり 6 個の重さを表す式は、どれですか。
        choices: [x × 6 g, x + 6 g, 6 ÷ x g]
        answer: x × 6 g
        check: "[c for c, f in {'x × 6 g': lambda x: x * 6, 'x + 6 g': lambda x: x + 6, '6 ÷ x g': lambda x: Fraction(6, x)}.items() if f(20) == 20 * 6][0]"
        hints:
          - おもりが 1 個 20 g だったら、6 個で何 g かな。
          - そのときの計算の 20 を、x に置きかえよう。
          - 1 個の重さ × 個数 の形になっているかを見よう。
        paths:
          - [1 個 20 g なら 20 × 6, 20 を x にする, x × 6 g]
      - part: 今日
        text: a cm のテープから 20 cm を切り取りました。残りの長さを表す式は、どれですか。
        choices: [a − 20 cm, 20 − a cm, a ÷ 20 cm]
        answer: a − 20 cm
        check: "[c for c, f in {'a − 20 cm': lambda a: a - 20, '20 − a cm': lambda a: 20 - a, 'a ÷ 20 cm': lambda a: Fraction(a, 20)}.items() if f(100) == 80][0]"
        hints:
          - テープが 100 cm だったら、残りは何 cm かな。
          - そのときの計算の 100 を、a に置きかえよう。
          - どちらからどちらをひくかに気をつけよう。
        paths:
          - [100 cm なら 100 − 20, 100 を a にする, a − 20 cm]
      - part: 挑戦
        text: 1 個 x 円のりんごを 3 個買ったときの代金は x × 3 円です。x が 150 のとき、代金は何円ですか。
        answer: 450
        check: "150 * 3"
        hints:
          - x のところに 150 を入れよう。
          - 150 × 3 を計算しよう。
          - 100 × 3 と 50 × 3 に分けて計算してもよい。
        paths:
          - [x に 150 を入れる, 150 × 3, 450 円]

  - day: 2
    items:
      - part: 見本
        text: x × 7 を、文字式の書き方のきまりにしたがって書きましょう。
        explain: 文字式は、次のきまりで書きます。① × は書かない。② 数は文字の前に書く。③ 1 × a は a と書く（1 は書かない）。④ 文字どうしは、ふつうアルファベットの順に並べる（b × a は ab）。⑤ ÷ は使わず、分数の形にする（x ÷ 4 は x/4 と書き、「4 分の x」と読む）。+ と − は省かない。だから x × 7 は 7x です。
      - part: 思い出す
        text: 1 個 x 円のパンを 4 個買ったときの代金を表す式は、どれですか。
        choices: [x × 4 円, x + 4 円, 4 ÷ x 円]
        answer: x × 4 円
        check: "[c for c, f in {'x × 4 円': lambda x: x * 4, 'x + 4 円': lambda x: x + 4, '4 ÷ x 円': lambda x: Fraction(4, x)}.items() if f(120) == 120 * 4][0]"
        hints:
          - パンが 1 個 120 円だったら、4 個でいくらかな。
          - そのときの計算の 120 を、x に置きかえよう。
          - 1 個の値段 × 個数 の形になっているかを見よう。
        paths:
          - [1 個 120 円なら 120 × 4, 120 を x にする, x × 4 円]
      - part: 思い出す
        text: 1 本 x 円のジュースを 6 本買ったときの代金は x × 6 円です。x が 30 のとき、代金は何円ですか。
        answer: 180
        check: "30 * 6"
        hints:
          - x のところに 30 を入れよう。
          - 30 × 6 を計算しよう。
          - 3 × 6 を先に計算して、10 倍してもよい。
        paths:
          - [x に 30 を入れる, 30 × 6, 180 円]
      - part: 今日
        text: a × b × 3 を、きまりにしたがって書くと、どれですか。
        choices: [3ab, ab3, 3 × ab]
        answer: 3ab
        hints:
          - × は書かないきまりだったね。
          - 数は、文字の前と後ろのどちらに書くかな。
          - 文字はアルファベットの順に並べよう。
        paths:
          - [× を消す, 数 3 を前に出す, 3ab]
      - part: 今日
        text: y ÷ 5 を、きまりにしたがって書くと、どれですか。
        choices: [y/5, 5/y, 5y]
        answer: y/5
        hints:
          - ÷ は使わずに、分数の形にするきまりだね。
          - わられる数が分子、わる数が分母になるよ。
          - 3 ÷ 5 を分数にすると 3/5 だったことを思い出そう。
        paths:
          - [÷ を分数にする, わられる y が分子、わる 5 が分母, y/5]
        note: 5/y を選びやすい。3 ÷ 5 = 3/5 のように数で確かめさせる。
      - part: 今日
        text: x × 1 + 4 を、きまりにしたがって書くと、どれですか。
        choices: [x + 4, 1x + 4, x1 + 4]
        answer: x + 4
        hints:
          - × は書かないきまりだったね。
          - 1 × x のときの 1 は、どう書くきまりだったかな。
          - + は省かないよ。
        paths:
          - [x × 1 は x, + 4 はそのまま, x + 4]
      - part: 挑戦
        text: a × 2 − b ÷ 3 を、きまりにしたがって書くと、どれですか。
        choices: [2a − b/3, 2a − 3/b, a2 − b3]
        answer: 2a − b/3
        hints:
          - a × 2 と b ÷ 3 に分けて、それぞれ書き直そう。
          - ÷ は分数の形にするきまりだったね。
          - − は省かないよ。
        paths:
          - [a × 2 は 2a, b ÷ 3 は b/3, 2a − b/3]
    extra:
      - part: 今日
        text: m × 8 を、きまりにしたがって書くと、どれですか。
        choices: [8m, m8, 8 + m]
        answer: 8m
        hints:
          - × は書かないきまりだね。
          - 数は文字の前に書くよ。
          - 8 と m の順番を見よう。
        paths:
          - [× を消す, 数 8 を前に出す, 8m]
      - part: 今日
        text: (x + 3) × 2 を、きまりにしたがって書くと、どれですか。
        choices: [2(x + 3), (x + 3)2, 2x + 3]
        answer: 2(x + 3)
        hints:
          - かっこは、1 つのまとまりとして数と同じように扱うよ。
          - 数は前に書くきまりだったね。
          - かっこを勝手に消すと、意味が変わらないかな。
        paths:
          - [(x + 3) を 1 つのまとまりとみる, 数 2 を前に出す, 2(x + 3)]
        note: 2x + 3 を選ぶと、2 が x にしかかかっていない。かっこを外すのは 5 日目。
      - part: 今日
        text: 4ab を、× を使って書くと、どれですか。
        choices: [4 × a × b, 4 + a + b, 4 × a + b]
        answer: 4 × a × b
        hints:
          - 文字式では、どの記号が省かれていたかな。
          - 4 と a と b のあいだに、省いた記号をもどそう。
          - + は省かないきまりだったね。
        paths:
          - [省かれているのは ×, 4 × a × b]

  - day: 3
    items:
      - part: 思い出す
        text: b × a × 6 を、きまりにしたがって書くと、どれですか。
        choices: [6ab, ba6, 6 + ab]
        answer: 6ab
        hints:
          - × は書かないきまりだね。
          - 数は文字の前に書くよ。
          - 文字はアルファベットの順に並べよう。
        paths:
          - [× を消す, 6 を前に出す, a と b を順に並べる, 6ab]
      - part: 思い出す
        text: x ÷ 3 を、きまりにしたがって書くと、どれですか。
        choices: [x/3, 3/x, 3x]
        answer: x/3
        hints:
          - ÷ は使わずに、分数の形にするきまりだね。
          - わられる数が分子、わる数が分母になるよ。
          - 2 ÷ 3 = 2/3 と比べてみよう。
        paths:
          - [÷ を分数にする, x が分子、3 が分母, x/3]
      - part: 今日
        text: 時速 x km で 3 時間進んだときの道のりを表す式は、どれですか。
        choices: [3x km, x/3 km, (x + 3) km]
        answer: 3x km
        check: "[c for c, f in {'3x km': lambda x: 3 * x, 'x/3 km': lambda x: Fraction(x, 3), '(x + 3) km': lambda x: x + 3}.items() if f(40) == 40 * 3][0]"
        hints:
          - 時速 40 km で 3 時間進むと、何 km 進むかな。
          - そのときの計算の 40 を、x に置きかえよう。
          - 道のり ＝ 速さ × 時間 だったね。
        paths:
          - [時速 40 km なら 40 × 3, 40 を x にする, x × 3 は 3x km]
      - part: 今日
        text: a 円の 30 % は何円ですか。式で表したものを選びましょう。
        choices: [3a/10 円, 30a 円, a/30 円]
        answer: 3a/10 円
        check: "[c for c, f in {'3a/10 円': lambda a: Fraction(3 * a, 10), '30a 円': lambda a: 30 * a, 'a/30 円': lambda a: Fraction(a, 30)}.items() if f(200) == 60][0]"
        hints:
          - 200 円の 30 % は何円かな。
          - 30 % は、小数や分数で表すといくつかな。
          - 200 を a に置きかえて、きまりにしたがって書こう。
        paths:
          - [30 % は 3/10, a × 3/10, 3a/10 円]
          - [30 % は 0.3, a × 0.3, 0.3a 円（3a/10 円と同じ）]
        note: 30 % を 30 として 30a を選びやすい。0.3a と書いても正しいことを伝える。
      - part: 今日
        text: x 人に、紙を 1 人 4 枚ずつ配ると 6 枚余りました。紙は全部で何枚ですか。式で表したものを選びましょう。
        choices: [4x + 6 枚, 4x − 6 枚, 6x + 4 枚]
        answer: 4x + 6 枚
        check: "[c for c, f in {'4x + 6 枚': lambda x: 4 * x + 6, '4x − 6 枚': lambda x: 4 * x - 6, '6x + 4 枚': lambda x: 6 * x + 4}.items() if f(10) == 4 * 10 + 6][0]"
        hints:
          - 10 人だったら、配った紙は何枚かな。
          - 配った紙と余った紙を合わせると、全部の枚数になるね。
          - 線分図で、配った分と余った分を並べてかいてみよう。
        paths:
          - [配った紙は 4 × x 枚, 余った 6 枚を足す, 4x + 6 枚]
      - part: 挑戦
        text: 十の位の数字が a、一の位の数字が b の 2 けたの整数を表す式は、どれですか。
        choices: [10a + b, ab, a + b]
        answer: 10a + b
        check: "[c for c, f in {'10a + b': lambda a, b: 10 * a + b, 'ab': lambda a, b: a * b, 'a + b': lambda a, b: a + b}.items() if f(3, 7) == 37][0]"
        hints:
          - 37 は、10 がいくつと 1 がいくつでできているかな。
          - 十の位の 3 は、ほんとうはいくつを表しているかな。
          - 3 を a に、7 を b に置きかえよう。
        paths:
          - [37 は 10 が 3 つと 1 が 7 つ, 10 × 3 + 7, 10a + b]
        note: ab を選びやすい。文字式の ab は a × b の意味で、37 は 3 × 7 ではない。この式は、整数の性質を文字で示すとき（6 日目、N-028）に使う。
    extra:
      - part: 今日
        text: 1 個 x 円のケーキ 2 個と、150 円のジュース 1 本の代金を表す式は、どれですか。
        choices: [2x + 150 円, 2(x + 150) 円, x + 300 円]
        answer: 2x + 150 円
        check: "[c for c, f in {'2x + 150 円': lambda x: 2 * x + 150, '2(x + 150) 円': lambda x: 2 * (x + 150), 'x + 300 円': lambda x: x + 300}.items() if f(300) == 300 * 2 + 150][0]"
        hints:
          - ケーキが 1 個 300 円だったら、代金はいくらかな。
          - ケーキの代金とジュースの代金を、別々に書こう。
          - 300 を x に置きかえよう。
        paths:
          - [ケーキは 2x 円, ジュースは 150 円, 2x + 150 円]
      - part: 今日
        text: y km の道のりを、時速 4 km で歩くときにかかる時間を表す式は、どれですか。
        choices: [y/4 時間, 4y 時間, (y − 4) 時間]
        answer: y/4 時間
        check: "[c for c, f in {'y/4 時間': lambda y: Fraction(y, 4), '4y 時間': lambda y: 4 * y, '(y − 4) 時間': lambda y: y - 4}.items() if f(12) == 12 // 4][0]"
        hints:
          - 12 km を時速 4 km で歩くと、何時間かかるかな。
          - 時間 ＝ 道のり ÷ 速さ だったね。
          - ÷ は分数の形にするきまりだよ。
        paths:
          - [12 km なら 12 ÷ 4, 12 を y にする, y ÷ 4 は y/4 時間]
      - part: 挑戦
        text: 3 回のテストの点数が a 点、b 点、c 点でした。平均点を表す式は、どれですか。
        choices: [(a + b + c)/3 点, a + b + c/3 点, 3(a + b + c) 点]
        answer: (a + b + c)/3 点
        check: "[c for c, f in {'(a + b + c)/3 点': lambda a, b, c: Fraction(a + b + c, 3), 'a + b + c/3 点': lambda a, b, c: a + b + Fraction(c, 3), '3(a + b + c) 点': lambda a, b, c: 3 * (a + b + c)}.items() if f(60, 70, 80) == 70][0]"
        hints:
          - 60 点、70 点、80 点のときの平均は何点かな。
          - 平均 ＝ 合計 ÷ 回数 だったね。
          - 合計をひとまとまりにするには、何を使えばよいかな。
        paths:
          - [合計は a + b + c, 3 でわる, (a + b + c)/3 点]
        note: a + b + c/3 は c だけを 3 でわっている。かっこでまとまりを示す大切さを話す。

  - day: 4
    items:
      - part: 見本
        text: x = 4 のとき、3x + 5 の値を求めましょう。
        explain: 文字に数を入れることを「代入する」といい、代入して計算した結果を「式の値」といいます。3x は 3 × x のことなので、x に 4 を代入すると 3 × 4 + 5 = 12 + 5 = 17。式の値は 17 です。
      - part: 思い出す
        text: 時速 x km で 2 時間進んだときの道のりを表す式は、どれですか。
        choices: [2x km, x/2 km, (x + 2) km]
        answer: 2x km
        check: "[c for c, f in {'2x km': lambda x: 2 * x, 'x/2 km': lambda x: Fraction(x, 2), '(x + 2) km': lambda x: x + 2}.items() if f(50) == 50 * 2][0]"
        hints:
          - 時速 50 km で 2 時間進むと、何 km かな。
          - そのときの計算の 50 を、x に置きかえよう。
