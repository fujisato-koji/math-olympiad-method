        explain: 26 は 7 のまとまり 3 つとのこり 5、19 は 7 のまとまり 2 つとのこり 5 です。合わせると、7 のまとまり 5 つと、のこり 5 + 5 = 10 です。7 のまとまりは 7 でわり切れるので、あまりはのこりの 10 で決まります。10 ÷ 7 = 1 あまり 3 なので、答えは 3 です。26 + 19 = 45、45 ÷ 7 = 6 あまり 3 で、同じになります。和のあまりは、あまりどうしをたして、わる数と同じか大きければ、もう一度わります。2 倍は同じ数を 2 回たすことなので、あまりも 2 倍してからわります。
