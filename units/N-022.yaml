      - part: わけ
        id: "a083321bf1"
        text: 72 は 9 の倍数です。位の数の和 7 + 2 = 9 を見るだけで、72 が 9 の倍数だとわかるわけを、文に書きましょう。
        explain: たとえば、「72 は 10 が 7 こと 2。10 は 9 と 1 なので、10 が 7 こは、9 が 7 こと 1 が 7 こ。9 が 7 こは 9 でわり切れるので、72 を 9 でわったあまりは、のこりの 7 と 2 をたした 7 + 2 = 9 で決まる。9 は 9 でわり切れるので、72 も 9 の倍数。」と書ければよい。十の位の数がいくつでも、10 が何こかは「9 が何こか」と「1 が何こか」に分けられるので、どの 2 けたの数でも位の数の和で見分けられる。9 が 3 の倍数なので、3 の倍数も同じように見分けられる。「72 = 9 × 8 だから」だけでは、72 が 9 の倍数であるわけにはなるが、位の数の和でよいわけにはならない。
        hints:
