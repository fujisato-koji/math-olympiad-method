        text: 26 ÷ 7 も 19 ÷ 7 も、あまりは 5 です。26 + 19 を 7 でわったあまりは、のこりどうしをたした 5 + 5 = 10 を、もう一度 7 でわった 3 です。7 のまとまりは、合わせても 7 でわり切れるからです。
