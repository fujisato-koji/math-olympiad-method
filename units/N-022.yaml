    note: 2⁵⁰ はとても大きいが、あまりだけを追えばよい（何倍のあまり）。あまりの並びがくり返すこと（1 日目のくり返し）と、くり返しの何番目かをわり算で決めることを合わせる。累乗（A-009）を「2 倍をくり返す」と読む。
  - part: 離
    kinds: [数, 道筋]
    text: 1 から 20 までの数を順にすき間なく書きならべて、1234567891011121314151617181920 という 31 けたの数を作りました。この数を 9 でわると、あまりはいくつですか。
    answer: 3
    check: "(sum(k * 10 ** (9 - k + 22) for k in range(1, 10)) + sum(k * 10 ** (2 * (20 - k)) for k in range(10, 21))) % 9"
    hints:
      - 31 けたの数でも、9 でわったあまりは位の数の和でわかるかな。10、100、1000 を 9 でわったあまりを考えよう。
      - 100 = 99 + 1、1000 = 999 + 1 のように、どの位の 1 も 9 でわると 1 あまるね。だから、すべての位の数字をたせばよいよ。
      - 1 から 9 の数字の和、10 から 19 の十の位の数字の和と一の位の数字の和、20 の数字の和を、それぞれ出そう。
    paths:
      - [どの位の 1 も 9 でわると 1 あまるので、位の数字の和を 9 でわればよい, 1 から 9 の数字の和は 45, 10 から 19 は十の位が 1 × 10 = 10、一の位が 45、20 は 2, 45 + 10 + 45 + 2 = 102 で、102 = 99 + 3 なので 3]
      - [書きならべた 1 つ 1 つの数を、そのまま 9 でわったあまりで考えてもよい, 1 + 2 + … + 20 = 210, 210 の位の数の和は 3 なので 3]
    note: 2 けたで習った「位の数の和」のきまり（10 = 9 + 1）を、何けたの数にものばす（100 = 99 + 1、1000 = 999 + 1）。31 けたの数のわり算はできないので、きまりのわけを使えるかを見る。2 本目は、各位の和を数ごとにまとめると 1 から 20 の和と同じあまりになる、という見方。
  - part: 離
    kinds: [読み取り, 手数]
    text: ある年の 4 月 10 日は月曜日です。4 月は 30 日、5 月は 31 日、6 月は 30 日まであります。この年の 7 月 20 日は何曜日ですか。
    choices: [月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日, 日曜日]
    answer: 木曜日
    check: "'月火水木金土日'[(30 - 10 + 31 + 30 + 20) % 7] + '曜日'"
    hints:
      - 4 月 10 日から 7 月 20 日まで、何日後かを数えよう。月ごとに分けるといいよ。
      - 4 月 10 日から 5 月 10 日までは何日かな。4 月が 30 日まであることを使おう。
      - 何日後かを 7 でわったあまりの分だけ、月曜日から曜日を進めよう。
    paths:
      - [4 月 10 日から 5 月 10 日までは 30 日、6 月 10 日までは 31 日、7 月 10 日までは 30 日, 7 月 20 日は 30 + 31 + 30 + 10 = 101 日後, 101 = 98 + 3 なので 7 でわると 3 あまる, 月曜日から 3 つ進んで木曜日]
    note: 月ごとの日数を読み取り、何日後かを出してから曜日（1 日目の型）に進む。はしの日を数えるか数えないかで 1 日ずれやすい（4 月 10 日から 4 月 30 日までは 20 日後）。
  - part: 離
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - C-006
    - L-007
    text: 円の形にならんだ 9 つのせきに、1 から 9 までの番号がついています（せき 9 とせき 1 もとなり合います）。1 から 9 までの数を 1 つずつ書いた 9 まいのカードを、1 つのせきに 1 まいずつおきます。となり合う 2 つのせきのカードの数の和が、どれも 3 の倍数にならないようにします。おき方は全部で何通りありますか。
    answer: 7776
    check: sum(1 for p in itertools.permutations(range(1, 10)) if all((p[i] + p[(i + 1) % 9]) % 3 for i in range(9)))
    hints:
    - 1 から 9 を、3 でわったあまりで 3 つのなかまに分けよう。和が 3 の倍数になるのは、どのなかまとどのなかまのときかな。
    - あまり 0 のカードは、どうおくとよいかな。
    - あまりだけのならびは、いくつあるかな。
    paths:
    - - カードを 3 でわったあまりで分ける。あまり 0 は 3、6、9、あまり 1 は 1、4、7、あまり 2 は 2、5、8。2 つの数の和が 3 の倍数になるのは、あまりが 0 と 0 のときか、1 と 2 のとき。だから、あまり 0 どうしと、あまり 1 と 2 は、となりにおけない
      - あまり 0 の 3 まいは、どの 2 まいもとなり合わないので、円を 3 つの区切りに分け、どの区切りにも 1 まい以上ある。区切りの中ではあまり 1 と 2 がとなりにならないので、1 つの区切りは、全部あまり 1 か、全部あまり 2
      - あまり 1 の 3 まいと、あまり 2 の 3 まいで、3 つの区切りをうめる。両方とも 1 つの区切りにまとめると、のこりの区切りが空になり、両方とも 2 つ以上に分けると区切りが 4 つ以上いる。だから、一方のあまりは 1 つの区切りに 3 まいまとめ、もう一方は 2 つの区切りに 1 まいと 2 まいに分ける
      - あまりだけのならびは、どちらのあまりをまとめるか（2 通り）、時計回りに「3 まい、1 まい、2 まい」か「3 まい、2 まい、1 まい」か（2 通り）、3 まいの区切りのすぐ前のあまり 0 をどのせきにおくか（9 通り）で、2 × 2 × 9 = 36 通り
      - どのあまりのなかまも、3 まいの数の入れ方は 3 × 2 × 1 = 6 通りなので、36 × 6 × 6 × 6 = 7776 通り
    - - カードを 3 でわったあまりで分ける。あまり 0 は 3、6、9、あまり 1 は 1、4、7、あまり 2 は 2、5、8。2 つの数の和が 3 の倍数になるのは、あまりが 0 と 0 のときか、1 と 2 のとき。だから、あまり 0 どうしと、あまり 1 と 2 は、となりにおけない
      - あまり 0 のカードをいったんのぞき、のこる 6 まいを円のじゅんに見る。あまり 1 と 2 がつづく所には、あいだにあまり 0 のカードが入っていなければならない。あまり 0 は 3 まいで、どの 2 まいもとなり合わないので、6 まいのあいだの 6 か所のうち、ちがう所に 1 まいずつ入る
      - 円をひとまわりすると、あまりが 1 から 2 にかわる所と、2 から 1 にかわる所は同じ数だけある。かわる所にはあまり 0 が 1 まいずついるので、かわる所は 2 か所（4 か所なら 0 が 4 まいいる）。だから 6 まいは、あまり 1 が 3 まいつづき、あまり 2 が 3 まいつづく。かわる 2 か所に 0 を 1 まいずつ入れ、のこりの 1 まいは、同じあまりのあいだの 4 か所のどれか（4 通り）
      - あまりだけのならびは、この 4 通りのそれぞれで、1 から 2 にかわる所のあまり 0 をどのせきにおくか（9 通り）で決まるので、4 × 9 = 36 通り
      - どのあまりのなかまも、数の入れ方は 6 通りなので、36 × 6 × 6 × 6 = 7776 通り
    note: 工夫は 3 段：①和が 3 の倍数になる組を、あまりが「0 と 0」と「1 と 2」に言いかえる（余り、docs/hardest-structures.md の S09）、②あまり 0 の 3 まいが円を 3 つの区切りに分け、一方のあまりを 3 まいまとめ、もう一方を 1 まいと 2 まいにする場合分けを設計する（場合分けの設計、S15）、③あまりだけのならび 36 通りを、せきの番号に結びつけて数え（3 まいの区切りの前のあまり 0 のせきで 9 通り）、そのあとなかまごとの入れ方 6 × 6 × 6 をかける。1 本目は 0 の側から円を区切り、2 本目は 1 と 2 の側から、かわる所の数（偶数で、4 か所なら 0 が 4 まいいる）で場合を 1 つにしぼる。評価役（sonnet）の判定は、決勝の下のほうの水準。せきに番号があるので、回したおき方はちがうものと数える（回して同じものをまとめると 864 通り）。一列にならべるなら 12,528 通り。check は、9 まいのおき方 362,880 通りを全部調べ、となりの和がどれも 3 の倍数にならないものを数える（7776）。
