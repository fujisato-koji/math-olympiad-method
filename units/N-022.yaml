      - part: 今日
        id: "a639589abf"
        text: 50 をわると 2 あまる数は、ぜんぶで何こありますか。
        answer: 8
        check: "len([d for d in range(1, 51) if 50 % d == 2])"
        hints:
          - text: 50 から 2 をひいた数は、わる数でわり切れるね。
            svg: '<svg viewBox="0 0 320 114" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">50</text><rect x="16" y="44" width="276.5" height="36" rx="3" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="292.5" y="44" width="11.5" height="36" rx="3" fill="#f3c969" fill-opacity="0.8" stroke="currentColor" stroke-width="2"/><text x="154.2" y="68" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">48</text><text x="154.2" y="102" font-size="13" text-anchor="middle" fill="currentColor">わる数でわり切れる</text><line x1="298.2" y1="42" x2="298.2" y2="32" stroke="currentColor" stroke-width="1.5"/><text x="294.2" y="28" font-size="13" text-anchor="end" fill="currentColor">あまり 2</text></svg>'
          - わる数は、48 の《約数》になっているよ。かけ算の組で、もれなくさがそう。
          - あまりの 2 は、わる数より小さくなければいけないよ。
        paths:
          - [わる数は 48 の約数, 1、2、3、4、6、8、12、16、24、48, あまり 2 より大きい 3、4、6、8、12、16、24、48 の 8 こ]
        note: 1 と 2 も 48 の約数だが、1 や 2 でわるとあまりは 2 にならない。あまりはわる数より小さい（N-014）。
