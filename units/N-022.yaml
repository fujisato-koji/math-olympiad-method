# N-022 あまりの性質
#
# 書き方は N-001 の頭の注、文の漢字は N-017 にそろえた（段 3。分かち書きはしない）。「÷」は U+00F7、check は「%」と「//」。
# 前提は N-017（倍数と約数）まで。数は 100 まで（N-009 は前提にない）。わり算は N-014 と同じく商が 1 けたの形を基本にし、
#   それより大きい数は「何十とのこり」に分けて、あまりの和で求める（100 = 70 + 30。それがこの単元の中身）。
# あまりの性質は 3 つにした：
#   くり返し（あまりは、わる数ごとに同じ並びをくり返す。並びの何番目、曜日）、
#   和（あまりどうしをたして、わる数以上なら もう一度わる）、何倍（同じ数を何回かたすことなので、あまりも同じだけ倍にしてわる）。
#   ひき算のあまりは、あまりどうしのひき算が 0 より小さくならない場合だけにした（負の数の N-010 は前提にない）。
#   2 つの数の積のあまり（13 × 17 を 5 でわる）は、分けて計算するきまり（N-015）が前提にないので扱わない（N-028 であまりで分類するときに）。
# 3 と 9 の倍数の見分け方（位の数の和）は N-017 から受けた。10 を 9 でわると 1 あまることから、あまりの和で導く（4 日目のわけ）。
#   9 でわったあまりも位の数の和でわかることまで扱う。2 けたの数だけ（3 けたは N-009 が前提にない）。
# 「偶数」「奇数」の語は使わない（N-008 が前提にない）。文字で表すこと（A-010）と、あまりの類・合同式（段 6）は先取りしない。
# あまりの和の問題の check は、そのあまりになる数をぜんぶためし、和のあまりの集まり {…} が 1 つの数だけになることを
#   sum({…}) で確かめる（集まりに 2 つ以上の数があれば、答えと合わなくなる）。
# 曜日の check は、今日の曜日から始めた '月火水木金土日' の何文字目か。並びのくり返しは、1 まとまりの何文字目か。
# 日の並び（既定）：1 日目 あまりのくり返し（並び、曜日）、2 日目 和と何倍のあまり、3 日目 3 と 9 の倍数の見分け方、
#   4 日目 わけ、5 日目 N-017（倍数と約数）と N-014（わり算とあまり）と混ぜる、6 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-009、N-015 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: N-022
days:
  - day: 1
    items:
      - part: 見本
        text: 🔴🔵🟡 の 3 つを、この順にくり返してならべます。20 番目は何色ですか。
        figure: 🔴🔵🟡🔴🔵🟡🔴🔵🟡…
        explain: 🔴🔵🟡 の 3 こで 1 まとまりです。20 ÷ 3 = 6 あまり 2 なので、20 番目は、6 まとまり（18 番目まで）のあとの 2 番目です。まとまりの 2 番目は 🔵 なので、20 番目は 🔵 です。あまりが 0 のとき（18 番目や 21 番目）は、まとまりの最後の 🟡 になります。くり返しの何番目かは、わり算のあまりでわかります。
      - part: 思い出す
        text: 47 ÷ 6 のあまりはいくつですか。
        answer: 5
        check: "47 % 6"
        hints:
          - 6 の段の九九で、47 をこえない いちばん大きい答えはどれかな。
          - 47 から、その数をひこう。
          - あまりは、わる数の 6 より小さくなるよ。
        paths:
          - [6 × 7 = 42 で 47 をこえない, 47 − 42 = 5, 5]
      - part: 思い出す
        text: 次のうち、4 でわると 1 あまる数はどれですか。
        choices: [27, 33, 38]
        answer: 33
        check: "[c for c in (27, 33, 38) if c % 4 == 1][0]"
        hints:
          - 4 でわると 1 あまる数は、4 の《倍数》に 1 をたした数だね。
          - 27、33、38 のすぐ前の 4 の倍数は、それぞれいくつかな。
          - 4 の倍数より 1 大きいものをえらぼう。
        paths:
          - [27 = 24 + 3、33 = 32 + 1、38 = 36 + 2, 33]
      - part: 今日
        text: 🍎🍊🍋🍇 の 4 つを、この順にくり返してならべます。30 番目のくだものはどれですか。
        figure: 🍎🍊🍋🍇🍎🍊🍋🍇…
        choices: [🍎, 🍊, 🍋, 🍇]
        answer: 🍊
        check: "'🍎🍊🍋🍇'[(30 - 1) % 4]"
        hints:
          - いくつで 1 まとまりかな。
          - 30 ÷ 4 のあまりを求めよう。
          - あまりの数だけ、まとまりの最初から数えよう。
        paths:
          - [4 こで 1 まとまり, 30 ÷ 4 = 7 あまり 2, まとまりの 2 番目は 🍊]
        note: 商の 7 を見て 7 番目（または 3 番目の 🍋）と答えやすい。見るのはあまり。
      - part: 今日
        text: 今日は月曜日です。20 日後は何曜日ですか。
        choices: [月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日, 日曜日]
        answer: 日曜日
        check: "'月火水木金土日'[20 % 7] + '曜日'"
        hints:
          - 7 日ごとに、同じ曜日にもどるね。
          - 20 ÷ 7 のあまりを求めよう。
          - 月曜日から、あまりの日数だけ進めよう。
        paths:
          - [20 ÷ 7 = 2 あまり 6, 14 日後は月曜日, そこから 6 日進んで日曜日]
        note: 今日を 1 日目と数えて 1 日ずれやすい。今日は 0 日後。
      - part: 今日
        text: 5 でわると 2 あまる数を小さい順にならべると、2、7、12、…となります。10 番目の数はいくつですか。
        answer: 47
        check: "[x for x in range(100) if x % 5 == 2][9]"
        hints:
          - となりの数は、いくつずつ大きくなっているかな。
          - 10 番目は、2 に 5 を何回たした数かな。
          - 1 番目は、まだ 1 回もたしていないね。
        paths:
          - [5 ずつ大きくなる, 10 番目は 2 に 5 を 9 回たした数, 2 + 45 = 47]
        note: 5 を 10 回たして 52 としやすい。あまりが同じ数は、わる数ずつはなれている。
      - part: 挑戦
        text: 1 から 50 までの数を、それぞれ 4 でわります。あまりをぜんぶたすと、いくつになりますか。
        answer: 75
        check: "sum(x % 4 for x in range(1, 51))"
        hints:
          - 1、2、3、4 を 4 でわったあまりは、それぞれいくつかな。
          - あまりは、同じ並びをくり返すね。1 まとまりのあまりの和はいくつかな。
          - 50 までに、まとまりがいくつと、何こがのこるかな。
        paths:
          - [あまりは 1、2、3、0 のくり返しで、1 まとまりの和は 6, 48 までに 12 まとまりで 6 が 12 こ（60 + 12 = 72）, 49 と 50 のあまり 1 と 2 をたして 75]
    extra:
      - part: 今日
        text: 🔺⬛🔺⬛⬛ の 5 つを、この順にくり返してならべます。23 番目はどちらですか。
