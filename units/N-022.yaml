      - part: わけ
        id: "d257ff14ab"
        text: 23 を 5 でわるとあまりは 3、18 を 5 でわるとあまりは 3 です。23 + 18 を 5 でわったあまりが、3 + 3 = 6 を 5 でわったあまりと同じになるわけを、文に書きましょう。
        explain: たとえば、「23 は 5 のまとまり 4 つとのこり 3、18 は 5 のまとまり 3 つとのこり 3。合わせると 5 のまとまり 7 つと、のこり 3 + 3 = 6。5 のまとまりは 5 でわり切れるので、あまりはのこりの 6 だけで決まる。6 は 5 のまとまり 1 つと 1 なので、23 + 18 を 5 でわったあまりは 1。」と書ければよい。まとまりとのこりの図（〇を 5 こずつかこむ）で説明してもよい。41 ÷ 5 = 8 あまり 1 を計算して同じだとたしかめただけでは、同じになるわけにはならないことを話す。この数で書ければ十分で、どんな数でも成り立つことを文字で書くのは、もっと先で学ぶ。
