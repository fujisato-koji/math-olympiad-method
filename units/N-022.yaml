      - ["2³ = 8 は 7 でわると 1 あまる", "2⁶ は 2³ を 8 倍した数なので、あまりは 1 × 8 = 8 を 7 でわって 1。同じように 2⁹、2¹²、…、2⁴⁸ もどれも 1 あまる", "2⁵⁰ は 2⁴⁸ を 4 倍した数なので、あまりは 1 × 4 = 4"]
    note: 2⁵⁰ はとても大きいが、あまりだけを追えばよい（何倍のあまり）。あまりのならびがくり返すこと（1 日目のくり返し）と、くり返しの何番目かをわり算で決めることを合わせる。2 を何回もかけた数（A-009）を「2 倍をくり返す」と読む。
  - part: 離
    id: "74406294f9"
    kinds: [数, 道筋]
    text: 1 から 20 までの数をじゅんにすき間なく書きならべて、1234567891011121314151617181920 という 31 けたの数を作りました。この数を 9 でわると、あまりはいくつですか。
    answer: 3
    check: "(sum(k * 10 ** (9 - k + 22) for k in range(1, 10)) + sum(k * 10 ** (2 * (20 - k)) for k in range(10, 21))) % 9"
    hints:
      - 31 けたの数でも、9 でわったあまりは位の数の和でわかるかな。10、100、1000 を 9 でわったあまりを考えよう。
      - 100 = 99 + 1、1000 = 999 + 1 のように、どの位の 1 も 9 でわると 1 あまるね。だから、すべての位の数字をたせばよいよ。
      - text: 1 から 9 の数字の和、10 から 19 の十の位の数字の和と一の位の数字の和、20 の数字の和を、それぞれ出そう。
