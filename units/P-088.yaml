        paths:
          - ["準位がとびとび", "差もとびとび", "光子のエネルギーと波長もとびとび", "線スペクトル"]
          - ["準位が坂のように続くなら", "どんな差もとれて光は帯になる", "実際は線なので準位はとびとび"]
        explain: "「電子はとびとびのエネルギー準位の間しか移れない。移るときに出る光子のエネルギーは、準位の差で決まる。差がとびとびなので、光子の振動数もとびとびになり、決まった波長の線だけが現れる。」と書ければよい。① 準位がとびとび、② 光子は差、③ 波長もとびとび。図では、3→2、4→2、5→2 の 3 本の矢印が、それぞれ 1 本の色の線になる。子どもには、n=2→1 と n=3→2 の波長をくらべさせます。"

  - day: 3
    items:
      - part: 見本
        id: "1e65be2d91"
        text: |-
          《ボーア模型》：水素の電子は、決まった半径の円軌道の上しか回れません。ボーアは、電子の角運動量 mvr が ħ = h/2π の整数倍（nħ）に限られると考えました。
          左の図：n 番目の軌道の半径は r_n = n² a₀（a₀ = 5.3 × 10⁻¹¹ m、ボーア半径）。n=2 で 4 倍、n=3 で 9 倍です。
          右の図：エネルギー準位は E_n = −13.6/n² eV。n が大きいほど外側の軌道で、エネルギーは 0 に近づきます。
          電子が n₂ から n₁ へ移ると、hf = E_n₂ − E_n₁ の《光子》を 1 こ出します。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="72" y="15" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">軌道の半径</text><text x="250" y="15" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">エネルギー準位</text><circle cx="72" cy="106" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="72" cy="106" r="28" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="72" cy="106" r="63" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="72" cy="106" r="3" fill="#f08080" fill-opacity="1" stroke="currentColor" stroke-width="1"/><circle cx="27.5" cy="150.5" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><line x1="72" y1="106" x2="135" y2="106" stroke="currentColor" stroke-width="1.5"/><line x1="79" y1="101" x2="79" y2="111" stroke="currentColor" stroke-width="2"/><text x="72" y="95" font-size="12" text-anchor="middle" fill="currentColor">n=1</text><text x="80" y="125" font-size="12" text-anchor="middle" fill="currentColor">a₀</text><line x1="100" y1="101" x2="100" y2="111" stroke="currentColor" stroke-width="2"/><text x="72" y="73" font-size="12" text-anchor="middle" fill="currentColor">n=2</text><text x="100" y="125" font-size="12" text-anchor="middle" fill="currentColor">4a₀</text><line x1="135" y1="101" x2="135" y2="111" stroke="currentColor" stroke-width="2"/><text x="72" y="38" font-size="12" text-anchor="middle" fill="currentColor">n=3</text><text x="135" y="125" font-size="12" text-anchor="middle" fill="currentColor">9a₀</text><line x1="190" y1="172" x2="238" y2="172" stroke="currentColor" stroke-width="2"/><text x="184" y="176.5" font-size="12" text-anchor="end" fill="currentColor">n=1</text><text x="244" y="176.5" font-size="12" text-anchor="start" fill="currentColor">−13.6 eV</text><line x1="190" y1="112" x2="238" y2="112" stroke="currentColor" stroke-width="2"/><text x="184" y="116.5" font-size="12" text-anchor="end" fill="currentColor">n=2</text><text x="244" y="116.5" font-size="12" text-anchor="start" fill="currentColor">−3.4 eV</text><line x1="190" y1="82" x2="238" y2="82" stroke="currentColor" stroke-width="2"/><text x="184" y="86.5" font-size="12" text-anchor="end" fill="currentColor">n=3</text><text x="244" y="86.5" font-size="12" text-anchor="start" fill="currentColor">−1.51 eV</text><line x1="190" y1="62" x2="238" y2="62" stroke="currentColor" stroke-width="2"/><text x="184" y="66.5" font-size="12" text-anchor="end" fill="currentColor">n=4</text><text x="244" y="66.5" font-size="12" text-anchor="start" fill="currentColor">−0.85 eV</text><line x1="190" y1="36" x2="238" y2="36" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="184" y="40.5" font-size="12" text-anchor="end" fill="currentColor">n=∞</text><text x="244" y="40.5" font-size="12" text-anchor="start" fill="currentColor">0 eV</text><line x1="212" y1="112" x2="212" y2="163" stroke="#b39ddb" stroke-width="2.5"/><polygon points="212,172 207.5,163 216.5,163" fill="#b39ddb" stroke="none"/><path d="M216 150 L218 153.8 L220 152.4 L222 147.6 L224 146.2 L226 150 L228 153.8 L230 152.4 L232 147.6 L234 146.2 L236 150" fill="none" stroke="#b39ddb" stroke-width="2" stroke-linejoin="round"/><polygon points="245,150 236,145.5 236,154.5" fill="#b39ddb" stroke="none"/><text x="250" y="154" font-size="12" text-anchor="start" fill="currentColor">光子</text></svg>'
        explain: |-
          ボーア模型は「電子はとびとびのエネルギー準位のどれかにしかいられない」という模型です。
          n は内側から数えた準位の番号で、n=1 がもっとも低い基底状態、n が大きいほど外側でエネルギーが高いです。
          高い準位から低い準位へ移るとき、その差のエネルギーを光子として出します。だから出る光の色はとびとびになります。
          ｜記号｜意味｜
          ｜n｜準位の番号（1、2、3、…）｜
          ｜E_n｜n 番目のエネルギー準位｜
          ｜r_n｜n 番目の軌道半径｜
          ｜a₀｜ボーア半径。5.3 × 10⁻¹¹ m｜
          ｜h｜プランク定数｜
          ｜ħ｜h/2π｜
          ｜f｜光子の振動数｜
          ｜hf｜光子 1 個のエネルギー｜

          ｜n｜半径｜エネルギー｜
          ｜1｜a₀｜−13.6 eV｜
          ｜2｜4a₀｜−3.4 eV｜
          ｜3｜9a₀｜−1.51 eV｜
          例：n=2 → 1 の光子は −3.4 − (−13.6) = 10.2 eV。n=3 → 2 は約 1.89 eV。
          図の右の準位の間かくは見やすくした模式図で、実際の比ではない（左の半径は比のとおり）。
        note: "r_n = n²a₀、E_n = −13.6/n² eV。n=1 が基底状態。"
