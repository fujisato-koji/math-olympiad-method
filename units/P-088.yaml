  - day: 2
    items:
      - part: 見本
        id: "22273257ee"
        text: |-
          水素の光をプリズムで分けると、とびとびの色の線だけが見えます（線スペクトル）。
          電子が高いエネルギー準位 n₂ から低い準位 n₁ へ落ちると、《光子》を 1 こ出します。その《波長》 λ は、リュードベリの式 1/λ = R (1/n₁² − 1/n₂²) で決まります（R = 1.097 × 10⁷ m⁻¹）。
          落ちる先の n₁ で、系列の名前が決まります。図のむらさきの矢印（n₁ = 1）がライマン系列、緑（n₁ = 2）がバルマー系列、茶色（n₁ = 3）がパッシェン系列です。
          落ちる高さが大きいほど光子のエネルギーが大きく、波長は短くなります。ライマン系列は紫外線、バルマー系列は可視光（目に見える光）、パッシェン系列は赤外線です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="46" y1="158" x2="304" y2="158" stroke="currentColor" stroke-width="2"/><text x="40" y="162.5" font-size="13" text-anchor="end" fill="currentColor">n=1</text><line x1="46" y1="104" x2="304" y2="104" stroke="currentColor" stroke-width="2"/><text x="40" y="108.5" font-size="13" text-anchor="end" fill="currentColor">n=2</text><line x1="46" y1="76" x2="304" y2="76" stroke="currentColor" stroke-width="2"/><text x="40" y="80.5" font-size="13" text-anchor="end" fill="currentColor">n=3</text><line x1="46" y1="58" x2="304" y2="58" stroke="currentColor" stroke-width="2"/><text x="40" y="62.5" font-size="12" text-anchor="end" fill="currentColor">n=4</text><line x1="46" y1="44" x2="304" y2="44" stroke="currentColor" stroke-width="2"/><text x="40" y="48.5" font-size="12" text-anchor="end" fill="currentColor">n=5</text><line x1="46" y1="26" x2="304" y2="26" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="40" y="30.5" font-size="13" text-anchor="end" fill="currentColor">n=∞</text><line x1="72" y1="104" x2="72" y2="149" stroke="#b39ddb" stroke-width="2.5"/><polygon points="72,158 67.5,149 76.5,149" fill="#b39ddb" stroke="none"/><line x1="88" y1="76" x2="88" y2="149" stroke="#b39ddb" stroke-width="2.5"/><polygon points="88,158 83.5,149 92.5,149" fill="#b39ddb" stroke="none"/><line x1="104" y1="58" x2="104" y2="149" stroke="#b39ddb" stroke-width="2.5"/><polygon points="104,158 99.5,149 108.5,149" fill="#b39ddb" stroke="none"/><line x1="160" y1="76" x2="160" y2="95" stroke="#7bc96f" stroke-width="2.5"/><polygon points="160,104 155.5,95 164.5,95" fill="#7bc96f" stroke="none"/><line x1="176" y1="58" x2="176" y2="95" stroke="#7bc96f" stroke-width="2.5"/><polygon points="176,104 171.5,95 180.5,95" fill="#7bc96f" stroke="none"/><line x1="192" y1="44" x2="192" y2="95" stroke="#7bc96f" stroke-width="2.5"/><polygon points="192,104 187.5,95 196.5,95" fill="#7bc96f" stroke="none"/><line x1="250" y1="58" x2="250" y2="67" stroke="#c9a36b" stroke-width="2.5"/><polygon points="250,76 245.5,67 254.5,67" fill="#c9a36b" stroke="none"/><line x1="266" y1="44" x2="266" y2="67" stroke="#c9a36b" stroke-width="2.5"/><polygon points="266,76 261.5,67 270.5,67" fill="#c9a36b" stroke="none"/><text x="88" y="177" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">ライマン</text><text x="88" y="195" font-size="13" text-anchor="middle" fill="currentColor">紫外線</text><text x="176" y="177" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">バルマー</text><text x="176" y="195" font-size="13" text-anchor="middle" fill="currentColor">可視光</text><text x="258" y="177" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">パッシェン</text><text x="258" y="195" font-size="13" text-anchor="middle" fill="currentColor">赤外線</text></svg>'
        explain: |-
          ・高い準位 n₂ から低い準位 n₁ へ落ちると、エネルギー差に等しい光子を出す。
          ・波長はリュードベリの式 1/λ = R(1/n₁² − 1/n₂²) で決まる。n₁ が小さいほど短い。
          ｜系列｜落ちる先 n₁｜光の種類｜
          ｜ライマン｜1｜紫外線｜
          ｜バルマー｜2｜可視光｜
          ｜パッシェン｜3｜赤外線｜
          ・例：n=2 → n=1 は 1/λ = R(1 − 1/4) = 3R/4。
          ・図の準位の間かくは見やすくした模式図で、実際の比ではない。
        note: "1/λ = R(1/n₁² − 1/n₂²)。ライマン n₁=1、バルマー n₁=2、パッシェン n₁=3。"
