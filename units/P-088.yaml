  - part: 離
    id: "0755afdb67"
    kinds: [数]
    uses: [P-069]
    text: "図の矢印のように、水素の電子が n=2 から n=1 へ落ちます。このとき 1/λ は、R の何倍ですか。"
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="100" y1="172" x2="270" y2="172" stroke="currentColor" stroke-width="2"/><text x="94" y="176.5" font-size="13" text-anchor="end" fill="currentColor">n=1</text><line x1="100" y1="112" x2="270" y2="112" stroke="currentColor" stroke-width="2"/><text x="94" y="116.5" font-size="13" text-anchor="end" fill="currentColor">n=2</text><line x1="100" y1="82" x2="270" y2="82" stroke="currentColor" stroke-width="2"/><text x="94" y="86.5" font-size="13" text-anchor="end" fill="currentColor">n=3</text><line x1="100" y1="64" x2="270" y2="64" stroke="currentColor" stroke-width="2"/><text x="94" y="68.5" font-size="12" text-anchor="end" fill="currentColor">n=4</text><line x1="100" y1="30" x2="270" y2="30" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="94" y="34.5" font-size="13" text-anchor="end" fill="currentColor">n=∞</text><line x1="185" y1="112" x2="185" y2="163" stroke="#b39ddb" stroke-width="3"/><polygon points="185,172 180.5,163 189.5,163" fill="#b39ddb" stroke="none"/></svg>'
    choices: ["1/2", "3/4", "4/3", "2"]
    answer: "3/4"
    check: "Fraction(3, 4)"
    hints:
      - "落ちる先が n₁、出発する準位が n₂ です。図の矢印のはじめと終わりを読みましょう。"
      - text: "1/n₁² と 1/n₂² を、同じ長さの帯で表しました。色の長さのちがいを見ましょう。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="196" y="30" font-size="13" text-anchor="middle" fill="currentColor">帯の全体を 1 として、4 マスに分けました</text><text x="84" y="80" font-size="16" text-anchor="end" fill="currentColor">1/1²</text><rect x="96" y="58" width="50" height="32" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><rect x="146" y="58" width="50" height="32" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><rect x="196" y="58" width="50" height="32" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><rect x="246" y="58" width="50" height="32" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><rect x="96" y="58" width="200" height="32" fill="none" stroke="currentColor" stroke-width="2"/><text x="84" y="140" font-size="16" text-anchor="end" fill="currentColor">1/2²</text><rect x="96" y="118" width="50" height="32" fill="#7fc8f8" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><rect x="146" y="118" width="50" height="32" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="196" y="118" width="50" height="32" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="246" y="118" width="50" height="32" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="96" y="118" width="200" height="32" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
      - "1/λ = R (1/n₁² − 1/n₂²) の n₁ と n₂ に数を入れて、かっこの中を計算しましょう。"
    paths:
      - ["n₁ = 1、n₂ = 2", "1 − 1/4", "3/4"]
      - ["4 マスの帯で 4 − 1 = 3 マス", "3/4"]
    note: "リュードベリの式 1/λ = R(1/n₁² − 1/n₂²)。n₁=1 がライマン、2 がバルマー。"
