ze="14" text-anchor="end" fill="currentColor">2p</text><rect x="70" y="58" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><text x="64" y="75" font-size="14" text-anchor="end" fill="currentColor">3s</text><text x="216" y="50" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">炭素 Z=6</text></svg>'
