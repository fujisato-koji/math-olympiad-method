.8" r="7" fill="#c8ccd6" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5"/><circle cx="239.1" cy="121.7" r="7" fill="#c8ccd6" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5"/><circle cx="215.1" cy="107.8" r="7" fill="#c8ccd6" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5"/><circle cx="223.1" cy="66.3" r="7" fill="#c8ccd6" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5"/><circle cx="238" cy="45" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="238" cy="139" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="269.6" cy="34.1" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="295.9" cy="123.6" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="206.4" cy="149.9" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="180.1" cy="60.4" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="238" y="175" font-size="13" text-anchor="middle" fill="currentColor">陽子 6・中性子 8</text><circle cx="30" cy="190" r="7" fill="#f08080" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5"/><text x="42" y="195" font-size="13" text-anchor="start" fill="currentColor">陽子 +e</text><circle cx="128" cy="190" r="7" fill="#c8ccd6" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5"/><text x="140" y="195" font-size="13" text-anchor="start" fill="currentColor">中性子 0</text><circle cx="230" cy="190" r="6.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="242" y="195" font-size="13" text-anchor="start" fill="currentColor">電子 −e</text></svg>'
        explain: |-
          【定義】陽子の数 Z が、元素の種類を決めます。中性子の数 N がちがっても、元素は同じで、同位体になります。
          例：炭素は Z=6。質量数 12 の炭素は N=6、質量数 14 の炭素は N=8。
          原子は全体で電荷が 0（電気的に中性）なので、電子の数も Z です。図の電子も 6 こずつです。
          図の原子核は見やすくするため大きくかいています。実際の原子核は、原子の大きさの約 10 万分の 1 です。
        note: "A = Z + N。Z は陽子の数、A は陽子＋中性子。同じ Z で N がちがうと同位体。"
