# P-088 原子の構造とスペクトル
#
# 段 5・水準 3・8 日。前提は P-069（量子論の始まり）。
# 原子の構造、水素のスペクトル系列、ボーア模型、量子数、パウリの原理と電子配置を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-088
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          原子は、中心の原子核と、そのまわりの電子からできています。
          原子核は陽子と中性子からなり、陽子は +e、中性子は電荷 0。電子は −e。
          原子番号 Z は陽子の数、質量数 A は陽子と中性子の数の和。A = Z + N。
          同じ Z で N がちがう原子を同位体といいます。
        explain: |-
          【定義】陽子の数 Z が、元素の種類を決めます。中性子の数 N がちがっても、元素は同じで、同位体になります。
          例：炭素は Z=6。質量数 12 の炭素は N=6、質量数 14 の炭素は N=8。
          原子は電気的に中性なので、電子の数も Z です。
        note: A = Z + N。Z は陽子の数、A は陽子＋中性子。同じ Z で N がちがうと同位体。
      - part: 思い出す
        text: 陽子の数が 6、中性子の数が 6 の原子の質量数はいくつですか。
        choices: [6, 12, 18, 36]
        answer: 12
        check: "6 + 6"
        hints:
          - A = Z + N です。
          - 6 + 6 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [A = Z + N, 6 + 6 = 12]
      - part: 今日
        text: 陽子の数が 6、中性子の数が 8 の原子の質量数はいくつですか。
        choices: [6, 8, 14, 48]
        answer: 14
        check: "6 + 8"
        hints:
          - A = Z + N です。
          - 6 + 8 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [A = Z + N, 6 + 8 = 14]
      - part: 今日
        text: 同位体どうしで同じなのはどれですか。
        choices: ["陽子の数", "中性子の数", "質量数", "原子核の重さ"]
        answer: "陽子の数"
        check: "'陽子の数'"
        hints:
          - 同位体は、元素は同じで中性子の数がちがいます。
          - 元素を決めるのは陽子の数です。
          - 陽子の数が同じです。
        paths:
          - [元素は同じ, 陽子の数が同じ, 中性子がちがう]
      - part: 挑戦
        text: 電気的に中性な原子では、電子の数は何に等しいですか。
        choices: ["陽子の数", "中性子の数", "質量数", "陽子＋中性子"]
        answer: "陽子の数"
        check: "'陽子の数'"
        hints:
          - 陽子は +e、電子は −e です。
          - 全体の電荷が 0 になるには、同じ数だけ必要です。
          - 陽子の数に等しいです。
        paths:
          - [+e と −e, 電荷 0, 電子 = 陽子の数]
    extra:
      - part: 今日
        text: 陽子の数が 11、中性子の数が 12 の原子の質量数はいくつですか。
        choices: [11, 12, 23, 132]
        answer: 23
        check: "11 + 12"
        hints:
          - A = Z + N です。
          - 11 + 12 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [11 + 12 = 23]
      - part: 今日
        text: 原子核の中にある、電荷をもたない粒子はどれですか。
        choices: ["陽子", "中性子", "電子", "光子"]
        answer: "中性子"
        check: "'中性子'"
        hints:
          - 原子核は陽子と中性子からなります。
          - 電荷 0 の粒子です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [原子核の粒子, 電荷 0, 中性子]
      - part: わけ
        text: 原子が電気的に中性であるわけを説明しましょう。
        explain: 「陽子は +e、電子は −e の電荷をもつ。原子の中の陽子の数と電子の数が等しければ、+e と −e が同じ数だけあり、全体の電荷は 0 になる。」と書ければよい。① 陽子 +e、② 電子 −e、③ 同じ数。子どもには、Z=6 の炭素で確かめさせます。
        hints:
          - 陽子は +e、電子は −e です。
          - 同じ数だけあれば、電荷が打ち消し合います。
          - 陽子の数と電子の数が等しいです。
        paths:
          - [陽子 +e、電子 −e, 同じ数, 電荷 0]

  - day: 2
    items:
      - part: 見本
        text: |-
          水素原子のスペクトルは、とびとびの波長の線として現れます（線スペクトル）。
          リュードベリの式：1/λ = R (1/n₁² − 1/n₂²)。n₂ > n₁、R = 1.097 × 10⁷ m⁻¹。
          n₁ = 1 へ落ちる系列をライマン系列、n₁ = 2 をバルマー系列、n₁ = 3 をパッシェン系列といいます。
          ライマンは紫外、バルマーは可視、パッシェンは赤外です。
        explain: |-
          ・高い準位 n₂ から低い準位 n₁ へ落ちると、エネルギー差に等しい光子を出す。
          ・波長はリュードベリの式 1/λ = R(1/n₁² − 1/n₂²) で決まる。n₁ が小さいほど短い。
          ｜系列｜落ちる先 n₁｜光の領域｜
          ｜ライマン｜1｜紫外｜
          ｜バルマー｜2｜可視｜
          ｜パッシェン｜3｜赤外｜
          ・例：n=2 → n=1 は 1/λ = R(1 − 1/4) = 3R/4。
        note: 1/λ = R(1/n₁² − 1/n₂²)。ライマン n₁=1、バルマー n₁=2、パッシェン n₁=3。
      - part: 思い出す
        text: 水素原子で、n=2 から n=1 へ移るときの 1/λ は、R の何倍ですか。
        choices: ["1/2", "3/4", "4/3", "2"]
        answer: "3/4"
        check: "Fraction(3, 4)"
        hints:
          - 1/λ = R(1/1² − 1/2²) です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/λ = R(1−1/4), 3R/4]
      - part: 今日
        text: 水素原子で、n=3 から n=2 へ移るときの 1/λ は、R の何倍ですか。
        choices: ["1/4", "5/36", "1/9", "5/6"]
        answer: "5/36"
        check: "Fraction(5, 36)"
        hints:
          - 1/λ = R(1/2² − 1/3²) です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/λ = R(1/4−1/9), 5R/36]
      - part: 今日
        text: n=2 へ落ちる系列はどれですか。
        choices: ["ライマン系列", "バルマー系列", "パッシェン系列", "ブラケット系列"]
        answer: "バルマー系列"
        check: "'バルマー系列'"
        hints:
          - 系列の名前は、落ちる先の n₁ で決まります。
          - n₁ = 2 の系列です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [n₁ = 2, バルマー系列]
      - part: 挑戦
        text: n=4 から n=2 へ移るときの 1/λ は、R の何倍ですか。
        choices: ["1/4", "3/16", "3/4", "1/16"]
        answer: "3/16"
        check: "Fraction(3, 16)"
        hints:
          - 1/λ = R(1/2² − 1/4²) です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/λ = R(1/4−1/16), 3R/16]
    extra:
      - part: 今日
        text: ライマン系列の光は、主にどの領域にありますか。
        choices: ["紫外", "可視", "赤外", "電波"]
        answer: "紫外"
        check: "'紫外'"
        hints:
          - ライマン系列は n₁ = 1 へ落ちます。
          - エネルギー差が大きいので、波長は短いです。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [n₁=1, エネルギー差が大きい, 波長が短い, 紫外]
      - part: 今日
        text: バルマー系列の光は、主にどの領域にありますか。
        choices: ["紫外", "可視", "赤外", "X 線"]
        answer: "可視"
        check: "'可視'"
        hints:
          - バルマー系列は n₁ = 2 へ落ちます。
          - エネルギー差が中くらいです。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [n₁=2, 可視]
      - part: わけ
        text: 水素のスペクトルがとびとびの線になるわけを説明しましょう。
        explain: 「電子はとびとびのエネルギー準位の間しか移れない。移るときに出る光子のエネルギーは、準位の差で決まる。差がとびとびなので、光子の振動数もとびとびになり、決まった波長の線だけが現れる。」と書ければよい。① 準位がとびとび、② 光子は差、③ 波長もとびとび。子どもには、n=2→1 と n=3→2 の波長をくらべさせます。
        hints:
          - 電子はとびとびの準位の間しか移れません。
          - 光子のエネルギーは準位の差です。
          - 波長もとびとびになります。
        paths:
          - [準位がとびとび, 光子は差, 波長もとびとび, 線スペクトル]

  - day: 3
    items:
      - part: 見本
        text: |-
          ボーア模型：電子は、角運動量が nħ（n = 1、2、3、…）の円軌道を回ります。
          水素の電子の軌道半径は r_n = n² a₀。a₀ = 5.3 × 10⁻¹¹ m（ボーア半径）。
          エネルギー準位は E_n = −13.6/n² eV。n が大きいほど外側で、エネルギーは 0 に近づきます。
          電子が n₂ から n₁ へ移ると、hf = E_n₂ − E_n₁ の光子を出します。
        explain: |-
          n=1 が基底状態で、半径 a₀、エネルギー −13.6 eV。
          n=2 は半径 4a₀、エネルギー −3.4 eV。
          n=2 → 1 の光子は 10.2 eV。n=3 → 2 は約 1.89 eV。
        note: r_n = n²a₀、E_n = −13.6/n² eV。n=1 が基底状態。
      - part: 思い出す
        text: 水素の n=2 のエネルギーは何 eV ですか。
        choices: [−13.6, −6.8, −3.4, −1.51]
        answer: −3.4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(-13.6 / (2 ** 2))"
        hints:
          - E_n = −13.6/n² です。
          - n=2 を入れます。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [E_n = −13.6/n², −13.6/4 = −3.4]
      - part: 今日
        text: 水素の n=3 の軌道半径は、a₀ の何倍ですか。
        choices: [3, 6, 9, 12]
        answer: 9
        check: "3 ** 2"
        hints:
          - r_n = n² a₀ です。
          - n=3 を入れます。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [r_n = n²a₀, 3² = 9]
      - part: 今日
        text: 水素の n=3 のエネルギーは約何 eV ですか。
        choices: [−13.6, −4.53, −1.51, −0.85]
        answer: −1.51
        check: "(lambda v: f'−{-v:.2f}' if v < 0 else f'{v:.2f}')(-13.6 / (3 ** 2))"
        hints:
          - E_n = −13.6/n² です。
          - n=3 を入れます。
          - −13.6/9 ≈ −1.51 eV です。
        paths:
          - [E_n = −13.6/n², −13.6/9 ≈ −1.51]
      - part: 挑戦
        text: 水素の n=2 から n=1 へ移るときに出る光子のエネルギーは何 eV ですか。
        choices: [3.4, 10.2, 13.6, 17.0]
        answer: 10.2
        check: "-3.4 - (-13.6)"
        hints:
          - 準位の差をとります。
          - −3.4 − (−13.6) を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [E_2 − E_1, −3.4 + 13.6 = 10.2 eV]
    extra:
      - part: 今日
        text: 水素の n=1 の軌道半径は、a₀ の何倍ですか。
        choices: [1, 2, 4, 9]
        answer: 1
        check: "1 ** 2"
        hints:
          - r_n = n²a₀ です。
          - n=1 を入れます。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [r_n = n²a₀, 1² = 1]
      - part: 今日
        text: ボーア模型で、電子の角運動量は何の整数倍ですか。
        choices: ["h", "ħ", "2h", "h/2"]
        answer: "ħ"
        check: "'ħ'"
        hints:
          - ボーアの量子条件です。
          - ħ = h/2π です。
          - ħ の整数倍です。
        paths:
          - [角運動量 nħ, ħ の整数倍]
      - part: わけ
        text: ボーア模型で、水素のエネルギー準位が E_n = −13.6/n² eV になるわけを説明しましょう。
        explain: 「電子の角運動量が nħ に限られると、円軌道の半径と速さがとびとびになります。クーロン力が向心力になる条件と合わせると、半径は n²a₀、エネルギーは −13.6/n² eV になります。n が大きいほど外側で、エネルギーは 0 に近づきます。」と書ければよい。① 角運動量の量子化、② 半径が n²a₀、③ エネルギーが −13.6/n²。子どもには、n=1、2、3 の値を確かめさせます。
        hints:
          - 角運動量が nħ に限られます。
          - 半径は n²a₀ になります。
          - エネルギーは −13.6/n² eV です。
        paths:
          - [角運動量 nħ, 半径 n²a₀, E_n = −13.6/n²]

  - day: 4
    items:
      - part: 見本
        text: |-
          量子数：n は主量子数（殻）、l は方位量子数（s、p、d、f）、m_l は磁気量子数、m_s はスピン量子数です。
          n = 1、2、3、…。l = 0、1、…、n−1。m_l = −l、…、0、…、l。m_s = ±1/2。
          l = 0 が s 軌道、1 が p 軌道、2 が d 軌道、3 が f 軌道。
          同じ n でも l がちがうと、エネルギーや形がちがいます。
        explain: |-
          n は電子の殻の大きさ、l は軌道の形、m_l は向き、m_s はスピンの向きです。
          n=2 なら l=0（2s）と l=1（2p）があります。2p の m_l は −1、0、1 の 3 通り。
          1 つの軌道には、スピンが上向きと下向きの 2 個まで入れます（パウリの原理）。
        note: n、l、m_l、m_s。l=0,1,2,3 が s,p,d,f。m_s = ±1/2。
      - part: 思い出す
        text: n=2 のとき、l の値はどれですか。
        choices: ["0 だけ", "0 と 1", "1 だけ", "0、1、2"]
        answer: "0 と 1"
        check: "'0 と 1'"
        hints:
          - l は 0 から n−1 までです。
          - n=2 なら 0 と 1 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [l = 0〜n−1, n=2, 0 と 1]
      - part: 今日
        text: l=1 の軌道は何軌道ですか。
        choices: ["s 軌道", "p 軌道", "d 軌道", "f 軌道"]
        answer: "p 軌道"
        check: "'p 軌道'"
        hints:
          - l=0 が s、l=1 が p です。
          - l=1 は p です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [l=0 s、l=1 p, p 軌道]
      - part: 今日
        text: l=2 のとき、m_l は何通りありますか。
        choices: [2, 3, 5, 7]
        answer: 5
        check: "2 * 2 + 1"
        hints:
          - m_l は −l から l までです。
          - l=2 なら −2、−1、0、1、2 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [m_l = −l〜l, −2〜2, 5 通り]
      - part: 挑戦
        text: 1 つの軌道に入れる電子の最大数はいくつですか。
        choices: [1, 2, 4, 6]
        answer: 2
        check: "2"
        hints:
          - スピンは ±1/2 の 2 通りです。
          - パウリの原理で、同じ量子数の電子は 1 つだけです。
          - 2 個までです。
        paths:
          - [スピン ±1/2, 2 通り, 2 個]
    extra:
      - part: 今日
        text: n=3 のとき、l の最大値はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 2
        check: "3 - 1"
        hints:
          - l は 0 から n−1 までです。
          - n=3 なら 0、1、2 です。
          - 最大は 2 です。
        paths:
          - [l = 0〜n−1, n=3, 最大 2]
      - part: 今日
        text: スピン量子数 m_s の値はどれですか。
        choices: ["0 と 1", "±1/2", "±1", "0 だけ"]
        answer: "±1/2"
        check: "'±1/2'"
        hints:
          - 電子のスピンは 1/2 です。
          - 向きが 2 通りあります。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [スピン 1/2, 向き 2 通り, ±1/2]
      - part: わけ
        text: 1 つの軌道に電子が 2 個までしか入らないわけを説明しましょう。
        explain: 「電子のスピンは ±1/2 の 2 通りしかない。パウリの原理から、同じ軌道（同じ n、l、m_l）に入れる電子は、スピンの向きがちがう 2 個まで。3 個目は同じ量子数になってしまうので入れない。」と書ければよい。① スピン 2 通り、② パウリの原理、③ 2 個まで。子どもには、ヘリウムの 1s² で確かめさせます。
        hints:
          - スピンの向きは 2 通りです。
          - パウリの原理で、同じ量子数は許されません。
          - 2 個までです。
        paths:
          - [スピン ±1/2, パウリの原理, 2 個まで]

  - day: 5
    items:
      - part: 見本
        text: |-
          パウリの原理：1 つの軌道には、スピンの向きがちがう 2 個までしか電子は入れません。
          電子は、エネルギーの低い軌道から順に入ります（アウフバウ）。
          n 番目の殻に入る最大の電子数は 2n²。K 殻 2、L 殻 8、M 殻 18。
          電子配置は、1s²2s²2p⁶… のように書きます。右上の数は電子の数です。
        explain: |-
          s 軌道は 1 つで 2 個、p 軌道は 3 つで 6 個、d 軌道は 5 つで 10 個入れます。
          炭素 Z=6 は 1s²2s²2p²。酸素 Z=8 は 1s²2s²2p⁴。ナトリウム Z=11 は 1s²2s²2p⁶3s¹。
        note: パウリの原理で 1 軌道 2 個。殻の最大は 2n²。低い軌道から入る。
      - part: 思い出す
        text: n=2 の殻に入る電子の最大数はいくつですか。
        choices: [2, 8, 18, 32]
        answer: 8
        check: "2 * 2 ** 2"
        hints:
          - 最大数は 2n² です。
