        explain: "「水素の準位は E_n = −13.6/n² eV。n=1 は −13.6 eV、n=2 は −3.4 eV。高い準位から低い準位へ移るとき、差のエネルギーを光子として出す。−3.4 − (−13.6) = 10.2 eV。」と書ければよい。① 準位の式、② 2 つの値、③ 差。子どもには、n=3→2 の 1.89 eV も確かめさせます。"

