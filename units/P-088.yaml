  - day: 7
    items:
      - part: 見本
        id: "198b5b73ad"
        text: |-
          原子の構造・スペクトル・電子配置は、1 つの問題で組み合わせて使います。まず、図の 3 つの道具のどれを使う問いかを見分けましょう。
          ① 原子核のつぶ：A = Z + N。同位体は Z が同じ。
          ② 準位の矢印：E_n = −13.6/n² eV、r_n = n² a₀。光子のエネルギーは準位の差。1/λ = R (1/n₁² − 1/n₂²)。
          ③ 軌道の箱：箱 1 つに 2 こまで。殻の最大は 2n²。低い軌道から順に入る。
