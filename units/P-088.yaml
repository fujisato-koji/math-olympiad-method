="currentColor" stroke-width="1.5"/><line x1="110" y1="175.5" x2="200" y2="175.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="206" y="180.5" font-size="13" text-anchor="start" fill="currentColor">n=1：−13.6</text><line x1="170" y1="61.9" x2="170" y2="175.5" stroke="#7bc96f" stroke-width="3"/><line x1="164" y1="61.9" x2="176" y2="61.9" stroke="#7bc96f" stroke-width="3"/><line x1="164" y1="175.5" x2="176" y2="175.5" stroke="#7bc96f" stroke-width="3"/><text x="160" y="124.7" font-size="18" text-anchor="end" fill="currentColor" font-weight="bold">?</text></svg>'
