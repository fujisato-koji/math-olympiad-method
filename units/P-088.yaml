# P-088 原子の構造とスペクトル
#
# 段 5・水準 3・8 日。前提は P-069（量子論の始まり）。
# 原子の構造（陽子・中性子・電子、原子番号と質量数、同位体）、水素のスペクトル系列、ボーア模型の半径とエネルギー、
# 量子数と軌道、パウリの原理と電子配置をあつかう。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 用語の説明は、原稿で《用語》と囲んだ所だけに付く（D-063）。
# 図の直し（D-131、-fix3）：どの見本にも図を付けた（1 日目 炭素 12 と炭素 14 の原子、2 日目 準位の矢印と 3 つの系列、
#   3 日目 軌道の半径とエネルギー準位、4 日目 殻ごとの軌道の箱と m_l、5 日目 ホウ素の電子配置の箱、7 日目 3 つの道具）。
#   答える問題は、原子核のつぶ、準位の矢印、軌道の半径、軌道の箱、波長のものさしの図を見て読む形にした。
#   ヒントの図は、色ごとにならべたつぶ、マスでそろえた 1/n²、エネルギーのたての数直線、とちゅうまで入れた箱、量子数の表など。
#   正解の値はかかない。準位の図の間かくは見やすくした模式図で、実際の比ではない。
#   この単元の用語の 軌道、殻、系列、紫外線、可視光、磁気量子数 は漢字のまま書く。
#   3 日目の見本に、ボーアの量子条件 mvr = nħ を足した（同じ日の予備の問いと、わけで使うため）。
#   波長のものさしの図（2・7・8 日目の予備）は、矢印の横の位置を波長の順にそろえ、どの矢印も自分の系列の帯の上にかいた。

id: P-088
days:
  - day: 1
    items:
      - part: 見本
        id: "fc0955f108"
        text: |-
          原子は、まん中の原子核と、そのまわりを回る電子からできています。
          原子核は、陽子（電荷 +e）と中性子（電荷 0）のつぶでできています。電子の電荷は −e です。
          原子番号 Z は陽子の数、質量数 A は陽子と中性子の数の和です。中性子の数を N とすると、A = Z + N。
          図の 2 つは、どちらも陽子が 6 こ（炭素）ですが、中性子の数がちがいます。このように Z が同じで N がちがう原子どうしを、同位体といいます。
