  - day: 5
    items:
      - part: 見本
        id: "a59cc69d90"
        text: |-
          《パウリの原理》：1 つの軌道（図の箱 1 つ）には、スピンの向きがちがう 2 こ（↑↓）までしか電子は入れません。
          電子は、エネルギーの低い軌道から順に入ります（構成原理）。図はホウ素（Z=5）で、1s → 2s → 2p の順に 5 こが入っています。
          n 番目の殻に入る電子の最大数は 2n²。K 殻（n=1）に 2 こ、L 殻（n=2）に 8 こ、M 殻（n=3）に 18 こです。
          電子配置は 1s² 2s² 2p¹ のように書きます。右上の小さい数は、その軌道のグループに入った電子の数です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="24" y1="186" x2="24" y2="31" stroke="currentColor" stroke-width="2"/><polygon points="24,22 28.5,31 19.5,31" fill="currentColor" stroke="none"/><text x="34" y="16" font-size="12" text-anchor="start" fill="currentColor">エネルギー</text><rect x="70" y="160" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><line x1="77.7" y1="180" x2="77.7" y2="171" stroke="currentColor" stroke-width="2"/><polygon points="77.7,164 74.2,171 81.2,171" fill="currentColor" stroke="none"/><line x1="86.3" y1="164" x2="86.3" y2="173" stroke="currentColor" stroke-width="2"/><polygon points="86.3,180 82.8,173 89.8,173" fill="currentColor" stroke="none"/><text x="64" y="177" font-size="14" text-anchor="end" fill="currentColor">1s</text><rect x="70" y="118" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><line x1="77.7" y1="138" x2="77.7" y2="129" stroke="currentColor" stroke-width="2"/><polygon points="77.7,122 74.2,129 81.2,129" fill="currentColor" stroke="none"/><line x1="86.3" y1="122" x2="86.3" y2="131" stroke="currentColor" stroke-width="2"/><polygon points="86.3,138 82.8,131 89.8,131" fill="currentColor" stroke="none"/><text x="64" y="135" font-size="14" text-anchor="end" fill="currentColor">2s</text><rect x="132" y="98" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><line x1="139.7" y1="118" x2="139.7" y2="109" stroke="currentColor" stroke-width="2"/><polygon points="139.7,102 136.2,109 143.2,109" fill="currentColor" stroke="none"/><rect x="156" y="98" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><rect x="180" y="98" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><text x="126" y="115" font-size="14" text-anchor="end" fill="currentColor">2p</text><rect x="70" y="58" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><text x="64" y="75" font-size="14" text-anchor="end" fill="currentColor">3s</text><rect x="132" y="38" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><rect x="156" y="38" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><rect x="180" y="38" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/><text x="126" y="55" font-size="14" text-anchor="end" fill="currentColor">3p</text><text x="216" y="50" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">ホウ素 Z=5</text><text x="216" y="74" font-size="14" text-anchor="start" fill="currentColor">1s² 2s² 2p¹</text></svg>'
        explain: |-
          s 軌道は 1 つで 2 個、p 軌道は 3 つで 6 個、d 軌道は 5 つで 10 個入れます。殻 n には n² 個の軌道があるので、最大 2n² 個です。
          ホウ素 Z=5 は 1s²2s²2p¹。炭素 Z=6 は 1s²2s²2p²。酸素 Z=8 は 1s²2s²2p⁴。ナトリウム Z=11 は 1s²2s²2p⁶3s¹。
          2p のように箱がいくつかあるときは、電子は空いた箱に 1 個ずつ同じ向きで入ってから組になります（フントの規則）。この単元では電子配置の書き方だけを問います。
        note: "パウリの原理で 1 軌道 2 個。殻の最大は 2n²。低い軌道から入る。"
