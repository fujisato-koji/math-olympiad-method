  - day: 4
    items:
      - part: 見本
        id: "4117c95d9f"
        text: |-
          電子の状態は、4 つの量子数で表します。
          n（主量子数）：殻の番号。n = 1、2、3、…。図の行です。
          l（方位量子数）：軌道の形。l = 0、1、…、n−1。l = 0、1、2、3 を、s、p、d、f 軌道とよびます。図の列です。
          m_l（磁気量子数）：軌道の向き。−l から l までの整数で、2l + 1 通り。図の箱 1 つが軌道 1 つで、箱の中の数が m_l です。
          m_s（スピン量子数）：電子の自転の向き。+1/2（↑）と −1/2（↓）の 2 通りです。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="32" y="64" font-size="14" text-anchor="end" fill="currentColor">n=1</text><rect x="40" y="46" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="53" y="63.5" font-size="12" text-anchor="middle" fill="currentColor">0</text><text x="32" y="112" font-size="14" text-anchor="end" fill="currentColor">n=2</text><rect x="40" y="94" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="53" y="111.5" font-size="12" text-anchor="middle" fill="currentColor">0</text><rect x="84" y="94" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="97" y="111.5" font-size="12" text-anchor="middle" fill="currentColor">−1</text><rect x="110" y="94" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="123" y="111.5" font-size="12" text-anchor="middle" fill="currentColor">0</text><rect x="136" y="94" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="149" y="111.5" font-size="12" text-anchor="middle" fill="currentColor">1</text><text x="32" y="160" font-size="14" text-anchor="end" fill="currentColor">n=3</text><rect x="40" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="53" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">0</text><rect x="84" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="97" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">−1</text><rect x="110" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="123" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">0</text><rect x="136" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="149" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">1</text><rect x="180" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="193" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">−2</text><rect x="206" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="219" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">−1</text><rect x="232" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="245" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">0</text><rect x="258" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="271" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">1</text><rect x="284" y="142" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"/><text x="297" y="159.5" font-size="12" text-anchor="middle" fill="currentColor">2</text><text x="53" y="192" font-size="13" text-anchor="middle" fill="currentColor">s（l=0）</text><text x="123" y="192" font-size="13" text-anchor="middle" fill="currentColor">p（l=1）</text><text x="245" y="192" font-size="13" text-anchor="middle" fill="currentColor">d（l=2）</text><rect x="168" y="10" width="146" height="64" rx="8" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="178" y="26" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/><line x1="187.6" y1="52" x2="187.6" y2="37" stroke="currentColor" stroke-width="2"/><polygon points="187.6,30 184.1,37 191.1,37" fill="currentColor" stroke="none"/><line x1="198.4" y1="30" x2="198.4" y2="45" stroke="currentColor" stroke-width="2"/><polygon points="198.4,52 194.9,45 201.9,45" fill="currentColor" stroke="none"/><text x="216" y="36" font-size="12" text-anchor="start" fill="currentColor">↑：m_s = +1/2</text><text x="216" y="56" font-size="12" text-anchor="start" fill="currentColor">↓：m_s = −1/2</text><text x="98" y="24" font-size="12" text-anchor="middle" fill="currentColor">箱 1 つ = 軌道 1 つ</text><text x="98" y="38" font-size="12" text-anchor="middle" fill="currentColor">箱の中の数は m_l</text></svg>'
        explain: |-
          n は電子の殻の大きさ、l は軌道の形、m_l は向き、m_s はスピンの向きです。
          n=2 なら l=0（2s）と l=1（2p）があります。2p の m_l は −1、0、1 の 3 通り。
          1 つの軌道には、スピンが上向きと下向きの 2 個まで入れます（パウリの原理。5 日目にくわしく）。
          図は n=3 までをかいた。n=1 の行に p や d の箱がないのは、l が n−1 までだから。
