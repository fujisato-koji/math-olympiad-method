        explain: 1 L を同じかさずつ 10 こに分けた 1 こ分のかさを 0.1 L と書き、「れい点一リットル」と読みます。水は 0.1 L が 3 こ分なので 0.3 L です。0.3 のような数を小数、「.」を小数点といいます。0.1 を、また同じ大きさずつ 10 こに分けた 1 こ分が 0.01 です。たとえば 1.25 は、1 が 1 こ、0.1 が 2 こ、0.01 が 5 こです。小数点のすぐ右の位を小数第一位、その右を小数第二位といいます。
      - part: 思い出す
        text: 100 が 3 こ、10 が 5 こ、1 が 2 こで、いくつですか。
        answer: 352
        check: "100 * 3 + 10 * 5 + 1 * 2"
        hints:
          - 100 が 3 こで、いくつかな。
          - 10 が 5 こで、いくつかな。
          - 百の位、十の位、一の位に、じゅんに数字を書こう。
        paths:
          - [百の位 3、十の位 5、一の位 2, 352]
      - part: 思い出す
        text: 47 ÷ 6 のあまりはいくつですか。
        answer: 5
        check: "47 % 6"
        hints:
          - 6 の段の九九で、47 をこえない いちばん大きい答えはどれかな。
          - 47 から、その数をひこう。
          - あまりは、6 より小さくなるよ。
        paths:
          - [6 × 7 = 42, 47 − 42 = 5, 5]
      - part: 今日
        text: 1 L ますを、同じかさずつ 10 こに分けました。水は何 L ですか。
        figure: 🟦🟦🟦🟦🟦🟦🟦⬜⬜⬜
        answer: 0.7
        check: "n('🟦') / 10"
        hints:
