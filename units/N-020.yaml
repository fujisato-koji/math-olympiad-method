        figure: "0─・─・─・─・─・─□─・─・─・─1"
        answer: 0.6
        check: "fig.split('─').index('□') / 10"
        hints:
          - 0 から 1 までは、いくつに分かれているかな。
          - 1 目もりは、いくつかな。
          - □ は 0 から何目もり進んだところかな。
        paths:
          - [0 から 1 までが 10 こに分かれている, 1 目もりは 0.1, □ は 6 目もりで 0.6]
      - part: 挑戦
        text: 0.1 が 23 こ集まると、いくつになりますか。
        answer: 2.3
        check: "23 / 10"
        hints:
          - 0.1 が 10 こで、いくつになるかな。
          - 23 こを、10 こずつのまとまりに分けよう。
          - まとまりの数と、のこりの数を考えよう。
        paths:
          - [0.1 が 10 こで 1, 23 こは 10 こが 2 つと 3 こ, 2 と 0.3 で 2.3]
        note: 0.23 や 23.0 としやすい。0.1 が 10 こで 1 になることを、ますの図で確かめる。
