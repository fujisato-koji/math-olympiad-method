# N-020 小数
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-009（1000 までの数と位）と N-014（わり算とあまり）。N-016（分数）は前提にないので、
#   0.1 は「1 を同じ大きさずつ 10 こに分けた 1 こ分」と言い、1/10 の書き方や分数との関係（0.3 = 3/10）は使わない。
#   位の名前は「小数第一位」「小数第二位」。
# 小数を「0.1（0.01）のいくつ分」とみて、整数の計算（N-007、N-009）にもどして計算する。
#   たし算とひき算は小数第二位まで。かけ算とわり算は、地図に受け持つ単元がないので筆算は扱わず、
#   「0.3 L を 4 回」「2.4 L を 6 人で分ける」を 0.1 のいくつ分で考える問題を 4 日目に入れた。
#   10 倍・10 分の 1 で位が動くきまりは N-073 なので扱わない。
# 図の 1 行（🟦 と ⬜ で 10 こ）が 1 L ます。🟦 は水の入ったところ。check は n('🟦') / 10。
# 数直線は N-002 と同じく「─」で目もりを区切る。・は数の書いていない目もり。1 目もりは 0.1。
# check の「/」は小数を返す。答えは 0.1 か 0.01 のいくつ分を整数で出して 10 か 100 でわる（2.4 + 1.8 は (24 + 18) / 10）。
#   答えが整数になるときは「//」を使う（3.0 ではなく 3）。
# 末尾の 0 に意味がある数（1.50）は、文の中だけで使い、答えにはしない。
# 日の並び（既定）：1 日目 0.1 と 0.01・数直線、2 日目 大小とたし算・ひき算、3 日目 わけ、
#   4 日目 N-009 と N-014 と混ぜる（0.1 のいくつ分で分ける・何回か入れる）、5 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-016 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: N-020
days:
