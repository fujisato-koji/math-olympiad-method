        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="130" y="171" width="56" height="15" fill="#7fc8f8" fill-opacity="0.6" stroke="none"/><path d="M130 51H186M130 66H186M130 81H186M130 96H186M130 111H186M130 126H186M130 141H186M130 156H186M130 171H186" stroke="currentColor" stroke-width="1" stroke-opacity=".55"/><path d="M130 36V186H186V36" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="126" y1="36" x2="130" y2="36" stroke="currentColor" stroke-width="2"/><line x1="186" y1="36" x2="190" y2="36" stroke="currentColor" stroke-width="2"/><text x="158" y="28" font-size="13" text-anchor="middle" fill="currentColor">1 L ます</text><line x1="189" y1="178.5" x2="201" y2="178.5" stroke="currentColor" stroke-width="2"/><text x="204" y="183" font-size="13" text-anchor="start" fill="currentColor">1 dL</text><text x="206" y="70" font-size="14" text-anchor="start" fill="currentColor">1 L は</text><text x="206" y="90" font-size="14" text-anchor="start" fill="currentColor">10 dL</text></svg>'
      - コップにそそいだ水は、全部で何 dL かな。それは何 L かな。
      - 2.3 L から、コップの分と水とうの分をひこう。
    paths:
      - [1 dL = 0.1 L なので 2 dL = 0.2 L, コップには 0.2 L が 4 回で 0.8 L, 2.3 − 0.8 = 1.5, 1.5 − 0.35 = 1.15 L]
      - [そそいだ水は 0.8 + 0.35 = 1.15 L, 2.3 − 1.15 = 1.15 L]
    note: dL と L のなおし方（G-046、1 L = 10 dL）と、小数のたし算・ひき算、0.1 のいくつ分のかけ算（0.2 × 4）を合わせる。2 dL を 2 L や 0.02 L とするまちがいに気をつける。
  - part: 離
    id: "1842f1286f"
    kinds: [道筋]
    text: 2、4、6、8 のカードが 1 まいずつあります。4 まいを全部使って、□.□ の形の小数を 2 つ作ります。2 つの小数のちがいがいちばん小さくなるとき、そのちがいはいくつですか。
    svg: '<svg viewBox="0 0 320 136" xmlns="http://www.w3.org/2000/svg"><rect x="50" y="12" width="40" height="52" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="70" y="47.4" font-size="26" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><rect x="110" y="12" width="40" height="52" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="130" y="47.4" font-size="26" text-anchor="middle" fill="currentColor" font-weight="bold">4</text><rect x="170" y="12" width="40" height="52" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="190" y="47.4" font-size="26" text-anchor="middle" fill="currentColor" font-weight="bold">6</text><rect x="230" y="12" width="40" height="52" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="250" y="47.4" font-size="26" text-anchor="middle" fill="currentColor" font-weight="bold">8</text><rect x="46" y="88" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="86" y="88" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="176" y="88" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="216" y="88" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="80" cy="118" r="3" fill="currentColor" fill-opacity="1"/><circle cx="210" cy="118" r="3" fill="currentColor" fill-opacity="1"/><text x="145" y="114" font-size="24" text-anchor="middle" fill="currentColor">−</text></svg>'
    answer: 1.4
    check: "min(abs((10 * a + b) - (10 * c + d)) for a, b, c, d in itertools.permutations((2, 4, 6, 8))) / 10"
    hints:
      - ちがいを小さくするには、まず一の位の数字どうしを近くしよう。一の位のちがいはいくつにできるかな。
      - text: たとえば一の位を 4 と 2 にしたら、大きいほうの小数第一位はできるだけ小さく、小さいほうの小数第一位はできるだけ大きくしよう。
        svg: '<svg viewBox="0 0 320 86" xmlns="http://www.w3.org/2000/svg"><text x="70" y="44" font-size="26" text-anchor="middle" fill="currentColor">4</text><rect x="86" y="18" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="80" cy="48" r="3" fill="currentColor" fill-opacity="1"/><text x="145" y="44" font-size="24" text-anchor="middle" fill="currentColor">−</text><text x="200" y="44" font-size="26" text-anchor="middle" fill="currentColor">2</text><rect x="216" y="18" width="28" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="210" cy="48" r="3" fill="currentColor" fill-opacity="1"/><text x="100" y="74" font-size="13" text-anchor="middle" fill="currentColor">小さく</text><text x="230" y="74" font-size="13" text-anchor="middle" fill="currentColor">大きく</text><rect x="262" y="18" width="22" height="32" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="273" y="40.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">6</text><rect x="290" y="18" width="22" height="32" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="301" y="40.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">8</text><text x="287" y="74" font-size="13" text-anchor="middle" fill="currentColor">のこり</text></svg>'
      - 一の位の組（2 と 4、4 と 6、6 と 8）のそれぞれでちがいを出して、くらべよう。
    paths:
      - [一の位のちがいは 2 にする, 2 と 4 なら 4.6 − 2.8 = 1.8, 4 と 6 なら 6.2 − 4.8 = 1.4, 6 と 8 なら 8.2 − 6.4 = 1.8, いちばん小さいのは 1.4]
      - [一の位のちがいが 4 や 6 だと、小数第一位でどう近づけてもちがいは 3 より大きい, 一の位がとなりの組の 3 通りだけ調べればよい, 1.8、1.4、1.8 のうち 1.4]
    note: 全部の組み合わせ（24 通り）を調べなくても、一の位を近づけ、小数第一位でちがいをちぢめる、とじゅんに決めると、調べる組が 3 つにしぼれる。のこった 2 まいの数字の大小でちがいがかわるところが考え方のかなめ。
