        explain: 例：「3.5 は 0.1 が 35 こ、1.7 は 0.1 が 17 こ。あわせると 0.1 が 52 こで 5.2。小数点をそろえると、0.1 の数どうし、1 の数どうしが同じ列にならぶので、整数と同じように計算できる。」と書ければよい。小数点をそろえないと、ちがう位の数どうしをたしてしまうこと（3.5 + 17 のようになる）に触れる。
