        explain: 例：「0.5 は 0.1 が 5 こ。0.1 は 0.01 が 10 こなので、0.5 は 0.01 が 50 こで 0.50。だから 1.5 と 1.50 は同じ大きさ。小数第二位の 0 は、0.01 が 1 こもないことを表しているだけ。」と書ければよい。ますの図で、0.5 L と 0.50 L が同じかさになることを指して言ってもよい。整数の 15 と 150 はちがう数であることとくらべ、小数のいちばん右の 0 だけは省いてよいことに触れる。
        hints:
