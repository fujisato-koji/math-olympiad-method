# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 手数]
    text: 3.07 − 1.8 + 0.95 − 1.26 を計算しましょう。
    answer: 0.96
    check: "(307 - 180 + 95 - 126) / 100"
    hints:
      - 前から順に計算しよう。小数点の位置をそろえて、位ごとに計算するよ。
      - 1.8 は 1.80 と考えると、3.07 − 1.80 が計算しやすいね。
      - とちゅうの答えをメモしながら進めよう。0.01 のいくつ分かで考えてもよいよ。
    paths:
      - [3.07 − 1.8 = 1.27, 1.27 + 0.95 = 2.22, 2.22 − 1.26 = 0.96]
      - [0.01 のいくつ分で考える, 307 − 180 + 95 − 126 = 96, 0.01 が 96 こで 0.96]
    note: 位の数がそろわない小数（1.8 と 3.07）のたし算・ひき算を 3 回続ける。1.8 を 0.18 のように位をずらして計算するまちがいと、とちゅうのくり下がりに気をつける。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [G-046]
    text: 水が 2.3 L 入ったポットがあります。ここから、コップに 2 dL ずつ 4 回そそぎ、そのあと、水とうに 0.35 L そそぎました。ポットにのこった水は何 L ですか。
    answer: 1.15
    check: "(230 - 20 * 4 - 35) / 100"
    hints:
      - 単位を L にそろえよう。1 L は 10 dL だから、1 dL は何 L かな。
      - コップにそそいだ水は、全部で何 dL かな。それは何 L かな。
      - 2.3 L から、コップの分と水とうの分をひこう。
    paths:
      - [1 dL = 0.1 L なので 2 dL = 0.2 L, コップには 0.2 L が 4 回で 0.8 L, 2.3 − 0.8 = 1.5, 1.5 − 0.35 = 1.15 L]
    note: dL と L の換算（G-046、1 L = 10 dL）と、小数のたし算・ひき算、0.1 のいくつ分のかけ算（0.2 × 4）を合わせる。2 dL を 2 L や 0.02 L とするまちがいに気をつける。
  - part: 離
    kinds: [道筋]
    text: 2、4、6、8 のカードが 1 まいずつあります。4 まいを全部使って、□.□ の形の小数を 2 つ作ります。2 つの小数の差がいちばん小さくなるとき、その差はいくつですか。
    answer: 1.4
    check: "min(abs((10 * a + b) - (10 * c + d)) for a, b, c, d in itertools.permutations((2, 4, 6, 8))) / 10"
    hints:
      - 差を小さくするには、まず一の位の数字どうしを近くしよう。一の位の差はいくつにできるかな。
      - 一の位を決めたら、大きいほうの数の小数第一位はできるだけ小さく、小さいほうの数の小数第一位はできるだけ大きくしよう。
      - 一の位の組（2 と 4、4 と 6、6 と 8）のそれぞれで差を出して、くらべよう。
    paths:
      - [一の位の差は 2 にする, 2 と 4 なら 4.6 − 2.8 = 1.8, 4 と 6 なら 6.2 − 4.8 = 1.4, 6 と 8 なら 8.2 − 6.4 = 1.8, いちばん小さいのは 1.4]
    note: 全部の組み合わせ（24 通り）を調べなくても、一の位を近づけ、小数第一位で差をちぢめる、と順に決めると候補が 3 つにしぼれる。のこった 2 まいの数字の大小で差が変わるところが道筋の要点。
