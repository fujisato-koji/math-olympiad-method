    kinds: [道筋]
    text: 方眼の点 O から点 P まで、右か上へ 1 マスずつ、右へ 5、上へ 5 進みます。図の点線（O と P を結ぶ対角線）より上に一度も出ない道順は、何通りですか（点線の上の点は通ってもかまいません）。
