        <circle cx="140" cy="20" r="3.5" fill="currentColor"/>
        <text x="12" y="155" font-size="13" text-anchor="middle">O</text>
        <text x="150" y="16" font-size="13" text-anchor="middle">P</text>
      </svg>
    answer: 42
    check: "len([s for s in itertools.combinations(range(10), 5) if all(len([i for i in s if i < t]) <= t - len([i for i in s if i < t]) for t in range(1, 11))])"
    hints:
      - 全部の道順から、点線より上に出る道順をひきましょう。
      - 点線より上に出る道順は、点線の 1 つ上の斜めの線に、はじめて触れる点があります。
