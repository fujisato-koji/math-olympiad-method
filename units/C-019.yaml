    note: 折り返し（鏡に映す）による《全単射》。「はじめて触れた点から先だけ」を折り返すことで逆《写像》がつくれる。書き出して数える道もあるが手数が多い。答えはカタラン数で、かっこの正しい並びなどとも 1 対 1 に対応する。
  - part: 離
    kinds: [数, 手数]
    text: 1 から 30 までの数から 4 つの数を選びます。選んだ 4 つの数のうち、どの 2 つの差も 3 以上になる選び方は、何通りですか。
    answer: 10626
    check: "len([s for s in itertools.combinations(range(1, 31), 4) if all(s[i + 1] - s[i] >= 3 for i in range(3))])"
    hints:
      - 選んだ数を a < b < c < d とします。となり合う差が 3 以上なら、どの 2 つの差も 3 以上です。
      - 差を 1 以上にするには、b、c、d をそれぞれいくつずつずらせばよいでしょう。
      - ずらした組は、1 から何までのちがう 4 つの数でしょう。
    paths:
      - ["(a, b − 2, c − 4, d − 6) を対応させる", "1 ≦ a < b − 2 < c − 4 < d − 6 ≦ 24", "₂₄C₄ = 24 × 23 × 22 × 21 ÷ 24 = 10626"]
    note: ずらす量が 2、4、6 と増えること、最大が 30 − 6 = 24 になることを正しく決める。₂₄C₄ の計算は、24 ÷ (4 × 3 × 2 × 1) = 1 と先に約分すると 23 × 22 × 21 になる。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [N-024]
    text: 432 = 2⁴ × 3³ の正の《約数》 d、e の組 (d, e) のうち、d が e の約数であるもの（d = e もふくむ）は、いくつありますか。
    answer: 150
    check: "(lambda D: len([1 for d in D for e in D if e % d == 0]))([x for x in range(1, 433) if 432 % x == 0])"
    hints:
      - 432 の約数は 2ⁱ × 3ʲ（0 ≦ i ≦ 4、0 ≦ j ≦ 3）と書けます（N-024）。約数と指数の組 (i, j) は 1 対 1 です。
      - d = 2ⁱ × 3ʲ が e = 2ᵏ × 3ˡ の約数になるのは、i、j と k、l がどんな関係のときでしょう。
      - 2 の指数の組 (i, k) と、3 の指数の組 (j, l) を、別々に数えましょう。
    paths:
      - ["d が e の約数 ⇔ i ≦ k かつ j ≦ l", "0 ≦ i ≦ k ≦ 4 の組は (i, k + 1) が 0〜5 のちがう 2 つと対応して ₆C₂ = 15", "0 ≦ j ≦ l ≦ 3 の組は ₅C₂ = 10", "15 × 10 = 150"]
    note: 約数と指数の組の全単射（N-024）、約数の関係を指数の不等式に言いかえる、等号つきの組をずらしてちがう数の選び方にする全単射、の 3 つを合わせる。約数は 5 × 4 = 20 個で、20 × 20 = 400 の組を全部調べるのは大変。
