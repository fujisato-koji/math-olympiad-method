      - part: わけ
        text: 集合 {1, 2, …, n} の《部分集合》 S に、長さ n の 0 と 1 の並び（i 番目は、i ∈ S なら 1、i ∉ S なら 0）を対応させる《写像》は《全単射》です。このわけを筋道を立てて書き、部分集合が 2ⁿ 個あることを示しましょう。
        explain: 例：「部分集合 S に対応させる並びを φ(S) とする。単射であること：S と T を、ちがう部分集合とする。どちらか一方だけに入っている数 i があるので、φ(S) と φ(T) は i 番目がちがい、φ(S) ≠ φ(T) である。よって φ は単射。《全射》であること：長さ n の 0 と 1 の並びを 1 つとり、1 になっている位置の集合を S とする。S は {1, 2, …, n} の部分集合で、φ(S) はもとの並びと一致する。よって φ は全射。φ は全単射なので、部分集合の個数は並びの個数に等しい。並びは各位置が 0 か 1 の 2 通りなので、積の法則で 2 × 2 × … × 2 = 2ⁿ 個。よって部分集合は 2ⁿ 個である。」と書ければよい。①「〜とする」で φ と S、T を決める、② 単射と全射をそれぞれ定義どおりに示す（全射は、並びから S をつくって φ(S) がもとの並びになることを確かめる）、③ 約束した事実（全単射なら要素の個数は等しい、積の法則 C-005）で結ぶ、の 3 つがそろっているかを見る。単射の部分を「ちがう S ならちがう並び」と言うだけで、なぜちがうか（どこかの位置がちがう）が抜けていたら補う。全射の代わりに、逆写像（並び ↦ 1 の位置の集合）をつくって、φ と合成すると元にもどることを示してもよい。
        hints:
          - 対応させる写像を φ とし、単射と全射を順に示しましょう。
          - 単射：ちがう部分集合 S、T には、どちらか一方だけに入る数があります。
          - 全射：並びを 1 つとり、1 の位置の集合 S をつくりましょう。最後に並びの個数を積の法則で数えましょう。
        paths:
          - [S ≠ T なら一方だけに入る i があり、i 番目がちがうので単射, 並びの 1 の位置の集合 S から φ(S) がその並びになるので全射, 全単射なので部分集合の数 ＝ 並びの数 ＝ 2ⁿ]
      - part: わけ
        text: 1 ≦ a ≦ b ≦ c ≦ n を満たす整数の組 (a, b, c) に、(a, b + 1, c + 2) を対応させる写像は、1 ≦ a' < b' < c' ≦ n + 2 を満たす整数の組 (a', b', c') 全体への全単射です。このわけを筋道を立てて書き、組の個数が ₙ₊₂C₃ であることを示しましょう。
        explain: 例：「X を 1 ≦ a ≦ b ≦ c ≦ n を満たす組全体、Y を 1 ≦ a' < b' < c' ≦ n + 2 を満たす組全体とし、φ(a, b, c) = (a, b + 1, c + 2)、ψ(a', b', c') = (a', b' − 1, c' − 2) とする。(a, b, c) ∈ X なら、a ≦ b より a < b + 1、b ≦ c より b + 1 < c + 2、c ≦ n より c + 2 ≦ n + 2 なので φ(a, b, c) ∈ Y（A-013 の不等式の性質）。逆に (a', b', c') ∈ Y なら、整数なので a' < b' から a' ≦ b' − 1、b' < c' から b' − 1 ≦ c' − 2、c' ≦ n + 2 から c' − 2 ≦ n なので ψ(a', b', c') ∈ X。さらに ψ(φ(a, b, c)) = (a, b, c)、φ(ψ(a', b', c')) = (a', b', c') なので、ψ は φ の逆写像で、φ は全単射である。よって X の要素の個数は Y の要素の個数に等しい。Y の組は、1 から n + 2 までのちがう 3 つの数を選んで小さい順に並べたものと 1 対 1 なので ₙ₊₂C₃ 個。」と書ければよい。①「〜とする」で X、Y、φ、ψ を決める、② φ が Y に、ψ が X に入ることを不等式の変形で示す、③ 約束した事実（逆写像があれば全単射、整数では a' < b' と a' ≦ b' − 1 が同じ、全単射なら個数は等しい）で結ぶ、の 3 つがそろっているかを見る。ψ が X に入ること（とくに「整数なので」の部分）が抜けやすい。n = 3 などで組を書き出して確かめただけで終わっていたら、例ではすべての n を示せないことを話す。
        hints:
          - 2 つの組の集合を X、Y とし、φ と、逆向きの ψ(a', b', c') = (a', b' − 1, c' − 2) を決めましょう。
          - φ で写した組が本当に Y に入ること、ψ で写した組が X に入ることを、不等式で示しましょう。
          - ψ ∘ φ と φ ∘ ψ がどちらも元にもどすことを書いて、全単射と結論しましょう。
        paths:
          - ["φ(a, b, c) = (a, b + 1, c + 2) と ψ を決める", "a ≦ b なら a < b + 1 などで φ は Y へ", "整数なので a' < b' なら a' ≦ b' − 1 などで ψ は X へ", "ψ は φ の逆写像なので全単射", "個数は ₙ₊₂C₃"]
      - part: わけ
        text: 有限の集合 A から有限の集合 B への単射があれば、A の要素の個数は B の要素の個数以下です。このわけを、筋道を立てて書きましょう。
        explain: 例：「A の要素の個数を m、B の要素の個数を k とし、f を A から B への単射とする。A の要素を a₁、a₂、…、aₘ とすると、f は単射なので、i ≠ j なら f(aᵢ) ≠ f(aⱼ) で、f(a₁)、f(a₂)、…、f(aₘ) は m 個のちがう要素である。これらはどれも B の要素なので、値域 f(A) は B の部分集合で、要素が m 個ある。部分集合の要素の個数は、もとの集合の要素の個数をこえないので、m ≦ k である。」と書ければよい。①「〜とする」で m、k、f と A の要素を決める、② 単射の定義から《像》が m 個のちがう要素になることを示す、③ 約束した事実（f(A) ⊂ B、部分集合の要素の個数はもとの集合以下）で結ぶ、の 3 つがそろっているかを見る。対偶をとると「A の要素が B の要素より多ければ、どんな写像も単射でない（同じ要素に写る 2 つがある）」となり、これが鳩の巣原理であることに触れる（L-013 の対偶）。同じように、全射があれば A の要素の個数は B の要素の個数以上で、全単射なら等しい（1 日目の見本）ことにも触れる。
        hints:
          - A の要素の個数を m、B の要素の個数を k とし、A の要素を a₁、…、aₘ と名前をつけましょう。
          - f が単射であることから、f(a₁)、…、f(aₘ) について何が言えるでしょう。
          - それらがすべて B に入っていることから、m と k をくらべましょう。
        paths:
          - [A の要素を a₁、…、aₘ とする, 単射なので f(a₁)、…、f(aₘ) は m 個のちがう要素, それらは B の要素なので m ≦ k]
