# C-019 全単射で数える
#
# 書き方は N-001 の頭の注のとおり。記号と計算の書き方は C-015 に合わせる（₅C₂ のように下つきの数字、式の中は「÷」、n! は使わない）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目 導入：有限の集合の間に全単射があれば要素の個数は等しい。部分集合 ↔ 0 と 1 の並び（2ⁿ 個）、写像 ↔ 値の並び（積の法則）、
#     単射 ↔ ちがう値の並び、全単射 ↔ 並べ方。
#   2 日目 練習：x + y + z = n の 0 以上の整数の組 ↔ ○ と｜の並び（C-013）、正の整数の組はずらして 0 以上に、
#     1 ≦ a ≦ b ≦ c ≦ n ↔ (a, b + 1, c + 2) のちがう数の組。頭に見本。
#   3 日目 練習：隣り合わない数の選び方 ↔ ずらしてふつうの選び方、数の分け方の図の行と列を入れかえる（3 個以下 ↔ 3 以下）、
#     円形の席。頭に見本。
#   4 日目 わけ（3 問とも ③：部分集合と 0・1 の並びの全単射、(a, b, c) ↦ (a, b + 1, c + 2) が全単射、単射があれば要素の個数は ≦）。
#   5 日目 混ぜる：C-014（対応させて数える）、C-013（同じものをふくむ並べ方）、C-015（道順）、A-024（部分集合と写像）と 1〜3 日目の型。
#   6 日目 確認。
# 前提は C-015、A-024、C-014。たどると C-013（○ と｜の並び、何回でも選べる選び方）、C-007（組合せ）、C-006（順列）、C-005（積の法則）、
#   L-013（命題と対偶）、A-013（不等式）、A-011（1 次方程式）、A-009（累乗）までなので、これらを道具にする。
#   C-014 では言葉で「1 つずつ組になる」と言った対応を、ここでは A-024 の写像の言葉（単射、全射、全単射、逆写像）で言い直し、
#   全単射であることを「逆写像がつくれる」ことで確かめる。
# 二通りに数える（C-018）と包除原理（C-021）は前提にないので使わない。全射の個数は、包除原理でなく「どの 2 つが同じ値になるか」で数える。
#   鳩の巣原理（L-006）も前提にないので、4 日目のわけ（単射があれば要素の個数は ≦）でその考えに触れるだけにした。
#   階乗の記号 n!（N-024）は前提にないので、5 × 4 × 3 × 2 × 1 と書く。
# 写像は「A から B への写像 f」と書く（A-024 の f：A → B の形は使わない）。○ と｜は C-013 と同じく全角で書く。
# 数の分け方（足す順を考えない和）の図は svg で、○ を行に並べて描く。答えの数は図に書かない。
# check：組や並びや選び方は、itertools（product、combinations、combinations_with_replacement、permutations）で全部作って、条件に合うものを数える。
#   数の分け方は、大きい順に並べた和をくり返しで全部作る（lambda に自分を渡す）。式の値は math.comb でなく数え上げで確かめる。
# 全単射で数えることは、母関数（C-026）、カタラン数と格子の道（反射）、分割数とヤング図形（表現論 R の流れ）、
#   可算と非可算（L-020）、計算量の帰着（K の流れ）の入口になる（D-026）。

id: C-019
days:
  - day: 1
    items:
      - part: 見本
        text: 集合 {1, 2, 3, 4} の《部分集合》の個数と、集合 A = {1, 2, 3} から集合 B = {1, 2, 3, 4} への《写像》の個数を、《全単射》を使って数えてみましょう。
        explain: 有限の集合 X と Y の間に全単射があれば、X の要素と Y の要素は 1 つずつ組になるので、X と Y の要素の個数は等しくなります。そこで、数えにくい集合 X を数えるときは、数えやすい集合 Y との間に全単射をつくります。C-014 の「対応させて数える」を、写像の言葉（A-024）で言い直したものです。たとえば、{1, 2, 3, 4} の部分集合 S に、長さ 4 の 0 と 1 の並び（i 番目は、i が S に入っていれば 1、入っていなければ 0）を対応させます。{1, 3} には 1010、∅ には 0000 が対応します。この写像は、ちがう部分集合をちがう並びに写し（《単射》）、どの並びにも、1 のある位置の集合が写ってくる（《全射》）ので、全単射です。並びは 2 × 2 × 2 × 2 = 16 個なので、部分集合も 16 個です。また、A から B への写像 f は、値の並び (f(1), f(2), f(3)) と 1 対 1 に対応するので、写像の個数は 4 × 4 × 4 = 64 です（積の法則）。そのうち単射は、f(1)、f(2)、f(3) がすべてちがうものなので 4 × 3 × 2 = 24 個です。A から A への全単射は、1、2、3 の並べ方と同じで 3 × 2 × 1 = 6 個です。
      - part: 思い出す
        text: 16 チームで勝ち抜き戦をします。引き分けはなく、負けたチームはそこで終わりです。優勝が決まるまでに、試合は何試合ありますか。
        answer: 15
        check: "16 - 1"
        hints:
          - 1 試合ごとに、負けるチームは何チームでしょう。
          - 優勝が決まったとき、負けたチームは何チームでしょう。
          - 試合と負けたチームを対応させましょう（C-014）。
        paths:
          - [1 試合で 1 チームが負ける, 優勝以外の 15 チームが 1 回ずつ負ける, 15 試合]
      - part: 思い出す
        text: A = {1, 2, 3}、B = {1, 2, 3, 4} とし、A から B への写像 f を f(1) = 2、f(2) = 4、f(3) = 1 と決めます。f について正しいものは、どれですか。
        choices: [全射だが単射でない, 単射だが全射でない, 全単射, 単射でも全射でもない]
        answer: 単射だが全射でない
        check: "(lambda f, A, B: (lambda inj, sur: '全単射' if inj and sur else '単射だが全射でない' if inj else '全射だが単射でない' if sur else '単射でも全射でもない')(len(set(f[x] for x in A)) == len(A), set(f[x] for x in A) == B))({1: 2, 2: 4, 3: 1}, [1, 2, 3], {1, 2, 3, 4})"
        hints:
          - 《像》がすべてちがうかを見ましょう（A-024）。
          - B の要素で、写ってこないものはあるでしょうか。
          - 値域を書き出しましょう。
        paths:
          - [像 2、4、1 はすべてちがうので単射, 3 に写る要素がないので全射でない]
      - part: 今日
        text: 集合 {1, 2, 3, 4, 5} から集合 {1, 2, 3} への写像は、いくつありますか。
        answer: 243
        check: "len([p for p in itertools.product(range(3), repeat=5)])"
        hints:
          - 写像は、値の並び (f(1), f(2), …, f(5)) と 1 対 1 に対応します。
          - f(1) の値は何通りでしょう。
          - 5 つの値を、それぞれ 3 通りから選びます。
        paths:
          - [値の並びと対応する, 3 × 3 × 3 × 3 × 3, 3⁵ = 243]
        note: 5 × 5 × 5 = 125 と、向きを逆にしやすい。決めるのは「1〜5 のそれぞれの行き先」で、行き先が 3 通り。
      - part: 今日
        text: 集合 {1, 2, 3, 4, 5, 6} の部分集合のうち、1 をふくみ、2 をふくまないものは、いくつありますか。
        answer: 16
        check: "len([1 for k in range(7) for s in itertools.combinations(range(1, 7), k) if 1 in s and 2 not in s])"
        hints:
          - 部分集合を、0 と 1 の並びに対応させましょう。
          - 1 番目と 2 番目は、もう決まっています。
          - 残りの 3 番目から 6 番目は、それぞれ何通りでしょう。
        paths:
          - [1 番目は 1、2 番目は 0 と決まる, 残り 4 か所は 0 か 1, 2⁴ = 16]
      - part: 挑戦
        text: 集合 {1, 2, 3, 4} から集合 {1, 2, 3, 4, 5, 6} への写像 f のうち、f(1) < f(2) < f(3) < f(4) となるものは、いくつありますか。
        answer: 15
        check: "len([p for p in itertools.product(range(1, 7), repeat=4) if p[0] < p[1] < p[2] < p[3]])"
        hints:
          - このような f は単射で、値域は 4 個の要素の集合です。
          - 値域 {f(1), f(2), f(3), f(4)} が決まると、f はいくつ決まるでしょう。
          - 1 から 6 までの数から 4 つを選ぶ選び方と対応させましょう。
        paths:
          - [f に値域を対応させる, 値域が決まると小さい順に f(1) から割りふるので f はただ 1 つ, 全単射なので ₆C₄ = 15]
        note: 単射の数 6 × 5 × 4 × 3 = 360 から、並べ方 24 でわっても 15 になる。値域との全単射に気づくと、すぐ ₆C₄ とわかる。
    extra:
      - part: 今日
        text: 集合 {1, 2, 3, 4} から集合 {1, 2, 3, 4} への全単射は、いくつありますか。
        answer: 24
        check: "len([p for p in itertools.permutations(range(4))])"
        hints:
          - 全単射は、値の並びがすべてちがい、どの値も 1 回ずつ出る並びと対応します。
          - f(1) は何通り、f(2) は何通りでしょう。
          - 1、2、3、4 の並べ方の数と同じです。
        paths:
          - [4 × 3 × 2 × 1 = 24]
      - part: 今日
        text: 長さ 7 の 0 と 1 の並びのうち、1 がちょうど 3 個あるものは、いくつありますか。
        answer: 35
        check: "len([p for p in itertools.product(range(2), repeat=7) if sum(p) == 3])"
        hints:
          - 並びを、1 のある位置の集合に対応させましょう。
          - 1 のある位置の集合は、{1, 2, …, 7} の部分集合で、要素が 3 個です。
          - 7 個から 3 個を選ぶ選び方の数です。
        paths:
          - [1 の位置の集合と対応する, ₇C₃ = 35]
      - part: 挑戦
        text: 集合 {1, 2, …, 8} の部分集合のうち、要素の個数が奇数のものは、いくつありますか。
        answer: 128
        check: "len([1 for k in range(1, 9, 2) for s in itertools.combinations(range(8), k)])"
        hints:
          - 部分集合 S に、「1 が入っていれば 1 を取り除き、入っていなければ 1 を加えた集合」を対応させてみましょう。
          - この対応で、要素の個数の偶奇はどう変わるでしょう。
          - この対応は、2 回くり返すと元にもどります。
        paths:
          - [1 を入れたり出したりする写像は 2 回で元にもどるので全単射, 偶数個の部分集合と奇数個の部分集合が 1 対 1, 全部で 2⁸ = 256 個の半分で 128]
        note: ₈C₁ + ₈C₃ + ₈C₅ + ₈C₇ = 8 + 56 + 56 + 8 と計算してもよい。偶数個と奇数個の間の全単射を見つけると、計算しなくても半分とわかる。

  - day: 2
    items:
      - part: 見本
        text: x + y + z = 8 を満たす 0 以上の《整数》の組 (x, y, z) の個数を、《全単射》を使って数えてみましょう。
        explain: 組 (x, y, z) に、○ を x 個、｜を 1 本、○ を y 個、｜を 1 本、○ を z 個と並べた並びを対応させます（C-013）。(3, 0, 5) なら ○○○｜｜○○○○○ です。逆に、○ 8 個と｜2 本の並びからは、1 本目の｜の前の ○ の数、2 本の｜の間の ○ の数、2 本目の｜の後の ○ の数で組がもどるので、この対応は全単射です。○ 8 個と｜2 本の並びは、10 か所から｜を置く 2 か所を選ぶので ₁₀C₂ = 45 個、よって組も 45 個です。正の整数の組なら、x = x' + 1、y = y' + 1、z = z' + 1 とおくと、(x, y, z) と、x' + y' + z' = 5 を満たす 0 以上の整数の組 (x', y', z') が 1 対 1 に対応するので、₇C₂ = 21 個です。また、1 ≦ a ≦ b ≦ c ≦ 5 を満たす整数の組 (a, b, c) には (a, b + 1, c + 2) を対応させます。すると 1 ≦ a < b + 1 < c + 2 ≦ 7 となり、1 から 7 までのちがう 3 つの数を小さい順に並べた組になります。逆《写像》 (a, b', c') ↦ (a, b' − 1, c' − 2) があるので全単射で、組は ₇C₃ = 35 個です。全単射であることは、このように逆写像がつくれることで確かめます。
      - part: 思い出す
        text: 4 種類のジュースから 3 本を選びます。同じ種類を何本選んでもかまいません。選び方は何通りですか。
        answer: 20
        check: "len([c for c in itertools.combinations_with_replacement(range(4), 3)])"
        hints:
          - 3 本を ○、種類の区切りを｜で表しましょう（C-013）。
          - 4 種類を区切るには、｜は何本いるでしょう。
          - ○ 3 個と｜3 本の並べ方を数えましょう。
        paths:
          - [○ 3 個と｜3 本の並び, 6 か所から｜の 3 か所を選ぶ, ₆C₃ = 20]
      - part: 思い出す
        text: 集合 {1, 2, 3, 4} から集合 {1, 2} への写像は、いくつありますか。
        answer: 16
        check: "len([p for p in itertools.product(range(2), repeat=4)])"
        hints:
          - 写像は、値の並び (f(1), f(2), f(3), f(4)) と対応します。
          - それぞれの値は何通りでしょう。
          - 積の法則を使いましょう。
        paths:
          - [2 × 2 × 2 × 2 = 16]
      - part: 今日
        text: x + y + z + w = 6 を満たす 0 以上の整数の組 (x, y, z, w) は、いくつありますか。
        answer: 84
        check: "len([p for p in itertools.product(range(7), repeat=4) if sum(p) == 6])"
        hints:
          - 組を、○ と｜の並びに対応させましょう。
          - ○ は 6 個です。4 つに区切るには、｜は何本いるでしょう。
          - ○ 6 個と｜3 本の並び方を数えましょう。
        paths:
          - [○ 6 個と｜3 本の並び, 9 か所から｜の 3 か所を選ぶ, ₉C₃ = 84]
        note: ｜を 4 本としやすい。4 つに分ける区切りは 3 本。
      - part: 今日
        text: x + y + z = 10 を満たす正の整数の組 (x, y, z) は、いくつありますか。
        answer: 36
        check: "len([p for p in itertools.product(range(1, 11), repeat=3) if sum(p) == 10])"
        hints:
          - x = x' + 1 のようにおいて、0 以上の整数の組に対応させましょう。
          - x' + y' + z' はいくつになるでしょう。
          - ○ と｜の並びに対応させましょう。
        paths:
          - [x' + y' + z' = 7 の 0 以上の整数の組と対応, ○ 7 個と｜2 本, ₉C₂ = 36]
          - [○ 10 個の間の 9 か所から、仕切りを入れる 2 か所を選ぶ, ₉C₂ = 36]
      - part: 挑戦
        text: 1 ≦ a ≦ b ≦ c ≦ d ≦ 6 を満たす整数の組 (a, b, c, d) は、いくつありますか。
        answer: 126
        check: "len([p for p in itertools.product(range(1, 7), repeat=4) if p[0] <= p[1] <= p[2] <= p[3]])"
        hints:
          - 等号があってもよい並びを、等号のない並びに対応させましょう。
          - (a, b + 1, c + 2, d + 3) を考えましょう。
          - その組は、1 から何までのちがう 4 つの数でしょう。
        paths:
          - ["(a, b + 1, c + 2, d + 3) を対応させる", "1 ≦ a < b + 1 < c + 2 < d + 3 ≦ 9", "1〜9 から 4 つを選ぶ", "₉C₄ = 126"]
          - [6 種類の数から 4 個を、同じものを何回でも選んでよい選び方, ○ 4 個と｜5 本で ₉C₄ = 126]
        note: 2 本目は C-013 の「何回でも選べる選び方」。どちらも ₉C₄ になるのは、どちらの見方も全単射だから。
    extra:
      - part: 今日
        text: 区別のない 8 個の玉を、区別のある 4 つの箱に入れます。空の箱があってもかまいません。入れ方は何通りですか。
        answer: 165
        check: "len([p for p in itertools.product(range(9), repeat=4) if sum(p) == 8])"
        hints:
          - 4 つの箱の玉の数を x、y、z、w とすると、x + y + z + w = 8 です。
          - ○ と｜の並びに対応させましょう。
          - ○ 8 個と｜3 本の並び方を数えましょう。
        paths:
          - [x + y + z + w = 8 の 0 以上の整数の組, ○ 8 個と｜3 本, ₁₁C₃ = 165]
      - part: 今日
        text: x + y + z = 9 を満たす整数の組 (x, y, z) のうち、x ≧ 2、y ≧ 1、z ≧ 0 となるものは、いくつありますか。
        answer: 28
        check: "len([p for p in itertools.product(range(10), repeat=3) if sum(p) == 9 and p[0] >= 2 and p[1] >= 1])"
        hints:
          - x = x' + 2、y = y' + 1 とおきましょう。
          - x' + y' + z はいくつになるでしょう。
          - 0 以上の整数の組を、○ と｜の並びで数えましょう。
        paths:
          - [x' + y' + z = 6 の 0 以上の整数の組と対応, ○ 6 個と｜2 本, ₈C₂ = 28]
      - part: 挑戦
        text: x + y + z ≦ 5 を満たす 0 以上の整数の組 (x, y, z) は、いくつありますか。
        answer: 56
        check: "len([p for p in itertools.product(range(6), repeat=3) if sum(p) <= 5])"
        hints:
          - 足りない分を w = 5 − (x + y + z) とおきましょう。
          - (x, y, z) と、x + y + z + w = 5 の 0 以上の整数の組を対応させましょう。
          - ○ 5 個と｜3 本の並び方を数えましょう。
        paths:
          - [w = 5 − x − y − z とおくと全単射, x + y + z + w = 5, ₈C₃ = 56]
          - [和が 0、1、2、3、4、5 の場合を足す, 1 + 3 + 6 + 10 + 15 + 21 = 56]
        note: 1 本目は「足りない分」という 4 つ目の数をつくる言いかえ。2 本目の場合分けでも求められるが、1 本目のほうが短い。

  - day: 3
    items:
      - part: 見本
        text: 1 から 11 までの数から、どの 2 つも隣り合わない（差が 2 以上の）4 つの数を選ぶ選び方を数えてみましょう。また、図のように、数の分け方を ○ の図で表して、行と列を入れかえてみましょう。
        svg: |
          <svg viewBox="0 0 260 140" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="7" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="40" cy="20" r="7" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="60" cy="20" r="7" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="80" cy="20" r="7" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="20" cy="45" r="7" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="40" cy="45" r="7" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="20" cy="70" r="7" stroke="currentColor" fill="none" stroke-width="2"/>
