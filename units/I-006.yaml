        explain: |-
          ひふは、ばいきんを とおさない かべの ような もので、きずが なければ ばいきんは からだの 中に 入れません。はなの 中の けと ねばねば（ねんえき）は、いきと いっしょに 入って くる ほこりや ばいきんを くっつけて とめます。のどの おくにも おなじ ねばねばが あります。なみだは 目の 上を いつも ぬらして、ごみを あらい ながします。ばいきんを よわらせる ものも ふくんで います。
          「ばいきん」は、さいきんや ウイルスを まとめた 子ども むけの ことばです。きょうは「ひふ、ねばねば、なみだ が、そとから くる ものを 入れない」が つかめれば よい。てかがみで はなの あなを 見たり、まばたきを して なみだを かんじたり して みると よい。
