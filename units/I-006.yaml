        explain: |-
          すりきずでは ひふが やぶれて ちが 出ます。ちは きずの よごれを ながし、しばらく すると かたまって あなを ふさぎます。これが かわいた ものが かさぶたで、ばいきんが 入らない ように する ふたの やくめを します。かさぶたの 下では、まわりから あたらしい ひふが のびて きて、きずを うめます。うまった ころ、かさぶたは しぜんに はがれます。
          むりに はがすと、また ちが 出て、なおるのが おそく なります。すりきずは、まず 水で あらって すなを おとす のが よい（きずが 大きい とき、ふかい とき、ちが とまらない とき は おいしゃさんへ）。きずを かわかさない ばんそうこうを はると、かさぶたが できずに なおる ことも あります。きょうは「ち → かさぶた → あたらしい ひふ」の じゅんが つかめれば よい。
