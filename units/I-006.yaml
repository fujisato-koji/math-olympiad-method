# I-006 からだを守るしくみ
#
# 段 1・水準 1・4 日。皮ふ（ばいきんを中に入れない）、鼻とのどのねばねば（ごみやばいきんをくっつけてつかまえる）、なみだ（目のごみを洗い流す）、すり傷がかさぶたになって治るまで（血が出る → 固まってかさぶた → 下に新しい皮ふ → 自然にとれる）、熱やせきや鼻水が出るわけ（ばいきんを追い出す・たたかうしるし）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 皮ふ・鼻とのどのねばねば・なみだ、2 日目 すり傷からかさぶた・治るまで、3 日目 わけ（せき・鼻水・熱が出るわけ）、4 日目 確認。
# 図の約束：ばいきんは紫のとげのある丸、ごみ・すな・ほこりは灰色の小さな丸、ねばねばは黄色の波のある層、なみだと鼻水は空色のしずく、血は赤、かさぶたは茶色のでこぼこ、新しい皮ふはうすい赤、熱は赤いくねった線と赤いほお。
# 「ばいきん」は細菌とウイルスをまとめた子ども向けのことば。目に見えない生き物と手洗いは B-074、免疫のしくみは B-037 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも、絵を読む読み取り（kinds: 読み取り）。

id: I-006
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          目に 見えない ほど 小さな ばいきんが からだに 入ると、びょうきに なる ことが あります。えの 中の むらさきの とげとげの まるは、ばいきんです。
          ひふは、からだを つつんで、ばいきんを 中に 入れません。
          はなや のどの 中には ねばねばが あって、ごみや ばいきんを くっつけて つかまえます。はなの 中の けも、ごみを とめます。
          なみだは、目に 入った ごみを あらい ながします。
