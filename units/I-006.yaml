        explain: |-
          「はなや のどの ねばねばに つかまった ばいきんを、せきで 口から ふきとばしたり、はなみずで ながしたり して、からだの そとへ 出す。ねつは、からだを あつく して ばいきんと たたかって いる。だから、せきや はなみずや ねつは、からだが まもって いる しるし。」と いえれば よい。
          ① せき・くしゃみは ふきとばす、② はなみずは ながす、③ ねつは たたかう、の 3 つが 入れば よい。からだが あつく なると、ばいきんと たたかう しくみが よく はたらき、ばいきんの ほうは ふえにくく なります。ただし、ねつが たかい とき、ぐったり して いる とき、いきが くるしそうな ときは、おいしゃさんに みて もらいましょう。
        hints:
          - 1 日目の、はなや のどの ねばねばを おもいだそう。つかまえた ばいきんは、その あと どう したら よいかな。
          - text: ねばねばに つかまった ばいきんが、はなや のどに たまって いるよ。
