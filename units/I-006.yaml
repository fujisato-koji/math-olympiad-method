    items:
      - part: 見本
        text: |-
          ころんで ひざを すりむいた きずを、すりきずと いいます。ひふが やぶれて、ちが 出ます。
          しばらく すると、ちが かたまって、こげちゃいろの かさぶたに なります。かさぶたは、きずの ふたです。
          かさぶたの 下では、きずの まわりから あたらしい ひふ（うすい ピンク）が できて きます。かさぶたは だんだん 小さく なり、しぜんに とれて、なおります。
