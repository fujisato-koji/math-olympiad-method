          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/2 × 2 × 100 = 100 J]
      - part: 今日
        text: 質量 1 kg、高さ 10 m の重力による位置エネルギーはいくつですか。
        choices: [9.8, 49, 98, 196]
        answer: 98
        check: "f'{1 * 9.8 * 10:.0f}'"
        hints:
