# P-004 仕事とエネルギー（仕事と仕事率、運動エネルギーと位置エネルギー、力学的エネルギー保存、保存力とポテンシャル）
#
# 段 5・水準 3・8 日。前提は D-006（微分積分の入口）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 重力加速度は g = 9.8 m/s²。単位は J、W、N、m、kg、m/s。
# 計算は、整数になるように数を選ぶ。小数は 1 桁まで。

id: P-004
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          仕事 W は、力 F と、力の向きに動いた距離 d と、力と移動の向きの角 θ を使って
          W = F d cos θ
          と書きます。単位は J（ジュール）。仕事率 P は、仕事を時間 t でわったもので、P = W / t。単位は W（ワット）。
          ・20 N の力で、力の向きに 5 m 動かすと、W = 20 × 5 = 100 J。
          ・100 J の仕事を 10 s ですると、P = 100 / 10 = 10 W。
          ・10 N の力で、力の向きと 60° の向きに 4 m 動かすと、W = 10 × 4 × cos 60° = 20 J。
        explain: |-
          仕事は「力 × 力の向きに動いた距離」。力と移動の向きが同じなら cos 0° = 1 で、W = Fd。垂直なら cos 90° = 0 で、仕事は 0。
          cos 60° = 1/2 なので、10 × 4 × 1/2 = 20 J。
          仕事率は、1 秒あたりの仕事。100 J を 10 s ですると、10 W。
        note: 仕事は「力が物体を動かした量」。力と移動の向きが違うときは、cos θ をかける。
      - part: 思い出す
        text: 20 N の力で、力の向きに 5 m 動かす仕事はいくつですか。
        choices: [4, 25, 100, 500]
        answer: 100
        check: "20 * 5"
        hints:
          - 仕事は 力 × 距離 です。
          - 20 × 5 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [20 × 5 = 100 J]
      - part: 思い出す
        text: 速さ 10 m/s で 5 s 進む距離はいくつですか。
        choices: [2, 5, 50, 100]
        answer: 50
        check: "10 * 5"
        hints:
          - 距離は 速さ × 時間 です。
          - 10 × 5 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [10 × 5 = 50 m]
      - part: 今日
        text: 10 N の力で、力の向きに 4 m 動かす仕事はいくつですか。
        choices: [4, 14, 40, 400]
        answer: 40
        check: "10 * 4"
        hints:
          - 力の向きと移動の向きが同じなので、W = Fd です。
          - 10 × 4 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [10 × 4 = 40 J]
      - part: 今日
        text: 100 J の仕事を 10 s でするとき、仕事率はいくつですか。
        choices: [1, 10, 100, 1000]
        answer: 10
        check: "100 // 10"
        hints:
          - 仕事率は 仕事 ÷ 時間 です。
          - 100 ÷ 10 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [100 ÷ 10 = 10 W]
      - part: 挑戦
        text: 10 N の力で、力の向きと 60° の向きに 4 m 動かす仕事はいくつですか。
        choices: [10, 20, 40, 80]
        answer: 20
        check: "10 * 4 // 2"
        hints:
          - 仕事は F d cos θ です。
          - cos 60° = 1/2 です。
          - 10 × 4 × 1/2 を計算しましょう。
        paths:
          - [cos 60° = 1/2, 10 × 4 × 1/2 = 20 J]
        note: 力と移動の向きが 60° なので、仕事は半分になる。
    extra:
