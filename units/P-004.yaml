          - 1 × 9.8 × 10 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1 × 9.8 × 10 = 98 J]
      - part: 今日
        text: 質量 2 kg の物体が高さ 5 m から落ちました。高さ 2 m での運動エネルギーはいくつですか。
        choices: [19.6, 39.2, 58.8, 98]
        answer: 58.8
        check: "f'{(2 * 9.8 * 5 - 2 * 9.8 * 2):.1f}'"
        hints:
          - はじめの力学的エネルギーは 2 × 9.8 × 5 = 98 J です。
          - 高さ 2 m での位置エネルギーは 2 × 9.8 × 2 = 39.2 J です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [E = 98 J, U(2 m) = 39.2 J, K = 58.8 J]
      - part: 挑戦
        text: 質量 1 kg の物体が高さ 5 m から落ちました。地面での速さはいくつですか。
        choices: [5.0, 7.0, 9.9, 14.0]
        answer: 9.9
