      - part: 今日
        text: 質量 2 kg の物体が、速さ 2 m/s から 4 m/s になりました。された仕事はいくつですか。
        choices: [4, 8, 12, 16]
        answer: 12
        check: "2 * 4 ** 2 // 2 - 2 * 2 ** 2 // 2"
        hints:
          - あとの K は 1/2 × 2 × 4² = 16 J です。
          - はじめの K は 1/2 × 2 × 2² = 4 J です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [あと 16 J、はじめ 4 J, 12 J]
      - part: わけ
        text: 仕事が運動エネルギーの変化に等しいわけを、F = ma と v² − v₀² = 2as から説明しましょう。
        explain: 「F = ma、仕事 W = Fs = mas。v² − v₀² = 2as から as = (v² − v₀²)/2。よって W = m(v² − v₀²)/2 = 1/2 mv² − 1/2 mv₀² = ΔK。」と書ければよい。① F = ma、② v² − v₀² = 2as で as を置きかえる、③ ΔK と結ぶ。子どもには、一定の力でまっすぐ動く場合を確かめさせます。
        hints:
          - 仕事は W = Fs、F = ma なので W = mas です。
          - v² − v₀² = 2as から、as を書きましょう。
          - W = 1/2 mv² − 1/2 mv₀² になります。
        paths:
          - [W = Fs = mas, as = (v²−v₀²)/2, W = 1/2 mv² − 1/2 mv₀² = ΔK]

  - day: 3
    items:
      - part: 見本
        text: |-
          重力による位置エネルギー U = m g h。g = 9.8 m/s²。
          力学的エネルギー E = K + U は、重力だけが仕事をするとき保存されます。
          ・質量 2 kg、高さ 5 m の U = 2 × 9.8 × 5 = 98 J。
          ・高さ 0 での K は 98 J なので、1/2 × 2 × v² = 98、v² = 98、v ≈ 9.9 m/s。
        explain: |-
          位置エネルギーは、高い所にある物体が持つエネルギー。U = mgh。
          質量 2 kg、高さ 5 m：U = 2 × 9.8 × 5 = 98 J。
          高さ 5 m から落ちると、U が K に変わり、地面で K = 98 J。1/2 × 2 × v² = 98 から v² = 98、v ≈ 9.9 m/s。
          空気の抵抗や摩擦がなければ、E = K + U は一定です。
        note: 位置エネルギーは高さに比例する。落ちるにつれて U が減り、K が増える。
      - part: 思い出す
        text: 質量 2 kg、高さ 5 m の重力による位置エネルギーはいくつですか。
        choices: [10, 49, 98, 196]
        answer: 98
        check: "f'{2 * 9.8 * 5:.0f}'"
        hints:
          - 位置エネルギーは mgh です。
          - 2 × 9.8 × 5 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [2 × 9.8 × 5 = 98 J]
      - part: 思い出す
        text: 質量 2 kg、速さ 10 m/s の運動エネルギーはいくつですか。
        choices: [10, 20, 100, 200]
        answer: 100
