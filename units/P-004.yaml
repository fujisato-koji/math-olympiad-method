      - part: わけ
        text: 重力だけが仕事をするとき、力学的エネルギー K + U が保存されるわけを説明しましょう。
        explain: 「高い所から落ちると、重力がする仕事は W = mg(h₁ − h₂)。仕事は運動エネルギーの変化に等しいので、K₂ − K₁ = mg(h₁ − h₂)。よって K₂ + mgh₂ = K₁ + mgh₁、つまり K + U は一定。」と書ければよい。① 重力の仕事、② 仕事と運動エネルギーの関係、③ 位置エネルギーを移項して保存則。子どもには、数値を入れて両辺が等しいことを確かめさせます。
        hints:
          - 重力がする仕事は mg(h₁ − h₂) です。
          - 仕事は K₂ − K₁ に等しいです。
          - K₂ − K₁ = mg(h₁ − h₂) を移項しましょう。
        paths:
          - [W = mg(h₁−h₂), K₂−K₁ = W, K₂+mgh₂ = K₁+mgh₁, K+U は一定]

  - day: 4
    items:
      - part: 見本
        text: |-
          ばねの弾性エネルギー U = (1/2) k x²。k はばね定数、x は自然の長さからの縮み・伸び。
          摩擦力がする仕事は、摩擦力の大きさ f と動いた距離 d を使って、−f d（向きが逆なので負）。
          ・k = 100 N/m、x = 0.2 m の U = 1/2 × 100 × 0.2² = 2 J。
          ・f = 5 N の摩擦力に逆らって 3 m 動かすと、摩擦力のする仕事は −15 J。
        explain: |-
          ばねの弾性エネルギーは、縮み・伸びの 2 乗に比例します。k = 100、x = 0.2 なら、1/2 × 100 × 0.04 = 2 J。
          摩擦力は動きと逆向きに働くので、摩擦力がする仕事は負になります。大きさは f d、符号は負です。
        note: ばねは「縮めた分」をエネルギーとしてためる。摩擦力はエネルギーを熱にして減らす。
