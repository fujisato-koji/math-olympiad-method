      - part: わけ
        text: 力と移動の向きが垂直なとき、仕事が 0 になるわけを説明しましょう。
        explain: 「仕事は W = F d cos θ。θ = 90° のとき cos 90° = 0 なので、W = 0。力は物体を動かす向きに成分を持たないので、仕事をしない。」と書ければよい。① 仕事の式、② cos 90° = 0、③ 力の向きの成分がない、の 3 つ。子どもには、持ち上げた荷物を水平に運ぶとき、重力は仕事をしないことを確かめさせます。
        hints:
          - 仕事の式は W = F d cos θ です。
          - θ = 90° のとき、cos 90° はいくつですか。
          - 力の向きに動いていないので、仕事は 0 です。
        paths:
          - [W = F d cos θ, cos 90° = 0, W = 0]

  - day: 2
    items:
      - part: 見本
        text: |-
          運動エネルギー K = (1/2) m v²。質量 m、速さ v。
          仕事と運動エネルギーの関係：W = K_2 − K_1 = ΔK。運動エネルギーは、前を K_1、後を K_2 とします。
          ・質量 2 kg、速さ 10 m/s の K = 1/2 × 2 × 10² = 100 J。
          ・質量 4 kg、速さ 5 m/s の K = 1/2 × 4 × 5² = 50 J。
        explain: |-
          W は仕事、K_1 は前の運動エネルギー、K_2 は後の運動エネルギー、ΔK = K_2 − K_1 です。
          運動エネルギーは、動いている物体が持つエネルギー。質量に比例し、速さの 2 乗に比例します。
          質量 2 kg、速さ 10 m/s：1/2 × 2 × 100 = 100 J。
          質量 4 kg、速さ 5 m/s：1/2 × 4 × 25 = 50 J。
          仕事をすると、その分だけ運動エネルギーが増えます（W = ΔK）。
        note: 速さが 2 倍になると、運動エネルギーは 4 倍になる。速さの 2 乗に比例する。
      - part: 思い出す
        text: 質量 2 kg、速さ 10 m/s の運動エネルギーはいくつですか。
        choices: [10, 20, 100, 200]
        answer: 100
        check: "2 * 10 ** 2 // 2"
        hints:
          - 運動エネルギーは 1/2 m v² です。
          - 1/2 × 2 × 10² を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/2 × 2 × 100 = 100 J]
      - part: 思い出す
        text: 20 N の力で、力の向きに 5 m 動かす仕事はいくつですか。
        choices: [4, 25, 100, 500]
        answer: 100
        check: "20 * 5"
        hints:
          - 仕事は 力 × 距離 です。
          - 20 × 5 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [20 × 5 = 100 J]
      - part: 今日
        text: 質量 4 kg、速さ 5 m/s の運動エネルギーはいくつですか。
        choices: [20, 50, 100, 200]
        answer: 50
        check: "4 * 5 ** 2 // 2"
        hints:
          - 運動エネルギーは 1/2 m v² です。
          - 1/2 × 4 × 5² を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/2 × 4 × 25 = 50 J]
      - part: 今日
        text: 質量 2 kg の物体が、速さ 0 から 6 m/s になりました。された仕事はいくつですか。
        choices: [12, 36, 72, 144]
        answer: 36
        check: "2 * 6 ** 2 // 2"
        hints:
          - 仕事は運動エネルギーの変化 ΔK です。
          - はじめの K は 0、あとの K は 1/2 × 2 × 6² です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [ΔK = 1/2 × 2 × 36 − 0 = 36 J]
      - part: 挑戦
        text: 質量 3 kg、速さ 4 m/s の運動エネルギーはいくつですか。
        choices: [12, 24, 48, 96]
        answer: 24
        check: "3 * 4 ** 2 // 2"
        hints:
          - 運動エネルギーは 1/2 m v² です。
          - 1/2 × 3 × 4² を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1/2 × 3 × 16 = 24 J]
    extra:
      - part: 今日
        text: 質量 1 kg、速さ 10 m/s の運動エネルギーはいくつですか。
        choices: [5, 10, 50, 100]
        answer: 50
        check: "1 * 10 ** 2 // 2"
        hints:
          - 運動エネルギーは 1/2 m v² です。
          - 1/2 × 1 × 10² を計算しましょう。
