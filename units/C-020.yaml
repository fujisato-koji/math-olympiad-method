        text: 大小 2 つのサイコロの目の和の期待値は、それぞれの目の期待値の和 7/2 + 7/2 = 7 になりました。どの場合も同じ程度に起こる試行で、2 つの確率変数 X、Y について E(X + Y) = E(X) + E(Y) がいつも成り立つわけを、筋道を立てて書きましょう。
        explain: 例：「起こりうる場合が全部で N 通りあり、どれも同じ程度に起こるとする。このとき期待値は、すべての場合の値の合計を N でわった数である（同じ値の場合をまとめて (値 × 確率) にしても、1 つずつ (値 × 1/N) をたしても、分配法則で同じになる）。1 つの場合を見ると、X + Y の値は、その場合の X の値と Y の値の和である。すべての場合について X + Y の値をたすと、たす順を入れかえてまとめてよい（N-015）ので、(X の値の合計) + (Y の値の合計) になる。これを N でわると、分配法則で (X の値の合計) ÷ N + (Y の値の合計) ÷ N、つまり E(X) + E(Y) になる。X、Y がどんな確率変数でも同じ筋道なので、E(X + Y) = E(X) + E(Y) はいつも成り立つ。」と書ければよい。①「場合が N 通りとする」で場合の数を決め、期待値を「値の合計 ÷ N」と言いかえる、② X + Y の値の合計を、X の値の合計と Y の値の合計に分ける（入れかえとまとめ）、③ 分配法則と期待値の意味で結ぶ、の 3 つがそろっているかを見る。サイコロの例で 7/2 + 7/2 = 7 を確かめただけで終わっていたら、例ではすべての X、Y を示せないことを話す。筋道の中で X と Y が関係しないことを使っていないので、同じカードから引く数のように互いに関係する確率変数でも成り立つことにも触れる。
        hints:
          - 起こりうる場合が N 通りで、どれも同じ程度に起こるとしましょう。
          - 期待値は「すべての場合の値の合計 ÷ N」と言いかえられます。
          - X + Y の値の合計を、X の値の合計と Y の値の合計に分けましょう。
        paths:
          - [場合が N 通りとする, E(X + Y) = (X + Y の値の合計) ÷ N, X + Y の値の合計 = (X の値の合計) + (Y の値の合計), N でわって E(X) + E(Y)]
      - part: わけ
        text: サイコロの目を X とすると、E(3X + 2) = 3 × 7/2 + 2 = 25/2 でした。どんな確率変数 X でも E(3X + 2) = 3E(X) + 2 が成り立つわけを、どの場合も同じ程度に起こる試行について、筋道を立てて書きましょう。
        explain: 例：「場合が N 通りあり、どれも同じ程度に起こるとする。どの場合でも、3X + 2 の値は (その場合の X の値) × 3 + 2 である。すべての場合についてたすと、3 倍の部分は分配法則で (X の値の合計) × 3 にまとまり、2 の部分は 2 を N 回たすので 2 × N になる。これを N でわると、(X の値の合計) ÷ N × 3 + 2 × N ÷ N = 3E(X) + 2 である。」と書ければよい。①「場合が N 通りとする」で場合の数を決める、② 値の合計を「3 倍の部分」と「2 が N 回の部分」に分ける、③ 分配法則と期待値の意味で結ぶ、の 3 つを見る。2 を N 回たすことを落として「3E(X) + 2 ÷ N」としやすい。3 と 2 をほかの数にしても同じ筋道で言える（E(aX + b) = aE(X) + b）ことに触れる。前の問題を使い、3X + 2 を X + X + X + 2（2 は「いつも 2」の確率変数で、期待値は 2）と見る道もある。
        hints:
          - 場合が N 通りで、どれも同じ程度に起こるとしましょう。
          - 3X + 2 の値をすべての場合についてたすと、どのように分けられるでしょう。
