# C-020 期待値とその線形性
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり（1 日の組は 思い出す 2・今日 2・挑戦 1、わけの深さは ③）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）に次のねらいを当てた。
#   1 日目：確率変数と確率分布（表）、期待値 E(X) ＝ (値 × その値をとる確率) の和。どの場合も同じ程度に起こるときは「値の合計 ÷ 場合の数」と同じ。
#   2 日目：期待値を求める（2 つのサイコロの和、同時に取り出す玉の個数）、期待値で比べる、投げなおしの決め方。
#   3 日目：線形性（頭に見本）。E(X + Y) ＝ E(X) + E(Y)、E(3X + 2) ＝ 3E(X) + 2、0 か 1 の確率変数で回数・個数の期待値を確率の和にする。
#   4 日目：わけ（3 問とも ③：和の期待値は期待値の和、E(3X + 2) ＝ 3E(X) + 2、回数の期待値は確率の和）。
#   5 日目：C-011（確率）、C-007（組合せ）と混ぜる（並び、同時に取り出す、目の種類の数、表裏の並び）。6 日目：確認。
# 前提は C-011 だけ（たどると C-007、C-006、A-005、N-019、N-078 など）。
#   文字と式（A-010）は前提のたどりにないので、文字は確率変数の名前（X、Y）と、わけの例の「N 通り」だけにし、
#   式の変形は、たし算の入れかえとまとめ・分配法則（N-015）を言葉で使う形にした。負の数（N-010）もたどりにないので、
#   損得はひき算で正の数になる形で聞く（「払う金額より何円少ないか」）。
#   わけは、どの場合も同じ程度に起こる試行（C-011 の場合の数の比）に限って示す。一般の確率での証明は S-001 以降。
#   確率変数の分散は扱わない（S-041 で、S-030 のデータの分散から入る）。独立な試行のかけ算（C-043）は前提にないので、
#   何回も投げる問題は、全部の場合を積の法則で数えるか、0 か 1 の確率変数の和（線形性）で求める。
# 答えは約分した分数か整数。分数が有限小数になるときは accept に小数を入れる。式やゲームを選ぶ問題は choices。
# check は、itertools.product（サイコロ、コイン）、combinations（同時に取り出す）、permutations（並ぶ順）で全部の場合を作り、
#   Fraction で (値 × 確率) をたす。期待値の線形性で求める問題も、check は全部の場合からの計算にして、答えの道と別の道で確かめる。
# 期待値は、確率的方法（C-027）、保険の純保険料（F-015）、スポーツの戦略（K-065）、行動生態学（B-058）の入口になる（D-026）。

id: C-020
days:
  - day: 1
    items:
      - part: 見本
        text: 10 本のくじがあり、1 等（500 円）が 1 本、2 等（100 円）が 3 本、はずれ（0 円）が 6 本です。よくまぜて 1 本引くとき、もらえる金額の期待値を求めてみましょう。
        svg: |
          <svg viewBox="0 0 294 80" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="274" height="30" fill="#f3c969" fill-opacity=".35" stroke="none"/>
            <rect x="10" y="10" width="274" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="84" y1="10" x2="84" y2="70" stroke="currentColor" stroke-width="1.5"/>
            <line x1="136" y1="10" x2="136" y2="70" stroke="currentColor" stroke-width="1.5"/>
            <line x1="188" y1="10" x2="188" y2="70" stroke="currentColor" stroke-width="1.5"/>
            <line x1="240" y1="10" x2="240" y2="70" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10" y1="40" x2="284" y2="40" stroke="currentColor" stroke-width="1.5"/>
            <text x="47" y="30" font-size="13" text-anchor="middle">X（円）</text>
            <text x="110" y="30" font-size="13" text-anchor="middle">500</text>
            <text x="162" y="30" font-size="13" text-anchor="middle">100</text>
            <text x="214" y="30" font-size="13" text-anchor="middle">0</text>
            <text x="262" y="30" font-size="13" text-anchor="middle">計</text>
            <text x="47" y="60" font-size="13" text-anchor="middle">確率</text>
            <text x="110" y="60" font-size="13" text-anchor="middle">1/10</text>
            <text x="162" y="60" font-size="13" text-anchor="middle">3/10</text>
            <text x="214" y="60" font-size="13" text-anchor="middle">6/10</text>
            <text x="262" y="60" font-size="13" text-anchor="middle">1</text>
          </svg>
        explain: 1 本引いてもらえる金額を X 円とします。X は、引いたくじによって 500、100、0 のどれかの値をとり、それぞれの値をとる確率が決まっています。このように、とる値ごとに確率が決まっている変わる数を確率変数といい、値と確率を並べた表（図）を X の確率分布といいます。確率の合計は 1 です。X の期待値 E(X) は、(値 × その値をとる確率) をすべてたした数です。E(X) = 500 × 1/10 + 100 × 3/10 + 0 × 6/10 = 50 + 30 + 0 = 80 で、期待値は 80 円です。10 本を全部引いたとすると、もらえる金額の合計は 500 + 100 × 3 = 800 円で、1 本あたり 800 ÷ 10 = 80 円になります。期待値は、くり返し引いたときの 1 回あたりの平均の値です。どの場合も同じ程度に起こるときは、期待値は「すべての場合の値の合計 ÷ 場合の数」と同じです。
      - part: 思い出す
        text: 大小 2 つのサイコロを同時に投げます。目の和が 4 になる確率を求めましょう。
        answer: 1/12
        check: "Fraction(sum(1 for a in range(1, 7) for b in range(1, 7) if a + b == 4), 36)"
        hints:
          - 目の出方は全部で 6 × 6 = 36 通りで、どれも同じ程度に起こります。
          - 和が 4 になる (大, 小) の組を書き出しましょう。
          - (当てはまる場合の数) ÷ (全部の場合の数) を約分しましょう。
        paths:
          - ["\"(1, 3)、(2, 2)、(3, 1) の 3 通り\"", "3/36 = 1/12"]
      - part: 思い出す
        text: 袋に赤玉が 4 個、白玉が 3 個入っています。よくまぜて同時に 2 個取り出すとき、2 個とも白玉になる確率を求めましょう。
        answer: 1/7
        check: "Fraction(sum(1 for c in itertools.combinations(range(7), 2) if min(c) >= 4), math.comb(7, 2))"
        hints:
          - 7 個から 2 個を選ぶ選び方は何通りでしょう（C-007）。
          - 白玉 3 個から 2 個を選ぶ選び方は何通りでしょう。
          - 場合の数の比を約分しましょう。
        paths:
          - [全部で 7 × 6 ÷ 2 = 21 通り, 白玉 2 個は 3 通り, 3/21 = 1/7]
      - part: 今日
        text: サイコロを 1 回投げて、出た目の数を X とします。X の期待値 E(X) を求めましょう。
        answer: 7/2
        accept: [3.5]
        check: "sum(Fraction(k, 6) for k in range(1, 7))"
        hints:
          - X のとる値は 1 から 6 で、それぞれの値をとる確率はいくつでしょう。
          - (値 × 確率) をすべてたしましょう。
          - 1 + 2 + 3 + 4 + 5 + 6 をまとめて計算すると楽です。
        paths:
          - [どの値も確率は 1/6, (1 + 2 + 3 + 4 + 5 + 6) × 1/6 = 21/6 = 7/2]
        note: 期待値 7/2 は、X が実際にはとらない値。「いちばん出やすい目」ではなく、くり返したときの平均の値であることを確かめる。
      - part: 今日
        text: 10 円玉と 100 円玉を 1 枚ずつ同時に投げ、表が出た硬貨の金額の合計を X 円とします（どちらも裏なら X = 0）。X の期待値を求めましょう。
        answer: 55
        check: "sum(Fraction(10 * a + 100 * b, 4) for a in (0, 1) for b in (0, 1))"
        hints:
          - 表と裏の出方は 4 通りで、どれも同じ程度に起こります。
          - それぞれの出方での X の値を書き出しましょう。
          - (値 × 確率) をすべてたしましょう。
        paths:
          - [X は 0、10、100、110 のどれかで、確率はどれも 1/4, (0 + 10 + 100 + 110) × 1/4 = 55]
      - part: 挑戦
        text: 20 本のくじのうち、当たりが 4 本で、はずれは 0 円です。1 本引いてもらえる金額の期待値を 150 円にするには、当たりの賞金を何円にすればよいですか。
        answer: 750
        check: "Fraction(150 * 20, 4)"
        hints:
          - 期待値は、くじを全部引いたときの金額の合計を、本数でわった数と同じです。
          - 20 本を全部引いたときの金額の合計は、何円になればよいでしょう。
          - その合計を、当たりの 4 本で分けましょう。
        paths:
          - [20 本の合計は 150 × 20 = 3000 円, 当たり 4 本で 3000 円, 3000 ÷ 4 = 750]
        note: 期待値の意味（1 本あたりの平均）を逆にたどる。賞金 × 4/20 = 150 の形に気づけば、150 ÷ (1/5) でもよい。
