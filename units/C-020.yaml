      - part: わけ
        text: サイコロを 6 回投げて、1 の目が出る回数の期待値は 1 です。1 回目から 6 回目のそれぞれについて「その回に 1 の目が出たら 1、出なかったら 0」となる確率変数を考えて、このわけを筋道を立てて書きましょう。また、「6 回投げれば 1 の目は必ず 1 回出る」とは言えないことにもふれましょう。
        explain: 例：「1 回目、2 回目、…、6 回目について、その回に 1 の目が出たら 1、出なかったら 0 となる確率変数を、それぞれ X₁、X₂、…、X₆ とする。どの回も 1 の目が出る確率は 1/6 なので、E(X₁) = 1 × 1/6 + 0 × 5/6 = 1/6 で、ほかの回も同じである。1 の目が出る回数は、1 が出た回だけ 1 を数えるので、X₁ + X₂ + … + X₆ に等しい。和の期待値は期待値の和（前の問題）をくり返し使うと、回数の期待値は E(X₁) + … + E(X₆) = 6 × 1/6 = 1 である。期待値は平均の値なので、6 回とも 1 が出ないこともある（その確率は (5/6)⁶ で、およそ 0.33）。」と書ければよい。① 0 か 1 の確率変数を 6 つ決める、② 回数をその和で表す、③ 和の期待値は期待値の和、と期待値の意味で結ぶ、の 3 つを見る。「6 回に 1 回出るから 1」とだけ書いていたら、それは期待値の意味の言いかえで、わけになっていないことを話す。0 回の確率は、6 回の出方 6⁶ 通りのうち、1 が出ない 5⁶ 通りで求められる（C-011）。
        hints:
