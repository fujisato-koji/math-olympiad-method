# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 手数]
    uses: [N-017]
    text: 1 から 30 までの数を 1 つずつ書いた 30 枚のカードがあります。よくまぜて 1 枚引くとき、引いたカードの数の《約数》の個数を X とします（たとえば 6 を引いたら、約数は 1、2、3、6 なので X = 4）。X の期待値を求めましょう。
    answer: 37/10
    accept: [3.7]
    check: "Fraction(sum(1 for n in range(1, 31) for d in range(1, 31) if n % d == 0), 30)"
    hints:
      - 1 から 30 までの数 d のそれぞれについて、「d が引いた数の約数なら 1、そうでなければ 0」とする確率変数を考えてみよう。
      - d が引いた数の約数になる確率は、(30 までの d の《倍数》の個数) ÷ 30 だね。
      - d = 1 から 30 までの確率をたそう。倍数の個数は、30 ÷ d の商だよ。
    paths:
      - [X = (d が約数なら 1 の和、d は 1〜30), d の倍数は 30 までに (30 ÷ d の商) 個, 30 + 15 + 10 + 7 + 6 + 5 + 4 + 3 + 3 + 3 + 2 × 5 + 1 × 15 = 111, 111 ÷ 30 = 37/10]
      - [1 から 30 の約数の個数を 1 つずつ数える, 1、2、2、3、2、4、… の合計は 111, 111 ÷ 30 = 37/10]
    note: 約数の個数を、数の側から数える（30 個の数の約数を 1 つずつ数える）か、約数の側から数える（d の倍数の個数をたす）かの二通りの数え方。線形性で約数ごとに分けると、倍数の個数（N-017）の和になる。どちらの道でも合計 111 になるかで確かめさせる。
  - part: 離
    kinds: [道筋]
    text: 1 から 8 までの数を 1 つずつ書いた 8 枚のカードを、よくまぜて、円く並んだ 8 つの席に 1 枚ずつ置きます。両どなりの 2 枚のカードより大きい数が書かれたカードの枚数の期待値を求めましょう。
    answer: 8/3
    check: "Fraction(sum(sum(1 for i in range(8) if p[i] > p[i - 1] and p[i] > p[(i + 1) % 8]) for p in itertools.permutations(range(8))), math.factorial(8))"
    hints:
      - 1 つの席に注目して、「その席のカードが両どなりより大きければ 1、そうでなければ 0」とする確率変数を考えよう。
      - その席と両どなりの 3 枚だけを見ると、どれがいちばん大きいかは、どれも同じ程度に起こるね。
      - 8 つの席の期待値をたそう。
    paths:
      - [1 つの席のカードが両どなりより大きい確率は 1/3, 8 席で 8 × 1/3 = 8/3]
    note: 置き方は 8! = 40320 通りあり、全部は数えられない。1 つの席とその両どなりの 3 枚だけを見ると、3 枚のどれが最大かは同じ程度（対称性）に気づくのが要点。席どうしは関係しあう（となり合う 2 席が両方とも当てはまることはない）が、線形性はそのまま使える。
