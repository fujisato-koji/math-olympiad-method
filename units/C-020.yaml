  - day: 3
    items:
      - part: 見本
        text: 大小 2 つのサイコロを投げ、大きいサイコロの目を X、小さいサイコロの目を Y とします。目の和 X + Y の期待値を、X と Y の期待値から求めてみましょう。
        explain: E(X) = E(Y) = 7/2 です。2 日目に 36 通りの表から求めた目の和の期待値 7 は、7/2 + 7/2 と同じです。一般に、2 つの確率変数 X、Y について E(X + Y) = E(X) + E(Y) が成り立ちます（和の期待値は、期待値の和）。X と Y が互いに関係していても成り立ちます。また、X を何倍かして数を足した確率変数では、たとえば E(3X + 2) = 3E(X) + 2 です。これらをまとめて、期待値の線形性といいます。さらに、「当たったら 1、はずれたら 0」とする確率変数の期待値は、1 × (当たる確率) + 0 × (はずれる確率) で、当たる確率と同じです。何回もくり返すときの当たりの回数は、この 0 か 1 の確率変数の和なので、回数の期待値は確率をたした数になります。たとえば、サイコロを 12 回投げて 1 の目が出る回数の期待値は、1/6 を 12 回たして 2 です。わけは 4 日目に示します。
      - part: 思い出す
        text: 1 から 8 までの数を 1 つずつ書いた 8 枚のカードがあります。よくまぜて 1 枚引くとき、引いたカードの数の期待値を求めましょう。
        answer: 9/2
        accept: [4.5]
        check: "sum(Fraction(k, 8) for k in range(1, 9))"
        hints:
