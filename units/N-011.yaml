# N-011 絶対値（数直線の上の距離）
#
# 書き方は N-001 の頭の注のとおり。図と答えの形は N-004、N-010 に合わせる（数直線は「 ─ 」、− は U+2212）。
#   check の fig.split(' ─ ') は目もりを左から並べたもの。2 つの目もりの間の数は index の差。
# 絶対値は「0 から いくつ はなれて いるか」（0 からの距離）で決め、|−3| と書いて「ぜったいち」と読む。
# 絶対値と 2 つの数のはなれている数（きょり）は 0 か正の数なので、打つ答えにする。
#   0 より小さくなりうる数を答える問題（どちらが 0 から遠いか、ある数から 3 はなれた数など）は choices にする。
#   check で「−3」の形にするのは N-004 と同じ (lambda v: f'−{-v}' if v < 0 else f'{v}')(式)。
# 3 日目のわけは ①〜②：|−4| と |4| が等しいわけ、−2 と 3 のきょりが 5 のわけ（0 で区切る、ちがいはひき算）、絶対値がマイナスにならないわけ。
# 絶対値の式の性質（|a − b| = |b − a|、三角不等式）と、絶対値を含む方程式・不等式（A-013 など）は先取りしない。

id: N-011
days:
  - day: 1
    items:
      - part: 見本
        text: −3 は、0 から いくつ はなれて いるかな。
        figure: "−3 ─ −2 ─ −1 ─ 0 ─ 1 ─ 2 ─ 3"
        explain: −3 から 0 まで、みぎへ −2、−1、0 と 3 つ。−3 は 0 から 3 はなれて います。0 から いくつ はなれて いるかを ぜったいち と いい、|−3| と かきます。|−3| = 3 です。3 も 0 から 3 はなれて いるので、|3| = 3 です。
      - part: 思い出す
        text: (−2) + 6 は いくつですか。
        figure: "−2 ─ −1 ─ 0 ─ 1 ─ 2 ─ 3 ─ 4"
        choices: [−4, 4, −8]
        answer: 4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((-2) + 6)"
        hints:
          - −2 に ゆびを おこう。
          - たす ときは、みぎへ すすむよ。
          - 6 かい すすんだ ところの かずを よもう。
        paths:
          - [−2 から 0 まで 2 つ, のこり 4 つ すすむ, 4]
      - part: 思い出す
        text: 1 + (−5) は いくつですか。
        figure: "−5 ─ −4 ─ −3 ─ −2 ─ −1 ─ 0 ─ 1"
        choices: [6, −4, 4]
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(1 + (-5))"
        hints:
          - 1 に ゆびを おこう。
          - マイナスの かずを たす ときは、どちらへ うごくかな。
          - ひだりへ 5 かい うごこう。
        paths:
          - [1 から ひだりへ 5 つ, 0、−1、−2、−3、−4, −4]
      - part: 今日
        text: −5 は、0 から いくつ はなれて いますか。
        figure: "−5 ─ −4 ─ −3 ─ −2 ─ −1 ─ 0 ─ 1"
        answer: 5
