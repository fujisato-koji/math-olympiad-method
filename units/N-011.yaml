        explain: −3 から 0 まで、みぎへ −2、−1、0 と 3 つ。−3 は 0 から 3 はなれています。0 からいくつはなれているかをぜったいちといい、|−3| とかきます。|−3| = 3 です。3 も 0 から 3 はなれているので、|3| = 3 です。
