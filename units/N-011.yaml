# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "58e8e5edce"
    kinds: [道筋, 読み取り]
    text: 🐸 が、かずのせんのどこかのめもりにいます。🐸 から −3 までのきょりと、🐸 から 2 までのきょりをたすと 5 になりました。🐸 がいることのできるめもりは、いくつありますか。
    figure: "−5 ─ −4 ─ −3 ─ −2 ─ −1 ─ 0 ─ 1 ─ 2 ─ 3 ─ 4"
    answer: 6
    check: "len([x for x in range(-20, 21) if abs(x + 3) + abs(x - 2) == 5])"
    hints:
      - −3 と 2 は、いくつはなれているかな。
      - 🐸 が −3 と 2 のあいだにいるとき、2 つのきょりをたすとどうなるかな。
      - 🐸 が −3 よりひだりや、2 よりみぎにいるときもためしてみよう。
    paths:
      - [−3 と 2 のきょりは 5, あいだ（りょうはしも）にいればたすといつも 5, そとにいると 5 よりおおきくなる, −3、−2、−1、0、1、2 をかぞえる, 6 こ]
    note: −3 と 2 の間なら、どこにいても 2 つの距離の和は 5 で変わらない、と気づくのが道筋。1 つのめもりだけを答える、両はしの −3 と 2 を数え忘れる、の誤りが多い。外側（たとえば 3）では和が 5 より大きくなることも 1 つ確かめさせる。
  - part: 離
    id: "169aeb6b72"
    kinds: [総動員]
    uses: [N-008]
    text: 🐸 は 0 にいます。1 かいに 1 つずつ、みぎかひだりにうごきます。9 かいうごいたあと、🐸 が 0 から 4 はなれたところにいることはありますか。
    choices: [ある, ない]
    answer: ない
    check: "('ある' if any(abs(sum(c)) == 4 for c in itertools.product([1, -1], repeat=9)) else 'ない')"
    hints:
      - 1 かい、2 かい、3 かいうごいたあとに、🐸 がいることのできるところをかいてみよう。
      - 1 かいうごくたびに、0 からのきょりはどうかわるかな。
      - 9 かいうごいたあとの 0 からのきょりは、ぐうすうかな、きすうかな。
    paths:
      - [1 かいうごくたびに 0 からのきょりは 1 ふえるか 1 へる, きょりはぐうすうときすうがかわりばんこになる, 0 からはじめて 9 かいうごくときょりはきすう, 4 はぐうすうなのでない]
    note: 偶数と奇数（N-008）を、絶対値（0 からの距離）に使う。1 回動くたびに距離が 1 増えるか 1 減る、だから偶奇が入れかわる、が要点。右に何回・左に何回と試し続けて終わらなくなる子には、1 回・2 回・3 回の結果を並べさせる。「ない」は、試した例がなかったからではなく、偶奇で言えたときに言える。
  - part: 離
    id: "91b6d1bd91"
    kinds: [数, 手数]
    text: 🐸 は 3 にいます。ひだりへ 8、みぎへ 2、ひだりへ 5 のじゅんにうごきます。1 かいうごくたびに、とまったところのぜったいちをかきます。かいた 3 つのかずをたすと、いくつですか。
    answer: 16
    check: "abs(3 - 8) + abs(3 - 8 + 2) + abs(3 - 8 + 2 - 5)"
    hints:
      - 1 かいめにとまるところを、かずのせんでさがそう。
      - 2 かいめ、3 かいめにとまるところも、じゅんにだそう。
      - ぜったいちは、0 からいくつはなれているかだよ。
    paths:
      - [1 かいめは −5 でぜったいち 5, 2 かいめは −3 で 3, 3 かいめは −8 で 8, 5 + 3 + 8, 16]
    note: 3 回の位置を順に出し、それぞれ絶対値にしてからたす。位置をそのままたして −16 とする、動いた数（8、2、5）をたしてしまう、の 2 つの誤りが多い。途中の位置を書き残しておく。
