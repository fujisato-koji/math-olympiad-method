          - 0 から ひだりへ 6 つ もどると、どこかな。
          - みつけた かずを かぞえよう。
        paths:
          - [みぎに 6, ひだりに −6, 2 つ]
          - ["0 から 6 はなれた かずは、ぜったいちが 6", "|x| = 6 の こたえは 6 と −6", "2 つ"]
        note: 6 だけを おもいうかべて 1 と こたえやすい。0 の みぎと ひだりの りょうほうを みる。
