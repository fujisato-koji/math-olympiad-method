  - part: 離
    id: "e0a83bdf9d"
    kinds: [手数, 読み取り]
    text: あめが 84 こ、ガムが 60 こ、チョコが 48 こあります。これを何人かの子どもに、あめも、ガムも、チョコも、それぞれ同じ数ずつ、あまりが出ないように分けます。できるだけ多くの子どもに分けるとき、1 人分のあめとガムとチョコは、あわせて何こですか。
    svg: '<svg viewBox="0 0 320 144" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="14" text-anchor="middle" fill="currentColor">3 つとも同じ数ずつ、あまりなく分ける</text><rect x="62" y="38" width="244" height="22" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="184" y="54" font-size="14" text-anchor="middle" fill="currentColor">84</text><text x="6" y="54" font-size="14" text-anchor="start" fill="currentColor">あめ</text><rect x="62" y="74" width="174.3" height="22" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="149.1" y="90" font-size="14" text-anchor="middle" fill="currentColor">60</text><text x="6" y="90" font-size="14" text-anchor="start" fill="currentColor">ガム</text><rect x="62" y="110" width="139.4" height="22" fill="#c9a36b" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="131.7" y="126" font-size="14" text-anchor="middle" fill="currentColor">48</text><text x="6" y="126" font-size="14" text-anchor="start" fill="currentColor">チョコ</text></svg>'
    answer: 16
    check: "(lambda g: 84 // g + 60 // g + 48 // g)(max(d for d in range(1, 49) if 84 % d == 0 and 60 % d == 0 and 48 % d == 0))"
    hints:
      - 子どもの人数は、84 も 60 も 48 もわり切る数だね。
      - text: 3 つの数の公《約数》のうち、いちばん大きいものをさがそう。いちばん小さい 48 の約数を、大きいほうから調べるといいよ。
        svg: '<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg"><text x="10" y="20" font-size="14" text-anchor="start" fill="currentColor">48 の約数</text><rect x="12" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="25" y="47" font-size="14" text-anchor="middle" fill="currentColor">1</text><rect x="42" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="55" y="47" font-size="14" text-anchor="middle" fill="currentColor">2</text><rect x="72" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="85" y="47" font-size="14" text-anchor="middle" fill="currentColor">3</text><rect x="102" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="115" y="47" font-size="14" text-anchor="middle" fill="currentColor">4</text><rect x="132" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="145" y="47" font-size="14" text-anchor="middle" fill="currentColor">6</text><rect x="162" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="175" y="47" font-size="14" text-anchor="middle" fill="currentColor">8</text><rect x="192" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="205" y="47" font-size="14" text-anchor="middle" fill="currentColor">12</text><rect x="222" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="235" y="47" font-size="14" text-anchor="middle" fill="currentColor">16</text><rect x="252" y="28" width="26" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="265" y="47" font-size="14" text-anchor="middle" fill="currentColor">24</text><rect x="282" y="28" width="26" height="28" rx="4" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="295" y="47" font-size="14" text-anchor="middle" fill="currentColor">48</text><line x1="284" y1="54" x2="306" y2="30" stroke="#f08080" stroke-width="1.5"/><text x="160" y="74" font-size="13" text-anchor="middle" fill="currentColor">84 と 60 を、どちらもわり切るかな？</text></svg>'
      - 人数がわかったら、1 人分のあめ、ガム、チョコをそれぞれ出して、たそう。
    paths:
      - [人数は 84 と 60 と 48 の最大公約数, 48 の約数を大きいほうから調べると 12 で 3 つともわり切れる, 1 人分は あめ 84 ÷ 12 = 7、ガム 60 ÷ 12 = 5、チョコ 48 ÷ 12 = 4, 7 + 5 + 4 = 16]
      - ["48 の約数を大きいほうから 48、24、16、12 と調べる", "12 で 3 つともわり切れる", "84 ÷ 12 + 60 ÷ 12 + 48 ÷ 12 = 7 + 5 + 4 = 16"]
    note: 3 つの数の最大公約数（5 日目の型）を出し、さらに 1 人分を 3 つ出してたす。問われているのが人数（12）ではなく 1 人分の合計であることを読み取る。84 ÷ 12 などは 12 × 7 = 84 のように九九と同じ数をたす形で確かめる。
