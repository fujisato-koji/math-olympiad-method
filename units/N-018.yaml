    text: たて 6 cm、よこ 9 cm の長方形のカードがたくさんあります。カードを全部同じ向きにして、すき間なく、重ならないようにならべて、正方形を作ります。2 番目に小さい正方形を作るには、カードは何まいいりますか。
    svg: '<svg viewBox="0 0 320 152" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="14" text-anchor="middle" fill="currentColor">カードを同じ向きにならべて正方形を作る</text><rect x="52" y="56" width="81" height="54" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="92.5" y="50" font-size="13" text-anchor="middle" fill="currentColor">9 cm</text><text x="46" y="88" font-size="13" text-anchor="end" fill="currentColor">6 cm</text><line x1="140" y1="83" x2="165.6" y2="83" stroke="currentColor" stroke-width="2"/><polygon points="172,83 164.8,86.5 164.8,79.5" fill="currentColor" fill-opacity="1" stroke="currentColor" stroke-width="1"/><rect x="184" y="36" width="104" height="104" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><text x="236" y="86" font-size="14" text-anchor="middle" fill="currentColor">正方形</text><text x="236" y="108" font-size="14" text-anchor="middle" fill="currentColor">何まい？</text></svg>'
    answer: 24
    check: "(lambda s: (s // 6) * (s // 9))(sorted(k for k in range(1, 200) if k % 6 == 0 and k % 9 == 0)[1])"
    hints:
      - 正方形の 1 へんの長さは、6 cm をいくつかならべた長さで、9 cm をいくつかならべた長さでもあるね。
      - text: 1 へんの長さは、6 と 9 の公《倍数》だね。図はいちばん小さい正方形。2 番目に小さい正方形の 1 へんは何 cm かな。
        svg: '<svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg"><rect x="112" y="34" width="54" height="36" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="166" y="34" width="54" height="36" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="112" y="70" width="54" height="36" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="166" y="70" width="54" height="36" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="112" y="106" width="54" height="36" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="166" y="106" width="54" height="36" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="166" y="26" font-size="13" text-anchor="middle" fill="currentColor">18 cm</text><text x="106" y="93" font-size="13" text-anchor="end" fill="currentColor">18 cm</text><text x="160" y="164" font-size="14" text-anchor="middle" fill="currentColor">いちばん小さい正方形（6 まい）</text></svg>'
      - その正方形には、カードがたてに何まい、よこに何まいならぶかな。
    paths:
      - [1 へんの長さは 6 と 9 の公倍数, 公倍数は 18、36、54、…, 2 番目に小さい正方形の 1 へんは 36 cm, たてに 36 ÷ 6 = 6 まい、よこに 36 ÷ 9 = 4 まいで 6 × 4 = 24 まい]
