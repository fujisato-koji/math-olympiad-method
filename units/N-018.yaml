        explain: たとえば、「12 は 4 の倍数で、12 自身の倍数でもあるので、4 と 12 の公倍数。12 の倍数で 12 より小さいものはないので、最小公倍数は 12。4 は 4 自身と 12 をわり切るので公約数。4 の約数で 4 より大きいものはないので、最大公約数は 4。」と書ければよい。最小と最大の両方について、「〜より小さい（大きい）ものはない」まで書けているかを見る。3 と 9、5 と 20 のようなほかの組で同じことを言えるかたずねてもよい。
