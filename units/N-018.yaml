      - part: わけ
        id: "dd99042ed7"
        text: 12 と 18 の公約数は 1、2、3、6 で、どれも最大公約数 6 の約数になっています。6 の約数が、12 も 18 もわり切るわけを、文に書きましょう。
        svg: '<svg viewBox="0 0 320 118" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="14" text-anchor="middle" fill="currentColor">12 と 18 を 6 のまとまりで見る</text><rect x="62" y="38" width="162.7" height="22" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><line x1="143.3" y1="35" x2="143.3" y2="63" stroke="currentColor" stroke-width="2"/><text x="102.7" y="54" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="184" y="54" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="6" y="54" font-size="14" text-anchor="start" fill="currentColor">12</text><rect x="62" y="84" width="244" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><line x1="143.3" y1="81" x2="143.3" y2="109" stroke="currentColor" stroke-width="2"/><line x1="224.7" y1="81" x2="224.7" y2="109" stroke="currentColor" stroke-width="2"/><text x="102.7" y="100" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="184" y="100" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="265.3" y="100" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="6" y="100" font-size="14" text-anchor="start" fill="currentColor">18</text></svg>'
        explain: たとえば、「12 は 6 が 2 こ、18 は 6 が 3 こ。6 の約数、たとえば 3 は、6 を 3 が 2 こに分けられる。6 が 2 こなら 3 が 4 こ、6 が 3 こなら 3 が 6 こになるので、3 は 12 も 18 もわり切る。1 や 2 や 6 も同じ。だから 6 の約数はどれも 12 と 18 の公約数になる。」と書ければよい。N-017 のわけ（6 の倍数はどれも 3 の倍数）を使っている。反対に、公約数がどれも 6 の約数になることは、書き出してたしかめた、と書ければ十分。
        hints:
          - 12 と 18 は、それぞれ 6 が何こ分かな。
