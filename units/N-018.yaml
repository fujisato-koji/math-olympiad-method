# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [G-006, G-046]
    text: たて 6 cm、よこ 9 cm の長方形のカードがたくさんあります。カードを全部同じ向きにして、すき間なく、重ならないようにならべて、正方形を作ります。2 番目に小さい正方形を作るには、カードは何まいいりますか。
    answer: 24
    check: "(lambda s: (s // 6) * (s // 9))(sorted(k for k in range(1, 200) if k % 6 == 0 and k % 9 == 0)[1])"
    hints:
      - 正方形の 1 辺の長さは、6 cm をいくつかならべた長さで、9 cm をいくつかならべた長さでもあるね。
      - 1 辺の長さは、6 と 9 の公《倍数》だね。いちばん小さい正方形と 2 番目に小さい正方形の 1 辺は何 cm かな。
      - その正方形には、カードがたてに何まい、よこに何まいならぶかな。
    paths:
      - [1 辺の長さは 6 と 9 の公倍数, 公倍数は 18、36、54、…, 2 番目に小さい正方形の 1 辺は 36 cm, たてに 36 ÷ 6 = 6 まい、よこに 36 ÷ 9 = 4 まいで 6 × 4 = 24 まい]
    note: 正方形（G-006）の 1 辺が、たてとよこの両方の倍数になる（公倍数）と読みかえる。いちばん小さい正方形（1 辺 18 cm、6 まい）で止めず、「2 番目」を読み取る。36 ÷ 6 などは九九の範囲。
  - part: 離
    kinds: [道筋]
    text: 3 でわると 2 あまり、4 でわると 3 あまり、5 でわると 4 あまる 2 けたの数は何ですか。
    answer: 59
    check: "[k for k in range(10, 100) if k % 3 == 2 and k % 4 == 3 and k % 5 == 4][0]"
    hints:
      - あまりは 2、3、4 で、どれも わる数より 1 小さいね。
      - その数に 1 をたすと、3、4、5 でわったあまりはどうなるかな。
      - 1 をたした数は、3 と 4 と 5 の公倍数だね。
    paths:
      - [どのあまりも わる数より 1 小さい, 1 をたすと 3 でも 4 でも 5 でもわり切れる, 3 と 4 と 5 の公倍数は 60、120、…, 2 けたになるのは 60 − 1 = 59]
      - [5 でわると 4 あまる数 9、14、19、24、… を調べる, その中で 4 でわると 3 あまるのは 19、39、59、79, 3 でわると 2 あまるのは 59]
    note: あまりがばらばらに見えるが、どれも「わる数より 1 小さい（1 たりない）」ことに気づくと公倍数の問題に言いかえられる。2 本目は書き出して順にしぼる道。
  - part: 離
    kinds: [手数, 読み取り]
    text: あめが 84 こ、ガムが 60 こ、チョコが 48 こあります。これを何人かの子どもに、あめも、ガムも、チョコも、それぞれ同じ数ずつ、あまりが出ないように分けます。できるだけ多くの子どもに分けるとき、1 人分のあめとガムとチョコは、あわせて何こですか。
    answer: 16
    check: "(lambda g: 84 // g + 60 // g + 48 // g)(max(d for d in range(1, 49) if 84 % d == 0 and 60 % d == 0 and 48 % d == 0))"
    hints:
      - 子どもの人数は、84 も 60 も 48 も わり切る数だね。
      - 3 つの数の公《約数》のうち、いちばん大きいものをさがそう。いちばん小さい 48 の約数から調べるといいよ。
      - 人数がわかったら、1 人分のあめ、ガム、チョコをそれぞれ出して、たそう。
    paths:
      - [人数は 84 と 60 と 48 の最大公約数, 48 の約数を大きいほうから調べると 12 で 3 つともわり切れる, 1 人分は あめ 84 ÷ 12 = 7、ガム 60 ÷ 12 = 5、チョコ 48 ÷ 12 = 4, 7 + 5 + 4 = 16]
    note: 3 つの数の最大公約数（5 日目の型）を求め、さらに 1 人分を 3 つ出してたす。問われているのが人数（12）ではなく 1 人分の合計であることを読み取る。84 ÷ 12 などは 12 × 7 = 84 のように九九と同じ数をたす形で確かめる。
