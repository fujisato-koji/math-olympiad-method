        explain: たとえば、「4 の倍数は 4 ずつ、6 の倍数は 6 ずつふえる。12 で 2 つがそろったあと、4 の倍数は 4 が 3 こ分、6 の倍数は 6 が 2 こ分進むと、どちらも 12 ふえて、またそろう。12 より少なく進んでもそろわないので、そろうのは 12 ごとになる。だから公倍数は 12、24、36…で、12 の倍数になる。」と書ければよい。4 の倍数と 6 の倍数を 2 列に書き出し、そろうところにしるしをつけて「12 ずつ間があいている」と書いてもよい。書き出しただけで終わったら、「48 の次の公倍数は何か、書き出さずに言えるかな」とたずねる。
        hints:
          - 4 の倍数と 6 の倍数を、2 列に書き出そう。
