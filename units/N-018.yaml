# N-018 公約数と公倍数
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-017（倍数と約数）まで。数は 100 まで、かけ算とわり算は N-017 と同じ範囲（九九と、同じ数をたしていく形）。
# 公倍数は「大きいほうの数の倍数を順に見て、小さいほうの数でわり切れるか」、公約数は「小さいほうの数の約数を順に見て、
#   大きいほうの数をわり切るか」でさがす。書き出してくらべる道は 2 本目のみちすじにした。
# すだれ算（はしご算）は、わけが素因数分解（N-021）によるので使わない。互除法は N-029。
# 場面の問題は「同じ数ずつ分ける・同じ長さに切る」が公約数、「いっしょになる・そろう」が公倍数。
#   図形（正方形をしきつめる）の場面は、図形の流れが前提にないので使わない。
# check は定義どおり、両方でわり切れる（両方をわり切る）数を range でさがし、min か max をとる。
# 日の並び（既定）：1 日目 公倍数と最小公倍数、2 日目 公約数と最大公約数、3 日目 場面で使う、4 日目 わけ、
#   5 日目 N-017（倍数と約数）と N-014（あまり）と混ぜる・3 つの数、6 日目 確認。

id: N-018
days:
  - day: 1
    items:
      - part: 見本
        text: 4 と 6 の公《倍数》を、小さい順に 3 つ書きましょう。
        explain: 4 の倍数は 4、8、12、16、20、24、28、32、36…、6 の倍数は 6、12、18、24、30、36…です。どちらにも出てくる 12、24、36 を、4 と 6 の公倍数といいます。いちばん小さい公倍数の 12 を、最小公倍数といいます。大きいほうの 6 の倍数を 6、12、18…と順に見て、4 でわり切れるかを調べると、早く見つかります。
      - part: 思い出す
        text: 8 の倍数を小さい順にならべると、6 番目の数はいくつですか。
        answer: 48
        check: "8 * 6"
        hints:
          - 8 の倍数は、8 に 1、2、3…をかけた数だね。
          - 6 番目は、8 に何をかけた数かな。
          - 8 の段の九九を思い出そう。
        paths:
          - [6 番目は 8 × 6, 48]
      - part: 思い出す
        text: 27 の《約数》は、ぜんぶで何こありますか。
        answer: 4
        check: "len([d for d in range(1, 28) if 27 % d == 0])"
        hints:
          - かけて 27 になる 2 つの数の組をさがそう。
          - 1 × 27 から始めて、順にためそう。
          - 組に出てきた数を、ぜんぶ数えよう。
        paths:
          - [1 × 27、3 × 9, 約数は 1、3、9、27, 4 こ]
      - part: 今日
        text: 2 と 3 の最小公倍数はいくつですか。
        answer: 6
        check: "min(m for m in range(1, 100) if m % 2 == 0 and m % 3 == 0)"
        hints:
          - 大きいほうの 3 の倍数を、小さい順にならべよう。
          - その中で、2 でわり切れる数をさがそう。
          - いちばん小さいものが答えだよ。
        paths:
          - [3 の倍数は 3、6、9…, 2 でわり切れる最初の数は 6, 6]
      - part: 今日
        text: 3 と 5 の公倍数を小さい順にならべると、3 番目の数はいくつですか。
        answer: 45
        check: "[m for m in range(1, 100) if m % 3 == 0 and m % 5 == 0][2]"
        hints:
          - まず、3 と 5 の最小公倍数を求めよう。
          - 5 の倍数の中で、3 でわり切れるものを順にさがそう。
          - 公倍数を、小さい順に 3 つならべよう。
        paths:
          - [5 の倍数で 3 でわり切れるのは 15、30、45, 3 番目は 45]
          - [最小公倍数は 15, 公倍数は 15 の倍数, 15 × 3 = 45]
      - part: 今日
        text: 6 と 8 の最小公倍数はいくつですか。
        answer: 24
        check: "min(m for m in range(1, 100) if m % 6 == 0 and m % 8 == 0)"
        hints:
          - 大きいほうの 8 の倍数を、小さい順にならべよう。
          - その中で、6 でわり切れる数をさがそう。
          - 8、16 は 6 でわり切れるかな。
        paths:
          - [8 の倍数は 8、16、24…, 6 でわり切れる最初の数は 24, 24]
        note: 6 × 8 = 48 と答えやすい。48 も公倍数だが、もっと小さい 24 がある。
      - part: 挑戦
        text: 6 と 9 の公倍数のうち、100 より小さいものは何こありますか。
        answer: 5
        check: "len([m for m in range(1, 100) if m % 6 == 0 and m % 9 == 0])"
        hints:
          - まず、6 と 9 の最小公倍数を求めよう。
          - 公倍数を、小さい順にならべていこう。
          - 100 をこえる前で止めて、数えよう。
        paths:
          - [最小公倍数は 18, 公倍数は 18、36、54、72、90, 5 こ]
