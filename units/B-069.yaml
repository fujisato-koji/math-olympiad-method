  - day: 2
    items:
      - part: 見本
        text: |-
          からだの 中には、かたい ほねが あります。ほねの まわりには、きんにくが あります。
          うでを まげて 力を 入れると、力こぶの きんにくが ふくらんで、かたく なります。
          むねに 耳や かみの つつを あてると、しんぞうの「どくん どくん」と いう 音が きこえます。
          しんぞうは、ねて いる ときも、いつも うごいて います。
