        explain: |-
          目・耳・はな・した・ひふ の 5 つで、まわりの ようすを うけとります（見る・きく・かぐ・あじわう・さわる）。うけとった ことは のうへ つたわって、「わかる」に なります。
          きょうは「どの ことを、からだの どこで しるか」が むすびつけば よい。目を つぶる、耳を 手で ふさぐ、はなを つまむ など、1 つを つかえなく して みると、その ところの はたらきが よく わかります。
