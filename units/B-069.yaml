        paths:
          - [ほねが からだを ささえる, ほねが ながく なる, せが のびる]
          - [6 さいの ほねは 4 さいより ながい, ほねが のびた ぶん, せが たかく なった]
        explain: |-
          「からだの 中の ほねが ながく なると、せが のびる。足の ほねも、せなかの ほねも、すこしずつ ながく なる。だから 1 年 たつと、ふくや くつが 小さく なる。」と いえれば よい。
          ① せは ほねの ながさで きまる、② ほねが すこしずつ ながく なる、③ だから せが のびる、の 3 つが 入れば よい。ほねの はしの ちかくに、あたらしい ほねが できる ところが あり、子どもの あいだ だけ のびます。おとなに なると のびなく なります。はしらや かべに 1 年 ごとに しるしを つけて、のびた ぶんを いっしょに 見ると よい。
