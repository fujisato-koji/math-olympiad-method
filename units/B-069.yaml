# B-069 自分のからだ
#
# 段 1・水準 1・4 日。見る・きく・かぐ・あじわう・さわる（目・耳・はな・した・ひふ）、ほねと きんにくを さわって たしかめる、しんぞうの 音を きく、せが のびる ことを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 5 つの かんかく、2 日目 ほねと きんにくと しんぞうの 音、3 日目 わけ（せが のびるのは ほねが のびるから）、4 日目 確認。
# 図の約束：ほねは灰色、きんにくは赤、しんぞうは赤い形でかく。音は弧、においは紫の くねった線でかく。答えの選び先の印は ア・イ・ウ。
# 1 分間の脈と呼吸の数、運動の前と後は B-075、皮ふの守りと傷は I-006、錯視と盲点は Q-001 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも、絵を読む読み取り（kinds: 読み取り）。

id: B-069
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          わたしたちは、からだの 5 つの ところで、まわりの ことを しります。
          目で 見る、耳で きく、はなで かぐ、したで あじわう、ひふで さわる。
          ひふは、からだを つつんで いる そとがわです。手で さわると、つめたい、かたい、ふわふわ などが わかります。
