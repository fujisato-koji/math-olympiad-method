        explain: |-
          ほねは からだを ささえ、のうや しんぞう など だいじな ところを まもります。きんにくは ちぢんで ほねを ひっぱり、からだを うごかします。力こぶ（うでの まえがわの きんにく）は、うでを まげる ときに ちぢんで、ふとく かたく なります。
          しんぞうは、ちを からだ じゅうへ おくりだす ポンプで、ねて いる ときも とまりません。「どくん」は、しんぞうの 中の べんが しまる 音です。おうちの ひとの むねに 耳を あてたり、トイレットペーパーの しんを あてたり して、いっしょに きいて みると よい。
