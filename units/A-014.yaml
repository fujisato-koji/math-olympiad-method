        text: 和が s、差が d の 2 つの数のうち、大きいほうは (s + d)/2、小さいほうは (s − d)/2 であることを、連立方程式を使って、筋道を立てて書きましょう。
        explain: 例：「大きいほうの数を x、小さいほうの数を y とする。和が s なので x + y = s …①、差が d なので x − y = d …②。① と ② を足すと（等式の両辺に等しいものを足す）2x = s + d で、両辺を 2 でわって x = (s + d)/2。① から ② をひくと 2y = s − d で、y = (s − d)/2。よって、大きいほうは (s + d)/2、小さいほうは (s − d)/2 である。」と書ければよい。①「〜とする」で x、y を決める、② 式を変形する、③ 等式の性質で結ぶ、の 3 つがそろっているかを見る。「和 54、差 18 なら 36 と 18」のような例だけで終わっていたら、例ではすべての s、d について示せないことを話す。線分図の「ちがいを切りとって 2 等分する」が、この式の (s − d)/2 であることにも触れる。
        hints:
          - 「大きいほうの数を x、小さいほうの数を y とする」から書き始めましょう。
          - 和と差を、それぞれ s、d を使った等式に書きましょう。
          - 2 つの式を足したり、ひいたりして、x と y を s、d で表しましょう。
        paths:
          - [大きいほうを x、小さいほうを y とする, x + y = s、x − y = d, 足して 2x = s + d、ひいて 2y = s − d, 両辺を 2 でわる（等式の性質）]
      - part: わけ
        text: 何人かの子どもに配ります。1 人に a こずつ配ると p こ余り、b こずつ配ると q こたりません（b は a より大きい）。子どもの人数は (p + q)/(b − a) 人であることを、筋道を立てて書きましょう。
        explain: 例：「子どもの人数を x 人とする。配るものの数は、a こずつ配ると p こ余るので ax + p、b こずつ配ると q こたりないので bx − q と表せる。配るものの数は同じなので ax + p = bx − q。移項して p + q = bx − ax = (b − a)x（分配法則）。b は a より大きいので、b − a は 0 でない。両辺を b − a でわって x = (p + q)/(b − a) である。」と書ければよい。①「〜とする」、② 式を変形する、③ 約束した事実（等式の性質、分配法則、0 でない数でわってよい）で結ぶ、がそろっているかを見る。「b − a が 0 でない」から両辺をわってよい、と書けていれば、なおよい。この式は「1 人分を b − a こふやすと、余りと不足を合わせた p + q こが要る」という考えと同じであることを話す。
        hints:
          - 「子どもの人数を x 人とする」から書き始め、配るものの数を 2 通りに表しましょう。
          - 2 つの式を等号で結び、x の項を集めて、分配法則でまとめましょう。
          - 両辺を b − a でわってよいわけ（0 でないこと）も書きましょう。
        paths:
          - [人数を x 人とする, ax + p = bx − q, p + q = (b − a)x, b − a は 0 でないのでわる, x = (p + q)/(b − a)]
      - part: わけ
        text: まっすぐな道の両はしにも木を植えると、木の数は間の数より 1 多くなります。図の 5 本の例を使って、そうなるわけを文で書きましょう。
        figure: "🌳─🌳─🌳─🌳─🌳"
        explain: 例：「どの木にも、その木の右どなりに間が 1 つずつある。ただし、いちばん右の木だけは、右に間がない。だから間の数は木の数より 1 少なく、5 本なら間は 4 つ。言いかえると、木の数は間の数より 1 多い。」と書ければよい。「木と間を 1 つずつ組にすると、木が 1 本余る」が書けているかを見る（代表の例で書くわけ ②）。池のまわりのように輪になっていると、いちばん右の木の右にも間があるので、木の数と間の数が同じになることを話す。
        hints:
          - 1 本の木と、その右どなりの間を、組にしてみましょう。
          - 組にならずに残るものはありますか。
          - 輪になっているときは、どうなるでしょう。
        paths:
          - [木と右どなりの間を組にする, いちばん右の木だけ組にならない, 木は間より 1 多い]
