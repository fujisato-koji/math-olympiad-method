    paths:
      - [50 円を x こ、80 円を y こ、120 円を z ことする, x + y + z = 10, 50x + 80y + 120z = 760, 50x + 50y + 50z = 500 をひく, 30y + 70z = 260, 3y + 7z = 26, z = 2 のとき y = 4]
