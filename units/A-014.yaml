    text: ある列車が、長さ 520 m の鉄橋をわたり始めてから、わたり終わるまでに 36 秒かかりました。同じ速さで、長さ 1360 m のトンネルに入り始めてから、完全に出るまでに 78 秒かかりました。この列車の長さは何 m ですか。
    answer: 200
    check: "[L for L in range(1, 2000) for v in range(1, 100) if 520 + L == 36 * v and 1360 + L == 78 * v][0]"
    hints:
