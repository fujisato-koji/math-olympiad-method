 fill="currentColor">1 きゃく 空く</text></svg>'
        answer: 30
        check: "[4 * x + 6 for x in range(1, 100) if 4 * x + 6 == 6 * (x - 1)][0]"
        hints:
          - 長いすの数を x きゃくとしましょう。
          - 6 人ずつすわると、使う長いすは x − 1 きゃくです。
          - text: 空いた 1 きゃくにも 6 人すわると考えると、6 人たりないのと同じです。生徒の数を 2 通りに表して、等しいとおきましょう。
            svg: '<svg viewBox="0 0 320 132" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">空いた 1 きゃく</text><circle cx="85" cy="62" r="11" fill="none" stroke="#f08080" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="115" cy="62" r="11" fill="none" stroke="#f08080" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="145" cy="62" r="11" fill="none" stroke="#f08080" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="175" cy="62" r="11" fill="none" stroke="#f08080" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="205" cy="62" r="11" fill="none" stroke="#f08080" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="235" cy="62" r="11" fill="none" stroke="#f08080" stroke-width="1.8" stroke-dasharray="5 4"/><rect x="70" y="76" width="180" height="12" rx="3" fill="#c9a36b" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><line x1="80" y1="88" x2="80" y2="102" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="240" y1="88" x2="240" y2="102" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><text x="160" y="124" font-size="14" text-anchor="middle" fill="currentColor">6 人 たりないのと 同じ</text></svg>'
        paths:
          - [4x + 6 = 6(x − 1), 4x + 6 = 6x − 6, x = 6, 4 × 6 + 6 = 30 人]
          - [1 きゃく空くは 6 人たりないのと同じ, 1 きゃくに 2 人ずつふやすのに 6 + 6 = 12 人要る, 長いすは 12 ÷ 2 = 6 きゃく、生徒は 4 × 6 + 6 = 30 人]
        note: 「1 きゃく空く」を「6 人たりない」と読みかえると、配る問題と同じ形になる。
