        answer: 27
        check: "[s for s in range(0, 100) if s + (s + 5) + (s + 5 + 8) == 99][0]"
        hints:
          - 小を x として、中を x で表しましょう。
          - 大は中より 8 大きいので、大も x で表せます。
          - 3 つの和を式にして、99 と等しいとおきましょう。
