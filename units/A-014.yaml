# A-014 文章題を方程式にする（和差、つるかめ、過不足、植木）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011、A-012 に合わせる。
# 地図に plan がないので、既定の並び（導入、練習 4 日、わけ、混ぜる、確認）で作った。
#   1 日目：文章題を方程式で解く手順（文字にする、等しい関係を式にする、解く、場面で確かめる）と和差算（2 つ、3 つの数、やりとりのあと同じになる）。
#   2 日目：つるかめ算（個数の合計と、足の数や代金の合計）、点をひかれる場合。
#   3 日目：過不足算（配り方を変えたときの余りと不足、両方とも余る・たりない、長いす）。
#   4 日目：植木算（両はしに植える、植えない、輪になっている。テープののりしろ）。
#   5 日目：どの型かを見分けて式を立てる、答えが場面に合うか（個数が整数になるか）を確かめる、3 種類のもの。
#   6 日目：わけ。7 日目：A-012、A-003 と混ぜる。8 日目：確認。
# D-014 により、本線は連立方程式（つるかめ算は最初から連立方程式で）。1 つの文字で立つものは 1 次方程式（A-011）で解く。
#   線分図（A-003）、「全部つるだとすると」、「1 人分を何こふやすと」のような特別な解き方は、paths の 2 本目の道と見本の説明に置いた。
# 前提は A-012（連立方程式）、A-003（線分図）。数は 0 以上の整数になる場面にした（個数、人数、まい数、円、m、cm）。
#   長さの単位（G-046）は前提にないが、A-011 と同じく m と cm は場面の言葉として使った。
# 答えは数を打つ。式の組を選ぶ問題と、「できない」を選ぶ問題は choices にした。
#   check は、場面の条件をそのまま式にして総当たりで答えをさがす（式の組を選ぶ問題は、場面に合う組を代入して成り立つものを選ぶ）。
#   植木算は、間の数を「長さ ÷ 間かく」（//）で出して、両はしの決まりで 1 を足すかひく。
# 人の名前は使わず、兄と弟、姉と妹、大人と子どもで書く。
# 文章題を式にする力は、理科の量の計算（H-016 の反応する量、P の流れの運動の式）の入口になる（D-026）。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-046 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# ただし腕だめしの最難関（5 この数のかけ算の答えが和の 4 倍）だけは例外で、uses に A-013、N-017 を挙げて、不等式と約数を使う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note、explain は保護者用。
# 図（D-129〜D-131）：和差は線分図（ちがいを切りとる・足す）、3 つの量はもとの量にそろえる線、やりとりは前とあとの線、
#   つるかめは「全部つるだとすると」の絵と「1 つかえる」の絵、過不足は配る絵と、全部の数を 1 本の線にそろえた図
#   （ふやした分 = 余り + たりない）、植木は木（赤い番号）と間（青い番号）の小さい図、テープはつなぎ目の番号。
#   ヒントの図は答えの手前まで（全部つるのときの足の数まで。かめの数はかかない）。
# 直し（D-131）：腕だめしで日の問題と同じ数だった 2 問（的あて、つるかめ）は数をかえて id を消した。
#   かたほうのはしに植える問題は「左はしには植え、右はしには植えない」と書いた。式の組をえらぶ問題は、組を「と」でつないだ。
#   学年より上の漢字はかなにした（ねだん、さつ、まどぐち、わたす、すわる など）。

id: A-014
days:
  - day: 1
    items:
      - part: 見本
        id: "05229dd019"
        text: 兄と弟のカードは合わせて 80 まいで、兄は弟より 22 まい多く持っています。兄を x まい、弟を y まいとして、図のように 2 つの式にします。足すと 2x = 102 で、兄は 51 まい、弟は 29 まいです。兄の線から 22 まいを切りとると、同じ長さの線が 2 本になる、と見ても同じです。
        svg: '<svg viewBox="0 0 320 372" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,0)"><text x="48" y="61" font-size="14" text-anchor="end" fill="currentColor">兄 x</text><text x="48" y="113" font-size="14" text-anchor="end" fill="currentColor">弟 y</text><rect x="58" y="46" width="101.2" height="20" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="159.2" y="46" width="76.8" height="20" rx="2" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="58" y="98" width="101.2" height="20" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><line x1="159.2" y1="44" x2="159.2" y2="120" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 159.2 43 Q 159.2 39 165.2 39 L 191.6 39 Q 197.6 39 197.6 35 Q 197.6 39 203.6 39 L 230 39 Q 236 39 236 43" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="197.6" y="30" font-size="13" text-anchor="middle" fill="currentColor">22 まい 多い</text><path d="M 244 46 Q 248 46 248 52 L 248 76 Q 248 82 252 82 Q 248 82 248 88 L 248 112 Q 248 118 244 118" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="256" y="78.5" font-size="14" text-anchor="start" fill="currentColor">合わせて</text><text x="256" y="95.5" font-size="14" text-anchor="start" fill="currentColor">80 まい</text></g><line x1="10" y1="131" x2="310" y2="131" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round"/><g transform="translate(0,134)"><text x="160" y="20" font-size="15" text-anchor="middle" fill="currentColor">合わせて 80 まい → x + y = 80</text><text x="160" y="46" font-size="15" text-anchor="middle" fill="currentColor">22 まい 多い → x − y = 22</text><text x="160" y="72" font-size="15" text-anchor="middle" fill="currentColor">2 つの式を足すと 2x = 102</text></g><line x1="10" y1="219" x2="310" y2="219" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round"/><g transform="translate(0,222)"><text x="48" y="61" font-size="14" text-anchor="end" fill="currentColor">兄</text><text x="48" y="113" font-size="14" text-anchor="end" fill="currentColor">弟</text><rect x="58" y="46" width="101.2" height="20" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="169.2" y="20" width="76.8" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="174.2" y1="22" x2="241" y2="38" stroke="#f08080" stroke-width="1.5" stroke-linecap="round"/><line x1="241" y1="22" x2="174.2" y2="38" stroke="#f08080" stroke-width="1.5" stroke-linecap="round"/><text x="207.6" y="15" font-size="13" text-anchor="middle" fill="currentColor">22 まい とる</text><rect x="58" y="98" width="101.2" height="20" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><path d="M 167.2 48 Q 171.2 48 171.2 54 L 171.2 77 Q 171.2 83 175.2 83 Q 171.2 83 171.2 89 L 171.2 112 Q 171.2 118 167.2 118" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="179.2" y="80" font-size="13" text-anchor="start" fill="currentColor">同じ長さが</text><text x="179.2" y="96" font-size="13" text-anchor="start" fill="currentColor">2 本</text><line x1="159.2" y1="44" x2="159.2" y2="120" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="160" y="140" font-size="14" text-anchor="middle" fill="currentColor">2 本分は、80 − 22</text></g></svg>'
        explain: 文章題を方程式で解く手順は次のとおりです。① わからない数を文字にする（兄を x まい、弟を y まい）。② 等しい関係を見つけて式にする（合わせて 80 まいなので x + y = 80、兄が 22 まい多いので x − y = 22）。③ 解く（足して 2x = 102、x = 51、y = 29）。④ 場面でたしかめる（51 + 29 = 80、51 − 29 = 22 で合う。まい数なので 0 以上の《整数》でよい）。このように、2 つの数の和と差から、それぞれの数を求める問題を和差算といいます。図の下のほうは線分図（A-003）での見方で、兄の線からちがいの 22 まいを切りとると、残りの 80 − 22 = 58 まいが弟 2 人分になります。2 つの式をひいて 2y = 58 とする計算と同じです。
