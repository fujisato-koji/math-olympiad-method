/svg>'
      - まどぐち 3 つのときも同じように式にして、連立方程式を解こう。
    paths:
      - [はじめ x 人、毎分 y 人ならぶとする, まどぐち 2 つで x + 40y = 6 × 40 = 240, まどぐち 3 つで x + 16y = 9 × 16 = 144, y = 4、x = 80, まどぐち 4 つでは 1 分に 12 − 4 = 8 人ずつへるので 80 ÷ 8 = 10 分]
      - [まどぐち 2 つでは 1 分に 6 − y 人、3 つでは 9 − y 人ずつへる, 40(6 − y) = 16(9 − y) で y = 4, はじめは 40 × 2 = 80 人, 80 ÷ (12 − 4) = 10 分]
    note: ふえながらへる量（ニュートン算）。受け付けた人数が「はじめの人数 + 新しくならんだ人数」であることに気づき、2 つのわからない数で連立方程式にする。まどぐちの数が 2 倍なら時間が半分になると考えて「2 つで 40 分なら 4 つで 20 分」としてしまう間ちがいが多い。
