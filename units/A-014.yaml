      - part: わけ
        id: "48594e771e"
        text: 和が s、差が d の 2 つの数のうち、大きいほうは (s + d)/2、小さいほうは (s − d)/2 であることを、連立方程式を使って、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><text x="48" y="61" font-size="14" text-anchor="end" fill="currentColor">大 x</text><text x="48" y="113" font-size="14" text-anchor="end" fill="currentColor">小 y</text><rect x="58" y="46" width="118.7" height="20" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="176.7" y="46" width="59.3" height="20" rx="2" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="58" y="98" width="118.7" height="20" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><line x1="176.7" y1="44" x2="176.7" y2="120" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 176.7 43 Q 176.7 39 182.7 39 L 200.3 39 Q 206.3 39 206.3 35 Q 206.3 39 212.3 39 L 230 39 Q 236 39 236 43" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="206.3" y="30" font-size="13" text-anchor="middle" fill="currentColor">差 d</text><path d="M 244 46 Q 248 46 248 52 L 248 76 Q 248 82 252 82 Q 248 82 248 88 L 248 112 Q 248 118 244 118" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="256" y="78.5" font-size="14" text-anchor="start" fill="currentColor">和</text><text x="256" y="95.5" font-size="14" text-anchor="start" fill="currentColor">s</text></svg>'
        explain: 例：「大きいほうの数を x、小さいほうの数を y とする。和が s なので x + y = s …①、差が d なので x − y = d …②。① と ② を足すと（等式の両辺に等しいものを足す）2x = s + d で、両辺を 2 でわって x = (s + d)/2。① から ② をひくと 2y = s − d で、y = (s − d)/2。よって、大きいほうは (s + d)/2、小さいほうは (s − d)/2 である。」と書ければよい。①「〜とする」で x、y を決める、② 式を変形する、③ 等式の性質で結ぶ、の 3 つがそろっているかを見る。「和 54、差 18 なら 36 と 18」のような例だけで終わっていたら、例だけでは、すべての s、d についてのわけにならないことを話す。図の線分図の「ちがいを切りとって 2 等分する」が、この式の (s − d)/2 であることにもふれる。
        hints:
          - 「大きいほうの数を x、小さいほうの数を y とする」から書き始めましょう。
          - 和と差を、それぞれ s、d を使った等式に書きましょう。
          - text: 2 つの式を足したり、ひいたりして、x と y を s、d で表しましょう。ひくことは、図で大きいほうから d を切りとることです。
            svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><text x="48" y="61" font-size="14" text-anchor="end" fill="currentColor">大</text><text x="48" y="113" font-size="14" text-anchor="end" fill="currentColor">小</text><rect x="58" y="46" width="118.7" height="20" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="186.7" y="20" width="59.3" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="191.7" y1="22" x2="241" y2="38" stroke="#f08080" stroke-width="1.5" stroke-linecap="round"/><line x1="241" y1="22" x2="191.7" y2="38" stroke="#f08080" stroke-width="1.5" stroke-linecap="round"/><text x="216.3" y="15" font-size="13" text-anchor="middle" fill="currentColor">d とる</text><rect x="58" y="98" width="118.7" height="20" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><path d="M 184.7 48 Q 188.7 48 188.7 54 L 188.7 77 Q 188.7 83 192.7 83 Q 188.7 83 188.7 89 L 188.7 112 Q 188.7 118 184.7 118" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="196.7" y="80" font-size="13" text-anchor="start" fill="currentColor">同じ長さが</text><text x="196.7" y="96" font-size="13" text-anchor="start" fill="currentColor">2 本</text><line x1="176.7" y1="44" x2="176.7" y2="120" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="160" y="140" font-size="14" text-anchor="middle" fill="currentColor">2 本分は、s − d</text></svg>'
        paths:
          - [大きいほうを x、小さいほうを y とする, x + y = s、x − y = d, 足して 2x = s + d、ひいて 2y = s − d, 両辺を 2 でわる（等式の性質）]
          - [線分図で大きいほうから d を切りとると、小さいほう 2 つ分が s − d, 小さいほうは (s − d)/2, 大きいほうは (s − d)/2 + d = (s + d)/2]
      - part: わけ
        id: "434581a051"
        text: 何人かの子どもに配ります。1 人に a こずつ配ると p こ余り、b こずつ配ると q こたりません（b は a より大きい）。子どもの人数は (p + q)/(b − a) 人であることを、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 168" xmlns="http://www.w3.org/2000/svg"><text x="66" y="61" font-size="13" text-anchor="end" fill="currentColor">a こずつ</text><text x="66" y="123" font-size="13" text-anchor="end" fill="currentColor">b こずつ</text><rect x="74" y="46" width="118" height="20" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="133" y="60.5" font-size="12" text-anchor="middle" fill="currentColor">a こ × 人数</text><rect x="192" y="46" width="50.4" height="20" rx="2" fill="#f3c969" fill-opacity="0.8" stroke="currentColor" stroke-width="2"/><path d="M 192 43 Q 192 40 198 40 L 211.2 40 Q 217.2 40 217.2 37 Q 217.2 40 223.2 40 L 236.4 40 Q 242.4 40 242.4 43" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="217.2" y="32" font-size="13" text-anchor="middle" fill="currentColor">余り p</text><rect x="74" y="108" width="118" height="20" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="133" y="122.5" font-size="12" text-anchor="middle" fill="currentColor">a こ × 人数</text><rect x="192" y="108" width="84" height="20" rx="2" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><path d="M 192 131 Q 192 134 198 134 L 228 134 Q 234 134 234 137 Q 234 134 240 134 L 270 134 Q 276 134 276 131" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="234" y="151" font-size="13" text-anchor="middle" fill="currentColor">(b − a) こ × 人数</text><rect x="242.4" y="108" width="33.6" height="20" rx="3" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="5 4"/><path d="M 242.4 105 Q 242.4 102 248.4 102 L 253.2 102 Q 259.2 102 259.2 99 Q 259.2 102 265.2 102 L 270 102 Q 276 102 276 105" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="246.4" y="94" font-size="13" text-anchor="start" fill="currentColor">たりない q</text><line x1="242.4" y1="22" x2="242.4" y2="132" stroke="#f08080" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round"/><text x="242.4" y="14" font-size="13" text-anchor="middle" fill="currentColor">ここまでが 配るものの数</text></svg>'
        explain: 例：「子どもの人数を x 人とする。配るものの数は、a こずつ配ると p こ余るので ax + p、b こずつ配ると q こたりないので bx − q と表せる。配るものの数は同じなので ax + p = bx − q。x のつくものを右に、数を左に集めて p + q = bx − ax = (b − a)x（分配法則）。b は a より大きいので、b − a は 0 でない。両辺を b − a でわって x = (p + q)/(b − a) である。」と書ければよい。①「〜とする」、② 式を変形する、③ 約束した事実（等式の性質、分配法則、0 でない数でわってよい）で結ぶ、がそろっているかを見る。「b − a が 0 でない」から両辺をわってよい、と書けていれば、なおよい。この式は、図のように「1 人分を b − a こふやすと、余りと不足を合わせた p + q こが要る」という考えと同じであることを話す。
        hints:
          - 「子どもの人数を x 人とする」から書き始め、配るものの数を 2 通りに表しましょう。
          - 2 つの式を等号で結び、x のつくものを集めて、分配法則でまとめましょう。
          - 両辺を b − a でわってよいわけ（0 でないこと）も書きましょう。
        paths:
          - [人数を x 人とする, ax + p = bx − q, p + q = (b − a)x, b − a は 0 でないのでわる, x = (p + q)/(b − a)]
          - [図で、b こずつ配る線は、a こずつ配る線より (b − a) こ × 人数 だけ長い, その長さは、余りの p と、たりない q を合わせた p + q, (b − a) × 人数 = p + q なので、人数 = (p + q)/(b − a)]
