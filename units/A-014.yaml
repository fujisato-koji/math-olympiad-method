        answer: 4600
        check: "[600 * x + 400 for x in range(1, 100) if 600 * x + 400 == 700 * x - 300][0]"
        hints:
          - 人数を x 人として、品物のねだんを 2 通りに表しましょう。
          - 600 円ずつだと、集めたお金はねだんより 400 円少ないです。
          - text: 集めたお金を 1 本の線にすると、こうなります。1 人 100 円ずつふやした分を見ましょう。人数を求めたあと、ねだんを計算しましょう。
