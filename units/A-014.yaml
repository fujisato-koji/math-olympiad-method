ze="13" text-anchor="middle" fill="currentColor">ここまでが 品物の ねだん</text></svg>'
        paths:
          - [600x + 400 = 700x − 300, x = 7, 600 × 7 + 400 = 4600 円]
          - [1 人 100 円ずつふやすと、集めたお金は 400 + 300 = 700 円ふえる, 人数は 700 ÷ 100 = 7 人, 600 × 7 + 400 = 4600 円]
        note: 「たりない」と「余る」の向きが、配る問題と反対になる。何が何より多いかを式の前に言わせる。

