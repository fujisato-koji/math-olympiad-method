    answer: 20
    check: "[x for x in range(0, 38) for y in range(0, 38) if x + y == 37 and Fraction(125, 100) * x + Fraction(8, 10) * y == Fraction(386, 10)][0]"
    hints:
      - 箱 A を x こ、箱 B を y ことして、2 つの式を立てよう。
      - 小数のある式は、両辺を 100 倍すると《整数》になるよ。
      - text: 全部が箱 B だとしたら、重さはいくらかな、と考える道もあるよ。1 こを A にかえると、何 kg ふえるかな。
        svg: '<svg viewBox="0 0 320 83.6" xmlns="http://www.w3.org/2000/svg"><rect x="54.6" y="22" width="30.8" height="25.2" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="70" y="41.6" font-size="13" text-anchor="middle" fill="currentColor">B</text><rect x="220.4" y="13.6" width="39.2" height="33.6" rx="2" fill="#b39ddb" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="240" y="37.4" font-size="13" text-anchor="middle" fill="currentColor">A</text><line x1="118" y1="30" x2="182" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="190,30 182,34.4 182,25.6" fill="currentColor" fill-opacity="1" stroke="none"/><text x="154" y="20" font-size="13" text-anchor="middle" fill="currentColor">1 こ かえる</text><text x="70" y="73.6" font-size="14" text-anchor="middle" fill="currentColor">0.8 kg</text><text x="240" y="73.6" font-size="14" text-anchor="middle" fill="currentColor">1.25 kg</text></svg>'
    paths:
      - [x + y = 37、1.25x + 0.8y = 38.6, 2 つ目を 100 倍して 125x + 80y = 3860, 1 つ目を 80 倍してひくと 45x = 900, x = 20]
      - [全部 B なら 0.8 × 37 = 29.6 kg, 38.6 − 29.6 = 9 kg たりない, B を A に 1 こかえると 0.45 kg ふえるので 9 ÷ 0.45 = 20 こ]
    note: つるかめ算の型だが、重さが小数なので、100 倍して整数にそろえてから解く。80 × 37 = 2960 の計算や、0.45 でのわり算で間ちがえやすい。

