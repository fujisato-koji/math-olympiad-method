    text: 1 以上の整数を 5 こえらびます。同じ数を何度使ってもよく、ならべ方は区別しません。えらんだ 5 この数を全部かけ合わせた数が、5 この数の和のちょうど 4 倍になるえらび方は、何通りありますか。また、答えの 1 つ 1 つがあっていて、もれがないわけを説明しましょう。
    answer: 8
    check: sum(1 for t in itertools.combinations_with_replacement(range(1, 21), 4) if math.prod(t) > 4 and (4 * sum(t)) % (math.prod(t) - 4) == 0 and 4 * sum(t) // (math.prod(t) - 4) >= t[3])
    hints:
    - 5 この数を小さい順に a ≤ b ≤ c ≤ d ≤ e と決めて、「全部かけた数 = 4 × 和」の式を書こう。1 は、かけても数をかえないけれど、たすと和はふえるね。
    - 5 この和と、いちばん大きい数 e をくらべてみよう。
    - ほかの数を決めたとき、のこりの数はどう決まるかな。
    paths:
    - - 小さい順に a ≤ b ≤ c ≤ d ≤ e とする。和は 5e 以下なので、全部かけた数 abcde = 4 × 和 ≤ 20e。両方を e でわって、abcd ≤ 20（ほかの 4 こをかけた数は 20 以下）
      - abcd = P とおくと、abcd × e = 4(a + b + c + d + e) より e(P − 4) = 4(a + b + c + d)。右がわは 0 より大きいので P > 4 で、e = 4(a + b + c + d) ÷ (P − 4) と 1 つに決まる。これが整数で、d 以上になる組だけが答え
      - 1 が 3 こ（1、1、1、d）：P = d で d = 5 から 20。e = 4(d + 3) ÷ (d − 4) を計算すると、整数になるのは d = 5、6、8、11、18 で、e = 32、18、11、8、6。e ≥ d を満たすのは d = 5、6、8 の 3 組（11、18 は e が d より小さいので数えない）
      - 1 が 2 こ（1、1、c、d）：c = 2 なら d = 3 から 10 で、e は d = 3、4、5、6、8 のとき 14、8、6、5、4。e ≥ d は d = 3、4、5 の 3 組。c = 3 は d = 3 から 6、c = 4 は d = 4、5 で、e は整数にならない。1 が 1 こ（1、b、c、d）：(2、2、2) で e = 7、(2、2、3) で e = 4 が当てはまる。(2、2、4) は e = 3 で d より小さく、(2、2、5)、(2、3、3) は整数にならない。1 が 0 こ：(2、2、2、2) は e = 8/3 で整数にならない
      - 当てはまるのは (1、1、1、5、32)、(1、1、1、6、18)、(1、1、1、8、11)、(1、1、2、3、14)、(1、1、2、4、8)、(1、1、2、5、6)、(1、2、2、2、7)、(1、2、2、3、4) の 8 通り
    - - 5 この数を小さい順に a ≤ b ≤ c ≤ d ≤ e とし、小さい 3 こ a、b、c の積を q、和を s とする。式は q × d × e = 4 × (s + d + e)
      - 両がわに q をかけて組みかえると、(q × d − 4) × (q × e − 4) = 4 × q × s + 16（左がわをかけ算してたしかめる）。また q × d × e は 4 × 5 × e 以下なので q × d ≤ 20、d ≥ c より q × c ≤ 20。だから (a、b、c) は (1、1、1)、(1、1、2)、(1、1、3)、(1、1、4)、(1、2、2)、(1、2、3)、(2、2、2) のどれか
      - どちらか一方だけが負なら左がわは負になり、正の右がわと合わない。q × d − 4 と q × e − 4 はどちらも −3 以上なので、両方が負なら積は 9 以下で、右がわ（28 以上）に足りない。だから両方とも正の約数の組をさがす。(1、1、1)：(d − 4)(e − 4) = 28 から (5、32)、(6、18)、(8、11)。(1、1、2)：(2d − 4)(2e − 4) = 48、つまり (d − 2)(e − 2) = 12 から (3、14)、(4、8)、(5、6)。(1、2、2)：(4d − 4)(4e − 4) = 96、つまり (d − 1)(e − 1) = 6 から (2、7)、(3、4)
      - のこりの組はできない。(1、1、3)：(3d − 4)(3e − 4) = 76 で、どちらも 3 でわって 2 あまる約数の組は 2 と 38 だけ、d = 2 は c = 3 より小さい。(1、1、4)：(d − 1)(e − 1) = 7 で d = 2 は 4 より小さい。(1、2、3)：(6d − 4)(6e − 4) = 160 で、どちらも 6 でわって 2 あまる組は 2 と 80、8 と 20 で、d = 1、2 は 3 より小さい。(2、2、2)：(2d − 1)(2e − 1) = 13 で d = 1 は 2 より小さい
      - 合わせて 3 + 3 + 2 = 8 通り
    note: 考えどころは 3 つ：①いちばん大きい数 e でおさえる（和 ≤ 5e より、全部かけた数 = 4 × 和 ≤ 20e なので、e 以外の 4 こをかけた数は 20 以下になり、調べる組が有限になる、docs/hardest-structures.md の大きい側からおさえる型）、②e 以外の 4 こを決めると、e は 4 ×（4 この和）÷（4 こをかけた数 − 4）と 1 つに決まる（式を e について整理する）、③1 は、かけても数をかえず和だけをふやすので、1 でない数のこ数で整理できる。「n この整数で積 = 和」の定番（5 こなら (1、1、1、2、5)、(1、1、1、3、3)、(1、1、2、2、2) の 3 通り）を 4 倍にすると、解が 8 通りにふえ、1 でない数のこ数ごとに約数の解き方が要る。A-017 の「積が和より 19 大きい」は 2 つの数だけで 1 回の約数の解き方ですむが、この問題はこ数ごとにきまりが変わり、おさえる範囲も自分で作る。2 本目は、こ数で分けて、1 つの数について整理して約数で解く。1 本目のように 36 組を全部書き出さず、各こ数で式を整理して約数と大小でしぼる。check は、小さい 4 こを、1 から 20 までの数で小さい順に全部調べ、e を式で出して整数で d 以上のものを数える（8 を返す）。小さい 4 この上限 20 は、本文の見積もり（ほかの 4 こをかけた数は 20 以下で、4 こそれぞれも 20 以下）による。上限 20 は check の外の話なので、見積もりが正しいことは本文でたしかめる。 点をつける役に言われて、2 本目を「1 のこ数で分ける」から「小さい 3 こを決め、(q × d − 4)(q × e − 4) = 4 × q × s + 16 に組みかえて、のこりの 2 こを約数の組で同時に決める」道にかえた（1 本目は、いちばん大きい数を 1 つずつ式で出す）。
