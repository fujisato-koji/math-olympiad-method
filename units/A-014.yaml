        text: 子どもにあめを配ります。1 人に 4 こずつ配ると 6 こ《余り》、5 こずつ配ると 3 こたりません。子どもを x 人とすると、あめの数は 4x + 6 とも 5x − 3 とも表せるので、4x + 6 = 5x − 3 で x = 9 です。子どもは 9 人、あめは 42 こです。図の下のように、1 人に 1 こずつ多く配るには、余りの 6 こと、たりない 3 こを合わせた 9 こが要る、と見ても同じです。
