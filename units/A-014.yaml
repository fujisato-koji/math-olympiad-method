le cx="140" cy="106" r="8" fill="none" stroke="#2b7bb9" stroke-width="1.2"/><text x="140" y="111" font-size="12" text-anchor="middle" fill="#2b7bb9">4</text><circle cx="120" cy="78" r="8" fill="none" stroke="#2b7bb9" stroke-width="1.2"/><text x="120" y="83" font-size="12" text-anchor="middle" fill="#2b7bb9">5</text><circle cx="140" cy="50" r="8" fill="none" stroke="#2b7bb9" stroke-width="1.2"/><text x="140" y="55" font-size="12" text-anchor="middle" fill="#2b7bb9">6</text><text x="238" y="83" font-size="14" text-anchor="start" fill="currentColor">まわり 30 m</text></g></g></svg>'
        explain: 30 m を 5 m ずつに区切ると、間の数は 30 ÷ 5 = 6 です。図のように、両はしにも植えると、木の数は間の数より 1 多く、6 + 1 = 7 本です。両はしに植えないときは、間の数より 1 少ない 5 本、池のまわりのように輪になっているときは、間の数と同じ 6 本です。このように、木の数と間の数の関係を使う問題を植木算といいます。間の数を文字にして方程式にすることもできます。たとえば、両はしにも植えて木が 13 本、道が 96 m なら、間は 12 あるので、間かくを x m として 12x = 96、x = 8 m です。
      - part: 思い出す
