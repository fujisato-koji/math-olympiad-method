      - 列車の長さを x m、秒速を y m として、2 つの式を立てよう。
      - 2 つの式をひくと、列車の長さが消えるね。
    paths:
      - [列車の長さを x m、秒速を y m とする, 520 + x = 36y、1360 + x = 78y, ひいて 840 = 42y で y = 20, x = 720 − 520 = 200 m]
      - [トンネルと鉄橋の長さの差 840 m を 78 − 36 = 42 秒で進む, 秒速 20 m, 36 秒で 720 m 進むので 720 − 520 = 200 m]
    note: 通過算。先頭が進む道のりは「鉄橋（トンネル）の長さ + 列車の長さ」になることを図で確かめる（速さは A-007）。列車の長さを足し忘れて、520 ÷ 36 を速さにしてしまう間ちがいが多い。
