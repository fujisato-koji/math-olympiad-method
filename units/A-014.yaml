      - [120 円 1 こと 80 円 2 こを 1 組と見ると、1 組は 3 こで 280 円, 全部 50 円なら 600 円。50 円 3 こを 1 組にかえると 280 − 150 = 130 円ふえる, 860 − 600 = 260 円は 2 組分なので、50 円は 12 − 6 = 6 こ]
    note: 3 種類でも、関係を使って 1 文字にへらすと解ける。こ数が 0 以上という条件もたしかめる。

