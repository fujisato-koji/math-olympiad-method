    id: "4123e5b67c"
    kinds: [道筋]
    text: ある まどぐちの前に、受付が始まるときすでに何人かがならんでいて、受付が始まってからも、毎分同じ人数ずつ新しい人がならびます。まどぐち 1 つでは、毎分 3 人ずつ受け付けます。まどぐちを 2 つ開けると 40 分で、3 つ開けると 16 分で、ならんでいる人がいなくなります。まどぐちを 4 つ開けると、何分でならんでいる人がいなくなりますか。どの場合も、はじめにならんでいる人数と、毎分新しくならぶ人数は同じとします。
    svg: '<svg viewBox="0 0 320 156" xmlns="http://www.w3.org/2000/svg"><rect x="250" y="34" width="56" height="26" rx="3" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.6"/><text x="278" y="52" font-size="13" text-anchor="middle" fill="currentColor">まど 1</text><rect x="250" y="68" width="56" height="26" rx="3" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.6"/><text x="278" y="86" font-size="13" text-anchor="middle" fill="currentColor">まど 2</text><rect x="250" y="102" width="56" height="26" rx="3" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.6"/><text x="278" y="120" font-size="13" text-anchor="middle" fill="currentColor">まど 3</text><text x="278" y="24" font-size="13" text-anchor="middle" fill="currentColor">1 つで 毎分 3 人</text><circle cx="222" cy="63.1" r="5.1" fill="#ffffff" fill-opacity="0.9" stroke="currentColor" stroke-width="1.6"/><path d="M 214.3 80.1 Q 214.3 69.9 222 69.9 Q 229.7 69.9 229.7 80.1 Z" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="196" cy="63.1" r="5.1" fill="#ffffff" fill-opacity="0.9" stroke="currentColor" stroke-width="1.6"/><path d="M 188.3 80.1 Q 188.3 69.9 196 69.9 Q 203.7 69.9 203.7 80.1 Z" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="170" cy="63.1" r="5.1" fill="#ffffff" fill-opacity="0.9" stroke="currentColor" stroke-width="1.6"/><path d="M 162.3 80.1 Q 162.3 69.9 170 69.9 Q 177.7 69.9 177.7 80.1 Z" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="144" cy="63.1" r="5.1" fill="#ffffff" fill-opacity="0.9" stroke="currentColor" stroke-width="1.6"/><path d="M 136.3 80.1 Q 136.3 69.9 144 69.9 Q 151.7 69.9 151.7 80.1 Z" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="118" cy="63.1" r="5.1" fill="#ffffff" fill-opacity="0.9" stroke="currentColor" stroke-width="1.6"/><path d="M 110.3 80.1 Q 110.3 69.9 118 69.9 Q 125.7 69.9 125.7 80.1 Z" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="92" cy="63.1" r="5.1" fill="#ffffff" fill-opacity="0.9" stroke="currentColor" stroke-width="1.6"/><path d="M 84.3 80.1 Q 84.3 69.9 92 69.9 Q 99.7 69.9 99.7 80.1 Z" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="14" y1="74" x2="52" y2="74" stroke="#f08080" stroke-width="2.5" stroke-linecap="round"/><polygon points="60,74 52,78.4 52,69.6" fill="#f08080" fill-opacity="1" stroke="none"/><text x="36" y="44" font-size="13" text-anchor="middle" fill="currentColor">毎分</text><text x="36" y="60" font-size="13" text-anchor="middle" fill="currentColor">ふえる</text><text x="160" y="106" font-size="13" text-anchor="middle" fill="currentColor">はじめに ならんでいる人</text><text x="160" y="146" font-size="13" text-anchor="middle" fill="currentColor">まど 2 つ → 40 分、3 つ → 16 分で いなくなる</text></svg>'
    answer: 10
    check: "[N // (4 * 3 - r) for r in range(0, 20) for N in range(1, 1000) if N + 40 * r == 2 * 3 * 40 and N + 16 * r == 3 * 3 * 16][0]"
