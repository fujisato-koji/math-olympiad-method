    answer: 10
    check: "[N // (4 * 3 - r) for r in range(0, 20) for N in range(1, 1000) if N + 40 * r == 2 * 3 * 40 and N + 16 * r == 3 * 3 * 16][0]"
    hints:
      - はじめに並んでいる人数を x 人、毎分新しく並ぶ人数を y 人としよう。
      - 窓口 2 つで 40 分の間に受け付けた人数は、はじめの人数と、その間に新しく並んだ人数の和だね。
      - 窓口 3 つのときも同じように式にして、連立方程式を解こう。
    paths:
      - [はじめ x 人、毎分 y 人並ぶとする, 窓口 2 つで x + 40y = 6 × 40 = 240, 窓口 3 つで x + 16y = 9 × 16 = 144, y = 4、x = 80, 窓口 4 つでは 1 分に 12 − 4 = 8 人ずつ減るので 80 ÷ 8 = 10 分]
      - [窓口 2 つでは 1 分に 6 − y 人、3 つでは 9 − y 人ずつ減る, 40(6 − y) = 16(9 − y) で y = 4, はじめは 40 × 2 = 80 人, 80 ÷ (12 − 4) = 10 分]
    note: 増えながら減る量（ニュートン算）。受け付けた人数が「はじめの人数 + 新しく並んだ人数」であることに気づき、2 つのわからない数で連立方程式にする。窓口の数と時間が反比例すると考えて「2 つで 40 分なら 4 つで 20 分」としてしまう間ちがいが多い。
