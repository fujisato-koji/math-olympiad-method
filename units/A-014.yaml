" stroke-width="1.4"/><line x1="118" y1="30" x2="182" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="190,30 182,34.4 182,25.6" fill="currentColor" fill-opacity="1" stroke="none"/><text x="154" y="20" font-size="13" text-anchor="middle" fill="currentColor">1 ぴき かえる</text><text x="70" y="73.6" font-size="14" text-anchor="middle" fill="currentColor">つる 足 2 本</text><text x="240" y="73.6" font-size="14" text-anchor="middle" fill="currentColor">かめ 足 4 本</text><text x="154" y="52" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">足が 2 本 ふえる</text></g><line x1="10" y1="206.6" x2="310" y2="206.6" stroke="#c8ccd6" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round"/><g transform="translate(0,209.6)"><text x="160" y="20" font-size="15" text-anchor="middle" fill="currentColor">8 本 ふやすには 8 ÷ 2 = 4 ひき かえる</text><text x="160" y="44" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">かめ 4 ひき、つる 6 羽</text></g></svg>'
        explain: つるを x 羽、かめを y ひきとします。数の関係から x + y = 10、足の数の関係から 2x + 4y = 28 です。下の式を 2 でわると x + 2y = 14、上の式をひいて y = 4、x = 6 です。たしかめ：6 + 4 = 10、2 × 6 + 4 × 4 = 12 + 16 = 28 で合います。このように、2 種類のもののこ数の合計と、足の数や代金のような量の合計から、それぞれのこ数を求める問題を、つるかめ算といいます。連立方程式なら、どの数でもそのまま解けます。図の「全部つるだとすると足は 20 本で 8 本たりない。つる 1 羽をかめ 1 ぴきにかえると足は 2 本ふえるので、かめは 8 ÷ 2 = 4 ひき」という考えは、1 つ目の式を 2 倍してひき、x を消す計算と同じです。
