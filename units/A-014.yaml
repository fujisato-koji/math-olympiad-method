  - day: 2
    items:
      - part: 見本
        text: つるとかめが合わせて 10 いて、足の数は合わせて 28 本です。つるは何羽、かめは何びきでしょう。
        figure: "🐦 足 2 本\n🐢 足 4 本"
        explain: つるを x 羽、かめを y ひきとします。数の関係から x + y = 10、足の数の関係から 2x + 4y = 28 です。下の式を 2 でわると x + 2y = 14、上の式をひいて y = 4、x = 6 です。確かめ：6 + 4 = 10、2 × 6 + 4 × 4 = 12 + 16 = 28 で合います。答えはつる 6 羽、かめ 4 ひきです。このように、2 種類のものの個数の合計と、足の数や代金のような量の合計から、それぞれの個数を求める問題を、つるかめ算といいます。連立方程式なら、どの数でもそのまま解けます。「全部つるだとすると足は 20 本で 8 本たりない。つる 1 羽をかめ 1 ぴきにかえると足は 2 本ふえるので、かめは 8 ÷ 2 = 4 ひき」と考える解き方もあり、これは x を消す加減法と同じ計算です。
