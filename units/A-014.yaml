roke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="234" y="151" font-size="13" text-anchor="middle" fill="currentColor">1 こ × 人数 = 6 + 3</text><rect x="248" y="108" width="28" height="20" rx="3" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="5 4"/><path d="M 248 105 Q 248 102 254 102 L 256 102 Q 262 102 262 99 Q 262 102 268 102 L 270 102 Q 276 102 276 105" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="252" y="94" font-size="13" text-anchor="start" fill="currentColor">たりない 3</text><line x1="248" y1="22" x2="248" y2="132" stroke="#f08080" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round"/><text x="248" y="14" font-size="13" text-anchor="middle" fill="currentColor">ここまでが あめの数</text></g></svg>'
        explain: 子どもを x 人とします。あめの数を 2 通りに表すと、4 こずつなら 4x + 6 こ、5 こずつなら 5x − 3 こです。あめの数は同じなので 4x + 6 = 5x − 3 で、x = 9 です。あめは 4 × 9 + 6 = 42 こです。たしかめ：5 こずつなら 5 × 9 = 45 こ要り、42 こでは 3 こたりないので合います。このように、配り方を変えたときの余りや不足から、人数と全体の数を求める問題を過不足算といいます。あめを y ことして、y = 4x + 6、y = 5x − 3 の連立方程式にしても同じです。「1 人 1 こずつ多く配るには、余りの 6 こと不足の 3 こを合わせた 9 こが要るので、人数は 9 ÷ 1 = 9 人」と考える解き方もあります。
