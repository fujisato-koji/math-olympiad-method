<rect x="224" y="40" width="86" height="30" rx="0" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="267" y="60" font-size="14" text-anchor="middle" fill="currentColor">和差算</text><rect x="10" y="70" width="214" height="30" rx="0" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="117" y="90" font-size="14" text-anchor="middle" fill="currentColor">数の合計と、足・代金の合計</text><rect x="224" y="70" width="86" height="30" rx="0" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="267" y="90" font-size="14" text-anchor="middle" fill="currentColor">つるかめ算</text><rect x="10" y="100" width="214" height="30" rx="0" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="117" y="120" font-size="14" text-anchor="middle" fill="currentColor">配り方が 2 通り（余り・たりない）</text><rect x="224" y="100" width="86" height="30" rx="0" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="267" y="120" font-size="14" text-anchor="middle" fill="currentColor">過不足算</text><rect x="10" y="130" width="214" height="30" rx="0" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="117" y="150" font-size="14" text-anchor="middle" fill="currentColor">木と間、テープのつなぎ目</text><rect x="224" y="130" width="86" height="30" rx="0" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="267" y="150" font-size="14" text-anchor="middle" fill="currentColor">植木算</text></g></svg>'
        explain: あめを x こ、ガムを y ことすると x + y = 10、40x + 60y = 510 です。1 つ目の式を 40 倍してひくと 20y = 110、y = 11/2 です。ガムのこ数が 11/2 こになることはないので、ちょうど 510 円にはできません。このように、解いたあとで、答えが場面に合うか（こ数や人数が 0 以上の《整数》か）を必ずたしかめます。式を立てる前には、問題の型を見分けます。和と差が書いてあれば和差算、2 種類のこ数の合計と量の合計なら、つるかめ算、配り方が 2 通りなら過不足算、木や間の数なら植木算です。どの型でも、わからない数を文字にして、等しい関係を式にすれば解けます。
