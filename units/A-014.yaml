        text: まっすぐな道にそって、はしからはしまで 5 m おきに木を植えます。道の長さが 30 m のとき、両はしにも植えると、木は何本いるでしょう。
        figure: "🌳─🌳─🌳─🌳─🌳─🌳─🌳"
        explain: 30 m を 5 m ずつに区切ると、間の数は 30 ÷ 5 = 6 です。図のように、両はしにも植えると、木の数は間の数より 1 多く、6 + 1 = 7 本です。両はしに植えないときは、間の数より 1 少ない 5 本、池のまわりのように輪になっているときは、間の数と同じ 6 本です。このように、木の数と間の数の関係を使う問題を植木算といいます。間の数を文字にして方程式にすることもできます。たとえば、両はしにも植えて木が 13 本、道が 96 m なら、間は 12 あるので、間かくを x m として 12x = 96、x = 8 m です。
