    answer: 4
    check: "[y for x in range(0, 11) for y in range(0, 11 - x) for z in range(0, 11 - x - y) if x + y + z == 10 and 50 * x + 80 * y + 120 * z == 760][0]"
    hints:
      - 50 円を x こ、80 円を y こ、120 円を z ことしよう。
      - こ数と代金の式を立てよう。
      - text: x + y + z = 10 を 50 倍してひくことは、「全部 50 円だとすると」と考えることだよ。1 こかえると、いくらふえるかな。
