      - part: 今日
        text: 1 本 60 円のえんぴつと 1 本 90 円のボールペンを合わせて 15 本買うと、代金は 1110 円でした。えんぴつを x 本、ボールペンを y 本とするとき、正しい式の組はどれですか。
