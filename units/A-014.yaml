        id: "40fe550c35"
        text: まっすぐな道にそって、5 m おきに木を植えます。道の長さが 30 m なら、間の数は 30 ÷ 5 = 6 です。両はしにも植えると木は 6 + 1 = 7 本、両はしに植えないと 6 − 1 = 5 本、池のまわりのような輪では 6 本です。図で、木と間（青い番号）を数えてくらべましょう。
