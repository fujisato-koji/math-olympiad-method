# A-014 文章題を方程式にする（和差、つるかめ、過不足、植木）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011、A-012 に合わせる。
# 地図に plan がないので、既定の並び（導入、練習 4 日、わけ、混ぜる、確認）で作った。
#   1 日目：文章題を方程式で解く手順（文字にする、等しい関係を式にする、解く、場面で確かめる）と和差算（2 つ、3 つの数、やりとりのあと同じになる）。
#   2 日目：つるかめ算（個数の合計と、足の数や代金の合計）、点をひかれる場合。
#   3 日目：過不足算（配り方を変えたときの余りと不足、両方とも余る・たりない、長いす）。
#   4 日目：植木算（両はしに植える、植えない、輪になっている。テープののりしろ）。
#   5 日目：どの型かを見分けて式を立てる、答えが場面に合うか（個数が整数になるか）を確かめる、3 種類のもの。
#   6 日目：わけ。7 日目：A-012、A-003 と混ぜる。8 日目：確認。
# D-014 により、本線は連立方程式（つるかめ算は最初から連立方程式で）。1 つの文字で立つものは 1 次方程式（A-011）で解く。
#   線分図（A-003）、「全部つるだとすると」、「1 人分を何こふやすと」のような特別な解き方は、paths の 2 本目の道と見本の説明に置いた。
# 前提は A-012（連立方程式）、A-003（線分図）。数は 0 以上の整数になる場面にした（個数、人数、まい数、円、m、cm）。
#   長さの単位（G-046）は前提にないが、A-011 と同じく m と cm は場面の言葉として使った。
# 答えは数を打つ。式の組を選ぶ問題と、「できない」を選ぶ問題は choices にした。
#   check は、場面の条件をそのまま式にして総当たりで答えをさがす（式の組を選ぶ問題は、場面に合う組を代入して成り立つものを選ぶ）。
#   植木算は、間の数を「長さ ÷ 間かく」（//）で出して、両はしの決まりで 1 を足すかひく。
# 人の名前は使わず、兄と弟、姉と妹、大人と子どもで書く。
# 文章題を式にする力は、理科の量の計算（H-016 の反応する量、P の流れの運動の式）の入口になる（D-026）。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-046 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-014
days:
  - day: 1
    items:
      - part: 見本
        text: 兄と弟のカードは合わせて 80 まいで、兄は弟より 22 まい多く持っています。兄と弟は、それぞれ何まい持っているでしょう。
        explain: 文章題を方程式で解く手順は次のとおりです。① わからない数を文字にする（兄を x まい、弟を y まいとする）。② 等しい関係を見つけて式にする（合わせて 80 まいなので x + y = 80、兄は弟より 22 まい多いので x − y = 22）。③ 解く（足して 2x = 102、x = 51、y = 29）。④ 場面で確かめる（51 + 29 = 80、51 − 29 = 22 で合う。まい数なので 0 以上の整数でよい）。答えは兄 51 まい、弟 29 まいです。このように、2 つの数の和と差から、それぞれの数を求める問題を和差算といいます。線分図（A-003）で、兄の線からちがいの 22 まいを切りとると、残りの 80 − 22 = 58 まいが弟 2 人分になる、と考えても同じ答えになります。
      - part: 思い出す
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "2x + y = 16 …①\nx − y = 5 …②"
        answer: 7
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if 2 * x + y == 16 and x - y == 5][0]"
        hints:
          - y の係数の符号が反対です。
          - ① と ② を足すと、y が消えます。
          - 3x = □ の形にしましょう。
        paths:
          - [①＋② で 3x = 21, x = 7]
      - part: 思い出す
        text: 赤い玉は白い玉より 9 こ多く、赤い玉は 34 こです。白い玉は何こですか。
        answer: 25
        check: "34 - 9"
        hints:
          - 線分図をかいてみましょう。長い線はどちらでしょう。
          - 白い玉の線は、赤い玉の線から 9 こ分をのぞいた長さです。
          - 「多い」とあっても、足すとはかぎりません。
        paths:
          - [赤のほうが 9 こ多い, 34 − 9, 25 こ]
      - part: 今日
        text: 2 つの数があります。和は 54、差は 18 です。大きいほうの数はいくつですか。
        answer: 36
        check: "[x for x in range(0, 100) for y in range(0, 100) if x + y == 54 and x - y == 18][0]"
        hints:
          - 大きいほうを x、小さいほうを y としましょう。
          - 和と差を、それぞれ式に書きましょう。
          - 2 つの式を足すと、y が消えます。
        paths:
          - [x + y = 54、x − y = 18, 足して 2x = 72, x = 36]
          - [線分図で小さいほうに差を足すと大きいほう 2 つ分, 54 + 18 = 72, 72 ÷ 2 = 36]
      - part: 今日
        text: 姉と妹のおはじきは合わせて 63 こで、姉は妹より 15 こ多く持っています。姉を x こ、妹を y ことするとき、正しい式の組はどれですか。
        choices: [x + y = 63、x − y = 15, x + y = 15、x − y = 63, x + y = 63、y − x = 15]
        answer: x + y = 63、x − y = 15
        check: "[c for c, f in {'x + y = 63、x − y = 15': lambda x, y: x + y == 63 and x - y == 15, 'x + y = 15、x − y = 63': lambda x, y: x + y == 15 and x - y == 63, 'x + y = 63、y − x = 15': lambda x, y: x + y == 63 and y - x == 15}.items() if f(39, 24)][0]"
        hints:
          - 「合わせて」は、和のことです。
          - 「姉は妹より 15 こ多い」は、姉 − 妹 が 15 ということです。
          - 姉が x、妹が y です。どちらからどちらをひくでしょう。
        paths:
          - [合わせて 63 は x + y = 63, 姉が 15 多いは x − y = 15]
        note: 「多い」をどちらからひくかを取りちがえやすい。y − x = 15 だと、妹のほうが多いことになる。
      - part: 今日
        text: 3 つの箱 A、B、C にみかんが合わせて 52 こ入っています。A は B より 6 こ多く、C は B より 2 こ少ないです。B の箱には何こ入っていますか。
        answer: 16
        check: "[b for b in range(0, 60) if b + (b + 6) + (b - 2) == 52][0]"
        hints:
          - ほかの 2 つの箱とくらべられている B を、x ことしましょう。
          - A と C のみかんの数を、x を使って表しましょう。
          - 3 つの和を式にして、52 と等しいとおきましょう。
        paths:
          - [B を x こ、A は x + 6、C は x − 2, 3x + 4 = 52, x = 16]
        note: くらべるもとになっている量を x にすると、1 つの文字で式が立つ。
      - part: 挑戦
        text: 兄と弟は合わせて 1200 円持っています。兄が弟に 150 円わたすと、2 人の金額は同じになります。はじめに兄は何円持っていましたか。
        answer: 750
        check: "[x for x in range(0, 1201) for y in range(0, 1201) if x + y == 1200 and x - 150 == y + 150][0]"
        hints:
          - 兄を x 円、弟を y 円としましょう。
          - わたしたあとの 2 人の金額を、それぞれ式で表しましょう。
          - わたしたあとの金額が同じ、という式を整理すると、差がわかります。
        paths:
          - [x + y = 1200、x − 150 = y + 150, x − y = 300, 足して 2x = 1500 で x = 750]
        note: 差を 150 円としやすい。わたすと兄は 150 円へり、弟は 150 円ふえるので、はじめの差は 300 円。
