  - day: 3
    items:
      - part: 見本
        text: 子どもにあめを配ります。1 人に 4 こずつ配ると 6 こ《余り》、5 こずつ配ると 3 こたりません。子どもの人数とあめの数を求めましょう。
        explain: 子どもを x 人とします。あめの数を 2 通りに表すと、4 こずつなら 4x + 6 こ、5 こずつなら 5x − 3 こです。あめの数は同じなので 4x + 6 = 5x − 3 で、x = 9 です。あめは 4 × 9 + 6 = 42 こです。確かめ：5 こずつなら 5 × 9 = 45 こ要り、42 こでは 3 こたりないので合います。このように、配り方を変えたときの余りや不足から、人数と全体の数を求める問題を過不足算といいます。あめを y ことして、y = 4x + 6、y = 5x − 3 の連立方程式にしても同じです。「1 人 1 こずつ多く配るには、余りの 6 こと不足の 3 こを合わせた 9 こが要るので、人数は 9 ÷ 1 = 9 人」と考える解き方もあります。
      - part: 思い出す
        text: 1 本 80 円の花と 1 本 120 円の花を合わせて 10 本買うと、代金は 1000 円でした。120 円の花は何本買いましたか。
