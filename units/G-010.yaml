        explain: 円の面積 = 半径 × 半径 × 円周率 で求められます（わけは 4 日目）。半径 3 cm の円の面積は 3 × 3 × 円周率 = （9 × 円周率）cm² です。円周率を 3.14 とすると、約 28.26 cm² になります。
      - part: 思い出す
        text: 半径が 7 cm の円の円周は、（□ × 円周率）cm です。□ に入る数はいくつですか。
