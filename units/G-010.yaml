# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 陸上競技場のトラックは、2 つの半円と長方形を合わせた形です。内がわの線の 1 周は 400 m です。はば 1.25 m のレーンの外がわの線を 1 周すると、内がわの線を 1 周するより何 m 長いですか。（□ × 円周率）m の □ に入る数を答えましょう。
    svg: |
      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><path d="M70 42 L170 42 A28 28 0 0 1 170 98 L70 98 A28 28 0 0 1 70 42 Z M70 30 L170 30 A40 40 0 0 1 170 110 L70 110 A40 40 0 0 1 70 30 Z" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity=".35" fill-rule="evenodd"/><line x1="120" y1="30" x2="120" y2="42" stroke="currentColor" stroke-width="1"/><text x="120" y="24" font-size="10" text-anchor="middle">はば 1.25 m</text><text x="120" y="74" font-size="10" text-anchor="middle">内がわの線の 1 周は 400 m</text></svg>
    answer: 2.5
    accept: [5/2]
    check: "1.25 * 2"
    hints:
      - まっすぐな所の長さは、内がわと外がわで同じかな。
      - 2 つの半円を合わせると、円 1 つになるね。外がわの円の直径は、内がわの円の直径より何 m 長いかな。
      - 円の大きさが分からなくても、円周のちがいだけなら求められるよ。
    paths:
      - [まっすぐな所の長さは同じ, 2 つの半円で円 1 つ・外がわの円の直径は 1.25 × 2 = 2.5 m 長い, 円周のちがいは 2.5 × 円周率, 2.5]
    note: 内がわの円の半径を求めようとすると行きづまる。円周は「直径 × 円周率」なので、直径が 2.5 m 長くなれば、円周は 2.5 × 円周率 だけ長くなる（変わらない量に目を付ける）。400 m は答えに使わない。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [N-059]
    text: 時計の長いはりの長さは 9 cm です。1 時 25 分から 2 時 5 分までに、長いはりが動いて通った部分（おうぎ形）の面積は、（□ × 円周率）cm² です。□ に入る数を答えましょう。
    answer: 54
    check: "9 * 9 * Fraction(40 * 6, 360)"
    hints:
      - 1 時 25 分から 2 時 5 分までは何分間かな。
      - 長いはりは 60 分で 1 回転するよ。その時間で、円の何分の何だけ回るかな。
      - 半径 9 cm の円の面積の、何分の何になるかな。
    paths:
      - [1 時 25 分から 2 時 5 分までは 40 分, 40 分は 60 分の 2/3 なので 円の 2/3, 9 × 9 × 円周率 × 2/3 = 54 × 円周率, 54]
    note: 時刻をまたぐ時間（N-059）を正しく出すのが最初の関門（2 時をまたぐ）。40 分を 240° としてから 240/360 = 2/3 にしてもよい。長いはりの先が動いた長さ（弧）と面積を取りちがえやすい。
  - part: 離
    kinds: [数]
    text: 半径 4.5 cm の円から、同じ中心の半径 2.5 cm の円を切りぬいて、輪の形を作りました。輪（色のついた部分）の面積は約何 cm² ですか。円周率は 3.14 とします。
    svg: |
      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><path d="M60 70 A60 60 0 1 0 180 70 A60 60 0 1 0 60 70 Z M86.7 70 A33.3 33.3 0 1 0 153.3 70 A33.3 33.3 0 1 0 86.7 70 Z" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".35" fill-rule="evenodd"/><circle cx="120" cy="70" r="2.5" fill="currentColor"/><line x1="120" y1="70" x2="180" y2="70" stroke="currentColor" stroke-width="1.5"/><text x="184" y="74" font-size="10" text-anchor="start">4.5 cm</text><line x1="120" y1="70" x2="98.6" y2="95.5" stroke="currentColor" stroke-width="1.5"/><text x="122" y="90" font-size="9" text-anchor="start">2.5 cm</text></svg>
    answer: 43.96
    check: "(lambda c: f'{c // 100}.{c % 100:02d}')((45 * 45 - 25 * 25) * 314 // 100)"
    hints:
      - 大きい円の面積から、小さい円の面積をひこう。
      - どちらの面積にも「× 3.14」があるね。先にまとめられないかな。
      - 4.5 × 4.5 と 2.5 × 2.5 を先に計算しよう。
    paths:
      - [4.5 × 4.5 − 2.5 × 2.5 = 20.25 − 6.25 = 14, 14 × 3.14 = 43.96, 約 43.96 cm²]
      - [大きい円は 20.25 × 3.14 = 63.585, 小さい円は 6.25 × 3.14 = 19.625, 63.585 − 19.625 = 43.96]
    note: そのまま 2 つの円の面積を出すと小数第 3 位まで出て計算が重い（2 本目）。「× 3.14」をまとめてから掛ける（計算のきまり）と、14 × 3.14 だけになる。
