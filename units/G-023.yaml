# G-023 角度の追跡と内接四角形
#
# 書き方は N-001 の頭の注のとおり。
# 角度の追跡：図の中のわかる角を、使った事実といっしょに 1 つずつ書きこみ、求める角までつなぐ。
#   使う事実は、三角形の角の和と外角（G-016）、平行線の同位角・錯角（G-016）、二等辺三角形（G-017）、
#   円周角の定理（G-018：円周角は同じ弧に対する中心角の半分、同じ弧に対する円周角は等しい、半円の弧に対する円周角は 90°）。
# この単元で足す事実は 4 つ：① 円に内接する四角形の向かい合う角の和は 180°、外角はそれと向かい合う内角に等しい
#   ② 4 点が同じ円の上にある条件（円周角の定理の逆、向かい合う角の和が 180°、外角が向かい合う内角に等しい、同じ線分を見る 2 つの直角）
#   ③ 円の接線は接点を通る半径に垂直（円が中心を通る直線について線対称であることから、11 日目の見本で約束する）
#   ④ 接線と弦のつくる角は、その角の内側の弧に対する円周角に等しい（接弦定理）。円の外の点からの 2 本の接線の長さは等しい。
#   円周角の定理の逆は G-018 で扱うとみて、7 日目は見本で言い直してから、隠れた円を見つける使い方を練習する。
# 前提は G-018 だけなので、相似（G-020）、方べき（G-030）、三平方（G-019）は使わない。
#   2 本の垂線の交点（垂心）や、3 本の線が 1 点で交わること、五心の名前は G-028 で扱うので、ここでは「交点 H」とだけ言う。
#   有向角（向きのある角）は使わない。13 日目の挑戦で、点の位置で角が x と 180° − x に分かれることだけを見る。
# 図は svg（D-040）。円の上の点は、決めた角になるように弧の大きさから位置を計算して置いた（角は本当の大きさ）。
#   求める角は図に x と書いた。円の中心は、図に O と書いたときだけ使ってよい。
#   4 点が同じ円の上にあるかを考える問題では、円をかかない（見つけるのが問題なので）。
# 角の答えは度の数を打つ。文字の式で答える問題は選ぶ問題にし、check は選択肢ごとの式（lambda）に x を入れて、角の追跡の式と合うものを選ぶ。
# 地図に plan がないので既定の並び（導入・練習 12 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 角の追跡の進め方（中心と半径の二等辺三角形、円周角）　2 日目 同じ弧に対する円周角で角を移す
#   3 日目 直径と 90°、中心角　4 日目 内接四角形の向かい合う角　5 日目 内接四角形の外角
#   6 日目 内接四角形と円周角を組み合わせる　7 日目 4 点が同じ円の上にある条件 1（同じ側から同じ角で見る）
#   8 日目 条件 2（向かい合う角の和、外角）　9 日目 条件 3（2 つの直角）と三角形の 2 本の垂線
#   10 日目 隠れた円を見つけて角を移す（等しい長さ、2 つの直角、等しい角）　11 日目 接線と半径、接弦定理
#   12 日目 2 本の接線、接線の長さ、円に外接する四角形　13 日目 2 つの円、文字で追う、点の位置で変わる角
#   14 日目 わけ（内接四角形の対角の和、接弦定理、2 つの直角で同じ円）　15 日目 G-016・G-017・G-018 と混ぜる　16 日目 確認
# check：角の追跡の式。4 点が同じ円の上にあるかを選ぶ問題は、向かい合う角の和が 180 かをくらべる式。
#   性質の名前やわけを選ぶ問題は約束ごとなので check を付けない。
# 前提の更新（2026-11-08）：③ 接線と半径、④ 接弦定理、2 本の接線の長さは、いまは G-054（円の接線と接弦定理）が受け持ち、G-054 はこの単元の前提に入った。11・12 日目の接線の問題と、14 日目の接弦定理のわけは、G-054 の復習と使い方として残している。

