# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 2¹⁰ × 5⁸ を計算すると、何けたの《整数》になりますか。
    answer: 9
    check: "len([d for d in range(1, 30) if 10 ** (d - 1) <= 2 ** 10 * 5 ** 8])"
    hints:
      - 2 × 5 = 10 だね。2 と 5 を組にしてみよう。
      - 2¹⁰ を 2² × 2⁸ に分けると、5⁸ と組にできるよ。
      - (2 × 5)⁸ = 10⁸ は何けたの数かな。
    paths:
      - [2¹⁰ × 5⁸ = 2² × 2⁸ × 5⁸, 2⁸ × 5⁸ = (2 × 5)⁸ = 10⁸, 4 × 10⁸ = 400000000 で 9 けた]
    note: 2¹⁰ = 1024 と 5⁸ = 390625 をそれぞれ計算すると大変。2 と 5 を組にして 10 の累乗を作るのが道筋（指数法則の (2 × 5)⁸ = 2⁸ × 5⁸ を逆に使う）。10⁸ を 8 けたと数えまちがえやすい。
  - part: 離
    kinds: [総動員]
    uses: [G-004]
    text: 細長い紙テープを半分に折ります。折ったまま、また半分に折ります。これを全部で 5 回くり返してから広げると、折り目の線は何本ありますか。折り目はすべて平行になるように折ります。
    answer: 31
    check: "2 ** 5 - 1"
    hints:
      - 1 回、2 回、3 回折ったとき、テープはいくつに分かれるかな。
      - 折るたびに、分かれた部分の数はどうなるかな。
      - 分かれた部分の数と、折り目の数の関係を考えよう。
    paths:
      - [1 回で 2 つ、2 回で 4 つ、3 回で 8 つに分かれる, 5 回で 2⁵ = 32 に分かれる, 折り目は分かれた数より 1 少ないので 31 本]
      - [折り目は 1 本、3 本、7 本、15 本と ふえる, 2 倍して 1 を足すきまり, 次は 31 本]
    note: 折る（G-004）と累乗（2⁵）を合わせる。分かれた部分の数 32 をそのまま答えにしやすい。部分と部分の間に折り目があるので 1 少ないこと（植木算の考え）に気づかせる。実際に紙テープを 3 回折って広げ、確かめるとよい。
  - part: 離
    kinds: [数, 手数]
    text: 1 日目に 1 円、2 日目に 2 円、3 日目に 4 円、4 日目に 8 円と、毎日、前の日の 2 倍の金額を貯金します。1 日目から 12 日目までに貯金した金額は、合わせて何円ですか。
    answer: 4095
    check: "sum(2 ** k for k in range(12))"
    hints:
      - 12 日目に貯金する金額は、2 の何乗円かな。
      - 1 日目からの合計を、3 日目まで、4 日目まで、と調べてみよう。きまりはあるかな。
      - 合計は、次の日に貯金する金額とくらべると、いつもいくつちがうかな。
    paths:
      - [12 日目は 2¹¹ = 2048 円, 1、2、4、…、2048 の 12 こを順に足す, 4095 円]
      - [合計は 1、3、7、15、… で 次の日の金額より 1 少ない, 13 日目の金額は 2¹² = 4096 円, 合計は 4096 − 1 = 4095 円]
    note: 2¹¹ や 2¹² の値を、2 を順にかけて正しく出せるか（4 けたの計算）がまず要る。12 こを足すのは手間がかかるので、合計が「次の日の金額 − 1」になるきまりに気づくと速い。何日目が 2 の何乗かを 1 つずらして間ちがえやすい。
