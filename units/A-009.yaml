        explain: 例：「3² は 3 を 2 回かけた数で、3 × 3 = 9。3 × 2 は 3 を 2 回足した数で、3 + 3 = 6。どちらも 3 と 2 を使うが、3² はかける回数、3 × 2 は足す回数を表しているので、ちがう数になる。」と書ければよい。「かける回数」と「足す回数」のちがいが書けているかを見る。
        hints:
