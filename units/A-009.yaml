      - part: わけ
        text: 3² × 3⁴ は 3⁶ になります。そのわけを、かけ算の式を書きならべて、文で書きましょう。
        explain: 例：「3² は 3 を 2 回、3⁴ は 3 を 4 回かけた数。3² × 3⁴ = (3 × 3) × (3 × 3 × 3 × 3) で、3 を 2 + 4 = 6 回かけている。だから 3⁶。」と書ければよい。かけ算の式を書きならべて 3 の数を数えていることと、「回数を足す」ことが書けているかを見る。ほかの数（5² × 5³ = 5⁵ など）でも同じように言えると話せれば、なおよい。
