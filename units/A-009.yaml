        explain: 例：「(2²)³ は、2² を 3 回かけた 2² × 2² × 2² のこと。2 を 2 回かけたものを、さらに 3 回かけるので、2 を 2 × 3 = 6 回かける。だから 2⁶。指数を足して 2⁵ になるのは 2² × 2³ のとき。」と書ければよい。(2²)³ を 2² × 2² × 2² と書き直せているかを見る。
        hints:
