        text: 2³ × 2⁴ を、2 の累乗で表してみよう。
        explain: 2³ × 2⁴ = (2 × 2 × 2) × (2 × 2 × 2 × 2) で、2 を 3 + 4 = 7 回かけているので 2⁷ です。同じ数の累乗どうしのかけ算は、指数を足します。また (2³)² は 2³ を 2 回かけた 2³ × 2³ なので、2 を 3 × 2 = 6 回かけて 2⁶ です。累乗の累乗は、指数をかけます。(2 × 3)² = (2 × 3) × (2 × 3) は、かける順を入れかえると 2 × 2 × 3 × 3 = 2² × 3² です。
      - part: 思い出す
        text: 2⁴ はいくつですか。
