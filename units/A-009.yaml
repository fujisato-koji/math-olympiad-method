# A-009 累乗と指数法則
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習、わけ、混ぜる、確認）で作った。
#   1 日目：累乗の意味と書き方（2 × 2 × 2 = 2³、2 の 3 乗、指数）、値を求める、倍々にふえる場面。
#   2 日目：指数法則（2³ × 2⁴ = 2⁷、(2³)² = 2⁶、(2 × 5)² = 2² × 5²）と、ある数を 2 の何乗かで表す。
#   3 日目：わけ。4 日目：N-013 と混ぜる。5 日目：確認。
# 前提は N-013（九九）だけ（→ N-007、N-006）。値を計算するのは 100 くらいまで（2⁶ = 64、3⁴ = 81、10² = 100）。
#   九九をこえるかけ算は、同じ数を足して求める（16 × 2 = 16 + 16、27 × 3 = 27 + 27 + 27）。
#   大きな累乗（2¹⁰、10⁵ など）は値を出さず、指数だけを答えさせる（計算しなくても何乗かがわかるのが指数法則のよさ）。
# わり算（N-014）は前提にないので、累乗のわり算（2⁶ ÷ 2² = 2⁴）は扱わない。「2² に 2 を何回かけると 2⁶ になるか」とかけ算で言う。
# 0 乗、負の指数、分数の累乗は扱わない（段 4 から）。(2 × 3)² = 2² × 3² は、九九の「かける順を入れかえても同じ」の範囲で使う。
# 倍々にふえる場面（細胞の分裂、紙を折る）と 10 の累乗は、2 進法（N-025）、計算機のビット、大きな数の表し方（N-070）につながる（D-026）。
# 指数は上つきの数字（2³、10⁴）で書く。答えの鍵盤では上つきが打てないので、「□ 乗」の □ に入る数か、値を打たせる。
# 式を選ぶ問題の check は、選択肢ごとの値を計算して、元の式の値と比べる。指数を答える問題の check は、等しくなる指数を総当たりでさがす。

id: A-009
days:
  - day: 1
    items:
      - part: 見本
        text: 2 × 2 × 2 は、2 を 3 回かけた数です。これを短く書いてみよう。
        explain: 同じ数を何回かかけたものを累乗といいます。2 を 3 回かけた 2 × 2 × 2 は 2³ と書き、「2 の 3 乗」と読みます。右上の小さい 3 は、かける回数で、指数といいます。2³ = 2 × 2 × 2 = 8 です。2 の 2 乗 2² = 2 × 2 = 4 は、2 を 2 回かけた数です。2 × 3（2 を 3 回足した数）とはちがいます。
      - part: 思い出す
        text: 8 × 7 はいくつですか。
        answer: 56
        check: "8 * 7"
        hints:
          - 8 の段の九九を思い出そう。
          - 8 × 6 = 48 から考えてもよいよ。
          - 48 に、あと 8 を足そう。
        paths:
          - [8 の段で 8 × 7 = 56]
          - [8 × 6 = 48, 48 + 8 = 56]
      - part: 思い出す
        text: 4 × 4 はいくつですか。
        answer: 16
        check: "4 * 4"
        hints:
          - 4 の段の九九を思い出そう。
          - 4 × 3 = 12 から考えてもよいよ。
          - 12 に、あと 4 を足そう。
        paths:
          - [4 の段で 4 × 4 = 16]
      - part: 今日
        text: 3 × 3 × 3 × 3 を、累乗で書くとどれですか。
        choices: [3⁴, 4³, 3 × 4]
        answer: 3⁴
        check: "[c for c, v in {'3⁴': 3 ** 4, '4³': 4 ** 3, '3 × 4': 3 * 4}.items() if v == 3 * 3 * 3 * 3][0]"
        hints:
          - かけている数は何かな。
          - その数を、何回かけているかな。
          - かける数を大きく、かける回数を右上に小さく書くよ。
        paths:
          - [3 を 4 回かけている, 3 の右上に 4, 3⁴]
        note: 4³ は 4 を 3 回かけた数（64）で、3⁴（81）とはちがう。どちらがかける数か、どちらが回数かを確かめさせる。
      - part: 今日
        text: 2⁵ はいくつですか。
        answer: 32
        check: "2 ** 5"
        hints:
          - 2⁵ は、2 を何回かけた数かな。
          - 2 × 2 = 4、4 × 2 = 8、… と順にかけていこう。
          - 16 × 2 は、16 + 16 で求められるね。
        paths:
          - [2 × 2 = 4, 4 × 2 = 8, 8 × 2 = 16, 16 × 2 = 32]
        note: 2 × 5 = 10 としやすい。2⁵ は 2 を 5 回かける。
      - part: 今日
        text: 3³ はいくつですか。
        answer: 27
        check: "3 ** 3"
        hints:
          - 3³ は、3 を何回かけた数かな。
          - まず 3 × 3 を計算しよう。
          - その答えに、もう 1 回 3 をかけよう。
        paths:
          - [3 × 3 = 9, 9 × 3 = 27]
      - part: 挑戦
        text: 1 この細胞（さいぼう）が、1 時間ごとに 2 つに分かれます。分かれた細胞も、また 1 時間ごとに 2 つに分かれます。6 時間後には、細胞は何こになりますか。
        figure: "はじめ　🟢\n１時間後　🟢🟢\n２時間後　🟢🟢🟢🟢"
        answer: 64
        check: "2 ** 6"
        hints:
          - 1 時間ごとに、細胞の数は何倍になるかな。
          - 6 時間後までに、2 を何回かけることになるかな。
          - 2⁶ を、2 × 2 = 4、4 × 2 = 8、… と順に計算しよう。
        paths:
          - [1 時間ごとに 2 倍, 6 時間で 2 を 6 回かける, 2⁶ = 64]
          - [2、4、8、16、32、64 と倍にしていく, 64 こ]
        note: 2 × 6 = 12 こと考えやすい。図で 2 時間後が 4 こ（2 × 2）になっていることを確かめさせる。
