        id: "ae5c62725e"
        text: サイコロを 1 回投げて 5 以上の目が出る事象を A、コインを 1 回投げて表が出る事象を B とすると、A と B がともに起こる確率は P(A) × P(B) = 1/3 × 1/2 でした。独立な 2 つの試行で、それぞれの事象がともに起こる確率が確率の積になるわけを、積の法則（C-005）を使ってすじ道を立てて書きましょう。どちらの試行も、どの場合も同じ程度に起こるものとします。
        explain: 例：「1 つ目の試行の場合を M 通り、そのうち A が起こる場合を a 通りとし、2 つ目の試行の場合を N 通り、そのうち B が起こる場合を b 通りとする。2 つの試行はたがいにえいきょうしないので、2 つの結果の組はどれも同じ程度に起こり、組は積の法則で全部で M × N 通りある。A と B がともに起こる組は、A の a 通りのどれにも B の b 通りが組み合わさるので a × b 通りである。よって、ともに起こる確率は (a × b)/(M × N) で、分数のかけ算（N-078）から (a/M) × (b/N) = P(A) × P(B) になる。」と書ければよい。①「M 通り、a 通り…とする」で場合の数を文字で決める、② 積の法則で全部の組と当てはまる組を数える、③ 分数のかけ算と確率の意味で結ぶ、の 3 つを見る。「たがいにえいきょうしない」ことが「どの組も同じ程度に起こる」ことの根もとで、ここが独立の意味であると話す。もどさないくじのように、1 つ目の結果で 2 つ目の場合が変わるときは独立でなく、かけるのは条件付き確率になる（3 日目）ことと比べる。
