      - part: 思い出す
        id: "1d19684ac6"
        text: 40 人に聞くと、自転車を使う人が 25 人、電車を使う人が 18 人、どちらも使わない人が 5 人でした。両方使う人は何人ですか。
        answer: 8
        check: "25 + 18 - (40 - 5)"
        hints:
          - text: ベン図で、どちらも使わない 5 人は円の外です。円の中（少なくとも一方を使う人）は何人でしょう。
