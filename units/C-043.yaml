# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "ea7a54d54e"
    kinds: [道筋]
    text: A と B の 2 人が、A、B、A、B、… の順に 1 回ずつサイコロを投げ、先に 6 の目を出した人の勝ちとします。A が勝つ確率を求めましょう。
    answer: 6/11
    check: "(lambda p: p / (1 - (1 - p) ** 2))(Fraction(1, 6))"
    hints:
      - A が最初の 1 回で勝つ確率と、B が最初の 1 回で勝つ確率を求めよう。
      - text: A と B が 1 回ずつ投げても決まらなければ、図のように、また初めと同じ形にもどるね。
        svg: '<svg viewBox="0 0 320 186" xmlns="http://www.w3.org/2000/svg"><rect x="28" y="70" width="104" height="36" fill="none" rx="8" stroke="currentColor" stroke-width="2"/><text x="80" y="93" font-size="14" text-anchor="middle" fill="currentColor">A が投げる</text><rect x="188" y="70" width="104" height="36" fill="none" rx="8" stroke="currentColor" stroke-width="2"/><text x="240" y="93" font-size="14" text-anchor="middle" fill="currentColor">B が投げる</text><line x1="132" y1="88" x2="177" y2="88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="186,88 177,92.5 177,83.5" fill="currentColor"/><text x="159" y="122" font-size="13" text-anchor="middle" fill="currentColor">6 以外</text><line x1="80" y1="106" x2="80" y2="137" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="80,146 75.5,137 84.5,137" fill="currentColor"/><text x="88" y="132" font-size="14" text-anchor="start" fill="currentColor">6</text><rect x="38" y="148" width="84" height="28" fill="#f3c969" fill-opacity="0.55" rx="6" stroke="currentColor" stroke-width="1.8"/><text x="80" y="167" font-size="14" text-anchor="middle" fill="currentColor">A の勝ち</text><line x1="240" y1="106" x2="240" y2="137" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="240,146 235.5,137 244.5,137" fill="currentColor"/><text x="248" y="132" font-size="14" text-anchor="start" fill="currentColor">6</text><rect x="198" y="148" width="84" height="28" fill="#7fc8f8" fill-opacity="0.55" rx="6" stroke="currentColor" stroke-width="1.8"/><text x="240" y="167" font-size="14" text-anchor="middle" fill="currentColor">B の勝ち</text><path d="M240 68Q160 6 86 64" fill="none" stroke="#d9534f" stroke-width="2.5" stroke-linejoin="round"/><polygon points="84,66 88.5,57.1 93.8,63.8" fill="#d9534f"/><text x="160" y="26" font-size="13" text-anchor="middle" fill="#d9534f">6 以外 → はじめと同じ形にもどる</text></svg>'
      - 最初の 1 組で決まるときの A と B の確率の比が、最後に勝つ確率の比になるよ。
    paths:
      - [最初の 1 組で A が勝つ確率は 1/6、B が勝つ確率は 5/6 × 1/6 = 5/36, "決まらなければ同じ形にもどるので、勝つ確率の比は 1/6 : 5/36 = 6 : 5", A が勝つ確率は 6/11]
      - [1 組の 2 回の出方を 36 通りで考える, A が勝つのは 6 通り、B が勝つのは 5 × 1 = 5 通り、決まらないのは 25 通り, 決まる 11 通りの中では A が 6 通りなので 6/11]
    note: 何回目で決まるかに限りがないので、全部の場合をたすことはできない（等比数列の和は A-022）。「決まらなければ初めにもどる」と見て、比（A-005）で分けるのが要点。先に投げる A のほうが少し有利になることにもふれる。
  - part: 離
    id: "d410e9c63e"
    kinds: [総動員]
    uses: [C-014]
    text: コインを 6 回投げたところ、表はちょうど 3 回でした。このとき、表が 2 回以上続けて出ている所がある確率を求めましょう。
    answer: 4/5
    check: "(lambda S: Fraction(sum(1 for t in S if any(t[i] == t[i + 1] == 1 for i in range(5))), len(S)))(set(t for t in itertools.product((0, 1), repeat=6) if sum(t) == 3))"
    hints:
