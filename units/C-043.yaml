      - part: わけ
        id: "94bccd834c"
        text: 3 日目の表で、選んだ人が自転車通学だったときに女子である条件付き確率は 8/20 でした。どの場合も同じ程度に起こる試行で、P(B | A) = P(A ∩ B) ÷ P(A) と、乗法定理 P(A ∩ B) = P(A) × P(B | A) が成り立つわけを、すじ道を立てて書きましょう。
        explain: 例：「起こりうる場合が N 通りあり、どれも同じ程度に起こるとする。A が起こったとわかると、起こりうる場合は A の n(A) 通りにしぼられ、それらはやはり同じ程度に起こる。そのうち B も起こるのは A ∩ B の n(A ∩ B) 通りなので、P(B | A) = n(A ∩ B)/n(A) である。分数の分子と分母を同じ数 N でわっても大きさは変わらないので、n(A ∩ B)/n(A) = (n(A ∩ B) ÷ N) ÷ (n(A) ÷ N) = P(A ∩ B) ÷ P(A) である。この式の両辺に P(A) をかけると、P(A ∩ B) = P(A) × P(B | A) になる。」と書ければよい。①「場合が N 通りとする」で場合の数を決める、② A が起こったときに場合が n(A) 通りにしぼられることを書く、③ 分数の性質（分子と分母を同じ数でわる）と確率の意味で結ぶ、の 3 つを見る。表の 8/20 を確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。くじを続けて引くときの 2/5 × 1/4（3 日目の見本）は、乗法定理の P(A) と P(B | A) にあたることにふれる。
        hints:
          - text: A が起こったとわかると、右の図のように A の中だけを考えればよくなります。起こりうる場合は何通りにしぼられるでしょう。
