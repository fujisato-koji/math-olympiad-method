    items:
      - part: 見本
        id: "2443b7aa7a"
        text: サイコロ 1 個とコイン 1 まいを投げます。サイコロで 5 以上の目が出て、しかもコインが表になる確率を求めてみましょう。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><text x="180" y="16" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.8">サイコロの目</text><rect x="14" y="26" width="280" height="28" fill="#c8ccd6" fill-opacity="0.45" stroke="none"/><rect x="218" y="26" width="76" height="84" fill="#f3c969" fill-opacity="0.55" stroke="none"/><rect x="14" y="54" width="280" height="28" fill="#7fc8f8" fill-opacity="0.5" stroke="none"/><rect x="14" y="26" width="280" height="84" fill="none" stroke="currentColor" stroke-width="2"/><line x1="14" y1="54" x2="294" y2="54" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="14" y1="82" x2="294" y2="82" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="66" y1="26" x2="66" y2="110" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="85" y="45" font-size="14" text-anchor="middle" fill="currentColor">1</text><line x1="104" y1="26" x2="104" y2="110" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="123" y="45" font-size="14" text-anchor="middle" fill="currentColor">2</text><line x1="142" y1="26" x2="142" y2="110" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="161" y="45" font-size="14" text-anchor="middle" fill="currentColor">3</text><line x1="180" y1="26" x2="180" y2="110" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="199" y="45" font-size="14" text-anchor="middle" fill="currentColor">4</text><line x1="218" y1="26" x2="218" y2="110" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="237" y="45" font-size="14" text-anchor="middle" fill="currentColor">5</text><line x1="256" y1="26" x2="256" y2="110" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="275" y="45" font-size="14" text-anchor="middle" fill="currentColor">6</text><text x="40" y="45" font-size="13" text-anchor="middle" fill="currentColor">コイン</text><text x="40" y="73" font-size="14" text-anchor="middle" fill="currentColor">表</text><text x="40" y="101" font-size="14" text-anchor="middle" fill="currentColor">うら</text><text x="237" y="74" font-size="17" text-anchor="middle" fill="#d9534f" font-weight="bold">○</text><text x="275" y="74" font-size="17" text-anchor="middle" fill="#d9534f" font-weight="bold">○</text><rect x="18" y="124" width="16" height="16" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="42" y="137" font-size="14" text-anchor="start" fill="currentColor">5 以上：6 列のうち 2 列 → 1/3</text><rect x="18" y="148" width="16" height="16" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="42" y="161" font-size="14" text-anchor="start" fill="currentColor">表：2 行のうち 1 行 → 1/2</text><text x="26" y="185" font-size="16" text-anchor="middle" fill="#d9534f" font-weight="bold">○</text><text x="42" y="185" font-size="14" text-anchor="start" fill="currentColor">12 マスのうち 2 マス = 1/3 × 1/2</text></svg>'
        explain: サイコロの目とコインの表うらの組は 6 × 2 = 12 通りで、どれも同じ程度に起こります。当てはまるのは表の ○ の 2 通りなので、確率は 2/12 = 1/6 です。これは、サイコロで 5 以上が出る確率 1/3 と、コインが表になる確率 1/2 の積 1/3 × 1/2 = 1/6 と同じです。図では、黄色の列（6 列のうち 2 列）と青の行（2 行のうち 1 行）の重なりが ○ のマスです。サイコロの結果とコインの結果のように、2 つの試行の結果がたがいにえいきょうしないとき、2 つの試行は独立であるといいます。独立な試行で、一方で A が起こり、他方で B が起こる確率は、P(A) × P(B) です（わけは 4 日目）。3 つ以上の独立な試行でも、確率をかけ合わせます。また、「少なくとも 1 回起こる」確率は、余事象「1 回も起こらない」を使って 1 − (1 回も起こらない確率) で求めると楽です。
