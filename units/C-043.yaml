        check: "Fraction(sum(1 for a in range(1, 7) for b in range(1, 7) if (a + b) % 5 == 0 or a == b), 36)"
        hints:
          - 和が 5 と 10 になる場合を数えましょう。
          - 2 つの目が同じになる場合と、重なる場合はあるでしょうか。
          - 加法定理を使いましょう。
        paths:
          - ["和が 5 の倍数は 4 + 3 = 7 通り、目が同じは 6 通り", "\"両方は (5, 5) の 1 通り\"", "(7 + 6 − 1)/36 = 12/36 = 1/3"]
      - part: 今日
        text: 硬貨を 5 回投げます。少なくとも 1 回は裏が出る確率を求めましょう。
        answer: 31/32
        check: "Fraction(sum(1 for t in itertools.product((0, 1), repeat=5) if 0 in t), 32)"
        hints:
