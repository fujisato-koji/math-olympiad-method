ty="0.35">30</text><text x="49" y="113" font-size="13" text-anchor="middle" fill="currentColor">計</text><text x="121" y="113" font-size="13" text-anchor="middle" fill="currentColor">21</text><text x="203" y="113" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">39</text><text x="273" y="113" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">60</text></svg>'
