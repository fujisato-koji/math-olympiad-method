      - part: 挑戦
        id: "0534173e57"
        text: 2 つの事象 A、B について、P(A) = 1/2、P(B) = 2/3、P(A ∪ B) = 5/6 です。P(A ∩ B) を求めましょう。
        answer: 1/3
        check: "Fraction(1, 2) + Fraction(2, 3) - Fraction(5, 6)"
        hints:
          - text: ベン図で、2 つの円を合わせた色の所が A ∪ B、重なり（?）が A ∩ B です。
            svg: '<svg viewBox="0 0 320 224" xmlns="http://www.w3.org/2000/svg"><path d="M160 58.8A62 62 0 1 1 160 161.2A62 62 0 1 1 160 58.8Z" fill="#f3c969" fill-opacity="0.4" stroke="none"/><rect x="10" y="10" width="300" height="180" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="125" cy="110" r="62" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="195" cy="110" r="62" fill="none" stroke="currentColor" stroke-width="2"/><text x="107" y="39" font-size="14" text-anchor="middle" fill="currentColor">P(A) = 1/2</text><text x="213" y="39" font-size="14" text-anchor="middle" fill="currentColor">P(B) = 2/3</text><text x="160" y="116" font-size="20" text-anchor="middle" fill="#d9534f" font-weight="bold">?</text><text x="160" y="214" font-size="14" text-anchor="middle" fill="currentColor">色の所 A ∪ B は 5/6</text></svg>'
          - 加法定理 P(A ∪ B) = P(A) + P(B) − P(A ∩ B) で、わかっていない確率はどれでしょう。
          - 式を、P(A ∩ B) について解きましょう。
        paths:
          - [5/6 = 1/2 + 2/3 − P(A ∩ B), P(A ∩ B) = 7/6 − 5/6 = 1/3]
          - [P(A) + P(B) = 7/6 は 1 をこえる, 2 つの円をたすと重なりを 2 回数える, 重なりは 7/6 − 5/6 = 2/6 = 1/3]
        note: P(A) + P(B) が 1 をこえるので、A と B は排反ではありえない。ベン図にかいて重なりの大きさを確かめさせるとよい。

