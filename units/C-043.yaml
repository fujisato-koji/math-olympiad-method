# C-043 確率の計算（排反と独立、条件付き確率、樹形図・2 元表・ベン図）
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり（1 日の組は 思い出す 2・今日 2・挑戦 1、わけの深さは ③）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）に次のねらいを当てた。
#   1 日目：事象、n(A) と P(A)、A ∩ B（A かつ B）と A ∪ B（A または B）、加法定理、排反、余事象（ベン図）。
#   2 日目：独立な試行（頭に見本）。確率の積、「少なくとも 1 回」は余事象、3 回のうち 2 回のような場合を並べて数える。
#   3 日目：条件付き確率と乗法定理（頭に見本、2 元表）。もどさないくじ。P(B | A) ＝ P(B) のとき A と B は独立。
#   4 日目：わけ（3 問とも ③：加法定理、独立な試行の積、条件付き確率の式と乗法定理）。
#   5 日目：C-011、C-008 と混ぜる（検査の陽性と原因の確率、樹形図、事象の独立、くじを引く順番）。6 日目：確認。
# 書き方：教科書の P_A(B) は画面で添え字にならないので、条件付き確率は P(B | A) と書き、「A が起こったときに B が起こる確率」と読む。
#   余事象は上線が画面に出ないので「A でない」と書く。A ∩ B と A ∪ B は、記号と言葉（かつ、または）をそえる。
# 前提は C-011 と C-008（たどると C-007、C-005、A-005、N-078 など）。文字と式（A-010）は前提のたどりにないので、
#   文字は事象の名前（A、B）と、わけの例の場合の数（N 通り、a 通り）だけにし、式の変形は分数の計算（N-078）で言う。
#   3 つの集まりの重なり（包除原理、C-021）は出さない。反復試行は 3 回までを場合を並べて数えるだけにし、
#   一般の式（n 回のうち k 回）と二項分布は S-041 にゆずる。期待値（C-020）は前提にないので使わない。
#   確率は、どの場合も同じ程度に起こる試行（場合の数の比）で定め、わけもその範囲で示す。
# 答えは約分した分数。百分率で聞く問題だけ % の前の数（小数）を答える。独立かどうかを問う問題は choices。
# check は、itertools.product（独立な試行）、combinations（同時に取り出す）、permutations（もどさずに順に引く）で
#   全部の場合を作って数える。条件付き確率は、条件の場合だけを数えた分母で確かめる。確率が与えられた問題は、
#   その確率になる玉の数の模型（たとえば 3/5 なら 5 個のうち 3 個）で数えるか、確率の計算そのものを書く。
# 検査の陽性と病気の問題の数は作り話（実在の検査の数ではない）。
# 条件付き確率は、ベイズ推論（S-022）、疫学（I-035）、因果推論（S-042）、確率空間（S-001）の入口になる（D-026）。
# 図（D-129〜D-131）：見本と答える問題に、ベン図、36 マスの表、樹形図、面積図、くじとふくろの絵を付けた。
#   玉とくじの数は図だけに書き、図を数えて答える。ヒントの図は、見るところに色をぬるか ? を書いて、答えの手前までを見せる。
#   赤い印のくじが当たり。玉は色の字（赤、白、青）を中に書き、色が見えなくてもわかるようにした。

id: C-043
days:
  - day: 1
    items:
      - part: 見本
        id: "a0ef5e044c"
        text: 1 から 20 までの数を 1 つずつ書いた 20 まいのカードから、よくまぜて 1 まい引きます。2 の《倍数》を引く事象を A、3 の倍数を引く事象を B とします。図の色の所が「A または B」です。その確率を求めてみましょう。
        svg: '<svg viewBox="0 0 320 224" xmlns="http://www.w3.org/2000/svg"><circle cx="125" cy="110" r="62" fill="#f3c969" fill-opacity="0.45" stroke="none"/><circle cx="195" cy="110" r="62" fill="#7fc8f8" fill-opacity="0.45" stroke="none"/><rect x="10" y="10" width="300" height="180" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="125" cy="110" r="62" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="195" cy="110" r="62" fill="none" stroke="currentColor" stroke-width="2"/><text x="107" y="39" font-size="14" text-anchor="middle" fill="currentColor">A（2 の倍数）</text><text x="213" y="39" font-size="14" text-anchor="middle" fill="currentColor">B（3 の倍数）</text><text x="17" y="181" font-size="13" text-anchor="start" fill="currentColor">1〜20 のカード</text><text x="85" y="84" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="108" y="84" font-size="14" text-anchor="middle" fill="currentColor">4</text><text x="85" y="106" font-size="14" text-anchor="middle" fill="currentColor">8</text><text x="108" y="106" font-size="14" text-anchor="middle" fill="currentColor">10</text><text x="85" y="128" font-size="14" text-anchor="middle" fill="currentColor">14</text><text x="108" y="128" font-size="14" text-anchor="middle" fill="currentColor">16</text><text x="96" y="150" font-size="14" text-anchor="middle" fill="currentColor">20</text><text x="160" y="92" font-size="14" text-anchor="middle" fill="currentColor">6</text><text x="160" y="114" font-size="14" text-anchor="middle" fill="currentColor">12</text><text x="160" y="136" font-size="14" text-anchor="middle" fill="currentColor">18</text><text x="226" y="92" font-size="14" text-anchor="middle" fill="currentColor">3</text><text x="226" y="114" font-size="14" text-anchor="middle" fill="currentColor">9</text><text x="226" y="136" font-size="14" text-anchor="middle" fill="currentColor">15</text><text x="36" y="62" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="36" y="86" font-size="14" text-anchor="middle" fill="currentColor">5</text><text x="36" y="110" font-size="14" text-anchor="middle" fill="currentColor">7</text><text x="36" y="134" font-size="14" text-anchor="middle" fill="currentColor">11</text><text x="286" y="62" font-size="14" text-anchor="middle" fill="currentColor">13</text><text x="286" y="86" font-size="14" text-anchor="middle" fill="currentColor">17</text><text x="286" y="110" font-size="14" text-anchor="middle" fill="currentColor">19</text><text x="160" y="214" font-size="14" text-anchor="middle" fill="currentColor">色の所が A または B：7 + 3 + 3 = 13 まい</text></svg>'
        explain: カードを引くような、やってみるまで結果がわからない行いを試行、その結果として起こることがらを事象といいます。事象 A の起こる場合の数を n(A)、確率を P(A) と書きます。全部で 20 通りがどれも同じ程度に起こるので、P(A) = n(A)/20 = 10/20、P(B) = 6/20 です。A と B がともに起こる事象を「A かつ B」といい A ∩ B と書きます（6 の倍数で、図の重なりの 6、12、18 の 3 まい）。A と B の少なくとも一方が起こる事象を「A または B」といい A ∪ B と書きます。n(A) + n(B) では A ∩ B を 2 回数えるので（C-008）、P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 10/20 + 6/20 − 3/20 = 13/20 です（加法定理）。A と B が同時には起こらないとき、A と B は排反であるといい、P(A ∪ B) = P(A) + P(B) になります。また、「A でない」事象（A の余事象、図の円 A の外）の確率は、P(A でない) = 1 − P(A) です。わけは 4 日目に示します。
