# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: A と B の 2 人が、A、B、A、B、… の順に 1 回ずつサイコロを投げ、先に 6 の目を出した人の勝ちとします。A が勝つ確率を求めましょう。
    answer: 6/11
    check: "(lambda p: p / (1 - (1 - p) ** 2))(Fraction(1, 6))"
    hints:
      - A が最初の 1 回で勝つ確率と、B が最初の 1 回で勝つ確率を求めよう。
      - A と B が 1 回ずつ投げても決まらなければ、また初めと同じ形にもどるね。
      - 最初の 1 組で決まるときの A と B の確率の比が、最後に勝つ確率の比になるよ。
    paths:
      - [最初の 1 組で A が勝つ確率は 1/6、B が勝つ確率は 5/6 × 1/6 = 5/36, "決まらなければ同じ形にもどるので、勝つ確率の比は 1/6 : 5/36 = 6 : 5", A が勝つ確率は 6/11]
    note: 何回目で決まるかに限りがないので、全部の場合をたすことはできない（等比数列の和は A-022）。「決まらなければ初めにもどる」と見て、比（A-005）で分けるのが要点。先に投げる A のほうが少し有利になることにも触れる。
  - part: 離
    kinds: [総動員]
    uses: [C-014]
    text: 硬貨を 6 回投げたところ、表はちょうど 3 回でした。このとき、表が 2 回以上続けて出ている所がある確率を求めましょう。
    answer: 4/5
    check: "(lambda S: Fraction(sum(1 for t in S if any(t[i] == t[i + 1] == 1 for i in range(5))), len(S)))(set(t for t in itertools.product((0, 1), repeat=6) if sum(t) == 3))"
    hints:
      - 表がちょうど 3 回になる並び方は何通りかな。その中で考える条件付き確率だね。
      - 余事象「表が 1 回も続かない」並び方を数えよう。裏 3 回の間と両はしの、表を置ける所は何か所かな。
      - 表を置ける所から 3 か所を選ぶ選び方を数えて、余事象の確率をひこう。
    paths:
      - [表 3 回の並びは 20 通り, 表がとなり合わないのは、裏 3 回の間と両はしの 4 か所から 3 か所を選ぶ 4 通り, 1 − 4/20 = 4/5]
    note: 条件（表がちょうど 3 回）で場合を 20 通りにしぼる条件付き確率、余事象、すき間に置いて数える対応（C-014）の 3 つを合わせる。20 通りを全部書き出して確かめてもよい。
  - part: 離
    kinds: [読み取り, 手数]
    text: ある病気の検査（作り話です）は、病気の人では 90 % が陽性、病気でない人では 10 % が陽性になります。ある町では、2 % の人がこの病気にかかっています。町の人から 1 人を選んで検査を 2 回行ったところ、2 回とも陽性でした。この人が病気である確率を求めましょう。ただし、同じ人の 1 回目と 2 回目の結果は互いに影響しない（独立）ものとします。
    answer: 81/130
    check: "(lambda s, h: s / (s + h))(Fraction(2, 100) * Fraction(9, 10) ** 2, Fraction(98, 100) * Fraction(1, 10) ** 2)"
    hints:
      - 町の人を 10000 人として、病気の人と病気でない人に分けよう。
      - 病気の人が 2 回とも陽性になる確率は、独立な試行の積だね。病気でない人ではどうかな。
      - 2 回とも陽性の人のうち、病気の人の割合を求めよう。
    paths:
      - [10000 人のうち病気は 200 人、病気でない人は 9800 人, 2 回とも陽性は 200 × 81/100 = 162 人と 9800 × 1/100 = 98 人, 162 ÷ (162 + 98) = 81/130]
    note: 1 回だけ陽性のときは、病気である確率は 18/116 = 9/58（およそ 16 %）。2 回とも陽性で、およそ 62 % まで上がる。「病気かどうかが決まっているときの独立」と、条件付き確率を組み合わせる。数は作り話。
