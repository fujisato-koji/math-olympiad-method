        text: どの場合も同じ程度に起こる試行で、2 つの事象 A、B について P(A ∪ B) = P(A) + P(B) − P(A ∩ B) が成り立つわけを、ベン図と場合の数を使って、筋道を立てて書きましょう。また、A と B が排反のときにどうなるかも書きましょう。
        explain: 例：「起こりうる場合が全部で N 通りあり、どれも同じ程度に起こるとする。A ∪ B の場合を数えるとき、n(A) + n(B) では、A と B の両方に入る A ∩ B の場合を 2 回数えているので、n(A ∪ B) = n(A) + n(B) − n(A ∩ B) である（C-008、ベン図）。確率は場合の数を N でわった数なので、この式の両辺を N でわると、P(A ∪ B) = P(A) + P(B) − P(A ∩ B) になる。A と B が排反なら、A ∩ B の場合は 0 通りなので、P(A ∪ B) = P(A) + P(B) である。」と書ければよい。①「場合が N 通りとする」で場合の数を決める、② 重なりを 2 回数えていることから、場合の数の式を立てる、③ 確率の意味（場合の数 ÷ N）と、《分数》のたし算・ひき算で結ぶ、の 3 つがそろっているかを見る。1 日目のカードの例で 13/20 を確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。A と「A でない」は排反で、合わせると全部の場合になるので、P(A) + P(A でない) = 1 になる（余事象の確率）ことにも触れる。
        hints:
          - 起こりうる場合を N 通りとし、A の場合の数を n(A) と書きましょう。
          - n(A) + n(B) では、どの場合を 2 回数えているでしょう。
          - 場合の数の式の両辺を N でわって、確率の式にしましょう。
        paths:
          - [場合が N 通りとする, n(A ∪ B) = n(A) + n(B) − n(A ∩ B), N でわって P(A ∪ B) = P(A) + P(B) − P(A ∩ B), 排反なら n(A ∩ B) = 0]
      - part: わけ
        text: サイコロを 1 回投げて 5 以上の目が出る事象を A、硬貨を 1 回投げて表が出る事象を B とすると、A と B がともに起こる確率は P(A) × P(B) = 1/3 × 1/2 でした。独立な 2 つの試行で、それぞれの事象がともに起こる確率が確率の積になるわけを、積の法則（C-005）を使って筋道を立てて書きましょう。どちらの試行も、どの場合も同じ程度に起こるものとします。
        explain: 例：「1 つ目の試行の場合を M 通り、そのうち A が起こる場合を a 通りとし、2 つ目の試行の場合を N 通り、そのうち B が起こる場合を b 通りとする。2 つの試行は互いに影響しないので、2 つの結果の組はどれも同じ程度に起こり、組は積の法則で全部で M × N 通りある。A と B がともに起こる組は、A の a 通りのどれにも B の b 通りが組み合わさるので a × b 通りである。よって、ともに起こる確率は (a × b)/(M × N) で、分数のかけ算（N-078）から (a/M) × (b/N) = P(A) × P(B) になる。」と書ければよい。①「M 通り、a 通り…とする」で場合の数を文字で決める、② 積の法則で全部の組と当てはまる組を数える、③ 分数のかけ算と確率の意味で結ぶ、の 3 つを見る。「互いに影響しない」ことが「どの組も同じ程度に起こる」ことの根もとで、ここが独立の意味であると話す。もどさないくじのように、1 つ目の結果で 2 つ目の場合が変わるときは独立でなく、かけるのは条件付き確率になる（3 日目）ことと比べる。
        hints:
          - 1 つ目の試行の場合を M 通り、そのうち A が起こる場合を a 通りのように、文字で決めましょう。
          - 2 つの結果の組は全部で何通りでしょう。A と B がともに起こる組は何通りでしょう。
          - 分数のかけ算を使って、確率の積に書きかえましょう。
        paths:
          - [場合を M 通りと N 通り、A と B の場合を a 通りと b 通りとする, 組は M × N 通り、ともに起こるのは a × b 通り, (a × b)/(M × N) = (a/M) × (b/N) = P(A) × P(B)]
      - part: わけ
        text: 3 日目の表で、選んだ人が自転車通学だったときに女子である条件付き確率は 8/20 でした。どの場合も同じ程度に起こる試行で、P(B | A) = P(A ∩ B) ÷ P(A) と、乗法定理 P(A ∩ B) = P(A) × P(B | A) が成り立つわけを、筋道を立てて書きましょう。
        explain: 例：「起こりうる場合が N 通りあり、どれも同じ程度に起こるとする。A が起こったとわかると、起こりうる場合は A の n(A) 通りにしぼられ、それらはやはり同じ程度に起こる。そのうち B も起こるのは A ∩ B の n(A ∩ B) 通りなので、P(B | A) = n(A ∩ B)/n(A) である。分数の分子と分母を同じ数 N でわっても大きさは変わらないので、n(A ∩ B)/n(A) = (n(A ∩ B) ÷ N) ÷ (n(A) ÷ N) = P(A ∩ B) ÷ P(A) である。この式の両辺に P(A) をかけると、P(A ∩ B) = P(A) × P(B | A) になる。」と書ければよい。①「場合が N 通りとする」で場合の数を決める、② A が起こったときに場合が n(A) 通りにしぼられることを書く、③ 分数の性質（分子と分母を同じ数でわる）と確率の意味で結ぶ、の 3 つを見る。表の 8/20 を確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。くじを続けて引くときの 2/5 × 1/4（3 日目の見本）は、乗法定理の P(A) と P(B | A) にあたることに触れる。
        hints:
          - A が起こったとわかると、起こりうる場合は何通りにしぼられるでしょう。
          - そのうち B も起こる場合は何通りでしょう。
          - 分子と分母を N でわって、確率の式に書きかえましょう。
        paths:
          - [場合が N 通りとする, A が起こったとき、場合は n(A) 通りにしぼられる, P(B | A) = n(A ∩ B)/n(A), 分子と分母を N でわって P(A ∩ B) ÷ P(A)]
