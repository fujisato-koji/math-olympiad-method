    text: ある病気の検査（作り話です）は、病気の人では 90 % が陽性、病気でない人では 10 % が陽性になります。ある町では、2 % の人がこの病気にかかっています。町の人から 1 人を選んで検査を 2 回行ったところ、2 回とも陽性でした。この人が病気である確率を求めましょう。ただし、同じ人の 1 回目と 2 回目の結果はたがいにえいきょうしない（独立）ものとします。
    answer: 81/130
    check: "(lambda s, h: s / (s + h))(Fraction(2, 100) * Fraction(9, 10) ** 2, Fraction(98, 100) * Fraction(1, 10) ** 2)"
    hints:
      - text: 町の人を 10000 人として、病気の人と病気でない人に分けよう（図）。
        svg: '<svg viewBox="0 0 360 186" xmlns="http://www.w3.org/2000/svg"><line x1="68" y1="104" x2="124.6" y2="67" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="90.3" y="80.8" font-size="13" text-anchor="middle" fill="currentColor">2 %</text><line x1="211.4" y1="67" x2="249.2" y2="48.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="211.4" y1="67" x2="270" y2="85.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="68" y1="104" x2="101.5" y2="141" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="76.6" y="134.4" font-size="13" text-anchor="middle" fill="currentColor">98 %</text><line x1="234.4" y1="141" x2="249.2" y2="122.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="234.4" y1="141" x2="270" y2="159.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="302" y="53.5" font-size="13" text-anchor="middle" fill="#d9534f">2 回とも陽性 ?</text><text x="302" y="90.5" font-size="13" text-anchor="middle" fill="currentColor">そのほか</text><text x="168" y="72" font-size="13" text-anchor="middle" fill="currentColor">病気 200 人</text><text x="302" y="127.5" font-size="13" text-anchor="middle" fill="#d9534f">2 回とも陽性 ?</text><text x="302" y="164.5" font-size="13" text-anchor="middle" fill="currentColor">そのほか</text><text x="168" y="146" font-size="13" text-anchor="middle" fill="currentColor">病気でない 9800 人</text><text x="34" y="109" font-size="13" text-anchor="middle" fill="currentColor">10000 人</text></svg>'
      - 病気の人が 2 回とも陽性になる確率は、独立な試行の積だね。病気でない人ではどうかな。
      - 2 回とも陽性の人のうち、病気の人のわり合を求めよう。
    paths:
      - [10000 人のうち病気は 200 人、病気でない人は 9800 人, 2 回とも陽性は 200 × 81/100 = 162 人と 9800 × 1/100 = 98 人, 162 ÷ (162 + 98) = 81/130]
      - [P(病気 かつ 2 回陽性) = 2/100 × 81/100, P(病気でない かつ 2 回陽性) = 98/100 × 1/100, "162 : 98 の比で分けて 162/260 = 81/130"]
    note: 1 回だけ陽性のときは、病気である確率は 18/116 = 9/58（およそ 16 %）。2 回とも陽性で、およそ 62 % まで上がる。「病気かどうかが決まっているときの独立」と、条件付き確率を組み合わせる。数は作り話。
