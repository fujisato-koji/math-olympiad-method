="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="250" y="112" font-size="16" text-anchor="middle" fill="currentColor" fill-opacity="0.6">?</text><rect x="38" y="138" width="64" height="44" fill="none" rx="7" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="70" y="166" font-size="16" text-anchor="middle" fill="currentColor" fill-opacity="0.6">?</text><rect x="128" y="138" width="64" height="44" fill="none" rx="7" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="160" y="166" font-size="16" text-anchor="middle" fill="currentColor" fill-opacity="0.6">?</text><rect x="218" y="138" width="64" height="44" fill="none" rx="7" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="250" y="166" font-size="16" text-anchor="middle" fill="currentColor" fill-opacity="0.6">?</text></svg>'
          - それぞれの確率を、独立な試行の積で求めてたしましょう。
        paths:
          - [3 勝は (2/3)³ = 8/27, ちょうど 2 勝は 3 × (2/3) × (2/3) × (1/3) = 12/27, 8/27 + 12/27 = 20/27]
          - [1 試合を 3 通りの同じ程度の場合（2 通りが勝ち）と考える, 3 試合で 27 通りのうち 2 勝以上は 8 + 3 × 4 = 20 通り, 20/27]

  - day: 3
    items:
      - part: 見本
        id: "07b705cae0"
        text: ある学年の 40 人の通学方法を、男女別に表にしました。40 人から 1 人を選ぶとき、選んだ人が自転車通学だとわかったとして、その人が女子である確率を求めてみましょう。
        svg: '<svg viewBox="0 0 320 184" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="10" width="260" height="28" fill="#c8ccd6" fill-opacity="0.45" stroke="none"/><rect x="92" y="10" width="76" height="112" fill="#f3c969" fill-opacity="0.55" stroke="none"/><rect x="30" y="10" width="260" height="112" fill="none" stroke="currentColor" stroke-width="2"/><line x1="30" y1="38" x2="290" y2="38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="30" y1="66" x2="290" y2="66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="30" y1="94" x2="290" y2="94" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="92" y1="10" x2="92" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="168" y1="10" x2="168" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="234" y1="10" x2="234" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="130" y="29" font-size="13" text-anchor="middle" fill="currentColor">自転車</text><text x="201" y="29" font-size="13" text-anchor="middle" fill="currentColor">徒歩</text><text x="262" y="29" font-size="13" text-anchor="middle" fill="currentColor">計</text><text x="61" y="57" font-size="13" text-anchor="middle" fill="currentColor">男子</text><text x="130" y="57" font-size="13" text-anchor="middle" fill="currentColor">12</text><text x="201" y="57" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">10</text><text x="262" y="57" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">22</text><text x="61" y="85" font-size="13" text-anchor="middle" fill="currentColor">女子</text><text x="130" y="85" font-size="13" text-anchor="middle" fill="currentColor">8</text><text x="201" y="85" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">10</text><text x="262" y="85" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">18</text><text x="61" y="113" font-size="13" text-anchor="middle" fill="currentColor">計</text><text x="130" y="113" font-size="13" text-anchor="middle" fill="currentColor">20</text><text x="201" y="113" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">20</text><text x="262" y="113" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.35">40</text><rect x="96" y="69" width="68" height="22" fill="none" rx="8" stroke="#d9534f" stroke-width="2.5"/><text x="160" y="150" font-size="14" text-anchor="middle" fill="currentColor">自転車の 20 人にしぼると、女子は 8 人</text><text x="160" y="174" font-size="14" text-anchor="middle" fill="currentColor">P(女子 | 自転車) = 8/20 = 2/5</text></svg>'
        explain: 自転車通学の 20 人（図の色の列）にしぼると、そのうち女子は 8 人なので、求める確率は 8/20 = 2/5 です。自転車通学である事象を A、女子である事象を B とすると、これは「A が起こったときに B が起こる確率」で、A が起こったときの B の条件付き確率といい、P(B | A) と書きます（教科書では P_A(B) とも書きます）。P(B | A) = n(A ∩ B)/n(A) = 8/20 です。分子と分母を全体の 40 でわると、P(B | A) = P(A ∩ B) ÷ P(A) = (8/40) ÷ (20/40) とも書けます。この式から、P(A ∩ B) = P(A) × P(B | A)（乗法定理）が成り立ちます。たとえば、当たり 2 本をふくむ 5 本のくじを、A さん、B さんの順に 1 本ずつ引く（もどさない）とき、2 人とも当たる確率は、2/5 × 1/4 = 1/10 です。B さんが引くときは、残り 4 本のうち当たりが 1 本だからです。なお、P(B | A) = P(B) のとき、A が起こっても B の起こりやすさは変わらず、事象 A と B は独立であるといいます。わけは 4 日目に示します。
      - part: 思い出す
        id: "38beea5ae5"
        text: A さんがある的に当てる確率は 4/5、B さんが当てる確率は 1/2 で、2 人の結果はたがいにえいきょうしません。2 人が 1 回ずつ投げるとき、少なくとも 1 人が当てる確率を求めましょう。
        answer: 9/10
        check: "Fraction(sum(1 for a in range(5) for b in range(2) if a < 4 or b < 1), 10)"
        hints:
          - 余事象は「2 人とも外す」です。
          - text: 図で、A さんが外す所（横はばの 1/5）と B さんが外す所（高さの 1/2）の重なり（赤いわく）が、2 人とも外す場合です。その大きさを、独立な試行の積で求めましょう。
            svg: '<svg viewBox="0 0 320 174" xmlns="http://www.w3.org/2000/svg"><rect x="256" y="40" width="40" height="124" fill="#c8ccd6" fill-opacity="0.8" stroke="none"/><rect x="96" y="102" width="200" height="62" fill="#c8ccd6" fill-opacity="0.8" stroke="none"/><rect x="96" y="40" width="200" height="124" fill="none" stroke="currentColor" stroke-width="2"/><line x1="256" y1="40" x2="256" y2="164" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="96" y1="102" x2="296" y2="102" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="256" y="102" width="40" height="62" fill="none" stroke="#d9534f" stroke-width="3"/><text x="196" y="14" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.75">A さん</text><text x="176" y="32" font-size="13" text-anchor="middle" fill="currentColor">当てる 4/5</text><text x="276" y="32" font-size="13" text-anchor="middle" fill="currentColor">外す 1/5</text><text x="24" y="90.5" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.75">B</text><text x="24" y="106.5" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.75">さ</text><text x="24" y="122.5" font-size="13" text-anchor="middle" fill="currentColor" fill-opacity="0.75">ん</text><text x="88" y="69" font-size="13" text-anchor="end" fill="currentColor">当てる</text><text x="88" y="86" font-size="13" text-anchor="end" fill="currentColor">1/2</text><text x="88" y="131" font-size="13" text-anchor="end" fill="currentColor">外す</text><text x="88" y="148" font-size="13" text-anchor="end" fill="currentColor">1/2</text></svg>'
          - 1 からひきましょう。
        paths:
          - [2 人とも外す確率は 1/5 × 1/2 = 1/10, 1 − 1/10 = 9/10]
      - part: 思い出す
        id: "40a1f09f42"
        text: 30 人に聞くと、犬を飼っている人が 12 人、ねこを飼っている人が 9 人、両方飼っている人が 4 人でした。どちらも飼っていない人は何人ですか。
        answer: 13
        check: "30 - len(set(range(12)) | set(range(8, 17)))"
        hints:
          - text: ベン図で、犬の円は 12 人、ねこの円は 9 人、重なりは 4 人です。2 つの円を合わせた所は何人でしょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="125" cy="110" r="62" fill="#f3c969" fill-opacity="0.4" stroke="none"/><circle cx="195" cy="110" r="62" fill="#7fc8f8" fill-opacity="0.4" stroke="none"/><rect x="10" y="10" width="300" height="180" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="125" cy="110" r="62" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="195" cy="110" r="62" fill="none" stroke="currentColor" stroke-width="2"/><text x="107" y="39" font-size="14" text-anchor="middle" fill="currentColor">犬（12 人）</text><text x="213" y="39" font-size="14" text-anchor="middle" fill="currentColor">ねこ（9 人）</text><text x="17" y="181" font-size="13" text-anchor="start" fill="currentColor">30 人</text><text x="160" y="115" font-size="14" text-anchor="middle" fill="currentColor">4 人</text><text x="284" y="178" font-size="20" text-anchor="middle" fill="#d9534f" font-weight="bold">?</text></svg>'
          - 両方飼っている人を 2 回数えないように、ひきましょう。
          - 円の外（?）は、全体の 30 人から円の中の人数をひいた数です。
        paths:
          - [どちらかを飼っているのは 12 + 9 − 4 = 17 人, 30 − 17 = 13]
