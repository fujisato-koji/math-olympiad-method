# C-043 確率の計算（排反と独立、条件付き確率、樹形図・2 元表・ベン図）
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり（1 日の組は 思い出す 2・今日 2・挑戦 1、わけの深さは ③）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）に次のねらいを当てた。
#   1 日目：事象、n(A) と P(A)、A ∩ B（A かつ B）と A ∪ B（A または B）、加法定理、排反、余事象（ベン図）。
#   2 日目：独立な試行（頭に見本）。確率の積、「少なくとも 1 回」は余事象、3 回のうち 2 回のような場合を並べて数える。
#   3 日目：条件付き確率と乗法定理（頭に見本、2 元表）。もどさないくじ。P(B | A) ＝ P(B) のとき A と B は独立。
#   4 日目：わけ（3 問とも ③：加法定理、独立な試行の積、条件付き確率の式と乗法定理）。
#   5 日目：C-011、C-008 と混ぜる（検査の陽性と原因の確率、樹形図、事象の独立、くじを引く順番）。6 日目：確認。
# 書き方：教科書の P_A(B) は画面で添え字にならないので、条件付き確率は P(B | A) と書き、「A が起こったときに B が起こる確率」と読む。
#   余事象は上線が画面に出ないので「A でない」と書く。A ∩ B と A ∪ B は、記号と言葉（かつ、または）をそえる。
# 前提は C-011 と C-008（たどると C-007、C-005、A-005、N-078 など）。文字と式（A-010）は前提のたどりにないので、
#   文字は事象の名前（A、B）と、わけの例の場合の数（N 通り、a 通り）だけにし、式の変形は分数の計算（N-078）で言う。
#   3 つの集まりの重なり（包除原理、C-021）は出さない。反復試行は 3 回までを場合を並べて数えるだけにし、
#   一般の式（n 回のうち k 回）と二項分布は S-041 にゆずる。期待値（C-020）は前提にないので使わない。
#   確率は、どの場合も同じ程度に起こる試行（場合の数の比）で定め、わけもその範囲で示す。
# 答えは約分した分数。百分率で聞く問題だけ % の前の数（小数）を答える。独立かどうかを問う問題は choices。
# check は、itertools.product（独立な試行）、combinations（同時に取り出す）、permutations（もどさずに順に引く）で
#   全部の場合を作って数える。条件付き確率は、条件の場合だけを数えた分母で確かめる。確率が与えられた問題は、
#   その確率になる玉の数の模型（たとえば 3/5 なら 5 個のうち 3 個）で数えるか、確率の計算そのものを書く。
# 検査の陽性と病気の問題の数は作り話（実在の検査の数ではない）。
# 条件付き確率は、ベイズ推論（S-022）、疫学（I-035）、因果推論（S-042）、確率空間（S-001）の入口になる（D-026）。

id: C-043
days:
  - day: 1
    items:
      - part: 見本
        text: 1 から 20 までの数を 1 つずつ書いた 20 枚のカードから、よくまぜて 1 枚引きます。2 の《倍数》を引く事象を A、3 の倍数を引く事象を B とします。A または B が起こる確率を求めてみましょう。
        svg: |
          <svg viewBox="0 0 280 192" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="264" height="176" stroke="currentColor" fill="none" stroke-width="2"/>
            <text x="16" y="174" font-size="12">1〜20 のカード</text>
            <circle cx="108" cy="104" r="52" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <circle cx="172" cy="104" r="52" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <text x="78" y="46" font-size="13" text-anchor="middle">A（2 の倍数）</text>
            <text x="202" y="46" font-size="13" text-anchor="middle">B（3 の倍数）</text>
            <text x="82" y="109" font-size="14" text-anchor="middle">7 枚</text>
            <text x="140" y="109" font-size="14" text-anchor="middle">3 枚</text>
            <text x="198" y="109" font-size="14" text-anchor="middle">3 枚</text>
            <text x="260" y="174" font-size="14" text-anchor="end">7 枚</text>
          </svg>
        explain: カードを引くような、結果が偶然に決まる行いを試行、その結果として起こることがらを事象といいます。事象 A の起こる場合の数を n(A)、確率を P(A) と書きます。全部で 20 通りがどれも同じ程度に起こるので、P(A) = n(A)/20 = 10/20、P(B) = 6/20 です。A と B がともに起こる事象を「A かつ B」といい A ∩ B と書きます（6 の倍数で、6、12、18 の 3 枚）。A と B の少なくとも一方が起こる事象を「A または B」といい A ∪ B と書きます。n(A) + n(B) では A ∩ B を 2 回数えるので（C-008）、P(A ∪ B) = P(A) + P(B) − P(A ∩ B) = 10/20 + 6/20 − 3/20 = 13/20 です（加法定理）。A と B が同時には起こらないとき、A と B は排反であるといい、P(A ∪ B) = P(A) + P(B) になります。また、「A でない」事象（A の余事象）の確率は、P(A でない) = 1 − P(A) です。わけは 4 日目に示します。
      - part: 思い出す
        text: 1 から 60 までの《整数》のうち、4 の倍数か 6 の倍数の少なくとも一方であるものは何個ありますか。
        answer: 20
        check: "sum(1 for n in range(1, 61) if n % 4 == 0 or n % 6 == 0)"
        hints:
          - 4 の倍数と 6 の倍数の個数を、それぞれ数えましょう。
          - 両方に入る数は、何の倍数でしょう。
          - 重なりを 2 回数えないように、ひきましょう。
        paths:
          - [4 の倍数は 15 個、6 の倍数は 10 個, 両方は 12 の倍数で 5 個, 15 + 10 − 5 = 20]
      - part: 思い出す
        text: 大小 2 つのサイコロを同時に投げます。少なくとも一方の目が 6 になる確率を求めましょう。
        answer: 11/36
        check: "Fraction(sum(1 for a in range(1, 7) for b in range(1, 7) if a == 6 or b == 6), 36)"
        hints:
          - 36 通りの表で、6 が入る場合を数えましょう。
          - 大きいほうが 6 の場合と、小さいほうが 6 の場合が重なる所に気をつけましょう。
          - どちらも 6 でない場合を数えて、全体からひいてもよいです。
        paths:
          - [どちらも 6 でないのは 5 × 5 = 25 通り, 36 − 25 = 11 通り, 11/36]
      - part: 今日
        text: 1 から 30 までの数を 1 つずつ書いた 30 枚のカードから、よくまぜて 1 枚引きます。3 の倍数または 5 の倍数を引く確率を求めましょう。
        answer: 7/15
        check: "Fraction(sum(1 for n in range(1, 31) if n % 3 == 0 or n % 5 == 0), 30)"
        hints:
          - 3 の倍数を引く事象を A、5 の倍数を引く事象を B としましょう。
          - A ∩ B は何の倍数を引く事象でしょう。
          - P(A ∪ B) = P(A) + P(B) − P(A ∩ B) を使いましょう。
        paths:
          - [P(A) = 10/30、P(B) = 6/30, P(A ∩ B) = 2/30（15 の倍数）, 10/30 + 6/30 − 2/30 = 14/30 = 7/15]
      - part: 今日
        text: 袋に赤玉が 4 個、白玉が 3 個、青玉が 2 個入っています。よくまぜて同時に 2 個取り出すとき、2 個が同じ色になる確率を求めましょう。
        answer: 5/18
        check: "Fraction(sum(1 for c in itertools.combinations('赤赤赤赤白白白青青', 2) if c[0] == c[1]), math.comb(9, 2))"
        hints:
          - 「2 個とも赤」「2 個とも白」「2 個とも青」は、同時には起こりません（排反）。
          - それぞれの確率を、組合せで数えて求めましょう。
          - 排反な事象の確率は、たし合わせます。
        paths:
          - [取り出し方は 36 通り, 2 個とも赤は 6 通り、白は 3 通り、青は 1 通り, 6/36 + 3/36 + 1/36 = 10/36 = 5/18]
      - part: 挑戦
        text: ある学年の生徒から 1 人を選びます。運動部に入っている確率は 1/2、塾に通っている確率は 1/3、運動部に入っていて塾にも通っている確率は 1/12 です。運動部に入っておらず、塾にも通っていない確率を求めましょう。
        answer: 1/4
        check: "Fraction(sum(1 for i in range(12) if not i < 6 and not 5 <= i < 9), 12)"
        hints:
          - 「運動部または塾」の確率を、加法定理で求めましょう。
          - 「どちらでもない」は、「運動部または塾」の余事象です。
          - 1 からひきましょう。
        paths:
          - [運動部または塾の確率は 1/2 + 1/3 − 1/12 = 3/4, どちらでもない確率は 1 − 3/4 = 1/4]
          - [12 人と考えると、運動部 6 人、塾 4 人、両方 1 人, どちらかに入るのは 9 人, どちらでもないのは 3 人で 3/12 = 1/4]
    extra:
      - part: 今日
        text: 1 から 100 までの数を 1 つずつ書いた 100 枚のカードから、よくまぜて 1 枚引きます。4 の倍数でも 6 の倍数でもないカードを引く確率を求めましょう。
        answer: 67/100
        check: "Fraction(sum(1 for n in range(1, 101) if n % 4 != 0 and n % 6 != 0), 100)"
        hints:
          - まず、4 の倍数または 6 の倍数を引く確率を求めましょう。
          - 両方に入るのは 12 の倍数です。
          - 余事象の確率は、1 からひいて求めます。
        paths:
          - [4 の倍数 25 枚、6 の倍数 16 枚、12 の倍数 8 枚, 4 か 6 の倍数は 25 + 16 − 8 = 33 枚, 1 − 33/100 = 67/100]
      - part: 今日
        text: 大小 2 つのサイコロを同時に投げます。目の和が 4 になるか、または 2 つの目が同じになる確率を求めましょう。
        answer: 2/9
        check: "Fraction(sum(1 for a in range(1, 7) for b in range(1, 7) if a + b == 4 or a == b), 36)"
        hints:
          - 和が 4 になる場合と、目が同じになる場合を、それぞれ数えましょう。
          - 両方に当てはまる場合はあるでしょうか。
          - 重なりをひいてから、36 でわりましょう。
        paths:
          - ["和が 4 は 3 通り、目が同じは 6 通り", "\"両方は (2, 2) の 1 通り\"", "(3 + 6 − 1)/36 = 8/36 = 2/9"]
      - part: 挑戦
        text: 2 つの事象 A、B について、P(A) = 1/2、P(B) = 2/3、P(A ∪ B) = 5/6 です。P(A ∩ B) を求めましょう。
        answer: 1/3
        check: "Fraction(1, 2) + Fraction(2, 3) - Fraction(5, 6)"
        hints:
          - 加法定理 P(A ∪ B) = P(A) + P(B) − P(A ∩ B) を思い出しましょう。
          - わかっていない確率はどれでしょう。
          - 式を、P(A ∩ B) について解きましょう。
        paths:
          - [5/6 = 1/2 + 2/3 − P(A ∩ B), P(A ∩ B) = 7/6 − 5/6 = 1/3]
        note: P(A) + P(B) が 1 をこえるので、A と B は排反ではありえない。ベン図にかいて重なりの大きさを確かめさせるとよい。

  - day: 2
    items:
      - part: 見本
        text: サイコロ 1 個と硬貨 1 枚を投げます。サイコロで 5 以上の目が出て、しかも硬貨が表になる確率を求めてみましょう。
        svg: |
          <svg viewBox="0 0 276 104" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="10" width="256" height="28" fill="#f3c969" fill-opacity=".35" stroke="none"/>
            <rect x="10" y="10" width="256" height="84" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="62" y1="10" x2="62" y2="94" stroke="currentColor" stroke-width="1.5"/>
            <line x1="96" y1="10" x2="96" y2="94" stroke="currentColor" stroke-width="1.5"/>
            <line x1="130" y1="10" x2="130" y2="94" stroke="currentColor" stroke-width="1.5"/>
            <line x1="164" y1="10" x2="164" y2="94" stroke="currentColor" stroke-width="1.5"/>
            <line x1="198" y1="10" x2="198" y2="94" stroke="currentColor" stroke-width="1.5"/>
            <line x1="232" y1="10" x2="232" y2="94" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10" y1="38" x2="266" y2="38" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10" y1="66" x2="266" y2="66" stroke="currentColor" stroke-width="1.5"/>
            <text x="79" y="29" font-size="13" text-anchor="middle">1</text>
            <text x="113" y="29" font-size="13" text-anchor="middle">2</text>
            <text x="147" y="29" font-size="13" text-anchor="middle">3</text>
            <text x="181" y="29" font-size="13" text-anchor="middle">4</text>
            <text x="215" y="29" font-size="13" text-anchor="middle">5</text>
            <text x="249" y="29" font-size="13" text-anchor="middle">6</text>
            <text x="36" y="57" font-size="13" text-anchor="middle">表</text>
            <text x="215" y="57" font-size="13" text-anchor="middle">○</text>
            <text x="249" y="57" font-size="13" text-anchor="middle">○</text>
            <text x="36" y="85" font-size="13" text-anchor="middle">裏</text>
          </svg>
        explain: サイコロの目と硬貨の表裏の組は 6 × 2 = 12 通りで、どれも同じ程度に起こります。当てはまるのは表の ○ の 2 通りなので、確率は 2/12 = 1/6 です。これは、サイコロで 5 以上が出る確率 1/3 と、硬貨が表になる確率 1/2 の積 1/3 × 1/2 = 1/6 と同じです。サイコロの結果と硬貨の結果のように、2 つの試行の結果が互いに影響しないとき、2 つの試行は独立であるといいます。独立な試行で、一方で A が起こり、他方で B が起こる確率は、P(A) × P(B) です（わけは 4 日目）。3 つ以上の独立な試行でも、確率をかけ合わせます。また、「少なくとも 1 回起こる」確率は、余事象「1 回も起こらない」を使って 1 − (1 回も起こらない確率) で求めると楽です。
      - part: 思い出す
        text: 1 から 40 までの数を 1 つずつ書いた 40 枚のカードから、よくまぜて 1 枚引きます。2 の《倍数》または 5 の倍数を引く確率を求めましょう。
        answer: 3/5
        check: "Fraction(sum(1 for n in range(1, 41) if n % 2 == 0 or n % 5 == 0), 40)"
        hints:
          - 2 の倍数と 5 の倍数の枚数を数えましょう。
          - 両方に入るのは 10 の倍数です。
          - P(A ∪ B) = P(A) + P(B) − P(A ∩ B) を使いましょう。
        paths:
          - [20/40 + 8/40 − 4/40 = 24/40 = 3/5]
      - part: 思い出す
        text: サイコロを 2 回投げます。2 回とも偶数の目が出る確率を、36 通りの表で数えて求めましょう。
        answer: 1/4
        check: "Fraction(sum(1 for a in range(1, 7) for b in range(1, 7) if a % 2 == 0 and b % 2 == 0), 36)"
        hints:
          - 1 回目と 2 回目の目の組は 36 通りです。
          - 1 回目が偶数で、2 回目も偶数になる組は何通りでしょう。
          - 場合の数の比を約分しましょう。
        paths:
          - [偶数どうしの組は 3 × 3 = 9 通り, 9/36 = 1/4]
        note: 1/2 × 1/2 = 1/4 と同じになることを、今日の見本とくらべる。
      - part: 今日
        text: バスケットボールのフリースローで、A さんが決める確率は 3/5、B さんが決める確率は 2/3 で、2 人の結果は互いに影響しません。2 人が 1 本ずつ投げるとき、2 人とも決める確率を求めましょう。
        answer: 2/5
        check: "Fraction(sum(1 for a in range(5) for b in range(3) if a < 3 and b < 2), 15)"
        hints:
          - 2 人の結果は互いに影響しないので、2 つの試行は独立です。
          - 独立な試行では、確率をかけ合わせます。
          - かけたあとで約分しましょう。
        paths:
          - [3/5 × 2/3 = 6/15 = 2/5]
      - part: 今日
        text: サイコロを 3 回投げます。少なくとも 1 回は 6 の目が出る確率を求めましょう。
        answer: 91/216
        check: "Fraction(sum(1 for t in itertools.product(range(1, 7), repeat=3) if 6 in t), 216)"
        hints:
          - 「少なくとも 1 回 6」の余事象は何でしょう。
          - 3 回とも 6 以外の目が出る確率を、独立な試行の積で求めましょう。
          - 1 からひきましょう。
        paths:
          - [3 回とも 6 以外の確率は (5/6) × (5/6) × (5/6) = 125/216, 1 − 125/216 = 91/216]
        note: 1 回ごとの確率 1/6 を 3 回たして 1/2 とするまちがいが多い。1 回目と 2 回目がともに 6 の場合を重ねて数えている。
      - part: 挑戦
        text: サイコロを 3 回投げます。1 の目がちょうど 2 回出る確率を求めましょう。
        answer: 5/72
        check: "Fraction(sum(1 for t in itertools.product(range(1, 7), repeat=3) if t.count(1) == 2), 216)"
        hints:
          - 1 の目が出る 2 回が何回目と何回目かで、場合を分けましょう。何通りあるでしょう。
          - たとえば「1 回目と 2 回目が 1 で、3 回目は 1 以外」の確率を、独立な試行の積で求めましょう。
          - 分けたそれぞれの場合は排反なので、確率をたします。
        paths:
          - [1 が出る回の選び方は 3 通り, どれも (1/6) × (1/6) × (5/6) = 5/216, 3 × 5/216 = 15/216 = 5/72]
        note: 「どの回に 1 が出るか」の選び方（C-007）と独立な試行の積を組み合わせる。一般の回数の式は S-041 の二項分布で扱う。
