      - part: わけ
        id: "21eb148991"
        text: どの場合も同じ程度に起こる試行で、2 つの事象 A、B について P(A ∪ B) = P(A) + P(B) − P(A ∩ B) が成り立つわけを、ベン図と場合の数を使って、すじ道を立てて書きましょう。また、A と B が排反のときにどうなるかも書きましょう。
        explain: 例：「起こりうる場合が全部で N 通りあり、どれも同じ程度に起こるとする。A ∪ B の場合を数えるとき、n(A) + n(B) では、A と B の両方に入る A ∩ B の場合を 2 回数えているので、n(A ∪ B) = n(A) + n(B) − n(A ∩ B) である（C-008、ベン図）。確率は場合の数を N でわった数なので、この式の両辺を N でわると、P(A ∪ B) = P(A) + P(B) − P(A ∩ B) になる。A と B が排反なら、A ∩ B の場合は 0 通りなので、P(A ∪ B) = P(A) + P(B) である。」と書ければよい。①「場合が N 通りとする」で場合の数を決める、② 重なりを 2 回数えていることから、場合の数の式を立てる、③ 確率の意味（場合の数 ÷ N）と、《分数》のたし算・ひき算で結ぶ、の 3 つがそろっているかを見る。1 日目のカードの例で 13/20 を確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。A と「A でない」は排反で、合わせると全部の場合になるので、P(A) + P(A でない) = 1 になる（余事象の確率）ことにもふれる。
        hints:
          - 起こりうる場合を N 通りとし、A の場合の数を n(A) と書きましょう。
