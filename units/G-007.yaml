        explain: たいらな ところを めん、めんと めんの さかいの まっすぐな せんを へん、かどの とがった ところを ちょうてん と いいます。りっぽうたいの めんは 6 つで、どれも おなじ おおきさの ましかく（4 つの へんが みんな おなじ ながさの しかく）です。てんせんは、うしろに かくれて みえない へん です。
      - part: 思い出す
        text: たてても、よこに ねかせても、ころがらないのは どれですか。
        choices: [⚽, 🥫, 🎲]
