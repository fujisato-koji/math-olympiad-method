# G-007 立方体と展開図
#
# 書き方は N-001 の頭の注のとおり。
# ことば：りっぽうたい（さいころの かたち）、めん、へん、ちょうてん、てんかいず、むかいあう、となりあう。
#   ましかくは「4 つの へんが みんな おなじ ながさの しかく」（G-006 は前提にないので、せいほうけいの言葉は使わない）。
# 見取り図は svg（D-040）。てんせんは うしろに かくれて 見えない辺。展開図はマスの図で、🟦 などの色のマスが面、⬜ は何もない所。
#   むかいあう面を問う図は、6 つの面を 🟥🟦🟨🟩🟪🟫 で塗り分けた。辺や数を書き込む図だけ svg にした。
#   だいだい（🟧）は使わず茶（🟫、図は #a8743f）にした。Windows の絵文字では 🟨 がだいだい、🟧 が赤に近く見え、図の黄・赤とまぎれるため（D-131 の解き直し）。
# 前提は G-003（→ N-001）だけでたし算がないので、数は 1 つずつ数える。立方体の辺は 12 本なので、12 までは数えて答える
#   （「4 本ずつ 3 組」のように組で数えるのはよい）。さいころの目は「1 と 6、2 と 5、3 と 4 が むかいあう」と文で示し、たして 7 は使わない。
# 直方体の展開図と、面の数え上げ（表面積）は G-011 で扱うので、ここでは立方体だけにした。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 面・辺・頂点　2 日目 展開図になるか　3 日目 組み立てたとき むかいあう面・重なる辺　4 日目 わけ
#   5 日目 G-003（積み木と立体）と混ぜる　6 日目 確認
# check：面・辺・頂点の数は、頂点を (0, 0, 0)〜(1, 1, 1) の 8 つの点とみて数える式（itertools.product）。
#   展開図は、立方体を図のマスの上で転がして、どのマスにどの面がつくかを調べる式（6 つの面がみな違えば展開図）。
#   2 だん 2 れつにかたまった 4 まいがあれば、展開図ではない（1 つの頂点に面が 4 つ集まる）。
#   むかいあう面は、転がした向きで「マスについた面の反対の面」がつくマスを探す。重なる辺は、辺の両がわの 2 つの面の組が同じ辺。

