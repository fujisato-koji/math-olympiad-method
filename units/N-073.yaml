# N-073 大きな数（万・億の位と位取り、10 倍と 10 分の 1）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は小 4 までの漢字で書く（位・億・例・残 は漢字。
#   確・個・増・減・比・並・枚 などの小 5 より後の字はかなで書く）。分かち書きはしない。数の前後には空白を入れる。
# 前提は N-009（1000 までの数と位）と N-013（九九）。N-009 の「10 こ集まると 1 つ上の位」を、千の位から一億の位までのばす。
#   わり算（N-014）、計算のきまり（N-015）、かけ算の筆算（N-074）は前提にないので使わない。
#   10 分の 1 は「同じ大きさの 10 こに分けた 1 つ分」と言い、「10 倍するともとの数になる数」としてさがす（÷ 10 の式は書かない）。
#   かけ算は、九九と × 10（N-013）と、「40000 × 6 は 1 万が 4 × 6 = 24 こ」のように位の単位をつけた九九だけにした。
#   100 倍と 1000 倍は「10 倍を 2 回、3 回」として 4 日目に入れた。100 分の 1 は扱わない。
#   小数（N-020）は前提にないので、10 分の 1 にするのは一の位が 0 の数だけ。
# 数は 1 億まで（PSLE の 1000 万までの数を含む）。鍵盤は 8 字までなので、1 億（9 けた）を答える問題は選ぶ問題にした。
#   1 億を選ぶ問題の check は、計算した数を 1 億でわって「1 億」の文字をつくる。
# 大きな数は 3 けたごとの「,」で区切らない（位の表と、右から 4 けたずつの万のまとまりで読む）。
# 位の表は svg（D-040）。太い線は 4 けたずつの区切り。表の位の名前は「千」と「万」を上下に重ねて「千万」と読む。答えは表に書かない。
# 数の線は svg で描く（6〜7 けたの目もりの数を文字の図にすると 1 行が長く、字が小さくなるため）。長い目もりが数を書いた所、
#   短い目もりは数を書いていない所、□ はたずねる所。図から数えられないので、check は 1 目もりの大きさ × 目もりの数で書く。
# 何の位かをたずねる問題の check は、range で位を 1 つずつ調べて、その数字のある位の名前を返す（数字は数の中に 1 つだけ）。
# 日の並び（既定）：1 日目 千の位と一万の位、2 日目 十万・百万・千万の位と一億、数の線、
#   3 日目 10 倍と 10 分の 1（頭に見本）とわけ、4 日目 100 倍・1000 倍、位の単位をつけた九九とたし算、大小（N-009、N-013 と混ぜる）、5 日目 確認。

