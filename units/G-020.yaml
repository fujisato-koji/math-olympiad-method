# G-020 相似の証明
#
# 書き方は N-001 の頭の注のとおり。答えの形は A-016 に合わせる（段 4。分数は約分した形、小数でもよいものは accept に入れた）。
# 相似：1 つの図形を拡大または縮小した図形と合同な図形（G-013 の拡大図・縮図）。記号 ∽ で、対応する頂点を同じ順に書く。
# ことば：相似、相似比（対応する辺の比）、三角形の相似条件（3 組の辺の比がすべて等しい、2 組の辺の比とその間の角がそれぞれ等しい、
#   2 組の角がそれぞれ等しい）、三角形と比の定理（DE ∥ BC なら AD:AB = AE:AC = DE:BC、AD:DB = AE:EC）とその逆、
#   平行線にはさまれた線分の比、中点連結定理、相似な図形の面積の比（相似比の数をそれぞれ 2 回かけた比）とまわりの長さの比。
#   記号 △、∠、∥、⊥、≡ は G-016 で使ったものとした。相似条件は、合同条件（G-016）と同じく約束した事実として使う。
# 前提は G-013（拡大と縮小）と G-016（平行線と角、合同の証明）。G-016 の約束した事実（平行線の同位角・錯角、同位角が等しければ平行、
#   合同条件）と示したこと（対頂角、内角の和、外角）、証明の書き方（仮定、結論、根拠を書いて結ぶ）を使う。
# 前提の道に A-010（文字と式）、A-011（1 次方程式）、A-009（累乗）がないので、わからない長さは文字でおかず、
#   G-013・A-005 と同じく「何倍か」で求める（比の外項の積 = 内項の積も A-005 で扱っていないので使わない）。
#   面積の比も (4 × 4):(5 × 5) のように書き、2 乗の記号は使わない。証明も、文字を使わずに点の名前と比で書く。
# G-017（二等辺三角形、平行四辺形の性質）は前提にないので使わない（中点を結んだ四角形は、まわりの長さだけを求める）。
#   角の二等分線の定理は G-042、円周角は G-018、三平方の定理は G-019、相似な立体の体積の比は G-021（G-011 が前提にないため）で扱う。
# 図は svg（D-040）。長さの比は、問題の数に合わせて描いた（形を選ぶ問題では、答えがわからないように通る点や辺だけをかいた）。
#   平行な線分には、まん中に「>」のしるしをつけた。
# 地図に plan がないので既定の並び（導入・練習 5 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 相似の意味、記号 ∽、相似比、対応する辺と角　2 日目 三角形の相似条件
#   3 日目 相似の証明を書く（根拠を選ぶ、条件の穴をうめる）　4 日目 相似を使って長さを求める（重なった三角形、ちょうちょ形、直角三角形、影）
#   5 日目 三角形と比の定理とその逆、平行線にはさまれた線分の比　6 日目 中点連結定理、相似な図形の面積の比
#   7 日目 わけ（三角形と比の定理、中点連結定理、面積の比が相似比を 2 回かけた比になる）
#   8 日目 G-013（縮尺、影）・G-016（角）・G-008（面積）と混ぜる　9 日目 確認
# check：長さは「何倍か」をかける式（Fraction）。比は Fraction で約分して '%d:%d' の文字にする（A-005 と同じ）。
#   相似な三角形を選ぶ問題は、対応する辺の倍が 3 組とも等しいかを Fraction でくらべる式。
#   相似条件や根拠の名前を選ぶ問題は約束ごとなので check を付けない。
# 相似は、三平方の定理の証明（G-019）、円と比の定理（G-030 方べき）、三角比（G-024）、縮尺と測量、相似な立体（G-021）の道具になる（D-026）。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-009、A-010 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

