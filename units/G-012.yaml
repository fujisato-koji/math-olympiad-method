    - BP：PE が分かれば、P が BC からどれだけの高さにあるかが分かるよ。BP：PE は、三角形の面積の比で考えてもよいよ。
    - 台形 FGCB は、三角形 ABC から三角形 AFG を引いた形だね。FG が BC に平行なので、三角形 AFG と三角形 ABC は形が同じだよ。FG は BC の何倍かな。
    paths:
    - - 三角形 ADE は、三角形 ABC を A を中心に 5 分の 2 にちぢめた形（AD：AB = AE：AC = 2：5）なので、DE と BC は平行で、DE：BC = 2：5
      - DE と BC が平行なので、三角形 PDE と三角形 PCB は形が同じ（相似）で、相似比は DE：BC = 2：5。だから DP：PC = EP：PB = 2：5 で、DP：DC = EP：EB = 2：7
      - FP と BC は平行。三角形 DFP と三角形 DBC は形が同じなので FP：BC = DP：DC = 2：7
      - PG と BC も平行。三角形 EPG と三角形 EBC は形が同じなので PG：BC = EP：EB = 2：7
      - FG = FP + PG は BC の 2/7 + 2/7 = 4/7。FG と BC が平行なので、三角形 AFG と三角形 ABC は形が同じで、相似比は 4：7、面積の比は 16：49
      - 三角形 AFG = 245 × 16 ÷ 49 = 80 cm²。台形 FGCB = 245 − 80 = 165 cm²
    - - 三角形 ABC を 25 とすると、BD：BA = 3：5 から三角形 BDC は 15、AD：AB = 2：5 から三角形 ADC は 10、EC：AC = 3：5 から三角形 DEC は 10 × 3/5 = 6。DC を共通の底辺とみると、B と E の高さの比が BP：PE なので、BP：PE = 15：6 = 5：2
      - 三角形 PBC と三角形 EBC は、頂点 C が同じで底辺が BP と BE（BP：BE = 5：7）。三角形 EBC = 245 × 3/5 = 147 cm² なので、三角形 PBC = 147 × 5/7 = 105 cm²
      - 三角形 PBC と三角形 ABC は底辺 BC が同じで、面積の比は 105：245 = 3：7。だから P の BC からの高さは、A の高さの 3/7
      - FG は P を通って BC に平行なので、A から FG までの高さは A の高さの 4/7。三角形 AFG と三角形 ABC は形が同じで、相似比 4：7、面積の比 16：49
      - 三角形 AFG = 245 × 16 ÷ 49 = 80 cm²。台形 FGCB = 245 − 80 = 165 cm²
    note: 工夫は 3 段：①三角形の中に DE（BC に平行）を入れて、相似の三角形 PDE と PCB から P の位置（DP：DC = 2：7）を決める、②P を通る平行線 FG が BC の 4/7 になるので、三角形 AFG が ABC と 4：7 の相似、③台形そのものを求めずに、全体 245 から三角形 AFG の 80 を引く。2 本目は相似を P の位置の決定に使わず、三角形 BDC と DEC の面積の比から BP：PE を出し、三角形 PBC の面積から P の高さ（A の高さの 3/7）を出す。最後の 4：7 と 80 は同じ。check は、A = (2, 7)、B = (0, 0)、C = (7, 0)（面積 24.5）の座標で D、E、2 直線 BE と CD の交点 P、P を通る横線と AB、AC の交点 F、G を出し、台形 FGCB の面積を、三角形 ABC が 245 になるようにそろえて求める（165）。似た既出は「台形の対角線の交点を通る平行線（調和平均）」で、そちらは台形の中の平行線の長さ。この問題は三角形の中に DE を入れて 2 段にし、交点 P の高さを出してから補う三角形を引く点が違う。
