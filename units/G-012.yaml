        explain: 平行な 2 本の直線のはばは、どこでも同じです。三角形 ABC も三角形 DBC も、底辺は BC で 6 cm、高さは A や D から イ に直角にひいた長さで、どちらも ア と イ のはばの 4 cm です。面積はどちらも 6 × 4 ÷ 2 = 12 cm² で同じです。頂点を、底辺に平行な直線の上で動かしても、三角形の面積は変わりません。このように、面積を変えずに形を変えることを等積変形といいます。
