# G-012 等積変形と面積比
#
# 書き方は N-001 の頭の注のとおり。
# 柱は 2 つ：① 底辺が同じで、頂点が底辺に平行な直線の上にある三角形は、面積が同じ（等積変形）。
#   ② 高さが同じ三角形の面積の比は、底辺の比と同じ。底辺が同じなら高さの比（三角形の中を 2 回分ける形で使う）。
# ことば：等積変形（面積を変えずに形を変える）、平行（G-006）、底辺と高さ（G-008）、比 a:b と比を簡単にする（A-005）、台形、対角線。
#   「平行な 2 本の直線のはばはどこでも同じ」は G-006 と G-008（台形の挑戦）で見たことを使う。
# 相似を使う面積比（形が同じ三角形の辺の比、ちょうちょ形の相似）は G-013 と G-020 で扱うので、ここでは使わない。
#   ただし腕だめしの最難関（平行線を 2 段に引く台形の問題）だけは例外で、uses に G-013 を挙げて相似比と面積比を使う（G-013 は段 3 なので段はこえない）。
#   台形の対角線の交わる点が対角線を AD:BC に分けること（5 日目と 8 日目の挑戦）も、面積の比だけで導く。
# 前提の計算は A-005 まで（N-074 のかけ算の筆算と N-075 のわり算の筆算を含む）。面積は 100 まで、比は簡単にした形。
#   比の答えは選ぶ問題にし、YAML では引用符で囲む。check は Fraction で約分してから '%d:%d' % (分子, 分母) で比の文字を作る（A-005 と同じ）。
# 図は svg（D-040）。長さの比はおおよそ合わせた（面積の数を文で与える問題では、図の面積はその数に合っていない）。
#   色のついた三角形が、たずねている三角形。平行な直線は ア、イ と名前をつけた。方眼の図の 1 目は 1 cm。
# 地図に plan がないので既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 平行な直線の間の三角形（等積変形）　2 日目 等積変形で面積を求める（平行四辺形・長方形の中の三角形、折れ線をまっすぐにする）
#   3 日目 高さが同じ三角形の面積の比 = 底辺の比　4 日目 三角形の中を 2 回分ける　5 日目 面積の比から長さを求める、台形の対角線
#   6 日目 わけ（等積変形、面積の比 = 底辺の比、台形の中の等しい三角形）　7 日目 G-008（面積）・A-005（比と割合）と混ぜる　8 日目 確認
# check：面積と比の式。方眼の上の点を選ぶ問題は、頂点の座標から面積を出す式（座標の公式）。

id: G-012
