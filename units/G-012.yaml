    check: '(lambda cr, lerp: (lambda A, B, C: (lambda D, E: (lambda P: (lambda F, G: Fraction(245) * abs(cr(F, G) + cr(G, C) + cr(C, B) + cr(B, F)) / abs(cr(A, B) + cr(B, C) + cr(C, A)))(lerp(A, B, (A[1] - P[1]) / (A[1] - B[1])), lerp(A, C, (A[1] - P[1]) / (A[1] - C[1]))))(lerp(B, E, cr((C[0] - B[0], C[1] - B[1]), (D[0] - C[0], D[1] - C[1])) / cr((E[0] - B[0], E[1] - B[1]), (D[0] - C[0], D[1] - C[1])))))(lerp(A, B, Fraction(2, 5)), lerp(A, C, Fraction(2, 5))))((Fraction(2), Fraction(7)), (Fraction(0), Fraction(0)), (Fraction(7), Fraction(0))))(lambda u, v: u[0] * v[1] - u[1] * v[0], lambda p, q, t: (p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t))'
