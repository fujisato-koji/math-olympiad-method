        text: 底辺 5 cm、高さ 6 cm の三角形の面積は何 cm² ですか。
        answer: 15
        check: "5 * 6 // 2"
        hints:
          - 三角形の面積は、底辺 × 高さ ÷ 2 だね。
          - 6 を先に 2 でわってもよいよ。
          - 5 × 3 を計算しよう。
        paths:
          - [6 ÷ 2 = 3, 5 × 3 = 15, 15 cm²]
      - part: 思い出す
        text: 半径が 6 cm の円の円周は、（□ × 円周率）cm です。□ に入る数はいくつですか。
        answer: 12
        check: "6 * 2"
        hints:
          - 円周 = 直径 × 円周率 だね。
          - 直径は半径の 2 つ分だよ。
          - 6 × 2 を計算しよう。
        paths:
          - [直径は 12, 円周は 12 × 円周率, □ は 12]
