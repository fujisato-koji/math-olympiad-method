# G-015 点の移動と図形の回転
#
# 書き方は N-001 の頭の注のとおり。
# 点の移動：辺の上を「1 秒に □ cm」ずつ進む点の位置と、その点を頂点にした三角形の面積（G-008）。速さ（A-007）は前提にないので、
#   「1 秒に □ cm」を「□ 秒で □ cm 進む」とかけ算で読むだけにし、速さという言葉と、時間と面積のグラフは使わない。
# 図形の回転：回転移動（1 つの点を中心に、同じ角度だけ回す）。回しても長さ・角・面積は変わらず、各点は中心を中心にした円の上を動く。
#   G-004 は「はんぶん回す」までなので、回す角（90°、180°、時計の針と反対向き＝左回り）はここで約束する。回す向きは問題文に書いた。
#   点がえがく線（弧）と、線分が通ったあと（おうぎ形）は G-010 の「円の何分の 1」で求める。
# 転がる移動：直線の上を、すべらないように転がる正方形・正三角形・長方形・円。転がるたびに、直線についた頂点を中心に回る。
#   正方形は 90°、正三角形は 180° − 60° = 120° 回る（G-009 の角）。長方形の対角線は問題文で長さを与える（三平方の定理は G-019）。
# 円周率は G-010 と同じく「（□ × 円周率）cm」の □ を答える。□ が分数になるときは分数で、小数でもよいときは accept に小数を入れた。
#   3.14 を使うのは 5 日目と 6 日目の挑戦だけで、3.14 を 2〜4 回たす形にした。
# 平行移動、線対称・点対称の名前と性質は扱わない（座標の上の移動と対称は G-050）。5 日目に「180° 回すと重なる形」だけ入れた。
# 図は svg（D-040）。回したあとの形と、動いたあとの形は点線。点がえがく線は細い点線。方眼の図の 1 目は 1 cm。
#   「どの辺の上にあるか」「どこへ移るか」をたずねる図には、答えの点をかいていない。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 辺の上を動く点（位置と三角形の面積）　2 日目 回転移動（方眼の上で回す、点がえがく弧、通ったあとのおうぎ形）
#   3 日目 転がる移動（正方形、正三角形、円）　4 日目 わけ（円の上を動く、120° 回る、面積が変わらない）
#   5 日目 G-010（円とおうぎ形）・G-004（回す）と混ぜる　6 日目 確認
# check：面積と弧の □ の式（Fraction）。方眼で回す問題は、O から見た目の数 (x, y) を 90° 左回りなら (−y, x) にする式。
#   転がる問題は、回る中心からの長さ（半径）と回る角から、円の何分の 1 かを出す式。

id: G-015
days:
  - day: 1
    items:
      - part: 見本
        text: 長方形 ABCD の辺 BC の上を、点 P が B を出発して、1 秒に 1 cm ずつ C に向かって進みます。3 秒後の三角形 ABP の面積を求めよう。
        svg: '<svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><polygon points="51,24 51,116 120,116" stroke="currentColor" stroke-width="0" fill="#f3c969" fill-opacity=".35"/><polygon points="51,24 51,116 189,116 189,24" stroke="currentColor" stroke-width="2" fill="none"/><line x1="51" y1="24" x2="120" y2="116" stroke="currentColor" stroke-width="2" fill="none"/><text x="44" y="21.2" font-size="12" text-anchor="middle">A</text><text x="44" y="129.2" font-size="12" text-anchor="middle">B</text><text x="196" y="129.2" font-size="12" text-anchor="middle">C</text><text x="196" y="21.2" font-size="12" text-anchor="middle">D</text><text x="120" y="132.2" font-size="12" text-anchor="middle">P</text><circle cx="120" cy="116" r="2.6" fill="currentColor"/><text x="120" y="19.2" font-size="12" text-anchor="middle">6 cm</text><text x="45" y="74.2" font-size="12" text-anchor="end">4 cm</text><line x1="129.2" y1="134" x2="161.4" y2="134" stroke="currentColor" stroke-width="1.2" fill="none"/><polyline points="156.4,130 161.4,134 156.4,138" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>'
        explain: 1 秒に 1 cm ずつ進むので、3 秒では 1 × 3 = 3 cm 進み、BP は 3 cm です。三角形 ABP は、底辺 BP が 3 cm、高さ AB が 4 cm なので、面積は 3 × 4 ÷ 2 = 6 cm²。P が進むと底辺 BP がのびるので、三角形 ABP の面積は、1 秒ごとに 1 × 4 ÷ 2 = 2 cm² ずつふえていきます。
