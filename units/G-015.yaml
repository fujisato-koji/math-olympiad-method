    paths:
      - [D は半径 5 cm の円の 4 分の 1 をえがく, 通ったあとは おうぎ形（半径 5 cm・90°）と 回す前の三角形 BCD と 回したあとの同じ形の三角形, 5 × 5 × 3.14 ÷ 4 = 19.625・三角形は 6 cm² ずつ, 19.625 + 6 + 6 = 31.625 cm²]
    note: 長方形 2 つ分とおうぎ形を足して、重なりを数えまちがえやすい。いちばん遠い点 D がえがく弧で外がわが決まり、残りは回す前の三角形 BCD と回したあとの三角形（どちらも長方形の半分）になる。25 × 3.14 ÷ 4 の小数の計算も手間がかかる。
  - part: 離
    kinds: [総動員, 道筋, 読み取り]
    uses: [G-012]
    text: 四角形 ABCD は、AD と BC が平行な台形で、AD = 6 cm、BC = 14 cm、高さ AB = 6 cm、辺 CD = 10 cm です。点 P が A を出発して、1 秒に 1 cm ずつ、辺 AD、辺 DC の上を C まで進みます。三角形 PBC の面積が 21 cm² になるのは、出発してから何秒後ですか。
    svg: |
      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><polygon points="40,48 112,48 208,120 40,120" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".35"/><polyline points="40,112 48,112 48,120" stroke="currentColor" stroke-width="1" fill="none"/><text x="32" y="52" font-size="12" text-anchor="middle">A</text><text x="116" y="43" font-size="12" text-anchor="middle">D</text><text x="32" y="126" font-size="12" text-anchor="middle">B</text><text x="216" y="126" font-size="12" text-anchor="middle">C</text><text x="76" y="42" font-size="10" text-anchor="middle">6 cm</text><text x="124" y="134" font-size="10" text-anchor="middle">14 cm</text><text x="172" y="80" font-size="10" text-anchor="middle">10 cm</text><text x="32" y="88" font-size="10" text-anchor="end">6 cm</text></svg>
    answer: 11
    check: "6 + 10 - 10 * Fraction(21, 14 * 6 // 2)"
    hints:
      - P が辺 AD の上にあるとき、三角形 PBC の面積はどうなるかな。
      - P が辺 DC の上にあるとき、三角形 PBC と三角形 DBC は、どこを底辺とみると高さが同じになるかな。
      - 21 cm² は、三角形 DBC の面積の何分の 1 かな。
    paths:
      - [AD の上では 底辺 BC・高さ 6 cm で いつも 42 cm², DC の上では 三角形 PBC と DBC の面積の比は PC:DC, 21 は 42 の半分なので PC = 5 cm・DP = 5 cm, 6 + 5 = 11 秒後]
    note: AD の上では面積が変わらない（等積変形、G-012）ことと、DC の上では面積が PC の長さに比例すること（高さが同じ三角形の面積の比）を合わせる。DC の上で高さを直接求めようとすると、ななめの辺で行きづまる。
