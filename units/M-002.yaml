った直線</text><text x="246" y="186" font-size="13" text-anchor="middle" fill="currentColor">Q → Q′、R → R′</text></svg>'
        explain: 1 次変換 f では、ベクトル p、q と実数 s、t について f(sp + tq) = s f(p) + t f(q) が成り立ちます（線形性。わけは 6 日目）。直線 y = 2x + 1 の上の点は、点 (0, 1) と方向ベクトル (1, 2) を使って (x, y) = (0, 1) + t(1, 2) と表せます（G-027）。線形性から、その像は f(0, 1) + t f(1, 2) です。f(0, 1) = (1, 2)、f(1, 2) = (3, 4) なので、像は (x′, y′) = (1, 2) + t(3, 4) で、点 (1, 2) を通りかたむき 4/3 の直線 4x − 3y + 2 = 0 です（図の実線。点線がもとの直線で、Q、R が Q′、R′ に移る）。このように、1 次変換で直線は直線に移ります。ただし、方向ベクトルの像が 0 ベクトルになると、直線は 1 点に移ります。また、ad − bc = 0 の行列では、平面全体が原点を通る 1 本の直線（または原点だけ）に移ります。たとえば (1 2；2 4) では像は (x + 2y, 2x + 4y) で、すべて直線 y = 2x の上にあります。線分の中点は像の線分の中点に、平行四辺形は平行四辺形に移ります。
