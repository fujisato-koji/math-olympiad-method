"20" font-size="14" text-anchor="middle" fill="currentColor">2f(p) + f(q)</text><text x="160" y="190" font-size="13" text-anchor="middle" fill="currentColor">矢印のつなぎ方が、移したあともそのまま</text></svg>'
        hints:
          - sp + tq の成分を書きましょう。
          - その像の x 座標を、分配法則でかっこをはずして書きましょう。
          - s がつくものと t がつくものに分けて、f(p)、f(q) の成分と見くらべましょう。
        explain: 例：「sp + tq = (sp₁ + tq₁, sp₂ + tq₂) である。その《像》の x 座標は a(sp₁ + tq₁) + b(sp₂ + tq₂) = s(ap₁ + bp₂) + t(aq₁ + bq₂)、y 座標は c(sp₁ + tq₁) + d(sp₂ + tq₂) = s(cp₁ + dp₂) + t(cq₁ + dq₂) である。f(p) = (ap₁ + bp₂, cp₁ + dp₂)、f(q) = (aq₁ + bq₂, cq₁ + dq₂) なので、像は s f(p) + t f(q) に等しい。」と書ければよい。①「〜とする」で成分を文字で置く、② 分配法則でかっこをはずし、s のつくものと t のつくものにまとめ直す、③ 約束した事実（ベクトルの和と実数倍は成分ごと、1 次変換の式）で結ぶ、の 3 つがそろっているかを見る。行列の性質 A(sp + tq) = s(Ap) + t(Aq)（分配法則と実数倍、M-001）を約束した事実として使ってもよい。この性質から、直線 a + td の像が f(a) + t f(d) になり、直線は直線か 1 点に移ることを話す。
        paths:
          - ["\"sp + tq = (sp₁ + tq₁, sp₂ + tq₂) とする\"", 像の x 座標は s(ap₁ + bp₂) + t(aq₁ + bq₂)、y 座標も同じ形, f(p)、f(q) の成分と等しくなる, f(sp + tq) = s f(p) + t f(q)]
          - [行列の分配法則 A(sp + tq) = A(sp) + A(tq)（M-001）, 実数倍は前に出せる：A(sp) = s(Ap)、A(tq) = t(Aq), f(sp + tq) = s f(p) + t f(q)]
