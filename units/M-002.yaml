        explain: 1 辺 1 の正方形（青）の角の点 (0, 0)、(1, 0)、(1, 1)、(0, 1) は、(0, 0)、(3, 1)、(4, 3)、(1, 2) に移り、正方形は平行四辺形（黄）に移ります。この平行四辺形の面積は、まわりの長方形（点線）4 × 3 = 12 から、まわりの 4 つの直角三角形（3/2、1、3/2、1）と 2 つの正方形（1 ずつ）をひいて 5 です。これは ad − bc = 3 × 2 − 1 × 1 = 5 と等しくなります。いっぱんに、行列 (a b；c d) で表される 1 次変換で、図形の面積は |ad − bc| 倍になります（わけは 6 日目）。ad − bc を A の行列式といい、det A と書きます。det A が正なら図形の向き（角の点を A → B → C と回る向き）は変わらず、負なら図形はうら返ります（たとえば x 軸についての《対称移動》では det A = −1）。2 つの変換を続けると面積は |det A| × |det B| 倍になり、det(AB) = det A × det B が成り立ちます（成分の計算でも確かめられます）。det A = 0 のときは、平面全体が直線か点につぶれて面積が 0 になり、逆変換はありません（逆行列がない、M-001）。回転の行列では det R(θ) = cos²θ + sin²θ = 1 で、面積も向きも変わりません。
