# M-002 平面の線形変換と行列式
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019、M-001 に合わせる。行列の書き方は M-001 と同じ（svg にかっこでくくった形、
#   文の中では「(2 1；3 4)」、列ベクトルは「(x；y)」）。成分が式のときは「(cos θ、−sin θ；sin θ、cos θ)」と成分を「、」で区切る。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜5 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# ことば：1 次変換（線形変換）、像、1 次変換を表す行列、対称移動、拡大、原点のまわりの回転 R(θ)、合成変換 g∘f、逆変換、線形性、
#   行列式 det A = ad − bc（面積の倍率と向き）。
# 前提は M-001（行列、積、逆行列、ad − bc、ケーリー・ハミルトンの定理）と G-025（三角関数と加法定理）。G-025 はまだ中身ができていないので、
#   地図の題と前提（G-024、G-026、G-010）から、一般角の sin と cos、加法定理、2 倍角の公式を済んだものとした。
#   角は度で書き（弧度法は使わない）、回転の角は 30°、45°、60°、90°、120°、180° と、cos θ と sin θ を分数で与えた角にした。
#   前提のたどりに G-027（ベクトル、内積、直線のベクトル方程式）、G-024（三角比、sin²θ + cos²θ = 1、三角形の面積 (1/2)bc sin A）、
#   G-026（直線の式、座標で面積）がある。G-027 もまだ中身ができていないので、M-001 の注と同じものを済んだとした。
# 1 次変換は、点 (x, y) を (ax + by, cx + dy) に移す変換とし、(x′；y′) = A(x；y)。平行移動は原点を動かすので 1 次変換でない（見本で触れる）。
# 固有値と固有ベクトル、対角化、3 次の行列式、行列式の一般の定義（M-003 より後ろ）は扱わない。
#   「自分自身に移る直線」は、離の問題で、像を直線の式に入れた 2 次方程式（A-017）として 1 問だけ扱う。
# わけの日は、(1) 線形性 f(sp + tq) = s f(p) + t f(q)、(2) 回転の合成 R(β)R(α) = R(α + β)（加法定理）、
#   (3) 単位正方形の像の面積が |ad − bc|（平行四辺形の面積 |u||v| sin θ と内積から、(a² + c²)(b² + d²) − (ab + cd)² = (ad − bc)²）。
# 地図に plan がないので既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 1 次変換と行列（像、(1, 0) と (0, 1) の像が列、2 点の像から行列を決める）
#   2 日目 代表的な変換（x 軸・y 軸・原点・直線 y = x についての対称移動、拡大、原点のまわりの回転）
#   3 日目 合成変換（行列の積、あとの変換が左）と逆変換（逆行列）、回転をくり返す
#   4 日目 線形性と図形の像（直線の像、ad − bc = 0 のとき平面が直線につぶれる）　5 日目 行列式と面積（向き、det(AB) = det A × det B）
#   6 日目 わけ　7 日目 M-001・G-025 と混ぜる（2 倍角と回転、回転と拡大の累乗、像の面積）　8 日目 確認
# 答えは像の座標の 1 つ、成分、面積、行列式を打つ。√ を含む値、行列、直線の式は choices にした。
#   check は、行列の積（M-001 と同じ lambda）、回転は math.cos と math.sin で計算して math.isclose で比べるか、分数で与えた cos と sin を
#   Fraction で計算する。面積は |ad − bc| と元の面積の積。
# 図は svg（D-040）。座標平面に、もとの図形（1 辺 1 の正方形など）と像を淡い色でぬり分け、点の像は点線で結ぶ。答えの座標は図に書かない。
# 1 次変換と行列式は、掃き出し法と階数（M-003）、抽象的なベクトル空間と線形写像、コンピュータグラフィックスの変換、ロボットの姿勢、
#   一次分数変換（D-034）の入口になる（D-026）。

