          - 加法定理で、それぞれの成分を cos(α + β) か sin(α + β) にまとめましょう。
        explain: 例：「R(θ) = (cos θ、−sin θ；sin θ、cos θ) である。R(β)R(α) の (1, 1) 成分は cos β cos α − sin β sin α = cos(α + β)、(1, 2) 成分は −cos β sin α − sin β cos α = −sin(α + β)、(2, 1) 成分は sin β cos α + cos β sin α = sin(α + β)、(2, 2) 成分は −sin β sin α + cos β cos α = cos(α + β) である（加法定理、G-025）。4 つの成分が R(α + β) の成分と等しいので、R(β)R(α) = R(α + β) である。」と書ければよい。①「〜とする」で R(θ) の成分を書く、② 積を成分ごとに計算する、③ 約束した事実（加法定理、行列が等しいのは成分がすべて等しいとき）で結ぶ、の 3 つがそろっているかを見る。これは「α 回してから β 回すのは、α + β 回すのと同じ」という図形の事実を、行列の計算で確かめたものである。R(α)R(β) も同じく R(α + β) に等しく、回転どうしは積の順を入れかえてよい（行列の積では特別なこと）。
        paths:
          - [R(θ) = (cos θ、−sin θ；sin θ、cos θ) とする, "\"R(β)R(α) の (1, 1) 成分は cos β cos α − sin β sin α など、成分ごとに計算する\"", 加法定理で cos(α + β)、sin(α + β) にまとまる, R(α + β) に等しい]
          - ["(1, 0) を α 回すと (cos α, sin α)、続けて β 回すと、成分は加法定理で (cos(α + β), sin(α + β))", "(0, 1) も同じく (−sin(α + β), cos(α + β)) に移る", 列が R(α + β) の列と等しいので R(β)R(α) = R(α + β)]
      - part: わけ
        id: "c83ee222de"
        text: 行列 A = (a b；c d) で表される 1 次変換で、1 辺 1 の正方形は、図のように u = (a, c) と v = (b, d) を 2 辺とする平行四辺形に移ります。この平行四辺形の面積が |ad − bc| になるわけを、すじ道を立てて書きましょう（u と v は平行でないとします）。
        svg: '<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg"><polygon points="40,160 190,120 250,10 100,50" fill="#f3c969" fill-opacity=".45" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="40" y1="160" x2="182.3" y2="122.1" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="190,120 181.6,127.4 179,117.7" fill="#f08080"/><line x1="40" y1="160" x2="96.2" y2="57" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="100,50 99.6,61.2 90.8,56.4" fill="#7bc96f"/><text x="121" y="160" font-size="14" text-anchor="middle" fill="currentColor">u = (a, c)</text><text x="62" y="105" font-size="14" text-anchor="end" fill="currentColor">v = (b, d)</text><path d="M67 152.8 A28 28 0 0 0 53.6 135.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="76" y="142" font-size="15" font-style="italic" fill="currentColor">θ</text><line x1="100" y1="50" x2="123.4" y2="137.8" stroke="#b39ddb" stroke-width="2.5" stroke-dasharray="5 3" stroke-linecap="round"/><text x="131.4" y="89.9" font-size="13" fill="currentColor">高さ |v| sin θ</text><text x="230" y="170" font-size="14" text-anchor="middle" fill="currentColor">面積 = |u| × 高さ</text></svg>'
        hints:
          - u と v のなす角を θ として、平行四辺形の面積を |u|、|v|、sin θ で表しましょう（図の高さ）。
          - sin²θ = 1 − cos²θ と、cos θ を内積で表す式を使って、面積の 2 乗を内積で表しましょう。
          - 成分で計算して、(ad − bc)² になることを確かめましょう。
        explain: 例：「u と v のなす角を θ とすると、平行四辺形の面積は S = |u||v| sin θ である（三角形の面積 (1/2)|u||v| sin θ の 2 倍、G-024）。sin θ > 0 で sin²θ = 1 − cos²θ、cos θ = (u・v) ÷ (|u||v|)（G-027）なので、S² = |u|²|v|²(1 − cos²θ) = |u|²|v|² − (u・v)² である。成分で計算すると、|u|²|v|² − (u・v)² = (a² + c²)(b² + d²) − (ab + cd)² = a²b² + a²d² + b²c² + c²d² − a²b² − 2abcd − c²d² = a²d² − 2abcd + b²c² = (ad − bc)² である。S は正の数なので、S = |ad − bc| である。」と書ければよい。①「〜とする」で θ を決め、面積を |u||v| sin θ で表す、② S² を内積で表し、成分でかっこをはずして (ad − bc)² にまとめる、③ 約束した事実（三角形の面積の公式、sin²θ + cos²θ = 1、内積となす角）で結ぶ、の 3 つがそろっているかを見る。どんな図形でも面積が |ad − bc| 倍になるのは、図形を小さな正方形の集まりと見ると、どの正方形も |ad − bc| 倍の平行四辺形に移るからだと話す（細かくして近づける考えは積分につながる）。
        paths:
          - [なす角を θ とし、S = |u||v| sin θ, S² = |u|²|v|² − (u・v)², = (a² + c²)(b² + d²) − (ab + cd)² = (ad − bc)², S = |ad − bc|]
          - [a、b、c、d が正の図で、平行四辺形をまわりの長方形でかこむ, 長方形 (a + b)(c + d) から、まわりの三角形 4 つと長方形 2 つをひく, (a + b)(c + d) − ac − bd − 2bc = ad − bc, 向きが逆の図ではふごうが変わるので、面積は |ad − bc|]
