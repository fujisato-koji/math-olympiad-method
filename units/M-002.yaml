        explain: x 軸についての《対称移動》は (x, y) → (x, −y) で、行列は (1 0；0 −1) です。同じように、y 軸については (−1 0；0 1)、原点については (−1 0；0 −1)、直線 y = x については (x, y) → (y, x) で (0 1；1 0) です。原点を中心に k 倍に拡大する変換は (k 0；0 k) です。次に、原点のまわりに角 θ だけ回転する変換を考えます。P を、O からのきょり r と、x 軸の正の向きから測った角 α で P(r cos α, r sin α) と表すと、回転した点は (r cos(α + θ), r sin(α + θ)) です。加法定理（G-025）でかっこをはずすと、x′ = r cos α cos θ − r sin α sin θ = x cos θ − y sin θ、y′ = r sin α cos θ + r cos α sin θ = x sin θ + y cos θ なので、回転を表す行列は R(θ) = (cos θ、−sin θ；sin θ、cos θ) です（成分が式のときは「、」で区切ります）。図の Q は、P を x 軸について対称に移した点 (3, −1) です。θ = 90° では R(90°) = (0 −1；1 0) で、P(3, 1) の《像》は (0 × 3 − 1 × 1, 1 × 3 + 0 × 1) = (−1, 3) です。回転では、(1, 0) は (cos θ, sin θ) に、(0, 1) は (−sin θ, cos θ) に移ります。
