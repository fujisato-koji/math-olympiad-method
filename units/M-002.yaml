    note: 自分自身に移る直線の向きは、後で学ぶ固有ベクトル。ここでは像を直線の式に入れて 2 次方程式にするだけで求まる。m = 1 の直線の上では点は 4 倍の位置に、m = −2 の直線の上では動かない（1 倍）。
  - part: 離
    kinds: [読み取り, 手数]
    text: 画面の図形に、次の 3 つの操作を順に行います。① x 軸について対称に移す。② 原点のまわりに 90° 回す。③ x 座標だけを 3 倍にする（y 座標はそのまま）。この 3 つをまとめて 1 つの 1 次変換とみるとき、それを表す行列の (1, 2) 成分はいくつですか。
    answer: 3
    check: "(lambda A, B: [[sum(A[i][k] * B[k][j] for k in range(len(B))) for j in range(len(B[0]))] for i in range(len(A))])(((3, 0), (0, 1)), (lambda A, B: [[sum(A[i][k] * B[k][j] for k in range(len(B))) for j in range(len(B[0]))] for i in range(len(A))])(((0, -1), (1, 0)), ((1, 0), (0, -1))))[0][1]"
    hints:
      - ① ② ③ を表す行列を、それぞれ書きましょう。
      - あとから行う変換の行列が左にきます。③、②、① の行列の順に並べてかけます。
      - まず ② × ① を計算し、次に ③ を左からかけましょう。
    paths:
      - ["① (1 0；0 −1)、② (0 −1；1 0)、③ (3 0；0 1)", "② × ① = (0 1；1 0)", "③ × (② × ①) = (0 3；1 0)", "\"(1, 2) 成分は 3\""]
    note: 操作の文を行列に読みかえ、かける順（あとの操作が左）を守るのが要点。①、②、③ の行列を左から順にかけると (0 −1；−3 0) になり、(1, 2) 成分は −1 で合わない。まとめた行列の行列式は −3 で、面積は 3 倍になり、図形は裏返る。
