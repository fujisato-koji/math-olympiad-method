    note: 十字の道の挑戦で使った「道をはしへよせる」が、ななめの道（平行四辺形）でもそのまま使えるかが要点。小数のかけ算（N-077）は 16.5 × 10.5 のように桁が多い。2 本目の道では、道の重なり（3 m²）をひき忘れやすい。
