        explain: x が a から b まで変わるとき、(f(b) − f(a))/(b − a) を、x = a から x = b までの平均変化率といいます。1 次関数の変化の割合（A-019）と同じ計算です。f(x) = x² で x が 1 から 3 まで変わると、f(1) = 1、f(3) = 9 なので、平均変化率は (9 − 1)/(3 − 1) = 8/2 = 4 です。これは、グラフの上の 2 点 A(1, 1)、B(3, 9) を通る直線 AB の傾きです。曲線と 2 点で交わる直線 AB を割線といいます。1 次関数の変化の割合はどこでも同じでしたが、x² では区間によって変わります。x が 1 から 2 までなら (4 − 1)/(2 − 1) = 3、2 から 3 までなら (9 − 4)/(3 − 2) = 5 です。物の動きでは、位置の平均変化率が、その時間の平均の速さ（進んだ道のり ÷ かかった時間）になります。
      - part: 思い出す
        text: 2 点 (−1, 5)、(3, −7) を通る直線の傾きはいくつですか。
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-7 - 5, 3 - (-1)))"
        hints:
          - 傾きは、(y の増える量) ÷ (x の増える量) です（A-019）。
          - x の増える量は 3 − (−1) です。
          - y が減っているときは、増える量は負の数です。
        paths:
          - [x の増える量は 4, y の増える量は −7 − 5 = −12, −12 ÷ 4 = −3]
      - part: 思い出す
        text: lim (x→4) (x² − 16)/(x − 4) の値はいくつですか。
        answer: 8
        check: "Fraction((lambda f: (f(4 + 1e-7) + f(4 - 1e-7)) / 2)(lambda x: (x * x - 16) / (x - 4))).limit_denominator(100)"
        hints:
          - x = 4 をそのまま代入すると 0/0 になります。
          - 分子を因数分解しましょう（A-015）。
          - x ≠ 4 として約分してから、x を 4 に近づけましょう（D-003）。
        paths:
          - [x² − 16 = (x + 4)(x − 4), x ≠ 4 なので約分して x + 4, x → 4 のとき 8]
      - part: 今日
        text: 関数 f(x) = x² − 4x で、x が 2 から 5 まで変わるときの平均変化率はいくつですか。
        answer: 3
        check: "(lambda f: Fraction(f(5) - f(2), 5 - 2))(lambda x: x * x - 4 * x)"
        hints:
          - f(2) と f(5) を、それぞれ計算しましょう。
          - 平均変化率は (f(5) − f(2))/(5 − 2) です。
          - f(2) は負の数なので、ひき算の符号に気をつけましょう。
        paths:
          - [f(2) = 4 − 8 = −4、f(5) = 25 − 20 = 5, (5 − (−4))/(5 − 2) = 9/3, 3]
        note: f(2) が負の数なので、5 − (−4) を 5 − 4 としやすい。
      - part: 今日
        text: ボールを静かに落とすと、落ち始めてから t 秒間に落ちる距離は 5t² m です（空気の抵抗は考えません）。t = 1 から t = 3 までの平均の速さは、毎秒何 m ですか。
        answer: 20
        check: "Fraction(5 * 3 ** 2 - 5 * 1 ** 2, 3 - 1)"
        hints:
          - t = 1 と t = 3 までに落ちた距離を、それぞれ求めましょう。
          - この 2 秒の間に落ちた距離は、その差です。
          - 平均の速さは、落ちた距離 ÷ かかった時間です。
        paths:
          - [t = 1 で 5 m、t = 3 で 45 m, 2 秒で 40 m 落ちる, 40 ÷ 2 = 20]
        note: 平均の速さは、距離の関数 5t² の平均変化率。45 ÷ 3 = 15 のように、0 秒からの平均にしてしまうまちがいに気をつける。
      - part: 挑戦
        text: 関数 f(x) = x² で、x が a から a + 2 まで変わるときの平均変化率が 10 になります。a はいくつですか。
        answer: 4
        check: "[a for a in range(-20, 21) if Fraction((a + 2) ** 2 - a ** 2, 2) == 10][0]"
        hints:
          - 平均変化率を、a の式で表しましょう。
          - (a + 2)² を展開すると、a² が消えます。
          - できた式が 10 になる a を、1 次方程式で求めましょう。
        paths:
          - ["((a + 2)² − a²)/2 = (4a + 4)/2 = 2a + 2", 2a + 2 = 10, a = 4]
    extra:
      - part: 今日
        text: 関数 f(x) = x³ で、x が 1 から 2 まで変わるときの平均変化率はいくつですか。
        answer: 7
        check: "Fraction(2 ** 3 - 1 ** 3, 2 - 1)"
        hints:
          - f(1) と f(2) を計算しましょう。
          - 平均変化率は (f(2) − f(1))/(2 − 1) です。
          - x の増える量が 1 なので、y の増える量がそのまま答えです。
        paths:
          - [f(1) = 1、f(2) = 8, (8 − 1)/1 = 7]
      - part: 今日
        text: 関数 f(x) = 6/x で、x が 1 から 3 まで変わるときの平均変化率はいくつですか。
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(Fraction(6, 3) - 6, 3 - 1))"
        hints:
          - f(1) と f(3) を計算しましょう。
          - y の増える量は f(3) − f(1) です。
          - y が減っているので、平均変化率は負の数です。
        paths:
          - [f(1) = 6、f(3) = 2, (2 − 6)/(3 − 1) = −4/2 = −2]
      - part: 挑戦
        text: 関数 f(x) = x² − 3x で、x が a から a + h まで変わるときの平均変化率を表す式はどれですか（h は 0 でない数）。
        choices: [2a + h − 3, 2a − 3, 2a + 2h − 3, a + h − 3]
        answer: 2a + h − 3
        check: "[c for c, g in {'2a + h − 3': lambda a, h: 2 * a + h - 3, '2a − 3': lambda a, h: 2 * a - 3, '2a + 2h − 3': lambda a, h: 2 * a + 2 * h - 3, 'a + h − 3': lambda a, h: a + h - 3}.items() if all(abs(g(a, h) - ((a + h) ** 2 - 3 * (a + h) - (a * a - 3 * a)) / h) < 1e-9 for a, h in ((1, 0.5), (2, 0.3), (-1, 1.7)))][0]"
        hints:
          - 平均変化率は (f(a + h) − f(a))/h です。
          - f(a + h) − f(a) を展開して、同類項をまとめましょう。
          - 分子のどの項にも h があるので、h でわれます。
        paths:
          - ["f(a + h) − f(a) = (a + h)² − 3(a + h) − (a² − 3a)", = 2ah + h² − 3h, h でわって 2a + h − 3]
        note: 2 日目の微分係数の計算の準備。h が 0 に近づくと 2a − 3 になる。

