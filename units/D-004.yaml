# D-004 微分の考え（変化の割合と接線）
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1、わけの深さは ③（水準 3）。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。2〜5 日目は新しいきまりが出るので、頭に見本を置いた。
#   1 日目：平均変化率（A-019 の変化の割合を 2 次関数などに広げる。割線の傾き）、落下の平均の速さ。
#   2 日目：微分係数 f′(a) = lim (h→0) (f(a + h) − f(a))/h を定義で求める、h を小さくした割線と接線、瞬間の速さ。
#   3 日目：接線 y = f′(a)(x − a) + f(a)、接線の傾きが与えられた点、接線と座標軸の交点、図の接線の傾きを読む。
#   4 日目：導関数を定義で求める（x³、ax² + bx + c、1/x、√x）、f′(x)、y′、dy/dx の書き方、y = 1/x と y = √x の接線。
#   5 日目：微分可能と連続、微分できない点（式が切りかわるつなぎ目のかど）、曲線の外の点から引く接線、速さと速度。
#   6 日目：わけ（3 問とも ③：f(x) = x² で f′(a) = 2a、x² の p から q までの平均変化率は p + q で割線は中点での接線と平行、微分可能なら連続）。
#   7 日目：D-003、A-019、A-020、A-038 と混ぜる（頂点での接線、y = 1/x の接線と座標軸の三角形、2 つの放物線の共通な接線、投げ上げ）。8 日目：確認。
# 前提は D-003（関数の極限と連続）。D-003 は別の係が同時に作っているので、中身は「関数の極限 lim (x→a) f(x)（x ≠ a で近づける）、
#   極限の性質（和・差・定数倍・積・商）、0/0 の形の約分と有理化、片側からの極限（x → a + 0、a − 0）、x → ±∞ の極限、連続の定義
#   （lim (x→a) f(x) = f(a)）、中間値の定理」とみなした。たどりには A-038（分数関数と無理関数）、A-037（分数式）、A-020（2 次関数）、
#   A-019（1 次関数）、A-017（2 次方程式）、A-016（平方根）、A-015（展開）、A-012（連立方程式）が入る。A-020、A-037、A-038 も未作成なので、
#   題とその前提から中身をみなした（y = k/(x − p) + q と漸近線、y = √x、平方完成と頂点、分数式の通分）。
# 導関数の公式（(xⁿ)′ = nxⁿ⁻¹、和・定数倍・積・商・合成の微分）は D-005 なので使わない。微分係数と導関数は、いつも定義（h → 0 の極限）で求める。
#   4 日目に定義から求めた結果（(x²)′ = 2x、(x³)′ = 3x²、(ax² + bx + c)′ = 2ax + b、(1/x)′ = −1/x²、(√x)′ = 1/(2√x)）は、
#   求めたあとの日の問題で使ってよいことにした（D-005 はこれを公式にまとめる）。3 日目は、y = x² の x = a での傾き 2a を見本で定義から求めて使う。
#   G-026（直線と円）がたどりにないので、法線（接線に垂直な直線）は扱わない。三角関数と指数・対数もたどりにないので使わない。
#   A-013（不等式）もたどりにないので、h > 0、h < 0 は符号を読むだけにした。
#   絶対値（N-011）もたどりにないので使わない。かどのある関数は「x ≧ 0 のとき x、x < 0 のとき −x」のように、場合分けで決めた関数で表す。(2 + h)³ のような 3 乗の展開は、(2 + h)(2 + h)² と分けて A-015 で展開する。
# この単元で約束した事実（D-005 以降で使う）：平均変化率 = 割線の傾き、微分係数の定義と意味（接線の傾き、瞬間の速さ）、
#   接線の式 y = f′(a)(x − a) + f(a)、導関数の定義と上の 5 つの結果、微分可能なら連続（6 日目）、かどのある関数（左右の差の商の極限がちがう）は微分可能でない（5 日目）。
# 書き方：極限は「lim (h→0) …」と 1 行で書く（教科書では h→0 を lim の下に書く）。h を正の側から 0 に近づけるのは「h → +0」、負の側からは「h → −0」。
#   微分の印は「′」（U+2032）。分数の係数は「(1/2)x²」、分数式は「(f(a + h) − f(a))/h」とかっこでくくる。
# 答えは数を打つ。式・直線・関数を選ぶ問題は choices。check は、微分係数は差分 (f(a + 10⁻⁶) − f(a − 10⁻⁶))/(2 × 10⁻⁶) を
#   Fraction(…).limit_denominator(100) にそろえ、負の数は「−」の形にする。導関数を選ぶ問題は、選択肢の式が差分と x = 0.3、0.8、1.7、2.6 で
#   等しいものを、接線を選ぶ問題は、接点を通り傾きが差分と等しい直線を選び出す。極限は h = ±10⁻⁷ の値の平均（片側なら片側の値）をそろえる。
#   微分可能でない関数を選ぶ問題は、右からと左からの差の商（h = 10⁻⁶）が食いちがうものを選び出す。
# 図は svg（関数のグラフ、割線、接線）。目盛りは答えの値を示さないように選び、答えの値（傾き、切片、交点、面積）は図に書かない。
# 微分の考えは、導関数の計算（D-005）、運動の表し方（P-001）、測定と誤差の線形化（P-117）、反応の速さ（H-023）、非慣性系（P-012）の入口になる（D-026）。

