        explain: x = 1 から x = 1 + h までの平均変化率は、((1 + h)² − 1²)/h = (2h + h²)/h = 2 + h です（h ≠ 0 なので h でわれます）。h を 1、0.5、0.01 と小さくすると 3、2.5、2.01 となり、h → 0 のとき 2 + h は 2 に近づきます（D-003 の極限）。この極限値を、x = 1 における f(x) の微分係数といい、f′(1) と書きます。式では f′(a) = lim (h→0) (f(a + h) − f(a))/h です（教科書では h→0 を lim の下に書きます）。図の点 Q は h = 2、点 Q′ は h = 1 のときの点です。Q を曲線にそって点 P(1, 1) に近づけると、割線 PQ は点線の直線に近づきます。この直線を、点 P における曲線の接線といいます。微分係数 f′(1) は、接線の傾きです。また、位置を表す関数の微分係数は、その時刻の瞬間の速さです。
      - part: 思い出す
        text: lim (h→0) ((1 + h)³ − 1)/h の値はいくつですか。
        answer: 3
        check: "Fraction((lambda f: (f(1e-7) + f(-1e-7)) / 2)(lambda h: ((1 + h) ** 3 - 1) / h)).limit_denominator(100)"
        hints:
          - (1 + h)³ = (1 + h)(1 + h)² を展開しましょう。
          - 分子の 1 が消えて、どの項にも h が残ります。
          - h ≠ 0 として h でわってから、h を 0 に近づけましょう。
        paths:
          - ["(1 + h)³ − 1 = 3h + 3h² + h³", h でわって 3 + 3h + h², h → 0 のとき 3]
      - part: 思い出す
        text: 関数 f(x) = 3x² で、x が 1 から 2 まで変わるときの平均変化率はいくつですか。
        answer: 9
        check: "Fraction(3 * 2 ** 2 - 3 * 1 ** 2, 2 - 1)"
        hints:
          - f(1) と f(2) を計算しましょう。
          - 平均変化率は (f(2) − f(1))/(2 − 1) です。
          - 3x² は、x² を計算してから 3 倍します。
        paths:
          - [f(1) = 3、f(2) = 12, (12 − 3)/1 = 9]
      - part: 今日
        text: 関数 f(x) = x² の、x = −2 における微分係数 f′(−2) はいくつですか。定義にしたがって求めましょう。
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda f, a: Fraction((f(a + 1e-6) - f(a - 1e-6)) / 2e-6).limit_denominator(100))(lambda x: x * x, -2))"
        hints:
          - (f(−2 + h) − f(−2))/h を計算しましょう。
          - (−2 + h)² を展開すると、4 が消えます。
          - h でわってから、h を 0 に近づけましょう。
        paths:
          - ["((−2 + h)² − 4)/h = (−4h + h²)/h", = −4 + h, h → 0 のとき −4]
        note: 微分係数は負の数にもなる。x = −2 では、グラフは右下がりで、接線の傾きが負になる。
      - part: 今日
        text: 関数 f(x) = 3x² − x の、x = 1 における微分係数 f′(1) はいくつですか。
        answer: 5
        check: "(lambda f, a: Fraction((f(a + 1e-6) - f(a - 1e-6)) / 2e-6).limit_denominator(100))(lambda x: 3 * x * x - x, 1)"
        hints:
          - f(1) を先に計算しておきましょう。
          - f(1 + h) − f(1) を展開して、同類項をまとめましょう。
          - h でわってから、h を 0 に近づけましょう。
        paths:
          - ["f(1) = 2、f(1 + h) = 3(1 + h)² − (1 + h) = 2 + 5h + 3h²", (f(1 + h) − f(1))/h = 5 + 3h, h → 0 のとき 5]
      - part: 挑戦
        text: 関数 f(x) = x³ − 2x の、x = 2 における微分係数 f′(2) はいくつですか。
        answer: 10
        check: "(lambda f, a: Fraction((f(a + 1e-6) - f(a - 1e-6)) / 2e-6).limit_denominator(100))(lambda x: x ** 3 - 2 * x, 2)"
        hints:
          - (2 + h)³ は、(2 + h)(2 + h)² として展開しましょう。
          - f(2 + h) − f(2) では、数の項が消えます。
          - h でわったあと、h のついた項は h → 0 で 0 に近づきます。
        paths:
          - ["(2 + h)³ = 8 + 12h + 6h² + h³", "f(2 + h) − f(2) = 12h + 6h² + h³ − 2h = 10h + 6h² + h³", h でわって h → 0 のとき 10]
        note: 3 乗の展開を、(2 + h)² を先に求めてから (2 + h) をかける順にすると、まちがいが少ない。
    extra:
      - part: 今日
        text: ボールを静かに落とすと、t 秒間に落ちる距離は 5t² m です。落ち始めてから 4 秒後の瞬間の速さは、毎秒何 m ですか。
        answer: 40
        check: "(lambda f, a: Fraction((f(a + 1e-6) - f(a - 1e-6)) / 2e-6).limit_denominator(100))(lambda t: 5 * t * t, 4)"
        hints:
          - 瞬間の速さは、距離の関数の微分係数です。
          - t = 4 から t = 4 + h までの平均の速さを、h の式で表しましょう。
          - h を 0 に近づけましょう。
        paths:
          - ["(5(4 + h)² − 80)/h = (40h + 5h²)/h", = 40 + 5h, h → 0 のとき 40]
      - part: 今日
        text: 関数 f(x) = x² + 3x で、(f(1 + h) − f(1))/h を簡単にした式はどれですか（h は 0 でない数）。
        choices: [5 + h, 5 + 2h, 2 + h, "5"]
        answer: 5 + h
        check: "[c for c, g in {'5 + h': lambda h: 5 + h, '5 + 2h': lambda h: 5 + 2 * h, '2 + h': lambda h: 2 + h, '5': lambda h: 5}.items() if all(abs(g(h) - ((1 + h) ** 2 + 3 * (1 + h) - 4) / h) < 1e-9 for h in (0.5, 0.3, 1.7))][0]"
        hints:
          - f(1) を先に計算しましょう。
          - f(1 + h) を展開して、f(1) をひきましょう。
          - 分子を h でわります。h → 0 にするのはこの後です。
        paths:
          - ["f(1) = 4、f(1 + h) = 4 + 5h + h²", (5h + h²)/h = 5 + h]
        note: 「5」は、h → 0 の極限をとったあとの値（微分係数 f′(1)）。簡単にしただけの式とは区別する。
      - part: 挑戦
        text: 関数 f(x) = −2x² + 5 の、x = 3 における微分係数 f′(3) はいくつですか。
        answer: −12
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda f, a: Fraction((f(a + 1e-6) - f(a - 1e-6)) / 2e-6).limit_denominator(100))(lambda x: -2 * x * x + 5, 3))"
        hints:
          - f(3) を先に計算しましょう。
          - −2(3 + h)² を展開するとき、かっこの外の −2 をすべての項にかけましょう。
          - h でわってから、h を 0 に近づけましょう。
        paths:
          - ["f(3) = −13、f(3 + h) = −2(9 + 6h + h²) + 5 = −13 − 12h − 2h²", (f(3 + h) − f(3))/h = −12 − 2h, h → 0 のとき −12]

