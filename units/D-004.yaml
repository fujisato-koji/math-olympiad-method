    check: "(lambda ps: Fraction(abs(ps[0] * (ps[1] ** 2 + 5) + ps[1] * (-5 - ps[0] ** 2) + 2 * (ps[0] ** 2 - ps[1] ** 2)) / 2).limit_denominator(100))([a for a in range(-20, 21) if abs((lambda f: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: x * x) * (2 - a) + a * a + 5) < 1e-5])"
    hints:
      - 接点を (a, a²) として、接線が点 R を通る条件から a の 2 次方程式をつくりましょう。
      - P、Q の座標が出たら、直線 PQ の式を求めましょう。
      - R を通る縦の直線で三角形を 2 つに分けると、面積が求めやすくなります。
    paths:
      - ["\"接点 (a, a²) の接線 y = 2ax − a² が R を通る\"", "−5 = 4a − a² より a² − 4a − 5 = 0", "\"a = −1、5 で P(−1, 1)、Q(5, 25)\"", "直線 PQ は y = 4x + 5 で x = 2 のとき y = 13", "縦の線分の長さは 13 − (−5) = 18", "面積は 18 × (5 − (−1)) ÷ 2 = 54"]
    note: 接線の式、2 次方程式（A-017）、三角形の面積（G-008）を合わせ、途中の値（接点の座標、直線 PQ の式）を覚えておく。縦の線分で分けると、2 つの三角形の高さの和が P と Q の x 座標の差 6 になる。接点の x 座標の差を d とすると面積はいつも d³/4 になるが、そこまでは求めない。
  - part: 離
    kinds: [道筋]
    text: 関数 f(x) は x = 1 で微分可能で、f′(1) = 4 です。lim (h→0) (f(1 + 3h) − f(1 − h))/h の値はいくつですか。
    answer: 16
    check: "(lambda g: g(lambda x: 2 * x * x) if abs(g(lambda x: 2 * x * x) - g(lambda x: x ** 3 + x)) < 1e-4 else 0)(lambda f: Fraction(((f(1 + 3e-7) - f(1 - 1e-7)) / 1e-7 + (f(1 - 3e-7) - f(1 + 1e-7)) / -1e-7) / 2).limit_denominator(100))"
    hints:
      - 分子から f(1) をひいて足し、2 つの差 f(1 + 3h) − f(1) と f(1 − h) − f(1) に分けましょう。
      - (f(1 + 3h) − f(1))/h は、3 × (f(1 + 3h) − f(1))/(3h) と書けます。h → 0 のとき 3h → 0 です。
      - (f(1 − h) − f(1))/h も、微分係数の定義の形 (f(1 + k) − f(1))/k にそろえましょう。
    paths:
      - ["分子 = (f(1 + 3h) − f(1)) − (f(1 − h) − f(1))", "(f(1 + 3h) − f(1))/h = 3 × (f(1 + 3h) − f(1))/(3h) → 3 × 4 = 12", "(f(1 − h) − f(1))/h = −(f(1 − h) − f(1))/(−h) → −4", 12 − (−4) = 16]
    note: f の式がわからないまま、定義の形 (f(a + k) − f(a))/k（k → 0）にそろえるのが離の道筋。3h や −h を 1 つの文字 k とみる。f(x) = 2x² のような例で 16 を確かめてもよいが、例では「どんな f でも」は示せないことを話す。
  - part: 離
    kinds: [数]
    text: 曲線 y = (1/2)x² − (2/3)x の上の、x 座標が 3/4 の点における接線と、x 軸の交点の x 座標はいくつですか。
    answer: 27/8
    accept: [3.375]
    check: "Fraction((lambda f, a: a - f(a) / ((f(a + 1e-6) - f(a - 1e-6)) / 2e-6))(lambda x: x * x / 2 - 2 * x / 3, 0.75)).limit_denominator(100)"
    hints:
      - 導関数は (ax² + bx + c)′ = 2ax + b で求められます（4 日目）。
      - 接点の y 座標 f(3/4) は、分母をそろえて計算しましょう。負の数になります。
      - 接線の式で y = 0 とおき、x について解きましょう。
    paths:
      - [y′ = x − 2/3, "x = 3/4 で傾きは 3/4 − 2/3 = 1/12", "f(3/4) = 9/32 − 1/2 = −7/32", "接線は y = (1/12)(x − 3/4) − 7/32", "y = 0 で x − 3/4 = (7/32) × 12 = 21/8", x = 27/8]
    note: 分母のちがう《分数》（4、3、12、32、8）が続く。傾きが小さい正の数 1/12 なので、交点は接点から右へ大きく離れる。−7/32 の符号と、(7/32) × 12 = 84/32 = 21/8 の約分でまちがえやすい。
