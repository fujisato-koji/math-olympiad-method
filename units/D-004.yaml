        text: 2 つの放物線 y = x² と y = x² − 4x + 8 の両方に接する直線が 1 本あります。その直線の y 切片はいくつですか。
        answer: −1
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda f, g, d: [Fraction(f(a) - a * d(f, a)).limit_denominator(100) for a in range(-10, 11) for b in range(-10, 11) if abs(d(f, a) - d(g, b)) < 1e-5 and abs(f(a) - a * d(f, a) - g(b) + b * d(g, b)) < 1e-5][0])(lambda x: x * x, lambda x: x * x - 4 * x + 8, lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6))"
        hints:
          - y = x² の接点の x 座標を a、もう一方の接点の x 座標を b として、2 本の接線の式を書きましょう。
          - 同じ直線なので、傾きどうし、切片どうしが等しくなります。
          - a と b の連立方程式を解きましょう（A-012）。
        paths:
          - [y = x² の x = a の接線は y = 2ax − a², もう一方の x = b の接線は y = (2b − 4)x − b² + 8, 2a = 2b − 4 と a² = b² − 8, a = b − 2 を代入して b = 3、a = 1, 接線は y = 2x − 1 で切片は −1]
        note: 「両方に接する」を「接線の式が一致する」と言いかえるのが要点。(b − 2)² = b² − 8 は、展開すると b² が消えて 1 次方程式になる。
