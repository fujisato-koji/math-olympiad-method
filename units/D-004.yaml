        explain: 例：「f(x) は x = a で微分可能とし、その微分係数を f′(a) とする。h ≠ 0 のとき、f(a + h) − f(a) = ((f(a + h) − f(a))/h) × h と書ける（h でわって h をかけ、もとにもどしただけ）。h → 0 のとき、(f(a + h) − f(a))/h は f′(a) に、h は 0 に近づくので、積の極限は極限の積という性質（D-003）より、f(a + h) − f(a) は f′(a) × 0 = 0 に近づく。よって lim (h→0) f(a + h) = f(a) で、x = a + h とおくと lim (x→a) f(x) = f(a) である。これは、f(x) が x = a で連続であること（連続の定義、D-003）にほかならない。」と書ければよい。①「〜とする」で f′(a) があることを決める、② f(a + h) − f(a) を（差の商）× h と変形する、③ 約束した事実（極限の性質、連続の定義）で結ぶ、の 3 つと結論がそろっているかを見る。逆は成り立たないこと（5 日目の見本の、x ≧ 0 で x、x < 0 で −x と決めた関数は、x = 0 で連続だが微分可能でない）にも触れる。「接線が引けるのでグラフはつながっている」のような図だけの説明で終わっていたら、式で示すことを話す。
        hints:
          - f(a + h) − f(a) を、(f(a + h) − f(a))/h と h の積の形に書きましょう。
          - h → 0 のとき、2 つの因数はそれぞれ何に近づくでしょう。
          - 連続の定義 lim (x→a) f(x) = f(a) と結びつけましょう。
        paths:
          - [f′(a) があるとする, "f(a + h) − f(a) = ((f(a + h) − f(a))/h) × h", h → 0 のとき f′(a) × 0 = 0 に近づく, lim (x→a) f(x) = f(a) なので連続]
