        check: "(lambda f, a: (lambda m: Fraction((a * m - f(a) - 2) / (m - 1)).limit_denominator(100))((f(a + 1e-6) - f(a - 1e-6)) / 2e-6))(lambda x: -x * x + 2 * x + 3, 2)"
        hints:
