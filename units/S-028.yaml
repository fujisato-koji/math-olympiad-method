        explain: 6 この人から 2 こを 2 この人へ、5 この人から 1 こを 3 この人へ動かすと、みんな 4 こになります。このように、でこぼこをならして同じ大きさにした数を平均（へいきん）といいます。動かしても全部の数（合計）は 16 このままなので、平均は 合計 ÷ 人数 で、16 ÷ 4 = 4 と計算できます。
      - part: 思い出す
        text: 42 ÷ 6 はいくつですか。
        answer: 7
