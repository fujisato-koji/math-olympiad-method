# S-028 平均と代表値
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く（N-014 にならい小 3 までの漢字。
#   求・順・選・残・確 などはかなで書く）。言葉の名前（平均、中央値、最頻値、範囲、代表値）は漢字で書き、2 日目の見本で読みをそえる。
# 前提は S-027（表とグラフ）、N-014（わり算とあまり）、N-020（小数）。たどると N-007（2 けたのたし算とひき算）、
#   N-009（1000 までの数）、N-013（九九）、N-016（分数の意味）。
#   かけ算とわり算の筆算（N-074、N-075）と小数のかけ算とわり算（N-077）は前提にないので、合計 ÷ 個数 は九九の範囲
#   （わる数 1〜9、答え 9 まで）にする。大きい数の平均は、いちばん小さい数をもとにして、それより多い分だけをならす
#   （仮の平均。3 日目のわけで、そうしてよいわけを書く）。
#   わり切れないときは、N-020 の 4 日目のとおり、あまりを 0.1 のいくつ分とみて分ける（26 ÷ 4 = 6 あまり 2、2 は 0.1 の 20 こ分、
#   4 で分けて 5 こ分なので 6.5）。データが偶数こ のときの中央値（5 と 6 のまん中で 5.5）も同じ考えで出す。
#   長さ・重さ（G-046）、時刻と時間（N-059）、お金（N-060）は前提にないので、場面は点数、回数、こ数、さっ数にする。
#   かさの L は N-020 で使っているので、小数のデータに使う。
# 範囲（いちばん大きい数 − いちばん小さい数）は、代表値とならぶ「広がり」の入口として 2 日目の見本で名前を出す
#   （13+ の論題「代表値と範囲」）。四分位数と箱ひげ図、度数分布は S-029。
# check：平均は Fraction(合計, 個数)（わり切れなければ分数になって答えと合わないので、わり切れることも確かめられる）。
#   小数の答えは (lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)(…) で小数の文字にする。
#   中央値は sorted(データ) の真ん中。最頻値は max(set(d), key=d.count)。図の 🟦 は n('🟦') と fig.splitlines() で数える。
# 日の並びは地図の既定（導入・練習・わけ・混ぜる・確認）。ねらいは次のとおりにした。
#   1 日目 導入：平均（ならす、合計 ÷ 個数、合計 = 平均 × 個数、0 もデータに入れる）。
#   2 日目 練習：中央値、最頻値、範囲（頭に見本）。データが偶数こ の中央値と、わり切れない平均は小数で。
#   3 日目 わけ：合計 ÷ 個数 でよいわけ（ならしても合計はかわらない）、外れた数があるときは中央値がよいわけ、仮の平均でよいわけ。
#   4 日目 混ぜる：S-027（棒グラフ、表）、N-014（あまり）、N-020（小数）と、1〜3 日目の型を混ぜる。
#   5 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-046、N-059、N-074、N-075、N-077 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

