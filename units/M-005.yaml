        explain: |-
          1 次独立は「どのベクトルも、他のベクトルの組み合わせでは作れない」ことです。
          (1,0)、(0,1) は独立。(1,2)、(2,4) は (2,4)=2(1,2) なので従属です。
          基底は、V 全体を張る独立な組。R² なら 2 本必要です。
        note: 1 次独立は係数がすべて 0 のときだけ 0 になる。基底は V を張る独立な組。
