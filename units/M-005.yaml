  - day: 10
    items:
      - part: わけ
        id: "e5e525f66a"
        text: 部分空間の条件が「零ベクトルを含み、和とスカラー倍で閉じている」の 3 つでよいわけを説明しましょう。
        explain: 「零ベクトルを含めば空でない。和で閉じていれば足し算ができ、スカラー倍で閉じていれば定数倍ができる。逆ベクトルは (−1) 倍で作れる。結合法則や分配法則は、もとの空間 V で成り立つものがそのまま使える。だから 3 つで部分空間になる。」と書ければよい。① 零ベクトル、② 和とスカラー倍、③ 逆ベクトルは −1 倍。子どもには、原点を通る直線で確かめさせます。
        hints:
          - 零ベクトルを含めば、空ではありません。
          - text: 部分空間のベクトル a に、定数 −1 をかけるとどうなるか見ます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="92" y1="185.6" x2="92" y2="22.4" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="126" y1="185.6" x2="126" y2="22.4" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="194" y1="185.6" x2="194" y2="22.4" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="228" y1="185.6" x2="228" y2="22.4" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="64.8" y1="172" x2="255.2" y2="172" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="64.8" y1="138" x2="255.2" y2="138" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="64.8" y1="70" x2="255.2" y2="70" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="64.8" y1="36" x2="255.2" y2="36" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="64.8" y1="104" x2="260.1" y2="104" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="267.1,104 260.1,107.5 260.1,100.5" fill="currentColor"/><line x1="160" y1="185.6" x2="160" y2="17.5" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="160,10.5 163.5,17.5 156.5,17.5" fill="currentColor"/><text x="269.1" y="119" font-size="13" text-anchor="end" fill="currentColor">x</text><text x="166" y="14.5" font-size="13" text-anchor="start" fill="currentColor">y</text><line x1="64.8" y1="151.6" x2="255.2" y2="56.4" fill="none" stroke="#7fc8f8" stroke-width="4"/><circle cx="160" cy="104" r="5" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="168" y="122" font-size="14" text-anchor="start" fill="currentColor">0</text><line x1="160" y1="104" x2="220" y2="74" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="228,70 222,78 217.9,70" fill="#f08080"/><text x="234" y="84" font-size="14" text-anchor="start" fill="currentColor">a</text><line x1="160" y1="104" x2="100" y2="134" fill="none" stroke="#7bc96f" stroke-width="3"/><polygon points="92,138 98,130 102.1,138" fill="#7bc96f"/><text x="86" y