#
# 段 8・水準 4・12 日。前提は M-004（行列式）。
# ベクトル空間、部分空間、1 次独立と基底、次元、線形写像、核と像、次元定理、表現行列、基底の変換を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: M-005
days:
  - day: 1
    items:
      - part: 見本
        id: "7a771364e3"
        text: |-
          ベクトル空間は、足し算と定数倍（スカラー倍）ができる集合です。
          図の u と v を足した u+v も、u を 2 倍した 2u も、同じ平面の中にあります。
          どのベクトルに足しても変わらないベクトルが零ベクトル 0、足すと 0 になるベクトルが逆ベクトル −u です。
          R²、R³、多項式の全体、関数の全体は、どれもベクトル空間です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="78" y1="185.6" x2="78" y2="48" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="142" y1="185.6" x2="142" y2="48" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="174" y1="185.6" x2="174" y2="48" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="206" y1="185.6" x2="206" y2="48" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="238" y1="185.6" x2="238" y2="48" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="78" y1="128" x2="238" y2="128" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="78" y1="96" x2="238" y2="96" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="78" y1="64" x2="238" y2="64" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="78" y1="160" x2="242.2" y2="160" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="249.2,160 242.2,163.5 242.2,156.5" fill="currentColor"/><line x1="110" y1="185.6" x2="110" y2="43.8" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="110,36.8 113.5,43.8 106.5,43.8" fill="currentColor"/><text x="251.2" y="175" font-size="13" text-anchor="end" fill="currentColor">x</text><text x="116" y="40.8" font-size="13" text-anchor="start" fill="currentColor">y</text><line x1="110" y1="160" x2="166" y2="132" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="174,128 168,136 163.9,128" fill="#f08080"/><text x="180" y="142" font-size="14" text-anchor="start" fill="currentColor">u</text><line x1="110" y1="160" x2="138" y2="104" fill="none" stroke="#7fc8f8" stroke-width="3"/><polygon points="142,96 142,106.1 134,102" fill="#7fc8f8"/><text x="136" y="90" font-size="14" text-anchor="end" fill="currentColor">v</text><line x1="110" y1="160" x2="199.6" y2="70.4" fill="none" stroke="#7bc96f" stroke-width="3"/><polygon points="206,64 202.8,73.5 196.5,67.2" fill="#7bc96f"/><text x="212" y="60" font-size="14" text-anchor="start" fill="currentColor">u+v</text><line x1="174" y1="128" x2="202" y2="72" fill="none" stroke="#7fc8f8" stroke-width="2" stroke-dasharray="5 3"/><polygon points="206,64 206,74.1 198,70" fill="#7fc8f8"/><line x1="142" y1="96" x2="198" y2="68" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="5 3"/><polygon points="206,64 200,72 195.9,64" fill="#f08080"/><line x1="110" y1="160" x2="230" y2="100" fill="none" stroke="#b39ddb" stroke-width="3"/><polygon points="238,96 232,104 227.9,96" fill="#b39ddb"/><text x="244" y="100" font-size="14" text-anchor="start" fill="currentColor">2u</text></svg>'
        explain: |-
          【定義】ベクトル空間は、「足し算と定数倍が自由にできて、分配法則などが成り立つ世界」です。
          ① 和について可換群：u+v = v+u、(u+v)+w = u+(v+w)、零ベクトル 0、逆ベクトル −u。
          ② スカラー倍：a(bu) = (ab)u、1u = u。
          ③ 分配法則：a(u+v) = au+av、(a+b)u = au+bu。
          R² のベクトル (x,y) は、成分ごとに足し、定数倍します。多項式も、足し算と定数倍ができ、同じ決まりを満たします。
        note: ベクトル空間は和とスカラー倍の決まりを満たす集合。R²、多項式、関数が例。
