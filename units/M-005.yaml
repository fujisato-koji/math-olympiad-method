          次元定理（階数・退化次数）：T：V → W が線形写像のとき、dim V = dim ker T + dim im T。
          dim im T を階数、dim ker T を退化次数といいます。
          図は T：R³ → R³、T(x,y,z) = (x, y, 0)。左の赤い z 軸（核）が 0 に潰れ、右の青い xy 平面（像）が残ります。
          核は 1 次元、像は 2 次元で、1 + 2 = 3 = dim R³ です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="77.7" y1="114.6" x2="50.2" y2="133.8" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="44.5,137.8 48.2,131 52.2,136.7" fill="currentColor"/><line x1="54.7" y1="120" x2="114" y2="120" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="121,120 114,123.5 114,116.5" fill="currentColor"/><line x1="70" y1="135.3" x2="70" y2="76" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="70,69 73.5,76 66.5,76" fill="currentColor"/><line x1="70" y1="150" x2="70" y2="72" fill="none" stroke="#f08080" stroke-width="5"/><polygon points="181.5,133.7 265.5,133.7 304.5,106.3 220.5,106.3" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><line x1="247.7" y1="114.6" x2="220.2" y2="133.8" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="214.5,137.8 218.2,131 222.2,136.7" fill="currentColor"/><line x1="224.7" y1="120" x2="284" y2="120" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="291,120 284,123.5 284,116.5" fill="currentColor"/><line x1="240" y1="135.3" x2="240" y2="76" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="240,69 243.5,76 236.5,76" fill="currentColor"/><line x1="140" y1="110" x2="172" y2="110" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="180,110 172,114 172,106" fill="currentColor"/><text x="160" y="100" font-size="16" text-anchor="middle" fill="currentColor">T</text><text x="80" y="185" font-size="14" text-anchor="middle" fill="currentColor">核：z 軸（1 次元）</text><text x="240" y="185" font-size="14" text-anchor="middle" fill="currentColor">像：xy 平面（2 次元）</text><text x="160" y="24" font-size="16" text-anchor="middle" fill="currentColor">3 = 1 + 2</text></svg>'
        explain: |-
          定義域の次元は、「潰れる方向」と「残る像」に分かれます。
          T(x,y,z)=(x,y,0) は z を忘れる写像。z 方向が核、x,y 方向が像です。
          核が大きいほど、像は小さくなります。
        note: dim V = dim ker T + dim im T。核と像の次元の和は定義域の次元。
