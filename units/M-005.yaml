      - part: わけ
        id: "5d182830b8"
        text: 基底を変えると表現行列が P⁻¹AP になるわけを説明しましょう。
        explain: 「新しい座標 x' から古い座標へは x = P x'。古い座標で T を行うと A x。それを新しい座標に戻すと P⁻¹ A x = P⁻¹ A P x'。だから新しい表現行列は P⁻¹AP。」と書ければよい。① x = P x'、② A で写す、③ P⁻¹ で戻す。子どもには、2 次元の例で確かめさせます。
        hints:
          - 新しい座標を古い座標に直します。
          - text: 古い座標で A をかけ、新しい座標に戻す道を見ます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="60" y="66" font-size="16" text-anchor="middle" fill="currentColor">x′</text><text x="260" y="66" font-size="16" text-anchor="middle" fill="currentColor">y′</text><text x="60" y="168" font-size="16" text-anchor="middle" fill="currentColor">x</text><text x="260" y="168" font-size="16" text-anchor="middle" fill="currentColor">y</text><line x1="85" y1="62" x2="225" y2="62" fill="none" stroke="#c8ccd6" stroke-width="2" stroke-dasharray="5 3"/><polygon points="235,62 225,67 225,57" fill="#c8ccd6"/><text x="160" y="52" font-size="16" text-anchor="middle" fill="currentColor">A′</text><line x1="60" y1="78" x2="60" y2="134" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="60,144 55,134 65,134" fill="#f08080"/><text x="38" y="116" font-size="16" text-anchor="middle" fill="currentColor">① P</text><line x1="85" y1="164" x2="225" y2="164" fill="none" stroke="#7fc8f8" stroke-width="3"/><polygon points="235,164 225,169 225,159" fill="#7fc8f8"/><text x="160" y="154" font-size="16" text-anchor="middle" fill="currentColor">② A</text><line x1="260" y1="144" x2="260" y2="88" fill="none" stroke="#7bc96f" stroke-width="3"/><polygon points="260,78 265,88 255,88" fill="#7bc96f"/><text x="298" y="116" font-size="16" text-anchor="middle" fill="currentColor">③ P⁻¹</text></svg>'
          - 新しい座標 x′ から出発して、①②③ の順に、式を右から並べます。
        paths:
          - [x=Px′, A x, P⁻¹ A P x′, P⁻¹AP]
          - [古い座標へ直す, T を行う, 新しい座標へ戻す, 順に式を並べる]
