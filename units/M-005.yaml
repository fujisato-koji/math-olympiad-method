      - part: 見本
        id: "2efca48074"
        text: |-
          部分空間は、ベクトル空間 V の中にあって、それ自身もベクトル空間になる集合です。
          確かめることは 3 つ：① 零ベクトル（原点）を含む、② 和で外に出ない、③ 定数倍で外に出ない。
          左の図の原点を通る直線は、直線上の 2 点 a、b を足した a+b も直線の上なので、部分空間です。
