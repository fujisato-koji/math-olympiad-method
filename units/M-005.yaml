        id: "508de6ba88"
        text: |-
          1 次独立：c₁v₁ + … + cₙvₙ = 0 となるのが c₁ = … = cₙ = 0 のときだけなら、v₁、…、vₙ は 1 次独立です。0 でない係数でも 0 にできるなら、1 次従属です。
          左の図のように、向きがちがう 2 本は 1 次独立（平行四辺形で平面がうまる）。右の図のように、同じ直線の上にある 2 本は 1 次従属です。
          基底：V のどのベクトルも 1 次結合で書けて、しかも 1 次独立なベクトルの組。R² の標準基底は (1,0)、(0,1) です。
