      - part: わけ
        id: "a811f517cd"
        text: 次元定理 dim V = dim ker T + dim im T が成り立つわけを説明しましょう。
        explain: 「核の基底を取って、それを V の基底まで延ばす。延ばしたベクトルの像が像空間の基底になる。核の次元と延ばした本数の和が V の次元、延ばした本数が像の次元。だから dim V = dim ker + dim im。」と書ければよい。① 核の基底を延ばす、② 延ばした像が像の基底、③ 本数を数える。子どもには、R³→R² の例で確かめさせます。
        hints:
          - text: V の基底を、核の基底（赤）と、延ばした分（青）に分けて考えます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="54" width="52" height="36" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="82" y="54" width="52" height="36" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="134" y="54" width="52" height="36" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="186" y="54" width="52" height="36" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="238" y="54" width="52" height="36" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="82" y="46" font-size="14" text-anchor="middle" fill="currentColor">核の基底</text><text x="212" y="46" font-size="14" text-anchor="middle" fill="currentColor">延ばした分</text></svg>'
          - text: 核の基底は T で 0 にうつり、延ばした分は、像の基底にうつります。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="50" width="52" height="36" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="82" y="50" width="52" height="36" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="134" y="50" width="52" height="36" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="186" y="50" width="52" height="36" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="238" y="50" width="52" height="36" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><line x1="82" y1="92" x2="82" y2="116" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="82,124 78,116 86,116" fill="currentColor"/><line x1="212" y1="92" x2="212" y2="116" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="212,124 208,116 216,116" fill="currentColor"/><text x="100" y="112" font-size="16" text-anchor="start" fill="currentColor">T</text><text x="230" y="112" font-size="16" text-anchor="start" fill="currentColor">T</text><text x="82" y="148" font-size="14" text-anchor="middle" fill="currentColor">0 にうつる</text><text x="212" y="148" font-size="14" text-anchor="middle" fill="currentColor">像の基底</text></svg>'
          - 核の基底の本数と、延ばした分の本数を足すと、V の次元になります。
