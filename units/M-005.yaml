    items:
      - part: 見本
        id: "676dea74c5"
        text: |-
          基底の変換：古い基底（標準基底）から新しい基底 b₁、b₂ に取りかえると、同じ点でも座標の数が変わります。
          図の点 S = (3,2) は、新しい基底では S = 1・b₁ + 2・b₂ なので、新しい座標は (1, 2) です。
          新しい座標 x' と古い座標 x は、x = P x' の関係です。P の列は、新しい基底のベクトルを古い基底で書いたもの（ここでは b₁ = (1,0)、b₂ = (1,1)）です。
          線形写像の行列 A は、基底を変えると A' = P⁻¹ A P になります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="90" y1="174" x2="90" y2="60" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="120" y1="174" x2="120" y2="60" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="150" y1="174" x2="150" y2="60" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="36" y1="120" x2="165" y2="120" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="36" y1="90" x2="165" y2="90" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="36" y1="60" x2="165" y2="60" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="36" y1="150" x2="168.5" y2="150" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="175.5,150 168.5,153.5 168.5,146.5" fill="currentColor"/><line x1="60" y1="174" x2="60" y2="56.5" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="60,49.5 63.5,56.5 56.5,56.5" fill="currentColor"/><text x="177.5" y="165" font-size="13" text-anchor="end" fill="currentColor">x</text><text x="66" y="53.5" font-size="13" text-anchor="start" fill="currentColor">y</text><line x1="60" y1="150" x2="81" y2="150" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="90,150 81,154.5 81,145.5" fill="#f08080"/><text x="90" y="167" font-size="14" text-anchor="middle" fill="currentColor">b₁</text><line x1="60" y1="150" x2="83.6" y2="126.4" fill="none" stroke="#7fc8f8" stroke-width="3"/><polygon points="90,120 86.8,129.5 80.5,123.2" fill="#7fc8f8"/><text x="84" y="114" font-size="14" text-anchor="end" fill="currentColor">b₂</text><line x1="90" y1="120" x2="113.6" y2="96.4" fill="none" stroke="#7fc8f8" stroke-width="3" stroke-dasharray="5 3"/><polygon points="120,90 116.8,99.5 110.5,93.2" fill="#7fc8f8"/><line x1="120" y1="90" x2="141" y2="90" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="5 3"/><polygon points="150,90 141,94.5 141,85.5" fill="#f08080"/><circle cx="150" cy="90" r="5" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="158" y="84" font-size="14" text-anchor="start" fill="currentColor">S</text><text x="250" y="60" font-size="16" text-anchor="middle" fill="currentColor">S = (3, 2)</text><text x="250" y="92" font-size="16" text-anchor="middle" fill="currentColor">= 1・b₁ + 2・b₂</text><text x="250" y="126" font-size="16" text-anchor="middle" fill="currentColor">新座標 (1, 2)</text></svg>'
        explain: |-
          基底を変えると、同じベクトルでも座標の数値が変わります。
          変換行列 P は、新しい座標を古い座標に直す行列。
          表現行列は P⁻¹AP で変換されます。相似な行列は同じ線形写像を表します。
        note: x = P x'、A' = P⁻¹AP。P の列は新しい基底の古い座標。
      - part: 今日
