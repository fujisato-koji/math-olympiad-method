        text: |-
          核と像は、線形写像 T：V → W が、どの方向を 0 に潰し、どこまで届くかを表します。
          核 ker T は T(v) = 0 となる v の全体、像 im T は T(v) の全体で、どちらも部分空間です。
          図は T(x,y) = (x−y, x−y)：左の赤い直線（核）の上の点は、すべて 0 に潰れます。右の青い直線が像です。
          T が単射（ちがうベクトルが、ちがう先へうつる）なのは、ker T = {0} のとき。全射（W 全体に届く）なのは、im T = W のときです。
