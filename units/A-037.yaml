# A-037 分数式と部分分数分解
#
# 書き方は N-001 の頭の注のとおり。段 5 の決まりは A-019 の頭の注と同じ（思い出す 2・今日 2・挑戦 1、各日に予備 3 問）。
#   練習の日は新しい決まりが出るので頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：分数式、値が決まらない x（分母が 0）、約分（因数分解してから）、かけ算とわり算。
#   2 日目：たし算とひき算（通分）、分子を分母で書きかえて「数 + 分数式」にする、繁分数式。
#   3 日目：恒等式、部分分数分解（代入で係数を決める）、となりどうしが消える和（1/(1 × 2) + 1/(2 × 3) + …）。
#   4 日目：わけ。5 日目：A-015、N-019 と混ぜる（式の値、x + 1/x の値から x² + 1/x²、和の計算）。6 日目：確認。
# この単元の水準は 2（式の計算の決まりを当てはめる）。わけの 3 問のうち 2 問は段 5 の ③（1/(n(n + 1)) = 1/n − 1/(n + 1)、
#   1/(1 × 2) + … + 1/(n(n + 1)) = n/(n + 1)）、1 問は水準に合わせて ②（約分してよいのは分母が 0 でないときだけ、を例で書く）にした。
# 前提は A-015（展開と因数分解）と N-019（分数の計算）。たどると A-010、N-027、N-078、A-009 まで使える。
#   1 次方程式（A-011）は前提のたどりにないので、部分分数分解の係数は「x = −1 を代入すると 1 = 2 × a」のように、
#   かけ算の逆（N-078）で 1 つずつ決まる形にした。係数比較で連立方程式になる形は扱わない。
#   整式のわり算（A-026）も前提にないので、分子の次数を下げるのは 1 次 ÷ 1 次だけにし、分子を「分母の何倍 + 数」に書きかえて求める。
#   平方根（A-016）も前提にないので、x + 1/x = 4 から x の値は求めず、(x + 1/x)² を展開して x² + 1/x² を出す。
#   Σ の記号（A-018）は使わず、和は「+ … +」で書く。
# 画面は 3/4 や 1/x のような 1 字どうしの分数だけを上下に重ねるので、(x − 2)/(x − 1) のような式は 1 行のまま見せる。
#   分数式どうしのわり算は、記号の読み違いを避けて「A を B でわった式」と言葉で書いた。
# 式の答えは choices。式を選ぶ check は、選択肢ごとの式（lambda）と元の式を、分母が 0 にならない x（(3k + 7)/21 の形の分数）で
#   Fraction のまま比べ、すべての x で等しいものを選ぶ。係数を打つ問題は、係数を総当たりして恒等式になるものを選ぶ。
#   和の問題は Fraction の和をそのまま計算する。x + 1/x の問題は、条件を満たす x の数値を使って math.isclose で確かめる。
# 分数式と部分分数分解は、分数関数（A-038）、積分の計算（D-006）、級数の和（D-002）、制御や回路の伝達関数（E の流れ）につながる（D-026）。

id: A-037
days:
  - day: 1
    items:
      - part: 見本
        text: 分数式 (x² − 4)/(x² + x − 2) を約分してみましょう。また、x/(x + 1) × (x² − 1)/x² を計算してみましょう。
        explain: A、B を整式とし、B に文字がふくまれるとき、A/B の形の式を分数式といいます。B が 0 になる x の値では、式の値は決まりません。分数と同じように、分母と分子に 0 でない同じ式をかけても、同じ式でわっても、もとの式と等しくなります。分母と分子を共通な因数でわることを約分といいます。(x² − 4)/(x² + x − 2) は、分母と分子を因数分解すると (x − 2)(x + 2)/((x + 2)(x − 1)) なので、x + 2 で約分して (x − 2)/(x − 1) です（x = −2、1 では元の式の値は決まりません）。かけ算とわり算も分数と同じで、かけ算は分子どうし・分母どうしをかけ、わり算はわる式の分母と分子を入れかえてかけます（N-078）。因数分解してから約分すると計算が楽です。x/(x + 1) × (x² − 1)/x² = x(x + 1)(x − 1)/((x + 1)x²) = (x − 1)/x です。約分は、因数分解した形の共通な因数でしかできません。x² と x² − 1 の「x²」を消すようなまちがいをしないようにします。
      - part: 思い出す
        text: 12/18 + 5/12 を計算しましょう。
        answer: 13/12
        check: "Fraction(12, 18) + Fraction(5, 12)"
        hints:
          - 12/18 を約分しましょう（N-019）。
          - 2/3 と 5/12 を通分しましょう。
          - 分母を 12 にそろえます。
        paths:
          - [12/18 = 2/3, 2/3 = 8/12, 8/12 + 5/12 = 13/12]
      - part: 思い出す
        text: x² − 5x + 6 を因数分解した式はどれですか。
        choices: [(x − 2)(x − 3), (x + 2)(x + 3), (x − 1)(x − 6), (x + 1)(x − 6)]
        answer: (x − 2)(x − 3)
        check: "[c for c, f in {'(x − 2)(x − 3)': lambda x: (x - 2) * (x - 3), '(x + 2)(x + 3)': lambda x: (x + 2) * (x + 3), '(x − 1)(x − 6)': lambda x: (x - 1) * (x - 6), '(x + 1)(x − 6)': lambda x: (x + 1) * (x - 6)}.items() if all(f(x) == x * x - 5 * x + 6 for x in range(-6, 7))][0]"
        hints:
          - かけて 6、足して −5 になる 2 つの数をさがしましょう（A-015）。
          - 2 つとも負の数です。
          - −2 と −3 を確かめましょう。
        paths:
          - [(−2) × (−3) = 6、−2 + (−3) = −5, (x − 2)(x − 3)]
      - part: 今日
        text: (x² − 9)/(x² + 3x) を約分した式はどれですか。
        choices: [(x − 3)/x, (x + 3)/x, −3/x, (x − 3)/(x + 3)]
        answer: (x − 3)/x
        check: "[c for c, f in {'(x − 3)/x': lambda x: (x - 3) / x, '(x + 3)/x': lambda x: (x + 3) / x, '−3/x': lambda x: -3 / x, '(x − 3)/(x + 3)': lambda x: (x - 3) / (x + 3)}.items() if all(f(x) == (x * x - 9) / (x * x + 3 * x) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 分子と分母を、それぞれ因数分解しましょう。
          - x² − 9 = (x + 3)(x − 3)、x² + 3x = x(x + 3) です。
          - 共通な因数で約分しましょう。
        paths:
          - [(x + 3)(x − 3)/(x(x + 3)), x + 3 で約分, (x − 3)/x]
        note: x² どうしを消して −9/(3x) = −3/x とするまちがいが多い。約分は「積の形の共通な因数」でしかできない。
      - part: 今日
        text: (x + 2)/(x − 1) × (x² − 1)/(x² + 2x) を計算した式はどれですか。
        choices: [(x + 1)/x, (x − 1)/x, (x + 1)/(x + 2), x/(x + 1)]
        answer: (x + 1)/x
        check: "[c for c, f in {'(x + 1)/x': lambda x: (x + 1) / x, '(x − 1)/x': lambda x: (x - 1) / x, '(x + 1)/(x + 2)': lambda x: (x + 1) / (x + 2), 'x/(x + 1)': lambda x: x / (x + 1)}.items() if all(f(x) == (x + 2) / (x - 1) * (x * x - 1) / (x * x + 2 * x) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - x² − 1 と x² + 2x を因数分解しましょう。
          - 分子どうし、分母どうしをかけた形で書きましょう。
          - 共通な因数で約分しましょう。
        paths:
          - [(x + 2)(x + 1)(x − 1)/((x − 1)x(x + 2)), x + 2 と x − 1 で約分, (x + 1)/x]
      - part: 挑戦
        text: (x² − x − 6)/(x² − 4) を (x − 3)/(x − 2) でわった式は、x が分母を 0 にしない値のとき、いつも同じ数になります。その数はいくつですか。
        answer: 1
        check: "(lambda vs: vs[0] if len(set(vs)) == 1 else None)([(x * x - x - 6) / (x * x - 4) / ((x - 3) / (x - 2)) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)]])"
        hints:
          - わり算は、わる式の分母と分子を入れかえてかけます。
          - x² − x − 6 と x² − 4 を因数分解しましょう。
          - 約分すると、何が残るでしょう。
        paths:
          - [(x − 3)(x + 2)/((x − 2)(x + 2)) × (x − 2)/(x − 3), x + 2、x − 2、x − 3 で約分, 1]
        note: x = 2、−2、3 では元の式の値は決まらない。それ以外のどの x でも 1。
    extra:
      - part: 今日
        text: (2x² − 8)/(x² − 4x + 4) を約分した式はどれですか。
        choices: [2(x + 2)/(x − 2), 2(x − 2)/(x + 2), (x + 2)/(x − 2), 2/(x − 2)²]
        answer: 2(x + 2)/(x − 2)
        check: "[c for c, f in {'2(x + 2)/(x − 2)': lambda x: 2 * (x + 2) / (x - 2), '2(x − 2)/(x + 2)': lambda x: 2 * (x - 2) / (x + 2), '(x + 2)/(x − 2)': lambda x: (x + 2) / (x - 2), '2/(x − 2)²': lambda x: 2 / (x - 2) ** 2}.items() if all(f(x) == (2 * x * x - 8) / (x * x - 4 * x + 4) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 分子は 2 をくくり出してから因数分解しましょう。
          - 分母は (x − 2)² です。
          - 共通な因数 x − 2 で約分しましょう。
        paths:
          - [2(x + 2)(x − 2)/(x − 2)², x − 2 で約分, 2(x + 2)/(x − 2)]
      - part: 今日
        text: x = 7 のとき、(x² + 5x + 6)/(x + 3) の値はいくつですか。
        answer: 9
        check: "Fraction(7 * 7 + 5 * 7 + 6, 7 + 3)"
        hints:
          - 先に約分すると、計算が楽になります。
          - x² + 5x + 6 = (x + 2)(x + 3) です。
          - 約分した式に x = 7 を代入しましょう。
        paths:
          - [(x + 2)(x + 3)/(x + 3) = x + 2, x = 7 を代入, 9]
          - [そのまま代入すると (49 + 35 + 6)/10 = 90/10, 9]
      - part: 挑戦
        text: (x² − 1)/(x² + 3x) を (x + 1)/(x² − 9) でわった式はどれですか。
        choices: [(x − 1)(x − 3)/x, (x + 1)(x + 3)/x, (x − 1)(x + 3)/x, (x − 1)/(x(x − 3))]
        answer: (x − 1)(x − 3)/x
        check: "[c for c, f in {'(x − 1)(x − 3)/x': lambda x: (x - 1) * (x - 3) / x, '(x + 1)(x + 3)/x': lambda x: (x + 1) * (x + 3) / x, '(x − 1)(x + 3)/x': lambda x: (x - 1) * (x + 3) / x, '(x − 1)/(x(x − 3))': lambda x: (x - 1) / (x * (x - 3))}.items() if all(f(x) == (x * x - 1) / (x * x + 3 * x) / ((x + 1) / (x * x - 9)) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - わる式の分母と分子を入れかえて、かけ算にしましょう。
          - x² − 1、x² + 3x、x² − 9 を因数分解しましょう。
          - 共通な因数で約分しましょう。
        paths:
          - [(x + 1)(x − 1)/(x(x + 3)) × (x + 3)(x − 3)/(x + 1), x + 1 と x + 3 で約分, (x − 1)(x − 3)/x]

  - day: 2
    items:
      - part: 見本
        text: 1/(x − 1) − 1/(x + 1) を計算してみましょう。また、(2x + 5)/(x + 2) を a + b/(x + 2)（a、b は数）の形に、(1 + 1/x)/(1 − 1/x) を簡単な形にしてみましょう。
        explain: 分母のちがう分数式のたし算とひき算は、分数と同じように通分します（N-019）。分母を因数分解し、どの分母でもわり切れるいちばん簡単な式を共通の分母にします。1/(x − 1) − 1/(x + 1) = (x + 1)/((x − 1)(x + 1)) − (x − 1)/((x − 1)(x + 1)) = ((x + 1) − (x − 1))/((x − 1)(x + 1)) = 2/(x² − 1) です。分子をひくときは、かっこをつけて符号に気をつけます。次に、分子の次数が分母の次数より低くないときは、分子を「分母の何倍 + 数」に書きかえると、数と、分子が数の分数式の和になります。2x + 5 = 2(x + 2) + 1 なので、(2x + 5)/(x + 2) = 2 + 1/(x + 2) です。分母や分子に分数式をふくむ式（繁分数式）は、分母と分子に同じ式をかけて簡単にします。(1 + 1/x)/(1 − 1/x) は、分母と分子に x をかけて (x + 1)/(x − 1) になります。
      - part: 思い出す
        text: 1/6 − 1/8 を計算しましょう。
        answer: 1/24
        check: "Fraction(1, 6) - Fraction(1, 8)"
        hints:
          - 6 と 8 のどちらでもわり切れる、いちばん小さい数を分母にしましょう（N-019）。
          - 分母を 24 にそろえます。
          - 4/24 − 3/24 を計算しましょう。
        paths:
          - [1/6 = 4/24、1/8 = 3/24, 4/24 − 3/24 = 1/24]
      - part: 思い出す
        text: (x² + x)/(x² − 1) を約分した式はどれですか。
        choices: [x/(x − 1), x/(x + 1), 1/(x − 1), (x + 1)/(x − 1)]
        answer: x/(x − 1)
        check: "[c for c, f in {'x/(x − 1)': lambda x: x / (x - 1), 'x/(x + 1)': lambda x: x / (x + 1), '1/(x − 1)': lambda x: 1 / (x - 1), '(x + 1)/(x − 1)': lambda x: (x + 1) / (x - 1)}.items() if all(f(x) == (x * x + x) / (x * x - 1) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 分子は x でくくりましょう。
          - 分母は (x + 1)(x − 1) です。
          - 共通な因数で約分しましょう。
        paths:
          - [x(x + 1)/((x + 1)(x − 1)), x + 1 で約分, x/(x − 1)]
      - part: 今日
        text: 2/(x + 1) + 3/(x − 2) を計算した式はどれですか。
        choices: [(5x − 1)/((x + 1)(x − 2)), 5/((x + 1)(x − 2)), (5x + 1)/((x + 1)(x − 2)), 5/(2x − 1)]
        answer: (5x − 1)/((x + 1)(x − 2))
        check: "[c for c, f in {'(5x − 1)/((x + 1)(x − 2))': lambda x: (5 * x - 1) / ((x + 1) * (x - 2)), '5/((x + 1)(x − 2))': lambda x: 5 / ((x + 1) * (x - 2)), '(5x + 1)/((x + 1)(x − 2))': lambda x: (5 * x + 1) / ((x + 1) * (x - 2)), '5/(2x − 1)': lambda x: 5 / (2 * x - 1)}.items() if all(f(x) == 2 / (x + 1) + 3 / (x - 2) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 共通の分母は (x + 1)(x − 2) です。
          - 2/(x + 1) の分母と分子に x − 2 をかけましょう。
          - 分子どうしを足して整理しましょう。
        paths:
          - [(2(x − 2) + 3(x + 1))/((x + 1)(x − 2)), 分子は 2x − 4 + 3x + 3 = 5x − 1, (5x − 1)/((x + 1)(x − 2))]
        note: 分子どうし・分母どうしを足して 5/(2x − 1) とするまちがいがある。分数の 1/2 + 1/3 を 2/5 としないのと同じ。
      - part: 今日
        text: (3x − 1)/(x − 2) を a + b/(x − 2)（a、b は数）の形に表すとき、b はいくつですか。
        answer: 5
        check: "[b for a in range(-20, 21) for b in range(-20, 21) if all((3 * x - 1) / (x - 2) == a + b / (x - 2) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 分子 3x − 1 を、3(x − 2) + □ の形に書きかえましょう。
          - 3(x − 2) = 3x − 6 です。
          - 3x − 1 は 3x − 6 より、いくつ大きいでしょう。
        paths:
          - [3x − 1 = 3(x − 2) + 5, (3x − 1)/(x − 2) = 3 + 5/(x − 2), b = 5]
      - part: 挑戦
        text: (1 − 1/x)/(x − 1/x) を簡単にした式はどれですか。
        choices: [1/(x + 1), 1/(x − 1), (x − 1)/x, x/(x + 1)]
        answer: 1/(x + 1)
        check: "[c for c, f in {'1/(x + 1)': lambda x: 1 / (x + 1), '1/(x − 1)': lambda x: 1 / (x - 1), '(x − 1)/x': lambda x: (x - 1) / x, 'x/(x + 1)': lambda x: x / (x + 1)}.items() if all(f(x) == (1 - 1 / x) / (x - 1 / x) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 分母と分子に x をかけましょう。
          - 分子は x − 1、分母は x² − 1 になります。
          - 分母を因数分解して約分しましょう。
        paths:
          - [分母と分子に x をかけて (x − 1)/(x² − 1), = (x − 1)/((x + 1)(x − 1)), 1/(x + 1)]
    extra:
      - part: 今日
        text: 1/x − 1/(x + 2) を計算した式はどれですか。
        choices: [2/(x(x + 2)), −2/(x(x + 2)), 1/(x(x + 2)), 2/(x + 2)]
        answer: 2/(x(x + 2))
        check: "[c for c, f in {'2/(x(x + 2))': lambda x: 2 / (x * (x + 2)), '−2/(x(x + 2))': lambda x: -2 / (x * (x + 2)), '1/(x(x + 2))': lambda x: 1 / (x * (x + 2)), '2/(x + 2)': lambda x: 2 / (x + 2)}.items() if all(f(x) == 1 / x - 1 / (x + 2) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 共通の分母は x(x + 2) です。
          - 分子は (x + 2) − x です。
          - かっこを外して整理しましょう。
        paths:
          - [((x + 2) − x)/(x(x + 2)), 2/(x(x + 2))]
      - part: 今日
        text: (6x + 1)/(2x − 1) を a + b/(2x − 1)（a、b は数）の形に表すとき、b はいくつですか。
        answer: 4
        check: "[b for a in range(-20, 21) for b in range(-20, 21) if all((6 * x + 1) / (2 * x - 1) == a + b / (2 * x - 1) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 分子 6x + 1 を、3(2x − 1) + □ の形に書きかえましょう。
          - 3(2x − 1) = 6x − 3 です。
          - 6x + 1 は 6x − 3 より、いくつ大きいでしょう。
        paths:
          - [6x + 1 = 3(2x − 1) + 4, (6x + 1)/(2x − 1) = 3 + 4/(2x − 1), b = 4]
      - part: 挑戦
        text: 1/(x² − x) + 1/(x² + x) を計算した式はどれですか。
        choices: [2/(x² − 1), 2x/(x² − 1), 2/(x(x² − 1)), 1/(x² − 1)]
        answer: 2/(x² − 1)
        check: "[c for c, f in {'2/(x² − 1)': lambda x: 2 / (x * x - 1), '2x/(x² − 1)': lambda x: 2 * x / (x * x - 1), '2/(x(x² − 1))': lambda x: 2 / (x * (x * x - 1)), '1/(x² − 1)': lambda x: 1 / (x * x - 1)}.items() if all(f(x) == 1 / (x * x - x) + 1 / (x * x + x) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 分母を因数分解しましょう。x(x − 1) と x(x + 1) です。
          - 共通の分母は x(x − 1)(x + 1) です。
          - 分子を足したら、約分できないか見ましょう。
        paths:
          - [((x + 1) + (x − 1))/(x(x − 1)(x + 1)), = 2x/(x(x − 1)(x + 1)), x で約分して 2/(x² − 1)]
        note: 共通の分母を (x² − x)(x² + x) にしても計算できるが、式が重くなる。最後の約分を忘れて 2x/(x(x² − 1)) で止めやすい。

  - day: 3
    items:
      - part: 見本
        text: 1/((x + 1)(x + 3)) を、a/(x + 1) + b/(x + 3)（a、b は数）の形に分けてみましょう。また、この考えで 1/(1 × 2) + 1/(2 × 3) + … + 1/(9 × 10) を計算してみましょう。
