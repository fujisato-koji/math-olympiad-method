# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋, 手数]
    text: x + 1/x = 3 のとき、x⁵ + 1/x⁵ の値はいくつですか。
    answer: 123
    check: "[k for k in range(0, 1000) if math.isclose((lambda x: x ** 5 + 1 / x ** 5)((3 + math.sqrt(5)) / 2), k)][0]"
    hints:
      - まず x² + 1/x² を求めよう。(x + 1/x)² を展開するといいね。
      - (x + 1/x)(x² + 1/x²) を展開すると、x³ + 1/x³ と何が出てくるかな。
      - x⁵ + 1/x⁵ は、(x² + 1/x²)(x³ + 1/x³) を展開すると出てくるよ。
    paths:
      - [x² + 1/x² = 3² − 2 = 7, (x + 1/x)(x² + 1/x²) = x³ + 1/x³ + x + 1/x より x³ + 1/x³ = 21 − 3 = 18, (x² + 1/x²)(x³ + 1/x³) = x⁵ + 1/x⁵ + x + 1/x より x⁵ + 1/x⁵ = 126 − 3 = 123]
      - [x⁴ + 1/x⁴ = 7² − 2 = 47, (x + 1/x)(x⁴ + 1/x⁴) = x⁵ + 1/x⁵ + x³ + 1/x³, 141 − 18 = 123]
    note: x の値を求めずに、x + 1/x と x² + 1/x² …の値をかけ合わせて次数を上げていく。毎回「余分に出てくる項」をひくのを忘れやすい。3、7、18、47、123 は、前の 2 つから決まる数の並びになっている（A-022 の漸化式につながる）。
  - part: 離
    kinds: [総動員]
    uses: [N-017, A-011]
    text: 1/a + 1/b = 1/6 をみたす自然数 a、b（a < b）の組は、何組ありますか。
    answer: 4
    check: "len([(a, b) for a in range(1, 100) for b in range(a + 1, 100) if 6 * (a + b) == a * b])"
    hints:
      - 1/a も 1/b も 1/6 より小さいので、a も b も 6 より大きいね。a < b なので、1/a は 1/12 より大きいよ。
      - 分母をはらうと 6b + 6a = ab。両辺に 36 を足して、左辺を (a − 6)(b − 6) の形にできないかな。
      - (a − 6)(b − 6) = 36 で、a − 6 < b − 6 となる 36 の約数の組を数えよう（N-017）。
    paths:
      - [6a + 6b = ab より ab − 6a − 6b + 36 = 36, (a − 6)(b − 6) = 36, a − 6 < b − 6 となる組は 1 × 36、2 × 18、3 × 12、4 × 9, 4 組]
      - [a は 7 から 11 まで（a = 12 なら b = 12 で a < b にならない）, 1/6 − 1/a が 1/b の形になる a をさがす, a = 7、8、9、10 で b = 42、24、18、15, a = 11 はならないので 4 組]
    note: 分数式の計算（通分）、等式の変形（A-011）、約数の組（N-017）を合わせる。(a − 6)(b − 6) の形に因数分解する変形が道筋のかなめ。6 × 6 の組（a = b = 12）は a < b に合わないので数えない。
  - part: 離
    kinds: [数]
    text: 1/(1 × 3) + 1/(2 × 4) + 1/(3 × 5) + … + 1/(20 × 22) を計算しましょう。
    answer: 325/462
    check: "sum(Fraction(1, k * (k + 2)) for k in range(1, 21))"
    hints:
      - 1/(k(k + 2)) = (1/2)(1/k − 1/(k + 2)) と分けよう。
      - 分けた式を並べると、となりどうしではなく、1 つおきに消えるね。最後に残るのはどの項かな。
      - 残った 4 つの分数を、分母をそろえて計算しよう。
    paths:
      - [和は (1/2)((1 − 1/3) + (1/2 − 1/4) + (1/3 − 1/5) + … + (1/20 − 1/22)), 消えずに残るのは 1、1/2、−1/21、−1/22, (1/2)(3/2 − 43/462) = (1/2) × (650/462), 325/462]
    note: 1 つおきに消えるので、初めの 2 つと最後の 2 つが残る。1/21 + 1/22 = 43/462 の通分と、最後の約分（650/462 を 2 でわる）で数がややこしい。
