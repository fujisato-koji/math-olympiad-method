        answer: 3/(x(x + 3))
        check: "[c for c, f in {'3/(x(x + 3))': lambda x: 3 / (x * (x + 3)), '1/(x(x + 3))': lambda x: 1 / (x * (x + 3)), '3/((x + 1)(x + 3))': lambda x: 3 / ((x + 1) * (x + 3)), '1/x − 1/(x + 1)': lambda x: 1 / x - 1 / (x + 1)}.items() if all(f(x) == 1 / (x * (x + 1)) + 1 / ((x + 1) * (x + 2)) + 1 / ((x + 2) * (x + 3)) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - 3 つの分数を、そのまま通分すると大変です。
          - 1/(x(x + 1)) = 1/x − 1/(x + 1) のように、それぞれ 2 つの分数の差に分けましょう。
          - となりどうしを消して、残った 2 つの分数を通分しましょう。
        paths:
          - [(1/x − 1/(x + 1)) + (1/(x + 1) − 1/(x + 2)) + (1/(x + 2) − 1/(x + 3)), 1/x − 1/(x + 3), 3/(x(x + 3))]
        note: 数の和 1/(1 × 2) + 1/(2 × 3) + … と同じ形を、文字の式で使う。x = 1 を入れると 1/2 + 1/6 + 1/12 = 3/4 になることで確かめられる。
    extra:
      - part: 今日
        text: x − 1/x を 1 + 1/x でわった式はどれですか。
        choices: [x − 1, x + 1, (x − 1)/x, 1/(x − 1)]
        answer: x − 1
        check: "[c for c, f in {'x − 1': lambda x: x - 1, 'x + 1': lambda x: x + 1, '(x − 1)/x': lambda x: (x - 1) / x, '1/(x − 1)': lambda x: 1 / (x - 1)}.items() if all(f(x) == (x - 1 / x) / (1 + 1 / x) for x in [Fraction(3 * k + 7, 21) for k in range(-10, 11)])][0]"
        hints:
          - わられる式とわる式の分母と分子に x をかけましょう。
          - (x² − 1)/(x + 1) になります。
          - x² − 1 を因数分解して約分しましょう。
        paths:
          - [分母と分子に x をかけて (x² − 1)/(x + 1), = (x + 1)(x − 1)/(x + 1), x − 1]
      - part: 今日
        text: x − 1/x = 3 のとき、x² + 1/x² の値はいくつですか。
        answer: 11
        check: "[k for k in range(-50, 51) if math.isclose((lambda x: x * x + 1 / (x * x))((3 + math.sqrt(13)) / 2), k)][0]"
        hints:
          - (x − 1/x)² を展開しましょう。
          - (x − 1/x)² = x² − 2 + 1/x² です。
          - 9 = x² + 1/x² − 2 から求めましょう。
        paths:
          - [(x − 1/x)² = x² − 2 + 1/x², 9 = x² + 1/x² − 2, x² + 1/x² = 11]
      - part: 挑戦
        text: 1/(2 × 4) + 1/(4 × 6) + 1/(6 × 8) + … + 1/(18 × 20) を計算しましょう。
        answer: 9/40
        check: "sum(Fraction(1, k * (k + 2)) for k in range(2, 19, 2))"
        hints:
          - 分母の 2 つの数の差は 2 です。
          - 1/(2 × 4) = (1/2)(1/2 − 1/4) です。
          - となりどうしを消して、1/2 をかけましょう。
        paths:
          - [1/(k(k + 2)) = (1/2)(1/k − 1/(k + 2)), 和は (1/2)(1/2 − 1/20), = (1/2) × (9/20), 9/40]

  - day: 6
