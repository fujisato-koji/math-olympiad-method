        explain: △ABC で ∠A の二等分線が辺 BC と交わる点を D とすると、BD:DC = AB:AC が成り立ちます。これを角の二等分線の定理といいます（わけは 4 日目）。ここでは BD:DC = 6:4 = 3:2。BC = 5 cm を 3:2 に分けるので、BD = 5 × 3/5 = 3 cm、DC = 5 × 2/5 = 2 cm です。辺 BC が、となりの 2 辺 AB、AC の長さの比に分けられる、と覚えます。
