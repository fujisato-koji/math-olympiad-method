# G-042 角の二等分線の定理
#
# 書き方は N-001 の頭の注のとおり。
# 角の二等分線の定理：△ABC で ∠A の二等分線が辺 BC と交わる点を D とすると BD:DC = AB:AC。
#   ∠A の外角の二等分線が直線 BC と交わる点を E とすると BE:EC = AB:AC（E は辺 BC の延長の上。AB = AC なら交わらない）。
# 前提は G-020（相似の条件、平行線と線分の比、相似比）。その前提の G-016（合同の証明、対頂角、平行線と角）、
#   G-009（角度、三角形の外角）、G-008（三角形の面積）、A-005（比、比例配分）も使う。
# 二等辺三角形の性質（G-017）は前提にないので、わけは「B と C から AD に垂線をひき、2 組の相似を使う」形を本線にした。
#   C を通って AD に平行な直線をひき二等辺三角形をつくる教科書の証明は使わない。面積の比で示す道を 2 本目のみちすじにした。
# 三角形の五心（G-028）とアポロニウスの円（G-044）は先取りしない。2 日目の「2 本の角の二等分線の交点 I」は、
#   内心という名前を出さずに比だけを求める。3 日目の「DE の長さ」と 4 日目の「∠DAE = 90°」は G-044 の下ごしらえ。
# 外分（線分の延長の上にあって、2 つの端からの長さの比が m:n の点）はここで初めて使うので、3 日目の見本で言葉を説明した。
# 比の答え（4:3 など）は選ぶ形にし、YAML では引用符で囲む。check は Fraction で約分してから '%d:%d' で比の文字を作る。
# 三平方の定理（G-019）は前提にないので、辺の長さはすべて問題で与えた。与えた 3 辺と面積は、実際にできる三角形にした
#   （面積は 1/2 × AB × AC 以下）。図は与えた長さのとおりに作図した。
# 地図に plan がないので既定の並び（導入・練習 2 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 内角の二等分線と辺の比　2 日目 まわりの長さや差から辺を求める、2 本の二等分線の交点で分けた比
#   3 日目 外角の二等分線と外分　4 日目 わけ（内角の定理、外角の定理、内角と外角の二等分線は垂直）
#   5 日目 G-020（相似、平行線と線分の比）・G-016（合同）と混ぜる　6 日目 確認
# check：長さは比例配分の式（Fraction）。外分は「比の差にあたる長さ」から求める式。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-017 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

