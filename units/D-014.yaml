      - part: 今日
        id: "9b1d4625d4"
        text: f(x, y) = x² + y² の点 (0, 0) は、極小、極大、鞍点のどれですか。図のヘッセ行列 H の 4 つの数を求めて調べます。
        svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><text x="34" y="58" font-size="17" text-anchor="middle" fill="currentColor">H =</text><path d="M76 26 Q64 52 76 78" fill="none" stroke="currentColor" stroke-width="2"/><path d="M256 26 Q268 52 256 78" fill="none" stroke="currentColor" stroke-width="2"/><text x="118" y="43.7" font-size="14" text-anchor="middle" fill="currentColor">∂²f/∂x²</text><text x="214" y="43.7" font-size="14" text-anchor="middle" fill="currentColor">∂²f/∂x∂y</text><text x="118" y="69.7" font-size="14" text-anchor="middle" fill="currentColor">∂²f/∂x∂y</text><text x="214" y="69.7" font-size="14" text-anchor="middle" fill="currentColor">∂²f/∂y²</text><text x="160" y="112" font-size="13" text-anchor="middle" fill="currentColor">f = x² + y² のとき、4 つの数は？</text><text x="160" y="136" font-size="13" text-anchor="middle" fill="currentColor">D = (∂²f/∂x²)(∂²f/∂y²) − (∂²f/∂x∂y)²</text></svg>'
        choices: [極小, 極大, 鞍点, "判定できない（D = 0）"]
        answer: 極小
        check: "'極小'"
        hints:
          - ∂²f/∂x² は、f_x = 2x をもう一度 x で微分したものです。∂²f/∂x∂y は、f_x を y で微分したものです。
          - text: H の左上の ∂²f/∂x² は 2 です。のこりの 3 つも求めて D を計算し、D と ∂²f/∂x² が正か負かを、見本の図とくらべます。
            svg: '<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg"><text x="48" y="56" font-size="17" text-anchor="middle" fill="currentColor">H =</text><path d="M96 26 Q84 50 96 74" fill="none" stroke="currentColor" stroke-width="2"/><path d="M164 26 Q176 50 164 74" fill="none" stroke="currentColor" stroke-width="2"/><text x="110" y="43.7" font-size="17" text-anchor="middle" fill="currentColor">2</text><text x="150" y="43.7" font-size="17" text-anchor="middle" fill="currentColor">?</text><text x="110" y="67.7" font-size="17" text-anchor="middle" fill="currentColor">?</text><text x="150" y="67.7" font-size="17" text-anchor="middle" fill="currentColor">?</text><text x="196" y="56" font-size="15" text-anchor="start" fill="currentColor">D = 2 × ? − ?²</text><text x="160" y="108" font-size="13" text-anchor="middle" fill="currentColor">正か負かを、4 日目の見本の図とくらべる</text></svg>'
          - 今日 1 の等高線の図で、O から外へ行くと f の数が大きくなるか小さくなるかも見ます。
        paths:
          - ["H = (2 0；0 2)", "D = 4 > 0", "∂²f/∂x² = 2 > 0", "極小"]
          - ["等高線の数は O から外へ大きくなる", "O は谷の底", "極小"]
