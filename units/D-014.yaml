    items:
      - part: 見本
        id: "dafa621ffa"
        text: |-
          f(x, y) を、地図の上の点 (x, y) の高さだと考えます。図の左の線は、同じ高さの点を結んだ等高線で、そばの数がその高さです。
          y を止めて x だけ動かしたときの坂のかたむき（赤）を偏微分 ∂f/∂x、x を止めて y だけ動かしたときのかたむき（青）を ∂f/∂y といいます。f_x、f_y とも書きます。
          図の右は、P を通る赤の線と青の線で地面を切った断面です。P(2, 1) では、赤の断面のかたむきが 4、青の断面のかたむきが 7 です。
          x を dx、y を dy だけ少し動かしたときの高さの変わり方は、およそ df = f_x dx + f_y dy です。これを全微分といいます。
