        explain: |-
          【定義】偏微分とは、ほかの変数を止めて、1 つの向きだけに動いたときの f の変化率です。
          図の f は f(x, y) = x²y + 3y です。y = 1 で切ると f = x² + 3 で、x = 2 でのかたむきは 4。x = 2 で切ると f = 7y で、かたむきは 7。
          【定義】全微分とは、x と y を同時に少しだけ動かしたときの f の変化を、1 次式で近づけたものです。
          df = f_x dx + f_y dy の f_x dx は x の変化による分、f_y dy は y の変化による分です。
          ｜記号｜意味｜
          ｜∂f/∂x（f_x）｜y を止めて x だけ動かしたときの変化率｜
          ｜∂f/∂y（f_y）｜x を止めて y だけ動かしたときの変化率｜
          ｜df｜x と y を少し動かしたときの f の変化の 1 次近似｜
          例：点 (2, 1) で f(2, 1) = 7。
          x だけ 0.1 増やすと f(2.1, 1) = 7.41。変化は 0.41 で、f_x dx = 4 × 0.1 = 0.4 に近い。
          y だけ 0.1 増やすと f(2, 1.1) = 7.7。変化は 0.7 で、f_y dy = 7 × 0.1 = 0.7。
          両方 0.1 ずつ増やすと f(2.1, 1.1) = 8.151。変化は 1.151 で、df = 0.4 + 0.7 = 1.1 に近い。
        note: 偏微分は一方を固定した坂のかたむき。全微分は 2 方向の変化を足した 1 次近似。
