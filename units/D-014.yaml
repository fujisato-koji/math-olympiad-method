    items:
      - part: 見本
        id: "3f520b162b"
        text: |-
          連鎖律：z = f(x, y)、x = x(t)、y = y(t) のとき、dz/dt = (∂f/∂x)(dx/dt) + (∂f/∂y)(dy/dt)。
          図のように、t から z へは、x を通る道（赤）と y を通る道（青）の 2 本があります。道の線ごとの微分をかけ、2 本の道を足します。
          例：z = x² + 3y、x = t、y = t² なら、dz/dt = 2x × 1 + 3 × 2t = 2t + 6t = 8t。
        svg: '<svg viewBox="0 0 320 236" xmlns="http://www.w3.org/2000/svg"><line x1="149.6" y1="48.8" x2="105.4" y2="95.2" stroke="#f08080" stroke-width="3.5"/><line x1="170.4" y1="48.8" x2="214.6" y2="95.2" stroke="#7fc8f8" stroke-width="3.5"/><line x1="105.4" y1="116.8" x2="149.6" y2="163.2" stroke="#f08080" stroke-width="3.5"/><line x1="214.6" y1="116.8" x2="170.4" y2="163.2" stroke="#7fc8f8" stroke-width="3.5"/><circle cx="160" cy="38" r="15" fill="none" stroke="currentColor" stroke-width="2"/><text x="160" y="44" font-size="17" text-anchor="middle" fill="currentColor" font-style="italic">z</text><circle cx="95" cy="106" r="15" fill="none" stroke="currentColor" stroke-width="2"/><text x="95" y="112" font-size="17" text-anchor="middle" fill="currentColor" font-style="italic">x</text><circle cx="225" cy="106" r="15" fill="none" stroke="currentColor" stroke-width="2"/><text x="225" y="112" font-size="17" text-anchor="middle" fill="currentColor" font-style="italic">y</text><circle cx="160" cy="174" r="15" fill="none" stroke="currentColor" stroke-width="2"/><text x="160" y="180" font-size="17" text-anchor="middle" fill="currentColor" font-style="italic">t</text><text x="182" y="44" font-size="14" text-anchor="start" fill="currentColor">z = x² + 3y</text><text x="73" y="111" font-size="14" text-anchor="end" fill="currentColor">x = t</text><text x="247" y="111" font-size="14" text-anchor="start" fill="currentColor">y = t²</text><text x="119" y="70" font-size="13" text-anchor="end" fill="currentColor">∂f/∂x = 2x</text><text x="201" y="70" font-size="13" text-anchor="start" fill="currentColor">∂f/∂y = 3</text><text x="119" y="148" font-size="13" text-anchor="end" fill="currentColor">dx/dt = 1</text><text x="201" y="148" font-size="13" text-anchor="start" fill="currentColor">dy/dt = 2t</text><rect x="28" y="200" width="120" height="28" rx="6" fill="#f08080" fill-opacity="0.35"/><rect x="172" y="200" width="120" height="28" rx="6" fill="#7fc8f8" fill-opacity="0.35"/><text x="88" y="220" font-size="14" text-anchor="middle" fill="currentColor">赤の道 2x × 1</text><text x="160" y="220" font-size="16" text-anchor="middle" fill="currentColor">+</text><text x="232" y="220" font-size="14" text-anchor="middle" fill="currentColor">青の道 3 × 2t</text></svg>'
        explain: |-
          t が動くと、x と y が動き、それで z が動きます。
          x の変化による z の変化（赤の道）と、y の変化による z の変化（青の道）を足します。
          それぞれ、f の偏微分 × 内側の微分です。
          例の確かめ：z = t² + 3t² = 4t² を t で直接微分しても 8t になります。
        note: dz/dt = f_x x'(t) + f_y y'(t)。内側の微分をかける。
