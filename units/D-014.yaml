        explain: |-
          条件の線にそって動くとき、∇f が線にそう向きの成分をもっていれば、その向きに進むと f はまだ増えたり減ったりします。極値の点では、∇f は線に垂直になります。
          ∇g は、いつも線 g = 0 に垂直です。だから極値の点では ∇f と ∇g が平行で、∇f = λ∇g と書けます。
          f_x = λ g_x、f_y = λ g_y、g = 0 の 3 つの式を解きます。
          例（図）：x² + y² を 2x + y = 5 のもとで最小にすると、2x = 2λ、2y = λ、2x + y = 5 から λ = 2、点 (2, 1)。
        note: ∇f=λ∇g と g=0 を連立。λ はラグランジュ乗数。
