        explain: |-
          「条件 g = 0 の線にそって動くとき、∇f が線にそう向きの成分をもっていれば（図の A）、その向きに進むと f はまだ変わる。だから極値の点では、∇f は線に垂直になる（図の B）。∇g はいつも線 g = 0 に垂直なので、極値では ∇f と ∇g が平行になる。だから ∇f = λ∇g。」と書ければよい。
          ① 線にそって動く、② 勾配が線に垂直、③ λ。子どもには、円と直線の例で確かめさせます。
        hints:
