  - day: 3
    items:
      - part: 見本
        id: "00a2a4b2d5"
        text: |-
          ヤコビ行列は、2 変数の写像 F を、点のまわりで 1 次式に近づける行列です。
          F(x, y) = (f(x, y), g(x, y)) のとき、J = (f_x f_y；g_x g_y)。1 行目は f の偏微分、2 行目は g の偏微分です（；で行を区切ります）。
          図のように、小さな正方形の赤の辺は 1 列目 (f_x, g_x) に、青の辺は 2 列目 (f_y, g_y) にうつります。ヤコビ行列式 det J は、面積が何倍になるかを表します。
          例：F(x, y) = (2x + y, x + 2y) なら J = (2 1；1 2)、det J = 2·2 − 1·1 = 3。
        svg: '<svg viewBox="0 0 360 236" xmlns="http://www.w3.org/2000/svg"><text x="70" y="30" font-size="13" text-anchor="middle" fill="currentColor">小さな正方形</text><line x1="44.8" y1="60" x2="44.8" y2="144" stroke="#c8ccd6" stroke-width="1"/><line x1="86.8" y1="60" x2="86.8" y2="144" stroke="#c8ccd6" stroke-width="1"/><line x1="28" y1="127.2" x2="112" y2="127.2" stroke="#c8ccd6" stroke-width="1"/><line x1="28" y1="85.2" x2="112" y2="85.2" stroke="#c8ccd6" stroke-width="1"/><line x1="24" y1="127.2" x2="116" y2="127.2" stroke="currentColor" stroke-width="1.5"/><polygon points="123,127.2 116,123.7 116,130.7" fill="currentColor"/><line x1="44.8" y1="148" x2="44.8" y2="56" stroke="currentColor" stroke-width="1.5"/><polygon points="44.8,49 41.3,56 48.3,56" fill="currentColor"/><polygon points="44.8,127.2 86.8,127.2 86.8,85.2 44.8,85.2" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1"/><line x1="44.8" y1="127.2" x2="77.8" y2="127.2" stroke="#f08080" stroke-width="3.5"/><polygon points="86.8,127.2 76.8,132.2 76.8,122.2" fill="#f08080"/><line x1="44.8" y1="127.2" x2="44.8" y2="94.2" stroke="#7fc8f8" stroke-width="3.5"/><polygon points="44.8,85.2 49.8,95.2 39.8,95.2" fill="#7fc8f8"/><text x="65.8" y="111.2" font-size="13" text-anchor="middle" fill="currentColor">面積 1</text><text x="86.8" y="143.2" font-size="12" text-anchor="middle" fill="currentColor">(1, 0)</text><text x="40.8" y="77.2" font-size="12" text-anchor="end" fill="currentColor">(0, 1)</text><line x1="126" y1="96" x2="161" y2="96" stroke="currentColor" stroke-width="2.5"/><polygon points="170,96 160,101 160,91" fill="currentColor"/><text x="148" y="86" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">F</text><line x1="200.8" y1="10" x2="200.8" y2="170" stroke="#c8ccd6" stroke-width="1"/><line x1="242.9" y1="10" x2="242.9" y2="170" stroke="#c8ccd6" stroke-width="1"/><line x1="285.1" y1="10" x2="285.1" y2="170" stroke="#c8ccd6" stroke-width="1"/><line x1="327.2" y1="10" x2="327.2" y2="170" stroke="#c8ccd6" stroke-width="1"/><line x1="184" y1="153.2" x2="344" y2="153.2" stroke="#c8ccd6" stroke-width="1"/><line x1="184" y1="111.1" x2="344" y2="111.1" stroke="#c8ccd6" stroke-width="1"/><line x1="184" y1="68.9" x2="344" y2="68.9" stroke="#c8ccd6" stroke-width="1"/><line x1="184" y1="26.8" x2="344" y2="26.8" stroke="#c8ccd6" stroke-width="1"/><line x1="180" y1="153.2" x2="348" y2="153.2" stroke="currentColor" stroke-width="1.5"/><polygon points="355,153.2 348,149.7 348,156.7" fill="currentColor"/><line x1="200.8" y1="174" x2="200.8" y2="6" stroke="currentColor" stroke-width="1.5"/><polygon points="200.8,-1 197.3,6 204.3,6" fill="currentColor"/><polygon points="200.8,153.2 285.1,111.1 327.2,26.8 242.9,68.9" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1"/><line x1="200.8" y1="153.2" x2="277" y2="115.1" stroke="#f08080" stroke-width="3.5"/><polygon points="285.1,111.1 278.3,120 273.9,111.1" fill="#f08080"/><line x1="200.8" y1="153.2" x2="238.9" y2="77" stroke="#7fc8f8" stroke-width="3.5"/><polygon points="242.9,68.9 242.9,80.1 234,75.7" fill="#7fc8f8"/><text x="264" y="95" font-size="13" text-anchor="middle" fill="currentColor">面積 3</text><text x="291.1" y="123.1" font-size="12" text-anchor="start" fill="currentColor">(2, 1)</text><text x="236.9" y="66.9" font-size="12" text-anchor="end" fill="currentColor">(1, 2)</text><text x="52" y="200" font-size="16" text-anchor="middle" fill="currentColor">J =</text><rect x="88" y="176" width="26" height="36" rx="6" fill="#f08080" fill-opacity="0.4"/><rect x="122" y="176" width="26" height="36" rx="6" fill="#7fc8f8" fill-opacity="0.4"/><path d="M90 174 Q78 194 90 214" fill="none" stroke="currentColor" stroke-width="2"/><path d="M146 174 Q158 194 146 214" fill="none" stroke="currentColor" stroke-width="2"/><text x="101" y="189.3" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="135" y="189.3" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="101" y="209.3" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="135" y="209.3" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="118" y="228" font-size="12" text-anchor="middle" fill="currentColor">赤の列　青の列</text><text x="268" y="200" font-size="14" text-anchor="middle" fill="currentColor">det J = 2·2 − 1·1 = 3</text></svg>'
        explain: |-
          ヤコビ行列は、多変数の写像を 1 次近似した行列です。F の各成分を、x と y で偏微分してならべます。
          点 (x, y) から x の向きに h だけ進むと、F の値はおよそ h × (f_x, g_x) 動き、y の向きに h だけ進むと、およそ h × (f_y, g_y) 動きます。
          だから小さな正方形は、この 2 つを辺とする平行四辺形にうつり、面積は |det J| 倍になります。
          det J が 0 でないとき、その点の近くで F は 1 対 1 に近い動きをします。det J = 0 の点では、正方形がつぶれて線になります。
        note: ヤコビ行列は偏微分を並べた行列。det J は面積の倍率。
