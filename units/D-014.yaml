# D-014 多変数関数の微分
#
# 段 6・水準 3・8 日。前提は D-008（1 変数関数の微分）と M-003（行列の演算）。
# 1 日目 偏微分と全微分、2 日目 連鎖律、3 日目 ヤコビ行列とヤコビ行列式、4 日目 極値（ヘッセ行列の D で極小・極大・鞍点）、
#   5 日目 ラグランジュ乗数（勾配が平行になる点）、6 日目 わけ、7 日目 混ぜる、8 日目 確認。
# 単元のことば（子の文で使う）：偏微分、全微分、連鎖律、ヤコビ行列、ヘッセ行列、鞍点、勾配、ラグランジュ乗数。
# 子の画面には text、svg、choices、ヒント、explain、paths を出す。answer、check、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図は svg（D-129〜D-131）：x の向き（y を止める）は赤、y の向き（x を止める）は空色、f の勾配 ∇f は緑、条件 g = 0 の線と ∇g はむらさき。
#   等高線は細い線で、そばの数は f の値。連鎖律は t から x、y を通って z へ行く木の図（赤の道と青の道）。
#   ヤコビ行列は、正方形の赤の辺と青の辺のうつり先（1 列目と 2 列目）。極値は x の向きと y の向きの断面の形。
# 1 日目と 2 日目の見本が今日の問題の答えをそのまま書いていたので、見本は数の例（断面のかたむき 4 と 7、z = x² + 3y）にした。
# 4 日目の選択肢「極値でない」は鞍点にも当てはまり、答えが 2 つになるので「判定できない（D = 0）」に変えた。
# 7・8 日目と腕だめしは、前の日と同じ問題のくり返しだったので、関数や点を変えた新しい問題にした（D-191）。

id: D-014
