# D-014 多変数関数の微分
#
# 段 6・水準 3・8 日。前提は D-008（1 変数関数の微分）と M-003（行列の演算）。
# 偏微分と全微分、連鎖律、ヤコビ行列、極値、ラグランジュ乗数を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: D-014
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          f(x, y) を、地図の上の点 (x, y) の高さだと考えます。
          y を固定して x だけ動かしたときの坂の傾きが ∂f/∂x、x を固定して y だけ動かしたときの傾きが ∂f/∂y です。
          x を dx、y を dy だけ動かしたときの高さの変化の 1 次近似が、全微分 df = (∂f/∂x) dx + (∂f/∂y) dy です。
          例：f = x²y + 3y なら、f_x = 2xy、f_y = x² + 3。
        explain: |-
          【定義】偏微分とは、ほかの変数を固定して、1 つの方向だけに動いたときの f の変化率です。
          地図でいえば、∂f/∂x は「南北の位置 y を変えずに東西に歩いたときの坂の傾き」、∂f/∂y は「東西の位置 x を変えずに南北に歩いたときの坂の傾き」です。
          【定義】全微分とは、x と y を同時に少しだけ動かしたときの f の変化を、1 次式で近似したものです。
          df = f_x dx + f_y dy の第 1 項は x の変化の寄与、第 2 項は y の変化の寄与です。
          ｜記号｜意味｜
          ｜∂f/∂x｜y を固定して x だけ動かしたときの変化率｜
          ｜∂f/∂y｜x を固定して y だけ動かしたときの変化率｜
          ｜df｜x と y を少し動かしたときの f の変化の 1 次近似｜
          例：f = x²y + 3y、点 (2, 1) を考えます。f(2,1) = 7。
          x だけ 0.1 増やすと f(2.1,1) = 7.41。変化は 0.41 で、f_x dx = 4 × 0.1 = 0.4 に近い。
          y だけ 0.1 増やすと f(2,1.1) = 7.7。変化は 0.7 で、f_y dy = 7 × 0.1 = 0.7。
          両方 0.1 ずつ増やすと f(2.1,1.1) = 8.151。変化は 1.151 で、df = 0.4 + 0.7 = 1.1 に近い。
        note: 偏微分は一方を固定した坂の傾き。全微分は 2 方向の変化を足した 1 次近似。
