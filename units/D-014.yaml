        svg: '<svg viewBox="0 0 320 136" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="13" text-anchor="middle" fill="currentColor">3 つの式を連立する</text><text x="120" y="48" font-size="15" text-anchor="end" fill="currentColor">f_x = λ g_x</text><line x1="128" y1="43" x2="152" y2="43" stroke="currentColor" stroke-width="1.8"/><polygon points="158,43 151,47 151,39" fill="currentColor"/><text x="166" y="48" font-size="15" text-anchor="start" fill="currentColor">2x = λ × 1</text><text x="120" y="80" font-size="15" text-anchor="end" fill="currentColor">f_y = λ g_y</text><line x1="128" y1="75" x2="152" y2="75" stroke="currentColor" stroke-width="1.8"/><polygon points="158,75 151,79 151,71" fill="currentColor"/><text x="166" y="80" font-size="15" text-anchor="start" fill="currentColor">2y = λ × 2</text><text x="120" y="112" font-size="15" text-anchor="end" fill="currentColor">g = 0</text><line x1="128" y1="107" x2="152" y2="107" stroke="currentColor" stroke-width="1.8"/><polygon points="158,107 151,111 151,103" fill="currentColor"/><text x="166" y="112" font-size="15" text-anchor="start" fill="currentColor">x + 2y = 10</text><path d="M28 30 Q18 30 18 40 L18 70 Q18 76 10 76 Q18 76 18 82 L18 112 Q18 122 28 122" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>'
      - y が x の何倍かを出して、条件の式に入れます。最後に、その点で x² + y² を計算します。
