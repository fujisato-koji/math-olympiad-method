  - day: 5
    items:
      - part: 見本
        id: "f46f85bc89"
        text: |-
          ラグランジュ乗数は、条件 g(x, y) = 0 の線の上で、f(x, y) の極値をさがす方法です。
          ∇f = (f_x, f_y) を f の勾配といいます。f がいちばん急に増える向きの矢印で、等高線に垂直です。∇g = (g_x, g_y) は g の勾配です。
          図のように、条件の線が f の等高線に接する点では ∇f と ∇g が平行（同じ直線の上）になり、接しない点では向きがちがいます。接する点が候補です。
          ∇f = λ∇g と g = 0 を連立して解きます。λ をラグランジュ乗数といいます。
