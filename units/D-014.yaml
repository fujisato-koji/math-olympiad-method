          「P から Q へは、y を止めて x を dx だけ動かすので、f の変化はかたむき f_x × dx に近い。Q から R へは、x を止めて y を dy だけ動かすので、f の変化は f_y × dy に近い（dx が小さいので、Q での f_y は P での f_y とほぼ同じ）。P から R までの変化は 2 つの和なので、df = f_x dx + f_y dy。」と書ければよい。
          ① x の変化、② y の変化、③ 足し合わせる。子どもには、f = x² + y² などの具体的な f で確かめさせます。
