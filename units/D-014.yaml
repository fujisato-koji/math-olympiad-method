  - day: 4
    items:
      - part: 見本
        id: "05ce895a66"
        text: |-
          2 変数関数の極値：f_x = 0、f_y = 0 となる点（坂が平らな点）が候補です。
          候補の点で、ヘッセ行列 H = (∂²f/∂x² ∂²f/∂x∂y；∂²f/∂x∂y ∂²f/∂y²) の行列式 D = (∂²f/∂x²)(∂²f/∂y²) − (∂²f/∂x∂y)² を計算します。
          図のように、D > 0 で ∂²f/∂x² > 0 なら谷の底（極小）、D > 0 で ∂²f/∂x² < 0 なら山の頂上（極大）です。
          D < 0 なら、ある向きには谷、別の向きには山になる鞍点（馬のくらの形）で、極値ではありません。D = 0 のときは、これだけでは判定できません。
        svg: '<svg viewBox="0 0 360 216" xmlns="http://www.w3.org/2000/svg"><text x="60" y="22" font-size="13" text-anchor="middle" fill="currentColor">極小（谷の底）</text><polyline points="10,42 12.1,51.9 14.2,60.7 16.3,68.5 18.4,75.3 20.5,81 22.6,85.7 24.7,89.3 26.8,91.9 28.9,93.5 31,94 33.1,93.5 35.2,91.9 37.3,89.3 39.4,85.7 41.5,81 43.6,75.3 45.7,68.5 47.8,60.7 49.9,51.9 52,42" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="31" cy="94" r="3.5" fill="currentColor"/><polyline points="68,42 70.1,51.9 72.2,60.7 74.3,68.5 76.4,75.3 78.5,81 80.6,85.7 82.7,89.3 84.8,91.9 86.9,93.5 89,94 91.1,93.5 93.2,91.9 95.3,89.3 97.4,85.7 99.5,81 101.6,75.3 103.7,68.5 105.8,60.7 107.9,51.9 110,42" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="89" cy="94" r="3.5" fill="currentColor"/><text x="31" y="122" font-size="12" text-anchor="middle" fill="currentColor">x の向き</text><text x="89" y="122" font-size="12" text-anchor="middle" fill="currentColor">y の向き</text><rect x="6" y="136" width="108" height="46" rx="8" fill="#f3c969" fill-opacity="0.3"/><text x="60" y="155" font-size="13" text-anchor="middle" fill="currentColor">D &gt; 0</text><text x="60" y="174" font-size="13" text-anchor="middle" fill="currentColor">∂²f/∂x² &gt; 0</text><text x="180" y="22" font-size="13" text-anchor="middle" fill="currentColor">極大（山の頂上）</text><polyline points="130,94 132.1,84.1 134.2,75.3 136.3,67.5 138.4,60.7 140.5,55 142.6,50.3 144.7,46.7 146.8,44.1 148.9,42.5 151,42 153.1,42.5 155.2,44.1 157.3,46.7 159.4,50.3 161.5,55 163.6,60.7 165.7,67.5 167.8,75.3 169.9,84.1 172,94" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="151" cy="42" r="3.5" fill="currentColor"/><polyline points="188,94 190.1,84.1 192.2,75.3 194.3,67.5 196.4,60.7 198.5,55 200.6,50.3 202.7,46.7 204.8,44.1 206.9,42.5 209,42 211.1,42.5 213.2,44.1 215.3,46.7 217.4,50.3 219.5,55 221.6,60.7 223.7,67.5 225.8,75.3 227.9,84.1 230,94" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="209" cy="42" r="3.5" fill="currentColor"/><text x="151" y="122" font-size="12" text-anchor="middle" fill="currentColor">x の向き</text><text x="209" y="122" font-size="12" text-anchor="middle" fill="currentColor">y の向き</text><rect x="126" y="136" width="108" height="46" rx="8" fill="#f3c969" fill-opacity="0.3"/><text x="180" y="155" font-size="13" text-anchor="middle" fill="currentColor">D &gt; 0</text><text x="180" y="174" font-size="13" text-anchor="middle" fill="currentColor">∂²f/∂x² &lt; 0</text><text x="300" y="22" font-size="13" text-anchor="middle" fill="currentColor">鞍点（馬のくら）</text><polyline points="250,42 252.1,51.9 254.2,60.7 256.3,68.5 258.4,75.3 260.5,81 262.6,85.7 264.7,89.3 266.8,91.9 268.9,93.5 271,94 273.1,93.5 275.2,91.9 277.3,89.3 279.4,85.7 281.5,81 283.6,75.3 285.7,68.5 287.8,60.7 289.9,51.9 292,42" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="271" cy="94" r="3.5" fill="currentColor"/><polyline points="308,94 310.1,84.1 312.2,75.3 314.3,67.5 316.4,60.7 318.5,55 320.6,50.3 322.7,46.7 324.8,44.1 326.9,42.5 329,42 331.1,42.5 333.2,44.1 335.3,46.7 337.4,50.3 339.5,55 341.6,60.7 343.7,67.5 345.8,75.3 347.9,84.1 350,94" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="329" cy="42" r="3.5" fill="currentColor"/><text x="271" y="122" font-size="12" text-anchor="middle" fill="currentColor">x の向き</text><text x="329" y="122" font-size="12" text-anchor="middle" fill="currentColor">y の向き</text><rect x="246" y="136" width="108" height="46" rx="8" fill="#b39ddb" fill-opacity="0.3"/><text x="300" y="155" font-size="13" text-anchor="middle" fill="currentColor">D &lt; 0</text><text x="300" y="174" font-size="13" text-anchor="middle" fill="currentColor">極値ではない</text><line x1="120" y1="14" x2="120" y2="186" stroke="#c8ccd6" stroke-width="1.2"/><line x1="240" y1="14" x2="240" y2="186" stroke="#c8ccd6" stroke-width="1.2"/><text x="180" y="206" font-size="13" text-anchor="middle" fill="currentColor">D = 0 のときは、これだけでは判定できない</text></svg>'
        explain: |-
          極値の候補は、坂が平らになる点です。ヘッセ行列は、その点のまわりの曲がり方を表します。
          ∂²f/∂x² は f_x をもう一度 x で微分したもの、∂²f/∂x∂y は f_x を y で微分したものです。
          D > 0 なら、どの向きに切っても同じ向きに曲がる谷か山、D < 0 なら、向きによって谷にも山にもなる馬のくらのような形です。
          例：f = 2 − x² − y² は (0, 0) で ∂²f/∂x² = −2、∂²f/∂y² = −2、∂²f/∂x∂y = 0、D = 4 > 0 なので極大（山の頂上）。
        note: f_x=f_y=0 が候補。D=∂²f/∂x² ∂²f/∂y²−(∂²f/∂x∂y)² で判定。
