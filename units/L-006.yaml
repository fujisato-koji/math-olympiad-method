          - どの箱にも 2 こずつ入れると、ボールは何こ残るかな。図で数えよう。
          - 残ったボールが入った箱は、何こになるかな。
        paths:
          - [どの箱にも 2 こずつ入れる, 1 こ残る, 残りが入った箱は 3 こ, 3 こ]
