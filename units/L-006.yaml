# L-006 鳩の巣原理の入口
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く。
# 前提は C-001（もれなく数える）だけで、たどっても N-001（10 までの数）までなので、数は 10 まで。
# たし算とひき算の式は使わず、図を数えることと「いくつといくつ」で考える。
# 日の並びは地図の既定（導入、練習、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：入れ物より多い数の物を入れると、2 こ以上入る入れ物が必ずある。入れ物と同じ数なら、そうとはいえない（1 こずつ入れられる）。
#   2 日目 練習：いちばん都合の悪い取り出し方を考えて、「必ず同じ色が 2 こ」になる数を出す（色の数より 1 つ多い）。色ごとの数が決まっているふくろも。
#   3 日目 わけ：代表の例で、必ずいえるわけ（1 こずつ入れても入りきらない）、取り出す数のわけ、いえないわけ（反対の例が 1 つある）を文に書く。
#   4 日目 混ぜる：C-001 の型（散らばった物を数える、種類ごとに数える）で入れ物と物の数を数えてから考える。からの入れ物が必ずある、も。
#   5 日目 確認。
# 「n こずつ入れても余る」から k こ以上を言う一般の形（わり算を使う）は L-015 なので、3 こ以上の箱は図で数えられる小さな数までにした。
# check：入れ方は、物が入る箱の組を itertools.combinations_with_replacement で全部作り（同じ物は区別しない）、どの入れ方でも成り立つかを調べる。
# 「少なくとも何こ」は、全部の入れ方で「いちばん多い箱の数」を出し、そのいちばん小さい値。
# 取り出す問題は、取り出した色の組を全部作り、k こ取り出せばどの組でも同じ色がそろう いちばん小さい k を探す。
# 色ごとの数が決まっているふくろは、取り出す順を permutations で全部作り、いちばん遅くそろう順で数える。
# ただし腕だめしの最難関（12 この点と 3 でわり切れる番号の和）だけは例外で、uses に N-014、N-022、L-007 を挙げて、3 でわったあまり（あまりの和）、20 までの数、3 つの数のたし算の式、九九の式（2 × 2 = 4 など）と 20 ÷ 2 = 10、場合分けを使う。

id: L-006
days:
  - day: 1
    items:
      - part: 見本
        text: 巣が 3 つあります。はとが 4 羽、どれかの巣に入ります。どんな入り方をしても、2 羽以上いる巣があるでしょうか。
        figure: "🏠🏠🏠\n🐦🐦🐦🐦"
        explain: はとを 1 羽ずつ、ちがう巣に入れていくと、3 羽で 3 つの巣が 1 羽ずつになります。4 羽目は、どこかの巣に入るしかありません。その巣は 2 羽になります。はじめから同じ巣に入れても、2 羽以上の巣があります。だから、どんな入り方でも、2 羽以上いる巣が必ずあります。
      - part: 思い出す
        text: はとは何羽いますか。
        figure: "🐦　　🐦\n　🐦　🐦\n🐦　🐦　🐦"
        answer: 7
        check: "n('🐦')"
        hints:
          - 1 羽ずつ指でさして数えよう。
          - 数えたはとに、心の中で印をつけよう。
          - 上の行から順に数えると、数えわすれにくいよ。
        paths:
          - [上の行から順に数える, 7 羽]
      - part: 思い出す
        text: 8 は 5 といくつですか。
        figure: 🔵🔵🔵🔵🔵⚪⚪⚪
        answer: 3
        check: "n('⚪')"
        hints:
          - 🔵 を数えよう。
          - 🔵 のあとの ⚪ を数えよう。
          - 全部で 8 こあることも確かめよう。
        paths:
          - [🔵 が 5 こ, ⚪ を数える, 3]
      - part: 今日
        text: 箱が 4 つあります。ボールを 5 こ、どれかの箱に入れます。どんな入れ方をしても、ボールが 2 こ以上入った箱があるといえますか。
        figure: "📦📦📦📦\n⚽⚽⚽⚽⚽"
        choices: [いえる, いえない]
        answer: いえる
        check: "'いえる' if all(any(p.count(b) >= 2 for b in range(4)) for p in itertools.combinations_with_replacement(range(4), 5)) else 'いえない'"
        hints:
          - まず、ボールを 1 こずつ、ちがう箱に入れてみよう。
          - 4 つの箱に 1 こずつ入れると、ボールは何こ残るかな。
          - 残ったボールは、どこに入れることになるかな。
        paths:
          - [1 こずつ入れると 4 こで箱がうまる, 残りの 1 こはどこかの箱に入る, その箱は 2 こになる, いえる]
        note: いくつかの入れ方を試して「2 この箱があった」だけでは、どの入れ方でもそうなるとは言い切れない。「なるべく分けて 1 こずつ入れても入りきらない」と考えさせる。
      - part: 今日
        text: 箱が 5 つあります。ボールを 5 こ、どれかの箱に入れます。どんな入れ方をしても、ボールが 2 こ以上入った箱があるといえますか。
        figure: "📦📦📦📦📦\n⚽⚽⚽⚽⚽"
        choices: [いえる, いえない]
        answer: いえない
        check: "'いえる' if all(any(p.count(b) >= 2 for b in range(5)) for p in itertools.combinations_with_replacement(range(5), 5)) else 'いえない'"
        hints:
          - ボールを 1 こずつ、ちがう箱に入れてみよう。
          - 5 つの箱に 1 こずつ入れると、ボールは残るかな。
          - どの箱も 1 こずつになる入れ方があれば、「どんな入れ方でも」とはいえないね。
        paths:
          - [1 こずつ入れるとちょうど全部入る, どの箱も 1 こ, 2 この箱がない入れ方がある, いえない]
        note: 「2 こ入れることもできる」から「いえる」と答えやすい。たずねているのは「どんな入れ方でも」なので、1 つでも 2 こにならない入れ方があれば「いえない」。
      - part: 今日
        text: 水そうが 3 つあります。金魚を 4 ひき、どれかの水そうに入れます。どんな入れ方をしても、金魚がいちばん多い水そうには、少なくとも何びきいますか。
        figure: "🟦🟦🟦\n🐟🐟🐟🐟"
        answer: 2
        check: "min(max(p.count(b) for b in range(3)) for p in itertools.combinations_with_replacement(range(3), 4))"
        hints:
          - 金魚がなるべく分かれるように入れてみよう。
          - 3 つの水そうに 1 ぴきずつ入れると、何びき残るかな。
          - 残った金魚が入った水そうは、何びきになるかな。
