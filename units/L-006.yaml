      - 左のあまりが 0 のなかまは、（0、0）、（0、1）、（0、2）の 3 つ。このうち 2 つを決めると、3 つめのなかまは、左のあまりが 0 + 0 + □ = 3 でわり切れる □ = 0 で、また左のあまりが 0 のなかま（のこりの 1 つ）になる。だから、左のあまりが 0 のなかまを 2 つ使うと、のこりの 1 つは使えない。左のあまりが 0 のなかまは 2 つまで。えらべる点の数は、使うなかまの数に、左のあまりが 0 のなかまの数（2 点えらべるぶん）をたした数以下。4 つのなかまなら 2 × 2 + 1 × 2 = 6 点まで（左のあまりが 0 のなかまがもっと少なければ、もっと少ない）、3 つ以下なら 2 + 2 + 1 = 5 点まで。だから、えらべる点は 6 点まで
      - 6 この例は 1 本目と同じ（左から 0・下から 0、左から 3・下から 0、左から 0・下から 1、左から 3・下から 1、左から 1・下から 0、左から 1・下から 1。なかまは（0、0）、（0、1）、（1、0）、（1、1））。2 本目の言い方で確かめる：この 4 つから 2 つをえらぶ 6 組の 3 つめのなかまは、（0、0）と（0、1）なら（0、2）、（0、0）と（1、0）なら（2、0）、（0、0）と（1、1）なら（2、2）、（0、1）と（1、0）なら（2、2）、（0、1）と（1、1）なら（2、1）、（1、0）と（1、1）なら（1、2）。どれも使う 4 つの外。同じなかまの 2 点を使うときは、1 段目のとおり、3 つめが同じなかまのときしかだめにならない。だから、どの 3 点もだめにならず、6 点えらべて、答えは 6
    note: 考えどころは 3 つ：①点を、左からの番号を 3 でわったあまりと、下からの番号の組で 9 つの「なかま」に分ける。左のあまりが 0 のなかまは点が 2 こずつ、1 と 2 のなかまは 1 こずつ（下は 0〜2 なので、下のあまりは番号そのもの）。3 つの点がだめ（左も下も和が 3 でわり切れる）かどうかは、なかまだけで決まる。同じなかまの 2 点ともう 1 点がだめになるのは、もう 1 点も同じなかまのときだけだが、1 つのなかまには点が 2 こまでしかないので、おきない。②5 つのなかまを使うと、だめな 3 つがかならずできる。だから使えるなかまは 4 つまで。③左のあまりが 0 のなかま（2 こずつのなかま）は、3 つは使えない（3 つの下のあまりが 0、1、2 で、和が左も下も 3 でわり切れる）。だから 2 こずつのなかまは 2 つまでで、4 つのなかまなら 2 × 2 + 1 × 2 = 6、3 つ以下なら 2 + 2 + 1 = 5 まで。よって 6。例がある。2 本目は 1 本目とちがい、場合を分けない。1 段目は 2 本で同じで、どの道もここを通る土台。ちがうのは「5 つのなかまは使えない」わけと、③ の言い方。1 本目は、5 つのなかまを左のあまりで 3 つの組に分けて、組の大きさが 3 のときと 2、2、1 のときに分けて、ハトのす原理でだめな 3 つを見つける。③ は「左のあまりが同じ組には 3 つのなかまは入らない」という見方で言う。2 本目は、2 つのなかまを決めると「3 つめのなかま」が 1 つに決まることを数えて、外の 4 つのなかまが 3 つめになれる組は多くて 8 組なのに、5 つのなかまから 2 つをえらぶ組は 10 通りあって足りない、と出す。③ は「左のあまりが 0 のなかま 2 つから決まる 3 つめは、また左のあまりが 0 のなかま」という見方で言う。check は、12 この点に番号をつけて、すでにえらんだ 2 点との 3 つの組がだめにならない点だけを 1 つずつ足していく、くり返しの探し方（バックトラック）で、えらべる点の数のいちばん大きい値を調べる式（すぐ終わる）。道の数 6 はなぞっていない。既出・出どころ：「どの 9 この点にも、番号の和がそろって 3 でわり切れる 3 点がある」は、ケムニッツの予想の 3 の場合（エルデシュ・ギンツブルグ・ジブの定理を 2 次元にした形）で、King's Maths School の毎週の問題 157 にも、同じ形で答えが 8 の問いがある。ここは、なかまの点の数が 2 こと 1 こにちがうので答えが 6 になり、③ の段がふえる。2 本目の組の数のくらべ方（10 組と 4 × 2 組）は、C-018 のいちばん多い数の見つけ方と同じ形。わな：なかまが 9 つあるので 9 × 2 = 18 と答える、昔からある問いの答え 8 と答える、2 こずつ 4 つのなかまで 8 と答える（2 こずつのなかまは 2 つまで）。
