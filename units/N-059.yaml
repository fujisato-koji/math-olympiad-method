# N-059 時刻と時間
#
# 書き方は N-001 の頭の注のとおり。とびとびの数の並びの図と check は N-006 の頭の注のとおり。
# ちょうどの時刻と「はん」の時計は、時計の絵文字（🕐〜🕛 と 🕜〜🕧。どれも 1 字）で描く。
#   check は '🕐🕑🕒🕓🕔🕕🕖🕗🕘🕙🕚🕛'.index(fig) + 1 で何時か、半の時計は '🕜🕝🕞🕟🕠🕡🕢🕣🕤🕥🕦🕧' で同じように出す。
# 何時何分の時計は、針の位置を文字で書く図にする（1 行目「みじかい はり：3 と 4 の あいだ」、2 行目「ながい はり：5」）。
#   check の何時は 1 行目の「：」の後ろの最初の数、何分は 2 行目の数の 5 倍（N-013 の前なので、子には「5 ずつ数える」と言う）。
#   時間の長さの図の「ながい はり：2 → 7」は、長い針がどの数字からどの数字まで動くかを表す。
# 分の読み方は、0 で終わる数を「ぷん」、5 で終わる数を「ふん」と書く（10 ぷん、15 ふん）。
# 「3 じ 25 ふん」のような時刻の答えは鍵盤で打てないので choices にする。数だけを打つのは、何時か、何分か、何分間か、何時間か。
#   時刻の check は (lambda t: …)(時 * 60 + 分 + 進む分) で、t // 60 を時、t % 60 を分にして選択肢の文字をつくる。
# 前提は N-006 だけで、2 けたのたし算・ひき算（N-007）は前提にない。時間の計算は、時計の上で 5 ずつ・10 ずつ数えて進む、
#   もどる（N-006 のとびとびの数え方）と、何時間かの 20 までの計算（N-005）にとどめる。何時をまたぐときは「あと何分で
#   ちょうどになるか」で分ける（N-005 の 10 をつくる考えと同じ形）。
# 地図の題に秒はなく、段 2 の範囲を考えて秒は扱わない（秒を使う P-188 などで入れる）。
# ごぜん・ごごは 3 日目（わけの日）の頭に見本を置いて入れる。昼の 12 時ちょうどは、ごぜんかごごかで迷うので答えにしない。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-007 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

