    note: 鏡に映すと左右が入れかわる（G-004）ことを、時計の針の位置に使う。見えたままの「4 時 45 分」を選ぶ誤りがいちばん多い。12 と 6 を結ぶ線を鏡（折り目）にして、針を反対側へ移すと考えるとよい。長い針から決めると、短い針が 7 のすぐそばにあることも確かめやすい。
  - part: 離
    kinds: [数, 手数, 読み取り]
    text: 🐶 と 🐱 と 🐰 が、あさ おきた じこくを くらべました。🐶 は 🐱 より 20 ぷん はやく おきました。🐰 は 6 じ 50 ぷんに おきました。🐱 は 🐰 より 15 ふん おそく おきました。🐶 は なんじ なんぷんに おきましたか。
    choices: [6 じ 45 ふん, 7 じ 25 ふん, 6 じ 35 ふん, 7 じ 5 ふん]
    answer: 6 じ 45 ふん
    check: "(lambda t: f'{t // 60} じ {t % 60} ' + ('ぷん' if t % 10 == 0 else 'ふん'))(6 * 60 + 50 + 15 - 20)"
    hints:
      - じこくが わかって いるのは 🐰 だけ。🐰 から はじめよう。
      - 🐱 は 🐰 より おそい。🐱 は なんじ なんぷんに おきたかな。
      - 🐶 は 🐱 より はやい。🐱 の じこくから もどそう。
    paths:
      - [🐰 は 6 じ 50 ぷん, 🐱 は その 15 ふん あとで 7 じ 5 ふん, 🐶 は 7 じ 5 ふんの 20 ぷん まえで 6 じ 45 ふん, 6 じ 45 ふん]
    note: 文の順と、時刻が決まる順がちがう。わかっている 🐰 から順に決める。7 時をまたいで進み、またもどる（何時をまたぐときは「あと何分でちょうど」で分ける）。「はやく」を「あと」と読みちがえて 7 時 25 分を選ぶ誤り、🐱 の時刻（7 時 5 分）を答える誤りがある。
