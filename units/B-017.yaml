      - part: わけ
        text: |-
          虫が すんで いる ところを「すみか」と いいます。
          ちょうは 花だん、ばったは 草むら、かぶとむしは 木の ある 林が すみかです。
          虫が その ばしょを すみかに して いる わけを、えを 見ながら くちで せつめいして みよう。
