troke="none">むね</text><rect x="257" y="160" width="16" height="16" rx="4" fill="#7fc8f8" fill-opacity="0.7" stroke-width="1.5"/><text x="277" y="173" font-size="13" text-anchor="start" fill="currentColor" stroke="none">はら</text></g></svg>'
        explain: |-
          こん虫の からだは あたま・むね・はらの 3 つに わかれ、むねに 足が 6 本 あります。これが こん虫の しるしです。あたまには 目・口・しょっかくが あり、しょっかくで においや まわりの ようすを かんじとります。はねは おおくの こん虫で 4 まい あり、むねに ついて います（はたらきありの ように、はねの ない こん虫も います）。
          えでは、あたまを きいろ、むねを 赤、はらを みずいろで ぬりわけ、足も むねと おなじ 赤で かきました。となりの とんぼでは、はねも むねに ついて いる ことを 見せました。「足は むねから 出て いる」が 見て わかれば よい。こうえんで ありや ばったを 見つけたら、虫めがねで 足の つけねを いっしょに 見て みましょう。
