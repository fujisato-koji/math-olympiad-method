# B-017 動物のからだとくらし
#
# 段 1・水準 1・5 日。こん虫のからだ（あたま・むね・はらの 3 つ、むねに足が 6 本とはね、あたまに目・口・しょっかく）、虫の食べ物（ちょうは花のみつ、ばったは草の葉、かぶとむしは木のしる）、すみか（食べ物があり、かくれられる所にすむ）を扱う。
# 日の並びは 導入（こん虫のからだ）・練習（食べ物）・わけ（すみか。食べ物のある所にすむわけ）・混ぜる・確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の約束：虫は上から見た形でかく。見本と図の付いたヒントでは、あたまを黄、むねを赤、はらを水色でぬり分ける。赤いてんせんの丸は「見るところ」。ちがう答えを消すヒントには、その虫が食べているところの絵を並べる。せみが みきに 口を さす 図だけは、よこから 見た 形で かく。
# くもとだんごむしは、こん虫と比べるために出す（なかま分けは B-018）。たまご・幼虫・さなぎは B-070、口の形や体の色とすみかは B-072 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも読み取り（かんさつカードと、公園の絵を読む）。

id: B-017
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          こん虫の からだは、あたま・むね・はらの 3 つに わかれて います。
          あたまには、目と 口と、ほそながい しょっかくが 2 本 あります。
          むねには 足が 6 本 ついて います。はねの ある こん虫は、はねも むねに ついて います。
          あり、ばった、ちょうは、どれも こん虫です。
