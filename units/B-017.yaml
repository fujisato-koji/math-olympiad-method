        explain: |-
          「ちょうは 花の みつ、ばったは 草の は、かぶとむしは 木の しるを たべる。だから、それぞれ たべものが ある ところに すんで いる。草むらや 木の かげ、石の 下は、とりなどから かくれる ことも できる。」と いえれば よい。① 虫ごとの たべもの（2 日目）、② その たべものが ある ばしょ、③ かくれる ところが ある、の 3 つが 入れば じゅうぶんです。
          こうえんや みちばたで 虫を 見つけたら、「この 虫は ここで なにを たべて いるのかな」「どこに かくれるのかな」と いっしょに 見て みましょう。石を どける ときは、おうちの ひとが 先に 見て あげると あんしんです。
        hints:
          - 2 日目に、それぞれの 虫が なにを たべて いたかを おもいだそう。
          - text: 草むらの ばったを 大きく したよ。ばったの まわりに なにが あるかな。
