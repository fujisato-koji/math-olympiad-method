        explain: |-
          虫の たべものは、しゅるいに よって ちがいます。ちょう（おとなの ちょう）は 花の みつ、ばったは イネなどの 草の は、かぶとむしは クヌギや コナラの 木から 出る しるを たべます。かまきりや とんぼの ように、ほかの 虫を つかまえて たべる 虫も います。
          ばったが いた 草の はには、かじった あとが のこって いる ことが あります。口の かたちが たべものに あって いる ことは、あとの たんげんで あつかいます。きょうは「この 虫は これを たべる」が むすびつけば よい。
