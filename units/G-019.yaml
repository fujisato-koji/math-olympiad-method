# G-019 三平方の定理
#
# 書き方は N-001 の頭の注のとおり。答えの形と √ の check は A-016 に合わせる。
# 三平方の定理：直角三角形の直角をはさむ 2 辺を a、b、斜辺（直角に向かい合う辺）を c とすると a² + b² = c²。
#   逆：三角形の 3 辺 a、b、c で a² + b² = c² ならば、c に向かい合う角は直角。
# ことば：斜辺、直角二等辺三角形（辺の比 1:1:√2）、30°・60°・90° の直角三角形（辺の比 1:2:√3）、方眼の上の 2 点の距離。
# 前提は G-017（三角形と四角形の性質）、A-016（平方根）、G-020（相似の証明）、G-008（面積）。G-017 から、二等辺三角形の頂角から
#   底辺にひいた垂線は底辺を 2 等分すること、正三角形、ひし形の対角線は垂直に交わり互いに 2 等分すること、長方形の性質を使う。
#   逆の証明の合同条件は G-016。
# 前提の道に 1 次方程式（A-011）と 2 次方程式（A-017）がないので、「x² + 4² = (8 − x)²」のような方程式を立てる問題
#   （折り返し、3 辺から高さを求める）は扱わない。わからない辺は「2 乗すると ○ になる正の数」として √ で求める（A-016）。
# 円（G-010）と座標（G-050、A-006）は前提の道にないので、円の弦や接線、座標の 2 点の距離は扱わず、方眼（1 目 1 cm）の上の点で距離を求める。
#   空間図形への使い方（直方体の対角線、円錐の高さ）は G-021 で扱う。
# 図は svg（D-040）。長さの比は問題の数に合わせて描いた。直角のしるしは、直角とわかっている角だけにつけた（逆の問題ではつけない）。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 三平方の定理（方眼の正方形の面積で見る）、斜辺とほかの辺を求める　2 日目 特別な直角三角形、正方形の対角線、正三角形と二等辺三角形の高さ
#   3 日目 三平方の定理の逆、方眼の上の長さ、台形とひし形　4 日目 わけ（面積による証明、相似による証明、逆の証明）
#   5 日目 G-017（形の性質）・A-016（平方根の計算）・G-020（相似）・G-008（面積）と混ぜる　6 日目 確認
# check：整数になる長さは、2 乗してその数になる整数をさがす式。√ を含む答えは choices にし、選択肢ごとの値（math.sqrt）が
#   問題の長さの式と近い（math.isclose）ものを選び出す（A-016 と同じ）。逆の問題は、2 辺の 2 乗の和と残りの辺の 2 乗をくらべる式。
# 三平方の定理は、2 点の距離と円の方程式（G-026）、三角比（G-024）、ベクトルの大きさ、空間の距離（G-021）、
#   物理の速さの合成や波の干渉の計算の道具になる（D-026）。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-011、A-017 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

