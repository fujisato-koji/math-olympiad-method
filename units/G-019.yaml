    answer: 1.4
    check: "(math.isqrt(650 ** 2 - (math.isqrt(650 ** 2 - 250 ** 2) - 80) ** 2) - 250) / 100"
    hints:
      - はしご、かべ、地面で直角三角形ができるね。はじめの上のはしの高さを求めよう。
      - ずれたあとの高さは、はじめの高さより 0.8 m 低いよ。
      - ずれたあとの、下のはしとかべの距離を求めて、2.5 m とくらべよう。10 倍して考えると計算しやすいよ。
    paths:
      - [はじめの高さ = √(6.5² − 2.5²) = √(42.25 − 6.25) = √36 = 6, ずれたあとの高さ = 6 − 0.8 = 5.2, かべまでの距離 = √(42.25 − 27.04) = √15.21 = 3.9, 3.9 − 2.5 = 1.4, 1.4 m]
      - [長さを 10 倍して 65 と 25 で考える, 25・60・65 は 5・12・13 の 5 倍で、高さは 60, 52 と 65 は 4 と 5 の 13 倍なので、残りの辺は 3 の 13 倍で 39, 39 − 25 = 14 を 10 でわって 1.4 m]
    note: 三平方の定理を 2 回使い、小数の 2 乗と平方根（15.21 = 3.9 × 3.9）を計算する。10 倍して 5・12・13 と 3・4・5 の形を見つけると速い。上が 0.8 m 下がっても、下が 0.8 m 動くわけではないことに気づかせたい。
