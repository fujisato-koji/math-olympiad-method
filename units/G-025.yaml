        id: "81737ff7e1"
        text: 2 つの角の和や差の三角関数を、もとの角の三角関数で表しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="16" y1="188" x2="224" y2="188" stroke="currentColor" stroke-width="1.5"/><line x1="26" y1="188" x2="210.9" y2="101.8" stroke="currentColor" stroke-width="1.5"/><polygon points="26,188 60,188 59.9,185.9 59.7,183.8 59.4,181.7 58.9,179.6 58.4,177.6 57.6,175.6 56.8,173.6" fill="#7fc8f8" fill-opacity="0.45" stroke="none"/><polygon points="26,188 56.8,173.6 55.9,171.7 54.8,169.9 53.6,168.2 52.3,166.5 51,164.9 49.5,163.4 47.9,162 46.3,160.7 44.5,159.5" fill="#f3c969" fill-opacity="0.6" stroke="none"/><line x1="134.9" y1="116.3" x2="134.9" y2="188" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="134.9" y1="116.3" x2="179.7" y2="116.3" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="179.7" y1="116.3" x2="179.7" y2="188" stroke="#7fc8f8" stroke-width="5"/><line x1="134.9" y1="20.3" x2="134.9" y2="116.3" stroke="#f08080" stroke-width="5"/><line x1="26" y1="188" x2="134.9" y2="20.3" stroke="currentColor" stroke-width="2.5"/><line x1="179.7" y1="116.3" x2="134.9" y2="20.3" stroke="currentColor" stroke-width="2"/><polyline points="171.6,120.1 167.8,112 175.9,108.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="134.9" cy="20.3" r="4" fill="currentColor"/><circle cx="179.7" cy="116.3" r="4" fill="currentColor"/><text x="128.9" y="22.3" font-size="14" text-anchor="end">P</text><text x="186.7" y="120.3" font-size="14" text-anchor="start">Q</text><text x="22" y="190" font-size="13" text-anchor="end">O</text><text x="65" y="110.9" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">1</text><text x="127.2" y="160.8" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">cos β</text><text x="174.5" y="76.5" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">sin β</text><text x="73" y="183.5" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">α</text><text x="60.7" y="162.8" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">β</text><line x1="214" y1="40" x2="236" y2="40" stroke="#f08080" stroke-width="5"/><text x="242" y="45" font-size="13" text-anchor="start">cos α sin β</text><line x1="214" y1="64" x2="236" y2="64" stroke="#7fc8f8" stroke-width="5"/><text x="242" y="69" font-size="13" text-anchor="start">sin α cos β</text><text x="214" y="98" font-size="13" text-anchor="start">2 つを合わせると</text><text x="214" y="118" font-size="13" text-anchor="start">P の高さ sin(α + β)</text></svg>'
        explain: |-
          α、β は 2 つの角、θ は直線が x 軸の正の向きとなす角、m は直線の傾きです。
          次の加法定理が成り立ちます（わけは 6 日目）。
          ・sin(α + β) = sin α cos β + cos α sin β
          ・sin(α − β) = sin α cos β − cos α sin β
          ・cos(α + β) = cos α cos β − sin α sin β
          ・cos(α − β) = cos α cos β + sin α sin β
          ・tan(α + β) = (tan α + tan β)/(1 − tan α tan β)
          ・tan(α − β) = (tan α − tan β)/(1 + tan α tan β)
          図では、OP = 1 の P の高さ sin(α + β) が、青い sin α cos β と赤い cos α sin β の 2 つに分かれています（OQ = cos β、QP = sin β で、α、β が鋭角のとき）。
          例：sin 75° = sin(45° + 30°)
          = sin 45° cos 30° + cos 45° sin 30°
          = ((√2)/2) × ((√3)/2) + ((√2)/2) × (1/2) = (√6 + √2)/4 です。
          tan の式は、sin(α + β)/cos(α + β) の分子と分母を cos α cos β でわると得られます。
          直線 y = mx の傾き m は、直線と x 軸の正の向きのなす角を θ とすると m = tan θ です。
          2 直線 y = 3x、y = (1/2)x と x 軸の正の向きのなす角を α、β とすると、
          tan(α − β) = (3 − 1/2)/(1 + 3 × (1/2)) = 1 なので、2 直線のなす角は π/4 です。
