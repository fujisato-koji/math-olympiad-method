        explain: 例：「単位円の上に P(cos α, sin α)、Q(cos β, sin β) をとる。2 点間の距離の式（G-026）から、PQ² = (cos α − cos β)² + (sin α − sin β)² = (cos²α + sin²α) + (cos²β + sin²β) − 2(cos α cos β + sin α sin β) = 2 − 2(cos α cos β + sin α sin β) である。次に、P と Q を原点のまわりに −β だけ回すと、Q は A(1, 0) に、P は角 α − β の動径の上の点 P′(cos(α − β), sin(α − β)) に移る。回しても 2 点の距離は変わらない（G-015）ので PQ = AP′ で、AP′² = (cos(α − β) − 1)² + sin²(α − β) = 2 − 2cos(α − β) である。2 つの式を等しいとおくと、cos(α − β) = cos α cos β + sin α sin β である。」と書ければよい。① P、Q、A、P′ を決める、② 距離の 2 乗を展開して sin² + cos² = 1 でまとめる、③ 約束した事実（三角関数の定め方、2 点間の距離、回しても長さは変わらない）で結ぶ、の 3 つがそろっているかを見る。α − β が 0 から π の間なら、△OPQ に余弦定理（G-024）を使って PQ² = 1 + 1 − 2cos(α − β) としてもよい。60° と 30° のような例で確かめただけで終わっていたら、例ではすべての角を示せないことを話す。
