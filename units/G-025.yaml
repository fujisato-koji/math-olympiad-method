        id: "4277514f17"
        text: 単位円（原点を中心とする半径 1 の円）を使って、一般角の三角関数を定めましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="54" y1="100" x2="241" y2="100" stroke="currentColor" stroke-width="2"/><polygon points="246,100 237,104.5 237,95.5" fill="currentColor" stroke="none"/><line x1="150" y1="196" x2="150" y2="9" stroke="currentColor" stroke-width="2"/><polygon points="150,4 154.5,13 145.5,13" fill="currentColor" stroke="none"/><text x="244" y="117" font-size="14" text-anchor="end" font-style="italic">x</text><text x="158" y="16" font-size="14" text-anchor="start" font-style="italic">y</text><text x="145" y="116" font-size="13" text-anchor="end">O</text><circle cx="150" cy="100" r="72" fill="none" stroke="currentColor" stroke-width="2"/><text x="226" y="116" font-size="13" text-anchor="start">1</text><text x="74" y="116" font-size="13" text-anchor="end">−1</text><text x="145" y="24" font-size="13" text-anchor="end">1</text><text x="145" y="186" font-size="13" text-anchor="end">−1</text><line x1="103.7" y1="100" x2="150" y2="100" stroke="#7fc8f8" stroke-width="5"/><line x1="103.7" y1="44.8" x2="103.7" y2="100" stroke="#f08080" stroke-width="5"/><line x1="103.7" y1="44.8" x2="103.7" y2="100" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="150" y1="100" x2="103.7" y2="44.8" stroke="currentColor" stroke-width="2.5"/><circle cx="103.7" cy="44.8" r="4" fill="currentColor"/><path d="M170 100 L170 98.8 L169.8 97.6 L169.7 96.3 L169.4 95.1 L169.1 94 L168.7 92.8 L168.2 91.7 L167.6 90.6 L167 89.5 L166.4 88.5 L165.6 87.5 L164.8 86.6 L164 85.7 L163.1 84.9 L162.1 84.1 L161.1 83.4 L160.1 82.7 L159 82.1 L157.9 81.6 L156.7 81.2 L155.6 80.8 L154.4 80.5 L153.2 80.3 L152 80.1 L150.8 80 L149.5 80 L148.3 80.1 L147.1 80.2 L145.9 80.4 L144.7 80.7 L143.5 81.1 L142.4 81.5 L141.2 82" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="137.1,84.7 141.1,77.9 144.9,83.8" fill="currentColor" stroke="none"/><text x="165" y="76.7" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">θ</text><text x="73.7" y="34.8" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">P(cos θ, sin θ)</text><text x="126.9" y="120" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">cos θ</text><text x="97.7" y="77.4" font-size="14" text-anchor="end" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">sin θ</text><text x="226" y="35" font-size="13" text-anchor="middle" fill="#7a7f8c">(+, +)</text><text x="74" y="35" font-size="13" text-anchor="middle" fill="#7a7f8c">(−, +)</text><text x="74" y="175" font-size="13" text-anchor="middle" fill="#7a7f8c">(−, −)</text><text x="226" y="175" font-size="13" text-anchor="middle" fill="#7a7f8c">(+, −)</text><text x="282" y="92" font-size="13" text-anchor="middle">(cos, sin)</text><text x="282" y="110" font-size="13" text-anchor="middle">の符号</text></svg>'
        explain: 座標平面で x 軸の正の部分を始線とし、角 θ の動径と単位円の交点を P(x, y) とします。このとき sin θ = y、cos θ = x、tan θ = y/x と定めます（x = 0 となる θ = π/2 + nπ では tan θ は定めません）。0 ≦ θ ≦ π では、G-024 で半円を使って定めた三角比と同じです。これらを θ の関数とみて、三角関数といいます。tan θ は直線 OP の傾きです。例：θ = 7π/6 のとき、P は第 3 象限にあって P(−(√3)/2, −1/2) なので、sin(7π/6) = −1/2、cos(7π/6) = −(√3)/2、tan(7π/6) = (√3)/3 です。sin θ の符号は P の y 座標で、cos θ の符号は x 座標で決まります。第 1 象限ではどちらも正、第 2 象限では sin だけ正、第 3 象限ではどちらも負（tan は正）、第 4 象限では cos だけ正です。P は単位円の上にあるので、sin²θ + cos²θ = 1、tan θ = sin θ/cos θ はどの θ でも成り立ちます。また、動径の位置から sin(θ + 2nπ) = sin θ、cos(θ + 2nπ) = cos θ（n は《整数》）、x 軸について対称な点から sin(−θ) = −sin θ、cos(−θ) = cos θ、原点について対称な点から sin(θ + π) = −sin θ、cos(θ + π) = −cos θ、tan(θ + π) = tan θ、直線 y = x について対称な点から sin(π/2 − θ) = cos θ、cos(π/2 − θ) = sin θ が成り立ちます。
