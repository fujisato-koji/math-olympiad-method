      - part: 挑戦
        text: θ の動径が第 3 象限にあり、tan θ = 3 です。sin θ の値はどれですか。
        choices: ["−(3√10)/10", "(3√10)/10", "−(√10)/10", "−3/10"]
        answer: −(3√10)/10
        check: "[k for k, v in {'−(3√10)/10': -3 * math.sqrt(10) / 10, '(3√10)/10': 3 * math.sqrt(10) / 10, '−(√10)/10': -math.sqrt(10) / 10, '−3/10': -0.3}.items() if math.isclose(v, -3 / math.sqrt(10))][0]"
        hints:
