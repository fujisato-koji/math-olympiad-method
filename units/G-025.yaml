67.6,136.6 268.6,135.6 269.6,134.6 270.6,133.5 271.5,132.3 272.5,131.1 273.5,129.9 274.4,128.6 275.4,127.2 276.4,125.9 277.4,124.4 278.3,123 279.3,121.5 280.3,120 281.3,118.4 282.2,116.8 283.2,115.2 284.2,113.6 285.2,111.9 286.1,110.3 287.1,108.6 288.1,106.9 289.1,105.2 290.1,103.5 291,101.7 292,100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><line x1="82" y1="61.9" x2="162" y2="61.9" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="82" y1="61.9" x2="82" y2="100" stroke="#f08080" stroke-width="4"/><line x1="162" y1="61.9" x2="162" y2="100" stroke="#f08080" stroke-width="4"/><circle cx="162" cy="61.9" r="4" fill="currentColor"/><text x="162" y="117" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">θ</text><path d="M136 168 L136 176 L292 176 L292 168" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="214" y="194" font-size="13" text-anchor="middle">周期 2π でくり返す</text><text x="60" y="172" font-size="13" text-anchor="middle">高さ = sin θ</text></svg>'
        explain: θ を横軸、y = sin θ をたて軸にとってグラフをかくと、図のような波の形になります。sin(θ + 2π) = sin θ なので、同じ形が 2π ごとにくり返されます。このような関数を周期関数といい、2π を周期といいます。y の値は −1 から 1 までです。cos θ = sin(θ + π/2) なので、y = cos θ のグラフは、y = sin θ のグラフを θ 軸の向きに −π/2 だけ平行に動かしたものです。tan θ は周期が π で、θ が π/2 + nπ に近づくと、限りなく大きく（または小さく）なります。y = 2sin θ のグラフは y = sin θ のグラフをたてに 2 倍にのばしたもので、y の値は −2 から 2 までです。y = sin 2θ は、θ が π 進むと 2θ が 2π 進むので、周期は π です。一般に y = a sin bθ（b は正の数）の周期は 2π/b です。y = sin(θ − π/3) のグラフは、y = sin θ のグラフを θ 軸の向きに π/3 だけ平行に動かしたものです。方程式 sin θ = 1/2（0 ≦ θ < 2π）は、単位円で y 座標が 1/2 の点を見つけて、θ = π/6、5π/6 と解きます。これは、グラフと直線 y = 1/2 の交点の θ と同じです。
