      - part: 挑戦
        id: "6f0cdd27a5"
        text: 0 ≦ θ < 2π で、方程式 2cos²θ + 3sin θ − 3 = 0 のすべての解の和は □π です。□ に入る数はいくつですか。
        answer: 3/2
        check: "sum(Fraction(j, 12) for j in range(0, 24) if math.isclose(2 * math.cos(j * math.pi / 12) ** 2 + 3 * math.sin(j * math.pi / 12) - 3, 0, abs_tol=1e-9))"
        hints:
          - cos²θ = 1 − sin²θ を使って、sin θ だけの式にしましょう。
