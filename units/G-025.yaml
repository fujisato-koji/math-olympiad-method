# G-025 三角関数と加法定理
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は G-024 に合わせる（負の数は「−」U+2212、√ と π と角は選ぶ問題）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜5 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 一般角（動径、正と負の向き、360° をこえる角）、弧度法（180° = π）、おうぎ形の弧 l = rθ と面積 S = (1/2)r²θ
#   2 日目 単位円で三角関数を定める（値、象限と符号、相互関係、θ + 2nπ、−θ、θ + π、π/2 − θ）
#   3 日目 グラフ（周期 2π/b、振幅、平行に動かす）と方程式（0 ≦ θ < 2π の解、sin θ の 2 次方程式）
#   4 日目 加法定理（sin、cos、tan）、2 直線のなす角　5 日目 2 倍角・半角の公式、三角関数の合成、最大値と方程式
#   6 日目 わけ（cos(α − β) を単位円と 2 点間の距離で、sin(α + β) を cos(α − β) から、合成。どれも ③）
#   7 日目 G-024・G-026・G-010 と混ぜる（sin 75° を使う正弦定理、点を原点のまわりに回す、直線を回す、弧の長さ）　8 日目 確認
# 前提は G-024（三角比と正弦・余弦定理）、G-026（座標と直線・円）、G-010（円とおうぎ形）。前提のたどりに A-017（2 次方程式）、
#   A-016（平方根）、G-015（回転しても長さは変わらない）がある。G-024 で半円の上の点の「横の位置と高さ」で定めた三角比は、
#   ここで座標（G-026）の単位円の x 座標と y 座標に置きかえ、どの角でも同じ形で定めた。
#   不等式（A-013）は前提にないので、三角関数の不等式は扱わない（0 ≦ θ < 2π は範囲を読むだけ）。2 次関数（A-020）も前提にないので、
#   sin θ の 2 次式の最大・最小は扱わず、最大・最小は合成した sin の値が −1 から 1 までであることだけで求める。
#   微分（D-005）、複素数の極形式（A-034）、行列（M-002）は後ろの単元なので使わない（回転は加法定理で計算する）。
#   和と積の公式、3 倍角の公式は日の問題では扱わず、3 倍角は腕だめしで自分で導く形にした。
# 答え：π を含む角は「□π の □」を打つ問題か、選ぶ問題にした。√ を含む値と、θ の値の組は選ぶ問題。
#   check は、値を選ぶ問題は選択肢の値と math.sin などで計算した値が近い（math.isclose）ものを、θ を求める問題は 0 ≦ θ < 2π を
#   π/12 ごとに調べて条件を満たす角の集まり（π/12 の何倍かの集まり）と選択肢の集まりをくらべる。式を選ぶ問題は、
#   いくつかの θ で元の式と値が等しいもの（グラフの問題は、グラフの読み取れる点を通るもの）を選び出す。
# 「√3/2」は画面で 3/2 だけが上下に重なるので「(√3)/2」と書いた（G-024 と同じ）。π/6 などはそのまま書いた（重ならない）。
# 図は svg（D-040）。単位円は原点と軸と目もり 1、−1 を描き、点の座標の値は書かない。グラフは 120 点の折れ線で、
#   横軸の目もりは π/2、π/4、π/3 ごと。式を答える問題では、グラフに式を書かない。回した点を求める問題では、回した点を描かない。
# 三角関数と加法定理は、導関数（D-005）、波と振動（P-007、P-021）、交流、フーリエ級数、回転と行列（M-002）、
#   複素数の極形式（A-034）、極座標（G-047）、天体の座標の変換（P-210）の入口になる（D-026）。

id: G-025
days:
  - day: 1
    items:
      - part: 見本
        text: 角を回る向きと量で表し、弧の長さで測る方法を調べましょう。
        svg: '<svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg"><line x1="110" y1="100" x2="210" y2="100" stroke="currentColor" fill="none" stroke-width="2"/><circle cx="110" cy="100" r="70" stroke="currentColor" fill="none" stroke-width="1.2" stroke-opacity=".5"/><line x1="110" y1="100" x2="147.8" y2="41.1" stroke="currentColor" fill="none" stroke-width="2.5"/><path d="M180 100 A70 70 0 0 0 147.8 41.1" stroke="currentColor" fill="none" stroke-width="4"/><path d="M128 100 A18 18 0 0 0 119.7 84.9" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="136.3" y="89.6" font-size="12" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">1</text><circle cx="110" cy="100" r="3.5" fill="currentColor"/><text x="104" y="114" font-size="12" text-anchor="end">O</text><text x="210" y="114" font-size="11" text-anchor="end">始線</text><text x="145" y="115" font-size="13" text-anchor="middle"><tspan font-style="italic">r</tspan></text><text x="118.9" y="70.5" font-size="13" text-anchor="middle"><tspan font-style="italic">r</tspan></text><text x="182.8" y="64.2" font-size="13" text-anchor="middle"><tspan font-style="italic">r</tspan></text><text x="151.8" y="35.1" font-size="13" text-anchor="start">P</text></svg>'
        explain: 点 O のまわりを回る半直線 OP を動径、はじめの位置を始線といいます。時計の針と反対の向きに回る角を正の角、同じ向きに回る角を負の角とし、1 回転（360°）をこえる角も考えます。例えば 390° の動径は 30° の動径と同じ位置にあり、−60° の動径は 300° の動径と同じ位置にあります。θ と θ + 360° × n（n は《整数》）の動径は同じ位置です。このように考えた角を一般角といいます。次に、半径 r の円で、長さが r の弧に対する中心角を 1 ラジアン（弧度）とし、角を「弧の長さ ÷ 半径」で測ります。これを弧度法といいます。半円の弧の長さは πr（G-010）なので、180° = π ラジアンです。30° = π/6、45° = π/4、60° = π/3、90° = π/2、120° = 2π/3、135° = 3π/4、150° = 5π/6、360° = 2π です。弧度法では、ふつう単位のラジアンを省きます。半径 r、中心角 θ のおうぎ形は円の θ/(2π) にあたるので（G-010）、弧の長さは l = rθ、面積は S = (1/2)r²θ = (1/2)lr です。例：半径 6、中心角 π/3 のおうぎ形の弧の長さは 6 × π/3 = 2π、面積は (1/2) × 36 × π/3 = 6π です。
      - part: 思い出す
        text: 半径 6 cm、中心角 120° のおうぎ形の弧の長さは □π cm です。□ に入る数はいくつですか。
        answer: 4
        check: "Fraction(2 * 6 * 120, 360)"
        hints:
          - 円周は 2π × 半径です（G-010）。
          - 中心角 120° のおうぎ形は、円の何分の 1 でしょう。
          - 円周に、その《分数》をかけましょう。
        paths:
          - ["円周は 12π", "120° は円の 1/3", "12π × 1/3 = 4π"]
      - part: 思い出す
        text: cos 135° の値はどれですか。
        choices: ["−(√2)/2", "(√2)/2", "−1/2", "−√2"]
        answer: −(√2)/2
        check: "[k for k, v in {'−(√2)/2': -math.sqrt(2) / 2, '(√2)/2': math.sqrt(2) / 2, '−1/2': -0.5, '−√2': -math.sqrt(2)}.items() if math.isclose(v, math.cos(math.radians(135)))][0]"
        hints:
          - cos(180° − θ) = −cos θ です（G-024）。
          - 135° = 180° − 45° です。
          - 鈍角の cos は負の数です。
        paths:
          - ["cos 135° = −cos 45° = −(√2)/2"]
      - part: 今日
        text: 135° を弧度法で表すと □π です。□ に入る数はいくつですか。
        answer: 3/4
        check: "Fraction(135, 180)"
        hints:
          - 180° = π です。
          - 135° は 180° の何倍でしょう。
          - 約分しましょう。
        paths:
          - ["135 ÷ 180 = 3/4", "135° = 3π/4"]
      - part: 今日
        text: 半径 4、中心角 3π/4 のおうぎ形の面積は □π です。□ に入る数はいくつですか。
        answer: 6
        check: "Fraction(1, 2) * 4 * 4 * Fraction(3, 4)"
        hints:
          - おうぎ形の面積は S = (1/2)r²θ です。
          - r = 4、θ = 3π/4 を入れましょう。
          - (1/2) × 16 × 3/4 を計算しましょう。
        paths:
          - ["S = (1/2) × 16 × 3π/4 = 6π"]
      - part: 挑戦
        text: 弧の長さが 10、面積が 25 のおうぎ形の中心角は何ラジアンですか。
        answer: 2
        check: "(lambda r: Fraction(10) / r)(Fraction(2 * 25, 10))"
        hints:
          - S = (1/2)lr を使うと、半径がわかります。
          - l = rθ から θ を求めましょう。
          - 弧度法の角は、π を含まない数になることもあります。
        paths:
          - ["25 = (1/2) × 10 × r で r = 5", "10 = 5θ", "θ = 2"]
        note: 中心角は約 115°。π を含まない角にとまどう子がいるので、「弧の長さ ÷ 半径」が角だと確かめさせる。
    extra:
      - part: 今日
        text: 5π/6 は何度ですか。
        choices: [150°, 120°, 210°, 300°]
        answer: 150°
        check: "[k for k, v in {'150°': 150, '120°': 120, '210°': 210, '300°': 300}.items() if v == Fraction(5, 6) * 180][0]"
        hints:
          - π = 180° です。
          - π/6 は何度でしょう。
          - その 5 倍です。
        paths:
          - ["π/6 = 30°", "5π/6 = 150°"]
      - part: 今日
        text: −300° の動径と同じ位置にある、0° 以上 360° 未満の角はどれですか。
        choices: [60°, 300°, −60°, 120°]
        answer: 60°
        check: "[k for k, v in {'60°': 60, '300°': 300, '−60°': -60, '120°': 120}.items() if 0 <= v < 360 and (v - (-300)) % 360 == 0][0]"
        hints:
          - 360° を足しても、動径の位置は変わりません。
          - −300° + 360° を計算しましょう。
          - 負の角は、時計の針と同じ向きに回る角です。
        paths:
          - ["−300° + 360° = 60°"]
        note: 300° は、向きを逆にして考えたもの。
      - part: 挑戦
        text: 周の長さが 12 で、中心角が 1 ラジアンのおうぎ形の面積はいくつですか。
        answer: 8
        check: "(lambda r: Fraction(1, 2) * r * r * 1)(Fraction(12, 3))"
        hints:
          - おうぎ形の周は、半径 2 つと弧です。
          - 中心角が 1 ラジアンなので、弧の長さは半径と等しくなります。
          - 半径がわかったら、S = (1/2)r²θ を使いましょう。
        paths:
          - ["2r + r = 12 で r = 4", "S = (1/2) × 16 × 1 = 8"]
  - day: 2
    items:
      - part: 見本
        text: 単位円（原点を中心とする半径 1 の円）を使って、一般角の三角関数を定めましょう。
        svg: '<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg"><line x1="26" y1="100" x2="216" y2="100" stroke="currentColor" fill="none" stroke-width="2"/><line x1="120" y1="190" x2="120" y2="6" stroke="currentColor" fill="none" stroke-width="2"/><path d="M216 100 L208 96 L208 104 Z" fill="currentColor"/><path d="M120 6 L116 14 L124 14 Z" fill="currentColor"/><text x="216" y="115" font-size="14" text-anchor="end" font-style="italic">x</text><text x="127" y="14" font-size="14" text-anchor="start" font-style="italic">y</text><text x="116" y="113" font-size="11" text-anchor="end">O</text><text x="195" y="113" font-size="10" text-anchor="start">1</text><text x="45" y="113" font-size="10" text-anchor="end">−1</text><text x="116" y="25" font-size="10" text-anchor="end">1</text><text x="116" y="184" font-size="10" text-anchor="end">−1</text><circle cx="120" cy="100" r="72" stroke="currentColor" fill="none" stroke-width="2"/><line x1="120" y1="100" x2="57.6" y2="136" stroke="currentColor" fill="none" stroke-width="2.5"/><line x1="57.6" y1="136" x2="57.6" y2="100" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="57.6" y1="136" x2="120" y2="136" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="57.6" cy="136" r="3.5" fill="currentColor"/><text x="51.6" y="150" font-size="13" text-anchor="end">P</text><path d="M136 100 A16 16 0 1 0 106.1 108" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M106.1 108 L98.7 103.1 L105.6 99.1 Z" fill="currentColor"/><text x="112.8" y="77" font-size="12" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">θ</text></svg>'
        explain: 座標平面で x 軸の正の部分を始線とし、角 θ の動径と単位円の交点を P(x, y) とします。このとき sin θ = y、cos θ = x、tan θ = y/x と定めます（x = 0 となる θ = π/2 + nπ では tan θ は定めません）。0 ≦ θ ≦ π では、G-024 で半円を使って定めた三角比と同じです。これらを θ の関数とみて、三角関数といいます。tan θ は直線 OP の傾きです。例：θ = 7π/6 のとき、P は第 3 象限にあって P(−(√3)/2, −1/2) なので、sin(7π/6) = −1/2、cos(7π/6) = −(√3)/2、tan(7π/6) = (√3)/3 です。sin θ の符号は P の y 座標で、cos θ の符号は x 座標で決まります。第 1 象限ではどちらも正、第 2 象限では sin だけ正、第 3 象限ではどちらも負（tan は正）、第 4 象限では cos だけ正です。P は単位円の上にあるので、sin²θ + cos²θ = 1、tan θ = sin θ/cos θ はどの θ でも成り立ちます。また、動径の位置から sin(θ + 2nπ) = sin θ、cos(θ + 2nπ) = cos θ（n は《整数》）、x 軸について対称な点から sin(−θ) = −sin θ、cos(−θ) = cos θ、原点について対称な点から sin(θ + π) = −sin θ、cos(θ + π) = −cos θ、tan(θ + π) = tan θ、直線 y = x について対称な点から sin(π/2 − θ) = cos θ、cos(π/2 − θ) = sin θ が成り立ちます。
      - part: 思い出す
        text: 300° を弧度法で表すと □π です。□ に入る数はいくつですか。
        answer: 5/3
        check: "Fraction(300, 180)"
        hints:
          - 180° = π です。
          - 300° は 180° の何倍でしょう。
          - 約分しましょう。
        paths:
          - ["300 ÷ 180 = 5/3", "300° = 5π/3"]
      - part: 思い出す
        text: 0° ≦ θ ≦ 180° で、cos θ = −1/3 のとき、sin θ の値はどれですか。
        choices: ["(2√2)/3", "−(2√2)/3", "2/3", "(√2)/3"]
        answer: (2√2)/3
        check: "[k for k, v in {'(2√2)/3': 2 * math.sqrt(2) / 3, '−(2√2)/3': -2 * math.sqrt(2) / 3, '2/3': 2 / 3, '(√2)/3': math.sqrt(2) / 3}.items() if math.isclose(v, math.sin(math.acos(-1 / 3)))][0]"
        hints:
          - sin²θ + cos²θ = 1 を使いましょう（G-024）。
          - sin²θ = 1 − 1/9 です。
          - 0° ≦ θ ≦ 180° では、sin θ は 0 以上です。
        paths:
          - ["sin²θ = 8/9", "sin θ = (2√2)/3"]
      - part: 今日
        text: sin(4π/3) の値はどれですか。
        choices: ["−(√3)/2", "(√3)/2", "−1/2", "1/2"]
        answer: −(√3)/2
        check: "[k for k, v in {'−(√3)/2': -math.sqrt(3) / 2, '(√3)/2': math.sqrt(3) / 2, '−1/2': -0.5, '1/2': 0.5}.items() if math.isclose(v, math.sin(4 * math.pi / 3))][0]"
        hints:
          - 4π/3 = π + π/3 です。
          - 動径は第 3 象限にあります。
          - sin(θ + π) = −sin θ を使いましょう。
        paths:
          - ["sin(4π/3) = sin(π/3 + π) = −sin(π/3)", "−(√3)/2"]
        note: 第 3 象限で sin が負になることを、単位円の点の y 座標で確かめさせる。
      - part: 今日
        text: θ の動径が第 3 象限にあり、cos θ = −3/5 です。sin θ の値はいくつですか。
        answer: −4/5
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(-[Fraction(k, 5) for k in range(0, 6) if Fraction(k, 5) ** 2 + Fraction(-3, 5) ** 2 == 1][0])"
        hints:
          - sin²θ + cos²θ = 1 を使いましょう。
          - sin²θ = 1 − 9/25 です。
          - 第 3 象限では、sin θ は負の数です。
        paths:
          - ["sin²θ = 16/25", "第 3 象限なので sin θ = −4/5"]
      - part: 挑戦
        text: sin(θ + π) + cos(θ + π/2) + sin(−θ) を簡単にした式はどれですか。
        choices: [−3sin θ, −sin θ, sin θ, 3sin θ]
        answer: −3sin θ
        check: "[k for k, a in {'−3sin θ': -3, '−sin θ': -1, 'sin θ': 1, '3sin θ': 3}.items() if all(math.isclose(math.sin(t + math.pi) + math.cos(t + math.pi / 2) + math.sin(-t), a * math.sin(t), abs_tol=1e-9) for t in (0.3, 1.1, 2.5, 4.0))][0]"
        hints:
          - sin(θ + π) は、原点について対称な点を考えましょう。
          - cos(θ + π/2) は cos(π/2 − (−θ)) と見ると、sin(−θ) になります。
          - sin(−θ) = −sin θ です。
        paths:
          - ["sin(θ + π) = −sin θ", "cos(θ + π/2) = sin(−θ) = −sin θ", "sin(−θ) = −sin θ", "合わせて −3sin θ"]
        note: cos(θ + π/2) を sin θ としやすい。θ = π/6 などを入れて確かめる習慣をつける。
    extra:
      - part: 今日
        text: cos(11π/6) の値はどれですか。
        choices: ["(√3)/2", "−(√3)/2", "1/2", "−1/2"]
        answer: (√3)/2
        check: "[k for k, v in {'(√3)/2': math.sqrt(3) / 2, '−(√3)/2': -math.sqrt(3) / 2, '1/2': 0.5, '−1/2': -0.5}.items() if math.isclose(v, math.cos(11 * math.pi / 6))][0]"
        hints:
