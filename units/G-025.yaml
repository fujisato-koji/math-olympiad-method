.7 L283.3 96.4 L278.3 90.5 L273 85 L267.3 79.8 L261.3 75 L254.9 70.6 L248.3 66.6 L241.5 63.1 L234.4 60 L227.1 57.4 L219.7 55.4 L212.1 53.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="250" y1="67.5" x2="250" y2="168" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="250" y1="67.5" x2="192" y2="67.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="192" y1="168" x2="250" y2="67.5" stroke="currentColor" stroke-width="2.5"/><circle cx="250" cy="67.5" r="4" fill="currentColor"/><text x="256" y="61.5" font-size="14" text-anchor="start">(1, √3)</text><text x="250" y="184" font-size="13" text-anchor="middle">1</text><text x="186" y="72.5" font-size="13" text-anchor="end">√3</text><text x="210.6" y="116.7" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">2</text><path d="M214 168 L214 166.6 L213.8 165.1 L213.6 163.7 L213.3 162.3 L212.8 160.9 L212.3 159.6 L211.7 158.3 L211.1 157 L210.3 155.8 L209.5 154.6 L208.5 153.5 L207.6 152.4 L206.5 151.5 L205.4 150.5 L204.2 149.7 L203 148.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="226.2" y="156.3" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">π/3</text><text x="250" y="24" font-size="13" text-anchor="middle">合成</text><text x="160" y="194" font-size="13" text-anchor="middle">sin θ + √3 cos θ = 2sin(θ + π/3)</text></svg>'
        explain: 加法定理で β = α とおくと、2 倍角の公式 sin 2α = 2sin α cos α、cos 2α = cos²α − sin²α = 1 − 2sin²α = 2cos²α − 1、tan 2α = 2tan α/(1 − tan²α) が得られます。cos 2α = 1 − 2sin²α を変形すると sin²α = (1 − cos 2α)/2、cos²α = (1 + cos 2α)/2 で、α を α/2 におきかえると sin²(α/2) = (1 − cos α)/2、cos²(α/2) = (1 + cos α)/2（半角の公式）です。また、a sin θ + b cos θ（a、b は 0 でない数）は、r = √(a² + b²) とし、点 (a, b) を表す動径の角を α とすると（cos α = a/r、sin α = b/r）、a sin θ + b cos θ = r(sin θ cos α + cos θ sin α) = r sin(θ + α) と 1 つの sin にまとめられます。これを三角関数の合成といいます（わけは 6 日目）。例：sin θ + √3 cos θ は、図の点 (1, √3) で r = 2、α = π/3 なので 2sin(θ + π/3) です。sin の値は −1 から 1 までなので、最大値は 2、最小値は −2 です。
