        text: √3 sin θ − cos θ を r sin(θ + α)（r は正の数、α は −π から π までの角）の形にしたものはどれですか。
        choices: [2sin(θ − π/6), 2sin(θ + π/6), 2sin(θ − π/3), √2 sin(θ − π/6)]
        answer: 2sin(θ − π/6)
        check: "[k for k, g in {'2sin(θ − π/6)': lambda t: 2 * math.sin(t - math.pi / 6), '2sin(θ + π/6)': lambda t: 2 * math.sin(t + math.pi / 6), '2sin(θ − π/3)': lambda t: 2 * math.sin(t - math.pi / 3), '√2 sin(θ − π/6)': lambda t: math.sqrt(2) * math.sin(t - math.pi / 6)}.items() if all(math.isclose(g(t), math.sqrt(3) * math.sin(t) - math.cos(t), abs_tol=1e-9) for t in (0.2, 1.3, 2.9, 5.0))][0]"
        hints:
          - text: sin θ の係数 √3 と cos θ の係数 −1 を組にして、点 (√3, −1) をとります。
