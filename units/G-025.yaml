ext><path d="M218 172 L218 170.5 L217.8 169.1 L217.6 167.6 L217.2 166.2 L216.8 164.8 L216.3 163.4 L215.6 162.1 L214.9 160.8 L214.2 159.6 L213.3 158.4 L212.3 157.3 L211.3 156.2 L210.2 155.2 L209.1 154.3 L207.9 153.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="252" y="154" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">1 ラジアン</text><text x="255" y="24" font-size="15" text-anchor="middle">弧度法</text><text x="255" y="46" font-size="14" text-anchor="middle">360° = 2π</text></svg>'
        explain: 点 O のまわりを回る半直線 OP を動径、はじめの位置を始線といいます。時計のはりと反対の向きに回る角を正の角、同じ向きに回る角を負の角とし、1 回転（360°）をこえる角も考えます。例えば 390° の動径は 30° の動径と同じ位置にあり、−60° の動径は 300° の動径と同じ位置にあります。θ と θ + 360° × n（n は《整数》）の動径は同じ位置です。このように考えた角を一般角といいます。次に、半径 r の円で、長さが r の弧に対する中心角を 1 ラジアン（弧度）とし、角を「弧の長さ ÷ 半径」で測ります。これを弧度法といいます。半円の弧の長さは πr（G-010）なので、180° = π ラジアンです。30° = π/6、45° = π/4、60° = π/3、90° = π/2、120° = 2π/3、135° = 3π/4、150° = 5π/6、360° = 2π です。弧度法では、ふつう単位のラジアンを省きます。半径 r、中心角 θ のおうぎ形は円の θ/(2π) にあたるので（G-010）、弧の長さは l = rθ、面積は S = (1/2)r²θ = (1/2)lr です。例：半径 6、中心角 π/3 のおうぎ形の弧の長さは 6 × π/3 = 2π、面積は (1/2) × 36 × π/3 = 6π です。
