      - part: 今日
        text: θ の動径が第 4 象限にあり、sin θ = −5/13 です。cos θ の値はいくつですか。
        answer: 12/13
        check: "[Fraction(k, 13) for k in range(0, 14) if Fraction(k, 13) ** 2 + Fraction(-5, 13) ** 2 == 1][0]"
        hints:
          - sin²θ + cos²θ = 1 を使いましょう。
