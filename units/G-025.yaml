# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "5eaf6008d2"
    kinds: [道筋, 手数]
    text: θ = 18° とします。2θ + 3θ = 90° であることに目をつけて、sin 18° の値を求めると、どれになりますか。
    choices: [(√5 − 1)/4, (√5 + 1)/4, (√5 − 1)/2, (3 − √5)/4]
    answer: (√5 − 1)/4
    check: "[k for k, v in {'(√5 − 1)/4': (math.sqrt(5) - 1) / 4, '(√5 + 1)/4': (math.sqrt(5) + 1) / 4, '(√5 − 1)/2': (math.sqrt(5) - 1) / 2, '(3 − √5)/4': (3 - math.sqrt(5)) / 4}.items() if math.isclose(v, math.sin(math.radians(18)))][0]"
    hints:
      - text: 2θ + 3θ = 90° なので、2θ と 3θ は 1 つの直角三角形の 2 つの鋭角です。赤い辺 BC で、sin 2θ = cos 3θ です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="40,170 240,170 240,24.7" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="240" y1="170" x2="240" y2="24.7" stroke="#f08080" stroke-width="5"/><polyline points="230,170 230,160 240,160" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M70 170 L69.9 168.1 L69.8 166.2 L69.5 164.4 L69.1 162.5 L68.5 160.7 L67.9 159 L67.1 157.2 L66.3 155.5 L65.3 153.9 L64.3 152.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="84.2" y="162.3" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">2θ</text><path d="M240 52.7 L238.1 52.6 L236.2 52.4 L234.4 52.1 L232.6 51.7 L230.8 51.1 L229 50.4 L227.3 49.6 L225.6 48.7 L224.1 47.7 L222.5 46.6 L221.1 45.4 L219.8 44 L218.5 42.6 L217.3 41.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="220.7" y="69.2" font-size="14" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">3θ</text><text x="36" y="186" font-size="13" text-anchor="end">A</text><text x="246" y="24.7" font-size="13" text-anchor="start">B</text><text x="246" y="184" font-size="13" text-anchor="start">C</text></svg>'
      - cos 3θ = cos(2θ + θ) を、加法定理と 2 倍角の公式で cos θ の式にしましょう。
      - 両辺を cos θ（0 でない）でわると、sin θ の 2 次方程式になります。
    paths:
      - ["sin 2θ = sin(90° − 3θ) = cos 3θ", "cos 3θ = cos 2θ cos θ − sin 2θ sin θ = 4cos³θ − 3cos θ", "2sin θ cos θ = 4cos³θ − 3cos θ を cos θ でわって 2sin θ = 4cos²θ − 3 = 1 − 4sin²θ", "4sin²θ + 2sin θ − 1 = 0", "sin θ は正なので sin θ = (−1 + √5)/4"]
      - ["A の角が 36°、AB = AC = 1 の二等辺三角形 ABC で、∠B の二等分線と AC の交点を D とする", "△BCD ∽ △ABC で BC = BD = AD = x とおくと x² = 1 − x", "x = (√5 − 1)/2", "A から BC の中点へ引いた線で直角三角形ができ、sin 18° = (x/2)/1 = (√5 − 1)/4"]
    note: 3 倍角の公式 cos 3θ = 4cos³θ − 3cos θ を自分で導き、2 次方程式（A-017）に帰着させる。G-024 の腕だめしの cos 36° = (1 + √5)/4 と、cos 36° − sin 18° = 1/2 の関係でつながる。
