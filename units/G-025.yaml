        explain: 例：「どの θ でも sin θ = cos(π/2 − θ) が成り立つ（2 日目）ので、sin(α + β) = cos(π/2 − (α + β)) = cos((π/2 − α) − β) である。cos(α − β) の式の α に π/2 − α を入れると、cos((π/2 − α) − β) = cos(π/2 − α)cos β + sin(π/2 − α)sin β。cos(π/2 − α) = sin α、sin(π/2 − α) = cos α なので、sin(α + β) = sin α cos β + cos α sin β である。」と書ければよい。① sin を cos(π/2 − θ) に言いかえる、② かっこをまとめ直して、約束した式の α に π/2 − α を入れる、③ 約束した事実（π/2 − θ の公式、cos(α − β) の式）で結ぶ、の 3 つを見る。β を −β におきかえると、cos(−β) = cos β、sin(−β) = −sin β から cos(α + β)、sin(α − β) の式も同じように出せることにもふれる。
