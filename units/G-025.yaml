      - いちばん下から角 φ だけ回ったときの高さは 22 − 20cos φ です。
      - text: 高さが 32 m になるのは、中心より 10 m 上の点線と円が交わる 2 つの点です。cos φ がいくつのときか考え、0 ≦ φ < 2π で 2 つの φ を求めましょう。
