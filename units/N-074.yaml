# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数]
    text: 125 × 32 × 25 を、くふうして計算しましょう。
    answer: 100000
    check: "125 * 32 * 25"
    hints:
      - 125 × 8 と 4 × 25 は、きりのよい数になるね。
      - 32 を 2 つの数のかけ算に分けてみよう。
      - かける順番を入れかえて、125 × 8 と 4 × 25 を先に計算しよう。
    paths:
      - [32 = 8 × 4, 125 × 32 × 25 = 125 × 8 × 4 × 25, 125 × 8 = 1000、4 × 25 = 100, 1000 × 100 = 100000]
      - [125 × 32 を筆算すると 4000, 4000 × 25 は 4 × 25 = 100 の 1000 こ分, 100000]
    note: 3 けた × 2 けたの筆算を 2 回するより、32 を 8 × 4 に分けて 1000 と 100 を作る（入れかえ・まとめ、N-015）ほうが速い。大きな数（N-073）の答えの 0 の数を書きまちがえやすい。
  - part: 離
    kinds: [総動員, 道筋, 読み取り]
    uses: [G-008]
    text: たて 36 m、よこ 48 m の長方形の土地に、図のように、はば 2 m の道を、たてとよこに 1 本ずつ通しました。道をのぞいた土地（色をぬっていないところ）の面積は何 m² ですか。
    svg: |
      <svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="24" width="176" height="132" stroke="currentColor" fill="none" stroke-width="2"/>
        <rect x="112" y="24" width="7" height="132" fill="#f3c969" fill-opacity=".6" stroke="currentColor" stroke-width="1"/>
        <rect x="40" y="82" width="176" height="7" fill="#f3c969" fill-opacity=".6" stroke="currentColor" stroke-width="1"/>
        <text x="128" y="16" font-size="14" text-anchor="middle">48 m</text>
        <text x="20" y="94" font-size="14" text-anchor="middle">36 m</text>
        <text x="123" y="42" font-size="11">2 m</text>
        <text x="186" y="77" font-size="11">2 m</text>
      </svg>
    answer: 1564
    check: "(36 - 2) * (48 - 2)"
    hints:
      - 道の面積を 1 本ずつ出してひくと、道が交わっているところを 2 回ひいてしまうね。
      - 道を土地のはしによせて考えてみよう。のこりの土地は、どんな形になるかな。
      - よせたあとの長方形の、たてとよこの長さは何 m かな。
    paths:
      - [道をはしによせても、のこりの面積は変わらない, のこりは たて 36 − 2 = 34 m、よこ 48 − 2 = 46 m の長方形, 34 × 46 を筆算して 1564 m²]
      - [土地は 36 × 48 = 1728 m², 道は 2 × 48 = 96 と 2 × 36 = 72、交わる 2 × 2 = 4 は 2 回ひいたので 1 回もどす, 1728 − 96 − 72 + 4 = 1564 m²]
    note: 長方形の面積（G-008）と 2 けた × 2 けたの筆算を合わせる。道をはしに寄せて 1 つの長方形にする見方が道筋の要点。2 本目で、道が交わる 4 m² を 2 回ひいたままにするまちがいが多い。
  - part: 離
    kinds: [手数, 道筋]
    text: 3、5、7、9 の 4 まいのカードを 1 まいずつ使って 2 けたの数を 2 つ作り、その 2 つの数をかけます。答えが一番大きくなるとき、その答えはいくつですか。
    answer: 6975
    check: "max((10 * a + b) * (10 * c + d) for a, b, c, d in itertools.permutations((3, 5, 7, 9)))"
    hints:
      - 大きい数字の 9 と 7 は、十の位に使ったほうがよさそうだね。
      - 十の位を 9 と 7 にしたら、のこりの 5 と 3 をどちらに入れるかで 2 通りあるね。
      - 2 通りのかけ算を筆算して、くらべよう。
    paths:
      - [十の位は 9 と 7, 一の位の入れ方は 95 × 73 と 93 × 75 の 2 通り, 95 × 73 = 6935、93 × 75 = 6975, 大きいのは 6975]
    note: 十の位に大きい数字を使うことはすぐ決まるが、一の位の 5 と 3 の入れ方は計算してくらべる（2 つの数の差が小さいほうが積が大きい）。2 けた × 2 けたの筆算を 2 回して、答えが 4 けたになる（N-073 が前提に入ってから使える大きさ）。
