# N-074 かけ算の筆算（何けた × 1 けた、何けた × 2 けた）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は小 4 までの漢字で書く（位・工夫 は漢字。確・個・比・並・枚・袋・鉛
#   などはかなで書く）。分かち書きはしない。数の前後には空白を入れる。「×」は U+00D7、check では「*」。
# 前提は N-013（九九、× 10 と × 0）、N-015（入れかえ・まとめ・分ける、× を先に計算する）、N-009（1000 までの数と位）。
#   4 けたの数（千の位から上）は N-073 で、前提にないので、とちゅうの数も答えも 1000 まで。そのため「何けた × 2 けた」は
#   2 けた × 2 けた（答えが 1000 まで）だけにし、3 けた × 2 けたは扱わない。3 けた × 1 けたも答えが 1000 までのもの。
#   N-073 を前提に足したら、3 けた × 2 けたと、答えが 4 けた以上になる問題を足してよい。
#   わり算（N-014）は前提にないので、答えのたしかめにわり算は使わない。お金（N-060）と長さ（G-046）も前提にないので、
#   場面は、こ数、本数、人数、ページ数にした。
# 筆算は、N-015 の「分ける」（24 × 3 = 20 × 3 + 4 × 3）を位ごとに書いたものとして教える。くり上げた数は図に書かず、
#   見本の explain とヒントで「小さく書いておく」と言う。2 けた × 2 けたは、かける数を一の位と何十に分け、
#   何十の分の答えを 1 つ左にずらして書く（0 をはぶく書き方）。
# 何十 × 1 けた（60 × 4）は「10 が 6 × 4 = 24 こ」、× 何十（32 × 30）は N-015 のまとめで「32 × 3 の 10 こ分」として計算する
#   （10 倍の言い方は N-073 なので使わない）。
# 筆算の図は svg（D-040）。全角の「×」がなく、N-007 の全角の書き方では位がそろわないので、数字を 1 字ずつ同じはばの列に置いた。
#   問題の図は式だけで、答えは書かない（見本とわけの図には、とちゅうと答えを書く）。check は式の計算で確かめる。
# 決まった形の筆算の問題（「○ × ○ を筆算で計算しましょう。」）のヒントとみちすじは、位ごとの計算から作った（下書きの道具）。
# 日の並び（既定）：1 日目 何十・何百 × 1 けた、2 けた × 1 けた、2 日目 3 けた × 1 けた（くり上がり 2 回、0 のある数、頭に見本）、
#   3 日目 × 何十と 2 けた × 2 けた（頭に見本）、4 日目 わけ、5 日目 N-013・N-015・N-009 と混ぜる、6 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-073 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

