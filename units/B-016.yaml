# B-016 植物の育ち方
#
# 段 1・水準 1・5 日。たねをまくと芽が出て双葉がひらくこと、植物の体が根・茎・葉でできていること、花のあとに実ができ、実の中にたねができることを扱う。
# 日の並びは 導入（たねと芽生え）・練習（根・茎・葉）・わけ（花と実、たねはどこでできるか）・混ぜる・確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図は svg（D-129）。ほうちょうで実を切る場面には「おうちの ひとと いっしょに」を書く。
# 腕だめし（離）は 2 問で、種類は読み取り（かんさつカードと、切った実の絵を読む）。

id: B-016
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          たねを つちに まいて、水を やります。
          なん日か すると、たねから め が 出ます。
          め は 上へ のびて、さいしょの はっぱが 2 まい ひらきます。この 2 まいを「ふたば」と いいます。
          たねの 大きさや かたちは、しょくぶつ ごとに ちがいます。
