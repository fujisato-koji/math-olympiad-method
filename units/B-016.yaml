        explain: |-
          たねの 中には、め に なる ところと、はじめに そだつ ための えいようが 入って います。
          水を すうと たねは ふくらみ、やがて め が 出ます。さいしょに ひらく 2 まいの はっぱは「ふたば」で、たねの 中で もう できて いた はっぱです。
          あさがおや ひまわりの たねを まいて、まい日 見ると、かわって いく ようすが わかります。たねの 大きさは、ひまわりが 1 cm ほど、あさがおが 5 mm ほど、トマトが 3 mm ほどです。
