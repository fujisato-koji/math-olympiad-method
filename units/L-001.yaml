# L-001 きまりを見つける
#
# 書き方は N-001 の頭の注のとおり。
# 地図では前提がない（needs: []）が、2 日目の数の並びは数を使うので、数は 10 まで（N-001 の範囲）にした。
# たし算は使わない。「1 ずつ」「2 ずつ」は、かぞえる順に言う、ひとつとばしに言う、で考える。
# 地図の plan にわけの日がないので、わけは 2・3・4 日目に 1 問ずつ置く。2・3 日目は新しいきまりが出るので、頭に見本を置く。
# 並びの図は 1 字の絵文字を並べ、❓ は入るものをたずねる所。数の並びは「、」で区切り、□ は入る数をたずねる所。
# check：❓ の並びは、見えている所と合う いちばん短い くり返しの長さ p を探し、❓ と同じ位置（p で割った余りが同じ）にあるものを答える。
# 数の並びは、□ でない 2 つの数から 1 つ分の増え方を出し、ほかの数も合うことを確かめてから □ を出す。
# 「ひとまとまり」「なんばんめ」は、図から いちばん短い くり返しの長さを出して数える。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-001 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

