        text: 上の円の上の点 P（C、D とはちがう点）は、どれも PA:PB = m:n を満たします。このわけを、B を通って PA に平行な直線をひいて、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="92" x2="312" y2="92" stroke="currentColor" stroke-width="1.5"/><circle cx="192" cy="92" r="64" stroke="currentColor" stroke-width="2" fill="#b39ddb" fill-opacity="0.12"/><line x1="213.9" y1="31.9" x2="64" y2="92" stroke="#f08080" stroke-width="2.5"/><line x1="213.9" y1="31.9" x2="160" y2="92" stroke="#7fc8f8" stroke-width="2.5"/><line x1="213.9" y1="31.9" x2="128" y2="92" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><line x1="213.9" y1="31.9" x2="256" y2="92" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><circle cx="213.9" cy="31.9" r="3.5" fill="currentColor"/><text x="218.7" y="23.7" font-size="14" text-anchor="middle" fill="currentColor">P</text><circle cx="64" cy="92" r="3.5" fill="currentColor"/><text x="64" y="112" font-size="14" text-anchor="middle" fill="currentColor">A</text><circle cx="160" cy="92" r="3.5" fill="currentColor"/><text x="160" y="112" font-size="14" text-anchor="middle" fill="currentColor">B</text><circle cx="128" cy="92" r="3.5" fill="currentColor"/><text x="124" y="85" font-size="14" text-anchor="end" fill="currentColor">C</text><circle cx="256" cy="92" r="3.5" fill="currentColor"/><text x="261" y="85" font-size="14" text-anchor="start" fill="currentColor">D</text></svg>'
        explain: 例：「P を円の上の点（C、D とはちがう）とし、B を通って PA に平行な直線が、直線 PC、PD と交わる点をそれぞれ E、F とする。CD は直径なので ∠CPD = 90°（G-018）である。BE ∥ AP なので △CBE ∽ △CAP で、BE:AP = CB:CA = n:m である。BF ∥ AP なので △DBF ∽ △DAP で、BF:AP = DB:DA = n:m である（G-020）。よって BE = BF = (n/m) × AP で、B は線分 EF の中点である。∠EPF = 90° なので、P は EF を直径とする円の上にあり（円周角の定理の逆）、その中心は EF の中点 B だから PB = BE である。したがって PB = (n/m) × PA、つまり PA:PB = m:n である。」と書ければよい。①「〜とする」で E、F を決める、② 平行線と相似で BE と BF をそれぞれ PA で表す、③ 約束した事実（半円の弧に対する円周角、円の中心から円の上の点までの長さは半径）で PB = BE と結ぶ、の 3 つがそろっているかを見る。前の問題と合わせて、「比が m:n の点の全体」がちょうどこの円になる（円の外に比が m:n の点はなく、円の上の点にもれもない）ことを話す。
        hints:
          - text: B を通って PA に平行な直線（緑）と、直線 PC、PD の交点を E、F としましょう。
