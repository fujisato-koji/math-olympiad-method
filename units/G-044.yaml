        svg: '<svg viewBox="0 0 320 184" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="100" x2="312" y2="100" stroke="currentColor" stroke-width="1.5"/><circle cx="195" cy="100" r="70" stroke="currentColor" stroke-width="2" fill="#b39ddb" fill-opacity="0.15"/><line x1="162.1" y1="38.2" x2="55" y2="100" stroke="#f08080" stroke-width="2.2"/><line x1="162.1" y1="38.2" x2="160" y2="100" stroke="#7fc8f8" stroke-width="2.2"/><line x1="227.9" y1="38.2" x2="55" y2="100" stroke="#f08080" stroke-width="2.2" stroke-dasharray="5 4"/><line x1="154.8" y1="157.3" x2="55" y2="100" stroke="#f08080" stroke-width="2.2" stroke-dasharray="5 4"/><circle cx="162.1" cy="38.2" r="3.5" fill="currentColor"/><text x="155.6" y="30.8" font-size="14" text-anchor="middle" fill="currentColor">P</text><circle cx="227.9" cy="38.2" r="3.5" fill="currentColor"/><circle cx="154.8" cy="157.3" r="3.5" fill="currentColor"/><path d="M145.7 37 A80 80 0 0 0 125.7 60" stroke="currentColor" stroke-width="1.5" fill="none"/><polygon points="125.7,60 126.2,52.2 132.2,55.7" fill="currentColor" fill-opacity="1" stroke="none" stroke-width="2"/><circle cx="55" cy="100" r="3.5" fill="currentColor"/><text x="55" y="120" font-size="14" text-anchor="middle" fill="currentColor">A</text><circle cx="160" cy="100" r="3.5" fill="currentColor"/><text x="160" y="120" font-size="14" text-anchor="middle" fill="currentColor">B</text><text x="10" y="20" font-size="14" text-anchor="start" fill="currentColor">PA:PB = 2:1</text><text x="10" y="38" font-size="14" text-anchor="start" fill="currentColor">AB = 12 cm</text></svg>'
        answer: 36
        check: "Fraction(12 * 2, 2 - 1) * Fraction(3, 2)"
        hints:
          - text: PA:PB = 2:1 なので、PB は PA の半分です。PA と PB をつなぐと、PA の何倍になるでしょう。
