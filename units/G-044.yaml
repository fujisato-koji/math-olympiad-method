        explain: 例：「∠APB の二等分線と辺 AB の交点を C′、∠P の外角の二等分線と直線 AB の交点を D′ とする。角の二等分線の定理（G-042）より AC′:C′B = PA:PB = m:n なので、C′ は AB を m:n に内分する点で、C′ = C である。同じく外角の二等分線の定理より AD′:D′B = m:n なので、D′ は AB を m:n に外分する点で、D′ = D である。内角の二等分線と外角の二等分線は垂直なので（G-042）、∠CPD = 90° である。よって、P は CD を直径とする円の上にある（半円の弧に対する円周角、円周角の定理の逆、G-018）。」と書ければよい。①「〜とする」で C′、D′ を決める、② 角の二等分線の定理で比を求め、内分する点と外分する点はそれぞれ 1 つしかないので C′ = C、D′ = D と結ぶ、③ 約束した事実（内角と外角の二等分線は垂直、円周角の定理の逆）で結論を出す、の 3 つがそろっているかを見る。C′ を置かずに「二等分線は C を通る」と書き始めていたら、それが示したいことの一部であることを話す。いくつかの P を作図して確かめただけで終わっていたら、例ではすべての P を示せないことを話す。
