# G-044 アポロニウスの円
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は G-042 に合わせる（長さは Fraction の比例配分の式）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。書き方は A-019 の頭の注のとおり。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# アポロニウスの円：2 点 A、B からの距離の比 PA:PB が m:n（m と n はちがう正の数）である点 P の全体は、線分 AB を m:n に
#   内分する点 C と外分する点 D を直径の両はしとする円。m = n なら円ではなく、線分 AB の垂直二等分線になる（見本で触れるだけ）。
#   m > n なら円は B を内側に含み、A は円の外にある（m < n なら A の側にできる）。
# 前提は G-042（内角と外角の二等分線の定理、外分、内角と外角の二等分線は垂直）と G-018（半円の弧に対する円周角は 90°、
#   円周角の定理の逆）。前提の道に G-020（相似、平行線と線分の比）、G-017、A-005（比例配分）、A-010（文字と式）がある。
# 座標（G-050、G-026）、三平方の定理（G-019）、方程式（A-011）は前提の道にないので、円の方程式で軌跡を求める方法は使わず、
#   長さは比例配分と「比の差にあたる長さ」（G-042 の外分）で求め、方程式を立てる問題は出さない（逆にたどる問題は総当たりの check）。
#   三角形の 3 辺は問題で与え、実際にできる三角形にした。接線（G-054）と三平方の定理は、離の総動員の問題でだけ使う。
# わけの日は、(1) 比が m:n の点は円の上にある、(2) 円の上の点は比が m:n になる（B を通って PA に平行な直線をひく）、
#   (3) 円の中心 O について OA × OB = 半径²。(1) と (2) を合わせて「比が m:n の点の全体がちょうどこの円」になる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 アポロニウスの円（内分する点と外分する点、直径、半径、中心）
#   2 日目 円の上の点（PA の最大と最小、△PAB の面積の最大、三角形の 3 辺から円を求める）
#   3 日目 わけ　4 日目 G-042・G-018 と混ぜる（2 つの灯台からの距離の比、三角形の面積の最大）　5 日目 確認
# check：内分は AB × m/(m + n)、外分は AB × m/(m − n)（比の差にあたる長さが AB）。直径は 2 つの差、中心は 2 つの平均。
# 図は svg（D-040）。点の位置と円は与えた長さのとおりに描き、答えの長さは図に書かない。
# アポロニウスの円は、2 点からの距離の比で位置を決める測位（電波や音の強さ）、円に関する反転（G-038）、
#   2 次曲線の焦点と準線（G-041）への入口になる（D-026）。

