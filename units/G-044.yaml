      - part: 今日
        text: AB = 7 cm の 2 点 A、B について、PA:PB = 4:3 となる点 P の全体がつくる円の半径は何 cm ですか。
        answer: 12
        check: "(Fraction(7 * 4, 4 - 3) - Fraction(7 * 4, 4 + 3)) / 2"
        hints:
          - AB を 4:3 に内分する点 C と外分する点 D を求めましょう。
          - 外分する点は、比の差 1 にあたる長さが AB です。
          - 半径は、直径 CD の半分です。
        paths:
          - [AC = 4, AD = 7 × 4 = 28, CD = 24, 半径は 12 cm]
      - part: 挑戦
        text: AB = 8 cm の 2 点 A、B について、PA:PB = 3:1 となる点 P の全体がつくる円の中心を O とします。OB は何 cm ですか。
        answer: 1
        check: "(Fraction(8 * 3, 3 + 1) + Fraction(8 * 3, 3 - 1)) / 2 - 8"
        hints:
          - まず、AB を 3:1 に内分する点 C と外分する点 D を求めましょう。
          - 中心 O は CD の中点です。A から O までの長さを求めましょう。
          - OB は、OA から AB をひいた長さです。
        paths:
          - [AC = 6、AD = 12, OA = (6 + 12) ÷ 2 = 9, OB = 9 − 8 = 1, 1 cm]

