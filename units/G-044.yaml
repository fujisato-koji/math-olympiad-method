        explain: 線分 AB を 2:1 に内分する点を C、外分する点を D とします（G-042）。AC = 6 × 2/3 = 4 cm、CB = 2 cm です。D は B の先にあり、DA:DB = 2:1 なので、比の差 1 にあたる長さが AB = 6 cm で、DB = 6 cm、AD = 12 cm です。C と D は、直線 AB の上で PA:PB = 2:1 を満たす点です。直線 AB の上にない点 P で PA:PB = 2:1 のとき、△PAB の ∠P の二等分線は AB を PA:PB = 2:1 に内分するので C を通り、∠P の外角の二等分線は D を通ります（角の二等分線の定理、G-042）。内角と外角の二等分線は垂直なので ∠CPD = 90° で、P は CD を直径とする円の上にあります（半円の弧に対する円周角、G-018）。逆に、この円の上の点はどれも PA:PB = 2:1 を満たします（わけは 3 日目）。このように、2 点 A、B からの距離の比が m:n（m と n はちがう数）である点の全体は、AB を m:n に内分する点と外分する点を直径の両はしとする円になります。この円をアポロニウスの円といいます。この例では、直径 CD = 2 + 6 = 8 cm、半径 4 cm で、中心は CD の中点です。比の大きいほうの点 A は円の外に、小さいほうの点 B は円の内側にあります。m = n のとき、つまり PA = PB となる点の全体は円ではなく、線分 AB の垂直二等分線です。
      - part: 思い出す
        text: △PAB で、PA = 9 cm、PB = 6 cm、AB = 10 cm です。∠APB の二等分線と辺 AB の交点を C とすると、AC は何 cm ですか。
        answer: 6
        check: "Fraction(10 * 9, 9 + 6)"
        hints:
          - AC:CB = PA:PB です（G-042）。
          - PA:PB を簡単な比にしましょう。
          - AB をその比に分けましょう。
        paths:
          - [AC:CB = 9:6 = 3:2, AC = 10 × 3/5 = 6, 6 cm]
      - part: 思い出す
        text: △PAB で、PA = 8 cm、PB = 6 cm、AB = 5 cm です。辺 AP を P の先に延ばしてできる ∠P の外角の二等分線が、直線 AB と交わる点を D とすると、D は B の先にあります。BD は何 cm ですか。
        answer: 15
        check: "Fraction(5 * 6, 8 - 6)"
        hints:
          - AD:DB = PA:PB です（G-042）。
          - D は B の先にあるので、AD − DB = AB です。
          - 比の差にあたる長さが AB です。
        paths:
          - [AD:DB = 8:6 = 4:3, 比の差 1 が 5 cm, DB = 5 × 3 = 15, 15 cm]
      - part: 今日
        text: AB = 5 cm の 2 点 A、B について、PA:PB = 3:2 となる点 P の全体はアポロニウスの円になります。この円の直径は何 cm ですか。
        answer: 12
        check: "Fraction(5 * 3, 3 - 2) - Fraction(5 * 3, 3 + 2)"
        hints:
          - 直径の両はしは、AB を 3:2 に内分する点 C と、外分する点 D です。
          - AC と AD を、それぞれ求めましょう。
          - D は B の先にあるので、直径 CD は AD − AC です。
        paths:
          - [AC = 5 × 3/5 = 3, 外分する点 D は、比の差 1 が 5 cm なので AD = 15, CD = 15 − 3 = 12, 12 cm]
        note: 外分する点の位置で迷いやすい。比の大きいほうの A から遠い側（B の先）にできる。
      - part: 今日
        text: AB = 16 cm の 2 点 A、B について、PA:PB = 5:3 となる点 P の全体がつくる円の半径は何 cm ですか。
        answer: 15
        check: "(Fraction(16 * 5, 5 - 3) - Fraction(16 * 5, 5 + 3)) / 2"
        hints:
          - AB を 5:3 に内分する点 C と外分する点 D を求めましょう。
          - 外分する点は、比の差 2 にあたる長さが AB です。
          - 半径は、直径 CD の半分です。
        paths:
          - [AC = 16 × 5/8 = 10, 比の差 2 が 16 cm なので AD = 8 × 5 = 40, CD = 40 − 10 = 30, 半径は 15 cm]
      - part: 挑戦
        text: AB = 15 cm の 2 点 A、B について、PA:PB = 2:3 となる点 P の全体がつくる円の中心を O とします。OA は何 cm ですか。
        answer: 12
        check: "abs((Fraction(15 * 2, 2 + 3) + (-Fraction(15 * 2, 3 - 2))) / 2)"
        hints:
          - PA の比のほうが小さいので、円は A の側にできます。
          - 外分する点 D は、A の先（B と反対の側）にあります。
          - 中心 O は、直径 CD の中点です。
        paths:
          - [AC = 15 × 2/5 = 6, D は A の先で、比の差 1 が 15 cm なので DA = 30, CD = 30 + 6 = 36 で、O は D から 18 のところ, OA = 30 − 18 = 12, 12 cm]
        note: 比の小さいほうの点の側に円ができることを、図をかいて確かめさせる。D を B の先にとってしまう間違いが多い。
