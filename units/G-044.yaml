      - part: わけ
        text: 上の円の上の点 P（C、D とはちがう点）は、どれも PA:PB = m:n を満たします。このわけを、B を通って PA に平行な直線をひいて、筋道を立てて書きましょう。
        explain: 例：「P を円の上の点（C、D とはちがう）とし、B を通って PA に平行な直線が、直線 PC、PD と交わる点をそれぞれ E、F とする。CD は直径なので ∠CPD = 90°（G-018）である。BE ∥ AP なので △CBE ∽ △CAP で、BE:AP = CB:CA = n:m である。BF ∥ AP なので △DBF ∽ △DAP で、BF:AP = DB:DA = n:m である（G-020）。よって BE = BF = (n/m) × AP で、B は線分 EF の中点である。∠EPF = 90° なので、P は EF を直径とする円の上にあり（円周角の定理の逆）、その中心は EF の中点 B だから PB = BE である。したがって PB = (n/m) × PA、つまり PA:PB = m:n である。」と書ければよい。①「〜とする」で E、F を決める、② 平行線と相似で BE と BF をそれぞれ PA で表す、③ 約束した事実（半円の弧に対する円周角、円の中心から円の上の点までの長さは半径）で PB = BE と結ぶ、の 3 つがそろっているかを見る。前の問題と合わせて、「比が m:n の点の全体」がちょうどこの円になる（円の外に比が m:n の点はなく、円の上の点にもれもない）ことを話す。
        hints:
          - B を通って PA に平行な直線と、直線 PC、PD の交点を E、F としましょう。
          - 相似な三角形から、BE と BF を、それぞれ PA を使って表しましょう。
          - ∠EPF の大きさから、B と P の距離について何が言えるでしょう。
        paths:
          - [E、F を決める, △CBE ∽ △CAP で BE = (n/m)AP、△DBF ∽ △DAP で BF = (n/m)AP, B は EF の中点で、∠EPF = 90° なので PB = BE, PA:PB = m:n]
      - part: わけ
        text: AB = d、PA:PB = m:n（m > n）のアポロニウスの円の中心を O、半径を r とします。OA × OB = r² となるわけを、筋道を立てて書きましょう。
        explain: 例：「AB を m:n に内分する点を C、外分する点を D とする。比例配分より AC = (md)/(m + n)、外分の比の差より AD = (md)/(m − n) である。O は CD の中点なので、OA = (AC + AD)/2 = (md/2) × (1/(m + n) + 1/(m − n)) = (m²d)/(m² − n²)。半径は r = (AD − AC)/2 = (md/2) × (1/(m − n) − 1/(m + n)) = (mnd)/(m² − n²)。OA は d より大きいので B は A と O の間にあり、OB = OA − d = (m² − (m² − n²))d/(m² − n²) = (n²d)/(m² − n²)。よって OA × OB = (m²n²d²)/(m² − n²)² = r² である。」と書ければよい。①「〜とする」で d、m、n、C、D を決める、② 通分して OA、r、OB を文字の式で表す、③ 約束した事実（比例配分、外分、中点）で結び、OA × OB と r² が等しいと示す、の 3 つがそろっているかを見る。見本の AB = 6 cm、2:1 で OA = 8、OB = 2、r = 4（8 × 2 = 16 = 4²）と確かめるのはよいが、それで終わっていたら、例ではすべての場合を示せないことを話す。この関係は、A と B が円について反転の位置にあること（G-038）を表す。
        hints:
          - AC と AD を、d、m、n の式で表しましょう。
          - O は CD の中点です。OA と r を、AC と AD で表しましょう。
          - OB = OA − d を通分して計算し、OA × OB を r² とくらべましょう。
        paths:
          - [AC = (md)/(m + n)、AD = (md)/(m − n) とする, OA = (m²d)/(m² − n²)、r = (mnd)/(m² − n²), OB = OA − d = (n²d)/(m² − n²), OA × OB = r²]
