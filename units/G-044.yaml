          - PA + PB を、PA だけを使って表しましょう。
          - PA が最も大きくなる点を考えましょう。A からいちばん遠い円の上の点です。
        paths:
          - [PB = PA ÷ 2 なので PA + PB = PA × 3/2, PA の最大は AD = 24, 24 × 3/2 = 36, 36 cm]
          - [P が D にあるとき PA = AD = 24、PB = DB = 12, PB = PA ÷ 2 なので PA と PB はどちらも D で最も大きい, 24 + 12 = 36, 36 cm]

