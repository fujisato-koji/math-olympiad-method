# G-044 アポロニウスの円
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は G-042 に合わせる（長さは Fraction の比例配分の式）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。書き方は A-019 の頭の注のとおり。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# アポロニウスの円：2 点 A、B からの距離の比 PA:PB が m:n（m と n はちがう正の数）である点 P の全体は、線分 AB を m:n に
#   内分する点 C と外分する点 D を直径の両はしとする円。m = n なら円ではなく、線分 AB の垂直二等分線になる（見本で触れるだけ）。
#   m > n なら円は B を内側に含み、A は円の外にある（m < n なら A の側にできる）。
# 前提は G-042（内角と外角の二等分線の定理、外分、内角と外角の二等分線は垂直）と G-018（半円の弧に対する円周角は 90°、
#   円周角の定理の逆）。前提の道に G-020（相似、平行線と線分の比）、G-017、A-005（比例配分）、A-010（文字と式）がある。
# 座標（G-050、G-026）、三平方の定理（G-019）、方程式（A-011）は前提の道にないので、円の方程式で軌跡を求める方法は使わず、
#   長さは比例配分と「比の差にあたる長さ」（G-042 の外分）で求め、方程式を立てる問題は出さない（逆にたどる問題は総当たりの check）。
#   三角形の 3 辺は問題で与え、実際にできる三角形にした。接線（G-054）と三平方の定理は、離の総動員の問題でだけ使う。
# わけの日は、(1) 比が m:n の点は円の上にある、(2) 円の上の点は比が m:n になる（B を通って PA に平行な直線をひく）、
#   (3) 円の中心 O について OA × OB = 半径²。(1) と (2) を合わせて「比が m:n の点の全体がちょうどこの円」になる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 アポロニウスの円（内分する点と外分する点、直径、半径、中心）
#   2 日目 円の上の点（PA の最大と最小、△PAB の面積の最大、三角形の 3 辺から円を求める）
#   3 日目 わけ　4 日目 G-042・G-018 と混ぜる（2 つの灯台からの距離の比、三角形の面積の最大）　5 日目 確認
# check：内分は AB × m/(m + n)、外分は AB × m/(m − n)（比の差にあたる長さが AB）。直径は 2 つの差、中心は 2 つの平均。
# 図は svg（D-040）。円の図は与えた長さの比のとおりに描き、求める長さは図に書かず「?」にする。
# 図の直し（D-131、-fix3）：見本に、PA:PB = 2:1 の点が円の上にならぶ図（PA は赤、PB は青、直径 CD はむらさき）を付けた。
#   答える問題には、円と P と PA・PB の図、動く P を 3 つ重ねた図、三角形の図、灯台と船の絵を付けた。
#   ヒントの図は、内分（AB を m + n つに分ける）と外分（AD と BD を同じます目でならべ、比の差のぶんが AB）の図、
#   A と中心 O を通る直線が円と交わる 2 点、高さがいちばん高い点と半径、C と D の真ん中の O。答えの長さは描かない。
# アポロニウスの円は、2 点からの距離の比で位置を決める測位（電波や音の強さ）、円に関する反転（G-038）、
#   2 次曲線の焦点と準線（G-041）への入口になる（D-026）。

id: G-044
days:
  - day: 1
    items:
      - part: 見本
        id: "0464133159"
        text: AB = 6 cm の 2 点 A、B から、PA が PB のちょうど 2 倍（PA:PB = 2:1）になる点 P をたくさんとると、1 つの円の上にならびます。この円の直径の両はしは、AB を 2:1 に内分する点 C と、外分する点 D です。この円をアポロニウスの円といいます。
        svg: '<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="100" x2="312" y2="100" stroke="currentColor" stroke-width="1.5"/><circle cx="196" cy="100" r="72" stroke="currentColor" stroke-width="2" fill="#b39ddb" fill-opacity="0.18"/><line x1="124" y1="100" x2="268" y2="100" stroke="#b39ddb" stroke-width="4"/><circle cx="259.6" cy="66.2" r="4" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.9"/><circle cx="229.8" cy="36.4" r="4" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.9"/><circle cx="128.3" cy="75.4" r="4" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.9"/><circle cx="157.8" cy="161.1" r="4" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.9"/><circle cx="198.5" cy="172" r="4" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.9"/><circle cx="238.3" cy="158.2" r="4" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.9"/><circle cx="263.7" cy="124.6" r="4" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.9"/><line x1="160" y1="37.6" x2="52" y2="100" stroke="#f08080" stroke-width="3"/><line x1="160" y1="37.6" x2="160" y2="100" stroke="#7fc8f8" stroke-width="3"/><line x1="103" y1="63.6" x2="109" y2="74" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="37.6" r="3.5" fill="currentColor"/><text x="153" y="30.5" font-size="14" text-anchor="middle" fill="currentColor">P</text><text x="88" y="94" font-size="13" text-anchor="middle" fill="currentColor">4 cm</text><text x="142" y="94" font-size="13" text-anchor="middle" fill="currentColor">2</text><text x="214" y="94" font-size="13" text-anchor="middle" fill="currentColor">6 cm</text><circle cx="52" cy="100" r="3.5" fill="currentColor"/><text x="52" y="120" font-size="14" text-anchor="middle" fill="currentColor">A</text><circle cx="160" cy="100" r="3.5" fill="currentColor"/><text x="160" y="120" font-size="14" text-anchor="middle" fill="currentColor">B</text><circle cx="124" cy="100" r="3.5" fill="currentColor"/><text x="120" y="120" font-size="14" text-anchor="end" fill="currentColor">C</text><circle cx="268" cy="100" r="3.5" fill="currentColor"/><text x="273" y="93" font-size="14" text-anchor="start" fill="currentColor">D</text><text x="38" y="168" font-size="14" text-anchor="end" fill="currentColor">PA</text><rect x="44" y="155" width="30" height="16" rx="2" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><rect x="74" y="155" width="30" height="16" rx="2" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="38" y="194" font-size="14" text-anchor="end" fill="currentColor">PB</text><rect x="44" y="181" width="30" height="16" rx="2" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="10" y="22" font-size="14" text-anchor="start" fill="currentColor">PA:PB = 2:1 の点 P</text></svg>'
        explain: 線分 AB を 2:1 に内分する点を C、外分する点を D とします（G-042）。AC = 6 × 2/3 = 4 cm、CB = 2 cm です。D は B の先にあり、DA:DB = 2:1 なので、比の差 1 にあたる長さが AB = 6 cm で、DB = 6 cm、AD = 12 cm です。C と D は、直線 AB の上で PA:PB = 2:1 を満たす点です。直線 AB の上にない点 P で PA:PB = 2:1 のとき、△PAB の ∠P の二等分線は AB を PA:PB = 2:1 に内分するので C を通り、∠P の外角の二等分線は D を通ります（角の二等分線の定理、G-042）。内角と外角の二等分線は垂直なので ∠CPD = 90° で、P は CD を直径とする円の上にあります（半円の弧に対する円周角、G-018）。逆に、この円の上の点はどれも PA:PB = 2:1 を満たします（わけは 3 日目）。このように、2 点 A、B からの距離の比が m:n（m と n はちがう数）である点の全体は、AB を m:n に内分する点と外分する点を直径の両はしとする円になります。この円をアポロニウスの円といいます。この例では、直径 CD = 2 + 6 = 8 cm、半径 4 cm で、中心は CD の中点です。比の大きいほうの点 A は円の外に、小さいほうの点 B は円の内側にあります。m = n のとき、つまり PA = PB となる点の全体は円ではなく、線分 AB の垂直二等分線です。図の黄色の点も、どれも PA:PB = 2:1 を満たします。
