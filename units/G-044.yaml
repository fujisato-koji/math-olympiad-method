    text: AB = 8 cm の 2 点 A、B があります。点 P は PA:PB = 3:1 を、点 Q は QA:QB = 1:3 を満たして動きます。PQ のとりうる最も大きい値は何 cm ですか。
    answer: 16
    check: "(lambda o, r: (o - (8 - o)) + 2 * r)((Fraction(24, 4) + Fraction(24, 2)) / 2, (Fraction(24, 2) - Fraction(24, 4)) / 2)"
    hints:
      - P と Q が、それぞれどんな円の上を動くかを考えましょう。
      - 2 つの円は、線分 AB の垂直二等分線について対称な位置にあります。
      - 2 つの円の上の点の距離が最も大きくなるのは、中心を結ぶ直線の上です。
    paths:
      - [P の円は AC = 6、AD = 12 で、中心は A から B の側へ 9、半径 3, Q の円は A と B を入れかえた位置で、中心は B から A の側へ 9（A の先 1）、半径 3, 中心の間は 10, PQ の最大は 10 + 3 + 3 = 16, 16 cm]
    note: 比を入れかえると、円は AB の垂直二等分線について折り返した位置にできる（対称を見つける道筋）。2 つの円の上の点の距離の最大は「中心の距離 + 半径 + 半径」。
  - part: 離
    kinds: [数, 手数]
    text: AB = 13 cm の 2 点 A、B があります。PA:PB = 7:6 となる点 P をとるとき、△PAB の面積のとりうる最も大きい値は何 cm² ですか。
    answer: 273
    check: "Fraction(1, 2) * 13 * (Fraction(13 * 7, 7 - 6) - Fraction(13 * 7, 7 + 6)) / 2"
    hints:
      - AB を 7:6 に内分する点と外分する点を求めましょう。
      - 外分する点は、比の差 1 にあたる長さが AB です。
      - 底辺 AB が決まっているので、高さが最も大きくなるのはどこでしょう。
    paths:
      - [AC = 7、CB = 6, 比の差 1 が 13 cm なので DB = 78、AD = 91, 直径 CD = 84、半径 42, 13 × 42 ÷ 2 = 273, 273 cm²]
    note: 比が 1 に近いと外分する点がとても遠くにでき、円が大きくなる（7:6 で半径は AB の 3 倍以上）。数の大きさに驚かず、内分・外分・半径・面積と順に進めるのが要点。
