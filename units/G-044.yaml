            <text x="145.0" y="127.4" font-size="14" text-anchor="middle">B</text>
            <circle cx="104.8" cy="110.4" r="3" fill="currentColor"/>
            <text x="95.8" y="127.4" font-size="14" text-anchor="middle">C</text>
            <circle cx="265.5" cy="110.4" r="3" fill="currentColor"/>
            <text x="274.5" y="127.4" font-size="14" text-anchor="middle">D</text>
