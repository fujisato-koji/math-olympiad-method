      - part: 今日
        text: コイルの巻き数を 2 倍にすると、誘導起電力は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - V = N ΔΦ/Δt です。
          - N が 2 倍になると、V はどうなりますか。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [V ∝ N, N が 2 倍, V も 2 倍]
      - part: わけ
        text: ファラデーの法則 V = −N ΔΦ/Δt が成り立つわけを説明しましょう。
        explain: 「コイルを貫く磁束が変わると、電場が生じて電子を動かす。磁束の変化が速いほど、生じる電場は強い。巻き数が多いほど、コイル 1 巻きずつの起電力が足し合わされる。だから V は N と ΔΦ/Δt に比例する。」と書ければよい。① 磁束の変化、② 電場が生じる、③ N 倍。子どもには、磁石を速く動かすと起電力が大きくなる実験で確かめさせます。
        hints:
          - 磁束が変わると、電場が生じて電子を動かします。
          - 変化が速いほど、起電力は大きくなります。
          - 巻き数が多いほど、起電力が足し合わされます。
        paths:
          - [磁束の変化, 電場が生じる, 変化が速いほど大きい, N 倍, V = −NΔΦ/Δt]

  - day: 2
    items:
      - part: 見本
        text: |-
          レンツの法則：誘導電流は、磁束の変化を妨げる向きに流れます。
          磁石をコイルに近づけると、コイルは磁石を退けようとする向きに電流が流れます。
          磁石を遠ざけると、コイルは磁石を引き止めようとする向きに電流が流れます。
          これは、エネルギー保存則からも説明できます。
        explain: |-
          磁束が増えるときは、それを減らす向きの磁場を作る電流。磁束が減るときは、増やす向き。
          近づけると反発、遠ざけると引力。誘導電流の向きは、常に変化に逆らいます。
        note: レンツの法則：変化を妨げる向き。近づけると反発、遠ざけると引力。
      - part: 思い出す
        text: コイルを貫く磁束が増えるとき、誘導電流はどんな磁場を作りますか。
        choices: ["増やす向き", "減らす向き", "同じ向き", "磁場を作らない"]
        answer: "減らす向き"
        check: "'減らす向き'"
        hints:
          - レンツの法則は、変化を妨げる向きです。
          - 磁束が増えています。
          - 減らす向きの磁場を作ります。
        paths:
          - [磁束が増える, 変化を妨げる, 減らす向き]
      - part: 今日
        text: 磁石をコイルに近づけると、コイルは磁石をどうしようとしますか。
        choices: ["退けようとする", "引き止めようとする", "回そうとする", "何もしない"]
        answer: "退けようとする"
        check: "'退けようとする'"
        hints:
          - 近づけると磁束が増えます。
          - 増えるのを妨げる向きの電流が流れます。
          - 磁石を退けようとします。
        paths:
          - [近づける, 磁束が増える, 反発, 退けようとする]
      - part: 今日
        text: 磁石をコイルから遠ざけると、コイルは磁石をどうしようとしますか。
        choices: ["退けようとする", "引き止めようとする", "回そうとする", "何もしない"]
        answer: "引き止めようとする"
        check: "'引き止めようとする'"
        hints:
          - 遠ざけると磁束が減ります。
          - 減るのを妨げる向きの電流が流れます。
          - 磁石を引き止めようとします。
        paths:
          - [遠ざける, 磁束が減る, 引力, 引き止めようとする]
      - part: 挑戦
        text: レンツの法則は、どんな保存則からも説明できますか。
        choices: ["エネルギー保存", "電荷保存", "運動量保存", "質量保存"]
        answer: "エネルギー保存"
        check: "'エネルギー保存'"
        hints:
          - 誘導電流が流れると、ジュール熱が出ます。
          - 熱のエネルギーは、磁石を動かす仕事から来ます。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [誘導電流でジュール熱, 磁石を動かす仕事, エネルギー保存]
    extra:
      - part: 今日
        text: コイルに磁石を近づけると、コイルと磁石の間にはたらく力はどれですか。
        choices: ["引力", "反発力", "はたらかない", "回転力だけ"]
        answer: "反発力"
        check: "'反発力'"
        hints:
          - 近づけると磁束が増えます。
          - 変化を妨げるので、退け合います。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [近づける, 磁束増, 退け合う, 反発力]
      - part: 今日
        text: コイルから磁石を遠ざけると、コイルと磁石の間にはたらく力はどれですか。
        choices: ["引力", "反発力", "はたらかない", "回転力だけ"]
        answer: "引力"
        check: "'引力'"
        hints:
          - 遠ざけると磁束が減ります。
          - 変化を妨げるので、引き止めます。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [遠ざける, 磁束減, 引き止める, 引力]
      - part: わけ
        text: レンツの法則がエネルギー保存則から説明できるわけを説明しましょう。
        explain: 「もし誘導電流が変化を強める向きに流れたら、磁石の動きが加速され、エネルギーが際限なく増えてしまう。実際には、誘導電流は変化を妨げる向きに流れ、磁石を動かす仕事の一部がジュール熱になる。だからエネルギー保存が成り立つ。」と書ければよい。① 変化を強めたらエネルギーが増え続ける、② 実際は妨げる向き、③ 仕事が熱になる。子どもには、磁石を近づけると手に反発を感じる実験で確かめさせます。
        hints:
          - 変化を強める向きに電流が流れたら、どうなりますか。
          - エネルギーが際限なく増えてしまいます。
          - 実際は妨げる向きで、仕事が熱になります。
        paths:
          - [変化を強めたらエネルギー増大, 実際は妨げる向き, 仕事がジュール熱, エネルギー保存]

  - day: 3
    items:
      - part: 見本
        text: |-
          自己誘導：コイルに流れる電流が変わると、コイル自身に誘導起電力が生じます。
          V = −L ΔI/Δt。L は自己インダクタンス（H、ヘンリー）。
          コイルに蓄えられるエネルギーは U = 1/2 L I²。
          相互誘導：1 つのコイルの電流変化が、別のコイルに起電力を生みます。V₂ = −M ΔI₁/Δt。
        explain: |-
          電流の変化を妨げる向きに起電力が生じます。L が大きいほど、電流を変えにくくなります。
          例：L=2 H、ΔI=3 A、Δt=0.5 s なら、|V| = 2 × 3/0.5 = 12 V。
          エネルギー：L=0.5 H、I=2 A なら、U = 1/2 × 0.5 × 4 = 1 J。
        note: V = −L ΔI/Δt。U = 1/2 L I²。相互誘導は M ΔI/Δt。
      - part: 思い出す
        text: 自己インダクタンス L のコイルの誘導起電力はどれですか。
        choices: ["V = −L I", "V = −L ΔI/Δt", "V = −L/Δt", "V = −L Δt/ΔI"]
        answer: "V = −L ΔI/Δt"
        check: "'V = −L ΔI/Δt'"
        hints:
          - 電流の変化の割合に比例します。
          - 比例定数が L です。
          - 求めた量の単位を確かめてから、答えましょう。
        paths:
          - [電流の変化に比例, V = −L ΔI/Δt]
      - part: 今日
        text: L = 2 H のコイルの電流が 0.5 s で 3 A 変化しました。誘導起電力の大きさはいくつですか。
        choices: [3, 6, 12, 24]
        answer: 12
        check: "f'{2 * 3 / 0.5:.0f}'"
        hints:
          - V = L ΔI/Δt です。
          - 2 × 3 ÷ 0.5 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [V = LΔI/Δt, 2 × 3/0.5 = 12 V]
      - part: 今日
        text: L = 0.5 H、I = 2 A のコイルに蓄えられるエネルギーはいくつですか。
        choices: [0.5, 1, 2, 4]
        answer: 1
        check: "f'{0.5 * 0.5 * 2 ** 2:.0f}'"
        hints:
          - U = 1/2 L I² です。
          - 1/2 × 0.5 × 4 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [U = 1/2 LI², 0.5 × 0.5 × 4 = 1 J]
      - part: 挑戦
        text: 相互誘導で、1 次コイルの電流を変えると、2 次コイルに何が生じますか。
        choices: ["誘導起電力", "電荷", "質量", "磁荷"]
        answer: "誘導起電力"
        check: "'誘導起電力'"
        hints:
          - 1 次コイルの電流が磁束を作ります。
          - 磁束が変わると、2 次コイルに起電力が生じます。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [1 次の電流が磁束, 磁束が変わる, 2 次に誘導起電力]
    extra:
      - part: 今日
        text: 自己インダクタンスの単位はどれですか。
        choices: ["H", "Wb", "V", "F"]
        answer: "H"
        check: "'H'"
        hints:
          - ヘンリーと読みます。
          - 記号は H です。
