        text: 自己インダクタンスを 2 倍にすると、同じ電流の変化で生じる起電力は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - V = L ΔI/Δt です。
          - L が 2 倍になると、V はどうなりますか。
