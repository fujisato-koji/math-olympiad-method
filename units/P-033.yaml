      - part: わけ
        text: 直列 RLC 回路のインピーダンスが Z = √(R²+(X_L−X_C)²) になるわけを説明しましょう。
        explain: 「抵抗の電圧 R I と、リアクタンスの電圧 (X_L−X_C)I は、位相が 90° ずれている。直交する 2 つの成分を合成すると、大きさは直角三角形の斜辺になる。だから Z = √(R²+(X_L−X_C)²)。」と書ければよい。① 位相が 90° ずれる、② 直交する成分、③ 斜辺。子どもには、3-4-5 の直角三角形で確かめさせます。
        hints:
          - 抵抗とリアクタンスの電圧は、位相が 90° ずれています。
          - 直交する 2 つの成分として合成します。
          - 斜辺の長さが Z です。
        paths:
          - [位相 90°, 直交成分, 斜辺, Z = √(R²+(X_L−X_C)²)]

  - day: 6
    items:
      - part: わけ
        text: ファラデーの法則 V = −N ΔΦ/Δt が成り立つわけを説明しましょう。
        explain: 「コイルを貫く磁束が変わると、電場が生じて電子を動かす。磁束の変化が速いほど、生じる電場は強い。巻き数が多いほど、コイル 1 巻きずつの起電力が足し合わされる。だから V は N と ΔΦ/Δt に比例する。」と書ければよい。① 磁束の変化、② 電場、③ N 倍。子どもには、磁石を速く動かすと起電力が大きくなる実験で確かめさせます。
        hints:
          - 磁束が変わると、電場が生じます。
          - 変化が速いほど、起電力は大きくなります。
          - 巻き数が多いほど、起電力が足し合わされます。
        paths:
          - [磁束の変化, 電場, 変化の速さ, N 倍, V = −NΔΦ/Δt]
      - part: わけ
        text: レンツの法則がエネルギー保存則から説明できるわけを説明しましょう。
        explain: 「誘導電流が変化を強める向きに流れると、磁石の動きが加速され、エネルギーが際限なく増えてしまう。実際には、誘導電流は変化を妨げる向きに流れ、磁石を動かす仕事の一部がジュール熱になる。だからエネルギー保存が成り立つ。」と書ければよい。① 変化を強めたらエネルギー増大、② 実際は妨げる向き、③ 仕事が熱。子どもには、反発を手で感じる実験で確かめさせます。
        hints:
          - 変化を強める向きに電流が流れたら、エネルギーはどうなりますか。
          - 際限なく増えてしまいます。
          - 実際は妨げる向きで、仕事が熱になります。
        paths:
          - [変化を強めたらエネルギー増大, 妨げる向き, 仕事がジュール熱, エネルギー保存]
      - part: わけ
        text: RL 回路の時定数が τ = L/R になるわけを説明しましょう。
        explain: 「コイルの起電力 L ΔI/Δt が、抵抗の電圧 R I とつり合う。電流の変化の割合は ΔI/Δt = −(R/L) I の形になる。変化の速さを決める係数が R/L なので、時間の目安はその逆数の L/R。」と書ければよい。① 起電力と抵抗の電圧、② 変化の割合、③ 逆数。子どもには、L や R を変えたときの立ち上がりで確かめさせます。
        hints:
          - コイルの起電力と抵抗の電圧がつり合います。
          - 電流の変化の割合は R/L に比例します。
          - 時間の目安は L/R です。
        paths:
          - [LΔI/Δt と RI, 変化の割合 ∝ R/L, τ = L/R]

