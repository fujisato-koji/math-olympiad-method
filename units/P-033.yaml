        text: RL 回路の時定数が τ = L/R になるわけを説明しましょう。
        explain: 「コイルの起電力 L ΔI/Δt が、抵抗の電圧 R I とつり合う。電流の変化の割合は ΔI/Δt = −(R/L) I の形になる。変化の速さを決める係数が R/L なので、時間の目安はその逆数の L/R。」と書ければよい。① 起電力と抵抗の電圧、② 変化の割合、③ 逆数が時定数。子どもには、L や R を変えたときの立ち上がりの速さで確かめさせます。
        hints:
          - コイルの起電力と抵抗の電圧がつり合います。
          - 電流の変化の割合は R/L に比例します。
          - 時間の目安は L/R です。
        paths:
          - [LΔI/Δt と RI, 変化の割合 ∝ R/L, τ = L/R]

  - day: 5
    items:
      - part: 見本
        text: |-
          交流：電圧が V = V₀ sin(ωt) のように振動します。ω = 2πf。
          コイルの誘導リアクタンスは X_L = ωL、コンデンサーの容量リアクタンスは X_C = 1/(ωC)。
          直列 RLC 回路のインピーダンスは Z = √(R² + (X_L − X_C)²)。
          共振：X_L = X_C、つまり ω = 1/√(LC) のとき、Z は最小の R になります。
        explain: |-
          交流では、コイルは電流の変化を妨げ、コンデンサーは電圧の変化を妨げます。
          Z は、交流の流れにくさ。R とリアクタンスを直角三角形の辺のように合成します。
          共振すると、コイルとコンデンサーの効果が打ち消し合い、電流が流れやすくなります。
        note: X_L = ωL、X_C = 1/(ωC)、Z = √(R²+(X_L−X_C)²)。共振は ω=1/√(LC)。
      - part: 思い出す
        text: 角振動数 ω と振動数 f の関係はどれですか。
        choices: ["ω = f", "ω = 2πf", "ω = f/2π", "ω = 2π/f"]
        answer: "ω = 2πf"
        check: "'ω = 2πf'"
        hints:
          - 1 周期で位相が 2π 進みます。
          - 1 秒に f 周期です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [1 周期 2π, f 周期, ω = 2πf]
      - part: 今日
        text: R = 3 Ω、X_L = 4 Ω、X_C = 0 の直列回路のインピーダンスはいくつですか。
        choices: [1, 5, 7, 25]
        answer: 5
        check: "f'{(3 ** 2 + 4 ** 2) ** 0.5:.0f}'"
        hints:
          - Z = √(R² + X_L²) です。
          - 3² + 4² = 25 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [Z = √(3²+4²), √25 = 5 Ω]
      - part: 今日
        text: 直列 RLC 回路が共振する条件はどれですか。
        choices: ["X_L = X_C", "X_L = R", "X_C = R", "R = 0"]
        answer: "X_L = X_C"
        check: "'X_L = X_C'"
        hints:
          - 共振では、コイルとコンデンサーの効果が打ち消し合います。
          - リアクタンスが等しくなるときです。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [効果が打ち消す, X_L = X_C]
      - part: 挑戦
        text: 振動数 50 Hz、L = 0.1 H のコイルの誘導リアクタンスは約いくつですか。π = 3.14 とします。
        choices: [3.14, 31.4, 314, 3140]
        answer: 31.4
        check: "f'{2 * math.pi * 50 * 0.1:.1f}'"
        hints:
          - X_L = 2πfL です。
          - 2 × 3.14 × 50 × 0.1 を計算します。
          - 約 31.4 Ω です。
        paths:
          - [X_L = 2πfL, 2 × 3.14 × 50 × 0.1 ≈ 31.4 Ω]
    extra:
