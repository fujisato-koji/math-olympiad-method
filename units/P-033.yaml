      - part: 今日
        text: R = 1 kΩ、C = 2 μF の RC 回路の時定数は何 ms ですか。
        choices: [0.5, 2, 20, 200]
        answer: 2
        check: "f'{1000 * 2e-6 * 1000:.0f}'"
        hints:
          - τ = RC です。
          - 1000 Ω × 2 × 10⁻⁶ F = 2 × 10⁻³ s です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [τ = RC, 1000 × 2e-6 = 2e-3 s = 2 ms]
      - part: 挑戦
        text: RL 回路で、時定数 τ だけたつと、電流は最終値の約何 % になりますか。
        choices: [37, 50, 63, 100]
        answer: 63
        check: "63"
        hints:
          - 時定数は、最終値の約 63% に達する時間です。
          - 1 − e⁻¹ ≈ 0.63 です。
          - 約 63% です。
        paths:
          - [τ で 1−e⁻¹, ≈ 0.63, 63%]
    extra:
      - part: 今日
        text: RL 回路で、5τ だけたつと、電流は最終値の約何 % になりますか。
