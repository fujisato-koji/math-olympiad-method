        text: コンデンサーの容量リアクタンスはどれですか。
        choices: ["ωC", "1/(ωC)", "ω/C", "C/ω"]
        answer: "1/(ωC)"
        check: "'1/(ωC)'"
        hints:
          - 周波数が高いほど、コンデンサーは電流を通しやすくなります。
