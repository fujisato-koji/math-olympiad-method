      - part: わけ
        text: コイルに蓄えられるエネルギーが U = 1/2 L I² になるわけを説明しましょう。
        explain: 「コイルの電流を 0 から I まで増やすとき、自己誘導が電流の増加を妨げる。電源はそれに逆らって仕事をする。電流 i のときの起電力は L di/dt なので、仕事は L i を積み重ねたもの。平均で 1/2 になり、U = 1/2 L I²。」と書ければよい。① 電流を増やす仕事、② 自己誘導が妨げる、③ 平均 1/2。子どもには、電流と磁束のグラフの面積で確かめさせます。
        hints:
          - 電流を増やすとき、自己誘導が妨げます。
          - 電源はそれに逆らって仕事をします。
          - エネルギーは 1/2 L I² になります。
        paths:
          - [電流を増やす仕事, 自己誘導が妨げる, 平均 1/2, U = 1/2 LI²]

  - day: 4
    items:
      - part: 見本
        text: |-
          RL 回路：抵抗 R とコイル L を直列につなぐと、電流はゆっくり立ち上がります。
          時定数 τ = L/R。τ 秒で、最終値の約 63% になります。5τ でほぼ最終値。
          RC 回路：抵抗 R とコンデンサー C を直列につなぐと、電圧はゆっくり立ち上がります。
          時定数 τ = RC。τ 秒で約 63%、5τ でほぼ最終値。
        explain: |-
          RL の時定数は L/R。L が大きいほど、R が小さいほど、立ち上がりが遅い。
          RC の時定数は RC。R が大きいほど、C が大きいほど、充電が遅い。
          例：R=2 Ω、L=4 H なら τ=2 s。R=1 kΩ、C=2 μF なら τ=2 ms。
        note: RL は τ=L/R、RC は τ=RC。τ で約 63%、5τ でほぼ最終値。
      - part: 思い出す
        text: RC 回路の時定数はどれですか。
        choices: ["R/C", "RC", "C/R", "R + C"]
        answer: "RC"
        check: "'RC'"
        hints:
          - 抵抗とコンデンサーの積です。
          - 単位が秒になります。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [時定数 = RC]
      - part: 今日
        text: R = 2 Ω、L = 4 H の RL 回路の時定数はいくつですか。
        choices: [0.5, 2, 4, 8]
        answer: 2
        check: "f'{4 / 2:.0f}'"
        hints:
          - τ = L/R です。
          - 4 ÷ 2 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
