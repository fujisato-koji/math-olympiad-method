# P-033 電磁誘導と交流
#
# 段 5・水準 3・8 日。前提は A-021（三角関数と加法定理）。
# 磁束とファラデーの法則、レンツの法則、自己・相互誘導、RL・RC の時定数、交流と複素インピーダンスを扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-033
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          磁束 Φ は、面を貫く磁場の量です。Φ = B A cos θ。単位は Wb（ウェーバ）。
          ファラデーの法則：コイルを貫く磁束が変わると、誘導起電力が生じます。
          V = −N ΔΦ/Δt。N はコイルの巻き数、ΔΦ/Δt は磁束の変化の割合です。
          磁束が変わらなければ、誘導起電力は 0 です。
        explain: |-
          磁束の変化が速いほど、誘導起電力は大きくなります。巻き数が多いほど、起電力も大きくなります。
          例：N=1、ΔΦ=0.5 Wb、Δt=0.1 s なら、|V| = 0.5/0.1 = 5 V。
          N=100、ΔΦ=0.01 Wb、Δt=0.1 s なら、|V| = 100 × 0.01/0.1 = 10 V。
        note: Φ = BA cos θ。V = −N ΔΦ/Δt。磁束の変化が起電力のもと。
      - part: 思い出す
        text: 磁場 1 T が面積 2 m² の面に垂直に貫くとき、磁束はいくつですか。
        choices: [0.5, 1, 2, 4]
        answer: 2
        check: "1 * 2"
        hints:
          - Φ = B A です。
          - 1 × 2 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [Φ = BA, 1 × 2 = 2 Wb]
      - part: 今日
        text: 磁束が 0.5 s で 0.5 Wb 変化しました。N=1 のコイルの誘導起電力の大きさはいくつですか。
        choices: [0.25, 1, 5, 10]
        answer: 1
        check: "f'{0.5 / 0.5:.0f}'"
        hints:
          - V = N ΔΦ/Δt です。
          - 0.5 ÷ 0.5 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [V = ΔΦ/Δt, 0.5/0.5 = 1 V]
      - part: 今日
        text: 磁束が 0.1 s で 0.01 Wb 変化しました。N=100 のコイルの誘導起電力の大きさはいくつですか。
        choices: [0.1, 1, 10, 100]
        answer: 10
        check: "f'{100 * 0.01 / 0.1:.0f}'"
        hints:
          - V = N ΔΦ/Δt です。
          - 100 × 0.01 ÷ 0.1 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [V = N ΔΦ/Δt, 100 × 0.01/0.1 = 10 V]
      - part: 挑戦
        text: コイルを貫く磁束が一定のとき、誘導起電力はいくつですか。
        choices: [0, "NΦ", "Φ/Δt", "無限大"]
        answer: 0
        check: "0"
        hints:
          - 誘導起電力は、磁束の変化で生まれます。
          - 変化が 0 なら、起電力も 0 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [磁束が一定, 変化 0, 起電力 0]
    extra:
      - part: 今日
        text: 磁束の単位はどれですか。
        choices: ["Wb", "V", "A", "Ω"]
        answer: "Wb"
        check: "'Wb'"
        hints:
          - 磁束は磁場 × 面積です。
          - 磁場 T と面積 m² の積です。
          - Wb（ウェーバ）です。
