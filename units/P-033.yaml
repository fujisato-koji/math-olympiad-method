        text: インピーダンスの単位はどれですか。
        choices: ["Ω", "H", "F", "Wb"]
        answer: "Ω"
        check: "'Ω'"
        hints:
          - インピーダンスは、交流の流れにくさです。
          - 抵抗と同じ単位です。
          - 求めた量の単位を確かめてから、答えましょう。
