"30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="168" y="124" font-size="14" text-anchor="middle" fill="currentColor">3k + 2</text><rect x="208" y="104" width="80" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="248" y="124" font-size="14" text-anchor="middle" fill="currentColor">3k + 4</text></svg>'
