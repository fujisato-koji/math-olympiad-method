8" rx="2" stroke="currentColor" stroke-width="1.6" fill="#f3c969" fill-opacity="0.5"/><text x="230" y="50" font-size="13" text-anchor="start" fill="currentColor">9 こ（組）</text><rect x="210" y="64" width="14" height="10" rx="1" stroke="currentColor" stroke-width="1.6" fill="#f08080" fill-opacity="0.9"/><text x="230" y="74" font-size="13" text-anchor="start" fill="currentColor">1 こ</text><text x="210" y="104" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">10 = 9 + 1</text><text x="160" y="184" font-size="14" text-anchor="middle" fill="currentColor">のこりは、赤 4 こと、ばら 7 こ ＝ 4 + 7</text></svg>'
        explain: 2 けたの整数の十の位の数字を a、一の位の数字を b とすると、その数は 10a + b と表せます。10a + b = 9a + (a + b) です。9a は 9 の《倍数》なので、10a + b を 9 でわったあまりは、a + b を 9 でわったあまりと同じです（和のあまり）。たとえば 47 は 4 + 7 = 11 で、11 を 9 でわったあまりは 2。47 = 9 × 5 + 2 と合っています。9a は 3 の倍数でもあるので、3 でわったあまりも位の数字の和で分かります。位を入れかえた数 10b + a との和や差も、文字で表すと何の倍数かが分かります。
