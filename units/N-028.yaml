# N-028 あまりで分類する
#
# 書き方は N-001 の頭の注、文字の式を選ぶ問題の check は A-010 の頭の注、負の数の書き方は N-010 の頭の注のとおり。段 4 なので普通の文。
# 前提は N-022（あまりの性質）、A-010（文字と式）、L-007（場合分け）。N-022 は作った時点でファイルがないので、地図の題と N-017 の注から、
#   「和・差・積のあまりは、あまりどうしの和・差・積のあまりになる」「曜日のように、あまりはくり返す」「3 と 9 の倍数は位の数字の和で見分ける」
#   を約束した事実として使った。N-022 ができたら、言い方をそちらに合わせる。
# あまりの決め方：整数 a を正の整数 m でわったあまり r は、a = m × q + r（q は整数、r は 0 以上 m 未満）。負の整数もこれで決める（1 日目の見本）。
#   check は Python の % がこの決め方と同じなので、そのまま使う。
# 文字で示すのは、和と差、数 × 1 次式（4(5k + 3) = 20k + 12）まで。2 つの 1 次式の積の展開（(3a + 1)(3b + 2)）は A-015 なので使わず、
#   2 つの数の積のあまりは N-022 の事実で決める。n(n + 1) は「n と n + 1 の積」として書くだけで、展開しない。
# 平方数のあまり（n × n を 3 でわったあまりは 0 か 1 など）は N-031、合同式の記号は N-032、2 つのあまりの条件を同時にみたす数は N-029・N-036、
#   素数（N-021）は前提にないので扱わない。「積の 1 つが 3 の倍数なら積も 3 の倍数」は N-017（倍数）の範囲で使う。
# 数は 100 まで（N-009 は前提のたどりにない）。累乗は A-009 の書き方（2⁵、上つきの数字）に「2 の 26 乗」と読みをそえ、大きな累乗はあまりと一の位だけをたずねる。
# 式を選ぶ問題の check は、選択肢ごとの式（lambda）に数を入れて選ぶ。「どの整数でも」を問う問題は、k を range(−10, 11) などで動かして確かめる。
# 日の並び（既定、ねらいは次のとおり）：
#   1 日目 導入：m でわったあまりで整数を m 組に分け、mk + r と表す。負の整数のあまり。
#   2 日目 練習：和と差のあまりを文字で計算する（(3a + 1) + (3b + 2) = 3(a + b + 1)）。
#   3 日目 練習：何倍かした数と、2 つの数の積のあまり（4n、3n + 1）。
#   4 日目 練習：あまりで場合に分けて「どんな整数でも」を調べる（連続する整数の積、n と n + 2 と n + 4）。成り立たない場合を見つける。
#   5 日目 練習：くり返しで分ける（累乗のあまりと一の位、曜日）。指数を、くり返しの長さでわったあまりで分ける。
#   6 日目 練習：位の数字で表してあまりを調べる（10a + b = 9a + (a + b)、位を入れかえた数との和と差）。
#   7 日目 わけ（③：「〜とする」で文字を決める、式を変形する、約束した事実で結ぶ。正しくないことは反例 1 つで示せる）、
#   8 日目 N-022・A-010・L-007 と混ぜる、9 日目 確認。

id: N-028
days:
  - day: 1
    items:
      - part: 見本
        text: 整数を 3 でわったあまりで分けると、どの整数も 3 つの組のどれか 1 つに入ります。k を整数として、それぞれの組の数を式で表しましょう。
        figure: "あまり 0 … −6、−3、0、3、6、9 …\nあまり 1 … −5、−2、1、4、7、10 …\nあまり 2 … −4、−1、2、5、8、11 …"
        explain: 3 でわったあまりは 0、1、2 のどれかなので、整数は 3 つの組に分かれます。あまり 0 の組は 3k、あまり 1 の組は 3k + 1、あまり 2 の組は 3k + 2（k は整数）と表せます。たとえば 14 = 3 × 4 + 2 なので、14 は 3k + 2 の組です（k = 4）。負の整数も同じきまりで分けます。あまりはいつも 0 以上でわる数より小さい数にするので、−1 = 3 × (−1) + 2 から、−1 は 3k + 2 の組です（k = −1）。どの整数もちょうど 1 つの組に入り、もれも重なりもないので、「すべての整数」について調べたいときは、3 つの組を 1 つずつ調べれば足ります（L-007 の場合分け）。正の整数 m でわったあまりで分けると、整数は m 組に分かれます。
      - part: 思い出す
        text: 47 を 5 でわったあまりはいくつですか。
        answer: 2
        check: "47 % 5"
        hints:
          - 5 の倍数で、47 をこえない いちばん大きい数はどれかな。
          - 5 × 9 はいくつかな。
          - 47 からその数をひいたのこりが、あまりだよ。
        paths:
          - [5 × 9 = 45, 47 − 45, あまり 2]
      - part: 思い出す
        text: k = 6 のとき、4k + 3 の値はいくつですか。
        answer: 27
        check: "4 * 6 + 3"
        hints:
          - 4k は 4 × k のことだね。
          - k に 6 を代入しよう。
          - かけ算を先に計算しよう。
        paths:
          - [4 × 6 + 3, 24 + 3, 27]
      - part: 今日
        text: 38 を 3k + r（k は整数、r は 0、1、2 のどれか）の形に表すと、r はいくつですか。
        answer: 2
        check: "38 % 3"
        hints:
          - r は、38 を 3 でわったあまりだね。
          - 3 の倍数で、38 をこえない いちばん大きい数はどれかな。
          - 38 からその数をひこう。
        paths:
          - [3 × 12 = 36, 38 = 3 × 12 + 2, r = 2]
      - part: 今日
        text: 4 でわると 3 あまる整数を表す式は、どれですか（k は整数）。
        choices: [4k + 3, 3k + 4, 4k − 3]
        answer: 4k + 3
        check: "[c for c, f in {'4k + 3': lambda k: 4 * k + 3, '3k + 4': lambda k: 3 * k + 4, '4k − 3': lambda k: 4 * k - 3}.items() if all(f(k) % 4 == 3 for k in range(-10, 11))][0]"
        hints:
          - 4 でわると 3 あまる数を、3、7、11、15 … と書き出そう。
          - それぞれの式に k = 0、1、2 を入れてみよう。
          - 4 の倍数より 3 大きい数を表す式をさがそう。
        paths:
          - [4 の倍数は 4k, それより 3 大きい, 4k + 3]
        note: 4k − 3 は k = 1 のとき 1 で、4 でわると 1 あまる。1 つでも合わない例があれば、その式はだめだと言える。
      - part: 今日
        text: 整数を 7 でわったあまりで分けます。あまりがいちばん大きい組の数を 7k + r と表すと、r はいくつですか。
        answer: 6
        check: "max(n % 7 for n in range(-20, 21))"
        hints:
          - 7 でわったあまりになりうる数を、全部書き出そう。
          - あまりは 0 以上で、わる数の 7 より小さいね。
          - その中でいちばん大きい数を選ぼう。
        paths:
          - [あまりは 0 から 6 の 7 通り, いちばん大きいのは 6, 7k + 6]
        note: 7 と答えやすい。あまりがわる数と同じなら、もう 1 回われる。
      - part: 挑戦
        text: −7 を 3 でわったあまりはいくつですか（あまりは 0 以上 3 未満の数にします）。
        answer: 2
        check: "(-7) % 3"
        hints:
          - −7 = 3 × □ + r の形にしよう。
          - −7 以下の 3 の倍数で、いちばん大きいものはどれかな。
          - −7 は、その数から右へいくつ進んだところかな。
        paths:
          - [−7 以下でいちばん大きい 3 の倍数は −9, −7 = 3 × (−3) + 2, あまり 2]
        note: −7 = 3 × (−2) − 1 として「あまり −1」と答えたり、7 のあまりの 1 と答えたりしやすい。あまりは 0 以上わる数未満と約束したことを確かめる。
    extra:
      - part: 今日
        text: 53 を 6k + r（k は整数、r は 0 以上 6 未満）の形に表すと、r はいくつですか。
        answer: 5
        check: "53 % 6"
        hints:
          - r は、53 を 6 でわったあまりだね。
          - 6 の倍数で、53 をこえない いちばん大きい数はどれかな。
          - 53 からその数をひこう。
        paths:
          - [6 × 8 = 48, 53 = 6 × 8 + 5, r = 5]
      - part: 今日
        text: 7 でわると 2 あまる整数を表す式は、どれですか（k は整数）。
        choices: [7k + 2, 2k + 7, 7k − 2]
        answer: 7k + 2
        check: "[c for c, f in {'7k + 2': lambda k: 7 * k + 2, '2k + 7': lambda k: 2 * k + 7, '7k − 2': lambda k: 7 * k - 2}.items() if all(f(k) % 7 == 2 for k in range(-10, 11))][0]"
        hints:
          - 7 でわると 2 あまる数を、2、9、16 … と書き出そう。
          - それぞれの式に k = 0、1 を入れてみよう。
          - 7 の倍数より 2 大きい数を表す式をさがそう。
        paths:
          - [7 の倍数は 7k, それより 2 大きい, 7k + 2]
      - part: 挑戦
        text: −10 を 4 でわったあまりはいくつですか（あまりは 0 以上 4 未満の数にします）。
        answer: 2
        check: "(-10) % 4"
        hints:
          - −10 = 4 × □ + r の形にしよう。
          - −10 以下の 4 の倍数で、いちばん大きいものはどれかな。
          - −10 は、その数から右へいくつ進んだところかな。
        paths:
          - [−10 以下でいちばん大きい 4 の倍数は −12, −10 = 4 × (−3) + 2, あまり 2]

  - day: 2
    items:
      - part: 見本
        text: 3 でわると 1 あまる数と、3 でわると 2 あまる数の和は、3 でわり切れます。文字を使って確かめましょう。
        explain: 3 でわると 1 あまる数を 3a + 1、3 でわると 2 あまる数を 3b + 2（a、b は整数）とします。2 つの数は同じとはかぎらないので、ちがう文字を使います。和は (3a + 1) + (3b + 2) = 3a + 3b + 3 = 3(a + b + 1)。a + b + 1 は整数なので、和は 3 の倍数で、3 でわり切れます。あまりの部分だけを見ると 1 + 2 = 3 で、3 でわったあまりは 0 です。和のあまりは、あまりどうしの和で決まります（N-022）。差も同じで、(3a + 2) − (3b + 1) = 3a − 3b + 1 = 3(a − b) + 1 なので、あまりは 2 − 1 = 1 です。
      - part: 思い出す
        text: 6a + 9 を 3 × （ ） の形にすると、（ ）にあてはまる式はどれですか。
        choices: [2a + 3, 2a + 9, 6a + 3]
        answer: 2a + 3
        check: "[c for c, f in {'2a + 3': lambda a: 2 * a + 3, '2a + 9': lambda a: 2 * a + 9, '6a + 3': lambda a: 6 * a + 3}.items() if all(3 * f(a) == 6 * a + 9 for a in range(-10, 11))][0]"
        hints:
          - 6a も 9 も、3 でわり切れるね。
          - 6a ÷ 3 と 9 ÷ 3 を考えよう。
          - 3 × （ ） を分配法則でもどして、6a + 9 になるか確かめよう。
        paths:
          - [6a = 3 × 2a、9 = 3 × 3, 3(2a + 3)]
      - part: 思い出す
        text: −8 を 5 でわったあまりはいくつですか（あまりは 0 以上 5 未満）。
        answer: 2
        check: "(-8) % 5"
        hints:
          - −8 = 5 × □ + r の形にしよう。
          - −8 以下の 5 の倍数で、いちばん大きいものはどれかな。
          - −8 は、その数から右へいくつ進んだところかな。
        paths:
          - [−8 以下でいちばん大きい 5 の倍数は −10, −8 = 5 × (−2) + 2, あまり 2]
      - part: 今日
        text: 5 でわると 2 あまる数と、5 でわると 4 あまる数の和を、5 でわったあまりはいくつですか。
        answer: 1
        check: "(2 + 4) % 5"
        hints:
          - 2 つの数を 5a + 2、5b + 4 とおいて、たしてみよう。
          - あまりの部分だけたすと、いくつかな。
          - その数は 5 より大きいね。5 の倍数とあまりに分けよう。
        paths:
          - [(5a + 2) + (5b + 4) = 5a + 5b + 6, = 5(a + b + 1) + 1, あまり 1]
          - [あまりどうしで 2 + 4 = 6, 6 を 5 でわったあまり, 1]
        note: 6 と答えやすい。あまりはわる数の 5 より小さくする。
      - part: 今日
        text: (4a + 3) + (4b + 3) を「4 × （整数の式） + あまり」の形（あまりは 0 以上 4 未満）にしたものは、どれですか。
        choices: [4(a + b + 1) + 2, 4(a + b) + 2, 4(a + b + 1) + 3]
        answer: 4(a + b + 1) + 2
        check: "[c for c, f in {'4(a + b + 1) + 2': lambda a, b: 4 * (a + b + 1) + 2, '4(a + b) + 2': lambda a, b: 4 * (a + b) + 2, '4(a + b + 1) + 3': lambda a, b: 4 * (a + b + 1) + 3}.items() if all(f(a, b) == (4 * a + 3) + (4 * b + 3) for a in range(-5, 6) for b in range(-5, 6))][0]"
        hints:
          - かっこを外して、同類項をまとめよう。
          - 4a + 4b + 6 の 6 を、4 と 2 に分けよう。
          - 4 でくくれる部分を、4 × （ ） にまとめよう。
        paths:
          - [4a + 4b + 6, 4a + 4b + 4 + 2, 4(a + b + 1) + 2]
        note: 4(a + b) + 6 も等しい式だが、6 は 4 以上なので「あまり」の形になっていない。
      - part: 今日
        text: 7 でわると 6 あまる数から、7 でわると 2 あまる数をひいた差を、7 でわったあまりはいくつですか。
        answer: 4
        check: "(6 - 2) % 7"
        hints:
          - 2 つの数を 7a + 6、7b + 2 とおいて、ひいてみよう。
          - 7a − 7b は 7 × （ ） の形にできるね。
          - のこったあまりの部分が、0 以上 7 未満か確かめよう。
        paths:
          - [(7a + 6) − (7b + 2) = 7a − 7b + 4, = 7(a − b) + 4, あまり 4]
      - part: 挑戦
        text: 6 でわると 1 あまる数から、6 でわると 4 あまる数をひいた差を、6 でわったあまりはいくつですか。
        answer: 3
        check: "(1 - 4) % 6"
        hints:
          - 2 つの数を 6a + 1、6b + 4 とおいて、ひいてみよう。
          - あまりの部分の差は 1 − 4 だね。あまりは 0 以上にするよ。
          - 1 日目の、負の数のあまりの決め方を思い出そう。
        paths:
          - [(6a + 1) − (6b + 4) = 6a − 6b − 3, = 6a − 6b − 6 + 3, = 6(a − b − 1) + 3, あまり 3]
        note: 「あまり −3」と答えやすい。−3 = 6 × (−1) + 3 と、1 日目の負の数のあまりにもどす。
    extra:
      - part: 今日
        text: 3 でわると 2 あまる数を 2 つたした和を、3 でわったあまりはいくつですか（2 つの数は同じでなくてよい）。
        answer: 1
        check: "(2 + 2) % 3"
        hints:
          - 2 つの数を 3a + 2、3b + 2 とおこう。
          - あまりの部分だけたすと、いくつかな。
          - その数を 3 でわったあまりを求めよう。
        paths:
          - [(3a + 2) + (3b + 2) = 3a + 3b + 4, = 3(a + b + 1) + 1, あまり 1]
      - part: 今日
        text: (5a + 4) + (5b + 3) を「5 × （整数の式） + あまり」の形（あまりは 0 以上 5 未満）にしたものは、どれですか。
        choices: [5(a + b + 1) + 2, 5(a + b) + 2, 5(a + b + 2) + 2]
        answer: 5(a + b + 1) + 2
        check: "[c for c, f in {'5(a + b + 1) + 2': lambda a, b: 5 * (a + b + 1) + 2, '5(a + b) + 2': lambda a, b: 5 * (a + b) + 2, '5(a + b + 2) + 2': lambda a, b: 5 * (a + b + 2) + 2}.items() if all(f(a, b) == (5 * a + 4) + (5 * b + 3) for a in range(-5, 6) for b in range(-5, 6))][0]"
        hints:
          - かっこを外して、同類項をまとめよう。
          - 5a + 5b + 7 の 7 を、5 と 2 に分けよう。
          - 5 でくくれる部分を、5 × （ ） にまとめよう。
        paths:
          - [5a + 5b + 7, 5a + 5b + 5 + 2, 5(a + b + 1) + 2]
      - part: 挑戦
        text: 3 でわると 1 あまる数を 5 つたした和を、3 でわったあまりはいくつですか（5 つの数は同じでなくてよい）。
        answer: 2
        check: "(1 * 5) % 3"
        hints:
          - 和のあまりは、あまりどうしの和で決まるね。
          - あまりの 1 を 5 つたすと、いくつかな。
          - その数を 3 でわったあまりを求めよう。
        paths:
          - [あまりどうしの和は 1 × 5 = 5, 5 = 3 × 1 + 2, あまり 2]

  - day: 3
    items:
      - part: 見本
        text: n を 5 でわると 3 あまるとき、4n を 5 でわったあまりを求めましょう。
        explain: n = 5k + 3（k は整数）とします。4n = 4(5k + 3) = 20k + 12 = 20k + 10 + 2 = 5(4k + 2) + 2。4k + 2 は整数なので、4n を 5 でわったあまりは 2 です。あまりの部分だけを見ると、4 × 3 = 12 を 5 でわったあまりの 2 と同じです。2 つの数の積のあまりも、あまりどうしの積のあまりで決まります（N-022）。たとえば、5 でわると 3 あまる数と 4 あまる数の積は、3 × 4 = 12 から、5 でわると 2 あまります。
      - part: 思い出す
        text: 4 でわると 3 あまる数と、4 でわると 2 あまる数の和を、4 でわったあまりはいくつですか。
        answer: 1
        check: "(3 + 2) % 4"
        hints:
          - 和のあまりは、あまりどうしの和で決まるね。
          - あまりどうしをたすと、いくつかな。
          - その数を 4 でわったあまりを求めよう。
        paths:
          - [あまりどうしで 3 + 2 = 5, 5 = 4 × 1 + 1, あまり 1]
      - part: 思い出す
        text: 3(4k + 2) を計算した式は、どれですか。
        choices: [12k + 6, 12k + 2, 7k + 5]
        answer: 12k + 6
        check: "[c for c, f in {'12k + 6': lambda k: 12 * k + 6, '12k + 2': lambda k: 12 * k + 2, '7k + 5': lambda k: 7 * k + 5}.items() if all(f(k) == 3 * (4 * k + 2) for k in range(-10, 11))][0]"
        hints:
          - 分配法則を使おう。
          - 3 を、4k にも 2 にもかけるよ。
          - k = 1 を入れて、元の式と同じ値になるか確かめよう。
        paths:
          - [3 × 4k + 3 × 2, 12k + 6]
      - part: 今日
        text: n を 7 でわると 3 あまるとき、2n を 7 でわったあまりはいくつですか。
        answer: 6
        check: "(2 * 3) % 7"
        hints:
          - n = 7k + 3 とおこう。
          - 2n = 2(7k + 3) を計算しよう。
          - 「7 × （整数の式） + あまり」の形にしよう。
        paths:
          - [2n = 2(7k + 3) = 14k + 6, = 7 × 2k + 6, あまり 6]
      - part: 今日
        text: n を 4 でわると 3 あまるとき、3n + 1 を 4 でわったあまりはいくつですか。
        answer: 2
        check: "(3 * 3 + 1) % 4"
        hints:
          - n = 4k + 3 とおこう。
          - 3n + 1 = 3(4k + 3) + 1 を計算しよう。
          - 定数の部分を、4 の倍数とあまりに分けよう。
        paths:
          - [3n + 1 = 12k + 10, = 12k + 8 + 2, = 4(3k + 2) + 2, あまり 2]
      - part: 今日
        text: 6 でわると 5 あまる 2 つの数の積を、6 でわったあまりはいくつですか（2 つの数は同じでなくてよい）。
        answer: 1
        check: "(5 * 5) % 6"
        hints:
          - 積のあまりは、あまりどうしの積のあまりで決まるね。
          - あまりどうしをかけると、いくつかな。
          - その数を 6 でわったあまりを求めよう。
        paths:
          - [あまりどうしの積は 5 × 5 = 25, 25 = 6 × 4 + 1, あまり 1]
        note: 例で 5 × 11 = 55 = 6 × 9 + 1 と確かめてもよい。
      - part: 挑戦
        text: 5 でわると 2 あまる数を 4 つかけた積を、5 でわったあまりはいくつですか（4 つの数は同じでなくてよい）。
        answer: 1
        check: "(2 * 2 * 2 * 2) % 5"
        hints:
