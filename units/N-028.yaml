  - part: 離
    id: "be330f3a88"
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - N-022
    text: 山にココナッツがいくつかあります。夜、3 人がじゅんに 1 人ずつ起きて、そのつど山を 3 等分しました。1 こあまったので、それをサルにあげ、3 等分した 1 つ分を自分のものにして、のこりを山にもどしました。朝になって、のこりの山を 3 等分すると、こんどは 2 こあまりました。はじめの山は何こでしたか。ただし、はじめの山は 100 こまでとします。
    answer: 52
    check: 'sum(n for n in range(1, 101) for a, b, c, d in (itertools.accumulate(range(3), lambda s, _: 2 * (s - 1) // 3, initial=n),) if a % 3 == 1 and b % 3 == 1 and c % 3 == 1 and d % 3 == 2)'
    hints:
    - 山が x こあるとき、1 人が起きてから山にもどすまでに、山は何こになるかな。x を使って書こう。
    - 朝の山は、3 でわって 2 あまる数。朝から夜へ、さかのぼっていくと、山の数にどんなじょうけんがつくかな。
    - じょうけんが 3 回つながるよ。1 回さかのぼるごとに、はじめの山の数に、どんな数のくり返しのきまりがつくかな。
    paths:
    - - 1 人が、山から 1 こをサルにあげ、のこりを 3 等分して 1 つ分を取り、のこりの 2 つ分を山にもどす。だから「もどしたあとの山 = (取る前の山 − 1) ÷ 3 × 2」で、さかのぼると「取る前の山 = もどしたあとの山 ÷ 2 × 3 + 1」。もどしたあとの山は 2 でわり切れなければならない
      - 朝の山を 3a + 2 とする（3 でわって 2 あまる）。これが 2 でわり切れるので、a は 2 でわり切れる数で、a = 2b とおくと、朝の山は 6b + 2。3 人めが起きたときの山は (6b + 2) ÷ 2 × 3 + 1 = 3(3b + 1) + 1 = 9b + 4
      - 9b + 4 は、2 人めがもどしたあとの山なので 2 でわり切れる。だから b も 2 でわり切れる数で、b = 2c とおくと 9b + 4 = 18c + 4。2 人めが起きたときの山は (18c + 4) ÷ 2 × 3 + 1 = 27c + 7
      - 27c + 7 は、1 人めがもどしたあとの山なので 2 でわり切れる。c を 2 でわったあまりで分ける。c = 2d なら 27c + 7 = 54d + 7 で、あまりが 1 になるので、2 でわり切れない。c = 2d + 1 なら 27c + 7 = 54d + 34 で、2 でわり切れる。だから c = 2d + 1。はじめの山は (54d + 34) ÷ 2 × 3 + 1 = 81d + 52
      - はじめの山は 81d + 52（d は 0 か、それより大きい整数）。d = 0 なら 52。d が 1 か、それより大きいと 81 + 52 が 100 をこえる。だから 52 こ。たしかめると、52 → 34 → 22 → 14 で、朝の山 14 は 3 でわって 2 あまる
    - - 1 人のあと、山は x こから (x − 1) ÷ 3 × 2 こになる
      - 山の数に 2 を足した数で見る。(x − 1) ÷ 3 × 2 + 2 を、2 = 3 ÷ 3 × 2 と書きかえると、(x − 1 + 3) ÷ 3 × 2 = (x + 2) ÷ 3 × 2。つまり、「山の数 + 2」は、1 人ごとに、毎回ちょうど 3 でわって 2 をかけた数になる
      - 3 人で 3 回なので、(朝の山 + 2) = (はじめの山 + 2) × 8 ÷ 27、つまり (はじめの山 + 2) × 8 = (朝の山 + 2) × 27。朝の山は 3 でわって 2 あまるので、朝の山 + 2 は 3 でわって 1 あまる（3a + 2 + 2 = 3(a + 1) + 1）。これを 3k + 1 と書くと、(はじめの山 + 2) × 8 = 27 × (3k + 1)
      - 27 × (3k + 1) は 8 でわり切れる。27 は 2 でわり切れないので、3k + 1 が 2 でわり切れなければならない。2 でわる、また 2 でわる、また 2 でわる、と 3 回くり返しても、27 は 2 でわり切れないので、3k + 1 は 8 でわり切れる。3k + 1 = 8j と書くと、はじめの山 + 2 = 27j
      - 8j を 3 でわったあまりで j を分ける。j = 3i なら 8j = 24i で、あまり 0。j = 3i + 1 なら 8j = 24i + 8 = 3(8i + 2) + 2 で、あまり 2。j = 3i + 2 なら 8j = 24i + 16 = 3(8i + 5) + 1 で、あまり 1。8j = 3k + 1 はあまり 1 なので、j = 3i + 2。すると、はじめの山 + 2 = 27(3i + 2) = 81i + 54
      - はじめの山 + 2 は 81 の倍数 + 54 で、はじめの山は 100 こまでなので、はじめの山 + 2 は 102 までで、i = 0 の 54 だけ。はじめの山は 52 こ。たしかめると、52 → 34 → 22 → 14 で、朝の山 14 は 3 でわって 2 あまる
    note: 工夫は 3 段：①1 人ぶんの変化「取る前の山から、もどしたあとの山」を式にする、②1 本目は朝から夜へさかのぼり、「2 でわり切れる」条件が出るたびに、あまりで分けて文字をおく（3a + 2 の a は 2 でわり切れる、27c + 7 は c を 2 でわったあまりで分ける）。2 本目は山の数に 2 を足すと、毎回ちょうど 3 分の 2 倍になる（不動点の考え方）。朝の山 + 2 が 3 でわって 1 あまることを使う、③条件を全部まとめて、はじめの山を 81 の倍数 + 52 の形（1 本目）、またははじめの山 + 2 を 81 の倍数 + 54 の形（2 本目）にして、100 こまでから 1 つに決める。2 本目は、2 でわり切れるかどうかと、3 でわったあまりの分類（j = 3i、3i + 1、3i + 2）だけで終わる。check は、はじめの山 n を 1〜100 の全部に動かし、「n、1 人めのあと、2 人めのあと、3 人めのあと」の 4 つの山のうち、はじめの 3 つ（夜の 3 回）が 3 でわって 1 あまり、最後の 1 つ（朝）が 3 でわって 2 あまるものを集めて和を出す（52 だけなので 52。答えがただ 1 つであることも、この和で確かめる）。出典：ガードナーが取り上げたココナッツとサルの古典（5 人の形が有名）。古典の 3 人の形（朝のあまりも 1）の答えは 79 なので、朝のあまりを 2 にして 79 と離した。この単元の既出は、累乗のあまり、n(n + 1)(2n + 1) の倍数、和が 3 の倍数になる選び方で、くり返す手順のあまりの条件をたどる問題はない。
  - part: 離
    id: "e2962c5964"
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - N-022
    - L-005
    - L-007
    text: 10 まいのコインが、全部うらを上にしてならんでいます。1 回の作業で、ちょうど 7 まいをえらんで、全部うら返します。10 まい全部を表にするには、作業は少なくとも何回いりますか。わけも書きましょう。
    answer: 4
    check: '(lambda M: (lambda R2: (lambda R3: min(m for m, R in [(1, M), (2, R2), (3, R3), (4, {a ^ b for a in R2 for b in R2})] if 1023 in R))({a ^ b for a in R2 for b in M}))({a ^ b for a in M for b in M}))({sum(1 << i for i in c) for c in itertools.combinations(range(10), 7)})'
    hints:
    - 全部を表にするには、1 まいのコインが何回うら返されればよいかな。作業を m 回するとき、うら返される回数の合計は何回だろう。
    - どのコインも同じ回数ではないことに気をつけよう。回数の合計と、コインごとの回数をくらべてみよう。m が小さいときから調べよう。
    - 表のまい数だけを追ってみよう。1 回の作業で、表のまい数はどれだけかわるかな。
    paths:
    - - うらから表にするには、そのコインは 2 でわり切れない回数うら返される必要がある。10 まい全部が 2 でわり切れない回数うら返されるので、m 回の作業で返される回数の合計は、2 でわり切れない数 10 この和になり、2 でわり切れる数
      - 1 回の作業で 7 まいを返すので、m 回の合計は 7 × m 回。これが 2 でわり切れる数だから、m は 2 でわり切れる数。つまり 1 回や 3 回ではできない
      - m = 2 のとき、1 回の作業で同じコインは 1 度しか返せないので、どのコインも 0 回か 1 回か 2 回しか返されない。2 でわり切れない回数は 1 回だけだから、10 まいが全部 1 回ずつで、合計は 10 回。ところが 7 × 2 = 14 で合わない。だから m = 2 ではできない
      - したがって m は 2 でわり切れる数で 2 ではないので 4 以上。m = 4 でできるか調べる。28 = 7 × 4 回の合計を、各コインの 2 でわり切れない回数（1 回か 3 回）に分けると、10 + 2 × 9 = 28 で、9 まいが 3 回、1 まいが 1 回になる
      - 4 回の作業で返さない 3 まいを {10、1、2}、{10、3、4}、{10、5、6}、{7、8、9} にする。7 まいを返すのは、これ以外の 7 まい。すると 10 番は 1 回、ほかの 9 まいは 3 回ずつ返されて、どれも 2 でわり切れない回数。10 まい全部が表になる。だから少なくとも 4 回
    - - 表のまい数だけを見る。表が h まいのとき、えらんだ 7 まいのうち表が j まいなら、表は j まいへって 7 − j まいふえるので、作業のあとの表は h + 7 − 2 × j まい。7 − 2 × j は 2 でわり切れない数なので、作業のたびに、表のまい数が 2 でわり切れるかどうかが入れかわる
      - はじめの表は 0 まい、さいごは 10 まいで、どちらも 2 でわり切れる。だから作業の回数は 2 でわり切れる数で、1 回や 3 回ではできない
      - 2 回でできるか。1 回目のあと、表は 7 まい、うらは 3 まい。2 回目にえらぶ 7 まいには、うらが 3 まいまでしかないので表が 4 まい以上入り、作業のあとの表は 7 + 7 − 2 × 4 = 6 まい以下。10 まいにならないので、2 回ではできない
      - 4 回で、表のまい数を 0 → 7 → 6 → 3 → 10 と動かせる。1 回目はうら 7 まい、2 回目は表 4 まいとうら 3 まい、3 回目は表 5 まいとうら 2 まい（このとき表 6 まい、うら 4 まいなので、えらべる）、4 回目はうら 7 まい全部をえらぶ。だから、少なくとも 4 回
    note: 考えどころは 3 つ：①どのコインも 2 でわり切れない回数うら返される必要があるので、返す回数の合計は 2 でわり切れる数になり、7 × m が 2 でわり切れる数で m は 2 でわり切れる数、②m = 2 では同じコインを 1 回の作業で 2 度返せないので、どのコインも 1 回ずつ（合計 10 回）になり、14 回と合わない、③m = 4 の作り方（9 まいが 3 回、1 まいが 1 回で合計 28 回。返さない 3 まいを {10、1、2}、{10、3、4}、{10、5、6}、{7、8、9} にする）。2 本目は 1 本目とちがい、コインを 1 まいずつ見ず、表のまい数 1 つだけを追う。1 回の作業で表のまい数は 7 − 2 × j（2 でわり切れない数）だけかわるので、2 でわり切れるかどうかが毎回入れかわること、2 回目のあとは表が 6 まい以下であることを使い、4 回の作り方も表のまい数の動き 0 → 7 → 6 → 3 → 10 からさがす（1 本目はコインごとの回数の合計、2 本目は表のまい数の動き）。m が 2 でわり切れることの根は、2 本とも同じ「2 でわり切れるかどうか」で、ちがうのは 2 回を落とすわけと 4 回の作り方。check は、7 まいの選び方 120 通りを 10 けたの 2 進のしるし（返したコインを 1 にする）にして、^（ちがうところだけ 1 にする計算）で作業をつなげ、m 回でとどくならびの集まりを m = 1 から 4 まで作り、全部表（1023）が入るいちばん小さい m を出す式。「k まいずつ返す」は知られた型で、数は自作。10 ÷ 7 から 2 回と答えてしまうのがわな。L-009 の円の 12 まいのコイン（4 まいずつ、できるならびの数をたずねる問題）とは、問いがちがう。
