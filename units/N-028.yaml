        choices: [11(a + b), 10(a + b), 11(a − b)]
        answer: 11(a + b)
        check: "[c for c, f in {'11(a + b)': lambda a, b: 11 * (a + b), '10(a + b)': lambda a, b: 10 * (a + b), '11(a − b)': lambda a, b: 11 * (a - b)}.items() if all(f(a, b) == (10 * a + b) + (10 * b + a) for a in range(1, 10) for b in range(1, 10))][0]"
        hints:
          - (10a + b) + (10b + a) のかっこを外そう。
