2" width="64" height="24" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7fc8f8" fill-opacity="0.45"/><text x="96" y="169" font-size="14" text-anchor="middle" fill="currentColor">16</text><rect x="128" y="152" width="64" height="24" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7bc96f" fill-opacity="0.45"/><text x="160" y="169" font-size="14" text-anchor="middle" fill="currentColor">17</text><rect x="192" y="152" width="64" height="24" rx="0" stroke="currentColor" stroke-width="1.2" fill="#f3c969" fill-opacity="0.45"/><text x="224" y="169" font-size="14" text-anchor="middle" fill="currentColor">18</text><rect x="64" y="176" width="64" height="24" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7fc8f8" fill-opacity="0.45"/><text x="96" y="193" font-size="14" text-anchor="middle" fill="currentColor">19</text><rect x="128" y="176" width="64" height="24" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7bc96f" fill-opacity="0.45"/><text x="160" y="193" font-size="14" text-anchor="middle" fill="currentColor">20</text></svg>'
