        explain: n を 2 でわったあまりは 0 か 1 なので、2 つの場合に分けます。k を整数とします。① n = 2k のとき、n がぐう数なので、n(n + 1) = 2k × (n + 1) は 2 × （整数）の形でぐう数です。② n = 2k + 1 のとき、n + 1 = 2k + 2 = 2(k + 1) がぐう数なので、n(n + 1) も 2 × （整数）の形でぐう数です。どちらの場合もぐう数で、どの整数もこの 2 つの場合のどちらかに必ず入るので、どんな整数 n でも n(n + 1) はぐう数です。かけ合わせる数の 1 つが 2 の《倍数》なら、積も 2 の倍数です（N-017）。このように、あまりで分けると「どんな整数でも」を有限の場合だけで調べられます。
