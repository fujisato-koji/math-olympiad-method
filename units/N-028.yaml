# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "1b5c2d8741"
    kinds: [道筋]
    text: 1 から 100 までの《整数》 n のうち、n(n + 1)(2n + 1) が 5 の《倍数》になるものは何こありますか。
    answer: 60
    check: "len([n for n in range(1, 101) if n * (n + 1) * (2 * n + 1) % 5 == 0])"
    hints:
      - n を 5 でわったあまりで、整数を 5 つの組に分けよう。
      - text: あまりが 0、1、2、3、4 のそれぞれで、n + 1 と 2n + 1 のあまりを表にしよう。どれかが 0 なら 5 の倍数だね。
        svg: '<svg viewBox="0 0 320 136" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="14" width="96" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="68" y="35" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">n のあまり</text><rect x="116" y="14" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="136" y="35" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">0</text><rect x="156" y="14" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="176" y="35" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><rect x="196" y="14" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="216" y="35" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><rect x="236" y="14" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="256" y="35" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><rect x="276" y="14" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="296" y="35" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">4</text><rect x="20" y="46" width="96" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="68" y="67" font-size="14" text-anchor="middle" fill="currentColor">n + 1</text><rect x="116" y="46" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="156" y="46" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="196" y="46" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="236" y="46" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="276" y="46" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="20" y="78" width="96" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="68" y="99" font-size="14" text-anchor="middle" fill="currentColor">2n + 1</text><rect x="116" y="78" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="156" y="78" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="196" y="78" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="236" y="78" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="276" y="78" width="40" height="32" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="160" y="130" font-size="13" text-anchor="middle" fill="currentColor">あいたますに、5 でわったあまりを書こう</text></svg>'
      - 3 つの数の積は、どれか 1 つが 5 の倍数なら 5 の倍数だね。1 から 100 までに、あまりが同じ数は何こずつあるかな。
    paths:
      - [n を 5 でわったあまりで分ける, あまり 0 なら n、あまり 4 なら n + 1、あまり 2 なら 2n + 1 が 5 の倍数, あまり 1 では n + 1 と 2n + 1 のあまりが 2 と 3、あまり 3 では 4 と 2 で どれも 5 の倍数でない, あまり 0・2・4 の数は 20 こずつ, 60 こ]
