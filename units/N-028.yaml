      - part: わけ
        id: "eb13d78dfd"
        text: 「どんな整数 n でも、n(n + 1)(n + 2) は 4 の倍数である」は正しいでしょうか。正しくないなら、そのことをしめしましょう。
        svg: '<svg viewBox="0 0 320 152" xmlns="http://www.w3.org/2000/svg"><rect x="70" y="10" width="180" height="34" rx="8" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.35"/><text x="160" y="32" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">いつも 4 の倍数？</text><line x1="150" y1="44" x2="88" y2="72" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="170" y1="44" x2="232" y2="72" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="82,76 84.3,67.4 90.1,71.5" fill="currentColor"/><polygon points="238,76 229.9,71.5 235.7,67.4" fill="currentColor"/><rect x="12" y="80" width="140" height="62" rx="8" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.25"/><text x="82" y="99" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">正しいなら</text><text x="82" y="117" font-size="13" text-anchor="middle" fill="currentColor">すべての場合を</text><text x="82" y="134" font-size="13" text-anchor="middle" fill="currentColor">調べる</text><rect x="168" y="80" width="140" height="62" rx="8" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.25"/><text x="238" y="99" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">正しくないなら</text><text x="238" y="117" font-size="13" text-anchor="middle" fill="currentColor">あてはまらない n を</text><text x="238" y="134" font-size="13" text-anchor="middle" fill="currentColor">1 つ見つける</text></svg>'
        explain: 例：「正しくない。n = 1 のとき、1 × 2 × 3 = 6 で、6 は 4 の倍数ではない。1 つでも成り立たない整数があるので、『どんな整数 n でも 4 の倍数』とはいえない。」と書ければよい。「どんな整数でも」を示すにはすべての場合を調べる必要があるが、正しくないことを示すには、成り立たない例（反例）が 1 つあれば足りる。この 2 つのちがいが言えるかをたずねる。4 でわったあまりで分けると、n = 4k + 1 の場合だけが 4 の倍数にならないこと（n = 5 でも 5 × 6 × 7 = 210 は 4 の倍数でない）まで調べられたら、なおよい。
        hints:
          - text: n = 1、2、3、4 の積を書いたよ。4 の倍数になるか調べよう。
            svg: '<svg viewBox="0 0 320 166" xmlns="http://www.w3.org/2000/svg"><rect x="55" y="14" width="60" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="85" y="34" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">n</text><rect x="115" y="14" width="150" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="190" y="34" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">n(n + 1)(n + 2)</text><rect x="55" y="44" width="60" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="85" y="64" font-size="14" text-anchor="middle" fill="currentColor">1</text><rect x="115" y="44" width="150" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="190" y="64" font-size="14" text-anchor="middle" fill="currentColor">1 × 2 × 3</text><rect x="55" y="74" width="60" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="85" y="94" font-size="14" text-anchor="middle" fill="currentColor">2</text><rect x="115" y="74" width="150" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="190" y="94" font-size="14" text-anchor="middle" fill="currentColor">2 × 3 × 4</text><rect x="55" y="104" width="60" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="85" y="124" font-size="14" text-anchor="middle" fill="currentColor">3</text><rect x="115" y="104" width="150" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="190" y="124" font-size="14" text-anchor="middle" fill="currentColor">3 × 4 × 5</text><rect x="55" y="134" width="60" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="85" y="154" font-size="14" text-anchor="middle" fill="currentColor">4</text><rect x="115" y="134" width="150" height="30" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="190" y="154" font-size="14" text-anchor="middle" fill="currentColor">4 × 5 × 6</text></svg>'
          - 1 つでも 4 の倍数にならない n があれば、どうなるかな。
          - 「n = □ のとき〜。だから〜。」と書いてみよう。
        paths:
          - [n = 1 で 1 × 2 × 3 = 6, 6 は 4 の倍数でない, 反例が 1 つあるので正しくない]
          - [4 でわったあまりで分ける, n = 4k + 1 のときだけ 4 の倍数にならない, だから正しくない]
