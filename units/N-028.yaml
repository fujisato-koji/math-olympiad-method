  - day: 2
    items:
      - part: 見本
        id: "30be7a2729"
        text: 3 でわると 1 あまる数と、3 でわると 2 あまる数の和は、3 でわり切れます。文字を使ってたしかめましょう。
        svg: '<svg viewBox="0 0 320 204" xmlns="http://www.w3.org/2000/svg"><text x="66" y="39" font-size="14" text-anchor="end" fill="currentColor" font-weight="bold">3a + 1</text><rect x="74" y="25" width="40" height="18" rx="4" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.35"/><circle cx="83" cy="34" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="94" cy="34" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="105" cy="34" r="3.2" fill="currentColor" fill-opacity="1"/><rect x="119" y="25" width="40" height="18" rx="4" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.35"/><circle cx="128" cy="34" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="139" cy="34" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="150" cy="34" r="3.2" fill="currentColor" fill-opacity="1"/><text x="172" y="39" font-size="16" text-anchor="middle" fill="currentColor">…</text><text x="125" y="59" font-size="13" text-anchor="middle" fill="currentColor">3 こ組が a 組</text><circle cx="200.6" cy="34" r="4.4" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1"/><text x="66" y="103" font-size="14" text-anchor="end" fill="currentColor" font-weight="bold">3b + 2</text><rect x="74" y="89" width="40" height="18" rx="4" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.35"/><circle cx="83" cy="98" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="94" cy="98" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="105" cy="98" r="3.2" fill="currentColor" fill-opacity="1"/><rect x="119" y="89" width="40" height="18" rx="4" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.35"/><circle cx="128" cy="98" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="139" cy="98" r="3.2" fill="currentColor" fill-opacity="1"/><circle cx="150" cy="98" r="3.2" fill="currentColor" fill-opacity="1"/><text x="172" y="103" font-size="16" text-anchor="middle" fill="currentColor">…</text><text x="125" y="123" font-size="13" text-anchor="middle" fill="currentColor">3 こ組が b 組</text><circle cx="200.6" cy="98" r="4.4" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1"/><circle cx="211.6" cy="98" r="4.4" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1"/><text x="212.6" y="14" font-size="13" text-anchor="middle" fill="currentColor">あまり</text><rect x="216" y="157" width="40" height="18" rx="4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/><circle cx="225" cy="166" r="3.6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1"/><circle cx="236" cy="166" r="3.6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1"/><circle cx="247" cy="166" r="3.6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1"/><text x="204" y="162" font-size="13" text-anchor="end" fill="currentColor">あまりを合わせると</text><text x="204" y="180" font-size="13" text-anchor="end" fill="currentColor">1 + 2 = 3 こで、1 組</text><text x="236" y="196" font-size="13" text-anchor="middle" fill="currentColor">新しい 1 組</text></svg>'
        explain: 3 でわると 1 あまる数を 3a + 1、3 でわると 2 あまる数を 3b + 2（a、b は《整数》）とします。2 つの数は同じとはかぎらないので、ちがう文字を使います。和は (3a + 1) + (3b + 2) = 3a + 3b + 3 = 3(a + b + 1)。a + b + 1 は整数なので、和は 3 の《倍数》で、3 でわり切れます。あまりの部分だけを見ると 1 + 2 = 3 で、3 でわったあまりは 0 です。和のあまりは、あまりどうしの和で決まります（N-022）。差も同じで、(3a + 2) − (3b + 1) = 3a − 3b + 1 = 3(a − b) + 1 なので、あまりは 2 − 1 = 1 です。
