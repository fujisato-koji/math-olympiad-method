 text-anchor="middle" fill="currentColor">8</text><rect x="86" y="140" width="70" height="22" rx="0" stroke="currentColor" stroke-width="1.2" fill="#f3c969" fill-opacity="0.45"/><text x="121" y="156" font-size="14" text-anchor="middle" fill="currentColor">9</text><rect x="156" y="140" width="70" height="22" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7fc8f8" fill-opacity="0.45"/><text x="191" y="156" font-size="14" text-anchor="middle" fill="currentColor">10</text><rect x="226" y="140" width="70" height="22" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7bc96f" fill-opacity="0.45"/><text x="261" y="156" font-size="14" text-anchor="middle" fill="currentColor">11</text><rect x="86" y="162" width="70" height="22" rx="0" stroke="currentColor" stroke-width="1.2" fill="#f3c969" fill-opacity="0.45"/><text x="121" y="178" font-size="14" text-anchor="middle" fill="currentColor">12</text><rect x="156" y="162" width="70" height="22" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7fc8f8" fill-opacity="0.45"/><text x="191" y="178" font-size="14" text-anchor="middle" fill="currentColor">13</text><rect x="226" y="162" width="70" height="22" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7bc96f" fill-opacity="0.45"/><text x="261" y="178" font-size="14" text-anchor="middle" fill="currentColor">14</text><text x="78" y="68" font-size="13" text-anchor="end" fill="currentColor">k = −1</text><text x="78" y="90" font-size="13" text-anchor="end" fill="currentColor">k = 0</text><text x="78" y="112" font-size="13" text-anchor="end" fill="currentColor">k = 1</text><text x="78" y="134" font-size="13" text-anchor="end" fill="currentColor">k = 2</text><text x="78" y="156" font-size="13" text-anchor="end" fill="currentColor">k = 3</text><text x="78" y="178" font-size="13" text-anchor="end" fill="currentColor">k = 4</text></svg>'
        explain: 3 でわったあまりは 0、1、2 のどれかなので、整数は 3 つの組に分かれます。あまり 0 の組は 3k、あまり 1 の組は 3k + 1、あまり 2 の組は 3k + 2（k は整数）と表せます。たとえば 14 = 3 × 4 + 2 なので、14 は 3k + 2 の組です（k = 4）。負の整数も同じきまりで分けます。あまりはいつも 0 以上でわる数より小さい数にするので、−1 = 3 × (−1) + 2 から、−1 は 3k + 2 の組です（k = −1）。どの整数もちょうど 1 つの組に入り、もれも重なりもないので、「すべての整数」について調べたいときは、3 つの組を 1 つずつ調べれば足ります（L-007 の場合分け）。正の整数 m でわったあまりで分けると、整数は m 組に分かれます。
