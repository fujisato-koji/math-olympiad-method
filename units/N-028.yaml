ll-opacity="0.85" stroke="currentColor" stroke-width="1"/><circle cx="163.6" cy="190" r="4.4" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1"/><text x="182" y="195" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">← あまり 2</text></svg>'
        explain: n = 5k + 3（k は《整数》）とします。4n = 4(5k + 3) = 20k + 12 = 20k + 10 + 2 = 5(4k + 2) + 2。4k + 2 は整数なので、4n を 5 でわったあまりは 2 です。あまりの部分だけを見ると、4 × 3 = 12 を 5 でわったあまりの 2 と同じです。2 つの数の積のあまりも、あまりどうしの積のあまりで決まります（N-022）。たとえば、5 でわると 3 あまる数と 4 あまる数の積は、3 × 4 = 12 から、5 でわると 2 あまります。
