        explain: 例：「k を整数とする。n を 3 でわったあまりは 0、1、2 のどれかである。(1) n = 3k のとき、n が 3 の倍数。(2) n = 3k + 1 のとき、n + 2 = 3k + 3 = 3(k + 1) が 3 の倍数。(3) n = 3k + 2 のとき、n + 1 = 3k + 3 = 3(k + 1) が 3 の倍数。どの場合も、かけ合わせる 3 つの数のどれかが 3 の倍数なので、積 n(n + 1)(n + 2) は 3 の倍数である。どの整数も 3 つの場合のどれかに入るので、どんな整数 n でも成り立つ。」と書ければよい。① k を整数とし、あまりで 3 つの場合を決める、② 場合ごとに 3(k + 1) などに変形する、③「積の 1 つが 3 の倍数なら積も 3 の倍数」（N-017）と「どの整数もどれかの場合に入る」で結ぶ、の 3 つを見る。3 つの場合のうち 1 つでも書きもらしていたら、もれがあることを伝える。
