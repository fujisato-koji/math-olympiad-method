    note: くり返しの長さが 2 の累乗では 3、3 の累乗では 6 とちがうので、別々に調べてから和のあまりにする（N-022 の和のあまり）。指数をくり返しの長さでわったあまりが 0 のとき（くり返しの最後）と、あまり 2 のとき（2 番目）の読み方を取りちがえやすい。2⁵⁰ と 3⁵⁰ のくり返しを同じ長さだと思いこむまちがいもある。
