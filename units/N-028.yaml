        answer: 11
        check: "max(d for d in range(1, 100) if all(((10 * a + b) + (10 * b + a)) % d == 0 for a in range(1, 10) for b in range(1, 10)))"
        hints:
          - 2 けたの整数を 10a + b、入れかえた数を 10b + a とおこう。
          - text: a は 10a と a、b は b と 10b。同じ文字に色をそろえたよ。2 つの和を計算して、まとめよう。
            svg: '<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg"><rect x="110" y="14" width="56" height="34" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="138" y="36.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">十の位</text><rect x="166" y="14" width="56" height="34" rx="0" stroke="currentColor" stroke-width="1.2" fill="none"/><text x="194" y="36.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">一の位</text><rect x="110" y="48" width="56" height="34" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7fc8f8" fill-opacity="0.45"/><text x="138" y="70.8" font-size="16" text-anchor="middle" fill="currentColor">10a</text><rect x="166" y="48" width="56" height="34" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7bc96f" fill-opacity="0.45"/><text x="194" y="70.8" font-size="16" text-anchor="middle" fill="currentColor">b</text><rect x="110" y="82" width="56" height="34" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7bc96f" fill-opacity="0.45"/><text x="138" y="104.8" font-size="16" text-anchor="middle" fill="currentColor">10b</text><rect x="166" y="82" width="56" height="34" rx="0" stroke="currentColor" stroke-width="1.2" fill="#7fc8f8" fill-opacity="0.45"/><text x="194" y="104.8" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="92" y="105" font-size="20" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="80" y1="119" x2="232" y2="119" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
          - a + b はいろいろな数になるね。いつもわり切れるのは何かな。
        paths:
          - [(10a + b) + (10b + a) = 11a + 11b, = 11(a + b), いつも 11 の倍数]
        note: 例（12 + 21 = 33、19 + 91 = 110）で、11 より大きい数ではいつもわり切れるとはいえないことも確かめる。
