235.6" y="63" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">7</text><circle cx="265.8" cy="58" r="10.5" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="265.8" y="63" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">8</text><circle cx="296" cy="58" r="10.5" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="296" y="63" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">9</text><circle cx="24" cy="96" r="7" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="36" y="101" font-size="13" text-anchor="start" fill="currentColor">n = 2k（ぐう数）</text><circle cx="159.4" cy="96" r="7" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="171.4" y="101" font-size="13" text-anchor="start" fill="currentColor">n = 2k + 1（き数）</text></svg>'
        explain: 例：「連続する 2 つの整数を n、n + 1（n は整数）とする。n を 2 でわったあまりは 0 か 1 である。(1) あまりが 0 のとき、n = 2k（k は整数）と表せるので、n(n + 1) = 2k(n + 1) = 2 × k(n + 1)。k(n + 1) は整数なので、積はぐう数。(2) あまりが 1 のとき、n = 2k + 1 と表せるので、n + 1 = 2k + 2 = 2(k + 1)。n(n + 1) = 2 × n(k + 1) で、n(k + 1) は整数なので、積はぐう数。どの整数も (1)、(2) のどちらかに入るので、連続する 2 つの整数の積はぐう数である。」と書ければよい。①「〜とする」で n と k を決める、② 場合ごとに 2 × （整数）の形に変形する、③「どの整数もどちらかの場合に入る」で結ぶ、の 3 つを見る。場合分けにもれがないこと（あまりは 0 か 1 だけ）を書いているかを特に見る。1 × 2、2 × 3 のような例だけで終わったら、例ではすべての場合を示せないことを話す。
        hints:
          - 連続する 2 つの整数を n、n + 1 とおき、n = 2k と n = 2k + 1 の 2 つの場合に分けよう。
          - text: それぞれの場合に、2 こ組だけでできている数はどれかな。
