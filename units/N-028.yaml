        choices: [日, 月, 火, 水, 木, 金, 土]
        answer: 月
        check: "'日月火水木金土'[(0 + pow(2, 30, 7)) % 7]"
        hints:
          - 曜日は 7 日ごとにくり返すので、2³⁰ を 7 でわったあまりが分かればよいね。
          - text: あまりだけを追いかけよう。2 をかけるたびに、7 でわったあまりにするよ。
