        paths:
          - [n を 3 でわったあまりで 3 つの場合に分ける, 3k なら n、3k + 1 なら n + 2、3k + 2 なら n + 1 が 3 の倍数, どの場合も積は 3 の倍数, どの整数もどれかに入るので成り立つ]
      - part: わけ
        text: 「どんな整数 n でも、n(n + 1)(n + 2) は 4 の倍数である」は正しいでしょうか。正しくないなら、そのことを示しましょう。
        explain: 例：「正しくない。n = 1 のとき、1 × 2 × 3 = 6 で、6 は 4 の倍数ではない。1 つでも成り立たない整数があるので、『どんな整数 n でも 4 の倍数』とはいえない。」と書ければよい。「どんな整数でも」を示すにはすべての場合を調べる必要があるが、正しくないことを示すには、成り立たない例（反例）が 1 つあれば足りる。この 2 つのちがいが言えるかをたずねる。4 でわったあまりで分けると、n = 4k + 1 の場合だけが 4 の倍数にならないこと（n = 5 でも 5 × 6 × 7 = 210 は 4 の倍数でない）まで調べられたら、なおよい。
