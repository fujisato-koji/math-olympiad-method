weight="bold">?</text><text x="280" y="75" font-size="14" text-anchor="middle" fill="currentColor">2⁴</text></svg>'
          - 30 を、くり返しの長さでわったあまりを求めよう。日曜日から、2³⁰ のあまりの日数だけ進もう。
        paths:
          - [2 の累乗を 7 でわったあまりは 2、4、1 のくり返し, 30 = 3 × 10 で 3 番目の 1, 日曜日の 1 日後]
          - [2³ = 8 は 7 でわると 1 あまる, 2³⁰ は 2³ を 10 回かけた数なので、あまりは 1, 日曜日の 1 日後で 月曜日]

