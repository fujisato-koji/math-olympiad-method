      - part: わけ
        id: "97a09e1f95"
        text: H₂O の沸点は 100 ℃ で、しつりょうが大きい H₂S の −60 ℃ より、ずっと高い。ファンデルワールス力だけなら、重い H₂S のほうが高いはずである。H₂O の沸点が高いのは、なぜか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="203.5" y1="68.9" x2="188.5" y2="89.1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="216.5" y1="68.9" x2="231.5" y2="89.1" fill="none" stroke="currentColor" stroke-width="2"/><text x="210" y="65.2" font-size="15" text-anchor="middle" fill="currentColor">O</text><text x="182" y="103.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="238" y="103.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><line x1="86.6" y1="121.2" x2="103.4" y2="98.8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="72.8" y1="121.7" x2="59.2" y2="106.3" fill="none" stroke="currentColor" stroke-width="2"/><text x="80" y="135.2" font-size="15" text-anchor="middle" fill="currentColor">O</text><text x="110" y="95.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="52" y="103.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><line x1="122" y1="96" x2="198" y2="66" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="5 4"/><text x="108" y="68" font-size="14" text-anchor="middle" fill="currentColor">δ+</text><text x="222" y="36" font-size="14" text-anchor="middle" fill="currentColor">δ−</text></svg>'
        choices: [水素結合ができるから, H₂O の結合が強いから, H₂O のほうが重いから]
        answer: 水素結合ができるから
        check: "'水素結合ができるから'"
        explain: ファンデルワールス力だけなら、しつりょうの小さい H₂O は H₂S より沸点が低くなるはずである。じっさいに高いのは、O の電気陰性度が大きく、H₂O の H が強い δ+、O が強い δ− になって、分子どうしが水素結合で強く引き合うからである。S は電気陰性度が小さいので、H₂S では水素結合がほとんどできない。沸点は分子の中の共有結合の強さではなく、分子間の引力の強さで決まる。
        hints:
          - 沸点は、分子と分子を引きはなすのに要るエネルギーで決まる。
          - text: H₂O の分子のあいだにある、赤い点線は何か。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="203.5" y1="68.9" x2="188.5" y2="89.1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="216.5" y1="68.9" x2="231.5" y2="89.1" fill="none" stroke="currentColor" stroke-width="2"/><text x="210" y="65.2" font-size="15" text-anchor="middle" fill="currentColor">O</text><text x="182" y="103.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="238" y="103.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><line x1="86.6" y1="121.2" x2="103.4" y2="98.8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="72.8" y1="121.7" x2="59.2" y2="106.3" fill="none" stroke="currentColor" stroke-width="2"/><text x="80" y="135.2" font-size="15" text-anchor="middle" fill="currentColor">O</text><text x="110" y="95.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="52" y="103.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><line x1="122" y1="96" x2="198" y2="66" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="5 4"/><circle cx="160" cy="80" r="30" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - N、O、F につく H が、となりの分子の非共有電子対と引き合う。
        paths:
          - [沸点は分子間の引力で決まる, 重さからは H₂S のほうが高いはず, じっさいは H₂O が高い, 水素結合が加わる]
          - [H₂O の O は電気陰性度が大きい, H が強い δ+ になる, となりの分子の O と引き合う, 引力が強く沸点が高い]
