    text: "水素結合は、H と、F・O・N の非共有電子対のあいだにできます。1 本の水素結合には、H を 1 つと、非共有電子対を 1 つ使います。1 つの H も 1 つの非共有電子対も、使えるのは 1 回までです。また、同じ分子の中の H と非共有電子対では結べません。図のように、H₂O が 5 分子、NH₃ が 6 分子、HF が 4 分子まざっているとき、できる水素結合の本数は最大でいくつですか。"
