    hints:
      - 1 本ごとに、H が 1 つと非共有電子対が 1 つ使われます。分子ごとに数えず、ぜんぶの H とぜんぶの非共有電子対の数を出してみます。
      - text: 電子式を書くと、F、O、N の非共有電子対の数がそれぞれ分かります。H と非共有電子対の、どちらの数が足りなくなるか見ます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="71" y1="60" x2="99" y2="60" fill="none" stroke="currentColor" stroke-width="2"/><text x="60" y="65.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="110" y="65.2" font-size="15" text-anchor="middle" fill="currentColor">F</text><circle cx="110" cy="60" r="18" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="85" y="110" font-size="14" text-anchor="middle" fill="currentColor">F のまわり</text></svg>'
      - 足りないほうの数が、本数のじょうげんです。ほかの分子の H としかつながらないことを考えても、その数までつくれるかたしかめます。
    paths:
      - ["非共有電子対は H₂O が 2、NH₃ が 1、HF が 3。H は H₂O が 2、NH₃ が 3、HF が 1", "ぜんぶの H は 10 + 18 + 4 = 32、ぜんぶの非共有電子対は 10 + 6 + 12 = 28", "1 本ごとに H と非共有電子対を 1 つずつ使うので、少ないほうの 28 本がじょうげん", "じょうげんになるか：HF の非共有電子対 12 は NH₃ や H₂O の H（28 こ）から受けられる。ほかも同じで、28 本つくれる"]
      - ["非共有電子対の側から作ってみせる。HF の 4 分子（非共有電子対 12）に、NH₃ の H を 12 こ向ける", "H₂O の 5 分子（非共有電子対 10）に、残りの NH₃ の H 6 こ と HF の H 4 こを向ける", "NH₃ の 6 分子（非共有電子対 6）に、H₂O の H 10 こ のうち 6 こを向ける（自分の分子とはつながない）。全部で 12 + 10 + 6 = 28 本"]
    note: "借りた構造：S10（上限の評価）、S05（H と非共有電子対を別々に数える）、S12（実際に作ってみせて上限を確かめる）。種：なし（構造のいちらんから組み立てた）。むずかしい理由：分子ごとに最大の本数を足すとまちがえる、電子式から非共有電子対の数を出す、少ないほうが上限になる理由と達成できることの両方を示す、の 3 段。H-014（電子式と非共有電子対）と組み合わせる。"
  - part: 離
    kinds: [道筋, 手数]
    uses: [H-014, G-027]
    text: "ベンゼンの形の、平らな正六角形の輪があります。6 つの C に、図のように 1 から 6 の番号をつけ、それぞれの C に H がついています。この H のうち 1 つ以上を、好きなだけ Cl にかえます。C–Cl の結合の極性は、どれも同じ長さの矢印（Cl の向き）で表し、C–H の極性は小さいので 0 とします。分子ぜんたいの矢印を足して 0 になる（極性がない）ものは、どの位置を Cl にするかを区別して数えると、全部で何通りですか。"
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="160,40 212,70 212,130 160,160 108,130 108,70" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="40" r="12" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="160" y="45" font-size="14" text-anchor="middle" fill="currentColor">1</text><circle cx="212" cy="70" r="12" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="212" y="75" font-size="14" text-anchor="middle" fill="currentColor">2</text><circle cx="212" cy="130" r="12" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="212" y="135" font-size="14" text-anchor="middle" fill="currentColor">3</text><circle cx="160" cy="160" r="12" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="160" y="165" font-size="14" text-anchor="middle" fill="currentColor">4</text><circle cx="108" cy="130" r="12" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="108" y="135" font-size="14" text-anchor="middle" fill="currentColor">5</text><circle cx="108" cy="70" r="12" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="108" y="75" font-size="14" text-anchor="middle" fill="currentColor">6</text><text x="160" y="105" font-size="15" text-anchor="middle" fill="currentColor">C₆</text><line x1="160" y1="28" x2="160" y2="12" fill="none" stroke="currentColor" stroke-width="2"/><line x1="224" y1="64" x2="240" y2="55" fill="none" stroke="currentColor" stroke-width="2"/><line x1="224" y1="136" x2="240" y2="145" fill="none" stroke="currentColor" stroke-width="2"/><line x1="160" y1="172" x2="160" y2="188" fill="none" stroke="currentColor" stroke-width="2"/><line x1="96" y1="136" x2="80" y2="145" fill="none" stroke="currentColor" stroke-width="2"/><line x1="96" y1="64" x2="80" y2="55" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
    answer: 9
    check: "sum(1 for m in range(1,64) if all(sum(((1,0),(0,1),(-1,1),(-1,0),(0,-1),(1,-1))[i][c] for i in range(6) if m>>i&1)==0 for c in (0,1)))"
    hints:
      - 6 つの位置の矢印は、向きが 60 度ずつちがう、同じ長さの 6 本です。足して 0 になる選び方に、決まった型があります。
      - text: 向きが反対の 2 本は打ち消し合います。ほかにも、足して 0 になる 3 本の組があります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="160,40 212,70 212,130 160,160 108,130 108,70" fill="none" stroke="currentColor" stroke-width="2"/><line x1="160" y1="40" x2="160" y2="160" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="160" y1="40" x2="212" y2="130" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="212" y1="130" x2="108" y2="130" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="108" y1="130" x2="160" y2="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/></svg>'
      - 6 つぜんぶを Cl にすると 0 になります。そのことは、Cl の数が 4 つや 5 つのときを考えるのに使えます。
    paths:
      - ["Cl の数で場合分けする。1 つは 0 にならない。2 つは反対の位置（1 と 4、2 と 5、3 と 6）の 3 通り", "3 つは正三角形の位置（1・3・5 と 2・4・6）の 2 通り。4 つは、6 つぜんぶで 0 なので、残りの 2 つが足して 0、つまり反対の位置の 3 通り", "5 つは、残りの 1 つが 0 にならないので 0 通り。6 つは 1 通り。合わせて 3 + 2 + 3 + 0 + 1 = 9"]
      - ["向きを 2 本の組 3 つ（1 と 4、2 と 5、3 と 6）に分けて、反対の位置を 2 つとも Cl にするか、2 つとも H にするかで選ぶ。ただし 1 つ以上は Cl", "組ごとに 2 通りで 2 × 2 × 2 = 8 通り。Cl が 0 のものを引いて 7 通り", "組にならない型として、正三角形の位置の 2 通りが加わる。7 + 2 = 9"]
    note: "借りた構造：S03（反対の位置は打ち消す）、S15（Cl の数で場合分け）、S16（全部が 0 になることから残りを考える）、S25（ベクトル）。種：なし（構造のいちらんから組み立てた）。むずかしい理由：足して 0 になる型が反対の 2 本だけでなく正三角形の 3 本もあると気づく、数え落としと重ねて数えるのをさける、の 2 段。H-014（結合の極性）、G-027（ベクトル）と組み合わせる。"
