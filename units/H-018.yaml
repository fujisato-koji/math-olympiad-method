    items:
      - part: 見本
        id: "cd159a5a0f"
        text: 分子と分子のあいだには、弱い引力（ファンデルワールス力）がはたらく。分子が大きく重いほど、この力は強い。えきたいが気体になるときは、この引力をふりきるので、力が強いほど沸点が高い。表のように、ハロゲンの分子は重いほど沸点が高い。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="30" width="64" height="34" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="62" y="51.9" font-size="14" text-anchor="middle" fill="currentColor">分子</text><rect x="94" y="30" width="64" height="34" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="126" y="51.9" font-size="14" text-anchor="middle" fill="currentColor">Cl₂</text><rect x="158" y="30" width="64" height="34" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="190" y="51.9" font-size="14" text-anchor="middle" fill="currentColor">Br₂</text><rect x="222" y="30" width="64" height="34" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="254" y="51.9" font-size="14" text-anchor="middle" fill="currentColor">I₂</text><rect x="30" y="64" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="62" y="85.9" font-size="14" text-anchor="middle" fill="currentColor">しつりょう</text><rect x="94" y="64" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="126" y="85.9" font-size="14" text-anchor="middle" fill="currentColor">71</text><rect x="158" y="64" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="190" y="85.9" font-size="14" text-anchor="middle" fill="currentColor">160</text><rect x="222" y="64" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="254" y="85.9" font-size="14" text-anchor="middle" fill="currentColor">254</text><rect x="30" y="98" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="62" y="119.9" font-size="14" text-anchor="middle" fill="currentColor">沸点（℃）</text><rect x="94" y="98" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="126" y="119.9" font-size="14" text-anchor="middle" fill="currentColor">−34</text><rect x="158" y="98" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="190" y="119.9" font-size="14" text-anchor="middle" fill="currentColor">59</text><rect x="222" y="98" width="64" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="254" y="119.9" font-size="14" text-anchor="middle" fill="currentColor">184</text></svg>'
        explain: ファンデルワールス力は、電子のかたよりがいっしゅんずつ生まれて、となりの分子とも引き合うことで起こる。電子の数が多く、大きい分子ほど、かたよりやすく力が強い。極性分子は、δ+ と δ− が引き合う分、すこし強くなる。分子の中の結合（共有結合）は切れず、分子どうしがはなれるだけなので、沸点は共有結合の強さではなく、分子間力で決まる。
