        text: 中心の原子のまわりには、結合に使う電子対のほかに、結合に使わない電子対（非共有電子対）がある。非共有電子対も、ほかの電子対とはんぱつする。だから、まわりの電子対が 4 組でも、非共有電子対が 1 組ふえるごとに、形が変わる。
