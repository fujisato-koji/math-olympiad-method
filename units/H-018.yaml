  - day: 3
    items:
      - part: 見本
        text: 結合した 2 つの原子は、電子を同じ強さで引くとはかぎらない。電子を引きつける強さを電気陰性度という。HCl では Cl のほうが大きいので、結合の電子は Cl に引かれて、Cl が δ− になる。H は δ+ になる。この電気のかたよりを、結合の極性という。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="111" y1="90" x2="209" y2="90" fill="none" stroke="currentColor" stroke-width="2"/><text x="100" y="95.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="220" y="95.2" font-size="15" text-anchor="middle" fill="currentColor">Cl</text><text x="100" y="58" font-size="14" text-anchor="middle" fill="currentColor">δ+</text><text x="220" y="58" font-size="14" text-anchor="middle" fill="currentColor">δ−</text><line x1="110" y1="130" x2="201" y2="130" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="210,130 201,134.5 201,125.5" fill="currentColor"/><line x1="128" y1="124" x2="128" y2="136" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
        explain: 電気陰性度は周期表の右上のげんそほど大きい（きガスをのぞく）。2 つの原子の電気陰性度の差が大きいほど、結合の極性は大きい。同じ原子どうしの結合（H–H、Cl–Cl など）は差が 0 なので、極性がない。差がとても大きいと、電子が完全にうつってイオン結合になる。図の矢印は電子が引かれる向き（矢の先が δ−）。
      - part: 見本
        text: 分子ぜんたいの極性は、結合の極性の向きと、分子の形で決まる。CO₂ は、2 つの C=O の向きが反対で、打ち消し合う。だから分子は極性がない。H₂O は折れ線で、打ち消し合わず、O がわが δ−、H がわが δ+ になる。だから極性がある。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="41" y1="46.5" x2="69" y2="46.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="41" y1="53.5" x2="69" y2="53.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="91" y1="46.5" x2="119" y2="46.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="91" y1="53.5" x2="119" y2="53.5" fill="none" stroke="currentColor" stroke-width="2"/><text x="30" y="55.2" font-size="15" text-anchor="middle" fill="currentColor">O</text><text x="80" y="55.2" font-size="15" text-anchor="middle" fill="currentColor">C</text><text x="130" y="55.2" font-size="15" text-anchor="middle" fill="currentColor">O</text><line x1="76" y1="88" x2="45" y2="88" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="36,88 45,83.5 45,92.5" fill="currentColor"/><line x1="68.8" y1="94" x2="68.8" y2="82" fill="none" stroke="currentColor" stroke-width="2"/><line x1="84" y1="88" x2="115" y2="88" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="124,88 115,92.5 115,83.5" fill="currentColor"/><line x1="91.2" y1="82" x2="91.2" y2="94" fill="none" stroke="currentColor" stroke-width="2"/><text x="80" y="150" font-size="16" text-anchor="middle" fill="currentColor">CO₂</text><text x="80" y="175" font-size="14" text-anchor="middle" fill="currentColor">打ち消す</text><line x1="234.5" y1="49.5" x2="210.5" y2="90.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="245.5" y1="49.5" x2="269.5" y2="90.5" fill="none" stroke="currentColor" stroke-width="2"/><text x="240" y="45.2" font-size="15" text-anchor="middle" fill="currentColor">O</text><text x="205" y="105.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="275" y="105.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><line x1="207" y1="92" x2="224.3" y2="63.7" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="229,56 228.1,66 220.5,61.3" fill="currentColor"/><line x1="205.8" y1="82.4" x2="216.1" y2="88.6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="273" y1="92" x2="255.7" y2="63.7" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="251,56 259.5,61.3 251.9,66" fill="currentColor"/><line x1="263.9" y1="88.6" x2="274.2" y2="82.4" fill="none" stroke="currentColor" stroke-width="2"/><text x="240" y="150" font-size="16" text-anchor="middle" fill="currentColor">H₂O</text><text x="240" y="175" font-size="14" text-anchor="middle" fill="currentColor">打ち消さない</text></svg>'
        explain: 分子の極性は、結合の極性を矢印（ベクトル）と見て、足し合わせたものである。対称な形（直線の CO₂、平面三角の BF₃、四面体の CH₄ や CCl₄）で、同じ結合が同じ向きにならぶなら、ぜんぶ打ち消して無極性分子になる。折れ線の H₂O や三角すいの NH₃ は打ち消さないので、極性分子になる。
