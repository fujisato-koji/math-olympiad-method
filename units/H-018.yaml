        explain: 4 組の電子対は、どれも四面体の向きに広がる。そのうち原子がついている向きだけが分子の形として見えるので、非共有電子対が 0 組なら四面体、1 組なら三角すい、2 組なら折れ線になる。非共有電子対は 1 つの原子核だけに引かれて広がるため、結合の電子対をおしちぢめる。そのため角度は CH₄ の約 109.5°、NH₃ の約 107°、H₂O の約 104.5° と小さくなる。
