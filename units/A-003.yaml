  - part: 離
    kinds: [総動員, 道筋]
    uses: [L-009]
    text: いま、母の年れいは子どもの年れいの 4 倍です。16 年後には、母の年れいは子どもの年れいの 2 倍になります。母はいま何さいですか。
    answer: 32
    check: "[4 * x for x in range(1, 50) if 4 * x + 16 == 2 * (x + 16)][0]"
    hints:
      - 何年たっても、母と子どもの年れいの差は変わらないね。
      - いまの子どもの年れいを 1 つ分とすると、母は 4 つ分。差は何つ分かな。
      - 16 年後に母が子どもの 2 倍なら、差は 16 年後の子どもの年れいと同じだね。線分図にかいてみよう。
    paths:
      - [いま 子ども 1 つ分、母 4 つ分で 差は 3 つ分, 16 年後は 母が子どもの 2 倍なので 差 = 16 年後の子ども, 1 つ分 + 16 = 3 つ分 で 2 つ分が 16, 1 つ分は 8 で 母は 8 × 4 = 32 さい]
      - [子どもの年れいを 6、7、8、… とためす, 8 さいなら母は 32 さいで 16 年後は 24 さいと 48 さい, 48 は 24 の 2 倍で合う, 32 さい]
    note: 年れい算。差が変わらない（L-009 の変わらない量）ことに目をつけ、線分図で「差 = 3 つ分 = 16 年後の子ども」と結ぶのが要点。子どもの年れい 8 を答えてしまう子がいるので、何を聞かれているかを最後に確かめさせる。
  - part: 離
    kinds: [手数]
    text: 兄、姉、弟、妹の 4 人で、カードを合わせて 36 まい持っています。まず兄が姉に 6 まい、次に姉が弟に 8 まい、最後に弟が妹に 3 まいわたしたら、4 人のまい数が同じになりました。はじめに、いちばん多く持っていた人と、いちばん少なく持っていた人のまい数のちがいは何まいですか。
    answer: 11
    check: "(lambda d: max(d) - min(d))([36 // 4 + 6, 36 // 4 - 6 + 8, 36 // 4 - 8 + 3, 36 // 4 - 3])"
    hints:
      - 最後に、1 人何まいずつになったかな。
      - 1 人ずつ、もらった分をひいて、わたした分を足して、はじめにもどそう。
      - 4 人のはじめのまい数を足すと 36 になるか、確かめよう。
    paths:
      - [最後は 36 ÷ 4 = 9 まいずつ, 兄 9 + 6 = 15、姉 9 − 6 + 8 = 11, 弟 9 − 8 + 3 = 4、妹 9 − 3 = 6, いちばん多い兄といちばん少ない弟で 15 − 4 = 11 まい]
    note: やりとりのあと全員が同じになるので、まず最後の数（36 ÷ 4）を出し、1 人ずつ逆にたどる。姉と弟は「もらう」と「わたす」の両方があり、たす・ひくを取りちがえやすい。4 人分を足して 36 になるかで確かめさせる。
  - part: 離
    kinds: [読み取り]
    text: 図書室の本だなに、物語、図かん、まんがの本があります。物語は図かんより 8 さつ多く、まんがは図かんの 2 倍あります。また、まんがは物語より 7 さつ多いです。3 しゅるいの本は、合わせて何さつありますか。
    answer: 68
    check: "[x + (x + 8) + 2 * x for x in range(1, 100) if 2 * x == x + 8 + 7][0]"
    hints:
      - 図かんを 1 本の線にして、物語とまんがの線分図をかこう。
      - まんがは図かん 2 つ分。物語は図かん 1 つ分と 8 さつ。まんがと物語の差を図で見よう。
      - 図かん 1 つ分から 8 さつをひいた分が、7 さつにあたるね。
    paths:
      - [まんが = 図かん 2 つ分、物語 = 図かん 1 つ分 + 8, まんがと物語の差は 1 つ分 − 8 で これが 7, 図かん 15、物語 23、まんが 30, 合わせて 68 さつ]
      - [図かんを 10、11、12、… とためす, 図かん 15 のとき まんが 30、物語 23 で 差が 7, 15 + 23 + 30 = 68 さつ]
    note: 3 つの条件（差、倍、差）を 1 つの線分図にまとめ直すのが要点。「図かん 1 つ分 = 8 + 7」に気づけば、あとは足すだけ。聞かれているのが「合わせて」であることを読み落として、図かんの数で止まりやすい。

  - part: 離
    kinds: [数]
    uses: [A-001]
    text: 姉は 1200 円、妹は 800 円持っています。姉が妹に何円渡すと、2 人の所持金は同じになりますか。
    answer: 200
    check: "(1200 - 800) // 2"
    hints:
      - 2 人の所持金の差は何円かな。
      - 差の半分を渡すと、2 人の金額が同じになる。
      - 400 円の半分を考えよう。
    paths:
      - [2 人の差は 1200 − 800 = 400, 差の半分を渡す, 400 ÷ 2 = 200]
    note: やりとりで 2 人が同じになるには、差の半分を渡す。差の全部を渡すのではない。
