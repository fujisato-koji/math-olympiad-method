# A-003 図にして考える（線分図）
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：線分図を読む（全体と部分、ちがい）。2 日目：「多い・少ない」の線分図と、はじめの数にもどる。
#   3 日目：和とちがいから 2 つの数を求める（和差算）。4 日目：わけ。5 日目：A-002 と混ぜる。6 日目：確認。
# 線分図は全角の文字だけで描く（数字も全角、行の長さをそろえる）。行ごとに中央へそろえて表示されるので、
#   字の幅がそろっていれば線の左はしがそろう。├─┼─┤ が線、└─┘ が全体やちがいのくくり、□ が求める数。
#   線の長さは数の大きさにおおよそ合わせた。check は図を読まず、場面の計算の式で確かめる。
# 前提は A-002（→ N-007）だけなので、かけ算とわり算は使わない。和差算の「同じ数 2 つ分」は、
#   □ + □ = 36 のような式を、数を入れてためして求める（N-013、N-014 が前提にないため）。数は 100 まで。
# 人の名前は使わず、兄と弟、赤と青などで書く。長さや重さの単位は前提にないので、まい・こ・本・人・円で数える。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-013、N-014 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-003
days:
  - day: 1
    items:
      - part: 見本
        text: 赤い花と白い花が、合わせて 45 本あります。赤い花は 28 本です。白い花は何本かな。線分図にして考えよう。
        figure: "　　赤２８　　　　白□　　\n├──────┼────┤\n└────４５─────┘"
        explain: 線分図では、数の大きさを線の長さで表します。全体の 45 本を、赤の 28 本と白の □ 本に分けてかきます。□ は、全体から赤の分をのぞいた長さなので、45 − 28 = 17 本です。
      - part: 思い出す
        text: □ + 19 = 52 の □ に入る数はいくつですか。
        answer: 33
        check: "52 - 19"
        hints:
          - □ に 19 をたすと 52 になるね。
          - 52 は □ と 19 に分けられるよ。
          - 52 から 19 をとってみよう。
        paths:
          - [52 は □ と 19, □ = 52 − 19, 33]
      - part: 思い出す
        text: 61 − □ = 25 の □ に入る数はいくつですか。
        answer: 36
        check: "61 - 25"
        hints:
          - 61 から □ をとると、25 残るね。
          - 61 は □ と 25 に分けられるよ。
          - 61 から 25 をとってみよう。
        paths:
          - [61 は □ と 25, □ = 61 − 25, 36]
      - part: 今日
        text: シールが 9 まいあります。そのうち 5 まいをはりました。のこりは何まいですか。
        figure: "　　はり５　　のこり□　　\n├─────┼────┤\n└────９─────┘"
        answer: 4
        check: "[n for n in range(10) if 5 + n == 9][0]"
        hints:
          - 全体はどこかな。線の下の └ ┘ を見よう。
          - 全体の 9 まいは、はった分とのこりに分かれているね。
          - はった 5 まいと合わせて 9 になる数を考えよう。
        paths:
          - [全体 9 は 5 と □, □ = 9 − 5, 4 まい]
          - [□ に 1、2、3 と入れてためす, 5 + 4 = 9, 4 まい]
        note: 全体 − 部分の、いちばん小さい数での足場。
      - part: 今日
