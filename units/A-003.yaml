      - part: 挑戦
        text: クッキーを 80 まいやきました。姉に 26 まい、妹に 31 まいあげて、残りは自分の分です。自分の分は何まいですか。
        figure: "　　姉２６　　　妹３１　　　　□　　　\n├─────┼──────┼────┤\n└───────８０────────┘"
