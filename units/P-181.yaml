      - part: わけ
        id: "36516c8fbc"
        text: N きょくと S きょくが ひきあう わけを、くちで せつめいして みよう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="54" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">なぜ ひきあうの？</text><rect x="48" y="84" width="55" height="34" fill="#f08080" fill-opacity=".75"/><rect x="103" y="84" width="55" height="34" fill="#7fc8f8" fill-opacity=".75"/><rect x="48" y="84" width="110" height="34" fill="none" stroke="currentColor" stroke-width="2"/><line x1="103" y1="84" x2="103" y2="118" stroke="currentColor" stroke-width="2"/><text x="75.5" y="106.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">N</text><text x="130.5" y="106.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">S</text><rect x="162" y="84" width="55" height="34" fill="#f08080" fill-opacity=".75"/><rect x="217" y="84" width="55" height="34" fill="#7fc8f8" fill-opacity=".75"/><rect x="162" y="84" width="110" height="34" fill="none" stroke="currentColor" stroke-width="2"/><line x1="217" y1="84" x2="217" y2="118" stroke="currentColor" stroke-width="2"/><text x="189.5" y="106.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">N</text><text x="244.5" y="106.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">S</text></svg>'
        explain: 「N きょくと S きょくは ちがう きょくどうしなので、ひきあいます。おなじ きょくどうしは しりぞけあいます。じしゃくの むきを かえて、むかいあう きょくを かえると、ひきあったり しりぞけあったり します。」と いえれば よい。① ちがう きょく、② ひきあう、③ おなじ きょくは しりぞけあう。子どもには、2 つの じしゃくで たしかめさせます。
        hints:
