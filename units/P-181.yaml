        id: "07c00ef0e1"
        text: |-
          じしゃくの 力は、はなれて いても はたらきます。
          ふれて いなくても、てつの クリップを ひっぱります。
          じしゃくに つく ものは、てつで できて います。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="140" y="14" width="40" height="38" fill="#7fc8f8" fill-opacity=".75"/><rect x="140" y="52" width="40" height="38" fill="#f08080" fill-opacity=".75"/><rect x="140" y="14" width="40" height="76" fill="none" stroke="currentColor" stroke-width="2"/><line x1="140" y1="52" x2="180" y2="52" stroke="currentColor" stroke-width="2"/><text x="160" y="38.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">S</text><text x="160" y="76.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">N</text><g transform="translate(160 110) rotate(0) scale(1.1)"><path d="M-3 10V27A3 3 0 0 0 3 27V5A4.5 4.5 0 0 0 -6 5V29A6 6 0 0 0 6 29V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g><line x1="160" y1="148" x2="160" y2="183" stroke="currentColor" stroke-width="1.5"/><rect x="148" y="182" width="24" height="7" rx="1" fill="#f3c969" fill-opacity=".7" stroke="currentColor" stroke-width="1.5"/><line x1="30" y1="190" x2="290" y2="190" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="97" x2="200" y2="104" stroke="currentColor" stroke-width="1.5"/><polygon points="200,91 196,98 204,98" fill="currentColor"/><polygon points="200,110 196,103 204,103" fill="currentColor"/><text x="212" y="106" font-size="14" text-anchor="start" fill="currentColor">すきま</text><text x="186" y="134" font-size="14" text-anchor="start" fill="currentColor">てつの クリップ</text><text x="152" y="172" font-size="14" text-anchor="end" fill="currentColor">糸</text><text x="128" y="56" font-size="14" text-anchor="end" fill="currentColor">じしゃく</text></svg>'
        explain: じしゃくの まわりには 力の はたらく ところが あり、ふれて いなくても てつを ひっぱります。糸を つけた クリップが、じしゃくの 下で ういたまま とまるのは、この 力の ためです。てつは じしゃくに ちかづくと じしゃくの ように なって ひきつけられます。アルミや プラスチック、かみは つきません。じしゃくを ちかづける ほど、力は つよく なります。
        note: じしゃくの 力は はなれて いても はたらく。じしゃくに つくのは てつ。
