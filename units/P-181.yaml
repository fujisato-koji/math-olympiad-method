# P-181 磁石の極
#
# 段 1・水準 1・5 日。N きょくと S きょく、ひきあう・しりぞけあう、はなれて いても はたらく 力、ほういじしん、てつが じしゃくに なる ことを あつかう。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 日の並び：1 日目 N きょくと S きょく、ひきあう・しりぞけあう、2 日目 はなれて いても はたらく 力と てつ、3 日目 ほういじしんと てつが じしゃくに なる こと、4 日目 わけ、5 日目 確認。
# N きょくは 赤、S きょくは 青で かく（単元の 中で そろえる）。
# 腕だめし（離）の kinds は読み取り（絵の 中の じしゃくや ほういじしんを 読み取って 答える）。

