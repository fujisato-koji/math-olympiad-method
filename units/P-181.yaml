# P-181 磁石の極
#
# 段 1・水準 1・5 日。N 極と S 極、引き合う・しりぞけ合う、はなれていても働く力、方位磁針、鉄が磁石になることを扱う。
# 子の画面には text、figure、choices、ヒントだけを出す。answer、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。

id: P-181
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          磁石には N 極と S 極が あります。
          N 極どうし、S 極どうしは しりぞけ合います。
          N 極と S 極は 引き合います。
          磁石を 2 つ 近づけると、力が はたらきます。
        explain: |-
          磁石の 極は、N（北）と S（南）の 2 つです。
          同じ 極どうしは にげる ように しりぞけ合い、ちがう 極どうしは くっつく ように 引き合います。
          方位磁針の N 極は、北を さします。
        note: N と N、S と S はしりぞけ合う。N と S は引き合う。
      - part: 今日
        text: N 極と N 極を 近づけると、どうなるかな。
        figure: 🧲🧲
        choices: [引き合う, しりぞけ合う, 何も 起こらない, 光る]
        answer: しりぞけ合う
        check: "'しりぞけ合う'"
        hints:
          - 同じ 極どうしの ときの ことを おもいだそう。
          - 同じ 極は、にげる ように はなれます。
          - 同じ 極を 近づけた ときの ようすを おもいだそう。
        paths:
          - [同じ 極, にげる, しりぞけ合う]
      - part: 今日
        text: N 極と S 極を 近づけると、どうなるかな。
        figure: 🧲🧲
        choices: [引き合う, しりぞけ合う, 何も 起こらない, 光る]
        answer: 引き合う
        check: "'引き合う'"
        hints:
          - ちがう 極どうしの ときの ことを おもいだそう。
          - ちがう 極は、くっつく ように ちかづきます。
          - ちがう 極を 近づけた ときの ようすを おもいだそう。
        paths:
          - [ちがう 極, くっつく, 引き合う]
      - part: 挑戦
        text: 磁石の 極は いくつ あるかな。
        choices: [1 つ, 2 つ, 3 つ, 4 つ]
        answer: 2 つ
        check: "'2 つ'"
        hints:
          - 磁石の はしを 見てみよう。
          - N と S の 2 つの よび名が あります。
          - N と S の よび名を 数えよう。
        paths:
          - [磁石の はし, N と S, 2 つ]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          磁石の 力は、はなれていても はたらきます。
          2 つの 磁石を 近づけると、ふれていなくても 引き合ったり しりぞけ合ったりします。
          磁石に つく ものは、鉄です。
        explain: |-
          磁石の 力は、少し はなれていても はたらきます。近づくほど 強く なります。
          鉄の くぎや クリップは、磁石に つきます。アルミや プラスチックは つきません。
        note: 磁石の力ははなれていても働く。鉄がつく。
      - part: 今日
        text: 磁石に つく ものは どれかな。
        figure: 🧲🔩
        choices: [鉄の くぎ, アルミの かん, プラスチックの コップ, 紙の はこ]
        answer: 鉄の くぎ
        check: "'鉄の くぎ'"
        hints:
          - 磁石が 引きつける ものを おもいだそう。
          - 鉄で できた ものを さがそう。
          - 鉄の くぎが つきます。
        paths:
          - [磁石は 鉄, 鉄の くぎ]
      - part: 今日
        text: 磁石を はなしても、鉄の クリップは どうなるかな。
        choices: [ついたまま, すぐ おちる, 光る, 大きくなる]
        answer: ついたまま
        check: "'ついたまま'"
        hints:
          - 磁石の 力は、はなれていても はたらきます。
          - 近くに ある あいだは、力が とどきます。
          - クリップは ついたままです。
        paths:
          - [はなれていても 力, 近くなら とどく, ついたまま]
      - part: 挑戦
        text: 磁石の 力は、近づくと どうなるかな。
        choices: [強く なる, 弱く なる, 変わらない, なくなる]
        answer: 強く なる
        check: "'強く なる'"
        hints:
          - 2 つの 磁石を ゆっくり 近づけて みよう。
          - 近い ほど、引っぱる 力が 大きく なります。
          - 近づけた ときの 力の 変わり方を たしかめよう。
        paths:
          - [近づける, 力が 大きく, 強く なる]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          方位磁針は、いつも 北を さします。
          方位磁針の N 極が 北を さすのは、地球が 大きな 磁石の ように はたらくからです。
          鉄は、磁石に 近づけると、磁石に なります。
        explain: |-
          方位磁針の N 極は、地球の 北の ほうへ 引っぱられます。
          鉄の くぎを 磁石に こすりつけると、くぎも 磁石の ように なります。
          これを 磁化と いいます。
        note: 方位磁針は北をさす。鉄は磁石に近づけると磁石になる。
      - part: 今日
        text: 方位磁針の N 極は、どちらを さすかな。
        figure: 🧭
        choices: [北, 南, 東, 西]
        answer: 北
        check: "'北'"
        hints:
          - 方位磁針の 使い方を おもいだそう。
          - N は 北の はじめの 字です。
          - 北を さします。
        paths:
          - [方位磁針, N は 北, 北を さす]
      - part: 今日
        text: 鉄の くぎを 磁石に こすりつけると、どうなるかな。
        choices: [磁石に なる, 光る, とける, 小さく なる]
        answer: 磁石に なる
        check: "'磁石に なる'"
        hints:
          - 鉄は 磁石に 近づくと どうなるか を おもいだそう。
          - こすりつけると、くぎも 力を もつ ことが あります。
          - こすりつけた あと、くぎが 何を 引きつけるか たしかめよう。
        paths:
          - [鉄を こする, 磁化, 磁石に なる]
      - part: 挑戦
        text: 方位磁針が 北を さすのは、何が 理由かな。
        choices: [地球が 大きな 磁石の ようだから, 風が ふくから, 太陽が 光るから, 音が するから]
        answer: 地球が 大きな 磁石の ようだから
        check: "'地球が 大きな 磁石の ようだから'"
        hints:
          - 方位磁針は、磁石の 力で 動きます。
