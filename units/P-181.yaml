        id: "aa7bdcc422"
        text: |-
          じしゃくの りょうはしを、きょくと いいます。
          N きょくと S きょくが あります。
          ちがう きょくどうしは、ひきあいます。
          おなじ きょくどうしは、しりぞけあいます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">ちがう きょくは ひきあう</text><line x1="62" y1="37" x2="103" y2="37" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="112,37 102,42.5 102,31.5" fill="currentColor"/><line x1="258" y1="37" x2="217" y2="37" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="208,37 218,31.5 218,42.5" fill="currentColor"/><rect x="20" y="48" width="57.5" height="32" fill="#f08080" fill-opacity=".75"/><rect x="77.5" y="48" width="57.5" height="32" fill="#7fc8f8" fill-opacity=".75"/><rect x="20" y="48" width="115" height="32" fill="none" stroke="currentColor" stroke-width="2"/><line x1="77.5" y1="48" x2="77.5" y2="80" stroke="currentColor" stroke-width="2"/><text x="48.8" y="69.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">N</text><text x="106.2" y="69.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">S</text><rect x="185" y="48" width="57.5" height="32" fill="#f08080" fill-opacity=".75"/><rect x="242.5" y="48" width="57.5" height="32" fill="#7fc8f8" fill-opacity=".75"/><rect x="185" y="48" width="115" height="32" fill="none" stroke="currentColor" stroke-width="2"/><line x1="242.5" y1="48" x2="242.5" y2="80" stroke="currentColor" stroke-width="2"/><text x="213.8" y="69.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">N</text><text x="271.2" y="69.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">S</text><text x="160" y="118" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">おなじ きょくは しりぞけあう</text><line x1="112" y1="135" x2="71" y2="135" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="62,135 72,129.5 72,140.5" fill="currentColor"/><line x1="208" y1="135" x2="249" y2="135" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="258,135 248,140.5 248,129.5" fill="currentColor"/><rect x="20" y="146" width="57.5" height="32" fill="#7fc8f8" fill-opacity=".75"/><rect x="77.5" y="146" width="57.5" height="32" fill="#f08080" fill-opacity=".75"/><rect x="20" y="146" width="115" height="32" fill="none" stroke="currentColor" stroke-width="2"/><line x1="77.5" y1="146" x2="77.5" y2="178" stroke="currentColor" stroke-width="2"/><text x="48.8" y="167.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">S</text><text x="106.2" y="167.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">N</text><rect x="185" y="146" width="57.5" height="32" fill="#f08080" fill-opacity=".75"/><rect x="242.5" y="146" width="57.5" height="32" fill="#7fc8f8" fill-opacity=".75"/><rect x="185" y="146" width="115" height="32" fill="none" stroke="currentColor" stroke-width="2"/><line x1="242.5" y1="146" x2="242.5" y2="178" stroke="currentColor" stroke-width="2"/><text x="213.8" y="167.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">N</text><text x="271.2" y="167.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">S</text></svg>'
        explain: じしゃくの きょくは N と S の 2 つで、かたほうだけの じしゃくは ありません。じしゃくを 2 つに きっても、それぞれに N と S が できます。ちがう きょくどうしは ひきあい、おなじ きょくどうしは しりぞけあいます。この たんげんでは、N きょくを 赤、S きょくを 青で かいて います。じしゃくを 2 つ よういして、むきを かえながら ちかづけて たしかめさせます。
        note: N と N、S と S は しりぞけあう。N と S は ひきあう。
