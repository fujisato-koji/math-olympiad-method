        explain: 空間に、1 点 O でたがいに垂直に交わる 3 本の《数直線》 x じく、y じく、z じくをとると、点の位置は 3 つの数の組 (a, b, c) で表せます。これを点の座標といい、O を原点といいます。x じくと y じくをふくむ平面を xy 平面（z = 0 の平面）といい、同じように yz 平面（x = 0）、zx 平面（y = 0）があります。P(2, 3, 6) は、各辺が 2、3、6 の直方体の、O と向かい合うちょう点です。OP は直方体の対角線なので、OP = √(2² + 3² + 6²) = √49 = 7 です（G-021）。いっぱんに、2 点 A(x₁, y₁, z₁)、B(x₂, y₂, z₂) の距離は AB = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²) です（わけは 4 日目）。線分 AB の中点は ((x₁ + x₂)/2, (y₁ + y₂)/2, (z₁ + z₂)/2) です（平面と同じ考え）。点 C(a, b, c) からの距離が r の点の全体は、C を中心とする半径 r の球面で、その方程式は (x − a)² + (y − b)² + (z − c)² = r² です（球面を単に球ということもあります）。たとえば、原点を中心とする半径 7 の球面は x² + y² + z² = 49 で、P はその上にあります。xy 平面について P とたいしょうな点は (2, 3, −6) です。
