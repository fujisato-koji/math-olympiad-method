        text: 点 P(x₁, y₁, z₁) と平面 ax + by + cz + d = 0 の距離が |ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²) となるわけを、P から平面に下ろした垂線と平面の交点を H として、筋道を立てて書きましょう。
        explain: 例：「n = (a, b, c) は平面に垂直なので（前の問題）、PH は n に平行で、ある実数 t を使ってベクトル PH = tn と書ける。H(x₁ + ta, y₁ + tb, z₁ + tc) は平面の上にあるので、a(x₁ + ta) + b(y₁ + tb) + c(z₁ + tc) + d = 0、つまり (a² + b² + c²)t = −(ax₁ + by₁ + cz₁ + d) である。n は 0 ベクトルでないので a² + b² + c² は 0 でなく、t = −(ax₁ + by₁ + cz₁ + d) ÷ (a² + b² + c²)。距離は PH = |t| × |n| = |ax₁ + by₁ + cz₁ + d| ÷ (a² + b² + c²) × √(a² + b² + c²) = |ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²) である。」と書ければよい。①「〜とする」で H と t を決める、② H を平面の式に代入して t を求める、③ 約束した事実（法線ベクトルは平面に垂直、|tn| = |t||n|）で結ぶ、の 3 つがそろっているかを見る。平面の点と直線の距離の式（G-026）が、z の項を 1 つ足した同じ形になることを話す。
        hints:
          - PH は法線ベクトル n に平行なので、ベクトル PH = tn と書けます。
          - H の座標を t で表し、平面の式に代入しましょう。
          - t を求めたら、PH = |t| × |n| を計算しましょう。
        paths:
          - ["ベクトル PH = tn とし、H(x₁ + ta, y₁ + tb, z₁ + tc)", 平面の式に入れて t = −(ax₁ + by₁ + cz₁ + d) ÷ (a² + b² + c²), PH = |t| × √(a² + b² + c²), "|ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²)"]
