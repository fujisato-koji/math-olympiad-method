        id: "d5e1904dcd"
        text: 平面 ax + by + cz + d = 0 に、ベクトル n = (a, b, c) が垂直である（平面の上のどの 2 点を結ぶベクトルとも垂直である）わけを、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="30,165 220,165 290,115 100,115" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><line x1="110" y1="148" x2="213.2" y2="130.1" stroke="#7fc8f8" stroke-width="3"/><polygon points="225,128 214,135 212.3,125.1" fill="#7fc8f8" stroke="none"/><line x1="110" y1="148" x2="110" y2="62" stroke="#f08080" stroke-width="3"/><polygon points="110,50 115,62 105,62" fill="#f08080" stroke="none"/><circle cx="110" cy="148" r="4.5" fill="currentColor"/><circle cx="225" cy="128" r="4" fill="currentColor"/><text x="102" y="154" font-size="15" text-anchor="end" fill="currentColor">P</text><text x="229" y="148" font-size="15" text-anchor="middle" fill="currentColor">Q</text><text x="120" y="58" font-size="14" text-anchor="start" fill="currentColor">n = (a, b, c)</text><path d="M127.7 144.9 A18 18 0 0 0 110 130" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="132" y="126" font-size="17" text-anchor="start" fill="currentColor" font-weight="bold">?</text><text x="32" y="190" font-size="14" text-anchor="start" fill="currentColor">平面 ax + by + cz + d = 0</text></svg>'
        explain: 例：「平面の上の 2 点を P(x₁, y₁, z₁)、Q(x₂, y₂, z₂)（P と Q はちがう点）とすると、ax₁ + by₁ + cz₁ + d = 0、ax₂ + by₂ + cz₂ + d = 0 である。辺々ひくと a(x₂ − x₁) + b(y₂ − y₁) + c(z₂ − z₁) = 0。左辺は n とベクトル PQ = (x₂ − x₁, y₂ − y₁, z₂ − z₁) の内積なので、n・PQ = 0 である。内積が 0 なので、n と PQ は垂直である（G-027）。P、Q は平面の上のどの 2 点でもよいので、n は平面の上のどの向きとも垂直、つまり平面に垂直である。」と書ければよい。①「〜とする」で P、Q を決める、② 2 つの等式を辺々ひいて d を消す、③ 約束した事実（内積が 0 なら垂直）で結ぶ、の 3 つがそろっているかを見る。逆に「点 A を通り n に垂直な平面」が a(x − x₀) + b(y − y₀) + c(z − z₀) = 0 になることも、n・AP = 0 から同じように出ることを話す。
