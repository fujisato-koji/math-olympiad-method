      - part: 挑戦
        text: 2 点 A(3, 1, −2)、B(−1, 5, 4) を直径の両はしとする球面の方程式はどれですか。
        choices:
          - (x − 1)² + (y − 3)² + (z − 1)² = 17
          - (x − 1)² + (y − 3)² + (z − 1)² = 68
          - (x − 2)² + (y + 2)² + (z + 3)² = 17
          - (x + 1)² + (y + 3)² + (z + 1)² = 17
        answer: (x − 1)² + (y − 3)² + (z − 1)² = 17
        check: "[c for c, f in {'(x − 1)² + (y − 3)² + (z − 1)² = 17': (1, 3, 1, 17), '(x − 1)² + (y − 3)² + (z − 1)² = 68': (1, 3, 1, 68), '(x − 2)² + (y + 2)² + (z + 3)² = 17': (2, -2, -3, 17), '(x + 1)² + (y + 3)² + (z + 1)² = 17': (-1, -3, -1, 17)}.items() if all((p[0] - f[0]) ** 2 + (p[1] - f[1]) ** 2 + (p[2] - f[2]) ** 2 == f[3] for p in ((3, 1, -2), (-1, 5, 4))) and (2 * f[0], 2 * f[1], 2 * f[2]) == (3 - 1, 1 + 5, -2 + 4)][0]"
        hints:
          - 中心は、直径 AB の中点です。
          - 半径は、AB の長さの半分です。
          - 半径の 2 乗を、中心と A の距離の 2 乗で求めてもよいです。
        paths:
