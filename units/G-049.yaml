  - day: 3
    items:
      - part: 見本
        id: "f1a385f9fb"
        text: 平面に垂直なベクトルを、その平面の法線ベクトルといいます。点 A を通り n に垂直な平面の上の点 P では、n と AP が垂直なので n・AP = 0 です（左の図）。球面を平面で切ると、切り口は円になります（右の図）。点 A(1, 1, 1) を通り、n = (2, −1, 2) に垂直な平面の方程式と、原点からこの平面までの距離を求めてみましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="12,160 150,160 178,118 40,118" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><line x1="78" y1="145" x2="140" y2="128" stroke="currentColor" stroke-width="2"/><line x1="78" y1="145" x2="78" y2="62" stroke="#f08080" stroke-width="3"/><polygon points="78,50 83,62 73,62" fill="#f08080" stroke="none"/><polyline points="78,135 87.6,132.4 87.6,142.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="78" cy="145" r="4.5" fill="currentColor"/><circle cx="140" cy="128" r="4" fill="currentColor"/><text x="70" y="151" font-size="15" text-anchor="end" fill="currentColor">A</text><text x="146" y="120" font-size="15" text-anchor="start" fill="currentColor">P</text><text x="88" y="58" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">n</text><text x="120" y="84" font-size="14" text-anchor="middle" fill="currentColor">n・AP = 0</text><text x="88" y="186" font-size="14" text-anchor="middle" fill="currentColor">法線ベクトル n</text><line x1="190" y1="10" x2="190" y2="190" stroke="#c8ccd6" stroke-width="1"/><circle cx="255" cy="66" r="50" fill="#7fc8f8" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/><ellipse cx="255" cy="91" rx="43.3" ry="12" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><line x1="255" y1="66" x2="255" y2="91" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="255" y1="66" x2="298.3" y2="91" stroke="currentColor" stroke-width="2"/><line x1="255" y1="91" x2="298.3" y2="91" stroke="#f08080" stroke-width="3.5"/><circle cx="255" cy="66" r="4" fill="currentColor"/><text x="249" y="68" font-size="14" text-anchor="end" fill="currentColor">C</text><text x="249" y="90.5" font-size="15" text-anchor="end" fill="currentColor" font-style="italic">h</text><text x="278.7" y="70" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">r</text><text x="255" y="150" font-size="14" text-anchor="middle" fill="currentColor">切り口は円</text><text x="255" y="172" font-size="13" text-anchor="middle" fill="currentColor">半径 √(r² − h²)</text></svg>'
        explain: 平面の上の点を P(x, y, z) とすると、ベクトル AP と n は垂直なので n・AP = 0、つまり 2(x − 1) − (y − 1) + 2(z − 1) = 0 で、整理すると 2x − y + 2z − 3 = 0 です。このように、平面に垂直なベクトル n = (a, b, c) を法線ベクトルといい、点 (x₀, y₀, z₀) を通り n に垂直な平面は a(x − x₀) + b(y − y₀) + c(z − z₀) = 0 と表せます。逆に、ax + by + cz + d = 0 の形の式は、(a, b, c) を法線ベクトルとする平面を表します（わけは 4 日目）。xy 平面は z = 0、yz 平面は x = 0 です。点 (x₁, y₁, z₁) と平面 ax + by + cz + d = 0 の距離は |ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²) です（わけは 4 日目。平面の点と直線の距離の式と同じ形）。原点では |−3| ÷ √(4 + 1 + 4) = 3 ÷ 3 = 1 です。球面と平面が交わるとき、交わりは円になります。球面の中心から平面までの距離を h、球面の半径を r とすると、その円の半径は √(r² − h²) です（三平方の定理）。2 平面のなす角は、法線ベクトルのなす角（90° をこえるときは 180° からひいた角）で考えます。
