# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "e473ce64c3"
    kinds: [総動員, 道筋]
    uses: [G-021]
    text: 図の 4 点 O(0, 0, 0)、A(2, 0, 0)、B(0, 4, 0)、C(0, 0, 6) をちょう点とする四面体 OABC があります。△ABC の面積はいくつですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="110" y1="150" x2="53.9" y2="182.4" stroke="currentColor" stroke-width="1.5"/><polygon points="47,186.4 52.1,179.4 55.6,185.4" fill="currentColor" stroke="none"/><line x1="110" y1="150" x2="214" y2="150" stroke="currentColor" stroke-width="1.5"/><polygon points="222,150 214,153.5 214,146.5" fill="currentColor" stroke="none"/><line x1="110" y1="150" x2="110" y2="26" stroke="currentColor" stroke-width="1.5"/><polygon points="110,18 113.5,26 106.5,26" fill="currentColor" stroke="none"/><text x="55" y="192.4" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">x</text><text x="220" y="167" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">y</text><text x="122" y="26" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">z</text><text x="104" y="145" font-size="14" text-anchor="end" fill="currentColor">O</text><polygon points="61.5,178 190,150 110,30" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><circle cx="61.5" cy="178" r="4.5" fill="currentColor"/><circle cx="190" cy="150" r="4.5" fill="currentColor"/><circle cx="110" cy="30" r="4.5" fill="currentColor"/><text x="53.5" y="172" font-size="15" text-anchor="end" fill="currentColor">A</text><text x="192" y="170" font-size="15" text-anchor="middle" fill="currentColor">B</text><text x="102" y="34" font-size="15" text-anchor="end" fill="currentColor">C</text></svg>'
    answer: 14
    check: "(lambda V, h: 3 * V / h)(Fraction(1, 3) * Fraction(2 * 4, 2) * 6, Fraction(12, [r for r in range(1, 30) if r * r == 36 + 9 + 4][0]))"
    hints:
      - text: △OAB を底面、OC を高さとして、四面体の体積を求めましょう（G-021）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="110" y1="150" x2="53.9" y2="182.4" stroke="currentColor" stroke-width="1.5"/><polygon points="47,186.4 52.1,179.4 55.6,185.4" fill="currentColor" stroke="none"/><line x1="110" y1="150" x2="214" y2="150" stroke="currentColor" stroke-width="1.5"/><polygon points="222,150 214,153.5 214,146.5" fill="currentColor" stroke="none"/><line x1="110" y1="150" x2="110" y2="26" stroke="currentColor" stroke-width="1.5"/><polygon points="110,18 113.5,26 106.5,26" fill="currentColor" stroke="none"/><text x="55" y="192.4" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">x</text><text x="220" y="167" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">y</text><text x="122" y="26" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">z</text><text x="104" y="145" font-size="14" text-anchor="end" fill="currentColor">O</text><polygon points="110,150 61.5,178 190,150" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><line x1="61.5" y1="178" x2="110" y2="30" stroke="currentColor" stroke-width="1.5"/><line x1="190" y1="150" x2="110" y2="30" stroke="currentColor" stroke-width="1.5"/><line x1="110" y1="150" x2="110" y2="30" stroke="#f08080" stroke-width="3.5"/><text x="102" y="94" font-size="13" text-anchor="end" fill="currentColor">高さ</text><circle cx="61.5" cy="178" r="4.5" fill="currentColor"/><circle cx="190" cy="150" r="4.5" fill="currentColor"/><circle cx="110" cy="30" r="4.5" fill="currentColor"/><text x="53.5" y="172" font-size="15" text-anchor="end" fill="currentColor">A</text><text x="192" y="170" font-size="15" text-anchor="middle" fill="currentColor">B</text><text x="102" y="34" font-size="15" text-anchor="end" fill="currentColor">C</text><text x="215" y="70" font-size="13" text-anchor="middle" fill="currentColor">△OAB を底面にすると</text><text x="215" y="90" font-size="13" text-anchor="middle" fill="currentColor">高さは OC</text></svg>'
      - 平面 ABC の方程式を求め、原点からの距離を求めましょう。
      - text: △ABC を底面とすると、高さは O から平面 ABC までの距離 OH です。体積を 2 通りに表しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="110" y1="150" x2="53.9" y2="182.4" stroke="currentColor" stroke-width="1.5"/><polygon points="47,186.4 52.1,179.4 55.6,185.4" fill="currentColor" stroke="none"/><line x1="110" y1="150" x2="214" y2="150" stroke="currentColor" stroke-width="1.5"/><polygon points="222,150 214,153.5 214,146.5" fill="currentColor" stroke="none"/><line x1="110" y1="150" x2="110" y2="26" stroke="currentColor" stroke-width="1.5"/><polygon points="110,18 113.5,26 106.5,26" fill="currentColor" stroke="none"/><text x="55" y="192.4" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">x</text><text x="220" y="167" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">y</text><text x="122" y="26" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">z</text><text x="104" y="145" font-size="14" text-anchor="end" fill="currentColor">O</text><polygon points="61.5,178 190,150 110,30" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><line x1="110" y1="150" x2="118.8" y2="127" stroke="#f08080" stroke-width="3" stroke-dasharray="5 3"/><circle cx="118.8" cy="127" r="3.5" fill="currentColor"/><text x="126.8" y="123" font-size="14" text-anchor="start" fill="currentColor">H</text><text x="205" y="70" font-size="13" text-anchor="middle" fill="currentColor">△ABC を底面にすると</text><text x="205" y="90" font-size="13" text-anchor="middle" fill="currentColor">高さは OH</text><circle cx="61.5" cy="178" r="4.5" fill="currentColor"/><circle cx="190" cy="150" r="4.5" fill="currentColor"/><circle cx="110" cy="30" r="4.5" fill="currentColor"/><text x="53.5" y="172" font-size="15" text-anchor="end" fill="currentColor">A</text><text x="192" y="170" font-size="15" text-anchor="middle" fill="currentColor">B</text><text x="102" y="34" font-size="15" text-anchor="end" fill="currentColor">C</text></svg>'
    paths:
      - [体積 = (1/3) × 4 × 6 = 8, 平面 ABC は x/2 + y/4 + z/6 = 1、つまり 6x + 3y + 2z − 12 = 0, O との距離は 12/7, 面積 = 3 × 8 ÷ (12/7) = 14]
      - ["C から AB に垂線 CK を下ろすと、OC は平面 OAB に垂直なので、OK も AB に垂直", "OK は、xy 平面で O と直線 2x + y = 4 の距離で 4/√5", "CK = √(6² + 16/5) = √(196/5) = 14/√5", "面積 = (1/2) × AB × CK = (1/2) × 2√5 × 14/√5 = 14"]
    note: 3 辺の長さ（2√5、2√10、2√13）から面積を出すのは重い。体積を 2 通りに表して、点と平面の距離を面積に使う道筋。三角すいの体積（G-021）と距離の式を組み合わせる。
