        text: 空間の点は、3 つの数の組 (x, y, z) で表します。P(2, 3, 6) は、O から x の向きに 2、y の向きに 3、z の向きに 6 進んだ点です（左の図）。OP は直方体の対角線なので、OP² = 2² + 3² + 6² = 49 で、OP = 7 です。点 C からの距離が r の点の集まりを、中心 C、半径 r の球面といいます（右の図）。
