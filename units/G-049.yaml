      - part: わけ
        id: "8d70b7b011"
        text: 点 P(x₁, y₁, z₁) と平面 ax + by + cz + d = 0 の距離が |ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²) となるわけを、P から平面に下ろした垂線と平面の交点を H として、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="30,160 220,160 290,112 100,112" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><circle cx="150" cy="40" r="4.5" fill="currentColor"/><circle cx="150" cy="140" r="3.5" fill="currentColor"/><polyline points="150,131 159,131 159,140" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="160" y="44" font-size="14" text-anchor="start" fill="currentColor">P(x₁, y₁, z₁)</text><text x="142" y="156" font-size="14" text-anchor="end" fill="currentColor">H</text><text x="32" y="184" font-size="14" text-anchor="start" fill="currentColor">平面 ax + by + cz + d = 0</text><line x1="262" y1="134" x2="262" y2="81" stroke="#f08080" stroke-width="3"/><polygon points="262,70 267,81 257,81" fill="#f08080" stroke="none"/><text x="262" y="60" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">n</text><line x1="150" y1="40" x2="150" y2="140" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><text x="160" y="96" font-size="17" text-anchor="start" fill="currentColor" font-weight="bold">?</text></svg>'
        explain: 例：「n = (a, b, c) は平面に垂直なので（前の問題）、PH は n に平行で、ある実数 t を使ってベクトル PH = tn と書ける。H(x₁ + ta, y₁ + tb, z₁ + tc) は平面の上にあるので、a(x₁ + ta) + b(y₁ + tb) + c(z₁ + tc) + d = 0、つまり (a² + b² + c²)t = −(ax₁ + by₁ + cz₁ + d) である。n は 0 ベクトルでないので a² + b² + c² は 0 でなく、t = −(ax₁ + by₁ + cz₁ + d) ÷ (a² + b² + c²)。距離は PH = |t| × |n| = |ax₁ + by₁ + cz₁ + d| ÷ (a² + b² + c²) × √(a² + b² + c²) = |ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²) である。」と書ければよい。①「〜とする」で H と t を決める、② H を平面の式に代入して t を求める、③ 約束した事実（法線ベクトルは平面に垂直、|tn| = |t||n|）で結ぶ、の 3 つがそろっているかを見る。平面の点と直線の距離の式（G-026）が、z をふくむ部分を 1 つ足した同じ形になることを話す。
        hints:
          - text: PH は法線ベクトル n に平行なので、ベクトル PH = tn と書けます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="30,160 220,160 290,112 100,112" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><circle cx="150" cy="40" r="4.5" fill="currentColor"/><circle cx="150" cy="140" r="3.5" fill="currentColor"/><polyline points="150,131 159,131 159,140" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="160" y="44" font-size="14" text-anchor="start" fill="currentColor">P(x₁, y₁, z₁)</text><text x="142" y="156" font-size="14" text-anchor="end" fill="currentColor">H</text><text x="32" y="184" font-size="14" text-anchor="start" fill="currentColor">平面 ax + by + cz + d = 0</text><line x1="262" y1="134" x2="262" y2="81" stroke="#f08080" stroke-width="3"/><polygon points="262,70 267,81 257,81" fill="#f08080" stroke="none"/><text x="262" y="60" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">n</text><line x1="150" y1="40" x2="150" y2="128" stroke="#7fc8f8" stroke-width="3"/><polygon points="150,140 145,128 155,128" fill="#7fc8f8" stroke="none"/><text x="160" y="96" font-size="15" text-anchor="start" fill="currentColor">PH = tn</text></svg>'
          - H の座標を t で表し、平面の式に代入しましょう。
          - t を求めたら、PH = |t| × |n| を計算しましょう。
        paths:
          - ["ベクトル PH = tn とし、H(x₁ + ta, y₁ + tb, z₁ + tc)", 平面の式に入れて t = −(ax₁ + by₁ + cz₁ + d) ÷ (a² + b² + c²), PH = |t| × √(a² + b² + c²), "|ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²)"]
          - ["平面の上の点 A(x₀, y₀, z₀) をとる", "距離は、AP の n の向きの長さで、|n・AP| ÷ |n|", "n・AP = a(x₁ − x₀) + b(y₁ − y₀) + c(z₁ − z₀) = ax₁ + by₁ + cz₁ + d", "距離 = |ax₁ + by₁ + cz₁ + d| ÷ √(a² + b² + c²)"]
