rrentColor"/><text x="60" y="182" font-size="14" text-anchor="middle" fill="currentColor">A(x₁, y₁, z₁)</text><text x="172" y="36" font-size="14" text-anchor="middle" fill="currentColor">B(x₂, y₂, z₂)</text><text x="220" y="126" font-size="14" text-anchor="start" fill="currentColor">C</text></svg>'
