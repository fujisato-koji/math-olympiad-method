      - part: 挑戦
        id: "daab9d183c"
        text: 図の平行な 2 つの平面 2x − y + 2z = 1 と 2x − y + 2z = 10 の距離はいくつですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="30,168 200,168 275,128 105,128" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><polygon points="30,90 200,90 275,50 105,50" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/><text x="34" y="190" font-size="14" text-anchor="start" fill="currentColor">2x − y + 2z = 1</text><text x="34" y="112" font-size="14" text-anchor="start" fill="currentColor">2x − y + 2z = 10</text><line x1="160" y1="109" x2="160" y2="140" stroke="currentColor" stroke-width="2"/><polygon points="160,148 156,140 164,140" fill="currentColor" stroke="none"/><line x1="160" y1="109" x2="160" y2="78" stroke="currentColor" stroke-width="2"/><polygon points="160,70 164,78 156,78" fill="currentColor" stroke="none"/><text x="172" y="114" font-size="17" text-anchor="start" fill="currentColor" font-weight="bold">?</text></svg>'
        answer: 3
        check: "Fraction(abs(10 - 1), [r for r in range(1, 30) if r * r == 4 + 1 + 4][0])"
        hints:
          - text: 下の平面の上に点を 1 つとり、そこから上の平面までの距離を考えましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="30,168 200,168 275,128 105,128" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><polygon points="30,90 200,90 275,50 105,50" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/><text x="34" y="190" font-size="14" text-anchor="start" fill="currentColor">2x − y + 2z = 1</text><text x="34" y="112" font-size="14" text-anchor="start" fill="currentColor">2x − y + 2z = 10</text><circle cx="200" cy="150" r="4.5" fill="currentColor"/><line x1="200" y1="150" x2="200" y2="72" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><polyline points="200,81 209,81 209,72" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="190" y="162" font-size="14" text-anchor="end" fill="currentColor">(0, −1, 0)</text></svg>'
          - たとえば点 (0, −1, 0) は、2x − y + 2z = 1 の上にあります。
          - その点と、平面 2x − y + 2z − 10 = 0 の距離を求めましょう。
        paths:
          - ["点 (0, −1, 0) は 2x − y + 2z = 1 の上", 2x − y + 2z − 10 = 0 との距離は |1 − 10| ÷ 3, "3"]
          - ["原点から 2x − y + 2z = 1 までの距離は 1/3、2x − y + 2z = 10 までの距離は 10/3", "原点は 2 つの平面の同じ側にある（原点を入れると、どちらの式も左辺 − 右辺が負）", "距離の差 10/3 − 1/3 = 3"]
        note: 法線ベクトルが同じ 2 平面は平行で、距離は右辺の差 ÷ √(a² + b² + c²)。

