  - day: 2
    items:
      - part: 見本
        id: "d6e249c499"
        text: 点 A を通り、ベクトル d に平行な直線の上の点 P は、実数 t を使って、ベクトル AP = td と表せます（左の図。t = 0 のときが A）。2 つのベクトルのなす角を θ とすると、a・b = |a||b|cos θ です（右の図）。A(1, 0, 2)、d = (1, 2, −1) の直線の式と、a = (1, 1, 0)、b = (1, 0, 1) のなす角を求めてみましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="177.8" x2="160" y2="42.8" stroke="currentColor" stroke-width="2"/><line x1="52" y1="140" x2="73.8" y2="120.4" stroke="#f08080" stroke-width="3.5"/><polygon points="82,113 77.2,124.1 70.5,116.6" fill="#f08080" stroke="none"/><circle cx="22" cy="167" r="4" fill="currentColor"/><circle cx="52" cy="140" r="5" fill="currentColor"/><text x="62" y="152" font-size="13" text-anchor="start" fill="currentColor">t = 0</text><circle cx="82" cy="113" r="4" fill="currentColor"/><text x="92" y="125" font-size="13" text-anchor="start" fill="currentColor">t = 1</text><circle cx="112" cy="86" r="4" fill="currentColor"/><text x="122" y="98" font-size="13" text-anchor="start" fill="currentColor">t = 2</text><circle cx="142" cy="59" r="4" fill="currentColor"/><text x="43" y="143" font-size="15" text-anchor="end" fill="currentColor">A</text><text x="59" y="118.5" font-size="15" text-anchor="end" fill="currentColor" font-style="italic">d</text><text x="104" y="78" font-size="15" text-anchor="end" fill="currentColor">P</text><text x="88" y="24" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">AP = td</text><line x1="196" y1="160" x2="295" y2="160" stroke="#7fc8f8" stroke-width="3"/><polygon points="306,160 295,165 295,155" fill="#7fc8f8" stroke="none"/><line x1="196" y1="160" x2="245.5" y2="74.5" stroke="#7bc96f" stroke-width="3"/><polygon points="251,65 249.8,77 241.2,72" fill="#7bc96f" stroke="none"/><circle cx="196" cy="160" r="3" fill="currentColor"/><text x="190" y="164" font-size="14" text-anchor="end" fill="currentColor">O</text><text x="302" y="180" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">a</text><text x="261" y="69" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">b</text><path d="M226 160 A30 30 0 0 0 211 134" fill="none" stroke="currentColor" stroke-width="2"/><text x="236" y="146" font-size="15" text-anchor="start" fill="currentColor">θ</text><text x="256" y="30" font-size="14" text-anchor="middle" fill="currentColor">a・b = |a||b|cos θ</text><line x1="176" y1="10" x2="176" y2="190" stroke="#c8ccd6" stroke-width="1"/></svg>'
        explain: 空間のベクトルも、平面と同じく向きと大きさをもつ量で、成分で a = (a₁, a₂, a₃) と表せます（G-027 の平面のベクトルに、z 成分を 1 つ足したもの）。点 A(x₁, y₁, z₁) から点 B(x₂, y₂, z₂) へのベクトル AB は (x₂ − x₁, y₂ − y₁, z₂ − z₁) です。和と実数倍は成分ごとに計算し、大きさは |a| = √(a₁² + a₂² + a₃²) です。内積は a・b = a₁b₁ + a₂b₂ + a₃b₃ で、平面と同じく、なす角を θ とすると a・b = |a||b|cos θ です。とくに a・b = 0 なら、a と b は垂直です。点 A を通りベクトル d に平行な直線の上の点 P は、ある実数 t でベクトル AP = td と書けるので、(x, y, z) = (1, 0, 2) + t(1, 2, −1)、つまり x = 1 + t、y = 2t、z = 2 − t と表せます。d を直線の方向ベクトル、t をばいかいへんすうといいます。t = 2 とすると点 (3, 4, 0) で、この点は xy 平面の上にあります。a = (1, 1, 0)、b = (1, 0, 1) では a・b = 1、|a| = |b| = √2 なので cos θ = 1/2 で、θ = 60° です。2 直線のなす角は、方向ベクトルのなす角で考えます。
