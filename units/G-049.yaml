          - ["法線ベクトルを n = (a, b, c) とすると、n は AB = (−1, 2, 0)、AC = (−1, 0, 3) と垂直", "−a + 2b = 0、−a + 3c = 0 から n = (6, 3, 2)", "平面は 6(x − 1) + 3y + 2z = 0", "距離は |−6| ÷ √49 = 6/7"]
