        text: 図のように、点 A(2, 0, −1) を通り、法線ベクトルが n = (1, −3, 2) の平面があります。この平面の方程式はどれですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="16,184 230,184 306,112 92,112" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><line x1="130" y1="156" x2="130" y2="64" stroke="#f08080" stroke-width="3"/><polygon points="130,52 135,64 125,64" fill="#f08080" stroke="none"/><circle cx="130" cy="156" r="4.5" fill="currentColor"/><text x="130" y="176" font-size="14" text-anchor="middle" fill="currentColor">A(2, 0, −1)</text><text x="140" y="60" font-size="14" text-anchor="start" fill="currentColor">n = (1, −3, 2)</text></svg>'
        choices:
          - x − 3y + 2z = 0
          - 2x − z − 5 = 0
          - x − 3y + 2z − 4 = 0
          - x − 3y + 2z + 4 = 0
        answer: x − 3y + 2z = 0
        check: "[c for c, f in {'x − 3y + 2z = 0': (1, -3, 2, 0), '2x − z − 5 = 0': (2, 0, -1, -5), 'x − 3y + 2z − 4 = 0': (1, -3, 2, -4), 'x − 3y + 2z + 4 = 0': (1, -3, 2, 4)}.items() if f[0] * 2 + f[1] * 0 + f[2] * (-1) + f[3] == 0 and f[1] == -3 * f[0] and f[2] == 2 * f[0] and f[0] != 0][0]"
        hints:
          - text: 平面の上の点を P(x, y, z) とすると、n・AP = 0 です。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="16,184 230,184 306,112 92,112" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><line x1="130" y1="156" x2="230" y2="138" stroke="currentColor" stroke-width="2"/><circle cx="230" cy="138" r="4" fill="currentColor"/><text x="224" y="160" font-size="14" text-anchor="end" fill="currentColor">P(x, y, z)</text><polyline points="130,146 139.8,144.2 139.8,154.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="236" y="90" font-size="15" text-anchor="middle" fill="currentColor">n・AP = 0</text><line x1="130" y1="156" x2="130" y2="64" stroke="#f08080" stroke-width="3"/><polygon points="130,52 135,64 125,64" fill="#f08080" stroke="none"/><circle cx="130" cy="156" r="4.5" fill="currentColor"/><text x="130" y="176" font-size="14" text-anchor="middle" fill="currentColor">A(2, 0, −1)</text><text x="140" y="60" font-size="14" text-anchor="start" fill="currentColor">n = (1, −3, 2)</text></svg>'
          - AP = (x − 2, y, z + 1) なので、(x − 2) − 3y + 2(z + 1) = 0 です。
          - かっこをはずして整理しましょう。
        paths:
          - [(x − 2) − 3y + 2(z + 1) = 0, x − 3y + 2z = 0]
