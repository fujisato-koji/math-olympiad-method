      - part: わけ
        id: "0f535fe0d6"
        text: 2 点 A(x₁, y₁, z₁)、B(x₂, y₂, z₂) の距離が AB = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²) となるわけを、各辺がざひょうじくに平行で、A と B を向かい合うちょう点とする直方体を考えて、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="30,160 170,160 212,128 72,128" fill="#f3c969" fill-opacity="0.4" stroke="none"/><line x1="30" y1="160" x2="170" y2="160" stroke="currentColor" stroke-width="1.2"/><line x1="170" y1="160" x2="212" y2="128" stroke="currentColor" stroke-width="1.2"/><line x1="212" y1="128" x2="72" y2="128" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="72" y1="128" x2="30" y2="160" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="30" y1="80" x2="170" y2="80" stroke="currentColor" stroke-width="1.2"/><line x1="170" y1="80" x2="212" y2="48" stroke="currentColor" stroke-width="1.2"/><line x1="212" y1="48" x2="72" y2="48" stroke="currentColor" stroke-width="1.2"/><line x1="72" y1="48" x2="30" y2="80" stroke="currentColor" stroke-width="1.2"/><line x1="30" y1="160" x2="30" y2="80" stroke="currentColor" stroke-width="1.2"/><line x1="170" y1="160" x2="170" y2="80" stroke="currentColor" stroke-width="1.2"/><line x1="212" y1="128" x2="212" y2="48" stroke="currentColor" stroke-width="1.2"/><line x1="72" y1="128" x2="72" y2="48" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="30" y1="160" x2="212" y2="128" stroke="#f08080" stroke-width="3"/><line x1="212" y1="128" x2="212" y2="48" stroke="#7fc8f8" stroke-width="3"/><line x1="30" y1="160" x2="212" y2="48" stroke="currentColor" stroke-width="3.2"/><polyline points="202.2,129.7 202.2,119.7 212,118" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="30" cy="160" r="4.5" fill="currentColor"/><circle cx="212" cy="48" r="4.5" fill="currentColor"/><circle cx="212" cy="128" r="4.5" fill="currentColor"/><text x="60" y="182" font-size="14" text-anchor="middle" fill="currentColor">A(x₁, y₁, z₁)</text><text x="172" y="36" font-size="14" text-anchor="middle" fill="currentColor">B(x₂, y₂, z₂)</text><text x="220" y="133" font-size="13" text-anchor="start" fill="currentColor">C(x₂, y₂, z₁)</text></svg>'
        explain: 例：「点 C(x₂, y₂, z₁) をとる。A と C はどちらも平面 z = z₁ の上にあり、この平面の上の 2 点の距離と同じく、三平方の定理（G-019）より AC² = (x₂ − x₁)² + (y₂ − y₁)² である。BC は z じくに平行で BC = |z₂ − z₁|、平面 z = z₁ に垂直なので、その平面の上の直線 AC とも垂直で、∠ACB = 90° である（G-021）。△ACB でもう一度三平方の定理を使うと、AB² = AC² + BC² = (x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)² である。AB は 0 以上なので、AB = √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²) である。」と書ければよい。①「〜とする」で C を決める、② 三平方の定理を 2 回使い、2 乗の和にまとめる（|z₂ − z₁|² = (z₂ − z₁)²）、③ 約束した事実（平面に垂直な直線は、その平面の上のどの直線とも垂直、G-021）で ∠ACB = 90° と結ぶ、の 3 つがそろっているかを見る。∠ACB = 90° のわけがぬけやすい。A(1, 2, 3)、B(3, 5, 9) のような例で確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。
        hints:
          - 点 C(x₂, y₂, z₁) をとって、AC と BC の長さを考えましょう。
