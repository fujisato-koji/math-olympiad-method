# G-049 空間座標と直線・平面・球の方程式（方向ベクトルと法線ベクトル、距離と角）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019、G-021 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜3 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# ことば：空間の座標（x 軸、y 軸、z 軸、原点、xy 平面・yz 平面・zx 平面）、2 点の距離、中点、球面（球）の方程式、
#   空間のベクトルの成分・大きさ・内積、直線の方向ベクトルと媒介変数 t、平面の法線ベクトル、点と平面の距離、2 直線・2 平面のなす角。
# 前提は G-027（ベクトル）と G-021（空間図形）。G-027 はまだ中身ができていないので、地図の題と前提（G-026、G-024）から、
#   平面のベクトルの成分、和と実数倍、大きさ、内積 a・b = |a||b|cos θ = a₁b₁ + a₂b₂、垂直の条件、直線のベクトル方程式を済んだものとし、
#   空間のベクトルは「平面のベクトルに z 成分を足したもの」として 2 日目の見本で約束した（成分の計算と内積の性質は平面と同じ）。
#   平面の点と直線の距離 |ax₁ + by₁ + c| ÷ √(a² + b²) と、円の式の平方完成は G-026 で済んでいるので、思い出すと見本で使った。
#   前提のたどりに G-019（三平方の定理）、G-024（三角比、なす角の cos）、A-017（2 次方程式）、A-016（平方根）がある。
# ベクトルは文の中で「ベクトル a」「ベクトル AB」と書き、成分は (2, −1, 3)、内積は a・b と書く（矢印は画面で表せないので省いた）。
#   点は A(1, 2, 3) と書き、点とベクトルの成分の書き方が同じになるので、どちらかを文で言う。
# 外積、空間の直線の距離（ねじれの位置の 2 直線の距離）、平面の媒介変数表示、行列での表し方は扱わない（M の流れ）。
# わけの日は、(1) 2 点の距離の式（三平方の定理を 2 回）、(2) (a, b, c) が平面 ax + by + cz + d = 0 に垂直、(3) 点と平面の距離の式。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 空間の座標、2 点の距離、中点、球面の方程式　2 日目 空間のベクトル（成分、大きさ、内積、なす角）と直線（方向ベクトル）
#   3 日目 平面（法線ベクトル）、点と平面の距離、球面と平面の交わり　4 日目 わけ
#   5 日目 G-021・G-027 と混ぜる（立方体を座標に置く、直線と平面の交点、2 平面のなす角、対称な点）　6 日目 確認
# 答えは数を打つ（座標の 1 つ、距離、内積）。√ を含む値、角、式、成分は choices にした（段 5 の決まり）。
#   距離の check は、2 乗してその数になる整数をさがすか、Fraction で計算する。√ と角の check は math.isclose で選ぶ。
#   平面の式を選ぶ check は、点を通ることと、係数が法線ベクトルに比例することを調べる。
# 図は svg（D-040）。空間の見取り図は、x 軸を手前の左下、y 軸を右、z 軸を上に描き、点の位置は座標軸に平行な点線で見せる。
#   問題の答え（距離、座標）は図に書かない。
# 空間座標とベクトルは、CAD と 3D のグラフィックス、結晶の格子（H-019）、ロボットの位置と姿勢、物理の場と力の計算の入口になる（D-026）。

