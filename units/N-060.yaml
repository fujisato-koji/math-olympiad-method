# N-060 お金の計算
#
# 書き方は N-001 の頭の注のとおり。筆算の図は N-007 の頭の注のとおり。
# お金の図は丸数字で描く：① は 1 円玉、⑤ は 5 円玉、⑩ は 10 円玉、㊿ は 50 円玉（どれも 1 字）。100 円玉は丸数字がないので、文で言う。
#   check は n('㊿') * 50 + n('⑩') * 10 + n('⑤') * 5 + n('①')（丸数字はたがいに重ならない）。
# 前提は N-007 だけで、100 より大きい数（N-009）は前提にない。金額は 100 円まで（500 円玉とお札は出さない）。答えも 100 まで。
# 子にはかけ算（N-013）を使わせない。同じお金は 10 ずつ・5 ずつ数える（check は * で書く）。
# 地図の日の並びは既定（導入・わけ・わけ・確認）。2・3 日目のわけの日は、あわせていくら（2 日目）、おつりとたりない額（3 日目）を
#   新しく出すので、その日の頭に見本を置く。
# 値段は計算のための数で、実際の店の値段に合わせていない。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-009 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

