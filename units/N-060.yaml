# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 手数]
    text: 60 えんの パンと、ジュースを 1 こずつ かいました。100 えんだま 1 まいと ⑩ 1 まいで はらうと、おつりは ⑤ 1 まいと ① 2 まい でした。ジュースは いくらですか。
    answer: 43
    check: "100 + 10 - (5 + 2) - 60"
    hints:
      - はらった おかねは いくらかな。
      - おつりは いくらかな。はらった おかねから おつりを ひくと、パンと ジュースを あわせた ねだんに なるね。
      - その ねだんから、パンの ねだんを ひこう。
    paths:
      - [はらったのは 100 + 10 = 110 えん, おつりは 5 + 2 = 7 えん, 2 つで 110 − 7 = 103 えん, ジュースは 103 − 60, 43 えん]
    note: 払ったお金、おつり、合わせた値段、ジュースの値段の 4 つを順に出す。100 円玉だけで払ったと読んで 33 円とする、おつりをたしてしまう、の誤りが多い。110 円や 103 円は 100 をこえる数（N-009）。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [C-003]
    text: ㊿、⑩、⑤、① が 1 まいずつ あります。この なかから 1 まい いじょうを えらんで、おつりが でないように はらいます。はらえる きんがくは、なんとおり ありますか。
    figure: "㊿⑩⑤①"
    answer: 15
    check: "len(set(sum(c) for k in range(1, 5) for c in itertools.combinations([50, 10, 5, 1], k)))"
    hints:
      - 1 まいずつ「つかう」「つかわない」で えだわかれする じゅけいずを かこう。
      - ぜんぶ「つかわない」と はらえないので、かぞえないよ。
      - ちがう えらびかたで、おなじ きんがくに なる ことは あるかな。
    paths:
      - [㊿ ⑩ ⑤ ① の じゅんに つかう・つかわないで えだを わける, えだの さきは 2、4、8、16 と ふえる, ぜんぶ つかわない 1 つを のぞく, きんがくは どれも ちがう, 15 とおり]
      - [つかう まいすうで わける, 1 まいは 4 とおり、2 まいは 6 とおり, 3 まいは 4 とおり、4 まいは 1 とおり, 4 + 6 + 4 + 1, 15 とおり]
    note: 樹形図（C-003）で「使う・使わない」を順に分ける。どの金額もちがうこと（1、5、6、10、11、15、16、50……）を確かめてから枝の数を数える。全部使わない場合を入れて 16 とする誤りが多い。枝の数が 2 倍ずつになることは、たし算（4 + 4、8 + 8）で確かめる。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [N-059]
    text: こうえんの ボートは、15 ふん のる ごとに 20 えん です。10 じ 50 ぷんから 11 じ 35 ふんまで のりました。いくら はらいますか。
    answer: 60
    check: "(11 * 60 + 35 - (10 * 60 + 50)) // 15 * 20"
    hints:
      - のった じかんは なんぷんかな。11 じを またぐね。
      - 10 じ 50 ぷんから 11 じまでと、11 じから 11 じ 35 ふんまでに わけよう。
      - のった じかんの なかに、15 ふんは いくつ はいるかな。
    paths:
      - [10 じ 50 ぷんから 11 じまで 10 ぷん, 11 じから 11 じ 35 ふんまで 35 ふん, あわせて 45 ふんで 15 ふんが 3 つ, 20 + 20 + 20, 60 えん]
    note: かかった時間（N-059）を出してから、15 分のまとまりの数だけ 20 円をたす。10 時 50 分から 11 時 35 分を「85 分」とする誤り（1 時間を 100 分のように計算する）が多い。かけ算（N-013）は使わず、たし算で求める。
