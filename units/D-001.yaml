          - y を t の 2 次関数にして平方完成し、t の変域での最大値を求めましょう（A-020）。
        paths:
          - [2ˣ = t とすると 1/2 ≦ t ≦ 8, y = t² − 4t + 5 = (t − 2)² + 1, 軸 t = 2 から遠い t = 8 で最大, 64 − 32 + 5 = 37]
        note: 頂点の t = 2 で最小値 1 をとることに目がいって、t の変域の端を調べ忘れやすい。t = 1/2 では y = 13/4。
