  - day: 6
    items:
      - part: 思い出す
        text: log₂ 48 − log₂ 3 の値はいくつですか。
        answer: 4
        check: "Fraction((math.log(48) - math.log(3)) / math.log(2)).limit_denominator(100)"
        hints:
          - 底が同じ対数の差は、商の対数にまとめられます。
