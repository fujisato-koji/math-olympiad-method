# D-001 指数関数と対数関数（高校）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。練習の日（2〜5 日目）は新しいきまりが出るので、頭に見本を置いた。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：0 と負の整数の指数（a⁰ = 1、a⁻ⁿ = 1/aⁿ）、整数の指数の指数法則（わり算 aᵐ ÷ aⁿ = aᵐ⁻ⁿ も）。
#   2 日目：累乗根 ⁿ√a と有理数の指数 a^(m/n) = ⁿ√(aᵐ)、指数法則で計算する。
#   3 日目：指数関数 y = aˣ のグラフと性質（(0, 1) を通る、a > 1 で増加、0 < a < 1 で減少、x 軸が漸近線）、底をそろえて大小をくらべる、指数方程式。
#   4 日目：対数の定義（logₐ M = p と aᵖ = M は同じこと）と値、性質（積、商、累乗）、底の変換公式。
#   5 日目：対数関数 y = logₐ x のグラフ（y = aˣ と直線 y = x について対称）、対数の大小、対数方程式（真数が正であることを確かめる）、常用対数と桁数。
#   6 日目：わけ（3 問とも ③：a⁰ = 1 と a⁻ⁿ = 1/aⁿ は指数法則が成り立つように決めるしかない、logₐ MN = logₐ M + logₐ N、底の変換公式）。
#   7 日目：A-020（2ˣ や log₂ x を t とおいた 2 次関数の最大・最小）、A-017（t の 2 次方程式）と混ぜる、倍々に増える量と減っていく量。8 日目：確認。
# 前提は A-020（2 次関数と平方完成）。A-020 は別の係が同時に作っているので、題と前提（A-017、A-019）から、平方完成、頂点と軸、
#   定義域のある最大・最小を済んだものとみなした（2 次不等式は、A-013 がたどりにないので扱っていないとみなした）。
#   たどりにあるのは A-019、A-017（2 次方程式）、A-016（平方根、2 乗してくらべる）、A-015、A-011、A-009（累乗と指数法則）、
#   N-021（素因数分解）、N-020・N-077（小数）、N-073（大きな数）など。思い出すは A-009、A-016、A-017、A-020 と前の日から出した。
# 不等式（A-013）はたどりにないので、指数・対数の不等式は解かない。大小は「底をそろえて、増加か減少かでくらべる」だけにし、
#   「はじめてこえる」「何桁か」は、候補の整数を入れてくらべて決める（不等式の両辺を数でわる変形はしない）。
#   変域は −1 ≦ x ≦ 3 の書き方を読むだけにした（A-019 と同じ）。絶対値（N-011）もたどりにないので使わない。
# 背理法（L-011）はたどりにないので、log₂ 3 が無理数であることは扱わない。e と自然対数は数列の極限（D-002）の後なので扱わない。
#   指数が無理数のとき（2 の √2 乗）の意味は、3 日目の見本でグラフがつながるように決まると触れるだけにした。
# 書き方：累乗は上つき文字（2⁻³、aⁿ、2ˣ⁺¹、2²ˣ、aˢ⁺ᵗ）。指数が分数のときは「8^(2/3)」と書く（2 日目の見本で教える）。累乗根は「³√8」「³√(−8)」。
#   対数は底を下つき文字で「log₂ 8」「log₁₀ 2」「logₐ M」「logₘ b」と書き、真数が分数や式なら「log₃ (1/9)」「log₂ (x − 1)」とかっこでくくる。
#   常用対数の値は問題文で「log₁₀ 2 = 0.3010」のように 4 桁で与える。かける記号は「6 × 2ˣ」と書く（x と見分ける）。
# 答えは数を打つ（値、指数、方程式の解、桁数、最大・最小）。√ を含む数や log を含む数の大小、式、グラフの関係を選ぶ問題は choices。
# check：累乗の値は Fraction の累乗で正確に計算する（Fraction(5) ** -2）。累乗根は k ** n が元の数になる整数 k をさがす。
#   指数方程式は、解の候補（整数か分数 p/q）を総当たりして等しくなるものを選ぶ。対数の値は Fraction(math.log(M) / math.log(a)).limit_denominator(100)。
#   桁数は 10 ** (k − 1) <= N < 10 ** k となる k を整数のまま調べる。大小は値をくらべ、式を選ぶ問題は log₂ 3 などの値を lambda に入れてくらべる。
#   グラフの関係は、y = 3ˣ の上の点を選択肢の対称移動で移して y = log₃ x の上にのるかで調べる。最大・最小は細かくとった x の値で調べ、分数にそろえる。
# 図は svg（D-040）：y = 2ˣ と y = (1/2)ˣ、y = 2ˣ と y = log₂ x と y = x、点を読む問題の曲線。答えの値は図に書かない。
# 指数関数と対数は、数列の極限と級数（D-002）、計算量（K-014）、放射性崩壊と年代測定（P-104、W-010）、反応の速さ（H-023）、pH（H-025）、
#   利息と現在価値（F-005）、個体群の増え方（B-040）の道具になる（D-026）。

id: D-001
days:
  - day: 1
    items:
      - part: 見本
        text: 2 の累乗を、指数を 1 ずつ小さくしながら並べてみましょう。指数が 0 や負の《整数》のときは、値をどう決めればよいでしょう。
        figure: "指数｜　３｜　２｜　１｜　０｜－１｜－２\n値　｜　８｜　４｜　２｜　？｜　？｜　？"
        explain: 2³ = 8、2² = 4、2¹ = 2 のように、指数が 1 小さくなるごとに、値は 2 でわった数（半分）になります。このきまりがそのまま続くように、2⁰ = 1、2⁻¹ = 1/2、2⁻² = 1/4 と決めます。一般に、a が 0 でない数で n が正の整数のとき、a⁰ = 1、a⁻ⁿ = 1/aⁿ と決めます（なぜこう決めるのかは 6 日目）。こう決めると、指数が負の整数や 0 のときも、指数法則 aᵐ × aⁿ = aᵐ⁺ⁿ、(aᵐ)ⁿ = aᵐⁿ、(ab)ⁿ = aⁿbⁿ（A-009）がそのまま成り立ち、わり算も aᵐ ÷ aⁿ = aᵐ⁻ⁿ と指数のひき算で計算できます。たとえば 2⁵ × 2⁻³ = 2⁵⁻³ = 2² = 4、10⁻² = 1/10² = 1/100、(3⁻¹)² = 3⁻² = 1/9 です。負の指数の累乗は「負の数」ではなく、「1 をその累乗でわった《分数》」になることに気をつけましょう。
      - part: 思い出す
        text: 2⁴ × 2³ は、2 の何乗ですか。
        answer: 7
        check: "[k for k in range(1, 30) if 2 ** k == 2 ** 4 * 2 ** 3][0]"
        hints:
          - 2⁴ は、2 を 4 回かけた数です。
          - 2 を全部で何回かけることになるかを数えましょう。
          - 指数法則 aᵐ × aⁿ = aᵐ⁺ⁿ を使いましょう（A-009）。
        paths:
          - [2⁴ × 2³ = 2⁴⁺³, 2⁷, 7 乗]
      - part: 思い出す
        text: √18 × √2 の値はいくつですか。
        answer: 6
        check: "[k for k in range(1, 50) if k * k == 18 * 2][0]"
        hints:
          - √a × √b = √(ab) です（A-016）。
          - 18 × 2 を計算しましょう。
          - 2 乗するとその数になる正の数をさがしましょう。
        paths:
          - [√18 × √2 = √36, 6]
      - part: 今日
        text: 5⁻² の値はいくつですか。分数で答えましょう。
        answer: 1/25
        check: "Fraction(5) ** -2"
        hints:
          - a⁻ⁿ = 1/aⁿ です。
          - まず 5² を計算しましょう。
          - 1 をその数でわった分数にしましょう。
        paths:
          - [5⁻² = 1/5², 1/25]
        note: 5⁻² を −25 や −10 としやすい。負の指数は、負の数ではなく《逆数》（分数）を表す。
      - part: 今日
        text: 3⁵ × 3⁻⁷ の値はいくつですか。
        answer: 1/9
        check: "Fraction(3) ** 5 * Fraction(3) ** -7"
        hints:
          - 指数法則で、指数をたしましょう。
          - 5 + (−7) はいくつでしょう。
          - 指数が負の数になったら、分数に直しましょう。
        paths:
          - [3⁵ × 3⁻⁷ = 3⁵⁻⁷, 3⁻² = 1/3², 1/9]
      - part: 挑戦
        text: (2⁻² × 8)³ ÷ 4⁻¹ の値はいくつですか。
        answer: 32
        check: "(Fraction(2) ** -2 * 8) ** 3 / Fraction(4) ** -1"
        hints:
          - 8 も 4 も、2 の累乗で表しましょう。
          - かっこの中を、2 の何乗かにまとめましょう。
          - 4⁻¹ でわることは、4⁻¹ の逆数をかけることと同じです。
        paths:
          - [8 = 2³、4 = 2² とする, かっこの中は 2⁻²⁺³ = 2¹, (2¹)³ ÷ 2⁻² = 2³⁻⁽⁻²⁾ = 2⁵, 32]
          - [2⁻² × 8 = 8/4 = 2, 2³ = 8, 4⁻¹ = 1/4 でわるので 8 × 4 = 32]
        note: ÷ 4⁻¹ を ÷ 4 と読んで 2 としやすい。1/4 でわるのは 4 をかけるのと同じ。
    extra:
      - part: 今日
        text: 10⁻³ の値を、分数で答えましょう。
        answer: 1/1000
        check: "Fraction(10) ** -3"
        hints:
          - a⁻ⁿ = 1/aⁿ です。
          - 10³ はいくつでしょう。
          - 1 をその数でわった分数にしましょう。
        paths:
          - [10⁻³ = 1/10³, 1/1000]
      - part: 今日
        text: 7⁰ + 2⁻¹ の値はいくつですか。
        answer: 3/2
        accept: [1.5]
        check: "Fraction(7) ** 0 + Fraction(2) ** -1"
        hints:
          - 0 でない数の 0 乗は、いくつと決めたでしょう。
          - 2⁻¹ を分数に直しましょう。
          - 2 つの数をたしましょう。
        paths:
          - [7⁰ = 1, 2⁻¹ = 1/2, 1 + 1/2 = 3/2]
        note: 7⁰ を 0 や 7 としやすい。
      - part: 挑戦
        text: a は 0 でない数とします。a⁻² × a⁵ ÷ a⁴ は、a の何乗ですか。
        answer: −1
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([k for k in range(-10, 11) if all(Fraction(a) ** -2 * Fraction(a) ** 5 / Fraction(a) ** 4 == Fraction(a) ** k for a in (2, 3))][0])"
        hints:
          - かけ算は指数のたし算、わり算は指数のひき算です。
          - (−2) + 5 − 4 を計算しましょう。
          - 指数が負の数になってもかまいません。
        paths:
          - [a⁻² × a⁵ ÷ a⁴ = a⁻²⁺⁵⁻⁴, a⁻¹, −1 乗]

  - day: 2
    items:
      - part: 見本
        text: 3 乗すると 8 になる数や、8 の 2/3 乗とはどんな数かを考えてみましょう。
        explain: n を 2 以上の《整数》とします。n 乗すると a になる数を、a の n 乗根といいます。a が正の数のとき、n 乗根のうち正のものを ⁿ√a と書きます（2 乗根は、これまでどおり √a と書きます）。たとえば 2³ = 8 なので ³√8 = 2、3⁴ = 81 なので ⁴√81 = 3 です。n が奇数なら、負の数にも n 乗根がただ 1 つあり、(−2)³ = −8 なので ³√(−8) = −2 です。どの場合も (ⁿ√a)ⁿ = a です。次に、a が正の数、m が整数、n が正の整数のとき、a の m/n 乗を ⁿ√(aᵐ) と決めます。画面では a の m/n 乗を a^(m/n) と書きます（教科書では、指数の m/n を a の右上に小さく書きます）。ⁿ√(aᵐ) = (ⁿ√a)ᵐ なので、8^(2/3) = (³√8)² = 2² = 4 のように、先に累乗根をとると計算が楽です。とくに a^(1/n) = ⁿ√a、a^(−m/n) = 1/a^(m/n) です。こう決めると、指数が《有理数》のときも指数法則 aᵖ × aʳ = aᵖ⁺ʳ、(aᵖ)ʳ = aᵖʳ がそのまま成り立ちます。たとえば 2^(1/2) × 2^(3/2) = 2^(1/2 + 3/2) = 2² = 4 です。
      - part: 思い出す
        text: 4⁻² × 2⁷ の値はいくつですか。
        answer: 8
        check: "Fraction(4) ** -2 * 2 ** 7"
        hints:
          - 4 を 2 の累乗で表しましょう。
          - 4⁻² = (2²)⁻² を、2 の何乗かにしましょう。
          - 指数をたしてから、値にしましょう。
        paths:
          - [4⁻² = 2⁻⁴, 2⁻⁴ × 2⁷ = 2³, 8]
      - part: 思い出す
        text: √50 を a√2 の形に表すと、a はいくつですか。
        answer: 5
        check: "[a for a in range(1, 30) if a * a * 2 == 50][0]"
        hints:
          - 50 を、2 乗の数と 2 の積で表しましょう。
          - 50 = □² × 2 の □ をさがしましょう。
          - √(k² × 2) = k√2 です（A-016）。
        paths:
          - [50 = 5² × 2, √50 = 5√2, a = 5]
      - part: 今日
        text: 27^(2/3) の値はいくつですか。
        answer: 9
        check: "[k for k in range(1, 100) if k ** 3 == 27 ** 2][0]"
        hints:
          - a^(m/n) = (ⁿ√a)ᵐ です。
          - まず ³√27 を求めましょう。
          - その数を 2 乗しましょう。
        paths:
          - [³√27 = 3, 27^(2/3) = 3², 9]
      - part: 今日
        text: 16^(−3/4) の値はいくつですか。
        answer: 1/8
        accept: [0.125]
        check: "Fraction(1, [k for k in range(1, 100) if k ** 4 == 16 ** 3][0])"
        hints:
          - 指数が負なので、16^(3/4) の《逆数》です。
          - まず ⁴√16 を求めましょう。
          - その数を 3 乗して、逆数にしましょう。
        paths:
          - [⁴√16 = 2, 16^(3/4) = 2³ = 8, 16^(−3/4) = 1/8]
        note: 指数の負の符号を、答えの符号と取り違えて −8 としやすい。3/4 と 4/3 の取り違えにも気をつける。
      - part: 挑戦
        text: ³√54 ÷ ³√2 + 4^(3/2) の値はいくつですか。
        answer: 11
        check: "[k for k in range(1, 50) if k ** 3 == 54 // 2][0] + [k for k in range(1, 50) if k ** 2 == 4 ** 3][0]"
        hints:
          - ³√54 ÷ ³√2 は、指数法則で 1 つの ³√ にまとめられます。
          - 4^(3/2) = (√4)³ です。
          - 2 つの数をそれぞれ求めてから、たしましょう。
        paths:
          - [³√54 ÷ ³√2 = ³√(54 ÷ 2) = ³√27 = 3, 4^(3/2) = (√4)³ = 2³ = 8, 3 + 8 = 11]
        note: ³√54 を先に求めようとすると、整数にならずに困る。a^(1/3) ÷ b^(1/3) = (a ÷ b)^(1/3) とまとめるのがこつ。
    extra:
      - part: 今日
        text: ⁴√625 の値はいくつですか。
        answer: 5
        check: "[k for k in range(1, 50) if k ** 4 == 625][0]"
        hints:
          - 4 乗すると 625 になる正の数をさがしましょう。
          - 625 を素因数分解してみましょう。
          - 625 = □⁴ の □ です。
        paths:
          - [625 = 5⁴, ⁴√625 = 5]
      - part: 今日
        text: 2^(1/3) × 2^(5/3) の値はいくつですか。
        answer: 4
        check: "2 ** (Fraction(1, 3) + Fraction(5, 3))"
        hints:
          - 指数が《分数》でも、指数法則で指数をたせます。
          - 1/3 + 5/3 を計算しましょう。
          - 2 の何乗になるかを求めて、値にしましょう。
        paths:
          - [2^(1/3 + 5/3) = 2², 4]
      - part: 挑戦
        text: a は正の数とします。(³√(a²) × √a)⁶ は、a の何乗ですか。
        answer: 7
        check: "(Fraction(2, 3) + Fraction(1, 2)) * 6"
        hints:
          - ³√(a²) と √a を、a^(m/n) の形に直しましょう。
          - かっこの中は、指数をたします。
          - かっこの外の 6 乗は、指数を 6 倍します。
        paths:
          - [³√(a²) = a^(2/3)、√a = a^(1/2), かっこの中は a^(2/3 + 1/2) = a^(7/6), "(a^(7/6))⁶ = a⁷", 7 乗]

