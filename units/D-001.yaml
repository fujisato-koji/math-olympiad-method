        note: 3 と 4 をくらべて ³√4 としやすい。累乗根の n がちがうときは、同じ数だけ累乗して根号を外す。

  - day: 4
    items:
      - part: 見本
        text: 2 を何乗すると 8 になるでしょう。その指数を表す記号 log を学びましょう。
        explain: a を 1 でない正の数、M を正の数とします。aᵖ = M となる p はただ 1 つ決まります（y = aˣ は増加か減少のどちらかで、値はすべての正の数をとるから）。この p を logₐ M と書いて、a を底とする M の対数といい、M をこの対数の真数といいます。つまり、logₐ M = p と aᵖ = M は同じことです。たとえば 2³ = 8 なので log₂ 8 = 3、3⁻² = 1/9 なので log₃ (1/9) = −2 です。a⁰ = 1、a¹ = a なので、logₐ 1 = 0、logₐ a = 1 です。指数法則から、次の性質が成り立ちます（わけは 6 日目）。logₐ MN = logₐ M + logₐ N、logₐ (M/N) = logₐ M − logₐ N、logₐ Mᵏ = k logₐ M（k は実数）。また、底を別の正の数 m（m ≠ 1）に変える底の変換公式 logₐ b = (logₘ b)/(logₘ a) があります。たとえば log₂ 12 − log₂ 3 = log₂ (12/3) = log₂ 4 = 2、log₈ 16 = (log₂ 16)/(log₂ 8) = 4/3 です。
      - part: 思い出す
        text: 32^(3/5) の値はいくつですか。
        answer: 8
        check: "[k for k in range(1, 100) if k ** 5 == 32 ** 3][0]"
        hints:
          - a^(m/n) = (ⁿ√a)ᵐ です。
          - まず ⁵√32 を求めましょう。
          - その数を 3 乗しましょう。
        paths:
          - [⁵√32 = 2, 32^(3/5) = 2³, 8]
      - part: 思い出す
        text: 方程式 (1/2)ˣ = 16 を解きましょう。x はいくつですか。
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([x for x in range(-20, 21) if Fraction(1, 2) ** x == 16][0])"
        hints:
          - 1/2 を 2 の累乗で表しましょう。
          - (1/2)ˣ = 2⁻ˣ です。
          - 16 も 2 の累乗にして、指数をくらべましょう。
        paths:
          - [(1/2)ˣ = 2⁻ˣ, 2⁻ˣ = 2⁴, −x = 4, x = −4]
      - part: 今日
        text: log₄ 8 の値はいくつですか。
        answer: 3/2
        accept: [1.5]
        check: "Fraction(math.log(8) / math.log(4)).limit_denominator(100)"
        hints:
          - log₄ 8 = p とおくと、4ᵖ = 8 です。
          - 4 と 8 を、2 の累乗で表しましょう。
          - 2²ᵖ = 2³ から p を求めましょう。
        paths:
          - [log₄ 8 = p とする, 4ᵖ = 8, 2²ᵖ = 2³, 2p = 3, p = 3/2]
          - ["log₄ 8 = (log₂ 8)/(log₂ 4) = 3/2"]
        note: 8 ÷ 4 = 2 としやすい。対数は「何乗か」を表す。
      - part: 今日
        text: log₆ 4 + log₆ 9 の値はいくつですか。
        answer: 2
        check: "Fraction((math.log(4) + math.log(9)) / math.log(6)).limit_denominator(100)"
        hints:
          - 底が同じ対数の和は、積の対数にまとめられます。
          - 4 × 9 を計算しましょう。
          - 6 を何乗するとその数になるでしょう。
        paths:
          - [log₆ 4 + log₆ 9 = log₆ 36, 36 = 6², 2]
        note: log₆ (4 + 9) = log₆ 13 としやすい。和の対数ではなく、積の対数になる。
      - part: 挑戦
        text: log₂ 9 × log₃ 8 の値はいくつですか。
        answer: 6
        check: "Fraction(math.log(9) / math.log(2) * math.log(8) / math.log(3)).limit_denominator(100)"
        hints:
          - 底がちがうので、底の変換公式で底を 2 にそろえましょう。
          - log₂ 9 = 2 log₂ 3、log₂ 8 = 3 です。
          - log₃ 8 を、log₂ 3 を使って表しましょう。
        paths:
          - [log₂ 9 = 2 log₂ 3, "log₃ 8 = (log₂ 8)/(log₂ 3) = 3 ÷ log₂ 3", 2 log₂ 3 × 3 ÷ log₂ 3 = 6]
        note: log₂ 3 の値がわからなくても、分母と分子で消し合うことに気づくのがこつ。
    extra:
      - part: 今日
        text: log₃ (1/27) の値はいくつですか。
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(math.log(1 / 27) / math.log(3)).limit_denominator(100))"
        hints:
          - 3 を何乗すると 1/27 になるでしょう。
          - 27 = 3³ です。
          - 1/3³ を、3 の負の指数で表しましょう。
        paths:
          - [1/27 = 1/3³ = 3⁻³, log₃ (1/27) = −3]
      - part: 今日
        text: log₂ 40 − log₂ 5 の値はいくつですか。
        answer: 3
        check: "Fraction((math.log(40) - math.log(5)) / math.log(2)).limit_denominator(100)"
        hints:
          - 底が同じ対数の差は、商の対数にまとめられます。
          - 40 ÷ 5 を計算しましょう。
          - 2 を何乗するとその数になるでしょう。
        paths:
          - [log₂ 40 − log₂ 5 = log₂ 8, 2³ = 8, 3]
      - part: 挑戦
        text: log₂ 3 = a とします。log₂ 72 を a で表したものはどれですか。
        choices: [3 + 2a, 6a, 2 + 3a, 3 + a²]
        answer: 3 + 2a
        check: "[c for c, f in {'3 + 2a': lambda a: 3 + 2 * a, '6a': lambda a: 6 * a, '2 + 3a': lambda a: 2 + 3 * a, '3 + a²': lambda a: 3 + a * a}.items() if abs(f(math.log2(3)) - math.log2(72)) < 1e-9][0]"
        hints:
          - 72 を素因数分解しましょう（N-021）。
          - 積の対数は和に、累乗の対数は何倍かになります。
          - log₂ 2 = 1 です。
        paths:
          - [72 = 2³ × 3², log₂ 72 = log₂ 2³ + log₂ 3², 3 + 2a]
        note: log₂ 3² を (log₂ 3)² = a² としやすい。logₐ Mᵏ = k logₐ M。

