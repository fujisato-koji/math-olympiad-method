        explain: a を 1 でない正の数とするとき、y = aˣ を、a を底とする指数関数といいます。x は、2 日目までの《整数》や《分数》だけでなく、√2 のような数もとれます（そのときの値は、グラフが切れずにつながるように決まります）。図は y = 2ˣ（実線）と y = (1/2)ˣ（点線）のグラフです。どちらも点 (0, 1) を通り（a⁰ = 1）、y の値はいつも正で、グラフは x 軸より上にあります。y = 2ˣ は、x が増えると y も増え、x を小さくしていくと x 軸に限りなく近づきます。このような直線を漸近線といいます。y = (1/2)ˣ = 2⁻ˣ は、x が増えると y が減り、グラフは y = 2ˣ のグラフと y 軸について対称です。一般に、a > 1 なら y = aˣ は増加し、0 < a < 1 なら減少します。増加する関数では、指数の大きいほうが値も大きいので、底をそろえれば大小をくらべられます。たとえば √8 = 2^(3/2)、³√16 = 2^(4/3) で、3/2 のほうが 4/3 より大きいので、√8 のほうが大きい数です。また、x の値がちがえば aˣ の値もちがうので、4ˣ = 8 のような方程式は、底を 2 にそろえて 2²ˣ = 2³、指数をくらべて 2x = 3、x = 3/2 と解けます。
      - part: 思い出す
        text: 9^(3/2) の値はいくつですか。
        answer: 27
        check: "[k for k in range(1, 100) if k ** 2 == 9 ** 3][0]"
        hints:
          - a^(m/n) = (ⁿ√a)ᵐ です。
          - まず √9 を求めましょう。
          - その数を 3 乗しましょう。
        paths:
          - [√9 = 3, 9^(3/2) = 3³, 27]
      - part: 思い出す
        text: (1/3)⁻² の値はいくつですか。
        answer: 9
        check: "Fraction(1, 3) ** -2"
        hints:
          - a⁻ⁿ = 1/aⁿ です。
          - まず (1/3)² を計算しましょう。
          - 1 をその数でわりましょう。
        paths:
          - [(1/3)² = 1/9, 1 ÷ (1/9) = 9]
          - [(1/3)⁻² = (3⁻¹)⁻² = 3², 9]
      - part: 今日
        text: 次のうち、いちばん大きい数はどれですか。
        choices: [√2, ³√4, ⁴√8, 3 つとも等しい]
        answer: ⁴√8
        check: "[c for c, v in {'√2': 2 ** (1 / 2), '³√4': 4 ** (1 / 3), '⁴√8': 8 ** (1 / 4), '3 つとも等しい': -1}.items() if v == max([2 ** (1 / 2), 4 ** (1 / 3), 8 ** (1 / 4)])][0]"
        hints:
          - 3 つの数を、どれも 2 の累乗 2^(m/n) の形で表しましょう。
          - 指数の分数どうしの大小をくらべましょう。
          - y = 2ˣ は増加する関数です。
        paths:
          - [√2 = 2^(1/2)、³√4 = 2^(2/3)、⁴√8 = 2^(3/4), 1/2 < 2/3 < 3/4, y = 2ˣ は増加するので ⁴√8 がいちばん大きい]
        note: 累乗根の n が大きいほど小さい、と思いこみやすい。中身の数もちがうので、底をそろえてくらべる。
      - part: 今日
        text: 方程式 8ˣ = 32 を解きましょう。x はいくつですか。
        answer: 5/3
        check: "[Fraction(p, q) for q in range(1, 10) for p in range(-30, 31) if abs(8 ** (p / q) - 32) < 1e-9][0]"
        hints:
          - 8 と 32 を、2 の累乗で表しましょう。
          - (2³)ˣ = 2³ˣ です。
          - 両辺の指数をくらべて、x の 1 次方程式を解きましょう。
        paths:
          - [8 = 2³、32 = 2⁵, 2³ˣ = 2⁵, 3x = 5, x = 5/3]
        note: 32 ÷ 8 = 4 のように、わり算で答えようとしやすい。
      - part: 挑戦
        text: 方程式 2ˣ⁺¹ + 2ˣ⁻¹ = 40 を解きましょう。x はいくつですか。
        answer: 4
        check: "[x for x in range(-10, 11) if Fraction(2) ** (x + 1) + Fraction(2) ** (x - 1) == 40][0]"
        hints:
          - 2ˣ⁺¹ = 2 × 2ˣ、2ˣ⁻¹ = (1/2) × 2ˣ です。
          - 左辺を 2ˣ でくくりましょう。
          - 2ˣ がいくつになるかを求め、2 の何乗かを考えましょう。
        paths:
          - [2 × 2ˣ + (1/2) × 2ˣ = 40, (5/2) × 2ˣ = 40, 2ˣ = 16 = 2⁴, x = 4]
        note: 2ˣ⁺¹ + 2ˣ⁻¹ を 2²ˣ のように指数どうしをたしてしまいやすい。指数法則は積の法則で、和には使えない。
