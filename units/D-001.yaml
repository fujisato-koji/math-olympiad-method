        text: ある細菌は 20 分ごとに 2 倍に増えます。はじめに 1 個だったとき、細菌の数がはじめて 100 万個（10⁶ 個）をこえるのは何分後ですか。log₁₀ 2 = 0.3010 とします。
        answer: 400
        check: "20 * [n for n in range(1, 100) if 2 ** n > 10 ** 6][0]"
        hints:
          - 2 倍に増えることが n 回あると、細菌は 2ⁿ 個です。
          - log₁₀ 2ⁿ = 0.3010n が 6 をこえるかどうかでくらべましょう。
          - 0.3010n がはじめて 6 をこえる《整数》 n をさがし、時間に直しましょう。
        paths:
          - [n 回増えると 2ⁿ 個, log₁₀ 2¹⁹ = 5.719 で 6 より小さい, log₁₀ 2²⁰ = 6.020 で 6 より大きい, n = 20 なので 20 × 20 = 400 分後]
        note: 6 ÷ 0.3010 = 19.93… を 19 と切り捨てやすい。19 回では 2¹⁹ = 524288 で、まだ 100 万に届かない。
