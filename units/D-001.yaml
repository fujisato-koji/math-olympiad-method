        explain: a を 1 でない正の数とするとき、y = logₐ x を、a を底とする対数関数といいます。真数は正なので、x は正の数だけをとります。点 (s, t) が y = 2ˣ のグラフの上にあるとき、t = 2ˢ なので s = log₂ t となり、x 座標と y 座標を入れかえた点 (t, s) は y = log₂ x のグラフの上にあります。点 (s, t) と点 (t, s) は直線 y = x について対称なので、y = log₂ x のグラフは y = 2ˣ のグラフと直線 y = x について対称です。グラフは点 (1, 0) を通り、y 軸が漸近線です。a > 1 なら x が増えると y も増え、0 < a < 1 なら減ります。対数の式を含む方程式は、真数が正であることを確かめながら解きます。たとえば log₂ (x − 1) = 3 は、x − 1 = 2³ = 8 で x = 9、このとき真数 x − 1 = 8 は正です。また、底が 10 の対数を常用対数といいます。log₁₀ 2 = 0.3010 とすると、log₁₀ 2²⁰ = 20 × 0.3010 = 6.020 です。y = 10ˣ は増加するので、6 < 6.020 < 7 から 10⁶ < 2²⁰ < 10⁷ です。10⁶ は 7 桁の数のうちいちばん小さく、10⁷ は 8 桁の数のうちいちばん小さいので、2²⁰ は 7 桁の数です（実際 2²⁰ = 1048576）。
      - part: 思い出す
        text: log₅ 125 の値はいくつですか。
        answer: 3
        check: "Fraction(math.log(125) / math.log(5)).limit_denominator(100)"
        hints:
          - 5 を何乗すると 125 になるでしょう。
          - log₅ 125 = p とおくと、5ᵖ = 125 です。
          - 125 を 5 の累乗で表しましょう。
        paths:
          - [125 = 5³, log₅ 125 = 3]
      - part: 思い出す
        text: log₁₂ 3 + log₁₂ 48 の値はいくつですか。
        answer: 2
        check: "Fraction((math.log(3) + math.log(48)) / math.log(12)).limit_denominator(100)"
        hints:
          - 底が同じ対数の和は、積の対数にまとめられます。
          - 3 × 48 を計算しましょう。
          - 12 を何乗するとその数になるでしょう。
        paths:
          - [log₁₂ 3 + log₁₂ 48 = log₁₂ 144, 144 = 12², 2]
      - part: 今日
        text: 方程式 log₂ (3x + 1) = 4 を解きましょう。x はいくつですか。
        answer: 5
        check: "[x for x in range(-20, 21) if 3 * x + 1 > 0 and 3 * x + 1 == 2 ** 4][0]"
        hints:
          - logₐ M = p は、aᵖ = M と同じことです。
          - 3x + 1 は 2 の何乗に等しいでしょう。
          - 1 次方程式を解いたら、真数が正になるかを確かめましょう。
        paths:
          - [3x + 1 = 2⁴ = 16, 3x = 15, x = 5, 真数は 16 で正]
      - part: 今日
        text: 3³⁰ は何桁の数ですか。log₁₀ 3 = 0.4771 とします。
        answer: 15
        check: "[k for k in range(1, 100) if 10 ** (k - 1) <= 3 ** 30 < 10 ** k][0]"
        hints:
          - log₁₀ 3³⁰ = 30 log₁₀ 3 を計算しましょう。
          - 3³⁰ が 10 の何乗と何乗の間にあるかを考えましょう。
          - 10ⁿ 以上 10ⁿ⁺¹ より小さい《整数》は、何桁でしょう。
        paths:
          - [log₁₀ 3³⁰ = 30 × 0.4771 = 14.313, 14 < 14.313 < 15 なので 10¹⁴ < 3³⁰ < 10¹⁵, 15 桁]
        note: 14.313 の整数の部分の 14 を、そのまま答えにしやすい。10¹⁴ が 15 桁の数であることを確かめる。
      - part: 挑戦
        text: 方程式 log₃ (x + 2) + log₃ (x − 4) = 3 を解きましょう。x はいくつですか。
        answer: 7
        check: "[x for x in range(-50, 51) if x + 2 > 0 and x - 4 > 0 and (x + 2) * (x - 4) == 27][0]"
        hints:
          - 左辺を、1 つの対数にまとめましょう。
          - (x + 2)(x − 4) は 3 の何乗に等しいでしょう。
          - 2 次方程式の解のうち、2 つの真数がどちらも正になるものだけが答えです。
        paths:
          - [log₃ (x + 2)(x − 4) = 3, (x + 2)(x − 4) = 27, x² − 2x − 35 = 0, (x − 7)(x + 5) = 0, x = −5 では真数 x − 4 が負なので x = 7]
        note: 2 次方程式の解 x = −5 を答えに残しやすい。はじめの式の真数 x + 2 と x − 4 が正かを、解ごとに確かめる。
