      - part: 今日
        text: log₄ 32 の値はいくつですか。
        answer: 5/2
        accept: [2.5]
        check: "Fraction(math.log(32) / math.log(4)).limit_denominator(100)"
        hints:
          - log₄ 32 = p とおくと、4ᵖ = 32 です。
          - 4 と 32 を、2 の累乗で表しましょう。
          - 指数をくらべて p を求めましょう。
        paths:
          - [4ᵖ = 32, 2²ᵖ = 2⁵, 2p = 5, p = 5/2]
          - ["log₄ 32 = (log₂ 32)/(log₂ 4) = 5/2"]
      - part: わけ
        text: 指数が 0 や負の《整数》のときも、指数法則 aᵐ × aⁿ = aᵐ⁺ⁿ が成り立つようにしたいとします。そのためには、a⁰ = 1、a⁻ⁿ = 1/aⁿ（a は 0 でない数、n は正の整数）と決めるしかありません。このわけを、筋道を立てて書きましょう。
        explain: 例：「a は 0 でない数、n は正の整数とする。m = 0 のときも指数法則が成り立つとすると、a⁰ × aⁿ = a⁰⁺ⁿ = aⁿ である。aⁿ は 0 でないので、両辺を aⁿ でわって a⁰ = 1 となる。次に、m = −n のときも成り立つとすると、a⁻ⁿ × aⁿ = a⁻ⁿ⁺ⁿ = a⁰ = 1 である。両辺を aⁿ でわって a⁻ⁿ = 1/aⁿ となる。よって、指数法則が成り立つようにするには、a⁰ = 1、a⁻ⁿ = 1/aⁿ と決めるしかない。」と書ければよい。①「〜とする」で a と n を決め、法則が成り立つと仮定する、② 指数法則で式を変形する（指数のたし算）、③ 約束した事実（0 でない数でわってよい、1 つ目で示した a⁰ = 1 を 2 つ目で使う）で結ぶ、の 3 つがそろっているかを見る。2³ ÷ 2³ = 1 のような例で 2⁰ = 1 を確かめただけで終わっていたら、例ではすべての a と n を示せないことを話す。ここで示したのは「法則を守るなら、ほかの決め方はない」という向きで、反対に「こう決めれば法則がくずれない」ことは a⁻² × a⁵ = a⁵/a² = a³ のように確かめられることにも触れる。0⁰ や 0⁻¹ を決めないのは、途中で 0 でわることになるからだと話す。
        hints:
          - m = 0 のとき、法則 aᵐ × aⁿ = aᵐ⁺ⁿ はどんな式になるでしょう。
          - aⁿ が 0 でないことを使って、両辺をわりましょう。
          - 次に m = −n とおいて、a⁻ⁿ × aⁿ を考えましょう。
        paths:
          - [a ≠ 0、n は正の整数とする, a⁰ × aⁿ = aⁿ なので a⁰ = 1, a⁻ⁿ × aⁿ = a⁰ = 1 なので a⁻ⁿ = 1/aⁿ]
      - part: わけ
        text: a を 1 でない正の数、M と N を正の数とします。logₐ MN = logₐ M + logₐ N が成り立つわけを、筋道を立てて書きましょう。
        explain: 例：「s = logₐ M、t = logₐ N とする。対数の定義から M = aˢ、N = aᵗ である。指数法則から MN = aˢ × aᵗ = aˢ⁺ᵗ となる。対数の定義から、これは logₐ MN = s + t ということである。よって logₐ MN = logₐ M + logₐ N である。」と書ければよい。①「〜とする」で s と t を決める、② 定義で指数の式に直し、指数法則で変形する、③ 約束した事実（対数の定義 logₐ M = p ⇔ aᵖ = M）にもどして結ぶ、の 3 つがそろっているかを見る。log₂ (4 × 8) = 5 = 2 + 3 のような例で確かめただけなら、例ではすべての M と N を示せないことを話す。同じ筋道で、logₐ (M/N) = logₐ M − logₐ N（aˢ ÷ aᵗ = aˢ⁻ᵗ）と logₐ Mᵏ = k logₐ M（(aˢ)ᵏ = aˢᵏ）も示せることに触れる。和の対数は分けられない（log₂ (4 + 4) = 3 だが log₂ 4 + log₂ 4 = 4）ことも話す。
        hints:
          - s = logₐ M、t = logₐ N とおきましょう。
          - 対数の定義を使って、M と N を a の累乗で表しましょう。
          - MN を指数法則で計算し、対数の定義にもどしましょう。
        paths:
          - [s = logₐ M、t = logₐ N とする, M = aˢ、N = aᵗ, MN = aˢ⁺ᵗ, logₐ MN = s + t]
      - part: わけ
        text: a と b を正の数（a ≠ 1）、m を 1 でない正の数とします。底の変換公式 logₐ b = (logₘ b)/(logₘ a) が成り立つわけを、筋道を立てて書きましょう。
        explain: 例：「s = logₐ b とする。対数の定義から aˢ = b である。両辺は等しい正の数なので、m を底とする対数も等しく、logₘ aˢ = logₘ b。性質 logₘ Mᵏ = k logₘ M から s logₘ a = logₘ b となる。a ≠ 1 なので logₘ a ≠ 0 である（logₘ a = 0 なら a = m⁰ = 1 になってしまう）。両辺を logₘ a でわって s = (logₘ b)/(logₘ a)。よって logₐ b = (logₘ b)/(logₘ a) である。」と書ければよい。①「〜とする」で s を決める、② 両辺の対数をとって式を変形する、③ 約束した事実（logₘ Mᵏ = k logₘ M、対数の定義、0 でない数でわる）で結ぶ、の 3 つがそろっているかを見る。logₘ a が 0 でないことを確かめずにわっていたら、そこを問う。log₄ 8 = 3/2 を底 2 で確かめただけなら、例ではすべての場合を示せないことを話す。b = m とすると logₐ m = 1/(logₘ a) となり、4 日目の挑戦の消し合いはこれを使っていることにも触れる。
        hints:
          - s = logₐ b とおき、指数の式に直しましょう。
          - その式の両辺の、m を底とする対数をとりましょう。
          - logₘ a でわってよいわけを確かめましょう。
        paths:
          - [s = logₐ b とする, aˢ = b, logₘ aˢ = logₘ b, s logₘ a = logₘ b, logₘ a ≠ 0 なのでわる]
