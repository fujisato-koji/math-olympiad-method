# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 数]
    uses: [A-020]
    text: x は正の数とします。log₂ (2x) × log₂ (x/16) の最小値はいくつですか。
    answer: −25/4
    accept: [−6.25]
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(min(math.log2(2 * x) * math.log2(x / 16) for x in [2 ** (k / 100) for k in range(-500, 1000)])).limit_denominator(100))"
    hints:
      - log₂ x = t とおくと、2 つの対数はどちらも t の 1 次式になります。
      - 積の対数は和に、商の対数は差になります。log₂ 16 はいくつでしょう。
      - t はすべての実数をとるので、t の 2 次関数として平方完成しましょう。
    paths:
      - [log₂ x = t とする, log₂ (2x) = 1 + t、log₂ (x/16) = t − 4, (1 + t)(t − 4) = t² − 3t − 4, "= (t − 3/2)² − 25/4", t = 3/2 で最小値 −25/4]
    note: 対数の性質で 2 つの対数を t の 1 次式に直し、A-020 の平方完成につなぐ。軸が t = 3/2 と《分数》になり、−9/4 − 4 の計算でまちがえやすい。最小になるのは x = 2^(3/2) = 2√2 のときで、x が《整数》にならないので、x を試して探すことはできない。
  - part: 離
    kinds: [道筋]
    text: x、y を実数とします。2ˣ = 3ʸ = 12 のとき、2/x + 1/y の値はいくつですか。
    answer: 1
    check: "(lambda x, y: Fraction(2 / x + 1 / y).limit_denominator(100))(math.log(12, 2), math.log(12, 3))"
    hints:
      - x と y を、それぞれ対数で表しましょう。
      - 1/x は、底の変換公式を使うと、底が 12 の対数になります。
      - 2/x + 1/y を、底が 12 の対数 1 つにまとめましょう。
    paths:
      - [x = log₂ 12、y = log₃ 12, 1/x = log₁₂ 2、1/y = log₁₂ 3, 2 log₁₂ 2 + log₁₂ 3 = log₁₂ (4 × 3) = log₁₂ 12 = 1]
      - [12 = 2ˣ より 2 = 12^(1/x)、12 = 3ʸ より 3 = 12^(1/y), 4 × 3 = 12^(2/x) × 12^(1/y) = 12^(2/x + 1/y), 12 = 12¹ なので 2/x + 1/y = 1]
    note: x と y はどちらもきりのよい数にならないので、値を求めて代入する道はとれない。《逆数》をとると底が 12 にそろう、と見ぬくのが離。2 本目は対数を使わず、12 を底にした累乗で表す道。
  - part: 離
    kinds: [数, 手数]
    text: 3⁵⁰ をふつうに書いたとき、最高位の数字（いちばん左の数字）は何ですか。log₁₀ 2 = 0.3010、log₁₀ 3 = 0.4771、log₁₀ 7 = 0.8451 とします。
    answer: 7
    check: "[3 ** 50 // 10 ** k for k in range(0, 60) if 10 ** k <= 3 ** 50 < 10 ** (k + 1)][0]"
    hints:
      - log₁₀ 3⁵⁰ を計算し、整数の部分と小数の部分に分けましょう。
      - 3⁵⁰ = 10²³ × 10^(小数の部分) と表すと、最高位の数字は 10^(小数の部分) の整数の部分で決まります。
      - 小数の部分を、log₁₀ 7 や log₁₀ 8 = 3 log₁₀ 2 とくらべましょう。
    paths:
      - [log₁₀ 3⁵⁰ = 50 × 0.4771 = 23.855, 3⁵⁰ = 10²³ × 10^0.855, log₁₀ 7 = 0.8451 < 0.855 < 0.9030 = log₁₀ 8, 7 < 10^0.855 < 8 なので最高位の数字は 7]
    note: 桁数（24 桁）を求める問題の先にある。小数の部分 0.855 を、いくつもの対数の値とくらべる手数が要る。与えた対数は 4 桁の近い値で、50 倍しても誤差は 0.003 ほどなので、0.8451 と 0.855 の差（約 0.01）で結論は変わらないことにも触れる。
