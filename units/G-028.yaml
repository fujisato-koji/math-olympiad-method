# G-028 三角形の五心
#
# 書き方は N-001 の頭の注のとおり。
# 五心：外心 O（3 辺の垂直二等分線の交点、外接円の中心）、内心 I（3 つの角の二等分線の交点、内接円の中心）、
#   重心 G（3 本の中線の交点、中線を頂点から 2 : 1 に分ける）、垂心 H（3 本の垂線の交点）、
#   傍心 J（1 つの内角の二等分線と、残り 2 つの外角の二等分線の交点、傍接円の中心。三角形 1 つに 3 つある）。
# 3 本が 1 点で交わるわけ：外心と内心は「2 本の交点が 3 本目の上にもある」（点の集まりの見方）、
#   重心は中点連結定理と相似（G-020）、垂心は頂点を通る平行線で大きい三角形をつくり、その外心に帰着させる。
#   外心・内心・重心のわけは 10 日目、垂心のわけは 6 日目に置いた。
# 前提で使う事実：円周角の定理（G-018）、中点連結定理と相似（G-020）、内接四角形・2 つの直角の円・接線と半径・接線の長さ（G-023）。
#   「線分の両はしから等しい距離の点は垂直二等分線の上」「角の 2 辺から等しい距離の点は角の二等分線の上」は、
#   二等辺三角形と直角三角形の合同（G-017）から言えることとして、1 日目と 3 日目の見本で言い直した（作図の G-022 は前提にない）。
#   角の二等分線の定理（G-042）と三平方の定理（G-019）は前提にないので、内心が角の二等分線を分ける比や、
#   辺の長さを三平方で求める問題は扱わない。直角三角形の 3 辺は 3、4、5 のように問題で与える。
#   内心と傍心の補題、九点円、オイラー線は G-033、等角共役は G-045 で扱う。ここでは ∠BAH = ∠OAC と、
#   H を BC について対称に移した点が外接円の上にあること、∠A = 60° で B、C、O、H、I が同じ円の上にあることまでにした。
# 図は svg（D-040）。三角形は決めた角で描き、五心は座標から計算して置いた（角は本当の大きさ、長さの比はおおよそ）。
#   求める角は x と書いた。図の O は外心、I は内心、G は重心、H は垂心、J は傍心。
# 長さの答えは cm の数（半分は小数で、分数も正しいとする）。比の答えは選ぶ問題にし、YAML では引用符で囲む。
# 地図に plan がないので既定の並び（導入・練習 8 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 外心（OA = OB = OC、∠BOC = 2∠A）　2 日目 外心の位置（鋭角・直角・鈍角）　3 日目 内心（∠BIC = 90° + ∠A ÷ 2）
#   4 日目 内接円と長さ（接線の長さ、面積 = 半径 × 3 辺の和 ÷ 2）　5 日目 重心（2 : 1、面積の 6 等分）
#   6 日目 垂心（∠BHC = 180° − ∠A、3 本が 1 点で交わるわけ）　7 日目 垂心と外接円・外心（対称な点、∠BAH = ∠OAC）
#   8 日目 傍心（∠BJC = 90° − ∠A ÷ 2、∠IBJ = 90°）　9 日目 正三角形・二等辺三角形・直角三角形の五心
#   10 日目 わけ（外心、内心、重心）　11 日目 G-018・G-020・G-023 と混ぜる　12 日目 確認
# check：角と長さと面積の式。外心と垂心の位置を選ぶ問題は、いちばん大きい角と 90 をくらべる式。
#   五心の名前や性質を選ぶ問題は約束ごとなので check を付けない。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-022 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

