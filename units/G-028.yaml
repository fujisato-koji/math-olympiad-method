    answer: 1
    check: "(lambda r: 12 // 3 - r if 9 // 3 == r else None)((9 + 12 - 15) // 2)"
    hints:
      - 内心 I は、3 つの辺から等しい距離（内接円の半径）にあるね。直角三角形の内接円の半径を求めよう。
      - 重心 G は中線を 2:1 に分ける点だよ。G から辺 CA までの距離と、辺 BC までの距離を、相似で求めよう。
      - I と G の、辺 CA からの距離どうし、辺 BC からの距離どうしをくらべよう。
    paths:
      - [内接円の半径 = (9 + 12 − 15) ÷ 2 = 3 で、I は CA からも BC からも 3, B から CA までの距離は 9、G はその 1/3 で 3, A から BC までの距離は 12、G はその 1/3 で 4, I と G はどちらも CA から 3 なので、GI は CA に平行, GI = 4 − 3 = 1 cm]
      - [C から CA の向きに何 cm、CB の向きに何 cm で点の位置を表す, I は（3、3）, 中線 BM の M は（6、0）で、G は M から B へ 1/3 進んだ（4、3）, GI = 4 − 3 = 1 cm]
    note: 内心と重心という別々の点を、辺からの距離という同じ物差しで並べるのが道筋の要点。重心から辺までの距離が、向かいの頂点からの距離の 1/3 になることを相似（G-020）で出す。GI が CA に平行だと気づけば、ひき算 1 回で終わる。
