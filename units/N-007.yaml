          - 70 は、10 の まとまりが いくつかな。
          - まとまりの かずを たして、10 が いくつ ぶんか かんがえよう。
        paths:
          - [20 は 10 が 2 つ、70 は 10 が 7 つ, 2 + 7 = 9, 10 が 9 つで 90]
      - part: 今日
        text: 90 − 60 は いくつですか。
