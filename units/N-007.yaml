# N-007 2 けたのたし算とひき算
#
# 書き方は N-001 の頭の注のとおり。📦 と 🍬、とびとびの数の並びの図と check は N-006 の頭の注のとおり。
# 筆算の図は、全角の数字・全角の空白・全角の「＋」「－」で位をそろえる（半角や U+2212 の − だと字の幅がそろわない）。
#   図は式を縦に書いただけなので、check は式の計算で確かめる。
# 数は 100 まで（N-006 の範囲。100 より大きい数は N-009）。答えも 100 まで。
# お金の計算は N-060（この単元の後）なので、場面にお金を使わない。
# 地図の plan にわけの日がないので、練習の日（2〜4 日目）と混ぜるの日（5 日目）にわけを 1 問ずつ置く。
# 練習の日はどれも新しい計算の形が出るので、その日の頭に見本を置く。

