        answer: 80
        check: "Fraction(fig.split('、')[0]) + 10 * fig.split('、').index('□')"
        hints:
          - 60、70 と、こえに だして よもう。
          - 10 の まとまりが 1 つずつ ふえて いるね。
          - 70 に 10 を たすと、いくつかな。
        paths:
          - [70 の つぎは 70 + 10, 80]
