      - part: 見本
        text: 📦 は 10 の まとまりです。30 + 40 を かんがえよう。
        figure: "📦📦📦\n📦📦📦📦"
        explain: 30 は 10 の まとまりが 3 つ、40 は 10 の まとまりが 4 つ。あわせて 7 つで 70 です。3 + 4 = 7 と おなじように、まとまりの かずで けいさん できます。ひきざんも おなじで、70 − 40 は まとまり 7 つから 4 つ とって 3 つ、30 です。
