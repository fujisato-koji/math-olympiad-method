        answer: 50
        check: "n('📦') * 10"
        hints:
          - 📦 を「10、20…」と かぞえよう。
          - ばらの あめは あるかな。
          - さいごに いった かずが こたえだよ。
        paths:
          - [10、20、30、40、50, 50]
      - part: 思い出す
        text: 10 ずつ ふえて います。□に はいる かずは なんですか。
