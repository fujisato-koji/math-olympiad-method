            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="95" cy="80" r="16" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="87" y1="80" x2="103" y2="80" stroke="currentColor" stroke-width="1.5"/><line x1="95" y1="72" x2="95" y2="88" stroke="currentColor" stroke-width="1.5"/><text x="95" y="140" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">H-1</text><circle cx="233" cy="93.9" r="16" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="225" y1="93.9" x2="241" y2="93.9" stroke="currentColor" stroke-width="1.5"/><line x1="233" y1="85.9" x2="233" y2="101.9" stroke="currentColor" stroke-width="1.5"/><circle cx="217" cy="66.1" r="16" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="225" y="140" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">H-2</text><circle cx="107.1" cy="180" r="7" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="103.6" y1="180" x2="110.6" y2="180" stroke="currentColor" stroke-width="1.5"/><line x1="107.1" y1="176.5" x2="107.1" y2="183.5" stroke="currentColor" stroke-width="1.5"/><text x="119.1" y="185" font-size="13" text-anchor="start" fill="currentColor">陽子</text><circle cx="167.8" cy="180" r="7" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="179.8" y="185" font-size="13" text-anchor="start" fill="currentColor">中性子</text></svg>'
          - 何が同じで、何がちがうかを、1 つずつ書きましょう。
        paths:
          - [陽子が同じで中性子がちがう, H-1 と H-2 はどちらも陽子 1, 同じ元素の同位体]
          - [H-1 は質量数 1、H-2 は質量数 2, 原子番号はどちらも 1, 質量数だけちがう同じ元素]
        explain: 「同位体は、陽子の数が同じで、中性子の数がちがう原子核。H-1 は陽子 1、中性子 0、H-2 は陽子 1、中性子 1。陽子の数が同じなので、どちらも水素です。」と書ければよい。① 陽子の数が同じ、② 中性子の数がちがう、③ 同じ元素のなかま。子どもには、質量数のちがいも確かめさせます。

  - day: 2
    items:
      - part: 見本
        id: "807cbf63b7"
        text: |-
          原子核が放射線を出して、別の原子核に変わることを崩壊といいます。
          α 崩壊：陽子 2 個と中性子 2 個のかたまり（α 粒子、He-4 の原子核）が飛び出します。例：Ra-226 → Rn-222 + He-4。
          β⁻ 崩壊：中性子 1 個が陽子に変わり、電子 e⁻ が飛び出します（反ニュートリノ ν̄ という小さな粒子もいっしょに出ます）。例：C-14 → N-14 + e⁻ + ν̄。
          γ 崩壊：エネルギーの高い原子核が、光のなかまの γ 線を出して落ち着きます。陽子と中性子の数は変わりません。
