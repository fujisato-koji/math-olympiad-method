      - part: 見本
        id: "82942b7401"
        text: |-
          崩壊してできた原子核が、また崩壊することがあります。崩壊は、つぎつぎにつながって起こります。
          例：Th-232 →（α）→ Ra-228 →（β⁻）→ Ac-228 →（β⁻）→ Th-228。
          図では、横に原子番号、たてに質量数をとっています。α 崩壊では原子番号が 2、質量数が 4 減るので、左下へ進みます。β⁻ 崩壊では原子番号が 1 ふえるので、右へ 1 つ進みます。
        svg: '<svg viewBox="0 0 320 208" xmlns="http://www.w3.org/2000/svg"><line x1="72" y1="40" x2="72" y2="166" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="72" y="184" font-size="13" text-anchor="middle" fill="currentColor">87</text><line x1="128" y1="40" x2="128" y2="166" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="128" y="184" font-size="13" text-anchor="middle" fill="currentColor">88</text><line x1="184" y1="40" x2="184" y2="166" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="184" y="184" font-size="13" text-anchor="middle" fill="currentColor">89</text><line x1="240" y1="40" x2="240" y2="166" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="240" y="184" font-size="13" text-anchor="middle" fill="currentColor">90</text><line x1="296" y1="40" x2="296" y2="166" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="296" y="184" font-size="13" text-anchor="middle" fill="currentColor">91</text><line x1="60" y1="64" x2="310" y2="64" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="34" y="69" font-size="13" text-anchor="middle" fill="currentColor">232</text><line x1="60" y1="144" x2="310" y2="144" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6"/><text x="34" y="149" font-size="13" text-anchor="middle" fill="currentColor">228</text><text x="34" y="30" font-size="12" text-anchor="middle" fill="currentColor">質量数</text><text x="190" y="200" font-size="13" text-anchor="middle" fill="currentColor">原子番号</text><line x1="222.1" y1="74.5" x2="152.2" y2="128.6" stroke="currentColor" stroke-width="2"/><polygon points="145.9,133.5 149.8,125.5 154.7,131.8" fill="currentColor"/><text x="174" y="100" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">α</text><line x1="146" y1="144" x2="159" y2="144" stroke="currentColor" stroke-width="2"/><polygon points="166,144 159,147.5 159,140.5" fill="currentColor"/><text x="156" y="124" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">β⁻</text><line x1="202" y1="144" x2="215" y2="144" stroke="currentColor" stroke-width="2"/><polygon points="222,144 215,147.5 215,140.5" fill="currentColor"/><text x="212" y="124" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">β⁻</text><rect x="222" y="50" width="36" height="28" rx="6" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="240" y="70" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">Th</text><rect x="110" y="130" width="36" height="28" rx="6" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="128" y="150" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">Ra</text><rect x="166" y="130" width="36" height="28" rx="6" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="184" y="150" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">Ac</text><rect x="222" y="130" width="36" height="28" rx="6" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="240" y="150" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">Th</text></svg>'
        explain: |-
          Th-232（原子番号 90、質量数 232）は、α 崩壊で Ra-228（88、228）になります。
          Ra-228 は β⁻ 崩壊で Ac-228（89、228）に、Ac-228 は β⁻ 崩壊で Th-228（90、228）になります。
          α 1 回と β⁻ 2 回で、原子番号は 90 → 88 → 89 → 90、質量数は 232 → 228 と変わりました。
        note: 崩壊のつながり。α で 4 と 2 減り、β⁻ で 1 増える、を順にたどる。
      - part: 思い出す
