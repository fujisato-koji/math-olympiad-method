          - 軽くなった分の質量は、E = Δm c² でエネルギーになります。
          - 減った質量 Δm とエネルギーの関係を、式で書きましょう。
        paths:
          - [後のほうが質量が小さい（質量欠損）, E = Δm c², エネルギーとして出る]
          - [陽子と中性子の数は変わらない, 結びつき方が変わって質量が減る, 減った分がエネルギー]
        explain: 「核分裂の前と後の質量を比べると、反応の後のものの質量の合計のほうが小さい。減った質量 Δm が、E = Δm c² でエネルギーになる。これが核分裂で出るエネルギーのもと。」と書ければよい。① 質量欠損、② E = Δm c²、③ エネルギーとして出る。子どもには、U-235 の核分裂で約 200 MeV が出ることを確かめさせます。

