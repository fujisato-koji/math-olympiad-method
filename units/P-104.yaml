          - 3 になります。
        paths:
          - [1 + 2 = 3]
      - part: 今日
        text: 2 回の半減期がたつと、残る割合はどれですか。
        choices: ["1/2", "1/4", "1/8", "1/16"]
        answer: "1/4"
        check: "Fraction(1, 2) ** 2"
        hints:
          - 1 回で 1/2 です。
          - 2 回では、さらに半分になります。
          - (1/2)² = 1/4 です。
        paths:
          - [(1/2)² = 1/4]
      - part: わけ
        text: 半減期の式 N = N0 × (1/2)^(t/T) が成り立つわけを説明しましょう。
        explain: 「半減期 T ごとに、原子核の数は半分になる。t の間に半減期が t/T 回あるので、半分にする操作を t/T 回くり返す。よって N = N0 × (1/2)^(t/T)。」と書ければよい。① 1 回の半減期で半分、② t/T 回くり返す、③ 指数で書く。子どもには、t が半減期の《整数》倍の例で確かめさせます。
        hints:
          - 半減期が 1 回たつと、数は半分になります。
          - t の間には、半減期が t/T 回あります。
          - 半分にする操作を t/T 回くり返すと、N0 × (1/2)^(t/T) です。
        paths:
          - [1 回で半分, t/T 回くり返す, N0 × (1/2)^(t/T)]

# 腕だめし（離、D-047）：型を離れた問題。単元が済になる前でも挑める。
ri:
  - part: 離
    kinds: [道筋]
    uses: [D-001]
    text: U-238（陽子 92、質量数 238）が α 崩壊し、続けて β⁻ 崩壊を 2 回しました。最後の原子核の原子番号と質量数はどれですか。
    choices: ["U-234（92、234）", "Th-234（90、234）", "Pa-234（91、234）", "U-238（92、238）"]
    answer: "U-234（92、234）"
    check: "'U-234（92、234）' if 92 - 2 + 1 + 1 == 92 and 238 - 4 == 234 else 'Th-234（90、234）'"
    hints:
      - α 崩壊で、質量数は 4、原子番号は 2 減ります。
      - β⁻ 崩壊 2 回で、原子番号は 1 ずつ増えます。
      - 92 − 2 + 1 + 1 = 92、238 − 4 = 234 です。
    paths:
      - [α で 238→234、92→90, β⁻ 2 回で 90→91→92, U-234（92、234）]
    note: 崩壊系列は、α と β⁻ の変化を順にたどる。
  - part: 離
    kinds: [数]
    text: N0 = 800、半減期 10 年、30 年後の残りの原子核はいくつですか。
    choices: [50, 100, 200, 400]
    answer: 100
    check: "800 // 2 ** 3"
    hints:
      - 30 年は半減期 3 回分です。
      - 800 を 3 回半分にしましょう。
      - 800 → 400 → 200 → 100 です。
    paths:
      - [30 ÷ 10 = 3, 800 → 400 → 200 → 100]
    note: 半減期の回数 = 経過時間 ÷ 半減期。
  - part: 離
    kinds: [数]
    uses: [D-001]
    text: He-4 の質量欠損 0.0304 u は、何 MeV のエネルギーになりますか。
    choices: [2.83, 28.3, 283, 2830]
    answer: 28.3
    check: "f'{0.0304 * 931.5:.1f}'"
    hints:
      - 1 u は 931.5 MeV です。
      - 0.0304 × 931.5 を計算しましょう。
      - 約 28.3 MeV になります。
    paths:
      - [0.0304 × 931.5 ≈ 28.3 MeV]
    note: 質量欠損は、E = Δm c² でエネルギーになる。1 u = 931.5 MeV。
  - part: 離
    kinds: [総動員]
    uses: [D-001]
    text: N-14 + He-4 → O-17 + ? の ? に入るのはどれですか。
    choices: [H-1, n, e⁻, He-4]
    answer: H-1
    check: "'H-1' if 14 + 4 == 17 + 1 and 7 + 2 == 8 + 1 else 'n'"
    hints:
      - 質量数は、前の和と後の和が等しいです。
      - 前は 14 + 4 = 18、後は 17 + ? です。
      - ? の質量数は 1、原子番号は 1 なので、H-1 です。
    paths:
      - [質量数 18 = 17 + 1, 原子番号 9 = 8 + 1, H-1]
    note: 核反応の ? は、質量数と原子番号の保存で決まる。
