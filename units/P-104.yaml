        explain: 「α 崩壊では He-4 の原子核を放出する。He-4 は陽子 2、中性子 2 なので、質量数 4、原子番号 2。もとの原子核から He-4 を引くと、質量数は 4、原子番号は 2 減る。」と書ければよい。① α 粒子の構成、② 質量数と原子番号、③ 引き算。子どもには、U-238 → Th-234 + He-4 の数で確かめさせます。
        hints:
          - α 粒子は He-4 の原子核です。
          - He-4 は陽子 2、中性子 2 です。
          - 質量数 4、原子番号 2 を引きます。
        paths:
          - [α 粒子は He-4（陽子 2、中性子 2）, 質量数 4、原子番号 2, 娘核は 4 と 2 減る]

  - day: 3
    items:
      - part: 見本
        text: |-
          半減期 T：放射性の原子核の数が半分になるまでの時間。
          N = N0 × (1/2)^(t/T)。t は経過時間。
          ・N0 = 1000、T = 5 年、t = 15 年なら、15/5 = 3 回の半減期。N = 1000 × (1/2)³ = 125。
          ・3 回の半減期で、残る割合は (1/2)³ = 1/8。
        explain: |-
          半減期が 5 年なら、5 年ごとに半分になります。15 年は 3 回の半減期なので、1000 → 500 → 250 → 125。
          残る割合は (1/2) の回数乗です。3 回なら 1/8。
        note: 半減期の回数 = 経過時間 ÷ 半減期。残る量は (1/2) の回数乗。
      - part: 思い出す
        text: 陽子 6、中性子 8 の原子核の質量数はいくつですか。
        choices: [6, 8, 14, 48]
        answer: 14
        check: "6 + 8"
        hints:
          - 質量数は陽子と中性子の和です。
          - 6 + 8 を計算しましょう。
          - 14 になります。
        paths:
          - [6 + 8 = 14]
      - part: 思い出す
        text: 2³ はいくつですか。
        choices: [4, 6, 8, 9]
        answer: 8
        check: "2 ** 3"
        hints:
          - 2 を 3 回かけます。
          - 2 × 2 × 2 を計算しましょう。
          - 8 になります。
        paths:
          - [2 × 2 × 2 = 8]
      - part: 今日
        text: N0 = 1000、半減期 5 年、15 年後の残りの原子核はいくつですか。
        choices: [125, 250, 500, 750]
        answer: 125
        check: "1000 // 2 ** 3"
        hints:
          - 15 年は、5 年の半減期が何回分ですか。
          - 15 ÷ 5 = 3 回です。
          - 1000 を 3 回半分にしましょう。
        paths:
          - [15 ÷ 5 = 3, 1000 → 500 → 250 → 125]
      - part: 今日
        text: 3 回の半減期がたつと、残る割合はどれですか。
        choices: ["1/2", "1/4", "1/8", "1/16"]
        answer: "1/8"
        check: "Fraction(1, 2) ** 3"
        hints:
          - 1 回で 1/2、2 回で 1/4 です。
          - 3 回では、さらに半分になります。
          - (1/2)³ = 1/8 です。
        paths:
          - [(1/2)³ = 1/8]
      - part: 挑戦
        text: N0 = 800、半減期 10 年、30 年後の残りの原子核はいくつですか。
        choices: [50, 100, 200, 400]
        answer: 100
        check: "800 // 2 ** 3"
        hints:
          - 30 年は、10 年の半減期が 3 回分です。
          - 800 を 3 回半分にしましょう。
          - 800 → 400 → 200 → 100 です。
        paths:
          - [30 ÷ 10 = 3, 800 → 400 → 200 → 100]
    extra:
      - part: 今日
        text: N0 = 1000、半減期 5 年、5 年後の残りの原子核はいくつですか。
        choices: [250, 500, 750, 1000]
        answer: 500
        check: "1000 // 2"
        hints:
