      - part: わけ
        id: "8aee50f9d0"
        text: 半減期の式 N = N0 × (1/2)^(t/T) が成り立つわけを説明しましょう。
        hints:
          - text: 半減期が 1 回たつごとに、数は × 1/2 になります。
            svg: '<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg"><rect x="48" y="50" width="44" height="110" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="70" y="42" font-size="13" text-anchor="middle" fill="currentColor">N0</text><text x="70" y="178" font-size="14" text-anchor="middle" fill="currentColor">0</text><rect x="138" y="105" width="44" height="55" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="160" y="97" font-size="13" text-anchor="middle" fill="currentColor">N0 × 1/2</text><text x="160" y="178" font-size="14" text-anchor="middle" fill="currentColor">T</text><rect x="228" y="132.5" width="44" height="27.5" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="250" y="124.5" font-size="13" text-anchor="middle" fill="currentColor">N0 × 1/2 × 1/2</text><text x="250" y="178" font-size="14" text-anchor="middle" fill="currentColor">2T</text><line x1="30" y1="160" x2="300" y2="160" stroke="currentColor" stroke-width="2"/><text x="305" y="178" font-size="12" text-anchor="end" fill="currentColor">時間</text></svg>'
          - 時間 t の間に、半減期 T が何回あるかを、t と T を使って表しましょう。
          - × 1/2 を何回かけるかを、指数を使って書きましょう。
        paths:
          - [1 回で半分, t/T 回くり返す, N0 × (1/2)^(t/T)]
          - [t = T のとき N0 × 1/2、t = 2T のとき N0 × (1/2)², きまりを式で書く, (1/2) の t/T 乗]
        explain: 「半減期 T ごとに、原子核の数は半分になる。時間 t の間に半減期が t/T 回あるので、半分にすることを t/T 回くり返す。1/2 を t/T 回かけるので、N = N0 × (1/2)^(t/T)。」と書ければよい。① 1 回の半減期で半分、② t/T 回くり返す、③ 指数で書く。子どもには、t が半減期の《整数》倍の例で確かめさせます。

