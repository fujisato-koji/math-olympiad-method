      - part: わけ
        text: 半減期の式 N = N0 × (1/2)^(t/T) が成り立つわけを説明しましょう。
        explain: 「半減期 T ごとに、原子核の数は半分になる。t の間に半減期が t/T 回あるので、半分にする操作を t/T 回くり返す。よって N = N0 × (1/2)^(t/T)。」と書ければよい。① 1 回の半減期で半分、② t/T 回くり返す、③ 指数で書く。子どもには、t が半減期の《整数》倍の例で確かめさせます。
        hints:
          - 半減期が 1 回たつと、数は半分になります。
          - t の間には、半減期が t/T 回あります。
          - 半分にする操作を t/T 回くり返すと、N0 × (1/2)^(t/T) です。
        paths:
          - [1 回で半分, t/T 回くり返す, N0 × (1/2)^(t/T)]

  - day: 4
    items:
      - part: 見本
        text: |-
          核反応では、質量数 A と原子番号 Z が保存されます。
          例：N-14 + He-4 → O-17 + H-1。
          質量数：14 + 4 = 18、17 + 1 = 18。原子番号：7 + 2 = 9、8 + 1 = 9。
          質量欠損：反応の前後の質量の差 Δm。E = Δm c²。1 u は 931.5 MeV に相当します。
          例：He-4 の質量欠損 0.0304 u → E = 0.0304 × 931.5 ≈ 28.3 MeV。
        explain: |-
          核反応の前後で、質量数と原子番号の合計は変わりません。N-14 + He-4 は、質量数 18、原子番号 9。O-17 + H-1 も、質量数 18、原子番号 9 です。
          質量欠損は、反応の前後の質量の差。E = Δm c² で、エネルギーになります。1 u は 931.5 MeV なので、0.0304 u は約 28.3 MeV。
        note: 核反応は、質量数と原子番号の「保存則」で確かめる。質量欠損は、減った質量がエネルギーになること。
      - part: 思い出す
        text: 陽子 6、中性子 8 の原子核の質量数はいくつですか。
        choices: [6, 8, 14, 48]
        answer: 14
        check: "6 + 8"
        hints:
          - 質量数は陽子と中性子の和です。
          - 6 + 8 を計算しましょう。
          - 14 になります。
        paths:
          - [6 + 8 = 14]
      - part: 思い出す
        text: N0 = 1000、半減期 5 年、15 年後の残りの原子核はいくつですか。
        choices: [125, 250, 500, 750]
        answer: 125
        check: "1000 // 2 ** 3"
        hints:
          - 15 年は半減期 3 回分です。
          - 1000 を 3 回半分にしましょう。
          - 125 になります。
        paths:
          - [1000 → 500 → 250 → 125]
      - part: 今日
        text: N-14 + He-4 → O-17 + H-1 で、質量数の和はいくつですか。
        choices: [14, 18, 21, 24]
        answer: 18
        check: "14 + 4"
        hints:
          - 質量数は、反応の前の和と後の和が等しいです。
          - 前は 14 + 4 です。
          - 18 になります。
        paths:
          - [14 + 4 = 18]
      - part: 今日
        text: He-4 の質量欠損 0.0304 u は、何 MeV のエネルギーになりますか。
        choices: [2.83, 28.3, 283, 2830]
        answer: 28.3
        check: "f'{0.0304 * 931.5:.1f}'"
        hints:
          - 1 u は 931.5 MeV です。
          - 0.0304 × 931.5 を計算しましょう。
          - 約 28.3 MeV になります。
        paths:
          - [0.0304 × 931.5 ≈ 28.3 MeV]
      - part: 挑戦
        text: 核反応で保存されるものはどれですか。
        choices: [質量数と原子番号, 質量数だけ, 原子番号だけ, どちらも保存されない]
        answer: 質量数と原子番号
        check: "'質量数と原子番号'"
        hints:
          - 質量数は、反応の前後の合計が同じです。
          - 原子番号も、反応の前後の合計が同じです。
          - どちらも保存されます。
        paths:
          - [質量数の和が同じ, 原子番号の和が同じ, どちらも保存]
      - part: わけ
        text: 質量欠損がエネルギーになるわけを説明しましょう。
        explain: 「質量欠損 Δm は、反応の前後の質量の差。アインシュタインの関係 E = Δm c² により、減った質量はエネルギーとして放出される。原子核では、陽子と中性子が結びつくときに質量の一部がエネルギーになる。」と書ければよい。① 質量の差、② E = Δm c²、③ 結合エネルギーとして放出。子どもには、He-4 の例で数値を確かめさせます。
        hints:
          - 質量欠損は、反応の前後の質量の差です。
          - E = Δm c² で、質量はエネルギーに変わります。
          - 原子核が結びつくときに、エネルギーとして出ます。
        paths:
          - [質量の差 Δm, E = Δm c², 結合エネルギーとして放出]
