          - 質量数は玉の全部の数、原子番号は赤い玉の数です。
          - もとの原子核から、α 粒子の分を引き算しましょう。
        paths:
          - [α 粒子は陽子 2・中性子 2, 質量数 4・原子番号 2, もとからその分減る]
          - [Ra-226 → Rn-222 + He-4, 226 − 222 = 4, 88 − 86 = 2]
        explain: 「α 崩壊では He-4 の原子核（α 粒子）が飛び出す。He-4 は陽子 2、中性子 2 なので、質量数 4、原子番号 2。もとの原子核から He-4 の分がなくなるので、質量数は 4、原子番号は 2 減る。」と書ければよい。① α 粒子の中身、② 質量数と原子番号、③ 引き算。子どもには、Ra-226 → Rn-222 + He-4 の数で確かめさせます。

  - day: 3
    items:
      - part: 見本
        id: "e34ea5f9a0"
        text: |-
          崩壊する原子核は、少しずつ減っていきます。数がはじめの半分になるまでの時間を、半減期 T といいます。
          半減期 2 日なら、1600 個 → 2 日後 800 個 → 4 日後 400 個 → 6 日後 200 個。
          半減期が 1 回たつごとに、残りはそのときの半分になります。t 日後の数 N は、N = N0 × (1/2)^(t/T)（N0 ははじめの数）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">半減期 2 日：2 日ごとに半分になる</text><rect x="33" y="48" width="44" height="112" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="55" y="42" font-size="13" text-anchor="middle" fill="currentColor">1600 個</text><text x="55" y="178" font-size="13" text-anchor="middle" fill="currentColor">はじめ</text><line x1="33" y1="104" x2="147" y2="104" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="103" y="104" width="44" height="56" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="125" y="98" font-size="13" text-anchor="middle" fill="currentColor">800 個</text><text x="125" y="178" font-size="13" text-anchor="middle" fill="currentColor">2 日後</text><line x1="103" y1="132" x2="217" y2="132" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="173" y="132" width="44" height="28" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="195" y="126" font-size="13" text-anchor="middle" fill="currentColor">400 個</text><text x="195" y="178" font-size="13" text-anchor="middle" fill="currentColor">4 日後</text><line x1="173" y1="146" x2="287" y2="146" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="243" y="146" width="44" height="14" rx="2" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="265" y="140" font-size="13" text-anchor="middle" fill="currentColor">200 個</text><text x="265" y="178" font-size="13" text-anchor="middle" fill="currentColor">6 日後</text><line x1="20" y1="160" x2="300" y2="160" stroke="currentColor" stroke-width="2"/></svg>'
        explain: |-
          6 日は、半減期 2 日の 3 回分（6 ÷ 2 = 3）です。1600 を 3 回半分にして 200 個。式では 1600 × (1/2)³ = 200 です。
          半減期は、はじめの数が多くても少なくても同じです。どこから 2 日をとっても、その間に数は半分になります。
        note: 半減期の回数 = 経過時間 ÷ 半減期。残る量は (1/2) の回数乗。
