        explain: 「質量数は陽子と中性子の数の合計。核反応では陽子と中性子が組みかわるだけで、消えたりふえたりしない。原子番号は陽子の数で、陽子の数も反応の前と後で変わらない。だから、質量数の和と原子番号の和は保存される。」と書ければよい。① 質量数の意味、② 陽子・中性子の数が変わらない、③ 原子番号の保存。子どもには、N-14 + He-4 → O-17 + H-1 の数で確かめさせます。

  - day: 5
    items:
      - part: 見本
        id: "0dd0a356af"
        text: |-
          核分裂：重い原子核が中性子を 1 個とりこんで、中くらいの 2 つの原子核に分かれます。中性子も 2〜3 個飛び出します。例：U-235 + n → Xe-140 + Sr-94 + 2n（n は中性子）。
          核融合：軽い原子核どうしが結びついて、重い原子核になります。例：H-2 + H-3 → He-4 + n。太陽の中でも、水素の原子核が結びついてヘリウムができています。
          中性子捕獲：原子核が中性子をとりこむと、陽子の数はそのままで、質量数が 1 ふえます。例：Th-232 + n → Th-233。このあと β⁻ 崩壊を 2 回して U-233 になります。
