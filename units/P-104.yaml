        explain: |-
          核分裂の例では、A は 235 + 1 ＝ 140 + 94 + 2 ＝ 236、Z は 92 ＝ 54 + 38 で、どちらも保存されています。1 回の核分裂で約 200 MeV のエネルギーが出ます。
          核融合の例では、A は 2 + 3 ＝ 4 + 1、Z は 1 + 1 ＝ 2 + 0 です。
          核分裂でも核融合でも、反応の後のほうが質量が少し減っていて、その質量欠損の分がエネルギーになります。
          中性子捕獲の例では、Th（原子番号 90）が中性子をとりこんで Th-233 になり、β⁻ 崩壊 2 回で原子番号が 90 → 91 → 92 となって U（ウラン）になります。
        note: 核分裂は「重い核が分かれる」、核融合は「軽い核が結びつく」。どちらも質量欠損でエネルギーが出る。
