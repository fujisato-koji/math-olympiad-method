# P-104 原子核と放射線（原子核の構成と同位体、α・β・γ 崩壊、半減期と指数関数的な減衰、核反応、質量欠損、核分裂と核融合、中性子捕獲）
#
# 水準 3・8 日。前提は D-001（指数関数と対数関数）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 核種は「U-238」のように書く（陽子数と中性子数の内訳は本文で示す）。
# 質量欠損のエネルギーは E = Δm c²、1 u = 931.5 MeV とする。
# 半減期は T、はじめの個数を N0、経過時間を t として N = N0 × (1/2)^(t/T)。
# ことば：原子核、陽子、中性子、原子番号、質量数、同位体、放射線、α 崩壊・β⁻ 崩壊・γ 崩壊、α 粒子、半減期、核反応、保存、
#   質量欠損、核分裂、核融合、中性子捕獲。
# 図（D-131 の直し、-fix3）：陽子は赤い玉（+ の印）、中性子は水色の玉、電子 e⁻ は紫の小さな玉、γ 線は黄色のふちの波線、
#   エネルギーは黄色の星。玉で描けない大きな原子核（U など）は小さな玉をしきつめた円、まだわからない原子核は点線の円に「?」。
#   元素の記号と原子番号は「元素の表」の図で見せる。半減期は柱・時間の線・正方形の面積図・グラフ、崩壊のつながりは
#   横に原子番号・たてに質量数をとったマス目、質量欠損はてんびんで描く。
#   見本の例は問題と重ならないものにした（Ra-226、Li-7 + H-1、H-2 の質量欠損、Xe-140 + Sr-94、Th-232 の崩壊）。

id: P-104
days:
  - day: 1
    items:
      - part: 見本
        id: "6a0098d89a"
        text: |-
          原子核は、陽子（赤い玉）と中性子（水色の玉）が集まってできています。
          原子番号 Z は陽子の数です。陽子の数で、元素の種類が決まります。
          質量数 A は、陽子の数と中性子の数をあわせた数です。H-3 の 3 が質量数です。
          陽子の数が同じで、中性子の数がちがうものを同位体といいます。C-12 と C-14 も、炭素の同位体です。
        svg: '<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">水素の同位体（陽子はどれも 1 個）</text><circle cx="60" cy="72" r="13" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="53.5" y1="72" x2="66.5" y2="72" stroke="currentColor" stroke-width="1.5"/><line x1="60" y1="65.5" x2="60" y2="78.5" stroke="currentColor" stroke-width="1.5"/><text x="60" y="118" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">H-1</text><text x="60" y="137" font-size="13" text-anchor="middle" fill="currentColor">陽子 1</text><text x="60" y="154" font-size="13" text-anchor="middle" fill="currentColor">中性子 0</text><circle cx="166.5" cy="83.3" r="13" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="160" y1="83.3" x2="173" y2="83.3" stroke="currentColor" stroke-width="1.5"/><line x1="166.5" y1="76.8" x2="166.5" y2="89.8" stroke="currentColor" stroke-width="1.5"/><circle cx="153.5" cy="60.7" r="13" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="160" y="118" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">H-2</text><text x="160" y="137" font-size="13" text-anchor="middle" fill="currentColor">陽子 1</text><text x="160" y="154" font-size="13" text-anchor="middle" fill="currentColor">中性子 1</text><circle cx="260" cy="87" r="13" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="253.5" y1="87" x2="266.5" y2="87" stroke="currentColor" stroke-width="1.5"/><line x1="260" y1="80.5" x2="260" y2="93.5" stroke="currentColor" stroke-width="1.5"/><circle cx="247" cy="64.5" r="13" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><circle cx="273" cy="64.5" r="13" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="260" y="118" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">H-3</text><text x="260" y="137" font-size="13" text-anchor="middle" fill="currentColor">陽子 1</text><text x="260" y="154" font-size="13" text-anchor="middle" fill="currentColor">中性子 2</text><text x="160" y="176" font-size="13" text-anchor="middle" fill="currentColor">質量数 ＝ 玉の全部の数</text><circle cx="107.1" cy="193" r="7" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="103.6" y1="193" x2="110.6" y2="193" stroke="currentColor" stroke-width="1.5"/><line x1="107.1" y1="189.5" x2="107.1" y2="196.5" stroke="currentColor" stroke-width="1.5"/><text x="119.1" y="198" font-size="13" text-anchor="start" fill="currentColor">陽子</text><circle cx="167.8" cy="193" r="7" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="179.8" y="198" font-size="13" text-anchor="start" fill="currentColor">中性子</text></svg>'
        explain: |-
          H-1、H-2、H-3 は、どれも陽子が 1 個なので水素です。中性子は 0 個、1 個、2 個とちがい、質量数は 1、2、3 になります。
          元素の記号と原子番号は「元素の表」で調べます。たとえば O（酸素）は原子番号 8 なので、酸素の原子核には陽子が 8 個あります。
        note: 原子番号 = 陽子の数、質量数 = 陽子 + 中性子。同位体は中性子の数だけがちがう。
