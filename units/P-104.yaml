# P-104 原子核と放射線（原子核の構成と同位体、α・β・γ 崩壊、半減期と指数関数的な減衰、核反応、質量欠損、核分裂と核融合、中性子捕獲）
#
# 段 5・水準 3・8 日。前提は D-001（指数関数と対数関数）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 核種は「U-238」のように書く（陽子数と中性子数の内訳は本文で示す）。
# 質量欠損のエネルギーは E = Δm c²、1 u = 931.5 MeV とする。
# 半減期は T、はじめの個数を N0、経過時間を t として N = N0 × (1/2)^(t/T)。

id: P-104
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          原子核は、陽子（電荷 +1、質量数 1）と中性子（電荷 0、質量数 1）からできています。
          原子番号 Z = 陽子の数、中性子の数 N、質量数 A = Z + N。
          同じ元素で中性子の数が違うものを同位体といいます。
          ・H-1（陽子 1、中性子 0）、H-2（陽子 1、中性子 1）、H-3（陽子 1、中性子 2）は水素の同位体。
          ・C-12（陽子 6、中性子 6）、C-14（陽子 6、中性子 8）は炭素の同位体。
        explain: |-
          原子番号は陽子の数で、元素の種類を決めます。質量数は陽子と中性子の数の合計です。
          H-1、H-2、H-3 は、どれも陽子 1 ですが、中性子の数が 0、1、2 と違います。これが同位体です。
          C-12 は陽子 6、中性子 6。C-14 は陽子 6、中性子 8。質量数は 12 と 14 です。
        note: 原子番号 = 陽子の数、質量数 = 陽子 + 中性子。同位体は中性子の数だけが違う。
      - part: 思い出す
        text: 陽子 6、中性子 6 の原子核の質量数はいくつですか。
        choices: [6, 12, 18, 36]
        answer: 12
        check: "6 + 6"
        hints:
          - 質量数は陽子の数と中性子の数の和です。
          - 6 + 6 を計算しましょう。
          - 12 になります。
        paths:
          - [6 + 6 = 12]
      - part: 思い出す
        text: 2³ はいくつですか。
        choices: [4, 6, 8, 9]
        answer: 8
        check: "2 ** 3"
        hints:
          - 2³ は 2 を 3 回かけます。
          - 2 × 2 × 2 を計算しましょう。
          - 8 になります。
        paths:
          - [2 × 2 × 2 = 8]
      - part: 今日
        text: 陽子 8、中性子 9 の原子核の質量数はいくつですか。
        choices: [8, 9, 17, 72]
        answer: 17
        check: "8 + 9"
        hints:
          - 質量数は陽子の数と中性子の数の和です。
          - 8 + 9 を計算しましょう。
          - 17 になります。
        paths:
          - [8 + 9 = 17]
      - part: 今日
        text: C-14 の陽子の数はいくつですか。
        choices: [6, 8, 12, 14]
        answer: 6
        check: "6"
        hints:
          - C は炭素で、原子番号は 6 です。
          - 原子番号は陽子の数です。
          - 6 になります。
        paths:
          - [炭素の原子番号は 6, 陽子は 6]
      - part: 挑戦
        text: C-14 の中性子の数はいくつですか。
        choices: [6, 8, 12, 14]
        answer: 8
        check: "14 - 6"
        hints:
          - 質量数 = 陽子 + 中性子 です。
          - 14 = 6 + 中性子 です。
          - 中性子は 8 です。
        paths:
          - [14 − 6 = 8]
    extra:
      - part: 今日
        text: 陽子 1、中性子 2 の原子核の質量数はいくつですか。
        choices: [1, 2, 3, 4]
