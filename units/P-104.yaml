        explain: |-
          α 崩壊では α 粒子（陽子 2、中性子 2）が出ていくので、質量数は 4、原子番号は 2 減ります。Ra（原子番号 88）は Rn（原子番号 86）に変わります。
          β⁻ 崩壊では中性子が陽子に変わるので、玉の数は同じで、陽子だけが 1 個ふえます。電子は原子核の外へ出ていきます。
          γ 崩壊では光が出るだけで、陽子と中性子の数は変わりません。
        note: α は質量数 −4・原子番号 −2、β⁻ は質量数 0・原子番号 +1、γ はどちらも 0。
      - part: 思い出す
