      - part: 見本
        id: "620a4fae67"
        text: |-
          原子核どうしがぶつかって、別の原子核に変わることを核反応といいます。
          核反応の前と後で、陽子の数の合計も、中性子の数の合計も変わりません。だから、質量数 A の和と原子番号 Z の和は保存されます（等しいままです）。
          例：Li-7 + H-1 → He-4 + He-4。A は 7 + 1 ＝ 4 + 4、Z は 3 + 1 ＝ 2 + 2。
          陽子と中性子が結びついて原子核になると、質量の合計が少し減ります。この減った分 Δm を質量欠損といい、E = Δm c² のエネルギーになって出ていきます。
          質量の単位 u とエネルギーの単位 MeV では、1 u が 931.5 MeV にあたります。
