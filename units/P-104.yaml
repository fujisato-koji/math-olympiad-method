      - part: わけ
        text: 同位体とは何か、H-1 と H-2 を例に説明しましょう。
        explain: 「同位体は、同じ元素で、陽子の数が同じで中性子の数が違う原子核。H-1 は陽子 1、中性子 0、H-2 は陽子 1、中性子 1。陽子が同じなので、どちらも水素です。」と書ければよい。① 陽子の数が同じ、② 中性子の数が違う、③ 同じ元素の仲間。子どもには、質量数の違いを確かめさせます。
        hints:
          - 同位体は、陽子の数が同じで、中性子の数が違います。
          - H-1 は陽子 1、中性子 0 です。
          - H-2 は陽子 1、中性子 1 です。
        paths:
          - [陽子が同じで中性子が違う, H-1 と H-2 はどちらも陽子 1, 同じ元素の同位体]

  - day: 2
    items:
      - part: 見本
        text: |-
          α 崩壊：U-238 → Th-234 + He-4。質量数は 4 減り、原子番号は 2 減ります。
          β⁻ 崩壊：中性子が陽子に変わり、電子 e⁻ と反ニュートリノ ν̄ が出ます。C-14 → N-14 + e⁻ + ν̄。質量数は同じで、原子番号は 1 増えます。
          γ 崩壊：励起した原子核が光（γ 線）を出します。質量数も原子番号も変わりません。
        explain: |-
          α 崩壊では、He-4 の原子核（α 粒子）を放出するので、質量数は 4、原子番号は 2 減ります。
          β⁻ 崩壊では、中性子が陽子に変わるので、質量数は変わらず、原子番号は 1 増えます。
          γ 崩壊では、余分なエネルギーを光として出すだけで、陽子と中性子の数は変わりません。
        note: α は質量数 −4・原子番号 −2、β⁻ は質量数 0・原子番号 +1、γ はどちらも 0。
      - part: 思い出す
        text: 陽子 6、中性子 8 の原子核の質量数はいくつですか。
        choices: [6, 8, 14, 48]
        answer: 14
        check: "6 + 8"
        hints:
          - 質量数は陽子と中性子の和です。
          - 6 + 8 を計算しましょう。
          - 14 になります。
        paths:
          - [6 + 8 = 14]
      - part: 思い出す
        text: 2³ はいくつですか。
        choices: [4, 6, 8, 9]
        answer: 8
        check: "2 ** 3"
        hints:
          - 2 を 3 回かけます。
          - 2 × 2 × 2 を計算しましょう。
          - 8 になります。
        paths:
          - [2 × 2 × 2 = 8]
      - part: 今日
        text: α 崩壊で、娘核の質量数はいくつ減りますか。
        choices: [1, 2, 4, 8]
        answer: 4
        check: "4"
        hints:
          - α 粒子は He-4 です。
          - He-4 の質量数は 4 です。
          - 質量数は 4 減ります。
        paths:
          - [α 粒子は He-4, 質量数は 4 減る]
      - part: 今日
        text: β⁻ 崩壊で、娘核の原子番号はどうなりますか。
        choices: [1 増える, 1 減る, 変わらない, 2 増える]
        answer: 1 増える
        check: "'1 増える'"
        hints:
          - β⁻ 崩壊では、中性子が陽子に変わります。
          - 陽子が 1 つ増えます。
          - 原子番号は 1 増えます。
        paths:
          - [中性子が陽子に変わる, 陽子が 1 増える, 原子番号は 1 増える]
      - part: 挑戦
        text: U-238（陽子 92）が α 崩壊すると、娘核の原子番号はいくつですか。
        choices: [88, 90, 92, 94]
        answer: 90
        check: "92 - 2"
        hints:
          - α 崩壊で原子番号は 2 減ります。
          - 92 − 2 を計算しましょう。
          - 90 になります。
        paths:
          - [92 − 2 = 90]
    extra:
      - part: 今日
        text: β⁻ 崩壊で、娘核の質量数はどうなりますか。
        choices: [1 増える, 1 減る, 変わらない, 4 減る]
        answer: 変わらない
        check: "'変わらない'"
