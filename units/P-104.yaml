-width="1.5"/><circle cx="242.8" cy="194.5" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="72" y="258" font-size="13" text-anchor="middle" fill="currentColor">ばらばらの</text><text x="72" y="275" font-size="13" text-anchor="middle" fill="currentColor">陽子と中性子</text><text x="252" y="242" font-size="13" text-anchor="middle" fill="currentColor">H-2 の原子核</text><text x="252" y="260" font-size="12" text-anchor="middle" fill="currentColor">差 Δm → エネルギー</text><polygon points="300,166 301.9,171.4 307.1,168.9 304.6,174.1 310,176 304.6,177.9 307.1,183.1 301.9,180.6 300,186 298.1,180.6 292.9,183.1 295.4,177.9 290,176 295.4,174.1 292.9,168.9 298.1,171.4" fill="#f3c969" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5"/><circle cx="107.1" cy="289" r="7" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><line x1="103.6" y1="289" x2="110.6" y2="289" stroke="currentColor" stroke-width="1.5"/><line x1="107.1" y1="285.5" x2="107.1" y2="292.5" stroke="currentColor" stroke-width="1.5"/><text x="119.1" y="294" font-size="13" text-anchor="start" fill="currentColor">陽子</text><circle cx="167.8" cy="289" r="7" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="179.8" y="294" font-size="13" text-anchor="start" fill="currentColor">中性子</text></svg>'
        explain: |-
          Li（リチウム）の原子番号は 3 なので、Li-7 は陽子 3、中性子 4。H-1 は陽子 1。合わせて陽子 4、中性子 4 で、He-4（陽子 2、中性子 2）2 個分と同じです。
          H-2 の原子核の質量は、ばらばらの陽子 1 個と中性子 1 個の質量の和より 0.0024 u 小さくなっています。E = 0.0024 × 931.5 ≈ 2.2 MeV のエネルギーが出ます。
        note: 核反応は、質量数と原子番号の「保存則」で確かめる。質量欠損は、減った質量がエネルギーになること。
