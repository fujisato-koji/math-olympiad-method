        note: ならべ方から数えると 100 をこえる大きな数になる。えらばないほうを数えると楽になる。
      - part: 今日
        text: 7 人の中から、5 人をえらびます。えらび方は何通りですか。
        answer: 21
        check: "len(set(itertools.combinations(range(7), 5)))"
        hints:
          - えらばれない人は何人かな。
          - えらばれない 2 人を決めると、えらぶ 5 人は決まるね。
