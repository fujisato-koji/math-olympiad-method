          - 3 人の組 1 つは、ならべ方の中に何回出てくるかな。
          - ならべ方の数を、その回数でわろう。
        paths:
          - [ならべると 5 × 4 × 3 = 60 通り, 3 人の組は 3 × 2 × 1 = 6 回ずつ出てくる, 60 ÷ 6 = 10 通り（6 × 10 = 60）]
          - [えらばない 2 人を決める, 5 × 4 = 20、20 ÷ 2 = 10 通り]
        note: 60 ÷ 3 = 20 と、3 でわりやすい。3 人のならべ方は 3 通りではなく 6 通り。
      - part: 今日
