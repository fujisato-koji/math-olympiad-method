# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 道筋]
    uses: [G-006]
    text: 図のように、平行な 2 本の直線の上に、点が 4 こと 3 こあります。この 7 この点のうち 3 こをむすんで、三角形をつくります。三角形は何こできますか。
    svg: |
      <svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
        <line x1="16" y1="30" x2="224" y2="30" stroke="currentColor" stroke-width="2"/>
        <line x1="16" y1="92" x2="224" y2="92" stroke="currentColor" stroke-width="2"/>
        <circle cx="44" cy="30" r="4.5" fill="currentColor"/>
        <circle cx="92" cy="30" r="4.5" fill="currentColor"/>
        <circle cx="140" cy="30" r="4.5" fill="currentColor"/>
        <circle cx="188" cy="30" r="4.5" fill="currentColor"/>
        <circle cx="68" cy="92" r="4.5" fill="currentColor"/>
        <circle cx="120" cy="92" r="4.5" fill="currentColor"/>
        <circle cx="172" cy="92" r="4.5" fill="currentColor"/>
      </svg>
    answer: 30
    check: "sum(1 for c in itertools.combinations(range(7), 3) if not (all(i < 4 for i in c) or all(i >= 4 for i in c)))"
    hints:
      - 同じ直線の上の 3 この点をえらぶと、三角形になるかな。
      - 上の直線から 2 こと下の直線から 1 このときと、上から 1 こと下から 2 このときに分けよう。
      - 7 こから 3 こをえらぶ数から、三角形にならないえらび方をひいてもよいよ。
    paths:
      - [上から 2 こ、下から 1 こは 6 × 3 = 18 こ, 上から 1 こ、下から 2 こは 4 × 3 = 12 こ, 18 + 12 = 30 こ]
      - [7 こから 3 こをえらぶのは 35 通り, 上の直線だけの 3 こは 4 通り、下の直線だけの 3 こは 1 通りで、三角形にならない, 35 − 4 − 1 = 30 こ]
    note: 三角形になるには、3 点が 1 本の直線にならばないこと（G-006）。3 日目は円の上の点だったので、どの 3 点をえらんでも三角形になった。ここでは同じ直線の上の 3 点をのぞく。35 と答えやすい。
  - part: 離
    kinds: [数]
    text: 男子 7 人、女子 6 人の中から、男子 2 人と女子 3 人をえらんで、5 人の係をつくります。えらび方は何通りですか。
    answer: 420
    check: "sum(1 for a in itertools.combinations(range(7), 2) for b in itertools.combinations(range(6), 3))"
    hints:
      - 男子のえらび方と、女子のえらび方をべつべつに出そう。
      - 6 人から 3 人をえらぶ数は、ならべ方を 3 × 2 × 1 = 6 でわればよいね。
      - 男子のえらび方の 1 つ 1 つに、女子のえらび方が全部組み合わさるよ。
    paths:
      - [男子は 7 × 6 = 42、42 ÷ 2 = 21 通り, 女子は 6 × 5 × 4 = 120、120 ÷ 6 = 20 通り, 積の法則で 21 × 20 = 420 通り]
    note: 組合せを 2 回出して、積の法則で合わせる。ならべ方が 120 になる 6 人から 3 人は、わり算の筆算（N-075）で 120 ÷ 6 = 20。13 人から 5 人をえらぶと考えて、男女の人数を見落としやすい。
  - part: 離
    kinds: [読み取り]
    text: ア、イ、ウ、エ、オ、カの 6 人の中から、委員長を 1 人と、係を 2 人えらびます（係の 2 人にじゅん番はありません）。アとイは 2 人ともえらばれることがないようにします。えらび方は何通りですか。
    answer: 48
    check: "sum(1 for ch in 'アイウエオカ' for m in itertools.combinations('アイウエオカ'.replace(ch, ''), 2) if not ('ア' in ch + m[0] + m[1] and 'イ' in ch + m[0] + m[1]))"
    hints:
      - きまりがなければ、委員長の決め方 × 係のえらび方で何通りかな。
      - アとイが 2 人ともえらばれるのはどんなときかな。委員長がアのとき、イのとき、どちらでもないときに分けよう。
      - 全部のえらび方から、アとイが 2 人ともいるえらび方をひこう。
    paths:
      - [きまりがなければ 委員長 6 通り × 係 10 通り = 60 通り, 委員長がアで係にイがいるのは 4 通り、委員長がイで係にアがいるのも 4 通り, 係がアとイで委員長がのこりの 4 人のだれかなのは 4 通り, 60 − 12 = 48 通り]
      - [アもイもいないのは 委員長 4 通り × 係 3 通り = 12 通り, アだけいるのは 委員長がアで 6 通り、係がアで 4 × 3 = 12 通りの 18 通り, イだけいるのも 18 通り, 12 + 18 + 18 = 48 通り]
    note: 役のある 1 人（ならべ方）と、役のない 2 人（組合せ）がまじる。アとイの 2 人ともがいる場合を、委員長かどうかで 3 つに分けて数えるのが要点。どれかを落として 52 や 56 にしやすい。

  - part: 離
    kinds: [最難関]
    level: 10
    uses: [C-004]
    text: 4 × 3 の方眼があります。左下の点から右上の点まで、右と上にだけ進む道のうち、点 (2, 1) を通らない道は何通りですか。
    answer: 17
    check: "math.comb(7, 4) - math.comb(3, 2) * math.comb(4, 2)"
    hints:
      - 全部の道は、右 4 回と上 3 回の並べ方。
      - 点 (2, 1) を通る道は、そこまでの道 × そこからの道。
      - 全体から、通る道をひこう。
    paths:
      - [全体は C(7, 4) = 35, (2,1) までが C(3,2)=3, そこからが C(4,2)=6, 通る道は 18, 35 − 18 = 17]
    note: 通らない道は、全体から「通る道」をひく。場合の数では、余事象を考えると速い。
