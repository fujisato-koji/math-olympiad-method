          - 両方えらぶね。かけ算かな、たし算かな。
        paths:
          - [赤組 3 × 2 = 6、6 ÷ 2 = 3 通り, 白組 4 × 3 = 12、12 ÷ 2 = 6 通り, 3 × 6 = 18 通り]
    extra:
      - part: 今日
        text: 10 人の中から、2 人をえらびます。えらび方は何通りですか。
