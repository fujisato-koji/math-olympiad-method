# C-007 選び方（組合せ）
#
# 書き方は N-001 の頭の注、文の漢字は C-006 の頭の注のとおり（小 3 までの漢字。選、順、求、最、以 などはかなで書く）。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 2 つをえらぶ（ならべ方を 2 でわる）、2 日目 3 つをえらぶ（ならべ方を 3 × 2 × 1 = 6 でわる）と、えらばないほうを数える、
#   3 日目 しあい・直線・三角形を「何をえらぶことか」に言いかえる、2 つの組からえらぶ（積の法則）、4 日目 わけ（なぜ 2 や 6 でわるか、なぜ同じ数か）、
#   5 日目 C-006（ならべ方）・N-014（あまりのあるわり算）と混ぜる、6 日目 確認。
# 前提は C-006 と N-014。答えも途中の数も 100 まで（6 人から 3 人をえらぶような、ならべ方が 100 をこえるものは出さない）。
# N-014 のわり算は答えが 9 まで（九九の範囲）なので、答えが 10 をこえる ÷ 2 は「同じ数ずつ 2 つに分ける（半分）」として出し、
#   15 + 15 = 30 のようにたし算でたしかめる。たし算だけでできる道（5 人から 2 人なら 4 + 3 + 2 + 1）を 2 本目のみちすじに書く。
#   20 ÷ 2 = 10 と 60 ÷ 6 = 10 は、N-013 の × 10（2 × 10 = 20、6 × 10 = 60）でさがせる。
# × と ÷ のまじった式（5 × 4 ÷ 2）は計算の順序（N-015）が前提にないので、5 × 4 = 20、20 ÷ 2 = 10 と 2 つの式に分けて書く。
# 2 けた × 1 けたは C-006 と同じく、たし算で出す（20 × 3 = 20 + 20 + 20）。
# 記号（5C2 など）、パスカルの三角形（C-015）、同じものを何度もえらぶえらび方（C-013）は出さない。
# 円の上の点の図は svg で描く。円の上の点なので、3 つの点が 1 本の直線にならぶことはない。
# check は itertools.combinations でえらび方を作って数える。2 つの組からえらぶものは itertools.product と組み合わせる。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-015 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: C-007
days:
  - day: 1
    items:
      - part: 思い出す
        text: 5 人の中から、リーダーとふくリーダーを 1 人ずつ決めます。1 人が両方になることはありません。決め方は何通りですか。
        answer: 20
        check: "len(set(itertools.permutations(range(5), 2)))"
        hints:
          - リーダーは何通りかな。
          - ふくリーダーは、のこりの何人から決めるかな。
          - 2 つの通りをかけ算にしよう。
        paths:
          - [リーダー 5 通り, ふくリーダー 4 通り, 5 × 4 = 20 通り]
      - part: 思い出す
        text: 14 ÷ 2 はいくつですか。
        answer: 7
        check: "14 // 2"
        hints:
          - 14 こを、2 人で同じ数ずつ分けると考えよう。
          - 2 のだんの九九を思い出そう。
          - 2 × □ = 14 になる □ をさがそう。
        paths:
          - [2 × 7 = 14, だから 14 ÷ 2 = 7]
      - part: 見本
        text: ア、イ、ウ、エの 4 人の中から、そうじ当番を 2 人えらびます。えらび方は何通りですか。
        figure: "アイ　イア\nアウ　ウア\nアエ　エア\nイウ　ウイ\nイエ　エイ\nウエ　エウ"
        explain: もし 1 番目、2 番目とじゅん番をつけてならべると、4 × 3 = 12 通りです。でも当番にはじゅん番がないので、「アイ」と「イア」は同じえらび方です。12 通りのならべ方の中では、どのえらび方も 2 回ずつ出てきます（図の左と右）。だから 12 ÷ 2 = 6 通りです。じゅん番をつけずにえらんだものを「組み合わせ」といいます。ならべ方の数を、同じえらび方が出てくる回数でわると、組み合わせの数になります。
      - part: 今日
        text: 5 人の中から、代表を 2 人えらびます。えらび方は何通りですか。
        answer: 10
        check: "len(set(itertools.combinations(range(5), 2)))"
        hints:
          - じゅん番をつけてならべると、何通りかな。
          - 「アイ」と「イア」は、同じえらび方かな。
          - 同じえらび方を何回ずつ数えているかを考えて、わり算にしよう。
        paths:
          - [じゅん番をつけてならべると 5 × 4 = 20 通り, どのえらび方も 2 回ずつ数えている, 20 ÷ 2 = 10 通り（2 × 10 = 20）]
          - [アさんと組む人 4 通り, イさんと組む人はアさんをのぞいて 3 通り, ウさんは 2 通り、エさんは 1 通り, 4 + 3 + 2 + 1 = 10 通り]
        note: 20 と答えやすい。代表にはじゅん番がないことをたしかめる。2 本目の道は、同じ組を 2 回数えないように、前の人と組んだ組を数えない書き方。
      - part: 今日
        text: 6 しゅるいのくだものから 2 しゅるいをえらんで、ミックスジュースをつくります。えらび方は何通りですか。
        answer: 15
        check: "len(set(itertools.combinations(range(6), 2)))"
        hints:
          - じゅん番をつけてならべると、何通りかな。
          - 「りんごとみかん」と「みかんとりんご」は、同じジュースだね。
          - 30 を、同じ数ずつ 2 つに分けると 1 つ分はいくつかな。
        paths:
          - [ならべると 6 × 5 = 30 通り, 2 回ずつ数えている, 30 ÷ 2 = 15 通り（15 + 15 = 30）]
          - [5 + 4 + 3 + 2 + 1 = 15 通り]
        note: 30 ÷ 2 は答えが九九をこえるわり算（N-014 の外）。30 を 2 つに同じ数ずつ分けると考え、15 + 15 = 30 でたしかめる。
      - part: 今日
        text: 7 色のビー玉が 1 こずつあります。2 こをもらうとき、もらい方は何通りですか。
        answer: 21
        check: "len(set(itertools.combinations(range(7), 2)))"
        hints:
          - じゅん番をつけてならべると、何通りかな。
          - 同じもらい方を、何回ずつ数えているかな。
          - 42 を同じ数ずつ 2 つに分けよう。十のまとまりとばらに分けて考えてもいいよ。
        paths:
          - [ならべると 7 × 6 = 42 通り, 2 回ずつ数えている, 42 ÷ 2 = 21 通り（21 + 21 = 42）]
          - [6 + 5 + 4 + 3 + 2 + 1 = 21 通り]
      - part: 挑戦
        text: 8 チームが、どのチームとも 1 回ずつしあいをします。しあいは全部で何回ですか。
        answer: 28
        check: "len(set(itertools.combinations(range(8), 2)))"
        hints:
          - 1 回のしあいは、2 チームをえらぶことと同じだよ。
          - 「ア 対 イ」と「イ 対 ア」は、同じしあいだね。
          - ならべ方の数を 2 つに分けよう。
        paths:
          - [しあい 1 回は 2 チームのえらび方, ならべると 8 × 7 = 56, 同じしあいを 2 回ずつ数えている, 56 ÷ 2 = 28 回（28 + 28 = 56）]
          - [7 + 6 + 5 + 4 + 3 + 2 + 1 = 28 回]
        note: 1 チームは 7 回ずつしあいをするので 8 × 7 = 56 としやすい。56 回では、どのしあいも両方のチームの側から 2 回数えている。
    extra:
