  - day: 3
    items:
      - part: 見本
        text: "雨や風が土のつぶをけずってはこぶことを、侵食（しんしょく）といいます。草や木の根は土をつかまえ、葉や草は雨をうけとめて、侵食をおさえます。土をまもるくふうには、だんだん畑、風よけの林、わらをしくことなどがあります。"
