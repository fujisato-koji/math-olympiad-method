        explain: "雨は、地面に当たるときのいきおいで土のつぶをはね飛ばし、そのあと流れる水がつぶをはこびます。坂がきゅうなほど水ははやく流れ、はこぶ力が強くなります。草や木の根は、土をあみのようにつなぎとめ、葉は雨つぶのいきおいを弱めます。だんだん畑は坂を平らな面に分けて水の流れをゆるめ、風よけの林は風の強さを弱めて土がとばされるのをふせぎます。"
