        explain: "風化は、岩がその場所でひびが入り、小さくくだけることです。川や雨がけずってはこぶはたらきとはちがいます。くだけたつぶに、落ち葉や虫や根のあとがくさってまざり、水と空気もふくんで土になります。上のほうは生き物のあとが多くて黒っぽく、下にいくほどもとの岩に近くなります。層の名前は、上から落ち葉の層、黒い土の層、茶色い土の層、岩のかけらの層、もとの岩です。"
