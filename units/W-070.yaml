# W-070 土壌の生成と性質
#
# 段 4・水準 2・4 日。風化と土壌のでき方、土壌の層位、粒径と土性、保水性と透水性、土壌の侵食と保全。
id: W-070
days:
  - day: 1
    items:
      - part: 見本
        text: "岩は、温度の変化やこおった水、木の根のはたらきでひびが入り、少しずつくだけます。これを風化といいます。風化でできたつぶに、落ち葉や虫のあとがまざって、土壌（どじょう）になります。土をたてにきると、色やつぶのちがいで層（そう）に分かれています。"
