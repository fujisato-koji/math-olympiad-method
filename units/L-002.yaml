# L-002 推理パズル
#
# 段 1・水準 1・5 日。ヒントから 1 つに きめる（だれの ものか）、ひょうに まると ばつを かいて せいりする、じゅんばんの すいり（だれが まえか うしろか）、L-001 と まぜる、かくにん。
# 書き方は N-001 の頭の注のとおり。子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 人の代わりに どうぶつ（🐶 いぬ、🐱 ねこ、🐰 うさぎ、🐻 くま、🐵 さる、🐷 ぶた、🐸 かえる、🐭 ねずみ）を使う。
# 前提は L-001 だけなので、数は かぞえるだけ（たし算は使わない）。ならぶのは 4 ひきまで（ぼうしの列は 6 つ）。
# 地図の plan にわけの日がないので、わけは 2・3・4 日目に 1 問ずつ置く。2・3 日目は新しい道具（ひょう、じゅんばん）が出るので、頭に見本を置く。
# 図は svg（D-129）。どうぶつと もの は絵文字で、ほかは線と形でかく。図のきまり：
#   だれが どれ：上の きいろの わくが もの。どうぶつの下の わく（もつ）か おさら（たべる）に、わかった ものを入れる。下の 赤い ばつの絵は「〜では ない」。きいろの わくの ？ が たずねる ところ。
#   わかった ものは、上の わくで うすくする（もう だれかの もの）。
#   ひょう：よこの ならびが どうぶつ、たての ならびが もの。赤い まるが ⭕（そう）、赤い ばつが ❌（ちがう）。きいろの おびは 見る ならび。
#   れつ：左が まえ（下の やじるし）。点線の わくは まだ だれか わからない ところ、きいろの わくの ？ が たずねる ところ。上の はいいろの わくは ならぶ どうぶつ。
#   かけっこ：左の はたが ゴール。ゴールに ちかい ほうが さき。
#   ヒントの 2 ひきの ならびは、文の ヒントを 絵に したもの（左が まえ）。むらさきで かこんだ 2 ひきは「すぐ まえ・すぐ うしろ」で くっついて ならぶ。
# check は、ありうる組をすべて並べ（itertools.permutations）、ヒントに合うものだけを残す。
# たずねた答えが 1 つに決まらないときは「きまらない」を返すので、答えが 1 つに決まることも確かめられる。
# 順番の check は、まえからの並びを permutations で作り、p.index(どうぶつ) で位置を比べる。
# くり返しと かずの ならび（L-001）の check は、もとの 文字の図を lambda の fig に わたして 計算する（図は svg に した）。
# 4 日目の「L-001 と混ぜる」は、ぼうしの色が くり返す列で、順番から だれの色かを決める問題にした。

