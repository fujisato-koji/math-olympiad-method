# L-002 推理パズル
#
# 書き方は N-001 の頭の注のとおり。
# 人の代わりに どうぶつ（🐶 いぬ、🐱 ねこ、🐰 うさぎ、🐻 くま、🐵 さる、🐷 ぶた、🐸 かえる、🐭 ねずみ）を使う。
# 前提は L-001 だけなので、数は かぞえるだけ（たし算は使わない）。ならぶのは 4 ひきまで。
# 地図の plan にわけの日がないので、わけは 2・3・4 日目に 1 問ずつ置く。2・3 日目は新しい道具（表、順番）が出るので、頭に見本を置く。
# 表の図は、よこの ならびが どうぶつ、たての ならびが もの。⭕ は「そう」、❌ は「ちがう」、⬜ は まだ わからない ところ。
# check は、ありうる組をすべて並べ（itertools.permutations）、ヒントに合うものだけを残す。
# たずねた答えが 1 つに決まらないときは「きまらない」を返すので、答えが 1 つに決まることも確かめられる。
# 順番の check は、まえからの並びを permutations で作り、p.index(どうぶつ) で位置を比べる。
# 4 日目の「L-001 と混ぜる」は、ぼうしの色が くり返す列で、順番から だれの色かを決める問題にした。

id: L-002
days:
  - day: 1
    items:
      - part: 見本
        text: いぬと ねこが、🍎 と 🍌 を ひとつずつ もって います。いぬは 🍎 を もって いません。ねこが もって いるのは どちらかな。
        figure: "🐶🐱\n🍎🍌"
        explain: いぬは 🍎 では ないので、いぬは 🍌 です。のこった 🍎 が ねこの もの です。だから ねこは 🍎 です。
      - part: 思い出す
        text: ❓ に はいるのは どれですか。
        figure: 🔴🟡🔴🟡🔴❓
        choices: [🔴, 🟡]
        answer: 🟡
        check: "(lambda s, k: [s[j] for p in range(1, len(s)) if all(s[a] == s[b] for a in range(len(s)) for b in range(len(s)) if a % p == b % p and '❓' not in (s[a], s[b])) for j in range(len(s)) if j % p == k % p and j != k][0])(fig, fig.index('❓'))"
        hints:
          - あかと きいろは、どう ならんで いるかな。
          - ゆびで さしながら「あか、きいろ、…」と いってみよう。
          - さいごの あかの つぎには、なにが くるかな。
        paths:
          - [あかと きいろが こうたい, あかの つぎは きいろ, 🟡]
      - part: 思い出す
        text: □ に はいる かずは いくつですか。
        figure: 2、4、6、□
        answer: 8
        check: "(lambda t: (lambda k, v: (lambda d: v[0][1] + (k - v[0][0]) * d if all(y == v[0][1] + (i - v[0][0]) * d for i, y in v) else 'きまりがない')((v[1][1] - v[0][1]) / (v[1][0] - v[0][0])))(t.index('□'), [(i, Fraction(t[i])) for i in range(len(t)) if t[i] != '□']))(fig.split('、'))"
        hints:
          - 2 と 4 の あいだには、どの かずが ぬけて いるかな。
          - ひとつ とばしに ならんで いるね。
          - 6 の あと、ひとつ とばした かずは なにかな。
        paths:
          - [ひとつ とばしに ならんで いる（2 ずつ）, 6 の つぎは 7 を とばす, 8]
      - part: 今日
        text: くまの ぼうしは、あか、あお、きいろの どれかです。くまの ぼうしは、あかでも きいろでも ありません。くまの ぼうしは なにいろですか。
        figure: 🐻
        choices: [あか, あお, きいろ]
        answer: あお
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([x for x in ['あか', 'あお', 'きいろ'] if x != 'あか' and x != 'きいろ'])"
        hints:
          - ぼうしの いろは、3 つの どれかだね。
          - 「ありません」と いわれた いろに、ばつを つけよう。
          - ばつが ついて いない いろは どれかな。
        paths:
          - [あか、あお、きいろの 3 つ, あかと きいろに ばつ, あお]
      - part: 今日
        text: うさぎと かえるが、🍓 と 🍇 を ひとつずつ たべました。かえるは 🍓 を たべて いません。うさぎが たべたのは どちらですか。
        figure: "🐰🐸\n🍓🍇"
        choices: [🍓, 🍇]
        answer: 🍓
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[0] for p in itertools.permutations(['🍓', '🍇']) if p[1] != '🍓'])))"
        hints:
          - さきに、かえるが なにを たべたか かんがえよう。
          - かえるは 🍓 では ないね。では、かえるは どちらかな。
          - のこった ほうを たべたのは だれかな。
        paths:
          - [かえるは 🍓 では ない, かえるは 🍇, のこりの 🍓 は うさぎ]
        note: 「かえるは 🍓 では ない」を「うさぎは 🍓 では ない」と よみちがえやすい。だれの ことかを ゆびで さして よませる。
      - part: 今日
        text: いぬ、ねこ、うさぎが、⚽ 🎈 📕 を ひとつずつ もって います。いぬは ⚽ です。ねこは 🎈 では ありません。ねこが もって いるのは どれですか。
        figure: "🐶🐱🐰\n⚽🎈📕"
        choices: [⚽, 🎈, 📕]
        answer: 📕
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[1] for p in itertools.permutations(['⚽', '🎈', '📕']) if p[0] == '⚽' and p[1] != '🎈'])))"
        hints:
          - いぬは ⚽ と わかって いるね。
          - ⚽ は いぬの もの。ねこに のこって いるのは どれと どれかな。
          - そのうち、ねこでは ない ほうに ばつを つけよう。
        paths:
          - [いぬは ⚽, ねこは 🎈 か 📕, 🎈 では ない, 📕]
      - part: 挑戦
        text: いぬ、ねこ、うさぎが、⚽ 🎈 📕 を ひとつずつ もって います。いぬは ⚽ でも 🎈 でも ありません。ねこは ⚽ では ありません。うさぎが もって いるのは どれですか。
        figure: "🐶🐱🐰\n⚽🎈📕"
        choices: [⚽, 🎈, 📕]
        answer: ⚽
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[2] for p in itertools.permutations(['⚽', '🎈', '📕']) if p[0] != '⚽' and p[0] != '🎈' and p[1] != '⚽'])))"
        hints:
          - さきに、いぬの ものを きめよう。
          - いぬが きまったら、ねこに のこって いるのは どれかな。
          - さいごに のこった ものが、うさぎの ものだよ。
        paths:
          - [いぬは ⚽ でも 🎈 でも ない ので 📕, ねこは ⚽ では ない ので 🎈, のこりの ⚽ が うさぎ]
          - ["3 ひきと 3 つの もちものの 表を かく", "いぬの ⚽ と 🎈 に ×、ねこの ⚽ に ×", "いぬは 📕、ねこは 🎈、のこりの ⚽ が うさぎ"]
        note: うさぎの ことは なにも いって いないので、まよいやすい。わかる どうぶつから じゅんに きめると よい。
