        explain: |-
          月は じぶんでは ひからず、たいようの ひかりが あたって いる ところだけが 見えます。月が ちきゅうの まわりを まわるので、ひかって 見える ところが 日ごとに かわります。1 まわりは やく 29.5 日です。
          日本で 見ると、みかづきは 右がわが ひかり、日が たつと 右から ふとって はんげつ、まんげつに なります。そのあとは 右がわから かけて、左がわが ひかる はんげつ、ほそい 月と なり、見えなく なります（しんげつ）。
          なん日か つづけて、おなじ じこくに 月を 見て、かたちを えに かくと よく わかります。
