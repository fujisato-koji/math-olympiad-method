        explain: |-
          ひかりは まっすぐ すすむので、たいようの はんたいがわに かげが できます（まえの たんげんで ならった こと）。
          たいようが ひくい あさと 夕がたは、ひかりが ななめに あたるので かげが ながく なります。ひるは たいようが たかいので、かげは みじかく なります。
          あさは たいようが ひがしに あるので かげは にしへ、ひるは みなみに あるので かげは きたへ、夕がたは にしに あるので かげは ひがしへ のびます。1 日で、かげの むきは にし → きた → ひがしと うつります。
          にわや こうえんに ぼうを 立て、かげの さきに 石を おいて いくと、かげの うごきが 見えます。
      - part: 見本
        text: |-
          月の かたちは、日に よって かわります。
          ほそい みかづき → はんげつ → まるい まんげつ。
          そのあと また ほそく なり、やく 30 日で もとに もどります。
