        explain: |-
          たいようは ひがしの 空から のぼり、ひる 12 じ ごろ みなみの 空で いちばん たかく なり、にしの 空に しずみます。じっさいに まわって いるのは ちきゅうで、ちきゅうが 1 日に 1 かい まわるので、たいようが うごいて 見えます。
          ほうがくは ひがし・にし・みなみ・きたの 四つです。ひるの たいようが みなみに あるので、みなみを むいて 立つと「左が ひがし、右が にし、うしろが きた」と おぼえやすく なります（きたを むくと 右が ひがし、と おぼえても おなじ ことです）。
          えの だ円は じめんを ななめ上から 見た ものです。おくが みなみ、手まえが きたです。たいようを じかに 見ると 目を いためるので、かならず 見ない ように つたえます。
