# W-043 太陽と月の動き
#
# 段 1・水準 1・5 日。1 日の太陽の動き（東から出て南の空を通り西にしずむ）、東西南北、影の向きと長さ（影は太陽の反対側にでき、朝と夕方は長く昼は短い）、月の形の移り変わり（三日月・半月・満月、約 30 日でもどる）を扱う。
# 日の並び：1 導入（太陽の動き・東西南北）、2 練習（影の向きと長さ・月の形）、3 わけ（朝と夕方で影の向きが反対になるわけ）、4 混ぜる、5 確認。
# 図の約束：横から見た図は南を向いて見るので左が東・右が西。地面の楕円は斜め上から見た図で、奥が南・手前が北。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note、kinds（腕だめしは読み取り）は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。

