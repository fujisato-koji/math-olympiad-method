    text: 1 辺が 8 cm の正方形があります。この正方形の各辺の中点を結んで内側に正方形をかき、その正方形の各辺の中点を結んでまた正方形をかく、ということをくり返します。はじめの正方形もふくめて、10 個の正方形の面積をすべて足すと何 cm² ですか。
    svg: '<svg viewBox="0 0 220 204" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="20" width="160" height="160" rx="0" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="100,20 180,100 100,180 20,100" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="140,60 140,140 60,140 60,60" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="140,100 100,140 60,100 100,60" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="120,80 120,120 80,120 80,80" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="1.5"/><text x="100" y="197" font-size="13" text-anchor="middle" fill="currentColor">8 cm</text></svg>'
    answer: 1023/8
    accept: [127.875]
    check: "sum(Fraction(64) * Fraction(1, 2) ** k for k in range(10))"
    hints:
      - text: 中点を結んだ正方形の面積は、もとの正方形の面積の何倍でしょう。四すみの三角形を内側に折り返して考えましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="20" width="160" height="160" rx="0" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="120,20 200,100 120,180 40,100" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="40,20 120,20 40,100" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1.5"/><polygon points="120,20 200,20 200,100" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1.5"/><polygon points="200,100 200,180 120,180" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1.5"/><polygon points="40,100 120,180 40,180" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1.5"/><polygon points="120,20 40,100 120,100" fill="#f3c969" fill-opacity=".25" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M 58 40 Q 66 66 92 76" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="92,76 84.1,76.8 87.1,69.7" fill="#f08080"/><text x="268" y="60" font-size="13" text-anchor="middle" fill="currentColor">四すみの三角形を</text><text x="268" y="82" font-size="13" text-anchor="middle" fill="currentColor">内側に折ると</text><text x="268" y="104" font-size="13" text-anchor="middle" fill="currentColor">中の正方形は？</text></svg>'
      - 10 個の面積は、初項 64、公比いくつの等比数列でしょう。
      - 和の式 a(1 − rⁿ)/(1 − r) を使いましょう。
    paths:
      - [四すみの三角形を内側に折ると中の正方形がちょうどおおわれるので、面積は半分, 面積は初項 64、公比 1/2 の等比数列, 64 × (1 − 1/1024) ÷ (1/2) = 128 − 1/8 = 1023/8]
      - [面積を順に 64、32、16、8、4、2、1、1/2、1/4、1/8 と出す, 足すと 127 + 7/8 = 1023/8]
    note: 面積が半分になること（面積の G-008 と、折り返しの見方）に気づけば、等比数列の和の問題になる。和はほぼ 128 cm² で、10 個足しても 128 にとどかない。(1/2)¹⁰ = 1/1024 の《分数》の計算でつまずきやすい。
