      - part: わけ
        text: 初項 a、公比 r（r は 1 でない）の等比数列の、初項から第 n 項までの和 Sₙ は、Sₙ = a(rⁿ − 1)/(r − 1) です。このわけを、筋道を立てて書きましょう。
        explain: 例：「Sₙ = a + ar + ar² + … + arⁿ⁻¹ とする。両辺に r をかけると rSₙ = ar + ar² + … + arⁿ⁻¹ + arⁿ である。rSₙ から Sₙ をひくと、ar から arⁿ⁻¹ までの項はどちらの式にもあるので消えて、rSₙ − Sₙ = arⁿ − a となる。左辺は (r − 1)Sₙ、右辺は a(rⁿ − 1)（分配法則）である。r は 1 でないので r − 1 は 0 でなく、両辺を r − 1 でわってよい。よって Sₙ = a(rⁿ − 1)/(r − 1) である。」と書ければよい。①「〜とする」で Sₙ を式で書く、② r をかけた式からひいて、同じ項が消えることを示す、③ 約束した事実（分配法則、0 でない数でわってよい）で結ぶ、の 3 つがそろっているかを見る。r = 1 なら r − 1 = 0 でわれないので、そのときは Sₙ = na と別に求めることにも触れる。n = 3 のような例で確かめただけで終わっていたら、例ではすべての n を示せないことを話す。帰納法（L-012）で示してもよい。
        hints:
          - 「Sₙ = a + ar + … + arⁿ⁻¹ とする」から書き始めましょう。
          - rSₙ を書いて、Sₙ と並べてみましょう。
          - rSₙ − Sₙ で、どの項が残るでしょう。r − 1 でわってよいわけも書きましょう。
        paths:
          - [Sₙ = a + ar + … + arⁿ⁻¹ とする, rSₙ = ar + … + arⁿ, rSₙ − Sₙ = arⁿ − a, (r − 1)Sₙ = a(rⁿ − 1), r ≠ 1 なので r − 1 でわる]
      - part: わけ
        text: 漸化式 aₙ₊₁ = paₙ + q（p は 1 でない）で、α = pα + q を満たす数 α をとると、数列 {aₙ − α} は公比 p の等比数列になります。このわけを、筋道を立てて書きましょう。
        explain: 例：「α は α = pα + q を満たす数とする（p は 1 でないので、α(1 − p) = q から α = q/(1 − p) と 1 つに決まる）。漸化式 aₙ₊₁ = paₙ + q から α = pα + q を辺々ひくと、aₙ₊₁ − α = paₙ − pα = p(aₙ − α)（q が消え、分配法則で p をくくる）。bₙ = aₙ − α とおくと、どの n でも bₙ₊₁ = pbₙ である。これは、どの項にも p をかけると次の項になるということなので、{bₙ} は公比 p の等比数列である（初項は a₁ − α）。」と書ければよい。①「〜とする」で α を決める（α が決まるわけも）、② 2 つの式を辺々ひいて式を変形する、③ 約束した事実（等比数列の定義、分配法則）で結ぶ、の 3 つがそろっているかを見る。ここから aₙ = (a₁ − α)pⁿ⁻¹ + α が出ることにも触れる。p = 1 のときは α が決まらない（q が 0 でなければ解がない）ので、等差数列として別に扱うことを話す。
        hints:
          - 「α は α = pα + q を満たす数とする」から書き始めましょう。
          - aₙ₊₁ = paₙ + q と α = pα + q を、辺々ひいてみましょう。
          - できた式から、等比数列の定義（どの項にも同じ数をかけると次の項）に結びつけましょう。
        paths:
          - [α = pα + q とする, 辺々ひいて aₙ₊₁ − α = p(aₙ − α), bₙ = aₙ − α とおくと bₙ₊₁ = pbₙ, 数列 bₙ は公比 p の等比数列]
      - part: わけ
        text: 数列 {aₙ} の階差数列を {bₙ}（bₙ = aₙ₊₁ − aₙ）とすると、n ≧ 2 のとき aₙ = a₁ + (b₁ + b₂ + … + bₙ₋₁) です。このわけを、筋道を立てて書きましょう。
        explain: 例：「n を 2 以上の整数とする。階差数列の定義から、a₂ − a₁ = b₁、a₃ − a₂ = b₂、…、aₙ − aₙ₋₁ = bₙ₋₁ の n − 1 個の式が成り立つ。これらの左辺どうし、右辺どうしを足すと、左辺では a₂ から aₙ₋₁ までがそれぞれ 1 回ずつ足されて 1 回ずつひかれるので消え、aₙ − a₁ だけが残る。よって aₙ − a₁ = b₁ + b₂ + … + bₙ₋₁、つまり aₙ = a₁ + (b₁ + … + bₙ₋₁) である。」と書ければよい。①「〜とする」で n を決め、階差の定義の式を並べる、② 足して途中の項が消えることを示す、③ 約束した事実（等式の両辺に同じものを足しても等式）で結ぶ、の 3 つがそろっているかを見る。n = 1 では足す項がないので式が使えず、求めた式が n = 1 でも成り立つかは、別に確かめることを話す。aₙ₊₁ = aₙ + bₙ を a₂ から順に書いて、代入をくり返す説明でもよい。
        hints:
          - 「n を 2 以上の整数とする」として、a₂ − a₁ = b₁ から aₙ − aₙ₋₁ = bₙ₋₁ までを並べましょう。
          - 並べた式を全部足すと、左辺はどうなるでしょう。
          - 消える項と残る項を確かめて、結論を書きましょう。
        paths:
          - [n ≧ 2 とする, a₂ − a₁ = b₁、…、aₙ − aₙ₋₁ = bₙ₋₁, 辺々足すと途中が消えて aₙ − a₁ = b₁ + … + bₙ₋₁, aₙ = a₁ + (b₁ + … + bₙ₋₁)]
