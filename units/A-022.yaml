# A-022 数列（等比数列を含む）と漸化式
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目 導入：等比数列（初項、公比、第 n 項 arⁿ⁻¹）。等差数列（A-004）の「足す」と、等比数列の「かける」をくらべる。
#   2 日目 練習：等比数列の和（S に公比をかけてひく）。公比が負の数や分数のとき。頭に見本。
#   3 日目 練習：漸化式の読み方（等差、等比）と階差数列（aₙ₊₁ = aₙ + bₙ から aₙ = a₁ + b₁ + … + bₙ₋₁）。頭に見本。
#   4 日目 練習：aₙ₊₁ = paₙ + q（α = pα + q となる α をひくと {aₙ − α} が等比数列）。頭に見本。
#   5 日目 練習：和 Sₙ から一般項（aₙ = Sₙ − Sₙ₋₁ は n ≧ 2、a₁ は S₁）と、場面を漸化式で表す（薬の量、積み立て）。頭に見本。
#   6 日目 わけ（3 問とも ③：等比数列の和の公式、{aₙ − α} が等比数列になること、階差数列から一般項）。
#   7 日目 混ぜる：A-008（群数列）、C-009（前の結果から数える）、A-004（等差数列）、L-012 と 1〜5 日目の型。8 日目 確認。
# 前提は A-008、L-012、A-009、A-010、C-009。たどると A-004（等差数列とその和）、A-011（1 次方程式）、A-013（不等式）、
#   A-015（展開）、N-027（正負の数）、N-019（分数）、N-073（大きな数）までなので、これらを道具にする。
#   L-012 で示した 1 + 2 + … + n = n(n + 1)/2 と、帰納法での確かめも使ってよい。
#   Σ の記号（A-018）は前提にないので、和は「a₁ + a₂ + … + aₙ」と書く。
#   2 次方程式（A-017）と平方根（A-016）は前提にないので、3 項間の漸化式の特性方程式は扱わない（項を順に出すだけ）。
#     公比を 2 つの項から求めるときは、「3 回かけて 27 になる数」のように、実数がただ 1 つに決まるもの（3 乗）か、公比が正と決めたものにした。
#   A-009 は 0 乗を扱っていないので、1 日目の見本で r⁰ = 1 と約束する。
#   極限（D-002）は後ろの単元なので、無限等比級数（項を限りなく足す）は扱わない。
# 文字は L-012 の書き方（a₁、aₙ、aₙ₊₁ は下つき、rⁿ⁻¹、2ⁿ は上つき）。数列は {aₙ} と書く。式の中のかけ算の数どうしは「2 × 3ⁿ⁻¹」と書く。
# check：項は itertools.accumulate で漸化式をまねて作る（initial が a₁、iterable の n を使って aₙ₊₁ を出す）。和は sum で直接足す。
#   一般項を選ぶ問題は、選択肢ごとの式（lambda n）が、漸化式で作った項と n = 1〜8 で全部合うものを選び出す。分数は Fraction で計算する。
# 等比数列と漸化式は、極限と級数（D-002）、ローンと年金（F-005）、個体群の成長（B-040）、数値計算の反復法（K-160）、
#   指数平滑法（E-155）、時系列解析（F-034）、予測誤差で学ぶモデル（Q-007）、母関数（C-026）の入口になる（D-026）。

id: A-022
days:
  - day: 1
    items:
      - part: 見本
        text: 数列 2、6、18、54、… は、どの項にも 3 をかけると次の項になります。このような数列を調べてみましょう。
        explain: 数を 1 列に並べたものを数列といい、最初の項を初項、n 番目の項を第 n 項といって aₙ と書きます（L-012）。初項に一定の数 r を次々にかけてできる数列を等比数列といい、r を公比といいます。2、6、18、54、… は初項 2、公比 3 の等比数列です。第 n 項は、初項に r を n − 1 回かけた数なので、初項を a とすると aₙ = arⁿ⁻¹ です。n = 1 のときは r を 1 回もかけないので、r⁰ = 1 と約束します。たとえば、この数列の第 6 項は 2 × 3⁵ = 486 です。公比は、となり合う 2 つの項の比 aₙ₊₁ ÷ aₙ で求められます。公比は負の数や分数でもよく、3、−6、12、−24、… は公比 −2、48、24、12、6、… は公比 1/2 の等比数列です。同じ数ずつ増える等差数列（A-004）の第 n 項 a + (n − 1)d とくらべると、等差数列では公差 d を「足す」ことが、等比数列では公比 r を「かける」ことが、n − 1 回くり返されています。
      - part: 思い出す
        text: 等差数列 5、9、13、17、… の第 20 項はいくつですか。
        answer: 81
        check: "5 + (20 - 1) * 4"
        hints:
          - 公差（となり合う項の差）を求めましょう。
          - 第 20 項は、初項に公差を何回足した数でしょう。
          - 初項 + 公差 × (20 − 1) を計算しましょう。
        paths:
          - [公差は 4, 5 + 19 × 4, 81]
      - part: 思い出す
        text: 2³ × 2⁴ は、2 の何乗ですか。
        answer: 7
        check: "[k for k in range(1, 30) if 2 ** k == 2 ** 3 * 2 ** 4][0]"
        hints:
          - 2³ は 2 を 3 回かけた数です。
          - 2⁴ と合わせて、2 を何回かけていることになるでしょう。
          - 指数法則（A-009）を思い出しましょう。
        paths:
          - [2 を 3 回と 4 回かける, 合わせて 3 + 4 回, 2⁷]
      - part: 今日
        text: 等比数列 5、15、45、… の第 6 項はいくつですか。
        answer: 1215
        check: "5 * 3 ** (6 - 1)"
        hints:
          - まず公比を求めましょう。
          - 第 6 項は、初項に公比を何回かけた数でしょう。
          - 公比の累乗を先に計算しましょう。
        paths:
          - [公比は 15 ÷ 5 = 3, 第 6 項は 5 × 3⁵, 5 × 243 = 1215]
          - [45 から 3 倍を 3 回, 135、405、1215]
      - part: 今日
        text: 等比数列 64、−32、16、… の公比はいくつですか。
        answer: −1/2
        accept: [−0.5]
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-32, 64))"
        hints:
          - 公比は、となり合う 2 つの項の比です。
          - 第 2 項 ÷ 第 1 項 を計算しましょう。
          - 符号が交互に変わるとき、公比は負の数です。
        paths:
          - [−32 ÷ 64 = −1/2, 確かめ：16 ÷ (−32) = −1/2]
        note: 符号を落として 1/2 としやすい。値が半分ずつ小さくなるのを見て「公比 2」と、わる向きを逆にすることもある。
      - part: 挑戦
        text: 第 2 項が 12、第 5 項が 324 の等比数列があります。公比は実数です。初項はいくつですか。
        answer: 4
        check: "[Fraction(12, r) for r in range(-10, 11) if r != 0 and 12 * r ** 3 == 324][0]"
        hints:
          - 第 2 項から第 5 項へは、公比を何回かけるでしょう。
          - 公比を r として、12 × r³ = 324 の式をつくりましょう。
          - 3 回かけて 27 になる実数は 1 つだけです。
        paths:
          - [12r³ = 324, r³ = 27 で r = 3, 初項は 12 ÷ 3 = 4]
        note: 324 ÷ 12 = 27 をそのまま公比としやすい。第 2 項と第 5 項の間には公比が 3 回かかっている。
    extra:
      - part: 今日
        text: 等比数列 3、6、12、… の第 8 項はいくつですか。
        answer: 384
        check: "3 * 2 ** (8 - 1)"
        hints:
          - 公比を求めましょう。
          - 第 8 項は、初項に公比を 7 回かけた数です。
          - 2⁷ を先に計算しましょう。
        paths:
          - [公比は 2, 3 × 2⁷, 3 × 128 = 384]
      - part: 今日
        text: 初項が −2、公比が 3 の等比数列の第 4 項はいくつですか。
        answer: −54
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(-2 * 3 ** 3)"
        hints:
          - 第 4 項は、初項に公比を何回かけた数でしょう。
          - 3³ を計算しましょう。
          - 負の数と正の数の積の符号に気をつけましょう。
        paths:
          - [−2 × 3³, −2 × 27, −54]
      - part: 挑戦
        text: 等比数列 2、6、18、… で、初めて 1000 より大きくなるのは第何項ですか。
        answer: 7
        check: "[n for n in range(1, 30) if 2 * 3 ** (n - 1) > 1000][0]"
        hints:
          - 第 n 項を n の式で表しましょう。
          - 2 × 3ⁿ⁻¹ > 1000 は、3ⁿ⁻¹ > 500 と同じです。
          - 3 の累乗を、3、9、27、… と順に求めましょう。
        paths:
          - [第 n 項は 2 × 3ⁿ⁻¹, 3⁵ = 243 < 500 < 729 = 3⁶, n − 1 = 6 で第 7 項]
        note: 3⁶ = 729 を見つけて、第 6 項と答えやすい。指数は n − 1 なので、項の番号は 1 つ大きい。

  - day: 2
    items:
      - part: 見本
        text: 等比数列の和 S = 1 + 3 + 9 + 27 + 81 を、くふうして求めてみましょう。
        explain: S に公比 3 をかけると 3S = 3 + 9 + 27 + 81 + 243 です。3S から S をひくと、同じ項が消えて 3S − S = 243 − 1、つまり 2S = 242 で、S = 121 です。一般に、初項 a、公比 r の等比数列の初項から第 n 項までの和を Sₙ とすると、Sₙ = a + ar + … + arⁿ⁻¹、rSₙ = ar + ar² + … + arⁿ なので、rSₙ − Sₙ = arⁿ − a です。r が 1 でなければ、両辺を r − 1 でわって Sₙ = a(rⁿ − 1)/(r − 1) となります（わけは 6 日目）。r が 1 より小さいときは、分母と分子に −1 をかけた Sₙ = a(1 − rⁿ)/(1 − r) を使うと計算しやすくなります。r = 1 のときは、どの項も a なので Sₙ = na です。公比が負の数のときも同じ式が使えますが、rⁿ の符号（n が偶数なら正、奇数なら負）に気をつけます。
      - part: 思い出す
        text: 初項が 3、公比が −2 の等比数列の第 5 項はいくつですか。
        answer: 48
        check: "3 * (-2) ** 4"
        hints:
          - 第 5 項は、初項に公比を何回かけた数でしょう。
          - (−2)⁴ の符号を考えましょう。
          - 負の数を偶数回かけると正の数になります。
        paths:
          - [3 × (−2)⁴, 3 × 16, 48]
      - part: 思い出す
        text: 等差数列の和 2 + 5 + 8 + … + 29 はいくつですか。
        answer: 155
        check: "sum(range(2, 30, 3))"
        hints:
          - 項がいくつあるかを、公差から求めましょう。
          - はしから組にして足すと、どの組も同じ数になります（A-004）。
          - 組の和 × 組の数 を計算しましょう。
        paths:
          - [項は (29 − 2) ÷ 3 + 1 = 10 個, はしから組にすると 2 + 29 = 31 が 5 組, 31 × 5 = 155]
      - part: 今日
        text: 初項が 2、公比が 3 の等比数列の、初項から第 6 項までの和はいくつですか。
        answer: 728
        check: "sum(2 * 3 ** k for k in range(6))"
        hints:
          - 和の式 a(rⁿ − 1)/(r − 1) に、a、r、n を入れましょう。
          - 3⁶ を計算しましょう。
          - 分母の r − 1 に気をつけましょう。
        paths:
          - [2 × (3⁶ − 1) ÷ (3 − 1), 2 × 728 ÷ 2, 728]
          - [2 + 6 + 18 + 54 + 162 + 486 = 728]
      - part: 今日
        text: 初項が 96、公比が 1/2 の等比数列の、初項から第 6 項までの和はいくつですか。
        answer: 189
        check: "sum(Fraction(96) * Fraction(1, 2) ** k for k in range(6))"
        hints:
          - 公比が 1 より小さいので、a(1 − rⁿ)/(1 − r) を使いましょう。
          - (1/2)⁶ = 1/64 です。
          - 項を書き出して確かめてもよいです。
        paths:
          - [96 × (1 − 1/64) ÷ (1/2), 96 × 63/64 × 2, 189]
          - [96 + 48 + 24 + 12 + 6 + 3 = 189]
      - part: 挑戦
        text: 初項が 3、公比が −2 の等比数列の、初項から第 7 項までの和はいくつですか。
        answer: 129
        check: "sum(3 * (-2) ** k for k in range(7))"
        hints:
          - 和の式に、r = −2、n = 7 を入れましょう。
          - (−2)⁷ は負の数です。
          - 分母の r − 1 も負の数になります。
        paths:
          - [3 × ((−2)⁷ − 1) ÷ (−2 − 1), 3 × (−129) ÷ (−3), 129]
          - [3 − 6 + 12 − 24 + 48 − 96 + 192 = 129]
        note: (−2)⁷ を 128 として、3 × 127 ÷ (−3) = −127 としやすい。項を書き出すと、符号が交互になることが見える。
    extra:
      - part: 今日
        text: 等比数列の和 5 + 10 + 20 + … + 640 はいくつですか。
        answer: 1275
        check: "sum(5 * 2 ** k for k in range(8))"
        hints:
          - 640 は第何項かを、640 ÷ 5 が 2 の何乗かで調べましょう。
          - 項の数がわかったら、和の式を使いましょう。
          - 2⁸ − 1 を計算しましょう。
        paths:
          - [640 = 5 × 2⁷ なので第 8 項, 5 × (2⁸ − 1) ÷ (2 − 1), 5 × 255 = 1275]
        note: 640 = 5 × 2⁷ から項の数を 7 としやすい。指数 + 1 が項の数。
      - part: 今日
        text: 初項が 4、公比が 3 の等比数列の、初項から第 5 項までの和はいくつですか。
        answer: 484
        check: "sum(4 * 3 ** k for k in range(5))"
        hints:
          - 和の式 a(rⁿ − 1)/(r − 1) に入れましょう。
          - 3⁵ を計算しましょう。
          - 最後に r − 1 でわりましょう。
        paths:
          - [4 × (3⁵ − 1) ÷ (3 − 1), 4 × 242 ÷ 2, 484]
      - part: 挑戦
        text: ある等比数列で、初項から第 3 項までの和が 7、第 4 項から第 6 項までの和が 56 です。公比は実数です。第 7 項から第 9 項までの和はいくつですか。
        answer: 448
        check: "[a * (r ** 6 + r ** 7 + r ** 8) for r in range(-10, 11) for a in range(-10, 11) if a * (1 + r + r * r) == 7 and a * (r ** 3 + r ** 4 + r ** 5) == 56][0]"
        hints:
          - 第 4 項から第 6 項までの和は、初項から第 3 項までの和の何倍になっているでしょう。
          - 公比を r とすると、第 4 項 ＝ 第 1 項 × r³ です。
          - 第 7 項から第 9 項までの和も、同じように考えましょう。
        paths:
          - [第 4〜6 項の和は第 1〜3 項の和の r³ 倍, r³ = 56 ÷ 7 = 8, 第 7〜9 項の和は 56 × 8 = 448]
        note: 初項と公比を求めなくても、3 項ずつのかたまりが r³ 倍ずつになることに気づけば解ける。求めると r = 2、初項 1。

  - day: 3
    items:
      - part: 見本
        text: a₁ = 2、aₙ₊₁ = aₙ + 2n で決まる数列 {aₙ} の第 n 項を、n の式で表してみましょう。
        explain: 前の項から次の項を決める式を漸化式といいます。aₙ₊₁ = aₙ + d は公差 d の等差数列を、aₙ₊₁ = raₙ は公比 r の等比数列を表します（C-009、L-012 では、漸化式から項を順に計算しました）。数列 {aₙ} のとなり合う項の差 bₙ = aₙ₊₁ − aₙ を並べた数列 {bₙ} を、{aₙ} の階差数列といいます。aₙ₊₁ = aₙ + 2n では、階差数列は bₙ = 2n です。a₂ = a₁ + b₁、a₃ = a₂ + b₂、… と順に足していくと、n ≧ 2 のとき aₙ = a₁ + (b₁ + b₂ + … + bₙ₋₁) となります（わけは 6 日目）。ここでは b₁ + … + bₙ₋₁ = 2 + 4 + … + 2(n − 1) = 2 × (1 + 2 + … + (n − 1)) です。L-012 で示した 1 + 2 + … + n = n(n + 1)/2 の n を n − 1 にかえると 1 + 2 + … + (n − 1) = (n − 1)n/2 なので、b₁ + … + bₙ₋₁ = n(n − 1) です。よって aₙ = 2 + n(n − 1) = n² − n + 2 です。この式は n ≧ 2 で求めたので、n = 1 のときを確かめると 1 − 1 + 2 = 2 = a₁ で、すべての n で成り立ちます。
      - part: 思い出す
        text: 等比数列の和 2 + 4 + 8 + 16 + 32 + 64 はいくつですか。
        answer: 126
        check: "sum(2 ** k for k in range(1, 7))"
        hints:
          - 初項、公比、項の数を確かめましょう。
          - 和の式 a(rⁿ − 1)/(r − 1) を使いましょう。
          - 2⁶ − 1 を計算しましょう。
        paths:
          - [初項 2、公比 2、6 項, 2 × (2⁶ − 1) ÷ (2 − 1), 2 × 63 = 126]
      - part: 思い出す
        text: a₁ = 2、aₙ₊₁ = 3aₙ − 1 で決まる数列の a₄ はいくつですか。
        answer: 41
        check: "[x for x in itertools.accumulate(range(1, 4), lambda a, n: 3 * a - 1, initial=2)][3]"
        hints:
          - n = 1 を入れると、a₂ = 3a₁ − 1 です。
          - a₂、a₃ と順に計算しましょう。
          - 3 倍してから 1 をひきます。
        paths:
          - [a₂ = 3 × 2 − 1 = 5, a₃ = 3 × 5 − 1 = 14, a₄ = 3 × 14 − 1 = 41]
      - part: 今日
        text: a₁ = 7、aₙ₊₁ = aₙ − 3 で決まる数列の a₂₀ はいくつですか。
        answer: −50
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([x for x in itertools.accumulate(range(1, 20), lambda a, n: a - 3, initial=7)][19])"
        hints:
          - この漸化式は、どんな数列を表しているでしょう。
          - 公差はいくつでしょう。
          - 第 20 項は、初項に公差を何回足した数でしょう。
        paths:
          - [初項 7、公差 −3 の等差数列, a₂₀ = 7 + 19 × (−3), 7 − 57 = −50]
      - part: 今日
        text: a₁ = 1、aₙ₊₁ = aₙ + 3ⁿ で決まる数列 {aₙ} の一般項は、どれですか。
        choices: [aₙ = (3ⁿ − 1)/2, aₙ = (3ⁿ⁺¹ − 1)/2, aₙ = 3ⁿ − 2, aₙ = (3ⁿ⁻¹ + 1)/2]
        answer: aₙ = (3ⁿ − 1)/2
        check: "(lambda s: [c for c, f in {'aₙ = (3ⁿ − 1)/2': lambda n: Fraction(3 ** n - 1, 2), 'aₙ = (3ⁿ⁺¹ − 1)/2': lambda n: Fraction(3 ** (n + 1) - 1, 2), 'aₙ = 3ⁿ − 2': lambda n: 3 ** n - 2, 'aₙ = (3ⁿ⁻¹ + 1)/2': lambda n: Fraction(3 ** (n - 1) + 1, 2)}.items() if all(f(n) == s[n - 1] for n in range(1, 9))][0])([x for x in itertools.accumulate(range(1, 8), lambda a, n: a + 3 ** n, initial=1)])"
        hints:
          - 階差数列は bₙ = 3ⁿ です。
          - n ≧ 2 のとき、aₙ = 1 + (3 + 3² + … + 3ⁿ⁻¹) です。
          - 1 + 3 + … + 3ⁿ⁻¹ は、初項 1、公比 3 の等比数列の n 項の和です。
        paths:
          - [aₙ = 1 + 3 + 3² + … + 3ⁿ⁻¹, 初項 1、公比 3、n 項の和, (3ⁿ − 1) ÷ (3 − 1) = (3ⁿ − 1)/2]
          - [a₁ = 1、a₂ = 4、a₃ = 13 を選択肢に入れて確かめる]
