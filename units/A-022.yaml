        check: "(lambda S: [c for c, f in {'a₁ = 6、n ≧ 2 では aₙ = 2n + 3': lambda n: 6 if n == 1 else 2 * n + 3, 'すべての n で aₙ = 2n + 3': lambda n: 2 * n + 3, 'すべての n で aₙ = 2n + 5': lambda n: 2 * n + 5, 'a₁ = 6、n ≧ 2 では aₙ = 2n + 5': lambda n: 6 if n == 1 else 2 * n + 5}.items() if all(f(n) == (S(1) if n == 1 else S(n) - S(n - 1)) for n in range(1, 10))][0])(lambda n: n * n + 4 * n + 1)"
