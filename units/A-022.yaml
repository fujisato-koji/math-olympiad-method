        explain: 数を 1 列に並べたものを数列といい、最初の項を初項、n 番目の項を第 n 項といって aₙ と書きます（L-012）。初項に一定の数 r を次々にかけてできる数列を等比数列といい、r を公比といいます。2、6、18、54、… は初項 2、公比 3 の等比数列です。第 n 項は、初項に r を n − 1 回かけた数なので、初項を a とすると aₙ = arⁿ⁻¹ です。n = 1 のときは r を 1 回もかけないので、r⁰ = 1 と約束します。たとえば、この数列の第 6 項は 2 × 3⁵ = 486 です。公比は、となり合う 2 つの項の比 aₙ₊₁ ÷ aₙ で求められます。公比は負の数や《分数》でもよく、3、−6、12、−24、… は公比 −2、48、24、12、6、… は公比 1/2 の等比数列です。同じ数ずつ増える等差数列（A-004）の第 n 項 a + (n − 1)d とくらべると、等差数列では公差 d を「足す」ことが、等比数列では公比 r を「かける」ことが、n − 1 回くり返されています。
