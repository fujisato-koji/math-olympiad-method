 stroke-linecap="round"/><polygon points="160,124 156.2,117 163.8,117" fill="currentColor"/><text x="160" y="142" font-size="13" text-anchor="middle" fill="currentColor">b₂ = □</text><line x1="206" y1="128" x2="220.9" y2="55.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="222,50 224.4,57.6 216.8,56.1" fill="currentColor"/><text x="266" y="16" font-size="13" text-anchor="middle" fill="currentColor">3 年目</text><rect x="222" y="24" width="88" height="30" rx="6" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="266" y="44" font-size="12" text-anchor="middle" fill="currentColor">はじめ +10000</text><line x1="266" y1="56" x2="266" y2="68.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="266,74 262.1,67 269.9,67" fill="currentColor"/><rect x="222" y="76" width="88" height="30" rx="6" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="266" y="96" font-size="12" text-anchor="middle" fill="currentColor">終わり ×1.1</text><line x1="266" y1="108" x2="266" y2="118.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="266,124 262.1,117 269.9,117" fill="currentColor"/><text x="266" y="142" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">b₃ = ?</text><text x="160" y="172" font-size="12" text-anchor="middle" fill="currentColor">1.1 倍は、そのときの金額に 1 わりを足すこと</text></svg>'
