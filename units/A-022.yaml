# A-022 数列（等比数列を含む）と漸化式
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目 導入：等比数列（初項、公比、第 n 項 arⁿ⁻¹）。等差数列（A-004）の「足す」と、等比数列の「かける」をくらべる。
#   2 日目 練習：等比数列の和（S に公比をかけてひく）。公比が負の数や分数のとき。頭に見本。
#   3 日目 練習：漸化式の読み方（等差、等比）と階差数列（aₙ₊₁ = aₙ + bₙ から aₙ = a₁ + b₁ + … + bₙ₋₁）。頭に見本。
#   4 日目 練習：aₙ₊₁ = paₙ + q（α = pα + q となる α をひくと {aₙ − α} が等比数列）。頭に見本。
#   5 日目 練習：和 Sₙ から一般項（aₙ = Sₙ − Sₙ₋₁ は n ≧ 2、a₁ は S₁）と、場面を漸化式で表す（薬の量、積み立て）。頭に見本。
#   6 日目 わけ（3 問とも ③：等比数列の和の公式、{aₙ − α} が等比数列になること、階差数列から一般項）。
#   7 日目 混ぜる：A-008（群数列）、C-009（前の結果から数える）、A-004（等差数列）、L-012 と 1〜5 日目の型。8 日目 確認。
# 前提は A-008、L-012、A-009、A-010、C-009。たどると A-004（等差数列とその和）、A-011（1 次方程式）、A-013（不等式）、
#   A-015（展開）、N-027（正負の数）、N-019（分数）、N-073（大きな数）までなので、これらを道具にする。
#   L-012 で示した 1 + 2 + … + n = n(n + 1)/2 と、帰納法での確かめも使ってよい。
#   Σ の記号（A-018）は前提にないので、和は「a₁ + a₂ + … + aₙ」と書く。
#   2 次方程式（A-017）と平方根（A-016）は前提にないので、3 項間の漸化式の特性方程式は扱わない（項を順に出すだけ）。
#     公比を 2 つの項から求めるときは、「3 回かけて 27 になる数」のように、実数がただ 1 つに決まるもの（3 乗）か、公比が正と決めたものにした。
#   A-009 は 0 乗を扱っていないので、1 日目の見本で r⁰ = 1 と約束する。
#   極限（D-002）は後ろの単元なので、無限等比級数（項を限りなく足す）は扱わない。
# 文字は L-012 の書き方（a₁、aₙ、aₙ₊₁ は下つき、rⁿ⁻¹、2ⁿ は上つき）。数列は {aₙ} と書く。式の中のかけ算の数どうしは「2 × 3ⁿ⁻¹」と書く。
# check：項は itertools.accumulate で漸化式をまねて作る（initial が a₁、iterable の n を使って aₙ₊₁ を出す）。和は sum で直接足す。
#   一般項を選ぶ問題は、選択肢ごとの式（lambda n）が、漸化式で作った項と n = 1〜8 で全部合うものを選び出す。分数は Fraction で計算する。
# 等比数列と漸化式は、極限と級数（D-002）、ローンと年金（F-005）、個体群の成長（B-040）、数値計算の反復法（K-160）、
#   指数平滑法（E-155）、時系列解析（F-034）、予測誤差で学ぶモデル（Q-007）、母関数（C-026）の入口になる（D-026）。
# ただし腕だめしの最難関（7 まいの平面が空間を分ける数）だけは例外で、uses に C-007、C-015、C-014 を挙げて、選び方の数（組合せ、二項係数）と、対応させて数える考えを使う。

