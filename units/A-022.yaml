    text: 空間に 7 まいの平面があります。どの 2 まいも平行でなく、どの 3 まいもちょうど 1 点で交わり、どの 4 まいも同じ点を通りません。この 7 まいの平面は、空間をいくつの部分に分けますか。また、そのわけを書きましょう。
    answer: 64
    check: '(lambda P, D: len({sum((P[i][0]*x + P[i][1]*y + P[i][2]*z > P[i][3]) << i for i in range(7)) for x in range(-20, 21) for y in range(-20, 21) for z in range(-20, 21) if all(p[0]*x + p[1]*y + p[2]*z != p[3] for p in P)}) if all(D([r[:3] for r in t]) != 0 for t in itertools.combinations(P, 3)) and all(t[3][0]*Fraction(D([[r[3] if j == 0 else r[j] for j in range(3)] for r in t[:3]]), D([r[:3] for r in t[:3]])) + t[3][1]*Fraction(D([[r[3] if j == 1 else r[j] for j in range(3)] for r in t[:3]]), D([r[:3] for r in t[:3]])) + t[3][2]*Fraction(D([[r[3] if j == 2 else r[j] for j in range(3)] for r in t[:3]]), D([r[:3] for r in t[:3]])) != t[3][3] for t in itertools.combinations(P, 4)) else 0)([(-2, 4, -3, 6), (0, -4, -3, 20), (-2, -7, 7, -27), (4, -5, -5, 10), (-5, 1, -4, -39), (-7, 0, -2, -31), (-3, 0, 3, 14)], lambda r: r[0][0]*(r[1][1]*r[2][2] - r[1][2]*r[2][1]) - r[0][1]*(r[1][0]*r[2][2] - r[1][2]*r[2][0]) + r[0][2]*(r[1][0]*r[2][1] - r[1][1]*r[2][0]))'
    hints:
    - 平面が 1 まい、2 まい、3 まい、4 まいのとき、空間が何こに分かれるかを、紙や立体で考えて表にしてみよう。きまりが見えるかな。
    - 新しく足す平面は、前の平面たちにどう切られているかな。
    - 前の平面たちとの交わりは、新しい平面の上でどんな図形になるかな。
    paths:
    - - 平面の上に k 本の直線があり、どの 2 本も平行でなく、どの 3 本も 1 点を通らないとする。k 本目の直線は、前の k − 1 本と k − 1 点で交わり、この k − 1 点で、k 本目の直線は k こに切れる。切れた 1 つずつが、もとの部分を 2 つに分けるので、部分は k こふえる。0 本のときは 1 こなので、k 本で 1 + (1 + 2 + … + k) = 1 + k + k(k − 1)/2 こ
      - 空間で n まい目の平面を足すと、この平面は、前の n − 1 まいと n − 1 本の直線で交わる。3 まいが 1 点で交わるので、この直線のどの 2 本も平行でなく（2 本は n まい目と別の 2 まいの交わりで、その 3 まいが 1 点で交わる）、4 まいが同じ点を通らないので、どの 3 本も 1 点を通らない
      - だから n まい目の平面は、その上の n − 1 本の直線で、1 + (n − 1) + (n − 1)(n − 2)/2 この部分に分かれる。この 1 つずつが、空間の 1 つの部分を 2 つに分けるので、n まい目で、空間の部分の数は 1 + (n − 1) + (n − 1)(n − 2)/2 こふえる。R(n) = R(n − 1) + 1 + (n − 1) + (n − 1)(n − 2)/2
      - R(0) = 1 から、足す数は n = 1、2、…、7 で 1、2、4、7、11、16、22。R は 1、2、4、8、15、26、42、64 とふえる。4 まいのとき、4 まい目の平面は 3 本の直線で 7 つに分かれる（2 倍の 8 つではない）ので、8 + 7 = 15。2 倍ずつにはならない
      - 求める数は R(7) = 64 こ。たしかめ：足した数を全部たすと、1 + 7 + 21 + 35 = 64。つまり 1 + 7 + 7 × 6 ÷ 2 + 7 × 6 × 5 ÷ 6 と書ける
    - - 空間の向きをかえても、部分の数はかわらない。どの平面も、どの 2 まいの交わる直線も水平にならないように、上下の向きをとる。すると、どの部分も「下に限りがある」か「下にどこまでものびる」かのどちらかになる
      - 下に限りがある部分には、いちばん低い点がある。水平な面や線がないので、その点は 3 まいの交わる点になる。反対に、3 まいの交わる点 1 つのまわりを、3 まいの平面は 8 つの角に分ける。どの角も、ふちの 3 本の線は、3 本の交わる直線のそれぞれの、その点から上へ行く半分か下へ行く半分で、8 つの角は、3 本の直線から上か下の半分を 1 つずつ選ぶ 8 通りに 1 つずつあたる。3 本とも上へ行く半分の角だけが、その点より上にあるので、その点がいちばん低い点になる部分は 1 つだけ。だから、このような部分の数は、3 まいの選び方と同じ 7 × 6 × 5 ÷ 6 = 35 こ
      - 交わる点 35 こ全部より下に、水平な平面 H をとる。下にどこまでものびる部分は、H より下の点をもつ。上にもどこまでものびるか、上に限りがあれば、いちばん高い点が 3 まいの交わる点（2 段目の上下を入れかえた考え）で H より上にあるので、H より上の点ももつ。部分は、7 まいの平面のどちらがわにあるかで決まるので、中の 2 点を結ぶ線分も部分に入る。だから H を切る。反対に、下に限りがある部分は、いちばん低い点が H より上なので H を切らない。H の面の中では、7 まいの平面が 7 本の直線になる。交わる直線が水平でないので、どの 2 本も平行でなく、交わる点は全部 H より上にあるので、どの 3 本も 1 点を通らない。下にのびる部分と、H の面の中の部分は 1 つずつ対応する（H の面の中のどの部分も、空間のちょうど 1 つの部分に入り、ちがう部分の切り口は重ならない）
      - H の面の中の部分の数も、同じ考えで数える。H の面の中で、どの直線も水平にならないように向きをとる。2 本の直線は交わる点のまわりを 4 つの角に分け、2 本とも上へ行く半分を選んだ角だけがその点より上にあるので、いちばん低い点をもつ部分は、2 本の交わる点（7 × 6 ÷ 2 = 21 こ）の 1 つずつにちょうど 1 つ。21 この点より下に水平な直線 L をとると、下にどこまでものびる部分は、L より下の点と、L より上の点（上に限りがあれば、いちばん高い点が交わる点）をもつので L を切る。7 本の直線は L を 7 点で切り、L は 8 つの区間に分かれるので、下にのびる部分は 8 こ。H の面の中の部分は 21 + 8 = 29 こ
      - 空間の部分は、下に限りがあるもの 35 こと、下にのびるもの 29 こ。35 + 29 = 64 こ
    note: 考えどころは 3 つ：①小さい場合の表（2、4、8、15）で 2 倍の予想が 4 まいでくずれるのを見て、1 まい足すと何がふえるのかに目をつける、②新しい平面の上にできる直線が、その平面を何こに分けるかが、ふえる部分の数になる（条件から、直線はどの 2 本も平行でなく、どの 3 本も 1 点を通らない）、③平面の上の直線の場合も同じ考えで、1 + k + k(k − 1)/2 をくり返して使う。2 本目は、足していく流れを使わず、部分を点に対応させて一度に数える（下に限りのある部分は 3 まいの交わる点に、下にのびる部分は下の水平な平面の部分に対応させ、その平面の中でも同じ対応を使う）。1 + 7 + 21 + 35 の形が、そのまま出る。check は、7 まいの具体的な平面（整数の係数）を決め、どの 3 まいも 1 点で交わり（行列式が 0 でない）、どの 4 まいも同じ点を通らないことを確かめてから、−20〜20 の整数の格子点それぞれが 7 まいのどちら側にあるかの組を作り、ちがう組の数を数える（64 になる）。既出：「ケーキを n 回切ると何切れ」として知られる古典で、1 + n + n(n − 1)/2 + n(n − 1)(n − 2)/6 の形になる。ここは 7 まいで、「わけを書く」ので、2 本目の対応を自分で作るところがちがう。1 本目は教科書にもある定番の道で、型を知っていればすぐ終わる。2 本目の対応を自分で作るところが決勝級の中心（D-102 により、型を知る子に有利なだけでは落とさない）。わな：4 まいまでを見て「2 倍ずつ」と思い、2⁷ = 128 と答えてしまう。
