          - [n = 1 では S₁ = a で成り立つ, Sₖ で成り立つとすると Sₖ₊₁ = a(rᵏ − 1)/(r − 1) + arᵏ = a(rᵏ⁺¹ − 1)/(r − 1), 帰納法（L-012）ですべての n で成り立つ]
      - part: わけ
        id: "454d32fd8b"
        text: 漸化式 aₙ₊₁ = paₙ + q（p は 1 でない）で、α = pα + q を満たす数 α をとると、数列 {aₙ − α} は公比 p の等比数列になります。このわけを、すじ道を立てて書きましょう。
        explain: 例：「α は α = pα + q を満たす数とする（p は 1 でないので、α(1 − p) = q から α = q/(1 − p) と 1 つに決まる）。漸化式 aₙ₊₁ = paₙ + q から α = pα + q を辺々ひくと、aₙ₊₁ − α = paₙ − pα = p(aₙ − α)（q が消え、分配法則で p をくくる）。bₙ = aₙ − α とおくと、どの n でも bₙ₊₁ = pbₙ である。これは、どの項にも p をかけると次の項になるということなので、{bₙ} は公比 p の等比数列である（初項は a₁ − α）。」と書ければよい。①「〜とする」で α を決める（α が決まるわけも）、② 2 つの式を辺々ひいて式を変形する、③ 約束した事実（等比数列の定義、分配法則）で結ぶ、の 3 つがそろっているかを見る。ここから aₙ = (a₁ − α)pⁿ⁻¹ + α が出ることにもふれる。p = 1 のときは α が決まらない（q が 0 でなければ解がない）ので、等差数列として別に扱うことを話す。
        hints:
          - text: 「α は α = pα + q を満たす数とする」から書き始めましょう。図のように、α からのへだたり aₙ − α に目をつけます。
            svg: '<svg viewBox="0 0 320 172" xmlns="http://www.w3.org/2000/svg"><line x1="12" y1="110" x2="308.4" y2="110" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="314,110 307,113.8 307,106.2" fill="currentColor"/><line x1="79.2" y1="105" x2="79.2" y2="115" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="134.4" y1="105" x2="134.4" y2="115" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="244.8" y1="105" x2="244.8" y2="115" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="79.2" y1="114" x2="79.2" y2="44" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><text x="79.2" y="162" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">α</text><line x1="79.2" y1="84" x2="134.4" y2="84" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><line x1="79.2" y1="79" x2="79.2" y2="89" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><line x1="134.4" y1="79" x2="134.4" y2="89" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><text x="106.8" y="78" font-size="13" text-anchor="middle" fill="currentColor">aₙ − α</text><line x1="79.2" y1="62" x2="244.8" y2="62" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><line x1="79.2" y1="57" x2="79.2" y2="67" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><line x1="244.8" y1="57" x2="244.8" y2="67" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><text x="162" y="56" font-size="13" text-anchor="middle" fill="currentColor">aₙ₊₁ − α</text><circle cx="134.4" cy="110" r="5.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="134.4" y="146" font-size="13" text-anchor="middle" fill="currentColor">aₙ</text><circle cx="244.8" cy="110" r="5.5" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="244.8" y="146" font-size="13" text-anchor="middle" fill="currentColor">aₙ₊₁</text><text x="12" y="20" font-size="13" text-anchor="start" fill="currentColor">α からのへだたりは、次の項でどうなる？</text></svg>'
          - aₙ₊₁ = paₙ + q と α = pα + q を、辺々ひいてみましょう。
          - できた式から、等比数列の定義（どの項にも同じ数をかけると次の項）に結びつけましょう。
        paths:
          - [α = pα + q とする, 辺々ひいて aₙ₊₁ − α = p(aₙ − α), bₙ = aₙ − α とおくと bₙ₊₁ = pbₙ, 数列 bₙ は公比 p の等比数列]
          - [bₙ = aₙ − α とおくと aₙ = bₙ + α, 漸化式に入れて bₙ₊₁ + α = p(bₙ + α) + q, α = pα + q を使うと bₙ₊₁ = pbₙ で公比 p の等比数列]
      - part: わけ
        id: "0d2a6eeddd"
        text: 数列 {aₙ} の階差数列を {bₙ}（bₙ = aₙ₊₁ − aₙ）とすると、n ≧ 2 のとき aₙ = a₁ + (b₁ + b₂ + … + bₙ₋₁) です。このわけを、すじ道を立てて書きましょう。
        explain: 例：「n を 2 以上の《整数》とする。階差数列の定義から、a₂ − a₁ = b₁、a₃ − a₂ = b₂、…、aₙ − aₙ₋₁ = bₙ₋₁ の n − 1 個の式が成り立つ。これらの左辺どうし、右辺どうしを足すと、左辺では a₂ から aₙ₋₁ までがそれぞれ 1 回ずつ足されて 1 回ずつひかれるので消え、aₙ − a₁ だけが残る。よって aₙ − a₁ = b₁ + b₂ + … + bₙ₋₁、つまり aₙ = a₁ + (b₁ + … + bₙ₋₁) である。」と書ければよい。①「〜とする」で n を決め、階差の定義の式を並べる、② 足してと中の項が消えることを示す、③ 約束した事実（等式の両辺に同じものを足しても等式）で結ぶ、の 3 つがそろっているかを見る。n = 1 では足す項がないので式が使えず、求めた式が n = 1 でも成り立つかは、別に確かめることを話す。aₙ₊₁ = aₙ + bₙ を a₂ から順に書いて、代入をくり返す説明でもよい。
        hints:
          - 「n を 2 以上の整数とする」として、a₂ − a₁ = b₁ から aₙ − aₙ₋₁ = bₙ₋₁ までをならべましょう。
          - text: ならべた式を全部足すと、左辺はどうなるでしょう。図は n = 4 のときです。
