          - 消える項と残る項を確かめて、まとめの式を書きましょう。
        paths:
          - [n ≧ 2 とする, a₂ − a₁ = b₁、…、aₙ − aₙ₋₁ = bₙ₋₁, 辺々足すと、と中が消えて aₙ − a₁ = b₁ + … + bₙ₋₁, aₙ = a₁ + (b₁ + … + bₙ₋₁)]
