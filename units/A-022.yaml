        id: "ffd0976254"
        text: 初項 a、公比 r（r は 1 でない）の等比数列の、初項から第 n 項までの和 Sₙ は、Sₙ = a(rⁿ − 1)/(r − 1) です。このわけを、すじ道を立てて書きましょう。
        explain: 例：「Sₙ = a + ar + ar² + … + arⁿ⁻¹ とする。両辺に r をかけると rSₙ = ar + ar² + … + arⁿ⁻¹ + arⁿ である。rSₙ から Sₙ をひくと、ar から arⁿ⁻¹ までの項はどちらの式にもあるので消えて、rSₙ − Sₙ = arⁿ − a となる。左辺は (r − 1)Sₙ、右辺は a(rⁿ − 1)（分配法則）である。r は 1 でないので r − 1 は 0 でなく、両辺を r − 1 でわってよい。よって Sₙ = a(rⁿ − 1)/(r − 1) である。」と書ければよい。①「〜とする」で Sₙ を式で書く、② r をかけた式からひいて、同じ項が消えることを示す、③ 約束した事実（分配法則、0 でない数でわってよい）で結ぶ、の 3 つがそろっているかを見る。r = 1 なら r − 1 = 0 でわれないので、そのときは Sₙ = na と別に求めることにもふれる。n = 3 のような例で確かめただけで終わっていたら、例ではすべての n を示せないことを話す。帰納法（L-012）で示してもよい。
        hints:
          - 「Sₙ = a + ar + … + arⁿ⁻¹ とする」から書き始めましょう。
          - text: rSₙ を 1 項ずらして、Sₙ とならべてみましょう。
            svg: '<svg viewBox="0 0 320 136" xmlns="http://www.w3.org/2000/svg"><text x="52" y="57" font-size="12" text-anchor="end" fill="currentColor">rSₙ =</text><text x="52" y="107" font-size="12" text-anchor="end" fill="currentColor">Sₙ =</text><rect x="103" y="36" width="35" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="120.5" y="57" font-size="12" text-anchor="middle" fill="currentColor">ar</text><text x="142" y="57" font-size="12" text-anchor="middle" fill="currentColor">+</text><rect x="146" y="36" width="35" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="163.5" y="57" font-size="12" text-anchor="middle" fill="currentColor">ar²</text><text x="185" y="57" font-size="12" text-anchor="middle" fill="currentColor">+</text><text x="206.5" y="57" font-size="12" text-anchor="middle" fill="currentColor">…</text><text x="228" y="57" font-size="12" text-anchor="middle" fill="currentColor">+</text><rect x="232" y="36" width="35" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="249.5" y="57" font-size="12" text-anchor="middle" fill="currentColor">arⁿ⁻¹</text><text x="271" y="57" font-size="12" text-anchor="middle" fill="currentColor">+</text><rect x="275" y="36" width="35" height="32" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="292.5" y="57" font-size="12" text-anchor="middle" fill="currentColor">arⁿ</text><rect x="60" y="86" width="35" height="32" rx="6" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="77.5" y="107" font-size="12" text-anchor="middle" fill="currentColor">a</text><text x="99" y="107" font-size="12" text-anchor="middle" fill="currentColor">+</text><rect x="103" y="86" width="35" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="120.5" y="107" font-size="12" text-anchor="middle" fill="currentColor">ar</text><text x="142" y="107" font-size="12" text-anchor="middle" fill="currentColor">+</text><rect x="146" y="86" width="35" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="163.5" y="107" font-size="12" text-anchor="middle" fill="currentColor">ar²</text><text x="185" y="107" font-size="12" text-anchor="middle" fill="currentColor">+</text><text x="206.5" y="107" font-size="12" text-anchor="middle" fill="currentColor">…</text><text x="228" y="107" font-size="12" text-anchor="middle" fill="currentColor">+</text><rect x="232" y="86" width="35" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="249.5" y="107" font-size="12" text-anchor="middle" fill="currentColor">arⁿ⁻¹</text><text x="8" y="107" font-size="12" text-anchor="start" fill="currentColor">−)</text><line x1="12" y1="128" x2="314" y2="128" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="101" y="30" width="168" height="94" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="185" y="25" font-size="13" text-anchor="middle" fill="currentColor">消える</text></svg>'
          - rSₙ − Sₙ で、どの項が残るでしょう。r − 1 でわってよいわけも書きましょう。
        paths:
