        id: "39ab9c17d4"
        text: 等比数列の和 S = 1 + 3 + 9 + 27 + 81 を、くふうして求めてみましょう。
        svg: '<svg viewBox="0 0 320 165" xmlns="http://www.w3.org/2000/svg"><text x="56" y="57" font-size="13" text-anchor="end" fill="currentColor">3S =</text><text x="56" y="107" font-size="13" text-anchor="end" fill="currentColor">S =</text><rect x="109.3" y="36" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="123.5" y="57" font-size="13" text-anchor="middle" fill="currentColor">3</text><text x="144.7" y="57" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="151.7" y="36" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="165.8" y="57" font-size="13" text-anchor="middle" fill="currentColor">9</text><text x="187" y="57" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="194" y="36" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="208.2" y="57" font-size="13" text-anchor="middle" fill="currentColor">27</text><text x="229.3" y="57" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="236.3" y="36" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="250.5" y="57" font-size="13" text-anchor="middle" fill="currentColor">81</text><text x="271.7" y="57" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="278.7" y="36" width="28.3" height="32" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="292.8" y="57" font-size="13" text-anchor="middle" fill="currentColor">243</text><rect x="67" y="86" width="28.3" height="32" rx="6" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="81.2" y="107" font-size="13" text-anchor="middle" fill="currentColor">1</text><text x="102.3" y="107" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="109.3" y="86" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="123.5" y="107" font-size="13" text-anchor="middle" fill="currentColor">3</text><text x="144.7" y="107" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="151.7" y="86" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="165.8" y="107" font-size="13" text-anchor="middle" fill="currentColor">9</text><text x="187" y="107" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="194" y="86" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="208.2" y="107" font-size="13" text-anchor="middle" fill="currentColor">27</text><text x="229.3" y="107" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="236.3" y="86" width="28.3" height="32" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="250.5" y="107" font-size="13" text-anchor="middle" fill="currentColor">81</text><text x="8" y="107" font-size="13" text-anchor="start" fill="currentColor">−)</text><line x1="12" y1="128" x2="314" y2="128" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="104.3" y="30" width="165.3" height="94" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="187" y="25" font-size="13" text-anchor="middle" fill="currentColor">同じ数が消える</text><text x="160" y="152" font-size="14" text-anchor="middle" fill="currentColor">3S − S = 243 − 1　だから　2S = 242</text></svg>'
        explain: S に公比 3 をかけると 3S = 3 + 9 + 27 + 81 + 243 です。3S から S をひくと、同じ項が消えて 3S − S = 243 − 1、つまり 2S = 242 で、S = 121 です。一般に、初項 a、公比 r の等比数列の初項から第 n 項までの和を Sₙ とすると、Sₙ = a + ar + … + arⁿ⁻¹、rSₙ = ar + ar² + … + arⁿ なので、rSₙ − Sₙ = arⁿ − a です。r が 1 でなければ、両辺を r − 1 でわって Sₙ = a(rⁿ − 1)/(r − 1) となります（わけは 6 日目）。r が 1 より小さいときは、分母と分子に −1 をかけた Sₙ = a(1 − rⁿ)/(1 − r) を使うと計算しやすくなります。r = 1 のときは、どの項も a なので Sₙ = na です。公比が負の数のときも同じ式が使えますが、rⁿ が正か負か（n が 2、4、6、… なら正、1、3、5、… なら負）に気をつけます。
