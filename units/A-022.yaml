        id: "3097ec82d4"
        text: 初項から第 n 項までの和が Sₙ = n² + 2n である数列 {aₙ} の一般項を求めてみましょう。
        svg: '<svg viewBox="0 0 320 198" xmlns="http://www.w3.org/2000/svg"><text x="12" y="16" font-size="13" text-anchor="start" fill="currentColor">Sₙ = n² + 2n のとき</text><rect x="76" y="28" width="28.8" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="90.4" y="49" font-size="13" text-anchor="middle" fill="currentColor">a₁</text><rect x="104.8" y="28" width="47.9" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="128.7" y="49" font-size="13" text-anchor="middle" fill="currentColor">a₂</text><rect x="152.7" y="28" width="67.1" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="186.2" y="49" font-size="13" text-anchor="middle" fill="currentColor">a₃</text><rect x="219.8" y="28" width="86.2" height="32" rx="0" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="262.9" y="49" font-size="13" text-anchor="middle" fill="currentColor">a₄</text><rect x="76" y="82" width="28.8" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="90.4" y="103" font-size="13" text-anchor="middle" fill="currentColor">a₁</text><rect x="104.8" y="82" width="47.9" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="128.7" y="103" font-size="13" text-anchor="middle" fill="currentColor">a₂</text><rect x="152.7" y="82" width="67.1" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="186.2" y="103" font-size="13" text-anchor="middle" fill="currentColor">a₃</text><text x="70" y="50" font-size="14" text-anchor="end" fill="currentColor">S₄ = 24</text><text x="70" y="104" font-size="14" text-anchor="end" fill="currentColor">S₃ = 15</text><line x1="219.8" y1="24" x2="219.8" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M 219.8 122 q 0 7 7 7 L 255.9 129 q 7 0 7 7 q 0 -7 7 -7 L 299 129 q 7 0 7 -7" fill="none" stroke="currentColor" stroke-width="2"/><text x="257.1" y="152" font-size="13" text-anchor="middle" fill="currentColor">a₄ = S₄ − S₃ = 9</text><text x="12" y="186" font-size="13" text-anchor="start" fill="currentColor">a₁ だけは S₁ = 3（前の和がない）</text></svg>'
        explain: S₁ = a₁ なので a₁ = 1 + 2 = 3 です。n ≧ 2 のとき、Sₙ = a₁ + … + aₙ₋₁ + aₙ、Sₙ₋₁ = a₁ + … + aₙ₋₁ なので、aₙ = Sₙ − Sₙ₋₁ です。Sₙ − Sₙ₋₁ = (n² + 2n) − {(n − 1)² + 2(n − 1)} = n² + 2n − (n² − 2n + 1) − 2n + 2 = 2n + 1 です（A-015 の展開）。この式で n = 1 とすると 3 で、a₁ と同じなので、aₙ = 2n + 1 はすべての n で成り立ちます。ただし、Sₙ = n² + 2n + 1 のように定数項があると、a₁ = S₁ = 4 ですが、n ≧ 2 の aₙ はやはり 2n + 1 で、n = 1 のときには合いません。aₙ = Sₙ − Sₙ₋₁ は n ≧ 2 のときだけ使えるので、a₁ は S₁ で別に求めて確かめます。また、量が前の日の量から決まる場面は、漸化式で表すと、前の日までの方法で一般項が求められます。
