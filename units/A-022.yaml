        explain: α = 3α − 4 を満たす数 α を求めると、2α = 4 より α = 2 です。漸化式 aₙ₊₁ = 3aₙ − 4 から、2 = 3 × 2 − 4 を辺々ひくと、aₙ₊₁ − 2 = 3(aₙ − 2) となります。そこで bₙ = aₙ − 2 とおくと bₙ₊₁ = 3bₙ なので、{bₙ} は初項 b₁ = a₁ − 2 = 2、公比 3 の等比数列です。よって bₙ = 2 × 3ⁿ⁻¹、aₙ = bₙ + 2 = 2 × 3ⁿ⁻¹ + 2 です。確かめると a₁ = 2 + 2 = 4、a₂ = 3 × 4 − 4 = 8 = 2 × 3 + 2 で合っています。一般に、aₙ₊₁ = paₙ + q（p は 1 でない）は、α = pα + q を満たす α を使って aₙ₊₁ − α = p(aₙ − α) と変形でき、{aₙ − α} は公比 p の等比数列になります（わけは 6 日目）。p = 1 なら等差数列、q = 0 なら等比数列です。L-012 では aₙ₊₁ = 2aₙ + 1 の一般項を予想して帰納法で確かめましたが、この変形を使うと、予想しなくても一般項が求められます。
