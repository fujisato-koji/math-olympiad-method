    text: 1 辺が 8 cm の正方形があります。この正方形の各辺の中点を結んで内側に正方形をかき、その正方形の各辺の中点を結んでまた正方形をかく、ということをくり返します。はじめの正方形もふくめて、10 個の正方形の面積をすべて足すと何 cm² ですか。
    svg: |
      <svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="20" width="160" height="160" stroke="currentColor" fill="none" stroke-width="2"/>
        <polygon points="100,20 180,100 100,180 20,100" stroke="currentColor" fill="none" stroke-width="2"/>
        <polygon points="140,60 140,140 60,140 60,60" stroke="currentColor" fill="none" stroke-width="2"/>
        <polygon points="140,100 100,140 60,100 100,60" stroke="currentColor" fill="none" stroke-width="2"/>
        <polygon points="120,80 120,120 80,120 80,80" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="1.5"/>
        <text x="100" y="196" font-size="12" text-anchor="middle">8 cm</text>
      </svg>
    answer: 1023/8
    accept: [127.875]
    check: "sum(Fraction(64) * Fraction(1, 2) ** k for k in range(10))"
    hints:
      - 中点を結んだ正方形の面積は、もとの正方形の面積の何倍でしょう。四すみの三角形を折り返して考えましょう。
      - 10 個の面積は、初項 64、公比いくつの等比数列でしょう。
      - 和の式 a(1 − rⁿ)/(1 − r) を使いましょう。
    paths:
      - [四すみの三角形を内側に折ると中の正方形がちょうどおおわれるので、面積は半分, 面積は初項 64、公比 1/2 の等比数列, 64 × (1 − 1/1024) ÷ (1/2) = 128 − 1/8 = 1023/8]
    note: 面積が半分になること（面積の G-008 と、折り返しの見方）に気づけば、等比数列の和の問題になる。和はほぼ 128 cm² で、10 個足しても 128 にとどかない。(1/2)¹⁰ = 1/1024 の分数の計算でつまずきやすい。
  - part: 離
    kinds: [道筋]
    text: a₁ = 1、aₙ₊₁ = aₙ/(2aₙ + 1) で決まる数列の a₁₀ はいくつですか。
    answer: 1/19
    check: "[x for x in itertools.accumulate(range(1, 10), lambda a, n: a / (2 * a + 1), initial=Fraction(1))][9]"
    hints:
      - はじめのいくつかの項を計算して、分母に目をつけましょう。
      - 漸化式の両辺の逆数をとると、1/aₙ₊₁ = (2aₙ + 1)/aₙ です。
      - cₙ = 1/aₙ とおくと、{cₙ} はどんな数列でしょう。
    paths:
      - [1/aₙ₊₁ = 2 + 1/aₙ, cₙ = 1/aₙ は初項 1、公差 2 の等差数列, c₁₀ = 1 + 9 × 2 = 19, a₁₀ = 1/19]
      - [a₂ = 1/3、a₃ = 1/5、a₄ = 1/7 と予想する, 帰納法で確かめる, a₁₀ = 1/19]
    note: そのままでは等差でも等比でも aₙ₊₁ = paₙ + q の形でもない。逆数をとる言い換えで等差数列になる。項を並べて予想し帰納法で確かめる道もある。aₙ が 0 にならないこと（どの項も正）も確かめておく。
  - part: 離
    kinds: [総動員, 手数]
    uses: [C-005]
    text: 0、1、2 の 3 つの数字を使って、長さ 7 の数字の並びをつくります（同じ数字を何回使ってもよく、0 から始まってもよい）。0 が偶数個（0 個もふくむ）入っている並びは何通りありますか。
    answer: 1094
    check: "len([s for s in itertools.product(range(3), repeat=7) if s.count(0) % 2 == 0])"
    hints:
      - 長さ n の並びで、0 が偶数個のものを aₙ 通りとします。長さ n の並びは全部で何通りでしょう（積の法則）。
      - 長さ n + 1 の並びを、最後の数字が 0 かどうかで分けて、aₙ₊₁ を aₙ と 3ⁿ で表しましょう。
      - できた漸化式を、階差数列として解きましょう。
    paths:
      - [長さ n の並びは 3ⁿ 通り, 0 が偶数個の後ろに 1 か 2（2aₙ）、0 が奇数個の後ろに 0（3ⁿ − aₙ）, aₙ₊₁ = aₙ + 3ⁿ、a₁ = 2, aₙ = 2 + 3 + 9 + … + 3ⁿ⁻¹ = (3ⁿ + 1)/2, a₇ = (2187 + 1)/2 = 1094]
    note: 数え方（積の法則 C-005）と場合分けで漸化式を立て、階差数列と等比数列の和で解く。最後の数字で分ける見方と、0 が奇数個の並びの数を 3ⁿ − aₙ と表すところでつまずきやすい。a₁ = 2（「1」と「2」）から始める。
