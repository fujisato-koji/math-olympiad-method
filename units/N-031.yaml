            svg: '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><rect x="50" y="32" width="96" height="96" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="98" y="86" font-size="18" text-anchor="middle" fill="currentColor">n²</text><rect x="146" y="32" width="12" height="96" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="50" y="128" width="96" height="12" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="146" y="128" width="12" height="12" fill="#7bc96f" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="104" y="23" font-size="14" text-anchor="middle" fill="currentColor">n + 1</text><text x="43" y="91" font-size="14" text-anchor="end" fill="currentColor">n + 1</text><rect x="200" y="42" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/><rect x="212" y="42" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="224" y="42" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="236" y="42" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="200" y="54" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="212" y="54" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="224" y="54" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="236" y="54" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="200" y="66" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="212" y="66" width="12" height="12" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x