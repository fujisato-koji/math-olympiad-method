      - part: わけ
        id: "a2307c5a27"
        text: 「平方数でない正の整数は、《約数》の個数が偶数である」ことを、約数を 2 つずつ組にしてしめしましょう。
        explain: 例：「N を平方数でない正の整数とする。N の約数 d に、N ÷ d を組にする。N ÷ d も N の約数で、N ÷ d の組の相手は N ÷ (N ÷ d) = d なので、組はもとにもどる。d と N ÷ d が同じ数になるのは d × d = N のときだけで、N は平方数でないので、そうなる d はない。だから、N の約数は、ちがう 2 つずつの組にもれなく分かれ、個数は偶数である。」と書ければよい。①「N を平方数でない正の整数とし、約数 d と N ÷ d を組にする」で決める、② 組の 2 つが同じになるのは d × d = N のときだけと示す、③「ちがう 2 つずつの組に分かれるので偶数」と結ぶ、の 3 点を見る。反対に N が平方数 m² なら、m だけが自分と組になり、ほかは 2 つずつの組になるので、約数の個数は奇数になる。ここまで言えたら、なおよい。12 の約数（1 と 12、2 と 6、3 と 4）のような例だけで終わったら、例ではすべての数を示せないことを話す。
        hints:
          - text: 12 の約数を、かけて 12 になる組に分けてみよう（図）。
