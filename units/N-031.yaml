        id: "dc62169e86"
        text: x² − y² は、図のように、よこ x + y、たて x − y の長方形の面積と同じです。x² − y² = 15 をみたす正の《整数》 x、y の組を、すべて求めましょう。
        svg: '<svg viewBox="0 0 320 198" xmlns="http://www.w3.org/2000/svg"><rect x="26" y="50" width="50" height="30" fill="#f3c969" fill-opacity="0.65" stroke="currentColor" stroke-width="2"/><rect x="26" y="80" width="80" height="50" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="76" y="50" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><text x="91" y="70" font-size="12" text-anchor="middle" fill="currentColor">y²</text><text x="66" y="43" font-size="14" text-anchor="middle" fill="currentColor">x</text><text x="19" y="95" font-size="14" text-anchor="end" fill="currentColor">x</text><text x="112" y="70" font-size="14" text-anchor="start" fill="currentColor">y</text><text x="66" y="148" font-size="14" text-anchor="middle" fill="currentColor">x² − y²</text><rect x="190" y="80" width="80" height="50" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="270" y="80" width="30" height="50" fill="#f3c969" fill-opacity="0.65" stroke="currentColor" stroke-width="2"/><text x="230" y="73" font-size="14" text-anchor="middle" fill="currentColor">x</text><text x="285" y="73" font-size="14" text-anchor="middle" fill="currentColor">y</text><text x="245" y="148" font-size="14" text-anchor="middle" fill="currentColor">x + y</text><text x="184" y="110" font-size="14" text-anchor="end" fill="currentColor">x − y</text><line x1="128" y1="62" x2="170" y2="62" stroke="currentColor" stroke-width="2"/><polygon points="178,62 169,66.5 169,57.5" fill="currentColor" fill-opacity="1"/><text x="160" y="186" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">x² − y² = (x + y)(x − y)</text></svg>'
        explain: 因数分解すると x² − y² = (x + y)(x − y) なので、(x + y)(x − y) = 15 です。x、y は正の整数なので x + y は正で、積が正なので x − y も正、そして x + y のほうが大きい数です。15 を 2 つの正の整数の積に分けると 15 × 1 と 5 × 3 です。x + y = 15、x − y = 1 なら、2 つをたして 2x = 16 で x = 8、y = 7。x + y = 5、x − y = 3 なら x = 4、y = 1。8² − 7² = 64 − 49 = 15、4² − 1² = 16 − 1 = 15 で確かめられます。x + y と x − y の和は 2x で偶数なので、2 つはどちらも偶数か、どちらも奇数です。また、となり合う 2 つの平方数の差は (n + 1)² − n² = 2n + 1 で、いつも奇数になります（8² − 7² = 15 もその 1 つです）。
