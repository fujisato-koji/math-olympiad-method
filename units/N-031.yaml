# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "82251f9789"
    kinds: [道筋, 手数]
    text: n² + 60 が平方数になる正の《整数》 n を、すべてたすといくつですか。
    svg: '<svg viewBox="0 0 320 188" xmlns="http://www.w3.org/2000/svg"><polygon points="170,20 210,20 210,160 70,160 70,120 170,120" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><rect x="70" y="20" width="100" height="100" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="120" y="76" font-size="18" text-anchor="middle" fill="currentColor">n²</text><text x="190" y="146" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">60</text><text x="120" y="14" font-size="14" text-anchor="middle" fill="currentColor">n</text><text x="62" y="75" font-size="14" text-anchor="end" fill="currentColor">n</text><text x="140" y="178" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="218" y="95" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">?</text><text x="236" y="60" font-size="13" text-anchor="start" fill="currentColor">n² に</text><text x="236" y="80" font-size="13" text-anchor="start" fill="currentColor">60 をたして</text><text x="236" y="100" font-size="13" text-anchor="start" fill="currentColor">大きな</text><text x="236" y="120" font-size="13" text-anchor="start" fill="currentColor">正方形にする</text></svg>'
    answer: 16
    check: "sum([n for n in range(1, 100) if math.isqrt(n * n + 60) ** 2 == n * n + 60])"
    hints:
      - n² + 60 = m² とおくと、m² − n² = 60 だね。
      - text: m² − n² は、図のように (m + n)(m − n)。60 を 2 つの数の積に分けよう。
