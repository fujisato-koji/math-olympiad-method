        note: 右がわの 4 こと下がわの 4 こで 8 こと答え、右下のかどの 1 こをわすれやすい。また、たす数でなく、大きな正方形の全部の 25 こを答えやすい。もとの 16 こ（4²）に、右がわの 4 こ、下がわの 4 こ、かどの 1 こをたすと 25 こ（5²）になる。4 を n とすると n² + 2n + 1 = (n + 1)² で、たしたご石は 2n + 1 こ。この形は、このあとの n² + 2n + 16 のような式を、(n + 1)² を使った形に直すときの足場になる。
