# N-031 平方数の性質
#
# 書き方は N-001 の頭の注、文字の式を選ぶ問題の check は A-010 の頭の注、あまりの決め方は N-028 の頭の注のとおり。段 4 なので普通の文。
# 前提は N-028（あまりで分類する）と A-015（展開と因数分解）。たどると N-022（あまりの性質、位の数字の和）、L-007（場合分け）、
#   N-008（偶数と奇数）、N-017（約数）、A-010（文字と式）、A-009（累乗）、N-027（正負の数）が入るので、これらを道具にする。
#   A-015 は作った時点でファイルがないので、(a + b)² = a² + 2ab + b²、(a − b)² = a² − 2ab + b²、(a + b)(a − b) = a² − b² と、
#   その逆の因数分解を約束した事実として使った。A-015 ができたら、言い方をそちらに合わせる。
#   N-028 で示した「連続する 2 つの整数の積は偶数」も約束した事実として使う。
# 平方数は、整数を 2 回かけた数（0、1、4、9、16 …）。2 乗は A-009 の書き方（n²、上つきの数字）。
# 前提にないので使わないもの：素数と素因数分解（N-021）、平方根の記号（A-016）、背理法（L-011）、不等式の性質（A-013）、合同式（N-032）。
#   だから「平方数の素因数分解では指数が偶数」は扱わず、平方数でないことは、あまり・一の位・となり合う平方数のあいだ、で直接示す。
#   大小は、2 つの式の差を計算して正かどうかで言う。2 乗して □ になる数は「□ は何の 2 乗か」と言う。
# 数は 1000 まで（N-009 が前提のたどりにある）。
# 日の並び（既定、ねらいは次のとおり）：
#   1 日目 導入：平方数を 3、4、5 でわったあまりと一の位。それで平方数でない数を見分ける。
#   2 日目 練習：平方数の差（因数分解して x² − y² = (x + y)(x − y)、となり合う平方数の差 2n + 1、差で表せない数）。頭に見本。
#   3 日目 わけ（③）：奇数の 2 乗を 8 でわったあまり、n² + n は平方数でない（となり合う平方数のあいだ）、平方数でない数の約数の個数は偶数。
#   4 日目 N-028・A-015 と混ぜる（2 乗のあまり、平方完成して差にする、2 つの平方数の和にならない数、電球の問題）。
#   5 日目 確認。
# 最先端へのつながり（D-026）：2 つの平方数の和（N-040）、ピタゴラスの三つ組、3 つの平方数の和で表せない数（8 でわって 7 あまる数）を note に書いた。
# check：平方数かどうかは math.isqrt(m) ** 2 == m。あまりは % で、ありえないあまりは range で 2 乗のあまりを全部作って調べる。
#   「ある・ない」は range の中の整数を全部ためして確かめる。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-021 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# ただし腕だめしの総動員（ちがう奇数の 2 乗の和 1345）だけは例外で、uses に N-073 を挙げて、1000 より大きい数（1345、1771 など）を使う。

