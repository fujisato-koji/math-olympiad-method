  - part: 離
    id: "a099f54eab"
    kinds:
    - 総動員
    - 道筋
    time: 1500
    uses:
    - N-028
    - A-015
    - N-073
    text: 1、3、5、7、… のような奇数の中から、ちがう数をいくつかえらびます。えらんだ数をそれぞれ 2 乗してたすと、ちょうど 1345 になるようにします。えらぶ数は、いちばん多くて何こですか。答えと、そのこ数で 1345 になるえらび方を 1 つと、それより多くならないわけを書きましょう。
    answer: 9
    check: max(r for r in range(1, 20) if any(sum(x * x for x in c) == 1345 for c in itertools.combinations(range(1, 38, 2), r)))
    hints:
      - text: 小さい奇数から順に 2 乗して、たしていってみよう。1² + 3² + … を、どこまでたすと 1345 に近づくかな（図）。
        svg: '<svg viewBox="0 0 320 194" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="13" text-anchor="middle" fill="currentColor">1² + 3² + 5² + … と、小さい奇数から順に</text><rect x="60" y="136.6" width="36" height="33.4" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="78" y="151.6" font-size="11" text-anchor="middle" fill="currentColor">455</text><text x="78" y="186" font-size="13" text-anchor="middle" fill="currentColor">7 こ</text><rect x="110" y="120.1" width="36" height="49.9" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="128" y="135.1" font-size="11" text-anchor="middle" fill="currentColor">680</text><text x="128" y="186" font-size="13" text-anchor="middle" fill="currentColor">8 こ</text><rect x="160" y="98.9" width="36" height="71.1" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="178" y="113.9" font-size="11" text-anchor="middle" fill="currentColor">969</text><text x="178" y="186" font-size="13" text-anchor="middle" fill="currentColor">9 こ</text><rect x="210" y="72.4" width="36" height="97.6" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="228" y="87.4" font-size="11" text-anchor="middle" fill="currentColor">1330</text><text x="228" y="186" font-size="13" text-anchor="middle" fill="currentColor">10 こ</text><rect x="260" y="40" width="36" height="130" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="278" y="55" font-size="11" text-anchor="middle" fill="currentColor">1771</text><text x="278" y="186" font-size="13" text-anchor="middle" fill="currentColor">11 こ</text><line x1="50" y1="71.3" x2="310" y2="71.3" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="46" y="76.3" font-size="12" text-anchor="end" fill="currentColor">1345</text></svg>'
      - 9 こや 10 こで、ちょうど 1345 になるえらび方があるか、ためしてみよう。
      - 奇数の 2 乗をいくつか書いて（1、9、25、49、…）、にているところをさがそう。
    paths:
    - - 奇数は、k を 0 以上の整数として 2k + 1 と書ける。(2k + 1)² = 4k² + 4k + 1 = 4k(k + 1) + 1。k(k + 1) は連続する 2 つの整数の積なので偶数で、4k(k + 1) は偶数の 4 倍だから 8 の倍数。だから、奇数の 2 乗は 8 でわると 1 あまる（1² = 1、3² = 9 = 8 + 1、5² = 25 = 24 + 1）
      - ちがう奇数を j こえらぶと、2 乗の和は「8 でわると 1 あまる数」を j こたしたもの。だから 8 でわったあまりは、j を 8 でわったあまりと同じ。1345 = 8 × 168 + 1 なので、あまりは 1。j を 8 でわったあまりが 1 なのは、j = 1、9、17、… のとき。j = 10 は、10 を 8 でわるとあまり 2 なのでできない
      - j が 11 以上もできない。ちがう奇数を小さい順にならべると、k 番目は 2k − 1 以上なので、2 乗の和は 1² + 3² + … + (2j − 1)² 以上になる。j = 11 なら 1² + 3² + … + 21² = 969 + 19² + 21² = 969 + 361 + 441 = 1771（1² + 3² + … + 17² = 969）で、1345 より大きい。j がもっと大きければ、さらに大きい。だから j は 10 以下で、10 はできないので、9 以下
      - 9 この例をさがす。1² + 3² + … + 17² = 969 は、1345 より 376 小さい。大きい数への入れかえで 376 ふやす。1 回の入れかえでは 376 はふやせない（x を y にかえると y² − x² = (y − x)(y + x) ふえる。y − x と y + x はどちらも偶数なので 376 = 2 × 188 か 4 × 94 で、x = 93 か 45 になり、どちらも 1〜17 にない）ので、2 回に分ける。17 を 23 にかえると 23² − 17² = 529 − 289 = 240 ふえて、あと 136。15 を 19 にかえると 19² − 15² = 361 − 225 = 136 ふえて、ちょうど 376。1² + 3² + 5² + 7² + 9² + 11² + 13² + 19² + 23² = 1 + 9 + 25 + 49 + 81 + 121 + 169 + 361 + 529 = 1345。ちがう奇数 9 こでできるので、答えは 9
    - - ちがう奇数 j こを小さい順にならべると、k 番目は 2k − 1 以上（1 番目は 1 以上、2 番目はそれより大きい奇数なので 3 以上、…）。だから 2 乗の和は、1² + 3² + … + (2j − 1)² 以上になる。この「いちばん小さい和」は、j = 9 で 969、j = 10 で 969 + 19² = 969 + 361 = 1330、j = 11 で 1330 + 21² = 1330 + 441 = 1771
      - 11 こ以上はできない。11 この和は 1771 以上で、1345 より大きいし、こ数がふえると和もふえる
      - 10 こもできない。10 この奇数のいちばん大きい数は 19 以上。それが 19 なら、10 この奇数は 1〜19 の 10 こ全部で、和は 1330。それが 21 以上なら、いちばん大きい数の 2 乗は 21² = 441 以上で、のこりの 9 この 2 乗の和は 969 以上だから、和は 969 + 441 = 1410 以上。10 この和は 1330 か、1410 以上で、その間にある 1345 にはならない
      - だから 9 こ以下。9 この例を、いちばん大きい数から決めて見つける。いちばん大きい数が 17 だと和は 969、19 だと大きくても 361 + 968 = 1329 で、どちらも 1345 に足りない。21 なら、9 この和は 1121 から 1761 のあいだで、できるかもしれないが、ここでは先に 23 をためす。のこり 8 この 2 乗の和は 1345 − 23² = 1345 − 529 = 816。8 この最小は 1² + 3² + … + 15² = 680 で、136 たりない。まず、この 8 この中の 1 つ x だけを、使っていないもっと大きい奇数 y にかえて 136 ふやしてみる。y² − x² = (y − x)(y + x) = 136。y − x と y + x はどちらも偶数なので、136 = 2 × 68 = 4 × 34 から、(y − x、y + x) = (2、68) か (4、34)。(x、y) = (33、35) か (15、19)。33、35 は 23 より大きいので使えず、15 を 19 にかえる
      - たしかめ：1² + 3² + 5² + 7² + 9² + 11² + 13² + 19² + 23² = 1 + 9 + 25 + 49 + 81 + 121 + 169 + 361 + 529 = 1345。ちがう奇数 9 こでできる。10 こ以上はできないので、答えは 9
    note: 考えどころは 3 つ：①いちばん小さい奇数から順に 2 乗してたした和（9 こで 969、10 こで 1330、11 こで 1771）で、11 こ以上ができないことを出す。②10 こができないことをしめす。③9 この例を見つける（1〜17 の 9 この和 969 から、大きい数への入れかえで 376 ふやす）。2 本目は 1 本目とちがい、8 でわったあまりを使わない。1 本目は、奇数の 2 乗が 8 でわって 1 あまることから、こ数を 8 でわったあまりが 1 でなければならないとして 10 こをはぶく道。2 本目は、10 この和がとれる大きさに、1330 から 1410 までのすき間があり、1345 がそこに入ることで 10 こをはぶく道。例のさがし方もちがい、1 本目は 969 から入れかえで 376 ふやし、2 本目はいちばん大きい数 23 を先に決めて、のこりの 136 を y² − x² = (y − x)(y + x) の因数分解で作る。check は、奇数 1〜37 の 19 こから r こ（r = 1〜19）の組を全部作り、2 乗の和が 1345 になる r のうちいちばん大きいものを出す式（約 0.3 秒）。全部調べると、1345 になるのは 9 この 1、3、5、7、9、11、13、19、23 の 1 通りだけ。道の数 9 はなぞっていない。11 こ以上を落とす段（小さい順の和が 1771）は 2 本で同じで、ちがうのは 10 こを落とす段と、例の見つけ方。既出・出典：「奇数の 2 乗は 8 でわって 1 あまる」は定番の事実。近い問いに、2002 年の AMC 12P 第 13 問（2 乗の和が 2002 になる、ちがう正の整数のいちばん多いこ数、17）がある。ここでは奇数にかぎり、8 でわったあまりの決まりが加わる。1 本目の、あまりでこ数をしばる運びは N-014、N-028 とも同じ組み立て。大会の同じ問いは見つけていない。わな：1330 に近いので 10 こや 11 こと答える。
