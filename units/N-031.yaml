          - 平方数を m² とおくと、m² − (n + 1)² = □ だね。因数分解しよう。
          - □ を 2 つの正の整数の積に分けて、n が正の整数になるものを選ぼう。
        paths:
          - [n² + 2n + 16 = (n + 1)² + 15, m² − (n + 1)² = 15, (m + n + 1)(m − n − 1) = 15 × 1 なら m = 8、n = 6, 5 × 3 なら n = 0 で正でない, 6]
        note: 6² + 2 × 6 + 16 = 64 = 8² で確かめられる。
