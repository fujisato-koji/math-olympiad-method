        id: "4c998b2c86"
        text: 「正の整数 n について、n² + n は平方数ではない」ことをしめしましょう。図のように、n² + n を、となり合う平方数 n² と (n + 1)² とくらべます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="24" y1="70" x2="296" y2="70" stroke="currentColor" stroke-width="2"/><circle cx="60" cy="70" r="7" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="262" cy="70" r="7" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><polygon points="156,76 149,88 163,88" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1"/><text x="60" y="52" font-size="15" text-anchor="middle" fill="currentColor">n²</text><text x="262" y="52" font-size="15" text-anchor="middle" fill="currentColor">(n + 1)²</text><text x="156" y="108" font-size="15" text-anchor="middle" fill="currentColor">n² + n</text><path d="M 60 120 Q 161 160 262 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="161" y="166" font-size="13" text-anchor="middle" fill="currentColor">このあいだに、平方数はある？</text><circle cx="40" cy="186" r="6" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="52" y="191" font-size="13" text-anchor="start" fill="currentColor">となり合う平方数</text><polygon points="196,180 190,191 202,191" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1"/><text x="208" y="191" font-size="13" text-anchor="start" fill="currentColor">しらべる数</text></svg>'
        explain: 例：「n を正の整数とする。(n² + n) − n² = n で、n は正なので、n² + n は n² より大きい。(n + 1)² − (n² + n) = n² + 2n + 1 − n² − n = n + 1 で、n + 1 は正なので、n² + n は (n + 1)² より小さい。0 以上の整数の 2 乗は 0²、1²、2²、… と大きくなっていき、n² の次の平方数は (n + 1)² なので、n² より大きく (n + 1)² より小さい平方数はない。n² + n はそのあいだにあるので、平方数ではない。」と書ければよい。①「n を正の整数とする」で文字を決める、② 展開して、n² との差 n、(n + 1)² との差 n + 1 を求める、③「となり合う平方数のあいだに平方数はない」で結ぶ、の 3 点を見る。n = 0 では 0² + 0 = 0 が平方数（0²）になるので、「正の整数」という決まりが要ることにふれられたら、なおよい。n² + n = n(n + 1) なので、「連続する 2 つの正の整数の積は平方数にならない」とも言える。
        hints:
          - n² + n は、n² よりいくつ大きいかな。
