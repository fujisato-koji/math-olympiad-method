# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋, 手数]
    text: n² + 60 が平方数になる正の《整数》 n を、すべてたすといくつですか。
    answer: 16
    check: "sum([n for n in range(1, 100) if math.isqrt(n * n + 60) ** 2 == n * n + 60])"
    hints:
      - n² + 60 = m² とおくと、m² − n² = 60 だね。
      - m² − n² を因数分解して、60 を 2 つの数の積に分けよう。
      - m + n と m − n は、どちらも偶数か、どちらも奇数だよ。60 の分け方のうち、使えるのはどれかな。
    paths:
      - [n² + 60 = m² とおくと (m + n)(m − n) = 60, m + n と m − n は差が 2n で偶数なので偶奇が同じ, 60 を偶数 2 つの積にするのは 30 × 2 と 10 × 6 だけ, m + n = 30、m − n = 2 から n = 14, m + n = 10、m − n = 6 から n = 2, 14 + 2 = 16]
    note: 平方数の差の因数分解（2 日目）を、整数解をさがすのに使う。60 = 60 × 1、20 × 3、15 × 4、12 × 5 は偶奇がそろわないので除く、ここが要点。n = 2 だけ、または n = 14 だけで止める誤りが多い。n を 1 から順に試すと、どこで打ち切ってよいかが分からない（m − n が 1 以上なので m + n は 60 以下、と言えると打ち切れる）。
  - part: 離
    kinds: [数]
    text: 2024 × 2025 × 2026 × 2027 + 1 は、ある正の整数の 2 乗です。何の 2 乗ですか。
    answer: 4102649
    check: "(lambda m: math.isqrt(m) if math.isqrt(m) ** 2 == m else -1)(2024 * 2025 * 2026 * 2027 + 1)"
    time: 900
    hints:
      - 小さい数で試そう。1 × 2 × 3 × 4 + 1、2 × 3 × 4 × 5 + 1 は、それぞれ何の 2 乗かな。
      - 両はしの 2 つの積と、まん中の 2 つの積を比べよう。差はいくつかな。
      - まん中の 2 つの積を A とすると、全体は (A − 2) × A + 1。これを展開してみよう。
    paths:
      - [2024 × 2027 = 4102648、2025 × 2026 = 4102650, 2 つの積は 2 ちがいで (A − 2)A + 1 = A² − 2A + 1 = (A − 1)², A − 1 を計算する, 4102649]
      - [小さい数で試す, 1 × 2 × 3 × 4 + 1 = 25 = 5²、2 × 3 × 4 × 5 + 1 = 121 = 11², 5 = 1 × 4 + 1、11 = 2 × 5 + 1 で両はしの積 + 1, 2024 × 2027 + 1 = 4102649]
    note: 4 つの数を全部かけるのは現実的でなく、「両はしの積」と「まん中の積」の 2 つに組み直す（2 つの積の差が 2）と、(A − 1)² の形が見える（A-015 の展開）。小さい数で試して「両はしの積 + 1」というきまりを見つける 2 本目もよいが、それがいつも成り立つことは展開で確かめる。最後の 4 けた × 4 けたの計算でまちがえやすいので、2025 × 2026 − 1 でも同じ数になるか確かめさせる。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [G-019]
    text: 直角をはさむ 2 辺のうち 1 辺の長さが 12 cm で、3 辺の長さがどれも整数（cm）の直角三角形は、何種類ありますか（合同なものは 1 種類と数えます）。
    answer: 4
    check: "len([b for b in range(1, 200) if math.isqrt(144 + b * b) ** 2 == 144 + b * b])"
    hints:
      - もう 1 つの直角をはさむ辺を b cm、斜辺を c cm として、三平方の定理の式を立てよう。
      - c² − b² = 144 を因数分解しよう。
      - c + b と c − b は偶奇が同じだね。144 を 2 つの偶数の積に分けよう。
    paths:
      - [12² + b² = c² から (c + b)(c − b) = 144, c + b と c − b は偶奇が同じで積が偶数なので両方偶数, 144 = 72 × 2 = 36 × 4 = 24 × 6 = 18 × 8, b = 35、16、9、5, 4 種類]
      - [c は b + 1 以上なので c² − b² は 2b + 1 以上で b は 71 まで調べればよい, b を 1 から 71 まで試す, 144 + b² が平方数になるのは b = 5、9、16、35, 4 種類]
    note: 三平方の定理（G-019）で式を立て、平方数の差の因数分解（2 日目）で整数解をさがす、図形と整数の組み合わせ。144 = 12 × 12 の分け方は b = 0 になって三角形にならないので除く。12 cm を斜辺とする三角形と混同しないよう、「直角をはさむ辺」を確かめる。5・12・13、9・12・15、12・16・20、12・35・37 の 4 種類。
