rcle cx="132" cy="83" r="10" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><text x="132" y="88" font-size="14" text-anchor="middle" fill="currentColor">9</text><text x="188" y="88" font-size="14" text-anchor="middle" fill="currentColor">10</text><text x="244" y="88" font-size="14" text-anchor="middle" fill="currentColor">11</text><text x="76" y="109" font-size="14" text-anchor="middle" fill="currentColor">12</text><text x="132" y="109" font-size="14" text-anchor="middle" fill="currentColor">13</text><text x="188" y="109" font-size="14" text-anchor="middle" fill="currentColor">14</text><text x="244" y="109" font-size="14" text-anchor="middle" fill="currentColor">15</text><circle cx="76" cy="125" r="10" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><text x="76" y="130" font-size="14" text-anchor="middle" fill="currentColor">16</text><text x="132" y="130" font-size="14" text-anchor="middle" fill="currentColor">17</text><text x="188" y="130" font-size="14" text-anchor="middle" fill="currentColor">18</text><text x="244" y="130" font-size="14" text-anchor="middle" fill="currentColor">19</text><text x="76" y="151" font-size="14" text-anchor="middle" fill="currentColor">20</text><text x="132" y="151" font-size="14" text-anchor="middle" fill="currentColor">21</text><text x="188" y="151" font-size="14" text-anchor="middle" fill="currentColor">22</text><text x="244" y="151" font-size="14" text-anchor="middle" fill="currentColor">23</text><text x="76" y="172" font-size="14" text-anchor="middle" fill="currentColor">24</text><circle cx="132" cy="167" r="10" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="1.5"/><text x="132" y="172" font-size="14" text-anchor="middle" fill="currentColor">25</text><text x="188" y="172" font-size="14" text-anchor="middle" fill="currentColor">26</text><text x="244" y="172" font-size="14" text-anchor="middle" fill="currentColor">27</text><text x="160" y="197" font-size="13" text-anchor="middle" fill="currentColor">〇は平方数。あまり 0 と 1 の列にしか入らない</text></svg>'
        explain: 整数 n を 2 でわったあまりで分けます。n = 2k（k は整数）のとき n² = 4k² で、4 でわったあまりは 0 です。n = 2k + 1 のとき、展開すると n² = 4k² + 4k + 1 = 4(k² + k) + 1 で、あまりは 1 です。どの整数もどちらかに入るので、平方数を 4 でわったあまりは 0 か 1 だけです。だから、4 でわって 2 や 3 あまる数は、平方数ではありません。たとえば 999 = 4 × 249 + 3 なので、999 は平方数ではありません。同じように、平方数を 3 でわったあまりは 0 か 1 です。また、平方数の一の位は、もとの数の一の位を 2 乗した数の一の位で決まるので、0、1、4、5、6、9 のどれかになり、2、3、7、8 にはなりません。
