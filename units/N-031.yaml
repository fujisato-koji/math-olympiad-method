      - part: わけ
        id: "1d799db767"
        text: 図のように、1²、3²、5²、7² を 8 こずつまとめると、どれも 1 こあまります。「奇数の 2 乗を 8 でわったあまりは 1 である」ことをしめしましょう。
        svg: '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><text x="74" y="30" font-size="14" text-anchor="end" fill="currentColor">1² = 1</text><rect x="88" y="14" width="14" height="22" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="95" y="30" font-size="13" text-anchor="middle" fill="currentColor">1</text><text x="74" y="64" font-size="14" text-anchor="end" fill="currentColor">3² = 9</text><rect x="84" y="48" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="99" y="64" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="118" y="48" width="14" height="22" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="125" y="64" font-size="13" text-anchor="middle" fill="currentColor">1</text><text x="74" y="98" font-size="14" text-anchor="end" fill="currentColor">5² = 25</text><rect x="84" y="82" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="99" y="98" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="114" y="82" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="129" y="98" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="144" y="82" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="159" y="98" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="178" y="82" width="14" height="22" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="185" y="98" font-size="13" text-anchor="middle" fill="currentColor">1</text><text x="74" y="132" font-size="14" text-anchor="end" fill="currentColor">7² = 49</text><rect x="84" y="116" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="99" y="132" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="114" y="116" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="129" y="132" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="144" y="116" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="159" y="132" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="174" y="116" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="189" y="132" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="204" y="116" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="219" y="132" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="234" y="116" width="30" height="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="249" y="132" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="268" y="116" width="14" height="22" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="275" y="132" font-size="13" text-anchor="middle" fill="currentColor">1</text><text x="160" y="168" font-size="13" text-anchor="middle" fill="currentColor">8 こずつまとめると、どれも 1 こあまる</text></svg>'
        explain: 例：「奇数を 2k + 1（k は整数）とする。(2k + 1)² = 4k² + 4k + 1 = 4k(k + 1) + 1。k(k + 1) は連続する 2 つの整数の積なので偶数で、k(k + 1) = 2m（m は整数）と書ける。よって (2k + 1)² = 8m + 1 となり、8 でわったあまりは 1 である。」と書ければよい。①「奇数を 2k + 1 とする」で文字を決める、② 展開して 4k(k + 1) + 1 と変形する、③「連続する 2 つの整数の積は偶数」（N-028 で示した事実）で 8m + 1 と結ぶ、の 3 点を見る。4(k² + k) + 1 で止まって「4 でわると 1 あまる」までしか言えなかったら、k² + k = k(k + 1) が偶数であることに目を向けさせる。1、9、25、49 のような例だけで終わったら、例ではすべての奇数を示せないことを話す。
        hints:
          - 奇数を 2k + 1 とおいて、2 乗を展開しよう。
