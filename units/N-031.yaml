# N-031 平方数の性質
#
# 書き方は N-001 の頭の注、文字の式を選ぶ問題の check は A-010 の頭の注、あまりの決め方は N-028 の頭の注のとおり。段 4 なので普通の文。
# 前提は N-028（あまりで分類する）と A-015（展開と因数分解）。たどると N-022（あまりの性質、位の数字の和）、L-007（場合分け）、
#   N-008（偶数と奇数）、N-017（約数）、A-010（文字と式）、A-009（累乗）、N-027（正負の数）が入るので、これらを道具にする。
#   A-015 は作った時点でファイルがないので、(a + b)² = a² + 2ab + b²、(a − b)² = a² − 2ab + b²、(a + b)(a − b) = a² − b² と、
#   その逆の因数分解を約束した事実として使った。A-015 ができたら、言い方をそちらに合わせる。
#   N-028 で示した「連続する 2 つの整数の積は偶数」も約束した事実として使う。
# 平方数は、整数を 2 回かけた数（0、1、4、9、16 …）。2 乗は A-009 の書き方（n²、上つきの数字）。
# 前提にないので使わないもの：素数と素因数分解（N-021）、平方根の記号（A-016）、背理法（L-011）、不等式の性質（A-013）、合同式（N-032）。
#   だから「平方数の素因数分解では指数が偶数」は扱わず、平方数でないことは、あまり・一の位・となり合う平方数のあいだ、で直接示す。
#   大小は、2 つの式の差を計算して正かどうかで言う。2 乗して □ になる数は「□ は何の 2 乗か」と言う。
# 数は 1000 まで（N-009 が前提のたどりにある）。
# 日の並び（既定、ねらいは次のとおり）：
#   1 日目 導入：平方数を 3、4、5 でわったあまりと一の位。それで平方数でない数を見分ける。
#   2 日目 練習：平方数の差（因数分解して x² − y² = (x + y)(x − y)、となり合う平方数の差 2n + 1、差で表せない数）。頭に見本。
#   3 日目 わけ（③）：奇数の 2 乗を 8 でわったあまり、n² + n は平方数でない（となり合う平方数のあいだ）、平方数でない数の約数の個数は偶数。
#   4 日目 N-028・A-015 と混ぜる（2 乗のあまり、平方完成して差にする、2 つの平方数の和にならない数、電球の問題）。
#   5 日目 確認。
# 最先端へのつながり（D-026）：2 つの平方数の和（N-040）、ピタゴラスの三つ組、3 つの平方数の和で表せない数（8 でわって 7 あまる数）を note に書いた。
# check：平方数かどうかは math.isqrt(m) ** 2 == m。あまりは % で、ありえないあまりは range で 2 乗のあまりを全部作って調べる。
#   「ある・ない」は range の中の整数を全部ためして確かめる。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-021 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: N-031
days:
  - day: 1
    items:
      - part: 見本
        text: 平方数（《整数》を 2 回かけた数）0、1、4、9、16、25 … を 4 でわったあまりを調べて、どんな平方数でも、あまりが 0 か 1 になることを確かめましょう。
        figure: "0、1、4、9、16、25、36、49 …\n4 でわったあまり：0、1、0、1、0、1、0、1 …"
        explain: 整数 n を 2 でわったあまりで分けます。n = 2k（k は整数）のとき n² = 4k² で、4 でわったあまりは 0 です。n = 2k + 1 のとき、展開すると n² = 4k² + 4k + 1 = 4(k² + k) + 1 で、あまりは 1 です。どの整数もどちらかに入るので、平方数を 4 でわったあまりは 0 か 1 だけです。だから、4 でわって 2 や 3 あまる数は、平方数ではありません。たとえば 999 = 4 × 249 + 3 なので、999 は平方数ではありません。同じように、平方数を 3 でわったあまりは 0 か 1 です。また、平方数の一の位は、もとの数の一の位を 2 乗した数の一の位で決まるので、0、1、4、5、6、9 のどれかになり、2、3、7、8 にはなりません。
      - part: 思い出す
        text: n を 6 でわると 5 あまるとき、2n + 3 を 6 でわったあまりはいくつですか。
        answer: 1
        check: "max((2 * n + 3) % 6 for n in range(5, 200, 6))"
        hints:
          - n = 6k + 5（k は整数）とおこう。
          - 2n + 3 を計算して、6 × （ ） + □ の形にしよう。
          - □ が 6 以上なら、もう 1 回 6 を取り出そう。
        paths:
          - [2n + 3 = 12k + 13, 12k + 12 + 1 = 6(2k + 2) + 1, あまり 1]
          - [あまりどうしで 2 × 5 + 3 = 13, 13 を 6 でわると 1 あまる, 1]
      - part: 思い出す
        text: (x + 3)² を展開した式は、どれですか。
        choices: [x² + 6x + 9, x² + 9, x² + 3x + 9]
        answer: x² + 6x + 9
        check: "[c for c, f in {'x² + 6x + 9': lambda x: x * x + 6 * x + 9, 'x² + 9': lambda x: x * x + 9, 'x² + 3x + 9': lambda x: x * x + 3 * x + 9}.items() if all(f(x) == (x + 3) ** 2 for x in range(-10, 11))][0]"
        hints:
          - (x + 3)² は (x + 3)(x + 3) だね。
          - (a + b)² = a² + 2ab + b² を使おう。
          - x = 1 を入れて、どの式が 16 になるか確かめよう。
        paths:
          - [(a + b)² = a² + 2ab + b², a = x、b = 3, x² + 6x + 9]
        note: x² + 9 とまちがえやすい。まん中の 2 × x × 3 をわすれていないかを見る。
      - part: 今日
        text: 平方数を 3 でわったあまりとして、ありえないものはどれですか。
        choices: [0, 1, 2]
        answer: 2
        check: "[c for c in (0, 1, 2) if all(n * n % 3 != c for n in range(100))][0]"
        hints:
          - n を 3 でわったあまりで、3 つの場合に分けよう。
          - n = 3k + 1 のとき、n² を展開して 3 × （ ） + □ の形にしよう。
          - n = 3k + 2 のときも、同じように調べよう。
        paths:
          - [n = 3k なら n² = 9k² であまり 0, n = 3k + 1 なら n² = 3(3k² + 2k) + 1 であまり 1, n = 3k + 2 なら n² = 3(3k² + 4k + 1) + 1 であまり 1, 2 はありえない]
          - [あまりどうしの積で 0 × 0、1 × 1、2 × 2 = 4, あまりは 0、1、1, 2]
      - part: 今日
        text: 次の数のうち、一の位の数字を見るだけで、平方数でないと分かるものはどれですか。
        choices: [196, 287, 324]
        answer: 287
        check: "[c for c in (196, 287, 324) if c % 10 not in set(n * n % 10 for n in range(10))][0]"
        hints:
          - 0² から 9² までの一の位を、書き出そう。
          - 2 乗した数の一の位は、もとの数の一の位だけで決まるね。
          - 平方数の一の位に出てこない数字はどれかな。
        paths:
          - [平方数の一の位は 0、1、4、5、6、9, 287 の一の位の 7 は出てこない, 287]
        note: 196 = 14²、324 = 18²。一の位が平方数に出てくる数字でも、平方数とはかぎらない（26 など）。
      - part: 今日
        text: 次の数のうち、4 でわったあまりを調べると、平方数でないと分かるものはどれですか。
        choices: [576, 846, 961]
        answer: 846
        check: "[c for c in (576, 846, 961) if c % 4 in (2, 3)][0]"
        hints:
          - 100 は 4 でわり切れるので、下 2 けたを 4 でわったあまりを見ればよいね。
          - 76、46、61 を 4 でわったあまりを求めよう。
          - 平方数を 4 でわったあまりは、0 か 1 だったね。
        paths:
          - [下 2 けた 76、46、61 を 4 でわる, あまりは 0、2、1, あまり 2 の 846 は平方数でない]
        note: 846 の一の位の 6 は平方数にも出てくるので、一の位だけでは分からない。576 = 24²、961 = 31²。
      - part: 挑戦
        text: 2 つの奇数を、それぞれ 2 乗してたした数が、平方数になることはありますか。
        choices: [ある, ない]
        answer: ない
        check: "'ある' if any(math.isqrt(a * a + b * b) ** 2 == a * a + b * b for a in range(1, 80, 2) for b in range(1, 80, 2)) else 'ない'"
        hints:
          - 奇数の 2 乗を 4 でわったあまりは、いくつかな。
          - 2 つたすと、4 でわったあまりはいくつになるかな。
          - 平方数を 4 でわったあまりと、くらべよう。
        paths:
          - [奇数の 2 乗は 4 でわると 1 あまる, 2 つの和は 4 でわると 2 あまる, 平方数のあまりは 0 か 1, ない]
          - ["奇数の 2 乗は 8 でわると 1 あまる", "2 つの和は 8 でわると 2 あまる", "平方数を 8 でわった あまりは 0、1、4 だけ", "ない"]
        note: 3² + 4² = 5² のように、片方が偶数なら平方数になることがある（ピタゴラスの三つ組）。
    extra:
      - part: 今日
        text: 平方数を 5 でわったあまりとして、ありえないものは 2 つあります。大きいほうはいくつですか。
        answer: 3
        check: "max(r for r in range(5) if all(n * n % 5 != r for n in range(100)))"
        hints:
          - n を 5 でわったあまり 0、1、2、3、4 で分けよう。
          - あまりが r の数の 2 乗のあまりは、r × r のあまりと同じだね。
          - 0、1、4、9、16 を 5 でわったあまりを見よう。
        paths:
          - [0、1、4、9、16 を 5 でわると 0、1、4、4、1, 2 と 3 は出てこない, 3]
      - part: 今日
        text: 次の数のうち、平方数はどれですか。
        choices: [567, 576, 578]
        answer: 576
        check: "[c for c in (567, 576, 578) if math.isqrt(c) ** 2 == c][0]"
        hints:
          - 一の位を見て、平方数でないものを外そう。
          - 4 でわったあまりも調べよう。
          - のこった数を、20 から 30 までの数の 2 乗とくらべよう。
        paths:
          - [578 は一の位が 8 で平方数でない, 567 は 4 でわると 3 あまり平方数でない, 576 = 24 × 24]
      - part: 挑戦
        text: 1 から 30 までの整数のうち、《約数》の個数が奇数のものは何こありますか。
        answer: 5
        check: "sum(1 for n in range(1, 31) if sum(1 for d in range(1, n + 1) if n % d == 0) % 2 == 1)"
        hints:
          - 約数を、かけてその数になる 2 つずつの組にしよう（12 なら 1 と 12、2 と 6、3 と 4）。
          - 組の 2 つが同じ数になるのは、どんなときかな。
          - そのような数を、30 までで数えよう。
        paths:
          - [約数は d と n ÷ d の組になる, 組の 2 つが同じになるのは d × d = n のとき, 約数の個数が奇数なのは平方数, 1、4、9、16、25 で 5 こ]
        note: わけは 3 日目に示す。

  - day: 2
    items:
      - part: 見本
        text: x² − y² = 15 をみたす正の《整数》 x、y の組を、すべて求めましょう。
        explain: 因数分解すると x² − y² = (x + y)(x − y) なので、(x + y)(x − y) = 15 です。x、y は正の整数なので x + y は正で、積が正なので x − y も正、そして x + y のほうが大きい数です。15 を 2 つの正の整数の積に分けると 15 × 1 と 5 × 3 です。x + y = 15、x − y = 1 なら、2 つをたして 2x = 16 で x = 8、y = 7。x + y = 5、x − y = 3 なら x = 4、y = 1。8² − 7² = 64 − 49 = 15、4² − 1² = 16 − 1 = 15 で確かめられます。x + y と x − y の和は 2x で偶数なので、2 つはどちらも偶数か、どちらも奇数です。また、となり合う 2 つの平方数の差は (n + 1)² − n² = 2n + 1 で、いつも奇数になります（8² − 7² = 15 もその 1 つです）。
      - part: 思い出す
        text: x² − 49 を因数分解した式は、どれですか。
        choices: [(x + 7)(x − 7), (x − 7)², (x + 7)²]
        answer: (x + 7)(x − 7)
        check: "[c for c, f in {'(x + 7)(x − 7)': lambda x: (x + 7) * (x - 7), '(x − 7)²': lambda x: (x - 7) ** 2, '(x + 7)²': lambda x: (x + 7) ** 2}.items() if all(f(x) == x * x - 49 for x in range(-10, 11))][0]"
        hints:
          - 49 は何の 2 乗かな。
          - a² − b² = (a + b)(a − b) を使おう。
          - 選んだ式を展開して、x² − 49 にもどるか確かめよう。
        paths:
          - [49 = 7², a² − b² = (a + b)(a − b), (x + 7)(x − 7)]
      - part: 思い出す
        text: 次の数のうち、3 でわったあまりを調べると、平方数でないと分かるものはどれですか。
        choices: [324, 335, 361]
        answer: 335
        check: "[c for c in (324, 335, 361) if c % 3 == 2][0]"
        hints:
          - 位の数字の和を使って、3 でわったあまりを求めよう。
          - 平方数を 3 でわったあまりは、0 か 1 だったね。
          - あまりが 2 のものをさがそう。
        paths:
          - [位の数字の和は 9、11、10, 3 でわったあまりは 0、2、1, あまり 2 の 335 は平方数でない]
        note: 335 は一の位が 5 で、4 でわると 3 あまるので、4 でわったあまりでも見分けられる。324 = 18²、361 = 19²。
      - part: 今日
        text: x² − y² = 21 をみたす正の整数 x、y の組は、何組ありますか。
        answer: 2
        check: "sum(1 for x in range(1, 30) for y in range(1, 30) if x * x - y * y == 21)"
        hints:
          - x² − y² = (x + y)(x − y) と因数分解しよう。
          - 21 を、2 つの正の整数の積に分けよう。
          - x + y と x − y から、x と y を求めよう。
        paths:
          - [(x + y)(x − y) = 21, 21 × 1 なら x = 11、y = 10, 7 × 3 なら x = 5、y = 2, 2 組]
      - part: 今日
        text: となり合う 2 つの平方数の差が 37 のとき、大きいほうの平方数はいくつですか。
        answer: 361
        check: "[(n + 1) ** 2 for n in range(100) if (n + 1) ** 2 - n * n == 37][0]"
        hints:
          - n² と (n + 1)² の差を、展開して求めよう。
          - 2n + 1 = 37 を解こう。
          - 大きいほうは (n + 1)² だよ。
        paths:
          - [(n + 1)² − n² = 2n + 1, 2n + 1 = 37 で n = 18, 19² = 361]
        note: 37 を答えたり、小さいほうの 18² = 324 を答えたりしやすい。
      - part: 今日
        text: x² − y² = 32 をみたす正の整数 x、y の組のうち、x がいちばん大きいものの x はいくつですか。
        answer: 9
        check: "max(x for x in range(1, 40) for y in range(1, 40) if x * x - y * y == 32)"
        hints:
          - (x + y)(x − y) = 32 で、x + y と x − y の和は 2x だね。
          - 和が偶数になるのは、2 つがどちらも偶数か、どちらも奇数のときだね。
          - 32 を、どちらも偶数の 2 つの数の積に分けよう。
        paths:
          - [(x + y)(x − y) = 32, どちらも偶数で 16 × 2 か 8 × 4, x = 9、y = 7 と x = 6、y = 2, 9]
        note: 32 × 1 のように偶数と奇数の組では、x が整数にならない（2x = 33）。
      - part: 挑戦
        text: 1 から 30 までの整数のうち、x² − y²（x、y は 0 以上の整数）の形に表せないものは、何こありますか。
        answer: 8
        check: "sum(1 for m in range(1, 31) if not any(x * x - y * y == m for x in range(40) for y in range(40)))"
        hints:
          - 奇数 2n + 1 は、となり合う平方数の差で表せたね。
          - 4 の《倍数》 4n は、(n + 1)² − (n − 1)² と表せるか、展開して確かめよう。
          - 4 でわって 2 あまる数は、x + y と x − y がどちらも偶数のとき、どちらも奇数のとき、で調べよう。
        paths:
          - [奇数は (n + 1)² − n², 4 の倍数は (n + 1)² − (n − 1)², 4 でわって 2 あまる数は x + y と x − y が両方偶数なら 4 の倍数で両方奇数なら奇数になり表せない, 2、6、10、…、30 で 8 こ]
        note: 平方数を 4 でわったあまりが 0 か 1 であることからも、差のあまりは 0、1、3 になり、2 にはならないと分かる。
    extra:
      - part: 今日
        text: x² − y² = 45 をみたす正の整数 x、y の組は、何組ありますか。
        answer: 3
        check: "sum(1 for x in range(1, 50) for y in range(1, 50) if x * x - y * y == 45)"
        hints:
          - x² − y² = (x + y)(x − y) と因数分解しよう。
          - 45 を、2 つの正の整数の積に分けよう。
          - x + y と x − y から、x と y を求めよう。
        paths:
          - [(x + y)(x − y) = 45, 45 × 1、15 × 3、9 × 5, x = 23、y = 22 と x = 9、y = 6 と x = 7、y = 2, 3 組]
      - part: 今日
        text: となり合う 2 つの平方数の差が 51 のとき、小さいほうの平方数はいくつですか。
        answer: 625
        check: "[n * n for n in range(100) if (n + 1) ** 2 - n * n == 51][0]"
        hints:
          - n² と (n + 1)² の差を、展開して求めよう。
          - 2n + 1 = 51 を解こう。
          - 小さいほうは n² だよ。
        paths:
          - [(n + 1)² − n² = 2n + 1, 2n + 1 = 51 で n = 25, 25² = 625]
      - part: 挑戦
        text: x² − y² = 40 をみたす正の整数 x、y の組は、何組ありますか。
        answer: 2
        check: "sum(1 for x in range(1, 50) for y in range(1, 50) if x * x - y * y == 40)"
        hints:
          - (x + y)(x − y) = 40 で、2 つの数はどちらも偶数か、どちらも奇数だね。
          - 40 を、どちらも偶数の 2 つの数の積に分けよう。
          - x − y が正になる分け方だけを使おう。
        paths:
          - [どちらも偶数で 20 × 2 か 10 × 4, x = 11、y = 9 と x = 7、y = 3, 2 組]

  - day: 3
    items:
      - part: 思い出す
        text: x² − y² = 33 をみたす正の《整数》 x、y の組のうち、x がいちばん小さいものの x はいくつですか。
        answer: 7
        check: "min(x for x in range(1, 40) for y in range(1, 40) if x * x - y * y == 33)"
        hints:
          - x² − y² = (x + y)(x − y) と因数分解しよう。
          - 33 を、2 つの正の整数の積に分けよう。
          - それぞれの分け方で x を求めて、くらべよう。
        paths:
          - [(x + y)(x − y) = 33, 33 × 1 なら x = 17, 11 × 3 なら x = 7, 7]
      - part: 思い出す
        text: 平方数の一の位の数字として、ありえないものはどれですか。
        choices: [4, 6, 8]
        answer: 8
        check: "[c for c in (4, 6, 8) if all(n * n % 10 != c for n in range(10))][0]"
        hints:
          - 0² から 9² までを計算しよう。
          - それぞれの一の位を見よう。
          - 出てこない数字をさがそう。
        paths:
          - [一の位は 0、1、4、9、6、5、6、9、4、1, 8 は出てこない, 8]
      - part: わけ
        text: 「奇数の 2 乗を 8 でわったあまりは 1 である」ことを示しましょう。
        explain: 例：「奇数を 2k + 1（k は整数）とする。(2k + 1)² = 4k² + 4k + 1 = 4k(k + 1) + 1。k(k + 1) は連続する 2 つの整数の積なので偶数で、k(k + 1) = 2m（m は整数）と書ける。よって (2k + 1)² = 8m + 1 となり、8 でわったあまりは 1 である。」と書ければよい。①「奇数を 2k + 1 とする」で文字を決める、② 展開して 4k(k + 1) + 1 と変形する、③「連続する 2 つの整数の積は偶数」（N-028 で示した事実）で 8m + 1 と結ぶ、の 3 点を見る。4(k² + k) + 1 で止まって「4 でわると 1 あまる」までしか言えなかったら、k² + k = k(k + 1) が偶数であることに目を向けさせる。1、9、25、49 のような例だけで終わったら、例ではすべての奇数を示せないことを話す。
        hints:
          - 奇数を 2k + 1 とおいて、2 乗を展開しよう。
          - 4k² + 4k を、4 × （ ） の形にしよう。
          - （ ）の中の k(k + 1) は、どんな数かな。
        paths:
          - [奇数を 2k + 1 とする, (2k + 1)² = 4k(k + 1) + 1, k(k + 1) は偶数なので 2m とおく, 8m + 1 なのであまりは 1]
      - part: わけ
        text: 「正の整数 n について、n² + n は平方数ではない」ことを示しましょう。n² + n を、となり合う平方数 n² と (n + 1)² とくらべます。
        explain: 例：「n を正の整数とする。(n² + n) − n² = n で、n は正なので、n² + n は n² より大きい。(n + 1)² − (n² + n) = n² + 2n + 1 − n² − n = n + 1 で、n + 1 は正なので、n² + n は (n + 1)² より小さい。0 以上の整数の 2 乗は 0²、1²、2²、… と大きくなっていき、n² の次の平方数は (n + 1)² なので、n² より大きく (n + 1)² より小さい平方数はない。n² + n はそのあいだにあるので、平方数ではない。」と書ければよい。①「n を正の整数とする」で文字を決める、② 展開して、n² との差 n、(n + 1)² との差 n + 1 を求める、③「となり合う平方数のあいだに平方数はない」で結ぶ、の 3 点を見る。n = 0 では 0² + 0 = 0 が平方数（0²）になるので、「正の整数」の条件が要ることにふれられたら、なおよい。n² + n = n(n + 1) なので、「連続する 2 つの正の整数の積は平方数にならない」とも言える。
        hints:
          - n² + n は、n² よりいくつ大きいかな。
          - (n + 1)² を展開して、n² + n よりいくつ大きいかを求めよう。
          - となり合う平方数 n² と (n + 1)² のあいだに、平方数はあるかな。
        paths:
          - [n を正の整数とする, n² + n は n² より n 大きい, (n + 1)² は n² + n より n + 1 大きい, となり合う平方数のあいだにあるので平方数でない]
      - part: わけ
        text: 「平方数でない正の整数は、《約数》の個数が偶数である」ことを、約数を 2 つずつ組にして示しましょう。
        explain: 例：「N を平方数でない正の整数とする。N の約数 d に、N ÷ d を組にする。N ÷ d も N の約数で、N ÷ d の組の相手は N ÷ (N ÷ d) = d なので、組はもとにもどる。d と N ÷ d が同じ数になるのは d × d = N のときだけで、N は平方数でないので、そうなる d はない。だから、N の約数は、ちがう 2 つずつの組にもれなく分かれ、個数は偶数である。」と書ければよい。①「N を平方数でない正の整数とし、約数 d と N ÷ d を組にする」で決める、② 組の 2 つが同じになるのは d × d = N のときだけと示す、③「ちがう 2 つずつの組に分かれるので偶数」と結ぶ、の 3 点を見る。反対に N が平方数 m² なら、m だけが自分と組になり、ほかは 2 つずつの組になるので、約数の個数は奇数になる。ここまで言えたら、なおよい。12 の約数（1 と 12、2 と 6、3 と 4）のような例だけで終わったら、例ではすべての数を示せないことを話す。
        hints:
          - 12 の約数を、かけて 12 になる組に分けてみよう。
          - 約数 d の組の相手は N ÷ d だね。2 つが同じ数になるのは、どんなときかな。
          - N が平方数でなければ、組はどうなるかな。
        paths:
          - [約数 d と N ÷ d を組にする, 同じになるのは d × d = N のときだけ, N は平方数でないので組はみなちがう 2 つ, 約数の個数は偶数]
