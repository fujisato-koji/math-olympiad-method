# N-030 素数の性質
#
# 書き方は N-001 の頭の注、負の数の書き方と check は N-010 の頭の注、式を選ぶ問題の check は A-010 の頭の注のとおり。段 4 なので普通の文。
# 前提は N-021（素数と素因数分解）、L-011（背理法）、N-029（互除法と 1 次不定方程式）。たどると N-017・N-018（約数、公約数）、
#   A-009（累乗）、A-010・A-011（文字と式、1 次方程式）、N-027（正負の数）、N-075（わり算の筆算）が入るので、これらを道具にする。
# 約束した事実として使うもの：
#   2 以上の整数は素数の積に分けられる（N-021）。2 つの数をわり切る数は、その和と差もわり切る（N-029 の 6 日目のわけ）。
#   a と b の最大公約数が 1（たがいに素）なら、ax + by = 1 をみたす整数 x、y がある（N-029 の 5 日目。互除法を逆にたどれば見つかる）。
#   背理法の書き方（L-011）。
# この単元で示すこと（N-021 と N-029 で主張や事実として使ったもののわけ）：
#   1 日目 素数はいくらでもある（N-021 の主張）。全部の素数をかけて 1 をたす数と、「1 より大きい約数のうちいちばん小さいものは素数」を使う背理法。
#   2 日目 たがいに素の補題「a と b がたがいに素で a が bc をわり切るなら、a は c をわり切る」と、その素数の場合（ユークリッドの補題）。
#   3 日目 N-029 で事実として使った「整数解は x = x₀ + bt、y = y₀ − at ですべて」。N-029 の 4 日目の見本で「のちの単元で示します」とした分。
#   5 日目のわけで、素因数分解が 1 通りであること（N-021 の主張）を、ユークリッドの補題から示す。3 日目までは、1 通りであることを N-021 の主張として使う。
# 前提にないので使わないもの：約数の個数の式（N-024）、合同式（N-032）、フェルマーの小定理（N-033）、展開（A-015）、平方根と √2（A-016）。
#   「a は b をわり切る」は記号（|）を使わず言葉で書く。N-029 の互除法の数は 2 けただったが、ここでは筆算（N-075）で 3 けた・4 けたもわる。
# 最先端へのつながり（D-026）：素数の間隔（720 + 2 から 720 + 6 のような素数でない数の並び）、双子素数の予想（未解決）と、
#   差が 246 以下の素数の組が限りなくあること（張とメイナードの方法、2013〜2014 年）を note に書いた。
# check：素数かどうかは all(p % d for d in range(2, p))。いちばん小さい約数は min(d for d in range(2, n + 1) if n % d == 0)。
#   「すべての整数解」の式の一部を選ぶ問題は、range でさがした解の集まりで、選択肢の条件がいつも成り立つものを選ぶ。
# 日の並び（既定）：1 日目 導入、2・3 日目 練習（頭に見本）、4 日目 わけ、5 日目 N-021・L-011・N-029 と混ぜる（わけを 1 問）、6 日目 確認。

id: N-030
days:
  - day: 1
    items:
      - part: 見本
        text: 「素数は 2、3、5、7 の 4 つしかない」と仮定して、矛盾を導きましょう。
        figure: "2 × 3 × 5 × 7 + 1 = 211"
        explain: 4 つの素数を全部かけて 1 をたした数 211 を考えます。2 × 3 × 5 × 7 = 210 は 2、3、5、7 のどれでもわり切れるので、211 を 2、3、5、7 のどれでわっても、あまりは 1 です。一方、2 以上の《整数》の、1 より大きい《約数》のうち、いちばん小さいものは素数です（もし素数でなければ、それより小さい 1 より大きい約数をもち、それも 211 の約数になって「いちばん小さい」に反するからです）。仮定では素数は 2、3、5、7 だけなので、211 のいちばん小さい約数はそのどれかのはずです。ところが、どれでわってもわり切れません。これは矛盾です。よって、素数は 2、3、5、7 の 4 つだけではありません。どんな素数の組から始めても、全部かけて 1 をたせば同じことが言えるので、素数はいくらでもあります（背理法）。なお、全部かけて 1 をたした数そのものが素数とはかぎりません。2 × 3 × 5 × 7 × 11 × 13 + 1 = 30031 = 59 × 509 です。それでも、その素因数 59 と 509 は、はじめの組にない新しい素数です。
      - part: 思い出す
        text: 91 を素因数分解したとき、いちばん大きい素因数はいくつですか。
        answer: 13
        check: "max(p for p in range(2, 92) if 91 % p == 0 and all(p % d for d in range(2, p)))"
        hints:
          - 2、3、5 でわってみよう。
          - 7 でわってみよう。
          - 91 = 7 × □ の □ は、素数かな。
        paths:
          - [2、3、5 ではわり切れない, 91 = 7 × 13, 13 は素数, 13]
        note: 91 は九九に出てこないので、素数とまちがえやすい。
      - part: 思い出す
        text: 4 つの整数の和が 30 のとき、「少なくとも 1 つは □ 以上である」と必ず言えます。□ にあてはまる整数のうち、いちばん大きいものはいくつですか。
        answer: 8
        check: "max(m for m in range(1, 31) if 4 * (m - 1) < 30)"
        hints:
          - どれも 7 以下と仮定すると、和は最大でいくつかな。
          - その和は 30 とくらべてどうかな。
          - どれも 8 以下で、和が 30 になる例を作れるかな。
        paths:
          - [どれも 7 以下なら和は 28 以下で矛盾, 少なくとも 1 つは 8 以上, 8、8、7、7 で 30 なので 9 以上は言えない, 8]
      - part: 今日
        text: 221 の、1 より大きい約数のうち、いちばん小さいものはいくつですか。
        answer: 13
        check: "min(d for d in range(2, 222) if 221 % d == 0)"
        hints:
          - 2、3、5、7 と、小さい素数から順にわってみよう。
          - 11 でもわってみよう。
          - いちばん小さい約数は素数なので、素数だけ試せば足りるよ。
        paths:
          - [2、3、5、7、11 ではわり切れない, 221 = 13 × 17, 13]
        note: 4、6、9 のような素数でない数で試さなくてよいのは、いちばん小さい約数がいつも素数になるから。
      - part: 今日
        text: 「素数は 3、5、7 だけ」と仮定して、3 × 5 × 7 + 1 = 106 を考えます。106 の素因数のうち、いちばん大きいものはいくつですか。
        answer: 53
        check: "max(p for p in range(2, 107) if 106 % p == 0 and all(p % d for d in range(2, p)))"
        hints:
          - 106 は 2 でわり切れるね。
          - 106 ÷ 2 の商は、素数かな。
