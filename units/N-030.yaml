      - part: わけ
        id: "5de8ee7859"
        text: 「2 以上の整数の素因数分解は、かける順番をのぞいて 1 通りしかない」ことを示しましょう。ある数が 2 通りの素数の積で表せたとして、「素数 p が積をわり切るなら、かけている数のどれかをわり切る」ことを使います。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><text x="14" y="50" font-size="15" text-anchor="start" fill="currentColor">ある数 =</text><circle cx="104" cy="44" r="14" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="104" y="49" font-size="13" text-anchor="middle" fill="currentColor">p₁</text><circle cx="144" cy="44" r="14" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="144" y="49" font-size="13" text-anchor="middle" fill="currentColor">p₂</text><circle cx="184" cy="44" r="14" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="184" y="49" font-size="13" text-anchor="middle" fill="currentColor">p₃</text><text x="232" y="50" font-size="16" text-anchor="middle" fill="currentColor">…</text><text x="14" y="132" font-size="15" text-anchor="start" fill="currentColor">ある数 =</text><circle cx="104" cy="126" r="14" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="104" y="131" font-size="13" text-anchor="middle" fill="currentColor">q₁</text><circle cx="144" cy="126" r="14" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="144" y="131" font-size="13" text-anchor="middle" fill="currentColor">q₂</text><circle cx="184" cy="126" r="14" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="184" y="131" font-size="13" text-anchor="middle" fill="currentColor">q₃</text><circle cx="224" cy="126" r="14" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="224" y="131" font-size="13" text-anchor="middle" fill="currentColor">q₄</text><text x="272" y="132" font-size="16" text-anchor="middle" fill="currentColor">…</text><line x1="104" y1="59" x2="144" y2="111" stroke="#f08080" stroke-width="2.5" stroke-linecap="round"/><circle cx="104" cy="44" r="19" fill="none" stroke="#f08080" stroke-width="2.5"/><circle cx="144" cy="126" r="19" fill="none" stroke="#f08080" stroke-width="2.5"/><text x="156" y="92" font-size="13" text-anchor="start" fill="currentColor">p₁ = q₂ なら両方から消す</text><text x="160" y="184" font-size="14" text-anchor="middle" fill="currentColor">素数の玉が 1 つずつ組になって消える？</text></svg>'
        explain: 例：「ある数が、素数の積として 2 通りに表せたとする。左辺の素数の 1 つを p とする。p は左辺をわり切るので、右辺の積もわり切る。ユークリッドの補題を、右辺の積を 1 つずつほどきながらくり返し使うと、p は右辺の素数のどれかをわり切る。その素数を q とすると、q の約数は 1 と q だけで、p は 1 ではないので p = q である。両辺をこの素数でわると、残りの積どうしが等しくなる。これをくり返すと、両辺の素数が 1 つずつ組になって消えていく。もしかたほうの素数が先になくなると、残りは『1 = 素数の積』になってむじゅんするので、素数の個数も同じである。よって、2 つの表し方に出てくる素数は、順番をのぞいてまったく同じである。」と書ければよい。① 2 通りの表し方を「〜とする」で決め、左辺の素数 p をとる、② ユークリッドの補題で p が右辺の素数 q をわり切り、q が素数なので p = q と示して、両辺をわる、③「くり返すと素数が組になって消える」と結ぶ、の 3 点を見る。60 = 2 × 30 = 6 × 10 を分解して同じになることを見るだけで終わったら、例ではすべての数を示せないことを話す。1 を素数に入れると 6 = 2 × 3 = 1 × 2 × 3 のように 1 通りでなくなることも、1 を素数に入れないわけとして話してよい。
        hints:
          - 左辺の素数の 1 つを p として、p は右辺の積をわり切るね。ユークリッドの補題を使おう。
          - p が右辺の素数 q をわり切るとき、q の約数は何と何かな。
          - 両辺を p でわって、残りの積で同じことをくり返そう。
        paths:
