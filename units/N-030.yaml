# N-030 素数の性質
#
# 書き方は N-001 の頭の注、負の数の書き方と check は N-010 の頭の注、式を選ぶ問題の check は A-010 の頭の注のとおり。段 4 なので普通の文。
# 前提は N-021（素数と素因数分解）、L-011（背理法）、N-029（互除法と 1 次不定方程式）。たどると N-017・N-018（約数、公約数）、
#   A-009（累乗）、A-010・A-011（文字と式、1 次方程式）、N-027（正負の数）、N-075（わり算の筆算）が入るので、これらを道具にする。
# 約束した事実として使うもの：
#   2 以上の整数は素数の積に分けられる（N-021）。2 つの数をわり切る数は、その和と差もわり切る（N-029 の 6 日目のわけ）。
#   a と b の最大公約数が 1（たがいに素）なら、ax + by = 1 をみたす整数 x、y がある（N-029 の 5 日目。互除法を逆にたどれば見つかる）。
#   背理法の書き方（L-011）。
# この単元で示すこと（N-021 と N-029 で主張や事実として使ったもののわけ）：
#   1 日目 素数はいくらでもある（N-021 の主張）。全部の素数をかけて 1 をたす数と、「1 より大きい約数のうちいちばん小さいものは素数」を使う背理法。
#   2 日目 たがいに素の補題「a と b がたがいに素で a が bc をわり切るなら、a は c をわり切る」と、その素数の場合（ユークリッドの補題）。
#   3 日目 N-029 で事実として使った「整数解は x = x₀ + bt、y = y₀ − at ですべて」。N-029 の 4 日目の見本で「のちの単元で示します」とした分。
#   5 日目のわけで、素因数分解が 1 通りであること（N-021 の主張）を、ユークリッドの補題から示す。3 日目までは、1 通りであることを N-021 の主張として使う。
# 前提にないので使わないもの：約数の個数の式（N-024）、合同式（N-032）、フェルマーの小定理（N-033）、展開（A-015）、平方根と √2（A-016）。
#   「a は b をわり切る」は記号（|）を使わず言葉で書く。N-029 の互除法の数は 2 けただったが、ここでは筆算（N-075）で 3 けた・4 けたもわる。
# 最先端へのつながり（D-026）：素数の間隔（720 + 2 から 720 + 6 のような素数でない数の並び）、双子素数の予想（未解決）と、
#   差が 246 以下の素数の組が限りなくあること（張とメイナードの方法、2013〜2014 年）を note に書いた。
# check：素数かどうかは all(p % d for d in range(2, p))。いちばん小さい約数は min(d for d in range(2, n + 1) if n % d == 0)。
#   「すべての整数解」の式の一部を選ぶ問題は、range でさがした解の集まりで、選択肢の条件がいつも成り立つものを選ぶ。
# 日の並び（既定）：1 日目 導入、2・3 日目 練習（頭に見本）、4 日目 わけ、5 日目 N-021・L-011・N-029 と混ぜる（わけを 1 問）、6 日目 確認。
# ただし腕だめしの最難関（和が積をわり切る 2 つの数）だけは例外で、uses に A-015 を挙げて、展開（かっこをはずして式をのばす）を使う。A-015 は地図の前提のたどりには入っている。
# 図の約束（D-129〜D-131 で足した）：素数は色の玉（2 黄、3 空色、5 緑、7 赤、11 むらさき、13 茶）。2 段の玉の図は「下の玉が全部上にあれば、わり切れる」。
#   わり切れることとたがいに素は 2 段の玉、ax = by はテープ（切れ目がそろうところが解）、整数解の動きは数直線（x は b ずつ、y は a ずつ）、
#   いちばん小さい約数はわり算の表、互除法は長方形から正方形を切り取る図、最大公約数と最小公倍数は同じ色の玉を線で結ぶ図。

id: N-030
days:
  - day: 1
    items:
      - part: 見本
        id: "d7c1e1be32"
        text: 「素数は 2、3、5、7 の 4 つしかない」と仮定して、むじゅんを導きましょう。
        figure: "2 × 3 × 5 × 7 + 1 = 211"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">かりに、素数はこの 4 つだけとする</text><circle cx="100" cy="50" r="14" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="100" y="55" font-size="15" text-anchor="middle" fill="currentColor">2</text><circle cx="140" cy="50" r="14" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="140" y="55" font-size="15" text-anchor="middle" fill="currentColor">3</text><circle cx="180" cy="50" r="14" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="180" y="55" font-size="15" text-anchor="middle" fill="currentColor">5</text><circle cx="220" cy="50" r="14" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="220" y="55" font-size="15" text-anchor="middle" fill="currentColor">7</text><text x="160" y="90" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">211</text><line x1="20" y1="96" x2="300" y2="96" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="20" y1="91" x2="20" y2="101" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="300" y1="91" x2="300" y2="101" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="20" y="104" width="252" height="34" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="146" y="126" font-size="14" text-anchor="middle" fill="currentColor">2 × 3 × 5 × 7 = 210</text><rect x="272" y="104" width="28" height="34" rx="0" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="286" y="126" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="160" y="162" font-size="14" text-anchor="middle" fill="currentColor">2、3、5、7 のどれでわっても 1 あまる</text><text x="160" y="188" font-size="13" text-anchor="middle" fill="currentColor">→ 211 の素因数は、この 4 つのどれでもない</text></svg>'
        explain: 4 つの素数を全部かけて 1 をたした数 211 を考えます。2 × 3 × 5 × 7 = 210 は 2、3、5、7 のどれでもわり切れるので、211 を 2、3、5、7 のどれでわっても、あまりは 1 です。一方、2 以上の《整数》の、1 より大きい《約数》のうち、いちばん小さいものは素数です（もし素数でなければ、それより小さい 1 より大きい約数をもち、それも 211 の約数になって「いちばん小さい」に反するからです）。仮定では素数は 2、3、5、7 だけなので、211 のいちばん小さい約数はそのどれかのはずです。ところが、どれでわってもわり切れません。これはむじゅんです。よって、素数は 2、3、5、7 の 4 つだけではありません。どんな素数の組から始めても、全部かけて 1 をたせば同じことが言えるので、素数はいくらでもあります（背理法）。なお、全部かけて 1 をたした数そのものが素数とはかぎりません。2 × 3 × 5 × 7 × 11 × 13 + 1 = 30031 = 59 × 509 です。それでも、その素因数 59 と 509 は、はじめの組にない新しい素数です。
