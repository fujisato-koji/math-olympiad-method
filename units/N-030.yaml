      - part: わけ
        text: 「素数はいくらでもある」ことを、背理法で示しましょう。素数が有限個しかないと仮定し、それらを全部かけた数に 1 をたした数を考えます。
        explain: 例：「素数が有限個しかないと仮定し、それらを全部かけた数を P とする。N = P + 1 とおく。N は 2 以上の整数なので、1 より大きい約数のうち、いちばん小さいもの q がある。q は素数である（q が素数でなければ、q より小さい 1 より大きい約数をもち、それも N の約数になって、q がいちばん小さいことに反する）。素数は P にかけた数だけなので、q はそのどれかであり、q は P をわり切る。q は N もわり切るので、差の N − P = 1 もわり切る。1 より大きい q が 1 をわり切ることはないので、矛盾する。よって、素数は有限個ではなく、いくらでもある。」と書ければよい。①「有限個しかないと仮定し、全部の積を P、N = P + 1 とする」で文字を決める、② N のいちばん小さい約数 q が素数で、P と N の両方をわり切ることを示す、③「2 つの数をわり切る数は差もわり切る」という約束した事実で、q が 1 をわり切るという矛盾に結ぶ、の 3 点を見る。2 × 3 × 5 × 7 + 1 = 211 のような例だけで終わったら、例では「どんな有限個の組でも」を示せないことを話す。N そのものが素数だと書いていたら、30031 = 59 × 509 のように素数でない場合があり、示しているのは「組にない素数がある」ことだと話す。
        hints:
          - 結論の否定「素数は有限個」を仮定し、全部の積を P として、N = P + 1 を考えよう。
          - N の、1 より大きいいちばん小さい約数 q は、素数かな。
          - q は P をわり切るかな。N をわり切るなら、N − P もわり切るね。
        paths:
          - [有限個と仮定し全部の積を P、N = P + 1 とする, N のいちばん小さい約数 q は素数, q は P と N をわり切る, q は差の 1 をわり切り矛盾, よって素数はいくらでもある]
      - part: わけ
        text: 「a と b がたがいに素で、a が bc をわり切るならば、a は c をわり切る」ことを示しましょう（a、b、c は整数で、a は正）。a と b がたがいに素なら、ax + by = 1 をみたす整数 x、y があることを使います。
        explain: 例：「a と b はたがいに素なので、ax + by = 1 をみたす整数 x、y がある。両辺に c をかけると acx + bcy = c。a は bc をわり切るので、bc = am（m は整数）と書ける。すると c = acx + amy = a(cx + my)。cx + my は整数なので、a は c をわり切る。」と書ければよい。①「ax + by = 1 となる整数 x、y がある」「bc = am とする」で文字を決める、② 両辺に c をかけて c = a(cx + my) と変形する、③「cx + my は整数なので、a でわり切れる」と、わり切れることの意味で結ぶ、の 3 点を見る。a が素数 p で、p が b をわり切らないとき、p と b はたがいに素なので「素数 p が bc をわり切るなら、p は b か c をわり切る」（ユークリッドの補題）が出ることまで言えたら、なおよい。7 × (−2) + 5 × 3 = 1 の例だけで終わったら、例ではすべての a、b、c を示せないことを話す。
        hints:
          - ax + by = 1 の両辺に c をかけてみよう。
          - a が bc をわり切ることを、bc = a × （整数） と書こう。
          - c を a × （ ） の形にしよう。
        paths:
          - [ax + by = 1 となる整数 x、y がある, 両辺に c をかけて c = acx + bcy, bc = am とおくと c = a(cx + my), cx + my は整数なので a は c をわり切る]
      - part: わけ
        text: a、b はたがいに素な正の整数で、x₀、y₀ は ax + by = c の整数解の 1 つとします。どの整数解 x、y も、x = x₀ + bt、y = y₀ − at（t は整数）の形に書けることを示しましょう。
        explain: 例：「x、y を ax + by = c の整数解とする。ax₀ + by₀ = c なので、2 つの式をひくと a(x − x₀) + b(y − y₀) = 0、つまり a(x − x₀) = b(y₀ − y)。右辺は b の倍数なので、b は a(x − x₀) をわり切る。a と b はたがいに素なので、前の問題の補題から、b は x − x₀ をわり切る。よって x − x₀ = bt（t は整数）と書ける。これを入れると abt = b(y₀ − y) で、b は正なので両辺を b でわって at = y₀ − y、y = y₀ − at。よって、どの整数解も x = x₀ + bt、y = y₀ − at の形をしている。」と書ければよい。① 解を x、y とし、t を「x − x₀ = bt と書ける」で決める、② 2 つの式をひいて a(x − x₀) = b(y₀ − y) と変形する、③ たがいに素の補題で「b は x − x₀ をわり切る」と結ぶ、の 3 点を見る。反対に、この形の x、y がいつも解になること（a(x₀ + bt) + b(y₀ − at) = ax₀ + by₀ = c）も書けたら、なおよい。前の単元で、解をずらして見つけた解に取りこぼしがないことの証明になっていることを話す。
        hints:
          - ax + by = c と ax₀ + by₀ = c をひいてみよう。
          - a(x − x₀) = b × （ ） の形にすると、b は何をわり切るかな。
