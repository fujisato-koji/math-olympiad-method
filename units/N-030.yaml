        text: 前の単元で、3x + 5y = 31 の《整数》解は x = 2 + 5t、y = 5 − 3t（t は整数）ですべてだ、という事実を使いました。ほかの形の解がないわけを、2 日目のきまりで確かめましょう。
        svg: '<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="15" text-anchor="middle" fill="currentColor">3x + 5y = 31 の整数解</text><rect x="116" y="58" width="64" height="64" fill="#f3c969" fill-opacity="0.35"/><rect x="16" y="58" width="292" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="90" x2="308" y2="90" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="52" y1="58" x2="52" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="116" y1="58" x2="116" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="180" y1="58" x2="180" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="244" y1="58" x2="244" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="34.0" y="80" font-size="15" text-anchor="middle" fill="currentColor">x</text><text x="34.0" y="112" font-size="15" text-anchor="middle" fill="currentColor">y</text><text x="84.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">−3</text><text x="84.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">8</text><text x="148.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="148.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">5</text><text x="212.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">7</text><text x="212.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="276.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">12</text><text x="276.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">−1</text><path d="M94.0,55 Q115.0,36 136.0,54" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="139.8,57.3 130.8,55.5 136.7,48.6" fill="#f08080"/><text x="116.0" y="38" font-size="13" text-anchor="middle" fill="currentColor">+5</text><path d="M94.0,125 Q115.0,144 136.0,126" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="139.8,122.7 136.7,131.4 130.8,124.5" fill="#f08080"/><text x="116.0" y="156" font-size="13" text-anchor="middle" fill="currentColor">−3</text><path d="M158.0,55 Q179.0,36 200.0,54" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="203.8,57.3 194.8,55.5 200.7,48.6" fill="#f08080"/><text x="180.0" y="38" font-size="13" text-anchor="middle" fill="currentColor">+5</text><path d="M158.0,125 Q179.0,144 200.0,126" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="203.8,122.7 200.7,131.4 194.8,124.5" fill="#f08080"/><text x="180.0" y="156" font-size="13" text-anchor="middle" fill="currentColor">−3</text><path d="M222.0,55 Q243.0,36 264.0,54" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="267.8,57.3 258.8,55.5 264.7,48.6" fill="#f08080"/><text x="244.0" y="38" font-size="13" text-anchor="middle" fill="currentColor">+5</text><path d="M222.0,125 Q243.0,144 264.0,126" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="267.8,122.7 264.7,131.4 258.8,124.5" fill="#f08080"/><text x="244.0" y="156" font-size="13" text-anchor="middle" fill="currentColor">−3</text><text x="160" y="182" font-size="15" text-anchor="middle" fill="currentColor">3(x − 2) = 5(5 − y)</text><text x="160" y="206" font-size="13" text-anchor="middle" fill="currentColor">→ 5 は x − 2 をわり切る（2 日目のきまり）</text></svg>'
        explain: x、y を 3x + 5y = 31 の整数解とします。x = 2、y = 5 も解なので 3 × 2 + 5 × 5 = 31 です。2 つの式をひくと 3(x − 2) + 5(y − 5) = 0、つまり 3(x − 2) = 5(5 − y) です。右辺は 5 の《倍数》なので、5 は 3(x − 2) をわり切ります。5 と 3 はたがいに素なので、2 日目のきまりから、5 は x − 2 をわり切ります。だから x − 2 = 5t（t は整数）と書けます。これを入れると 3 × 5t = 5(5 − y) で、両辺を 5 でわると 3t = 5 − y、y = 5 − 3t です。よって、どの整数解も x = 2 + 5t、y = 5 − 3t の形をしています。前の単元で、解をずらして見つけた解のほかに、取りこぼした解はありません。たがいに素であることが、5 が x − 2 をわり切る、のところで使われています。
