    - A-015
    text: 1 から 60 までの整数から、ちがう 2 つの数をえらびます。2 つの数の和が 2 つの数の積をわり切るようなえらび方は、全部で何通りですか。えらぶ順番は考えません。たとえば 3 と 6 は、和の 9 が積の 18 をわり切るので、このようなえらび方です。
    answer: 31
    check: sum(1 for a in range(1, 61) for b in range(a + 1, 61) if (a * b) % (a + b) == 0)
    hints:
    - 条件に合う組を、小さいほうの数が小さい順に 10 組ほど書き出して、2 つの数のあいだの関係（何倍になっているか、など）をくらべてみよう。
    - 見つけた組どうしを見くらべて、つながりのある組（たとえば 3 と 6、6 と 12）がないかさがそう。
    - つながりのある組どうしで、そろっているものは何だろう。
    paths:
    - - 小さいほうを a、大きいほうを b、a と b の最大公約数を g とする。a = g × x、b = g × y とおくと、x < y で、x と y の公約数は 1 だけ（1 より大きい公約数があれば、g をそれだけ大きくできて、g が最大公約数であることに合わない）。和は a + b = g × (x + y)、積は a × b = g × g × x × y。積が和でわり切れるとは、g × g × x × y が g × (x + y) でわり切れること。どちらも g でわって見ても同じなので、x + y が g × x × y をわり切ること
      - x + y と x の公約数は、差 (x + y) − x = y もわり切る（2 つの数をわり切る数は、その差もわり切る）。x と y の公約数は 1 だけなので、x + y と x の公約数も 1 だけ（たがいに素）。同じように x + y と y もたがいに素。x + y は x × (g × y) をわり切り、x + y と x はたがいに素なので、x + y は g × y をわり切る（p と q がたがいに素で、p が q × r をわり切るなら、p は r をわり切る）。さらに x + y と y がたがいに素で、x + y は y × g をわり切るので、x + y は g をわり切る
      - g = k × (x + y)（k は 1 以上の整数）とおけて、a = k × x × (x + y)、b = k × y × (x + y)。反対に、x < y で公約数が 1 の x、y と、1 以上の整数 k から a、b をこの形に作ると、a と b を k × (x + y) でわると x と y になり公約数は 1 だけなので、最大公約数は k × (x + y)。積 ÷ 和 = k × x × y と整数になり、このえらび方は合う。だから、合うえらび方 (a, b) と (x, y, k) の組は、どちらから見ても、もう一方がただ 1 つにきまる
      - b = k × y × (x + y) が 60 以下なので、y × (x + y) は 60 以下。x < y で公約数が 1 の (x, y) を y の小さい順に調べる。y = 2：x = 1。y = 3：x = 1、2。y = 4：x = 1、3（x = 2 は公約数 2）。y = 5：x = 1、2、3、4。y = 6：6 と公約数が 1 だけの x は 1 と 5 で、x = 5 は 6 × 11 = 66 で 60 をこえるので x = 1 だけ。y = 7：x = 2 で 7 × 9 = 63 となり、x が大きいほどさらに大きいので x = 1 だけ。y が 8 以上なら y × (x + y) は 8 × 9 = 72 以上で 60 をこえる。(x, y) は 11 組
      - 11 組の y × (x + y) と、k のとれる数（k × y × (x + y) ≤ 60 の k）は、(1, 2) は 6 で 10、(1, 3) は 12 で 5、(2, 3) は 15 で 4、(1, 4) は 20 で 3、(3, 4) は 28 で 2、(1, 5) は 30 で 2、(2, 5) は 35 で 1、(3, 5) は 40 で 1、(4, 5) は 45 で 1、(1, 6) は 42 で 1、(1, 7) は 56 で 1。合わせて 10 + 5 + 4 + 3 + 2 + 2 + 1 + 1 + 1 + 1 + 1 = 31 通り。たとえば (1, 2)、k = 1 は a = 3、b = 6（問題の例）
    - - 2 つの数を a < b とし、積 ÷ 和 を c とする（整数）。c は a より小さい（c が a 以上なら c × (a + b) は a × (a + b) 以上で、a × b より大きくなり、c × (a + b) = a × b に合わない）。同じように c は b より小さい。だから a = c + u、b = c + v とおける（u、v は 1 以上の整数で、a < b なので u < v）
      - c × (a + b) = a × b を展開する。左は c × (2 × c + u + v) = 2 × c × c + c × u + c × v。右は (c + u) × (c + v) = c × c + c × v + u × c + u × v。左右をくらべる。左にも右にも c × u と c × v があるので消す。のこりは、左が 2 × c × c、右が c × c + u × v。2 × c × c から c × c をひくと c × c なので、c × c = u × v が残る
      - 反対に、c × c = u × v（u < v）なら、a = c + u、b = c + v で a × b = c × c + c × (u + v) + u × v = 2 × c × c + c × (u + v) = c × (2 × c + u + v) = c × (a + b)。積 ÷ 和 = c と整数になり、このえらび方は合う。u < v で u × v = c × c なので u < c < v（v が c 以下なら u × v は c × c より小さく、u が c 以上なら大きい）。u = c × c ÷ v なので、えらび方 (a, b) と (c, v) の組は、どちらから見ても、もう一方がただ 1 つにきまる。v は c × c の約数で、c より大きいもの
      - b = c + v が 60 以下なので v ≤ 60 − c。c < v だから c < 60 − c で、c は 29 以下。c が 1 から 29 までの各数で、c × c の約数 v のうち c より大きく 60 − c 以下のものを調べる。c = 2：4（1 通り）。c = 3：9（1）。c = 4：8、16（2）。c = 5：25（1）。c = 6：9、12、18、36（4）。c = 7：49（1）。c = 8：16、32（2）。c = 9：27（1）。c = 10：20、25、50（3）。c = 12：16、18、24、36、48（5）
      - つづき。c = 14：28（1）。c = 15：25、45（2）。c = 16：32（1）。c = 18：27、36（2）。c = 20：25、40（2）。c = 24：32、36（2）。c = 1、11、13、17、19、21、22、23、25、26、27、28、29 は 0 通り（c = 1 は 1 より大きい約数がない。c が 11、13、17、19、23、29 のような 11 以上の素数なら、c × c の約数で c より大きいのは c × c だけで、60 − c より大きい。c = 21、22、25、26、27、28 は、c × c の約数で c より大きいいちばん小さいものが 49、44、125、52、81、49 で、どれも 60 − c をこえる）。合わせて 1 + 1 + 2 + 1 + 4 + 1 + 2 + 1 + 3 + 5 + 1 + 2 + 1 + 2 + 2 + 2 = 31 通り。たとえば c = 2、v = 4 は u = 1 で a = 3、b = 6（問題の例）
    note: 考えどころは 3 つ：①2 つの数を最大公約数 g でわって、公約数が 1 の x、y にする（a = g × x、b = g × y で、積が和でわり切れることは、x + y が g × x × y をわり切ることになる）、②x + y は x とも y とも公約数が 1 なので、x + y は g をわり切る（g = k × (x + y)）、③2 つの数は k × x × (x + y) と k × y × (x + y) の形にかぎられ、反対にこの形ならいつも合うので、60 以下の上限で y × (x + y) が 60 以下の (x, y) 11 組について k の数を数えて 31。2 本目は、1 本目とちがい、最大公約数を使わない。c = 積 ÷ 和 を先に決め（c は 2 つの数のどちらよりも小さい）、a = c + u、b = c + v とおいて展開すると u × v = c × c になるので、c × c の約数の組に言いかえて、c ごとに表で数える（1 ÷ a + 1 ÷ b = 1 ÷ c と同じこと）。1 本目は公約数 1 の x、y の形を決めてから k を数えるが、2 本目は c を決めて c × c の約数 v を数えるので、表の行も数え方も別。check は、1 から 60 までの 2 つの数の組 1770 通りを全部調べて、積が和でわり切れるものを数える（31）。既出・出典：上限が 60 でなくほかの数でも、同じ型の数え上げがプログラミングのコンテストの問題にある（CodeChef、Luogu P4466）。大会の同じ問いは見つけていない。60 は自作の数。2 本目の (a − c) × (b − c) = c × c にする道具は、a × b ÷ (a + b) = n となる組の数を問う Putnam 1960 A1 と同じで定番。展開して約数の組にする運びは G-019、A-015 とも同じ。1 本目は 2 つの数が何倍の関係かで、2 本目は 積 ÷ 和 で分けて数えるので、数え方のもとがちがう。わな：見つけた例（3 と 6、4 と 12 など）から 2 倍・3 倍の関係のものだけを数えて止まる。(x, y) の公約数が 1 であることを見落として、同じ 2 つの数を別の (x, y, k) で重ねて数える（(2, 4) と (1, 2) など）。
