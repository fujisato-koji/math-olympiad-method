      - part: わけ
        text: 「2 以上の整数の素因数分解は、かける順番をのぞいて 1 通りしかない」ことを示しましょう。ある数が 2 通りの素数の積で表せたとして、「素数 p が積をわり切るなら、かけている数のどれかをわり切る」ことを使います。
        explain: 例：「ある数が、素数の積として 2 通りに表せたとする。左辺の素数の 1 つを p とする。p は左辺をわり切るので、右辺の積もわり切る。ユークリッドの補題を、右辺の積を 1 つずつほどきながらくり返し使うと、p は右辺の素数のどれかをわり切る。その素数を q とすると、q の約数は 1 と q だけで、p は 1 ではないので p = q である。両辺をこの素数でわると、残りの積どうしが等しくなる。これをくり返すと、両辺の素数が 1 つずつ組になって消えていく。もし片方の素数が先になくなると、残りは『1 = 素数の積』になって矛盾するので、素数の個数も同じである。よって、2 つの表し方に出てくる素数は、順番をのぞいてまったく同じである。」と書ければよい。① 2 通りの表し方を「〜とする」で決め、左辺の素数 p をとる、② ユークリッドの補題で p が右辺の素数 q をわり切り、q が素数なので p = q と示して、両辺をわる、③「くり返すと素数が組になって消える」と結ぶ、の 3 点を見る。60 = 2 × 30 = 6 × 10 を分解して同じになることを見るだけで終わったら、例ではすべての数を示せないことを話す。1 を素数に入れると 6 = 2 × 3 = 1 × 2 × 3 のように 1 通りでなくなることも、1 を素数に入れないわけとして話してよい。
        hints:
          - 左辺の素数の 1 つを p として、p は右辺の積をわり切るね。ユークリッドの補題を使おう。
          - p が右辺の素数 q をわり切るとき、q の約数は何と何かな。
          - 両辺を p でわって、残りの積で同じことをくり返そう。
        paths:
          - [2 通りに表せたとし左辺の素数 p をとる, p は右辺の積をわり切るのでどれかの素数 q をわり切る, q は素数なので p = q, 両辺をわってくり返すと素数が組になって消える, 1 通りしかない]
    extra:
      - part: 今日
        text: 2² × 5 × 7 と 2 × 3 × 7² の最大公約数はいくつですか。
        answer: 14
        check: "math.gcd(2 ** 2 * 5 * 7, 2 * 3 * 7 ** 2)"
        hints:
