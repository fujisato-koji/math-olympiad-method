  - day: 2
    items:
      - part: 見本
        id: "784736ab31"
        text: 7 は 5 × c をわり切ります（c は《整数》）。7x + 5y = 1 の整数解 x = −2、y = 3 を使って、7 が c をわり切ることを確かめましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="26" font-size="16" text-anchor="middle" fill="currentColor">7 × (−2) + 5 × 3 = 1</text><line x1="80" y1="36" x2="80" y2="54.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="80,62 75,53 85,53" fill="currentColor"/><text x="94" y="54" font-size="13" text-anchor="start" fill="currentColor">両辺に c をかける</text><rect x="18" y="72" width="112" height="38" rx="6" fill="#f08080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="74" y="96" font-size="15" text-anchor="middle" fill="currentColor">7 × (−2c)</text><text x="144" y="97" font-size="17" text-anchor="middle" fill="currentColor">+</text><rect x="158" y="72" width="92" height="38" rx="6" fill="#f08080" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="204" y="96" font-size="15" text-anchor="middle" fill="currentColor">5c × 3</text><text x="280" y="97" font-size="17" text-anchor="middle" fill="currentColor">= c</text><text x="74" y="132" font-size="13" text-anchor="middle" fill="currentColor">7 の倍数</text><text x="204" y="132" font-size="13" text-anchor="middle" fill="currentColor">7 の倍数</text><text x="204" y="150" font-size="12" text-anchor="middle" fill="currentColor">（5c は 7 の倍数）</text><text x="160" y="186" font-size="14" text-anchor="middle" fill="currentColor">7 の倍数 + 7 の倍数 → c も 7 の倍数</text></svg>'
        explain: 7 × (−2) + 5 × 3 = 1 の両辺に c をかけると、7 × (−2c) + 5c × 3 = c です。7 × (−2c) は 7 の《倍数》です。5c は 7 でわり切れるので、5c × 3 も 7 の倍数です。7 の倍数どうしの和なので、c も 7 の倍数です。最大公《約数》が 1 の 2 つの整数を「たがいに素」といいます。たがいに素な a と b には、いつも ax + by = 1 をみたす整数 x、y があるので（前の単元の互除法を逆にたどる方法）、同じことが言えます。「a と b がたがいに素で、a が bc をわり切るなら、a は c をわり切る」。特に a が素数 p のとき、p が b をわり切らなければ、p と b はたがいに素です。だから「素数 p が bc をわり切るなら、p は b か c をわり切る」が言えます。たがいに素でないと成り立たないことがあります。6 は 4 × 3 = 12 をわり切りますが、4 も 3 もわり切りません。
      - part: 思い出す
        id: "01fc6f53ca"
        text: 4x + 9y = 1 の整数解のうち、x がいちばん小さい正の整数であるものの y はいくつですか。
        svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="16" text-anchor="middle" fill="currentColor">4x + 9y = 1</text><rect x="10" y="40" width="296" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="10" y1="72" x2="306" y2="72" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="96" y1="40" x2="96" y2="104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="53" y="62" font-size="15" text-anchor="middle" fill="currentColor">x</text><text x="53" y="94" font-size="13" text-anchor="middle" fill="currentColor">9y = 1 − 4x</text><text x="111" y="62" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="111" y="94" font-size="13" text-anchor="middle" fill="currentColor">−3</text><line x1="126" y1="40" x2="126" y2="104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="141" y="62" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="141" y="94" font-size="13" text-anchor="middle" fill="currentColor">?</text><line x1="156" y1="40" x2="156" y2="104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="171" y="62" font-size="14" text-anchor="middle" fill="currentColor">3</text><text x="171" y="94" font-size="13" text-anchor="middle" fill="currentColor">?</text><line x1="186" y1="40" x2="186" y2="104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="201" y="62" font-size="14" text-anchor="middle" fill="currentColor">4</text><text x="201" y="94" font-size="13" text-anchor="middle" fill="currentColor">?</text><line x1="216" y1="40" x2="216" y2="104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="231" y="62" font-size="14" text-anchor="middle" fill="currentColor">5</text><text x="231" y="94" font-size="13" text-anchor="middle" fill="currentColor">?</text><line x1="246" y1="40" x2="246" y2="104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="261" y="62" font-size="14" text-anchor="middle" fill="currentColor">6</text><text x="261" y="94" font-size="13" text-anchor="middle" fill="currentColor">?</text><line x1="276" y1="40" x2="276" y2="104" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="291" y="62" font-size="14" text-anchor="middle" fill="currentColor">7</text><text x="291" y="94" font-size="13" text-anchor="middle" fill="currentColor">?</text><text x="160" y="134" font-size="13" text-anchor="middle" fill="currentColor">1 − 4x が 9 でわり切れると、y は整数</text><text x="160" y="156" font-size="13" text-anchor="middle" fill="currentColor">x がいちばん小さい正の整数のとき、y は？</text></svg>'
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([(1 - 4 * x) // 9 for x in range(1, 50) if (1 - 4 * x) % 9 == 0][0])"
        hints:
