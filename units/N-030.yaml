          - 和を変えないためには、3y をいくつへらせばよいかな。
          - そのためには、y をいくつへらせばよいかな。
        paths:
          - [5x は 15 ふえる, 3y を 15 へらす, y は 5 へって 1]
          - [x = 7 を代入して 35 + 3y = 38, 3y = 3, y = 1]
