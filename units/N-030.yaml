# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "c594b19939"
    kinds: [総動員, 道筋]
    uses: [N-028]
    text: 素数 p のうち、p² + 2 も素数になるものをすべて考えます。そのような p について、p² + 2 の値をすべてたすといくつですか。
    svg: '<svg viewBox="0 0 320 164" xmlns="http://www.w3.org/2000/svg"><circle cx="54" cy="70" r="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="54" y="77" font-size="20" text-anchor="middle" fill="currentColor">p</text><text x="54" y="118" font-size="13" text-anchor="middle" fill="currentColor">素数</text><line x1="86" y1="70" x2="146" y2="70" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="151.0,70.0 143.0,74.5 143.0,65.5" fill="currentColor"/><rect x="158" y="44" width="136" height="52" rx="12" fill="#c8ccd6" fill-opacity="0.15" stroke="currentColor" stroke-width="2"/><text x="226" y="77" font-size="17" text-anchor="middle" fill="currentColor">p × p + 2</text><text x="226" y="118" font-size="13" text-anchor="middle" fill="currentColor">これも素数？</text><text x="160" y="150" font-size="13" text-anchor="middle" fill="currentColor">そのような p の p² + 2 を全部たすと？</text></svg>'
    answer: 11
    check: "sum([p * p + 2 for p in range(2, 100) if all(p % d for d in range(2, p)) and all((p * p + 2) % d for d in range(2, p * p + 2))])"
