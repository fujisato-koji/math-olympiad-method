      - part: わけ
        id: "5367952eed"
        text: 「素数はいくらでもある」ことを、背理法で示しましょう。素数が有限個しかないと仮定し、それらを全部かけた数に 1 をたした数を考えます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="16" y="28" font-size="14" text-anchor="start" fill="currentColor">全部の素数</text><circle cx="112" cy="24" r="13" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="112" y="29" font-size="15" text-anchor="middle" fill="currentColor">2</text><circle cx="148" cy="24" r="13" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="148" y="29" font-size="15" text-anchor="middle" fill="currentColor">3</text><circle cx="184" cy="24" r="13" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="184" y="29" font-size="15" text-anchor="middle" fill="currentColor">5</text><text x="222" y="30" font-size="16" text-anchor="middle" fill="currentColor">…</text><circle cx="258" cy="24" r="13" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="258" y="29" font-size="15" text-anchor="middle" fill="currentColor">p</text><text x="160" y="62" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">N = P + 1</text><rect x="20" y="72" width="248" height="34" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="144" y="94" font-size="14" text-anchor="middle" fill="currentColor">P（全部の素数の積）</text><rect x="268" y="72" width="32" height="34" rx="0" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="284" y="94" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="160" y="136" font-size="13" text-anchor="middle" fill="currentColor">q：N の約数で、1 より大きいいちばん小さいもの</text><text x="160" y="164" font-size="14" text-anchor="middle" fill="currentColor">q は P をわり切る？　N をわり切る？</text><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">差の N − P = 1 は？</text></svg>'
        explain: 例：「素数が有限個しかないと仮定し、それらを全部かけた数を P とする。N = P + 1 とおく。N は 2 以上の整数なので、1 より大きい約数のうち、いちばん小さいもの q がある。q は素数である（q が素数でなければ、q より小さい 1 より大きい約数をもち、それも N の約数になって、q がいちばん小さいことに反する）。素数は P にかけた数だけなので、q はそのどれかであり、q は P をわり切る。q は N もわり切るので、差の N − P = 1 もわり切る。1 より大きい q が 1 をわり切ることはないので、むじゅんする。よって、素数は有限個ではなく、いくらでもある。」と書ければよい。①「有限個しかないと仮定し、全部の積を P、N = P + 1 とする」で文字を決める、② N のいちばん小さい約数 q が素数で、P と N の両方をわり切ることを示す、③「2 つの数をわり切る数は差もわり切る」という約束した事実で、q が 1 をわり切るというむじゅんに結ぶ、の 3 点を見る。2 × 3 × 5 × 7 + 1 = 211 のような例だけで終わったら、例では「どんな有限個の組でも」を示せないことを話す。N そのものが素数だと書いていたら、30031 = 59 × 509 のように素数でない場合があり、示しているのは「組にない素数がある」ことだと話す。
        hints:
          - 示したいことの反対「素数は有限個」を仮定し、全部の積を P として、N = P + 1 を考えよう。
          - N の、1 より大きいいちばん小さい約数 q は、素数かな。
          - q は P をわり切るかな。N をわり切るなら、N − P もわり切るね。
        paths:
          - [有限個と仮定し全部の積を P、N = P + 1 とする, N のいちばん小さい約数 q は素数, q は P と N をわり切る, q は差の 1 をわり切りむじゅん, よって素数はいくらでもある]
          - [有限個と仮定し全部の積を P とする, N = P + 1 を素数の積に分けたときの素数 q を 1 つとる, q は P にかけた素数のどれかなので P をわり切る, q は N と P をわり切るので差の 1 もわり切り、むじゅん]
      - part: わけ
        id: "83f8b197f9"
        text: 「a と b がたがいに素で、a が bc をわり切るならば、a は c をわり切る」ことを示しましょう（a、b、c は整数で、a は正）。a と b がたがいに素なら、ax + by = 1 をみたす整数 x、y があることを使います。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="26" font-size="16" text-anchor="middle" fill="currentColor">ax + by = 1</text><line x1="80" y1="36" x2="80" y2="54.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="80,62 75,53 85,53" fill="currentColor"/><text x="94" y="54" font-size="13" text-anchor="start" fill="currentColor">両辺に c をかける</text><rect x="18" y="72" width="112" height="38" rx="6" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="74" y="96" font-size="15" text-anchor="middle" fill="currentColor">a × cx</text><text x="144" y="97" font-size="17" text-anchor="middle" fill="currentColor">+</text><rect x="158" y="72" width="92" height="38" rx="6" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="204" y="96" font-size="15" text-anchor="middle" fill="currentColor">bc × y</text><text x="280" y="97" font-size="17" text-anchor="middle" fill="currentColor">= c</text><text x="74" y="132" font-size="13" text-anchor="middle" fill="currentColor">a の倍数？</text><text x="204" y="132" font-size="13" text-anchor="middle" fill="currentColor">a の倍数？</text><text x="204" y="150" font-size="12" text-anchor="middle" fill="currentColor">（a は bc をわり切る）</text><text x="160" y="186" font-size="14" text-anchor="middle" fill="currentColor">示すこと：a は c をわり切る</text></svg>'
        explain: 例：「a と b はたがいに素なので、ax + by = 1 をみたす整数 x、y がある。両辺に c をかけると acx + bcy = c。a は bc をわり切るので、bc = am（m は整数）と書ける。すると c = acx + amy = a(cx + my)。cx + my は整数なので、a は c をわり切る。」と書ければよい。①「ax + by = 1 となる整数 x、y がある」「bc = am とする」で文字を決める、② 両辺に c をかけて c = a(cx + my) と変形する、③「cx + my は整数なので、a でわり切れる」と、わり切れることの意味で結ぶ、の 3 点を見る。a が素数 p で、p が b をわり切らないとき、p と b はたがいに素なので「素数 p が bc をわり切るなら、p は b か c をわり切る」（ユークリッドの補題）が出ることまで言えたら、なおよい。7 × (−2) + 5 × 3 = 1 の例だけで終わったら、例ではすべての a、b、c を示せないことを話す。
        hints:
          - ax + by = 1 の両辺に c をかけてみよう。
          - a が bc をわり切ることを、bc = a × （整数） と書こう。
          - c を a × （ ） の形にしよう。
        paths:
          - [ax + by = 1 となる整数 x、y がある, 両辺に c をかけて c = acx + bcy, bc = am とおくと c = a(cx + my), cx + my は整数なので a は c をわり切る]
          - [bc = am とおく（a は bc をわり切る）, a は ac × x もわり切る, a は和の ac × x + bc × y = c × (ax + by) もわり切る, ax + by = 1 なので、a は c をわり切る]
      - part: わけ
        id: "8f85c7d1da"
        text: a、b はたがいに素な正の整数で、x₀、y₀ は ax + by = c の整数解の 1 つとします。どの整数解 x、y も、x = x₀ + bt、y = y₀ − at（t は整数）の形に書けることを示しましょう。
        svg: '<svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="15" text-anchor="middle" fill="currentColor">ax + by = c の整数解</text><rect x="116" y="58" width="64" height="64" fill="#f3c969" fill-opacity="0.35"/><rect x="16" y="58" width="292" height="64" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="90" x2="308" y2="90" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="52" y1="58" x2="52" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="116" y1="58" x2="116" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="180" y1="58" x2="180" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="244" y1="58" x2="244" y2="122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="34.0" y="80" font-size="15" text-anchor="middle" fill="currentColor">x</text><text x="34.0" y="112" font-size="15" text-anchor="middle" fill="currentColor">y</text><text x="84.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">x₀ − b</text><text x="84.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">y₀ + a</text><text x="148.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">x₀</text><text x="148.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">y₀</text><text x="212.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">x₀ + b</text><text x="212.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">y₀ − a</text><text x="276.0" y="80" font-size="14" text-anchor="middle" fill="currentColor">x₀ + 2b</text><text x="276.0" y="112" font-size="14" text-anchor="middle" fill="currentColor">y₀ − 2a</text><path d="M94.0,55 Q115.0,36 136.0,54" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="139.8,57.3 130.8,55.5 136.7,48.6" fill="#f08080"/><text x="116.0" y="38" font-size="13" text-anchor="middle" fill="currentColor">+b</text><path d="M94.0,125 Q115.0,144 136.0,126" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="139.8,122.7 136.7,131.4 130.8,124.5" fill="#f08080"/><text x="116.0" y="156" font-size="13" text-anchor="middle" fill="currentColor">−a</text><path d="M158.0,55 Q179.0,36 200.0,54" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="203.8,57.3 194.8,55.5 200.7,48.6" fill="#f08080"/><text x="180.0" y="38" font-size="13" text-anchor="middle" fill="currentColor">+b</text><path d="M158.0,125 Q179.0,144 200.0,126" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="203.8,122.7 200.7,131.4 194.8,124.5" fill="#f08080"/><text x="180.0" y="156" font-size="13" text-anchor="middle" fill="currentColor">−a</text><path d="M222.0,55 Q243.0,36 264.0,54" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="267.8,57.3 258.8,55.5 264.7,48.6" fill="#f08080"/><text x="244.0" y="38" font-size="13" text-anchor="middle" fill="currentColor">+b</text><path d="M222.0,125 Q243.0,144 264.0,126" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round"/><polygon points="267.8,122.7 264.7,131.4 258.8,124.5" fill="#f08080"/><text x="244.0" y="156" font-size="13" text-anchor="middle" fill="currentColor">−a</text><text x="160" y="182" font-size="15" text-anchor="middle" fill="currentColor">この形の解のほかに、解はない？</text><text x="160" y="206" font-size="13" text-anchor="middle" fill="currentColor">a(x − x₀) = b(y₀ − y) から考える</text></svg>'
        explain: 例：「x、y を ax + by = c の整数解とする。ax₀ + by₀ = c なので、2 つの式をひくと a(x − x₀) + b(y − y₀) = 0、つまり a(x − x₀) = b(y₀ − y)。右辺は b の倍数なので、b は a(x − x₀) をわり切る。a と b はたがいに素なので、前の問題の補題から、b は x − x₀ をわり切る。よって x − x₀ = bt（t は整数）と書ける。これを入れると abt = b(y₀ − y) で、b は正なので両辺を b でわって at = y₀ − y、y = y₀ − at。よって、どの整数解も x = x₀ + bt、y = y₀ − at の形をしている。」と書ければよい。① 解を x、y とし、t を「x − x₀ = bt と書ける」で決める、② 2 つの式をひいて a(x − x₀) = b(y₀ − y) と変形する、③ たがいに素の補題で「b は x − x₀ をわり切る」と結ぶ、の 3 点を見る。反対に、この形の x、y がいつも解になること（a(x₀ + bt) + b(y₀ − at) = ax₀ + by₀ = c）も書けたら、なおよい。前の単元で、解をずらして見つけた解に取りこぼしがないことのしょうめいになっていることを話す。
        hints:
          - ax + by = c と ax₀ + by₀ = c をひいてみよう。
          - a(x − x₀) = b × （ ） の形にすると、b は何をわり切るかな。
          - 前の問題の補題を使って、x − x₀ を b × t と書こう。
        paths:
          - [x、y を解とする, ひいて a(x − x₀) = b(y₀ − y), 補題で b は x − x₀ をわり切り x − x₀ = bt, 入れて y = y₀ − at, どの解もこの形]
          - [x、y を解とする, ひいて a(x − x₀) = b(y₀ − y), a は b(y₀ − y) をわり切り、a と b はたがいに素なので a は y₀ − y をわり切る, y₀ − y = at とおくと a(x − x₀) = abt から x − x₀ = bt, どの解もこの形]
