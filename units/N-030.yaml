        paths:
          - [106 = 2 × 53, 53 は素数, 2 も 53 も 3、5、7 のどれでもない, 53]
        note: 仮定の組に 2 を入れなくても、全部かけて 1 をたせば、組にない素数（ここでは 2 と 53）が出てくる。
      - part: 今日
        text: 2 × 3 × 5 × 7 × 11 + 1 = 2311 は、2、3、5、7、11 のどれでわっても 1 あまります。2311 の、1 より大きい約数のうち、いちばん小さいものを p とします。p について正しいものは、どれですか。
        choices: [11 より大きい素数, 11 より小さい素数, 素数ではない]
        answer: 11 より大きい素数
        check: "(lambda p: '11 より大きい素数' if p > 11 and all(p % d for d in range(2, p)) else ('11 より小さい素数' if p < 11 else '素数ではない'))(min(d for d in range(2, 2312) if 2311 % d == 0))"
        hints:
          - いちばん小さい約数（1 をのぞく）は、いつも素数だったね。
          - p は 2、3、5、7、11 のどれかになれるかな。
          - 見本で、どうやって矛盾を出したかを思い出そう。
        paths:
          - [p は素数, 2、3、5、7、11 ではわり切れないので p はそのどれでもない, p は 11 より大きい素数]
        note: 2311 はじつは素数で、p = 2311。p がいくつかを求めなくても、正しいものが選べるところが大事。
      - part: 挑戦
        text: 2 × 3 × 4 × 5 × 6 = 720 です。722 から 726 までの 5 つの整数のうち、素数は何こありますか。
        answer: 0
        check: "sum(1 for n in range(722, 727) if all(n % d for d in range(2, n)))"
        hints:
          - 722 は 720 + 2 で、720 は 2 でわり切れるね。
          - 723 = 720 + 3 は、何でわり切れるかな。
          - 724、725、726 も同じように考えよう。
        paths:
          - [720 + k は k でわり切れる（k は 2 から 6）, 5 つともわり切れる数がある, 素数は 0 こ]
        note: 2 × 3 × … × n + 2 から + n までの n − 1 こは、どれも素数でない。だから、素数と次の素数のあいだは、いくらでも大きく空くことがある。
