  - day: 3
    items:
      - part: 見本
        text: 前の単元で、3x + 5y = 31 の《整数》解は x = 2 + 5t、y = 5 − 3t（t は整数）ですべてだ、という事実を使いました。ほかの形の解がないわけを、2 日目のきまりで確かめましょう。
        explain: x、y を 3x + 5y = 31 の整数解とします。x = 2、y = 5 も解なので 3 × 2 + 5 × 5 = 31 です。2 つの式をひくと 3(x − 2) + 5(y − 5) = 0、つまり 3(x − 2) = 5(5 − y) です。右辺は 5 の《倍数》なので、5 は 3(x − 2) をわり切ります。5 と 3 はたがいに素なので、2 日目のきまりから、5 は x − 2 をわり切ります。だから x − 2 = 5t（t は整数）と書けます。これを入れると 3 × 5t = 5(5 − y) で、両辺を 5 でわると 3t = 5 − y、y = 5 − 3t です。よって、どの整数解も x = 2 + 5t、y = 5 − 3t の形をしています。前の単元で、解をずらして見つけた解のほかに、取りこぼした解はありません。たがいに素であることが、5 が x − 2 をわり切る、のところで使われています。
      - part: 思い出す
        text: 5x + 3y = 38 の解の 1 つは x = 4、y = 6 です。x を 3 ふやした x = 7 のとき、y はいくつですか。
