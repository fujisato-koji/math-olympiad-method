      - かごには、ばらのくりと、あまったふくろが入っているよ。ふくろの中のくりの数もたそう。
    paths:
      - [50 ÷ 7 = 7 あまり 1 で、ふくろは 7 つ、ばらのくりが 1 こ, 7 ÷ 3 = 2 あまり 1 で、ふくろが 1 つあまる, あまったふくろには くりが 7 こ, 1 + 7 = 8]
      - [ふくろは 50 ÷ 7 = 7 あまり 1 で 7 ふくろ, 3 人に 2 ふくろずつ配ると 6 ふくろで、くりは 7 × 6 = 42 こ, かごのくりは 50 − 42 = 8 こ]
    note: わり算を 2 回使い、1 回目のあまり（ばらの 1 こ）をおぼえたまま 2 回目に進む。2 回目のあまりは「ふくろの数」なので、くりの数（7 こ）になおすのをわすれやすい。
  - part: 離
    id: "47e7661038"
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - N-013
    - N-022
    - N-009
    text: 0 から 59 まで、60 この目もりが円にならんだダイヤルがあり、はりははじめ 0 をさしています。1 回に、はりを「目もりの数がふえる向きに 11 目もり進める」か「へる向きに 7 目もりもどす」かのどちらかをします（59 の次は 0、0 の前は 59 です）。はりが 14 をさすようにするには、少なくとも何回いりますか。わけも書きましょう。
    answer: 10
    check: min(m for m in range(1, 13) if any((11 * k - 7 * (m - k)) % 60 == 14 for k in range(m + 1)))
    hints:
    - 少ない回数から順に、はりがどこをさせるかを調べてみよう。進める回数を 0 回、1 回、…と決めると、もどす回数も決まるよ。
    - 1 回動かすたびに、いつも同じようにかわるものはないかな。動かす前と後の数をならべて、くらべてみよう。
    - 14 をさせる回数に、きまりは見つかったかな。そのいちばん少ない回数で、本当にできるかも調べよう。
    paths:
    - - 11 進めるのは、12 進めて 1 もどすのと同じ。7 もどすのは、6 もどして 1 もどすのと同じ。12 も 6 も、6 でわり切れる。ダイヤルのひとまわりの 60 も、6 を 10 回たした数で 6 でわり切れるので、ひとまわりしても、はりの数を 6 でわったあまりはかわらない。だから、どちらの動かし方でも、6 でわったあまりが 1 へる（あまりが 0 のときは 5 になる）
      - はじめは 0 で、あまりは 0。m 回動かすと、あまりは 0 から 1 ずつ m 回へる。14 は 6 でわって 2 あまる。0 から 1 ずつへって 2 になるのは、4 回、10 回、16 回、…のときだけ（0 → 5 → 4 → 3 → 2 で 4 回、そのあと 6 回ごとにもどる）。だから 1 回〜3 回と 5 回〜9 回では、14 をさせない
      - 4 回でできるか調べる。進める回数が 0 回〜4 回のどれかで、進める回数を 1 回ふやすと、もどす回数が 1 回へるので、はりは 11 + 7 = 18 目もりずれる。進める回数が 0 回のとき、7 × 4 = 28 もどして、はりは 32。あとは 18 ずつふえて、50、68 − 60 = 8、26、44。14 はない。だから 4 回ではできない
      - 10 回でできる。進める 8 回、もどす 2 回にすると、11 × 8 = 88、7 × 2 = 14 で、88 − 14 = 74。74 − 60 = 14 だから、ひとまわりして 14 をさす。10 回は 4 回ではできないので、少なくとも 10 回
    - - 進める回数と、もどす回数を考える。進んだ目もりの合計は 11 × 進める回数、もどった目もりの合計は 7 × もどす回数。はりが 14 をさすのは、進んだ合計がもどった合計より 14 多いとき、または、ひとまわりの 60 を足した 74 多いとき、134 多いとき、…。もしくは、もどった合計のほうが 60 − 14 = 46 多いとき、106 多いとき、…
      - 9 回までなら、進んだ合計は多くても 11 × 9 = 99、もどった合計は多くても 7 × 9 = 63。進んだほうが多い場合は 99 までなので、14 多いと 74 多いの 2 つだけ（134 は 99 をこえる）。もどったほうが多い場合は 63 までなので、46 多いだけ（106 は 63 をこえる）。だから 9 回までで調べるのは、この 3 つ
      - 14 多い：11 × 進める回数 − 14 が 7 でわり切れればよい。進める回数が 2 回〜9 回のとき 8、19、30、41、52、63、74、85 で、7 でわり切れるのは 63 だけ。進める 7 回、もどす 9 回の 16 回になり、9 回まではできない。74 多い：進める回数は 7 回〜9 回で、11 × 進める回数 − 74 は 3、14、25。7 でわり切れるのは 14 で、進める 8 回、もどす 2 回の 10 回。9 回まではできない
      - 46 多い：もどった合計は 63 までなので、11 × 進める回数は 63 − 46 = 17 まで、進める回数は 0 回か 1 回。そのとき 11 × 進める回数 + 46 は 46、57 で、7 のだん（7、14、…、63）にない。9 回まではできない
      - 9 回までは、3 つともできない。10 回なら、74 多いの進める 8 回、もどす 2 回で、88 − 14 = 74、74 − 60 = 14 をさす。だから少なくとも 10 回
    note: 考えどころは 3 つ：①11 も 7 も 6 でわったあまりで見ると、どちらも 1 へる動かし方になる（11 = 12 − 1、7 = 6 + 1 で、60 が 6 の倍数だからひとまわりしてもあまりがかわらない）、②14 は 6 でわって 2 あまるので、回数は 6 でわって 4 あまる数（4、10、16、…）に限られる、③4 回は進める回数を 0 回〜4 回と全部調べて 14 が出ないことをしめし（32、50、8、26、44）、10 回（進める 8 回、もどす 2 回で 88 − 14 = 74、74 − 60 = 14）を作る。2 本目は 1 本目とちがい、6 でわったあまりを使わず、進んだ目もりともどった目もりの合計で、はりが 14 をさす場合を 14 多い、74 多い、もどったほうが 46 多い、に分け、9 回までなら起きる場合はこの 3 つだけだと数の大きさでかぎり、1 つずつ 7 のだんにあるかを調べる考え方。check は、m を 1 から 12 まで、進める回数 k を 0 から m まで全部ためし、（11 × k − 7 × (m − k)）を 60 でわったあまりが 14 になるいちばん小さい m を出す式。既出：にた形のダイヤルのパズルはあるが、同じ問いはない。N-028 の「10 まいを 7 まいずつ返す」と、かわらないあまりで回数を下からおさえ、作り方でとどかせる組み立ては近いが、話の中身とあまりの見方（6 でわったあまりが毎回 1 へる）がちがう。わな：4 回でとどきそうに見えて 4 回と答える、回数が 4 回、10 回、16 回、…というきまりだけで 4 回に止まって、本当に 4 回でできるか調べない。
