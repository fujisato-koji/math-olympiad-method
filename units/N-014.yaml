        explain: 1 人に 1 こずつじゅんに配っていくと、1 人 4 こずつになります。この計算を「12 ÷ 3」と書いて「12 わる 3」と読み、12 ÷ 3 = 4 です。このような計算をわり算といいます。1 回に 3 人へ 1 こずつ配ると、1 回で 3 こへります。3 × 4 = 12 なので、4 回配れて、1 人 4 こになります。答えは 3 のだんの九九でさがせます。12 こを 1 人に 3 こずつ分けると何人に分けられるか、というときも、同じ 12 ÷ 3 で 4 人です。
