        explain: れい：「あまりの 6 こから、もう 1 人に 4 こ配れる。だから 4 人ではなく 5 人に配れて、あまりは 2 こになる。あまりは、わる数の 4 より小さくなければならない。」と書ければよい。正しい答え 22 ÷ 4 = 5 あまり 2 まで書ければなおよい。このれいだけでなく、どのわり算でも、あまりがわる数より小さくないときは、まだ配れることにふれる。
