        explain: れい：「44 こを 6 こずつ 7 人に分けると、分けたのは 6 × 7 = 42 こ。あまりの 2 こと合わせると、はじめの 44 こにもどる。だから 6 × 7 の答えに 2 をたして 44 になれば正しい。」と書ければよい。42 + 2 = 44 をじっさいに計算させるとよい。どのわり算でも「わる数 × 答え + あまり = わられる数」でたしかめられることにふれる。
