# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [N-059]
    text: 駅から、バスが 6 分ごとに出ます。朝の 1 本目は 8 時ちょうどに出ました。8 時 50 分までに出るバスは、1 本目も入れて何本ですか。
    answer: 9
    check: "sum(1 for t in range(0, 51) if t % 6 == 0)"
    hints:
      - 1 本目は 8 時 0 分。2 本目、3 本目は 8 時何分に出るかな。
      - 8 時 50 分は、8 時から 50 分たったとき。50 分の間に 6 分が何回入るかな。
      - わり算の答えは「1 本目のあと何本出たか」だよ。1 本目のバスをわすれずに入れよう。
    paths:
      - [8 時 0 分から 6 分ずつ, 50 ÷ 6 = 8 あまり 2 で 6 分が 8 回入る, 1 本目のあとに 8 本出る, 1 本目を入れて 8 + 1 = 9 本]
      - [バスが出るのは 8 時何分かをならべる, 0、6、12、18、24、30、36、42、48 分, 9 本]
    note: 時刻（N-059）を「8 時から何分たったか」に言いかえ、わり算の商に 1 本目の 1 をたす（植木算の考え）。商の 8 をそのまま答えやすい。
  - part: 離
    kinds: [道筋]
    text: ある数を 8 でわると、あまりは 5 でした。この数を 4 でわると、あまりはいくつですか。
    answer: 1
    check: "sum({n % 4 for n in range(5, 78, 8)})"
    hints:
      - 8 でわると 5 あまる数を、小さいほうから 2 つか 3 つ書き出してみよう。
      - 書き出した数を、それぞれ 4 でわってみよう。
      - 8 このまとまりは、4 このまとまりいくつ分かな。のこりの 5 こを 4 でわるとどうなるかな。
    paths:
      - [8 でわると 5 あまる数は 5、13、21、29、…, 5 ÷ 4、13 ÷ 4、21 ÷ 4 のあまりはどれも 1, 1]
      - [8 このまとまりは 4 こずつ 2 つに分けられる, のこりの 5 こを 4 こずつ分けると 1 こあまる, 1]
    note: ある数が 1 つに決まらなくても、あまりは 1 つに決まる（変わらないものに目を付ける）。2 本目の「8 のまとまりは 4 でわり切れる」に気づけると、どの数でも同じになるわけが言える。あまりの性質（N-022）の入口。
  - part: 離
    kinds: [手数]
    text: くりが 50 こあります。7 こずつふくろに入れ、ふくろに入らなかったくりは、かごに入れました。次に、できたふくろを 3 人で同じ数ずつ分け、分けられなかったふくろは、ふくろのまま かごに入れました。かごの中のくりは、全部で何こですか。
    answer: 8
    check: "(lambda b, r: r + b % 3 * 7)(*divmod(50, 7))"
    hints:
      - はじめに、50 こを 7 こずつふくろに入れると、ふくろはいくつできて、くりは何こあまるかな。
      - 次に、できたふくろを 3 人で分けると、1 人何ふくろで、何ふくろあまるかな。
      - かごには、ばらのくりと、あまったふくろが入っているよ。ふくろの中のくりの数もたそう。
    paths:
      - [50 ÷ 7 = 7 あまり 1 で、ふくろは 7 つ、ばらのくりが 1 こ, 7 ÷ 3 = 2 あまり 1 で、ふくろが 1 つあまる, あまったふくろには くりが 7 こ, 1 + 7 = 8]
    note: わり算を 2 回使い、1 回目のあまり（ばらの 1 こ）をおぼえたまま 2 回目に進む。2 回目のあまりは「ふくろの数」なので、くりの数（7 こ）になおすのを忘れやすい。
