      - part: 見本
        id: f966808991
        text: クッキー 12 こを、3 人で同じ数ずつ分けます。1 人に 1 こずつじゅんに配ると、4 回で配り終わって、1 人 4 こになります。この計算を「12 ÷ 3 = 4」と書いて、わり算といいます。
