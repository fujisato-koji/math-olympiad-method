# N-014 わり算とあまり
#
# 書き方は N-001 の頭の注、文の漢字は N-013 の頭の注のとおり（小 3 までの漢字。順・求・位・残・確・選 などはかなで書く）。
# 「÷」は U+00F7。check は「//」「%」と divmod で書く。
# わり算は 2 つの場面で使う：同じ数ずつ分けると 1 つ分はいくつか（3 人で分けると 1 人何こ）と、1 つ分ずつ分けるといくつ分か
#   （3 こずつ分けると何人に分けられるか）。どちらも九九で答えをさがす。
#   「3 人で分ける」ときに 3 のだんを使うわけは、「1 回に 3 人へ 1 こずつ配ると 1 回で 3 こへる。何回配れるか」で言う。
#   入れかえのきまり（4 × 3 = 3 × 4）は N-015 で、この単元の前提にないので使わない。
# あまりのあるわり算の答えは「3 あまり 2」と書く。鍵盤では打てないので choices にする。
#   答え（いくつずつ、いくつ分）だけ、あまりだけをたずねるときは数を打つ。check は (lambda q, r: f'{q} あまり {r}')(*divmod(わられる数, わる数))。
# わる数は 1〜9、答えは 9 まで（九九の範囲）。0 でわること、答えが 2 けたになるわり算（84 ÷ 4 など）は扱わない。
# 分数（N-016）と小数（N-020）は使わない。お金（N-060）と長さの単位（G-046）は前提にないので場面に使わない。
# 図の 🍪 などは、1 行の数がわる数とも答えとも同じにならないように並べる（行の数で答えが見えないように）。
# 地図の日の並びは既定（導入・練習 2 日・わけ・混ぜる・確認）。3 日目はあまりという新しいことが出るので、その日の頭に見本を置く。

