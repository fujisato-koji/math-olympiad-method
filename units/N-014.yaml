        explain: 5 こずつまとめると、3 人に分けられて 2 こあまります。これを「17 ÷ 5 = 3 あまり 2」と書きます。5 のだんで 17 をこえない一番大きい答えをさがすと 5 × 3 = 15。17 − 15 = 2 があまりです。あまりは、わる数の 5 より小さくなります。
