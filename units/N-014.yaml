          - 分けた数とあまりを合わせると、何こになるかな。
          - 「分けたのは〜で、あまりと合わせると〜だから」と書こう。
        paths:
          - [分けたのは 6 × 7 = 42 こ, あまりの 2 こと合わせて 44 こ, はじめの数にもどる, だからたしかめられる]
          - [44 ÷ 6 = 7 あまり 2 は、44 こが 6 こずつの 7 人分と 2 こに分かれたということ, 6 こずつの 7 人分は 6 × 7 こ, それに 2 こをたすと、もとの 44 こになる]
