eight="bold">+</text><line x1="235" y1="90" x2="235" y2="127.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="235,135 230,126 240,126" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><circle cx="262" cy="76" r="10" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="262" y="80.7" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="262" y1="90" x2="262" y2="127.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="262,135 257,126 267,126" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><circle cx="289" cy="76" r="10" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="289" y="80.7" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="289" y1="90" x2="289" y2="127.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="289,135 284,126 294,126" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="262" y="42" font-size="13" text-anchor="middle" fill="currentColor">+1 C が 3 つ</text><text x="262" y="176" font-size="13" text-anchor="middle" fill="currentColor">q = 3 C</text></svg>'
