        text: コンデンサーの電荷が Q = CV になるわけを説明しましょう。
        explain: 「電気容量 C は、1 V あたりどれだけ電荷がたまるかを表す。電圧を 2 倍、3 倍にすると、たまる電荷も 2 倍、3 倍になる。だから Q = CV。」と書ければよい。① C は 1 V あたりの電荷、② 電圧に比例、③ Q = CV。子どもには、具体的な数で確かめさせます。
        hints:
          - 電気容量は、1 V あたりにたまる電荷です。
          - 電圧を 2 倍にすると、電荷も 2 倍になります。
