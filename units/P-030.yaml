      - part: 見本
        id: "2fbd9bf827"
        text: |-
          静電エネルギー：電荷 q を電位 V の点に置くと、U = qV のエネルギーをもちます。
          等電位面は、電位が同じ点を結んだ面です。等電位面にそって電荷を動かしても、電場がする仕事は 0。
          等電位面は、電気力線と直角に交わります（図の左）。
          コンデンサーにためたエネルギーは U = 1/2 QV = 1/2 CV² = Q²/(2C)。Q–V のグラフの三角形の面積です（図の右）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="95" y1="98" x2="155" y2="98" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="130,98 122,102.4 122,93.6" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="90.6" y1="108.6" x2="133" y2="151" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="115.4,133.4 106.6,130.8 112.8,124.6" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="80" y1="113" x2="80" y2="173" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="80,148 75.6,140 84.4,140" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="69.4" y1="108.6" x2="27" y2="151" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="44.6,133.4 47.2,124.6 53.4,130.8" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="65" y1="98" x2="5" y2="98" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="30,98 38,93.6 38,102.4" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="69.4" y1="87.4" x2="27" y2="45" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="44.6,62.6 53.4,65.2 47.2,71.4" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="80" y1="83" x2="80" y2="23" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="80,48 84.4,56 75.6,56" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="90.6" y1="87.4" x2="133" y2="45" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="115.4,62.6 112.8,71.4 106.6,65.2" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><circle cx="80" cy="98" r="30" stroke="#b39ddb" stroke-width="2" fill="none" stroke-dasharray="5 4"/><circle cx="80" cy="98" r="60" stroke="#b39ddb" stroke-width="2" fill="none" stroke-dasharray="5 4"/><circle cx="80" cy="98" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="80" y="103.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><path d="M 128 98 L 128 88 L 138 88" stroke="#f08080" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="180" font-size="13" text-anchor="middle" fill="currentColor">点線：等電位面</text><text x="80" y="196" font-size="13" text-anchor="middle" fill="currentColor">直角に交わる</text><line x1="172" y1="15" x2="172" y2="190" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="195" y1="165" x2="305.6" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="312,165 304,169 304,161" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="195" y1="165" x2="195" y2="28.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="195,22 199,30 191,30" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><polygon points="195,165 295,65 295,165" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="312" y="186" font-size="13" text-anchor="end" fill="currentColor">Q</text><text x="202" y="28" font-size="13" text-anchor="start" fill="currentColor">V</text><text x="265" y="152" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">U</text><text x="240" y="44" font-size="13" text-anchor="middle" fill="currentColor">U = 1/2 QV</text><text x="250" y="196" font-size="12" text-anchor="middle" fill="currentColor">三角形の面積</text></svg>'
        explain: |-
          U = qV は、電位 V の点にある電荷のエネルギー。
          コンデンサーは、電圧をかけると電荷がたまり、エネルギーがたまります。電荷をためる間、電圧は 0 から V まで上がるので、仕事は三角形の面積 1/2 QV。Q = CV を入れると U = 1/2 CV²。
          等電位面にそって動かすと、電位差が 0 なので W = qΔV = 0。
        note: U = qV。コンデンサーは U = 1/2 CV² = Q²/(2C)。等電位面は力線と直角。
