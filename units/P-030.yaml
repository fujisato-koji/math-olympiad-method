# P-030 電荷と電場・電位
#
# 段 5・水準 3・8 日。前提は P-029（電流と回路）と D-006（微分係数と導関数）。
# クーロンの法則、電場、電位、静電エネルギー、コンデンサーと誘電体を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-030
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          電荷 Q は、電気の量（C）。同種の電荷は反発し、異種の電荷は引き合います。
          クーロンの法則：2 つの点電荷 Q₁、Q₂ の間にはたらく力の大きさは
          F = k Q₁ Q₂ / r²。r は電荷の間の距離、k = 9 × 10⁹ N·m²/C² です。
          距離が 2 倍になると、力は 1/4 になります。
        explain: |-
          クーロン力は、電荷の積に比例し、距離の 2 乗に反比例します。
          例：Q₁ = 2 × 10⁻⁶ C、Q₂ = 3 × 10⁻⁶ C、r = 0.1 m のとき、
          F = 9 × 10⁹ × 2 × 10⁻⁶ × 3 × 10⁻⁶ / 0.1² = 5.4 N。
          距離を 2 倍にすると、分母が 4 倍になるので、力は 1/4。
        note: F = kQ₁Q₂/r²。距離の 2 乗に反比例。k = 9 × 10⁹。
      - part: 思い出す
        text: 距離を 2 倍にすると、逆 2 乗の関係にある量は何倍になりますか。
        choices: ["1/2 倍", "1/4 倍", "2 倍", "4 倍"]
        answer: "1/4 倍"
        check: "'1/4 倍'"
        hints:
          - 逆 2 乗は、距離の 2 乗に反比例することです。
          - 距離が 2 倍なら、2² = 4 です。
          - 1/4 倍になります。
        paths:
          - [逆 2 乗, 距離 2 倍, 2² = 4, 1/4 倍]
      - part: 今日
        text: Q₁ = 2 × 10⁻⁶ C、Q₂ = 3 × 10⁻⁶ C、r = 0.1 m のとき、クーロン力はいくつですか。
        choices: [0.54, 5.4, 54, 540]
        answer: 5.4
        check: "f'{9e9 * 2e-6 * 3e-6 / 0.1 ** 2:.1f}'"
        hints:
          - F = kQ₁Q₂/r² です。
          - 9 × 10⁹ × 2 × 10⁻⁶ × 3 × 10⁻⁶ = 0.054 です。
          - 0.054 ÷ 0.01 = 5.4 N です。
        paths:
          - [F = kQ₁Q₂/r², 0.054/0.01 = 5.4 N]
      - part: 今日
        text: 2 つの電荷の距離を 2 倍にすると、クーロン力は何倍になりますか。
        choices: ["1/2 倍", "1/4 倍", "2 倍", "4 倍"]
        answer: "1/4 倍"
        check: "'1/4 倍'"
        hints:
          - クーロン力は r² に反比例します。
          - 距離が 2 倍なら、r² は 4 倍です。
          - 力は 1/4 倍です。
        paths:
          - [F ∝ 1/r², r が 2 倍, r² は 4 倍, 1/4 倍]
      - part: 今日
        text: 2 つの電荷のうち、一方の電荷を 2 倍にすると、クーロン力は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - クーロン力は Q₁Q₂ に比例します。
          - 一方を 2 倍にすると、積が 2 倍になります。
          - 力も 2 倍です。
        paths:
          - [F ∝ Q₁Q₂, 一方を 2 倍, 積が 2 倍, 力 2 倍]
      - part: 挑戦
        text: 同種の電荷どうしにはたらく力は、引力ですか、反発力ですか。
        choices: ["引力", "反発力", "はたらかない", "場合による"]
        answer: "反発力"
        check: "'反発力'"
        hints:
          - 同種の電荷は、同じ種類（+ と +、− と −）です。
          - 同じ種類どうしは退け合います。
          - 反発力です。
        paths:
          - [同種の電荷, 退け合う, 反発力]
    extra:
      - part: 今日
        text: 異種の電荷どうしにはたらく力は、引力ですか、反発力ですか。
        choices: ["引力", "反発力", "はたらかない", "場合による"]
        answer: "引力"
        check: "'引力'"
        hints:
          - 異種の電荷は、+ と − です。
          - ちがう種類どうしは引き合います。
          - 引力です。
        paths:
          - [異種の電荷, 引き合う, 引力]
      - part: 今日
        text: 電荷の単位はどれですか。
        choices: ["A", "V", "C", "Ω"]
        answer: "C"
        check: "'C'"
        hints:
          - 電荷は電気の量です。
          - 電流 A は 1 秒に流れる電荷の量です。
          - 電荷の単位は C（クーロン）です。
        paths:
          - [電荷は電気の量, 単位 C]
      - part: わけ
        text: クーロン力が距離の 2 乗に反比例するわけを、電気力線の広がりで説明しましょう。
        explain: 「点電荷から出る電気力線は、球面全体に広がる。半径 r の球の表面積は 4πr² なので、同じ本数の力線が r² に反比例して薄くなる。力の大きさも、力線の密度に比例するので、1/r² になる。」と書ければよい。① 力線は球面に広がる、② 面積は 4πr²、③ 密度は 1/r²。子どもには、風船の表面を想像させます。
        hints:
          - 点電荷から出る力線は、球面全体に広がります。
          - 球の表面積は 4πr² です。
          - 力線の密度は、r² に反比例します。
        paths:
          - [力線は球面に広がる, 面積 4πr², 密度 1/r², 力も 1/r²]

  - day: 2
    items:
      - part: 見本
        text: |-
          電場 E は、その点に置いた +1 C の電荷が受ける力です。E = F/q。
          点電荷 Q から距離 r の点の電場の大きさは E = kQ/r²。
          電気力線は、+ から出て − に入る。線が密なほど電場が強い。
          電場の向きは、+ の電荷が受ける力の向きです。
        explain: |-
          E = F/q は、単位電荷あたりの力。q が 2 倍なら力も 2 倍なので、E は電荷によらない。
          E = kQ/r² は、Q のつくる電場。Q が 2 倍なら E も 2 倍、r が 2 倍なら E は 1/4。
          電気力線は + から出て − へ。交わることはない。
        note: E = F/q = kQ/r²。電気力線は + から − へ。密なほど強い。
      - part: 思い出す
        text: 電場 E の中に電荷 q を置くと、受ける力 F はどれですか。
        choices: ["F = q/E", "F = qE", "F = E/q", "F = q + E"]
        answer: "F = qE"
        check: "'F = qE'"
        hints:
          - 電場は、+1 C が受ける力です。
          - q C なら、力は q 倍になります。
          - F = qE です。
        paths:
          - [電場は単位電荷あたりの力, q 倍, F = qE]
      - part: 今日
        text: 電荷 2 × 10⁻⁶ C が電場から 0.4 N の力を受けるとき、電場の強さはいくつですか。
        choices: [0.0000002, 200000, 0.0000008, 500000]
        answer: 200000
        check: "f'{0.4 / 2e-6:.0f}'"
        hints:
          - E = F/q です。
          - 0.4 ÷ (2 × 10⁻⁶) を計算します。
          - 2 × 10⁵ N/C です。
        paths:
          - [E = F/q, 0.4/2e-6 = 2 × 10⁵ N/C]
      - part: 今日
        text: 電荷 1 × 10⁻⁶ C から 0.1 m の点の電場の強さはいくつですか。
        choices: [90000, 900000, 9000000, 90000000]
        answer: 900000
        check: "f'{9e9 * 1e-6 / 0.1 ** 2:.0f}'"
        hints:
          - E = kQ/r² です。
          - 9 × 10⁹ × 1 × 10⁻⁶ ÷ 0.01 を計算します。
          - 9 × 10⁵ N/C です。
        paths:
          - [E = kQ/r², 9e9 × 1e-6 / 0.01 = 9 × 10⁵]
      - part: 挑戦
        text: 電荷 4 × 10⁻⁶ C から 0.2 m の点の電場の強さはいくつですか。
        choices: [90000, 900000, 1800000, 3600000]
        answer: 900000
        check: "f'{9e9 * 4e-6 / 0.2 ** 2:.0f}'"
        hints:
          - E = kQ/r² です。
          - 9 × 10⁹ × 4 × 10⁻⁶ = 3.6 × 10⁴ です。
          - 0.2² = 0.04 でわると、9 × 10⁵ N/C です。
        paths:
          - [E = kQ/r², 3.6e4/0.04 = 9 × 10⁵]
    extra:
      - part: 今日
        text: 電気力線は、+ の電荷から出て、どちらへ向かいますか。
        choices: ["+ へ入る", "− へ入る", "回り続ける", "消える"]
        answer: "− へ入る"
        check: "'− へ入る'"
        hints:
          - 電気力線は、正の電荷から出ます。
          - 行き先は負の電荷です。
          - − へ入ります。
        paths:
          - [+ から出る, − へ入る]
      - part: 今日
        text: 電荷を 2 倍にすると、そのまわりの電場の強さは何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - E = kQ/r² です。
          - Q が 2 倍になると、E はどうなりますか。
          - 2 倍になります。
        paths:
          - [E ∝ Q, Q が 2 倍, E も 2 倍]
      - part: わけ
        text: 電場の強さが E = F/q で、電荷 q によらないわけを説明しましょう。
        explain: 「電場は、その点に +1 C を置いたときに受ける力と決める。q C を置くと、受ける力は q 倍になる。F も q 倍になるので、F/q は q によらず、その点の電場だけが残る。」と書ければよい。① 電場は単位電荷あたりの力、② q 倍なら力も q 倍、③ F/q は q によらない。子どもには、q を 2 倍、3 倍にして確かめさせます。
        hints:
          - 電場は、+1 C が受ける力と決めます。
          - q C なら、力は q 倍です。
          - F/q を計算すると、q が消えます。
        paths:
          - [電場は単位電荷あたりの力, 力も q 倍, F/q は q によらない]

  - day: 3
    items:
      - part: 見本
        text: |-
          電位 V は、+1 C の電荷をその点まで運ぶのに必要な仕事です。
          点電荷 Q から距離 r の点の電位は V = kQ/r。
          電位差 ΔV を電荷 q が動くとき、電場がする仕事は W = qΔV。
          + の電荷は電位の高い所から低い所へ動くと、仕事を取り出せます。
        explain: |-
          V = kQ/r は、Q のまわりの電位。r が大きいほど 0 に近づきます。
          電位差 100 V を 2 × 10⁻⁶ C が動くと、W = 2 × 10⁻⁶ × 100 = 2 × 10⁻⁴ J。
          電位はスカラーで、向きがありません。電場は向きをもつベクトルです。
        note: V = kQ/r、W = qΔV。電位はスカラー、電場はベクトル。
      - part: 思い出す
        text: 力 F で距離 d 動かすとき、仕事 W はどれですか。
        choices: ["W = F/d", "W = Fd", "W = d/F", "W = F + d"]
        answer: "W = Fd"
        check: "'W = Fd'"
        hints:
          - 仕事は、力 × 力の向きに動いた距離です。
          - F と d をかけます。
          - W = Fd です。
        paths:
          - [仕事 = 力 × 距離, W = Fd]
      - part: 今日
        text: 電荷 1 × 10⁻⁶ C から 0.1 m の点の電位はいくつですか。
        choices: [9000, 90000, 900000, 9000000]
        answer: 90000
        check: "f'{9e9 * 1e-6 / 0.1:.0f}'"
        hints:
          - V = kQ/r です。
          - 9 × 10⁹ × 1 × 10⁻⁶ ÷ 0.1 を計算します。
          - 9 × 10⁴ V です。
        paths:
          - [V = kQ/r, 9e3/0.1 = 9 × 10⁴ V]
      - part: 今日
        text: 電位差 100 V の間を、電荷 2 × 10⁻⁶ C が動くとき、電場がする仕事はいくつですか。
        choices: [0.00000002, 0.0002, 0.02, 200]
        answer: 0.0002
        check: "f'{2e-6 * 100:.4f}'"
        hints:
          - W = qΔV です。
          - 2 × 10⁻⁶ × 100 を計算します。
          - 2 × 10⁻⁴ J です。
        paths:
          - [W = qΔV, 2e-6 × 100 = 2 × 10⁻⁴ J]
      - part: 挑戦
        text: 電荷 1 × 10⁻⁶ C から 0.1 m の点と 0.2 m の点の電位差はいくつですか。
        choices: [4500, 45000, 90000, 900000]
        answer: 45000
        check: "f'{9e9 * 1e-6 / 0.1 - 9e9 * 1e-6 / 0.2:.0f}'"
        hints:
          - 0.1 m の電位は 9 × 10⁴ V、0.2 m は 4.5 × 10⁴ V です。
          - 差をとります。
          - 4.5 × 10⁴ V です。
        paths:
          - [V₁ = 9 × 10⁴、V₂ = 4.5 × 10⁴, 差は 4.5 × 10⁴ V]
    extra:
      - part: 今日
        text: 電位は、向きをもつベクトルですか、向きをもたないスカラーですか。
        choices: ["ベクトル", "スカラー", "どちらでもない", "場合による"]
        answer: "スカラー"
        check: "'スカラー'"
        hints:
          - 電位は、+1 C を運ぶ仕事です。
          - 仕事は向きをもちません。
          - スカラーです。
        paths:
          - [電位は仕事, 仕事は向きをもたない, スカラー]
      - part: 今日
        text: 電荷 2 × 10⁻⁶ C から 0.2 m の点の電位はいくつですか。
        choices: [4500, 45000, 90000, 900000]
        answer: 90000
        check: "f'{9e9 * 2e-6 / 0.2:.0f}'"
        hints:
          - V = kQ/r です。
          - 9 × 10⁹ × 2 × 10⁻⁶ = 1.8 × 10⁴ です。
          - 0.2 でわると 9 × 10⁴ V です。
        paths:
          - [V = kQ/r, 1.8e4/0.2 = 9 × 10⁴ V]
      - part: わけ
        text: 電位差 ΔV を電荷 q が動くとき、仕事が W = qΔV になるわけを説明しましょう。
        explain: 「電位差 ΔV は、+1 C を運ぶのに必要な仕事。q C なら、必要な仕事は q 倍になる。だから W = qΔV。」と書ければよい。① 電位差は単位電荷あたりの仕事、② q 倍、③ W = qΔV。子どもには、具体的な数で確かめさせます。
        hints:
          - 電位差は、+1 C を運ぶ仕事です。
          - q C なら、仕事は q 倍です。
          - W = qΔV です。
        paths:
          - [電位差は単位電荷あたり, q 倍, W = qΔV]

  - day: 4
    items:
      - part: 見本
        text: |-
          静電エネルギー：電荷 q を電位 V の点に置くと、U = qV のエネルギーをもちます。
          コンデンサーに蓄えられるエネルギーは U = 1/2 C V² = Q²/(2C) です。
          等電位面は、電位が同じ点を結んだ面です。等電位面に沿って電荷を動かしても、仕事は 0。
          等電位面は、電気力線と垂直に交わります。
        explain: |-
          U = qV は、電位 V の点にある電荷のエネルギー。
          コンデンサーは、電圧をかけると電荷がたまり、エネルギーが蓄えられます。U = 1/2 CV²。
          等電位面に沿って動かすと、電位差が 0 なので W = qΔV = 0。
        note: U = qV。コンデンサーは U = 1/2 CV² = Q²/(2C)。等電位面は力線と垂直。
      - part: 思い出す
        text: 電荷 q を電位 V の点に置いたときのエネルギーはどれですか。
        choices: ["U = q/V", "U = qV", "U = V/q", "U = q + V"]
        answer: "U = qV"
        check: "'U = qV'"
        hints:
          - 電位は、+1 C あたりのエネルギーです。
          - q C なら、q 倍です。
          - U = qV です。
        paths:
          - [電位は単位電荷あたり, q 倍, U = qV]
      - part: 今日
        text: 電気容量 2 × 10⁻⁶ F のコンデンサーに 100 V をかけると、蓄えられるエネルギーはいくつですか。
        choices: [0.0001, 0.01, 0.02, 1]
        answer: 0.01
        check: "0.5 * 2e-6 * 100 ** 2"
        hints:
          - U = 1/2 C V² です。
          - 1/2 × 2 × 10⁻⁶ × 100² を計算します。
          - 0.01 J です。
        paths:
          - [U = 1/2 CV², 0.5 × 2e-6 × 1e4 = 0.01 J]
      - part: 今日
        text: 電荷 2 × 10⁻⁴ C、電気容量 1 × 10⁻⁵ F のコンデンサーのエネルギーはいくつですか。
        choices: [0.002, 0.02, 0.004, 0.04]
        answer: 0.002
        check: "(2e-4) ** 2 / (2 * 1e-5)"
        hints:
          - U = Q²/(2C) です。
          - (2 × 10⁻⁴)² = 4 × 10⁻⁸ です。
          - 4 × 10⁻⁸ ÷ (2 × 10⁻⁵) = 2 × 10⁻³ J です。
        paths:
          - [U = Q²/(2C), 4e-8/2e-5 = 2 × 10⁻³ J]
      - part: 今日
        text: 等電位面に沿って電荷を動かすとき、電場がする仕事はいくつですか。
        choices: [0, "qV", "qV/2", "2qV"]
        answer: 0
        check: "0"
        hints:
          - 等電位面では、電位が同じです。
          - 電位差 ΔV = 0 です。
          - W = qΔV = 0 です。
        paths:
          - [等電位面は ΔV=0, W = qΔV = 0]
      - part: 挑戦
        text: 電気容量 4 × 10⁻⁶ F のコンデンサーに 50 V をかけると、エネルギーはいくつですか。
        choices: [0.001, 0.005, 0.01, 0.05]
        answer: 0.005
        check: "0.5 * 4e-6 * 50 ** 2"
        hints:
          - U = 1/2 CV² です。
          - 1/2 × 4 × 10⁻⁶ × 2500 を計算します。
          - 5 × 10⁻³ J です。
        paths:
          - [U = 1/2 CV², 0.5 × 4e-6 × 2500 = 5 × 10⁻³ J]
    extra:
      - part: 今日
        text: 電圧を 2 倍にすると、コンデンサーのエネルギーは何倍になりますか。
        choices: ["2 倍", "4 倍", "1/2 倍", "変わらない"]
        answer: "4 倍"
        check: "'4 倍'"
        hints:
          - U = 1/2 CV² です。
          - V が 2 倍になると、V² は 4 倍です。
          - 4 倍になります。
        paths:
          - [U ∝ V², V が 2 倍, U は 4 倍]
      - part: 今日
        text: 等電位面は、電気力線とどんな角度で交わりますか。
        choices: ["0°", "45°", "90°", "180°"]
        answer: "90°"
        check: "'90°'"
        hints:
          - 等電位面に沿って動かすと、仕事は 0 です。
          - 仕事が 0 なら、力は動く向きに垂直です。
          - 電気力線と 90° で交わります。
        paths:
          - [等電位面は仕事 0, 力は垂直, 90°]
      - part: わけ
        text: コンデンサーのエネルギーが U = 1/2 C V² になるわけを説明しましょう。
        explain: 「コンデンサーに電荷をためるとき、電圧は 0 から V まで比例して上がる。最初は 0 V、最後は V なので、平均の電圧は V/2。運んだ電荷は Q = CV なので、仕事は Q × (V/2) = 1/2 CV²。」と書ければよい。① 電圧が比例して上がる、② 平均 V/2、③ Q = CV。子どもには、グラフの面積で確かめさせます。
        hints:
          - 電荷をためるとき、電圧は 0 から V まで上がります。
          - 平均の電圧は V/2 です。
          - 仕事は Q × V/2、Q = CV です。
        paths:
          - [電圧は 0 から V, 平均 V/2, Q = CV, U = 1/2 CV²]

  - day: 5
    items:
      - part: 見本
        text: |-
          コンデンサーは、電荷をためる部品です。電気容量 C（F）とすると、Q = C V。
          平行板コンデンサーの電気容量は C = ε S / d。S は板の面積、d は板の間隔、ε は誘電率です。
          誘電体（絶縁体）を間に入れると、比誘電率 ε_r の分だけ C が大きくなります。
          コンデンサーの並列は C = C₁ + C₂、直列は 1/C = 1/C₁ + 1/C₂ です。
        explain: |-
          Q = CV：電気容量が大きいほど、同じ電圧でたくさん電荷がたまります。
          C = εS/d：板が広いほど C が大きく、間隔が広いほど C が小さい。
          誘電体を入れると C は ε_r 倍。並列は足し算、直列は逆数の足し算。
        note: Q = CV。C = εS/d。並列は足す、直列は逆数の足し算。
      - part: 思い出す
        text: 電気容量 C、電圧 V のとき、たまる電荷 Q はどれですか。
        choices: ["Q = C/V", "Q = CV", "Q = V/C", "Q = C + V"]
        answer: "Q = CV"
        check: "'Q = CV'"
        hints:
          - 電気容量は、1 V でどれだけたまるかです。
          - V 倍の電荷がたまります。
          - Q = CV です。
        paths:
          - [C は 1 V あたりの電荷, V 倍, Q = CV]
      - part: 今日
        text: 電気容量 2 μF のコンデンサーに 100 V をかけると、たまる電荷は何 μC ですか。
        choices: [50, 100, 200, 400]
        answer: 200
        check: "2 * 100"
        hints:
          - Q = CV です。
          - 2 μF × 100 V を計算します。
          - 200 μC です。
        paths:
          - [Q = CV, 2 × 100 = 200 μC]
      - part: 今日
        text: 電気容量 1 μF のコンデンサーに 200 V をかけると、たまる電荷は何 μC ですか。
        choices: [100, 200, 400, 2000]
        answer: 200
        check: "1 * 200"
        hints:
          - Q = CV です。
          - 1 μF × 200 V を計算します。
          - 200 μC です。
        paths:
          - [Q = CV, 1 × 200 = 200 μC]
      - part: 今日
        text: 2 μF と 3 μF のコンデンサーを並列につなぐと、合成容量は何 μF ですか。
        choices: [1.2, 5, 6, 2.5]
        answer: 5
        check: "2 + 3"
        hints:
          - コンデンサーの並列は、足し算です。
          - 2 + 3 を計算します。
          - 5 μF です。
        paths:
          - [並列は足す, 2 + 3 = 5 μF]
      - part: 挑戦
        text: 2 μF と 2 μF のコンデンサーを直列につなぐと、合成容量は何 μF ですか。
        choices: [0.5, 1, 2, 4]
        answer: 1
        check: "f'{1 / (1 / 2 + 1 / 2):.0f}'"
        hints:
          - 直列は 1/C = 1/C₁ + 1/C₂ です。
          - 1/2 + 1/2 = 1 です。
          - C = 1 μF です。
        paths:
          - [1/C = 1/2 + 1/2 = 1, C = 1 μF]
    extra:
      - part: 今日
        text: コンデンサーに比誘電率 2 の誘電体を入れると、電気容量は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - 誘電体を入れると、C は比誘電率の分だけ大きくなります。
          - 比誘電率は 2 です。
          - 2 倍になります。
        paths:
          - [C は ε_r 倍, ε_r = 2, 2 倍]
      - part: 今日
        text: 平行板コンデンサーの板の面積を 2 倍にすると、電気容量は何倍になりますか。
        choices: ["1/2 倍", "2 倍", "4 倍", "変わらない"]
        answer: "2 倍"
        check: "'2 倍'"
        hints:
          - C = εS/d です。
          - S が 2 倍になると、C はどうなりますか。
          - 2 倍になります。
