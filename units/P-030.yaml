 x1="140" y1="164" x2="140" y2="176" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="163" font-size="14" text-anchor="middle" fill="currentColor">r</text><line x1="40" y1="192" x2="240" y2="192" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="40" y1="186" x2="40" y2="198" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="240" y1="186" x2="240" y2="198" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="140" y="185" font-size="14" text-anchor="middle" fill="currentColor"></text><text x="200" y="186" font-size="15" text-anchor="middle" fill="currentColor">2r</text></svg>'
