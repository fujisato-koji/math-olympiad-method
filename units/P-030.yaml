      - 上は 1.8 × 10⁴ です。0.2 でわるのは、5 倍するのと同じです。
    paths:
      - [V = kQ/r, 1.8 × 10⁴/0.2 = 9 × 10⁴ V]
      - [Q が 2 倍で V は 2 倍, r が 2 倍で V は半分, 1 × 10⁻⁶ C・0.1 m のときと同じ 9 × 10⁴ V]
    note: 電位 V = kQ/r。電場 E = kQ/r² と、r の指数が 1 つちがう。
  - part: 離
    id: "dd292bd639"
    kinds: [数]
    uses: [P-029]
    text: 図のコンデンサーにたまるエネルギーは何 J ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="70" y1="45" x2="195" y2="45" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="70" y1="165" x2="195" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="70" y1="45" x2="70" y2="101" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="70" y1="109" x2="70" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="195" y1="45" x2="195" y2="99" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="195" y1="111" x2="195" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="55" y1="101" x2="85" y2="101" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="62" y1="109" x2="78" y2="109" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><text x="90" y="101" font-size="13" text-anchor="start" fill="currentColor" font-weight="bold">+</text><text x="48" y="110" font-size="15" text-anchor="end" fill="currentColor">100 V</text><line x1="177" y1="99" x2="213" y2="99" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="177" y1="111" x2="213" y2="111" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="221" y="110" font-size="15" text-anchor="start" fill="currentColor">1 μF</text><text x="132.5" y="111" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">U = ?</text></svg>'
    choices: ["0.001", "0.005", "0.01", "0.05"]
    answer: "0.005"
    check: "0.5 * 1e-6 * 100 ** 2"
    hints:
      - U = 1/2 CV² です。1 μF = 1 × 10⁻⁶ F です。
      - text: エネルギーは、Q–V のグラフの三角形の面積です。まず Q = CV を求めましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="165" x2="292.8" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="300,165 291,170 291,160" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="60" y1="165" x2="60" y2="25.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="60,18 65,27 55,27" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="306" y="157" font-size="14" text-anchor="end" fill="currentColor">電荷 Q</text><text x="68" y="24" font-size="14" text-anchor="start" fill="currentColor">電圧 V</text><polygon points="60,165 230,65 230,165" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="230" y1="65" x2="60" y2="65" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="54" y="70" font-size="14" text-anchor="end" fill="currentColor">100 V</text><text x="230" y="185" font-size="14" text-anchor="middle" fill="currentColor">Q = CV</text><text x="185" y="147" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">U</text><text x="195" y="45" font-size="14" text-anchor="middle" fill="currentColor">三角形の面積が U</text></svg>'
      - Q = 1 × 10⁻⁴ C です。三角形の面積は 1/2 × Q × V です。
    paths:
      - [U = 1/2 CV², 0.5 × 1 × 10⁻⁶ × 10⁴ = 0.005 J]
      - [Q = CV = 1 × 10⁻⁴ C, U = 1/2 QV = 0.005 J]
    note: コンデンサーのエネルギーは U = 1/2 CV²。V を 2 倍にすると 4 倍。
