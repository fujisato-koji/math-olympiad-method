      - part: わけ
        id: "a9214a9d1a"
        text: コンデンサーのエネルギーが U = 1/2 CV² になるわけを、図のグラフで説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="165" x2="292.8" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="300,165 291,170 291,160" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="60" y1="165" x2="60" y2="25.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="60,18 65,27 55,27" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="306" y="157" font-size="14" text-anchor="end" fill="currentColor">電荷 Q</text><text x="68" y="24" font-size="14" text-anchor="start" fill="currentColor">電圧 V</text><polygon points="60,165 230,65 230,165" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="230" y1="65" x2="60" y2="65" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="54" y="70" font-size="14" text-anchor="end" fill="currentColor">V</text><text x="230" y="185" font-size="14" text-anchor="middle" fill="currentColor">Q = CV</text><text x="185" y="147" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">U</text></svg>'
        explain: 「コンデンサーに電荷をためるとき、電圧は 0 から V まで比例して上がる。最初は 0 V、最後は V なので、平均の電圧は V/2。運んだ電荷は Q = CV なので、仕事は Q × (V/2) = 1/2 CV²。」と書ければよい。① 電圧が比例して上がる、② 平均 V/2、③ Q = CV。子どもには、グラフの三角形の面積で確かめさせます。
        hints:
          - 電荷をためていくとき、電圧は 0 から V までまっすぐ上がります。
          - text: 三角形と、高さ V/2 の長方形（点線）をくらべましょう。2 つの面積は同じです。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="165" x2="292.8" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="300,165 291,170 291,160" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="60" y1="165" x2="60" y2="25.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="60,18 65,27 55,27" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="306" y="157" font-size="14" text-anchor="end" fill="currentColor">電荷 Q</text><text x="68" y="24" font-size="14" text-anchor="start" fill="currentColor">電圧 V</text><polygon points="60,165 230,65 230,165" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="60" y="115" width="170" height="50" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="6 4"/><text x="54" y="120" font-size="13" text-anchor="end" fill="currentColor">V/2</text><line x1="230" y1="65" x2="60" y2="65" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="54" y="70" font-size="14" text-anchor="end" fill="currentColor">V</text><text x="230" y="185" font-size="14" text-anchor="middle" fill="currentColor">Q</text><text x="195" y="45" font-size="14" text-anchor="middle" fill="currentColor">点線の長方形と三角形</text></svg>'
          - 仕事は Q × V/2 で、Q = CV です。
        paths:
          - [電圧は 0 から V, 平均 V/2, Q = CV, U = 1/2 CV²]
          - [グラフの三角形, 面積 1/2 QV, Q = CV を入れる, U = 1/2 CV²]

  - day: 5
