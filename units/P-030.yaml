und"/><line x1="102" y1="86.1" x2="62.5" y2="17.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="78,44.6 85.8,49.3 78.2,53.7" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="110" y1="84" x2="110" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="110,36 114.4,44 105.6,44" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="118" y1="86.1" x2="157.5" y2="17.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="142,44.6 141.8,53.7 134.2,49.3" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="123.9" y1="92" x2="192.3" y2="52.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="165.4,68 160.7,75.8 156.3,68.2" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><circle cx="110" cy="100" r="40" stroke="#b39ddb" stroke-width="2" fill="none" stroke-dasharray="5 4"/><circle cx="110" cy="100" r="80" stroke="#b39ddb" stroke-width="2" fill="none" stroke-dasharray="5 4"/><circle cx="110" cy="100" r="14" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="110" y="106.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="97.1" y="153.3" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">r</text><text x="86.7" y="191.9" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2r</text><text x="255" y="80" font-size="14" text-anchor="middle" fill="currentColor">同じ本数の</text><text x="255" y="100" font-size="14" text-anchor="middle" fill="currentColor">力線が</text><text x="255" y="120" font-size="14" text-anchor="middle" fill="currentColor">球面を通る</text></svg>'
        explain: 「点電荷から出る電気力線は、まわりの球面全体に同じように広がる。半径 r の球の表面積は 4πr² なので、同じ本数の力線が通る面の広さは r² に比例し、1 マスを通る本数（力線のこみぐあい）は r² に反比例する。力の大きさは力線のこみぐあいに比例するので、1/r² になる。」と書ければよい。① 力線は球面に広がる、② 面積は 4πr²、③ こみぐあいは 1/r²。子どもには、思い出すの光が広がる図とくらべさせます。
        hints:
          - 点電荷から出る力線は、全部の向きに同じように広がり、半径 r の球面を通りぬけます。
          - text: 同じ本数の力線が、きょり 2r では何マスに広がるかを見ましょう。1 マスを通る本数は、どうなるでしょう。
