        text: |-
          電位 V は、+1 C の電荷を、電位 0 の所（とても遠い所）からその点まで運ぶのに要る仕事です。
          点電荷 Q から、きょり r の点の電位は V = kQ/r（r は 2 乗しない）。
          電位差 ΔV の間を電荷 q が動くとき、電場がする仕事は W = qΔV。
          図のように、電位は高さのようなものです。+ の電荷は、電位の高い所から低い所へ動くと、仕事を取り出せます。
