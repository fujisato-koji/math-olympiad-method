rrentColor" stroke-width="1" stroke-linejoin="round"/><line x1="105.9" y1="84.5" x2="86.2" y2="11.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="90.3,26.6 96.7,33.2 88.2,35.5" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="114.1" y1="84.5" x2="133.8" y2="11.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="129.7,26.6 131.8,35.5 123.3,33.2" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="121.3" y1="88.7" x2="175.1" y2="34.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="163.7,46.3 161.2,55 155,48.8" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="125.5" y1="95.9" x2="198.9" y2="76.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="183.4,80.3 176.8,86.7 174.5,78.2" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><circle cx="110" cy="100" r="55" stroke="#b39ddb" stroke-width="2" fill="#f3c969" fill-opacity="0.15" stroke-dasharray="5 4"/><circle cx="110" cy="100" r="14" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="110" y="106.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="110" y1="100" x2="137.5" y2="52.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="130" y="70" font-size="14" text-anchor="start" fill="currentColor">r</text><text x="250" y="70" font-size="14" text-anchor="middle" fill="currentColor">力線の本数</text><text x="250" y="90" font-size="14" text-anchor="middle" fill="currentColor">Q に比例</text><text x="250" y="130" font-size="14" text-anchor="middle" fill="currentColor">半径 r の球面</text><text x="250" y="150" font-size="14" text-anchor="middle" fill="currentColor">面積 4πr²</text></svg>'
        explain: 「点電荷から出る電気力線の本数は Q に比例する。半径 r の球面全体に広がると、面積は 4πr²。力線のこみぐあいは Q/(4πr²) で、r² に反比例する。電場の強さはこみぐあいに比例するので、E = kQ/r²。」と書ければよい。① 力線の本数は Q に比例、② 球の面積 4πr²、③ こみぐあいは 1/r²。子どもには、風船の表面で確かめさせます。
        hints:
