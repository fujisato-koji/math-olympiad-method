      - part: 見本
        id: "715f526fdf"
        text: |-
          コンデンサーは、2 まいの板に電荷をためる部品です。電気容量を C（F）とすると、Q = CV。
          平行板コンデンサーの電気容量は C = εS/d。S は板の面積、d は板の間の長さ、ε は誘電率です。
          板の間に誘電体（電気を通さない物）を入れると、C は比誘電率 ε_r 倍になります。
          コンデンサーの並列は C = C₁ + C₂、直列は 1/C = 1/C₁ + 1/C₂ です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="45" width="120" height="6" stroke="currentColor" stroke-width="1.5" fill="#f08080" fill-opacity="0.7"/><rect x="30" y="129" width="120" height="6" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity="0.7"/><rect x="95" y="56" width="50" height="68" rx="3" stroke="currentColor" stroke-width="1.5" fill="#b39ddb" fill-opacity="0.4"/><text x="120" y="96" font-size="12" text-anchor="middle" fill="currentColor">誘電体</text><text x="42" y="40" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="42" y="152" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><text x="66" y="40" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="66" y="152" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><text x="90" y="40" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="90" y="152" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><text x="114" y="40" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="114" y="152" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><text x="138" y="40" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="138" y="152" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><line x1="45" y1="56" x2="45" y2="117.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="45,124 41,116 49,116" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="72" y1="56" x2="72" y2="117.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="72,124 68,116 76,116" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="18" y1="51" x2="18" y2="129" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="51" x2="24" y2="51" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="129" x2="24" y2="129" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="10" y="95" font-size="14" text-anchor="end" fill="currentColor">d</text><text x="90" y="22" font-size="13" text-anchor="middle" fill="currentColor">板の面積 S</text><text x="90" y="182" font-size="15" text-anchor="middle" fill="currentColor">C = εS/d</text><line x1="168" y1="10" x2="168" y2="190" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><text x="245" y="22" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">並列</text><line x1="185" y1="55" x2="205" y2="55" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="205" y1="40" x2="205" y2="70" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="205" y1="40" x2="240" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="40" x2="285" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="31" x2="240" y2="49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="250" y1="31" x2="250" y2="49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="205" y1="70" x2="240" y2="70" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="70" x2="285" y2="70" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="61" x2="240" y2="79" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="250" y1="61" x2="250" y2="79" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="285" y1="40" x2="285" y2="70" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="285" y1="55" x2="305" y2="55" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="245" y="98" font-size="14" text-anchor="middle" fill="currentColor">C = C₁ + C₂</text><text x="245" y="122" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">直列</text><line x1="185" y1="148" x2="220" y2="148" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="220" y1="137" x2="220" y2="159" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="137" x2="230" y2="159" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="148" x2="260" y2="148" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="260" y1="137" x2="260" y2="159" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="137" x2="270" y2="159" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="148" x2="305" y2="148" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="245" y="188" font-size="13" text-anchor="middle" fill="currentColor">1/C = 1/C₁ + 1/C₂</text></svg>'
        explain: |-
          Q は電荷、C は電気容量、V は電圧、ε は誘電率、S は板の面積、d は板の間の長さです。
          Q = CV：電気容量が大きいほど、同じ電圧でたくさん電荷がたまります。
          C = εS/d：板が広いほど C が大きく、間が長いほど C が小さい。
          誘電体を入れると C は ε_r 倍。並列は板を横に広げたのと同じで足し算、直列は逆数の足し算。
        note: Q = CV。C = εS/d。並列は足す、直列は逆数の足し算。
