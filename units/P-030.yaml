# P-030 電荷と電場・電位
#
# 段 5・水準 3・8 日。前提は P-029（電流と回路）と D-006（微分係数と導関数）。
# クーロンの法則、電場と電気力線、電位と電位差、静電エネルギーと等電位面、コンデンサー（並列と直列）と誘電体を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の決まり：+ の電荷は赤の丸、− の電荷は青の丸。力は赤の矢印、電場は緑の矢印。電気力線は黒の線と小さな三角。
#   等電位面はむらさきの点線。コンデンサーは 2 まいの板（回路では短い 2 本の線）、電池は長い線が +。
#   ヒントの図：分数の形に数を入れた式（k は黄、電荷は赤、きょりは青）、数と指数に分けた計算、Q–V グラフの三角形（面積が U）。
# 10 の何乗の答えは「2 × 10⁵」の形の文字で書き、check はその形に直して照らす。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-030
days:
  - day: 1
    items:
      - part: 見本
        id: "4993f453e2"
        text: |-
          電荷 Q は電気の量で、単位は C（クーロン）です。同じ種類の電荷は反発し、ちがう種類の電荷は引き合います。
          クーロンの法則：2 つの点電荷 Q₁、Q₂ の間の力の大きさは F = kQ₁Q₂/r²（r はきょり、k = 9 × 10⁹ N·m²/C²）。
          図の下の 2 組のように、きょりが 2 倍になると、力は 1/4 になります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="80" y="20" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">同じ種類</text><text x="240" y="20" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">ちがう種類</text><circle cx="50" cy="50" r="13" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="50" y="55.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><circle cx="110" cy="50" r="13" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="110" y="55.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="36" y1="50" x2="16.8" y2="50" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="8,50 19,44 19,56" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><line x1="124" y1="50" x2="143.2" y2="50" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="152,50 141,56 141,44" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="80" y="84" font-size="14" text-anchor="middle" fill="currentColor">反発する</text><circle cx="200" cy="50" r="13" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="200" y="55.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><circle cx="280" cy="50" r="13" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.6"/><text x="280" y="55.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><line x1="214" y1="50" x2="229.2" y2="50" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="238,50 227,56 227,44" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><line x1="266" y1="50" x2="250.8" y2="50" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="242,50 253,44 253,56" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="240" y="84" font-size="14" text-anchor="middle" fill="currentColor">引き合う</text><line x1="10" y1="96" x2="310" y2="96" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="40" cy="128" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="40" y="133.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><circle cx="100" cy="128" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="100" y="133.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="52" y1="128" x2="88" y2="128" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="70" y="120" font-size="15" text-anchor="middle" fill="currentColor">r</text><line x1="113" y1="128" x2="164.2" y2="128" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="173,128 162,134 162,122" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="181" y="133" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">F</text><circle cx="40" cy="176" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="40" y="181.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><circle cx="160" cy="176" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="160" y="181.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><line x1="52" y1="176" x2="148" y2="176" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="100" y="168" font-size="15" text-anchor="middle" fill="currentColor">2r</text><line x1="173" y1="176" x2="180.8" y2="176" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="188,176 179,182 179,170" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="196" y="181" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">F の 1/4</text></svg>'
        explain: |-
          クーロン力は、電荷の積に比例し、きょりの 2 乗に反比例します。
          例：Q₁ = 2 × 10⁻⁶ C、Q₂ = 3 × 10⁻⁶ C、r = 0.1 m のとき、
          F = 9 × 10⁹ × 2 × 10⁻⁶ × 3 × 10⁻⁶ / 0.1² = 5.4 N。
          きょりを 2 倍にすると、分母の r² が 4 倍になるので、力は 1/4。
          電荷の種類は + と − の 2 つ。こすった下じきやストローで、反発と引き合いを確かめられます。
        note: F = kQ₁Q₂/r²。きょりの 2 乗に反比例。k = 9 × 10⁹。
