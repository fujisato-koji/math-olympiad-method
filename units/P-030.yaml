        check: "(lambda v: (lambda e: f'{v / 10 ** e:g} × 10' + '⁻' * (e < 0) + '⁰¹²³⁴⁵⁶⁷⁸⁹'[abs(e)])(math.floor(math.log10(v) + 1e-9)))(9e9 * 4e-6 / 0.2 ** 2)"
