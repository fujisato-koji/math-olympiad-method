        explain: 「コンデンサーに電荷をためるとき、電圧は 0 から V まで比例して上がる。平均の電圧は V/2。たまる電荷は Q = CV なので、仕事は Q × (V/2) = 1/2 CV²。」と書ければよい。① 電圧が比例して上がる、② 平均 V/2、③ Q = CV。子どもには、電圧と電荷のグラフの面積で確かめさせます。
        hints:
          - 電荷をためていくとき、電圧は 0 から V までまっすぐ上がります。
          - text: 三角形と、高さ V/2 の長方形（点線）をくらべましょう。2 つの面積は同じです。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="165" x2="292.8" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="300,165 291,170 291,160" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="60" y1="165" x2="60" y2="25.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="60,18 65,27 55,27" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="306" y="157" font-size="14" text-anchor="end" fill="currentColor">電荷 Q</text><text x="68" y="24" font-size="14" text-anchor="start" fill="currentColor">電圧 V</text><polygon points="60,165 230,65 230,165" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="60" y="115" width="170" height="50" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="6 4"/><text x="54" y="120" font-size="13" text-anchor="end" fill="currentColor">V/2</text><line x1="230" y1="65" x2="60" y2="65" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="54" y="70" font-size="14" text-anchor="end" fill="currentColor">V</text><text x="230" y="185" font-size="14" text-anchor="middle" fill="currentColor">Q</text><text x="195" y="45" font-size="14" text-anchor="middle" fill="currentColor">点線の長方形と三角形</text></svg>'
          - 仕事は Q × V/2 です。
        paths:
          - [電圧は 0 から V, 平均 V/2, Q = CV, U = 1/2 CV²]
          - [グラフの三角形, 面積 1/2 QV, Q = CV を入れる, U = 1/2 CV²]
      - part: わけ
        id: "15ac652dc7"
        text: 等電位面が電気力線と直角に交わるわけを説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="115" y1="100" x2="192" y2="100" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="174,100 166,104.4 166,95.6" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="110.6" y1="110.6" x2="165.1" y2="165.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="152.3,152.3 143.6,149.8 149.8,143.6" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="100" y1="115" x2="100" y2="192" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="100,174 95.6,166 104.4,166" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="89.4" y1="110.6" x2="34.9" y2="165.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="47.7,152.3 50.2,143.6 56.4,149.8" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="85" y1="100" x2="8" y2="100" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="26,100 34,95.6 34,104.4" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="89.4" y1="89.4" x2="34.9" y2="34.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="47.7,47.7 56.4,50.2 50.2,56.4" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="100" y1="85" x2="100" y2="8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="100,26 104.4,34 95.6,34" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="110.6" y1="89.4" x2="165.1" y2="34.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="152.3,47.7 149.8,56.4 143.6,50.2" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><circle cx="100" cy="100" r="35" stroke="#b39ddb" stroke-width="2" fill="none" stroke-dasharray="5 4"/><circle cx="100" cy="100" r="65" stroke="#b39ddb" stroke-width="2" fill="none" stroke-dasharray="5 4"/><circle cx="100" cy="100" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="100" y="105.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="250" y="80" font-size="13" text-anchor="middle" fill="currentColor">点線：等電位面</text><text x="250" y="100" font-size="13" text-anchor="middle" fill="currentColor">線：電気力線</text><text x="250" y="130" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">なぜ直角？</text></svg>'
        explain: 「等電位面にそって電荷を動かすと、電位差が 0 なので、電場がする仕事は 0。仕事が 0 になるのは、力が動く向きに直角なときだけ。電場の向きは電気力線の向きなので、等電位面は電気力線と直角。」と書ければよい。① 等電位面では仕事 0、② 仕事 0 なら力は直角、③ 電場は力線の向き。子どもには、地図の等高線と坂の向きで確かめさせます。
        hints:
          - 等電位面にそって動かすと、電位差は 0 です。
          - text: 山の地図では、いちばん急な下り坂の向きは、等高線と直角です。等高線にそう道では高さが変わりません。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="120" cy="105" rx="105" ry="80" stroke="#c9a36b" stroke-width="2" fill="#7bc96f" fill-opacity="0.15"/><ellipse cx="120" cy="105" rx="70" ry="53" stroke="#c9a36b" stroke-width="2" fill="#7bc96f" fill-opacity="0.27"/><ellipse cx="120" cy="105" rx="35" ry="26" stroke="#c9a36b" stroke-width="2" fill="#7bc96f" fill-opacity="0.39"/><line x1="158" y1="105" x2="212" y2="105" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="220,105 210,110 210,100" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="190" y="125" font-size="12" text-anchor="middle" fill="currentColor">下り坂</text><line x1="120" y1="77" x2="120" y2="37" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="120,29 125,39 115,39" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="262" y="60" font-size="13" text-anchor="middle" fill="currentColor">赤：いちばん</text><text x="262" y="78" font-size="13" text-anchor="middle" fill="currentColor">急な下り</text><text x="262" y="130" font-size="13" text-anchor="middle" fill="currentColor">線にそう道は</text><text x="262" y="148" font-size="13" text-anchor="middle" fill="currentColor">高さが同じ</text></svg>'
          - 仕事が 0 になるのは、力が動く向きと直角のときです。
        paths:
          - [等電位面は ΔV = 0, 仕事 0, 力は直角, 電気力線と直角]
          - [等高線と坂の向き, 高さが変わらない向きと急な向きは直角, 等電位面と力線も直角]

