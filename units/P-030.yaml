und"/><polygon points="159.8,140 148.9,142.3 151.4,132.7" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="210" y="60" font-size="13" text-anchor="middle" fill="currentColor">+ の電荷は、電位の</text><text x="210" y="78" font-size="13" text-anchor="middle" fill="currentColor">高い所から低い所へ</text><text x="210" y="120" font-size="15" text-anchor="middle" fill="currentColor">V = kQ/r</text><text x="44" y="62" font-size="13" text-anchor="end" fill="currentColor">高い</text><text x="275" y="150" font-size="13" text-anchor="middle" fill="currentColor">低い</text></svg>'
        explain: |-
