  - day: 6
    items:
      - part: わけ
        text: 点電荷のまわりの電場が E = kQ/r² になるわけを、電気力線の広がりで説明しましょう。
        explain: 「点電荷から出る電気力線の本数は Q に比例する。半径 r の球面全体に広がると、面積は 4πr²。力線の密度は Q/(4πr²) で、r² に反比例する。電場の強さは密度に比例するので、E = kQ/r²。」と書ければよい。① 力線の本数は Q に比例、② 球の面積 4πr²、③ 密度は 1/r²。子どもには、風船の表面で確かめさせます。
        hints:
          - 電気力線の本数は、電荷 Q に比例します。
          - 半径 r の球の表面積は 4πr² です。
          - 密度は Q/(4πr²) で、r² に反比例します。
        paths:
          - [力線は Q に比例, 球の面積 4πr², 密度 1/r², E = kQ/r²]
      - part: わけ
        text: コンデンサーのエネルギーが U = 1/2 C V² になるわけを説明しましょう。
        explain: 「コンデンサーに電荷をためるとき、電圧は 0 から V まで比例して上がる。平均の電圧は V/2。たまる電荷は Q = CV なので、仕事は Q × (V/2) = 1/2 CV²。」と書ければよい。① 電圧が比例して上がる、② 平均 V/2、③ Q = CV。子どもには、電圧と電荷のグラフの面積で確かめさせます。
        hints:
          - 電荷をためるとき、電圧は 0 から V まで上がります。
          - 平均の電圧は V/2 です。
          - 仕事は Q × V/2 です。
        paths:
          - [電圧は 0 から V, 平均 V/2, Q = CV, U = 1/2 CV²]
      - part: わけ
        text: 等電位面が電気力線と垂直に交わるわけを説明しましょう。
        explain: 「等電位面に沿って電荷を動かすと、電位差が 0 なので、電場がする仕事は 0。仕事が 0 になるのは、力が動く向きに垂直なときだけ。電場の向きは電気力線の向きなので、等電位面は電気力線と垂直。」と書ければよい。① 等電位面では仕事 0、② 仕事 0 なら力は垂直、③ 電場は力線の向き。子どもには、地図の等高線と斜面の向きで確かめさせます。
        hints:
          - 等電位面に沿って動かすと、電位差は 0 です。
          - 仕事 W = qΔV も 0 です。
          - 仕事が 0 になるのは、力が動く向きに垂直なときです。
        paths:
          - [等電位面は ΔV=0, 仕事 0, 力は垂直, 電気力線と垂直]

  - day: 7
    items:
      - part: 見本
        text: |-
          電場・電位・コンデンサーは、1 つの問題で組み合わせられます。
          点電荷 Q から距離 r の点：E = kQ/r²、V = kQ/r。
          コンデンサー：Q = CV、U = 1/2 CV²。
          電荷 q を電位差 ΔV だけ動かす仕事：W = qΔV。
        explain: |-
          例：Q = 2 × 10⁻⁶ C、r = 0.3 m の点。
          E = 9 × 10⁹ × 2 × 10⁻⁶ / 0.3² = 2 × 10⁵ N/C。
          V = 9 × 10⁹ × 2 × 10⁻⁶ / 0.3 = 6 × 10⁴ V。
          C = 5 μF、V = 200 V なら Q = 1000 μC、U = 1/2 × 5 × 10⁻⁶ × 200² = 0.1 J。
        note: まず E と V の式を分けて考える。コンデンサーは Q=CV と U=1/2CV²。
