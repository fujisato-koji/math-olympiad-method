"/><text x="139" y="134.2" font-size="15" text-anchor="middle" fill="currentColor">4 × 10⁻⁶</text><rect x="181" y="112" width="64" height="34" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="213" y="134.2" font-size="15" text-anchor="middle" fill="currentColor">0.2</text><rect x="245" y="112" width="58" height="34" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.45"/><text x="274" y="134.2" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="160" y="26" font-size="14" text-anchor="middle" fill="currentColor">Q と r² は、それぞれ何倍？</text><text x="160" y="188" font-size="13" text-anchor="middle" fill="currentColor">E = kQ/r² の上と下を、前の問題とくらべる</text></svg>'
