      - part: わけ
        id: "6bcbc4a4a6"
        text: 電場の強さ E = F/q が、置いた電荷 q によらないわけを、図を見て説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="70" cy="50" r="9" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="70" y="54.3" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="40" y="55" font-size="13" text-anchor="end" fill="currentColor">1 C</text><line x1="88" y1="50" x2="129.2" y2="50" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="138,50 127,56 127,44" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="146" y="55" font-size="14" text-anchor="start" fill="currentColor">F = E</text><circle cx="70" cy="100" r="12" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="70" y="105.4" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="40" y="105" font-size="13" text-anchor="end" fill="currentColor">2 C</text><line x1="88" y1="100" x2="179.2" y2="100" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="188,100 177,106 177,94" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="196" y="105" font-size="14" text-anchor="start" fill="currentColor">F = 2E</text><circle cx="70" cy="150" r="15" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="70" y="156.8" font-size="19" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><text x="40" y="155" font-size="13" text-anchor="end" fill="currentColor">3 C</text><line x1="88" y1="150" x2="229.2" y2="150" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="238,150 227,156 227,144" fill="#f08080" stroke="#f08080" stroke-width="1" stroke-linejoin="round"/><text x="246" y="155" font-size="14" text-anchor="start" fill="currentColor">F = 3E</text><text x="160" y="190" font-size="13" text-anchor="middle" fill="currentColor">同じ点 P に、ちがう電荷を置く</text></svg>'
        explain: 「電場は、その点に +1 C を置いたときに受ける力と決める。q C を置くと、受ける力は q 倍になる。F も q 倍になるので、F/q は q によらず、その点の電場だけが残る。」と書ければよい。① 電場は +1 C あたりの力、② q 倍なら力も q 倍、③ F/q は q によらない。子どもには、q を 2 倍、3 倍にして表で確かめさせます。
        hints:
          - 電場は、+1 C が受ける力と決めます。
          - text: 図の力を表にまとめました。F を q でわると、どうなるでしょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="25" y="44" width="60" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="55" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">q</text><rect x="85" y="44" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="120" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">1 C</text><rect x="155" y="44" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="190" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">2 C</text><rect x="225" y="44" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="260" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">3 C</text><rect x="25" y="78" width="60" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="55" y="100.2" font-size="15" text-anchor="middle" fill="currentColor">F</text><rect x="85" y="78" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="120" y="100.2" font-size="15" text-anchor="middle" fill="currentColor">E</text><rect x="155" y="78" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="190" y="100.2" font-size="15" text-anchor="middle" fill="currentColor">2E</text><rect x="225" y="78" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="260" y="100.2" font-size="15" text-anchor="middle" fill="currentColor">3E</text><rect x="25" y="112" width="60" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="55" y="134.2" font-size="15" text-anchor="middle" fill="currentColor">F/q</text><rect x="85" y="112" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.45"/><text x="120" y="134.2" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><rect x="155" y="112" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.45"/><text x="190" y="134.2" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><rect x="225" y="112" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.45"/><text x="260" y="134.2" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="160" y="26" font-size="14" text-anchor="middle" fill="currentColor">F を q でわってみる</text></svg>'
          - F が q に比例するとき、F/q の中の q はどうなるでしょう。
