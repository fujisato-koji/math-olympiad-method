="116" font-size="14" text-anchor="start" fill="currentColor">Q₁</text><text x="286" y="116" font-size="14" text-anchor="start" fill="currentColor">Q₂</text></svg>'
        explain: 「並列では、どちらのコンデンサーにも同じ電圧 V がかかる。たまる電荷は Q₁ = C₁V、Q₂ = C₂V。全体の電荷は Q = Q₁ + Q₂ = (C₁ + C₂)V。合成容量は Q/V なので、C = C₁ + C₂。」と書ければよい。① 同じ電圧、② 電荷が足される、③ Q/V。子どもには、具体的な数で確かめさせます。
