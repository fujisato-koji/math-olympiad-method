        id: "96d4ee1841"
        text: コンデンサーの電荷が Q = CV になるわけを、図を見て説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="165" x2="300" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="165" x2="30" y2="27.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="30,20 35,29 25,29" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><text x="38" y="26" font-size="13" text-anchor="start" fill="currentColor">電荷 Q</text><rect x="60" y="130" width="36" height="35" stroke="currentColor" stroke-width="1.5" fill="#f08080" fill-opacity="0.5"/><text x="78" y="125" font-size="14" text-anchor="middle" fill="currentColor">C</text><text x="78" y="185" font-size="13" text-anchor="middle" fill="currentColor">1 V</text><rect x="120" y="95" width="36" height="70" stroke="currentColor" stroke-width="1.5" fill="#f08080" fill-opacity="0.5"/><text x="138" y="90" font-size="14" text-anchor="middle" fill="currentColor">2C</text><text x="138" y="185" font-size="13" text-anchor="middle" fill="currentColor">2 V</text><rect x="180" y="60" width="36" height="105" stroke="currentColor" stroke-width="1.5" fill="#f08080" fill-opacity="0.5"/><text x="198" y="55" font-size="14" text-anchor="middle" fill="currentColor">3C</text><text x="198" y="185" font-size="13" text-anchor="middle" fill="currentColor">3 V</text><rect x="240" y="45" width="36" height="120" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="258" y="40" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">Q</text><text x="258" y="185" font-size="13" text-anchor="middle" fill="currentColor">V</text></svg>'
        explain: 「電気容量 C は、1 V あたりどれだけ電荷がたまるかを表す。電圧を 2 倍、3 倍にすると、たまる電荷も 2 倍、3 倍になる。だから Q = CV。」と書ければよい。① C は 1 V あたりの電荷、② 電圧に比例、③ Q = CV。子どもには、具体的な数で確かめさせます。
        hints:
          - 電気容量 C は、1 V あたりにたまる電荷です。
          - text: 電圧と電荷を表にしました。3 V では、いくつたまるでしょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="25" y="44" width="60" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="55" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">V</text><rect x="85" y="44" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="120" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">1 V</text><rect x="155" y="44" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="190" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">2 V</text><rect x="225" y="44" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="260" y="66.2" font-size="15" text-anchor="middle" fill="currentColor">3 V</text><rect x="25" y="78" width="60" height="34" stroke="currentColor" stroke-width="1.5" fill="#c8ccd6" fill-opacity="0.45"/><text x="55" y="100.2" font-size="15" text-anchor="middle" fill="currentColor">Q</text><rect x="85" y="78" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="120" y="100.2" font-size="15" text-anchor="middle" fill="currentColor">C</text><rect x="155" y="78" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="190" y="100.2" font-size="15" text-anchor="middle" fill="currentColor">2C</text><rect x="225" y="78" width="70" height="34" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity="0.45"/><text x="260" y="100.2" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="160" y="26" font-size="14" text-anchor="middle" fill="currentColor">電圧と電荷の表</text></svg>'
