      - part: 見本
        id: "b9379be45c"
        text: |-
          電場・電位・コンデンサーは、1 つの問題で組み合わせて使います。
          点電荷 Q から、きょり r の点：E = kQ/r²（向きがある）、V = kQ/r（向きがない）。
          コンデンサー：Q = CV、U = 1/2 CV²。
          電荷 q が電位差 ΔV を動くときの仕事：W = qΔV。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="95" r="13" stroke="currentColor" stroke-width="2" fill="#f08080" fill-opacity="0.6"/><text x="30" y="100.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">+</text><circle cx="130" cy="95" r="4" fill="currentColor"/><text x="130" y="80" font-size="13" text-anchor="middle" fill="currentColor">P</text><line x1="134" y1="95" x2="154.8" y2="95" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="162,95 153,100 153,90" fill="#7bc96f" stroke="#7bc96f" stroke-width="1" stroke-linejoin="round"/><line x1="30" y1="120" x2="130" y2="120" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="30" y1="114" x2="30" y2="126" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="130" y1="114" x2="130" y2="126" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="80" y="138" font-size="14" text-anchor="middle" fill="currentColor">r</text><text x="85" y="36" font-size="15" text-anchor="middle" fill="currentColor">E = kQ/r²</text><text x="85" y="58" font-size="15" text-anchor="middle" fill="currentColor">V = kQ/r</text><text x="85" y="180" font-size="13" text-anchor="middle" fill="currentColor">点電荷のまわり</text><line x1="172" y1="15" x2="172" y2="190" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="212" y1="65" x2="272" y2="65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="212" y1="145" x2="272" y2="145" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="212" y1="65" x2="212" y2="101" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="212" y1="109" x2="212" y2="145" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="272" y1="65" x2="272" y2="99" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="272" y1="111" x2="272" y2="145" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="197" y1="101" x2="227" y2="101" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="204" y1="109" x2="220" y2="109" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><text x="232" y="101" font-size="13" text-anchor="start" fill="currentColor" font-weight="bold">+</text><text x="190" y="110" font-size="15" text-anchor="end" fill="currentColor">V</text><line x1="254" y1="99" x2="290" y2="99" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="254" y1="111" x2="290" y2="111" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="298" y="110" font-size="15" text-anchor="start" fill="currentColor">C</text><text x="242" y="36" font-size="15" text-anchor="middle" fill="currentColor">Q = CV</text><text x="242" y="180" font-size="15" text-anchor="middle" fill="currentColor">U = 1/2 CV²</text></svg>'
        explain: |-
          例：Q = 2 × 10⁻⁶ C、r = 0.3 m の点。
          E = 9 × 10⁹ × 2 × 10⁻⁶ / 0.3² = 2 × 10⁵ N/C。
          V = 9 × 10⁹ × 2 × 10⁻⁶ / 0.3 = 6 × 10⁴ V。
          C = 5 μF、V = 200 V なら Q = 1000 μC、U = 1/2 × 5 × 10⁻⁶ × 200² = 0.1 J。
        note: まず E と V の式を分けて考える。コンデンサーは Q=CV と U=1/2CV²。
