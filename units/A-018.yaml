            <text x="72" y="56" font-size="42" text-anchor="middle">Σ</text>
            <text x="72" y="16" font-size="14" text-anchor="middle">20</text>
            <text x="72" y="78" font-size="13" text-anchor="middle"><tspan font-style="italic">k</tspan> = 1</text>
            <text x="93" y="50" font-size="24">(3<tspan font-style="italic">k</tspan> + 2)</text>
          </svg>
        explain: 1 から n までの和は、Σ k（k = 1〜n）= n(n + 1)/2 です（A-004 のはしから組にする和を、文字で書いたもの。わけは 4 日目）。足す順を入れかえたりまとめたりしても和は変わらないので（N-015）、Σ (3k + 2) は、3k の和と 2 の和に分けられます。3k の和は、分配法則（A-010）で 3 × (1 + 2 + … + 20) です。2 の和は、2 を 20 回足すので 2 × 20 です。だから Σ (3k + 2)（k = 1〜20）= 3 × 210 + 2 × 20 = 630 + 40 = 670 です。まとめると、Σ (ak + b)（k = 1〜n）= a × n(n + 1)/2 + bn です。途中から始まる和は、1 からの和の差で求めます。Σ k（k = 11〜20）= Σ k（k = 1〜20）− Σ k（k = 1〜10）= 210 − 55 = 155 です。
