# A-018 Σ と和の変形
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011、A-015 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：Σ の記号の意味（k に下の数から上の数までを順に入れて足す）、Σ の式の値、和を Σ で表す、下の数が 1 でない和。
#   2 日目：Σ k = n(n + 1)/2、Σ の性質（和に分ける、定数倍を外に出す、同じ数を n 回足すと n 倍）、途中から始まる和（1 からの和の差）。
#   3 日目：Σ k² = n(n + 1)(2n + 1)/6 と Σ k³ = (n(n + 1)/2)²、差の形にして消し合う和（2 乗の差、1/(k(k + 1)) の和）。
#   4 日目：わけ。5 日目：A-004、A-010、A-015 と混ぜる（等差数列の和、展開してから分ける、文字の置きかえ）。6 日目：確認。
# 前提は A-004（等差数列とその和）、A-010（文字と式）、A-015（展開と因数分解）。
# Σ の上と下の数は画面の文では書けないので、問題の Σ の式は svg の図に描き（Σ の上に終わりの値、下に k = 始めの値）、文では「図の和」と呼ぶ。
#   見本、ヒント、paths、note では「Σ k²（k = 1〜10）」と 1 行で書く（1 日目の見本で、この書き方を教える）。
#   和を Σ で表す問題は、図にア、イ、ウの 3 つの Σ の式を並べ、choices はア、イ、ウにする。
# 1/(k(k + 1)) の和は、文では 1/2 + 1/6 + 1/12 + … のように数で書く（画面が分数を上下に重ねるのは 1/6 のような形だけなので）。
# 等比数列の和（A-022）、数学的帰納法（L の流れ）は扱わない。Σ k² と Σ k³ の公式は 3 日目に使い方を学び、Σ k² のわけは
#   3 日目の挑戦で (k + 1)³ − k³ の差の和から数の場合を求める。4 日目のわけは Σ k、差の和による Σ (2k − 1) = n²、点の図の 3 問。
# 答えは数を打つ。式を選ぶ問題の check は、選択肢ごとの式（lambda n）に n = 1〜8 を入れ、和をそのまま足した値とどの n でも等しいものを
#   選び出す（n = 1 だけでは選択肢が見分けられないので、2 以上も入れる）。値の check は sum(… for k in range(…)) でそのまま足し、
#   分数は Fraction で足す。ア、イ、ウを選ぶ check は、選択肢ごとの項の並びが問題の和の項の並びと同じものを選び出す。
# Σ と和の変形は、数列の極限と級数（D-002）、母関数（C-026）、古典的な不等式（A-027）、統計の平均と分散の計算の道具になる（D-026）。
# ただし腕だめしの最難関（差が全部ちがう 5 つの数）だけは例外で、uses に L-005 を挙げて偶数と奇数を使う。

id: A-018
