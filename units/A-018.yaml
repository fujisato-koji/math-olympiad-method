        text: 図の式は、どんな和を表しているでしょう。値も求めてみましょう。
        svg: |
          <svg viewBox="0 0 240 86" xmlns="http://www.w3.org/2000/svg">
            <text x="72" y="56" font-size="42" text-anchor="middle">Σ</text>
            <text x="72" y="16" font-size="14" text-anchor="middle">5</text>
            <text x="72" y="78" font-size="13" text-anchor="middle"><tspan font-style="italic">k</tspan> = 1</text>
            <text x="93" y="50" font-size="24">(2<tspan font-style="italic">k</tspan> − 1)</text>
          </svg>
        explain: Σ（シグマ）は「足し合わせる」ことを表す記号です。図の式は、k に下の 1 から上の 5 まで、1、2、3、4、5 を順に入れた 2k − 1 の値を、全部足すことを表します。k = 1 で 1、k = 2 で 3、k = 3 で 5、k = 4 で 7、k = 5 で 9 なので、1 + 3 + 5 + 7 + 9 = 25 です。文の中では、この和を Σ (2k − 1)（k = 1〜5）とも書きます。k は i や j のような別の文字にかえても、同じ和を表します。下の数は 1 でなくてもよく、Σ k（k = 3〜6）は 3 + 4 + 5 + 6 です。足す項の数は、上の数 − 下の数 + 1 です。反対に、2 + 4 + 6 + … + 20 は、k 番目の数が 2k なので、Σ 2k（k = 1〜10）と表せます。
