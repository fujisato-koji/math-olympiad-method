        text: 図の和の値はいくつですか。
        svg: '<svg viewBox="0 0 240 86" xmlns="http://www.w3.org/2000/svg"><text x="76" y="56" font-size="42" text-anchor="middle" fill="currentColor">Σ</text><rect x="61.9" y="2.5" width="28.2" height="19" rx="4" fill="#b39ddb" fill-opacity="0.4" stroke="none"/><text x="76" y="16" font-size="14" text-anchor="middle" fill="currentColor">10</text><rect x="54.8" y="65.5" width="42.4" height="18" rx="4" fill="#7fc8f8" fill-opacity="0.4" stroke="none"/><text x="76" y="78" font-size="13" text-anchor="middle" fill="currentColor"><tspan font-style="italic">k</tspan> = 1</text><text x="97" y="50" font-size="24" text-anchor="start" fill="currentColor">(−1)<tspan dy="-10" font-size="15" font-style="italic">k</tspan><tspan dy="10"> </tspan><tspan font-style="italic">k</tspan></text></svg>'
        answer: 5
        check: "sum((-1) ** k * k for k in range(1, 11))"
