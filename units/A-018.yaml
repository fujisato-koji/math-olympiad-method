# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋, 数]
    text: 1/3 + 1/15 + 1/35 + 1/63 + … + 1/399 の値はいくつですか。分母は 1 × 3、3 × 5、5 × 7、… のように、となり合う奇数の積です。
    answer: 10/21
    check: "sum(Fraction(1, (2 * k - 1) * (2 * k + 1)) for k in range(1, 11))"
    hints:
      - 1/3 と、1/1 − 1/3 をくらべてみよう。何倍になっているかな。
      - 1/((2k − 1)(2k + 1)) を、2 つの《分数》の差を使って表そう。
      - 差の形にして足すと、となり合う項が消し合うよ。399 は何と何の積かな。
    paths:
      - [1/((2k − 1)(2k + 1)) = (1/2) × (1/(2k − 1) − 1/(2k + 1)), 399 = 19 × 21 なので k = 1〜10, 和は (1/2) × (1 − 1/21) = (1/2) × 20/21 = 10/21]
    note: 差の形にして消し合う和（3 日目の 1/(k(k + 1)) の和）を、分母の 2 つの数の差が 2 の場合に広げる。1/1 − 1/3 = 2/3 なので 1/2 倍が要ることに気づかないと 20/21 と答えてしまう。399 = 19 × 21 を見つけるのも一手間。
