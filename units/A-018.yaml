      - [1² から 40² までの和から 偶数の 2 乗の和をひく, 偶数の 2 乗の和は 4 × (1² + 2² + … + 20²) = 11480, 22140 − 11480 = 10660]
    note: 数が大きく、公式に入れる n（20、40 ではない）と、展開した 3 つの和の計算で間ちがえやすい。2 本目は「全部 − 偶数」の言いかえ。Σ k²（k = 1〜40）= 22140 の計算も 5 けたになる。
