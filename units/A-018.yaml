    note: 正方形の大きさで場合を分け（和の法則）、それぞれの置き場所をたてと横の積（積の法則、C-005）で数える。1 辺 1 マスの 60 こだけを数えたり、1 辺 7 マス以上も数えたりしやすい。Σ の式に直すと、6 つの積を足すかわりに公式で計算できる。
