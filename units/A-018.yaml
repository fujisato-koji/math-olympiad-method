      - part: わけ
        id: "b1635f37fc"
        text: どんな自然数 n でも、Σ (2k − 1)（k = 1〜n）= n² となるわけを、k² − (k − 1)² = 2k − 1 を使って、すじ道を立てて書きましょう。
        explain: 例：「k を自然数とする。乗法公式で (k − 1)² = k² − 2k + 1 なので、k² − (k − 1)² = k² − k² + 2k − 1 = 2k − 1 である。よって、和の各項を差の形に書くと、Σ (2k − 1)（k = 1〜n）= (1² − 0²) + (2² − 1²) + (3² − 2²) + … + (n² − (n − 1)²)。1²、2²、…、(n − 1)² は、足す形とひく形で 1 回ずつ出てくるので消し合い（入れかえとまとめ）、残るのは n² − 0² = n² である。」と書ければよい。①「〜とする」で k、n を決める、② 展開して各項を差の形に変形する、③ 約束した事実（乗法公式、足し算の入れかえとまとめ）で結ぶ、の 3 つがそろっているかを見る。前の問題の Σ k の公式を約束した事実として使い、Σ (2k − 1) = 2 × n(n + 1)/2 − n = n² と書いてもよい。1 + 3 + 5 = 9 = 3² のような例だけで終わっていたら、例ではすべての n をしめせないことを話す。
        hints:
