      - part: わけ
        id: "16b7f6d764"
        text: Σ k（k = 1〜n）= n(n + 1)/2 となるわけを、すじ道を立てて書きましょう。
        explain: 例：「n を自然数とし、S = 1 + 2 + 3 + … + n とする。足す順を逆にしても和は変わらないので（入れかえの決まり）、S = n + (n − 1) + (n − 2) + … + 1。2 つの式の両辺を足し、上下にならんだ項どうしを組にすると、1 + n、2 + (n − 1)、3 + (n − 2)、… のどの組も n + 1 になり、組は n 組ある。よって 2S = n(n + 1)、両辺を 2 でわって S = n(n + 1)/2 である。」と書ければよい。①「〜とする」で n と S を決める、② 逆の順にならべて足し、式を変形する、③ 約束した事実（入れかえの決まりと《結合法則》、等式の性質）で結ぶ、の 3 つがそろっているかを見る。n = 10 で 55 になるとたしかめただけで終わっていたら、例ではすべての n をしめせないことを話す。点のかいだんを 2 つ組み合わせて n × (n + 1) の長方形にする図は、この組み合わせを形で見たもの。A-004 のはしから組にする方法は、n が奇数のときにまん中の数が 1 つ残るので場合分けが要るが、この方法では場合分けが要らないことにもふれる。
        hints:
