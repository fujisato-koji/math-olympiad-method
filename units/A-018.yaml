ll-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="229.2" y="176.4" font-size="15" text-anchor="middle" fill="currentColor">7</text><rect x="251.2" y="158" width="36" height="26" rx="4" fill="#7bc96f" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="269.2" y="176.4" font-size="15" text-anchor="middle" fill="currentColor">9</text></svg>'
        explain: 図の式は、k に下の 1 から上の 5 まで、1、2、3、4、5 を順に入れた 2k − 1 の値を、全部足すことを表します。Σ の下の数が「はじめ」、上の数が「おわり」の k です。k = 1 で 1、k = 2 で 3、k = 3 で 5、k = 4 で 7、k = 5 で 9 なので、1 + 3 + 5 + 7 + 9 = 25 です。文の中では、この和を Σ (2k − 1)（k = 1〜5）とも書きます。k は i や j のような別の文字にかえても、同じ和を表します。下の数は 1 でなくてもよく、Σ k（k = 3〜6）は 3 + 4 + 5 + 6 です。足す数は、上の数 − 下の数 + 1 こあります。反対に、2 + 4 + 6 + … + 20 は、k 番目の数が 2k なので、Σ 2k（k = 1〜10）と表せます。
