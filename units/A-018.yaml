-size="15" text-anchor="middle" fill="currentColor">1/2</text><text x="196" y="128" font-size="15" text-anchor="end" fill="currentColor">1/6</text><text x="210" y="128" font-size="15" text-anchor="middle" fill="currentColor">=</text><rect x="223" y="112" width="34" height="22" rx="5" fill="#7bc96f" fill-opacity="0.45" stroke="none"/><text x="240" y="128" font-size="15" text-anchor="middle" fill="currentColor">1/2</text><text x="264" y="128" font-size="15" text-anchor="middle" fill="currentColor">−</text><rect x="273" y="112" width="34" height="22" rx="5" fill="#c8ccd6" fill-opacity="0.55" stroke="none"/><text x="290" y="128" font-size="15" text-anchor="middle" fill="currentColor">1/3</text><text x="196" y="160" font-size="15" text-anchor="end" fill="currentColor">1/12</text><text x="210" y="160" font-size="15" text-anchor="middle" fill="currentColor">=</text><rect x="223" y="144" width="34" height="22" rx="5" fill="#7bc96f" fill-opacity="0.45" stroke="none"/><text x="240" y="160" font-size="15" text-anchor="middle" fill="currentColor">1/3</text><text x="264" y="160" font-size="15" text-anchor="middle" fill="currentColor">−</text><rect x="273" y="144" width="34" height="22" rx="5" fill="#c8ccd6" fill-opacity="0.55" stroke="none"/><text x="290" y="160" font-size="15" text-anchor="middle" fill="currentColor">1/4</text><line x1="280" y1="102" x2="250" y2="112" stroke="#f08080" stroke-width="2.5"/><line x1="280" y1="134" x2="250" y2="144" stroke="#f08080" stroke-width="2.5"/><text x="244" y="192" font-size="14" text-anchor="middle" fill="currentColor">足すと 1 − 1/4</text></svg>'
        explain: 1 から n までの 2 乗の和と 3 乗の和には、図の上の公式があります。たとえば Σ k²（k = 1〜10）= 10 × 11 × 21 ÷ 6 = 385、Σ k³（k = 1〜4）= (4 × 5 ÷ 2)² = 10² = 100 です（1 + 8 + 27 + 64 = 100 でたしかめられます）。Σ k² の公式のわけは、今日の挑戦と 4 日目で考えます。また、足す数のどれもが「次の数 − 今の数」の形になっているときは、となりどうしが消し合って、「最後の数 − 最初の数」だけが残ります。図の左のように、2² − 1²、3² − 2²、4² − 3² は、正方形を角から重ねたときの L の形の部分で、合わせると 4² − 1² です。(2² − 1²) + (3² − 2²) + … + (11² − 10²) も、2²、3²、…、10² が足す形とひく形で 1 回ずつ出て消えるので、11² − 1² = 120 です。《分数》でも同じで、図の右のように 1/2 = 1 − 1/2、1/6 = 1/2 − 1/3、1/12 = 1/3 − 1/4、… なので、1/2 + 1/6 + 1/12 + … + 1/90 = 1 − 1/10 = 9/10 です。
