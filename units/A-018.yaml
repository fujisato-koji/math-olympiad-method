      - 10 この「ひいた数」は、p、q、r、s、p + q、q + r、r + s、p + q + r、q + r + s、p + q + r + s。合計を p、q、r、s ごとにまとめると、p は 4 回、q は 6 回、r は 6 回、s は 4 回出るので、4p + 6q + 6r + 4s。どれも偶数のかたまりなので、合計は偶数
      - 合計が奇数（55）にも偶数にもなるのはおかしい。だから いちばん大きい数は 10 にならず、11 か、それより大きい
      - 0、1、4、9、11 を使うと、ひいた数は 1、2、3、4、5、7、8、9、10、11 の 10 こで、全部ちがう。だから、答えは 11
    - - 間かく p、q、r、s も、ひいた数の仲間なので、ちがう正の整数。だから 合計は 1 + 2 + 3 + 4 = 10 か、それより大きい。いちばん大きい数は p + q + r + s なので、10 か、それより大きい
      - いちばん大きい数が 10 だとすると、間かくは 1、2、3、4。1 と 2 がとなり合うと、1 + 2 = 3 が間かくの 3 と重なる。1 と 3 がとなり合うと、1 + 3 = 4 が間かくの 4 と重なる。だから 1 のとなりは 4 だけ
      - 1 がまん中にあると、両どなりが 4 になってしまうが、4 は 1 つしかない。だから 1 は左右どちらかのはし。左右を入れかえても同じなので、間かくは 1、4、□、□ としてよい
      - のこりの 2 と 3 は、1、4、2、3 でも 1、4、3、2 でも、1 + 4 = 5 と 2 + 3 = 5 が重なる。だから 10 ではできない
      - 11 のときは、間かくを 1、3、5、2 とすると 0、1、4、9、11 で、ひいた数は 1、2、3、4、5、7、8、9、10、11 の 10 こ全部ちがう。だから、答えは 11
    note: 考えどころは 3 つ：①10 この「ひいた数」はちがう正の整数なので、いちばん大きい数は 10 以上、②10 だと 1〜10 が 1 回ずつで合計 55（奇数）、一方で間かく p、q、r、s を使うと合計は 4p + 6q + 6r + 4s で偶数になり、合わない（偶奇）、③11 で 0、1、4、9、11 を作る。2 本目は、間かくの 4 つも「ひいた数」であることを使い、10 のときの間かくは 1、2、3、4 しかないので、1 のとなりを場合分けして重なりを見つける。2 本目は偶奇を使わず、1 本目はならべ方を調べなくてすむ。check は、5 つの数の組を全部調べ、ひいた数が 10 こ全部ちがうものがある最小のいちばん大きい数を出す（11）。差が全部ちがう目もり（ゴロムじょうぎ）の考えで、目もり 4 つなら 0、1、4、6 で 1〜6 が全部そろうので、5 つでも 10 まででそろうと予想しやすく、これがわな（そろうのは 4 つまで）。リポジトリをさがしたはんいでは、同じ型の問題は既出になかった。
