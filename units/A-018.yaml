        explain: 1 から n までの和は、Σ k（k = 1〜n）= n(n + 1)/2 です（A-004 のはしから組にする和を、文字で書いたもの）。図の右のように、1 + 2 + 3 + 4 の点のかいだんを 2 つ組み合わせると 4 × 5 の長方形になるので、その半分です（わけは 4 日目）。足す順を入れかえたりまとめたりしても和は変わらないので（N-015）、Σ (3k + 2) は、図の左のように 3k の和（緑）と 2 の和（黄）に分けられます。3k の和は、分配法則（A-010）で 3 × (1 + 2 + … + 20) です。2 の和は、2 を 20 回足すので 2 × 20 です。だから Σ (3k + 2)（k = 1〜20）= 3 × 210 + 2 × 20 = 630 + 40 = 670 です。まとめると、Σ (ak + b)（k = 1〜n）= a × n(n + 1)/2 + bn です。とちゅうから始まる和は、1 からの和の差で求めます。Σ k（k = 11〜20）= Σ k（k = 1〜20）− Σ k（k = 1〜10）= 210 − 55 = 155 です。
