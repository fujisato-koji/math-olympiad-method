# G-018 円周角の定理
#
# 書き方は N-001 の頭の注のとおり。
# ことば：円周角、中心角、弧 AB（AB の弧）、直径、円周角の定理、円周角の定理の逆、1 つの円周上にある。
# 約束した事実は G-016、G-017 のもの（平行線と角、外角、二等辺三角形の底角、合同条件）と、G-010 の円の性質
#   （半径はみな等しい、弧の長さは円周の「中心角 ÷ 360」）。ここで示すもの：円周角の定理（中心が角の辺の上にある場合、
#   内側にある場合）、半円の弧に対する円周角は 90°。同じ弧に対する円周角が等しいこと、等しい弧と等しい円周角、
#   円周角の定理の逆は、見本で知らせて使う（中心が角の外側にある場合は、わけの日に「場合分け」として話すだけにした）。
# 円に内接する四角形の性質は G-023（角度の追跡と内接四角形）、方べきの定理は G-030、相似は G-020 で扱うので、ここでは使わない。
#   接線と弦のつくる角も扱わない。
# 前提の数は G-009 の範囲（1000 まで、九九の範囲のわり算、何十 ÷ 1 けた）と、G-010 の分数（約分）と「（□ × 円周率）cm」の答え方。
#   弧の長さは G-010 と同じく □ を打つ。分数の答えは約分した形（1/6）で、check は Fraction。
# 図は svg（D-040）。点の位置は、角の大きさから円の上の角度を決めて描いたので、図の角は本当の大きさ。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 円周角と中心角（円周角は中心角の半分）　2 日目 同じ弧に対する円周角、半円の弧に対する円周角
#   3 日目 等しい弧と円周角、弧の長さ、円周角の定理の逆　4 日目 わけ（円周角の定理の 2 つの場合、半円の弧に対する円周角）
#   5 日目 G-017（二等辺三角形）・G-010（弧の長さ）と 1〜3 日目を混ぜる　6 日目 確認
# check：角の大きさと弧の長さの計算の式。4 点が 1 つの円周上にあるかを選ぶ問題は、角が等しいかを調べる式。

id: G-018
days:
  - day: 1
    items:
