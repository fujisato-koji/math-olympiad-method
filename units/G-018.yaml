        explain: 円 O の円周の上に 3 点 A、B、P があるとき、∠APB を、弧 AB（P をふくまない方の弧）に対する円周角といいます。∠AOB は弧 AB に対する中心角です。1 つの弧に対する円周角の大きさは、その弧に対する中心角の半分です（円周角の定理）。図では ∠AOB = 100° なので、∠APB = 100° ÷ 2 = 50° です。反対に、円周角がわかれば、中心角はその 2 倍です。
