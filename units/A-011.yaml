          - [2x + 3 は x が 1 ふえると 2 ふえる, 11 になる x は 1 つだけ, x = 4 を代入すると 11 になるので解は x = 4]
      - part: わけ
        id: "69a03c41d2"
        text: 等式 A + b = c が成り立つとき、+ b を右辺に移して A = c − b としてよい（移項してよい）わけを、等式の性質を使って書きましょう。A は式、b と c は数とします。
        explain: 例：「A + b = c が成り立つとする。等式の両辺から同じ数 b をひいても等式は成り立つので、A + b − b = c − b。左辺は A + b − b = A なので、A = c − b となる。これは、左辺の + b をふごうを変えて右辺に移したのと同じである。よって、移項してよい。」と書ければよい。①「〜とする」、② 両辺から b をひく変形、③ 等式の性質で結ぶ、がそろっているかを見る。2x + 5 = 17 のような例だけで説明していたら、b と c がどんな数でも同じすじ道になることを、文字で書けばしめせると話す。
        hints:
          - 「A + b = c が成り立つとする」から書き始めましょう。
          - text: てんびんで考えると、両方の皿から同じ重さ b を取る、ということです。
