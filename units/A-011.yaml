# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "72d8de023a"
    kinds: [総動員]
    uses: [S-028]
    text: あるクラスは男子 12 人、女子 18 人の 30 人です。テストのクラス全体の平均点は 62 点で、男子の平均点は女子の平均点より 5 点低かったです。女子の平均点は何点ですか。
    svg: '<svg viewBox="0 0 320 175" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="20" width="280" height="30" rx="0" fill="#c8ccd6" fill-opacity=".45"/><text x="65" y="40" font-size="15" text-anchor="middle" fill="currentColor"></text><text x="155" y="40" font-size="15" text-anchor="middle" fill="currentColor">人数</text><text x="250" y="40" font-size="15" text-anchor="middle" fill="currentColor">平均点</text><text x="65" y="70" font-size="15" text-anchor="middle" fill="currentColor">男子</text><text x="155" y="70" font-size="15" text-anchor="middle" fill="currentColor">12 人</text><rect x="239" y="55" width="22" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><text x="250" y="70" font-size="15" text-anchor="middle" fill="currentColor">?</text><text x="65" y="100" font-size="15" text-anchor="middle" fill="currentColor">女子</text><text x="155" y="100" font-size="15" text-anchor="middle" fill="currentColor">18 人</text><rect x="239" y="85" width="22" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><text x="250" y="100" font-size="15" text-anchor="middle" fill="currentColor">?</text><text x="65" y="130" font-size="15" text-anchor="middle" fill="currentColor">クラス</text><text x="155" y="130" font-size="15" text-anchor="middle" fill="currentColor">30 人</text><text x="250" y="130" font-size="15" text-anchor="middle" fill="currentColor">62 点</text><rect x="20" y="20" width="280" height="120" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="20" y1="50" x2="300" y2="50" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="20" y1="80" x2="300" y2="80" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="20" y1="110" x2="300" y2="110" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="110" y1="20" x2="110" y2="140" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="200" y1="20" x2="200" y2="140" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><text x="160" y="160" font-size="14" text-anchor="middle" fill="currentColor">男子の平均点は、女子より 5 点低い</text></svg>'
    answer: 64
    check: "[x for x in range(0, 101) if 12 * (x - 5) + 18 * x == 62 * 30][0]"
    hints:
      - 平均点 × 人数 ＝ 合計点 だね。クラス全体の合計点はいくつかな。
      - text: 女子の平均点を x 点とすると、男子の平均点は x − 5 点。合計点を長方形の面積で表した図です。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="54" width="96" height="112" rx="0" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="30" y="40" width="96" height="14" rx="0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="126" y="40" width="144" height="126" rx="0" fill="#f08080" fill-opacity=".35" stroke="currentColor" stroke-width="2"/><text x="78" y="120" font-size="14" text-anchor="middle" fill="currentColor">男子</text><text x="78" y="140" font-size="13" text-anchor="middle" fill="currentColor">12 人</text><text x="198" y="120" font-size="14" text-anchor="middle" fill="currentColor">女子</text><text x="198" y="140" font-size="13" text-anchor="middle" fill="currentColor">18 人</text><text x="278" y="110" font-size="14" text-anchor="start" fill="currentColor">x 点</text><text x="78" y="70" font-size="13" text-anchor="middle" fill="currentColor">x − 5 点</text><text x="78" y="34" font-size="12" text-anchor="middle" fill="currentColor">5 点 × 12 人</text><text x="160" y="186" font-size="13" text-anchor="middle" fill="currentColor">長方形の面積 ＝ 平均点 × 人数 ＝ 合計点</text></svg>'
      - 男子の合計点 ＋ 女子の合計点 ＝ クラスの合計点 で方程式を立てよう。
    paths:
      - [女子の平均点を x 点とする, 男子の平均点は x − 5 点, 12(x − 5) + 18x = 62 × 30 = 1860, 30x − 60 = 1860 で x = 64]
      - [男子が全員あと 5 点高ければ クラスの合計は 12 × 5 = 60 点ふえる, そのとき全員の平均が女子の平均と同じ, (1860 + 60) ÷ 30 = 64 点]
    note: 平均（S-028）は「合計 ÷ 人数」なので、グループごとの合計点で式を立てる。男子と女子の平均を足して 2 でわる間ちがい（人数がちがうので使えない）が多い。2 本目は男子の点をならす見方。
  - part: 離
    id: "e543a84830"
    kinds: [道筋]
    text: ある本を、1 日目に全体の 1/3 より 10 ページ多く読み、2 日目に残りの 1/2 より 5 ページ少なく読みました。すると、まだ 60 ページ残っていました。この本は全部で何ページですか。
    answer: 180
    check: "[x for x in range(1, 1000) if (lambda r: r - (r / 2 - 5))(x - (Fraction(x, 3) + 10)) == 60][0]"
    hints:
      - 全体を x ページとして、1 日目に読んだあとの残りを式で表そう。
