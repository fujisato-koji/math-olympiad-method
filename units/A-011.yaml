    text: 5% の食塩水が 300 g あります。これに 10% の食塩水を何 g 加えると、8% の食塩水になりますか。
    svg: '<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="24" y="71" width="52" height="47" rx="2" fill="#7fc8f8" fill-opacity=".45"/><path d="M18,50 h4 v66 q0,4 4,4 h48 q4,0 4,-4 v-66 h4" fill="none" stroke="currentColor" stroke-width="2"/><text x="50" y="100.5" font-size="13" text-anchor="middle" fill="currentColor">5%</text><text x="50" y="144" font-size="13" text-anchor="middle" fill="currentColor">300 g</text><text x="100" y="96" font-size="18" text-anchor="middle" fill="currentColor">+</text><rect x="124" y="71" width="52" height="47" rx="2" fill="#7bc96f" fill-opacity=".45"/><path d="M118,50 h4 v66 q0,4 4,4 h48 q4,0 4,-4 v-66 h4" fill="none" stroke="currentColor" stroke-width="2"/><text x="150" y="100.5" font-size="13" text-anchor="middle" fill="currentColor">10%</text><text x="150" y="144" font-size="13" text-anchor="middle" fill="currentColor">? g</text><line x1="190" y1="90" x2="208" y2="90" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="214,90 206,94.1 206,85.9" fill="currentColor"/><rect x="229" y="64" width="62" height="54" rx="2" fill="#b39ddb" fill-opacity=".45"/><path d="M223,40 h4 v76 q0,4 4,4 h58 q4,0 4,-4 v-76 h4" fill="none" stroke="currentColor" stroke-width="2"/><text x="260" y="97" font-size="13" text-anchor="middle" fill="currentColor">8%</text><text x="260" y="144" font-size="13" text-anchor="middle" fill="currentColor">まぜる</text></svg>'
    answer: 450
    check: "[x for x in range(0, 2000) if 5 * 300 + 10 * x == 8 * (300 + x)][0]"
    hints:
      - 加える 10% の食塩水を x g としよう。
      - text: 食塩の重さは、5% の分と 10% の分の和。それぞれの食塩の重さを書きこもう。
        svg: '<svg viewBox="0 0 320 165" xmlns="http://www.w3.org/2000/svg"><rect x="24" y="61" width="52" height="47" rx="2" fill="#7fc8f8" fill-opacity=".45"/><path d="M18,40 h4 v66 q0,4 4,4 h48 q4,0 4,-4 v-66 h4" fill="none" stroke="currentColor" stroke-width="2"/><text x="50" y="90.5" font-size="13" text-anchor="middle" fill="currentColor">5%</text><text x="50" y="132" font-size="13" text-anchor="middle" fill="currentColor">300 g</text><text x="50" y="152" font-size="12" text-anchor="middle" fill="currentColor">食塩 300 × 5/100</text><rect x="134" y="61" width="52" height="47" rx="2" fill="#7bc96f" fill-opacity=".45"/><path d="M128,40 h4 v66 q0,4 4,4 h48 q4,0 4,-4 v-66 h4" fill="none" stroke="currentColor" stroke-width="2"/><text x="160" y="90.5" font-size="13" text-anchor="middle" fill="currentColor">10%</text><text x="160" y="132" font-size="13" text-anchor="middle" fill="currentColor">x g</text><text x="160" y="152" font-size="12" text-anchor="middle" fill="currentColor">食塩 x × 10/100</text><rect x="235" y="54" width="62" height="54" rx="2" fill="#b39ddb" fill-opacity=".45"/><path d="M229,30 h4 v76 q0,4 4,4 h58 q4,0 4,-4 v-76 h4" fill="none" stroke="currentColor" stroke-width="2"/><text x="266" y="87" font-size="13" text-anchor="middle" fill="currentColor">8%</text><text x="266" y="132" font-size="13" text-anchor="middle" fill="currentColor">300 + x g</text><text x="266" y="152" font-size="12" text-anchor="middle" fill="currentColor">食塩 ?</text></svg>'
