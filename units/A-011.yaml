        explain: つり合っているので、左右の重さは等しく、x + 2 = 6 と書けます。このように、わからない数をふくむ等式を方程式といいます。両方の皿から ⚪ を 2 こずつ取っても、つり合いはくずれません。式では両辺から 2 をひいて x + 2 − 2 = 6 − 2、つまり x = 4 です。方程式を成り立たせる x の値を解といい、解を求めることを、方程式を解くといいます。x = 4 を代入すると 4 + 2 = 6 となり、成り立つことがたしかめられます。
