# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員]
    uses: [S-028]
    text: あるクラスは男子 12 人、女子 18 人の 30 人です。テストのクラス全体の平均点は 62 点で、男子の平均点は女子の平均点より 5 点低かったです。女子の平均点は何点ですか。
    answer: 64
    check: "[x for x in range(0, 101) if 12 * (x - 5) + 18 * x == 62 * 30][0]"
    hints:
      - 平均点 × 人数 = 合計点 だね。クラス全体の合計点はいくつかな。
      - 女子の平均点を x 点とすると、男子の平均点はどう表せるかな。
      - 男子の合計点 + 女子の合計点 = クラスの合計点 で方程式を立てよう。
    paths:
      - [女子の平均点を x 点とする, 男子の平均点は x − 5 点, 12(x − 5) + 18x = 62 × 30 = 1860, 30x − 60 = 1860 で x = 64]
      - [男子が全員あと 5 点高ければ クラスの合計は 12 × 5 = 60 点ふえる, そのとき全員の平均が女子の平均と同じ, (1860 + 60) ÷ 30 = 64 点]
    note: 平均（S-028）は「合計 ÷ 人数」なので、グループごとの合計点で式を立てる。男子と女子の平均を足して 2 でわる間ちがい（人数がちがうので使えない）が多い。2 本目は男子の点をならす見方。
  - part: 離
    kinds: [道筋]
    text: ある本を、1 日目に全体の 1/3 より 10 ページ多く読み、2 日目に残りの 1/2 より 5 ページ少なく読みました。すると、まだ 60 ページ残っていました。この本は全部で何ページですか。
    answer: 180
    check: "[x for x in range(1, 1000) if (lambda r: r - (r / 2 - 5))(x - (Fraction(x, 3) + 10)) == 60][0]"
    hints:
      - 全体を x ページとして、1 日目に読んだあとの残りを式で表そう。
      - 2 日目に読んだあとの残りは、「残りの 1/2 より 5 ページ多い」と言いかえられるね。
      - 後ろから考える道もあるよ。最後の 60 ページから、もどってみよう。
    paths:
      - [全体を x ページとする, 1 日目の残りは 2x/3 − 10, 2 日目の残りは (2x/3 − 10)/2 + 5 = x/3, x/3 = 60 で x = 180]
      - [1 日目の残りを y ページとすると y/2 + 5 = 60 で y = 110, 110 + 10 = 120 が全体の 2/3, 全体は 180 ページ]
    note: 「残りの 1/2 より 5 ページ少なく読む」は、「残りの 1/2 より 5 ページ多く残る」と言いかえると式が簡単になる。x だけで立てると −10 と −5 の処理が続き、かっこの符号で間ちがえやすい。後ろからもどる 2 本目の道とも比べさせたい。
  - part: 離
    kinds: [数]
    text: 方程式 0.25(3x + 2) − (x − 5)/3 = 1/6 を解きましょう。x はいくつですか。
    answer: −24/5
    accept: [−4.8]
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([x for x in [Fraction(k, 5) for k in range(-200, 201)] if Fraction(1, 4) * (3 * x + 2) - (x - 5) / 3 == Fraction(1, 6)][0])"
    hints:
      - 0.25 を《分数》に直そう。
      - 両辺に、分母 4、3、6 の公《倍数》をかけて、分母をはらおう。
      - かっこを外すとき、ひき算の後ろのかっこの符号に気をつけよう。
    paths:
      - [0.25 = 1/4, 両辺に 12 をかけて 3(3x + 2) − 4(x − 5) = 2, 9x + 6 − 4x + 20 = 2, 5x = −24 で x = −24/5]
    note: 小数と分数がまざった係数。0.25 を 1/4 に直してから、分母の公倍数 12 をかける。「− 4(x − 5)」の −4 × (−5) = +20 と、右辺の 1/6 に 12 をかけ忘れる間ちがいが多い。
