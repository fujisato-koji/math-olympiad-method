        text: 方程式 3(x − 2) = x + 8 と x/2 + x/3 = 5 を解いてみましょう。
        explain: かっこのある方程式は、分配法則（A-010）でかっこを外してから解きます。3(x − 2) = x + 8 は 3x − 6 = x + 8、移項して 2x = 14、x = 7 です。《分数》のある方程式は、両辺に分母の公《倍数》をかけて分母をなくします（分母をはらう）。x/2 + x/3 = 5 の両辺に 6 をかけると 3x + 2x = 30、5x = 30、x = 6 です。両辺のすべての項に 6 をかけることに注意します。
