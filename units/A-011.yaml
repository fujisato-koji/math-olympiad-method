        id: "d6e53d6c9a"
        text: てんびんの左に、x g の箱 🟦 と 1 g のおもり ⚪ 2 こ、右に ⚪ 6 こ。つり合っているので x + 2 = 6 です。両方の皿から ⚪ を 2 こずつ取っても、つり合ったまま。だから x = 4 です。
