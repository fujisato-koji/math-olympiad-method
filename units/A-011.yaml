 ＋ b が、c とつり合う</text><text x="160" y="56" font-size="14" text-anchor="middle" fill="currentColor">両方から同じ重さ b を取ると？</text></svg>'
          - 使った等式の性質を書いて、「移したのと同じ」と結びましょう。
        paths:
          - [A + b = c とする, 両辺から b をひく（等式の性質）, A = c − b, + b がふごうを変えて右辺に移った]
          - [てんびんの左に A と b、右に c がつり合う, 両方の皿から b を取ってもつり合う, 左は A、右は c − b]
