  - day: 5
    items:
      - part: 見本
        id: "865ec4bb82"
        text: ある数の 3 倍から 4 をひくと、11 になります。ある数を x として、図のように等しい関係を見つけると 3x − 4 = 11。これを解いて、答えが合うかたしかめましょう。
        svg: '<svg viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="48" width="80" height="28" rx="2" fill="#7fc8f8" fill-opacity=".5" stroke="currentColor" stroke-width="2"/><text x="70" y="67" font-size="14" text-anchor="middle" fill="currentColor">x</text><rect x="110" y="48" width="80" height="28" rx="2" fill="#7fc8f8" fill-opacity=".5" stroke="currentColor" stroke-width="2"/><text x="150" y="67" font-size="14" text-anchor="middle" fill="currentColor">x</text><rect x="190" y="48" width="80" height="28" rx="2" fill="#7fc8f8" fill-opacity=".5" stroke="currentColor" stroke-width="2"/><text x="230" y="67" font-size="14" text-anchor="middle" fill="currentColor">x</text><rect x="206" y="48" width="64" height="28" rx="2" fill="#f08080" fill-opacity=".4" stroke="#f08080" stroke-width="2" stroke-dasharray="5 4"/><text x="238" y="92" font-size="12" text-anchor="middle" fill="currentColor">4 をひく</text><path d="M30,44 v-7 H270 v7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="150" y1="37" x2="150" y2="32.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="150" y="27.8" font-size="13" text-anchor="middle" fill="currentColor">3 倍（3x）</text><path d="M32,80 v7 H204 v-7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="118" y1="87" x2="118" y2="91.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="118" y="107.2" font-size="14" text-anchor="middle" fill="currentColor">11</text><text x="30" y="132" font-size="13" text-anchor="start" fill="currentColor">① 何を x とするか決める</text><text x="30" y="151" font-size="13" text-anchor="start" fill="currentColor">② 等しい関係を式にする：3x − 4 = 11</text><text x="30" y="170" font-size="13" text-anchor="start" fill="currentColor">③ 解く</text><text x="30" y="189" font-size="13" text-anchor="start" fill="currentColor">④ 答えが場面に合うかたしかめる</text></svg>'
        explain: 方程式を使って文章題を解く手順は、次のとおりです。① 何を x とするかを決める（ある数を x とする）。② 等しい関係を見つけて、方程式に表す（3x − 4 = 11）。③ 方程式を解く（3x = 15、x = 5）。④ 解が問題に合っているかをたしかめる（5 の 3 倍は 15、15 − 4 = 11 で合う）。答えはある数 5 です。ものの数や人数のように、答えが《整数》や正の数でなければならない場面では、解がそれに合うかも見ます。
