        text: かっこのある方程式は、かっこを外してから解きます。3(x − 2) は (x − 2) が 3 つ分なので 3x − 6。分数のある方程式は、両辺に分母の公倍数をかけて分母をなくします。x/2 + x/3 = 5 の両辺に 6 をかけると 3x + 2x = 30。
