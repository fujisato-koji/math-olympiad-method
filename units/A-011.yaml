  - part: 離
    id: "54a6dfb5e1"
    kinds: [総動員]
    uses: [A-007]
    text: A さんは家から 2.4 km はなれた駅まで行きました。最初は分速 80 m で歩き、とちゅうから分速 200 m で走ったところ、全体で 18 分かかりました。走った道のりは何 m ですか。
    svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="90" x2="290" y2="90" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="90" r="6" fill="#c8ccd6" fill-opacity=".9" stroke="currentColor" stroke-width="2"/><circle cx="290" cy="90" r="6" fill="#c8ccd6" fill-opacity=".9" stroke="currentColor" stroke-width="2"/><text x="30" y="118" font-size="14" text-anchor="middle" fill="currentColor">家</text><text x="290" y="118" font-size="14" text-anchor="middle" fill="currentColor">駅</text><circle cx="116.7" cy="90" r="5" fill="#f3c969" fill-opacity=".9" stroke="currentColor" stroke-width="2"/><text x="73.3" y="60" font-size="13" text-anchor="middle" fill="currentColor">歩く</text><text x="73.3" y="78" font-size="13" text-anchor="middle" fill="currentColor">分速 80 m</text><text x="203.3" y="60" font-size="13" text-anchor="middle" fill="currentColor">走る</text><text x="203.3" y="78" font-size="13" text-anchor="middle" fill="currentColor">分速 200 m</text><path d="M30,128 v7 H290 v-7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="160" y1="135" x2="160" y2="139.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="160" y="155.2" font-size="13" text-anchor="middle" fill="currentColor">2.4 km、全体で 18 分</text></svg>'
    answer: 1600
    check: "[200 * (18 - x) for x in range(0, 19) if 80 * x + 200 * (18 - x) == 2400][0]"
    hints:
      - 歩いた時間を x 分とすると、走った時間は 18 − x 分。
      - text: 道のり ＝ 速さ × 時間。2 つの道のりを図に書きこもう。
        svg: '<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="90" x2="290" y2="90" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="90" r="6" fill="#c8ccd6" fill-opacity=".9" stroke="currentColor" stroke-width="2"/><circle cx="290" cy="90" r="6" fill="#c8ccd6" fill-opacity=".9" stroke="currentColor" stroke-width="2"/><circle cx="116.7" cy="90" r="5" fill="#f3c969" fill-opacity=".9" stroke="currentColor" stroke-width="2"/><path d="M32,84 v-7 H114.7 v7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="73.3" y1="77" x2="73.3" y2="72.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="73.3" y="67.8" font-size="13" text-anchor="middle" fill="currentColor">80 × x m</text><path d="M118.7,84 v-7 H288 v7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="203.3" y1="77" x2="203.3" y2="72.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="203.3" y="67.8" font-size="13" text-anchor="middle" fill="currentColor">200 × (18 − x) m</text><path d="M30,100 v7 H290 v-7" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="160" y1="107" x2="160" y2="111.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><text x="160" y="127.2" font-size="13" text-anchor="middle" fill="currentColor">2400 m</text></svg>'
      - 80x + 200(18 − x) = 2400 を解こう。
    paths:
      - [歩いた時間を x 分とする, 走った時間は 18 − x 分, 80x + 200(18 − x) = 2400, −120x = −1200, x = 10, 走った時間は 8 分, 200 × 8 = 1600 m]
      - [18 分全部走ると 3600 m で 1200 m 多い, 1 分歩くと 120 m へるので 歩いたのは 10 分, 走ったのは 8 分で 1600 m]
    note: 速さの単位を m と分にそろえる。2.4 km を 2400 m に直すのをわすれやすい。
