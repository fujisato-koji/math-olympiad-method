      - part: わけ
        id: "1e04925802"
        text: 方程式 2x + 3 = 11 の解が x = 4 であることを、等式の性質を使って、すじ道を立てて書きましょう。
        explain: 例：「x が 2x + 3 = 11 を成り立たせる数だとする。等式の両辺から同じ数をひいても等式は成り立つので、両辺から 3 をひいて 2x = 8。等式の両辺を 0 でない同じ数でわっても等式は成り立つので、両辺を 2 でわって x = 4。逆に、x = 4 を代入すると 2 × 4 + 3 = 11 で成り立つ。よって、解は x = 4 である。」と書ければよい。①「〜とする」で x を決める、② 式を変形する、③ どの変形も等式の性質（約束した事実）で結ぶ、の 3 つがそろっているかを見る。x に 1、2、3、4 と数を入れて見つけただけで終わっていたら、例では「ほかに解がない」ことまでは言えないことを話す。
        hints:
          - 「x が 2x + 3 = 11 を成り立たせる数だとする」から書き始めましょう。
          - text: 1 回変形するごとに、等式の性質のどれを使ったかを書きましょう。
            svg: '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><text x="91.3" y="30" font-size="17" text-anchor="middle" fill="currentColor">2x</text><text x="128" y="30" font-size="17" text-anchor="middle" fill="currentColor">+ 3</text><text x="160" y="30" font-size="17" text-anchor="middle" fill="currentColor">=</text><text x="188.8" y="30" font-size="17" text-anchor="middle" fill="currentColor">11</text><text x="131.2" y="92" font-size="17" text-anchor="middle" fill="currentColor">2x</text><text x="160" y="92" font-size="17" text-anchor="middle" fill="currentColor">=</text><text x="183.7" y="92" font-size="17" text-anchor="middle" fill="currentColor">8</text><text x="136.3" y="154" font-size="17" text-anchor="middle" fill="currentColor">x</text><text x="160" y="154" font-size="17" text-anchor="middle" fill="currentColor">=</text><text x="183.7" y="154" font-size="17" text-anchor="middle" fill="currentColor">4</text><line x1="60" y1="40" x2="60" y2="68" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="60,74 55.9,66 64.1,66" fill="currentColor"/><line x1="60" y1="102" x2="60" y2="130" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="60,136 55.9,128 64.1,128" fill="currentColor"/><rect x="70" y="46" width="74" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><text x="107" y="62" font-size="12" text-anchor="middle" fill="currentColor">どの性質？</text><rect x="70" y="108" width="74" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/><text x="107" y="124" font-size="12" text-anchor="middle" fill="currentColor">どの性質？</text></svg>'
          - 最後に、x = 4 を代入してたしかめた文も書きましょう。
