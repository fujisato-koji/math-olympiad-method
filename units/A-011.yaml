  - part: 離
    id: "8e9a91499e"
    kinds: [総動員]
    uses: [A-010]
    text: 2 けたの整数があります。十の位の数は一の位の数より 3 大きく、各位の数の和は 11 です。この整数はいくつですか。
    svg: '<svg viewBox="0 0 320 165" xmlns="http://www.w3.org/2000/svg"><rect x="80" y="50" width="70" height="80" rx="8" fill="#7fc8f8" fill-opacity=".4" stroke="currentColor" stroke-width="2"/><text x="115" y="100" font-size="22" text-anchor="middle" fill="currentColor">?</text><text x="115" y="150" font-size="13" text-anchor="middle" fill="currentColor">十の位</text><rect x="170" y="50" width="70" height="80" rx="8" fill="#7bc96f" fill-opacity=".4" stroke="currentColor" stroke-width="2"/><text x="205" y="100" font-size="22" text-anchor="middle" fill="currentColor">?</text><text x="205" y="150" font-size="13" text-anchor="middle" fill="currentColor">一の位</text><text x="160" y="30" font-size="14" text-anchor="middle" fill="currentColor">2 けたの整数</text></svg>'
    answer: 74
    check: "[10 * (x + 3) + x for x in range(0, 10) if x + (x + 3) == 11][0]"
    hints:
      - text: 一の位の数を x とすると、十の位の数は x + 3。
        svg: '<svg viewBox="0 0 320 165" xmlns="http://www.w3.org/2000/svg"><rect x="80" y="50" width="70" height="80" rx="8" fill="#7fc8f8" fill-opacity=".4" stroke="currentColor" stroke-width="2"/><text x="115" y="98" font-size="17" text-anchor="middle" fill="currentColor">x + 3</text><text x="115" y="150" font-size="13" text-anchor="middle" fill="currentColor">十の位</text><rect x="170" y="50" width="70" height="80" rx="8" fill="#7bc96f" fill-opacity=".4" stroke="currentColor" stroke-width="2"/><text x="205" y="98" font-size="20" text-anchor="middle" fill="currentColor">x</text><text x="205" y="150" font-size="13" text-anchor="middle" fill="currentColor">一の位</text><text x="160" y="30" font-size="14" text-anchor="middle" fill="currentColor">2 つの数の和が 11</text></svg>'
      - 各位の数の和が 11 です。
      - x + (x + 3) = 11 を解いて、整数を組み立てよう。
    paths:
      - [一の位を x とする, 十の位は x + 3, x + (x + 3) = 11, 2x = 8, x = 4, 十の位は 7, 整数は 74]
      - [和 11 と差 3 から, 十の位は (11 + 3) ÷ 2 = 7、一の位は 4, 整数は 74]
    note: 2 けたの整数は 10 × 十の位 + 一の位。位の数を求めたあと、整数に組み立てる。
