# A-011 1 次方程式（つり合いで解く）
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習 4 日、わけ、混ぜる、確認）で作った。
#   1 日目：方程式とその解（代入して確かめる）、てんびんのつり合いと等式の性質（両辺に同じ数を足す・ひく）。
#   2 日目：等式の性質（両辺に同じ数をかける、両辺を 0 でない同じ数でわる）、負の数の係数。
#   3 日目：移項（ax + b = c、ax + b = cx + d）、解が負の数や分数になるもの。
#   4 日目：かっこと分数の係数（分配法則でかっこを外す、両辺に分母の公倍数をかけて分母をはらう）。
#   5 日目：方程式を立てる（何を x とするか決める、等しい関係を式にする、解く、答えを場面で確かめる）。
#   6 日目：わけ。7 日目：A-010、A-001、N-027 と混ぜる。8 日目：確認。
# 前提は A-010（文字と式）、A-001（てんびん）、N-027（正負の数のかけ算とわり算）。
#   小数（N-020）は前提にないので、小数の係数は扱わない。解が 5/2 のように小数でも書けるときは accept に小数も入れた。
# 文章題の型（和差、つるかめ、過不足、植木）は A-014、連立方程式は A-012 で扱う。比例式（a:b = c:d）は A-005 が前提にないので扱わない。
#   5 日目の文章題は「ある数」、代金、連続する整数、平均など、1 つの量を x とすれば立つものにした。
# てんびんの図は balance（D-042、A-001 と同じ書き方）。つり合ったてんびんは tilt: level。
#   🟦 は重さのわからない箱（x g）、⚪ は 1 g のおもり、🟥 は別の重さのわからない箱。
# 答えは解の値を打つ。check は解を Fraction で計算し、負の数は「−」（U+2212）の形にそろえる（N-004 の書き方）。
#   解を選ぶ問題と式を選ぶ問題の check は、選択肢ごとに代入して、成り立つものを選び出す。
# わけの日は、段 4 の深さ（「〜とする」で文字を決める、式を変形する、約束した事実（等式の性質）で結ぶ）の 2 問と、
#   水準 2 の単元なので、代表の例で文に書く ② の 1 問（てんびん）にした。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-005、N-020 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-011
days:
  - day: 1
    items:
      - part: 見本
        text: てんびんの左に、重さ x g の箱 🟦 と 1 g のおもり ⚪ 2 こ、右に ⚪ 6 こをのせると、つり合いました。x を求めましょう。
        balance: {left: "🟦⚪⚪", right: "⚪⚪⚪⚪⚪⚪", tilt: level}
        explain: つり合っているので、左右の重さは等しく、x + 2 = 6 と書けます。このように、わからない数をふくむ等式を方程式といいます。両方の皿から ⚪ を 2 こずつ取っても、つり合いはくずれません。式では両辺から 2 をひいて x + 2 − 2 = 6 − 2、つまり x = 4 です。方程式を成り立たせる x の値を解といい、解を求めることを、方程式を解くといいます。x = 4 を代入すると 4 + 2 = 6 となり、成り立つことが確かめられます。
      - part: 思い出す
        text: x = 4 のとき、3x − 5 の値はいくつですか。
        answer: 7
        check: "3 * 4 - 5"
        hints:
          - 3x は 3 × x のことです。
          - x に 4 を代入しましょう。
          - かけ算を先に計算しましょう。
        paths:
          - [3 × 4 − 5, 12 − 5, 7]
      - part: 思い出す
        text: (−24) ÷ 4 を計算しましょう。
        answer: −6
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-24, 4))"
        hints:
          - まず、符号を考えずに 24 ÷ 4 を計算しましょう。
          - 負の数を正の数でわると、符号はどうなるでしょう。
          - 符号のちがう 2 つの数のわり算は、負になります。
        paths:
          - [24 ÷ 4 = 6, 符号がちがうので負, −6]
      - part: 今日
        text: 次のうち、方程式 3x − 2 = 13 の解はどれですか。
        choices: [x = 5, x = 4, x = 6]
        answer: x = 5
        check: "[c for c, v in {'x = 5': 5, 'x = 4': 4, 'x = 6': 6}.items() if 3 * v - 2 == 13][0]"
        hints:
          - 解とは、方程式を成り立たせる x の値です。
          - それぞれの値を、左辺の 3x − 2 に代入してみましょう。
          - 左辺の値が、右辺の 13 と等しくなるものを選びましょう。
        paths:
          - [x = 5 のとき 15 − 2 = 13, 右辺と等しい, x = 5]
        note: 代入して確かめる方法は、どんな方程式でも答えの確かめに使える。
      - part: 今日
        text: てんびんがつり合っています。🟦 は x g の箱、⚪ は 1 g のおもりです。x はいくつですか。
        balance: {left: "🟦⚪", right: "⚪⚪⚪⚪⚪⚪⚪", tilt: level}
        answer: 6
        check: "7 - 1"
        hints:
          - 左右の重さを、式で書きましょう。
          - 両方の皿から、同じ数の ⚪ を取ってもつり合います。
          - 左に 🟦 だけが残るように取りましょう。
        paths:
          - [x + 1 = 7, 両辺から 1 をひく, x = 6]
      - part: 今日
        text: 方程式 x − 6 = 9 を解きましょう。x はいくつですか。
        answer: 15
        check: "9 + 6"
        hints:
          - 左辺を x だけにしたいので、− 6 を消すことを考えましょう。
          - 等式の両辺に同じ数を足しても、等式は成り立ちます。
          - 両辺に 6 を足しましょう。
        paths:
          - [両辺に 6 を足す, x − 6 + 6 = 9 + 6, x = 15]
        note: 両辺から 6 をひいて 3 としやすい。− 6 を消すには、6 を足す。
      - part: 挑戦
        text: 方程式 x + 8 = 3 を解きましょう。x はいくつですか。
        answer: −5
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(3 - 8))"
        hints:
          - 両辺から同じ数をひいても、等式は成り立ちます。
          - 両辺から 8 をひきましょう。
          - 3 − 8 は、《正負の数》の計算（N-010）で求めましょう。
        paths:
          - [両辺から 8 をひく, x = 3 − 8, x = −5]
        note: てんびんでは考えにくいが、等式の性質は負の数でも同じように使える。x = −5 を代入して確かめさせる。
    extra:
      - part: 今日
        text: 方程式 x + 9 = 15 を解きましょう。x はいくつですか。
        answer: 6
        check: "15 - 9"
        hints:
          - 左辺を x だけにしたいので、+ 9 を消すことを考えましょう。
          - 等式の両辺から同じ数をひいても、等式は成り立ちます。
          - 両辺から 9 をひきましょう。
        paths:
          - [両辺から 9 をひく, x = 15 − 9, x = 6]
      - part: 今日
        text: 方程式 x − 4 = −1 を解きましょう。x はいくつですか。
        answer: 3
        check: "-1 + 4"
        hints:
          - − 4 を消すには、両辺に何を足せばよいでしょう。
          - 両辺に 4 を足しましょう。
          - −1 + 4 は、《数直線》で考えましょう。
        paths:
          - [両辺に 4 を足す, x = −1 + 4, x = 3]
      - part: 挑戦
        text: 次のうち、方程式 5 − x = 2x − 4 の解はどれですか。
        choices: [x = 3, x = 2, x = −3]
        answer: x = 3
        check: "[c for c, v in {'x = 3': 3, 'x = 2': 2, 'x = −3': -3}.items() if 5 - v == 2 * v - 4][0]"
        hints:
          - それぞれの値を、左辺と右辺の両方に代入しましょう。
          - 左辺の値と右辺の値を、それぞれ計算しましょう。
          - 2 つの値が等しくなるものを選びましょう。
        paths:
          - [x = 3 のとき 左辺 5 − 3 = 2、右辺 6 − 4 = 2, 等しい, x = 3]
        note: 両辺に x があるときも、代入すれば解かどうかを確かめられる。解き方は 3 日目。

  - day: 2
    items:
      - part: 見本
        text: てんびんの左に 🟦 を 3 こ、右に ⚪ を 9 このせると、つり合いました。🟦 1 こは何 g でしょう。
        balance: {left: "🟦🟦🟦", right: "⚪⚪⚪⚪⚪⚪⚪⚪⚪", tilt: level}
        explain: 式では 3x = 9 です。両方の皿の重さを、それぞれ 3 等分しても、つり合いはくずれません。式では両辺を 3 でわって x = 3 です。等式の性質として、両辺に同じ数を足しても、ひいても、かけても、0 でない同じ数でわっても、等式は成り立ちます。たとえば x/2 = 5 なら両辺に 2 をかけて x = 10、−2x = 8 なら両辺を −2 でわって x = −4 です。0 でわることはできないので、「0 でない」がつきます。
      - part: 思い出す
        text: 方程式 x + 5 = 2 を解きましょう。x はいくつですか。
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(2 - 5))"
        hints:
          - + 5 を消すには、両辺から何をひけばよいでしょう。
          - 両辺から 5 をひきましょう。
          - 2 − 5 は、《正負の数》の計算で求めましょう。
        paths:
          - [両辺から 5 をひく, x = 2 − 5, x = −3]
      - part: 思い出す
        text: (−36) ÷ (−4) を計算しましょう。
        answer: 9
        check: "Fraction(-36, -4)"
        hints:
          - まず、符号を考えずに 36 ÷ 4 を計算しましょう。
          - 負の数を負の数でわると、符号はどうなるでしょう。
          - 同じ符号の 2 つの数のわり算は、正になります。
        paths:
          - [36 ÷ 4 = 9, 同じ符号なので正, 9]
      - part: 今日
        text: 方程式 4x = 28 を解きましょう。x はいくつですか。
        answer: 7
        check: "Fraction(28, 4)"
        hints:
          - 4x は 4 × x のことです。
          - 左辺を x だけにするには、両辺を何でわればよいでしょう。
          - 両辺を 4 でわりましょう。
        paths:
          - [両辺を 4 でわる, x = 28 ÷ 4, x = 7]
      - part: 今日
        text: 方程式 x/3 = 6 を解きましょう。x はいくつですか。
        answer: 18
        check: "6 * 3"
        hints:
          - x/3 は、x を 3 でわった数です。
          - 左辺を x だけにするには、両辺に何をかければよいでしょう。
          - 両辺に 3 をかけましょう。
        paths:
          - [両辺に 3 をかける, x = 6 × 3, x = 18]
        note: 両辺を 3 でわって 2 としやすい。÷ 3 を消すには × 3。
      - part: 今日
        text: 方程式 −5x = 30 を解きましょう。x はいくつですか。
        answer: −6
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(30, -5))"
        hints:
          - −5x は (−5) × x のことです。
          - 両辺を −5 でわりましょう。
          - 30 ÷ (−5) の符号に気をつけましょう。
        paths:
          - [両辺を −5 でわる, x = 30 ÷ (−5), x = −6]
        note: 両辺を 5 でわって −x = 6 で止めやすい。x の係数が −1 のときは、もう一度 −1 でわる。
      - part: 挑戦
        text: 方程式 2x/3 = 8 を解きましょう。x はいくつですか。
        answer: 12
        check: "Fraction(8 * 3, 2)"
        hints:
          - 2x/3 は、2x を 3 でわった数です。
          - まず、両辺に 3 をかけて、分母をなくしましょう。
          - そのあと、x の係数で両辺をわりましょう。
        paths:
          - [両辺に 3 をかける, 2x = 24, 両辺を 2 でわって x = 12]
          - [2x/3 は 2/3 × x, 両辺に 3/2 をかける, x = 12]
    extra:
      - part: 今日
        text: 方程式 6x = −42 を解きましょう。x はいくつですか。
        answer: −7
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-42, 6))"
        hints:
          - 両辺を何でわれば、左辺が x だけになるでしょう。
          - 両辺を 6 でわりましょう。
          - (−42) ÷ 6 の符号に気をつけましょう。
        paths:
          - [両辺を 6 でわる, x = (−42) ÷ 6, x = −7]
      - part: 今日
        text: 方程式 x/4 = −3 を解きましょう。x はいくつですか。
        answer: −12
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(-3 * 4)"
        hints:
          - x/4 は、x を 4 でわった数です。
          - 両辺に 4 をかけましょう。
          - (−3) × 4 の符号に気をつけましょう。
        paths:
          - [両辺に 4 をかける, x = (−3) × 4, x = −12]
      - part: 挑戦
        text: 方程式 4x = 10 を解きましょう。x はいくつですか。
        answer: 5/2
        accept: [2.5]
        check: "Fraction(10, 4)"
        hints:
          - 両辺を 4 でわりましょう。
          - 10 ÷ 4 はわり切れる《整数》になるでしょうか。
