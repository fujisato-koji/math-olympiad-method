          - 4x を左辺に、− 2 を右辺に移項すると、符号はどうなるでしょう。
          - 両辺をまとめてから、x の係数でわりましょう。
        paths:
          - [7x − 4x = 13 + 2, 3x = 15, x = 5]
        note: 移項するときに符号を変え忘れて 7x + 4x = 13 − 2 としやすい。移した項だけ符号が変わる。
      - part: 今日
        text: 方程式 5x + 8 = 2x − 7 を解きましょう。x はいくつですか。
