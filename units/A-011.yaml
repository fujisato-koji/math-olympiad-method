fill-opacity=".5" stroke="currentColor" stroke-width="2"/><text x="150" y="115" font-size="14" text-anchor="middle" fill="currentColor">k</text><rect x="172" y="96" width="14" height="28" rx="0" fill="#f08080" fill-opacity=".5" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="179" y="140" font-size="12" text-anchor="middle" fill="currentColor">700 円</text><path d="M253,72 C253,92 190,80 182,92" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="182,92 183,83.1 189.8,87.6" fill="currentColor"/><text x="160" y="176" font-size="14" text-anchor="middle" fill="currentColor">わたしたあと、A と B のひは 3：2</text></svg>'
      - ひが 3：2 なので、2(5k − 700) = 3(3k + 700) を解こう。
