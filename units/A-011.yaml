        paths:
          - [4 を移項して 3x = 25 − 4, 3x = 21, x = 7]
      - part: 今日
        text: 方程式 7x − 2 = 4x + 13 を解きましょう。x はいくつですか。
        answer: 5
        check: "Fraction(13 + 2, 7 - 4)"
        hints:
