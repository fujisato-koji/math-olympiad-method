        paths:
          - [両辺を 4 でわる, x = 10/4, 約分して x = 5/2]
        note: 解は整数とはかぎらない。10/4 のままでなく、約分した形で答える。

  - day: 3
    items:
      - part: 見本
        text: 方程式 2x + 5 = 17 と 5x − 3 = 2x + 9 を解いてみましょう。
        explain: 2x + 5 = 17 の両辺から 5 をひくと 2x = 17 − 5 です。左辺の + 5 が、符号を変えて右辺の − 5 に移ったように見えます。このように、等式の一方の辺の項を、符号を変えて他方の辺に移すことを移項といいます。2x = 12 なので x = 6 です。5x − 3 = 2x + 9 では、x の項を左辺に、数の項を右辺に移項して 5x − 2x = 9 + 3、3x = 12 なので x = 4 です。
      - part: 思い出す
        text: 方程式 −3x = 21 を解きましょう。x はいくつですか。
        answer: −7
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(21, -3))"
        hints:
          - 両辺を何でわれば、左辺が x だけになるでしょう。
          - 両辺を −3 でわりましょう。
          - 21 ÷ (−3) の符号に気をつけましょう。
        paths:
