# K-123 手で並べ替える
#
# 段 1・水準 1・4 日。てんびんで 2 つずつ比べて重い順に並べること、背の順に並ぶこと、並べる手順を言うことを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 てんびんで 2 つずつ比べて重い順（2〜3 つの結果を
#   つなぐ、あと 1 回比べる組、4 つの並び）、2 日目 背の順（頭のてっぺんで比べる、となりの 2 人を入れかえる、あとから
#   来た子の入る所、ふみだいの分）、3 日目 わけ（重い方を手に残して次と比べる手順と、最後に残った物がいちばん重いわけ。
#   手順のとちゅうの次の組、手順のまちがい、軽い方を残す手順、2 番目に重い物）、4 日目 確認（1〜3 日目を混ぜる）。
# 前提は K-122（命令を順に並べる、まちがいを見つけて直す）と A-001（てんびんで重い方、3 つを重い順）。数は 5 までで、
#   子は図を数えれば答えが出る（式は保護者用の check と paths だけ）。
# 図の約束：はこはどれも同じ大きさの角の丸い四角で、記号ごとに色を決めた（ア 赤、イ 空色、ウ 黄、エ 緑、オ 紫）。てんびんは
#   台と柱と横の棒と 2 枚のさらで、重い方のさらが下がる。子どもは丸い頭と服と足で描き、服の色は記号の色（記号のない子は灰、
#   あとから来た子は紫）。並ぶ向きは左が前（「まえ」の矢印）。ヒントの頭の高さの線は赤い点線、よいところは緑の丸か枠。
#   手順の図は 1 かい目から 3 かい目を左から並べ、手に残した箱を「のこす」の下に描く。
# 並べ方の名前（選んで並べる、となりと入れかえる）と、比べる回数を数えることは K-125 で扱うので、ここでは名前を付けず、回数も問わない。
# check：選ぶ問題は答えをそのまま書く。数の問題は、図の中のてんびんや人の数の差と和で書いた。答えは作るときに全部の
#   てんびんの結果をつないで（人は高さを並べて）確かめ、ほかの選択肢では図と食い違うことも確かめた。

id: K-123
days:
