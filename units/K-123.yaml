r" stroke-width="2"/><text x="288" y="118.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">イ</text><text x="238" y="150" font-size="13" text-anchor="middle" fill="currentColor">おもい</text><text x="288" y="150" font-size="13" text-anchor="middle" fill="currentColor">かるい</text><text x="263" y="182" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">ア → イ</text></svg>'
        explain: |-
          この たんげんでは、てんびんで 2 つずつ おもさを くらべます。3 つ より おおい ときは、2 つずつ くらべた けっかを つなげて いきます。ア が イ より おもく、イ が ウ より おもければ、ア と ウ は くらべなくても、ア の ほうが おもいと わかります。いちども 上がらなかった ものが いちばん おもく、いちども 下がらなかった ものが いちばん かるい ものです。コンピュータも、2 つずつ くらべる ことを くりかえして、たくさんの ものを ならべかえます。
          きょうは「2 つずつ くらべた けっかを つないで、おもい じゅんに ならべる」が できれば よい。おうちでは、おなじ 大きさの ふくろに ちがう ものを 入れ、ハンガーと ひもで つくった てんびんに つるして くらべると よい。大きさや 見た目では なく、てんびんの ようすで きめる ように する。
