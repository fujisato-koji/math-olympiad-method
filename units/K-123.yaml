    items:
      - part: 見本
        text: |-
          てんびんに 2 つ のせると、おもい ほうの さらが 下がります。
          3 つでも 4 つでも、2 つずつ くらべて いけば、おもい じゅんに ならべられます。
          おもい ものから 左に ならべて、「ア → イ」の ように かきます。
