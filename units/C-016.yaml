  - part: 離
    kinds: [手数, 読み取り]
    text: (1 + 2x)⁷ を展開した式で、係数がいちばん大きい項の係数はいくつですか。
    answer: 672
    check: "max(sum(1 for c in itertools.combinations(range(7), k)) * 2 ** k for k in range(8))"
    hints:
      - xᵏ の係数は ₇Cₖ × 2ᵏ だね。
      - k = 0、1、2、… と順に係数を出して並べよう。
