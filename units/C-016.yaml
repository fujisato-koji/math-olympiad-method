        explain: 例：「二項定理より、(a + b)ⁿ = ₙC₀aⁿ + ₙC₁aⁿ⁻¹b + … + ₙCₙbⁿ は、a と b がどんな数でも成り立つ。a = 1、b = 1 とすると、1 は何回かけても 1 なので、右がわは ₙC₀ + ₙC₁ + … + ₙCₙ になる。左がわは (1 + 1)ⁿ = 2ⁿ。だから ₙC₀ + ₙC₁ + … + ₙCₙ = 2ⁿ。」と書ければよい。① 二項定理の式をとる、② a = 1、b = 1 を代入して両がわを計算する、③ 等式で結ぶ、の 3 点を見る。C-015 では「1 こずつ選ぶか選ばないかで 2ⁿ」と数えたが、ここでは式に数を入れてしめしている。2 つの道で同じ結果が出ることにふれる。a = 1、b = −1 とすると ₙC₀ − ₙC₁ + ₙC₂ − … = 0 になることも話すとよい。
        hints:
          - 二項定理の式で、a と b にどんな数を入れると、右がわが ₙCᵣ の和だけになるかな。
          - text: a = 1、b = 1 を入れると、左がわはいくつかな。
