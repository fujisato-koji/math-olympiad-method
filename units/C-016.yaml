        explain: 例：「(a + b)ⁿ を、n このかっこ (a + b) の積とする。分配法則でかけ出すと、n このかっこから a か b を 1 つずつ選んでかけた項が、選び方の数だけ出て、それを全部たしたものになる。aⁿ⁻ʳbʳ になるのは、b を r このかっこから選び、残りの n − r このかっこから a を選ぶとき。b を選ぶ r このかっこの選び方は ₙCᵣ 通りで、どれも aⁿ⁻ʳbʳ になる。だから aⁿ⁻ʳbʳ は ₙCᵣ こ出て、係数は ₙCᵣ。」と書ければよい。① (a + b)ⁿ を n このかっこの積とする、② かけ出すことを「1 つずつ選ぶこと」に言いかえ、同じ項を集める、③ ₙCᵣ の意味（n こから r こを選ぶ数）で結ぶ、の 3 点を見る。(a + b)³ の例だけで終わったら、例ではすべての n をしめせないことを話す。
