t x="182" y="74" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="194" y="58" width="20" height="22" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="204" y="74" font-size="14" text-anchor="middle" fill="currentColor">a</text><rect x="216" y="58" width="20" height="22" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="226" y="74" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="172" y="84" width="20" height="22" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="182" y="100" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="194" y="84" width="20" height="22" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="204" y="100" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="216" y="84" width="20" height="22" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="226" y="100" font-size="14" text-anchor="middle" fill="currentColor">a</text><text x="204" y="132" font-size="16" text-anchor="middle" fill="currentColor">ab²</text><text x="204" y="154" font-size="14" text-anchor="middle" fill="#e06c6c" font-weight="bold">3 こ</text><line x1="164" y1="30" x2="164" y2="160" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35" stroke-dasharray="4 3"/><rect x="252" y="32" width="20" height="22" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="262" y="48" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="274" y="32" width="20" height="22" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="284" y="48" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="296" y="32" width="20" height="22" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="306" y="48" font-size="14" text-anchor="middle" fill="currentColor">b</text><text x="284" y="132" font-size="16" text-anchor="middle" fill="currentColor">b³</text><text x="284" y="154" font-size="14" text-anchor="middle" fill="#e06c6c" font-weight="bold">1 こ</text><line x1="244" y1="30" x2="244" y2="160" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35" stroke-dasharray="4 3"/><text x="160" y="186" font-size="15" text-anchor="middle" fill="currentColor">(a + b)³ = a³ + 3a²b + 3ab² + b³</text></svg>'
        explain: (a + b)³ = (a + b)(a + b)(a + b) を展開すると、3 つのかっこから a か b を 1 つずつ選んでかけた項が、2 × 2 × 2 = 8 こ出てきて、それを全部たしたものになります。a²b になるのは、b を選ぶかっこを 3 つから 1 つ選ぶときで、₃C₁ = 3 こあります（図の aab、aba、baa）。同じように ab² は ₃C₂ = 3 こ、a³ と b³ は 1 こずつです。だから (a + b)³ = a³ + 3a²b + 3ab² + b³。係数 1、3、3、1 はパスカルの三角形の 3 だん目です。どんな n でも、(a + b)ⁿ を展開したときの aⁿ⁻ʳbʳ の係数は ₙCᵣ です。これを二項定理といいます。
