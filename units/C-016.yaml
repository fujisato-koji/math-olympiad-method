    note: 係数を 8 つ順に出し、いちばん大きいものを選ぶ。₇Cₖ だけを見て x³ や x⁴ を選びやすい（2ᵏ をかけるので、山のてっぺんが右へずれる）。2 本目は、となりの係数の比で山のてっぺんを見つける道。
