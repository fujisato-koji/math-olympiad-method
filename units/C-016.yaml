        text: (a + b)³ を展開すると、a²b の係数は 3 です。なぜ 3 になるのかを、3 つのかっこから選ぶことを使って書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">(a + b)(a + b)(a + b) で a²b になる選び方</text><rect x="98" y="42" width="26" height="28" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="111" y="61" font-size="14" text-anchor="middle" fill="currentColor">a</text><rect x="128" y="42" width="26" height="28" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="141" y="61" font-size="14" text-anchor="middle" fill="currentColor">a</text><rect x="158" y="42" width="26" height="28" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="171" y="61" font-size="14" text-anchor="middle" fill="currentColor">b</text><text x="198" y="62" font-size="15" text-anchor="start" fill="currentColor">→ a²b</text><rect x="98" y="82" width="26" height="28" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="111" y="101" font-size="14" text-anchor="middle" fill="currentColor">a</text><rect x="128" y="82" width="26" height="28" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="141" y="101" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="158" y="82" width="26" height="28" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="171" y="101" font-size="14" text-anchor="middle" fill="currentColor">a</text><text x="198" y="102" font-size="15" text-anchor="start" fill="currentColor">→ a²b</text><rect x="98" y="122" width="26" height="28" rx="5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="111" y="141" font-size="14" text-anchor="middle" fill="currentColor">b</text><rect x="128" y="122" width="26" height="28" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="141" y="141" font-size="14" text-anchor="middle" fill="currentColor">a</text><rect x="158" y="122" width="26" height="28" rx="5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="171" y="141" font-size="14" text-anchor="middle" fill="currentColor">a</text><text x="198" y="142" font-size="15" text-anchor="start" fill="currentColor">→ a²b</text><text x="160" y="182" font-size="14" text-anchor="middle" fill="currentColor">b を選んだかっこは、3 つのうちの 1 つ</text></svg>'
        explain: 例：「(a + b)(a + b)(a + b) を分配法則でかけ出すと、3 つのかっこから a か b を 1 つずつ選んでかけた項が全部出る。a²b になるのは、a を 2 つのかっこから、b を 1 つのかっこから選ぶとき。b を選ぶかっこが 1 番目、2 番目、3 番目のどれかで、baa、aba、aab の 3 通り。だから a²b が 3 こ出て、係数は 3 = ₃C₁。」と書ければよい。「かけ出す = 1 つずつ選ぶ」ことと、「同じ項が何こ出るか = 選び方の数」が書けているかを見る。
        hints:
          - かっこを全部かけ出すと、どんな項が出てくるかな。
          - text: a²b になるのは、b を 1 つのかっこから選ぶとき。b をどのかっこから選ぶかを考えよう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="28" r="14" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="160" y="33" font-size="14" text-anchor="middle" fill="currentColor">b</text><line x1="160" y1="46" x2="160" y2="58" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,66 155.6,58 164.4,58" fill="currentColor"/><rect x="60" y="74" width="52" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="65" y1="109" x2="107" y2="109" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" stroke-dasharray="4 3"/><circle cx="86" cy="125.8" r="16" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="4 3"/><text x="86" y="100" font-size="15" text-anchor="middle" fill="currentColor">a</text><text x="86" y="130.8" font-size="15" text-anchor="middle" fill="currentColor">b</text><rect x="134" y="74" width="52" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="139" y1="109" x2="181" y2="109" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" stroke-dasharray="4 3"/><circle cx="160" cy="125.8" r="16" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="4 3"/><text x="160" y="100" font-size="15" text-anchor="middle" fill="currentColor">a</text><text x="160" y="130.8" font-size="15" text-anchor="middle" fill="currentColor">b</text><rect x="208" y="74" width="52" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="213" y1="109" x2="255" y2="109" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" stroke-dasharray="4 3"/><circle cx="234" cy="125.8" r="16" fill="none" stroke="#f08080" stroke-width="2" stroke-dasharray="4 3"/><text x="234" y="100" font-size="15" text-anchor="middle" fill="currentColor">a</text><text x="234" y="130.8" font-size="15" text-anchor="middle" fill="currentColor">b</text><text x="160" y="172" font-size="14" text-anchor="middle" fill="currentColor">b をどのかっこから選ぶ？</text></svg>'
          - 「b を選ぶかっこの選び方の数」と「a²b が何こ出るか」を結んで書こう。
