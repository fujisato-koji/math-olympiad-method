# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 道筋]
    uses: [A-016]
    text: (1 + √2)⁵ + (1 − √2)⁵ を計算すると、いくつになりますか。
    answer: 82
    check: "sum(math.comb(5, k) * 2 ** (k // 2) * (1 + (-1) ** k) for k in range(6))"
    hints:
      - (1 + √2)⁵ と (1 − √2)⁵ を、それぞれ二項定理で展開して、項を並べてみよう。
      - √2 の奇数乗の項は、2 つの式で符号が反対になるね。たすとどうなるかな。
      - (√2)² = 2、(√2)⁴ = 4 を使おう。
    paths:
      - [(1 + √2)⁵ = 1 + 5√2 + 10(√2)² + 10(√2)³ + 5(√2)⁴ + (√2)⁵, (1 − √2)⁵ は √2 の奇数乗の項の符号が − になる, たすと奇数乗の項は消えて 2 × (1 + 10 × 2 + 5 × 4), 2 × 41 = 82]
    note: 二項定理と平方根（A-016）を合わせる。1 つずつ計算すると (1 + √2)⁵ = 41 + 29√2 を出してからたすことになり、長い。−√2 の奇数乗で符号が変わり、打ち消し合うことに目を付ける。最後に 2 倍するのを忘れて 41 と答えたり、(√2)⁴ を 2 として 62 にしたりしやすい。
  - part: 離
    kinds: [数]
    text: (2x − 3)⁵ を展開したとき、x² の係数はいくつですか。
    answer: −1080
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(sum(2 ** sum(c) * (-3) ** (5 - sum(c)) for c in itertools.product((0, 1), repeat=5) if sum(c) == 2))"
    hints:
      - 5 個のかっこのうち、どれから 2x を選び、どれから −3 を選ぶかを考えよう。
      - x² になるのは、2x を 2 個、−3 を 3 個選ぶときだね。選び方は何通りかな。
