# C-016 二項定理
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の漢字まじりの文。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 (a + b)ⁿ の展開は、n 個のかっこから a か b を 1 つずつ選んでかけたものの和。aⁿ⁻ʳbʳ の係数は ₙCᵣ（二項定理）。係数はパスカルの三角形の段、
#   2 日目 (x + 2)ⁿ、(2x + 1)ⁿ、(x − 1)ⁿ の係数（ₙCᵣ に数の累乗をかける。負の数の累乗で符号が変わる）、係数の和（x = 1 を代入）、
#   3 日目 わけ（なぜ a²b の係数が ₃C₁ か、なぜ aⁿ⁻ʳbʳ の係数が ₙCᵣ か、なぜ ₙC₀ + ₙC₁ + … + ₙCₙ = 2ⁿ か）、
#   4 日目 A-015（展開と因数分解）・C-015（ₙCᵣ とパスカルの三角形）・A-009（指数法則）と混ぜる、5 日目 確認。
# 前提は C-015、A-015、A-009（→ A-010、N-027 など）。数は 1000 まで（N-073 は前提にない）。11³ = 1331 のような 1000 をこえる数の計算には使わない。
# 指数は上つきの数字で書く（x²、a³b）。0 乗と負の指数（A-009 の外）は使わないので、(x + 1/x)ⁿ の定数項のような問題は出さない。
# 係数の答えは負の数もある（段 4 の鍵盤で「−」を打てる）。check では、負の数を「−」（U+2212）の形の文字にして答えと比べる。
# わけは段 4 の ③：explain に、①「〜とする」で文字を決める、② 展開を「かっこから 1 つずつ選ぶ」と言いかえる・文字に数を入れる、③ ₙCᵣ の意味で結ぶ、の 3 点を書いた。
#   1 問目は代表の例（(a + b)³）で書く ②。
# 多項定理（(a + b + c)ⁿ）と、母関数としての使い方（C-026）、確率への使い方（二項分布、S-002）は後ろの単元なので出さない。
# check：係数は、n 個のかっこのどれから x（または b）を選ぶかを itertools.product で全部作り、選んだ項の係数の積をたして出す。
#   展開した式を選ぶ問題は、選択肢ごとの式（lambda）が元の式とどの数でも等しいかを、−3 から 3 までの数で確かめる。
# 図（D-129〜D-131）：かっこ 1 つを、上に 1 つ目の項、下に 2 つ目の項を書いたわくでかき、選んだ項に色の丸を付ける（1 つ目の項は空色、2 つ目の項は赤）。
#   係数を問う問題には「その項になる選び方の 1 つ」の図を付け、ヒントは「選ぶかっこを決める」図とパスカルの三角形（C-015 と同じかき方）で一歩手前まで見せる。
# 5 日目の 7 問目と 8 問目は、3 日目・1 日目の extra と同じ問題だったので、₆C₀ + … + ₆C₆ と (x − 1)³ の展開を選ぶ問題にかえた（答えがかわるので id を消した）。

