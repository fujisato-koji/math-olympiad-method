# G-054 円の接線と接弦定理（接線と半径、接線の長さ、接線と弦のつくる角）
#
# 書き方は N-001 の頭の注のとおり。
# ことばと述べ方は G-023 の 11 日目にそろえた：円と 1 点だけで交わる直線を接線、その点を接点という。
#   「円 O の点 A での接線を ST とします」「円の外の点 P から接線 PA、PB をひきます」「円に接線 PA（A は接点）をひきました」。
#   接弦定理：接線と弦のつくる角は、その角の内側にある弧に対する円周角に等しい。
#   円の外の点からひいた 2 本の接線の長さは等しい（点から接点までの長さを接線の長さという）。
# 約束した事実は G-016（平行線と角、合同条件、三角形の内角の和と外角）、G-009（四角形の 4 つの角の和は 360°）、
#   G-017（二等辺三角形の底角、直角三角形の合同条件、長方形と正方形、平行四辺形の対辺）、
#   G-018（円周角は同じ弧に対する中心角の半分、同じ弧に対する円周角は等しい、半円の弧に対する円周角は 90°）、
#   G-010（半径はみな等しい、弧の長さは円周の「中心角 ÷ 360」）。
# ここで示すもの（3 日目のわけ）：
#   ① 接線は接点を通る半径に垂直。O から接線への垂線の足 H が A と別の点だとすると、H について A と対称な点 A′ も
#     合同から円の上にあり、1 点だけで交わることに反する（合同だけで示す。G-023 の見本は線対称で約束している）。
#   ② 円の外の点からの 2 本の接線の長さは等しい（直角三角形の合同。PO が ∠APB を 2 等分することも出る）。
#   ③ 接弦定理。A を通る直径 AD をひき、∠TAB が直角・鋭角・鈍角の 3 つの場合に分ける。
#     使うのは ①、半円の弧に対する円周角、同じ弧に対する円周角だけ（鈍角の場合も、内接四角形を使わずに ∠ACB を ∠ACD と ∠DCB に分ける）。
#   1・2 日目は見本で知らせて使い、見本に「わけは 3 日目」と書いた。
# ① は「〜だとすると約束と食いちがう」という背理法の形だが、背理法（L-011）は前提にないので、名前は出さずに
#   「H が A と別の点だとすると」と書き、explain で、のちに背理法として学ぶことに触れるだけにした。
#   逆（半径の端で半径に垂直な直線は接線）は、わけ 1 の explain で触れるだけにした。
# 前提にない道具は使わない：相似（G-020）、三平方の定理（G-019）、平方根（A-016）、方べきの定理（G-030）、
#   内接四角形の性質（G-023）、1 次方程式（A-011）。接線の長さは、三平方を使わずに、等しい接線の長さのたしひきで求める
#   （AB + BC − CA が BD の 2 つ分になる、など）。直角三角形の 3 辺は、問題で直角と 3 辺の長さを与える。
#   文字は A-010 の範囲で、わけの日に角の名前（∠a）として使うだけにした。
#   円に接する四角形の「向かい合う辺の和が等しい」は、接線の長さから導く問題（4 日目）として扱う。
#   三角形の内接円・内心の名前は G-028 で扱うので、「3 つの辺に円が接しています」とだけ言う。
# 図は svg（D-040）。円の上の点は、角の大きさから円の上の角度を決めて置き、接線は実際に半径に垂直にした（角は本当の大きさ）。
#   円に接する三角形と四角形は、頂点からの接線の長さが問題の数になるように作図した。求める角は図に x と書いた。
#   わけ 1 の図だけは、「H が A と別の点だとしたとき」のようす（直線が円と 2 点で交わってしまう）をかいた。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 接線と半径（垂直）、2 本の接線（∠APB + ∠AOB = 180°、接線の長さは等しく △PAB は二等辺三角形）
#   2 日目 接弦定理（頭の見本で知らせる。等しい円周角を選ぶ、2 段で求める、中心角から、反対側の角）
#   3 日目 わけ（接線は半径に垂直、接線の長さ、接弦定理の 3 つの場合）と、3 辺に接する円の接線の長さ
#   4 日目 G-017（二等辺三角形、平行四辺形）・G-018（円周角）・G-010（弧の長さ）と 1〜3 日目を混ぜる
#     （4 辺に接する円、直径と接線、3 本目の接線）　5 日目 確認
# check：角と長さの計算の式（わる数があれば Fraction）。等しい角を選ぶ問題は約束ごとなので check を付けない。
#   ひもの長さを選ぶ問題は、接線の長さと弧の長さを計算し、その組に当たる選択肢を引く式。
# この単元の ①〜③ は、G-030（方べきの定理）、G-023（11・12 日目）、G-028（内接円）で約束した事実として使われる。
# D-026：4 日目の挑戦の「ひもを円に巻く長さ」は、ベルトと滑車の長さや、円い障害物をよけて進むロボットや車の
#   最短の道（接線と弧でできる）を求める計算と同じ形。接線が接点で半径に垂直なことは、のちの微分（接線の傾き）の入口にもなる。

