# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋, 読み取り]
    text: 大きい円の内側に小さい円があり、2 つの円は点 T で接しています（T での接線は 2 つの円に共通）。大きい円の弦 AB が、小さい円に点 P で接しています。∠TAB = 28°、∠TBA = 46° のとき、∠x（∠TPA）は何度ですか。
