    note: 接線の長さが等しいこと（小さい円）と接弦定理（大きい円）を、共通な接線の上の点 Q でつなぐ道筋の問題。補助の点 Q を自分で置くのが難しい。わかることは「TP が ∠ATB を 2 等分する」で、2 つの円が接する図でよく使われる性質。
