      - part: わけ
        text: 直線 ℓ が、円 O に点 A で接しています（ℓ と円は A だけで交わります）。OA ⊥ ℓ であることを証明しましょう。O から ℓ に垂線 OH をひき、H が A と別の点だとするとどうなるかを考えます。図は、H が A と別の点だとしたときのようすです。
        svg: '<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="75" r="57" stroke="currentColor" stroke-width="2" fill="none"/><line x1="53.1" y1="122.3" x2="186.9" y2="122.3" stroke="currentColor" stroke-width="2" fill="none"/><line x1="120" y1="75" x2="88.1" y2="122.3" stroke="currentColor" stroke-width="2" fill="none"/><line x1="120" y1="75" x2="151.9" y2="122.3" stroke="currentColor" stroke-width="2" fill="none"/><line x1="120" y1="75" x2="120" y2="122.3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><polyline points="120,114.3 112,114.3 112,122.3" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="120" cy="75" r="2.6" fill="currentColor"/><text x="120" y="68.9" font-size="14" text-anchor="middle">O</text><text x="81.8" y="136.2" font-size="14" text-anchor="middle">A</text><text x="158.2" y="136.2" font-size="14" text-anchor="middle">A′</text><text x="120" y="141.2" font-size="14" text-anchor="middle">H</text><line x1="104.1" y1="117.3" x2="104.1" y2="127.3" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="135.9" y1="127.3" x2="135.9" y2="117.3" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="190.9" y="115.2" font-size="14" text-anchor="middle">ℓ</text></svg>'
        explain: 例：「O から ℓ に垂線 OH をひく。H が A と別の点だとする。ℓ の上で、H について A と反対側に HA′ = HA となる点 A′ をとる。△OHA と △OHA′ で、OH は共通、HA = HA′、∠OHA = ∠OHA′ = 90°。2 組の辺とその間の角がそれぞれ等しいので △OHA ≡ △OHA′。よって OA′ = OA となり、A′ も円の上にある。すると ℓ は円と A、A′ の 2 点で交わり、ℓ が A だけで交わることに反する。したがって H は A と同じ点で、OA ⊥ ℓ。」と書ければよい。① 垂線の足 H と、H について A と対称な点 A′ を「とる」と決める、② 合同を示して OA′ = OA（A′ も円の上）を導く、③ 接線の約束（円と 1 点だけで交わる）と食いちがうことで結ぶ、の 3 点を見る。「〜だとすると約束と食いちがう。だから〜ではない」という進め方は、のちに背理法（L-011）として学ぶ。分度器で 1 つの図を測って 90° だった、という例だけでは、どの円のどの接線でもいえるとは示せないことを話す。逆に、半径 OA に A で垂直な直線は接線になることにも触れる（ほかの点 P でも円と交わるとすると、△OAP は OA = OP の二等辺三角形で ∠OPA = ∠OAP = 90° となり、2 つの角だけで 180° になってしまう）。
        hints:
          - H が A と別の点なら、ℓ の上で H について A と反対側に、HA と同じ長さの点 A′ がとれるね。
          - △OHA と △OHA′ をくらべよう。等しい辺と角はどれかな。
          - OA′ = OA なら、A′ はどこにある点かな。ℓ が A だけで交わることと合うかな。
        paths:
          - [垂線 OH をひき H は A と別の点とする, HA′ = HA となる A′ をとる, △OHA ≡ △OHA′ で OA′ = OA, A′ も円の上で 2 点で交わり接線の約束に反する, H は A と同じ点で OA ⊥ ℓ]
