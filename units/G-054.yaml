    answer: 99
    check: "180 - 28 - (180 - 28 - 46) // 2"
    hints:
      - T での共通な接線が直線 AB と交わる点を Q としよう。Q から小さい円にひいた 2 本の接線 QT と QP の長さはどうなるかな。
      - QT = QP なので ∠QTP = ∠QPT。大きい円で、接線 QT と弦 TB のつくる角 ∠QTB と等しい角はどれかな。
      - ∠QPT は △TAP の外角だね。∠QTP = ∠QTB + ∠BTP とくらべて、∠ATP と ∠BTP の関係を出そう。
    paths:
