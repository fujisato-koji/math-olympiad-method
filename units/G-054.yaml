        explain: 円と 1 点だけで交わる直線を接線、その点を接点といいます。円の接線は、接点を通る半径に垂直です。だから ∠OAP = ∠OBP = 90° です。四角形 OAPB の 4 つの角の和は 360° なので、∠AOB = 360° − 90° − 90° − 50° = 130° です。∠AOB と ∠APB をたすと 180° になります。また、円の外の点からひいた 2 本の接線の長さは等しく、PA = PB です（図の同じしるし）。だから △PAB は二等辺三角形です。この 2 つの性質のわけは、3 日目に示します。
