# A-005 比と割合
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習 4 日、わけ、混ぜる、確認）で作った。
#   1 日目：比の意味と比の値。2 日目：等しい比、比を簡単にする。3 日目：比を使う（一方から他方、比例配分、ちがいから）。
#   4 日目：割合（比べる量 ÷ もとにする量、比べる量、もとにする量）。5 日目：百分率。6 日目：わけ。
#   7 日目：N-019、N-020 と混ぜる。8 日目：確認。
# 前提は N-019（分数の約分と通分）と N-020（小数）。小数のかけ算とわり算は前提にないので、
#   割合は「比べる量 ÷ もとにする量」を分数で表し、約分や通分（分母を 10、100 にそろえる）で小数と百分率に直す。
#   比べる量は「もとにする量 ÷ 分母 × 分子」、百分率は「10% や 1% にあたる量」から、整数の計算で求める。
#   N-015（計算のきまり）も前提にないので、かけ算とわり算は九九と、何十・何百の計算（180 ÷ 3 = 60）でできる数にした。
# 歩合（割・分・厘）は、今の算数・数学の道具として使う場面が少ないので扱わない（D-026）。
# 比の「外項の積 = 内項の積」は扱わない。2:3 = 8:□ は「何倍したか」で求める。
# 比の答え（2:3 など）は選ぶ形にし、YAML では引用符で囲む。check は '%d:%d' % (…) で比の文字を作る。
#   比を簡単にした答えは、分数を約分した Fraction(a, b) の分子と分母で確かめる。
# 比の値は分数でも小数でもよいので accept に小数を入れた。「分数で」「小数で」と指定した問題には accept を入れない。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-015 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-005
days:
  - day: 1
    items:
      - part: 見本
        text: 赤い玉が 2 こ、青い玉が 3 こあります。赤と青の数の割合を、比で表してみよう。
        figure: "🔴🔴\n🔵🔵🔵"
        explain: 赤 2 こと青 3 こを「2 対 3」と読み、2:3 と書きます。これを、赤と青の数の比といいます。どちらを前に書くかで比は変わり、青と赤の比なら 3:2 です。前の数を後ろの数でわった 2 ÷ 3 = 2/3 を、比の値といいます。
      - part: 思い出す
        text: 18/30 を約分しましょう。
        answer: 3/5
        check: "Fraction(18, 30)"
        hints:
          - 18 と 30 を、同じ数でわれるかな。
          - 2 でも 3 でもわれるね。
          - これ以上われなくなるまでわろう。
        paths:
          - [分母と分子を 6 でわる, 3/5]
          - [2 でわって 9/15, 3 でわって 3/5]
      - part: 思い出す
        text: 0.3 + 0.45 はいくつですか。
        answer: 0.75
        check: "(30 + 45) / 100"
        hints:
          - 小数点の位置をそろえて書こう。
          - 0.3 は 0.30 と同じだね。
          - 0.01 の位から足そう。
        paths:
          - [0.30 + 0.45, 0.75]
        note: 小数点をそろえずに 0.48 としやすい。
      - part: 今日
        text: りんごとみかんの数の比は、どれですか。
        figure: "🍎🍎🍎🍎\n🍊🍊🍊🍊🍊🍊🍊"
        choices: ["4:7", "7:4", "4:11"]
        answer: "4:7"
        check: "'%d:%d' % (n('🍎'), n('🍊'))"
        hints:
          - りんごとみかんを、それぞれ数えよう。
          - 聞かれた順に、前と後ろに書くよ。
          - 4:11 の 11 は、何の数かな。
        paths:
          - [りんご 4 こ、みかん 7 こ, りんご:みかん = 4:7]
      - part: 今日
        text: いぬとねこの数の比は、どれですか。
        figure: "🐱🐱🐱\n🐶🐶🐶🐶🐶"
        choices: ["3:5", "5:3", "5:8"]
        answer: "5:3"
        check: "'%d:%d' % (n('🐶'), n('🐱'))"
        hints:
          - いぬとねこを、それぞれ数えよう。
          - 前に書くのは、いぬとねこのどちらかな。
          - 聞かれた順に書こう。
        paths:
          - [いぬ 5 ひき、ねこ 3 びき, いぬ:ねこ = 5:3]
        note: 図の上にねこがあるので 3:5 としやすい。聞かれた順（いぬ、ねこ）に書く。
      - part: 今日
        text: 6:8 の比の値を求めましょう。
        answer: 3/4
        accept: [0.75]
        check: "Fraction(6, 8)"
        hints:
          - 比の値は、前の数 ÷ 後ろの数 だよ。
          - 6 ÷ 8 を分数で表そう。
          - 約分できるかな。
        paths:
          - [6 ÷ 8 = 6/8, 約分して 3/4]
      - part: 挑戦
        text: クラスは 28 人で、そのうち男子は 12 人です。男子と女子の人数の比は、どれですか。
        choices: ["12:16", "12:28", "16:12"]
        answer: "12:16"
        check: "'%d:%d' % (12, 28 - 12)"
        hints:
          - 女子は何人かな。
          - 28 人は、男子と女子を合わせた数だね。
          - 男子を前、女子を後ろに書こう。
        paths:
          - [女子は 28 − 12 = 16 人, 男子:女子 = 12:16]
        note: 12:28 は男子と全体の比。何と何の比かを読む。12:16 は 3:4 と簡単にできる（2 日目）。
    extra:
      - part: 今日
        text: いちごとさくらんぼの数の比は、どれですか。
        figure: "🍓🍓🍓🍓🍓🍓\n🍒🍒🍒🍒🍒"
        choices: ["6:5", "5:6", "6:11"]
        answer: "6:5"
        check: "'%d:%d' % (n('🍓'), n('🍒'))"
        hints:
          - いちごとさくらんぼを、それぞれ数えよう。
          - 聞かれた順に、前と後ろに書くよ。
          - 6:11 の 11 は、何の数かな。
        paths:
          - [いちご 6 こ、さくらんぼ 5 こ, 6:5 になる]
      - part: 今日
        text: 8:10 の比の値を求めましょう。
        answer: 4/5
        accept: [0.8]
        check: "Fraction(8, 10)"
        hints:
          - 比の値は、前の数 ÷ 後ろの数 だよ。
          - 8 ÷ 10 を分数で表そう。
          - 約分できるかな。
        paths:
          - [8 ÷ 10 = 8/10, 約分して 4/5]
      - part: 挑戦
        text: 30 人のうち、女子は 13 人です。男子と女子の人数の比は、どれですか。
        choices: ["17:13", "13:17", "17:30"]
        answer: "17:13"
        check: "'%d:%d' % (30 - 13, 13)"
        hints:
          - 男子は何人かな。
          - 30 人は、男子と女子を合わせた数だね。
          - 男子を前、女子を後ろに書こう。
        paths:
          - [男子は 30 − 13 = 17 人, 男子:女子 = 17:13]

  - day: 2
    items:
      - part: 見本
        text: 3:5 と 6:10 は、等しい比です。どうしてかな。
        explain: 比の前と後ろに同じ数をかけても、同じ数でわっても、比は等しくなります。3:5 の両方に 2 をかけると 6:10 です。比の値も 3/5 と 6/10 で、約分すると同じ 3/5 です。両方を同じ数でわって、できるだけ小さい整数の比にすることを、比を簡単にするといいます。24:40 は、両方を 8 でわって 3:5 です。
      - part: 思い出す
        text: 青い玉と赤い玉の数の比は、どれですか。
        figure: "🔵🔵🔵🔵🔵🔵🔵\n🔴🔴"
        choices: ["7:2", "2:7", "7:9"]
        answer: "7:2"
        check: "'%d:%d' % (n('🔵'), n('🔴'))"
        hints:
          - 青と赤を、それぞれ数えよう。
          - 聞かれた順に、前と後ろに書くよ。
          - 7:9 の 9 は、何の数かな。
        paths:
          - [青 7 こ、赤 2 こ, 青:赤 = 7:2]
      - part: 思い出す
        text: 1/4 と 1/6 を通分します。いちばん小さい分母はいくつですか。
        answer: 12
        check: "math.lcm(4, 6)"
        hints:
          - 4 の倍数と 6 の倍数を書き出そう。
          - どちらにも出てくる数をさがそう。
          - いちばん小さいものをえらぼう。
        paths:
          - [4、8、12、… と 6、12、… , どちらにも出る最初は 12]
        note: 4 × 6 = 24 でも通分はできるが、いちばん小さい分母ではない。
      - part: 今日
        text: 男子が 12 人、女子が 15 人います。男子と女子の人数の比を簡単にすると、どれですか。
        choices: ["4:5", "5:4", "3:5"]
        answer: "4:5"
        check: "'%d:%d' % (Fraction(12, 15).numerator, Fraction(12, 15).denominator)"
        hints:
          - 12 と 15 を、同じ数でわれるかな。
          - 両方を同じ数でわっても、比は等しいね。
          - これ以上われなくなるまでわろう。
        paths:
          - [12:15 の両方を 3 でわる, 4:5 になる]
      - part: 今日
        text: 2:3 = 8:□ の □ に入る数はいくつですか。
        answer: 12
        check: "3 * (8 // 2)"
        hints:
          - 前の数は、2 から 8 になったね。何倍したのかな。
          - 後ろの数も、同じ数をかけよう。
          - 3 に、その数をかけた数が □ だよ。
        paths:
          - [2 × 4 = 8, 3 × 4 = 12, 12]
      - part: 今日
        text: 15:20 = 3:□ の □ に入る数はいくつですか。
        answer: 4
        check: "20 // (15 // 3)"
        hints:
          - 前の数は、15 から 3 になったね。何でわったのかな。
          - 後ろの数も、同じ数でわろう。
          - 20 をその数でわった数が □ だよ。
        paths:
          - [15 ÷ 5 = 3, 20 ÷ 5 = 4, 4]
      - part: 挑戦
        text: 0.6:0.9 を簡単な整数の比にすると、どれですか。
        choices: ["2:3", "6:9", "3:2"]
        answer: "2:3"
        check: "'%d:%d' % (Fraction(6, 9).numerator, Fraction(6, 9).denominator)"
        hints:
          - 小数のままでは考えにくいね。
          - 両方に 10 をかけると、整数の比になるよ。
          - できた整数の比を、さらに簡単にしよう。
        paths:
          - [両方に 10 をかけて 6:9, 両方を 3 でわる, 2:3 になる]
        note: 6:9 も 0.6:0.9 と等しいが、まだ簡単にできる。
    extra:
      - part: 今日
        text: 18:24 を簡単にすると、どれですか。
        choices: ["3:4", "9:12", "4:3"]
        answer: "3:4"
        check: "'%d:%d' % (Fraction(18, 24).numerator, Fraction(18, 24).denominator)"
        hints:
          - 18 と 24 を、同じ数でわれるかな。
          - 2 でも 3 でもわれるね。
          - これ以上われなくなるまでわろう。
        paths:
          - [両方を 6 でわる, 3:4 になる]
      - part: 今日
        text: 4:□ = 12:21 の □ に入る数はいくつですか。
        answer: 7
        check: "21 // (12 // 4)"
        hints:
          - 前の数は、4 から 12 になったね。何倍したのかな。
          - 後ろの数も、同じだけ倍になっているよ。
          - 21 をその数でわると □ にもどるね。
        paths:
          - [4 × 3 = 12, □ × 3 = 21, □ = 7]
      - part: 挑戦
        text: 1/2:1/3 を簡単な整数の比にすると、どれですか。
        choices: ["3:2", "2:3", "1:1"]
        answer: "3:2"
        check: "'%d:%d' % ((Fraction(1, 2) / Fraction(1, 3)).numerator, (Fraction(1, 2) / Fraction(1, 3)).denominator)"
        hints:
          - 分母をそろえて（通分して）みよう。
          - 通分すると、分子の大きさでくらべられるね。
          - 両方に同じ分母をかけると、整数の比になるよ。
        paths:
          - [通分して 3/6:2/6, 両方に 6 をかける, 3:2 になる]
        note: 分母の 2 と 3 を見て 2:3 としやすい。1/2 のほうが大きいので、前の数のほうが大きい比になる。

  - day: 3
    items:
      - part: 見本
        text: 36 このあめを、姉と妹で 4:5 に分けます。姉は何こもらえるかな。
        explain: 4:5 に分けるとは、全体を 4 + 5 = 9 つ分に分け、姉が 4 つ分、妹が 5 つ分をもらうことです。1 つ分は 36 ÷ 9 = 4 こなので、姉は 4 × 4 = 16 こ、妹は 4 × 5 = 20 こです。たしかめ：16:20 = 4:5、16 + 20 = 36。
      - part: 思い出す
        text: 3:5 = □:20 の □ に入る数はいくつですか。
        answer: 12
        check: "3 * (20 // 5)"
        hints:
          - 後ろの数は、5 から 20 になったね。何倍したのかな。
          - 前の数も、同じ数をかけよう。
          - 3 に、その数をかけた数が □ だよ。
        paths:
          - [5 × 4 = 20, 3 × 4 = 12, 12]
      - part: 思い出す
        text: 16:24 を簡単にすると、どれですか。
        choices: ["2:3", "4:6", "3:2"]
        answer: "2:3"
        check: "'%d:%d' % (Fraction(16, 24).numerator, Fraction(16, 24).denominator)"
        hints:
          - 16 と 24 を、同じ数でわれるかな。
          - 2 でも 4 でもわれるね。
          - これ以上われなくなるまでわろう。
        paths:
          - [両方を 8 でわる, 2:3 になる]
      - part: 今日
        text: 赤い花と白い花の本数の比は 3:5 です。赤い花が 12 本のとき、白い花は何本ですか。
        answer: 20
        check: "5 * (12 // 3)"
        hints:
          - 3:5 = 12:□ と考えよう。
          - 3 が 12 になるには、何倍すればよいかな。
          - 白の 5 も、同じ数だけ倍にしよう。
        paths:
          - [3 × 4 = 12, 5 × 4 = 20, 20 本]
          - [1 つ分は 12 ÷ 3 = 4 本, 白は 5 つ分で 20 本]
      - part: 今日
        text: 45 まいの色紙を、兄と弟で 5:4 に分けます。兄は何まいもらえますか。
        answer: 25
        check: "45 // (5 + 4) * 5"
        hints:
          - 全体は、何つ分に分けることになるかな。
          - 1 つ分は何まいかな。
          - 兄は何つ分をもらうかな。
        paths:
          - [全体は 5 + 4 = 9 つ分, 1 つ分は 45 ÷ 9 = 5 まい, 兄は 5 × 5 = 25 まい]
      - part: 今日
        text: クラスの男子と女子の人数の比は 4:3 です。男子が 16 人のとき、クラス全体は何人ですか。
        answer: 28
        check: "16 // 4 * (4 + 3)"
        hints:
          - 男子の 4 つ分が 16 人だね。1 つ分は何人かな。
          - クラス全体は、何つ分かな。
          - 1 つ分 × 全体のつ分 で求めよう。
        paths:
          - [1 つ分は 16 ÷ 4 = 4 人, 全体は 4 + 3 = 7 つ分, 4 × 7 = 28 人]
          - [女子は 4 × 3 = 12 人, 16 + 12 = 28 人]
        note: 女子の 12 人を答えにしやすい。聞かれているのは全体。
      - part: 挑戦
        text: 姉と妹の持っているお金の比は 5:3 です。姉は妹より 80 円多く持っています。姉は何円持っていますか。
        answer: 200
        check: "80 // (5 - 3) * 5"
        hints:
          - 5 つ分と 3 つ分のちがいは、何つ分かな。
          - そのちがいの分が、80 円にあたるよ。
          - 1 つ分がわかったら、姉は 5 つ分だね。
        paths:
          - [ちがいは 5 − 3 = 2 つ分, 1 つ分は 80 ÷ 2 = 40 円, 姉は 40 × 5 = 200 円]
    extra:
      - part: 今日
        text: 青い玉と黄色い玉の数の比は 2:7 です。青い玉が 8 このとき、黄色い玉は何こですか。
        answer: 28
        check: "7 * (8 // 2)"
        hints:
          - 2:7 = 8:□ と考えよう。
          - 2 が 8 になるには、何倍すればよいかな。
          - 黄色の 7 も、同じ数だけ倍にしよう。
        paths:
          - [2 × 4 = 8, 7 × 4 = 28, 28 こ]
      - part: 今日
        text: 56 このおはじきを 3:5 に分けます。少ないほうは何こですか。
        answer: 21
        check: "56 // (3 + 5) * 3"
        hints:
          - 全体は、何つ分に分けることになるかな。
          - 1 つ分は何こかな。
          - 少ないほうは何つ分かな。
        paths:
          - [全体は 8 つ分, 1 つ分は 56 ÷ 8 = 7 こ, 7 × 3 = 21 こ]
      - part: 挑戦
        text: 大人と子どもの人数の比は 2:5 で、子どもは大人より 18 人多いです。大人と子どもは、合わせて何人ですか。
        answer: 42
        check: "18 // (5 - 2) * (2 + 5)"
        hints:
          - 5 つ分と 2 つ分のちがいは、何つ分かな。
          - そのちがいの分が 18 人だよ。1 つ分は何人かな。
          - 合わせた人数は、何つ分かな。
        paths:
          - [ちがいは 3 つ分, 1 つ分は 18 ÷ 3 = 6 人, 全体は 7 つ分で 42 人]

  - day: 4
    items:
      - part: 見本
        text: 定員 40 人のバスに、30 人乗っています。乗っている人数は、定員の何倍かな。
        explain: 割合は、比べる量が、もとにする量の何倍にあたるかを表す数です。ここでは、もとにする量が定員の 40 人、比べる量が乗っている 30 人です。割合 = 比べる量 ÷ もとにする量 = 30 ÷ 40 = 30/40 = 3/4 です。分母を 100 にそろえると 75/100 なので、小数で 0.75 です。
      - part: 思い出す
        text: 40 このあめを 3:5 に分けます。多いほうは何こですか。
        answer: 25
        check: "40 // (3 + 5) * 5"
        hints:
          - 全体は、何つ分に分けることになるかな。
          - 1 つ分は何こかな。
          - 多いほうは何つ分かな。
        paths:
          - [全体は 8 つ分, 1 つ分は 40 ÷ 8 = 5 こ, 5 × 5 = 25 こ]
      - part: 思い出す
        text: 3/5 を小数で表しましょう。
        answer: 0.6
        check: "3 / 5"
        hints:
          - 分母を 10 にそろえよう。
          - 3/5 = □/10 の □ は何かな。
          - 10 分のいくつは、0.1 の位で表せるね。
        paths:
          - [3/5 = 6/10, 0.6]
      - part: 今日
        text: 20 問のテストで、14 問正解しました。全部の問題をもとにしたときの、正解した問題の割合を分数で答えましょう。
        answer: 7/10
        check: "Fraction(14, 20)"
        hints:
          - もとにする量は、どの数かな。
          - 割合 = 比べる量 ÷ もとにする量 だよ。
          - 分数で表したら、約分しよう。
        paths:
          - [もとにする量 20、比べる量 14, 14 ÷ 20 = 14/20, 約分して 7/10]
      - part: 今日
        text: 赤い玉が 12 こ、白い玉が 15 こあります。白い玉をもとにしたとき、赤い玉の割合を小数で答えましょう。
        answer: 0.8
        check: "12 / 15"
        hints:
          - もとにする量は、白と赤のどちらかな。
          - 12 ÷ 15 を分数で表して、約分しよう。
          - 分母を 10 にそろえると、小数に直せるよ。
        paths:
          - [12 ÷ 15 = 12/15 = 4/5, 4/5 = 8/10, 0.8]
        note: 「白い玉をもとにした」とあるので 15 でわる。15 ÷ 12 としやすい。
      - part: 今日
        text: 180 ページの本の 2/3 を読みました。何ページ読みましたか。
        answer: 120
        check: "180 // 3 * 2"
        hints:
          - もとにする量は 180 ページだね。
          - 2/3 は、180 を 3 つに分けた 2 つ分だよ。
          - まず、3 つに分けた 1 つ分を求めよう。
        paths:
          - [1 つ分は 180 ÷ 3 = 60 ページ, 2 つ分で 60 × 2 = 120 ページ]
      - part: 挑戦
        text: ある本の 3/5 を読んだら、60 ページでした。この本は全部で何ページですか。
        answer: 100
        check: "60 // 3 * 5"
        hints:
          - 全体を 5 つに分けた 3 つ分が 60 ページだね。
          - 1 つ分は何ページかな。
