# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: ある品物に、仕入れ値の 30% の利益を見こんで定価をつけました。売れなかったので、定価の 20% 引きで売りました。もうけは、仕入れ値の何 % ですか。
    answer: 4
    check: "(Fraction(130, 100) * Fraction(80, 100) - 1) * 100"
    hints:
      - 仕入れ値がわからないときは、きりのよい数（100 円など）だと考えてみよう。
      - 仕入れ値が 100 円なら、定価はいくらかな。
      - 定価の 20% 引きは、定価の何 % かな。
    paths:
      - [仕入れ値を 100 円とする, 定価は 130 円, 売り値は 130 円の 80% で 104 円, もうけは 4 円で 仕入れ値の 4%]
      - [売り値は 仕入れ値の 1.3 × 0.8 = 1.04 倍, もうけは 仕入れ値の 0.04 倍で 4%]
    note: 金額が 1 つも書かれていないので、仕入れ値を 100 円と決めて考えるのが道筋。「30% 増しで 20% 引きだから 10% のもうけ」と、% をそのまま足しひきしやすい。もとにする量が仕入れ値と定価で変わることに気づかせる。
  - part: 離
