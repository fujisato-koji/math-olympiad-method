    text: 長方形のたてと横の長さの比は 3:5 で、まわりの長さは 64 cm です。この長方形の面積は何 cm² ですか。
    answer: 240
    check: "(64 // 2 // (3 + 5) * 3) * (64 // 2 // (3 + 5) * 5)"
    hints:
      - まわりの長さの半分は、たて 1 本と横 1 本の和だね。
      - たてと横の和を、3:5 に分けよう。
      - たてと横がわかったら、面積を求めよう。
    paths:
      - [たて + 横 = 64 ÷ 2 = 32 cm, 32 を 3 つ分と 5 つ分に分けて 1 つ分は 32 ÷ 8 = 4, たて 12 cm、横 20 cm, 面積は 12 × 20 = 240 cm²]
    note: まわりの長さ（G-005）から「たて + 横」を出し、比で分け（比例配分）、面積（G-008）を求める 3 段。64 をそのまま 3:5 に分けてしまう間ちがいが多い。長方形の図をかいて、まわりにたてと横が 2 本ずつあることを確かめさせる。
  - part: 離
    kinds: [読み取り]
    text: A 組と B 組の人数の比は 5:4 です。自転車で通学している人は、A 組では A 組の人数の 40%、B 組では B 組の人数の 25% で、合わせて 30 人です。A 組は何人ですか。
    answer: 50
    check: "[5 * k for k in range(1, 100) if Fraction(40, 100) * 5 * k + Fraction(25, 100) * 4 * k == 30][0]"
    hints:
      - A 組を 5 つ分、B 組を 4 つ分として考えよう。
      - A 組の 40% は、何つ分にあたるかな。B 組の 25% はどうかな。
      - 自転車通学の人は、合わせて何つ分かな。それが 30 人だよ。
    paths:
      - [A 組 5 つ分、B 組 4 つ分, A 組の 40% は 2 つ分、B 組の 25% は 1 つ分, 合わせて 3 つ分が 30 人で 1 つ分は 10 人, A 組は 50 人]
      - [A 組 50 人、B 組 40 人とためす, 自転車は 20 人と 10 人で 30 人, 合うので 50 人]
    note: 比と割合を重ねる問題。それぞれの組で、もとにする量（組の人数）がちがうことを読み取る。「40% + 25% = 65%」とまとめてしまう間ちがいに注意。「1 つ分」に割合をかけて、自転車通学の人も「つ分」で表すのが近道。
