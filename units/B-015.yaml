      - part: 見本
        text: |-
          いきものは、じぶんで うごきます。ダンゴムシや カタツムリも いきものです。
          いきものは、たべものを たべて、小さい ときから だんだん 大きく そだちます。ひよこは そだつと、にわとりに なります。
          石や ボールは、じぶんで うごかず、たべず、そだちません。
