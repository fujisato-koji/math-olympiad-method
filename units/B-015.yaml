        explain: |-
          いきものと、いきもので ない ものは、「うごく・たべる・そだつ」で 見わけられます。ダンゴムシは じぶんで あるき、カタツムリは はっぱを たべ、ひよこは えさを たべて にわとりに そだちます。石や ボールは、ころがせば うごきますが、じぶんでは うごかず、たべも せず、大きく なりません。
          草や 木も いきもので、あるきは しませんが、大きく そだちます（つぎの B-016 で あつかいます）。きょうは「じぶんで うごく」「たべる」「そだつ」の 3 つで、いきものを 見わけられれば よい。いえの まわりで 見つけた ものを「いきもの かな？」と いっしょに たしかめて みましょう。
