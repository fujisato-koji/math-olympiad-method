          「虫めがねで 見ると、小さな ものが 大きく 見える。だから、目だけでは よく 見えない 足の かずや、せなかの すじまで わかる。」と いえれば よい。① 虫めがねは 小さな ものを 大きく 見せる、② 大きく 見えると こまかい ところが わかる、③ だから からだの つくりを くわしく かんさつ できる、の 3 つが 入って いれば じゅうぶんです。
          つかいかた：虫めがねは 目の ちかくに もち、見る ものを ちかづけたり はなしたり して、はっきり 見える ところで とめます。うごかせない ものを 見る ときは、虫めがねを 目の ちかくに もった まま、じぶんが ちかづいたり はなれたり します。虫めがねで お日さまを 見ると 目を いためるので、ぜったいに 見ない ように 気を つけましょう。ひなたに おいた ままに すると ものが こげる ことが あるので（P-179 で あつかいます）、つかったら しまいましょう。
