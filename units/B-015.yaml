# B-015 生き物の観察
#
# 段 1・水準 1・5 日。いきもののからだのつくり（目・口・足、とりのはね、さかなのひれ）、いきものは自分でうごき、たべ、そだつこと（石やボールとのちがい）、虫めがねで小さなものを大きく見ることを扱う。
# 日の並びは 導入（からだのつくり）・練習（うごく・そだつ・たべる）・わけ（虫めがね）・混ぜる・確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の約束：見るところは赤い点線の丸。とおくから見たまるいダンゴムシは石と見分けがつかないので、もようのない灰色の丸でかき、虫めがねで見たときだけせなかのすじをかく。
# こん虫のからだ（3 つの部分と 6 本の足）と食べ物・すみかは B-017、たねと芽生え・根と茎と葉は B-016、虫めがねで光を集めることは P-179 で扱うので、ここでは問わない。
# 虫めがねで太陽を見ないことは、わけの文と 3 日目の問題で子に伝える。
# 腕だめし（離）は 2 問とも読み取り（すなの上のあしあと、かじられたはっぱの順）。

id: B-015
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          いきものの からだには、目や 口や 足が あります。目で 見て、口で たべて、足で あるきます。
          とりには はねが、さかなには ひれが あって、はねで とんだり、ひれで およいだり します。
          からだの どこに なにが あるかを よく 見て しらべる ことを「かんさつ」と いいます。
