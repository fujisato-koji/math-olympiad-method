        explain: |-
          いきものの からだの つくりは、くらしかたに あって います。ねこは 足で あるいたり はしったり し、とりは はねを はばたかせて そらを とび、さかなは ひれを ふって 水の 中を すすみます。どの いきものにも、まわりを 見る 目と、たべものを たべる 口が あります。
          きょうは「からだの どこを つかって、なにを するか」が わかれば よい。いえの まわりの いきもの（ねこ、とり、ダンゴムシ など）を いっしょに 見て、「目は どこ？ 足は なん本？」と たずねて みましょう。
