      - part: 挑戦
        text: 🐸 が 🏁 まで すすみました。この うごきを しきに すると、どれですか。
        figure: "0─1─2─🐸─4─5─6─🏁─8"
        choices: [3 + 4, 7 − 3, 3 + 7]
        answer: 3 + 4
        check: "[c for c, v in {'3 + 4': 3 + 4, '7 − 3': 7 - 3, '3 + 7': 3 + 7}.items() if v == Fraction(fig.split('─')[0]) + fig.split('─').index('🏁')][0]"
        hints:
          - 🐸 は どの かずから うごいたかな。
          - みぎへ いくつ すすんだかな。ゆびで とんで かぞえよう。
          - 「はじめの かず + すすんだ かず」の かたちに しよう。
        paths:
          - [🐸 は 3 から うごいた, みぎへ 4 つ すすんだ, 3 + 4]
        note: 🏁 の 7 を進んだ数と取り違えて 3 + 7 を選びやすい。進んだ数は跳んだ回数。
