# N-003 たし算とひき算（数直線で進む、もどる）
#
# 段 1・水準 1・5 日。右へ進むとたし算・左へもどるとひき算、のこりとちがい、0 のたし算とひき算とたし算とひき算の関係、N-002 と混ぜる、10 までのたし算とひき算のたしかめ。
# 書き方は N-001 の頭の注、数直線の図は N-002 の頭の注のとおり。子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる（D-129〜D-131）。
# 「+」「−」「=」はこの単元で初めて出す（− は U+2212）。式は最初から「右へ進むとたし算、左へもどるとひき算」と
# 数直線の動きに結びつける（D-014）。
# 数は 0〜10 にとどめる（くり上がりは N-005、0 より小さい数は N-004）。
# □ を使った式は A-002 なので使わない。「はじめはどこにいたか」は動きの言葉でたずねる。
# 図は svg（2026-11-13 に文字の図 figure から書きかえた）。check は問題の数から計算する式にした。式を選ぶ問題の check は、選択肢ごとの式の値が 🏁 の数と合うものを選ぶ。
#   あおい ゆみなりの やじるしは「みぎへ 1 つ すすむ（+）」、あかい ゆみなりは「ひだりへ 1 つ もどる（−）」。なかの きいろの まるの 1、2… は とんだ じゅんで、ヒントでは とちゅうまでに する。
#   🐸 🐰 は いまいる ところ、うすい 🐸 は とちゅうで いた ところ、🏁 は つく ところ。わの しるしは つく ところ、むらさきの てんせんの わは「見る ところ」。
#   のこりは はいいろの × で うしろから かくし、ちがいは うえと したを 1 つずつ せんで むすぶ。かずの せんだけの もんだいは、はじめの かずを じぶんで さがす。

