# N-003 たし算とひき算（数直線で進む、もどる）
#
# 書き方は N-001 の頭の注、数直線の図と check は N-002 の頭の注のとおり。
# 「+」「−」「=」はこの単元で初めて出す（− は U+2212）。式は最初から「右へ進むとたし算、左へもどるとひき算」と
# 数直線の動きに結びつける（D-014）。
# 数は 0〜10 にとどめる（くり上がりは N-005、0 より小さい数は N-004）。
# □ を使った式は A-002 なので使わない。「はじめはどこにいたか」は動きの言葉でたずねる。
# 式を選ぶ問題の check は、選択肢ごとの式の値が、図の 🏁 の数と合うものを選ぶ。

id: N-003
days:
  - day: 1
    items:
      - part: 見本
        text: 🐸 は 5 に います。5 + 3 と 5 − 3 を、かずの せんで みてみよう。
        figure: "0─1─2─3─4─🐸─6─7─8─9"
        explain: 5 + 3 は「5 から みぎへ 3 すすむ」と いう いみです。6、7、8 と すすんで 8 に つくので、5 + 3 = 8 です。5 − 3 は「5 から ひだりへ 3 もどる」と いう いみです。4、3、2 と もどって 2 に つくので、5 − 3 = 2 です。「+」は「たす」、「−」は「ひく」と よみます。「=」は、りょうがわが おなじ かずに なる しるしです。
      - part: 思い出す
        text: 🐸 は いま 1 に います。みぎへ 6 つ すすむと、どの かずに つきますか。
        figure: "0─🐸─2─3─4─5─6─7─8"
        answer: 7
        check: "Fraction(fig.split('─')[0]) + fig.split('─').index('🐸') + 6"
        hints:
          - ゆびを 🐸 の ところに おこう。
          - みぎへ ひとつずつ うごかそう。
          - 「1、2、3、4、5、6」と かぞえながら うごかそう。
        paths:
          - [1 から みぎへ 2、3、4、5、6、7, 6 かい すすんだ, 7]
      - part: 思い出す
        text: 🐰 は いま 9 に います。ひだりへ 4 つ もどると、どの かずに つきますか。
        figure: "4─5─6─7─8─🐰─10"
        answer: 5
        check: "Fraction(fig.split('─')[0]) + fig.split('─').index('🐰') - 4"
        hints:
          - ゆびを 🐰 の ところに おこう。
          - ひだりへ ひとつずつ うごかそう。
          - 「1、2、3、4」と かぞえながら うごかそう。
        paths:
          - [9 から ひだりへ 8、7、6、5, 4 かい もどった, 5]
      - part: 今日
        text: 2 + 4 は いくつですか。🐸 を うごかして かんがえよう。
        figure: "0─1─🐸─3─4─5─6─7─8"
        answer: 6
        check: "Fraction(fig.split('─')[0]) + fig.split('─').index('🐸') + 4"
        hints:
          - 「2 + 4」は、2 から みぎへ 4 すすむ ことだよ。
          - 🐸 の ところに ゆびを おこう。
          - 「1、2、3、4」と かぞえながら、みぎへ うごかそう。
        paths:
          - [2 から みぎへ 3、4、5、6, 4 かい すすんだ, 6]
          - [2 こと 4 こを あわせて かぞえる, 6]
        note: 「+」を見たら右へ進む、と動きに結びつける。いる所の 2 を「1」と数えて 5 と答えやすい。
      - part: 今日
        text: 7 − 3 は いくつですか。🐸 を うごかして かんがえよう。
        figure: "0─1─2─3─4─5─6─🐸─8─9"
        answer: 4
        check: "Fraction(fig.split('─')[0]) + fig.split('─').index('🐸') - 3"
        hints:
          - 「7 − 3」は、7 から ひだりへ 3 もどる ことだよ。
          - 🐸 の ところに ゆびを おこう。
          - 「1、2、3」と かぞえながら、ひだりへ うごかそう。
        paths:
          - [7 から ひだりへ 6、5、4, 3 かい もどった, 4]
        note: 「−」を見たら左へもどる。右へ進んで 10 と答えていないかを見る。
      - part: 今日
        text: 3 + 5 は いくつですか。
        figure: "2─🐸─4─5─6─7─8─9─10"
        answer: 8
        check: "Fraction(fig.split('─')[0]) + fig.split('─').index('🐸') + 5"
        hints:
          - ひだりの はしは 0 では ないね。🐸 は どの かずの ところかな。
          - 「3 + 5」は、3 から みぎへ 5 すすむ ことだよ。
          - 「1、2、3、4、5」と かぞえながら、みぎへ うごかそう。
        paths:
