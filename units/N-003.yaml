        explain: 5 + 3 は「5 から みぎへ 3 すすむ」と いう いみです。6、7、8 と すすんで 8 に つくので、5 + 3 = 8 です。5 − 3 は「5 から ひだりへ 3 もどる」と いう いみです。4、3、2 と もどって 2 に つくので、5 − 3 = 2 です。「+」は「たす」、「−」は「ひく」と よみます。「=」は、りょうがわが おなじ かずに なる しるしです。
