# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: ある数に 0.8 をかけると、もとの数より 3.6 小さくなりました。もとの数はいくつですか。
    answer: 18
    check: "Fraction(36, 10) / (1 - Fraction(8, 10))"
    hints:
      - もとの数を 1 とみると、0.8 をかけた数は 1 よりいくつ小さいかな。
      - もとの数から、もとの数 × 0.8 をひくと、もとの数 × いくつになるかな。
      - もとの数 × 0.2 が 3.6 だね。もとの数を求めるには、どんな計算をするかな。
    paths:
      - [もとの数 − もとの数 × 0.8 = もとの数 × 0.2, もとの数 × 0.2 = 3.6, もとの数 = 3.6 ÷ 0.2 = 18]
      - [もとの数を 10 とためすと、0.8 をかけて 8 になり 2 小さい, 3.6 小さくなるのは 2 の 1.8 倍, もとの数も 10 の 1.8 倍で 18]
    note: 「0.8 倍すると、0.2 倍の分だけへる」を、分けるきまり（N-015）と計算の順番（N-076）を小数で使って見ぬく。3.6 ÷ 0.8 = 4.5 としてしまうまちがいが多い。
  - part: 離
    kinds: [総動員, 手数]
    uses: [G-008]
    text: たて 2.4 m、よこ 3.5 m の長方形の花だんがあります。この花だんの 1 m² ごとに 0.6 L ずつ水をまきます。水は全部で何 L いりますか。
    answer: 5.04
    check: "24 * 35 * 6 / 1000"
    hints:
      - はじめに、花だんの面積を求めよう。長方形の面積は たて × よこ だね。
      - 2.4 × 3.5 を計算しよう。答えの小数点の位置に気をつけよう。
      - 面積が何 m² かわかったら、0.6 L のいくつ分かを考えて、かけ算をしよう。
    paths:
      - [面積は 2.4 × 3.5 = 8.4 m², 水は 0.6 × 8.4 = 5.04 L, 5.04]
      - [3.5 × 0.6 を先に計算すると 2.1, 2.4 × 2.1 = 5.04]
    note: 長方形の面積（G-008、たて × よこ）に小数をあてはめ、さらに小数 × 小数をもう 1 回する。小数点の位置を 2 回決めるので、とちゅうの 8.4 を 84 や 0.84 とするまちがいに気をつける。
  - part: 離
    kinds: [数]
    text: 2.5 × 3.7 × 0.4 + 0.63 ÷ 0.07 を計算しましょう。
    answer: 12.7
    check: "(25 * 37 * 4 + 63 // 7 * 1000) / 1000"
    hints:
      - 計算の順番を考えよう。たし算は最後だね。
      - 2.5 × 3.7 × 0.4 は、かける順番を入れかえて 2.5 × 0.4 を先に計算すると楽だよ。
      - 0.63 ÷ 0.07 は、わる数とわられる数の小数点を同じけただけ右へ移して計算しよう。
    paths:
      - [2.5 × 0.4 = 1 なので 2.5 × 3.7 × 0.4 = 3.7, 0.63 ÷ 0.07 = 63 ÷ 7 = 9, 3.7 + 9 = 12.7]
      - [前から順に 2.5 × 3.7 = 9.25、9.25 × 0.4 = 3.7, 0.63 ÷ 0.07 = 9, 3.7 + 9 = 12.7]
    note: 計算の順番（N-076）と、かける順の入れかえ（N-015）を小数で使う。2.5 × 3.7 から順に計算すると 9.25 × 0.4 になり手数がふえる。0.63 ÷ 0.07 を 0.9 とする小数点のまちがいも多い。
