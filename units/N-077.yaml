# N-077 小数のかけ算とわり算
#
# 書き方は N-001 の頭の注、小数の答えと check は N-020 の頭の注のとおり（check は 0.1、0.01、0.001 のいくつ分を整数で出して
#   10、100、1000 でわる。答えが整数になるときは「//」）。段 3 なので、子に見せる文は小 5 までの漢字で書く（移・確・個 は漢字。
#   けた、あまり、たしかめ はかな）。分かち書きはしない。数の前後には空白を入れる。「×」は U+00D7、「÷」は U+00F7。
# 前提は N-020（小数、小数第二位まで）、N-074（かけ算の筆算）、N-075（わり算の筆算）。
#   小数を「0.1（0.01）のいくつ分」とみて、整数のかけ算とわり算にもどす（N-020 の 4 日目の続き）。筆算は N-074、N-075 の形のまま、
#   小数点の位置だけを決める。
#   10 倍・10 分の 1 で位が動くきまり（N-073）は前提にないので、2 日目の見本で「2.4 は 0.1 が 24 こ。10 倍すると 0.1 が 240 こで 24」と
#   0.1 のいくつ分から出す。× 0.1 は「10 こに分けた 1 こ分」と言う。小数第三位（0.001）は 2 日目の見本で、0.01 を 10 こに分けた
#   1 こ分として出す。
#   小数 ÷ 小数は「わる数とわられる数の小数点を同じけただけ右へ移す」。わけは、わる数ずつ分けるとみて、0.1 のいくつ分どうしの
#   わり算にもどす（4.8 ÷ 1.2 は 0.1 が 48 こを 12 こずつ）。1 m あたりを求めるわり算（4 ÷ 1.6）は、0.1 m 分を先に求める道を
#   2 本目のみちすじに書いた。
# 数の大きさ：整数の部分は 1000 まで、小数は小数第三位まで（N-020 は第二位まで）。小数点をとった整数の筆算が 4 けたになるもの
#   （3.14 × 4 の 314 × 4 = 1256）も、N-074 の位ごとの計算で書けるので入れた（円周の 3.14 × 直径、G-010 のため）。
#   ただし 4 けたの整数を「0.01 が 1256 こ」と読ませることはしない（4 けたの数は N-073）。そのほかの筆算は N-074、N-075 の大きさの中。
# 答えの小数点より右の終わりの 0 は消す（2.10 は 2.1、15.0 は 15）。
# わり切れないわり算は、わり進めてわり切れるもの（3 ÷ 4 = 0.75）と、商を一の位まで求めてあまりを出すもの（あまりの小数点は
#   わられる数のもとの小数点にそろえる）だけ。概数で商を求めるのは N-061 が前提にないので扱わない。あまりのある答えは choices で、
#   check は (lambda q, r: f'{q} あまり {r / 10}')(*divmod(…))（わられる数とわる数を 0.1 のいくつ分にして divmod）。
# ( ) と、+ − × ÷ がまじった式（N-076）は前提にないので、2 つの計算がいる場面は文でたずね、みちすじで 2 回に分ける。
# 分数（N-016）は前提のたどりにあるが、小数と分数の関係は N-020 と同じく使わない。
# 場面は L、kg、m、g（N-020 と同じく量の名前として使う）。速さ（時速 4.8 km、A-007）と割合（2.5 %、A-005）はその単元で扱うので、
#   ここでは 4.8 × 1.5、12 ÷ 4.8、2.5 ÷ 100 のような計算だけにした。
# 筆算の図は svg（D-040）。N-074 と同じく数字を 1 字ずつ同じはばの列に置き、小数点は列と列のあいだに置く。見本にだけ付けた。
# 日の並び（既定）：1 日目 小数 × 整数、小数 ÷ 整数、2 日目 10 倍・100 倍・10 でわる と 小数 × 小数（頭に見本）、
#   3 日目 小数 ÷ 小数、わり進める、あまり（頭に見本）、4 日目 わけ、5 日目 N-020・N-074・N-075 と混ぜる、6 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-076 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

