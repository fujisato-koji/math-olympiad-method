# N-012 数のパズル（魔方陣、虫食い算）
#
# 書き方は N-001 の頭の注のとおり。段の物差しの大会のための単元（measure: true）。
# 前提は L-001（きまりを見つける）と N-007（2 けたの計算、筆算の入口）。
# 虫食い算は 2 けたのたし算・ひき算の筆算に限る（N-007 の範囲）。かけ算の虫食い算と 3 けたの筆算は扱わない。
# 魔方陣は 3×3 で、たて・よこ・ななめの 3 つの和が同じもの。数は 0〜9（和 15 と 12）と、その 10 足し（和 45）。
#   中央が平均になる・和は全体の 3 分の 1、などの性質は、わり算が前提にないので扱わない（全部わかっている並びから和を出す）。
# 図は行ごとに中央そろえなので、全角の数字・空白・記号（＋ － ━）でどの行も同じ字数にする。□ や ア、イ は 1 字の数字の代わり。
# check は □（または ア、イ）に入る数を総当たりで探し、答えが 1 つだけのときにその数を返す式（2 つ以上なら一覧が返り、道具が止まる）。
#   虫食い算：図の 1・2・4 行目を数として読み、2 行目の頭の ＋ か － で式を決める。魔方陣：入れた数で 8 本の和がそろうかを見る。
# 日の並び：1 日目 虫食い算（たし算）、2 日目 くり上がり・ひき算・くり下がり、3 日目 魔方陣、4 日目 わけ、5 日目 L-001 と N-007 と混ぜる。

