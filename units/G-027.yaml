# G-027 ベクトル
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は G-026 と G-024 に合わせる（負の数は「−」U+2212、成分と式と角は選ぶ問題）。
# 前の段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（前の水準 3）。
#   新しいきまりが出る日（1〜3 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入・練習 2 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 ベクトル（向きと大きさ、等しいベクトル）、和・差・実数倍、成分と大きさ、→AB の成分
#   2 日目 平行の条件（→b = k→a、a₁b₂ − a₂b₁ = 0）、単位ベクトル、位置ベクトル、内分点、直線のベクトル方程式
#   3 日目 内積（|→a||→b|cos θ と成分 a₁b₁ + a₂b₂）、なす角、垂直の条件、|→a + →b|² の展開
#   4 日目 わけ（内積の成分の式を余弦定理で、内分点の位置ベクトル、△OAB の面積 (1/2)|a₁b₂ − a₂b₁|。どれも ③）
#   5 日目 G-026・G-024 と混ぜる（法線ベクトルと直線の式、2 直線のなす角、中線の長さ、cos ∠BAC）　6 日目 確認
# 前提は G-026（座標と直線・円）と G-024（三角比と正弦・余弦定理）。前提のたどりに A-012（連立方程式）、A-017（平方完成）、
#   G-020（相似）、G-015（平行移動）がある。弧度法と加法定理（G-025）は前提にないので、角は度で表し、0° ≦ θ ≦ 180° に限った。
#   空間のベクトルは G-049（空間座標）、外積は M-013、行列は M-001 で扱うので、ここでは平面のベクトルだけにした。
#   1 次独立（係数を比べてよいわけ）は、日の問題では使わず、腕だめしで「→a と →b は平行でなく →0 でもない」として使う。
# ベクトルの書き方：画面で文字の上に矢印をのせられないので、→a、→AB のように矢印を字の前に書いた。大きさは |→a|、内積は →a・→b。
#   成分は (3, −2) のように書く。成分、式、角は選ぶ問題にし、打つ答えは大きさ、内積、文字の値、面積、cos の値（Fraction）。
#   成分を選ぶ check は、成分の計算の結果の組と等しいものを、→a、→b で表した式を選ぶ check は、具体的な点の座標を入れて
#   係数の組が問題の点を表すものを選ぶ。角を選ぶ check は、内積から求めた cos の値と選択肢の角の cos が近いものを選ぶ。
# 図は svg（D-040）。方眼の上の矢印は成分が読めるように格子の点から格子の点へ描き、求める和や点は描かない。
#   図とイラストの多い形に直した（D-131）。見本と答える問題のほとんどに図を付け、ヒントの 1〜2 段を図の付いたヒントにした。
#   内分は「→OP = →OA + →AP」の矢印、内積は「→b のかげ」（正なら同じがわ、負なら反対がわ）、成分の計算は表で見せる。
#   前の段 5 の字に合わせ、子の文では、きょり・x じく・ちょう点・かたむき・すじ道をかなで、えい角・どん角を「90° より小さい角・大きい角」と書いた。
# ベクトルは、運動と力（P-001、P-002）、行列と 1 次変換（M-001、M-002）、空間の図形（G-049）、外積（M-013）、
#   分子の形（H-018）、コンピュータの図形処理と機械学習の特徴量の入口になる（D-026）。

id: G-027
days:
  - day: 1
    items:
      - part: 見本
        id: "aeb45c7b59"
        text: 向きと大きさをもつ量を、矢印で表します（ベクトル）。矢印は、右へいくつ・上へいくつ進むか（成分）で決まり、図の →a は (3, 1) です。場所がちがっても、向きと長さが同じなら同じベクトルです。→a + →b は、→a の先に →b をつないだ矢印です。
        svg: '<svg viewBox="0 0 320 156" xmlns="http://www.w3.org/2000/svg"><g stroke="currentColor" stroke-opacity="0.18" stroke-width="1" fill="none"><line x1="17" y1="142" x2="17" y2="12"/><line x1="43" y1="142" x2="43" y2="12"/><line x1="69" y1="142" x2="69" y2="12"/><line x1="95" y1="142" x2="95" y2="12"/><line x1="121" y1="142" x2="121" y2="12"/><line x1="147" y1="142" x2="147" y2="12"/><line x1="173" y1="142" x2="173" y2="12"/><line x1="199" y1="142" x2="199" y2="12"/><line x1="225" y1="142" x2="225" y2="12"/><line x1="251" y1="142" x2="251" y2="12"/><line x1="277" y1="142" x2="277" y2="12"/><line x1="303" y1="142" x2="303" y2="12"/><line x1="17" y1="142" x2="303" y2="142"/><line x1="17" y1="116" x2="303" y2="116"/><line x1="17" y1="90" x2="303" y2="90"/><line x1="17" y1="64" x2="303" y2="64"/><line x1="17" y1="38" x2="303" y2="38"/><line x1="17" y1="12" x2="303" y2="12"/></g><line x1="43" y1="116" x2="121" y2="116" stroke="#7fc8f8" stroke-width="4" stroke-dasharray="6 4" stroke-opacity="0.9"/><line x1="121" y1="116" x2="121" y2="90" stroke="#7fc8f8" stroke-width="4" stroke-dasharray="6 4" stroke-opacity="0.9"/><text x="82" y="136" font-size="14" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">右へ 3</text><text x="129" y="108" font-size="14" text-anchor="start" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">上へ 1</text><line x1="43" y1="116" x2="147" y2="38" stroke="#f3c969" stroke-width="9" stroke-opacity="0.6" stroke-linecap="round"/><line x1="43" y1="116" x2="139.4" y2="43.7" stroke="currentColor" stroke-width="2.5"/><polygon points="147,38 141.2,48.6 135.2,40.6" fill="currentColor" stroke="none"/><text x="77.1" y="75.4" font-size="15" text-anchor="end" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">a</tspan> + →<tspan font-style="italic">b</tspan></text><line x1="43" y1="116" x2="112" y2="93" stroke="currentColor" stroke-width="2.5"/><polygon points="121,90 112.1,98.2 109,88.7" fill="currentColor" stroke="none"/><text x="87.2" y="92.5" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">a</tspan></text><line x1="121" y1="90" x2="142.8" y2="46.5" stroke="currentColor" stroke-width="2.5"/><polygon points="147,38 146.6,50.1 137.6,45.6" fill="currentColor" stroke="none"/><text x="144.7" y="74.4" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">b</tspan></text><line x1="199" y1="116" x2="268" y2="93" stroke="currentColor" stroke-width="2.5"/><polygon points="277,90 268.1,98.2 265,88.7" fill="currentColor" stroke="none"/><text x="233.9" y="95.7" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">a</tspan></text><text x="238" y="140" font-size="14" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">同じ →<tspan font-style="italic">a</tspan></text><circle cx="43" cy="116" r="3" fill="currentColor"/></svg>'
        explain: 点 A から点 B への向きのついた線分を有向線分といい、その向きと長さだけに目をつけたものをベクトルといって →AB と書きます。1 つの文字で →a のようにも書きます。向きも大きさ（長さ）も等しいベクトルは、位置がちがっても等しいとします。→AB の大きさを |→AB| と書きます。→AB + →BC = →AC と定め、→a + →b は、→a の終わりの点から →b をかいたときの、はじめの点から終わりの点までの矢印です。→a と大きさが等しく向きが反対のベクトルを −→a と書き、→a − →b = →a + (−→b) とします。どんな点 O についても →OB − →OA = →AB です。大きさが 0 のベクトルを →0 と書きます。実数 k に対して k→a は、k が正なら →a と同じ向きで大きさが k 倍、k が負なら反対の向きで大きさが |k| 倍のベクトルです。座標平面で、→a を原点から始まる矢印にしたときの終わりの点が (a₁, a₂) なら、→a = (a₁, a₂) と書き、これを →a の成分といいます。|→a| = √(a₁² + a₂²)（三平方の定理）、(a₁, a₂) + (b₁, b₂) = (a₁ + b₁, a₂ + b₂)、k(a₁, a₂) = (ka₁, ka₂) です。A(x₁, y₁)、B(x₂, y₂) なら →AB = (x₂ − x₁, y₂ − y₁) です。図では →a = (3, 1)、→b = (1, 2) で、→a + →b = (4, 3)、|→a + →b| = √(16 + 9) = 5 です。
