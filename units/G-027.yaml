# G-027 ベクトル
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は G-026 と G-024 に合わせる（負の数は「−」U+2212、成分と式と角は選ぶ問題）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜3 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入・練習 2 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 ベクトル（向きと大きさ、等しいベクトル）、和・差・実数倍、成分と大きさ、→AB の成分
#   2 日目 平行の条件（→b = k→a、a₁b₂ − a₂b₁ = 0）、単位ベクトル、位置ベクトル、内分点、直線のベクトル方程式
#   3 日目 内積（|→a||→b|cos θ と成分 a₁b₁ + a₂b₂）、なす角、垂直の条件、|→a + →b|² の展開
#   4 日目 わけ（内積の成分の式を余弦定理で、内分点の位置ベクトル、△OAB の面積 (1/2)|a₁b₂ − a₂b₁|。どれも ③）
#   5 日目 G-026・G-024 と混ぜる（法線ベクトルと直線の式、2 直線のなす角、中線の長さ、cos ∠BAC）　6 日目 確認
# 前提は G-026（座標と直線・円）と G-024（三角比と正弦・余弦定理）。前提のたどりに A-012（連立方程式）、A-017（平方完成）、
#   G-020（相似）、G-015（平行移動）がある。弧度法と加法定理（G-025）は前提にないので、角は度で表し、0° ≦ θ ≦ 180° に限った。
#   空間のベクトルは G-049（空間座標）、外積は M-013、行列は M-001 で扱うので、ここでは平面のベクトルだけにした。
#   1 次独立（係数を比べてよいわけ）は、日の問題では使わず、腕だめしで「→a と →b は平行でなく →0 でもない」として使う。
# ベクトルの書き方：画面で文字の上に矢印をのせられないので、→a、→AB のように矢印を字の前に書いた。大きさは |→a|、内積は →a・→b。
#   成分は (3, −2) のように書く。成分、式、角は選ぶ問題にし、打つ答えは大きさ、内積、文字の値、面積、cos の値（Fraction）。
#   成分を選ぶ check は、成分の計算の結果の組と等しいものを、→a、→b で表した式を選ぶ check は、具体的な点の座標を入れて
#   係数の組が問題の点を表すものを選ぶ。角を選ぶ check は、内積から求めた cos の値と選択肢の角の cos が近いものを選ぶ。
# 図は svg（D-040）。方眼の上の矢印は成分が読めるように格子の点から格子の点へ描き、求める和や点は描かない。
# ベクトルは、運動と力（P-001、P-002）、行列と 1 次変換（M-001、M-002）、空間の図形（G-049）、外積（M-013）、
#   分子の形（H-018）、コンピュータの図形処理と機械学習の特徴量の入口になる（D-026）。

id: G-027
days:
  - day: 1
    items:
      - part: 見本
        text: 向きと大きさをもつ量を、矢印で表してみましょう。
        svg: '<svg viewBox="0 0 204 178" xmlns="http://www.w3.org/2000/svg"><g stroke="currentColor" stroke-opacity=".18" stroke-width="1" fill="none"><line x1="24" y1="154" x2="24" y2="24"/><line x1="50" y1="154" x2="50" y2="24"/><line x1="76" y1="154" x2="76" y2="24"/><line x1="102" y1="154" x2="102" y2="24"/><line x1="128" y1="154" x2="128" y2="24"/><line x1="154" y1="154" x2="154" y2="24"/><line x1="180" y1="154" x2="180" y2="24"/><line x1="24" y1="154" x2="180" y2="154"/><line x1="24" y1="128" x2="180" y2="128"/><line x1="24" y1="102" x2="180" y2="102"/><line x1="24" y1="76" x2="180" y2="76"/><line x1="24" y1="50" x2="180" y2="50"/><line x1="24" y1="24" x2="180" y2="24"/></g><line x1="16" y1="128" x2="190" y2="128" stroke="currentColor" fill="none" stroke-width="2"/><line x1="50" y1="162" x2="50" y2="14" stroke="currentColor" fill="none" stroke-width="2"/><path d="M190 128 L182 124 L182 132 Z" fill="currentColor"/><path d="M50 14 L46 22 L54 22 Z" fill="currentColor"/><text x="192" y="142" font-size="14" text-anchor="end" font-style="italic">x</text><text x="57" y="20" font-size="14" text-anchor="start" font-style="italic">y</text><text x="46" y="141" font-size="11" text-anchor="end">O</text><text x="24" y="141" font-size="10" text-anchor="middle">−1</text><text x="76" y="141" font-size="10" text-anchor="middle">1</text><text x="102" y="141" font-size="10" text-anchor="middle">2</text><text x="128" y="141" font-size="10" text-anchor="middle">3</text><text x="154" y="141" font-size="10" text-anchor="middle">4</text><text x="180" y="141" font-size="10" text-anchor="middle">5</text><text x="46" y="157.5" font-size="10" text-anchor="end">−1</text><text x="46" y="105.5" font-size="10" text-anchor="end">1</text><text x="46" y="79.5" font-size="10" text-anchor="end">2</text><text x="46" y="53.5" font-size="10" text-anchor="end">3</text><text x="46" y="27.5" font-size="10" text-anchor="end">4</text><line x1="50" y1="128" x2="118.5" y2="105.2" stroke="currentColor" fill="none" stroke-width="2.5"/><path d="M128 102 L119.9 109.4 L117.1 100.9 Z" fill="currentColor"/><text x="91.6" y="124.1" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">a</tspan></text><line x1="128" y1="102" x2="149.5" y2="58.9" stroke="currentColor" fill="none" stroke-width="2.5"/><path d="M154 50 L153.6 61 L145.5 56.9 Z" fill="currentColor"/><text x="152.7" y="83.8" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">b</tspan></text><line x1="50" y1="128" x2="146" y2="56" stroke="currentColor" fill="none" stroke-width="2.5"/><path d="M154 50 L148.7 59.6 L143.3 52.4 Z" fill="currentColor"/><text x="83.8" y="68.2" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">a</tspan> + →<tspan font-style="italic">b</tspan></text></svg>'
        explain: 点 A から点 B への向きのついた線分を有向線分といい、その向きと長さだけに目をつけたものをベクトルといって →AB と書きます。1 つの文字で →a のようにも書きます。向きも大きさ（長さ）も等しいベクトルは、位置がちがっても等しいとします。→AB の大きさを |→AB| と書きます。→AB + →BC = →AC と定め、→a + →b は、→a の終わりの点から →b をかいたときの、はじめの点から終わりの点までの矢印です。→a と大きさが等しく向きが反対のベクトルを −→a と書き、→a − →b = →a + (−→b) とします。どんな点 O についても →OB − →OA = →AB です。大きさが 0 のベクトルを →0 と書きます。実数 k に対して k→a は、k が正なら →a と同じ向きで大きさが k 倍、k が負なら反対の向きで大きさが |k| 倍のベクトルです。座標平面で、→a を原点から始まる矢印にしたときの終わりの点が (a₁, a₂) なら、→a = (a₁, a₂) と書き、これを →a の成分といいます。|→a| = √(a₁² + a₂²)（三平方の定理）、(a₁, a₂) + (b₁, b₂) = (a₁ + b₁, a₂ + b₂)、k(a₁, a₂) = (ka₁, ka₂) です。A(x₁, y₁)、B(x₂, y₂) なら →AB = (x₂ − x₁, y₂ − y₁) です。図では →a = (3, 1)、→b = (1, 2) で、→a + →b = (4, 3)、|→a + →b| = √(16 + 9) = 5 です。
      - part: 思い出す
        text: 2 点 (−2, 3)、(4, −5) の間の距離はいくつですか。
        answer: 10
        check: "[d for d in range(1, 100) if d * d == (4 - (-2)) ** 2 + (-5 - 3) ** 2][0]"
        hints:
          - x 座標の差と、y 座標の差を求めましょう（G-026）。
          - 差の 2 乗の和が、距離の 2 乗です。
          - 2 乗すると その数になる正の数をさがしましょう。
        paths:
          - ["差は 6 と 8", "36 + 64 = 100", "距離は 10"]
      - part: 思い出す
        text: △ABC で、AB = 5、AC = 3、∠A = 120° のとき、BC の長さはいくつですか。
        answer: 7
        check: "[a for a in range(1, 50) if a * a == 25 + 9 - 2 * 5 * 3 * Fraction(-1, 2)][0]"
        hints:
          - 余弦定理を使いましょう（G-024）。
          - cos 120° = −1/2 です。
          - BC² を求めてから、2 乗すると その数になる正の数をさがしましょう。
        paths:
          - ["BC² = 25 + 9 − 2 × 5 × 3 × (−1/2) = 49", "BC = 7"]
      - part: 今日
