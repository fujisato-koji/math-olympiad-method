        svg: '<svg viewBox="0 0 320 192" xmlns="http://www.w3.org/2000/svg"><polygon points="40,166 290,166 130,40" fill="#f3c969" fill-opacity="0.3" stroke="none"/><line x1="290" y1="166" x2="130" y2="40" stroke="currentColor" stroke-width="2"/><line x1="40" y1="166" x2="280.5" y2="166" stroke="currentColor" stroke-width="2.5"/><polygon points="290,166 279,171 279,161" fill="currentColor" stroke="none"/><line x1="40" y1="166" x2="124.5" y2="47.7" stroke="currentColor" stroke-width="2.5"/><polygon points="130,40 127.7,51.9 119.5,46" fill="currentColor" stroke="none"/><text x="150" y="130" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">S</text><path d="M66 166 A26 26 0 0 0 55.1 144.8" stroke="currentColor" fill="none" stroke-width="1.8"/><text x="80" y="154" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round"><tspan font-style="italic">θ</tspan></text><text x="32" y="182" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">O</text><text x="300" y="182" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">A</text><text x="130" y="30" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">B</text><text x="205" y="186" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">a</tspan></text><text x="75" y="103" font-size="15" text-anchor="end" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">→<tspan font-style="italic">b</tspan></text></svg>'
        explain: 例：「→a と →b のなす角を θ とすると、三角形の面積の式（G-024）から S = (1/2)|→a||→b|sin θ である。0° < θ < 180° なので sin θ は正で、sin θ = √(1 − cos²θ)。よって S = (1/2)√(|→a|²|→b|² − |→a|²|→b|²cos²θ) = (1/2)√(|→a|²|→b|² − (→a・→b)²)。成分で計算すると、|→a|²|→b|² − (→a・→b)² = (a₁² + a₂²)(b₁² + b₂²) − (a₁b₁ + a₂b₂)² = a₁²b₂² + a₂²b₁² − 2a₁b₂a₂b₁ = (a₁b₂ − a₂b₁)²。よって S = (1/2)√((a₁b₂ − a₂b₁)²) = (1/2)|a₁b₂ − a₂b₁| である。」と書ければよい。① θ を決め、面積を sin θ で表す、② cos θ を内積で表し、成分で展開して 2 乗の形にまとめる、③ 約束した事実（三角形の面積の式、sin²θ + cos²θ = 1、内積の成分の式）で結ぶ、の 3 つを見る。√ の中の 2 乗をはずすと、もとの数が負のこともあるので絶対値がつくことにふれる。G-026 の 7 日目の、長方形からひく面積の求め方と答えが合うことも確かめさせるとよい。
