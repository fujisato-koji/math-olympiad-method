        explain: 例：「O を原点とし、→OA = →a、→OB = →b となる点 A(a₁, a₂)、B(b₁, b₂) をとり、→a と →b のなす角を θ とする。O、A、B が 1 つの直線の上にないとき、△OAB で余弦定理（G-024）から AB² = OA² + OB² − 2 × OA × OB × cos θ = |→a|² + |→b|² − 2→a・→b である。一方、2 点間のきょりの式（G-026）から AB² = (b₁ − a₁)² + (b₂ − a₂)² = (a₁² + a₂²) + (b₁² + b₂²) − 2(a₁b₁ + a₂b₂) = |→a|² + |→b|² − 2(a₁b₁ + a₂b₂) である。2 つの式をくらべて、→a・→b = a₁b₁ + a₂b₂ である。O、A、B が 1 つの直線の上にあるとき（θ = 0° か 180°）は、→b = k→a と表せて、両辺がどちらも k(a₁² + a₂²) になる。」と書ければよい。① A、B と θ を決める、② AB² を 2 通りに表して展開する、③ 約束した事実（内積の定め方、余弦定理、2 点間のきょり）で結ぶ、の 3 つがそろっているかを見る。θ = 0°、180° のときは三角形ができないので、分けて確かめているかも見る。具体的なベクトルで計算しただけで終わっていたら、例ではすべての場合を示せないことを話す。
