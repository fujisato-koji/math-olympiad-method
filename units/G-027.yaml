        choices: ["(5, −5)", "(3, 1)", "(5, 1)", "(3, −5)"]
        answer: (5, −5)
        check: "[k for k, p in {'(5, −5)': (5, -5), '(3, 1)': (3, 1), '(5, 1)': (5, 1), '(3, −5)': (3, -5)}.items() if p == (2 * 2 - (-1), 2 * (-1) - 3)][0]"
        hints:
          - 2→a の成分は、→a の成分をそれぞれ 2 倍したものです。
          - 2→a − →b は、x 成分どうし、y 成分どうしで計算します。
          - 負の数をひくときの符号に気をつけましょう。
        paths:
          - ["2→a = (4, −2)", "2→a − →b = (4 − (−1), −2 − 3) = (5, −5)"]
        note: (3, 1) は 2→a + →b。
