olor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">C</text><text x="44.8" y="110.8" font-size="15" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">D</text><text x="104.2" y="115" font-size="15" text-anchor="start" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">P</text></svg>'
