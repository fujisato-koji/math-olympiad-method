        explain: →0 でない 2 つのベクトル →a、→b を、はじめの点をそろえてかいたときにできる角 θ（0° ≦ θ ≦ 180°）を、→a と →b のなす角といいます。|→a||→b|cos θ を →a と →b の内積といい、→a・→b と書きます。内積はベクトルではなく数です。図の色の線は →b の先から →a の直線に下ろした「かげ」で、内積は |→a| ×（かげの長さ。反対がわなら負）と同じです。成分で →a = (a₁, a₂)、→b = (b₁, b₂) のとき、→a・→b = a₁b₁ + a₂b₂ です（わけは 4 日目）。→a・→a = |→a|² です。なす角は cos θ = →a・→b/(|→a||→b|) で求めます。→a と →b が垂直であることは、θ = 90°、つまり →a・→b = 0 と同じです。例：→a = (1, 2)、→b = (3, 1) なら、→a・→b = 3 + 2 = 5、|→a| = √5、|→b| = √10 なので cos θ = 5/√50 = 1/√2 で、θ = 45° です。内積には →a・→b = →b・→a、→a・(→b + →c) = →a・→b + →a・→c、(k→a)・→b = k(→a・→b) が成り立つので（成分で確かめられます）、文字の式と同じように展開できます。例：|→a + →b|² = (→a + →b)・(→a + →b) = |→a|² + 2→a・→b + |→b|² です。
