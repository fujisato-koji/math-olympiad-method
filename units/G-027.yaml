        text: 2 つのベクトルの内積を、→a・→b = |→a||→b|cos θ と決めます。成分なら a₁b₁ + a₂b₂ です。なす角 θ が 90° より小さいと正、90° なら 0（垂直）、90° より大きいと負になります。
