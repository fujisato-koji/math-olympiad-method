      - ["終わりの点 (3 + t, 1 + 2t) は、(3, 1) を通り方向ベクトル (1, 2) の直線の上", "その直線は 2x − y − 5 = 0", "原点とのきょりは 5/√5 = √5"]
    note: 2 次式の最小（平方完成）と、点と直線のきょり（G-026）の 2 つのすじ道がある。いちばん小さくなるとき、→a + t→b = (2, −1) は →b と垂直になる（内積 0）ことにも気づかせたい。
  - part: 離
    id: "ebd1b6bbb7"
    kinds: [読み取り]
    text: 川は東へ毎秒 3 m の速さで流れていて、川はばは 60 m です。静かな水の上なら毎秒 5 m で進むボートで、こちらの岸の地点から、真北にある向かい岸の地点へまっすぐ進みます。ボートは流れに流されないように、少し上流に向けて進みます。向かい岸に着くまで何秒かかりますか。
    svg: '<svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="140" x2="230" y2="140" stroke="currentColor" fill="none" stroke-width="2"/><line x1="10" y1="40" x2="230" y2="40" stroke="currentColor" fill="none" stroke-width="2"/><text x="14" y="157" font-size="13" text-anchor="start" fill="currentColor">こちらの岸</text><text x="14" y="31" font-size="13" text-anchor="start" fill="currentColor">向かい岸</text><path d="M14 92 Q32 84 50 92 T86 92" stroke="#7fc8f8" fill="none" stroke-width="2"/><path d="M14 110 Q32 102 50 110 T86 110" stroke="#7fc8f8" fill="none" stroke-width="2"/><line x1="146" y1="80" x2="200" y2="80" stroke="currentColor" fill="none" stroke-width="2.5"/><path d="M211 80 L200 85 L200 75 Z" fill="currentColor"/><text x="178" y="100" font-size="13" text-anchor="middle" fill="currentColor">流れ 毎秒 3 m</text><line x1="110" y1="140" x2="110" y2="40" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><text x="104" y="118" font-size="13" text-anchor="end" fill="currentColor">60 m</text><circle cx="110" cy="140" r="3.5" fill="currentColor"/><circle cx="110" cy="40" r="3.5" fill="currentColor"/><text x="232" y="22" font-size="13" text-anchor="end" fill="currentColor">北</text><line x1="214" y1="32" x2="214" y2="18" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M214 8 L218.5 18 L209.5 18 Z" fill="currentColor"/></svg>'
    answer: 15
    check: "Fraction(60, [v for v in range(1, 10) if v * v + 3 * 3 == 5 * 5][0])"
    hints:
      - 岸から見たボートの速度は、（静かな水に対するボートの速度）＋（川の流れの速度）です。
      - text: 岸から見て真北に進むので、3 つの速度は図のような直角三角形になります。
        svg: '<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg"><line x1="190" y1="172" x2="100" y2="52" stroke="#7fc8f8" stroke-width="9" stroke-opacity="0.6" stroke-linecap="round"/><line x1="190" y1="172" x2="105.7" y2="59.6" stroke="currentColor" stroke-width="2.5"/><polygon points="100,52 110.6,57.8 102.6,63.8" fill="currentColor" stroke="none"/><line x1="100" y1="52" x2="190" y2="52" stroke="#f3c969" stroke-width="9" stroke-opacity="0.6" stroke-linecap="round"/><line x1="100" y1="52" x2="180.5" y2="52" stroke="currentColor" stroke-width="2.5"/><polygon points="190,52 179,57 179,47" fill="currentColor" stroke="none"/><line x1="190" y1="172" x2="190" y2="61.5" stroke="currentColor" stroke-width="2.2" stroke-dasharray="6 4"/><polygon points="190,52 195,63 185,63" fill="currentColor" stroke="none"/><path d="M181 52 L181 61 L190 61" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="132" y="116" font-size="14" text-anchor="end" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">水に対する速さ 5</text><text x="145" y="40" font-size="14" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">流れ 3</text><text x="200" y="116" font-size="14" text-anchor="start" fill="currentColor" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">岸から見た速さ ?</text></svg>'
      - 静かな水に対する速度の、北向きの成分を求めましょう。大きさは 5 です。
    paths:
      - ["東を x、北を y とする", "流れは (3, 0)、ボートの水に対する速度は (−3, v)", "大きさが 5 なので 9 + v² = 25 で v = 4", "岸から見た速度は (0, 4)", "60 ÷ 4 = 15 秒"]
      - ["速度の三角形は、ななめの辺が 5、横の辺が 3 の直角三角形", "たての辺は 4（三平方の定理）", "60 ÷ 4 = 15 秒"]
    note: 速度をベクトルとして足す見方（P-001 の運動の表し方につながる）。毎秒 5 m のまま 60 ÷ 5 = 12 秒としやすい。ボートは北から上流の側へ、cos の値が 4/5 の角だけ向ける。
