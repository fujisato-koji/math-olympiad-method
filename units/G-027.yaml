        text: 2 点 A(2, 5)、B(−1, 1) について、→BA の成分はどれですか。
        choices: ["(3, 4)", "(−3, −4)", "(1, 6)", "(−1, 6)"]
        answer: (3, 4)
        check: "[k for k, p in {'(3, 4)': (3, 4), '(−3, −4)': (-3, -4), '(1, 6)': (1, 6), '(−1, 6)': (-1, 6)}.items() if p == (2 - (-1), 5 - 1)][0]"
