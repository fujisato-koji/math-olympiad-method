        explain: →0 でない 2 つのベクトル →a、→b が同じ向きか反対の向きのとき、→a と →b は平行であるといい、→a ∥ →b と書きます。→a ∥ →b であることは、→b = k→a となる実数 k があることと同じです。成分では、→a = (a₁, a₂)、→b = (b₁, b₂) が平行であることは a₁b₂ − a₂b₁ = 0 と同じです。3 点 A、B、C が 1 つの直線の上にあることは、→AC = k→AB となる k があることと同じです。大きさが 1 のベクトルを単位ベクトルといい、→a と同じ向きの単位ベクトルは (1/|→a|)→a です。点 O を決めて、点 A を →OA = →a で表すとき、→a を A の位置ベクトルといい、A(→a) と書きます。A(→a)、B(→b) のとき →AB = →b − →a です。線分 AB を m:n に内分する点 P の位置ベクトルは →p = (n→a + m→b)/(m + n) です（わけは 4 日目）。図では m:n = 2:1 で、P は B に近いので、→b の係数のほうが大きくなります。中点は (→a + →b)/2 です。点 A(→a) を通り、→d に平行な直線の上の点 P(→p) は、実数 t を使って →p = →a + t→d と表せます（直線のベクトル方程式。→d を方向ベクトルといいます）。例：A(1, 3) を通り →d = (2, −1) に平行な直線は (x, y) = (1, 3) + t(2, −1)、つまり x = 1 + 2t、y = 3 − t です。
