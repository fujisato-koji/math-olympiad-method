# H-060 固体・液体・気体
#
# 段 1・水準 1・5 日。形とかさ（かたい物は入れ物を変えても形が変わらない。水のように流れる物は入れ物の形になるが、かさは変わらない）、空気も場所をとる、とじこめた空気は押すと縮み水は縮まない、ろうやバターは温めるととけることを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。1 日目 形とかさ、2 日目 空気（場所をとる、押すと縮む、水は縮まない）、3 日目 わけ（ろうやバターがとけて広がるわけ）、4 日目 混ぜる、5 日目 確認。
# 図の約束：とじこめた空気はうすい灰色でぬる（2 日目の見本で子に言う）。点線は押す前・うつす前の位置。赤い矢印は「あたためる」（H-002 と同じ）、黒い矢印は「おす」「うつす」とはば、むらさきの矢印は空気のうごき。ストローはみどり。
# 火（フライパン、ろうそく）や包丁を使う場面には「おうちの ひとと いっしょに」を付けた。
# 腕だめし（離）は 2 問とも、絵を読む読み取り（kinds: 読み取り）。
# 粒で説明すること・重さが変わらないことは H-003、冷やすと固まる（もどる変化）は H-062、温度計は P-189 で扱うので、ここでは問わない。
# 5 日目の挑戦（石を沈めると水面が上がる）は「物も場所をとる」の広げとして置いた。とける前後でかさが少し変わるので、とける問題ではかさを問わない。

id: H-060
