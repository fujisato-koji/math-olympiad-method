        explain: |-
          石や つみきの ような かたい もの（こたい）は、じぶんの かたちを もって いて、いれものを かえても かたちが かわりません。水や ジュースの ような ながれる もの（えきたい）は、きまった かたちが なく、入れた いれものの かたちに なります。でも、こぼしたり たしたり しなければ、かさは かわりません。ほそい コップに うつすと 水の たかさは たかく なりますが、それは コップが ほそい からで、水が ふえた わけでは ありません。
          おなじ 水を いろいろな いれものに うつし、さいごに もとの コップに もどすと、もとの たかさに なる ことを いっしょに たしかめると よい。
