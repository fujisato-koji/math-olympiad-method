ntColor" stroke-width="2" stroke-linecap="round"/><rect x="242" y="149" width="40" height="10" rx="3" fill="currentColor" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><rect x="248" y="84" width="28" height="8" rx="2" fill="currentColor" fill-opacity=".45" stroke="currentColor" stroke-width="1.5"/><rect x="259" y="44" width="6" height="40" fill="#c8ccd6" fill-opacity=".9" stroke="currentColor" stroke-width="1.5"/><rect x="244" y="38" width="36" height="6" rx="3" fill="#c8ccd6" fill-opacity=".9" stroke="currentColor" stroke-width="1.5"/><line x1="237" y1="92" x2="287" y2="92" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="262" y1="12" x2="262" y2="25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="262,35 255.8,25 268.2,25" fill="currentColor"/><text x="55" y="182" font-size="13" text-anchor="middle" fill="currentColor">ばしょを とる</text><text x="168" y="182" font-size="13" text-anchor="middle" fill="currentColor">空気は ちぢむ</text><text x="262" y="182" font-size="13" text-anchor="middle" fill="currentColor">水は ちぢまない</text><text x="142" y="58" font-size="13" text-anchor="end" fill="currentColor">おしぼう</text><line x1="144" y1="55" x2="151" y2="63" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="140" y="140" font-size="13" text-anchor="end" fill="currentColor">つつ</text><line x1="142" y1="136" x2="151" y2="130" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
        explain: |-
          空気は 目に 見えませんが、そこに あって ばしょを とって います。ふくろの 口を とじると、中の 空気が ばしょを とるので、ふくろは ふくらんだ ままに なります。
          つつに とじこめた 空気は、おすと ちぢんで かさが 小さく なり、ちぢめる ほど 手を おしかえす 力が 大きく なります。手を はなすと もとの かさに もどります。水は、おしても ほとんど ちぢみません。
