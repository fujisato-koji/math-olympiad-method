        text: |-
          石や つみきの ような かたい ものは、どの いれものに 入れても かたちが かわりません。
          水の ように ながれる ものは、入れた いれものの かたちに なります。
          水を べつの いれものに うつしても、水の かさ（どれだけ あるか）は かわりません。
