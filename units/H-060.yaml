    items:
      - part: 見本
        text: |-
          空気は 目に 見えないけれど、まわりに あって、ばしょを とります。ふくろに 空気を とじこめると、ふくろが ふくらみます。
          つつに とじこめた 空気は、おしぼうで おすと ちぢみます。手を はなすと もとに もどります。
          つつに とじこめた 水は、おしても ちぢみません。
          えでは、とじこめた 空気を うすい はいいろで かきます。てんせんは、おす まえの ところです。
