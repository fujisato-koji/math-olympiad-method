        note: 1/n → 0 だけを見て 0 に収束するとしやすい。
      - part: 今日
        text: a₁ = 3、aₙ₊₁ = (1/4)aₙ + 6 で定まる数列 {aₙ} の極限値はいくつですか。
        answer: 8
        check: "Fraction([a for a in itertools.accumulate(range(200), lambda a, _: a / 4 + 6, initial=3)][-1]).limit_denominator(100)"
        hints:
          - α = (1/4)α + 6 を満たす α を求めましょう。
          - aₙ₊₁ − α = (1/4)(aₙ − α) と変形しましょう。
          - (1/4)ⁿ⁻¹ は 0 に近づきます。
        paths:
          - [α = 8, aₙ − 8 = −5(1/4)ⁿ⁻¹, 極限値は 8]
      - part: 今日
        text: 無限等比級数 12 − 4 + 4/3 − 4/9 + … の和はいくつですか。
        answer: 9
        check: "sum(12 * Fraction(-1, 3) ** k for k in range(300)).limit_denominator(100)"
        hints:
          - 公比は −4 ÷ 12 です。
          - −1 < r < 1 なので、収束します。
          - 和は a/(1 − r) です。
        paths:
          - [a = 12、r = −1/3, 12 ÷ (4/3), 9]
      - part: 今日
        text: 無限級数 1/(1 × 4) + 1/(4 × 7) + 1/(7 × 10) + … の和はいくつですか。
        answer: 1/3
        check: "Fraction(sum(1 / ((3 * k - 2) * (3 * k + 1)) for k in range(1, 10**5))).limit_denominator(100)"
        hints:
          - 第 k 項は 1/((3k − 2)(3k + 1)) です。
          - 1/(3k − 2) − 1/(3k + 1) を通分すると、分子はいくつでしょう。
          - 部分和を n の式で表してから、極限を求めましょう。
        paths:
          - [1/((3k − 2)(3k + 1)) = (1/3)(1/(3k − 2) − 1/(3k + 1)), Sₙ = (1/3)(1 − 1/(3n + 1)), 1/3]
    extra:
      - part: 今日
        text: lim (n→∞) (n² − 3n)/(2n² + n + 1) を求めましょう。
        answer: 1/2
        accept: [0.5]
        check: "Fraction(10**18 - 3 * 10**9, 2 * 10**18 + 10**9 + 1).limit_denominator(100)"
        hints:
          - 分母の最高次の項は n² です。
          - 分母と分子を n² で割りましょう。
          - 3/n、1/n、1/n² は 0 に近づきます。
        paths:
          - [(1 − 3/n)/(2 + 1/n + 1/n²), 1/2]
      - part: 今日
        text: 無限等比級数 3 + 3/4 + 3/16 + … の和はいくつですか。
        answer: 4
        check: "sum(3 * Fraction(1, 4) ** k for k in range(200)).limit_denominator(100)"
        hints:
          - 公比は (3/4) ÷ 3 です。
          - −1 < r < 1 なので、収束します。
          - 和は a/(1 − r) です。
        paths:
          - [a = 3、r = 1/4, 3 ÷ (3/4), 4]
      - part: 今日
        text: 循環小数 0.363636…（36 をくり返す）を分数で表しましょう。
        answer: 4/11
        check: "sum(Fraction(36, 100) * Fraction(1, 100) ** k for k in range(100)).limit_denominator(100)"
        hints:
          - 0.36 + 0.0036 + 0.000036 + … と書けます。
          - 初項 36/100、公比 1/100 の無限等比級数です。
          - 和を求めてから約分しましょう。
        paths:
          - [(36/100) ÷ (99/100), 36/99, 4/11]

# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 手数]
    uses: [D-001]
    text: 無限等比級数 8 + 6 + 9/2 + 27/8 + … の和を S、初項から第 n 項までの部分和を Sₙ とします。S − Sₙ が 1/10 より小さくなる最小の自然数 n はいくつですか。log₁₀ 2 = 0.3010、log₁₀ 3 = 0.4771 とします。
    answer: 21
    check: "(lambda S: [n for n in range(1, 200) if S - sum(8 * Fraction(3, 4) ** k for k in range(n)) < Fraction(1, 10)][0])(sum(8 * Fraction(3, 4) ** k for k in range(400)).limit_denominator(100))"
    hints:
      - まず S と Sₙ を求めて、S − Sₙ を n の式で表そう。
      - S − Sₙ < 1/10 を (3/4)ⁿ についての不等式にして、両辺の常用対数をとろう。
      - log₁₀ (3/4) は負の数だね。log₁₀ 320 も log₁₀ 2 で表せるよ。
    paths:
      - [S = 32、Sₙ = 32(1 − (3/4)ⁿ), S − Sₙ = 32(3/4)ⁿ < 1/10, (3/4)ⁿ < 1/320, n(0.4771 − 0.6020) < −(5 × 0.3010 + 1), −0.1249n < −2.505, n > 20.05…, 21]
    note: 無限等比級数の和、部分和の公式（A-022）、常用対数（D-001）、不等式の向き（A-013）を順につなぐ。320 = 2⁵ × 10 と分けて対数を求めるところ、負の数で割って向きを変えるところでつまずきやすい。20.05… と 20 にとても近いので、近い値の計算をていねいにする。
  - part: 離
    kinds: [数]
    text: 第 k 項が (2ᵏ⁺¹ + (−3)ᵏ⁻¹)/6ᵏ である無限級数 5/6 + 5/36 + 25/216 + 5/1296 + … の和はいくつですか。
    answer: 10/9
    check: "sum(Fraction(2 ** (k + 1) + (-3) ** (k - 1), 6 ** k) for k in range(1, 300)).limit_denominator(100)"
    hints:
      - 項を 2ᵏ⁺¹/6ᵏ と (−3)ᵏ⁻¹/6ᵏ の 2 つに分けてみよう。
      - 2ᵏ⁺¹/6ᵏ = 2 × (1/3)ᵏ、(−3)ᵏ⁻¹/6ᵏ = (1/6) × (−1/2)ᵏ⁻¹ と書けるね。
      - 2 つの無限等比級数の初項と公比を読み取って、それぞれの和を足そう。
    paths:
      - [2ᵏ⁺¹/6ᵏ の和は 2 × (1/3) ÷ (1 − 1/3) = 1, (−3)ᵏ⁻¹/6ᵏ の和は (1/6) ÷ (1 + 1/2) = 1/9, 1 + 1/9 = 10/9]
    note: 並んだ項（5/6、5/36、25/216、…）を見ても等比数列ではなく、一般項を 2 つの等比数列に分けて初めて見える。(−3)ᵏ⁻¹ の指数のずれと、公比 −1/2 の符号でまちがえやすい。2 つに分けてよいのは、どちらも収束するから。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [C-043]
    text: A と B が交互にさいころを投げます。A が先に投げ、A は 1 回に 1 個、B は 1 回に 2 個のさいころを投げます。投げたさいころのどれかに 6 の目が出た人の勝ちで、そこで終わります。A が勝つ確率はいくつですか。
    answer: 36/91
    check: "(lambda q: sum((Fraction(5, 6) * q) ** k * Fraction(1, 6) for k in range(400)).limit_denominator(100))(Fraction(sum(1 for a, b in itertools.product(range(1, 7), repeat=2) if a != 6 and b != 6), 36))"
    hints:
      - 1 回の番で、A が 6 を出さない確率と、B が 2 個とも 6 を出さない確率を求めよう（C-043）。
      - A が勝つのは、A の 1 回目、2 回目、… のどこかで、それまで 2 人とも 6 を出さなかったときだね。
      - A が k 回目の番で勝つ確率を k = 1 から限りなく足すと、無限等比級数になるよ。
    paths:
      - [A が 6 を出す確率 1/6、B が 6 を出さない確率 25/36, 1 往復で 2 人とも出さない確率 (5/6)(25/36) = 125/216, A が勝つ確率は 1/6 + (125/216)(1/6) + (125/216)²(1/6) + …, (1/6) ÷ (91/216) = 36/91]
      - [A が勝つ確率を p とする, 1 往復で決まらなければ はじめと同じ形にもどる, p = 1/6 + (125/216)p, p = 36/91]
    note: 独立な試行の確率（C-043）と無限等比級数を合わせる。B は 2 個投げるので「6 を出さない確率」は 5/6 ではなく 25/36。終わらない場合の確率は 0 に近づくので、A の勝つ確率と B の勝つ確率（55/91）の和は 1 になる。2 本目は、ゲームが同じ形にもどることを使う見方。
