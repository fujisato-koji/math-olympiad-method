# D-002 数列の極限と無限級数（高校）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019、A-018 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   導入の日と、新しいきまりが出る練習の日（2〜5 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：数列の極限（収束と極限値、正の無限大・負の無限大に発散、振動）、極限の性質、1/n → 0、(an + b)/(cn + d) は n で割る。
#   2 日目：極限の計算（分母の最高次の項で割る、次数のちがい、√(n² + an) − n は分子を有理化、Σ を使う (1² + 2² + … + n²)/n³）。
#   3 日目：rⁿ の極限（r > 1、r = 1、−1 < r < 1、r ≦ −1）、いちばん大きい累乗で割る、はさみうちの原理（(−1)ⁿ/n → 0）。
#   4 日目：無限級数と部分和、無限等比級数の和 a/(1 − r)、循環小数を分数に、漸化式 aₙ₊₁ = paₙ + q で定まる数列の極限。
#   5 日目：差の形で消し合う無限級数、第 n 項が 0 に近づかなければ発散、x を含む無限等比級数の収束の条件、図形の無限の和。
#   6 日目：わけ（3 問とも ③：無限等比級数の和、収束すれば第 n 項 → 0、調和級数は発散）。
#   7 日目：A-022、D-001、A-018 と混ぜる（漸化式、常用対数で n を求める、はね返るボール、コッホ雪片の面積）。8 日目：確認。
# 前提は A-022（数列と漸化式）、D-001（指数関数と対数関数）、A-018（Σ と和の変形）。たどりに A-013（不等式）、L-012（帰納法）、
#   A-004（等差数列）、A-016（平方根）、A-017（2 次方程式）がある。
#   A-022 と D-001 は同時に別の係が作っているので、題とそのまた前提から、次の中身とみなした。
#     A-022：等差・等比数列の一般項と和 Sₙ = a(1 − rⁿ)/(1 − r)（r ≠ 1）、Σ、漸化式 aₙ₊₁ = paₙ + q を aₙ₊₁ − α = p(aₙ − α) と変形して一般項を求める。
#     D-001：0 と負の整数の指数（(1/2)⁻³ = 8）、有理数の指数、指数関数の増加・減少、対数の性質、常用対数と桁数（log₁₀ 2 = 0.3010 などは問題で与える）。
#   関数の極限（D-003）はたどりにないので、数列の極限だけを扱い、lim (x→a) は使わない。
#   三角関数（G-025）もたどりにないので、sin n/n のような例は使わず、はさみうちの原理は (−1)ⁿ を含む数列で示す。
#   部分分数分解（A-037）はたどりにない。差の形は A-018 の 3 日目の 1/(k(k + 1)) = 1/k − 1/(k + 1) と、それを 1/2 倍、1/3 倍する形
#   （1/((2k − 1)(2k + 1)) = (1/2)(1/(2k − 1) − 1/(2k + 1))）だけを使い、分け方は確かめ算（通分）で確かめる。
#   収束の厳密な定義（ε-N 論法）と、単調で有界な数列が収束すること（実数の連続性）は水準 4 なので扱わず、「限りなく近づく」の意味で使う。
#   (1 + 1/n)ⁿ が 2.718… に近づくことは、7 日目の予備で値の近づき方を見るだけにした（e の名前を出すだけで、使わない）。
# 記号：極限は「lim (n→∞) aₙ」と 1 行で書く（1 日目の見本で、教科書では n→∞ を lim の下に書くと教える）。「n → ∞ のとき aₙ → α」も使う。
#   無限級数は「a₁ + a₂ + a₃ + …」と項を並べて書き、Σ は A-018 の書き方で「Σ aₙ（n = 1〜∞）」と 1 行で書く。
#   累乗は上つき文字（2ⁿ⁺¹、(2/3)ⁿ）、番号は下つき文字（aₙ₊₁）で書く（L-012 と同じ）。分数の項は 1/(1 × 3) のように書く。
# 答えは数を打つ。収束・発散のようす、数列の式、x の範囲を選ぶ問題は choices。
# check：極限は大きな n（10⁹ など）の値を Fraction で計算し、limit_denominator(100) で分数にそろえる。rⁿ の式は n = 200 の値、
#   √ の式は math.sqrt で n = 10⁵〜10⁶ の値を使う。無限級数は部分和を計算して分数にそろえる（等比級数は Fraction で 200 項ほど、
#   差の形の級数は小数で 10⁵ 項）。漸化式は itertools.accumulate で 200 回くり返す。
#   収束・発散を選ぶ問題は、大きな n での値、となり合う n の値の差、部分和の増え方（10⁴ 項から 2 × 10⁴ 項までの和が 1 をこえるか）で選び出す。
#   x の範囲を選ぶ問題は、選択肢の範囲が、いくつかの x で、実際に項が 0 に近づくかどうかと一致するものを選び出す。
# 図は svg（D-040）。数列の値は点で描き、極限値の線は見本の図にだけ引く。問題の図には答えの値を書かない。
# 数列の極限と無限級数は、関数の極限と微分・積分（D-003 から）、年金現価と利率の計算（F-005）、確率の無限の和、
#   反復計算の収束（K-160）、フラクタルの長さと面積の入口になる（D-026）。

