  - day: 5
    items:
      - part: 見本
        text: 無限級数 1/(1 × 2) + 1/(2 × 3) + 1/(3 × 4) + … の和を求めてみましょう。また、無限級数 1/2 + 2/3 + 3/4 + … が収束するかを調べてみましょう。
        explain: 第 k 項は 1/(k(k + 1)) = 1/k − 1/(k + 1) と、差の形に分けられます（A-018）。部分和は Sₙ = (1 − 1/2) + (1/2 − 1/3) + … + (1/n − 1/(n + 1)) = 1 − 1/(n + 1) で、1/(n + 1) → 0 なので Sₙ → 1、和は 1 です。無限級数の和は、このように部分和 Sₙ を n の式で表してから極限を求めます。いきなり「無限個の項を足す」ことはできないので、かならず部分和を通します。一方、1/2 + 2/3 + 3/4 + … の第 n 項 n/(n + 1) は 1 に収束し、0 に近づきません。どの項も 1/2 以上なので Sₙ ≧ n/2 となり、Sₙ は正の無限大に発散します。一般に、無限級数が収束するなら、第 n 項は 0 に収束します（わけは 6 日目）。だから、第 n 項が 0 に収束しない無限級数は発散します。ただし、第 n 項が 0 に収束しても、無限級数が収束するとはかぎりません（6 日目の 1 + 1/2 + 1/3 + …）。
      - part: 思い出す
