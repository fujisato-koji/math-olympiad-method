          - 分母と分子に √(n² + 6n) + n をかけて、分子を有理化しましょう。
          - 分母と分子を n で割りましょう。
        paths:
          - [6n/(√(n² + 6n) + n), 6/(√(1 + 6/n) + 1), 6/2 = 3]
        note: 「どちらも ∞ なので差は 0」としやすい。∞ − ∞ は形だけでは決まらない。
      - part: 挑戦
        text: lim (n→∞) (1² + 2² + 3² + … + n²)/n³ を求めましょう。
        answer: 1/3
        check: "Fraction(sum(k * k for k in range(1, 10**5 + 1)), 10**15).limit_denominator(100)"
        hints:
          - 分子の和を、n の式で表しましょう（A-018）。
          - n(n + 1)(2n + 1)/6 を n³ で割ります。
          - (n + 1)/n = 1 + 1/n のように、かっこごとに n で割りましょう。
        paths:
          - [分子は n(n + 1)(2n + 1)/6, (1/6)(1 + 1/n)(2 + 1/n), 2/6 = 1/3]
        note: 1 + 4 + 9 + … の和は ∞ に発散するが、n³ で割ると収束する。和を式にしてから極限を求めることを確かめる。
    extra:
      - part: 今日
        text: lim (n→∞) (2n³ + n)/(n³ − 4n²) を求めましょう。
        answer: 2
        check: "Fraction(2 * 10**27 + 10**9, 10**27 - 4 * 10**18).limit_denominator(100)"
        hints:
          - 分母の最高次の項は n³ です。
          - 分母と分子を n³ で割りましょう。
          - 1/n² と 4/n は 0 に近づきます。
        paths:
          - [(2 + 1/n²)/(1 − 4/n), 2]
      - part: 今日
        text: n → ∞ のとき、極限が 0 になるのはどれですか。
        choices: [(n² + 1)/(n³ + 2), (n³ + 2)/(n² + 1), (n³ + 2)/(2n³ + 1), (n + 3)/(n + 1)]
        answer: (n² + 1)/(n³ + 2)
        check: "[c for c, f in {'(n² + 1)/(n³ + 2)': lambda n: Fraction(n * n + 1, n ** 3 + 2), '(n³ + 2)/(n² + 1)': lambda n: Fraction(n ** 3 + 2, n * n + 1), '(n³ + 2)/(2n³ + 1)': lambda n: Fraction(n ** 3 + 2, 2 * n ** 3 + 1), '(n + 3)/(n + 1)': lambda n: Fraction(n + 3, n + 1)}.items() if abs(f(10**6)) < Fraction(1, 1000)][0]"
        hints:
          - 分母と分子の次数をくらべましょう。
          - 分母と分子を、分母の最高次の項で割りましょう。
          - 分母の次数のほうが大きいと、どうなるでしょう。
        paths:
          - [(n² + 1)/(n³ + 2) を n³ で割る, (1/n + 1/n³)/(1 + 2/n³), 0 に収束する]
        note: (n³ + 2)/(n² + 1) は ∞ に発散し、(n³ + 2)/(2n³ + 1) は 1/2、(n + 3)/(n + 1) は 1 に収束する。
      - part: 挑戦
        text: lim (n→∞) n(√(n² + 1) − n) を求めましょう。
        answer: 1/2
        accept: [0.5]
        check: "Fraction(10**5 * (math.sqrt(10**10 + 1) - 10**5)).limit_denominator(100)"
        hints:
          - √(n² + 1) − n の部分を有理化しましょう。
          - n/(√(n² + 1) + n) の形になります。
          - 分母と分子を n で割りましょう。
        paths:
          - [n × 1/(√(n² + 1) + n), 1/(√(1 + 1/n²) + 1), 1/2]
        note: √(n² + 1) − n は 0 に近づき、n は ∞ に発散する。∞ × 0 の形も、形だけでは決まらない。

