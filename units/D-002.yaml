        explain: aₙ = (2n + 1)/n = 2 + 1/n です。n = 1、10、100、1000 のとき、aₙ は 3、2.1、2.01、2.001 となり、図のように 2 に近づきます。1/n は、n を大きくすると限りなく 0 に近づくからです。このように、n を限りなく大きくするとき、aₙ がある決まった値 α に限りなく近づくことを、数列 {aₙ} は α に収束するといい、α を極限値といいます。これを lim (n→∞) aₙ = α と書きます（教科書では n→∞ を lim の下に小さく書きます）。「n → ∞ のとき aₙ → α」とも書きます。収束しない数列は発散するといいます。aₙ = n² のように限りなく大きくなるときは正の無限大に発散するといい、lim (n→∞) aₙ = ∞ と書きます。aₙ = −n のように負の数で絶対値が限りなく大きくなるときは負の無限大に発散する（lim (n→∞) aₙ = −∞）、aₙ = (−1)ⁿ のように −1 と 1 をくり返して決まった値に近づかないときは振動するといいます。∞ は数ではなく、限りなく大きくなるようすを表す記号です。収束する 2 つの数列の和・差・定数倍・積・商（分母の極限が 0 でないとき）の極限は、それぞれの極限値の和・差・定数倍・積・商になります（極限の性質）。たとえば (3n + 2)/(n + 4) は、分母と分子を n で割って (3 + 2/n)/(1 + 4/n) とし、2/n → 0、4/n → 0 なので、極限は (3 + 0)/(1 + 0) = 3 です。
