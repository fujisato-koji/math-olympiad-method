          - [Sₙ = 1/3 − 1/(n + 3), 1/(n + 3) → 0, 1/3]
      - part: 今日
        text: 無限等比級数 2 + 2/5 + 2/25 + … の和はいくつですか。
        answer: 5/2
        accept: [2.5]
        check: "sum(2 * Fraction(1, 5) ** k for k in range(200)).limit_denominator(100)"
        hints:
          - 公比は (2/5) ÷ 2 です。
          - −1 < r < 1 なので、収束します。
          - 和は a/(1 − r) です。
        paths:
          - [a = 2、r = 1/5, 2 ÷ (4/5), 5/2]
      - part: わけ
        text: 初項 a（a ≠ 0）、公比 r（−1 < r < 1）の無限等比級数 a + ar + ar² + … の和が a/(1 − r) になるわけを、筋道を立てて書きましょう。
        explain: 例：「初項から第 n 項までの部分和を Sₙ とする。r ≠ 1 なので、等比数列の和の公式（A-022）から Sₙ = a(1 − rⁿ)/(1 − r) = a/(1 − r) − (a/(1 − r))rⁿ である。−1 < r < 1 なので rⁿ → 0 である（3 日目）。a/(1 − r) は n によらない数なので、極限の性質から Sₙ → a/(1 − r) − (a/(1 − r)) × 0 = a/(1 − r) となる。部分和が a/(1 − r) に収束するので、無限等比級数は収束し、その和は a/(1 − r) である。」と書ければよい。①「〜とする」で部分和 Sₙ を決める、②和の公式で Sₙ を n の式にし、rⁿ をふくむ部分を分ける、③約束した事実（rⁿ の極限、極限の性質、和とは部分和の極限であること）で結ぶ、の 3 つがそろっているかを見る。r = 1/2 のような例で計算しただけで終わっていたら、例ではすべての r を示せないことを話す。r ≧ 1 や r ≦ −1 では rⁿ が収束しないので Sₙ も収束しない（r = 1 なら Sₙ = na で発散する）ことにも触れる。
        hints:
          - 部分和 Sₙ を、等比数列の和の公式で書きましょう。
          - Sₙ を、n によらない部分と rⁿ をふくむ部分に分けましょう。
          - −1 < r < 1 のとき、rⁿ は n → ∞ でどうなるでしょう。
        paths:
          - [部分和を Sₙ とする, Sₙ = a(1 − rⁿ)/(1 − r), rⁿ → 0, Sₙ → a/(1 − r)]
      - part: わけ
        text: 無限級数 a₁ + a₂ + a₃ + … が収束するならば、lim (n→∞) aₙ = 0 です。このわけを、筋道を立てて書きましょう。
        explain: 例：「部分和を Sₙ とし、無限級数の和を S とする（lim (n→∞) Sₙ = S）。n ≧ 2 のとき aₙ = Sₙ − Sₙ₋₁ である。n → ∞ のとき n − 1 も限りなく大きくなるので、Sₙ₋₁ → S である。極限の性質（差の極限は極限値の差）から、aₙ = Sₙ − Sₙ₋₁ → S − S = 0 となる。」と書ければよい。①「〜とする」で Sₙ と S を決める、②aₙ を部分和の差で表す、③約束した事実（極限の性質、収束の意味）で結ぶ、の 3 つがそろっているかを見る。このことから、対偶の「aₙ が 0 に収束しなければ、無限級数は発散する」（5 日目に使った）が成り立つことを話す。逆の「aₙ → 0 ならば収束する」は成り立たないことを、次の問題（1 + 1/2 + 1/3 + …）で確かめる。
        hints:
          - 部分和を Sₙ、和を S としましょう。
          - aₙ を、Sₙ と Sₙ₋₁ を使って表しましょう。
          - Sₙ₋₁ は、n → ∞ のときどうなるでしょう。
        paths:
          - [Sₙ → S とする, aₙ = Sₙ − Sₙ₋₁, Sₙ₋₁ → S, aₙ → S − S = 0]
      - part: わけ
        text: 無限級数 1 + 1/2 + 1/3 + 1/4 + … は、第 n 項 1/n が 0 に近づくのに、発散します。このわけを、項を組にして、筋道を立てて書きましょう。
        explain: 例：「部分和を Sₙ とする。項を 1、1/2、(1/3 + 1/4)、(1/5 + 1/6 + 1/7 + 1/8)、(1/9 + … + 1/16)、… と組にする。第 m 組は 1/(2ᵐ⁻¹ + 1) から 1/2ᵐ までの 2ᵐ⁻¹ 個の項で（第 1 組は 1/2 だけ）、どの項も 1/2ᵐ 以上なので、組の和は 2ᵐ⁻¹ × 1/2ᵐ = 1/2 以上である（A-013）。よって、初項から第 2ᵐ 項までの部分和は 1 + m/2 以上である。m を大きくすると 1 + m/2 は限りなく大きくなる。また、項はすべて正なので Sₙ は n とともに増え続ける。だから Sₙ は正の無限大に発散する。」と書ければよい。①「〜とする」で Sₙ と組の分け方を決める、②組の和を 1/2 以上と見積もる（不等式の変形）、③約束した事実（不等式の性質、発散の意味）で結ぶ、の 3 つがそろっているかを見る。「1/n → 0 だから収束する」と書いていたら、前の問題の逆は成り立たない例がこの級数であることを話す。部分和は、第 2ᵐ 項までで 1 + m/2 以上なので、1 万項足しても 10 に届かないほどゆっくり大きくなる（それでも限りがない）ことにも触れる。
        hints:
          - 1/3 + 1/4 は、1/4 + 1/4 より大きいでしょうか。
          - 1/5 から 1/8 までの 4 つの項の和を、1/8 を使って下から見積もりましょう。
          - どの組の和も 1/2 以上なら、組をたくさん集めた部分和はどうなるでしょう。
        paths:
          - [項を 1 個、2 個、4 個、8 個、… の組に分ける, どの組の和も 1/2 以上, 第 2ᵐ 項までの部分和は 1 + m/2 以上, 限りなく大きくなるので発散する]
