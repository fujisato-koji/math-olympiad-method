      - 24 組を書くと、0 と 12 が 5 組、0 と 8 が 1 組、1 と 8 が 2 組、1 と 6 が 6 組、2 と 3 が 8 組、3 と 3 が 2 組。はなれは 12 × 5 + 8 × 1 + 7 × 2 + 5 × 6 + 1 × 8 + 0 × 2 = 60 + 8 + 14 + 30 + 8 + 0 = 120。だから、どこにたてても合計は 120 以上
      - 東の数が 3 の場所は、24 組のどの組の 2 点の間にも入っている（左の点は全部 3 以下、右の点は全部 3 以上）。だから、そのとき合計はちょうど 120 になり、これがいちばん小さい。答えは 120
    note: 考えどころは 3 つ：①国道（東の数＋北の数＝12）の上では、道のりが「東のちがい」と「北のちがい」の 2 つに分かれ、どちらも配送所の東の数だけで決まる（北のちがいは、12 からひいた北の数と東の数のちがいに言いかえる）、②人数の分だけ点を 1 本の数の線にならべ直す（48 こ）、③1 つずつ動かしてとくかそんかを見る（まん中の点）、または組にして下からおさえる。重みつきの中央の点（中央値）の定番。重心に近い東の数 4 を選ぶと 140 になるわな（人数の重みで平均するとこちらによる）。2 本目は、動かさずに、はしから組にして「合計 ≥ 組のはなれの和＝120」と下からおさえ、等号が成り立つ場所があることで答えを決める。check は、国道の上の 13 か所を全部ためして、道のりの合計のいちばん小さい値を出す（120）。「東の数＋北の数＝12」の線上に限ったので、ふつうの 2 次元の中央の点（x と y をべつべつに選べる）の問題とはちがい、1 つの数の線の問題になることが大事。
