# G-050 座標平面の入口（格子の点、4 象限、移動と対称、表から直線を描く）
#
# 書き方は N-001 の頭の注のとおり。
# ことば：x 軸、y 軸、原点 O、座標 (x, y)、x 座標、y 座標、格子の点（方眼の線が交わる所の点）、第 1〜第 4 象限、
#   平行移動（向きを変えずにずらす）、x 軸について対称・y 軸について対称（軸で折って重なる）、原点 O のまわりに 180° 回す。
# 前提は N-010（正負の数のたし算とひき算）と G-015（点の移動と図形の回転）。座標の計算は N-010 のたし算・ひき算だけにした。
#   マイナスの数のかけ算（N-027）は前提にないので、表の x と y の関係は「y は x より 3 大きい」「x と y の和が 4」のような
#   たし算・ひき算の形と、x が 0 以上のときの「y は x の 2 倍」までにした。比例・関数・傾きの言葉は使わない（後の単元）。
#   長方形と三角形の面積は G-015 の前の G-008 の考え方で、格子の上の辺が軸に平行な形だけにした。
# 答えの鍵盤：段 3 で地図に keys: [−] がないので「−」は打てない。座標の組と、マイナスの数になる答えは選ぶ問題にし、
#   打つ答えは 0 以上の数（何目もり、y 座標、面積）にした。
# 図は svg（D-040）。座標平面は 1 目もりごとの方眼に、目もりの数を書いた。表は 2 行の表の図。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 座標の読み方と 4 つの象限　2 日目 移動と対称（平行移動、x 軸・y 軸について対称、原点のまわりに 180°）
#   3 日目 表の組を点に打ち、直線を引いて読む　4 日目 わけ（x 軸について対称、軸に平行な 2 点の間、180° 回す）
#   5 日目 N-010（計算）・G-015（回転）と 1〜3 日目を混ぜる　6 日目 確認
# check：座標の組は (lambda x, y: f'({x}, {y})'.replace('-', '−'))(x の式, y の式)、象限は x と y の正負から名前を出す式、
#   マイナスの数の答えは (lambda v: f'−{-v}' if v < 0 else f'{v}')(式)。直線の上の点を選ぶ問題は、選択肢の組を関係の式で調べる。
#   軸の名前などの約束ごとを選ぶ問題には check を付けない。

id: G-050
days:
  - day: 1
    items:
