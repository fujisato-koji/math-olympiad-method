        explain: 横の《数直線》を x 軸、たての数直線を y 軸といい、2 つの軸が交わる点を原点 O といいます。点 A は、O から右へ 3、上へ 2 進んだ所にあるので、A の位置を (3, 2) と書きます。3 を A の x 座標、2 を A の y 座標といい、x 座標を先に書きます。左と下へ進むときは、マイナスの数を使います。点 B は O から左へ 4、下へ 1 進んだ所なので (−4, −1) です。O は (0, 0) です。方眼の線が交わる所の点を、格子の点といいます。また、2 つの軸で平面は 4 つに分かれ、右上を第 1 象限（しょうげん）、左上を第 2 象限、左下を第 3 象限、右下を第 4 象限といいます。
