ill-opacity="0.75" stroke="currentColor" stroke-width="1.3"/><text x="32" y="193" font-size="13" text-anchor="start" fill="currentColor">勉強時間が長い人</text><circle cx="188" cy="188" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="200" y="193" font-size="13" text-anchor="start" fill="currentColor">短い人</text><circle cx="20" cy="212" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="20" cy="212" r="10.5" fill="none" stroke="currentColor" stroke-width="2.2"/><text x="36" y="217" font-size="13" text-anchor="start" fill="currentColor">選ばれた人</text></svg>'
        explain: 無作為抽出になっているのはイです。どの番号も同じ確率で選ばれるので、勉強時間の長い人も短い人も、全体と同じような割合で選ばれやすくなります。図のアでは選ばれた 4 人のうち 3 人、ウでは 4 人とも、勉強時間の長い人でした。アは図書館に来ている人、ウは自分から申し出た人で、勉強熱心な人が多く入りやすく、結果が全体より大きく出るおそれがあります。このように、選び方のせいで標本が母集団の一部のけいこうにかたよることを、偏りといいます。乱数は、どの数も同じ確率で出るようにならべた数で、0〜9 の目が 2 つずつある正二十面体の乱数さい、乱数表、表計算ソフトの関数などで作れます。無作為に選んでも、標本ごとに結果は少しずつちがいますが、それはぐうぜんのずれで、標本を大きくすると小さくなります。
