# S-031 標本調査、観察研究と実験計画
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり（1 日の組は 思い出す 2・今日 2・挑戦 1）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 段 5 だが単元の水準は 2 なので、わけの深さは ②（代表の例で、文に書いて説明する）にした（docs/thinking-levels.md の第 5 節：
#   わけの深さは単元の水準以下）。わけの explain には、言えればよいことを 2 つ書いた。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）に次のねらいを当てた。
#   1 日目：全数調査と標本調査、母集団・標本・標本の大きさ、無作為抽出、標本の割合や平均から母集団を推定する。
#   2 日目：無作為な選び方と偏りのある選び方（頭に見本、乱数）、標識再捕法、学年ごとの割合を保って選ぶ。
#   3 日目：観察研究と実験（頭に見本）。実験群と対照群、くじで分ける（無作為な割り付け）、数を多くする、偽薬と二重盲検、ほかの要因。
#   4 日目：わけ（3 問とも ②：なぜ無作為に選ぶか、なぜ対照群が要るか、なぜ観察研究だけでは原因と言えないか）。
#   5 日目：S-029（箱ひげ図で 2 つの群を比べる）、C-011（無作為に選ばれる確率）と混ぜる。6 日目：確認。
# 実験計画の三原則（無作為化・反復・局所管理）の名前と分散分析は S-050、因果推論の方法は S-042、推定の幅（信頼区間）は S-041 にゆずる。
#   ここでは「くじで分ける」「数を多くする」「比べる組をつくる」を、言葉と場面で扱う。
# 前提は S-029 と C-011（たどると S-028、A-005、C-007 など）。文字と式（A-010）と 1 次方程式（A-011）は前提のたどりにないので、
#   推定は比（A-005）の考え「標本の割合 ＝ 母集団の割合」で、割合の計算として求める（x を使った比例式は書かない）。
# 場面とデータはすべて自作で、実在の調査の数ではない（「およそ何人」は、標本の割合がそのまま全体の割合と考えた見積もり）。
# 答えは整数か小数、確率は約分した分数。百分率は % の前の数。方法や説明を選ぶ問題は choices。
#   方法や考え方を選ぶ問題は計算で確かめられないので check を付けない。箱ひげ図を読む問題は、読む値を check に書き直して確かめる。
# 標本調査と実験の計画は、点推定と区間推定（S-018）、因果推論（S-042）、実験計画法（S-050）、臨床試験（I-003）、
#   生態学の調査の標識再捕法（B-061）の入口になる（D-026）。

id: S-031
days:
  - day: 1
    items:
      - part: 見本
        text: ある中学校の生徒 600 人のうち、毎朝朝食を食べる人がどのくらいいるかを調べます。全員に聞く代わりに、無作為に 50 人を選んで聞いたところ、42 人が毎朝食べていました。600 人のうち、毎朝食べる人はおよそ何人と考えられるでしょう。
        explain: 調べたい集団の全員を調べることを全数調査、集団の一部を取り出して調べ、全体のようすを推しはかることを標本調査といいます。調べたい集団全体を母集団、取り出した一部を標本、標本の人数を標本の大きさといいます。この調査では、母集団は 600 人、標本は選んだ 50 人で、標本の大きさは 50 です。標本は、どの人も同じ確率で選ばれるように、くじや乱数を使って選びます。これを無作為抽出といいます。無作為に選んだ標本では、標本の割合は母集団の割合に近いと考えられます。標本で毎朝食べる人の割合は 42/50 = 0.84 なので、600 人のうちおよそ 600 × 0.84 = 504 人と推定できます。選ぶ 50 人が変わると結果も少し変わるので、「およそ」と言います。
      - part: 思い出す
        text: 40 人のクラスで、出席番号 1〜40 の中から、くじで 1 人を選びます。出席番号が 5 の倍数の人が選ばれる確率を求めましょう。
        answer: 1/5
        check: "Fraction(sum(1 for n in range(1, 41) if n % 5 == 0), 40)"
        hints:
          - くじなので、どの人も同じ程度に選ばれます。
          - 1〜40 の中に 5 の倍数は何個あるでしょう。
          - 場合の数の比を約分しましょう。
        paths:
          - [5 の倍数は 8 個, 8/40 = 1/5]
      - part: 思い出す
        text: 50 人に聞いたところ、18 人が「はい」と答えました。「はい」と答えた人の割合を、小数で答えましょう。
        answer: 0.36
        check: "(lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)(Fraction(18, 50))"
        hints:
          - 割合は、(比べる量) ÷ (もとにする量) です。
          - もとにする量は 50 人です。
          - 18 ÷ 50 を小数で計算しましょう。
        paths:
          - [18 ÷ 50 = 0.36]
      - part: 今日
        text: 次のうち、標本調査ではなく全数調査で行うのがふさわしいものはどれですか。
        choices: [学校で行う健康診断, 工場で作った電球が何時間もつかの検査, テレビ番組の視聴率の調査]
        answer: 学校で行う健康診断
        hints:
          - 全数調査は、全員を調べる必要があるときに行います。
          - 電球が何時間もつかを調べると、調べた電球はどうなるでしょう。
          - 一人ひとりの結果が必要なのはどれでしょう。
        paths:
          - [健康診断は一人ひとりの結果が必要なので全数調査, 電球は調べると使えなくなり、視聴率は全家庭を調べるのが大変なので標本調査]
      - part: 今日
        text: ある町の有権者 12000 人から無作為に 300 人を選んで聞いたところ、新しい図書館をつくることに 186 人が賛成しました。町の有権者のうち、賛成の人はおよそ何人と考えられますか。
        answer: 7440
        check: "12000 * Fraction(186, 300)"
        hints:
          - 標本の中の賛成の割合を求めましょう。
          - 無作為に選んだので、町全体の割合もそれに近いと考えます。
          - 12000 人にその割合をかけましょう。
        paths:
          - [標本の賛成の割合は 186/300 = 0.62, 12000 × 0.62 = 7440]
      - part: 挑戦
        text: 袋の中に白玉だけがたくさん入っています。そこへ赤玉を 50 個入れてよくまぜ、無作為に 60 個取り出したところ、赤玉が 4 個ふくまれていました。袋の中の白玉は、およそ何個と考えられますか。
        answer: 700
        check: "50 * Fraction(60, 4) - 50"
        hints:
          - 取り出した 60 個の中の、赤玉の割合を求めましょう。
          - 袋全体でも、赤玉の割合はそれに近いと考えます。赤玉 50 個が全体のその割合にあたります。
          - 全体の個数から、赤玉の 50 個をひきましょう。
        paths:
          - [標本の赤玉の割合は 4/60 = 1/15, 赤玉 50 個が全体の 1/15 なので、全体はおよそ 50 × 15 = 750 個, 白玉は 750 − 50 = 700]
        note: 求めるのは全体ではなく白玉の数。全体の 750 個で止まらないように。数えられない数を、印をつけたものの割合から推定する（標識再捕法、2 日目）の入口。
    extra:
      - part: 今日
        text: 次のうち、全数調査ではなく標本調査で行うのがふさわしいものはどれですか。
        choices: [国の人口を調べる国勢調査, ある湖にすむ魚の数の調査, 入学試験の答案の採点]
        answer: ある湖にすむ魚の数の調査
        hints:
          - 全部を調べることができるかを考えましょう。
          - 一人ひとりの結果が必要なものは、全数調査です。
          - 湖の魚を 1 匹残らず数えることはできるでしょうか。
        paths:
          - [湖の魚は全部を数えられないので標本調査, 国勢調査と入試の採点は全員分が必要なので全数調査]
      - part: 今日
        text: 工場で作ったねじ 5000 本から無作為に 200 本を調べたところ、不良品が 6 本ありました。5000 本のうち、不良品はおよそ何本と考えられますか。
        answer: 150
        check: "5000 * Fraction(6, 200)"
        hints:
          - 標本の中の不良品の割合を求めましょう。
          - 全体の不良品の割合も、それに近いと考えます。
          - 5000 本にその割合をかけましょう。
        paths:
          - [不良品の割合は 6/200 = 0.03, 5000 × 0.03 = 150]
      - part: 挑戦
        text: 300 ページの本に書かれている単語の数を調べます。無作為に 5 ページを選んで単語を数えると、312、298、305、290、320 語でした。この本全体の単語の数は、およそ何語と考えられますか。
        answer: 91500
        check: "300 * Fraction(312 + 298 + 305 + 290 + 320, 5)"
        hints:
          - まず、選んだ 5 ページの単語の数の平均値を求めましょう（S-028）。
          - どのページも、平均してその数くらいの単語があると考えます。
          - 1 ページあたりの数に、ページ数をかけましょう。
        paths:
          - [5 ページの合計は 1525 語で、平均値は 305 語, 305 × 300 = 91500]

  - day: 2
    items:
      - part: 見本
        text: ある市の中学生 3000 人から 100 人を選んで、1 日の勉強時間を調べます。次の選び方のうち、無作為抽出になっているのはどれでしょう。ア：図書館に来ていた中学生 100 人。イ：3000 人に番号をつけ、乱数で 100 個の番号を選ぶ。ウ：調査に協力したいと申し出た 100 人。
        explain: 無作為抽出になっているのはイです。どの番号も同じ確率で選ばれるので、勉強時間の長い人も短い人も、全体と同じような割合で選ばれやすくなります。アは図書館に来ている人、ウは自分から申し出た人で、勉強熱心な人が多く入りやすく、結果が全体より大きく出るおそれがあります。このように、選び方のせいで標本が母集団の一部の傾向にかたよることを、偏りといいます。乱数は、どの数も同じ確率で出るように並べた数で、0〜9 の目が 2 つずつある正二十面体の乱数さい、乱数表、表計算ソフトの関数などで作れます。無作為に選んでも、標本ごとに結果は少しずつちがいますが、それは偶然のずれで、標本を大きくすると小さくなります。
      - part: 思い出す
        text: ある学校の生徒 800 人から無作為に 40 人を選んで聞いたところ、14 人が自転車で通学していました。全校で自転車通学の生徒は、およそ何人と考えられますか。
        answer: 280
        check: "800 * Fraction(14, 40)"
        hints:
          - 標本の中の割合を求めましょう。
          - 全体の割合も、それに近いと考えます。
          - 800 人にその割合をかけましょう。
        paths:
          - [14/40 = 0.35, 800 × 0.35 = 280]
      - part: 思い出す
        text: 番号 1〜20 の 20 人から、くじで 2 人を選びます。番号 1 と番号 2 の 2 人が選ばれる確率を求めましょう。
        answer: 1/190
        check: "Fraction(1, math.comb(20, 2))"
        hints:
          - 20 人から 2 人の選び方は何通りでしょう（C-007）。
          - 番号 1 と番号 2 の組は何通りでしょう。
          - 場合の数の比を求めましょう。
        paths:
          - [選び方は 20 × 19 ÷ 2 = 190 通り, 1/190]
      - part: 今日
        text: 池の魚の数を調べるため、魚を 80 匹とって印をつけ、池にもどしました。数日後に魚を 60 匹とったところ、印のついた魚が 12 匹いました。池の魚は、およそ何匹と考えられますか。
        answer: 400
        check: "80 * Fraction(60, 12)"
        hints:
          - 2 回目にとった 60 匹の中の、印のついた魚の割合を求めましょう。
          - 池全体でも、印のついた魚の割合はそれに近いと考えます。
          - 印のついた 80 匹が、池全体のその割合にあたります。
        paths:
          - [印のついた魚の割合は 12/60 = 1/5, 80 匹が全体の 1/5 なので、全体はおよそ 80 × 5 = 400]
        note: この方法を標識再捕法という。印をつけた魚が池全体によくまざっていることが前提。
      - part: 今日
        text: ある町の住民が、平日にどのくらい外出するかを調べます。次の調べ方のうち、結果に偏りが最も出にくいのはどれですか。
        choices: [平日の昼に駅前を通る人に聞く, 住民の名簿から乱数で選んだ人に聞く, 自分の家族と近所の人に聞く]
        answer: 住民の名簿から乱数で選んだ人に聞く
        hints:
          - 平日の昼に駅前にいる人は、どんな人でしょう。
          - 自分の知り合いだけに聞くと、町全体と同じような人が集まるでしょうか。
          - どの住民も同じ確率で選ばれるのはどれでしょう。
        paths:
          - [駅前の人は外出している人ばかりで、知り合いは近い生活の人が多い, 名簿から乱数で選ぶと、どの住民も同じ確率で選ばれる]
      - part: 挑戦
        text: 池の魚 50 匹に印をつけて池にもどしました。数日後、1 回目に 40 匹とると印のついた魚は 5 匹、2 回目に別の 60 匹をとると印のついた魚は 6 匹でした。2 回の結果を合わせて考えると、池の魚はおよそ何匹ですか。一の位を四捨五入して答えましょう。
        answer: 450
        check: "(lambda e: (e + 5) // 10 * 10)(50 * Fraction(40 + 60, 5 + 6))"
        hints:
          - 2 回分を合わせると、何匹とって、印のついた魚が何匹いたことになるでしょう。
          - 合わせた標本での、印のついた魚の割合を求めましょう。
          - 印のついた 50 匹が全体のその割合にあたります。最後に一の位を四捨五入しましょう。
        paths:
          - [合わせて 100 匹のうち印は 11 匹, 全体はおよそ 50 × 100/11 = 454.5…, 一の位を四捨五入して 450]
        note: 1 回目だけなら 400 匹、2 回目だけなら 500 匹と、標本によって推定が変わる。標本を合わせて大きくすると、偶然のずれが小さくなる。
    extra:
      - part: 今日
        text: 池の魚 30 匹に印をつけて池にもどしました。数日後に 45 匹をとったところ、印のついた魚が 5 匹いました。池の魚は、およそ何匹と考えられますか。
        answer: 270
        check: "30 * Fraction(45, 5)"
        hints:
          - 2 回目にとった魚の中の、印のついた魚の割合を求めましょう。
          - 池全体でも同じ割合と考えます。
          - 印のついた 30 匹が全体のその割合にあたります。
        paths:
          - [印の割合は 5/45 = 1/9, 全体はおよそ 30 × 9 = 270]
      - part: 今日
        text: テレビの視聴率を調べるとき、調べる家庭を無作為に選ぶ理由として、正しいものはどれですか。
        choices: [調べる家庭の数を少なくするため, 選ばれる家庭が特定の種類にかたよらないようにするため, 視聴率が高く出るようにするため]
        answer: 選ばれる家庭が特定の種類にかたよらないようにするため
        hints:
          - 無作為抽出では、どの家庭も同じ確率で選ばれます。
          - 選び方にくせがあると、標本はどうなるでしょう。
          - 偏りという言葉を思い出しましょう。
        paths:
          - [無作為に選ぶと、どの家庭も同じ確率で選ばれる, 標本が特定の種類にかたよらない]
      - part: 挑戦
        text: ある学校の生徒は、男子 1200 人、女子 800 人です。男子と女子の人数の割合を保ったまま、全体から 50 人を選んで調査します。女子は何人選べばよいですか。
        answer: 20
        check: "50 * Fraction(800, 1200 + 800)"
        hints:
          - 全体の生徒は何人でしょう。
          - 全体のうち、女子の割合はいくらでしょう。
          - 50 人にその割合をかけましょう。
        paths:
          - [全体は 2000 人で、女子の割合は 800/2000 = 2/5, 50 × 2/5 = 20]
        note: 集団をいくつかの組に分け、組ごとの割合を保って無作為に選ぶ方法を層別抽出という。標本が組の割合でかたよらない。

  - day: 3
    items:
      - part: 見本
        text: 新しい肥料がトマトの収穫量を増やすかを調べます。40 株のトマトをくじで 20 株ずつの 2 つの組に分け、一方には新しい肥料、もう一方にはいつもの肥料を与えて、ほかの育て方は同じにします。この調べ方のよいところを考えてみましょう。
        explain: 調べたい条件を人が決めて与え、結果を比べる調べ方を実験といいます。これに対して、人が条件を与えず、もともと起こっていることを調べる調べ方を観察研究といいます。新しい肥料を与える組を実験群、与えない組（いつもの肥料の組）を対照群といいます。対照群があるので、肥料のほかの理由（天気や季節）で変わった分を差し引いて比べられます。くじで組を分ける（無作為な割り付け）と、日当たりや苗の元気さなど、ほかの条件が両方の組に同じくらいずつ分かれるので、差が出たら肥料のせいと考えやすくなります。また、株の数を多くすると、偶然の差が小さくなります。人を対象にした薬の実験では、本物の薬と見分けがつかない偽薬（プラセボ）を対照群に飲ませ、どちらを飲んだかを、飲む人にも結果を調べる人にも知らせないようにします（二重盲検）。思い込みが結果に入らないようにするためです。
      - part: 思い出す
        text: 池の魚 40 匹に印をつけて池にもどしました。数日後に 50 匹をとったところ、印のついた魚が 8 匹いました。池の魚は、およそ何匹と考えられますか。
        answer: 250
        check: "40 * Fraction(50, 8)"
        hints:
          - 2 回目にとった魚の中の、印の割合を求めましょう。
          - 池全体でも同じ割合と考えます。
          - 印のついた 40 匹が全体のその割合にあたります。
        paths:
          - [印の割合は 8/50 = 4/25, 全体はおよそ 40 ÷ 4/25 = 250]
      - part: 思い出す
        text: ある練習を試したところ、A 組は 20 人中 14 人、B 組は 25 人中 15 人の記録がのびました。記録がのびた人の割合が大きいのはどちらですか。
        choices: [A 組, B 組, 同じ]
        answer: A 組
        check: "(lambda a, b: 'A 組' if a > b else ('B 組' if b > a else '同じ'))(Fraction(14, 20), Fraction(15, 25))"
        hints:
          - 人数がちがうので、人数ではなく割合で比べます。
          - それぞれの割合を小数で求めましょう。
          - 大きいほうを選びましょう。
        paths:
          - [A 組は 14/20 = 0.7、B 組は 15/25 = 0.6, A 組]
      - part: 今日
        text: 次のうち、実験ではなく観察研究であるものはどれですか。
        choices: [毎日の睡眠時間とテストの点数をアンケートで調べて比べる, くじで分けた 2 つの組の一方だけに、新しい練習方法を試す, 同じ種類の苗を無作為に 2 つに分けて、一方だけに光を長く当てる]
