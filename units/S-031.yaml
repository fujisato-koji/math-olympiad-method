        text: 赤玉の割合が 0.4 の大きな袋から、10 個取り出して赤玉の割合を調べることを 5 回くり返すと、0.2、0.5、0.4、0.6、0.3 でした。100 個取り出して調べることを 5 回くり返すと、0.37、0.42、0.41、0.36、0.44 でした。5 回の結果の範囲（最大値 − 最小値）は、10 個のときは 100 個のときの何倍ですか。
        answer: 5
