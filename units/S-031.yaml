      - part: 挑戦
        id: "1d67b498a7"
        text: ある薬の実験で、人をくじで 2 つの組に分けました。一方は薬を、もう一方は偽薬（薬の成分が入っていない、見た目が同じもの）を飲みました。ぐあいがよくなった人は図のとおりです。偽薬でもよくなる人がいることをふまえると、薬によってよくなった人の割合は、およそ何 % 分と考えられますか。% の前の数で答えましょう。
