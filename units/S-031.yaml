        answer: 20
        check: "Fraction(35 * 100, 50) - Fraction(25 * 100, 50)"
        hints:
          - それぞれの組で、よくなった人の割合を % で求めましょう。
          - text: 2 つの組の帯を同じ長さにしました。偽薬の組でもよくなった分（点線まで）は、薬の効果ではありません。
            svg: '<svg viewBox="0 0 320 142" xmlns="http://www.w3.org/2000/svg"><text x="88" y="52" font-size="13" text-anchor="end" fill="currentColor" font-weight="bold">薬の組</text><rect x="96" y="34" width="200" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="96" y="34" width="140" height="26" rx="3" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="88" y="102" font-size="13" text-anchor="end" fill="currentColor" font-weight="bold">偽薬の組</text><rect x="96" y="84" width="200" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="96" y="84" width="100" height="26" rx="3" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="196" y1="26" x2="196" y2="116" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="196" y="34" width="40" height="26" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="216" y="53" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="96" y="132" font-size="11" text-anchor="middle" fill="currentColor">0 %</text><text x="296" y="132" font-size="11" text-anchor="middle" fill="currentColor">100 %</text></svg>'
          - 2 つの割合の差を求めましょう。
        paths:
          - [薬の組は 70 %、偽薬の組は 50 %, 差は 70 − 50 = 20]
          - [よくなった人の差は 35 − 25 = 10 人, 50 人のうちの 10 人は 20 %]
        note: 偽薬を飲んでもぐあいがよくなることがある（プラセボ効果、自然に治る分）。薬の組の 70 % をそのまま効果としない。

