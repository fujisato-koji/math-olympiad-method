      - part: 今日
        text: ある高校で、全校生徒の通学時間を調べるため、50 人を選びます。無作為抽出になっているのはどれですか。
        choices: [朝いちばん早く登校した 50 人, 全校生徒の名簿の番号から、乱数で選んだ 50 人, 各部活動の部長たち 50 人]
        answer: 全校生徒の名簿の番号から、乱数で選んだ 50 人
        hints:
          - 早く登校する人は、通学時間にどんな傾向がありそうでしょう。
          - 部長だけを選ぶと、全校と同じような人が集まるでしょうか。
          - どの生徒も同じ確率で選ばれるのはどれでしょう。
        paths:
          - [名簿の番号から乱数で選ぶと、どの生徒も同じ確率で選ばれる]
      - part: わけ
        text: 全校生徒 600 人の 1 日の勉強時間を調べるのに、放課後に図書館にいた 30 人に聞くと、平均値が全校の本当の平均値より大きく出るおそれがあります。なぜそう言えるのか、また、どのように選べばよいかを、文で書きましょう。
        explain: 例：「図書館にいる人は、勉強をよくする人が多いと考えられる。そのような人ばかりを選ぶと、標本の平均値は、母集団の平均値より大きくなりやすい（偏り）。全校生徒に番号をつけ、くじや乱数で 30 人を選べば、どの生徒も同じ確率で選ばれるので、勉強時間の長い人も短い人も、全体と同じような割合で入りやすい。」と書ければよい。言えればよいことは 2 つ。①選び方によっては、特定の傾向をもつ人ばかりが入り、結果がかたよる。②無作為に選べば、どの人も同じ確率で選ばれ、偏りが出にくい。図書館の例を自分の言葉で説明できていればよい（段 5 だが水準 2 の単元なので、わけは代表の例で文に書く ②）。無作為に選んでも標本ごとに結果は少しずつちがうが、それは偶然のずれで偏りとはちがい、標本を大きくすると小さくなることに触れる。
        hints:
          - 放課後に図書館にいる人は、どんな人が多いと考えられるでしょう。
          - その人たちの勉強時間は、全校の生徒と比べてどうなりやすいでしょう。
          - どの生徒も同じ確率で選ばれる選び方を書きましょう。
        paths:
          - [図書館にいる人は勉強時間が長い人が多い, その人たちだけの平均値は大きく出やすい, 名簿の番号から乱数で選ぶと、偏りが出にくい]
      - part: わけ
        text: 新しい練習方法を 1 か月試した 20 人の記録が、平均で 5 回のびました。これだけでは「新しい練習方法のおかげで 5 回のびた」とは言えません。なぜか、また、どうすれば効果を調べられるかを、文で書きましょう。
        explain: 例：「1 か月たつと、新しい練習方法でなくても、慣れや成長で記録がのびることがある。新しい練習方法を使わない組（対照群）がないと、5 回のうち、どれだけが練習方法の効果なのか分からない。人をくじで 2 つの組に分け、一方だけに新しい練習方法、もう一方にいつもの練習方法をさせて、1 か月後ののびを比べればよい。たとえば対照群も平均 3 回のびていたら、練習方法の効果は 5 − 3 = 2 回くらいと考えられる。」と書ければよい。言えればよいことは 2 つ。①練習方法のほかにも、記録がのびる理由がある。②比べる組（対照群）をつくり、くじで分けて、のびの差を見る。くじで分けるのは、やる気のある人が一方の組に集まるのを防ぐためであることに触れる。
        hints:
          - 新しい練習方法を使わなくても、1 か月で記録がのびる理由はあるでしょうか。
          - 比べる相手がないと、何が分からないでしょう。
          - くじで 2 つの組に分けて比べる方法を書きましょう。
        paths:
          - [練習方法を使わなくても、慣れや成長でのびることがある, 使わない組（対照群）と比べないと効果の大きさが分からない, くじで 2 組に分け、のびの差を比べる]
      - part: わけ
        text: ある調査で、朝食を毎日食べる生徒は、食べない日がある生徒より、テストの平均点が高いことが分かりました。この調査だけでは「朝食を食べると点数が上がる」とは言えません。なぜか、文で書きましょう。
        explain: 例：「この調査は、生徒が自分で朝食を食べるかどうかを決めた結果を調べた観察研究である。朝食を毎日食べる生徒は、早寝早起きをしている、家で勉強する時間が長いなど、ほかのちがいも持っているかもしれない。点数の差は、朝食ではなく、そのようなほかの要因によるのかもしれないので、朝食が原因とは言い切れない。」と書ければよい。言えればよいことは 2 つ。①朝食を食べる生徒と食べない生徒には、朝食のほかにもちがいがあるかもしれない。②そのほかのちがい（ほかの要因）が点数に影響しているかもしれない。このようにほかの要因がまざることを交絡という。原因を確かめるには、くじで組を分ける実験が考えられるが、人に朝食をぬかせる実験は健康の面で問題があり、行えないこともある（研究の倫理、I-034）ことにも触れる。
        hints:
          - 朝食を毎日食べる生徒には、ほかにどんな特徴がありそうでしょう。
          - そのほかの特徴が、点数に影響していることはないでしょうか。
          - 生徒が自分で選んだ結果を調べたことと、くじで分けたことのちがいを考えましょう。
        paths:
          - [朝食を食べる生徒は、生活習慣など、ほかのちがいも持っているかもしれない, 点数の差は、そのほかの要因によるのかもしれない, 観察研究だけでは原因と言い切れない]
