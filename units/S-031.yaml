      - part: わけ
        id: "bb68535db5"
        text: 新しい練習方法を 1 か月試した 20 人の記録が、平均で 5 回のびました。これだけでは「新しい練習方法のおかげで 5 回のびた」とは言えません。なぜか、また、どうすれば効果を調べられるかを、文で書きましょう。
        svg: '<svg viewBox="0 0 320 186" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">新しい練習を 1 か月（20 人の平均）</text><line x1="70" y1="160" x2="250" y2="160" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="90" y="80" width="50" height="80" rx="2" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.8"/><rect x="180" y="50" width="50" height="110" rx="2" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="1.8"/><text x="115" y="176" font-size="12" text-anchor="middle" fill="currentColor">はじめ</text><text x="205" y="176" font-size="12" text-anchor="middle" fill="currentColor">1 か月後</text><line x1="140" y1="80" x2="240" y2="80" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="240" y1="65" x2="240" y2="57" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="240,50 243.8,57 236.2,57" fill="currentColor" stroke="none"/><line x1="240" y1="65" x2="240" y2="73" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="240,80 236.2,73 243.8,73" fill="currentColor" stroke="none"/><text x="272" y="70" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">5 回</text><text x="272" y="86" font-size="11" text-anchor="middle" fill="currentColor">のびた</text></svg>'
        explain: 例：「1 か月たつと、新しい練習方法でなくても、慣れや成長で記録がのびることがある。新しい練習方法を使わない組（対照群）がないと、5 回のうち、どれだけが練習方法の効果なのか分からない。人をくじで 2 つの組に分け、一方だけに新しい練習方法、もう一方にいつもの練習方法をさせて、1 か月後ののびを比べればよい。たとえば対照群も平均 3 回のびていたら、練習方法の効果は 5 − 3 = 2 回くらいと考えられる。」と書ければよい。言えればよいことは 2 つ。①練習方法のほかにも、記録がのびる理由がある。②比べる組（対照群）をつくり、くじで分けて、のびの差を見る。くじで分けるのは、やる気のある人が一方の組に集まるのを防ぐためであることにふれる。
        hints:
          - 新しい練習方法を使わなくても、1 か月で記録がのびる理由はあるでしょうか。
          - text: 新しい練習の組の横に、いつもの練習の組をならべると、何が分かるでしょう。
            svg: '<svg viewBox="0 0 320 194" xmlns="http://www.w3.org/2000/svg"><line x1="14" y1="150" x2="306" y2="150" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="28" y="80" width="44" height="70" rx="2" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.8"/><rect x="82" y="50" width="44" height="100" rx="2" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="1.8"/><text x="104" y="44" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">+5 回</text><text x="50" y="166" font-size="11" text-anchor="middle" fill="currentColor">はじめ</text><text x="104" y="166" font-size="11" text-anchor="middle" fill="currentColor">後</text><text x="77" y="186" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">新しい練習</text><rect x="176" y="80" width="44" height="70" rx="2" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.8"/><rect x="230" y="80" width="44" height="70" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 3"/><text x="252" y="66" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="198" y="166" font-size="11" text-anchor="middle" fill="currentColor">はじめ</text><text x="252" y="166" font-size="11" text-anchor="middle" fill="currentColor">後</text><text x="225" y="186" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">いつもの練習</text></svg>'
          - くじで 2 つの組に分けて比べる方法を書きましょう。
        paths:
          - [練習方法を使わなくても、慣れや成長でのびることがある, 使わない組（対照群）と比べないと効果の大きさが分からない, くじで 2 組に分け、のびの差を比べる]
          - [5 回ののびには、練習方法の効果とほかの理由の分がまざっている, いつもの練習の組ののびを差し引けば、練習方法の効果が分かる]
      - part: わけ
        id: "0c01a2a1cf"
        text: ある調査で、朝食を毎日食べる生徒は、食べない日がある生徒より、テストの平均点が高いことが分かりました。この調査だけでは「朝食を食べると点数が上がる」とは言えません。なぜか、文で書きましょう。
        svg: '<svg viewBox="0 0 320 186" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">テストの平均点</text><line x1="78" y1="150" x2="298" y2="150" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="86" y="51" width="56" height="99" rx="2" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="114" y="168" font-size="12" text-anchor="middle" fill="currentColor">毎日食べる</text><rect x="234" y="62" width="56" height="88" rx="2" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="262" y="168" font-size="12" text-anchor="middle" fill="currentColor">食べない日がある</text></svg>'
        explain: 例：「この調査は、生徒が自分で朝食を食べるかどうかを決めた結果を調べた観察研究である。朝食を毎日食べる生徒は、早ね早起きをしている、家で勉強する時間が長いなど、ほかのちがいも持っているかもしれない。点数の差は、朝食ではなく、そのようなほかの要因によるのかもしれないので、朝食が原因とは言い切れない。」と書ければよい。言えればよいことは 2 つ。①朝食を食べる生徒と食べない生徒には、朝食のほかにもちがいがあるかもしれない。②そのほかのちがい（ほかの要因）が点数にえいきょうしているかもしれない。このようにほかの要因がまざることを、こうらくという。原因を確かめるには、くじで組を分ける実験が考えられるが、人に朝食をぬかせる実験は健康の面で問題があり、行えないこともある（研究のりんり、I-034）ことにもふれる。
        hints:
          - 朝食を毎日食べる生徒には、ほかにどんなとくちょうがありそうでしょう。
          - text: 3 つのことのつながりを矢印でかきました。「?」の矢印は、本当にあるかどうか分からないつながりです。
            svg: '<svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg"><rect x="110" y="17" width="100" height="32" rx="8" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.8"/><text x="160" y="39" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">ほかのこと？</text><rect x="31" y="123" width="70" height="32" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="66" y="145" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">朝食</text><rect x="210.5" y="123" width="87" height="32" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="254" y="145" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">テストの点</text><line x1="140" y1="52" x2="89.1" y2="113.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="84,120 85.7,111 92.5,116.6" fill="currentColor" stroke="none"/><line x1="180" y1="52" x2="230.9" y2="113.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="236,120 227.5,116.6 234.3,111" fill="currentColor" stroke="none"/><line x1="110" y1="146" x2="198" y2="146" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="206,146 198,150.4 198,141.6" fill="currentColor" stroke="none"/><text x="158" y="136" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">?</text></svg>'
          - 生徒が自分で選んだ結果を調べたことと、くじで分けたことのちがいを考えましょう。
        paths:
          - [朝食を食べる生徒は、生活習慣など、ほかのちがいも持っているかもしれない, 点数の差は、そのほかの要因によるのかもしれない, 観察研究だけでは原因と言い切れない]
          - [朝食を食べるかどうかは、生徒が自分で決めている（観察研究）, くじで分けていないので、2 つの組は朝食のほかでもちがうかもしれない, 原因とは言い切れない]
