# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "9e66874103"
    kinds: [手数, 読み取り]
    text: 池の魚の数を、図のように 3 日かけて調べます。1 日目に 100 ぴきをとって印をつけ、池にもどしました。2 日目に 120 ぴきをとると、印のついた魚が 15 ひきいました。2 日目にとった 120 ぴきは池にもどさずに、別の池に移しました。3 日目に 80 ぴきをとるとき、印のついた魚はおよそ何びきふくまれると考えられますか。2 日目の結果から推定した池の魚の数を使いましょう。
    svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><text x="55" y="20" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">1 日目</text><ellipse cx="55" cy="72" rx="46" ry="32" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><polygon points="31,64 25.8,59.8 25.8,68.2" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="38" cy="64" rx="7" ry="3.9" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1.3"/><circle cx="41.5" cy="63.2" r="1.3" fill="currentColor" fill-opacity="1" stroke="none"/><polygon points="73,62 78.2,57.8 78.2,66.2" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="66" cy="62" rx="7" ry="3.9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3"/><circle cx="62.5" cy="61.2" r="1.3" fill="currentColor" fill-opacity="1" stroke="none"/><polygon points="59,86 64.2,81.8 64.2,90.2" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="52" cy="86" rx="7" ry="3.9" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1.3"/><circle cx="48.5" cy="85.2" r="1.3" fill="currentColor" fill-opacity="1" stroke="none"/><polygon points="71,82 65.8,77.8 65.8,86.2" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="78" cy="82" rx="7" ry="3.9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3"/><circle cx="81.5" cy="81.2" r="1.3" fill="currentColor" fill-opacity="1" stroke="none"/><text x="55" y="126" font-size="12" text-anchor="middle" fill="currentColor">100 ぴきに</text><text x="55" y="142" font-size="12" text-anchor="middle" fill="currentColor">印をつけてもどす</text><line x1="104" y1="72" x2="115" y2="72" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="122,72 115,75.8 115,68.2" fill="currentColor" stroke="none"/><text x="160" y="20" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">2 日目</text><polygon points="133,64 187,64 182,100 138,100" fill="#7fc8f8" fill-opacity="0.3" stroke="none"/><polygon points="129,52 191,52 183,102 137,102" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M132,52 Q160,21 188,52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="142,74 137.5,70.4 137.5,77.6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="148" cy="74" rx="6" ry="3.3" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="1.3"/><circle cx="151" cy="73.3" r="1.3" fill="currentColor" fill-opacity="1" stroke="none"/><polygon points="176,84 180.5,80.4 180.5,87.6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><ellipse cx="170" cy="84" rx="6" ry="3.3" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="1.3"/><circle cx="167" cy="83.3" r="1.3" fill="currentColor" fill-opacity="1" stroke="none"/><text x="160" y="126" font-size="12" text-anchor="middle" fill="currentColor">120 ぴきとる</text><text x="160" y="142" font-size="12" text-anchor="middle" fill="currentColor">（印 15 ひき）</text><text x="160" y="160" font-size="12" text-anchor="middle" fill="currentColor">→ 別の池へ</text><line x1="198" y1="72" x2="209" y2="72" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="216,72 209,75.8 209,68.2" fill="currentColor" stroke="none"/><text x="265" y="20" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">3 日目</text><polygon points="238,64 292,64 287,100 243,100" fill="#7fc8f8" fill-opacity="0.3" stroke="none"/><polygon points="234,52 296,52 288,102 242,102" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M237,52 Q265,21 293,52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="90" font-size="20" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="265" y="126" font-size="12" text-anchor="middle" fill="currentColor">80 ぴきとる</text><text x="265" y="142" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">印は ? ひき</text></svg>'
    answer: 10
    check: "(lambda n: 80 * Fraction(100 - 15, n - 120))(100 * Fraction(120, 15))"
    hints:
      - まず、2 日目の結果から、池の魚の数を推定しよう。
      - text: 2 日目に池から出した魚の分を、池の魚全部からひくと、池に残った魚と、そのうちの印の魚の数が分かるね。
        svg: '<svg viewBox="0 0 320 138" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="30" width="86" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="53" y="50" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">池の魚</text><text x="53" y="68" font-size="12" text-anchor="middle" fill="currentColor">全部（推定）</text><rect x="118" y="30" width="86" height="74" rx="8" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.8"/><text x="161" y="50" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">出した魚</text><text x="161" y="68" font-size="12" text-anchor="middle" fill="currentColor">120 ぴき</text><rect x="226" y="30" width="86" height="74" rx="8" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.8"/><text x="269" y="50" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">残りの魚</text><text x="269" y="68" font-size="12" text-anchor="middle" fill="currentColor">? ひき</text><text x="53" y="92" font-size="12" text-anchor="middle" fill="currentColor">印 100 ぴき</text><text x="161" y="92" font-size="12" text-anchor="middle" fill="currentColor">印 15 ひき</text><text x="269" y="92" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">印 ? ひき</text><text x="107" y="72" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">−</text><text x="215" y="72" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">＝</text><text x="160" y="128" font-size="13" text-anchor="middle" fill="currentColor">3 日目は、残りの魚からとる</text></svg>'
      - 3 日目にとる 80 ぴきの中の印の割合は、池に残った魚の中の印の割合と同じと考えよう。
    paths:
      - [池の魚はおよそ 100 × 120/15 = 800 ぴき, 残りは 800 − 120 = 680 ぴきで、印は 100 − 15 = 85 ひき, 80 × 85/680 = 10]
      - [2 日目の印の割合 15/120 = 1/8 は、池全体と同じと考える, 取り出した後の池でも、印の割合は (100 − 15)/(800 − 120) = 1/8, 80 × 1/8 = 10]
    note: 標識再捕法の推定のあと、池から出した魚の分を引いて、全体と印の数を数え直す。2 日目の印の割合 15/120 をそのまま使って 80 × 1/8 = 10 としても同じになるのは、取り出した魚の印の割合が池全体と同じと考えているから。どちらの道でも同じになるわけを話し合うとよい。
  - part: 離
    id: "7c036eb718"
    kinds: [道筋]
    text: 答えにくい質問「宿題をだれかに写させてもらったことがありますか」の割合を調べるため、400 人に図のようにしてもらいました。1 人ずつ、ほかの人に見えないようにコインを投げ、表が出た人は質問に正直に答え、うらが出た人は質問に関係なく「はい」と答えます。結果は、400 人のうち 260 人が「はい」でした。本当に写させてもらったことがある人の割合は、およそ何 % と考えられますか。% の前の数で答えましょう。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="78" width="64" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="40" y="100" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">400 人</text><line x1="74" y1="95" x2="85" y2="95" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="92,95 85,98.8 85,91.2" fill="currentColor" stroke="none"/><circle cx="110" cy="95" r="16" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="110" cy="95" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="110" y="129" font-size="11" text-anchor="middle" fill="currentColor">コイン</text><line x1="126" y1="86" x2="151.2" y2="59.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="156,54 154,61.7 148.4,56.5" fill="currentColor" stroke="none"/><line x1="126" y1="104" x2="151.2" y2="130.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="156,136 148.4,133.5 154,128.3" fill="currentColor" stroke="none"/><rect x="160" y="24" width="152" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="160" y="114" width="152" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="236" y="44" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">表 → 質問に</text><text x="236" y="64" font-size="13" text-anchor="middle" fill="currentColor">正直に答える</text><text x="236" y="134" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">うら → 質問に関係</text><text x="236" y="154" font-size="13" text-anchor="middle" fill="currentColor">なく「はい」と答える</text><text x="160" y="192" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">400 人のうち「はい」は 260 人</text></svg>'
    answer: 30
    check: "(lambda n, yes: Fraction(yes - n // 2, n // 2) * 100)(400, 260)"
    hints:
      - コインのうらが出る人は、およそ何人かな。その人たちはみな「はい」と答えるね。
      - text: 表とうらに分かれる人数を、図に書き入れたよ。表が出た人の「はい」は何人かな。
        svg: '<svg viewBox="0 0 320 192" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="78" width="64" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="40" y="100" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">400 人</text><line x1="74" y1="95" x2="85" y2="95" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="92,95 85,98.8 85,91.2" fill="currentColor" stroke="none"/><circle cx="110" cy="95" r="16" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="110" cy="95" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="110" y="129" font-size="11" text-anchor="middle" fill="currentColor">コイン</text><line x1="126" y1="86" x2="151.2" y2="59.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="156,54 154,61.7 148.4,56.5" fill="currentColor" stroke="none"/><line x1="126" y1="104" x2="151.2" y2="130.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="156,136 148.4,133.5 154,128.3" fill="currentColor" stroke="none"/><rect x="160" y="24" width="152" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="160" y="114" width="152" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="236" y="44" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">表 → 質問に</text><text x="236" y="64" font-size="13" text-anchor="middle" fill="currentColor">正直に答える</text><text x="236" y="134" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">うら → 質問に関係</text><text x="236" y="154" font-size="13" text-anchor="middle" fill="currentColor">なく「はい」と答える</text><text x="150" y="68" font-size="11" text-anchor="end" fill="currentColor">およそ 200 人</text><text x="152" y="158" font-size="11" text-anchor="end" fill="currentColor">およそ 200 人</text><text x="236" y="94" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">「はい」? 人</text><text x="236" y="184" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">「はい」およそ 200 人</text></svg>'
      - 表が出た人は正直に答えたので、その中の「はい」の割合が、本当の割合の推定になるよ。
    paths:
      - [うらが出る人はおよそ 200 人で、全員が「はい」, 表が出たおよそ 200 人のうち「はい」は 260 − 200 = 60 人, 60 ÷ 200 = 0.3 で 30 %]
      - [「はい」の割合は 260/400 = 0.65, うらの半分が全員「はい」なので、0.65 = 0.5 + 0.5 × (本当の割合), 本当の割合は 0.15 ÷ 0.5 = 0.3 で 30 %]
    note: だれが正直に答えたかを調べる人も知らないので、答える人は本当のことを言いやすい（無作為化回答法）。ぐうぜん（コイン）を調査の方法に取りこみ、コインの確率 1/2 から逆にたどって割合を取り出すのが要点。
  - part: 離
    id: "d5b417a8d7"
    kinds: [総動員]
    uses: [C-008]
    text: ある町の住民 5000 人から無作為に 80 人を選んで聞いたところ、新聞を読んでいる人が 30 人、ニュースのアプリを使っている人が 60 人、両方の人が 22 人でした。町の住民のうち、新聞もニュースのアプリも使っていない人は、およそ何人と考えられますか。
    svg: '<svg viewBox="0 0 320 184" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="26" width="300" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="18" y="18" font-size="13" text-anchor="start" fill="currentColor" font-weight="bold">選んだ 80 人</text><circle cx="118" cy="100" r="56" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="190" cy="100" r="60" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="16" y="48" font-size="13" text-anchor="start" fill="currentColor" font-weight="bold">新聞 30 人</text><line x1="50" y1="53" x2="78" y2="63" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="304" y="48" font-size="13" text-anchor="end" fill="currentColor" font-weight="bold">アプリ 60 人</text><line x1="262" y1="53" x2="236" y2="64" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="154" y="98" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">両方</text><text x="154" y="114" font-size="12" text-anchor="middle" fill="currentColor">22 人</text><text x="304" y="168" font-size="12" text-anchor="end" fill="currentColor" font-weight="bold">どちらも ? 人</text></svg>'
    answer: 750
    check: "5000 * Fraction(80 - (30 + 60 - 22), 80)"
    hints:
      - まず、標本の 80 人の中で、どちらも使っていない人の人数を求めよう。
      - text: 円の重なりを分けると、「新聞だけ」「アプリだけ」「両方」の 3 つになるね（C-008）。
        svg: '<svg viewBox="0 0 320 184" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="26" width="300" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="18" y="18" font-size="13" text-anchor="start" fill="currentColor" font-weight="bold">選んだ 80 人</text><circle cx="118" cy="100" r="56" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="190" cy="100" r="60" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="90" y="96" font-size="12" text-anchor="middle" fill="currentColor">新聞だけ</text><text x="90" y="112" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">? 人</text><text x="222" y="96" font-size="12" text-anchor="middle" fill="currentColor">アプリだけ</text><text x="222" y="112" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">? 人</text><text x="16" y="48" font-size="13" text-anchor="start" fill="currentColor" font-weight="bold">新聞 30 人</text><line x1="50" y1="53" x2="78" y2="63" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="304" y="48" font-size="13" text-anchor="end" fill="currentColor" font-weight="bold">アプリ 60 人</text><line x1="262" y1="53" x2="236" y2="64" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="154" y="98" font-size="12" text-anchor="middle" fill="currentColor" font-weight="bold">両方</text><text x="154" y="114" font-size="12" text-anchor="middle" fill="currentColor">22 人</text><text x="304" y="168" font-size="12" text-anchor="end" fill="currentColor" font-weight="bold">どちらも ? 人</text></svg>'
      - 標本の中の割合を、町の 5000 人にかけよう。
    paths:
      - [どちらかを使っている人は 30 + 60 − 22 = 68 人, どちらも使っていない人は 80 − 68 = 12 人, 5000 × 12/80 = 750]
      - [新聞だけは 30 − 22 = 8 人、アプリだけは 60 − 22 = 38 人, 8 + 38 + 22 = 68 人で、どちらも使っていない人は 12 人, 5000 × 12/80 = 750]
    note: ベン図の重なり（C-008）で標本の人数を出してから、標本調査の推定につなぐ。80 − 30 − 60 = −10 のように重なりをわすれるとおかしな数になる。
