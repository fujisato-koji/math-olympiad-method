      - part: 今日
        id: "4969454e3d"
        text: 肥料の実験で、くじで分けた実験群 20 本と対照群 20 本の、1 本あたりのとれた量の平均をグラフにしました。実験群の平均は、対照群の平均の何倍ですか。
