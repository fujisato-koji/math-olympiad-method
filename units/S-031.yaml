        explain: 調べたい集団の全員を調べることを全数調査、集団の一部を取り出して調べ、全体のようすをおしはかることを標本調査といいます。調べたい集団全体を母集団、取り出した一部を標本、標本の人数を標本の大きさといいます。この調査では、母集団は 600 人、標本は選んだ 50 人で、標本の大きさは 50 です。標本は、どの人も同じ確率で選ばれるように、くじや乱数を使って選びます。これを無作為抽出といいます。無作為に選んだ標本では、標本の割合は母集団の割合に近いと考えられます。標本で毎朝食べる人の割合は 42/50 = 0.84 なので、600 人のうちおよそ 600 × 0.84 = 504 人と推定できます。選ぶ 50 人が変わると結果も少し変わるので、「およそ」と言います。
