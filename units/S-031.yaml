        note: 実験群の 6.5 点をそのまま効果としやすい。対照群の上がり方を差し引くのが対照群の役割。
      - part: 挑戦
        text: ある調査で、コーヒーをよく飲む人ほど肺の病気が多いという結果が出ました。ところが、コーヒーをよく飲む人には、たばこを吸う人が多いことも分かりました。この調査から言えることとして、最も適切なものはどれですか。
        choices: [コーヒーが肺の病気の原因である, たばこの影響がまざっているので、コーヒーが原因かどうかはこの調査だけでは分からない, コーヒーを飲むと肺の病気を防げる]
        answer: たばこの影響がまざっているので、コーヒーが原因かどうかはこの調査だけでは分からない
