46" y="86" width="14" height="24" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="240" cy="127.2" r="5" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6"/><path d="M232.8,149.7 L232.8,137.5 Q232.8,133.9 240,133.9 Q247.2,133.9 247.2,137.5 L247.2,149.7 Z" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="132" y1="92" x2="176" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="184,92 176,96.4 176,87.6" fill="currentColor" stroke="none"/><text x="240" y="168" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">ここの 30 人に聞く</text></svg>'
        explain: 例：「図書館にいる人は、勉強をよくする人が多いと考えられる。そのような人ばかりを選ぶと、標本の平均値は、母集団の平均値より大きくなりやすい（偏り）。全校生徒に番号をつけ、くじや乱数で 30 人を選べば、どの生徒も同じ確率で選ばれるので、勉強時間の長い人も短い人も、全体と同じような割合で入りやすい。」と書ければよい。言えればよいことは 2 つ。①選び方によっては、とくちょうのある人ばかりが入り、結果がかたよる。②無作為に選べば、どの人も同じ確率で選ばれ、偏りが出にくい。図書館の例を自分の言葉で説明できていればよい（水準 2 の単元なので、わけは代表の例を文に書く ②）。無作為に選んでも標本ごとに結果は少しずつちがうが、それはぐうぜんのずれで偏りとはちがい、標本を大きくすると小さくなることにふれる。
