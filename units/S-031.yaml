# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [手数, 読み取り]
    text: 池の魚の数を調べます。1 日目に 100 匹をとって印をつけ、池にもどしました。2 日目に 120 匹をとると、印のついた魚が 15 匹いました。2 日目にとった 120 匹は池にもどさずに、別の池に移しました。3 日目に 80 匹をとるとき、印のついた魚はおよそ何匹ふくまれると考えられますか。2 日目の結果から推定した池の魚の数を使いましょう。
    answer: 10
    check: "(lambda n: 80 * Fraction(100 - 15, n - 120))(100 * Fraction(120, 15))"
    hints:
      - まず、2 日目の結果から、池の魚の数を推定しよう。
      - 2 日目に池から出した 120 匹の中には、印のついた魚が何匹いたかな。池に残った魚と、そのうちの印のついた魚は何匹かな。
      - 3 日目にとる 80 匹の中の印の割合は、池に残った魚の中の印の割合と同じと考えよう。
    paths:
      - [池の魚はおよそ 100 × 120/15 = 800 匹, 残りは 800 − 120 = 680 匹で、印は 100 − 15 = 85 匹, 80 × 85/680 = 10]
    note: 標識再捕法の推定のあと、池から出した魚の分を引いて、全体と印の数を数え直す。2 日目の印の割合 15/120 をそのまま使って 80 × 1/8 = 10 としても同じになるのは、取り出した魚の印の割合が池全体と同じと考えているから。どちらの道でも同じになるわけを話し合うとよい。
  - part: 離
    kinds: [道筋]
    text: 答えにくい質問「宿題をだれかに写させてもらったことがありますか」の割合を調べるため、400 人に次のようにしてもらいました。1 人ずつ、ほかの人に見えないように硬貨を投げ、表が出た人は質問に正直に答え、裏が出た人は質問に関係なく「はい」と答えます。結果は、400 人のうち 260 人が「はい」でした。本当に写させてもらったことがある人の割合は、およそ何 % と考えられますか。% の前の数で答えましょう。
    answer: 30
    check: "(lambda n, yes: Fraction(yes - n // 2, n // 2) * 100)(400, 260)"
    hints:
      - 硬貨の裏が出る人は、およそ何人かな。その人たちはみな「はい」と答えるね。
      - 残りの「はい」は、表が出た人の答えだね。
      - 表が出た人は正直に答えたので、その中の「はい」の割合が、本当の割合の推定になるよ。
    paths:
      - [裏が出る人はおよそ 200 人で、全員が「はい」, 表が出たおよそ 200 人のうち「はい」は 260 − 200 = 60 人, 60 ÷ 200 = 0.3 で 30 %]
    note: だれが正直に答えたかを調べる人も知らないので、答える人は本当のことを言いやすい（無作為化回答法）。偶然（硬貨）を調査の方法に取りこみ、硬貨の確率 1/2 から逆にたどって割合を取り出すのが要点。
  - part: 離
    kinds: [総動員]
    uses: [C-008]
    text: ある町の住民 5000 人から無作為に 80 人を選んで聞いたところ、新聞を読んでいる人が 30 人、ニュースのアプリを使っている人が 60 人、両方の人が 22 人でした。町の住民のうち、新聞もニュースのアプリも使っていない人は、およそ何人と考えられますか。
    answer: 750
    check: "5000 * Fraction(80 - (30 + 60 - 22), 80)"
    hints:
      - まず、標本の 80 人の中で、どちらも使っていない人の人数を求めよう。
      - どちらか一方でも使っている人は、30 + 60 から重なりをひいて求めるね（C-008）。
      - 標本の中の割合を、町の 5000 人にかけよう。
