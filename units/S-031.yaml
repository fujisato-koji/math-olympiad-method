      - part: 見本
        id: "5d290e35c9"
        text: 調べる人が条件を決めてあたえ、結果を比べる調べ方を実験、条件をあたえず、もとからのようすを調べる調べ方を観察研究といいます。図の実験では、トマトのなえ 40 本をくじで 20 本ずつに分け、新しい肥料の組（実験群）といつもの肥料の組（対照群）で、とれる量を比べます。ほかの育て方は同じにします。この調べ方のよいところを考えてみましょう。
