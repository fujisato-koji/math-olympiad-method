        check: "Fraction(math.comb(198, 8), math.comb(200, 10))"
        hints:
          - 2 人がどちらも選ばれる選び方は、残りの 198 人から何人を選ぶ選び方と同じ数でしょう。
          - text: 会長が選ばれたとします。副会長も選ばれるには、残りの席のどれかに入ればよいのです。
            svg: '<svg viewBox="0 0 320 122" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">選ばれる 10 人の席</text><rect x="14" y="36" width="26" height="32" rx="4" fill="#f3c969" fill-opacity="0.8" stroke="currentColor" stroke-width="1.6"/><text x="27" y="56" font-size="9" text-anchor="middle" fill="currentColor" font-weight="bold">会長</text><rect x="44" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="74" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="104" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="134" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="164" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="194" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="224" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="254" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="284" y="36" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="160" y="96" font-size="12" text-anchor="middle" fill="currentColor">会長が 1 つの席に入ったとき、</text><text x="160" y="112" font-size="12" text-anchor="middle" fill="currentColor">副会長が入れる席は？ 残りの人は何人？</text></svg>'
          - 全部の選び方の数でわった比を、組合せの式のまま約分してもよいです。
        paths:
          - [生徒会長が選ばれる確率は 10/200, 生徒会長が選ばれたとき、副会長が残り 9 人に入る確率は 9/199, 10/200 × 9/199 = 9/3980]
          - [全部の選び方は 200 人から 10 人を選ぶ数、2 人とも入るのは残り 198 人から 8 人を選ぶ数, 比を約分すると (10 × 9)/(200 × 199) = 9/3980]
        note: 2 本目の考え方（条件付き確率の乗法定理）は C-043 で扱う。ここでは組合せの数の比を約分して確かめてもよい。

