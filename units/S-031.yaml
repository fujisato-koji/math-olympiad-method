        explain: 調べたい条件を人が決めてあたえ、結果を比べる調べ方を実験といいます。これに対して、人が条件をあたえず、もとから起こっていることを調べる調べ方を観察研究といいます。新しい肥料をあたえる組を実験群、あたえない組（いつもの肥料の組）を対照群といいます。対照群があるので、肥料のほかの理由（天気や季節）で変わった分を差し引いて比べられます。くじで組を分ける（無作為なわり付け）と、日当たりやなえの元気さなど、ほかの条件が両方の組に同じくらいずつ分かれるので、差が出たら肥料のせいと考えやすくなります。また、なえの数を多くすると、ぐうぜんの差が小さくなります。人を対象にした薬の実験では、本物の薬と見分けがつかない偽薬（プラセボ）を対照群に飲ませ、どちらを飲んだかを、飲む人にも結果を調べる人にも知らせないようにします（二重盲検）。思いこみが結果に入らないようにするためです。
