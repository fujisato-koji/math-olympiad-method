        paths:
          - [全体は 2000 人で、女子の割合は 800/2000 = 2/5, 50 × 2/5 = 20]
          - [男子：女子 = 1200：800 = 3：2, 50 人を 3：2 に分けると、女子は 50 × 2/5 = 20]
