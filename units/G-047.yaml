# G-047 極座標と極方程式
#
# 段 6・水準 3・6 日。前提は G-025（三角関数）と G-026（座標と図形の方程式）。
# 極座標、極方程式、円と螺旋、直交座標との変換を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: G-047
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          極座標は、原点 O からの距離 r と、x 軸の正の向きから測った角 θ で点を表します。
          直交座標との関係：x = r cos θ、y = r sin θ。
          逆に、r = √(x²+y²)、tan θ = y/x。
          例：r=2、θ=π/3 の点は、x=2cos(π/3)=1、y=2sin(π/3)=√3。
        explain: |-
          極座標は「原点からどれだけ離れているか」と「どの向きか」で点を決めます。
          r は距離なので 0 以上。θ は反時計回りに測ります。
          直交座標の (x,y) と、極座標の (r,θ) は、三角関数で行き来できます。
        note: x=r cosθ、y=r sinθ。r=√(x²+y²)、tanθ=y/x。
      - part: 今日
        text: 極座標 (r, θ) = (2, π/3) を直交座標に直すとどれですか。
        choices: ["(1, √3)", "(√3, 1)", "(2, 2)", "(1, 1)"]
        answer: "(1, √3)"
        check: "'(1, √3)'"
        hints:
          - x=r cosθ、y=r sinθ を使います。
          - cos(π/3) と sin(π/3) を求めます。
          - r=2 をかけます。
        paths:
          - [x=r cosθ, y=r sinθ, cos(π/3)=1/2、sin(π/3)=√3/2, (1,√3)]
      - part: 今日
        text: 直交座標 (0, 2) を極座標に直すとどれですか。
        choices: ["(2, π/2)", "(2, 0)", "(π/2, 2)", "(0, π/2)"]
        answer: "(2, π/2)"
        check: "'(2, π/2)'"
        hints:
          - r=√(x²+y²) を計算します。
          - 点は y 軸の上にあります。
          - 角度を考えます。
        paths:
          - [r=√(0+4)=2, y 軸の上, θ=π/2, (2,π/2)]
      - part: 挑戦
        text: 極座標 (r, θ) = (1, π) を直交座標に直すとどれですか。
        choices: ["(−1, 0)", "(1, 0)", "(0, 1)", "(0, −1)"]
        answer: "(−1, 0)"
        check: "'(−1, 0)'"
        hints:
          - x=r cosθ、y=r sinθ を使います。
          - cos π と sin π を求めます。
          - r=1 をかけます。
        paths:
          - [x=cosπ=−1, y=sinπ=0, (−1,0)]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          極方程式は、r と θ の関係で曲線を表します。
          r = a（一定）は、原点を中心とする半径 a の円。
          θ = α（一定）は、原点を通る角 α の直線。
          r = 2a cos θ は、中心 (a, 0)、半径 a の円。
        explain: |-
          r が一定なら、原点からの距離がいつも同じなので円です。
          θ が一定なら、原点から同じ向きに出る直線です。
          r=2a cosθ は、両辺に r をかけて x²+y²=2ax と変形すると、円になります。
        note: r=一定は円、θ=一定は直線。r=2a cosθ は円。
      - part: 今日
        text: 極方程式 r = 3 が表す曲線はどれですか。
        choices: [円, 直線, 放物線, 螺旋]
        answer: 円
        check: "'円'"
        hints:
          - r は原点からの距離です。
          - 距離がいつも同じ点を考えます。
          - r が一定の 点を 考えよう。
        paths:
          - [r=距離, いつも 3, 円]
      - part: 今日
        text: 極方程式 θ = 0 が表す曲線はどれですか。
        choices: [直線, 円, 放物線, 螺旋]
        answer: 直線
        check: "'直線'"
        hints:
          - θ は角度です。
          - 角度がいつも 0 の点を考えます。
          - x 軸の正の向きの直線です。
        paths:
          - [θ=0, x 軸の正の向き, 直線]
      - part: 挑戦
        text: 極方程式 r = 2sinθ が表す曲線はどれですか。
        choices: ["円 x²+(y−1)²=1", "円 x²+y²=2", "直線 y=x", "螺旋"]
        answer: "円 x²+(y−1)²=1"
        check: "'円 x²+(y−1)²=1'"
        hints:
          - 両辺に r をかけます。
          - r²=x²+y²、r sinθ=y を使います。
          - 平方完成します。
        paths:
          - [r²=2r sinθ, x²+y²=2y, x²+(y−1)²=1]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          極方程式の例：
          r = θ は螺旋（アルキメデスの螺旋）。
          r = a(1 + cos θ) はカージオイド（心臓形）。
          r = a は円、r = 2a cos θ は円。
          極方程式は、原点のまわりの回転や対称性を見るのに便利です。
        explain: |-
          r=θ は、角度が増えるほど距離も増えるので、渦巻きになります。
          r=a(1+cosθ) は、θ=0 で最大 2a、θ=π で 0 になる心臓形。
          r=一定 や r=2a cosθ は円です。
        note: r=θ は螺旋、r=a(1+cosθ) はカージオイド、r=一定は円。
      - part: 今日
        text: 極方程式 r = θ が表す曲線はどれですか。
        choices: [螺旋, 円, 直線, 放物線]
        answer: 螺旋
        check: "'螺旋'"
        hints:
          - θ が増えると r はどうなりますか。
          - 角度が増えるほど遠くへ回ります。
          - θ と r の 増え方 を 考えよう。
        paths:
          - [θ が増える, r も増える, 螺旋]
      - part: 今日
        text: 極方程式 r = 1 + cosθ が表す曲線はどれですか。
        choices: [カージオイド, 円, 直線, 螺旋]
        answer: カージオイド
        check: "'カージオイド'"
        hints:
          - θ=0 と θ=π の r を考えます。
          - 0 で最大、π で 0 になります。
          - 心臓形です。
        paths:
          - [θ=0 で 2, θ=π で 0, 心臓形, カージオイド]
      - part: 挑戦
        text: 極方程式 r = 2cosθ の θ=0 での点はどれですか。
        choices: ["(2, 0)", "(0, 2)", "(1, 0)", "(0, 1)"]
        answer: "(2, 0)"
        check: "'(2, 0)'"
        hints:
          - θ=0 のときの r を求めます。
          - x=r cosθ、y=r sinθ に入れます。
          - 点を求めます。
        paths:
          - [r=2cos0=2, x=2、y=0, (2,0)]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          直交座標から極座標へ：
          x² + y² = r²、x = r cosθ、y = r sinθ。
          x²+y²=a² は r=a。
          y=x は θ=π/4。
          x²+y²=2ax は r=2a cosθ。
          式に r をかけてから、x,y に直すと極方程式になります。
        explain: |-
          直交座標の式を極座標に直すには、x²+y²=r²、x=r cosθ、y=r sinθ を代入します。
          x²+y²=a² は r²=a²、r=a。
          y=x は r sinθ=r cosθ、tanθ=1、θ=π/4。
        note: x²+y²=r²、x=r cosθ、y=r sinθ。必要なら r をかける。
      - part: 今日
        text: 直交座標の式 x² + y² = 4 を極方程式に直すとどれですか。
        choices: ["r = 2", "r = 4", "r = 2cosθ", "θ = 2"]
        answer: "r = 2"
        check: "'r = 2'"
        hints:
          - x²+y²=r² を使います。
          - r²=4 になります。
          - r は 0 以上です。
        paths:
          - [x²+y²=r², r²=4, r=2]
      - part: 今日
        text: 直交座標の式 y = x を極方程式に直すとどれですか。
        choices: ["θ = π/4", "r = π/4", "θ = π/2", "r = 1"]
        answer: "θ = π/4"
        check: "'θ = π/4'"
        hints:
          - x=r cosθ、y=r sinθ を代入します。
          - sinθ=cosθ になります。
          - 角度を求めます。
        paths:
          - [r sinθ=r cosθ, tanθ=1, θ=π/4]
      - part: 挑戦
        text: 直交座標の式 x² + y² = 2x を極方程式に直すとどれですか。
        choices: ["r = 2cosθ", "r = 2sinθ", "r = 2", "θ = 2"]
        answer: "r = 2cosθ"
        check: "'r = 2cosθ'"
        hints:
          - x²+y²=r²、x=r cosθ を使います。
          - r²=2r cosθ になります。
          - r でわります。
        paths:
          - [r²=2r cosθ, r=2cosθ]
    extra: []

  - day: 5
    items:
      - part: わけ
        text: 直交座標と極座標が x = r cosθ、y = r sinθ で結ばれるわけを説明しましょう。
        explain: 「原点から点までの距離が r、x 軸からの角が θ の直角三角形を考える。斜辺が r、角 θ の隣辺が x、向かい辺が y。cosθ=x/r、sinθ=y/r なので、x=r cosθ、y=r sinθ。」と書ければよい。① 直角三角形、② cos と sin の定義、③ r をかける。子どもには、単位円で確かめさせます。
        hints:
          - 原点と点を結ぶ直角三角形を考えます。
          - 斜辺は r です。
          - cosθ と sinθ の定義を使います。
        paths:
          - [直角三角形, 斜辺 r, cosθ=x/r、sinθ=y/r, x=r cosθ、y=r sinθ]
      - part: わけ
        text: 極方程式 r = 2cosθ が円になるわけを説明しましょう。
        explain: 「r=2cosθ の両辺に r をかけると r²=2r cosθ。x=r cosθ、r²=x²+y² を使うと x²+y²=2x。平方完成すると (x−1)²+y²=1。だから円。」と書ければよい。① r をかける、② x,y に直す、③ 平方完成。子どもには、θ をいくつか入れて確かめさせます。
        hints:
          - 両辺に r をかけます。
          - x²+y²=r²、x=r cosθ を使います。
          - 平方完成します。
        paths:
          - [r²=2r cosθ, x²+y²=2x, (x−1)²+y²=1]
      - part: わけ
        text: 極方程式 r = θ が螺旋になるわけを説明しましょう。
        explain: 「θ が増えると、r=θ も増える。角度が大きくなるほど、原点からの距離も大きくなる。だから、回りながら遠くへ広がる螺旋になる。」と書ければよい。① θ が増える、② r も増える、③ 回りながら遠ざかる。子どもには、θ=0、π/2、π の点を確かめさせます。
        hints:
          - θ が増えると r はどうなりますか。
          - 角度と距離の両方が増えます。
          - 回りながら遠ざかります。
        paths:
          - [θ が増える, r も増える, 回りながら遠ざかる, 螺旋]

  - day: 6
    items:
      - part: 今日
        text: 極座標 (2, π/3) を直交座標に直すとどれですか。
        choices: ["(1, √3)", "(√3, 1)", "(2, 2)", "(1, 1)"]
        answer: "(1, √3)"
        check: "'(1, √3)'"
        hints:
          - x=r cosθ、y=r sinθ を使います。
          - cos(π/3)、sin(π/3) を求めます。
          - r=2 をかけます。
        paths:
          - [x=r cosθ、y=r sinθ, (1,√3)]
      - part: 今日
        text: 極方程式 r = 3 が表す曲線はどれですか。
        choices: [円, 直線, 放物線, 螺旋]
        answer: 円
        check: "'円'"
        hints:
          - r は原点からの距離です。
          - 距離がいつも同じ点を考えます。
          - r が一定の 点を 考えよう。
        paths:
          - [r=3, 円]
      - part: 今日
        text: 極方程式 θ = 0 が表す曲線はどれですか。
        choices: [直線, 円, 放物線, 螺旋]
        answer: 直線
        check: "'直線'"
        hints:
          - θ は角度です。
          - 角度がいつも 0 の点を考えます。
          - θ が一定の 点を 考えよう。
        paths:
          - [θ=0, 直線]
      - part: 今日
        text: 直交座標の式 x² + y² = 4 を極方程式に直すとどれですか。
        choices: ["r = 2", "r = 4", "r = 2cosθ", "θ = 2"]
        answer: "r = 2"
        check: "'r = 2'"
        hints:
          - x²+y²=r² を使います。
          - r²=4 になります。
          - r は 0 以上です。
        paths:
          - [r²=4, r=2]
      - part: 今日
        text: 極方程式 r = 2cosθ の θ=0 での点はどれですか。
        choices: ["(2, 0)", "(0, 2)", "(1, 0)", "(0, 1)"]
        answer: "(2, 0)"
        check: "'(2, 0)'"
        hints:
          - θ=0 のときの r を求めます。
          - x=r cosθ、y=r sinθ に入れます。
          - 点を求めます。
        paths:
          - [r=2, x=2、y=0, (2,0)]
      - part: 今日
        text: 極方程式 r = θ が表す曲線はどれですか。
        choices: [螺旋, 円, 直線, 放物線]
        answer: 螺旋
        check: "'螺旋'"
        hints:
          - θ が増えると r はどうなりますか。
          - 角度が増えるほど遠くへ回ります。
          - θ と r の 増え方 を 考えよう。
        paths:
          - [θ が増える, r も増える, 螺旋]
    extra: []

