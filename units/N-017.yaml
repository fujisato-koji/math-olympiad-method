    svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><text x="160" y="21" font-size="15" text-anchor="middle" fill="currentColor">4 まいを全部ならべる</text><rect x="78" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="94" y="60" font-size="17" text-anchor="middle" fill="currentColor">0</text><rect x="122" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="138" y="60" font-size="17" text-anchor="middle" fill="currentColor">1</text><rect x="166" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="182" y="60" font-size="17" text-anchor="middle" fill="currentColor">2</text><rect x="210" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="226" y="60" font-size="17" text-anchor="middle" fill="currentColor">3</text><rect x="48" y="96" width="44" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><text x="70" y="160" font-size="14" text-anchor="middle" fill="currentColor">千の位</text><rect x="108" y="96" width="44" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><text x="130" y="160" font-size="14" text-anchor="middle" fill="currentColor">百の位</text><rect x="168" y="96" width="44" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><text x="190" y="160" font-size="14" text-anchor="middle" fill="currentColor">十の位</text><rect x="228" y="96" width="44" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><text x="250" y="160" font-size="14" text-anchor="middle" fill="currentColor">一の位</text></svg>'
    answer: 6
    check: "len([p for p in itertools.permutations([0, 1, 2, 3]) if p[0] != 0 and (1000 * p[0] + 100 * p[1] + 10 * p[2] + p[3]) % 11 == 0])"
    hints:
      - 11 の倍数は、千の位と十の位をたした数と、百の位と一の位をたした数のちがいが、0 か 11 か 22…になる数だよ。
      - text: 黄色の 2 まいの和と、青の 2 まいの和をくらべる。4 まいの和は 6 なので、ちがいが 0 になるのは、どちらの和も 3 のときだね。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><text x="160" y="21" font-size="15" text-anchor="middle" fill="currentColor">黄色の和と青の和をくらべる</text><rect x="78" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="94" y="60" font-size="17" text-anchor="middle" fill="currentColor">0</text><rect x="122" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="138" y="60" font-size="17" text-anchor="middle" fill="currentColor">1</text><rect x="166" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="182" y="60" font-size="17" text-anchor="middle" fill="currentColor">2</text><rect x="210" y="34" width="32" height="40" rx="4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.6"/><text x="226" y="60" font-size="17" text-anchor="middle" fill="currentColor">3</text><rect x="48" y="96" width="44" height="44" rx="5" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="70" y="160" font-size="14" text-anchor="middle" fill="currentColor">千の位</text><rect x="108" y="96" width="44" height="44" rx="5" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="130" y="160" font-size="14" text-anchor="middle" fill="currentColor">百の位</text><rect x="168" y="96" width="44" height="44" rx="5" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="190" y="160" font-size="14" text-anchor="middle" fill="currentColor">十の位</text><rect x="228" y="96" width="44" height="44" rx="5" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="250" y="160" font-size="14" text-anchor="middle" fill="currentColor">一の位</text><text x="160" y="184" font-size="14" text-anchor="middle" fill="currentColor">黄色の和 = 青の和</text></svg>'
      - 和が 3 になる 2 まいの組を考え、千の位に 0 をおけないことに気をつけよう。
    paths:
      - [11 の倍数の見分け方, 4 まいの和は 6, 千の位と十の位の和 = 百の位と一の位の和 = 3, "組は (0,3) と (1,2)", 千の位に 0 をおかずに数える, 2 + 4 = 6 こ]
      - [千の位が 3 のとき 3102、3201, 千の位が 1 か 2 のとき 1023、1320、2013、2310, 6 こ]
    note: 11 の倍数は、一の位から 1 つおきにたしひきした数が 11 の倍数になる。4 けたなら、千の位と十の位の和と、百の位と一の位の和のちがいを見る（前の 2 けたと後の 2 けたではない）。千の位に 0 をおけない。十の位の 0 は使える。
