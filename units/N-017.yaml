      - ["000 から 999 までを 3 桁とみる", "1 を置く位置は 3 通り", "残りの 2 桁は 1 以外の 9 通りずつ", "3 × 9 × 9 = 243"]
    note: 3 桁では、1 が百の位なら残り 2 桁は 1 以外の 9 通りずつ。十の位・一の位なら、百の位に 0 と 1 を使えないことに注意する。
