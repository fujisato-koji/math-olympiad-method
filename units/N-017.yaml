        explain: 3 に 1、2、3、4、5…をかけてできる数を、3 の倍数といいます。3 × 1 = 3、3 × 2 = 6、3 × 3 = 9、3 × 4 = 12、3 × 5 = 15 なので、小さいほうから 3、6、9、12、15 です。3 のだんの九九の答えと同じで、3 ずつ大きくなります。数直線で 0 から 3 ずつ進んで着くところが、3 の倍数です。0 は倍数に入れません。
