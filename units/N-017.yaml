# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "006a84fd25"
    kinds: [道筋]
    text: 1 から 50 までの数のうち、《約数》がちょうど 3 こある数は何こありますか。
    answer: 4
    check: "sum(1 for k in range(1, 51) if sum(1 for d in range(1, k + 1) if k % d == 0) == 3)"
    hints:
      - 約数は、かけてその数になる 2 つの数の組で見つけたね。ふつう、約数は 2 こずつ組になるよ。
      - text: 約数が 3 こになるのは、組の 2 つの数が同じになるとき（9 = 3 × 3 のような数）だね。
        svg: '<svg viewBox="0 0 320 146" xmlns="http://www.w3.org/2000/svg"><text x="160" y="21" font-size="15" text-anchor="middle" fill="currentColor">9 の約数の組</text><path d="M 90 87 Q 160 -5 230 87" fill="none" stroke="#f08080" stroke-width="3"/><circle cx="90" cy="100" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="90" y="105" font-size="14" text-anchor="middle" fill="currentColor">1</text><circle cx="160" cy="100" r="13" fill="#f3c969" fill-opacity="0.8" stroke="currentColor" stroke-width="2.2"/><text x="160" y="105" font-size="14" text-anchor="middle" fill="currentColor">3</text><circle cx="230" cy="100" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230" y="105" font-size="14" text-anchor="middle" fill="currentColor">9</text><text x="160" y="134" font-size="14" text-anchor="middle" fill="currentColor">3 × 3</text></svg>'
      - 同じ数を 2 回かけた数を 50 まで書き出して、それぞれの約数をぜんぶ調べよう。
    paths:
      - [約数は 1 × 12、2 × 6 のように組になる, 3 こになるのは □ × □ のように同じ数の組があるとき, 4、9、16、25、36、49 の約数を調べる, 約数が 3 こなのは 4、9、25、49 の 4 こ]
      - [約数が 3 こなら、1 とその数のほかに 1 こだけ, そのもう 1 こを 2 回かけるとその数になる, 2 × 2、3 × 3、5 × 5、7 × 7, 4 こ]
    note: 約数が組になること（N-017 の見つけ方）から、約数の数が組にならない（3 こ）のは同じ数を 2 回かけた数だけ、と目をつけるのが道すじ。16（1、2、4、8、16）と 36 は約数が 5 こ、9 こになるので、書き出して確かめる。素数の 2 回かけ（N-021）につながる。
