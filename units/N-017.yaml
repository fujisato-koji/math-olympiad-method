# N-017 倍数と約数
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-014（わり算とあまり）まで。数は 100 まで（N-006。1000 までの N-009 は前提にない）。
#   かけ算は九九と、同じ数をたしていく形（24 = 12 + 12）、わり算は商が 1 けたの形とあまりに収めた。
# 倍数は「□ に 1、2、3… をかけた数」とし、0 は入れない（小学校の言い方に合わせる）。
# 約数は「その数をわり切ることのできる数」。かけてその数になる 2 つの数の組で、もれなく見つける。
# 倍数の見分け方は、一の位で決まる 2・5・10 だけにした。3 と 9 の見分け方（位の数の和）は、あまりの性質の N-022 にまわす。
# 2 つの数に共通な倍数・約数は N-018、素数は N-021 なので、ここでは出さない。N-008（偶数と奇数）は前提にないので「偶数」の語は使わない。
# 図の 🔵 のならびは、かけ算の長方形（たて × よこ）。check は「わり切れる」を % で、数えるのは len([…]) で確かめる。
# 日の並び（既定）：1 日目 倍数、2 日目 約数、3 日目 倍数と約数の関係・2、5、10 の倍数の見分け方、4 日目 わけ、
#   5 日目 N-014（あまり）と混ぜる、6 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-009 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: N-017
days:
  - day: 1
    items:
      - part: 見本
        text: 3 の《倍数》を、小さい順に 5 つ書きましょう。
        explain: 3 に 1、2、3、4、5…をかけてできる数を、3 の倍数といいます。3 × 1 = 3、3 × 2 = 6、3 × 3 = 9、3 × 4 = 12、3 × 5 = 15 なので、小さい順に 3、6、9、12、15 です。3 の段の九九の答えと同じで、3 ずつ大きくなります。
      - part: 思い出す
        text: 42 ÷ 7 はいくつですか。
        answer: 6
        check: "42 // 7"
        hints:
          - 7 の段の九九を思い出そう。
          - 7 × □ = 42 の □ をさがそう。
          - 7 × 5 は 35 だったね。その次は？
        paths:
          - [7 × □ = 42 をさがす, 7 × 6 = 42, 6]
      - part: 思い出す
        text: 38 ÷ 5 のあまりはいくつですか。
        answer: 3
        check: "38 % 5"
        hints:
          - 5 の段の九九で、38 をこえない いちばん大きい答えはどれかな。
          - 38 から、その数をひこう。
          - あまりは、わる数の 5 より小さくなるよ。
        paths:
          - [5 × 7 = 35 で 38 をこえない, 38 − 35 = 3, 3]
      - part: 今日
        text: 4 の倍数を小さい順にならべると、4、8、12、…です。5 番目の数はいくつですか。
        answer: 20
        check: "4 * 5"
        hints:
          - 4 の倍数は、4 に 1、2、3…をかけた数だね。
          - 5 番目は、4 に何をかけた数かな。
          - 4 ずつたして、5 番目までならべてもよいよ。
        paths:
          - [5 番目は 4 × 5, 20]
          - [4、8、12、16 と 4 ずつたす, 5 番目は 20]
      - part: 今日
        text: 次のうち、6 の倍数はどれですか。
        choices: [26, 30, 34]
        answer: 30
        check: "[c for c in (26, 30, 34) if c % 6 == 0][0]"
        hints:
          - 6 の倍数は、6 でわり切れる数だよ。
          - 6 の段の九九を思い出そう。
          - 1 つずつ 6 でわって、あまりが出ないものをさがそう。
        paths:
          - [6 × 5 = 30, 26 と 34 は 6 でわるとあまりが出る, 30]
      - part: 今日
        text: 7 の倍数のうち、50 にいちばん近い数はいくつですか。
        answer: 49
        check: "min(range(7, 100, 7), key=lambda m: abs(m - 50))"
        hints:
          - 7 の倍数を、7 ずつならべてみよう。
          - 50 のすぐ前と、すぐ後の 7 の倍数はどれかな。
          - 50 からのちがいが小さいほうをえらぼう。
        paths:
          - [50 の前後の 7 の倍数は 49 と 56, ちがいは 1 と 6, 49]
        note: 50 より大きい倍数だけをさがして 56 としやすい。前と後の両方を見させる。
      - part: 挑戦
        text: 1 から 60 までの数のうち、7 の倍数は何こありますか。
        answer: 8
        check: "len([m for m in range(1, 61) if m % 7 == 0])"
        hints:
          - 7 の倍数を、小さい順にならべてみよう。
          - 60 をこえないのは、何番目までかな。
          - 60 ÷ 7 のわり算を使ってもよいよ。
        paths:
          - [7、14、21…56 とならべる, 63 は 60 をこえる, 8 こ]
          - [60 ÷ 7 = 8 あまり 4, 商の 8 が倍数の数, 8 こ]
        note: わり算の商が倍数の数になる。あまりの 4 は数えないことを確かめる。
