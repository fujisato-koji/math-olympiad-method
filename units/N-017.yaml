      - part: 挑戦
        text: 1 から 50 までの数のうち、約数の数が 2 でわり切れない数は何こありますか。
        answer: 7
        check: "len([x for x in range(1, 51) if len([d for d in range(1, x + 1) if x % d == 0]) % 2 == 1])"
        hints:
