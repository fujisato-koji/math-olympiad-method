      - 4 枚の数字の和によって、差が 0 になる場合と 11 になる場合がある。
      - 先頭に 0 を置けないことに注意して、選び方と並べ方を分けて数える。
    paths:
      - [使う 4 枚を選ぶ, 交互和の差が 0 か 11 になる並びを数える, 先頭 0 を除く, 全部で 20 個]
    note: 5 枚から 4 枚を選ぶので、使わない 1 枚の場合分けが必要。交互和の差は、数字の和の半分で決まる。

  - part: 離
    kinds: [総動員]
    uses: [C-006]
    text: 1 から 999 までの整数のうち、数字 1 をちょうど 1 回だけ含む整数は何個ありますか。
    answer: 243
    check: "len([n for n in range(1, 1000) if (n % 10 == 1) + (n // 10 % 10 == 1) + (n // 100 == 1) == 1])"
    hints:
      - 1 桁、2 桁、3 桁に分けて数えよう。
      - 1 桁は 1 だけ。2 桁は 17 個。
      - 3 桁は、1 が百の位・十の位・一の位のどれかで場合分けする。
    paths:
