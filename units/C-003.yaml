    text: でかける ときの ふくを きめます。うわぎは 👕 か 🧥、くつは 👟 👞 🥾 の どれかです。ぼうし 🧢 は かぶっても、かぶらなくても かまいません。でも、🧥 を きる ひは、ぼうしを かぶりません。でかける ときの かっこうは なんとおり ありますか。
