# C-003 表と樹形図で数える
#
# 段 2・水準 2・5 日。1 日目 樹形図で数える、2 日目 表で数える、3 日目 わけ、4 日目 C-002（書き出す）と混ぜる、5 日目 確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note、explain は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 前提は C-002、C-001、N-001 だけなので、数は 10 まで（カードの表で合わせて 8 まで）。
# 枝の数がそろうことには気づかせるが、かけ算（C-005 の積の法則）は使わない。
# 図の約束（D-129）：樹形図は左から右へ枝をのばす。黄色の丸と番号は数えた枝の先、色の帯は見るところ、点線の ？ はまだ決めていないところ。
# 表は左の列と上の行に見出し。しあいの表の灰色のますは使わないます（自分と自分など）、水色のますが使うます。カードの表は左が赤、上が青。
# かごは「えらぶ」（中の順は考えない）。check は itertools で組を作って数えるか、合わせて□になる組を数える。

