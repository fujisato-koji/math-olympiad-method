# C-003 表と樹形図で数える
#
# 書き方は N-001 の頭の注のとおり。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 樹形図で数える、2 日目 表で数える、3 日目 わけ、4 日目 C-002（書き出す）と混ぜる、5 日目 確認。
# 前提は C-002、C-001、N-001 だけなので、数は 10 まで、合わせる数は「いくつといくつ」の範囲（カードの表で合わせて 8 まで）。
# 枝の数がそろうことには気づかせるが、かけ算（C-005 の積の法則）は使わない。
# 樹形図は 1 本の枝を 1 行に書く（「🍞 ┬ 🥛」「　 └ 🧃」。行の右はしが枝の先）。
# 表は上の行と左の列に見出しを置き、ます（⬜ □）を並べる。⬛ は使わないます（自分と自分の試合など）。数の表は全角の数字。
# check は、図の中を数える n(c)、itertools.product で組を作って数える、合わせて□になる組を数える、のどれか。
# 足りない枝は、上の木の枝の先（各行の右はし）の集まりから、下の木の枝の先を除いて出す。

id: C-003
days:
  - day: 1
    items:
      - part: 思い出す
        text: 🍙🍞🍝 から 2 つ えらびます。えらびかたは なんとおり ありますか。
        answer: 3
        check: "len(set(itertools.combinations('🍙🍞🍝', 2)))"
        hints:
          - 🍙 が はいる えらびかたを さきに かこう。
          - つぎに 🍙 の ない えらびかたを かこう。
          - じゅんばんを かえた だけの ものは かかないよ。
        paths:
          - [🍙🍞 と 🍙🍝, 🍙 なしで 🍞🍝, 3 とおり]
      - part: 思い出す
        text: 🐻 と 🐼 と 🐨 が 1 れつに ならびます。ならびかたは なんとおり ありますか。
        answer: 6
        check: "len(set(itertools.permutations('🐻🐼🐨')))"
        hints:
          - ひだりに くる どうぶつを 1 ぴき きめよう。
          - のこりの 2 ひきの ならびかたを かこう。
          - ひだりが ちがう ときも、じゅんに かこう。
        paths:
          - [ひだりが 🐻、🐼、🐨 の ならびを 2 つずつ かく, 6 とおり]
      - part: 見本
        text: たべもの（🍞 か 🍙）を 1 つ、のみもの（🥛 か 🧃）を 1 つ えらびます。くみあわせを えだの ずに かこう。
        figure: "🍞 ┬ 🥛\n　 └ 🧃\n🍙 ┬ 🥛\n　 └ 🧃"
        explain: まず たべものを 1 つ えらび、そこから のみものの えだを のばします。🍞 から 2 ほん、🍙 から 2 ほん。えだの さきを かぞえると、くみあわせは 4 とおりです。この ような ずを「じゅけいず」と いいます。
      - part: 今日
        text: 🐶🐱🐰 の だれか 1 ぴきが、⚽ か 🎈 で あそびます。じゅけいずの えだの さきを かぞえて、くみあわせが なんとおりか こたえよう。
        figure: "🐶 ┬ ⚽\n　 └ 🎈\n🐱 ┬ ⚽\n　 └ 🎈\n🐰 ┬ ⚽\n　 └ 🎈"
        answer: 6
        check: "n('⚽') + n('🎈')"
        hints:
          - えだの さきは、ぎょうの みぎはしに あるよ。
          - 🐶 から のびる えだの さきを かぞえよう。
          - 🐱 と 🐰 の えだも つづけて かぞえよう。
        paths:
          - [🐶 の えだ 2 ほん, 🐱 の えだ 2 ほん, 🐰 の えだ 2 ほん, つづけて かぞえて 6 とおり]
        note: どうぶつの数（3）と答えやすい。数えるのは枝の先であることを確かめる。
      - part: 今日
        text: たべもの（🍞 か 🍙）と、のみもの（🥛 か 🧃 か 🍵）の じゅけいずです。□ に はいる のみものは どれですか。
        figure: "🍞 ┬ 🥛\n　 ├ 🧃\n　 └ 🍵\n🍙 ┬ 🥛\n　 ├ □\n　 └ 🍵"
        choices: [🥛, 🧃, 🍵]
        answer: 🧃
        check: "(set(l[-1] for l in fig.splitlines()[:3]) - set(l[-1] for l in fig.splitlines()[3:])).pop()"
        hints:
          - 🍞 から のびる えだには、なにが あるかな。
          - 🍙 から のびる えだにも、おなじ のみものが ならぶよ。
          - 🍙 の えだに まだ ない のみものは どれかな。
        paths:
          - [🍞 の えだは 🥛 🧃 🍵, 🍙 の えだには 🧃 が ない, 🧃]
      - part: 今日
        text: ぼうし（🧢 🎩 👒）を 1 つ、くつ（👟 👞 🥾）を 1 つ えらびます。じゅけいずを かいて、くみあわせが なんとおりか こたえよう。
        figure: "🧢🎩👒\n👟👞🥾"
        answer: 9
        check: "len(set(itertools.product(fig.splitlines()[0], fig.splitlines()[1])))"
        hints:
          - ひだりに ぼうしを 3 つ たてに かこう。
          - どの ぼうしからも、くつの えだを のばそう。
          - えだの さきを ぜんぶ かぞえよう。
        paths:
          - [ぼうしを たてに かく, どの ぼうしからも くつの えだを 3 ぼんずつ, えだの さきを かぞえて 9 とおり]
        note: 枝を 1 本ずつ書くと時間がかかるが、ここでは全部書いてよい。どのぼうしからも同じ数の枝が出ることに気づけば、ほめる。
      - part: 挑戦
        text: 3 にち つづけて、まいにち 🍎 か 🍌 を 1 つ たべます。たべかたは なんとおり ありますか。
        answer: 8
        check: "len(set(itertools.product('🍎🍌', repeat=3)))"
        hints:
          - 1 にちめの えだを かこう。🍎 と 🍌 だね。
          - その さきに、2 にちめの えだを のばそう。
          - さらに 3 にちめの えだを のばして、えだの さきを かぞえよう。
        paths:
          - [1 にちめ 🍎 か 🍌, 2 にちめの えだを のばす（4 ほんの さき）, 3 にちめの えだを のばす, えだの さきを かぞえて 8 とおり]
          - ["1 にち目は 2 通り", "2 にち目も 2 通りで 2 × 2 = 4", "3 にち目も 2 通りで 4 × 2 = 8", "8 とおり"]
        note: 2 日目までで止めて 4 と答えやすい。紙に大きく書かせる。
