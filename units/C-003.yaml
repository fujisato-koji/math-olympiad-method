# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 数]
    uses: [N-007]
    text: あかい カードが 3 まい（65、48、72）、あおい カードが 3 まい（26、45、30）あります。あかと あおから 1 まいずつ ひいて、2 まいの かずを たします。こたえが 100 より ちいさく なる ひきかたは なんとおり ありますか。
    answer: 6
    check: "sum(1 for a, b in itertools.product((65, 48, 72), (26, 45, 30)) if a + b < 100)"
    hints:
      - たてに あかの かず、よこに あおの かずを ならべた ひょうを かこう。
      - ひょうの ますに、2 まいの かずを たした こたえを かきこもう。
      - 100 より ちいさい ますに しるしを つけて かぞえよう。
    paths:
      - [ひょうの 9 ますに たした かずを かく, 65 の ならびは 91、100 を こえる、95, 48 の ならびは 74、93、78, 72 の ならびは 98、100 を こえる、100 を こえる, 100 より ちいさいのは 6 ます, 6 とおり]
    note: 表で数える（C-003）と、2 けたのたし算（N-007）を合わせる。くり上がりのある計算が 9 回続くので誤りやすい。72 + 30 のように 100 に近いものは、ていねいに確かめさせる。100 をこえるものは、こえると分かれば答えを出さなくてよい。
  - part: 離
    kinds: [道筋]
    text: あかい カード（1、2、3、4、5）と、あおい カード（1、2、3、4、5）から 1 まいずつ ひきます。2 まいの うち おおきい ほうの かずが 4 に なる ひきかたは なんとおり ありますか。2 まいが おなじ かずの ときは、その かずを おおきい ほうと します。
    answer: 7
    check: "sum(1 for a, b in itertools.product(range(1, 6), repeat=2) if max(a, b) == 4)"
    hints:
      - たてが あか、よこが あおの ひょうを かこう。
      - あかが 4 の ならびで、おおきい ほうが 4 に なる ますは どれかな。あおが 4 の ならびも みよう。
      - あかも あおも 4 の ますを、2 かい かぞえて いないかな。
    paths:
      - [あかが 4 で あおが 1、2、3、4 の 4 ます, あおが 4 で あかが 1、2、3 の 3 ます, あかも あおも 4 は 1 かいだけ かぞえる, 7 とおり]
    note: 表の中で、条件に合うますが L の字の形に並ぶことに気づくのが要点。行と列の両方で数えて 8 と答えやすい（4 と 4 のますを 2 回数えている）。
  - part: 離
    kinds: [読み取り, 手数]
    text: でかける ときの ふくを きめます。うわぎは 👕 か 🧥、くつは 👟 👞 🥾 の どれかです。ぼうし 🧢 は かぶっても、かぶらなくても かまいません。でも、🧥 を きる ひは、ぼうしを かぶりません。でかける ときの かっこうは なんとおり ありますか。
    answer: 9
    check: "sum(1 for u, k, h in itertools.product('👕🧥', '👟👞🥾', ('🧢', 'なし')) if not (u == '🧥' and h == '🧢'))"
    hints:
      - じゅけいずを、うわぎ、くつ、ぼうしの じゅんに のばそう。
      - ぼうしの えだは「🧢」と「かぶらない」の 2 ほん だよ。
      - 🧥 の えだの さきには、「かぶらない」の えだしか つかないよ。
    paths:
      - [👕 の ときは くつが 3 とおりで、それぞれ 🧢 と かぶらない の 2 ほん, えだの さきは 6, 🧥 の ときは くつが 3 とおりで、かぶらない だけ, えだの さきは 3, ぜんぶ かぞえて 9 とおり]
    note: 「かぶらない」も 1 つの選び方として枝にするのが要点。条件（🧥 の日はかぶらない）を読み落とすと 12、「かぶらない」を枝にしないと 6 になる。
