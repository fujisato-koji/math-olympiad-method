        note: リーダーとふくリーダーのように係に名前があるときは、だれがどの係かで別の決め方になる。順番をつけてならべるのと同じ。
      - part: 今日
        text: 5 人の中から、ボールを投げる係、受ける係、数える係を 1 人ずつ決めます。1 人がする係は 1 つだけです。決め方は何通りですか。
        answer: 60
        check: "len(set(itertools.permutations(range(5), 3)))"
        hints:
