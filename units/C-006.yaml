          - ["1 文字は 3 通り", "2 文字は 3 × 2 = 6 通り", "3 文字は 3 × 2 × 1 = 6 通り", "3 + 6 + 6 = 15 通り"]
        note: 文字の数で分けると重ならないので、和の法則（C-005）でたせる。分けた中は順列。
