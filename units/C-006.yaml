    text: 1 階だて、2 階だて、3 階だて、4 階だて、5 階だて、6 階だて、7 階だての 7 本のビルを、西から東へ 1 列にならべます。あるビルより西がわに、そのビルより高いビルが 1 本でもあると、そのビルはかくれて、西のはしからは見えません。たとえば、西から 2 階だて、4 階だて、1 階だて、3 階だてのじゅんにならんでいるとき、西から見えるのは 2 階だてと 4 階だての 2 本です（1 階だてと 3 階だては 4 階だてにかくれます）。東のはしから見るときも同じです。西から見て 3 本、東から見て 3 本のビルが見えるならべ方は、何通りですか。
    answer: 510
    check: sum(1 for p in itertools.permutations(range(1, 8)) if sum(1 for i in range(7) if p[i] == max(p[:i + 1])) == 3 and sum(1 for i in range(7) if p[i] == max(p[i:])) == 3)
    hints:
    - ビルが少ないとき（2 本、3 本）に、ならべ方を全部書き出して、西から見える本数を調べてみよう。
    - 見える本数に、いちばんかかわりのあるビルはどれかな。
    - 小さい場合の数え方を、ビルを 1 本ふやしたときにも使えないかな。
    paths:
    - - 7 階だてのビルに目をつける。7 階だてより高いビルはないので、7 階だては西からも東からも見える。7 階だてより西にあるビルは、東から見ると 7 階だてにかくれ、7 階だてより東にあるビルは、西から見ると 7 階だてにかくれる。また、西から見えるかどうかは、そのビルより西にあるビルだけで決まる。だから、西から見えるビルは「7 階だてと、7 階だてより西にあるビルのうち西から見えるもの」、東から見えるビルは「7 階だてと、7 階だてより東にあるビルのうち東から見えるもの」。西から 3 本、東から 3 本見えるのは、7 階だてより西のビルで 2 本が西から見え、7 階だてより東のビルで 2 本が東から見えるとき
      - 7 階だてより西に何本のビルがあるかで分ける。ビルは 6 本で、西がわでも東がわでも 2 本は見えなければならないので、どちらがわにも 2 本以上いる。西が 2 本、3 本、4 本のとき、東は 4 本、3 本、2 本。この 3 つの場合に分けて数える
      - まず、何本かのビルを 1 列にならべて、はしから 2 本だけ見えるならべ方を調べる。そのなかでいちばん高いビルは、はしから見え、それより後ろ（はしから遠いほう）のビルは、みなかくれる。それより手前（はしに近いほう）のビルは、1 本だけ見えればよい。手前のビルで 1 本だけ見えるのは、手前のビルのうちいちばん高いものが、いちばんはしにあるとき（それより後ろは、みなかくれる）。2 本なら、ひくいビルが手前、高いビルが後ろの 1 通り。3 本なら、いちばん高いビルは、はしから 2 番目か 3 番目。2 番目のとき、手前の 1 本のえらび方が 2 通りで、後ろの 1 本は決まるから 2 通り。3 番目のとき、手前の 2 本は、高いほうがはしがわの 1 通り。合わせて 2 + 1 = 3 通り
      - 4 本のとき、いちばん高いビルの場所で分ける（はしから 1 番目だと見えるのは 1 本だけなので数えない）。2 番目：手前の 1 本は、のこりの 3 本からえらんで 3 通り、後ろの 2 本のならべ方が 2 通りだから、3 × 2 = 6 通り。3 番目：手前の 2 本のえらび方が 3 通り、手前の 2 本は高いほうがはしがわの 1 通り、後ろの 1 本は決まるから 3 通り。4 番目：手前の 3 本は、いちばん高いものがはしがわで、のこり 2 本のならべ方が 2 通りだから 2 通り。合わせて 6 + 3 + 2 = 11 通り
      - 西が 2 本の場合：西や東にどのビルをえらんでも、見え方はビルの高さのじゅん番だけで決まるので、ならべ方の数は 3 段目、4 段目と同じ（2 本なら 1 通り、3 本なら 3 通り、4 本なら 11 通り）。6 本から西の 2 本をじゅんにえらぶと 6 × 5 = 30 通りで、同じ 2 本が 2 通りのじゅんで数えられているから、2 × 15 = 30 より 30 ÷ 2 = 15 通り。西の 2 本のならべ方は 1 通り、東の 4 本のならべ方は 11 通りだから、15 × 1 × 11 = 15 × 10 + 15 = 165 通り。西が 3 本の場合：えらび方は、3 本をじゅんにえらぶと 6 × 5 × 4 = 120 通りで、同じ 3 本が 3 × 2 × 1 = 6 通りのじゅんで数えられているから、6 × 20 = 120 より 120 ÷ 6 = 20 通り。ならべ方は西が 3 通り、東が 3 通りだから、20 × 3 × 3 = 180 通り。西が 4 本の場合：えらび方は 15 通り、西の 4 本のならべ方が 11 通り、東の 2 本のならべ方が 1 通りだから、15 × 11 × 1 = 165 通り。合わせて 165 + 180 + 165 = 510 通り
    - - 7 階だてのビルをおいて、そこへ 6 階だて、5 階だて、4 階だて、3 階だて、2 階だて、1 階だてのじゅんに、1 本ずつ列に入れていく。どの場所に入れるかを決めていくと、ならべ方が 1 つ決まる。反対に、ならべ方が 1 つあれば、そこから 1 階だて、2 階だて、3 階だて、…のじゅんにビルをぬいていくことで、どの場所に入れたかが 1 通りに決まる。だから、ならべ方の数と入れ方の数は同じ
      - 入れるビルは、いま列にあるどのビルよりもひくい。ひくいビルは高いビルをかくさないので、入れても、いままであったビルの見え方はかわらないし、あとから入れるビルは、もっとひくいので、入れたビルの見え方もこの先かわらない。西のはしに入れたビルは、西には高いビルがないので西から見え、東には高いビルがあるので東から見えない。東のはしに入れたビルは、東からだけ見える。ビルとビルの間（内がわ）に入れると、西にも東にも高いビルがあるので、どちらからも見えない
      - 1 本入れるごとの、入れる場所の数を調べる。列にビルが 1 本のとき（6 階だてを入れる）、場所は西のはしと東のはしの 2 か所で、間はない。ビルが 2 本のとき（5 階だて）は、はし 2 か所と間 1 か所の 3 か所。ビルが 3 本、4 本、5 本、6 本のとき（4 階だて、3 階だて、2 階だて、1 階だて）は、場所が 4、5、6、7 か所で、そのうち間は 2、3、4、5 か所。まとめると、6 階だて、5 階だて、4 階だて、3 階だて、2 階だて、1 階だてを入れるときの、間に入れる場所の数は 0、1、2、3、4、5 か所で、はしに入れる場所は、どのときも西と東の 2 か所
      - 7 階だては西からも東からも見えるので、西から 3 本、東から 3 本見えるのは、西のはしに入れたビルが 2 本、東のはしに入れたビルが 2 本のとき。6 回の入れ方のうち、西のはし 2 回、東のはし 2 回、間 2 回となる。6 階だては間に入れる場所がないので、間に入れる 2 回は、5 階だて、4 階だて、3 階だて、2 階だて、1 階だての 5 本から 2 本をえらぶ。えらんだ 2 本の、間に入れる場所の数（1、2、3、4、5 か所のうちの 2 つ）をかけると、その入れ方の数になる。1 × 2、1 × 3、1 × 4、1 × 5 をたして 2 + 3 + 4 + 5 = 14、2 × 3、2 × 4、2 × 5 をたして 6 + 8 + 10 = 24、3 × 4、3 × 5 をたして 12 + 15 = 27、4 × 5 = 20。全部たすと 14 + 24 + 27 + 20 = 85 通り
      - のこりの 4 回は、はしに入れる。そのうち西のはしに 2 回、東のはしに 2 回で、4 回のうち西のはしの 2 回をえらぶえらび方は、4 × 3 = 12、12 ÷ 2 = 6 通り。はしに入れる回は、西か東かが決まれば、場所は 1 か所に決まる。間に入れる 2 回と場所の決め方の 85 通りは、はしの回の分け方の 6 通りとは関係なく決まるので、かけて 6 × 85 = 6 × 80 + 6 × 5 = 480 + 30 = 510 通り。入れ方とならべ方は 1 つずつ組になっているので、ならべ方も 510 通り
    note: 考えどころは 3 つ：①いちばん高い 7 階だてのビルは西からも東からも見え、7 階だてより西のビルは東から見えず、7 階だてより東のビルは西から見えない。だから 7 階だてで列を西と東に分けると、西がわと東がわはべつべつの問題になる、②西がわで「西から 2 本見える」ならべ方を、同じ見方（そのなかでいちばん高いビルの場所で分ける）をくり返して数える（2 本なら 1 通り、3 本なら 3 通り、4 本なら 11 通り）、③西にくるビルのえらび方（6 本から 2 本、3 本、4 本で 15、20、15 通り）と、西と東のならべ方をかけて足す（15 × 1 × 11 + 20 × 3 × 3 + 15 × 11 × 1 = 510）。2 本目は、列を分けずに、高いほうから 1 本ずつ入れていく手順と、ならべ方を 1 つずつ組にする。あとから入れるビルは、前にあるどのビルよりひくいので、はしに入れたときだけ見え、間に入れると見えないことから、6 回の入れ方のうち西のはし 2 回、東のはし 2 回、間 2 回になる。間に入れる場所の数（1〜5）のうち 2 つのかけ算をたして 85 通り、はしの 4 回から西の 2 回をえらぶのが 6 通りで、6 × 85 = 510。1 本目は、いちばん高いビルで列を分けて小さい問題にし、2 本目は分けずに、入れる手順で数える。check は、7 本のならべ方 5040 通りを全部作り、西から見える本数と東から見える本数を数えて、どちらも 3 本のものを数える式。既出・出どころ：高いビルのパズル（スカイスクレイパー）のならべ方の数え上げ（左右から見える本数ごとの数は Khovanova、Lewis「Skyscraper Numbers」、Journal of Integer Sequences、2013 年にある）。かたがわだけなら「だい 1 しゅのスターリング数」（4 本で 2 本見えるのが 11 通り）。大会の同じ問いは見つけていない。プログラミングのコンテストには、左から何本、右から何本見えるならべ方の数を問う同じ形の問いがあり、知られた式で 85 × 6 = 510 となる。2 本目はその式の出し方にあたる。わな：7 階だても西から見える 3 本の 1 本に入るのをわすれて、7 階だての西がわで 3 本、東がわで 3 本と読む。間に 6 階だてを入れられると数える（6 階だては、両はしにしか入れられない）。西のはしに入れたビルが、東から見えないことを見のがす。
