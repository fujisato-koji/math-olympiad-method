      - part: 見本
        text: ア、イ、ウの 3 人が 1 列にならびます。ならび方は何通りですか。
        figure: "ア ┬ イ ─ ウ\n　 └ ウ ─ イ\nイ ┬ ア ─ ウ\n　 └ ウ ─ ア\nウ ┬ ア ─ イ\n　 └ イ ─ ア"
