        id: "169521d9db"
        text: 定積分 ∫(0→1) x(1 − x)⁵ dx の値はいくつですか。
        answer: 1/42
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: x * (1 - x)**5, 0, 1, 200)).limit_denominator(100)"
        hints:
          - text: x を微分する側、(1 − x)⁵ を積分する側にして、部分積分しましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="85" y="22" font-size="14" text-anchor="middle" fill="#c98512" font-weight="bold">微分する</text><text x="235" y="22" font-size="14" text-anchor="middle" fill="#2f7fc1" font-weight="bold">積分する</text><rect x="30" y="32" width="110" height="36" rx="8" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><text x="85" y="56" font-size="15" text-anchor="middle" fill="currentColor">f = x</text><rect x="180" y="32" width="110" height="36" rx="8" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><text x="235" y="56" font-size="15" text-anchor="middle" fill="currentColor">g′ = (1 − x)⁵</text><rect x="30" y="98" width="110" height="36" rx="8" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><text x="85" y="122" font-size="15" text-anchor="middle" fill="currentColor">f′ = 1</text><rect x="180" y="98" width="110" height="36" rx="8" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="235" y="122" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">g = ?</text><line x1="85" y1="71" x2="85" y2="88" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="85,95 88.8,88 81.2,88" fill="#c98512" stroke="none"/><line x1="235" y1="71" x2="235" y2="88" stroke="#2f7fc1" stroke-width="2" stroke-linecap="round"/><polygon points="235,95 238.8,88 231.2,88" fill="#2f7fc1" stroke="none"/><line x1="136" y1="64" x2="179.8" y2="99" stroke="#d0504a" stroke-width="2.2" stroke-linecap="round"/><polygon points="186,104 182.5,95.6 177,102.4" fill="#d0504a" stroke="none"/><path d="M85.0 136 L85.0 148 L235.0 148 L235.0 136" fill="none" stroke="#7b5fb5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="164" font-size="12" text-anchor="middle" fill="#7b5fb5">この組は かけて 積分して ひく</text><text x="160" y="192" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold"><tspan fill="currentColor">∫ f g′ dx = </tspan><tspan fill="#d0504a">f g</tspan><tspan fill="currentColor"> − </tspan><tspan fill="#7b5fb5">∫ f′ g dx</tspan></text></svg>'
