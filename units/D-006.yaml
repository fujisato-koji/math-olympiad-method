      - part: わけ
        id: "4ff151f971"
        text: F(x) を f(x) の原始関数とします。置換積分の式 ∫ f(g(x))g′(x) dx = F(g(x)) + C が成り立つわけを、すじみちを立てて書きましょう。
        explain: 例：「F′(x) = f(x) とする。合成関数の微分（D-005）から、{F(g(x))}′ = F′(g(x)) × g′(x) = f(g(x))g′(x) である。つまり F(g(x)) は f(g(x))g′(x) の原始関数である。原始関数どうしの差は定数なので（D-005）、f(g(x))g′(x) の原始関数はすべて F(g(x)) + C の形に書け、∫ f(g(x))g′(x) dx = F(g(x)) + C である。」と書ければよい。①「〜とする」で F′(x) = f(x) を決める、②合成関数の微分で {F(g(x))}′ を計算する、③約束した事実（不定積分の意味、原始関数どうしの差は定数）で結ぶ、の 3 つがそろっているかを見る。定積分では、x = a から b までの差をとると ∫(a→b) f(g(x))g′(x) dx = F(g(b)) − F(g(a)) = ∫(g(a)→g(b)) f(u) du となり、端を u の値に置きかえてよいわけも同じすじみちで言える。∫ x(x² + 1)³ dx のような例を微分して確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。
        hints:
          - F′(x) = f(x) から書き始めましょう。
          - text: F(g(x)) を、合成関数の微分の公式で微分しましょう。外の F の微分と、中の g の微分をかけます。
            svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">x から F(g(x)) までの 2 つのしかけ</text><text x="22" y="64" font-size="18" text-anchor="middle" fill="currentColor" font-style="italic">x</text><line x1="32" y1="58" x2="53" y2="58" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="60,58 53,54.1 53,61.9" fill="currentColor" stroke="none"/><rect x="62" y="42" width="34" height="32" rx="8" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="79" y="64.1" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">g</text><line x1="98" y1="58" x2="117" y2="58" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="124,58 117,54.1 117,61.9" fill="currentColor" stroke="none"/><text x="162" y="64" font-size="16" text-anchor="middle" fill="currentColor">u = g(x)</text><line x1="200" y1="58" x2="219" y2="58" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="226,58 219,54.1 219,61.9" fill="currentColor" stroke="none"/><rect x="228" y="42" width="34" height="32" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="245" y="64.1" font-size="17" text-anchor="middle" fill="currentColor" font-weight="bold">F</text><line x1="264" y1="58" x2="277" y2="58" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><polygon points="284,58 277,54.1 277,61.9" fill="currentColor" stroke="none"/><text x="303" y="64" font-size="16" text-anchor="middle" fill="currentColor">F(u)</text><text x="79" y="96" font-size="12" text-anchor="middle" fill="#2f7fc1">微分すると</text><text x="79" y="114" font-size="14" text-anchor="middle" fill="#2f7fc1" font-weight="bold">× g′(x)</text><text x="245" y="96" font-size="12" text-anchor="middle" fill="#c98512">微分すると</text><text x="245" y="114" font-size="14" text-anchor="middle" fill="#c98512" font-weight="bold">× F′(u)</text><text x="245" y="132" font-size="12" text-anchor="middle" fill="#c98512">（F′ = f）</text><text x="160" y="158" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold"><tspan fill="currentColor">{F(g(x))}′ = </tspan><tspan fill="#c98512">（外の微分）</tspan><tspan fill="currentColor"> × </tspan><tspan fill="#2f7fc1">（中の微分）</tspan></text></svg>'
          - 微分した結果が左辺の ∫ の中の式と同じなら、F(g(x)) は何といえるでしょう。
