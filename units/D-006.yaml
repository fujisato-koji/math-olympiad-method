    paths:
      - ["\"交点は y + y² = 2 から y = 1 で (1, 1) と (−1, 1)\"", "∫(−1→1) √(2 − x²) dx は 中心角 π/2 のおうぎ形 π/2 と 三角形 2 つ分 1 の和", "∫(−1→1) x² dx = 2/3", "π/2 + 1 − 2/3 = π/2 + 1/3"]
      - [x = √2 sin θ と置換する, ∫(−π/4→π/4) 2cos²θ dθ = π/2 + 1, π/2 + 1 − 2/3 = π/2 + 1/3]
    note: 円の方程式と交点（G-026）、おうぎ形の面積（G-010）、定積分を合わせる。√(2 − x²) を置換積分（4 日目）で計算してもよいが、図形に分けると手数が少ない。おうぎ形の中心角（交点 (1, 1) は 45° の向き）と、おうぎ形の外にある 2 つの三角形を見落としやすい。
  - part: 離
    id: "5d14525802"
    kinds: [道筋]
    text: 定積分 ∫(0→π/2) (3 sin x + cos x)/(sin x + cos x) dx の値はどれですか。
    choices: [π, 3π/4, π/2, 2]
    answer: π
    check: "[c for c, v in {'π': math.pi, '3π/4': 3 * math.pi / 4, 'π/2': math.pi / 2, '2': 2}.items() if abs(v - (lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: (3 * math.sin(x) + math.cos(x)) / (math.sin(x) + math.cos(x)), 0, math.pi / 2, 200)) < 1e-6][0]"
    hints:
      - この関数の原始関数は、この単元の道具では求められないよ。原始関数を使わずに値を出す道を考えよう。
      - text: x = π/2 − t と置換すると、sin x と cos x が入れかわるね（G-025）。図の 2 つのグラフは、x = π/4 で折り返すと重なるよ。
