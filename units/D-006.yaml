        explain: 例：「h > 0 とする。S(t + h) − S(t) は、x = t から x = t + h までの細い部分の面積である。f(x) は増える関数なので、この部分は、横が h で高さが f(t) の長方形をふくみ、高さが f(t + h) の長方形にふくまれる。よって f(t)h ≦ S(t + h) − S(t) ≦ f(t + h)h で、面積を幅 h でわった (S(t + h) − S(t))/h（細い部分の平均の高さ）は、f(t) と f(t + h) の間にある。h → 0 とすると f(t + h) → f(t)（f は連続、D-003）なので、はさみうちの原理（D-003）から (S(t + h) − S(t))/h → f(t) である。h < 0 のときも、t + h から t までの部分で同じように言える。よって S′(t) = f(t)、つまり S(t) は f(t) の原始関数である。原始関数どうしの差は定数なので（D-005）、S(t) = F(t) + C と書ける。S(a) = 0 なので C = −F(a) で、a から b までの面積は S(b) = F(b) − F(a) = ∫(a→b) f(x) dx である。」と書ければよい。①「〜とする」で h と S(t) を決める、②細い部分を 2 つの長方形ではさみ、幅 h でわる、③約束した事実（連続、はさみうちの原理、原始関数どうしの差は定数）で結ぶ、④結論（面積 = F(b) − F(a)）、がそろっているかを見る。3 日目から先に使ってきた「面積は定積分で求められる」のわけがこれで示せる。定積分を F(b) − F(a) と決めたこと（2 日目）と、面積という図形の量が、ここで初めてつながる。f が増える関数でないときも、細い部分での f のいちばん小さい値と大きい値ではさめば、同じ筋道で言える。グラフをいくつか描いて確かめただけで終わっていたら、例ではすべての関数を示せないことを話す。
        hints:
          - h > 0 とし、S(t + h) − S(t) が図のどの部分の面積かを考えましょう。
          - その部分を、高さ f(t) の長方形と高さ f(t + h) の長方形ではさみましょう。
          - 幅 h でわってから h → 0 とし、はさみうちの原理（D-003）を使いましょう。最後に S(a) = 0 を使います。
        paths:
          - [h > 0 とし、S(t + h) − S(t) は幅 h の細い部分の面積, f(t)h ≦ S(t + h) − S(t) ≦ f(t + h)h, 幅 h でわって h → 0 とすると、はさみうちで S′(t) = f(t), S(t) = F(t) + C と S(a) = 0 から S(b) = F(b) − F(a)]
      - part: わけ
        text: F(x) を f(x) の原始関数とします。置換積分の式 ∫ f(g(x))g′(x) dx = F(g(x)) + C が成り立つわけを、筋道を立てて書きましょう。
        explain: 例：「F′(x) = f(x) とする。合成関数の微分（D-005）から、{F(g(x))}′ = F′(g(x)) × g′(x) = f(g(x))g′(x) である。つまり F(g(x)) は f(g(x))g′(x) の原始関数である。原始関数どうしの差は定数なので（D-005）、f(g(x))g′(x) の原始関数はすべて F(g(x)) + C の形に書け、∫ f(g(x))g′(x) dx = F(g(x)) + C である。」と書ければよい。①「〜とする」で F′(x) = f(x) を決める、②合成関数の微分で {F(g(x))}′ を計算する、③約束した事実（不定積分の意味、原始関数どうしの差は定数）で結ぶ、の 3 つがそろっているかを見る。定積分では、x = a から b までの差をとると ∫(a→b) f(g(x))g′(x) dx = F(g(b)) − F(g(a)) = ∫(g(a)→g(b)) f(u) du となり、端を u の値に置きかえてよいわけも同じ筋道で言える。∫ x(x² + 1)³ dx のような例を微分して確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。
        hints:
          - F′(x) = f(x) から書き始めましょう。
          - F(g(x)) を、合成関数の微分の公式で微分しましょう。
          - 微分した結果が左辺の ∫ の中の式と同じなら、F(g(x)) は何といえるでしょう。
        paths:
          - [F′(x) = f(x) とする, "{F(g(x))}′ = F′(g(x))g′(x) = f(g(x))g′(x)", F(g(x)) は f(g(x))g′(x) の原始関数, ∫ f(g(x))g′(x) dx = F(g(x)) + C]
      - part: わけ
        text: 部分積分の式 ∫ f(x)g′(x) dx = f(x)g(x) − ∫ f′(x)g(x) dx が成り立つわけを、筋道を立てて書きましょう。
        explain: 例：「f(x)、g(x) は微分できる関数とする。積の微分（D-005）から {f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x) で、移項すると f(x)g′(x) = {f(x)g(x)}′ − f′(x)g(x) である。両辺の不定積分を考える。{f(x)g(x)}′ の原始関数の 1 つは f(x)g(x) で、差の不定積分は不定積分の差なので、∫ f(x)g′(x) dx = f(x)g(x) − ∫ f′(x)g(x) dx である（積分定数は右辺の ∫ にふくめる）。」と書ければよい。①「〜とする」で f(x)、g(x) を決める、②積の微分の式を移項して変形する、③約束した事実（不定積分の意味、和と差の不定積分の性質）で結ぶ、の 3 つがそろっているかを見る。定積分では [f(x)g(x)](a→b) − ∫(a→b) f′(x)g(x) dx になることにも触れる。x cos x のような例を微分して確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。
        hints:
          - 積の微分の公式 {f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x) を書きましょう。
          - f(x)g′(x) だけが左辺に残るように移項しましょう。
          - 両辺を積分すると、{f(x)g(x)}′ の積分はどうなるでしょう。
        paths:
          - ["{f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x)", "f(x)g′(x) = {f(x)g(x)}′ − f′(x)g(x)", 両辺の不定積分を考える, ∫ f(x)g′(x) dx = f(x)g(x) − ∫ f′(x)g(x) dx]
