    choices: [π/2 + 1/3, π/2 − 1/3, π + 1/3, π/4 + 1/3]
    answer: π/2 + 1/3
    check: "[c for c, v in {'π/2 + 1/3': math.pi / 2 + 1 / 3, 'π/2 − 1/3': math.pi / 2 - 1 / 3, 'π + 1/3': math.pi + 1 / 3, 'π/4 + 1/3': math.pi / 4 + 1 / 3}.items() if abs(v - (lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: math.sqrt(2 - x * x) - x * x, -1, 1, 200)) < 1e-6][0]"
    hints:
      - まず、円と放物線の交点を求めよう。x² = y を円の式に入れると、y の 2 次方程式になるね。
      - 求める面積は ∫(−1→1) (√(2 − x²) − x²) dx だね。√(2 − x²) の部分は、円の一部の面積と見てみよう。
      - text: 原点と 2 つの交点を結ぶと、√(2 − x²) の下の部分は、おうぎ形と 2 つの直角三角形に分けられるよ（G-010）。
