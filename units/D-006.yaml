          - 交点の間の定積分を計算して、符号を変えましょう。
        paths:
          - [x² − x − 2 = (x + 1)(x − 2) で x = −1、2, S = −∫(−1→2) (x² − x − 2) dx, "−[(1/3)x³ − (1/2)x² − 2x](−1→2)", −(−10/3 − 7/6) = 9/2]
        note: 定積分の値 −9/2 をそのまま答えにしやすい。面積はいつも正の数。
