        id: "4672be8b22"
        text: 部分積分の式 ∫ f(x)g′(x) dx = f(x)g(x) − ∫ f′(x)g(x) dx が成り立つわけを、すじみちを立てて書きましょう。
        explain: 例：「f(x)、g(x) は微分できる関数とする。積の微分（D-005）から {f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x) で、移項すると f(x)g′(x) = {f(x)g(x)}′ − f′(x)g(x) である。両辺の不定積分を考える。{f(x)g(x)}′ の原始関数の 1 つは f(x)g(x) で、差の不定積分は不定積分の差なので、∫ f(x)g′(x) dx = f(x)g(x) − ∫ f′(x)g(x) dx である（積分定数は右辺の ∫ にふくめる）。」と書ければよい。①「〜とする」で f(x)、g(x) を決める、②積の微分の式を移項して変形する、③約束した事実（不定積分の意味、和と差の不定積分の性質）で結ぶ、の 3 つがそろっているかを見る。定積分では [f(x)g(x)](a→b) − ∫(a→b) f′(x)g(x) dx になることにもふれる。x cos x のような例を微分して確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。
        hints:
          - text: 積の微分の公式 {f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x) を書きましょう。たて f、横 g の長方形の面積 fg のふえ方と同じです。
            svg: '<svg viewBox="0 0 320 192" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">たて f、横 g の長方形の面積 f g のふえ方</text><rect x="60" y="66" width="140" height="102" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.8"/><rect x="200" y="66" width="32" height="102" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.4"/><rect x="60" y="40" width="140" height="26" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="1.4"/><rect x="200" y="40" width="32" height="26" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><text x="130" y="123" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">f g</text><text x="130" y="58" font-size="12" text-anchor="middle" fill="currentColor">g ×（f のふえた分）</text><text x="238" y="112" font-size="13" text-anchor="start" fill="currentColor">f ×</text><text x="238" y="130" font-size="13" text-anchor="start" fill="currentColor">（g の</text><text x="238" y="148" font-size="13" text-anchor="start" fill="currentColor">ふえた分）</text><text x="52" y="122" font-size="16" text-anchor="end" fill="currentColor" font-style="italic">f</text><text x="130" y="186" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">g</text></svg>'
          - f(x)g′(x) だけが左辺に残るように移項しましょう。
          - 両辺を積分すると、{f(x)g(x)}′ の積分はどうなるでしょう。
