        paths:
          - [x² − 2x = 4x − x² から 2x² − 6x = 0 で x = 0、3, S = ∫(0→3) (6x − 2x²) dx, "[3x² − (2/3)x³](0→3) = 27 − 18 = 9"]
          - [上の式 − 下の式 = −2x(x − 3), (1/6) の公式で 2 × (1/6) × 3³ = 9]
      - part: わけ
        id: "82235c607b"
        text: 関数 f(x) は連続で、いつも f(x) > 0 で、x が増えると f(x) も増えるとします。曲線 y = f(x) と x 軸、2 直線 x = a、x = t（t > a）で囲まれた部分の面積を S(t) と書きます。S′(t) = f(t) となること、そして a から b までの面積が F(b) − F(a)（F(x) は f(x) の原始関数）になることを、すじみちを立てて書きましょう。
