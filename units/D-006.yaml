      - part: 見本
        id: "305475f11b"
        text: 定積分 ∫(1→3) (x² − 1) dx は、原始関数 F(x) = (1/3)x³ − x の、上の端 3 での値から下の端 1 での値をひいた数 F(3) − F(1) です（図）。三角関数などは、微分の公式を逆に読んで積分します（∫ sin x dx = −cos x + C、∫ cos x dx = sin x + C、∫ 1/x² dx = −1/x + C）。
        svg: '<svg viewBox="0 0 320 206" xmlns="http://www.w3.org/2000/svg"><text x="100" y="86" font-size="58" text-anchor="middle" fill="currentColor">∫</text><text x="118" y="42" font-size="19" text-anchor="middle" fill="#2f7fc1" font-weight="bold">3</text><text x="108" y="100" font-size="19" text-anchor="middle" fill="#c98512" font-weight="bold">1</text><text x="130" y="74" font-size="20" text-anchor="start" fill="currentColor">(x² − 1) dx</text><text x="40" y="44" font-size="14" text-anchor="middle" fill="#2f7fc1" font-weight="bold">上の端</text><line x1="64" y1="40" x2="99" y2="38.3" stroke="#2f7fc1" stroke-width="1.8" stroke-linecap="round"/><polygon points="106,38 98.8,34.5 99.2,42.2" fill="#2f7fc1" stroke="none"/><text x="40" y="100" font-size="14" text-anchor="middle" fill="#c98512" font-weight="bold">下の端</text><line x1="64" y1="96" x2="89" y2="96" stroke="#c98512" stroke-width="1.8" stroke-linecap="round"/><polygon points="96,96 89,92.2 89,99.8" fill="#c98512" stroke="none"/><text x="14" y="126" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">F(x) = (1/3)x³ − x</text><rect x="14" y="136" width="196" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="82" y="136" width="64" height="60" fill="#f3c969" fill-opacity="0.25" stroke="none"/><rect x="146" y="136" width="64" height="60" fill="#7fc8f8" fill-opacity="0.25" stroke="none"/><line x1="14" y1="166" x2="210" y2="166" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="82" y1="136" x2="82" y2="196" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="146" y1="136" x2="146" y2="196" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><text x="48" y="157" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">x</text><text x="48" y="187" font-size="15" text-anchor="middle" fill="currentColor">F(x)</text><text x="114" y="157" font-size="16" text-anchor="middle" fill="#c98512" font-weight="bold">1</text><text x="178" y="157" font-size="16" text-anchor="middle" fill="#2f7fc1" font-weight="bold">3</text><text x="114" y="187" font-size="15" text-anchor="middle" fill="currentColor">−2/3</text><text x="178" y="187" font-size="16" text-anchor="middle" fill="currentColor">6</text><text x="266" y="162" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold"><tspan fill="#2f7fc1">6</tspan><tspan fill="currentColor"> − (</tspan><tspan fill="#c98512">−2/3</tspan><tspan fill="currentColor">)</tspan></text><text x="266" y="188" font-size="16" text-anchor="middle" fill="#d0504a" font-weight="bold">= 20/3</text></svg>'
        explain: f(x) の原始関数の 1 つを F(x) とするとき、F(b) − F(a) を、f(x) の a から b までの定積分といい、∫(a→b) f(x) dx と書きます（a を ∫ の右下に、b を右上に小さく書きます。画面でも、∫ の右に下と上を小さく組みます）。F(b) − F(a) は [F(x)](a→b) とも書きます。原始関数に定数を足しても (F(b) + C) − (F(a) + C) = F(b) − F(a) なので、定積分の値は原始関数の選び方によりません。∫(1→3) (x² − 1) dx = [(1/3)x³ − x](1→3) = (9 − 3) − (1/3 − 1) = 6 + 2/3 = 20/3 です。定積分には次の性質があります。∫(a→a) f(x) dx = 0、∫(b→a) f(x) dx = −∫(a→b) f(x) dx、∫(a→c) f(x) dx + ∫(c→b) f(x) dx = ∫(a→b) f(x) dx、定数倍と和は不定積分と同じ（どれも F(b) − F(a) の形から言えます）。三角関数などの不定積分も、微分の公式（D-005）を逆に読んで求めます。∫ sin x dx = −cos x + C、∫ cos x dx = sin x + C、∫ 1/cos²x dx = tan x + C です。また、(1/x)′ = −1/x² から ∫ 1/x² dx = −1/x + C、(x√x)′ = √x + x × 1/(2√x) = (3/2)√x から ∫ √x dx = (2/3)x√x + C、(√x)′ = 1/(2√x) から ∫ 1/√x dx = 2√x + C です。∫ 1/x dx は、対数関数を学んでから あつかいます。
