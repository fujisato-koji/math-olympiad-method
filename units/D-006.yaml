            <text x="33.0" y="43.2" font-size="13" text-anchor="start"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">x</tspan>²</text>
            <text x="27.6" y="177.6" font-size="13" text-anchor="start"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">x</tspan> + 6</text>
          </svg>
        answer: 125/6
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: x + 6 - x**2, -2, 3, 200)).limit_denominator(100)"
        hints:
          - 交点の x 座標は、思い出すの問題で求めました。
          - 交点の間で、どちらが上にあるかを図で確かめましょう。
          - ∫ (上の式 − 下の式) dx を計算しましょう。
        paths:
          - [交点の x 座標は −2 と 3, S = ∫(−2→3) (x + 6 − x²) dx, "[(1/2)x² + 6x − (1/3)x³](−2→3)", 27/2 − (−22/3) = 125/6]
        note: 下の式から上の式をひくと、符号が逆になる。x = −2 を代入するときの符号にも気をつける。
      - part: 挑戦
        text: α < β のとき、∫(α→β) (x − α)(x − β) dx = k(β − α)³ と表せます。k はいくつですか。
        answer: −1/6
        check: "(lambda r: (lambda v: f'−{-v}' if v < 0 else f'{v}')(r[0]) if len(r) == 1 else 'ちがう')(sorted(set(Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: (x - p) * (x - q), p, q, 200) / (q - p)**3).limit_denominator(100) for p, q in ((1, 4), (-2, 3), (0.5, 2)))))"
        hints:
          - x − β = (x − α) − (β − α) と書きなおしてみましょう。
          - (1/3)(x − α)³ を微分すると (x − α)² になります（合成関数の微分）。
          - x = α を代入すると、x − α をふくむ項はすべて 0 になります。
        paths:
          - [(x − α)(x − β) = (x − α)² − (β − α)(x − α), "[(1/3)(x − α)³ − (1/2)(β − α)(x − α)²](α→β)", (1/3)(β − α)³ − (1/2)(β − α)³, k = −1/6]
        note: 展開して α、β の式のまま計算すると手数が多い。x − α のかたまりで考えるのが要点。放物線と直線で囲まれた面積は (1/6)(β − α)³（x² の係数が 1 のとき）で求められるようになる。
