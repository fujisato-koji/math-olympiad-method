        explain: F′(x) = f(x) のとき、合成関数の微分（D-005）から {F(ax + b)}′ = aF′(ax + b) = af(ax + b) なので、∫ f(ax + b) dx = (1/a)F(ax + b) + C です（a は 0 でない数）。∫ (2x + 1)⁴ dx は、u⁴ の原始関数 (1/5)u⁵ を使って (1/2) × (1/5)(2x + 1)⁵ + C = (1/10)(2x + 1)⁵ + C です。微分すると (1/10) × 5(2x + 1)⁴ × 2 = (2x + 1)⁴ にもどります。もっと広く、u = g(x) とおくと ∫ f(g(x))g′(x) dx = ∫ f(u) du = F(g(x)) + C です。これを置換積分法といいます（わけは 6 日目）。du/dx = g′(x) を du = g′(x) dx と書いて、dx をふくむ部分を du に置きかえると覚えます。x(x² + 1)³ では、u = x² + 1 とおくと du = 2x dx なので、x dx = (1/2) du です。定積分では、x の端を u の端に置きかえます。x = 0 のとき u = 1、x = 1 のとき u = 2 なので、∫(0→1) x(x² + 1)³ dx = ∫(1→2) (1/2)u³ du = [(1/8)u⁴](1→2) = (1/8)(16 − 1) = 15/8 です。また、x = sin θ のように、x を別の文字の式で置きかえることもできます。そのときは dx = cos θ dθ とし、端も θ の値に置きかえます。
