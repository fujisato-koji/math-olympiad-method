        id: "8fef7a225e"
        text: ∫ x cos x dx は、x を微分する側、cos x を積分する側にして表にします。赤いななめの組をかけた x sin x から、むらさきの組をかけて積分した ∫ 1 × sin x dx をひくと、x sin x + cos x + C です（部分積分）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="85" y="22" font-size="14" text-anchor="middle" fill="#c98512" font-weight="bold">微分する</text><text x="235" y="22" font-size="14" text-anchor="middle" fill="#2f7fc1" font-weight="bold">積分する</text><rect x="30" y="32" width="110" height="36" rx="8" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><text x="85" y="56" font-size="15" text-anchor="middle" fill="currentColor">f = x</text><rect x="180" y="32" width="110" height="36" rx="8" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><text x="235" y="56" font-size="15" text-anchor="middle" fill="currentColor">g′ = cos x</text><rect x="30" y="98" width="110" height="36" rx="8" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><text x="85" y="122" font-size="15" text-anchor="middle" fill="currentColor">f′ = 1</text><rect x="180" y="98" width="110" height="36" rx="8" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="1.6"/><text x="235" y="122" font-size="15" text-anchor="middle" fill="currentColor">g = sin x</text><line x1="85" y1="71" x2="85" y2="88" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="85,95 88.8,88 81.2,88" fill="#c98512" stroke="none"/><line x1="235" y1="71" x2="235" y2="88" stroke="#2f7fc1" stroke-width="2" stroke-linecap="round"/><polygon points="235,95 238.8,88 231.2,88" fill="#2f7fc1" stroke="none"/><line x1="136" y1="64" x2="179.8" y2="99" stroke="#d0504a" stroke-width="2.2" stroke-linecap="round"/><polygon points="186,104 182.5,95.6 177,102.4" fill="#d0504a" stroke="none"/><path d="M85.0 136 L85.0 148 L235.0 148 L235.0 136" fill="none" stroke="#7b5fb5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="164" font-size="12" text-anchor="middle" fill="#7b5fb5">この組は かけて 積分して ひく</text><text x="160" y="192" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold"><tspan fill="currentColor">∫ x cos x dx = </tspan><tspan fill="#d0504a">x sin x</tspan><tspan fill="currentColor"> − </tspan><tspan fill="#7b5fb5">∫ 1 × sin x dx</tspan></text></svg>'
        explain: 積の微分 {f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x)（D-005）から、∫ f(x)g′(x) dx = f(x)g(x) − ∫ f′(x)g(x) dx が成り立ちます。これを部分積分法といいます（わけは 6 日目）。積の形の関数のうち、微分するとかんたんになるほうを f(x)、原始関数がわかるほうを g′(x) と見ます。x cos x では f(x) = x、g′(x) = cos x とすると、f′(x) = 1、g(x) = sin x なので、∫ x cos x dx = x sin x − ∫ 1 × sin x dx = x sin x + cos x + C です。微分すると (x sin x + cos x)′ = sin x + x cos x − sin x = x cos x にもどります。反対に f(x) = cos x、g′(x) = x と見ると、∫ (1/2)x² sin x dx が残り、かえってむずかしくなります。定積分では ∫(a→b) f(x)g′(x) dx = [f(x)g(x)](a→b) − ∫(a→b) f′(x)g(x) dx です。
