    answer: 2/3
    check: "Fraction(min((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: x * x - (t * t + (lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda u: u * u, t) * (x - t)), 0, 2, 200) for t in [k / 100 for k in range(0, 201)])).limit_denominator(100)"
    hints:
      - 点 (t, t²) における接線の式を、t を使って表そう（D-005）。
      - x² − (接線の式) は (x − t)² になるので、面積を t の式で表そう。
      - その t の 2 次関数がいちばん小さくなる t を、平方完成で求めよう（A-020）。
    paths:
      - [接線 ℓ は y = 2tx − t², "面積 S(t) = ∫(0→2) (x − t)² dx = (1/3){(2 − t)³ + t³}", S(t) = 2t² − 4t + 8/3 = 2(t − 1)² + 2/3, t = 1 で最小値 2/3]
    note: 接線（D-005）、定積分、2 次関数の最小（A-020）の 3 段を順に進む。x² − (接線) が (x − t)² になること（接点で重解）に気づくと計算が短い。図は t の 1 つの値の例で、面積がいちばん小さくなる位置ではない。
