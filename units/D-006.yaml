        note: (1/2)(x + 1)² × (1/2)(x − 3)² のように、かけ算のまま別々に積分してはいけない（微分すると元にもどらない）。
      - part: 挑戦
        text: 関数 f(x) は f′(x) = 2x − 4 を満たし、f(x) の最小値は 3 です。f(5) の値はいくつですか。
        answer: 12
        check: "Fraction(3 + (lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: 2 * x - 4, 2, 5, 200)).limit_denominator(100)"
        hints:
