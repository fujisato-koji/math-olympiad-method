        explain: 例：「h > 0 とする。S(t + h) − S(t) は、x = t から x = t + h までの細い部分の面積である。f(x) は増える関数なので、この部分は、横が h で高さが f(t) の長方形をふくみ、高さが f(t + h) の長方形にふくまれる。よって f(t)h ≦ S(t + h) − S(t) ≦ f(t + h)h で、面積を幅 h でわった (S(t + h) − S(t))/h（細い部分の平均の高さ）は、f(t) と f(t + h) の間にある。h → 0 とすると f(t + h) → f(t)（f は連続、D-003）なので、はさみうちの原理（D-003）から (S(t + h) − S(t))/h → f(t) である。h < 0 のときも、t + h から t までの部分で同じように言える。よって S′(t) = f(t)、つまり S(t) は f(t) の原始関数である。原始関数どうしの差は定数なので（D-005）、S(t) = F(t) + C と書ける。S(a) = 0 なので C = −F(a) で、a から b までの面積は S(b) = F(b) − F(a) = ∫(a→b) f(x) dx である。」と書ければよい。①「〜とする」で h と S(t) を決める、②細い部分を 2 つの長方形ではさみ、幅 h でわる、③約束した事実（連続、はさみうちの原理、原始関数どうしの差は定数）で結ぶ、④まとめ（面積 = F(b) − F(a)）、がそろっているかを見る。3 日目から先に使ってきた「面積は定積分で求められる」のわけがこれで示せる。定積分を F(b) − F(a) と決めたこと（2 日目）と、面積という図形の量が、ここで初めてつながる。f が増える関数でないときも、細い部分での f のいちばん小さい値と大きい値ではさめば、同じすじみちで言える。グラフをいくつかかいて確かめただけで終わっていたら、例ではすべての関数を示せないことを話す。
        hints:
