          - f(x) = 3x² + kx を、∫(0→1) f(t) dt = k の左辺に入れましょう。
          - k についての 1 次方程式を解きましょう。
        paths:
          - [k = ∫(0→1) f(t) dt とおくと f(x) = 3x² + kx, k = ∫(0→1) (3t² + kt) dt = 1 + k/2, k = 2 で f(x) = 3x² + 2x, f(2) = 12 + 4 = 16]
          - [f(x) = 3x² + kx とおき、∫(0→1) f(t) dt を ∫(0→1) 3t² dt = 1 と ∫(0→1) kt dt = k/2 に分ける, k = 1 + k/2 で k = 2, f(2) = 12 + 4 = 16]
        note: 定積分 ∫(0→1) f(t) dt は x によらない定数だと見ぬくのが要点。∫(0→x) のように端に x があれば、それは x の関数になる（今日の 1 問目）。
