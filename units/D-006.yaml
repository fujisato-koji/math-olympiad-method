      - part: 今日
        text: F(x) は (x + 1)(x − 3) の原始関数で、F(0) = 0 です。F(3) の値はいくつですか。
        answer: −9
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: (x + 1) * (x - 3), 0, 3, 200)).limit_denominator(100))"
