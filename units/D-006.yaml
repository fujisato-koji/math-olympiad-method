# D-006 積分の考え（面積と原始関数、置換積分と部分積分）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   導入の日と、新しいきまりが出る練習の日（2〜5 日目）は頭に見本を 1 つ置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：原始関数と不定積分（F′(x) = f(x)、∫ xⁿ dx = (1/(n + 1))xⁿ⁺¹ + C、定数倍と和）、条件から積分定数 C を決める。
#   2 日目：定積分 ∫(a→b) f(x) dx = F(b) − F(a)（これを定義とする）とその性質、∫ sin x dx、∫ cos x dx、∫ 1/cos²x dx、∫ 1/x² dx、
#     ∫ √x dx、∫ 1/√x dx、分数式はわり算してから積分する（A-037）。
#   3 日目：面積（x 軸より上は ∫ f、下は −∫ f、2 つの曲線の間は ∫ (上 − 下)。交点は A-017 で）、符号つきの定積分と面積のちがい、
#     (1/6) の公式（挑戦で導く）。面積が定積分で求められるわけは 6 日目に示し、3〜5 日目は約束として先に使う（A-019 の 1 日目と同じ）。
#   4 日目：置換積分（∫ f(ax + b) dx、∫ f(g(x))g′(x) dx、定積分は端も置きかえる、x = sin θ とおく）。
#   5 日目：部分積分（∫ f(x)g′(x) dx = f(x)g(x) − ∫ f′(x)g(x) dx、2 回使う）、部分分数分解（A-037）してから積分する。
#   6 日目：わけ（3 問とも ③：面積の関数 S(x) は S′(x) = f(x) でだから面積は F(b) − F(a)、置換積分は合成関数の微分から、部分積分は積の微分から）。
#   7 日目：混ぜる（d/dx ∫(a→x) f(t) dt = f(x)、積分をふくむ関数の式、区間で式の変わる関数の定積分、y = sin x と y = cos x の間の面積、
#     曲線と接線の間の面積（D-005）、長方形 4 枚の面積の和と定積分のちがい）。8 日目：確認。
# 前提は D-005（導関数の計算）と A-037（分数式と部分分数分解）。たどると D-004、D-003（極限、連続、はさみうちの原理）、G-025（三角関数と加法定理）、
#   G-026（直線と円）、G-010（円とおうぎ形）、A-020、A-017（2 次方程式）、A-016（平方根）まで。
#   D-005 は同時に作っているので、dcalc の設計で「D-005 で約束する事実」とした (xⁿ)′ = nxⁿ⁻¹、積・商・合成の微分、(√x)′ = 1/(2√x)、
#   三角関数の導関数、「いつも f′(x) = 0 なら定数」を使った。A-037 は未作成なので、題と前提（A-015、N-019）から
#   「約分、多項式のわり算、1/(x(x + 1)) = 1/x − 1/(x + 1) の形の部分分数分解」とみなした。G-025 も未作成なので、弧度法、加法定理、
#   2 倍角の公式（cos 2x = 1 − 2sin²x = 2cos²x − 1、sin 2x = 2 sin x cos x）、sin(π/2 − x) = cos x とみなした。
# 指数・対数（D-001）と数列の極限（D-002）はたどりにないので、∫ 1/x dx = log|x| + C は扱わない（D-011 で扱う）。部分分数分解は
#   1/(x − a) の項が出ないもの（x/(x + 1)³ など）だけにした。分数の指数（x^(1/2)）も使わず、√x と 1/√x で書く
#   （∫ √x dx = (2/3)x√x + C は (x√x)′ = (3/2)√x を積の微分で確かめて使う）。
#   Σ（A-018）もたどりにないので、定積分は区分求積の極限では定義せず、F(b) − F(a) を定義にした（面積と等しいわけは 6 日目）。
#   長方形の面積の和は 7 日目に 4 枚の和を計算するだけにした（区分求積の極限と基本定理の厳密な扱いは D-009）。
#   不等式の性質（A-013）もたどりにないので、6 日目のわけでは「幅 h でわった平均の高さが f(x) と f(x + h) の間にある」と読み、
#   はさみうちの原理は D-003 の約束した事実として使う。絶対値（N-011）もたどりにないので、|x² − 1| のような定積分は出さず、
#   区間で式が変わる関数（x ≦ 1 と x > 1 で式がちがう）の定積分にした。
# 記号：不定積分は「∫ f(x) dx」、定積分は「∫(a→b) f(x) dx」（教科書では a を ∫ の下、b を上に小さく書く。2 日目の見本で教える）。
#   原始関数の差は paths で「[F(x)](a→b)」。微分は「f′(x)」（′ は U+2032）。係数の分数は「(1/3)x³」、分数式は「1/(x + 1)²」。
# 答えは数を打つ。原始関数（式）、π や √ をふくむ値は choices にした（選択肢は、微分と積分の取りちがえ、n + 1 でわり忘れ、符号の誤り、
#   中の関数の微分のかけ忘れ・わり忘れ、2 倍角の 1/2 の落としなど、よくある誤りから作った）。
# check：定積分と面積は、数値積分（シンプソンの公式、200 区間。端で傾きが急な √(1 − x²) などは 20000 区間）で計算し、
#   Fraction の limit_denominator(100) で分数にそろえる。原始関数を選ぶ問題は、選択肢ごとの式（lambda x）の中心差分（幅 2 × 10⁻⁶）が
#   0.3、0.8、1.7、2.6 のどの点でも元の関数と等しいものを選び出す。π や √ をふくむ値は、選択肢の値が数値積分の値に十分近いものを選ぶ。
#   C を決めて F(b) を求める問題は、F(a) + ∫(a→b) f(x) dx を数値積分で計算する。微分の値は中心差分で求める。
# 図は svg（D-040）。面積を求める部分は淡く塗る。交点の座標や面積の値は図に書かない。
# 6 日目で示す「面積は F(b) − F(a)」「d/dx ∫(a→x) f(t) dt = f(x)」と、置換積分・部分積分は、断面積と回転体の体積（D-081）、
#   仕事と位置エネルギー（P-004）、電場と電位（P-030）、台形公式とシンプソンの公式（K-160）、微分方程式（D-044）の道具になる（D-026）。

id: D-006
days:
  - day: 1
    items:
      - part: 見本
        text: 微分すると 2x になる関数を考えてみましょう。また、∫ (3x² − 4x + 1) dx を求めてみましょう。
        explain: x² を微分すると 2x です（D-005）。x² + 3 や x² − 5 も、微分すると 2x になります。このように、F′(x) = f(x) となる関数 F(x) を、f(x) の原始関数といいます。F(x) と G(x) がどちらも f(x) の原始関数なら、(G(x) − F(x))′ = f(x) − f(x) = 0 なので、G(x) − F(x) は定数です（いつも導関数が 0 の関数は定数、D-005）。そこで、f(x) の原始関数をまとめて F(x) + C と書き、これを f(x) の不定積分といって ∫ f(x) dx で表します。C は積分定数といい、どんな定数でもよいことを表します。不定積分を求めることを、f(x) を積分するといいます。n が 0、1、2、… のとき、((1/(n + 1))xⁿ⁺¹)′ = xⁿ なので、∫ xⁿ dx = (1/(n + 1))xⁿ⁺¹ + C です（∫ 1 dx = x + C、∫ x dx = (1/2)x² + C、∫ x² dx = (1/3)x³ + C）。また、微分の公式 (kf)′ = kf′ と (f + g)′ = f′ + g′ から、∫ kf(x) dx = k∫ f(x) dx、∫ (f(x) + g(x)) dx = ∫ f(x) dx + ∫ g(x) dx が成り立ちます。∫ (3x² − 4x + 1) dx = 3 × (1/3)x³ − 4 × (1/2)x² + x + C = x³ − 2x² + x + C です。答えは、微分して元の関数にもどるかで確かめます。(x³ − 2x² + x + C)′ = 3x² − 4x + 1 です。
      - part: 思い出す
        text: 関数 f(x) = (1/2)x⁴ − (1/3)x³ + 7x について、f′(2) の値はいくつですか。
        answer: 19
        check: "Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: x**4 / 2 - x**3 / 3 + 7 * x, 2)).limit_denominator(100)"
        hints:
          - (xⁿ)′ = nxⁿ⁻¹ を、項ごとに使いましょう（D-005）。
          - 係数の分数は、そのままかけておきます。
          - f′(x) を求めてから、x = 2 を代入しましょう。
        paths:
          - [f′(x) = 2x³ − x² + 7, f′(2) = 16 − 4 + 7, 19]
      - part: 思い出す
        text: 関数 f(x) = (2x − 3)⁴ について、f′(1) の値はいくつですか。
        answer: −8
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: (2 * x - 3)**4, 1)).limit_denominator(100))"
        hints:
          - 合成関数の微分を使いましょう（D-005）。
          - u = 2x − 3 とおくと、y = u⁴ です。
          - du/dx をかけ忘れないようにしましょう。
        paths:
          - [f′(x) = 4(2x − 3)³ × 2 = 8(2x − 3)³, f′(1) = 8 × (−1)³, −8]
        note: 中の 2x − 3 の微分の 2 をかけ忘れて −4 としやすい。
      - part: 今日
        text: 不定積分 ∫ (6x² − 2x + 5) dx はどれですか。
        choices: [2x³ − x² + 5x + C, 12x − 2 + C, 6x³ − 2x² + 5x + C, 2x³ − x² + C]
        answer: 2x³ − x² + 5x + C
        check: "[c for c, F in {'2x³ − x² + 5x + C': lambda x: 2 * x**3 - x**2 + 5 * x, '12x − 2 + C': lambda x: 12 * x - 2, '6x³ − 2x² + 5x + C': lambda x: 6 * x**3 - 2 * x**2 + 5 * x, '2x³ − x² + C': lambda x: 2 * x**3 - x**2}.items() if all(abs((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(F, x) - (6 * x**2 - 2 * x + 5)) < 1e-4 for x in (0.3, 0.8, 1.7, 2.6))][0]"
        hints:
          - ∫ xⁿ dx = (1/(n + 1))xⁿ⁺¹ + C を、項ごとに使いましょう。
          - 数の項 5 は、5 × x⁰ と考えます。
          - 答えを微分して、元の関数にもどるかを確かめましょう。
        paths:
          - [6 × (1/3)x³ − 2 × (1/2)x² + 5x + C, 2x³ − x² + 5x + C]
        note: 微分と積分を取りちがえて 12x − 2 としたり、指数に 1 を足したあと n + 1 でわるのを忘れたりしやすい。
      - part: 今日
        text: F(x) は f(x) = 3x² + 4x の原始関数で、F(0) = −2 です。F(2) の値はいくつですか。
        answer: 14
        check: "Fraction(-2 + (lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: 3 * x**2 + 4 * x, 0, 2, 200)).limit_denominator(100)"
        hints:
          - まず、不定積分 ∫ (3x² + 4x) dx を求めましょう。
          - F(0) = −2 から、積分定数 C を決めましょう。
          - 決まった F(x) に x = 2 を代入しましょう。
        paths:
          - [F(x) = x³ + 2x² + C, F(0) = C = −2, F(2) = 8 + 8 − 2 = 14]
        note: C を決めずに 0 として 16 としやすい。
      - part: 挑戦
        text: 曲線 y = F(x) は点 (1, 3) を通り、曲線の上の各点 (x, y) における接線の傾きは 4x³ − 6x です。F(2) の値はいくつですか。
        answer: 9
        check: "Fraction(3 + (lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: 4 * x**3 - 6 * x, 1, 2, 200)).limit_denominator(100)"
        hints:
          - 点 (x, F(x)) における接線の傾きは、F′(x) です（D-004）。
          - F(x) は 4x³ − 6x の原始関数です。
          - 点 (1, 3) を通ることから、C を決めましょう。
        paths:
          - [F′(x) = 4x³ − 6x, F(x) = x⁴ − 3x² + C, F(1) = 1 − 3 + C = 3 で C = 5, F(2) = 16 − 12 + 5 = 9]
        note: 接線の傾きの条件を F′(x) と読みかえるのが要点。原始関数の中から、通る点で 1 つに決める。
    extra:
      - part: 今日
        text: 不定積分 ∫ (x³ − 4x + 2) dx はどれですか。
        choices: [(1/4)x⁴ − 2x² + 2x + C, 3x² − 4 + C, (1/4)x⁴ − 4x² + 2x + C, (1/3)x⁴ − 2x² + 2x + C]
        answer: (1/4)x⁴ − 2x² + 2x + C
        check: "[c for c, F in {'(1/4)x⁴ − 2x² + 2x + C': lambda x: x**4 / 4 - 2 * x**2 + 2 * x, '3x² − 4 + C': lambda x: 3 * x**2 - 4, '(1/4)x⁴ − 4x² + 2x + C': lambda x: x**4 / 4 - 4 * x**2 + 2 * x, '(1/3)x⁴ − 2x² + 2x + C': lambda x: x**4 / 3 - 2 * x**2 + 2 * x}.items() if all(abs((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(F, x) - (x**3 - 4 * x + 2)) < 1e-4 for x in (0.3, 0.8, 1.7, 2.6))][0]"
