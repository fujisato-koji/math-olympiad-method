        explain: 区間 a ≦ x ≦ b でいつも f(x) ≧ 0 のとき、曲線 y = f(x) と x 軸、2 直線 x = a、x = b で囲まれた部分の面積 S は、S = ∫(a→b) f(x) dx です（わけは 6 日目に示します）。y = −x² + 4x = −x(x − 4) は x = 0、4 で x 軸と交わり、0 ≦ x ≦ 4 では y ≧ 0 です。よって S = ∫(0→4) (−x² + 4x) dx = [−(1/3)x³ + 2x²](0→4) = −64/3 + 32 = 32/3 です。区間でいつも f(x) ≦ 0 のときは、x 軸について折り返した y = −f(x) の面積と同じなので、S = −∫(a→b) f(x) dx です。区間でいつも f(x) ≧ g(x) のとき、2 つの曲線 y = f(x)、y = g(x) の間の面積は ∫(a→b) (f(x) − g(x)) dx（上の式 − 下の式）です（2 つの曲線を同じだけ上に動かしても間の面積は変わらないので、上の曲線の下の面積 − 下の曲線の下の面積と考えます）。曲線が x 軸の上と下にまたがるときは、x 軸と交わる点で区間を分けます。定積分は負の数にもなりますが、面積はいつも正の数です。
