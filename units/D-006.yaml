        text: 微分すると 2x になる関数は、x² のほかに x² + 3 や x² − 5 もあります（図：グラフを上下にずらしても、同じ x での傾きは同じ）。このような関数を 2x の原始関数といい、まとめて ∫ 2x dx = x² + C（C はどんな数でもよい）と書きます。xⁿ の原始関数は (1/(n + 1))xⁿ⁺¹ なので、∫ (3x² − 4x + 1) dx = x³ − 2x² + x + C です。
