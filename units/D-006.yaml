        id: "3fee3b41bb"
        text: ∫ (2x + 1)⁴ dx では、かたまり 2x + 1 を u とおきます。du = 2 dx なので ∫ (1/2)u⁴ du = (1/10)u⁵ + C = (1/10)(2x + 1)⁵ + C です。定積分では、x の端を u の端にうつします。∫(0→1) x(x² + 1)³ dx は、u = x² + 1 とおくと u は 1 から 2 まで動き、∫(1→2) (1/2)u³ du = 15/8 です。
