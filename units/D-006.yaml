  - day: 2
    items:
      - part: 見本
        text: ∫(1→3) (x² − 1) dx を求めてみましょう。
        explain: f(x) の原始関数の 1 つを F(x) とするとき、F(b) − F(a) を、f(x) の a から b までの定積分といい、∫(a→b) f(x) dx と書きます（教科書では a を ∫ の下に、b を上に小さく書きます。画面では ∫(a→b) と 1 行で書きます）。F(b) − F(a) は [F(x)](a→b) とも書きます。原始関数に定数を足しても (F(b) + C) − (F(a) + C) = F(b) − F(a) なので、定積分の値は原始関数の選び方によりません。∫(1→3) (x² − 1) dx = [(1/3)x³ − x](1→3) = (9 − 3) − (1/3 − 1) = 6 + 2/3 = 20/3 です。定積分には次の性質があります。∫(a→a) f(x) dx = 0、∫(b→a) f(x) dx = −∫(a→b) f(x) dx、∫(a→c) f(x) dx + ∫(c→b) f(x) dx = ∫(a→b) f(x) dx、定数倍と和は不定積分と同じ（どれも F(b) − F(a) の形から言えます）。三角関数などの不定積分も、微分の公式（D-005）を逆に読んで求めます。∫ sin x dx = −cos x + C、∫ cos x dx = sin x + C、∫ 1/cos²x dx = tan x + C です。また、(1/x)′ = −1/x² から ∫ 1/x² dx = −1/x + C、(x√x)′ = √x + x × 1/(2√x) = (3/2)√x から ∫ √x dx = (2/3)x√x + C、(√x)′ = 1/(2√x) から ∫ 1/√x dx = 2√x + C です。∫ 1/x dx は、対数関数を学んでから扱います。
      - part: 思い出す
        text: F(x) は 4x³ − 6x + 1 の原始関数で、F(1) = 0 です。F(2) の値はいくつですか。
        answer: 7
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: 4 * x**3 - 6 * x + 1, 1, 2, 200)).limit_denominator(100)"
        hints:
          - 不定積分を、項ごとに求めましょう。
          - F(1) = 0 から C を決めましょう。
          - 決まった F(x) に x = 2 を代入しましょう。
        paths:
          - [F(x) = x⁴ − 3x² + x + C, F(1) = −1 + C = 0 で C = 1, F(2) = 16 − 12 + 2 + 1 = 7]
      - part: 思い出す
        text: 関数 f(x) = 3 sin x + 2 cos x について、f′(π) の値はいくつですか。
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: 3 * math.sin(x) + 2 * math.cos(x), math.pi)).limit_denominator(100))"
        hints:
          - sin x と cos x の導関数を思い出しましょう（D-005）。
          - (cos x)′ の符号に気をつけましょう。
          - cos π と sin π の値を使いましょう（G-025）。
        paths:
          - [f′(x) = 3 cos x − 2 sin x, f′(π) = 3 × (−1) − 2 × 0, −3]
      - part: 今日
        text: 定積分 ∫(−1→2) (3x² − 2x + 1) dx の値はいくつですか。
        answer: 9
