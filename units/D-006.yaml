>y = x(x − (β − α))</text><text x="296" y="33.5" font-size="12" text-anchor="end" fill="#8a8f9c">y = (x − α)(x − β)</text></svg>'
          - β − α = d とおくと、∫(0→d) x(x − d) dx を計算すればよくなります。
          - 計算した結果を、d³ の何倍かの形にしましょう。
        paths:
          - [(x − α)(x − β) = (x − α)² − (β − α)(x − α), '[(1/3)(x − α)³ − (1/2)(β − α)(x − α)²](α→β)', (1/3)(β − α)³ − (1/2)(β − α)³, k = −1/6]
          - [x − α = t とおく（グラフを左へ α だけずらす）と、β − α = d として ∫(0→d) t(t − d) dt, '[(1/3)t³ − (1/2)dt²](0→d) = (1/3)d³ − (1/2)d³', −(1/6)d³ なので k = −1/6]
        note: 展開して α、β の式のまま計算すると手数が多い。x − α のかたまりで考えるのが要点。放物線と直線で囲まれた面積は (1/6)(β − α)³（x² の係数が 1 のとき）で求められるようになる。
