s x)</text><line x1="40" y1="34" x2="62" y2="34" stroke="#d0504a" stroke-width="2.6" stroke-linecap="round"/><text x="68" y="39" font-size="13" text-anchor="start" fill="#d0504a">y = cos x/(sin x + cos x)</text></svg>'
      - I = ∫(0→π/2) sin x/(sin x + cos x) dx と J = ∫(0→π/2) cos x/(sin x + cos x) dx について、I と J の関係と I + J を調べよう。
    paths:
      - [I = ∫(0→π/2) sin x/(sin x + cos x) dx と J = ∫(0→π/2) cos x/(sin x + cos x) dx とおく, x = π/2 − t と置換すると I = J, I + J = ∫(0→π/2) 1 dx = π/2 なので I = J = π/4, 求める値は 3I + J = π]
      - [分子を 3 sin x + cos x = 2(sin x + cos x) + (sin x − cos x) と分ける, ∫(0→π/2) 2 dx = π と ∫(0→π/2) (sin x − cos x)/(sin x + cos x) dx の和, x = π/2 − t と置換すると後ろの積分は自分の −1 倍になるので 0、答えは π]
    note: 原始関数は対数を使わないと書けない（D-011）。置換で sin と cos を入れかえると同じ値の別の形ができ、足すと分母と分子がそろって 1 になる。対称を使って、原始関数を求めずに値を出すのが離の道筋。3 sin x + cos x を「3 × sin x と 1 × cos x」に分けて I と J の組に直す読みかえもいる。
