      - part: 挑戦
        id: "8c9e9b2974"
        text: 定積分 ∫(1→3) (x² + 1)/x² dx の値はいくつですか。
        answer: 8/3
        check: "Fraction((lambda f, a, b, N: (b - a) / (6 * N) * sum(f(a + k * (b - a) / N) + 4 * f(a + (k + 0.5) * (b - a) / N) + f(a + (k + 1) * (b - a) / N) for k in range(N)))(lambda x: (x**2 + 1) / x**2, 1, 3, 200)).limit_denominator(100)"
        hints:
          - 《分数》式のままでは積分しにくいので、項に分けましょう（A-037）。
          - text: 分子の各項を、分母の x² でわりましょう。
            svg: '<svg viewBox="0 0 320 156" xmlns="http://www.w3.org/2000/svg"><text x="62" y="71" font-size="19" text-anchor="middle" fill="currentColor">x² + 1</text><line x1="35.1" y1="76" x2="88.9" y2="76" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="62" y="96" font-size="19" text-anchor="middle" fill="currentColor">x²</text><text x="116" y="83" font-size="20" text-anchor="middle" fill="currentColor">=</text><text x="160" y="70" font-size="19" text-anchor="middle" fill="#2f7fc1" font-weight="bold">x²</text><line x1="142" y1="76" x2="178" y2="76" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="160" y="96" font-size="19" text-anchor="middle" fill="currentColor">x²</text><text x="200" y="83" font-size="20" text-anchor="middle" fill="currentColor">+</text><text x="240" y="70" font-size="19" text-anchor="middle" fill="#c98512" font-weight="bold">1</text><line x1="224" y1="76" x2="256" y2="76" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="240" y="96" font-size="19" text-anchor="middle" fill="currentColor">x²</text><line x1="70" y1="40" x2="143" y2="40" stroke="#2f7fc1" stroke-width="1.8" stroke-linecap="round"/><polygon points="150,40 143,36.1 143,43.9" fill="#2f7fc1" stroke="none"/><line x1="80" y1="34" x2="225" y2="34" stroke="#c98512" stroke-width="1.8" stroke-linecap="round"/><polygon points="232,34 225,30.1 225,37.9" fill="#c98512" stroke="none"/><text x="160" y="140" font-size="14" text-anchor="middle" fill="currentColor">分子の 1 つ 1 つを、分母で わる</text></svg>'
          - 1/x² の原始関数は −1/x です（見本）。
        paths:
          - [(x² + 1)/x² = 1 + 1/x², '[x − 1/x](1→3)', (3 − 1/3) − (1 − 1) = 8/3]
          - [(x² + 1)/x² = 1 + 1/x², '∫(1→3) 1 dx = 2 と ∫(1→3) 1/x² dx = [−1/x](1→3) = 2/3 に分ける', 2 + 2/3 = 8/3]
        note: 分子と分母を別々に積分してはいけない。分数式は、わり算して項に分けてから積分する。
