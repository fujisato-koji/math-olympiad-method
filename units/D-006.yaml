        text: 不定積分 ∫ (8x³ − 3x² + 2) dx はどれですか。
        choices: [2x⁴ − x³ + 2x + C, 24x² − 6x + C, 8x⁴ − 3x³ + 2x + C, 2x⁴ − x³ + C]
        answer: 2x⁴ − x³ + 2x + C
        check: "[c for c, F in {'2x⁴ − x³ + 2x + C': lambda x: 2 * x**4 - x**3 + 2 * x, '24x² − 6x + C': lambda x: 24 * x**2 - 6 * x, '8x⁴ − 3x³ + 2x + C': lambda x: 8 * x**4 - 3 * x**3 + 2 * x, '2x⁴ − x³ + C': lambda x: 2 * x**4 - x**3}.items() if all(abs((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(F, x) - (8 * x**3 - 3 * x**2 + 2)) < 1e-4 for x in (0.3, 0.8, 1.7, 2.6))][0]"
