# C-008 重なりを数える（ベン図）
#
# 書き方は N-001 の頭の注、文の漢字は C-006 の頭の注のとおり（小 3 までの漢字。好、選、求、最、以 などはかなで書く）。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 2 つの集まりの重なり（どちらか = A + B − 両方）とベン図の読み方、2 日目 全体からひく（どちらでもない）、両方の人数をもとめる、
#   3 日目 わけ（なぜ重なりをひくか、たした数が全体より多いのはなぜか、和の法則ではなぜひかないか）、
#   4 日目 C-005（重ならないときはたすだけ）・C-003（表）と混ぜる、5 日目 確認。
# 前提は C-005 まで。数は 100 まで（3 けたの数 N-009 は前提にない）。九九（N-013）は「2 のだんの答え」のような集まりに使う。
#   「2 のだんの答え」は 2 × 1 から 2 × 9 までの 9 こ（N-013 の九九の表の答え）とする。倍数（N-017）は前提にないので、その言葉は使わない。
# 集まりは 2 つまで。3 つの集まりの重なり（包除原理、C-021）は出さない。「少なくともどちらか」は「どちらか」と書き、1 日目の見本と最初の問題で「両方もふくめる」とことわる。
# ベン図は svg で 2 つの円を描き、それぞれの部分に人数を書く（答えの数は書かない）。全体があるときは外に四角を描く。
#   表（C-003）は svg の 2 行 2 列のますで描き、○ は「している」、× は「していない」。
# check は、集まりを set で作り（range をずらして重なりの人数を合わせる）、| と & で数える。図の人数を読むだけの問題は、図の数の式を書く。
# ただし腕だめしの最難関（4 × 6 のマス目にとなり合わないコマ 6 こ）だけは例外で、uses に N-009 と N-074 を挙げて、1000 までの数と 2 けた × 2 けたのかけ算（16 × 27 = 432 など）を使う。

id: C-008
days:
  - day: 1
    items:
      - part: 思い出す
        text: 赤い花が 6 本、白い花が 8 本あります。どれか 1 本だけをえらぶとき、えらび方は何通りですか。
        answer: 14
        check: "len(set(('赤', i) for i in range(6)) | set(('白', i) for i in range(8)))"
        hints:
          - えらぶのは何本かな。
          - 赤い花と白い花は、重なるかな。
          - どちらか 1 つのときは、たし算とかけ算のどちらかな。
        paths:
          - [1 本だけ, 赤か白のどちらか, 重ならない, 6 + 8 = 14 通り]
      - part: 思い出す
        text: パンが 3 しゅるい、飲み物が 4 しゅるいあります。パンと飲み物を 1 つずつえらぶ組み合わせは何通りですか。
        answer: 12
        check: "len(set(itertools.product(range(3), range(4))))"
        hints:
          - パン 1 つから、飲み物のえだは何本出るかな。
          - どのパンからも、同じ数のえだが出るね。
          - かけ算の式にしよう。
        paths:
          - [どのパンからもえだが 4 本, 4 本が 3 つ分, 4 × 3 = 12 通り]
      - part: 見本
        text: 犬がすきな人は 7 人、ねこがすきな人は 5 人、両方すきな人は 3 人です。犬かねこの、どちらかがすきな人（両方すきな人もふくめます）は何人ですか。
        svg: |
          <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg">
            <circle cx="95" cy="80" r="50" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <circle cx="145" cy="80" r="50" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <text x="62" y="22" font-size="14" text-anchor="middle">犬</text>
            <text x="178" y="22" font-size="14" text-anchor="middle">ねこ</text>
            <text x="68" y="85" font-size="15" text-anchor="middle">4 人</text>
            <text x="120" y="85" font-size="15" text-anchor="middle">3 人</text>
            <text x="172" y="85" font-size="15" text-anchor="middle">2 人</text>
          </svg>
        explain: 7 + 5 = 12 とたすと、両方すきな 3 人を、犬のほうでもねこのほうでも数えてしまいます（2 回数えます）。だから 12 − 3 = 9 人です。図のように、2 つの円を重ねてかくと、重なりがよく見えます。この図を「ベン図」といいます。重なりが両方すきな人、左の円だけの所が犬だけすきな人（7 − 3 = 4 人）、右の円だけの所がねこだけすきな人（5 − 3 = 2 人）です。4 + 3 + 2 = 9 人と数えても同じです。
      - part: 今日
        text: えんぴつを持っている人は 9 人、ペンを持っている人は 6 人、両方持っている人は 4 人です。えんぴつかペンの、どちらかを持っている人（両方持っている人もふくめます）は何人ですか。
        answer: 11
        check: "len(set(range(9)) | set(range(5, 11)))"
        hints:
          - 9 + 6 とたすと、両方持っている人はどうなるかな。
          - 両方持っている人は、何回数えているかな。
          - 2 回数えた人数をひこう。
        paths:
          - [9 + 6 = 15, 両方の 4 人を 2 回数えている, 15 − 4 = 11 人]
          - [えんぴつだけ 9 − 4 = 5 人, ペンだけ 6 − 4 = 2 人, 5 + 4 + 2 = 11 人]
        note: 9 + 6 = 15 と答えやすい。ベン図をかかせて、重なりを 2 回数えていることを見せる。
      - part: 今日
        text: ベン図は、サッカーをする人となわとびをする人の人数です。なわとびをする人は、全部で何人ですか。
        svg: |
          <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg">
            <circle cx="95" cy="80" r="50" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <circle cx="145" cy="80" r="50" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <text x="62" y="22" font-size="14" text-anchor="middle">サッカー</text>
            <text x="178" y="22" font-size="14" text-anchor="middle">なわとび</text>
            <text x="68" y="85" font-size="15" text-anchor="middle">5 人</text>
            <text x="120" y="85" font-size="15" text-anchor="middle">2 人</text>
            <text x="172" y="85" font-size="15" text-anchor="middle">6 人</text>
          </svg>
        answer: 8
        check: "2 + 6"
        hints:
          - なわとびの円の中には、どこがあるかな。
          - 重なりの 2 人も、なわとびをする人だね。
          - なわとびの円の中の数をたそう。
        paths:
          - [なわとびだけ 6 人, 両方 2 人, 6 + 2 = 8 人]
        note: 6 人と答えやすい。両方する人も、なわとびをする人に入る。
      - part: 今日
        text: 九九の 4 のだんの答え（4、8、12、…、36）と、6 のだんの答え（6、12、18、…、54）があります。両方に出てくる数は何こありますか。
        answer: 3
        check: "len(set(4 * i for i in range(1, 10)) & set(6 * i for i in range(1, 10)))"
        hints:
          - 4 のだんの答えを全部書こう。
          - 6 のだんの答えも書いて、同じ数に〇をつけよう。
          - 〇をつけた数を数えよう。
        paths:
          - [4 のだんは 4、8、12、16、20、24、28、32、36, 6 のだんは 6、12、18、24、30、36、42、48、54, 両方は 12、24、36 の 3 こ]
      - part: 挑戦
        text: 4 のだんの答えと 6 のだんの答えの、どちらかに出てくる数は何こありますか。同じ数は 1 こと数えます。
        answer: 15
        check: "len(set(4 * i for i in range(1, 10)) | set(6 * i for i in range(1, 10)))"
        hints:
          - 4 のだんの答えは何こ、6 のだんの答えは何こかな。
          - 両方に出てくる数は、何こだったかな。
          - たしてから、2 回数えた数をひこう。
        paths:
          - [4 のだん 9 こ、6 のだん 9 こ, 9 + 9 = 18, 両方の 12、24、36 を 2 回数えている, 18 − 3 = 15 こ]
        note: 9 + 9 = 18 と答えやすい。数の集まりでも、人の集まりと同じように重なりをひく。
    extra:
      - part: 今日
        text: りんごがすきな人は 8 人、みかんがすきな人は 6 人、両方すきな人は 2 人です。どちらかがすきな人は何人ですか。
