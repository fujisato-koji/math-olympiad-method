# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 数]
    uses: [N-018]
    text: 1 から 200 までの《整数》のうち、4 の《倍数》でも 6 の倍数でもない数は何こありますか。
    answer: 133
    check: "len(set(range(1, 201)) - set(range(4, 201, 4)) - set(range(6, 201, 6)))"
    hints:
      - 4 の倍数、6 の倍数は、それぞれ何こあるかな。
      - 4 の倍数でも 6 の倍数でもある数は、何の倍数かな。
      - ベン図をかいて、どちらかの倍数になる数を出してから、全体からひこう。
    paths:
      - [4 の倍数は 200 ÷ 4 = 50 こ, 6 の倍数は 200 ÷ 6 = 33 あまり 2 で 33 こ, 両方の倍数は 4 と 6 の公倍数で 12 の倍数、200 ÷ 12 = 16 あまり 8 で 16 こ, どちらかの倍数は 50 + 33 − 16 = 67 こ, 200 − 67 = 133 こ]
    note: 重なりを数える（C-008）に、倍数と公倍数（N-017、N-018）を合わせる。4 と 6 の両方の倍数を 24 の倍数（4 × 6）としやすい。両方でわり切れるのは最小公倍数 12 の倍数。
  - part: 離
    kinds: [道筋]
    text: 32 人のクラスで、なわとびの二重とびができる人は 21 人、てつぼうのさか上がりができる人は 17 人です。両方できる人の人数として、ありえる人数は何通りありますか。
    answer: 12
    check: "len({b for b in range(0, 18) if 21 + 17 - b <= 32})"
    hints:
      - 両方できる人がいちばん少ないのは何人のときかな。どちらかができる人は 32 人より多くなれないね。
      - 両方できる人がいちばん多いのは何人のときかな。さか上がりができる 17 人が、全員二重とびもできるときを考えよう。
      - いちばん少ない人数から、いちばん多い人数までの間の人数は、どれもありえるよ。
    paths:
      - [両方の人数を 0 人とすると 21 + 17 = 38 人で、32 人より多い, 両方は少なくとも 38 − 32 = 6 人, 両方はさか上がりの 17 人より多くはなれない, 6 人から 17 人までのどれもありえるので 17 − 6 + 1 = 12 通り]
    note: 重なりがいちばん少ない場合（全員がどちらかはできる）と、いちばん多い場合（さか上がりの円が二重とびの円にすっぽり入る）の両方をベン図で考える。最後に 17 − 6 = 11 としやすい（6 人と 17 人の両方をふくむので 12 通り）。
  - part: 離
    kinds: [読み取り, 手数]
    text: 3 年 1 組の 35 人に、算数と国語のそれぞれがすきかどうかを聞きました。算数がすきな人は 22 人、国語がすきな人は 18 人でした。また、算数はすきだけれど国語はすきではない人は 12 人でした。どちらもすきではない人は何人ですか。
    answer: 5
    check: "35 - len(set(range(22)) | set(range(12, 12 + 18)))"
    hints:
      - ベン図をかいて、わかっている人数を書きこもう。
      - 算数がすきな 22 人のうち、国語はすきではない人が 12 人。のこりの人はどんな人かな。
      - 両方すきな人がわかったら、どちらかがすきな人の人数を出そう。
    paths:
      - [両方すきな人は 22 − 12 = 10 人, 国語だけすきな人は 18 − 10 = 8 人, どちらかがすきな人は 12 + 10 + 8 = 30 人, どちらもすきではない人は 35 − 30 = 5 人]
    note: 「算数はすきだが国語はすきではない」は、ベン図の算数の円のうち重ならない部分。どの部分の人数かを図に書きこんでから計算すると、取りちがえを防げる。12 人を両方すきな人と読みちがえやすい。
  - part: 離
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - C-005
    - N-009
    - N-074
    text: 図のような、たて 4 マス、よこ 6 マスのマス目に、コマを 6 こおきます。1 つのマスにおけるコマは 1 こまでです。どの 2 この コマも、たて・よこ・ななめにとなり合ってはいけません（かどだけでとなり合うのもだめです）。コマのおき方は、何通りありますか。
    svg: <svg viewBox="0 0 180 124" xmlns="http://www.w3.org/2000/svg"><rect x="6.0" y="6.0" width="168.0" height="112.0" stroke="currentColor" stroke-width="2" fill="none"/><line x1="34.0" y1="6.0" x2="34.0" y2="118.0" stroke="currentColor" stroke-width="1" fill="none"/><line x1="62.0" y1="6.0" x2="62.0" y2="118.0" stroke="currentColor" stroke-width="1" fill="none"/><line x1="90.0" y1="6.0" x2="90.0" y2="118.0" stroke="currentColor" stroke-width="1" fill="none"/><line x1="118.0" y1="6.0" x2="118.0" y2="118.0" stroke="currentColor" stroke-width="1" fill="none"/><line x1="146.0" y1="6.0" x2="146.0" y2="118.0" stroke="currentColor" stroke-width="1" fill="none"/><line x1="6.0" y1="34.0" x2="174.0" y2="34.0" stroke="currentColor" stroke-width="1" fill="none"/><line x1="6.0" y1="62.0" x2="174.0" y2="62.0" stroke="currentColor" stroke-width="1" fill="none"/><line x1="6.0" y1="90.0" x2="174.0" y2="90.0" stroke="currentColor" stroke-width="1" fill="none"/></svg>
    answer: 408
    check: sum(1 for s in itertools.combinations(range(24), 6) if all(max(abs(p // 6 - q // 6), abs(p % 6 - q % 6)) >= 2 for p, q in itertools.combinations(s, 2)))
    hints:
    - となり合ってはいけないので、2 × 2 のマスの中には、コマは何こまでおけるかな。そこから、6 こが全体のどこに入るか考えてみよう。
    - 6 こが 6 つの区画に 1 こずつ入るとき、となりの区画のコマとぶつかるのは、区画の中のどの場所にあるときかな。よこ、たて、ななめに分けて考えてみよう。
    - 一度に全部を数えるのはたいへんだよ。先に、一部のぶつかりだけを考えて数えると、何が足りなくなるかな。
    paths:
    - - マス目を、たて 2 マス、よこ 2 マスの区画 6 つに分ける（上の 3 つを左から A、B、C、下の 3 つを左から D、E、F とする）。1 つの区画の 4 マスは、どの 2 マスもかどまで入れてとなり合っているので、1 つの区画に入るコマは 1 こまで。区画は 6 つ、コマは 6 こだから、どの区画にもちょうど 1 こずつ入る
      - 区画の中のコマの場所を、「左か右か」と「上か下か」に分けて考える。よこにならぶ 2 つの区画では、2 つのコマのたてのずれは 1 マス以下なので、ぶつかるかどうかは左右だけで決まる。左の区画のコマが右、右の区画のコマが左のときだけ、よこに 1 マスしかはなれず、ぶつかる。たてにならぶ 2 つの区画では、よこのずれは 1 マス以下なので、上の区画のコマが下、下の区画のコマが上のときだけ、ぶつかる
      - 左右の決め方：よこにならぶ 3 つの区画で、「右のすぐ右の区画が左」をさけるので、右が 1 つ出たらそれより右はすべて右。左左左、左左右、左右右、右右右の 4 通り。上の 3 区画と下の 3 区画で 4 × 4 = 16 通り。上下の決め方：たてにならぶ 2 つの区画で、「上の区画が下、下の区画が上」をさけるので 3 通り。3 列で 3 × 3 × 3 = 27 通り。ぶつかる決まりは左右だけ、上下だけで言えるので、べつべつに決めてかけてよく、16 × 27 = 320 + 112 = 432 通り。これは、たてとよこのぶつかりをさけた数で、ななめはまだ
      - ななめにとなり合う区画の組は、A と E、B と D、B と F、C と E の 4 つ。ななめの区画どうしは、かどどうしが向き合うときだけぶつかる（A と E なら、A のコマが右下で E のコマが左上のとき）。この 432 通りのうち A と E がぶつかるものを数える。A が右下、E が左上と決まる。上の 3 区画は、A が右なので B も右、C も右の 1 通り。下の 3 区画は、E が左なので D は左、F は左か右の 2 通り。A が下なので D も下の 1 通り、E が上なので B も上の 1 通り、C と F の上下は 3 通り。2 × 3 = 6 通り。ほかの 3 組も、向きを入れかえると同じで 6 通りずつ
      - 2 つの組が同時にぶつかることはない。ぶつかるとき、A と E の組なら E のコマは左上、C と E の組なら E は右上、B と D の組なら B は左下、B と F の組なら B は右下と決まる。同じ区画を使う 2 つの組（A と E の組と C と E の組、B と D の組と B と F の組）は、左右がぎゃくなので同時にはおきない。ほかの 4 つの組み合わせは、B のコマが下で E のコマが上になり、たてにぶつかるので、432 通りにはふくまれない。だから、24 通りは重なりなくひけて、432 − 6 × 4 = 408 通り
    - - どの区画にも 1 こずつ入る（上の 3 つが A、B、C、下の 3 つが D、E、F）。まん中の列の 2 つの区画 B と E の、コマの場所を先に決める。B のコマは 4 通り、E のコマは 4 通りで 16 通り。そのうち、B のコマが下で E のコマが上のときの 2 × 2 = 4 通りは、たてにとなり合うのでだめ。のこる 12 通りが、B と E のコマの場所
      - マス目の列を左から 1 列め、2 列め、…、6 列めとすると、左の列（A と D）は 1、2 列め、まん中の列（B と E）は 3、4 列め、右の列（C と F）は 5、6 列め。左の列と右の列は 2 列以上はなれているので、たがいにぶつかることはない。左の列は左の列とまん中のコマとだけ、右の列は右の列とまん中のコマとだけかかわる。だから、まん中の場所を 1 つ決めたら、左の列のおき方の数 L と右の列のおき方の数 R をべつべつに数えて、L × R をそのまん中の場所の数とする
      - 左の列の数え方：まん中のコマが 3 列めにあるときだけ、そのコマが 2 列めの上下 1 行ずつ（同じ行も）を使えなくする。4 列めにあるコマは左の列から遠い。例 1：B のコマが 3 列め 1 行め、E のコマが 3 列め 3 行め：2 列めの 1、2、3、4 行めがすべて使えず、左の列のコマは 1 列めだけ。A のコマは 1、2 行め、D のコマは 3、4 行めで、2 行めと 3 行めの組だけがとなり合うので 2 × 2 − 1 = 3 通り。L = 3。例 2：B のコマが 3 列め 1 行め、E のコマが 4 列め 3 行め：2 列めの 1、2 行めが使えない。A のコマは 1 列めの 1、2 行めの 2 通り、D のコマは 4 マスのどれでもよく 4 通り。そのうち、A のコマが 2 行めにあって D のコマが 3 行め（1 列めか 2 列め）にある 2 通りがぶつかるので、2 × 4 − 2 = 6 通り。L = 6。右の列の数 R も同じように数える。例 2 の R：E のコマが 4 列め 3 行めなので、5 列めの 2、3、4 行めが使えない。C のコマは 5 列めの 1 行めと 6 列めの 1、2 行めの 3 通り、F のコマは 6 列めの 3、4 行めの 2 通り。そのうち C が 6 列め 2 行め、F が 6 列め 3 行めの 1 通りがぶつかるので、3 × 2 − 1 = 5 通り。R = 5
      - 12 通りを、B のコマが左か右か、E のコマが左か右かで 4 つに分けて、(L × R) を出す。それぞれの中は、区画の中の上の行か下の行かで、(B が上、E が上)、(上、下)、(下、下) の 3 通り（B が下で E が上はだめ）。表（かっこの中は L と R）：B 左、E 左：(3、12)、(3、12)、(3、12) → 36 + 36 + 36 = 108。B 右、E 右：(12、3)、(12、3)、(12、3) → 108。B 右、E 左：(5、6)、(6、6)、(6、5) → 30 + 36 + 30 = 96。B 左、E 右：(6、5)、(6、6)、(5、6) → 96
      - 合計は 108 + 108 + 96 + 96 = 408 通り
    note: 考えどころは 3 つ：①2 × 2 の区画に分けると 1 つの区画に 1 こまでなので、6 つの区画にちょうど 1 こずつ、②区画の中の場所を「左右」と「上下」に分けると、よこにならぶ区画は左右だけ、たてにならぶ区画は上下だけでぶつかるので、4 通り × 4 通りと 3 通り × 3 通り × 3 通りに分けて 16 × 27 = 432、③ななめにとなり合う 4 組を 6 通りずつひく（2 つの組が同時にぶつかることはない）。2 本目は、ななめの数えおとしやひく計算をせず、まん中の列の 2 こを先に決めて、左の列と右の列をべつべつに数える道。1 本目は左右と上下を分けて数えてからななめをひき、2 本目はまん中の列で分けて左右をべつべつに数える。check は、24 マスから 6 マスをえらぶ 134596 通りをすべて、どの 2 つも、行のちがいと列のちがいの大きいほうが 2 以上であるかしらべて数える。4 × 4 に 4 こなら 79 通り（OEIS A018807 の n = 2）で、知られた数なので、4 × 6 に 6 こにした。わなは、ななめをわすれて 432 と答えること。
