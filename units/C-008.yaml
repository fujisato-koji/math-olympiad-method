  - day: 3
    items:
      - part: わけ
        text: 犬がすきな人 7 人、ねこがすきな人 5 人、両方すきな人 3 人のとき、どちらかがすきな人は 7 + 5 − 3 = 9 人です。なぜ 3 をひくのかを、ベン図を使って文で書きましょう。
        svg: |
          <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg">
            <circle cx="95" cy="80" r="50" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
            <circle cx="145" cy="80" r="50" stroke="currentColor" fill="#f3c969" fill-opacity=".35" stroke-width="2"/>
