        paths:
          - [1、2 と 3、4、5 と 7 から 10 は組に入る, もれているのは 6]
      - part: 今日
        text: 図の 4 つを、『赤いもの』と『丸いもの』の 2 つの組に分けようとしました。どちらの組にも入らないものはどれですか。
        figure: 🔴🟥🔵🟦
        choices: [🔴, 🟥, 🔵, 🟦]
