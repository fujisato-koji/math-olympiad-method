    - - 行の番号を上から 1〜6、列の番号を左から 1〜6 とする。はい色のマスは、どれも行と列の番号が同じ。長方形が、ある番号の行とその番号の列の両方をふくむと、その番号のはい色のマスをふくんでしまう。だから、はい色をふくまない長方形は、ふくむ行の番号と、ふくむ列の番号に、同じ番号がない
      - ふくむ行の番号はつづいた数、ふくむ列の番号もつづいた数。この 2 つに同じ番号がないのは、行の番号が全部、列の番号より小さい（対角線の右上がわ）か、全部大きい（左下がわ）かのどちらかだけ。両がわにまたがるものはない
      - 対角線でおりかえすと、右上がわの長方形と左下がわの長方形はぴったり重なるので、数は同じ。右上がわの長方形の数を数えて、2 倍する
      - 右上がわの長方形を、いちばん下の行の番号と、いちばん左の列の番号で分ける（下の行の番号は、左の列の番号より小さい）。いちばん下が 3 行めなら、上のはしは 1、2、3 行めの 3 通り。左のはしが 4、5、6 列めのとき、右のはしはそれぞれ 3、2、1 通りで、あわせて 6 通り。だから 3 × 6 = 18。同じように、いちばん下が 1 行めなら 1 × 15 = 15、2 行めなら 2 × 10 = 20、4 行めなら 4 × 3 = 12、5 行めなら 5 × 1 = 5
      - 15 + 20 + 18 + 12 + 5 = 70 通りが右上がわ。左下がわも同じ 70 通りなので、70 を 2 倍して、全部で 140 こ
    - - 長方形は、横の線 2 本とたての線 2 本で決まる。横の線は上から 0〜6、たての線は左から 0〜6 の番号がついた、7 本ずつ。たとえば横の線 2 と 4、たての線 4 と 6 なら、長方形は 3、4 行めと 5、6 列めのマス
      - はい色のマスは行と列の番号が同じ。長方形がふくむ行は、上の横の線の番号より 1 大きい行めから、下の横の線の番号の行めまで。ふくむ列は、左のたての線の番号より 1 大きい列めから、右のたての線の番号の列めまで。行の番号が全部、列の番号より小さいのは、下の横の線の番号が、左のたての線の番号と同じか、それより小さいとき（右上がわ）。ぎゃくに、行の番号が全部大きい（左下がわ）のは、下と左を入れかえた形
      - 対角線でおりかえすと、右上がわと左下がわの長方形は重なるので、数は同じ。右上がわだけを数えて 2 倍する。右上がわの長方形は、4 つの番号が小さいほうから、上の横の線、下の横の線、左のたての線、右のたての線のじゅんにならぶ。ただし、下の横の線と左のたての線は、同じ番号でもよい
      - 4 つの番号が全部ちがうとき：0〜6 の 7 つの番号から 4 つをえらべば、小さいじゅんに上、下、左、右と決まる。7 つから 4 つえらぶのは、えらばない 3 つを決めるのと同じ数。7 つから 3 つえらぶのは、7 × 6 × 5 = 210 を、ならべ方の 6 通りでわって 35 通り
      - 下の横の線と左のたての線が同じ番号のとき：番号は 3 つで、小さいじゅんに、上の横の線、まん中（下の横の線とたての線）、右のたての線と決まる。7 つから 3 つえらぶので 35 通り。35 + 35 = 70 通りが右上がわで、2 倍して 140 こ
    note: 考えどころは 3 つ：①はい色をさける長方形は、ふくむ行の番号とふくむ列の番号に同じ番号がない。だから、対角線の右上がわか左下がわの一方にしかない（場合分け）、②おりかえすと同じ数なので、右上がわだけを数えて 2 倍にする、③右上がわの数え方を、もれも重なりもない分け方にする。1 本目は、下の行と左の列で分けて、上と右のえらび方をかけて足す。2 本目は、4 つの線の番号の大小で、全部ちがう場合と 2 つが同じ場合に分けて、7 本からえらぶ数にする（1 本目の「場所で分けて足す」とちがう道）。check は、横の線 2 本とたての線 2 本の番号を全部作り、長方形がふくむマスに対角線のマスがひとつもないものを数える（140）。似た既出：「長方形の数」の定番（6 × 6 の長方形は 21 × 21 = 441 こ）に、ふくんではいけないマスを足したもの。
