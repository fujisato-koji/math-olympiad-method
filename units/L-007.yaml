        paths:
          - [🐻 は 1 こから 8 こ, 🐼 は 8 こから 1 こ, 8 通り]
      - part: 今日
        text: 2 つのマスを、1 マスずつ赤か青か黄でぬります。同じ色でもかまいません。左のマスの色で場合に分けて数えましょう。ぬり方は何通りありますか。
        figure: ⬜⬜
        answer: 9
        check: "len(set(itertools.product('赤青黄', repeat=2)))"
        hints:
          - 左のマスが赤、青、黄の場合に分けよう。
          - 左が赤のとき、右のマスは何通りにぬれるかな。
          - 青、黄のときも同じように数えて、合わせよう。
        paths:
          - [左が赤なら右は 3 通り, 左が青でも 3 通り, 左が黄でも 3 通り, 3 と 3 と 3 で 9 通り]
      - part: 挑戦
        text: 🐶 と 🐱 と 🐰 の 3 びきで、あめを 6 こ分けます。みんな 1 こ以上もらいます。分け方は何通りありますか。
        figure: 🍬🍬🍬🍬🍬🍬
        answer: 10
        check: "len([(a, b, c) for a in range(1, 7) for b in range(1, 7) for c in range(1, 7) if a + b + c == 6])"
        hints:
          - 🐶 がもらう数で場合に分けよう。
          - 🐶 が 1 このとき、残りを 🐱 と 🐰 で分ける分け方は何通りかな。
          - 🐶 が 2 こ、3 こ、4 このときも数えて、合わせよう。
        paths:
          - [🐶 が 1 こなら 4 通り, 2 こなら 3 通り, 3 こなら 2 通り, 4 こなら 1 通り, 合わせて 10 通り]

  - day: 2
    items:
      - part: 見本
        text: 1 から 6 までのカードを、2 つの組に分けます。どのカードも、どちらか 1 つの組だけに入るように分けましょう。
        figure: "［1］［2］［3］［4］［5］［6］"
        explain: 『3 より小さい数』と『3 より大きい数』に分けると、3 がどちらにも入りません。これを「もれ」といいます。『3 まで』と『3 から』に分けると、3 が両方に入ります。これを「重なり」といいます。『3 まで』と『4 から』に分けると、どのカードもどちらか 1 つだけに入ります。場合に分けて数えるときは、もれも重なりもない分け方にします。
      - part: 思い出す
        text: 🐶 と 🐱 で、あめを 6 こ分けます。どちらも 1 こ以上もらいます。分け方は何通りありますか。
        figure: 🍬🍬🍬🍬🍬🍬
        answer: 5
        check: "len([(a, b) for a in range(11) for b in range(11) if a + b == 6 and a >= 1 and b >= 1])"
        hints:
          - 🐶 がもらう数で場合に分けよう。
          - 🐶 の数が決まると、🐱 の数も決まるね。
          - 🐱 も 1 こ以上もらえるのは、🐶 が何こまでのときかな。
        paths:
          - [🐶 は 1 こから 5 こ, 🐱 は 5 こから 1 こ, 5 通り]
      - part: 思い出す
        text: 🐶🐱🐰 の 3 びきの並び方を書き出しました。足りない並びはどれですか。
        figure: "🐶🐱🐰\n🐶🐰🐱\n🐱🐶🐰\n🐱🐰🐶\n🐰🐱🐶"
        choices: [🐰🐶🐱, 🐶🐱🐰, 🐱🐰🐶]
        answer: 🐰🐶🐱
        check: "(set(''.join(p) for p in itertools.permutations('🐶🐱🐰')) - set(fig.splitlines())).pop()"
        hints:
          - 左が 🐶 の並びは、いくつ書いてあるかな。
          - 左が 🐱、左が 🐰 の並びも数えよう。
          - 1 つしかない組の、もう 1 つの並びを考えよう。
        paths:
          - [左が 🐶 は 2 つ、左が 🐱 も 2 つ, 左が 🐰 は 1 つしかない, 🐰🐶🐱 が足りない]
      - part: 今日
        text: 1 から 9 までのカードを、『3 まで』『4 から 6 まで』『8 から』の 3 つの組に分けました。どの組にも入らないカードが 1 まいあります。何のカードですか。
        figure: "［1］［2］［3］［4］［5］［6］［7］［8］［9］"
        answer: 7
        check: "(set(range(1, 10)) - set(range(1, 4)) - set(range(4, 7)) - set(range(8, 10))).pop()"
        hints:
          - 1 まいずつ、どの組に入るか調べよう。
          - 『4 から 6 まで』の組のあとは、どのカードから始まっているかな。
          - どの組にも入らないカードをさがそう。
        paths:
          - [1、2、3 は『3 まで』, 4、5、6 は『4 から 6 まで』, 8、9 は『8 から』, もれているのは 7]
      - part: 今日
        text: 図の 4 つを、『赤いもの』と『丸いもの』の 2 つの組に分けようとしました。両方の組に入ってしまうものはどれですか。
        figure: 🔴🟥🔵🟦
        choices: [🔴, 🟥, 🔵, 🟦]
        answer: 🔴
        check: "[x for x in ['🔴', '🟥', '🔵', '🟦'] if x in '🔴🟥' and x in '🔴🔵'][0]"
        hints:
          - 赤いものはどれとどれかな。
          - 丸いものはどれとどれかな。
          - 両方に名前が出てくるものをさがそう。
        paths:
          - [赤いものは 🔴 と 🟥, 丸いものは 🔴 と 🔵, 両方に入るのは 🔴]
        note: 色と形のように、ちがう物差しで分けると重なりやすい。1 つの物差しで分けると、もれも重なりもなくしやすい。
      - part: 今日
        text: 1 から 6 までのカードを 2 つの組に分けます。もれも重なりもない分け方はどれですか。
        figure: "［1］［2］［3］［4］［5］［6］"
        choices: [2 までと 2 から, 3 までと 5 から, 4 までと 5 から]
        answer: 4 までと 5 から
        check: "[x for x, a, b in [('2 までと 2 から', range(1, 3), range(2, 7)), ('3 までと 5 から', range(1, 4), range(5, 7)), ('4 までと 5 から', range(1, 5), range(5, 7))] if set(a) | set(b) == set(range(1, 7)) and not set(a) & set(b)][0]"
        hints:
          - 1 つずつ、どのカードがどちらに入るか書いてみよう。
          - 両方に入るカードや、どちらにも入らないカードはないかな。
          - どのカードもどちらか 1 つだけに入るのはどれかな。
        paths:
          - [2 までと 2 から は 2 が重なる, 3 までと 5 から は 4 がもれる, 4 までと 5 から は もれも重なりもない]
      - part: 挑戦
        text: 🐶🐱🐰 の並び方 6 通りを、『🐶 が左はし』『🐱 がまん中』『🐰 が右はし』の 3 つの組に分けようとしました。どの組にも入らない並びは何通りありますか。
        answer: 2
        check: "len([p for p in itertools.permutations('🐶🐱🐰') if not (p[0] == '🐶' or p[1] == '🐱' or p[2] == '🐰')])"
        hints:
          - 6 通りの並びを全部書き出そう。
          - 1 つずつ、3 つの組のどれに入るか調べよう。
          - どの組にも入らない並びを数えよう。
        paths:
          - [6 通りを書き出す, 🐱🐰🐶 と 🐰🐶🐱 はどの組にも入らない, 2 通り]
        note: 🐶🐱🐰 は 3 つの組の全部に入る（重なり）。この分け方は、もれも重なりもあるので、数えるのには使えないことを話す。
    extra:
      - part: 今日
        text: 1 から 10 までのカードを、『2 まで』『3 から 5 まで』『7 から』の 3 つの組に分けました。どの組にも入らないカードが 1 まいあります。何のカードですか。
        answer: 6
