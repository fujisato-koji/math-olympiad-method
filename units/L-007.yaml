# L-007 場合分けで考える
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く。
# 前提は C-002（書き出して数える）で、たどっても C-001 と N-001（10 までの数）だけなので、数は 10 まで。
# たし算・ひき算・かけ算の式は使わず、場合ごとの数を合わせるときは「3 と 2 で 5」のように N-001 の「いくつといくつ」で言う。
# 表と樹形図（C-003）、道順（C-004）、和の法則と積の法則（C-005）は使わない。形の名前（G-001）も使わず、マスのまとまりと、点を結ぶ線で数える。
# お金の場面は N-060 なので使わず、「5 こ入りの箱とばら」のような入れ物で数をつくる。
# 日の並びは地図の既定（導入、練習 5 日、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：何で分けるかを 1 つ決めて、場合ごとに書き出して数える（あめの分け方、マスのぬり方）。場合の中でもう一度分ける（挑戦）。
#   2 日目 練習：分け方を点検する。どこにも入らないもの（もれ）、2 つに入るもの（重なり）を見つけ、もれも重なりもない分け方を選ぶ。
#   3 日目 練習：数をいくつといくつに分ける場合分け（パックとばら、2 つのサイコロの目、カード 2 まいの組）。
#   4 日目 練習：マスのまとまりを、マスの数（大きさ）で場合に分けて数える。
#   5 日目 練習：条件のある並べ方・選び方を、だれがどこにいるかで場合に分けて数える。
#   6 日目 練習：全部の場合を調べて「必ず」かどうかを決める。1 つでも合わない場合（反対の例）があれば「必ず」とはいえない。
#   7 日目 わけ：代表の例で、場合分けでもれなく重ならずに数えたわけ、「どの場合でも」だから必ずといえるわけを文に書く。
#   8 日目 混ぜる：C-002 の型（並べ方、選び方、足りない並び、2 回書いた選び方）と混ぜる。
#   9 日目 確認。
# あまりで分ける場合分けは N-028、偶奇で分ける場合分けは L-005（この単元の前提にない）なので使わない。
# check：場合を itertools で全部作り（permutations、combinations、product）、条件に合うものを数える。
# 数の分け方は、ありうる数の組を range で全部作って、合わせた数が合うものを数える。
# 分け方の点検は、場合ごとの集まりを set で作り、もれ（全体から引いた残り）と重なり（共通部分）を出す。
# マスのまとまりは、はしの位置の組を全部作って数える。「必ず」の問題は、すべての場合で成り立つか（all）で決める。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした L-005 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# ただし腕だめしの最難関（対角線をさける長方形）だけは例外で、uses に C-005（積の法則）と C-007（選び方）を挙げ、かけ算と 140 までの数を使う。

id: L-007
days:
  - day: 1
    items:
      - part: 見本
        text: 🐶 と 🐱 で、あめを 5 こ分けます。どちらも 1 こ以上もらいます。分け方を、🐶 がもらう数で場合に分けて書き出しましょう。
        figure: 🍬🍬🍬🍬🍬
        explain: 🐶 が 1 こなら 🐱 は 4 こ、🐶 が 2 こなら 🐱 は 3 こ、🐶 が 3 こなら 🐱 は 2 こ、🐶 が 4 こなら 🐱 は 1 こです。🐶 が 5 こだと 🐱 がもらえないので入りません。🐶 がもらう数で分けると、どの分け方もどれか 1 つの場合に入るので、数えもれも、2 回数えることもありません。分け方は 4 通りです。
      - part: 思い出す
        text: 🍎 と 🍌 と 🍇 を 1 列に並べます。並べ方は何通りありますか。
        answer: 6
        check: "len(set(itertools.permutations('🍎🍌🍇')))"
        hints:
          - 紙に並びを書き出してみよう。
          - 左に来るものを 1 つ決めて、残りの並べ方を書こう。
          - 書いた並びに、同じものがないか見よう。
        paths:
          - [左が 🍎 の並びは 2 つ, 左が 🍌 の並びも 2 つ, 左が 🍇 の並びも 2 つ, 数えて 6 通り]
      - part: 思い出す
        text: 🐶 と 🐱 と 🐰 から 2 ひきを選びます。選び方は何通りありますか。
        answer: 3
        check: "len(set(itertools.combinations('🐶🐱🐰', 2)))"
        hints:
          - 選び方を書き出してみよう。
          - 「🐶 と 🐱」を選ぶのと「🐱 と 🐶」を選ぶのは、同じ選び方だね。
          - 選ばれない 1 ぴきがだれかを考えてもいいよ。
        paths:
          - [🐶🐱、🐶🐰、🐱🐰, 3 通り]
          - [選ばれない 1 ぴきは 🐶、🐱、🐰 のどれか, 3 通り]
      - part: 今日
        text: 🐻 と 🐼 で、くりを 7 こ分けます。どちらも 1 こ以上もらいます。🐻 がもらう数で場合に分けて数えましょう。分け方は何通りありますか。
        figure: 🌰🌰🌰🌰🌰🌰🌰
        answer: 6
        check: "len([(a, b) for a in range(11) for b in range(11) if a + b == 7 and a >= 1 and b >= 1])"
        hints:
          - 🐻 がもらう数を、1 こ、2 こ…と順に決めよう。
          - 🐻 の数が決まると、🐼 の数は 1 つに決まるね（7 は 1 といくつ、2 といくつ…）。
          - 🐼 も 1 こ以上もらえるのは、🐻 が何こまでのときかな。
        paths:
          - [🐻 は 1 こから 6 こ, 🐼 は 6 こから 1 こ, 6 通り]
        note: 🐻 が 7 こ（🐼 が 0 こ）まで数えてしまいやすい。「どちらも 1 こ以上」を確かめる。
      - part: 今日
        text: 図の ○ はコップです。5 つのコップが 1 列に並んでいます。このうち 4 つにジュースを入れます。ジュースを入れないコップがどれかで場合に分けて数えましょう。入れ方は何通りありますか。
        figure: ○○○○○
        answer: 5
        check: "len([s for s in itertools.product([0, 1], repeat=5) if sum(s) == 4])"
        hints:
          - 入れる 4 つのコップより、入れないコップ 1 つがどれかを見よう。
          - 入れないコップが 1 つ目のとき、2 つ目のとき…と、コップごとに分けて書こう。
          - 入れないコップが決まれば、入れ方も 1 つに決まるね。どのコップの場合も数えもれていないかな。
        paths:
          - [入れないのが 1 つ目のコップ, 入れないのが 2 つ目のコップ, 入れないのが 3 つ目のコップ, 入れないのが 4 つ目のコップ, 入れないのが 5 つ目のコップ, 数えて 5 通り]
          - [入れる 4 つのコップを、左から数えた番号で書き出す, 1 と 2 と 3 と 4、1 と 2 と 3 と 5、1 と 2 と 4 と 5、1 と 3 と 4 と 5、2 と 3 と 4 と 5, 5 組あるので 5 通り]
        note: 「4 つ入れるから 4 通り」と、入れる数をそのまま答えやすい。入れない 1 つがどれかで分けると、同じ組を 2 回書いたり書きもらしたりせずに数えられる。次のマスの問題でも、青の 1 マスがどこかで数える見方を使う。
      - part: 今日
        text: 3 つのマスを、1 マスずつ赤か青でぬります。全部同じ色でもかまいません。赤のマスがいくつかで場合に分けて数えましょう。ぬり方は全部で何通りありますか。
        figure: ⬜⬜⬜
        answer: 8
        check: "len(set(itertools.product('赤青', repeat=3)))"
        hints:
          - 赤が 0 マス、1 マス、2 マス、3 マスの場合に分けよう。
          - 赤が 1 マスのとき、赤はどのマスにぬれるかな。
          - 場合ごとの数を合わせよう。
        paths:
          - [赤 0 マスは 1 通り, 赤 1 マスは 3 通り, 赤 2 マスは 3 通り, 赤 3 マスは 1 通り, 合わせて 8 通り]
        note: 赤 2 マスのときは「青の 1 マスがどこか」で数えると、赤 1 マスのときと同じ 3 通りになる。思いつくままに書くと、もれやすい。
      - part: 今日
        text: 🐻 と 🐼 で、クッキーを 4 まい分けます。こんどは、1 まいももらわなくてもよいことにします。分け方は何通りありますか。
        figure: 🍪🍪🍪🍪
        answer: 5
        check: "len([(a, b) for a in range(11) for b in range(11) if a + b == 4])"
        hints:
          - 🐻 がもらう数で場合に分けよう。
          - こんどは、🐻 が 0 まいの場合もあるね。
          - 🐻 がいちばん多くもらうのは、何まいのときかな。
        paths:
          - [🐻 は 0 まいから 4 まい, 🐼 は 4 まいから 0 まい, 5 通り]
        note: 0 まいの場合をわすれやすい。「もらわなくてもよい」なら、0 まいも 1 つの場合。
      - part: 挑戦
        text: 🐶 と 🐱 と 🐰 の 3 びきで、あめを 5 こ分けます。みんな 1 こ以上もらいます。🐶 がもらう数で場合に分けて数えましょう。分け方は何通りありますか。
        figure: 🍬🍬🍬🍬🍬
        answer: 6
        check: "len([(a, b, c) for a in range(1, 6) for b in range(1, 6) for c in range(1, 6) if a + b + c == 5])"
        hints:
          - まず 🐶 が 1 このときを考えよう。残りは何こかな。
          - 残りを 🐱 と 🐰 で分ける分け方を数えよう（どちらも 1 こ以上）。
          - 🐶 が 2 こ、3 このときも同じように数えて、合わせよう。
        paths:
          - [🐶 が 1 こなら残り 4 こを 2 ひきで分けて 3 通り, 🐶 が 2 こなら残り 3 こで 2 通り, 🐶 が 3 こなら残り 2 こで 1 通り, 3 と 2 と 1 で 6 通り]
          - ["3 びきに 1 こずつ配ると、あめは 2 こ残る", "残り 2 こを分けると、(2,0,0) の入れかえ 3 通りと (1,1,0) の入れかえ 3 通り", "3 + 3 = 6 通り"]
        note: 場合の中で、もう一度場合に分けている（2 だんの場合分け）。紙に 🐶 の数ごとの行を作って書き出すとよい。
    extra:
      - part: 今日
        text: 🐻 と 🐼 で、くりを 9 こ分けます。どちらも 1 こ以上もらいます。分け方は何通りありますか。
        figure: 🌰🌰🌰🌰🌰🌰🌰🌰🌰
        answer: 8
        check: "len([(a, b) for a in range(11) for b in range(11) if a + b == 9 and a >= 1 and b >= 1])"
        hints:
          - 🐻 がもらう数で場合に分けよう。
          - 🐻 の数が決まると、🐼 の数も決まるね。
