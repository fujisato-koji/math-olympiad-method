# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 道筋, 手数]
    text: 7 × 8 − 7 + 1 × 2 の式に ( ) を 1 組つけて、答えをできるだけ大きくします。一番大きい答えはいくつですか。
    answer: 100
    check: "max(7 * 8 - 7 + 1 * 2, 7 * (8 - 7) + 1 * 2, 7 * (8 - 7 + 1) * 2, 7 * (8 - 7 + 1 * 2), (7 * 8 - 7 + 1) * 2, 7 * 8 - (7 + 1) * 2, 7 * 8 - (7 + 1 * 2), (7 * 8 - 7) + 1 * 2)"
    hints:
      - ( ) をつけないときの答えを、まず計算しよう。
      - 答えを大きくするには、かける数をできるだけ大きくするとよさそうだね。さいごの「× 2」は、どこまでかけられるかな。
      - ( ) の始まりと終わりの場所を変えて、いくつかためして、くらべよう。
    paths:
      - [( ) がないと 56 − 7 + 2 = 51, さいごの × 2 を前の全部にかけると (7 × 8 − 7 + 1) × 2, ( ) の中は 56 − 7 + 1 = 50, 50 × 2 = 100]
      - [7 × (8 − 7 + 1) × 2 = 28 や 7 × 8 − (7 + 1) × 2 = 40 などもためす, どれも 100 より小さい, 100]
    note: ( ) の中でも × を先にするきまり（( ) の中の 7 × 8 を先に）を使いながら、どこに ( ) をつけると大きくなるかを考える。7 × (8 − 7 + 1) × 2 のように、かけ算の間に ( ) を入れたくなるが、さいごの × 2 を前の全体にかけるのが一番大きい。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [A-002]
    text: (□ + 3) × 6 − 32 ÷ 4 = 40 です。□ に入る数はいくつですか。
    answer: 5
    check: "[x for x in range(0, 20) if (x + 3) * 6 - 32 // 4 == 40][0]"
    hints:
      - 計算の順番を考えよう。先に計算できるところはどこかな。32 ÷ 4 はいくつかな。
      - (□ + 3) × 6 から 32 ÷ 4 の答えをひくと 40 だね。(□ + 3) × 6 はいくつかな。
      - □ + 3 に 6 をかけるとその数になる。□ + 3 はいくつかな。
    paths:
      - [32 ÷ 4 = 8 なので (□ + 3) × 6 − 8 = 40, (□ + 3) × 6 = 40 + 8 = 48, □ + 3 = 48 ÷ 6 = 8, □ = 8 − 3 = 5]
    note: 計算の順番（( ) の中、× と ÷、+ と − の順）をさかのぼって □ を求める。A-002 では + と − の □ だけだったのを、× ÷ と ( ) の入った式にのばす。さいごに計算するところから逆にもどすのが道筋。
  - part: 離
    kinds: [読み取り, 手数]
    text: 兄は、1 箱に 8 本ずつ入ったえん筆を 4 箱と、ばらで 5 本持っています。弟は、同じ箱を 2 箱と、ばらで 3 本持っています。2 人のえん筆を全部あわせて、8 人で同じ数ずつ分けると、1 人何本になりますか。
    answer: 7
    check: "(8 * 4 + 5 + 8 * 2 + 3) // 8"
    hints:
      - 兄のえん筆と弟のえん筆は、それぞれ何本かな。弟の箱にも 8 本ずつ入っているよ。
      - 全部を 8 人で分けるので、( ) を使って 1 つの式に書いてみよう。
      - ( ) の中を先に計算してから、8 でわろう。
    paths:
