# N-076 計算の順序（かっこ、かけ算とわり算を先に）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は小 4 までの漢字で書く（順・説・例・残 は漢字。確・個・比・並・枚・序
#   などはかなで書く。「順序」は「順番」と言う）。分かち書きはしない。数の前後には空白を入れる。
#   「×」は U+00D7、「÷」は U+00F7、「−」は U+2212。check では「*」「//」「-」。
# 前提は N-015（入れかえ・まとめ・分ける、( ) は先に計算するしるし、× と + では × が先）と N-014（わり算とあまり）。
#   N-015 で出した 2 つのきまりを、4 つの計算（+、−、×、÷）の順番の 3 つのきまりにまとめる：
#   ① ( ) の中を先に、② × と ÷ を + と − より先に、③ 同じなかま（+ と −、× と ÷）だけなら前から順に。( ) の中でも ② と ③ を使う。
#   N-009（1000 までの数）は前提のたどりにないので、とちゅうの数も答えも 100 まで。かけ算は九九と、N-015 の分けるでできる
#   2 けた × 1 けた（答えが 100 まで）。わり算は九九の範囲（わる数 1〜9、商は 9 まで）で、わり切れるものだけ。
#   とちゅうでひけなくなる式と、0 でわる式は出さない。お金（N-060）と長さ（G-046）は前提にないので、場面は、こ数、本数にした。
# 場面の式を選ぶ問題は「1 つ分の数 × いくつ分」の形を正しい答えにする（N-013）。check は、選択肢ごとの式の値を計算して、
#   場面の数（ふくろごとにたした数）と合うものを選ぶ。( ) をつける問題と記号を入れる問題も、選択肢ごとの値を計算して選ぶ
#   （選択肢の値はたがいにちがう）。
# わけは代表の例で文に書く（段 3）。× を先にするのは「× はいくつ分のまとまりを表すから」、× と ÷ を前から順にするのは
#   「場面の順に計算するから」、( ) は「ひとまとまりにする」しるし、と場面で言う。
# 日の並び（既定）：1 日目 導入（3 つのきまり）、2 日目 練習（前から順に、場面の式、( ) をつける。頭に見本）、3 日目 わけ、4 日目 確認。

id: N-076
days:
  - day: 1
    items:
      - part: 見本
        text: 20 − 3 × 4 と (20 − 3) × 4 を計算しよう。
        explain: 計算の順番には 3 つのきまりがあります。① ( ) があれば、( ) の中を先に計算する。② × と ÷ は、+ と − より先に計算する。③ + と − だけ、または × と ÷ だけの式は、前から順に計算する。20 − 3 × 4 は、× を先にして 3 × 4 = 12、20 − 12 = 8 です。(20 − 3) × 4 は、( ) の中を先にして 20 − 3 = 17、17 × 4 = 68 です。÷ も × と同じで、5 + 12 ÷ 3 は 12 ÷ 3 = 4 を先にして 5 + 4 = 9 です。
      - part: 思い出す
        text: 16 × 5 を、16 を 10 と 6 に分けて計算しましょう。
        answer: 80
        check: "10 * 5 + 6 * 5"
        hints:
          - 10 が 5 こ分はいくつかな。
          - 6 が 5 こ分はいくつかな。
          - 2 つの答えを合わせよう。
        paths:
          - [10 × 5 = 50, 6 × 5 = 30, 50 + 30 = 80]
