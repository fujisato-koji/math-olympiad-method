      - [箱は全部で 6 箱で 8 × 6 = 48 本, ばらは 5 + 3 = 8 本で もう 1 箱分, 8 本が 7 箱分なので、8 人で分けると 1 人 7 本]
    note: 場面から数を読み取って 1 つの式に表す（( ) で全体をまとめてから ÷）。8 × 4 + 5 + 8 × 2 + 3 ÷ 8 のように ( ) を落とすと計算の順番が変わる。2 本目は、ばらの 8 本が 1 箱分になることに気づく見方。
