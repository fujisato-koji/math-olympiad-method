        svg: '<svg viewBox="0 0 198 198" xmlns="http://www.w3.org/2000/svg"><line x1="16" y1="114" x2="184" y2="114" stroke="currentColor" fill="none" stroke-width="2"/><line x1="84" y1="182" x2="84" y2="14" stroke="currentColor" fill="none" stroke-width="2"/><path d="M184 114 L176 110 L176 118 Z" fill="currentColor"/><path d="M84 14 L80 22 L88 22 Z" fill="currentColor"/><text x="186" y="128" font-size="14" text-anchor="end" font-style="italic">x</text><text x="91" y="20" font-size="14" text-anchor="start" font-style="italic">y</text><text x="80" y="127" font-size="11" text-anchor="end">O</text><line x1="48" y1="186" x2="135" y2="12" stroke="currentColor" fill="none" stroke-width="2.5"/><line x1="12" y1="78" x2="186" y2="165" stroke="currentColor" fill="none" stroke-width="2.5"/><line x1="114" y1="171" x2="114" y2="27" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="114" cy="54" r="3.5" fill="currentColor"/><text x="120" y="48" font-size="13" text-anchor="start" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">P(1, <tspan font-style="italic">m</tspan>₁)</text><circle cx="114" cy="129" r="3.5" fill="currentColor"/><text x="120" y="143" font-size="13" text-anchor="start" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">Q(1, <tspan font-style="italic">m</tspan>₂)</text><text x="115.8" y="110" font-size="10" text-anchor="start" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">1</text></svg>'
        explain: 例：「傾きが等しい直線は平行なので、2 直線をそれぞれ平行に動かして原点を通る y = m₁x、y = m₂x にしても、垂直かどうかは変わらない。P(1, m₁) は y = m₁x の上、Q(1, m₂) は y = m₂x の上の点である。2 直線が垂直なとき ∠POQ = 90° なので、三平方の定理から OP² + OQ² = PQ² である。2 点間の距離の式から OP² = 1 + m₁²、OQ² = 1 + m₂²、PQ² = (m₁ − m₂)² なので、2 + m₁² + m₂² = m₁² − 2m₁m₂ + m₂²。整理すると 2 = −2m₁m₂、すなわち m₁m₂ = −1 である。逆に m₁m₂ = −1 ならば OP² + OQ² = PQ² となり、三平方の定理の逆から ∠POQ = 90° で、2 直線は垂直である。」と書ければよい。① 平行に動かして原点を通る 2 直線と P、Q を決める、② 距離の式で OP²、OQ²、PQ² を表し、展開して整理する、③ 約束した事実（三平方の定理とその逆、2 点間の距離）で結ぶ、の 3 つを見る。y 軸に平行な直線（傾きがない）と x 軸に平行な直線の組は、この式の外であることにも触れる。
        hints:
          - ∠POQ = 90° のとき、三平方の定理から、OP、OQ、PQ の間にどんな式が成り立つでしょう。
          - OP²、OQ²、PQ² を、2 点間の距離の式で m₁、m₂ を使って表しましょう。
          - 式を展開して整理しましょう。
        paths:
          - ["原点を通る 2 直線として P(1, m₁)、Q(1, m₂) をとる", "OP² + OQ² = PQ²（三平方の定理）", "2 + m₁² + m₂² = (m₁ − m₂)²", "m₁m₂ = −1"]
