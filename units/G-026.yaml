        answer: (3, 7/5)
        check: "[k for k, p in {'(3, 7/5)': (3, Fraction(7, 5)), '(1, 13/5)': (1, Fraction(13, 5)), '(2, 2)': (2, 2), '(3, 13/5)': (3, Fraction(13, 5))}.items() if p == (Fraction(2 * (-3) + 3 * 7, 5), Fraction(2 * 5 + 3 * (-1), 5))][0]"
        hints:
          - 内分する点の式で、m = 3、n = 2 です。
          - B の座標に 3 を、A の座標に 2 をかけます。
          - AP:PB = 3:2 なので、P は B に近い点です。
        paths:
          - ["x = (2 × (−3) + 3 × 7)/5 = 15/5 = 3", "y = (2 × 5 + 3 × (−1))/5 = 7/5", "(3, 7/5)"]
        note: 3 と 2 を逆にかけると (1, 13/5)（2:3 に内分する点）になる。(2, 2) は中点。
