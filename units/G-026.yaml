# G-026 座標と図形の方程式（直線と円）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 と G-050 に合わせる（負の数は「−」U+2212、座標の組と式は選ぶ問題）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜5 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 2 点間の距離（三平方の定理）、中点、線分を m:n に内分する点　2 日目 直線の式（点と傾き、2 点、y 軸に平行な直線、
#   ax + by + c = 0）、2 直線の交点　3 日目 平行と垂直の条件（m₁m₂ = −1）、垂直二等分線、直線について対称な点、点と直線の距離
#   4 日目 円の式（中心と半径、平方完成で中心と半径を読む、直径の両はし、3 点を通る円）
#   5 日目 円と直線（共有点、共有点の個数、弦の長さ、円の上の点における接線）
#   6 日目 わけ（2 点間の距離の式、垂直の条件、内分点の式。どれも ③）　7 日目 A-019・G-019 と混ぜる（座標で面積、
#   等しい距離の点、原点を通る接線、接線の長さ）　8 日目 確認
# 前提は A-019（1 次関数とグラフ）と G-019（三平方の定理）。前提のたどりに A-012（連立方程式）、A-017（2 次方程式、平方完成、
#   b² − 4ac の符号）、A-016（平方根）、G-050（座標平面）、G-020（平行線と線分の比、相似）、G-017（二等辺三角形）がある。
#   三角比（G-024）と円周角（G-018）は前提のたどりにないので、直線のなす角や「直径に対する円周角は直角」は使わない
#   （3 点を通る円は、一般形に代入するか、垂直二等分線の交点で求める）。ベクトル（G-027）も使わない。
#   不等式（A-013）も前提にないので、不等式の表す領域は扱わず、共有点の個数は 2 次方程式の b² − 4ac の符号と、
#   中心と直線の距離と半径を数としてくらべることで調べる。軌跡と 2 つの円の位置関係は扱わない。
#   3 つの文字の連立方程式は A-012 で扱っていないので、3 点を通る円は 1 点が原点のもの（n = 0 になる）にした。
#   円の接線が接点を通る半径に垂直であることは、5 日目の見本で「接点を通り半径に垂直な直線は、中心からの距離が半径に等しい」と
#   点と直線の距離で確かめてから使った（G-054 は前提にない）。点と直線の距離の式は、3 日目の見本で相似（G-020）から導いた。
# 座標の組、直線と円の式、中心と半径の組は選ぶ問題にした。打つ答えは、距離、傾き、切片、個数、文字の値（Fraction）。
#   式を選ぶ問題の check は、選択肢の式（lambda）が、問題の点をすべて通るか、傾きの条件を満たすかで選び出す。
#   接線を選ぶ問題の check は、ax + by = c が接点を通り、原点からの距離が半径に等しい（c² = r²(a² + b²)）ものを選ぶ。
# 下つきの数字は x₁、y₁ のように書いた。図は svg（D-040）。座標平面は方眼と目もりつきで、求める点や交点の座標は図に書かない。
# 座標と図形の方程式は、ベクトル（G-027）、三角関数（G-025）、2 次曲線（G-041）、空間の座標（G-049）、CAD（E-204）、
#   コンピュータの図形処理と位置の推定の入口になる（D-026）。

id: G-026
days:
  - day: 1
    items:
      - part: 見本
        text: 2 点 A(1, 2)、B(4, 6) の間の距離と、線分 AB の中点 M、AB を 2:1 に内分する点を求めてみましょう。
        svg: '<svg viewBox="0 0 188 208" xmlns="http://www.w3.org/2000/svg"><g stroke="currentColor" stroke-opacity=".18" stroke-width="1" fill="none"><line x1="24" y1="184" x2="24" y2="24"/><line x1="44" y1="184" x2="44" y2="24"/><line x1="64" y1="184" x2="64" y2="24"/><line x1="84" y1="184" x2="84" y2="24"/><line x1="104" y1="184" x2="104" y2="24"/><line x1="124" y1="184" x2="124" y2="24"/><line x1="144" y1="184" x2="144" y2="24"/><line x1="164" y1="184" x2="164" y2="24"/><line x1="24" y1="184" x2="164" y2="184"/><line x1="24" y1="164" x2="164" y2="164"/><line x1="24" y1="144" x2="164" y2="144"/><line x1="24" y1="124" x2="164" y2="124"/><line x1="24" y1="104" x2="164" y2="104"/><line x1="24" y1="84" x2="164" y2="84"/><line x1="24" y1="64" x2="164" y2="64"/><line x1="24" y1="44" x2="164" y2="44"/><line x1="24" y1="24" x2="164" y2="24"/></g><line x1="16" y1="164" x2="174" y2="164" stroke="currentColor" fill="none" stroke-width="2"/><line x1="44" y1="192" x2="44" y2="14" stroke="currentColor" fill="none" stroke-width="2"/><path d="M174 164 L166 160 L166 168 Z" fill="currentColor"/><path d="M44 14 L40 22 L48 22 Z" fill="currentColor"/><text x="176" y="178" font-size="14" text-anchor="end" font-style="italic">x</text><text x="51" y="20" font-size="14" text-anchor="start" font-style="italic">y</text><text x="40" y="177" font-size="11" text-anchor="end">O</text><text x="24" y="177" font-size="10" text-anchor="middle">−1</text><text x="64" y="177" font-size="10" text-anchor="middle">1</text><text x="84" y="177" font-size="10" text-anchor="middle">2</text><text x="104" y="177" font-size="10" text-anchor="middle">3</text><text x="124" y="177" font-size="10" text-anchor="middle">4</text><text x="144" y="177" font-size="10" text-anchor="middle">5</text><text x="164" y="177" font-size="10" text-anchor="middle">6</text><text x="40" y="187.5" font-size="10" text-anchor="end">−1</text><text x="40" y="147.5" font-size="10" text-anchor="end">1</text><text x="40" y="127.5" font-size="10" text-anchor="end">2</text><text x="40" y="107.5" font-size="10" text-anchor="end">3</text><text x="40" y="87.5" font-size="10" text-anchor="end">4</text><text x="40" y="67.5" font-size="10" text-anchor="end">5</text><text x="40" y="47.5" font-size="10" text-anchor="end">6</text><text x="40" y="27.5" font-size="10" text-anchor="end">7</text><line x1="64" y1="124" x2="124" y2="124" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="124" y1="124" x2="124" y2="44" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="64" y1="124" x2="124" y2="44" stroke="currentColor" fill="none" stroke-width="2.5"/><circle cx="64" cy="124" r="3.5" fill="currentColor"/><text x="58" y="118" font-size="13" text-anchor="end" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">A</text><circle cx="124" cy="44" r="3.5" fill="currentColor"/><text x="130" y="38" font-size="13" text-anchor="start" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">B</text><circle cx="124" cy="124" r="3.5" fill="currentColor"/><text x="130" y="138" font-size="13" text-anchor="start" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">C</text><circle cx="94" cy="84" r="3.5" fill="currentColor"/><text x="88" y="80" font-size="13" text-anchor="end" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">M</text></svg>'
        explain: 点 C(4, 2) をとると、△ABC は ∠C = 90° の直角三角形で、AC = 4 − 1 = 3、BC = 6 − 2 = 4 です。三平方の定理から AB² = 3² + 4² = 25 なので、AB = 5 です。一般に、2 点 A(x₁, y₁)、B(x₂, y₂) の間の距離は AB = √((x₂ − x₁)² + (y₂ − y₁)²) です（わけは 6 日目）。原点 O と点 (x, y) の距離は √(x² + y²) です。線分 AB の上にあって AP:PB = m:n となる点 P を、AB を m:n に内分する点といい、その座標は ((nx₁ + mx₂)/(m + n), (ny₁ + my₂)/(m + n)) です（わけは 6 日目）。m を B の座標に、n を A の座標にかけます（AP:PB = 2:1 なら、P は B に近い）。中点は m = n のときで、((x₁ + x₂)/2, (y₁ + y₂)/2) です。この例では、中点 M は ((1 + 4)/2, (2 + 6)/2) = (5/2, 4)、2:1 に内分する点は ((1 × 1 + 2 × 4)/3, (1 × 2 + 2 × 6)/3) = (3, 14/3) です。
      - part: 思い出す
        text: 直角をはさむ 2 辺の長さが 8 と 15 の直角三角形で、斜辺の長さはいくつですか。
        answer: 17
        check: "[c for c in range(1, 100) if c * c == 8 * 8 + 15 * 15][0]"
        hints:
          - 三平方の定理を使いましょう（G-019）。
          - 8² + 15² を計算しましょう。
          - 2 乗すると その数になる正の数をさがしましょう。
        paths:
          - ["8² + 15² = 64 + 225 = 289", "17² = 289", "斜辺は 17"]
      - part: 思い出す
        text: 2 点 (−1, 3)、(3, 11) を通る直線の傾きはいくつですか。
        answer: 2
        check: "Fraction(11 - 3, 3 - (-1))"
        hints:
          - 傾きは、(y の増える量) ÷ (x の増える量) です（A-019）。
          - x は −1 から 3 まで、いくつ増えるでしょう。
          - y の増える量をわりましょう。
        paths:
          - ["x の増える量は 4", "y の増える量は 8", "傾きは 8 ÷ 4 = 2"]
      - part: 今日
        text: 2 点 A(−2, 1)、B(4, 9) の間の距離はいくつですか。
        answer: 10
        check: "[d for d in range(1, 100) if d * d == (4 - (-2)) ** 2 + (9 - 1) ** 2][0]"
        hints:
          - x 座標の差と、y 座標の差を求めましょう。
          - AB² = (x 座標の差)² + (y 座標の差)² です。
          - 2 乗すると その数になる正の数をさがしましょう。
        paths:
          - ["x 座標の差は 6、y 座標の差は 8", "AB² = 36 + 64 = 100", "AB = 10"]
        note: 4 − (−2) を 2 としやすい。負の数をひくときの符号に気をつけさせる。
      - part: 今日
        text: 2 点 A(−3, 5)、B(7, −1) を結ぶ線分 AB を 3:2 に内分する点の座標はどれですか。
