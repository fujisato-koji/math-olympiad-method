in:round">B</text><text x="178" y="150" font-size="12" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round">B′</text><text x="101" y="78" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round"><tspan font-style="italic">m</tspan></text><text x="156" y="49.4" font-size="13" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface-2,#fff);stroke-width:4px;stroke-linejoin:round"><tspan font-style="italic">n</tspan></text></svg>'
        explain: 例：「A、P、B から x 軸に垂線をひき、足をそれぞれ A′、P′、B′ とする。AA′、PP′、BB′ は平行なので、平行線にはさまれた線分の比（G-020）から A′P′:P′B′ = AP:PB = m:n である。P の x 座標を x とすると、x₁ < x₂ のとき A′P′ = x − x₁、P′B′ = x₂ − x なので、(x − x₁):(x₂ − x) = m:n。比が等しいので n(x − x₁) = m(x₂ − x)、nx − nx₁ = mx₂ − mx、(m + n)x = nx₁ + mx₂ で、x = (nx₁ + mx₂)/(m + n) である。x₁ > x₂ のときも、長さが x₁ − x、x − x₂ となって同じ式になり、x₁ = x₂ のときは x = x₁ でこの式も x₁ になる。y 座標も、y 軸に垂線をひいて同じように示せる。」と書ければよい。① 垂線の足を決め、P の x 座標を x とする、② 比の式を 1 次方程式に直して解く、③ 約束した事実（平行線と線分の比）で結ぶ、の 3 つを見る。中点（m = n）で確かめただけなら、例ではすべての m:n を示せないことを話す。
        hints:
          - A、P、B から x 軸に垂線をひきましょう。
          - 垂線の足どうしの間の長さの比は、どうなるでしょう（G-020）。
          - P の x 座標を x とおいて、比の式を方程式に直しましょう。
        paths:
          - ["垂線の足 A′、P′、B′ をとる", "A′P′:P′B′ = m:n（平行線と線分の比）", "(x − x₁):(x₂ − x) = m:n", "n(x − x₁) = m(x₂ − x) を解いて x = (nx₁ + mx₂)/(m + n)"]
