ri:
  - part: 離
    kinds: [道筋, 読み取り]
    uses: [P-187]
    text: なめらかな坂の下から、球を上へ打ち出しました。球の速さは一定のわりあいで減り、坂の上で止まると、こんどは同じわりあいで速くなりながら坂を下ってきます。打ち出してからの 1 秒間に、球は 18 m 上りました。また、打ち出した所から 42 m 上の点 P を、上りで通ってから下りでまた通るまでに 4 秒かかりました。打ち出した所から止まった所までの、坂の長さは何 m ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="170" x2="290" y2="60" fill="none" stroke="currentColor" stroke-width="2"/><line x1="30" y1="170" x2="124" y2="130" fill="none" stroke="#f08080" stroke-width="7"/><text x="95" y="112" font-size="14" text-anchor="middle" fill="currentColor">はじめの 1 秒：18 m</text><circle cx="30" cy="170" r="6" fill="currentColor"/><text x="40" y="190" font-size="14" text-anchor="middle" fill="currentColor">打ち出す</text><circle cx="236" cy="83" r="6" fill="#3a7bd5"/><text x="250" y="104" font-size="15" text-anchor="middle" fill="currentColor">P</text><text x="205" y="145" font-size="13" text-anchor="middle" fill="currentColor">打ち出した所から P まで 42 m</text><text x="205" y="165" font-size="13" text-anchor="middle" fill="currentColor">P を 2 回通るあいだ：4 秒</text><rect x="277" y="27" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="290" y="45" font-size="16" text-anchor="middle" fill="currentColor">？</text></svg>'
    answer: 50
    check: "min(Fraction(18, 2 * n - 1) * n * n for n in [Fraction(2 * 42 + math.isqrt((2 * 42) ** 2 + 4 * 18 * (18 * 4 - 42)), 2 * 18)])"
    hints:
      - 止まった所から見ると、P から止まるまでの上りと、止まってから P にもどるまでの下りは、同じ動きを向きだけ変えたものです。4 秒はどう分かれるでしょう。
      - text: 時間をまきもどして止まった所から見ると、止まっていた球が一定のわりあいで速くなって下ってくる動きです。1 秒ごとに進む長さは 1 対 3 対 5 対 7 … の比で、P は止まった所から 2 秒分下がった所です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="40" y1="150" x2="280" y2="150" fill="none" stroke="currentColor" stroke-width="2"/><rect x="50.8" y="135" width="38.4" height="15" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="70" y="166" font-size="13" text-anchor="middle" fill="currentColor">1 秒目</text><rect x="110.8" y="105" width="38.4" height="45" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="130" y="166" font-size="13" text-anchor="middle" fill="currentColor">2 秒目</text><rect x="170.8" y="75" width="38.4" height="75" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="190" y="166" font-size="13" text-anchor="middle" fill="currentColor">3 秒目</text><rect x="230.8" y="45" width="38.4" height="105" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="250" y="166" font-size="13" text-anchor="middle" fill="currentColor">4 秒目</text><rect x="42" y="24" width="116" height="130" rx="6" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="95" y="112" font-size="14" text-anchor="middle" fill="currentColor">はじめの 1 秒：18 m</text><text x="100" y="18" font-size="13" text-anchor="middle" fill="currentColor">止まった所から P まで</text><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">止まった所から数えた 1 秒ごとの長さ（比）</text></svg>'
      - 比の 1 つ分を □ m、止まるまでを ○ 秒とします。はじめの 1 秒の 18 m と、打ち出した所から P までの 42 m は、それぞれ □ のいくつ分でしょう。○ に 3、4、5 … を入れてくらべます。
    paths:
      - [止まった所から逆に見ると 1 秒ごとの長さは 1 対 3 対 5 対 7 … の比, P を上りで通ってから止まるまでと止まってから P にもどるまでは同じ 2 秒なので、P は止まった所から 1 + 3 = 4 つ分下, 止まるまでを n 秒とすると、はじめの 1 秒は 2 × n − 1 つ分で 18 m、打ち出した所から P までは n × n − 4 つ分で 42 m, n = 5 なら 9 つ分が 18 m で 1 つ分は 2 m、21 つ分は 2 × 21 = 42 m で合う, 坂の長さは 25 つ分で 2 × 25 = 50 m]
      - [加速度の大きさを a とすると、P は止まった所から 2 秒で下る長さ a × 2 × 2 ÷ 2 = 2 × a だけ下にある, はじめの速さを v とすると、はじめの 1 秒は v − a ÷ 2 = 18 m、止まるまでの長さは v × v ÷ (2 × a) = 42 + 2 × a, v = 18 + a ÷ 2 を入れて整理すると 5 × a × a + 88 × a − 432 = 0 で a = 4 m/s²、v = 20 m/s, 坂の長さは 20 × 20 ÷ 8 = 50 m]
    note: S16 後ろから考える、S04 言いかえ（止まる動きを、止まった所から速くなる動きに見る）、S03 対称性（P から止まるまでと止まってから P までが同じ 2 秒）。種なし（等加速度の 1 対 3 対 5 の比と、上りと下りの対称が鍵）。1 回目：はじめの 1 秒と最後の 1 秒をそのまま言うと、最後の 1 秒から加速度がすぐ出て手順を当てればすんだ。最後の 1 秒を言わず、P を 2 回通るあいだの時間にかえたので、下りが上りを逆にしたものと見て P が止まった所から 2 秒分下だと気づく一手と、止まるまでの秒数 n を 18 と 42 の 2 つの式からためして決める一手が要る。n × n − 4 と 2 × n − 1 の比が 42 対 18 になる n は 5 だけ（もう 1 つの解は負）。
