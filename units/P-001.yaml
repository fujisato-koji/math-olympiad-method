    note: S04 言いかえ（追いつきを面積や差の縮み方に）、S15 場合分けの設計（加速の途中と 20 m/s になったあと）。種なし。加速の途中で追いつくと決めて式を立てると、答えが 10 秒より後になってあわない（わなになる）。A の位置と B の位置をそろえる 2 つの区間の式が要る。
