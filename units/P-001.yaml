#
# 水準 4・8 日。速さと向き（速度の + と −）、変位と道のり、平均の速度と x-t グラフ、加速度、v-t グラフと面積、等加速度直線運動の式を扱う。
id: P-001
days:
  - day: 1
    items:
      - part: 見本
        text: まっすぐな線の上を車が走ります。右へ進む向きを + 、左へ進む向きを − と決めます。向きまで入れた速さを速度といいます。右へ 3 m/s で進む車の速度は + 3 m/s 、左へ 3 m/s なら − 3 m/s です。
