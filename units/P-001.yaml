        explain: 面積を点線で長方形（v0 × t）と三角形（底辺 t 、高さ a t なので ½ a t²）に分けると、変位 x = v0 t + ½ a t² が出ます。台形で考えると x = (v0 + v) t / 2 で、v = v0 + a t を入れても同じ式になります。さらに t = (v − v0)/a を入れると v² − v0² = 2 a x が出ます。等加速度直線運動では v = v0 + a t 、x = v0 t + ½ a t² 、v² − v0² = 2 a x の 3 つの式を、聞かれていることに合わせて選びます。
        hints:
