        id: "b5f7e21182"
        text: 速度が 1 秒ごとに 2 m/s ずつ増えていくとき、加速度は 2 m/s² です。加速度は 1 秒あたりの速度の変わり方で、(あとの速度 − はじめの速度) ÷ かかった時間で求めます。v-t グラフでは、直線のかたむきが加速度です。
