    kinds: [総動員, 数]
    uses: [G-027]
    text: 川のはばは 48 m で、水は岸と同じ向きに 4 m/s の一定の速さで流れています。水が動かないときに 3 m/s で進める船で、出発した点の真向かいの点へ行きます。船の向きは自由に決めてよく、進むあいだは変えません。流れが船より速いので、船は真向かいの点より下流に着きます。着いたら、岸を 1 m/s で歩いて真向かいの点までもどります。出発してから真向かいの点に着くまでの時間がいちばん短くなるように進むと、何秒かかりますか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="50" width="280" height="100" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="20" y1="50" x2="300" y2="50" fill="none" stroke="currentColor" stroke-width="3"/><line x1="20" y1="150" x2="300" y2="150" fill="none" stroke="currentColor" stroke-width="3"/><line x1="60" y1="100" x2="150" y2="100" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="160,100 150,105 150,95" fill="currentColor"/><text x="110" y="92" font-size="14" text-anchor="middle" fill="currentColor">水の流れ 4 m/s</text><circle cx="90" cy="150" r="6" fill="currentColor"/><text x="90" y="175" font-size="14" text-anchor="middle" fill="currentColor">出発</text><line x1="90" y1="150" x2="90" y2="50" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><text x="55" y="130" font-size="14" text-anchor="middle" fill="currentColor">48 m</text><circle cx="90" cy="50" r="5" fill="currentColor"/><text x="90" y="38" font-size="14" text-anchor="middle" fill="currentColor">真向かい</text><circle cx="240" cy="50" r="5" fill="currentColor"/><line x1="235" y1="42" x2="138" y2="42" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="128,42 138,37 138,47" fill="currentColor"/><text x="182" y="32" font-size="13" text-anchor="middle" fill="currentColor">岸を歩く 1 m/s</text><text x="235" y="125" font-size="14" text-anchor="middle" fill="currentColor">船：3 m/s（向きは自由）</text><text x="240" y="185" font-size="14" text-anchor="middle" fill="currentColor">かかる時間は？</text></svg>'
    answer: 64
    check: "min(T for T in range(1, 300) if any((4 * t - (T - t)) ** 2 + 48 ** 2 <= (3 * t) ** 2 for t in range(16, 200)))"
    hints:
      - かかる時間は、船に乗っている時間と、歩く時間の合計です。下流へはなれる長さを短くすると歩く時間は短くなりますが、船に乗っている時間はどうなるでしょう。
      - text: 歩く速さは 1 m/s なので、歩く秒数は下流へはなれた長さ（m）と同じ数です。船に乗っている 1 秒ごとに、その 1 秒と、その 1 秒に下流へ進む長さを足すことになります。これは、流れが 1 m/s 速い川で下流へ進む長さと同じ数です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="110" x2="120" y2="110" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="130,110 120,115 120,105" fill="currentColor"/><line x1="130" y1="110" x2="140" y2="110" fill="none" stroke="#d9534f" stroke-width="3"/><polygon points="150,110 140,115 140,105" fill="#d9534f"/><circle cx="150" cy="110" r="60" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="88" y="135" font-size="14" text-anchor="middle" fill="currentColor">流れ 4</text><text x="140" y="135" font-size="14" text-anchor="middle" fill="#d9534f">＋1</text><text x="150" y="98" font-size="14" text-anchor="middle" fill="currentColor">3</text><circle cx="50" cy="110" r="5" fill="currentColor"/><circle cx="150" cy="110" r="70" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - 流れが 5 m/s の川だと思って、川を横切る長さ 48 m に対して下流へ進む長さがいちばん小さくなるのは、はじめの点から円にどんな線を引いたときでしょう。
    paths:
      - [歩く速さが 1 m/s なので、かかる秒数は船に乗っている秒数と下流へはなれた m の数の合計, 船に乗っている 1 秒ごとに 1 を足すのは、流れが 1 m/s 速い 5 m/s の川で下流へ進む長さを考えるのと同じ, 5 m/s の流れで 1 秒の動きは 5 m 下がった点を中心にした半径 3 m の円の上の点で、円にふれる線をとると直角三角形の辺が 5、3、4, 川を横切る 3 に対して川と同じ向きの 4 なので、48 m 横切るあいだの合計は 48 × 4 ÷ 3 = 64 で 64 秒]
      - [t 秒かけて横切るとすると、船が自分で進む長さ 3 × t m を、向こう岸へ行く 48 m の分と上流向きの分に分ける, t = 20 なら船が進む長さは 60 m で、上流向きの分は 36 m（辺が 48、36、60 の直角三角形）, 流される 80 m から 36 m を引いて 44 m 下流に着き、歩いて 44 秒なので合わせて 20 + 44 = 64 秒, t = 16 は 16 + 64 = 80 秒、t = 25 は約 67 秒と大きくなるので 20 秒ごろが最小で 64 秒]
    note: S07 極端な場合（ぎりぎりの向き）、S25 ベクトル（速度の足し算、G-027）、S19 置きかえ（歩く時間を、流れが 1 m/s 速くなったと見なす）。種なし。1 回目：下流へはなれる長さをいちばん短くする問いは、ふれる線の型を当てればすんだ。着いてから歩いてもどる時間を足し、時間の合計を問うたので、はなれる長さをいちばん短くする向き（約 66.5 秒）と、まっすぐ横切る向き（80 秒）がどちらも答えにならない。歩く 1 秒を流れの 1 m/s に置きかえる一手で、流れ 5、船 3 の 3-4-5 の直角三角形が見える。いちばん短いのは船を上流へ 3 対 5 の向きにかたむけたときで、20 秒乗って 44 m 歩く。
