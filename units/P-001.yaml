        text: 速度が 3 m/s で一定のまま 4 秒たつと、進んだ長さは 3 × 4 = 12 m です。v-t グラフでは、線と横の線ではさまれた面積が、進んだ長さ（変位）になります。さらに、加速度 a で走る車の速度は、はじめの速度を v0 とすると、v = v0 + a t で表せます。
