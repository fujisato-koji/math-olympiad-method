        explain: v-t グラフの面積が変位になるのは、短い時間ごとの「速度 × 時間」を全部足したものだからです。速度が変わる場合も、グラフの下の面積を三角形や台形で求めれば変位が出ます。時間が増えるごとに速度が a ずつ増えるので v = v0 + a t になります。
