# G-005 長さとまわりの長さ
#
# 段 2・水準 2・5 日。長さを比べる（はしをそろえる、マスのいくつ分で表す）、まわりの長さ（形のまわりを 1 周する長さ）。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 長さは「マスの いくつぶん」で表す（マス目の 1 辺の長さを 1 マス とする）。cm・mm・m、ものさしの目もりの読み方、単位の換算は G-046 で扱うので、ここでは使わない。
# 図は svg（D-129）。テープは 1 列のマスの帯で、左に ア・イ の記号。マスの数が多いテープは、マスを書かずに数を書いた帯（テープ図）。
# マス目の形は色のマス、まわり（外の辺）を太い線、中の線を細い線で描く。数で書いた形は、辺に長さを書いた四角。
# ヒントの図では、まわりの辺を色の太い線で、ずらす辺を矢印で、見るところを点線の丸で見せる。
# かけ算・わり算は前提にないので、同じ数を何回もたす形にし、「1 辺はいくつ」は見当をつけて たして確かめる形にする。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 長さを比べる、マスのいくつ分で表す　2 日目 まわりの長さ　3 日目 わけ（かいだんの形、歩はばの比べ方、分けると増えるまわり）
#   4 日目 G-002（分ける・組み合わせる）と N-007 を混ぜる　5 日目 確認
# check：マス目の形のまわりは、図の並びを文字で書いた式で数える（B あお、R あか、Y きいろ、. なし。色のマスの 4 つの辺のうち、となりが色のマスでない辺）。

