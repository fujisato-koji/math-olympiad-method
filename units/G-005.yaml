        explain: 「かいだんの よこの へんを うえに、たての へんを みぎに うつすと、おおきな しかくの へんに ぴったり なる から」と 言えれば よい。「よこの へんを あわせると うえも したも 3、たての へんを あわせると ひだりも みぎも 3 だから」でも よい。へんを まっすぐ ずらしても ながさは かわらない、と いう 見方に 気づけば なお よい。数えて 12 と 12 を くらべる だけで おわったら、「ずらすと かさなる」ことを いっしょに ゆびで なぞる。
