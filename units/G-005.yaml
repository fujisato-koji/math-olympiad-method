          - [🟦 の さきに はみだした 🟥 を かぞえる, 3 マス]
      - part: 今日
        text: あかい テープは 28 マス、あおい テープは 45 マス です。あおい テープは、あかい テープより なんマス ながい ですか。
        answer: 17
        check: "45 - 28"
        hints:
          - ながい ほうから みじかい ほうを ひこう。
          - 45 − 28 を いちの くらいから けいさん しよう。
          - 5 から 8 は ひけないね。じゅうの くらいから 1 かりよう。
        paths:
          - [45 − 28, 15 − 8 = 7 と 30 − 20 = 10, 17 マス]
          - [28 に 2 を たして 30、30 から 45 まで 15, 2 + 15 = 17, 17 マス]
      - part: 挑戦
        text: つくえの よこの ながさを はかると、ノート 3 さつぶん で、けしゴム 11 こぶん でした。1 つぶんが ながいのは どちら ですか。
        choices: [ノート, けしゴム]
        answer: ノート
        check: "'ノート' if 3 < 11 else 'けしゴム'"
        hints:
          - どちらも おなじ ながさを はかって いるね。
          - すくない かずで とどくのは どちらかな。
          - 1 つぶんが ながいと、かずは おおく なるかな、すくなく なるかな。
        paths:
          - [おなじ ながさを はかって いる, ノートは 3 つで とどく, 1 つぶんが ながいのは ノート]
        note: 数の大きい消しゴムを「長い」と答えやすい。同じ長さを測っているので、数が少ないほど 1 つ分が長い。
