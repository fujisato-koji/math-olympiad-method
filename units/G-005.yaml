# G-005 長さとまわりの長さ
#
# 書き方は N-001 の頭の注のとおり。
# 長さは「マスの いくつぶん」で表す（マス目の 1 辺の長さを 1 マス とする）。
# cm・mm・m、ものさしの目もりの読み方、単位の換算は G-046 で扱うので、ここでは使わない。
# 図のテープは 1 列のマス、⬜ は何もない所。端をそろえる図は ⬜ で左をそろえ、そろえない図は「はしが そろって いません」と書く。
# まわりの長さは、形のまわりを 1 周する長さ。マス目の形は辺を数え、数で書いた形は辺の長さをたす（N-007 の 2 けたの計算）。
# かけ算・わり算は前提にないので、同じ数を何回もたす形にし、「1 辺はいくつ」は見当をつけて たして確かめる形にする。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 長さを比べる、マスのいくつ分で表す　2 日目 まわりの長さ　3 日目 わけ（かいだんの形、歩はばの比べ方、分けると増えるまわり）
#   4 日目 G-002（分ける・組み合わせる）と N-007 を混ぜる　5 日目 確認
# check：マス目の形のまわりは「⬜ でない（または 🟦 の）マスの 4 つの辺のうち、となりが同じでない辺」を数える式。

id: G-005
days:
  - day: 1
    items:
      - part: 見本
        text: 2 ほんの テープの ながさを くらべよう。⬜ は なにも ない ところ です。
        figure: "🟦🟦🟦🟦🟦\n🟥🟥🟥⬜⬜"
        explain: はしを そろえて ならべると、くらべやすく なります。🟦 は マス 5 つぶん、🟥 は マス 3 つぶん です。🟦 の ほうが ながく、5 − 3 = 2 で、2 マス ながい です。
      - part: 思い出す
        text: 36 + 47 は いくつ ですか。
        answer: 83
        check: "36 + 47"
        hints:
          - いちの くらいから たそう。
          - 6 + 7 は 10 より おおきいね。じゅうの くらいに 1 くりあげよう。
          - じゅうの くらいは 3 + 4 に、くりあげた 1 を たそう。
        paths:
          - [6 + 7 = 13, 30 + 40 + 10 = 80, 80 + 3 = 83]
      - part: 思い出す
        text: ⬛ は かげ です。かげを ぜんぶ うめるには、しかくの いろいたが なんまい いりますか。
        figure: "⬛⬛⬛⬛\n⬛⬛⬛⬜"
        answer: 7
        check: "n('⬛')"
        hints:
          - いろいた 1 まいで、⬛ が いくつ かくれるかな。
          - ⬜ は かぞえないよ。
          - うえの だんから じゅんに ⬛ を かぞえよう。
        paths:
          - [うえ 1 から 4, した 5、6、7, 7 まい]
      - part: 今日
        text: ながいのは どちらの テープ ですか。⬜ は なにも ない ところ です。
        figure: "🟩🟩🟩🟩🟩🟩⬜\n🟨🟨🟨🟨🟨🟨🟨"
        choices: [🟩, 🟨]
        answer: 🟨
        check: "'🟩' if n('🟩') > n('🟨') else '🟨'"
        hints:
          - ひだりの はしは そろって いるね。
          - みぎの はしは どちらが さきまで のびて いるかな。
          - マスを かぞえて たしかめよう。
