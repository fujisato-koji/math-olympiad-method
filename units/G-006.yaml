      - part: 見本
        id: "111387997e"
        text: |-
          紙を 2 回 おると、まっすぐな かどが できます。この かどを 直角 と いいます。
          4 つの かどが みんな 直角の 四角形が 長方形、へんの ながさも みんな おなじなら 正方形 です。
          直角の かどが ある 三角形が 直角三角形 です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><path d="M22,20 Q52,6 80,20 Q94,46 80,70 Q50,84 22,70 Q8,46 22,20 Z" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="10" y1="45" x2="92" y2="45" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="98" y1="45" x2="108" y2="45" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="116,45 107,49.5 107,40.5" fill="currentColor" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M124,66 L200,66 Q206,44 190,30 Q164,14 138,26 Q120,42 124,66 Z" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="162" y1="16" x2="162" y2="72" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="210" y1="45" x2="220" y2="45" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="228,45 219,49.5 219,40.5" fill="currentColor" fill-opacity="1" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M240,70 L300,70 Q304,40 284,28 Q262,16 240,22 Z" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M240,57 L253,57 L253,70" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="92" font-size="14" text-anchor="middle" fill="currentColor">直角</text><polygon points="18,112 106,112 106,162 18,162" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><polygon points="136,108 192,108 192,164 136,164" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><polygon points="222,164 304,164 222,108" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M18,121 L27,121 L27,112" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M97,112 L97,121 L106,121" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M106,153 L97,153 L97,162" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M27,162 L27,153 L18,153" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M136,117 L145,117 L145,108" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M183,108 L183,117 L192,117" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M192,155 L183,155 L183,164" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M145,164 L145,155 L136,155" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M222,154 L232,154 L232,164" fill="none" stroke="#e8590c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="188" font-size="14" text-anchor="middle" fill="currentColor">長方形</text><text x="164" y="188" font-size="14" text-anchor="middle" fill="currentColor">正方形</text><text x="263" y="188" font-size="14" text-anchor="middle" fill="currentColor">直角三角形</text></svg>'
        explain: 紙を はんぶんに おり、おりめと おりめが かさなるように もう いちど おると、直角の かどが できます。この かどを あてると、ほかの かどが 直角か どうか しらべられます。4 つの かどが みんな 直角の 四角形が 長方形、4 つの かどが みんな 直角で 4 つの へんが みんな おなじ ながさの 四角形が 正方形、直角の かどが ある 三角形が 直角三角形 です。三角じょうぎの いちばん 大きい かども 直角 です。
