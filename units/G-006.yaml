# G-006 直角と平行、三角形と四角形
#
# 段 2・水準 2・5 日。三角形と四角形（辺と頂点）、直角と長方形・正方形・直角三角形、平行、G-002 と混ぜる、確かめ。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図は svg（D-129）。方眼紙の点はうすい小さな点、むすぶ点は赤い点、むすんだ辺は青い線。直角のしるしはだいだいの小さなかぎ。
# 直角は、紙を 2 回折ってつくった角（黄色の「おった紙のかど」）を当てて確かめる。1 日目の見本の折り方の絵と同じ形。
# カタカナと記号（コ、ロ、ハ、ヘ、ン、ノ、ニ、ト、＝、＜、＋）は書体に頼らず、太い線で描く。
# 子に見せることば：三角形、四角形、長方形、正方形、直角、直角三角形は漢字（小 2 までの字）。へん、ちょう点、へいこうはかな。
# 正方形は長方形の仲間（3 日目のわけ）なので、正方形の図の選択肢には「長方形」を入れない（答えが 2 つにならないように）。
# 前提は G-002 だけで数の単元がないので、数は 1 つずつ数えて答える（たし算は使わない）。答えは 10 まで。
# 角の大きさ（度）、平行線と角（同位角・錯角）、三角形の角の和は G-009 以降で扱う。ここでは「まじわらない」「はばが同じ」まで。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 三角形と四角形（辺と頂点）　2 日目 直角、長方形・正方形・直角三角形　3 日目 平行とわけ
#   4 日目 G-002（分ける・組み合わせる）と混ぜる　5 日目 確認
# check：点の図は赤い点の位置（行, 列）から形の名前を出す式、色板の中の正方形は大きさごとに数える式。
# 字の形と言葉の決まりを問う問題は約束ごとなので check を付けない。

