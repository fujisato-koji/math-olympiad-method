# G-006 直角と平行、三角形と四角形
#
# 書き方は N-001 の頭の注のとおり。
# ことば：へん、ちょうてん、さんかくけい、しかくけい、ちょっかく、ちょうほうけい、せいほうけい、ちょっかくさんかくけい、へいこう。
# 直角は、紙を 2 回折ってつくった角（折り目と折り目を重ねる）と比べて確かめる。📐 のいちばん大きい角も直角。
# 点の図：⚪ は方眼紙の点、🔴 を順にまっすぐな線で結ぶ。点の縦と横の間は同じとみる。
# 平行は、2 本の 🟦 の帯や、カタカナ・記号の形（ニ、ロ、コ、＝ など）で見る。書体で形が少し変わるので、まぎれない字だけにした。
# 正方形は長方形の仲間（3 日目のわけ）なので、正方形の図の選択肢には「ちょうほうけい」を入れない（答えが 2 つにならないように）。
# 前提は G-002 だけで数の単元がないので、数は 1 つずつ数えて答える（たし算は使わない）。答えは 10 まで。
# 角の大きさ（度）、平行線と角（同位角・錯角）、三角形の角の和は G-009 以降で扱う。ここでは「まじわらない」「はばが同じ」まで。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 三角形と四角形（辺と頂点）　2 日目 直角、長方形・正方形・直角三角形　3 日目 平行とわけ
#   4 日目 G-002（分ける・組み合わせる）と混ぜる　5 日目 確認
# check：点の図は 🔴 の位置から形の名前を出す式、色板の中の正方形は大きさごとに数える式。
# 字の形と言葉の決まりを問う問題は約束ごとなので check を付けない。

