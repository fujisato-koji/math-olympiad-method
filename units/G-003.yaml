    kinds: [数, 道筋]
    id: "50db5e41e1"
    text: よこから みた つみきの えです。つみきを 1 こずつ ほかの ならびへ うごかして、3 つの ならびを みんな おなじ たかさに します。つみきは ふやしたり へらしたり しません。うごかす つみきは、いちばん すくなくて なんこ ですか。
