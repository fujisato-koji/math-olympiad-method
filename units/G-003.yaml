# G-003 積み木と立体
#
# 段 1・水準 1・5 日。箱の形・筒の形・ボールの形（平らな所、転がる、積める、なぞると写る形）と、積み木を数えること（見える積み木、見えない積み木、上から見た図）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 日の並び：1 日目 形（導入）、2 日目 見える積み木を数える、3 日目 見えない積み木を数える、4 日目 G-001（位置の言葉、形）と混ぜる、5 日目 確認。
#   地図の plan にわけの日がないので、わけは 2〜4 日目に 1 問ずつ置く。
# 図の約束（D-129）：
#   立体はななめから見た絵。箱の形はだんボール（テープ）、プレゼント（リボン）、さいころ（目）、ジュースの箱（ストロー）。
#   筒の形はかん（赤い帯）、トイレットペーパー（しんの穴）、たいこ（ひも）。ボールの形はサッカー、バスケット、テニスのボール。
#   平らな所は黄色でぬる（1 日目の見本とヒントの手本の形だけ）。
#   積み木は横から見た図で、地面の線の上に正方形を積む。茶色が積み木、色を問う問題は赤・青・黄・緑。何もない所は描かない。
#   灰色に「？」の所は布がかかって見えない所。積み木は浮いていない（積み木の下には必ず積み木がある）。
#   「？」は必ず見える積み木の下に置き、上に何もない「？」（あるかないか決まらない所）は作らない。
#   上から見た図はマスに数（その場所に積んだ数）を書き、下の列が前。
# 数は 10 まで（N-001）。上から見た図の数をあわせる問題は、1 つずつ続けて数える形にする（たし算は N-003）。
# 面・辺・頂点の数と展開図は G-007 で扱うので、ここでは「平らな所」「転がる」「積める」「なぞると写る形」だけにする。
# check：数える問題は、段ごと・列ごとの数の式。色や位置を答える問題は、図の並びを書いた一覧から引く式。
#   形の名前を選ぶだけの問題は約束ごとなので check を付けない。

