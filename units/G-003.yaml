      - ころがる ものに しるしを つけよう。つむ ことが できる ものにも、べつの しるしを つけよう。
      - しるしが 2 つ ついた ものを かぞえよう。
    paths:
      - [ころがるのは かん、ボール、トイレットペーパー、ボール、たいこ, つめるのは かん、はこ、トイレットペーパー、プレゼント、たいこ, どちらにも あるのは かん、トイレットペーパー、たいこ, 3 こ]
      - [つつの かたちは、ねかせると ころがり、たてると つめる, つつの かたちを かぞえる, 3 こ]
    note: つつの かたちは、よこに すると ころがり、たてると たいらな ところで つめる。ボールは つめず、はこは ころがらない。2 つの ことを 2 しゅるいの しるしで せいりする（かさなりを かぞえる C-008 の いりぐち）。
