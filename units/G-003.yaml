# G-003 積み木と立体
#
# 書き方は N-001 の頭の注のとおり。
# 立体は絵文字で描く：はこの形 📦🎁🧃🎲、つつの形 🥫🧻🥁、ボールの形 ⚽🏀🎾。
# 機種によって箱に見える 🔋 や、何本も積んで描かれる 🧱 は使わない。
# 積み木は横から見た図で 🟫（色を問う問題は 🟥🟦🟨🟩）。⬜ は何もない所、❓ は布がかかって見えない所。
# 約束：積み木は浮いていない（積み木の下には必ず積み木がある）。❓ は必ず見える積み木の下に置き、
# 上に何もない ❓（あるかないか決まらない所）は作らない。
# 数は 10 まで（N-001）。上から見た図の数をあわせる問題は、1 つずつ続けて数える形にする（たし算は N-003）。
# 面・辺・頂点の数と展開図は G-007 で扱うので、ここでは「平らな所」「転がる」「積める」「なぞると写る形」だけにする。
# 地図の plan にわけの日がないので、わけは 2〜4 日目に 1 問ずつ置く。
# check：数える問題は n(c)。見えない積み木は、列ごとにいちばん上の積み木から下を全部数える式。
# 形の名前を選ぶだけの問題は約束ごとなので check を付けない。

id: G-003
days:
  - day: 1
    items:
      - part: 見本
        text: はこの かたち、つつの かたち、ボールの かたちを しろう。
        figure: "📦　🥫　⚽"
        explain: 📦 は はこの かたち。たいらな ところ だけで できて いて、ころがりません。🥫 は つつの かたち。たてると たいらな ところで たち、よこに ねかせると ころがります。⚽ は ボールの かたち。どの むきにも ころがります。
      - part: 思い出す
        text: りんごは なんこ ありますか。
        figure: 🍎🍎🍎🍎🍎🍎🍎🍎
        answer: 8
        check: "n('🍎')"
        hints:
          - ゆびで ひとつずつ さしてみよう。
          - かぞえた りんごを とばさないように しよう。
          - さいごに いった かずが こたえだよ。
        paths:
          - [ひだりから ひとつずつ さす, 1 から 8 まで かぞえる, 8 こ]
      - part: 思い出す
        text: まるは どれですか。
        choices: [🔺, 🟢, 🟦]
        answer: 🟢
        hints:
          - かどが ある かたちと、ない かたちが あるね。
          - ゆびで ふちを なぞってみよう。
          - かどが ひとつも ない かたちを えらぼう。
        paths:
          - [ふちを なぞる, かどが ない, 🟢 は まる]
      - part: 今日
        text: はこの かたちは どれですか。
        choices: [🥫, 🎁, ⚽]
        answer: 🎁
        hints:
          - ころがる ものと、ころがらない ものが あるね。
          - たいらな ところ だけで できて いる ものを さがそう。
          - かどが ある ものは どれかな。
        paths:
          - [ころがらない ものを さがす, たいらな ところ だけ, 🎁 は はこの かたち]
      - part: 今日
        text: どの むきにも ころがるのは どれですか。
        choices: [🧃, 🥁, 🏀]
        answer: 🏀
        hints:
          - たいらな ところが ある ものは、そこで とまるよ。
          - 🥁 は ねかせると ころがるけど、たてると どう なるかな。
          - どこにも たいらな ところが ない ものを えらぼう。
        paths:
          - [たいらな ところを さがす, 🏀 には ない, 🏀]
      - part: 今日
        text: つつの かたちは いくつ ありますか。
        figure: 🥫📦🧻⚽🥁🎲
        answer: 3
        check: "n('🥫') + n('🧻') + n('🥁')"
        hints:
          - ねかせると ころがって、たてると たつ ものを さがそう。
          - はこの かたちと ボールの かたちは のけよう。
          - つつの かたちに しるしを つけて かぞえよう。
        paths:
          - [つつの かたちを えらぶ, 🥫 🧻 🥁, 3 こ]
        note: 🧻（トイレットペーパー）や 🥁（たいこ）も筒の形。家の缶や紙の芯で確かめるとよい。
      - part: 挑戦
        text: たいらな ところを かみに あてて、まわりを なぞります。まるが かけるのは どれですか。
        choices: [📦, 🥫, ⚽]
        answer: 🥫
        hints:
          - なぞるには、かみに ぴったり つく たいらな ところが いるよ。
          - ⚽ に たいらな ところは あるかな。
          - たいらな ところが まるい ものを えらぼう。
        paths:
          - [たいらな ところが いる, ⚽ には ない、📦 は しかくが うつる, 🥫]
        note: ⚽ は丸いので選びやすいが、平らな所がないので写し取れない。家の缶や箱で実際になぞってみる。
