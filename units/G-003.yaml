# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 道筋]
    text: よこから みた つみきの ずです。つみきを 1 こずつ ほかの ならびへ うごかして、3 つの ならびを みんな おなじ たかさに します。つみきは ふやしたり へらしたり しません。うごかす つみきは、いちばん すくなくて なんこ ですか。
    figure: "⬜🟫⬜\n⬜🟫⬜\n⬜🟫⬜\n⬜🟫⬜\n⬜🟫⬜\n⬜🟫⬜\n🟫🟫🟫"
    answer: 4
    check: "(lambda g: (lambda h: sum(x - sum(h) // 3 for x in h if x > sum(h) // 3))([sum(1 for r in g if r[c] == '🟫') for c in range(3)]))(fig.splitlines())"
    hints:
      - つみきは ぜんぶで なんこ あるかな。
      - 3 つの ならびが おなじ たかさに なるのは、なんだんの ときかな。つみきを うごかして ためしてみよう。
      - たかい ならびから、ひくい ならびへ うごかそう。
    paths:
      - [ぜんぶで 9 こ, みんな 3 だんに なる, まんなかの ならびから 4 こ うごかす（ひだりへ 2、みぎへ 2）, 4 こ]
    note: 平均（S-028）の入口を、積み木を動かして体で見る問題。いちばん高い列から低い列へだけ動かすと、動かす数がいちばん少ない。そろう高さ（3 段）は、実際に動かして見つけてよい。高い列を低い列と同じ 1 段まで低くしようとして 6 と答えやすい（積み木はへらさない）。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [N-003]
    text: うえから みた ずです。すうじは、その ばしょに つんだ つみきの かずで、したの ならびが まえ（じぶんの がわ）です。❓ の ばしょは すうじが よめません。まえから みると、ひだりの ならびは 4 だん、みぎの ならびは 3 だんに みえます。つみきは ぜんぶで なんこ ありますか。
    figure: "2　❓\n4　1"
    answer: 10
    check: "sum(Fraction(x) for x in fig.split() if x != '❓') + 3"
    hints:
      - まえから みると、うしろの つみきは まえの つみきと かさなって みえるよ。
      - みぎの ならびが 3 だんに みえるのは、まえの 1 の ところかな、うしろの ❓ の ところかな。
      - ❓ が わかったら、4 つの ばしょの つみきを ぜんぶ かぞえよう。
    paths:
      - [みぎの まえは 1 だん, 3 だんに みえるのは うしろの ❓, ❓ は 3, 2 と 3 と 4 と 1 で 10 こ]
    note: 前から見た高さは、前とうしろのうち高いほうの数（見えない積み木の考え）。前の 1 では 3 段に見えないので、うしろの ❓ が 3 と決まる。最後のたし算は数の線で 10 まで（N-003）。
  - part: 離
    kinds: [読み取り]
    text: この なかで、ころがる ことも、つむ ことも できる ものは いくつ ありますか。
    figure: "🥫⚽📦🧻🏀🎁🥁"
    answer: 3
    check: "n('🥫') + n('🧻') + n('🥁')"
    hints:
      - ころがる ものに しるしを つけよう。
      - つむ ことが できる ものにも、べつの しるしを つけよう。
      - しるしが 2 つ ついた ものを かぞえよう。
    paths:
      - [ころがるのは 🥫⚽🧻🏀🥁, つめるのは 🥫📦🧻🎁🥁, どちらにも あるのは 🥫🧻🥁, 3 こ]
    note: つつの形は、横にすると転がり、立てると平らな所で積める。ボールは積めず、箱は転がらない。2 つの条件を 2 種類の印で整理する（重なりを数える C-008 の入口）。
