        explain: |-
          じしゃくは てつを ひきつけます。木、かみ、ゴム、プラスチックは つきません（アルミの かんも つきません）。
          ぬので こすった 下じきには「せいでんき」が たまり、かみや かみのけの ような かるい ものを ひきつけます。
          じしゃくは てつに はたらき、せいでんきは かるい ものに はたらきます。おなじ ひきつける 力でも、べつの はたらきです。
        note: じしゃくは てつを ひきつける。こすった 下じきは かみを ひきつける。じしゃくと でんきは べつ。
