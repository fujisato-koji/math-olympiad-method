        text: |-
          ものは、見た目、おもさ、手ざわりで くらべられます。
          見た目：いろ、かたち、大きさ。目で 見ると わかります。
          おもさ：手で もつと わかります。シーソーに のせると、おもい ほうが 下がります。
          手ざわり：さわると わかります。つるつる、ざらざら、やわらかい、かたい。
