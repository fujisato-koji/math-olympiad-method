        text: ものを くらべる とき、見た目・重さ・手ざわり・水にとけるか を どう つかうか、くちで せつめいしてみよう。
        explain: 「見た目は 目で、重さは 手で もって、手ざわりは さわって、水にとけるかは 水に 入れて しらべます。くらべたい 性質に あわせて、しらべ方を えらびます。」と いえれば よい。① 目、② 手、③ 水に 入れる。子どもには、身のまわりの 物で たしかめさせます。
        hints:
          - 色や 形は、何で しらべるかな。
          - おもさは、何で しらべるかな。
          - 水に とけるかは、どう しらべるかな。
        paths:
          - [目で 見た目, 手で 重さ, さわって 手ざわり, 水に 入れて とけるか]
      - part: 今日
        text: 見た目が ちがっても、同じ なかまの ものは どれかな。
        choices: [大きい りんごと 小さい りんご, りんごと みかん, りんごと ボール, りんごと 石]
        answer: 大きい りんごと 小さい りんご
        check: "'大きい りんごと 小さい りんご'"
        hints:
          - 同じ 果物の なかまを さがそう。
          - 大きさは ちがっても、同じ りんごです。
          - りんごどうしを えらぼう。
        paths:
          - [同じ なかま, りんごどうし, 大きい りんごと 小さい りんご]
      - part: 挑戦
        text: 水に とける ものは どれかな。
        choices: [さとう, すな, 石, 木]
        answer: さとう
        check: "'さとう'"
        hints:
          - 水の 中で 見えなく なる ものを さがそう。
          - しおも さとうも とけます。
          - すなや 石は 残ります。
        paths:
          - [水に 入れる, 見えなく なる, さとう]
    extra: []

