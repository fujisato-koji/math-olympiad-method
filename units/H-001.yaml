# H-001 身のまわりの物の性質
#
# 段 1・水準 1・5 日。見た目、重さ、手ざわり、水にとけるか、磁石と電気を扱う。
# 子の画面には text、figure、choices、ヒントだけを出す。answer、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。

id: H-001
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          ものは、見た目、重さ、手ざわりで くらべられます。
          見た目：色、形、大きさ。
          重さ：もった ときの おもさ。
          手ざわり：ざらざら、つるつる、やわらかい、かたい。
        explain: |-
          【性質】見た目は 目の 前で わかります。重さは 手で もつと わかります。手ざわりは さわると わかります。
          同じ ものでも、見た目と 手ざわりは ちがう ことが あります。
        note: 物の性質を、見た目・重さ・手ざわりの 3 つで比べる。
      - part: 今日
        text: えんぴつと くぎは、どちらが おもいかな。
        figure: ✏️🔩
        choices: [えんぴつ, くぎ, おなじ]
        answer: くぎ
        check: "'くぎ'"
        hints:
          - 手で もった ときの かんじを おもいだそう。
          - えんぴつは 木で できています。くぎは 鉄で できています。
          - 同じ 大きさなら、鉄の ほうが おもいね。
        paths:
          - [手で もつ, 木と 鉄を くらべる, くぎの ほうが おもい]
      - part: 今日
        text: つるつる している のは どちらかな。
        figure: 🪞🧽
        choices: [かがみ, スポンジ, どちらも おなじ]
        answer: かがみ
        check: "'かがみ'"
        hints:
          - 手で さわった ときの かんじを おもいだそう。
          - かがみは 表面が なめらかです。
          - スポンジは でこぼこ しています。
        paths:
          - [手で さわる, なめらかさを くらべる, かがみが つるつる]
      - part: 挑戦
        text: 見た目で すぐに わかる ことは どれかな。
        choices: [色, 重さ, 水に とけるか, 磁石に つくか]
        answer: 色
        check: "'色'"
        hints:
          - 目で 見るだけで わかる ことを えらぼう。
          - 重さは 手で もつと わかります。
          - 色や 形は、見た だけで わかります。
        paths:
          - [目で 見る, 色や 形, 見た目]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          水に 入れると、とける ものと とけない ものが あります。
          さとうや しおは 水に とけます。すなは 水に とけません。
          とけると、水の 中に 見えなく なります。
        explain: |-
          さとうを 水に 入れて まぜると、見えなく なります。これは とけた ということです。
          すなは、まぜても 水の 中に つぶが 見えます。これは とけない ということです。
        note: さとう・しおは とける。すなは とけない。とけると 見えなく なる。
      - part: 今日
        text: 水に 入れると とける のは どちらかな。
        figure: 🧂🏖️
        choices: [しお, すな, どちらも とけない]
        answer: しお
        check: "'しお'"
        hints:
          - 水に 入れて まぜた ときの ことを おもいだそう。
          - しおは 水の 中で 見えなく なります。
          - すなは つぶが 見えたままです。
        paths:
          - [水に 入れて まぜる, 見えなく なるか, しおが とける]
      - part: 今日
        text: さとうを 水に 入れて まぜると、どうなるかな。
        choices: [見えなく なる, 大きくなる, 色が 黒く なる, かたくなる]
        answer: 見えなく なる
        check: "'見えなく なる'"
        hints:
          - さとうは 水に とける ものでした。
          - とけると、水の 中に 見えなく なります。
          - 目で 見て たしかめよう。
        paths:
          - [水に 入れる, まぜる, 見えなく なる]
      - part: 挑戦
        text: 水に とけない ものは どれかな。
        choices: [すな, しお, さとう, どれも とける]
        answer: すな
        check: "'すな'"
        hints:
          - 水の 中で つぶが 見えるか を 考えよう。
          - しおと さとうは 見えなく なります。
          - すなは つぶが 残ります。
        paths:
          - [つぶが 見えるか, すなが 残る, とけない]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          磁石は、鉄を 引きつけます。鉄で できた くぎや クリップが つきます。
          電気も、ものを 引きつける ことが あります。下じきを こすって、紙の 近くに 置くと、紙が 動く ことが あります。
          磁石と 電気は、ちがう はたらきです。
        explain: |-
          磁石には N 極と S 極が あります。鉄は 磁石に つきます。
          こすった 下じきは、軽い 紙を 引きつけます。これは 静電気の 力です。
          磁石は 鉄に、静電気は 軽い ものに はたらきます。
        note: 磁石は鉄を引きつける。こすった下じきは紙を引きつける。磁石と電気は別。
      - part: 今日
        text: 磁石に つく のは どれかな。
        figure: 🧲🔩
        choices: [くぎ, えんぴつ, ゴム, 紙]
        answer: くぎ
        check: "'くぎ'"
        hints:
          - 磁石が 引きつける ものを おもいだそう。
          - 鉄で できた ものが つきます。
          - くぎは 鉄で できています。
        paths:
          - [磁石は 鉄を 引きつける, くぎは 鉄, くぎが つく]
      - part: 今日
        text: こすった 下じきを 紙の 近くに 置くと、どうなるかな。
        choices: [紙が 動く, 紙が なくなる, 下じきが 光る, 何も 起こらない]
        answer: 紙が 動く
        check: "'紙が 動く'"
        hints:
          - こすると 静電気が 起こります。
          - 静電気は 軽い ものを 引きつけます。
          - 紙が 引きつけられて 動きます。
        paths:
          - [こする, 静電気, 紙が 動く]
      - part: 挑戦
        text: 磁石と 電気の はたらきで、正しい のは どれかな。
        choices: [磁石は 鉄を 引きつける, 磁石は 紙を 引きつける, 電気は 鉄だけを 引きつける, 2 つは 同じ もの]
        answer: 磁石は 鉄を 引きつける
        check: "'磁石は 鉄を 引きつける'"
        hints:
          - 磁石が つく ものを おもいだそう。
          - 鉄は 磁石に つきます。
          - 磁石と 電気は ちがう はたらきです。
        paths:
          - [磁石は 鉄, 電気は 軽い もの, ちがう はたらき]
    extra: []

  - day: 4
