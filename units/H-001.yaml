# H-001 身のまわりの物の性質
#
# 段 1・水準 1・5 日。見た目（色・形・大きさ）、重さ、手ざわり、水にとけるか、磁石と電気（こすった下じき）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図の plan どおり：1 日目 見た目・重さ・手ざわり、2 日目 水にとけるか、3 日目 磁石と電気、4 日目 わけ（見分け方）、5 日目 確認。
# 図の約束：てつは灰色に白い光の線、木は茶色に木目、水は水色に波の線。重さはシーソー（重いほうが下がる）で見せる。
# 磁石の極は P-181、電気の通り道は P-182 で扱うので、ここでは問わない。

id: H-001
