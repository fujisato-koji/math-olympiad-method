entColor">全体では 14 人ふえた</text></svg>'
    answer: 324
    check: "[x + x * 8 // 100 for x in range(0, 501) for y in range(0, 501) if x + y == 500 and x * 8 - y * 5 == 1400][0]"
    hints:
      - 昨年の男子を x 人、女子を y 人としよう。
      - text: ふえた人数は x の 8%、へった人数は y の 5% だよ。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><text x="30" y="56" font-size="14" text-anchor="middle" fill="currentColor">昨年</text><rect x="58" y="38" width="136" height="28" rx="3" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="126" y="57" font-size="14" text-anchor="middle" fill="currentColor">男子 x 人</text><rect x="194" y="38" width="106" height="28" rx="3" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="247" y="57" font-size="14" text-anchor="middle" fill="currentColor">女子 y 人</text><path d="M58 32 q0 -6 6 -6 h109 q6 0 6 -6 q0 6 6 6 h109 q6 0 6 6" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="179" y="18" font-size="14" text-anchor="middle" fill="currentColor">合わせて 500 人</text><text x="30" y="126" font-size="14" text-anchor="middle" fill="currentColor">今年</text><rect x="58" y="108" width="136" height="28" rx="3" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="126" y="127" font-size="14" text-anchor="middle" fill="currentColor">男子</text><rect x="194" y="108" width="22" height="28" rx="3" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="216" y="108" width="64" height="28" rx="3" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="248" y="127" font-size="14" text-anchor="middle" fill="currentColor">女子</text><rect x="280" y="108" width="20" height="28" rx="2" fill="none" stroke="currentColor" stroke-width="4 3"/><text x="205" y="158" font-size="13" text-anchor="middle" fill="currentColor">x の 8%</text><text x="290" y="158" font-size="13" text-anchor="middle" fill="currentColor">y の 5%</text><line x1="205" y1="140" x2="205" y2="146" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="290" y1="140" x2="290" y2="146" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="160" y="186" font-size="14" text-anchor="middle" fill="currentColor">全体では 14 人ふえた</text></svg>'
      - 求めるのは「今年の」男子だよ。x を求めたあと、もう 1 つ計算があるね。
    paths:
      - [昨年の男子を x 人、女子を y 人とする, x + y = 500、8x/100 − 5y/100 = 14, 2 つ目に 100 をかけて 8x − 5y = 1400, x = 300 なので 今年の男子は 300 + 24 = 324 人]
      - [男子を x 人とすると女子は 500 − x 人, 0.08x − 0.05(500 − x) = 14, 0.13x = 39 で x = 300, 300 + 24 = 324]
