# A-012 連立方程式
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011 に合わせる（負の数は「−」U+2212、「−」の形にそろえる式も A-011 と同じ）。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：2 元 1 次方程式とその解（x と y の組）、連立方程式とその解（代入して確かめる）、2 つの式を足す・ひくで文字を消す。
#   2 日目：式を何倍かして係数をそろえてから消す（加減法）。解が負の数のもの、分数の係数（分母をはらう）。
#   3 日目：代入法（y = … や x = … の式を、もう一方に代入する）、かっこのある式、A = B = C の形。
#   4 日目：わけ。5 日目：A-011、A-010 と混ぜる（2 つの買い物の代金から 1 個の値段を求める、解から係数を求める）。6 日目：確認。
# 前提は A-011（1 次方程式）だけ。連立方程式は figure に 2 行で書き、①、② の番号をつける。
# 答えの鍵盤では x と y の組を 1 度に打てないので、組を答える問題は choices（「x = 4、y = 3」）にし、
#   打つ問題は「x はいくつ」のように 1 つの値を聞く。
#   choices の check は、選択肢ごとの組を 2 つの式に代入して、両方を成り立たせるものを選び出す。
#   打つ問題の check は、x と y を −20〜20 の整数で総当たりして、両方の式を成り立たせる組をさがす。
# 文章題の型（和差、つるかめ、過不足、植木）は A-014 で扱う。ここでの文章題は、2 つの買い物の代金のように、
#   2 つの等しい関係がそのまま式になるものだけにした。3 つの文字の連立方程式、解がない・解が限りなくある連立方程式は扱わない。
# 連立方程式は、化学反応式の係数（H-010）や、つり合う力、回路の電流のように、わからない数が 2 つ以上ある計算の入口になる（D-026）。
# ただし腕だめしの最難関（約分できない分数を数える問題）だけは例外で、uses に A-013、N-018 を挙げて、不等式と最大公約数を使う。

id: A-012
days:
  - day: 1
    items:
      - part: 見本
        id: "c6a7854061"
        text: x + y = 7 …① と x − y = 1 …② のように、2 つの式を組にしたものを連立方程式といいます。両方を成り立たせる x、y の組が、連立方程式の解です。① と ② を足すと y が消えて、x だけの式になります。
        svg: '<svg viewBox="0 0 320 188" xmlns="http://www.w3.org/2000/svg"><text x="10" y="40" font-size="16" text-anchor="start" fill="currentColor">①</text><text x="98" y="40" font-size="19" text-anchor="middle" fill="currentColor">x</text><rect x="147.8" y="17" width="44.4" height="34" rx="14" fill="none" stroke="#f08080" stroke-width="2.5"/><text x="170" y="40" font-size="19" text-anchor="middle" fill="currentColor">+ y</text><text x="264" y="40" font-size="19" text-anchor="middle" fill="currentColor">7</text><text x="216" y="40" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="10" y="80" font-size="16" text-anchor="start" fill="currentColor">②</text><text x="98" y="80" font-size="19" text-anchor="middle" fill="currentColor">x</text><rect x="143.7" y="57" width="52.6" height="34" rx="14" fill="none" stroke="#f08080" stroke-width="2.5"/><text x="170" y="80" font-size="19" text-anchor="middle" fill="currentColor">− y</text><text x="264" y="80" font-size="19" text-anchor="middle" fill="currentColor">1</text><text x="216" y="80" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="62" y="80" font-size="18" text-anchor="middle" fill="currentColor">+)</text><line x1="58" y1="94" x2="300" y2="94" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="98" y="126" font-size="19" text-anchor="middle" fill="currentColor">2x</text><text x="264" y="126" font-size="19" text-anchor="middle" fill="currentColor">8</text><text x="216" y="126" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="170" y="148" font-size="12" text-anchor="middle" fill="currentColor">（y が消える）</text><text x="160" y="174" font-size="15" text-anchor="middle" fill="currentColor">x = 4。① に入れると 4 + y = 7 で y = 3</text></svg>'
        explain: x + y = 7 のように、2 つの文字をふくむ 1 次の方程式を 2 元 1 次方程式といいます。x + y = 7 を成り立たせる x、y の組は、x = 1、y = 6 や x = 4、y = 3 など、たくさんあります。2 つの方程式を組にしたものを連立方程式といい、両方を同時に成り立たせる x、y の組を、連立方程式の解といいます。① と ② の左辺どうし、右辺どうしを足すと (x + y) + (x − y) = 7 + 1 で、y が消えて 2x = 8、x = 4 です。x = 4 を ① に代入すると 4 + y = 7 で y = 3 です。解は x = 4、y = 3 です。② に代入しても 4 − 3 = 1 で成り立ちます。このように、1 つの文字を消して、1 つの文字の方程式にして解きます。
