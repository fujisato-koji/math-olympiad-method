        explain: 例：「x、y が x + y = 6 を成り立たせるとする。等式の両辺に同じ数 2 をかけても等式は成り立つので、2(x + y) = 12、つまり 2x + 2y = 12 も成り立つ。逆に、x、y が 2x + 2y = 12 を成り立たせるとする。等式の両辺を 0 でない同じ数 2 でわっても等式は成り立つので、x + y = 6 も成り立つ。よって、2 つの式を成り立たせる組は同じであり、2 倍しても連立方程式の解は変わらない。」と書ければよい。①「〜とする」、② 2 倍する・2 でわる変形、③ 等式の性質で結ぶ、がそろっているかを見る。片方の向き（2 倍しても成り立つ）だけで終わっていたら、逆の向き（2 でわると元にもどる）がないと「解がふえない」ことまでは言えないと話す。0 倍してはいけないのは、0 = 0 になって元の式の中身が消えるからである。
