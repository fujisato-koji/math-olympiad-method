  - part: 離
    id: "7a2c01979d"
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - A-011
    - A-013
    - N-018
    text: 7/12 より大きく 3/5 より小さい分数のうち、これ以上約分できず、分母が 70 以下のものは、何こありますか。
    answer: 24
    check: sum(1 for b in range(1, 71) for a in range(1, b + 1) if math.gcd(a, b) == 1 and Fraction(7, 12) < Fraction(a, b) < Fraction(3, 5))
    hints:
    - a/b が 7/12 より大きいとは、12a と 7b の大きさがどうなることかな。a、b は整数だから、その差はどんな数になるかな。
    - a/b が 7/12 より大きいときの差と、3/5 より小さいときの差を、どちらも整数 1 以上の式で書こう。2 つの整数ができるね。
    - その 2 つの整数を新しい文字でおくと、数えやすくならないかな。
    paths:
    - - a/b が 7/12 より大きいのは 12a が 7b より大きいとき、3/5 より小さいのは 5a が 3b より小さいとき。a、b は整数なので、12a − 7b は 1 以上、3b − 5a も 1 以上の整数になる
      - p = 12a − 7b、q = 3b − 5a とおいて、a と b について連立方程式を解くと、b = 5p + 12q、a = 3p + 7q になる。たしかめ：5 × (12a − 7b) + 12 × (3b − 5a) = −35b + 36b = b
      - a と b の公約数は、p = 12a − 7b と q = 3b − 5a をわり切るので p と q の公約数になる。反対に p と q の公約数は、b = 5p + 12q と a = 3p + 7q をわり切るので a と b の公約数になる。だから、a と b の最大公約数は p と q の最大公約数と同じ。約分できないことは、p と q の最大公約数が 1 であることと同じ
      - 数えるのは、5p + 12q ≤ 70 で、p、q が 1 以上の整数で、最大公約数が 1 の組。q ごとに数える。q = 1 なら p は 1 から 11 までの 11 こ。q = 2 なら p ≤ 9 で 2 でわり切れない数の 5 こ。q = 3 なら p ≤ 6 で 3 の倍数でない 4 こ。q = 4 なら p ≤ 4 で 2 でわり切れない数の 2 こ。q = 5 なら p ≤ 2 で 2 こ。q = 6 だと 5p ≤ −2 でできない
      - 11 + 5 + 4 + 2 + 2 = 24 こ。（分母がいちばん小さいのは p = q = 1 の 17。）
    - - 7/12 より大きいのは 12a > 7b、3/5 より小さいのは 5a < 3b。b について書き直すと 5a/3 < b < 12a/7 になる
      - 5a/3 < b ≤ 70 なので、a < 42、つまり a は 41 以下。a が 1 から 9 までは、5a/3 と 12a/7 の間に整数 b が入らない
      - a を 10 から 41 まで順に調べて、間に入る整数 b を書き出す。a = 10 なら b = 17、a = 13 なら b = 22、a = 16 なら b = 27、a = 17 なら b = 29、a = 19 なら b = 32、a = 20 なら b = 34、a = 22 なら b = 37、a = 23 なら b = 39、a = 24 なら b = 41、a = 25 なら b = 42、a = 26 なら b = 44、a = 27 なら b = 46、a = 28 なら b = 47、a = 29 なら b = 49、a = 30 なら b = 51、a = 31 なら b = 52、53、a = 32 なら b = 54、a = 33 なら b = 56、a = 34 なら b = 57、58、a = 35 なら b = 59、a = 36 なら b = 61、a = 37 なら b = 62、63、a = 38 なら b = 64、65、a = 39 なら b = 66、a = 40 なら b = 67、68、a = 41 なら b = 69、70
      - 数えると全部で 32 組。この中には約分できる組がある（a と b に 1 より大きい公約数がある）。20/34、26/44、30/51、32/54、34/58、38/64、39/66、40/68 の 8 組
      - 32 − 8 = 24 こ
    note: 考えどころは 3 つ：①分数の大小を整数の不等式に直す（a/b と 7/12 のちがいは、整数 12a − 7b が 1 以上ということ）、②その 2 つの整数 p、q を新しい文字とみて、連立方程式で a と b を p と q で表す（置きかえ）、③a と b の最大公約数が p と q の最大公約数と同じことを使い、約分できないきまりを p と q のほうで数える。7/12 と 3/5 は 3 × 12 − 5 × 7 = 1 のとなりどうしで、これが「12a − 7b と 3b − 5a が 1 以上の整数」から連立方程式がきれいに解ける理由（係数の行列式が 1）。2 本目は 5a/3 < b < 12a/7 に直して、分子 a ごとに入る b を書き出して数え、約分できる 8 組をのぞく。「2 つの分数の間にある、分母がいちばん小さい分数」を求める定番に近いが、こちらはきまりを満たす分数のこ数を問うので同じ問いではない。check は、分母 b を 1 から 70、分子 a を 1 から b まで全部調べ、最大公約数が 1 で 7/12 と 3/5 の間にあるものを数える（24）。
