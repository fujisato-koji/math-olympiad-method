# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "61b08419ba"
    kinds: [道筋]
    text: 連立方程式 ①、② を解きます。y はいくつですか。
    figure: "47x + 53y = 223 …①\n53x + 47y = 277 …②"
    answer: −2
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([y for x in range(-20, 21) for y in range(-20, 21) if 47 * x + 53 * y == 223 and 53 * x + 47 * y == 277][0])"
    hints:
      - 係数をそろえて消そうとすると、数が大きくなって大変だね。
      - text: ① と ② の係数は、入れかわっているね。足すとどうなるかな。
        svg: '<svg viewBox="0 0 320 142" xmlns="http://www.w3.org/2000/svg"><text x="10" y="40" font-size="16" text-anchor="start" fill="currentColor">①</text><rect x="76.2" y="19" width="43.5" height="30" rx="7" fill="#7fc8f8" fill-opacity="0.5"/><text x="98" y="40" font-size="19" text-anchor="middle" fill="currentColor">47x</text><rect x="140" y="19" width="60.1" height="30" rx="7" fill="#f3c969" fill-opacity="0.5"/><text x="170" y="40" font-size="19" text-anchor="middle" fill="currentColor">+ 53y</text><text x="264" y="40" font-size="19" text-anchor="middle" fill="currentColor">223</text><text x="216" y="40" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="10" y="80" font-size="16" text-anchor="start" fill="currentColor">②</text><rect x="76.2" y="59" width="43.5" height="30" rx="7" fill="#f3c969" fill-opacity="0.5"/><text x="98" y="80" font-size="19" text-anchor="middle" fill="currentColor">53x</text><rect x="140" y="59" width="60.1" height="30" rx="7" fill="#7fc8f8" fill-opacity="0.5"/><text x="170" y="80" font-size="19" text-anchor="middle" fill="currentColor">+ 47y</text><text x="264" y="80" font-size="19" text-anchor="middle" fill="currentColor">277</text><text x="216" y="80" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="62" y="80" font-size="18" text-anchor="middle" fill="currentColor">+)</text><line x1="58" y1="94" x2="300" y2="94" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="98" y="126" font-size="19" text-anchor="middle" fill="currentColor">□x</text><text x="170" y="126" font-size="19" text-anchor="middle" fill="currentColor">+ □y</text><text x="264" y="126" font-size="19" text-anchor="middle" fill="currentColor">□</text><text x="216" y="126" font-size="19" text-anchor="middle" fill="currentColor">=</text></svg>'
      - ひくとどうなるかな。x + y と x − y の値がわかれば、x と y はすぐに求められるよ。
    paths:
