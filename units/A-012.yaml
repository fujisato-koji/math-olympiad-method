          - どちらの向きにも、使った等式の性質を書きましょう。
        paths:
          - [x + y = 6 とする, 両辺を 2 倍する（等式の性質）, 2x + 2y = 12, 逆に 2 でわると元にもどる, 組は同じ]
          - [組の例 x = 1、y = 5 で 1 + 5 = 6、2 + 10 = 12, どの組でも 2(x + y) と 2 × 6 は等しい, 2 でわれば元の式にもどる, 組は同じ]
