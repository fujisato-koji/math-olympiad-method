        figure: "x + y = 9 …①\nx − y = 5 …②"
        explain: 例：「x、y が ① と ② を両方とも成り立たせる数だとする。② から、x − y と 5 は同じ数である。等式の両辺に同じ数を足しても等式は成り立つので、① の左辺に x − y を、右辺に 5 を足してよい。すると (x + y) + (x − y) = 9 + 5、つまり 2x = 14。両辺を 0 でない同じ数 2 でわって x = 7。① に代入すると 7 + y = 9 で、両辺から 7 をひいて y = 2。逆に、x = 7、y = 2 は 7 + 2 = 9、7 − 2 = 5 で両方を成り立たせる。よって、解は x = 7、y = 2 である。」と書ければよい。①「〜とする」で x、y を決める、② 式を変形する、③ どの変形も等式の性質（両辺に同じ数を足す、0 でない同じ数でわる）で結ぶ、の 3 つがそろっているかを見る。「① と ② を足してよい」わけ（x − y と 5 は等しいので、両辺に同じ数を足したことになる）が書けていれば、なおよい。x と y に数を入れて見つけただけで終わっていたら、例では「ほかに解がない」ことまでは示せないことを話す。
