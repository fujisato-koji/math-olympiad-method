# A-012 連立方程式
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011 に合わせる（負の数は「−」U+2212、「−」の形にそろえる式も A-011 と同じ）。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：2 元 1 次方程式とその解（x と y の組）、連立方程式とその解（代入して確かめる）、2 つの式を足す・ひくで文字を消す。
#   2 日目：式を何倍かして係数をそろえてから消す（加減法）。解が負の数のもの、分数の係数（分母をはらう）。
#   3 日目：代入法（y = … や x = … の式を、もう一方に代入する）、かっこのある式、A = B = C の形。
#   4 日目：わけ。5 日目：A-011、A-010 と混ぜる（2 つの買い物の代金から 1 個の値段を求める、解から係数を求める）。6 日目：確認。
# 前提は A-011（1 次方程式）だけ。連立方程式は figure に 2 行で書き、①、② の番号をつける。
# 答えの鍵盤では x と y の組を 1 度に打てないので、組を答える問題は choices（「x = 4、y = 3」）にし、
#   打つ問題は「x はいくつ」のように 1 つの値を聞く。
#   choices の check は、選択肢ごとの組を 2 つの式に代入して、両方を成り立たせるものを選び出す。
#   打つ問題の check は、x と y を −20〜20 の整数で総当たりして、両方の式を成り立たせる組をさがす。
# 文章題の型（和差、つるかめ、過不足、植木）は A-014 で扱う。ここでの文章題は、2 つの買い物の代金のように、
#   2 つの等しい関係がそのまま式になるものだけにした。3 つの文字の連立方程式、解がない・解が限りなくある連立方程式は扱わない。
# 連立方程式は、化学反応式の係数（H-010）や、つり合う力、回路の電流のように、わからない数が 2 つ以上ある計算の入口になる（D-026）。

id: A-012
days:
  - day: 1
    items:
      - part: 見本
        text: x + y = 7 …① と x − y = 1 …② の両方を成り立たせる x、y を求めてみましょう。
        figure: "x + y = 7 …①\nx − y = 1 …②"
        explain: x + y = 7 のように、2 つの文字をふくむ 1 次の方程式を 2 元 1 次方程式といいます。x + y = 7 を成り立たせる x、y の組は、x = 1、y = 6 や x = 4、y = 3 など、たくさんあります。2 つの方程式を組にしたものを連立方程式といい、両方を同時に成り立たせる x、y の組を、連立方程式の解といいます。① と ② の左辺どうし、右辺どうしを足すと (x + y) + (x − y) = 7 + 1 で、y が消えて 2x = 8、x = 4 です。x = 4 を ① に代入すると 4 + y = 7 で y = 3 です。解は x = 4、y = 3 です。② に代入しても 4 − 3 = 1 で成り立ちます。このように、1 つの文字を消して、1 つの文字の方程式にして解きます。
      - part: 思い出す
        text: 方程式 4x − 7 = x + 8 を解きましょう。x はいくつですか。
        answer: 5
        check: "Fraction(8 + 7, 4 - 1)"
        hints:
          - x の項を左辺に、数の項を右辺に集めましょう。
          - 移項すると、符号が変わります。
          - 両辺をまとめてから、x の係数でわりましょう。
        paths:
          - [4x − x = 8 + 7, 3x = 15, x = 5]
      - part: 思い出す
        text: 方程式 3(x − 2) = 15 を解きましょう。x はいくつですか。
        answer: 7
        check: "Fraction(15 + 6, 3)"
        hints:
          - まず、分配法則でかっこを外しましょう。
          - − 6 を右辺に移項しましょう。
          - 両辺を 3 でわりましょう。
        paths:
          - [3x − 6 = 15, 3x = 21, x = 7]
          - [両辺を 3 でわる, x − 2 = 5, x = 7]
      - part: 今日
        text: 次のうち、連立方程式 ①、② の解はどれですか。
        figure: "x + y = 9 …①\nx − y = 3 …②"
        choices: [x = 6、y = 3, x = 5、y = 4, x = 7、y = 2]
        answer: x = 6、y = 3
        check: "[c for c, (x, y) in {'x = 6、y = 3': (6, 3), 'x = 5、y = 4': (5, 4), 'x = 7、y = 2': (7, 2)}.items() if x + y == 9 and x - y == 3][0]"
        hints:
          - 解は、① と ② の両方を成り立たせる組です。
          - それぞれの組を、まず ① に代入してみましょう。
          - ① が成り立つ組を、② にも代入しましょう。
        paths:
          - [どの組も ① は成り立つ, ② に代入する, 6 − 3 = 3 で成り立つのは x = 6、y = 3]
        note: 3 つとも ① は成り立つ。① だけを確かめて選びやすい。連立方程式の解は、両方の式に代入して確かめる。
      - part: 今日
        text: 連立方程式 ①、② を、2 つの式を足して解きます。x はいくつですか。
        figure: "x + y = 11 …①\nx − y = 5 …②"
        answer: 8
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if x + y == 11 and x - y == 5][0]"
        hints:
          - ① と ② の左辺どうし、右辺どうしを足しましょう。
          - y と −y を足すと、どうなるでしょう。
          - x だけの方程式になったら、x の係数で両辺をわりましょう。
        paths:
          - [①＋② で 2x = 16, x = 8, ① に代入して y = 3]
      - part: 今日
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "5x + y = 23 …①\n2x + y = 11 …②"
        answer: 4
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if 5 * x + y == 23 and 2 * x + y == 11][0]"
        hints:
          - y の係数は、① も ② も同じです。
          - ① から ② をひくと、y が消えます。
          - 左辺は 5x − 2x、右辺は 23 − 11 になります。
        paths:
          - [①−② で 3x = 12, x = 4, ② に代入して 8 + y = 11 で y = 3]
        note: 足してしまうと y が消えない。消したい文字の係数が同じならひき、符号が反対なら足す。
      - part: 挑戦
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "2x + 3y = 22 …①\n2x − y = 6 …②"
        answer: 5
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if 2 * x + 3 * y == 22 and 2 * x - y == 6][0]"
        hints:
          - x の係数が同じなので、ひけば x が消えます。
          - 3y − (−y) がいくつになるかに気をつけましょう。
          - 先に y を求めてから、② に代入して x を求めましょう。
        paths:
          - [①−② で 4y = 16, y = 4, ② に代入して 2x − 4 = 6, x = 5]
        note: 3y − (−y) を 2y としやすい。ひく式の項は、すべて符号が変わる。
    extra:
      - part: 今日
        text: 次のうち、2 元 1 次方程式 2x + y = 10 の解でないものはどれですか。
        choices: [x = 3、y = 4, x = 1、y = 8, x = 4、y = 3]
        answer: x = 4、y = 3
        check: "[c for c, (x, y) in {'x = 3、y = 4': (3, 4), 'x = 1、y = 8': (1, 8), 'x = 4、y = 3': (4, 3)}.items() if 2 * x + y != 10][0]"
        hints:
          - それぞれの組を、2x + y に代入しましょう。
          - 2x は 2 × x のことです。
          - 値が 10 にならないものをさがしましょう。
        paths:
          - [2 × 4 + 3 = 11, 10 にならない, x = 4、y = 3]
        note: 2 元 1 次方程式の解は 1 組ではない。いくつもある組のうち、2 つ目の式も成り立たせる組が連立方程式の解になる。
      - part: 今日
        text: 連立方程式 ①、② を解きます。y はいくつですか。
        figure: "x + y = 13 …①\nx − y = 7 …②"
        answer: 3
        check: "[y for x in range(-20, 21) for y in range(-20, 21) if x + y == 13 and x - y == 7][0]"
        hints:
          - ① と ② を足すと、y が消えます。
          - x を求めたら、① に代入しましょう。
          - 聞かれているのは y です。
        paths:
          - [①＋② で 2x = 20, x = 10, 10 + y = 13 で y = 3]
          - [①−② で 2y = 6, y = 3]
      - part: 挑戦
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "3x + 2y = 21 …①\nx − 2y = −1 …②"
        answer: 5
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if 3 * x + 2 * y == 21 and x - 2 * y == -1][0]"
        hints:
          - y の係数は 2 と −2 で、符号が反対です。
          - 符号が反対のときは、足すと消えます。
          - 右辺は 21 + (−1) になります。
        paths:
          - [①＋② で 4x = 20, x = 5, ① に代入して 15 + 2y = 21 で y = 3]

  - day: 2
    items:
      - part: 見本
        text: 連立方程式 3x + 2y = 16 …①、x + y = 6 …② を解いてみましょう。
        figure: "3x + 2y = 16 …①\nx + y = 6 …②"
        explain: このままでは、足してもひいても文字が消えません。② の両辺を 2 倍すると 2x + 2y = 12 …②′ となり、y の係数が ① とそろいます。① − ②′ で x = 4、② に代入して 4 + y = 6 で y = 2 です。等式の両辺に同じ数をかけても等式は成り立つので（A-011）、② を 2 倍してもよいのです。両方の式を何倍かすることもあります。2x + 3y = 13、3x + 2y = 12 なら、上を 3 倍、下を 2 倍して 6x + 9y = 39、6x + 4y = 24 とし、ひいて 5y = 15、y = 3、x = 2 です。このように、式を足したりひいたりして文字を消す解き方を加減法といいます。
      - part: 思い出す
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "x + y = 12 …①\nx − y = 2 …②"
        answer: 7
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if x + y == 12 and x - y == 2][0]"
        hints:
          - ① と ② を足すと、どの文字が消えるでしょう。
          - 2x = □ の形にしましょう。
          - 両辺を 2 でわりましょう。
        paths:
          - [①＋② で 2x = 14, x = 7]
      - part: 思い出す
        text: 方程式 4x − 9 = x + 6 を解きましょう。x はいくつですか。
        answer: 5
        check: "Fraction(6 + 9, 4 - 1)"
        hints:
          - x の項を左辺に、数の項を右辺に集めましょう。
          - 移項すると、符号が変わります。
          - x の係数で両辺をわりましょう。
        paths:
          - [4x − x = 6 + 9, 3x = 15, x = 5]
      - part: 今日
        text: 連立方程式 ①、② を解きます。y はいくつですか。
        figure: "2x + y = 8 …①\nx + 3y = −1 …②"
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([y for x in range(-20, 21) for y in range(-20, 21) if 2 * x + y == 8 and x + 3 * y == -1][0])"
        hints:
          - y の係数をそろえるには、① を何倍すればよいでしょう。
          - ① を 3 倍した式から ② をひくと、y が消えます。
          - x を求めたら、① に代入して y を求めましょう。
        paths:
          - [①×3 で 6x + 3y = 24, ② をひいて 5x = 25 で x = 5, ① に代入して 10 + y = 8, y = −2]
      - part: 今日
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "3x + 2y = 6 …①\n5x − 6y = 38 …②"
        answer: 4
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if 3 * x + 2 * y == 6 and 5 * x - 6 * y == 38][0]"
        hints:
          - y の係数を 6 と −6 にそろえましょう。
          - ① を 3 倍して、② と足しましょう。
          - 右辺の 6 にも 3 をかけるのを忘れないようにしましょう。
        paths:
          - [①×3 で 9x + 6y = 18, ② と足して 14x = 56, x = 4]
        note: ① を 3 倍するとき、左辺だけにかけて右辺にかけ忘れやすい。両辺のすべての項にかける。
      - part: 今日
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "2x + 3y = 1 …①\n3x + 4y = 3 …②"
        answer: 5
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if 2 * x + 3 * y == 1 and 3 * x + 4 * y == 3][0]"
        hints:
          - どちらの式も何倍かしないと、係数がそろいません。
          - x を消すなら、① を 3 倍、② を 2 倍しましょう。
          - y を求めたら、① に代入して x を求めましょう。
        paths:
          - [①×3 − ②×2 で y = −3, ① に代入して 2x − 9 = 1, x = 5]
          - [①×4 − ②×3 で y を消す, −x = −5, x = 5]
        note: 2 本目の道のように、聞かれている x が残るように、消す文字を選ぶこともできる。
      - part: 挑戦
        text: 連立方程式 ①、② を解きます。x はいくつですか。
        figure: "x/2 + y/3 = 5 …①\nx − y = 5 …②"
        answer: 8
        check: "[x for x in range(-20, 21) for y in range(-20, 21) if Fraction(x, 2) + Fraction(y, 3) == 5 and x - y == 5][0]"
        hints:
          - まず ① の両辺に 6 をかけて、分母をはらいましょう。
          - 分母をはらった式と ② で、y の係数をそろえましょう。
          - ② を 2 倍して足すと、y が消えます。
        paths:
          - [①×6 で 3x + 2y = 30, ②×2 で 2x − 2y = 10, 足して 5x = 40 で x = 8]
        note: 分母をはらうとき、右辺の 5 にも 6 をかけ忘れやすい（A-011）。
    extra:
      - part: 今日
        text: 連立方程式 ①、② を解きます。y はいくつですか。
        figure: "4x + 3y = 13 …①\nx + y = 2 …②"
