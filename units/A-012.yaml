        text: 連立方程式 x + y = 9 …①、x − y = 5 …② の解が x = 7、y = 2 であることを、等式の性質を使って、すじ道を立てて書きましょう。
        figure: "x + y = 9 …①\nx − y = 5 …②"
        explain: 例：「x、y が ① と ② を両方とも成り立たせる数だとする。② から、x − y と 5 は同じ数である。等式の両辺に同じ数を足しても等式は成り立つので、① の左辺に x − y を、右辺に 5 を足してよい。すると (x + y) + (x − y) = 9 + 5、つまり 2x = 14。両辺を 0 でない同じ数 2 でわって x = 7。① に代入すると 7 + y = 9 で、両辺から 7 をひいて y = 2。逆に、x = 7、y = 2 は 7 + 2 = 9、7 − 2 = 5 で両方を成り立たせる。よって、解は x = 7、y = 2 である。」と書ければよい。①「〜とする」で x、y を決める、② 式を変形する、③ どの変形も等式の性質（両辺に同じ数を足す、0 でない同じ数でわる）で結ぶ、の 3 つがそろっているかを見る。「① と ② を足してよい」わけ（x − y と 5 は等しいので、両辺に同じ数を足したことになる）が書けていれば、なおよい。x と y に数を入れて見つけただけで終わっていたら、例では「ほかに解がない」ことまではしめせないことを話す。
        hints:
          - 「x、y が ① と ② を両方とも成り立たせる数だとする」から書き始めましょう。
          - text: ② から、x − y と 5 は同じ数です。① の両辺にそれを足すと、等式の性質のどれを使ったことになるでしょう。
            svg: '<svg viewBox="0 0 320 198" xmlns="http://www.w3.org/2000/svg"><text x="142.2" y="42" font-size="19" text-anchor="middle" fill="currentColor">x + y</text><text x="175.6" y="42" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="193.4" y="42" font-size="19" text-anchor="middle" fill="currentColor">9</text><text x="80.5" y="142" font-size="19" text-anchor="middle" fill="currentColor">(x + y)</text><rect x="111.1" y="121" width="91.9" height="30" rx="7" fill="#7fc8f8" fill-opacity="0.5"/><text x="157.1" y="142" font-size="19" text-anchor="middle" fill="currentColor">+ (x − y)</text><text x="210.4" y="142" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="228.3" y="142" font-size="19" text-anchor="middle" fill="currentColor">9</text><rect x="235.7" y="121" width="37.4" height="30" rx="7" fill="#7fc8f8" fill-opacity="0.5"/><text x="254.4" y="142" font-size="19" text-anchor="middle" fill="currentColor">+ 5</text><text x="30" y="42" font-size="16" text-anchor="middle" fill="currentColor">①</text><text x="160" y="84" font-size="14" text-anchor="middle" fill="currentColor">② から、x − y と 5 は同じ数</text><line x1="160" y1="96" x2="160" y2="110.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,116 155.1,107 164.9,107" fill="currentColor"/><text x="160" y="184" font-size="14" text-anchor="middle" fill="currentColor">左辺にも右辺にも、同じ数を足す</text></svg>'
          - x と y を求めたあと、代入してたしかめた文も書きましょう。
        paths:
          - [x、y が両方を成り立たせるとする, x − y と 5 は等しいので ① の両辺に足す（等式の性質）, 2x = 14 で x = 7, y = 2、代入してたしかめる]
          - [x、y が両方を成り立たせるとする, ① の両辺から x をひいて y = 9 − x, ② に代入して x − (9 − x) = 5、2x = 14 で x = 7, y = 2、両方に代入してたしかめる]
      - part: わけ
        id: "db884e64b9"
        text: 連立方程式の式 x + y = 6 を 2 倍して 2x + 2y = 12 にしても、解が変わらないわけを書きましょう。x + y = 6 を成り立たせる x、y の組と、2x + 2y = 12 を成り立たせる x、y の組が同じであることをしめします。
        explain: 例：「x、y が x + y = 6 を成り立たせるとする。等式の両辺に同じ数 2 をかけても等式は成り立つので、2(x + y) = 12、つまり 2x + 2y = 12 も成り立つ。逆に、x、y が 2x + 2y = 12 を成り立たせるとする。等式の両辺を 0 でない同じ数 2 でわっても等式は成り立つので、x + y = 6 も成り立つ。よって、2 つの式を成り立たせる組は同じであり、2 倍しても連立方程式の解は変わらない。」と書ければよい。①「〜とする」、② 2 倍する・2 でわる変形、③ 等式の性質で結ぶ、がそろっているかを見る。一方の向き（2 倍しても成り立つ）だけで終わっていたら、逆の向き（2 でわると元にもどる）がないと「解がふえない」ことまでは言えないと話す。0 倍してはいけないのは、0 = 0 になって元の式の中身が消えるからである。
        hints:
          - 「x、y が x + y = 6 を成り立たせるとする」から書き始め、両辺を 2 倍しましょう。
          - text: 逆に、2x + 2y = 12 を成り立たせる組から始めて、元の式にもどしましょう。てんびんは、2 倍にしても半分にしても、つり合ったままです。
