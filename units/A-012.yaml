        id: "2c8fc038e1"
        text: ① は「y は 2x − 1 と同じ」という式です。② の y を、かっこをつけた (2x − 1) に置きかえると、x だけの式になります。一方の式を他方の式に入れて文字を消す解き方を代入法といいます。
        svg: '<svg viewBox="0 0 320 218" xmlns="http://www.w3.org/2000/svg"><text x="12" y="42" font-size="16" text-anchor="start" fill="currentColor">①</text><text x="12" y="116" font-size="16" text-anchor="start" fill="currentColor">②</text><text x="54.9" y="42" font-size="19" text-anchor="middle" fill="currentColor">y</text><text x="76.3" y="42" font-size="19" text-anchor="middle" fill="currentColor">=</text><rect x="87.7" y="21" width="71.9" height="30" rx="7" fill="#7bc96f" fill-opacity="0.5"/><text x="123.7" y="42" font-size="19" text-anchor="middle" fill="currentColor">2x − 1</text><text x="60.4" y="116" font-size="19" text-anchor="middle" fill="currentColor">3x</text><text x="87.1" y="116" font-size="19" text-anchor="middle" fill="currentColor">+</text><rect x="100" y="93" width="16.9" height="34" rx="14" fill="none" stroke="#f08080" stroke-width="2.5"/><text x="108.5" y="116" font-size="19" text-anchor="middle" fill="currentColor">y</text><text x="129.8" y="116" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="157.1" y="116" font-size="19" text-anchor="middle" fill="currentColor">14</text><path d="M123.7 54 Q146.1 75 113.6 86.2" fill="none" stroke="#f08080" stroke-width="2.2" stroke-linecap="round"/><polygon points="108.5,88 115.4,80.4 118.6,89.7" fill="#f08080"/><text x="12" y="176" font-size="16" text-anchor="start" fill="currentColor">→</text><text x="60.4" y="176" font-size="19" text-anchor="middle" fill="currentColor">3x</text><text x="87.1" y="176" font-size="19" text-anchor="middle" fill="currentColor">+</text><rect x="98.5" y="155" width="87.1" height="30" rx="7" fill="#7bc96f" fill-opacity="0.5"/><text x="142.1" y="176" font-size="19" text-anchor="middle" fill="currentColor">(2x − 1)</text><text x="197.1" y="176" font-size="19" text-anchor="middle" fill="currentColor">=</text><text x="224.3" y="176" font-size="19" text-anchor="middle" fill="currentColor">14</text><text x="160" y="206" font-size="14" text-anchor="middle" fill="currentColor">5x − 1 = 14 で x = 3、y = 2 × 3 − 1 = 5</text></svg>'
        explain: ① は「y は 2x − 1 と等しい」という式です。② の y を 2x − 1 に置きかえると 3x + (2x − 1) = 14、5x − 1 = 14、5x = 15、x = 3 です。① に代入して y = 2 × 3 − 1 = 5 です。解は x = 3、y = 5 です。このように、一方の式を他方の式に代入して文字を消す解き方を代入法といいます。y = … や x = … の形の式があるときに便利です。置きかえるときは、かっこをつけて代入します。
