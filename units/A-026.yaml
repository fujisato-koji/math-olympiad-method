      - part: わけ
        id: "5b811e4d4d"
        text: 整式 P(x) について、P(a) = 0 ならば、P(x) は x − a を因数にもちます。また、ぎゃくに、P(x) が x − a を因数にもてば P(a) = 0 です（因数定理）。このわけを、すじ道を立てて書きましょう。
        explain: 例：「P(a) = 0 とする。P(x) を x − a でわった商を Q(x) とすると、剰余の定理から余りは P(a) = 0 なので、P(x) = (x − a)Q(x) である。よって、P(x) は x − a を因数にもつ。ぎゃくに、P(x) が x − a を因数にもつとする。ある整式 Q(x) を使って P(x) = (x − a)Q(x) と書けるので、x = a を代入すると P(a) = 0 × Q(a) = 0 である。」と書ければよい。①「〜とする」でかてい（P(a) = 0、または因数にもつこと）を置く、② P(x) = (x − a)Q(x) + (余り) の式を使う、③ 約束した事実（剰余の定理、0 にどんな数をかけても 0）で結ぶ、の 3 つがそろっているかを見る。「ならば」の両方の向きを、別々に書けているかを見る。前の問題（剰余の定理）を約束した事実として使ってよい。3 次式をいんすうぶんかいするとき、まず P(a) = 0 となる a をさがすのはこのためだと話す。
        hints:
          - まず「P(a) = 0 とする」から書き始めましょう。
          - text: 剰余の定理を使うと、P(x) を x − a でわった余りはいくつでしょう。
