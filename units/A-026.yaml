        text: 等式 x² + 5x + 1 = (x + 2)² + a(x + 2) + b が x についてのこうとうしきになるように、a と b を決めてみましょう。また、x⁵ + 3x² − 2 を x² − x でわった《余り》を求めてみましょう。
        svg: '<svg viewBox="0 0 320 298" xmlns="http://www.w3.org/2000/svg"><text x="160" y="16" font-size="13" text-anchor="middle" fill="#3d8fd1">① 同じ次数の係数をくらべる（けいすうひかく）</text><rect x="109" y="30" width="29.3" height="28" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="123.7" y="49.2" font-size="15" text-anchor="middle" fill="currentColor"><tspan font-style="italic">x</tspan>²</text><rect x="152.3" y="30" width="46.9" height="28" rx="6" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="175.7" y="49.2" font-size="15" text-anchor="middle" fill="currentColor">+ 5<tspan font-style="italic">x</tspan></text><rect x="213.2" y="30" width="37.8" height="28" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="232.1" y="49.2" font-size="15" text-anchor="middle" fill="currentColor">+ 1</text><rect x="55.2" y="90" width="29.3" height="28" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="69.8" y="109.2" font-size="15" text-anchor="middle" fill="currentColor"><tspan font-style="italic">x</tspan>²</text><rect x="92.5" y="90" width="87.9" height="28" rx="6" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="136.4" y="109.2" font-size="15" text-anchor="middle" fill="currentColor">+ (4 + <tspan font-style="italic">a</tspan>)<tspan font-style="italic">x</tspan></text><rect x="188.4" y="90" width="116.4" height="28" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="246.6" y="109.2" font-size="15" text-anchor="middle" fill="currentColor">+ (4 + 2<tspan font-style="italic">a</tspan> + <tspan font-style="italic">b</tspan>)</text><text x="8" y="49" font-size="13" text-anchor="start" fill="currentColor">左辺</text><text x="8" y="100" font-size="13" text-anchor="start" fill="currentColor">右辺を</text><text x="8" y="116" font-size="13" text-anchor="start" fill="currentColor">てんかい</text><line x1="123.7" y1="60" x2="69.8" y2="88" stroke="#3d8fd1" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/><line x1="175.7" y1="60" x2="136.4" y2="88" stroke="#d9534f" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/><line x1="232.1" y1="60" x2="246.6" y2="88" stroke="#b8860b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="160" y="140" font-size="14" text-anchor="middle" fill="currentColor">4 + <tspan font-style="italic">a</tspan> = 5 より <tspan font-style="italic">a</tspan> = 1</text><line x1="16" y1="154" x2="304" y2="154" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 4" stroke-opacity="0.6"/><text x="160" y="176" font-size="13" text-anchor="middle" fill="#3d8fd1">② わる式が 0 になる <tspan font-style="italic">x</tspan> を入れる（すうち代入）</text><text x="55.1" y="211.2" font-size="15" text-anchor="middle" fill="currentColor"><tspan font-style="italic">x</tspan>⁵ + 3<tspan font-style="italic">x</tspan>² − 2</text><text x="110" y="211.2" font-size="15" text-anchor="middle" fill="currentColor">=</text><rect x="121.1" y="192" width="104.9" height="28" rx="6" fill="#c8ccd6" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="173.5" y="211.2" font-size="15" text-anchor="middle" fill="currentColor"><tspan font-style="italic">x</tspan>(<tspan font-style="italic">x</tspan> − 1)<tspan font-style="italic">Q</tspan>(<tspan font-style="italic">x</tspan>)</text><text x="237.1" y="211.2" font-size="15" text-anchor="middle" fill="currentColor">+</text><rect x="248.2" y="192" width="60.5" height="28" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="278.4" y="211.2" font-size="15" text-anchor="middle" fill="currentColor"><tspan font-style="italic">ax</tspan> + <tspan font-style="italic">b</tspan></text><text x="173.5" y="236" font-size="13" text-anchor="middle" fill="#d9534f"><tspan font-style="italic">x</tspan> = 0、1 で 0</text><text x="160" y="262" font-size="14" text-anchor="middle" fill="currentColor"><tspan font-style="italic">x</tspan> = 0：−2 = <tspan font-style="italic">b</tspan>　　<tspan font-style="italic">x</tspan> = 1：2 = <tspan font-style="italic">a</tspan> + <tspan font-style="italic">b</tspan></text><text x="160" y="286" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">余りは 4<tspan font-style="italic">x</tspan> − 2</text></svg>'
        explain: どんな x を代入しても両辺のあたいが等しくなる等式を、x についてのこうとうしきといいます（(x + 1)² = x² + 2x + 1 など）。こうとうしきでは、両辺をてんかいして整理したとき、同じ次数のこうの係数がそれぞれ等しくなります（けいすうひかく）。また、どんな x を代入してもよいので、計算が楽になる x を選んで代入することもできます（すうち代入）。① では右辺をてんかいして x² + (4 + a)x + (4 + 2a + b) とし、x の係数をくらべて 4 + a = 5 で a = 1、ていすうこうをくらべて 4 + 2 + b = 1 で b = −5 です（x = −2 を代入しても b = −5 がすぐ出ます）。② 2 次式でわった余りは 1 次以下なので、ax + b とおけます。x⁵ + 3x² − 2 = x(x − 1)Q(x) + ax + b に x = 0 を代入すると b = −2、x = 1 を代入すると 2 = a + b で a = 4 となり、余りは 4x − 2 です。わる式が 0 になる x を代入すると、商の部分が消えて、余りだけが残ります。
