fill="currentColor" font-weight="bold">7</text><text x="271" y="187" font-size="13" text-anchor="start" fill="#3d8fd1">かけて</text><text x="271" y="212" font-size="13" text-anchor="start" fill="#d9534f">ひく</text><text x="217" y="212" font-size="14" text-anchor="end" fill="#d9534f">余り</text><rect x="36.2" y="229" width="77" height="24" rx="6" fill="#b39ddb" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="74.7" y="245.6" font-size="13" text-anchor="middle" fill="currentColor">わられる式</text><text x="122.7" y="245.6" font-size="13" text-anchor="middle" fill="currentColor">=</text><rect x="132.1" y="229" width="51" height="24" rx="6" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="157.6" y="245.6" font-size="13" text-anchor="middle" fill="currentColor">わる式</text><text x="192.5" y="245.6" font-size="13" text-anchor="middle" fill="currentColor">×</text><rect x="201.9" y="229" width="25" height="24" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="214.4" y="245.6" font-size="13" text-anchor="middle" fill="currentColor">商</text><text x="236.3" y="245.6" font-size="13" text-anchor="middle" fill="currentColor">+</text><rect x="245.8" y="229" width="38" height="24" rx="6" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="264.8" y="245.6" font-size="13" text-anchor="middle" fill="currentColor">余り</text></svg>'
        explain: 整式（多項式）のわり算も、数の筆算と同じように、次数の高いこうから順に商を立てます。① 2x³ ÷ x = 2x² を商に立て、2x²(x − 2) = 2x³ − 4x² をひくと x² + 4x − 5 が残ります。② x を立てて x(x − 2) = x² − 2x をひくと 6x − 5、③ 6 を立てて 6(x − 2) = 6x − 12 をひくと 7 が残ります。7 は x − 2 より次数が低いので、ここで止めます。商は 2x² + x + 6、余りは 7 です。わられる式を A、わる式を B、商を Q、余りを R とすると、A = BQ + R（R の次数は B の次数より低い）が成り立ちます。(x − 2)(2x² + x + 6) + 7 をてんかいすると元の式にもどるので、答えをたしかめられます。わられる式にぬけている次数のこうがあるときは、x³ + 0x² − 3 のようにそのこうを 0 として書き、位をそろえて計算します。
