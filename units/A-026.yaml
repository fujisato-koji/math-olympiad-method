 y2="201" stroke="#b8860b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="160" y="252" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold"><tspan font-style="italic">α</tspan> + <tspan font-style="italic">β</tspan> = 5、<tspan font-style="italic">αβ</tspan> = 3</text></svg>'
        explain: 2 次ほうていしき ax² + bx + c = 0 の 2 つのかいを α、β とすると、α + β = −b/a、αβ = c/a が成り立ちます（かいと係数の関係、わけは 6 日目）。因数定理から ax² + bx + c = a(x − α)(x − β) といんすうぶんかいでき、右辺をてんかいした ax² − a(α + β)x + aαβ と係数をくらべると出てきます。x² − 5x + 3 = 0 では、α + β = 5、αβ = 3 です。α² + β² は、(α + β)² = α² + 2αβ + β² から、α² + β² = (α + β)² − 2αβ = 25 − 6 = 19 と求められます。α と β を入れかえても変わらない式（たいしょうしき）は、α + β と αβ で表せます。ぎゃくに、2 つの数 p、q をかいとする 2 次ほうていしきの 1 つは x² − (p + q)x + pq = 0 です（2 と 7 なら x² − 9x + 14 = 0）。
