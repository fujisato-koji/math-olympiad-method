# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 道筋]
    uses: [A-012]
    text: x¹⁰⁰ を x² − 3x + 2 でわった余りはどれですか。
    choices: [(2¹⁰⁰ − 1)x − 2¹⁰⁰ + 2, (2¹⁰⁰ − 1)x + 2¹⁰⁰ − 2, (2¹⁰⁰ + 1)x − 2¹⁰⁰, 2¹⁰⁰x − 2¹⁰⁰ + 1]
    answer: (2¹⁰⁰ − 1)x − 2¹⁰⁰ + 2
    check: "[c for c, (a, b) in {'(2¹⁰⁰ − 1)x − 2¹⁰⁰ + 2': (2 ** 100 - 1, -2 ** 100 + 2), '(2¹⁰⁰ − 1)x + 2¹⁰⁰ − 2': (2 ** 100 - 1, 2 ** 100 - 2), '(2¹⁰⁰ + 1)x − 2¹⁰⁰': (2 ** 100 + 1, -2 ** 100), '2¹⁰⁰x − 2¹⁰⁰ + 1': (2 ** 100, -2 ** 100 + 1)}.items() if a * 1 + b == 1 ** 100 and a * 2 + b == 2 ** 100][0]"
    hints:
      - わる式は 2 次式なので、余りは ax + b とおけるね。
      - x² − 3x + 2 を因数分解して、わる式が 0 になる x を代入しよう。
      - a と b の連立方程式（A-012）を解こう。2¹⁰⁰ は計算せずに文字のように扱えばよいよ。
    paths:
      - [x¹⁰⁰ = (x − 1)(x − 2)Q(x) + ax + b とする, x = 1 で a + b = 1、x = 2 で 2a + b = 2¹⁰⁰, ひいて a = 2¹⁰⁰ − 1, b = 1 − a = 2 − 2¹⁰⁰]
    note: わり算の筆算は 100 回近く続くので現実的でない。余りを文字でおき、わる式が 0 になる値を代入して連立方程式（A-012）にするのが鍵。2¹⁰⁰ をかたまりのまま扱えるかも見る。
  - part: 離
    kinds: [道筋]
    text: x = 1 + √2 のとき、x⁴ − 2x³ + x² + 3 の値はどれですか。
    choices: [9 + 4√2, 5 + 4√2, 9 + 2√2, 17 + 12√2]
    answer: 9 + 4√2
    check: "[c for c, v in {'9 + 4√2': 9 + 4 * math.sqrt(2), '5 + 4√2': 5 + 4 * math.sqrt(2), '9 + 2√2': 9 + 2 * math.sqrt(2), '17 + 12√2': 17 + 12 * math.sqrt(2)}.items() if math.isclose(v, (lambda x: x ** 4 - 2 * x ** 3 + x * x + 3)(1 + math.sqrt(2)))][0]"
    hints:
      - そのまま代入すると、√2 の累乗の計算が大変だね。
      - x − 1 = √2 の両辺を 2 乗すると、x がみたす 2 次方程式ができるよ。
      - x⁴ − 2x³ + x² + 3 を、その 2 次式でわった余りを考えよう。
    paths:
      - [x − 1 = √2 を 2 乗して x² − 2x − 1 = 0, x⁴ − 2x³ + x² + 3 = (x² − 2x − 1)(x² + 2) + 4x + 5, x² − 2x − 1 = 0 なので値は 4x + 5, 4(1 + √2) + 5 = 9 + 4√2]
    note: わり算で次数を下げる（A = BQ + R で B = 0 になる値を入れると R だけが残る）という剰余の考えの使い方。わり算の商と余りは (x² − 2x − 1)(x² + 2) + 4x + 5 を展開して確かめさせる。
  - part: 離
    kinds: [数, 手数]
    text: 3 次方程式 6x³ − 13x² + x + 2 = 0 の解のうち、負の数のものはいくつですか。
    answer: −1/3
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([x for x in [Fraction(p, q) for p in range(-12, 13) for q in (1, 2, 3, 6)] if x < 0 and 6 * x ** 3 - 13 * x ** 2 + x + 2 == 0][0])"
    hints:
      - 解の候補は、±（2 の約数）/（6 の約数）だね。たくさんあるので、整数から順にためそう。
      - P(2) を計算してみよう。
      - x − 2 でわった商の 2 次式を因数分解しよう。
    paths:
      - [P(2) = 48 − 52 + 2 + 2 = 0 より x − 2 が因数, 商は 6x² − x − 1 = (2x − 1)(3x + 1), 解は 2、1/2、−1/3, 負の数のものは −1/3]
    note: 候補が ±1、±2、±1/2、±1/3、±2/3、±1/6 と多く、分数の 3 乗の計算が続く。1 つ見つけたらすぐに 2 次式に下ろすのが手数を減らすこつ。
