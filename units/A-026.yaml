      - part: わけ
        id: "b1b56522f1"
        text: 整式 P(x) を x − a でわった余りは P(a) です（剰余の定理）。このわけを、すじ道を立てて書きましょう。
        explain: 例：「P(x) を x − a でわった商を Q(x)、余りを r とする。余りの次数はわる式 x − a の次数 1 より低いので、r は x をふくまない数である。わり算の決まり（A = BQ + R）から、P(x) = (x − a)Q(x) + r が、どの x でも成り立つ（こうとうしき）。この式に x = a を代入すると、P(a) = (a − a)Q(a) + r = 0 × Q(a) + r = r となる。よって、余り r は P(a) である。」と書ければよい。①「〜とする」で商 Q(x) と余り r を決める、② こうとうしき P(x) = (x − a)Q(x) + r に x = a を代入する、③ 約束した事実（A = BQ + R、余りの次数はわる式より低い、0 にどんな数をかけても 0）で結ぶ、の 3 つがそろっているかを見る。r が数であること（余りの次数が低いこと）を書き落としやすい。r が x をふくむなら、x = a を代入したあたいは r(a) になって、余りそのものとは言えないからだと話す。ax − b でわる場合は、P(x) = (ax − b)Q(x) + r に x = b/a を代入すればよいことにもふれる。
        hints:
          - 商を Q(x)、余りを r として、P(x) を式で書きましょう。
          - 余り r は、x をふくむでしょうか。わる式の次数から考えましょう。
          - text: その式に x = a を代入すると、どの部分が消えるでしょう。
