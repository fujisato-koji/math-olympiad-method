      - part: わけ
        text: 2 次方程式 ax² + bx + c = 0 の 2 つの解を α、β とすると、α + β = −b/a、αβ = c/a です（解と係数の関係）。b² − 4ac が 0 以上のとき、このわけを筋道を立てて書きましょう。
        explain: 例：「a は 0 でない数とし、D = b² − 4ac は 0 以上とする。解の公式（A-017）から、α = (−b + √D)/(2a)、β = (−b − √D)/(2a) としてよい。α + β = ((−b + √D) + (−b − √D))/(2a) = −2b/(2a) = −b/a。αβ = (−b + √D)(−b − √D)/(4a²) = (b² − D)/(4a²)（(x + y)(x − y) = x² − y²、A-015）。b² − D = b² − (b² − 4ac) = 4ac なので、αβ = 4ac/(4a²) = c/a である。」と書ければよい。①「〜とする」で a、D を決め、α、β を解の公式で書く、② 和と積を計算して式を変形する、③ 約束した事実（解の公式、乗法公式、(√D)² = D）で結ぶ、の 3 つがそろっているかを見る。α と β を入れかえても和と積は同じなので、どちらを + にしてもよい。2 本目の道として、因数定理から ax² + bx + c = a(x − α)(x − β) と因数分解して係数を比べる方法もある（D = 0 で解が 1 つのときは α = β として同じ式になる）。
        hints:
