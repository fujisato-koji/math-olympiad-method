lygon points="124,256 118,259 118,253" fill="#3d8fd1"/><text x="150" y="260" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">−1/2</text><line x1="176" y1="256" x2="190" y2="256" stroke="#3d8fd1" stroke-width="1.6" stroke-linecap="butt"/><polygon points="196,256 190,259 190,253" fill="#3d8fd1"/><rect x="200" y="245" width="104" height="21" rx="4" fill="#f3c969" fill-opacity="0.4"/><text x="252" y="260" font-size="14" text-anchor="middle" fill="currentColor"><tspan font-style="italic">P</tspan>(−1/2) = 51/8</text></svg>'
        explain: 整式 P(x) を 1 次式 x − a でわった商を Q(x)、余りを r とします。余りの次数は 1 より低いので r は数で、P(x) = (x − a)Q(x) + r が、どの x でも成り立ちます。x = a を代入すると、(a − a)Q(a) = 0 なので P(a) = r です。つまり、P(x) を x − a でわった余りは P(a) です。これを剰余の定理といいます（わけは 6 日目）。x − 2 でわった余りは P(2) = 8 − 6 + 5 = 7、x + 1 = x − (−1) でわった余りは P(−1) = −1 + 3 + 5 = 7 です。ax − b（a は 0 でない）でわるときは、ax − b = 0 となる x = b/a を代入します。2x + 1 でわった余りは P(−1/2) = −1/8 + 3/2 + 5 = 51/8 です。わり算の筆算をしなくても、代入だけで余りがわかります。
