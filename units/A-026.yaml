      - part: わけ
        id: "ef46036434"
        text: 2 次ほうていしき ax² + bx + c = 0 の 2 つのかいを α、β とすると、α + β = −b/a、αβ = c/a です（かいと係数の関係）。b² − 4ac が 0 以上のとき、このわけをすじ道を立てて書きましょう。
        explain: 例：「a は 0 でない数とし、D = b² − 4ac は 0 以上とする。かいの公式（A-017）から、α = (−b + √D)/(2a)、β = (−b − √D)/(2a) としてよい。α + β = ((−b + √D) + (−b − √D))/(2a) = −2b/(2a) = −b/a。αβ = (−b + √D)(−b − √D)/(4a²) = (b² − D)/(4a²)（(x + y)(x − y) = x² − y²、A-015）。b² − D = b² − (b² − 4ac) = 4ac なので、αβ = 4ac/(4a²) = c/a である。」と書ければよい。①「〜とする」で a、D を決め、α、β をかいの公式で書く、② 和と積を計算して式を変形する、③ 約束した事実（かいの公式、乗法公式、(√D)² = D）で結ぶ、の 3 つがそろっているかを見る。α と β を入れかえても和と積は同じなので、どちらを + にしてもよい。2 本目の道として、因数定理から ax² + bx + c = a(x − α)(x − β) といんすうぶんかいして係数をくらべる方法もある（D = 0 でかいが 1 つのときは α = β として同じ式になる）。
        hints:
          - かいの公式で、α と β をそれぞれ式で書きましょう。D = b² − 4ac とおくと書きやすくなります。
          - text: α + β を計算すると、√ の部分はどうなるでしょう。
            svg: '<svg viewBox="0 0 320 166" xmlns="http://www.w3.org/2000/svg"><text x="86" y="42" font-size="16" text-anchor="end" fill="currentColor"><tspan font-style="italic">α</tspan> =</text><text x="124" y="34" font-size="16" text-anchor="middle" fill="currentColor">−<tspan font-style="italic">b</tspan></text><rect x="146" y="16" width="50.6" height="26" rx="5" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="171.3" y="34" font-size="16" text-anchor="middle" fill="currentColor">+ √<tspan font-style="italic">D</tspan></text><line x1="100" y1="42" x2="206.6" y2="42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="153.3" y="62" font-size="16" text-anchor="middle" fill="currentColor">2<tspan font-style="italic">a</tspan></text><text x="86" y="100" font-size="16" text-anchor="end" fill="currentColor"><tspan font-style="italic">β</tspan> =</text><text x="124" y="92" font-size="16" text-anchor="middle" fill="currentColor">−<tspan font-style="italic">b</tspan></text><rect x="146" y="74" width="50.6" height="26" rx="5" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="171.3" y="92" font-size="16" text-anchor="middle" fill="currentColor">− √<tspan font-style="italic">D</tspan></text><line x1="100" y1="100" x2="206.6" y2="100" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="153.3" y="120" font-size="16" text-anchor="middle" fill="currentColor">2<tspan font-style="italic">a</tspan></text><text x="160" y="156" font-size="13" text-anchor="middle" fill="#d9534f"><tspan font-style="italic">α</tspan> と <tspan font-style="italic">β</tspan> をたすと、赤の所はどうなる？</text></svg>'
          - αβ は (x + y)(x − y) = x² − y² の形です。
        paths:
          - [α = (−b + √D)/(2a)、β = (−b − √D)/(2a) とする, α + β = −2b/(2a) = −b/a, αβ = (b² − D)/(4a²) = 4ac/(4a²) = c/a]
          - [因数定理から ax² + bx + c = a(x − α)(x − β), 右辺は ax² − a(α + β)x + aαβ, 係数をくらべて α + β = −b/a、αβ = c/a]
