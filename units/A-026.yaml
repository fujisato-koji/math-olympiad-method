h="67.4" height="30" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="113.4" y="201.6" font-size="16" text-anchor="middle" fill="currentColor">(<tspan font-style="italic">x</tspan> − 1)</text><rect x="155.2" y="181" width="67.4" height="30" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="188.9" y="201.6" font-size="16" text-anchor="middle" fill="currentColor">(<tspan font-style="italic">x</tspan> − 2)</text><rect x="230.6" y="181" width="67.4" height="30" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="264.3" y="201.6" font-size="16" text-anchor="middle" fill="currentColor">(<tspan font-style="italic">x</tspan> − 3)</text><line x1="124.5" y1="150" x2="113.4" y2="179" stroke="#b8860b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="183.7" y1="150" x2="188.9" y2="179" stroke="#b8860b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="242.8" y1="150" x2="264.3" y2="179" stroke="#b8860b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/><text x="160" y="232" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold"><tspan font-style="italic">P</tspan>(<tspan font-style="italic">a</tspan>) = 0 のとき、<tspan font-style="italic">x</tspan> − <tspan font-style="italic">a</tspan> が因数になる</text></svg>'
        explain: 剰余の定理から、P(a) = 0 なら、P(x) を x − a でわった《余り》は 0 で、P(x) は x − a でわり切れます。つまり、P(x) = (x − a)Q(x) といんすうぶんかいできます。ぎゃくに、x − a が P(x) の因数なら P(a) = 0 です。これを因数定理といいます（わけは 6 日目）。P(x) = x³ − 6x² + 11x − 6 では、P(a) = 0 となる a をさがします。係数が《整数》で x³ の係数が 1 のとき、そのような整数 a はていすうこう −6 の《約数》（±1、±2、±3、±6）の中にあります（P(a) = 0 を a(a² − 6a + 11) = 6 と変形すると、a は 6 の約数になる）。P(1) = 1 − 6 + 11 − 6 = 0 なので、x − 1 が因数です。P(x) を x − 1 でわると商は x² − 5x + 6 = (x − 2)(x − 3) なので、P(x) = (x − 1)(x − 2)(x − 3) です。よって、3 次ほうていしきのかいは x = 1、2、3 です。x³ の係数が 1 でないときは、（ていすうこうの約数）/（x³ の係数の約数）の形の数もためします。
