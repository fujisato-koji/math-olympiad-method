      - part: わけ
        text: 整式 P(x) を x − a でわった余りは P(a) です（剰余の定理）。このわけを、筋道を立てて書きましょう。
        explain: 例：「P(x) を x − a でわった商を Q(x)、余りを r とする。余りの次数はわる式 x − a の次数 1 より低いので、r は x をふくまない数である。わり算の決まり（A = BQ + R）から、P(x) = (x − a)Q(x) + r が、どの x でも成り立つ（恒等式）。この式に x = a を代入すると、P(a) = (a − a)Q(a) + r = 0 × Q(a) + r = r となる。よって、余り r は P(a) である。」と書ければよい。①「〜とする」で商 Q(x) と余り r を決める、② 恒等式 P(x) = (x − a)Q(x) + r に x = a を代入する、③ 約束した事実（A = BQ + R、余りの次数はわる式より低い、0 にどんな数をかけても 0）で結ぶ、の 3 つがそろっているかを見る。r が数であること（余りの次数が低いこと）を書き落としやすい。r が x をふくむなら、x = a を代入した値は r(a) になって、余りそのものとは言えないからだと話す。ax − b でわる場合は、P(x) = (ax − b)Q(x) + r に x = b/a を代入すればよいことにも触れる。
        hints:
          - 商を Q(x)、余りを r として、P(x) を式で書きましょう。
          - 余り r は、x をふくむでしょうか。わる式の次数から考えましょう。
          - その式に x = a を代入しましょう。
        paths:
          - [商を Q(x)、余りを r とする, r は数で P(x) = (x − a)Q(x) + r がどの x でも成り立つ, x = a を代入して P(a) = r]
      - part: わけ
        text: 整式 P(x) について、P(a) = 0 ならば、P(x) は x − a を因数にもちます。また、逆に、P(x) が x − a を因数にもてば P(a) = 0 です（因数定理）。このわけを、筋道を立てて書きましょう。
        explain: 例：「P(a) = 0 とする。P(x) を x − a でわった商を Q(x) とすると、剰余の定理から余りは P(a) = 0 なので、P(x) = (x − a)Q(x) である。よって、P(x) は x − a を因数にもつ。逆に、P(x) が x − a を因数にもつとする。ある整式 Q(x) を使って P(x) = (x − a)Q(x) と書けるので、x = a を代入すると P(a) = 0 × Q(a) = 0 である。」と書ければよい。①「〜とする」で仮定（P(a) = 0、または因数にもつこと）を置く、② P(x) = (x − a)Q(x) + (余り) の式を使う、③ 約束した事実（剰余の定理、0 にどんな数をかけても 0）で結ぶ、の 3 つがそろっているかを見る。「ならば」の両方の向きを、別々に書けているかを見る。前の問題（剰余の定理）を約束した事実として使ってよい。3 次式を因数分解するとき、まず P(a) = 0 となる a をさがすのはこのためだと話す。
        hints:
          - まず「P(a) = 0 とする」から書き始めましょう。
          - 剰余の定理を使うと、P(x) を x − a でわった余りはいくつでしょう。
          - 逆の向きは、「P(x) = (x − a)Q(x) と書けるとする」から書き始めましょう。
        paths:
          - [P(a) = 0 とする, 剰余の定理より x − a でわった余りは 0, P(x) = (x − a)Q(x) と書けて x − a は因数]
