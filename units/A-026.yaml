    text: P(x) = x² − 2 とします。P(P(P(P(x)))) = x をみたす実数 x をすべて集めます。それらの x⁴ の和を求めなさい。
    answer: 96
    check: '(lambda g, X: (lambda R: math.floor(sum(r ** 4 for r in R) + 0.5) if len(R) == 16 and all(abs(r) <= 2 for r in R) else -1)([(X[i] + X[i + 1]) / 2 for i in range(len(X) - 1) if g(X[i]) * g(X[i + 1]) < 0]))(lambda x: (((x * x - 2) ** 2 - 2) ** 2 - 2) ** 2 - 2 - x, [-3 + (i + 0.37) / 2000 for i in range(12000)])'
    hints:
    - '|x| が大きい x は、P をくり返すと、どうなるでしょう。そのような x が式をみたすことはあるでしょうか。'
    - 式は何次式になるでしょう。実数のかいが全部で何こあるかがわかれば、係数との関係で和が出せそうです。ただし x⁴ の和には、係数をどこまで使うかも考えどころです。
    - x が −2 から 2 のあいだのとき、P(x) = x² − 2 ににた形の式（cos の倍角）は出てこないでしょうか。
    paths:
    - - '|x| > 2 なら P(x) − |x| = (|x| − 2)(|x| + 1) > 0 で P(x) > |x| > 2。P を何回かけても大きくなる一方なので P(P(P(P(x)))) > x となり、根はない。だから根はすべて −2 ≤ x ≤ 2 にある'
      - P は −2 ≤ x ≤ 0 でも 0 ≤ x ≤ 2 でも、−2 から 2 までの全部のあたいをちょうど 1 回ずつとる（P(−2) = 2、P(0) = −2、P(2) = 2 で、それぞれの半分では一方へだけ動く）。だから P を 1 回重ねるたびに、2 と −2 のあいだを行き来する回数が 2 倍になり、P(P(P(P(x)))) は −2 ≤ x ≤ 2 で 2 と −2 のあいだを 16 回行き来する。17 こ の点 2 = a₀ > a₁ > … > a₁₆ = −2 であたいが 2、−2、2、… と ±2 になる。となりの点のあいだで「P(P(P(P(x)))) − x」のふごうは反対（または 0）で、この式のグラフはとぎれずにつながっているので、各区間に根が少なくとも 1 つある。さかいめで根になるのは x = 2 だけ（x = −2 ではあたいは 2 で −2 ではない）なので、根はちがう 16 こ。式は 16 次なので、これで全部で、すべて実数
      - 順に 2 乗して 2 をひく。P(P(x)) = x⁴ − 4x² + 2、P(P(P(x))) = x⁸ − 8x⁶ + 20x⁴ − 16x² + 2、P(P(P(P(x)))) = x¹⁶ − 16x¹⁴ + 104x¹² − …（x の 2 乗、4 乗、6 乗、… のこうだけ）。式は x¹⁶ − 16x¹⁴ + 104x¹² − … − x = 0（x¹⁵、x¹³ のこうはない）。根を r₁、…、r₁₆ とし、e₁ = 根の和、e₂ = 2 つずつの積の和、e₃ = 3 つずつの積の和、e₄ = 4 つずつの積の和とする。係数との関係（16 次でも 2 次のときと同じ形で、ふごうは 1 つおきに入れかわる）から e₁ = 0、e₂ = −16、e₃ = 0、e₄ = 104
      - x² の和 = e₁² − 2e₂ = 0 + 32 = 32。2 つの根の x² の積の和 Σ rᵢ²rⱼ²（i < j）は、e₂² − 2e₁e₃ + 2e₄ = 256 − 0 + 208 = 464
      - (x² の和)² = (x⁴ の和) + 2 × (2 つの根の x² の積の和) なので、x⁴ の和 = 32² − 2 × 464 = 1024 − 928 = 96
    - - −2 ≤ x ≤ 2 の根を考える（|x| > 2 に根がないことは 1 本目と同じ）。x = 2cosθ（0 ≤ θ ≤ π）とおくと、x は −2 から 2 までの全部のあたいをちょうど 1 回とる
      - P(2cosθ) = 4cos²θ − 2 = 2(2cos²θ − 1) = 2cos2θ。くり返すと P(P(P(P(2cosθ)))) = 2cos16θ。式は 2cos16θ = 2cosθ
      - cos16θ = cosθ から 16θ = θ + 2πm または 16θ = −θ + 2πm なので、θ = 2πm/15 または θ = 2πm/17。0 ≤ θ ≤ π では、15 のほうは m = 0〜7 の 8 こ、17 のほうは m = 0〜8 の 9 こ。2πm/15 = 2πn/17 となるのは θ = 0 だけなので、重なりは 1 こ。θ のあたいが 16 こ、x のあたいも 16 こ。式は 16 次なので、これで根のすべて
      - x⁴ = 16cos⁴θ = 16 × (3 + 4cos2θ + cos4θ) / 8 = 6 + 8cos2θ + 2cos4θ。だから 16 こ の和は 6 × 16 + 8 × (cos2θ の和) + 2 × (cos4θ の和)
      - cos2θ の和：15 のほうは、角が 4πm/15（m = 0〜14）の 15 こ の点は円を 15 等分した点を 1 周するので、cos の和は 0（中心が重心）。m と 15 − m で cos が同じなので、半分に折って 1 + 2A = 0、A（m = 1〜7 の和）= −1/2。17 のほうも同じで B（m = 1〜8 の和）= −1/2。重なりの θ = 0 は 1 回だけ数えるので、cos2θ の和 = 1 + A + B = 0。cos4θ の和も同じ。角が 8πm/15、8πm/17 で、15 も 17 も 4 と共通の約数がないので、やはり円を等分した点を 1 周し、和は 0。だから x⁴ の和 = 6 × 16 = 96
    note: 考えどころは 3 つ：①|x| > 2 に根がないことと、根が 16 こすべて実数であることを先に示す（x = 2 と −2 の間を行き来する様子で、区間ごとに根を 1 つずつ確保する）、②x⁴ の和は、根の和・2 つずつの積の和だけでは出ず、x² の和の 2 乗から「2 つの根の x² の積の和」の 2 倍をひく形になり、4 つずつの積の和（x¹² の係数 104）まで要る（または x = 2cosθ とおいて 4 乗を倍角でわる）、③根を 1 つずつ求めなくてよい。1 本目は、展開して根と係数の関係（A-017 と同じ形を 16 次に広げる）、2 本目は三角関数（G-025）で根を全部書き出し、x⁴ = 6 + 8cos2θ + 2cos4θ の cos2θ と cos4θ の和が円の等分で 0 になることで求める。2 本目は 2 倍角が 2 回出るので、1 本目の「4 つずつの積の和まで」に当たる手間が、cos4θ の和に移る。check は、x を 12000 点の格子に分けて符号のかわる所を数え、根が 16 こですべて |x| ≤ 2 であることを確かめてから、x⁴ の和を出す（96、近似なので整数に丸める。16 こでないときは −1）。出典：16 この解がすべて実数であることは IMO 1976 第 2 問と同じ。ここでは個数でなく x⁴ の和を問う。x² − 2 のくり返しと cos の倍角は、チェビシェフの多項式の定番。
