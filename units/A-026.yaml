# A-026 多項式（剰余の定理、因数定理、解と係数の関係）
#
# 書き方は N-001 の頭の注のとおり。段 5 の決まりは A-019 の頭の注と同じ（思い出す 2・今日 2・挑戦 1、わけの深さ ③、各日に予備 3 問）。
#   練習の日には、新しい決まりが出るので頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 8 問にした。
# 地図に plan がないので、既定の並び（導入、練習 4 日、わけ、混ぜる、確認）で作った。
#   1 日目：整式のわり算（筆算の手順）、商と余り、A = BQ + R（余りの次数はわる式より低い）。
#   2 日目：剰余の定理（x − a でわった余りは P(a)、ax − b なら P(b/a)）。
#   3 日目：因数定理、3 次式の因数分解、3 次方程式を解く（定数項の約数をためす）。
#   4 日目：恒等式（係数比較、数値代入）、2 次式でわった余り（わる式が 0 になる x を代入）。
#   5 日目：2 次方程式の解と係数の関係、対称式の値（α² + β²、α³ + β³）、2 数を解とする 2 次方程式。
#   6 日目：わけ（3 問とも ③：剰余の定理、因数定理、解と係数の関係）。7 日目：A-017、A-015 と混ぜる。8 日目：確認。
# 前提は A-017（2 次方程式）。たどると A-015（展開と因数分解）、A-016（平方根）、A-011（1 次方程式）まで使える。
#   連立方程式（A-012）は前提のたどりにないので、日の問題では 2 つの未知の数を同時に決める形を避け、
#   余りの条件は x(x − 2) のように 0 を含む数でわる形にして、1 つずつ決まるようにした（離の 1 問目だけ uses: A-012 で使う）。
#   複素数（A-021）も前提にないので、解と係数の関係は実数の解をもつ 2 次方程式だけで扱い、虚数解には触れない。
#   3 次方程式の解と係数の関係、対称式の一般論（A-031）、多項式の補間（A-036）は扱わない。
# 整式のわり算の筆算は図にせず、見本の explain に「次数の高い項から商を立て、かけてひく」手順を言葉で書いた。
# 式の答えは choices。商を選ぶ check は、わられる式 − わる式 × 選択肢 が定数（x によらない）になるものを選ぶ。
#   因数分解を選ぶ check は、選択肢の式（lambda）が元の式とどの x でも等しいものを選ぶ。余りは P(a) を Fraction で計算する。
#   係数を打つ問題は、係数の並びのかけ算（たたみこみ）か総当たりで求める。解と係数の問題は、解の公式で出した数値の解から計算して、
#   math.isclose で近い数（整数や分数）を選ぶ。
# 多項式の剰余と因数は、整数係数の多項式（N-045）、多項式の応用（A-030）、符号理論と暗号の有限体の多項式（C の流れ、K の流れ）の入口になる（D-026）。

id: A-026
days:
  - day: 1
    items:
      - part: 見本
        text: 整式 2x³ − 3x² + 4x − 5 を x − 2 でわって、商と余りを求めてみましょう。
        explain: 整式（多項式）のわり算も、数の筆算と同じように、次数の高い項から順に商を立てます。① 2x³ ÷ x = 2x² を商に立て、2x²(x − 2) = 2x³ − 4x² をひくと、x² + 4x − 5 が残ります。② x² ÷ x = x を立て、x(x − 2) = x² − 2x をひくと、6x − 5 が残ります。③ 6x ÷ x = 6 を立て、6(x − 2) = 6x − 12 をひくと、7 が残ります。7 は x − 2 より次数が低いので、ここで止めます。商は 2x² + x + 6、余りは 7 です。わられる式を A、わる式を B、商を Q、余りを R とすると、A = BQ + R（R の次数は B の次数より低い）が成り立ちます。実際に (x − 2)(2x² + x + 6) + 7 を展開すると 2x³ − 3x² + 4x − 5 にもどるので、答えを確かめられます。わられる式にぬけている次数の項があるときは、x³ + 0x² − 3 のようにその項を 0 として、次数をそろえて計算します。
      - part: 思い出す
        text: (x − 4)(x² + 3x + 2) を展開した式で、x の係数はいくつですか。
        answer: −10
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda a, b: [sum(a[i] * b[k - i] for i in range(len(a)) if 0 <= k - i < len(b)) for k in range(len(a) + len(b) - 1)])([-4, 1], [2, 3, 1])[1])"
        hints:
          - 分配法則で、x² + 3x + 2 に x と −4 をそれぞれかけましょう（A-015）。
          - x の項が出てくるのは、x × 2 と −4 × 3x です。
          - 2x − 12x を計算しましょう。
        paths:
          - [x³ + 3x² + 2x − 4x² − 12x − 8, x³ − x² − 10x − 8, x の係数は −10]
      - part: 思い出す
        text: x² − x − 20 を因数分解した式はどれですか。
        choices: [(x − 5)(x + 4), (x + 5)(x − 4), (x − 10)(x + 2), (x − 5)(x − 4)]
        answer: (x − 5)(x + 4)
        check: "[c for c, f in {'(x − 5)(x + 4)': lambda x: (x - 5) * (x + 4), '(x + 5)(x − 4)': lambda x: (x + 5) * (x - 4), '(x − 10)(x + 2)': lambda x: (x - 10) * (x + 2), '(x − 5)(x − 4)': lambda x: (x - 5) * (x - 4)}.items() if all(f(x) == x * x - x - 20 for x in range(-6, 7))][0]"
        hints:
          - かけて −20、足して −1 になる 2 つの数をさがしましょう（A-015）。
          - 一方は正の数、もう一方は負の数です。
          - 足して −1 なので、負の数のほうが絶対値が大きくなります。
        paths:
          - [−5 × 4 = −20、−5 + 4 = −1, (x − 5)(x + 4)]
      - part: 今日
        text: x² + 5x + 9 を x + 2 でわった余りはいくつですか。
        answer: 3
        check: "(lambda x: x * x + 5 * x + 9)(-2)"
        hints:
          - x² ÷ x = x を商に立てて、x(x + 2) をひきましょう。
          - 残った 3x + 9 を、また x + 2 でわりましょう。
          - 余りの次数が、x + 2 より低くなったら止めます。
        paths:
          - [x を立てて x² + 2x をひくと 3x + 9, 3 を立てて 3x + 6 をひくと 3, 商は x + 3、余りは 3]
      - part: 今日
        text: x³ − 2x² − 5x + 7 を x − 3 でわった商はどれですか。
        choices: [x² + x − 2, x² − 5x + 10, x² + x + 1, x² − x − 2]
        answer: x² + x − 2
        check: "[c for c, q in {'x² + x − 2': lambda x: x * x + x - 2, 'x² − 5x + 10': lambda x: x * x - 5 * x + 10, 'x² + x + 1': lambda x: x * x + x + 1, 'x² − x − 2': lambda x: x * x - x - 2}.items() if len(set(x ** 3 - 2 * x * x - 5 * x + 7 - (x - 3) * q(x) for x in range(-6, 7))) == 1][0]"
        hints:
          - x³ ÷ x = x² を商に立てて、x²(x − 3) をひきましょう。
          - 残った式の、次数のいちばん高い項を x でわって、次の商を立てます。
          - 余りが数になるまでくり返しましょう。
        paths:
          - [x² を立てて x³ − 3x² をひくと x² − 5x + 7, x を立てて x² − 3x をひくと −2x + 7, −2 を立てて −2x + 6 をひくと 1, 商は x² + x − 2、余りは 1]
        note: ひくときの符号（−2x² − (−3x²) = x²）でつまずきやすい。(x − 3)(x² + x − 2) + 1 を展開して確かめさせる。
      - part: 挑戦
        text: 整式 P(x) を x² + 1 でわると、商が x − 2、余りが 3x + 1 です。P(x) の x の係数はいくつですか。
        answer: 4
        check: "(lambda a, b: [sum(a[i] * b[k - i] for i in range(len(a)) if 0 <= k - i < len(b)) for k in range(len(a) + len(b) - 1)])([1, 0, 1], [-2, 1])[1] + 3"
        hints:
          - A = BQ + R にあてはめましょう。
          - P(x) = (x² + 1)(x − 2) + (3x + 1) です。
          - 展開して、x の項をまとめましょう。
        paths:
          - [P(x) = (x² + 1)(x − 2) + 3x + 1, = x³ − 2x² + x − 2 + 3x + 1, = x³ − 2x² + 4x − 1, x の係数は 4]
    extra:
      - part: 今日
        text: 2x² − 7x + 9 を x − 3 でわった余りはいくつですか。
        answer: 6
        check: "(lambda x: 2 * x * x - 7 * x + 9)(3)"
        hints:
          - 2x² ÷ x = 2x を商に立てましょう。
          - 2x(x − 3) をひくと、何が残るでしょう。
          - 残った式を、また x − 3 でわりましょう。
        paths:
          - [2x を立てて 2x² − 6x をひくと −x + 9, −1 を立てて −x + 3 をひくと 6, 余りは 6]
      - part: 今日
        text: x³ + 4x² − 3 を x + 1 でわった商はどれですか。
        choices: [x² + 3x − 3, x² + 5x + 5, x² + 3x + 3, x² − 3x + 3]
        answer: x² + 3x − 3
        check: "[c for c, q in {'x² + 3x − 3': lambda x: x * x + 3 * x - 3, 'x² + 5x + 5': lambda x: x * x + 5 * x + 5, 'x² + 3x + 3': lambda x: x * x + 3 * x + 3, 'x² − 3x + 3': lambda x: x * x - 3 * x + 3}.items() if len(set(x ** 3 + 4 * x * x - 3 - (x + 1) * q(x) for x in range(-6, 7))) == 1][0]"
        hints:
          - x の項がないので、x³ + 4x² + 0x − 3 と考えましょう。
          - x³ ÷ x = x² を立てて、x²(x + 1) をひきましょう。
          - 余りが数になるまで続けましょう。
        paths:
          - [x² を立てて残りは 3x² + 0x − 3, 3x を立てて残りは −3x − 3, −3 を立てて残りは 0, 商は x² + 3x − 3（わり切れる）]
      - part: 挑戦
        text: 整式 P(x) を x − 3 でわると、商が x² + 2、余りが −4 です。P(1) の値はいくつですか。
        answer: −10
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda x: (x - 3) * (x * x + 2) - 4)(1))"
        hints:
          - A = BQ + R にあてはめましょう。
          - P(x) = (x − 3)(x² + 2) − 4 です。
          - 展開しなくても、x = 1 をそのまま代入できます。
        paths:
          - [P(x) = (x − 3)(x² + 2) − 4, P(1) = (−2) × 3 − 4, −10]

  - day: 2
    items:
      - part: 見本
        text: P(x) = x³ − 3x + 5 を x − 2、x + 1、2x + 1 でわった余りを、わり算をしないで求めてみましょう。
        explain: 整式 P(x) を 1 次式 x − a でわった商を Q(x)、余りを r とします。余りの次数は 1 より低いので r は数で、P(x) = (x − a)Q(x) + r が、どの x でも成り立ちます。x = a を代入すると、(a − a)Q(a) = 0 なので P(a) = r です。つまり、P(x) を x − a でわった余りは P(a) です。これを剰余の定理といいます（わけは 6 日目）。x − 2 でわった余りは P(2) = 8 − 6 + 5 = 7、x + 1 = x − (−1) でわった余りは P(−1) = −1 + 3 + 5 = 7 です。ax − b（a は 0 でない）でわるときは、ax − b = 0 となる x = b/a を代入します。2x + 1 でわった余りは P(−1/2) = −1/8 + 3/2 + 5 = 51/8 です。わり算の筆算をしなくても、代入だけで余りがわかります。
      - part: 思い出す
        text: x² − 3x + 6 を x − 1 でわった余りはいくつですか。
        answer: 4
        check: "(lambda x: x * x - 3 * x + 6)(1)"
        hints:
          - x を商に立てて、x(x − 1) をひきましょう。
          - 残った −2x + 6 を、また x − 1 でわりましょう。
          - 余りが数になったら止めます。
        paths:
          - [x を立てて残りは −2x + 6, −2 を立てて残りは 4, 余りは 4]
      - part: 思い出す
        text: x = −2 のとき、2x³ + x² − 5 の値はいくつですか。
        answer: −17
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda x: 2 * x ** 3 + x * x - 5)(-2))"
        hints:
          - 負の数を代入するときは、かっこをつけましょう。
          - (−2)³ = −8、(−2)² = 4 です。
          - 2 × (−8) + 4 − 5 を計算しましょう。
        paths:
          - [2 × (−8) + 4 − 5, −16 + 4 − 5, −17]
      - part: 今日
        text: P(x) = x³ + 2x² − 4x + 1 を x + 3 でわった余りはいくつですか。
        answer: 4
        check: "(lambda x: x ** 3 + 2 * x * x - 4 * x + 1)(-3)"
        hints:
          - x + 3 = x − (−3) です。
          - 剰余の定理から、余りは P(−3) です。
          - (−3)³ と (−3)² の符号に気をつけましょう。
        paths:
          - [余りは P(−3), −27 + 18 + 12 + 1, 4]
        note: x + 3 を見て P(3) を計算しやすい。x + 3 = 0 となる x を代入すると覚えさせる。
      - part: 今日
        text: P(x) = 4x³ − 2x + 3 を 2x − 1 でわった余りはいくつですか。
        answer: 5/2
        accept: [2.5]
        check: "(lambda x: 4 * x ** 3 - 2 * x + 3)(Fraction(1, 2))"
        hints:
          - 2x − 1 = 0 となる x を求めましょう。
          - 余りは P(1/2) です。
          - (1/2)³ = 1/8 です。
        paths:
          - [2x − 1 = 0 より x = 1/2, P(1/2) = 4 × 1/8 − 1 + 3, 1/2 + 2 = 5/2]
      - part: 挑戦
        text: x⁵⁰ − 2x + 7 を x + 1 でわった余りはいくつですか。
        answer: 10
        check: "(lambda x: x ** 50 - 2 * x + 7)(-1)"
        hints:
          - わり算の筆算をすると、とても長くなります。
          - 剰余の定理から、余りは P(−1) です。
          - (−1)⁵⁰ は、−1 を偶数回かけた数です。
        paths:
          - [余りは P(−1), (−1)⁵⁰ = 1, 1 + 2 + 7 = 10]
        note: 次数が大きくても、剰余の定理なら代入だけで済む。−2 × (−1) = +2 の符号に気をつけさせる。
    extra:
      - part: 今日
        text: x³ − 4x² + x + 8 を x − 3 でわった余りはいくつですか。
        answer: 2
        check: "(lambda x: x ** 3 - 4 * x * x + x + 8)(3)"
        hints:
          - 剰余の定理を使いましょう。
          - x − 3 でわった余りは P(3) です。
          - 27 − 36 + 3 + 8 を計算しましょう。
        paths:
          - [余りは P(3), 27 − 36 + 3 + 8, 2]
      - part: 今日
        text: 2x³ + 3x² − 4 を 2x + 1 でわった余りはいくつですか。
        answer: −7/2
        accept: [−3.5]
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((lambda x: 2 * x ** 3 + 3 * x * x - 4)(Fraction(-1, 2)))"
        hints:
          - 2x + 1 = 0 となる x を求めましょう。
          - 余りは P(−1/2) です。
          - (−1/2)³ = −1/8、(−1/2)² = 1/4 です。
        paths:
          - [x = −1/2 を代入, 2 × (−1/8) + 3 × 1/4 − 4, −1/4 + 3/4 − 4 = −7/2]
      - part: 挑戦
        text: x³ + ax + 6 を x + 2 でわった余りが −8 のとき、a はいくつですか。
        answer: 3
        check: "[a for a in range(-30, 31) if (-2) ** 3 + a * (-2) + 6 == -8][0]"
        hints:
          - 剰余の定理から、余りは P(−2) です。
          - P(−2) を a を使って表しましょう。
          - P(−2) = −8 を解きましょう。
        paths:
          - [P(−2) = −8 − 2a + 6 = −2 − 2a, −2 − 2a = −8, a = 3]

  - day: 3
    items:
      - part: 見本
        text: x³ − 6x² + 11x − 6 を因数分解して、3 次方程式 x³ − 6x² + 11x − 6 = 0 を解いてみましょう。
        explain: 剰余の定理から、P(a) = 0 なら、P(x) を x − a でわった余りは 0 で、P(x) は x − a でわり切れます。つまり、P(x) = (x − a)Q(x) と因数分解できます。逆に、x − a が P(x) の因数なら P(a) = 0 です。これを因数定理といいます（わけは 6 日目）。P(x) = x³ − 6x² + 11x − 6 では、P(a) = 0 となる a をさがします。係数が整数で x³ の係数が 1 のとき、そのような整数 a は定数項 −6 の約数（±1、±2、±3、±6）の中にあります（P(a) = 0 を a(a² − 6a + 11) = 6 と変形すると、a は 6 の約数になる）。P(1) = 1 − 6 + 11 − 6 = 0 なので、x − 1 が因数です。P(x) を x − 1 でわると商は x² − 5x + 6 = (x − 2)(x − 3) なので、P(x) = (x − 1)(x − 2)(x − 3) です。よって、3 次方程式の解は x = 1、2、3 です。x³ の係数が 1 でないときは、（定数項の約数）/（x³ の係数の約数）の形の数もためします。
      - part: 思い出す
        text: x³ − 2x + 4 を x + 2 でわった余りはいくつですか。
        answer: 0
        check: "(lambda x: x ** 3 - 2 * x + 4)(-2)"
        hints:
          - 剰余の定理を使いましょう。
          - x + 2 でわった余りは P(−2) です。
          - (−2)³ = −8 です。
        paths:
          - [余りは P(−2), −8 + 4 + 4, 0]
        note: 余りが 0 なので、x³ − 2x + 4 は x + 2 でわり切れる。今日の因数定理につながる。
      - part: 思い出す
        text: 2 次方程式 x² + x − 6 = 0 の解はどれですか。
        choices: [x = 2、x = −3, x = −2、x = 3, x = 1、x = −6, x = 6、x = −1]
        answer: x = 2、x = −3
        check: "[c for c, rs in {'x = 2、x = −3': {2, -3}, 'x = −2、x = 3': {-2, 3}, 'x = 1、x = −6': {1, -6}, 'x = 6、x = −1': {6, -1}}.items() if rs == set(x for x in range(-30, 31) if x * x + x - 6 == 0)][0]"
        hints:
          - 左辺を因数分解しましょう（A-017）。
          - かけて −6、足して 1 になる 2 つの数をさがしましょう。
          - AB = 0 なら A = 0 または B = 0 です。
        paths:
          - [(x − 2)(x + 3) = 0, x = 2 または x = −3]
      - part: 今日
        text: x³ − 7x + 6 を因数分解した式はどれですか。
        choices: [(x − 1)(x − 2)(x + 3), (x + 1)(x + 2)(x − 3), (x − 1)(x + 2)(x − 3), (x − 1)(x² + x + 6)]
        answer: (x − 1)(x − 2)(x + 3)
        check: "[c for c, f in {'(x − 1)(x − 2)(x + 3)': lambda x: (x - 1) * (x - 2) * (x + 3), '(x + 1)(x + 2)(x − 3)': lambda x: (x + 1) * (x + 2) * (x - 3), '(x − 1)(x + 2)(x − 3)': lambda x: (x - 1) * (x + 2) * (x - 3), '(x − 1)(x² + x + 6)': lambda x: (x - 1) * (x * x + x + 6)}.items() if all(f(x) == x ** 3 - 7 * x + 6 for x in range(-6, 7))][0]"
        hints:
          - P(1)、P(−1)、P(2) … を計算して、0 になる数をさがしましょう。
          - P(1) = 0 なら、x − 1 が因数です。
          - P(x) を x − 1 でわった商を、さらに因数分解しましょう。
        paths:
          - [P(1) = 1 − 7 + 6 = 0 なので x − 1 が因数, 商は x² + x − 6, = (x − 2)(x + 3), (x − 1)(x − 2)(x + 3)]
        note: x² の項がないので、わるときは x³ + 0x² − 7x + 6 として位をそろえる。商を x² + x + 6 とする符号のまちがいが多い。
      - part: 今日
        text: 3 次方程式 x³ − 2x² − 5x + 6 = 0 の解のうち、いちばん大きいものはいくつですか。
        answer: 3
