      - 大きい数ばかり選ぶと、倍数になりにくいですね。どこから選べばよいでしょう。
      - どの整数も「奇数に 2 を何回かかけた数」と書けます。その奇数で、1 から 20 を組に分けましょう。
      - 同じ組の 2 つは、一方がもう一方の倍数になりますか。組はいくつありますか。
    paths:
      - [評価 1 から 20 を 2 でわれるだけわった奇数で組に分ける, 組は奇数 1、3、…、19 の 10 組, 同じ組の 2 つは一方がもう一方の倍数なので各組 1 個まで, 構成 11 から 20 はどの 2 つも倍数にならない, 10 個]
    note: 評価は「区画ごとの上限をたす」（②）だが、区画の作り方（2 でわれるだけわった奇数で分ける。例 3、6、12）が見えにくい。構成は 11〜20（どの 2 つも 2 倍未満なので倍数にならない）。挑戦の「和が 16 の組」とちがい、組の作り方を自分で見つける必要がある。
