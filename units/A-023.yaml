        id: "322e829b51"
        text: f(x + y) = f(x) + f(y) では、x と y に好きな数を入れられます。x = y = 0 で f(0) = 0、y = −x で f(−x) = −f(x) がわかります。図のように、f(1) を 3 つつなぐと f(3) になり、−3 では同じ長さで下向きになります。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="100" x2="308.4" y2="100" stroke="currentColor" stroke-width="2"/><polygon points="314,100 306,104.4 306,95.6" fill="currentColor"/><text x="310" y="92" font-size="14" text-anchor="middle" fill="currentColor">x</text><line x1="26" y1="96" x2="26" y2="104" stroke="currentColor" stroke-width="2"/><text x="26" y="91" font-size="13" text-anchor="middle" fill="currentColor">−3</text><line x1="68.7" y1="96" x2="68.7" y2="104" stroke="currentColor" stroke-width="2"/><text x="68.7" y="91" font-size="13" text-anchor="middle" fill="currentColor">−2</text><line x1="111.3" y1="96" x2="111.3" y2="104" stroke="currentColor" stroke-width="2"/><text x="111.3" y="91" font-size="13" text-anchor="middle" fill="currentColor">−1</text><line x1="154" y1="96" x2="154" y2="104" stroke="currentColor" stroke-width="2"/><text x="154" y="119" font-size="13" text-anchor="middle" fill="currentColor">0</text><line x1="196.7" y1="96" x2="196.7" y2="104" stroke="currentColor" stroke-width="2"/><text x="196.7" y="119" font-size="13" text-anchor="middle" fill="currentColor">1</text><line x1="239.3" y1="96" x2="239.3" y2="104" stroke="currentColor" stroke-width="2"/><text x="239.3" y="119" font-size="13" text-anchor="middle" fill="currentColor">2</text><line x1="282" y1="96" x2="282" y2="104" stroke="currentColor" stroke-width="2"/><text x="282" y="119" font-size="13" text-anchor="middle" fill="currentColor">3</text><rect x="186.7" y="78" width="20" height="22" rx="2" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="196.7" y="71" font-size="13" text-anchor="middle" fill="currentColor">f(1)</text><rect x="229.3" y="78" width="20" height="22" rx="2" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="229.3" y="56" width="20" height="22" rx="2" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="239.3" y="49" font-size="13" text-anchor="middle" fill="currentColor">f(2)</text><rect x="272" y="78" width="20" height="22" rx="2" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="272" y="56" width="20" height="22" rx="2" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="272" y="34" width="20" height="22" rx="2" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="294" y="27" font-size="13" text-anchor="end" fill="currentColor">f(3) = 3f(1)</text><rect x="101.3" y="100" width="20" height="22" rx="2" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="58.7" y="100" width="20" height="22" rx="2" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="58.7" y="122" width="20" height="22" rx="2" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="16" y="100" width="20" height="22" rx="2" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="16" y="122" width="20" height="22" rx="2" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="16" y="144" width="20" height="22" rx="2" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="14" y="183" font-size="13" text-anchor="start" fill="currentColor">f(−3) = −f(3)</text><circle cx="160" cy="100" r="4" fill="currentColor" stroke="currentColor" stroke-width="2"/><text x="160" y="140" font-size="13" text-anchor="middle" fill="currentColor">f(0) = 0</text></svg>'
        explain: x = 0、y = 0 を代入すると f(0) = f(0) + f(0) なので、f(0) を移項して f(0) = 0 です。次に y = −x を代入すると f(0) = f(x) + f(−x) で、f(0) = 0 なので f(−x) = −f(x) です。x = y = 1 で f(2) = 2f(1)、x = 2、y = 1 で f(3) = f(2) + f(1) = 3f(1) と、同じことをくり返すと、正の《整数》 n では f(n) = nf(1) です（図）。たとえば f(1) = 5 なら、f(3) = 15、f(−3) = −15 です。x = y = 1/2 を代入すると f(1) = 2f(1/2) なので、f(1/2) = (1/2)f(1) です。比例の式 f(x) = ax は、a(x + y) = ax + ay なので、この関数方程式を満たします。かけ算の形 f(xy) = f(x) + f(y)（x、y は正の数）なら、x = y = 1 を代入して f(1) = 0 です。f(x + y) = f(x)f(y) なら、x = y = 1 で f(2) = f(1)² です。このように、0、1、−x のような特別な値を代入して、わかることを 1 つずつ集めていきます。
