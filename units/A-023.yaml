        text: すべての x で f(x + 1) + f(x) = 4x + 6 を満たす 1 次関数は、f(x) = 2x + 2 だけです。このわけを、すじ道を立てて書きましょう。
        explain: 例：「条件を満たす 1 次関数を f(x) = ax + b とする。f(x + 1) + f(x) = a(x + 1) + b + ax + b = 2ax + (a + 2b) である（分配法則と同類項）。これがすべての x で 4x + 6 と等しいので、x = 0 を代入すると a + 2b = 6、x = 1 を代入すると 3a + 2b = 10。この連立方程式を解くと（下の式から上の式をひいて 2a = 4）、a = 2、b = 2。よって、条件を満たす 1 次関数があれば f(x) = 2x + 2 しかない。逆に f(x) = 2x + 2 なら、f(x + 1) + f(x) = 2x + 4 + 2x + 2 = 4x + 6 で、確かに満たす。したがって、条件を満たす 1 次関数は f(x) = 2x + 2 だけである。」と書ければよい。①「〜とする」で a、b を決める、② 左辺を計算して式を変形し、特別な x を代入して連立方程式にする、③ 約束した事実（すべての x で成り立つので代入してよい、連立方程式の解はただ 1 組）で結ぶ、の 3 つがそろっているかを見る。最後の「逆に、確かに満たす」がぬけていたら、「a = 2、b = 2 でなければならない」ことと「それが本当に満たす」ことは別だと話す。x の係数どうし、定数項どうしをくらべる書き方でもよい。
