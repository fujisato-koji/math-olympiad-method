# A-023 関数方程式の入口
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目 導入：関数の記号 f(x)、関数方程式（関数そのものがわからないものとして入っている等式）。値を順に代入して求める。
#   2 日目 練習：特別な値（0、1、−x）を代入する。f(x + y) = f(x) + f(y) から f(0) = 0、f(−x) = −f(x)、f(n) = nf(1)。
#     f(xy) = f(x) + f(y) と f(x + y) = f(x)f(y) の入口。頭に見本。
#   3 日目 練習：1 次関数とおいて係数を決める（すべての x で等しい）、x を 1 − x や −x にかえて連立方程式にする。頭に見本。
#   4 日目 わけ（3 問とも ③：f(0) = 0 と f(−x) = −f(x)、条件を満たす 1 次関数はただ 1 つ、f(x) + 2f(−x) = 3x + 6 の解はただ 1 つ）。
#   5 日目 混ぜる：A-019（直線の式、交点）、A-012（連立方程式）、A-006（反比例）と 1〜3 日目の型。6 日目 確認。
# 前提は A-019 だけ。たどると A-012（連立方程式）、A-011（1 次方程式）、A-006（比例と反比例）、A-010（文字と式）、
#   A-009（累乗）、N-027（正負の数）、N-019・N-078（分数）、G-050（座標）までなので、これらを道具にする。
# 単射と全射（A-024）は前提にないので、「f(a) = f(b) なら a = b」を使う解き方は扱わない（関数方程式 A-029 で扱う）。
# 帰納法（L-012）も前提にないので、f(n) = nf(1) は「f(2) = 2f(1)、f(3) = 3f(1)、… と同じことをくり返す」と言葉で言うだけにし、
#   わけの問題にはしない。答えを求める問題では、必要な n まで順に代入すれば求められる数にした。
# 展開（A-015）と 2 次関数（A-020）も前提にないので、f(x) = ax + b を代入したときの計算は分配法則と同類項をまとめるだけでできるものにした。
#   f(f(x)) = a(ax + b) + b = a²x + ab + b は、文字の積 a × a = a²（A-009、A-010）として扱う。a² = 9 のような式は「傾きは正」と決めて a を 1 つにする。
#   連続性やコーシーの関数方程式の一般の解（実数全体での f(x) = ax）は扱わない（A-029）。
# 「すべての x で等しい 2 つの 1 次式は係数が等しい」は、x = 0 と x = 1 を代入して連立方程式で確かめる、と見本で示した。
# 関数方程式を解いたあとは、求めた関数をもとの式に入れて確かめることを、paths と note で毎回言う（必要と十分の語は L-013 なので使わない）。
# check：値を問う問題は、求めた関数（lambda）で値を計算し、その関数がもとの式を整数（や分数）のいくつかの値で満たすことも確かめる。
#   関数を選ぶ問題は、選択肢ごとの lambda が、もとの式を x = −5〜5 で満たすものを選び出す。分数は Fraction で計算する。
# 関数方程式は、関数方程式（A-029）、指数関数と対数関数（D-001、f(x + y) = f(x)f(y) と f(xy) = f(x) + f(y)）、
#   線形写像（M の流れ、f(x + y) = f(x) + f(y)）、群の準同型（R-001）の入口になる（D-026）。

id: A-023
days:
  - day: 1
    items:
      - part: 見本
        text: すべての実数 x で f(x + 1) = f(x) + 3 が成り立ち、f(0) = 2 である関数 f について、f(1)、f(2)、f(3) を求めてみましょう。
        explain: x の値を決めると y の値がただ 1 つ決まる関数（A-019）に f という名前をつけ、x に対応する y の値を f(x) と書きます。たとえば f(x) = 2x + 3 なら、f(4) = 2 × 4 + 3 = 11 です。f(x + 1) = f(x) + 3 のように、関数そのものがわからないものとして入っている等式を、関数方程式といいます。「すべての x で成り立つ」ので、x にどんな数を代入してもかまいません。x = 0 を代入すると f(1) = f(0) + 3 = 5、x = 1 を代入すると f(2) = f(1) + 3 = 8、x = 2 を代入すると f(3) = f(2) + 3 = 11 です。x が 1 増えるごとに f(x) が 3 ずつ増えるので、0 以上の整数 n では f(n) = 2 + 3n となります。もう 1 つの例として、すべての x で f(2x) = 2f(x) が成り立ち f(3) = 4 なら、x = 3 を代入して f(6) = 2f(3) = 8、x = 6 を代入して f(12) = 2f(6) = 16 です。関数方程式では、「x に何を代入すれば、わかっている値とつながるか」を考えます。この単元では、とくに断らなければ、式は実数全体の x で成り立つものとします。
      - part: 思い出す
        text: 1 次関数 y = −3x + 7 で、x = 4 のときの y の値はいくつですか。
        answer: −5
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(-3 * 4 + 7)"
        hints:
          - x に 4 を代入しましょう。
          - −3 × 4 を先に計算します。
          - 負の数と正の数のたし算に気をつけましょう。
        paths:
          - [y = −3 × 4 + 7, −12 + 7, −5]
      - part: 思い出す
        text: 2 点 (1, 4)、(3, 10) を通る直線の式は、どれですか。
        choices: [y = 3x + 1, y = 3x + 4, y = 2x + 2, y = 6x − 2]
        answer: y = 3x + 1
        check: "[c for c, f in {'y = 3x + 1': lambda x: 3 * x + 1, 'y = 3x + 4': lambda x: 3 * x + 4, 'y = 2x + 2': lambda x: 2 * x + 2, 'y = 6x − 2': lambda x: 6 * x - 2}.items() if all(f(x) == y for x, y in ((1, 4), (3, 10)))][0]"
        hints:
          - まず、2 点から傾きを求めましょう。
          - x が 2 増えると、y はいくつ増えるでしょう。
          - 傾きを入れた式に、どちらかの点を代入して、切片を求めましょう。
        paths:
          - [傾きは 6 ÷ 2 = 3, 4 = 3 × 1 + b, b = 1, y = 3x + 1]
      - part: 今日
        text: f(x) = 4x − 5 のとき、f(3) + f(−2) の値はいくつですか。
        answer: −6
        check: "(lambda f: (lambda v: f'−{-v}' if v < 0 else f'{v}')(f(3) + f(-2)))(lambda x: 4 * x - 5)"
        hints:
          - f(3) は、式の x に 3 を代入した値です。
          - f(−2) は、x に −2 を代入した値です。
          - 2 つの値を足しましょう。
        paths:
          - [f(3) = 12 − 5 = 7, f(−2) = −8 − 5 = −13, 7 + (−13) = −6]
        note: f(3) + f(−2) を f(3 + (−2)) = f(1) と取りちがえやすい。f(x) の f はかけ算ではない。
      - part: 今日
        text: すべての x で f(x + 1) = f(x) − 2 が成り立ち、f(0) = 9 です。f(5) はいくつですか。
        answer: −1
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([v for v in itertools.accumulate(range(5), lambda a, _: a - 2, initial=9)][5])"
        hints:
          - x = 0 を代入すると、f(1) が求められます。
          - x = 1、2、… と順に代入しましょう。
          - x が 1 増えるごとに、f(x) はどう変わるでしょう。
        paths:
          - [f(1) = 7、f(2) = 5、f(3) = 3、f(4) = 1, f(5) = −1]
          - [1 増えるごとに 2 減る, f(5) = 9 − 2 × 5 = −1]
      - part: 挑戦
        text: すべての x で f(2x) = 3f(x) が成り立ち、f(1) = 2 です。f(16) はいくつですか。
        answer: 162
        check: "[v for v in itertools.accumulate(range(4), lambda a, _: 3 * a, initial=2)][4]"
        hints:
          - x = 1 を代入すると、f(2) が求められます。
          - 次は x に何を代入すると、f(4) につながるでしょう。
          - 16 は 1 を何回 2 倍した数でしょう。
        paths:
          - [f(2) = 3f(1) = 6, f(4) = 18、f(8) = 54, f(16) = 162]
          - [16 = 2⁴ なので 3 を 4 回かける, 2 × 3⁴ = 162]
        note: x を 1 ずつ増やして f(3) を求めようとしやすい。この式でつながるのは、x を 2 倍した値。
