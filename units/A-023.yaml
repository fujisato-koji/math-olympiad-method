        text: f が 1 次関数とわかっていれば、f(x) = ax + b とおき、左辺と右辺の x の係数どうし、定数項どうしをくらべます（図の上）。f の形がわからないときは、x を 1 − x にかえた式をもう 1 本つくり、f(x) と f(1 − x) の連立方程式にします（図の下）。
        svg: '<svg viewBox="0 0 320 212" xmlns="http://www.w3.org/2000/svg"><rect x="33" y="6" width="70" height="26" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="103" y="6" width="92" height="26" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="149" y="24" font-size="14" text-anchor="middle" fill="currentColor">x の係数</text><rect x="195" y="6" width="92" height="26" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="241" y="24" font-size="14" text-anchor="middle" fill="currentColor">定数項</text><rect x="33" y="32" width="70" height="26" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="68" y="50" font-size="14" text-anchor="middle" fill="currentColor">左辺</text><rect x="103" y="32" width="92" height="26" rx="0" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="149" y="50" font-size="14" text-anchor="middle" fill="currentColor">2a</text><rect x="195" y="32" width="92" height="26" rx="0" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="241" y="50" font-size="14" text-anchor="middle" fill="currentColor">a + 2b</text><rect x="33" y="58" width="70" height="26" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="68" y="76" font-size="14" text-anchor="middle" fill="currentColor">右辺</text><rect x="103" y="58" width="92" height="26" rx="0" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="149" y="76" font-size="14" text-anchor="middle" fill="currentColor">6</text><rect x="195" y="58" width="92" height="26" rx="0" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="241" y="76" font-size="14" text-anchor="middle" fill="currentColor">5</text><text x="160" y="101" font-size="13" text-anchor="middle" fill="currentColor">↑ たての 2 つが等しい</text><text x="10" y="132" font-size="13" text-anchor="start" fill="currentColor">①</text><rect x="27.8" y="112" width="40.9" height="30" rx="6" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="48.2" y="132" font-size="14" text-anchor="middle" fill="currentColor">f(x)</text><text x="80.2" y="132" font-size="15" text-anchor="middle" fill="currentColor">+</text><rect x="91.7" y="112" width="66.1" height="30" rx="6" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="124.7" y="132" font-size="14" text-anchor="middle" fill="currentColor">f(1 − x)</text><rect x="160.8" y="112" width="66.1" height="30" rx="6" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="193.8" y="132" font-size="14" text-anchor="middle" fill="currentColor">f(1 − x)</text><text x="238.3" y="132" font-size="15" text-anchor="middle" fill="currentColor">=</text><text x="262.8" y="132" font-size="15" text-anchor="middle" fill="currentColor">3x</text><text x="10" y="174" font-size="13" text-anchor="start" fill="currentColor">②</text><rect x="27.8" y="154" width="66.1" height="30" rx="6" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="60.8" y="174" font-size="14" text-anchor="middle" fill="currentColor">f(1 − x)</text><text x="105.4" y="174" font-size="15" text-anchor="middle" fill="currentColor">+</text><rect x="116.9" y="154" width="40.9" height="30" rx="6" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="137.3" y="174" font-size="14" text-anchor="middle" fill="currentColor">f(x)</text><rect x="160.8" y="154" width="40.9" height="30" rx="6" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="181.2" y="174" font-size="14" text-anchor="middle" fill="currentColor">f(x)</text><text x="213.1" y="174" font-size="15" text-anchor="middle" fill="currentColor">=</text><text x="251.1" y="174" font-size="15" text-anchor="middle" fill="currentColor">3 − 3x</text><text x="160" y="204" font-size="13" text-anchor="middle" fill="currentColor">② は x を 1 − x にかえた式（2 つが入れかわる）</text></svg>'
        explain: 1 つ目の例：1 次関数 f で、すべての x について f(x + 1) + f(x) = 6x + 5 のとき、f(x) = ax + b とおきます。f(x + 1) + f(x) = a(x + 1) + b + ax + b = 2ax + (a + 2b) です。これが 6x + 5 とすべての x で等しいので、x の係数どうし 2a = 6、定数項どうし a + 2b = 5 から、a = 3、b = 1 です（図の上）。x = 0 と x = 1 を代入して a + 2b = 5、3a + 2b = 11 の連立方程式（A-012）を解いても、同じ答えになります。よって f(x) = 3x + 1 です。2 つ目の例：すべての x で f(x) + 2f(1 − x) = 3x …① のとき、f の形はわかりません。そこで、x のかわりに 1 − x を代入します。1 − (1 − x) = x なので、f(1 − x) + 2f(x) = 3 − 3x …② です（図の下）。f(x) と f(1 − x) を 2 つの未知数とみると、① と ② は連立方程式です。② の 2 倍から ① をひくと、3f(x) = 6 − 6x − 3x = 6 − 9x で、f(x) = 2 − 3x です。最後に、もとの式に入れて (2 − 3x) + 2{2 − 3(1 − x)} = 2 − 3x − 2 + 6x = 3x と確かめます。
