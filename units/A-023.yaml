# A-023 関数方程式の入口
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目 導入：関数の記号 f(x)、関数方程式（関数そのものがわからないものとして入っている等式）。値を順に代入して求める。
#   2 日目 練習：特別な値（0、1、−x）を代入する。f(x + y) = f(x) + f(y) から f(0) = 0、f(−x) = −f(x)、f(n) = nf(1)。
#     f(xy) = f(x) + f(y) と f(x + y) = f(x)f(y) の入口。頭に見本。
#   3 日目 練習：1 次関数とおいて係数を決める（すべての x で等しい）、x を 1 − x や −x にかえて連立方程式にする。頭に見本。
#   4 日目 わけ（3 問とも ③：f(0) = 0 と f(−x) = −f(x)、条件を満たす 1 次関数はただ 1 つ、f(x) + 2f(−x) = 3x + 6 の解はただ 1 つ）。
#   5 日目 混ぜる：A-019（直線の式、交点）、A-012（連立方程式）、A-006（反比例）と 1〜3 日目の型。6 日目 確認。
# 前提は A-019 だけ。たどると A-012（連立方程式）、A-011（1 次方程式）、A-006（比例と反比例）、A-010（文字と式）、
#   A-009（累乗）、N-027（正負の数）、N-019・N-078（分数）、G-050（座標）までなので、これらを道具にする。
# 単射と全射（A-024）は前提にないので、「f(a) = f(b) なら a = b」を使う解き方は扱わない（関数方程式 A-029 で扱う）。
# 帰納法（L-012）も前提にないので、f(n) = nf(1) は「f(2) = 2f(1)、f(3) = 3f(1)、… と同じことをくり返す」と言葉で言うだけにし、
#   わけの問題にはしない。答えを求める問題では、必要な n まで順に代入すれば求められる数にした。
# 展開（A-015）と 2 次関数（A-020）も前提にないので、f(x) = ax + b を代入したときの計算は分配法則と同類項をまとめるだけでできるものにした。
#   f(f(x)) = a(ax + b) + b = a²x + ab + b は、文字の積 a × a = a²（A-009、A-010）として扱う。a² = 9 のような式は「傾きは正」と決めて a を 1 つにする。
#   連続性やコーシーの関数方程式の一般の解（実数全体での f(x) = ax）は扱わない（A-029）。
# 「すべての x で等しい 2 つの 1 次式は係数が等しい」は、x = 0 と x = 1 を代入して連立方程式で確かめる、と見本で示した。
# 関数方程式を解いたあとは、求めた関数をもとの式に入れて確かめることを、paths と note で毎回言う（必要と十分の語は L-013 なので使わない）。
# check：値を問う問題は、求めた関数（lambda）で値を計算し、その関数がもとの式を整数（や分数）のいくつかの値で満たすことも確かめる。
#   関数を選ぶ問題は、選択肢ごとの lambda が、もとの式を x = −5〜5 で満たすものを選び出す。分数は Fraction で計算する。
# ただし腕だめしの最難関（f(x)f(y) = f(x + y) + f(x − y) の問題）だけは例外で、uses に N-028 と L-012 を挙げて、余りの周期と帰納法を使う。
# 関数方程式は、関数方程式（A-029）、指数関数と対数関数（D-001、f(x + y) = f(x)f(y) と f(xy) = f(x) + f(y)）、
#   線形写像（M の流れ、f(x + y) = f(x) + f(y)）、群の準同型（R-001）の入口になる（D-026）。

id: A-023
days:
  - day: 1
    items:
      - part: 見本
        id: "0b4c46ce3a"
        text: x を入れると数が 1 つ出てくる箱を f とし、出てくる数を f(x) と書きます。f(x + 1) = f(x) + 3 のように、f がわからないまま入っている等式を関数方程式といいます。f(0) = 2 なら、x に 0、1、2 と順に入れると、f(1)、f(2)、f(3) が決まります。
        svg: '<svg viewBox="0 0 320 202" xmlns="http://www.w3.org/2000/svg"><text x="70.6" y="36" font-size="16" text-anchor="middle" fill="currentColor">4</text><line x1="80.4" y1="30" x2="94.8" y2="30" stroke="currentColor" stroke-width="2"/><polygon points="100.4,30 92.4,34.4 92.4,25.6" fill="currentColor"/><rect x="103.4" y="13" width="103.7" height="34" rx="8" fill="#b39ddb" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="155.2" y="35" font-size="14" text-anchor="middle" fill="currentColor">f(x) = 2x + 3</text><line x1="210" y1="30" x2="224.4" y2="30" stroke="currentColor" stroke-width="2"/><polygon points="230,30 222,34.4 222,25.6" fill="currentColor"/><text x="244.6" y="36" font-size="16" text-anchor="middle" fill="currentColor">11</text><text x="160" y="70" font-size="13" text-anchor="middle" fill="currentColor">入れた数 4 → 出てくる数 f(4) = 11</text><rect x="20.5" y="136" width="54" height="38" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="47.5" y="161" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="47.5" y="194" font-size="14" text-anchor="middle" fill="currentColor">f(0)</text><rect x="95.5" y="136" width="54" height="38" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="122.5" y="161" font-size="16" text-anchor="middle" fill="currentColor">5</text><text x="122.5" y="194" font-size="14" text-anchor="middle" fill="currentColor">f(1)</text><rect x="170.5" y="136" width="54" height="38" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="197.5" y="161" font-size="16" text-anchor="middle" fill="currentColor">8</text><text x="197.5" y="194" font-size="14" text-anchor="middle" fill="currentColor">f(2)</text><rect x="245.5" y="136" width="54" height="38" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="272.5" y="161" font-size="16" text-anchor="middle" fill="currentColor">11</text><text x="272.5" y="194" font-size="14" text-anchor="middle" fill="currentColor">f(3)</text><path d="M 53.5 132 Q 85 106 116.5 132" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="116.5,132 108.7,130.5 113.6,124.6" fill="currentColor"/><text x="85" y="113" font-size="13" text-anchor="middle" fill="currentColor">+3</text><path d="M 128.5 132 Q 160 106 191.5 132" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="191.5,132 183.7,130.5 188.6,124.6" fill="currentColor"/><text x="160" y="113" font-size="13" text-anchor="middle" fill="currentColor">+3</text><path d="M 203.5 132 Q 235 106 266.5 132" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="266.5,132 258.7,130.5 263.6,124.6" fill="currentColor"/><text x="235" y="113" font-size="13" text-anchor="middle" fill="currentColor">+3</text></svg>'
        explain: x の値を決めると y の値がただ 1 つ決まる関数（A-019）に f という名前をつけ、x に対応する値を f(x) と書きます。f(x) = 2x + 3 なら f(4) = 2 × 4 + 3 = 11 です（図の上）。f(x + 1) = f(x) + 3 は「すべての x で成り立つ」ので、x にどんな数を代入してもかまいません。x = 0 を代入すると f(1) = f(0) + 3 = 5、x = 1 で f(2) = f(1) + 3 = 8、x = 2 で f(3) = f(2) + 3 = 11 です（図の下）。x が 1 増えるごとに 3 ずつ増えるので、0 以上の《整数》 n では f(n) = 2 + 3n です。もう 1 つの例として、すべての x で f(2x) = 2f(x)、f(3) = 4 なら、x = 3 で f(6) = 2f(3) = 8、x = 6 で f(12) = 2f(6) = 16 と、x を 2 倍した数につながります。「x に何を代入すれば、わかっている値とつながるか」を考えるのがこつです。この単元では、とくに断らなければ、式は実数全体の x で成り立つものとします。
