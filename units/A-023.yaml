  - day: 3
    items:
      - part: 見本
        text: 1 次関数 f で、すべての x について f(x + 1) + f(x) = 6x + 5 が成り立つとき、f(x) を求めましょう。また、すべての x で f(x) + 2f(1 − x) = 3x が成り立つ関数 f(x) も求めてみましょう。
        explain: 1 つ目は、f(x) = ax + b とおきます。f(x + 1) + f(x) = a(x + 1) + b + ax + b = 2ax + (a + 2b) です。これが 6x + 5 とすべての x で等しいので、x = 0 を代入すると a + 2b = 5、x = 1 を代入すると 3a + 2b = 11 です。この連立方程式（A-012）を解くと a = 3、b = 1 です。すべての x で等しい 2 つの 1 次式は、x の係数どうし（2a = 6）と定数項どうし（a + 2b = 5）が等しいと考えても、同じ答えになります。よって f(x) = 3x + 1 です。2 つ目は、f の形がわかりません。そこで、x のかわりに 1 − x を代入します。1 − (1 − x) = x なので、f(1 − x) + 2f(x) = 3(1 − x) = 3 − 3x です。もとの式 f(x) + 2f(1 − x) = 3x とあわせると、f(x) と f(1 − x) を 2 つの未知数とみた連立方程式になります。2 つ目の式の 2 倍からもとの式をひくと、3f(x) = 2(3 − 3x) − 3x = 6 − 9x で、f(x) = 2 − 3x です。最後に、もとの式に入れて (2 − 3x) + 2{2 − 3(1 − x)} = 2 − 3x − 2 + 6x = 3x と確かめます。
      - part: 思い出す
        text: すべての x、y で f(x + y) = f(x) + f(y) が成り立ち、f(3) = 12 です。f(−5) はいくつですか。
