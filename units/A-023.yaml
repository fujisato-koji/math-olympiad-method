        hints:
          - f(3) = 3f(1) から、f(1) を求めましょう。
          - f(5) = 5f(1) です。
          - f(−x) = −f(x) を使いましょう。
        paths:
          - [f(1) = 12 ÷ 3 = 4, f(5) = 20, f(−5) = −20]
      - part: 思い出す
        text: 連立方程式 2p + q = 5、p + 2q = −2 を解きましょう。p はいくつですか。
