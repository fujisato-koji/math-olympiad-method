        text: すべての実数 x、y で f(x + y) = f(x) + f(y) が成り立つ関数 f では、f(0) = 0 で、すべての x について f(−x) = −f(x) です。このわけを、すじ道を立てて書きましょう。
        explain: 例：「f は、すべての x、y で f(x + y) = f(x) + f(y) を満たすとする。x = 0、y = 0 を代入すると f(0) = f(0) + f(0) である。両辺から f(0) をひくと 0 = f(0)、つまり f(0) = 0。次に、x を任意の実数とし、y = −x を代入すると、f(x + (−x)) = f(x) + f(−x)、つまり f(0) = f(x) + f(−x) である。f(0) = 0 なので f(x) + f(−x) = 0、移項して f(−x) = −f(x)。x はどんな実数でもよいので、すべての x で成り立つ。」と書ければよい。①「〜とする」で f と x を決める、② 特別な値（0、−x）を代入して式を変形する、③ 約束した事実（すべての x、y で成り立つので代入してよい、等式の性質で移項する）で結ぶ、の 3 つがそろっているかを見る。f(x) = 2x のような例で確かめただけで終わっていたら、例では「すべての f」を示せないことを話す。f(−x) = −f(x) を示すのに f(0) = 0 を使うので、順番が大事であることにもふれる。
