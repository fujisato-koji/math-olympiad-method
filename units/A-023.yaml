    hints:
    - x や y に 0 や 1 を入れると、何がわかるでしょう。まず f(0) を求めてみましょう。
    - y = 1 を入れると、f(x + 1)、f(x)、f(x − 1) の関係が出ます。f(2)、f(3)、f(4) を順に求めてみましょう。
    - 2026 まで 1 つずつ求めずにすむ方法はないでしょうか。
    paths:
    - - x = y = 0 を入れると f(0)² = 2f(0) なので f(0) = 0 か 2。f(0) = 0 とすると、y = 0 を入れて 0 = 2f(x) となり、f が 0 だけになって f(1) = 3 に合わない。だから f(0) = 2
      - y = 1 を入れると 3f(x) = f(x + 1) + f(x − 1)、つまり f(n + 1) = 3f(n) − f(n − 1)。f(0) = 2、f(1) = 3 から、f(2) = 7、f(3) = 18、f(4) = 47、… と、整数の値がじゅんに決まる
      - 100 でわった余りを順に書くと 2、3、7、18、47、23、22、43、7、… と続く。(f(n)、f(n + 1)) の余りの組は、前の組だけで次の組が決まる。そのまま 30 項まで書くと、f(30) と f(31) の余りが 2、3 にもどる。だから余りは 30 項ごとにくり返す（帰納法、L-012、余りの周期、N-028）
      - 2026 = 30 × 67 + 16 なので、f(2026) の余りは f(16) の余りと同じ
      - 余りの列の 17 番めの項（f(16)）は 47。だから答えは 47。確かめ：x = 0 を入れると f(0)f(y) = f(y) + f(−y) から f(−y) = f(y)。f(n) = aⁿ + a⁻ⁿ（a + 1/a = 3）とおくと、f(x)f(y) = a^(x+y) + a^(−x−y) + a^(x−y) + a^(y−x) = f(x + y) + f(x − y) となり、f(0) = 2、f(1) = 3 もみたすので、このような f はほんとうにある。f(n) が整数になることは、f(n + 1) = 3f(n) − f(n − 1) で整数から整数が作られることからわかる
    - - f(0) = 2 を、1 本目と同じように求める。x = y = n を入れると f(n)² = f(2n) + f(0) なので f(2n) = f(n)² − 2
      - x = n + 1、y = n を入れると f(n + 1)f(n) = f(2n + 1) + f(1) なので f(2n + 1) = f(n)f(n + 1) − 3。この 2 つの式で、(f(n)、f(n + 1)) から (f(2n)、f(2n + 1)) と (f(2n + 1)、f(2n + 2)) が作れる
      - 2026 を 2 でわっていくと 1013、506、253、126、63、31、15、7、3、1、0。0 から 2026 に向かって逆にたどる（2 倍するか、2 倍して 1 を足す）。最初は (f(0)、f(1)) = (2、3)
      - 100 でわった余りで (f(k)、f(k + 1)) を作りかえていくと、k = 1：(3、7)、3：(18、47)、7：(43、7)、15：(98、47)、31：(3、7)、63：(18、47)、126：(22、43)、253：(43、47)、506：(47、18)、1013：(43、22)、2026：(47、43)
      - k = 2026 の組の左は 47。f(2026) を 100 でわった余りは 47（周期を知らなくても求まる）
    note: 考えどころは 3 つ：①f(0) = 2 を出す（0 だけの関数は f(1) = 3 に合わない）、②y = 1 を入れて f(n + 1) = 3f(n) − f(n − 1) の、前の数から次の数を出す式にする、③余りの列が 30 項ごとにくり返すことを使って、2026 を 30 でわった余り 16 に下ろす。ほかに f(−n) = f(n) も x = 0 からわかり、求めた f(n) = aⁿ + a⁻ⁿ（a + 1/a = 3）がもとの式をみたすことを、1 本目の最後で確かめている。2 本目は、f(2n) と f(2n + 1) の式で 2026 を 2 でわるたびに余りの組を作りかえていく道で、周期を知らなくてもたどり着ける。check は、2 倍の式で (f(n)、f(n + 1)) を作り、f(1) = 3 と、x、y が 0〜39 のときにもとの式が成り立つことを確かめてから f(2026) を 100 でわった余りを出す（47）。別に f(0)〜f(4) を −80〜80 の整数で全部調べると、条件をみたす表は 1 つ（2、3、7、18、47）だけだった。f(n + 1) = 3f(n) − f(n − 1) のくり返しの余りの問題に見えるが、ここでは前の数から次の数を出す式そのものを関数方程式から作るところがちがう。 f(x)f(y) = f(x + y) + f(x − y) は、答えが f(x) = aˣ + a⁻ˣ の形になる知られた型で、ここでは f(1) = 3（a + 1/a = 3）として、f(2026) を 100 でわったあまりを問う形にした。
