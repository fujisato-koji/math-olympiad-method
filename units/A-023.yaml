    note: 1/(1 − x) をくり返すと 2 → −1 → 1/2 → 2 と 3 回でもとにもどることに気づくのが要。f の式を求めなくても、3 つの値の連立方程式で解ける。1/(1 − 1/2) = 2 などの分数の計算でつまずきやすい。
