        explain: x と y の両方に、好きな数を代入できます。x = 0、y = 0 を代入すると f(0) = f(0) + f(0) なので、f(0) を移項して f(0) = 0 です。次に y = −x を代入すると f(0) = f(x) + f(−x) で、f(0) = 0 なので f(−x) = −f(x) です。また、x = 1、y = 1 を代入すると f(2) = 2f(1)、x = 2、y = 1 を代入すると f(3) = f(2) + f(1) = 3f(1) で、同じことをくり返すと、正の整数 n では f(n) = nf(1) となります。たとえば f(1) = 5 なら、f(3) = 15、f(−3) = −15 です。さらに、x = y = 1/2 を代入すると f(1) = 2f(1/2) なので、f(1/2) = (1/2)f(1) です。比例の式 f(x) = ax は、a(x + y) = ax + ay なので、この関数方程式を満たします。かけ算の形 f(xy) = f(x) + f(y)（x、y は正の数）なら、x = y = 1 を代入して f(1) = 0 です。f(x + y) = f(x)f(y) なら、x = y = 1 で f(2) = f(1)² です。このように、0、1、−x のような特別な値を代入して、わかることを 1 つずつ集めていきます。
