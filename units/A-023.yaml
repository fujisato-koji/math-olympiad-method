      - part: わけ
        id: "50e5f1ff96"
        text: すべての x で f(x) + 2f(−x) = 3x + 6 を満たす関数は、f(x) = −3x + 2 だけです。このわけを、すじ道を立てて書きましょう。
        explain: 例：「f は、すべての x で f(x) + 2f(−x) = 3x + 6 …① を満たすとする。x を任意の数とする。① は −x でも成り立つので、x のかわりに −x を代入すると f(−x) + 2f(x) = −3x + 6 …② である。② の 2 倍から ① をひくと、4f(x) + 2f(−x) − f(x) − 2f(−x) = 2(−3x + 6) − (3x + 6)、つまり 3f(x) = −9x + 6 で、f(x) = −3x + 2。x はどんな数でもよいので、条件を満たす関数は f(x) = −3x + 2 しかない。逆に f(x) = −3x + 2 なら、f(x) + 2f(−x) = −3x + 2 + 2(3x + 2) = 3x + 6 で、確かに満たす。」と書ければよい。①「〜とする」で f と x を決める、② −x を代入した式をつくり、2 つの式から f(−x) を消す、③ 約束した事実（すべての x で成り立つので代入してよい、等式の性質）で結ぶ、の 3 つがそろっているかを見る。前の問題とちがい、f が 1 次関数とは仮定していない（形を決めずに求めた）ことにふれる。最後の確かめがぬけていたら、前の問題と同じくおぎなうように話す。
        hints:
          - 「f は、すべての x で ① を満たすとする」から書き始めましょう。
          - text: x のかわりに −x を代入すると、f(x) と f(−x) が入れかわった式 ② ができます。
