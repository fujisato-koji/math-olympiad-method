        explain: 「同じ 高さから 転がすと、球は 同じ 長さの 坂を 下ります。速さは、どの 高さから 来たかで 決まり、重さでは 変わりません。だから、重い 球も 軽い 球も 同じ くらいの 速さに なります。」と いえれば よい。① 同じ 高さ、② 速さは 高さで 決まる、③ 重さでは 変わらない。子どもには、2 つの 球で たしかめさせます。
