# P-187 転がる・すべる・ぶつかる
#
# 段 1・水準 1・4 日。坂の高さと速さ、重い球と軽い球、ぶつけて物を動かすことを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 日の並び：1 日目 導入（坂の高さと速さ）、2 日目 練習（重い球と軽い球）、3 日目 わけ（ぶつけて物を動かす）、4 日目 確認。
# くらべる玉は同じ大きさで中までつまったもの（ビー玉、鉄の玉、木の玉）。中が空のピンポン玉は少しおそい。
# 腕だめし（離）の kinds は読み取り（つみきの数から高さを読み取って答える）。

