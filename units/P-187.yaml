        id: "6a892e2c44"
        text: |-
          てつの 玉と ビー玉は、おなじ 大きさです。てつの 玉の ほうが おもいです。
          おなじ たかさから いっしょに ころがすと、2 つは ほとんど おなじ はやさで ゴールに つきます。
          はやさを きめるのは、おもさでは なく スタートの たかさです。
