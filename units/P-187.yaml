        explain: 玉は、たかい ところから ひくい ところへ おりる あいだに、だんだん はやく なります。おりる たかさが 大きいほど、下に ついた ときの はやさも 大きく なります。おなじ いたでも、上の ほうから ころがすと はやく、下の ほうから ころがすと ゆっくりです。はやさを きめるのは、さかの ながさでは なく、スタートの たかさです。いえでは、本を つんで いたを ななめに し、ビー玉を ころがして たしかめられます。
