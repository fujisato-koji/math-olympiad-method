# P-187 転がる・すべる・ぶつかる
#
# 段 1・水準 1・4 日。坂の高さと速さ、重い球と軽い球、ぶつけて物を動かすことを扱う。
# 子の画面には text、figure、choices、ヒントだけを出す。answer、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。

id: P-187
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          坂を 転がる 球は、坂が 高いほど 速く なります。
          高い 所から 転がすと、低い 所から 転がすより 速く なります。
          速さは、球が どれだけ 高い 所から 来たかで 変わります。
        explain: |-
          高い 所から 転がすと、球は 長い 坂を 下ります。その 分だけ 速く なります。
          低い 所から 転がすと、速さは 小さく なります。
          坂の 高さで、球の 速さが 変わります。
        note: 坂が高いほど、転がる球は速い。
      - part: 今日
        text: 高い 坂と 低い 坂で、球を 転がすと、速く なるのは どちらかな。
        figure: 🎢
        choices: [高い 坂, 低い 坂, どちらも 同じ, どちらも 動かない]
        answer: 高い 坂
        check: "'高い 坂'"
        hints:
          - 球が どれだけ 高い 所から 来たか を 考えよう。
          - 高い 所から 来る ほうが、長く 転がります。
          - 高い 所から 転がす ほど 速く なる ことを たしかめよう。
        paths:
          - [高い 所から, 長く 転がる, 速い, 高い 坂]
      - part: 今日
        text: 坂を 転がる 球の 速さは、何で 変わるかな。
        choices: [坂の 高さ, 球の 色, 坂の 模様, 天気]
        answer: 坂の 高さ
        check: "'坂の 高さ'"
        hints:
          - 球が どこから 転がるか を 考えよう。
          - 高い 所と 低い 所で、速さを くらべます。
          - 高さと 速さの 関係を たしかめよう。
        paths:
          - [どこから 転がる, 高さ, 速さ]
      - part: 挑戦
        text: 同じ 球を、もっと 高い 所から 転がすと、速さは どうなるかな。
        choices: [速く なる, 遅く なる, 変わらない, 止まる]
        answer: 速く なる
        check: "'速く なる'"
        hints:
          - 高い 所から 転がす ときの ことを 考えよう。
          - 長い 坂を 下ります。
          - 高い 所から 転がした ときの 速さを たしかめよう。
        paths:
          - [高い 所, 長い 坂, 速く なる]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          同じ 高さから 転がすと、重い 球も 軽い 球も、同じ くらいの 速さに なります。
          空気の 抵抗や 摩擦が 小さい ときの 話です。
          重さより、どの 高さから 転がしたかが、速さを 決めます。
        explain: |-
          重い 球も 軽い 球も、同じ 高さから 転がすと、同じ 速さに なります。
          これは、重さが 違っても、落ち方や 転がり方が 同じだからです。
          ただし、空気の 抵抗や 摩擦が 大きいと、変わって きます。
        note: 同じ高さなら、重い球も軽い球も同じくらいの速さ。
      - part: 今日
        text: 同じ 高さから、重い 球と 軽い 球を 転がすと、速さは どうなるかな。
        choices: [同じ くらい, 重い 球が ずっと 速い, 軽い 球が ずっと 速い, どちらも 動かない]
        answer: 同じ くらい
        check: "'同じ くらい'"
        hints:
          - 高さが 同じか を たしかめよう。
          - 重さと 速さの 関係を 考えます。
          - 2 つの 球の 速さを くらべよう。
        paths:
          - [同じ 高さ, 重さより 高さ, 同じ くらい]
      - part: 今日
        text: 球の 速さを 決めるのに、大きく 関係する ものは どれかな。
        choices: [転がす 高さ, 球の 色, 球の 模様, 天気]
        answer: 転がす 高さ
        check: "'転がす 高さ'"
        hints:
          - 高い 所と 低い 所で、速さを くらべよう。
          - 重さより、高さが 関係します。
          - 高さと 速さの 関係を 考えよう。
        paths:
          - [高さ, 速さ, 転がす 高さ]
      - part: 挑戦
        text: 重い 球と 軽い 球を 同じ 高さから 転がすと、どちらが 先に ゴールに つくかな。
        choices: [ほぼ 同時, 重い 球が ずっと 先, 軽い 球が ずっと 先, どちらも 動かない]
        answer: ほぼ 同時
        check: "'ほぼ 同時'"
        hints:
          - 同じ 高さから 転がします。
          - 重さと 速さの 関係を 考えよう。
          - 2 つの 球の ゴールの 順番を たしかめよう。
        paths:
          - [同じ 高さ, 同じ くらいの 速さ, ほぼ 同時]
    extra: []

