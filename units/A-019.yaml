        explain: x の値を 1 つ決めると、y の値がただ 1 つ決まるとき、「y は x の関数である」といいます。表から、y は 4 に 3 の x 倍を足した数なので、y = 3x + 4 と表せます。このように、y が x の 1 次式 y = ax + b（a、b は数で、a は 0 でない）で表されるとき、「y は x の 1 次関数である」といいます。比例 y = ax（A-006 の決まった数が a）は、b = 0 の 1 次関数です。x の増える量に対する y の増える量の割合を、変化の割合といいます。変化の割合 ＝ (y の増える量) ÷ (x の増える量) です。x が 1 から 4 まで 3 増えると、y は 7 から 16 まで 9 増えるので、変化の割合は 9 ÷ 3 = 3 です。1 次関数 y = ax + b の変化の割合は、どこで調べてもいつも a になります（わけは 4 日目）。反比例 y = 12/x や y = x² は、1 次関数ではありません。
