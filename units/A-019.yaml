      - part: わけ
        text: 1 次関数 y = ax + b では、x がどの値からどの値まで増えても、変化の割合はいつも a になります。このわけを、筋道を立てて書きましょう。
        explain: 例：「x が p から q まで増えるとする（p < q）。x = p のとき y = ap + b、x = q のとき y = aq + b である。x の増える量は q − p、y の増える量は (aq + b) − (ap + b) = aq − ap = a(q − p)（分配法則）。q − p は 0 でないのでわってよく、変化の割合は a(q − p) ÷ (q − p) = a である。p と q はどんな値でもよいので、変化の割合はいつも a である。」と書ければよい。①「〜とする」で p、q を決める、② y の増える量を計算して式を変形する（b が消える、a でくくる）、③ 約束した事実（変化の割合の意味、分配法則、0 でない数でわる）で結ぶ、の 3 つがそろっているかを見る。x = 1 から 3 のような例で確かめただけで終わっていたら、例ではすべての場合を示せないことを話す。反比例 y = 6/x では、x が 1 から 2 で −3、2 から 3 で −1 と、変化の割合が一定でないことと比べる。
        hints:
          - 「x が p から q まで増えるとする」から書き始めましょう。
          - x = p、x = q のときの y を、それぞれ式で書きましょう。
          - y の増える量を計算すると、b はどうなるでしょう。
        paths:
          - [x が p から q まで増えるとする, y の増える量は (aq + b) − (ap + b) = a(q − p), 変化の割合は a(q − p) ÷ (q − p) = a]
      - part: わけ
        text: 1 次関数 y = ax + b で a が正の数のとき、x が増えると y も必ず増えます（グラフは右上がり）。このわけを、筋道を立てて書きましょう。
        explain: 例：「a は正の数とし、x の 2 つの値を p、q（p < q）とする。それぞれの y の値の差は (aq + b) − (ap + b) = a(q − p)。p < q なので q − p は正の数で、a も正の数である。正の数どうしの積は正の数なので（N-027）、a(q − p) は正の数、つまり aq + b は ap + b より大きい。よって、x が p から q へ増えると、y も増える。」と書ければよい。①「〜とする」で a、p、q を決める、② y の値の差を式で変形する、③ 約束した事実（正の数どうしの積は正、差が正なら大きい）で結ぶ、の 3 つがそろっているかを見る。a が負の数なら、同じ筋道で a(q − p) が負の数になり、x が増えると y は減る（右下がり）ことにも触れる。前の問題（変化の割合はいつも a）を約束した事実として使い、「y の増える量 ＝ a × (x の増える量) で、どちらの数も正なので正」と書いてもよい。
        hints:
          - 「a は正の数とし、x の 2 つの値を p < q とする」から書き始めましょう。
          - x = q のときの y から、x = p のときの y をひいた差を、式で表しましょう。
          - 差が正の数になるわけを、正の数どうしのかけ算の符号で説明しましょう。
        paths:
          - [a は正、p < q とする, 差は (aq + b) − (ap + b) = a(q − p), q − p も a も正なので積は正, x が増えると y も増える]
      - part: わけ
        text: 2 つの直線 y = 2x + 1 と y = 2x − 3 は交わりません。このわけを、筋道を立てて書きましょう。
        explain: 例：「x をどんな数でもよいとする。その x での 2 つの直線の y の値の差は、(2x + 1) − (2x − 3) = 2x + 1 − 2x + 3 = 4 である。差はどの x でも 4 で、0 にならないので、同じ x で 2 つの y の値が等しくなることはない。2 つの直線の交点は、同じ x で y の値が等しくなる点なので、2 つの直線に交点はない。」と書ければよい。①「〜とする」で x を決める、② y の値の差を計算する（かっこを外すときの符号、同類項をまとめる）、③ 約束した事実（交点の意味）で結ぶ、の 3 つがそろっているかを見る。交点を求めようとして 2x + 1 = 2x − 3 を解くと 1 = −3 となり、解がないこと（A-011）と同じだと話す。傾きが等しく切片がちがう 2 つの直線（y = ax + b と y = ax + c で、b と c がちがう）は、同じ筋道でいつも交わらず、平行であることにも触れる。いくつかの x で y を比べただけで終わっていたら、例ではすべての x を示せないことを話す。
        hints:
          - 交点は、同じ x で y の値が等しくなる点です。
          - 同じ x での 2 つの y の値の差を、式で計算しましょう。
          - その差が 0 になることがあるかを考えましょう。
        paths:
          - [x をどんな数でもよいとする, 差は (2x + 1) − (2x − 3) = 4, 差はいつも 4 で 0 にならない, 交点はない]
