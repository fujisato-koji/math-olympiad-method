        explain: y = ax のグラフは、原点 O を通る直線です（比例のグラフ）。y = 2x + 3 の y の値は、同じ x の y = 2x の値より、いつも 3 大きいので、そのグラフは、y = 2x のグラフを y 軸の向きに 3 だけ平行に動かした直線になります。1 次関数 y = ax + b のグラフは直線で、b は x = 0 のときの y の値、つまり直線が y 軸と交わる点の y 座標です。これを切片といいます。a は傾きといい、右へ 1 進むと上へ a 進むことを表します（a が負の数なら下へ進みます）。傾きは、変化の割合と同じです。y = 2x + 3 のグラフは、点 (0, 3) を通り、右へ 1 進むと上へ 2 進みます。グラフを描くときは、切片の点と、そこから傾きのとおりに進んだ点の 2 点を、まっすぐ結びます。a が正の数なら右上がり、負の数なら右下がりの直線です。
