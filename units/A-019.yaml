# A-019 1 次関数とグラフ
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元（中身は中学 2 年）なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：関数（x を決めると y がただ 1 つ決まる）、比例 y = ax と 1 次関数 y = ax + b、表と式、変化の割合。
#   2 日目：グラフ（y = ax は原点を通る直線、y = ax + b はそれを y 軸の向きに b だけ平行に動かした直線）、傾きと切片、
#     グラフから式を読む、点が直線の上にあるか。
#   3 日目：式を求める（傾きと 1 点、2 点）、2 つの直線の交点（y を等しいとおいた 1 次方程式で解く）、x の変域から y の変域。
#   4 日目：わけ（3 問とも ③：変化の割合はいつも a、a が正なら増える、傾きが等しい 2 直線は交わらない）。
#   5 日目：A-006、A-011 と混ぜる（反比例とくらべる、水そう・ばね・本・料金の 1 次関数）。6 日目：確認。
# 前提は A-006（比例と反比例）、A-011（1 次方程式）。座標平面（G-050）は A-006 の前提として済んでいるものとし、負の座標も使う。
#   連立方程式（A-012）は前提にないので、2 元 1 次方程式 ax + by = c のグラフと連立方程式の解は扱わず、
#   交点は y = … の 2 つの式の右辺を等しいとおいて 1 次方程式で求める。反比例のグラフ（双曲線）は描かず、表と式でくらべるだけにした。
#   不等式（A-013）も前提にないので、変域は −1 ≦ x ≦ 4 の書き方を読むだけにし、不等式の性質は使わない。
# グラフは svg で描く（方眼の 1 めもり、x と y は −5〜5 が基本、原点 O、軸に矢印）。直線は方眼の交わる点を通るようにし、
#   問題の答え（式や値）は図に書かない。料金の比べ方の図は、目盛りの数を書かずにグラフのようすだけを見せる。
# 表は figure に全角の数字と全角の「－」で書く（A-006 の書き方。列の幅をそろえるため）。表の数と答えの数が重ならないようにした。
# 傾きが分数の式は「y = −(1/2)x + 1」と書く（「1/2x」は画面で分数に重ならないので、かっこでくくる）。
# 答えは数を打つ。式・点・変域を選ぶ問題は choices。式を選ぶ check は、選択肢ごとの式（lambda x）が、図の直線の通る格子点や
#   問題の点をすべて満たすものを選び出す。1 次関数かどうかの check は x が 1 増えるごとの y の増える量が 1 つにそろうか、
#   反比例かどうかは x × y が 1 つにそろうかで調べる。値の check は Fraction で計算し、負の数は「−」の形にそろえる。
# 1 次関数は、2 次関数（A-020）、座標と直線の式（G-026）、散布図と回帰（S-030）、需要と供給（F-008）、
#   投資の損益分岐（F-007）、比例制御（E-180）の入口になる（D-026）。

id: A-019
days:
  - day: 1
    items:
      - part: 見本
        text: 水そうに 4 L の水が入っています。そこへ 1 分あたり 3 L ずつ水を入れます。x 分後の水の量を y L として、x と y の関係を調べてみましょう。
        figure: "x｜　０｜　１｜　２｜　３｜　４\ny｜　４｜　７｜１０｜１３｜１６"
        explain: x の値を 1 つ決めると、y の値がただ 1 つ決まるとき、「y は x の関数である」といいます。表から、y は 4 に 3 の x 倍を足した数なので、y = 3x + 4 と表せます。このように、y が x の 1 次式 y = ax + b（a、b は数で、a は 0 でない）で表されるとき、「y は x の 1 次関数である」といいます。比例 y = ax（A-006 の決まった数が a）は、b = 0 の 1 次関数です。x の増える量に対する y の増える量の割合を、変化の割合といいます。変化の割合 ＝ (y の増える量) ÷ (x の増える量) です。x が 1 から 4 まで 3 増えると、y は 7 から 16 まで 9 増えるので、変化の割合は 9 ÷ 3 = 3 です。1 次関数 y = ax + b の変化の割合は、どこで調べてもいつも a になります（わけは 4 日目）。反比例 y = 12/x や y = x² は、1 次関数ではありません。
      - part: 思い出す
        text: y が x に比例し、x = 4 のとき y = 12 です。x = 7 のとき、y はいくつですか。
        answer: 21
        check: "Fraction(12, 4) * 7"
        hints:
          - 比例では、y ÷ x がいつも同じ数になります（A-006）。
          - x = 4 のとき、y ÷ x はいくつでしょう。
          - その数に 7 をかけましょう。
        paths:
          - [y ÷ x = 12 ÷ 4 = 3, y = 3x, 3 × 7 = 21]
      - part: 思い出す
        text: 方程式 6x − 7 = 2x + 13 を解きましょう。x はいくつですか。
        answer: 5
        check: "Fraction(13 + 7, 6 - 2)"
        hints:
          - x の項を左辺に、数の項を右辺に移項しましょう。
          - 移項すると、符号が変わります。
          - 両辺を x の係数でわりましょう。
        paths:
          - [6x − 2x = 13 + 7, 4x = 20, x = 5]
      - part: 今日
        text: 1 次関数 y = −2x + 5 で、x = 4 のときの y の値はいくつですか。
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(-2 * 4 + 5)"
        hints:
          - x に 4 を代入しましょう。
          - −2 × 4 を先に計算します。
          - 負の数と正の数のたし算に気をつけましょう。
        paths:
          - [y = −2 × 4 + 5, −8 + 5, −3]
      - part: 今日
        text: 次のうち、y が x の 1 次関数であるものはどれですか。
        choices: [y = 3 − 4x, y = 6/x, y = x²]
        answer: y = 3 − 4x
        check: "[c for c, f in {'y = 3 − 4x': lambda x: 3 - 4 * x, 'y = 6/x': lambda x: Fraction(6, x), 'y = x²': lambda x: x * x}.items() if len(set(f(x + 1) - f(x) for x in range(1, 8))) == 1][0]"
        hints:
          - 1 次関数は、y = ax + b の形に表せる関数です。
          - それぞれの式で、x が 1 増えるごとに y がいくつ増えるかを調べてもよいです。
          - y = 6/x は反比例（A-006）です。
        paths:
          - [y = 3 − 4x = −4x + 3, a = −4、b = 3 の 1 次関数]
        note: 項の順が y = ax + b とちがうと、1 次関数と気づきにくい。y = x² は 2 次の式で、x が 1 増えるごとの y の増える量がそろわない。
      - part: 挑戦
        text: 1 次関数 y = ax + 3 で、x の値が 2 から 6 まで増えると、y の値は 10 減ります。a はいくつですか。
        answer: −5/2
        accept: [−2.5]
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-10, 6 - 2))"
        hints:
          - 変化の割合は、(y の増える量) ÷ (x の増える量) です。
          - y が 10 減るのは、y の増える量が −10 ということです。
          - 1 次関数の変化の割合は、a に等しくなります。
        paths:
          - [x の増える量は 4, y の増える量は −10, a = −10 ÷ 4 = −5/2]
        note: 減る量を正の数のまま 10 ÷ 4 = 5/2 としやすい。
    extra:
      - part: 今日
        text: 1 次関数 y = 4x − 9 で、x = −2 のときの y の値はいくつですか。
        answer: −17
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(4 * (-2) - 9)"
        hints:
          - x に −2 を代入しましょう。
          - 4 × (−2) を先に計算します。
          - 負の数から正の数をひくときに気をつけましょう。
        paths:
          - [y = 4 × (−2) − 9, −8 − 9, −17]
      - part: 今日
        text: 下の表は、ある 1 次関数の x と y の値です。変化の割合はいくつですか。
        figure: "x｜－１｜　１｜　３｜　５\ny｜　５｜　１｜－３｜－７"
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-7 - 5, 5 - (-1)))"
        hints:
          - x がいくつ増えると、y がいくつ増えるかを表から読みましょう。
          - y が減っているときは、増える量は負の数です。
          - (y の増える量) ÷ (x の増える量) を計算しましょう。
        paths:
          - [x が 2 増えると y は 4 減る, −4 ÷ 2 = −2]
      - part: 挑戦
        text: 1 次関数 y = −3x + 4 で、x の値が −1 から 3 まで増えるとき、y の増える量はいくつですか。
        answer: −12
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((-3 * 3 + 4) - (-3 * (-1) + 4))"
        hints:
          - x = −1 と x = 3 のときの y を、それぞれ求めましょう。
          - y の増える量は、あとの y − 前の y です。
          - 変化の割合 × (x の増える量) でも求められます。
        paths:
          - [x = −1 で y = 7、x = 3 で y = −5, −5 − 7 = −12]
          - [変化の割合は −3, x の増える量は 4, −3 × 4 = −12]

