      - part: 見本
        id: "a73206148c"
        text: 水そうに 4 L の水が入っていて、そこへ 1 分に 3 L ずつ水を入れます。x 分後の水の量を y L とすると、x を決めると y がただ 1 つ決まります。このとき「y は x の関数である」といいます。y = 3x + 4 のように y = ax + b の形で表せる関数を 1 次関数といいます。(y の増える量) ÷ (x の増える量) を変化の割合といい、ここではいつも 3 です。
