      - part: わけ
        id: "5f596447ab"
        text: 1 次関数 y = ax + b で a が正の数のとき、x が増えると y も必ず増えます（グラフは右上がり）。このわけを、すじ道を立てて書きましょう。
        explain: 例：「a は正の数とし、x の 2 つの値を p、q（p < q）とする。それぞれの y の値の差は (aq + b) − (ap + b) = a(q − p)。p < q なので q − p は正の数で、a も正の数である。正の数どうしの積は正の数なので（N-027）、a(q − p) は正の数、つまり aq + b は ap + b より大きい。よって、x が p から q へ増えると、y も増える。」と書ければよい。①「〜とする」で a、p、q を決める、② y の値の差を式で変形する、③ 約束した事実（正の数どうしの積は正、差が正なら大きい）で結ぶ、の 3 つがそろっているかを見る。a が負の数なら、同じすじ道で a(q − p) が負の数になり、x が増えると y は減る（右下がり）ことにもふれる。前の問題（変化の割合はいつも a）を約束した事実として使い、「y の増える量 ＝ a × (x の増える量) で、どちらの数も正なので正」と書いてもよい。
