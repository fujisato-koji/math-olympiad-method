        explain: 傾きが 2 なので、式を y = 2x + b とおきます。点 (3, 1) を通るので、x = 3、y = 1 を代入すると 1 = 6 + b、b = −5 で、y = 2x − 5 です。2 点 (2, 5)、(6, 1) を通る直線は、まず傾きを求めます。x が 2 から 6 まで 4 増えると、y は 5 から 1 まで 4 減るので、傾きは −4 ÷ 4 = −1 です。y = −x + b に (2, 5) を代入して 5 = −2 + b、b = 7 なので、y = −x + 7 です。もう 1 つの点 (6, 1) を代入して、1 = −6 + 7 と確かめます。2 つの直線の交点は、どちらの式も成り立つ点なので、y が等しいとおいて 2x − 5 = −x + 7 を解きます（A-011）。3x = 12、x = 4 で、y = 2 × 4 − 5 = 3 なので、交点は (4, 3) です。また、x のとる値の範囲を x の変域といいます。y = −x + 7 で x の変域が 2 ≦ x ≦ 6 のとき、x = 2 で y = 5、x = 6 で y = 1 なので、y の変域は 1 ≦ y ≦ 5 です。右下がりの直線では、x が大きいほうで y が小さくなることに気をつけます。
