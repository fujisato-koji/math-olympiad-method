      - part: わけ
        id: "2cd3324153"
        text: 2 つの直線 y = 2x + 1 と y = 2x − 3 は交わりません。このわけを、すじ道を立てて書きましょう。
        explain: 例：「x をどんな数でもよいとする。その x での 2 つの直線の y の値の差は、(2x + 1) − (2x − 3) = 2x + 1 − 2x + 3 = 4 である。差はどの x でも 4 で、0 にならないので、同じ x で 2 つの y の値が等しくなることはない。2 つの直線の交点は、同じ x で y の値が等しくなる点なので、2 つの直線に交点はない。」と書ければよい。①「〜とする」で x を決める、② y の値の差を計算する（かっこを外すときの ＋ と −、x をふくむものどうし・数どうしをまとめる）、③ 約束した事実（交点の意味）で結ぶ、の 3 つがそろっているかを見る。交点を求めようとして 2x + 1 = 2x − 3 を解くと 1 = −3 となり、解がないこと（A-011）と同じだと話す。傾きが等しく切片がちがう 2 つの直線（y = ax + b と y = ax + c で、b と c がちがう）は、同じすじ道でいつも交わらず、平行であることにもふれる。いくつかの x で y を比べただけで終わっていたら、例ではすべての x を示せないことを話す。
        hints:
          - 交点は、同じ x で y の値が等しくなる点です。
