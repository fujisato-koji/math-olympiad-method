# G-053 線対称と点対称（対称の軸と中心、対称な図形の性質）
#
# 書き方は N-001 の頭の注のとおり。
# ことば：線対称、対称の軸、点対称、対称の中心、対応する点・辺・角、半回転。11+ と 13+ の回転対称（1 回転する間に何回重なるか）も入れた。
# 前提は G-004（折る・映す・回す）と G-006（直角と平行、三角形と四角形）だけで、数の単元は N-001（10 までの数）まで。
#   答えの数は 10 までにし、数えて出す（マスの数、軸の本数、重なる回数）。長さは方眼の目の数（何マス分）で言う。
# 角の大きさ（度）は G-009 で前提にないので、点対称は「半回転（はんぶん回す）させて重なる」で言い、180° は使わない。
#   1/4 回転などの回す角は G-015 の約束なので、回転対称は「1 回転する間に、もとの形と何回重なるか」を数えるだけにした。
# 形の名前は G-006 の長方形・正方形・直角三角形だけを使う。平行四辺形・台形・ひし形などは名前を使わず、図に あ〜え の名前をつけて問う。
#   正三角形・正六角形・正八角形は「辺の長さがみな等しく、角の大きさもみな等しい」と問題文で言う。
# 座標の上の対称（x 軸・y 軸について対称）は G-050、回転移動は G-015 で扱う。
# 図は svg（D-040）。方眼の上の形で、対称の軸は太い点線、対称の中心は点 O。答えの点や、完成させたあとの形は図にかかない。
#   文字の形は、書体で形が変わらないように、線で描いたブロック文字にした。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 線対称（対称の軸、対応する点・辺・角、軸の本数、形を完成させる）　2 日目 点対称（対称の中心、対応する点、完成させる）と回転対称
#   3 日目 わけ（対応する点と軸は直角に交わり軸で 2 等分される、対応する点を結ぶ線は中心を通り中心で 2 等分される、軸が 2 本直角なら点対称）
#   4 日目 G-004（鏡、半回転）・G-006（平行、長方形と正方形）と混ぜる　5 日目 確認
# check：多角形は頂点の座標を書き、頂点の並びを裏返す対応（線対称）やずらす対応（回転）で、どの 2 頂点の間の長さも変わらないものを数える式。
#   マスの形はマスの左下の点の集まりを、軸で折る・中心で半回転させる式。文字の形は線の集まりを折る・回す式。
#   性質の言葉を選ぶ問題（直角に交わる など）は約束ごとなので check を付けない。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-009 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

