    kinds: [数, 道筋]
    text: 6 つの辺の長さがみな等しく、6 つの角の大きさもみな等しい六角形（正六角形）に、1 つおきの頂点を結んで三角形をかき入れました。この図形の対称の軸は何本ありますか。
    svg: |
      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><polygon points="120,10 66.3,41 66.3,103 120,134 173.7,103 173.7,41" stroke="currentColor" stroke-width="2" fill="none"/><polygon points="120,10 66.3,103 173.7,103" stroke="currentColor" stroke-width="1.5" fill="#f3c969" fill-opacity=".35"/></svg>
    answer: 3
    check: "(lambda E: sum(1 for j in range(6) if {(min((j - a) % 6, (j - b) % 6), max((j - a) % 6, (j - b) % 6)) for a, b in E} == E))({(0, 1), (1, 2), (2, 3), (3, 4), (4, 5), (0, 5), (0, 2), (2, 4), (0, 4)})"
    hints:
      - 正六角形だけなら、対称の軸は何本あるかな。
      - そのうち、かき入れた三角形も重なる軸はどれかな。
      - 軸で折ったとき、三角形の頂点が三角形の頂点に重なるか、1 本ずつ確かめよう。
    paths:
      - [正六角形だけなら軸は 6 本, 向かい合う辺のまん中を通る 3 本の軸では 三角形の頂点が三角形でない頂点に移る, 向かい合う頂点を通る 3 本だけが残る, 3 本]
    note: 正六角形の 6 本の軸のうち、向かい合う辺のまん中を通る 3 本は、三角形を三角形でない頂点の上へ移すので軸にならない。形をかき足すと、対称の軸が減ることがある。
  - part: 離
