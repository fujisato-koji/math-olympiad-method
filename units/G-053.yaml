    note: 点対称な形は、対称の中心を通るどの直線でも合同な 2 つに分かれる（3 日目のわけ）。これを面積の 2 等分（G-008）に使う。2 つの中心を通る直線は、左へ 2 進むと上へ 4 上がるので、下の長方形の中心から右へ 1 進むと下の辺に着く。全体の面積も 2 等分される。
  - part: 離
