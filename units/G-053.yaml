    text: 方眼の 1 目は 1 cm です。2 つの長方形を組み合わせた形（色のついた部分）を、1 本の直線で切ります。その直線が、下の長方形も上の長方形も、それぞれ面積の等しい 2 つの部分に分けるようにすると、直線が形の下の辺と交わる点は、左はしから何 cm の所ですか。
