    answer: 4
    check: "sum(1 for S in itertools.combinations(range(9), 5) if all(8 - i in S for i in S) and not any(all(f(i) in S for i in S) for f in (lambda i: i // 3 * 3 + 2 - i % 3, lambda i: (2 - i // 3) * 3 + i % 3, lambda i: i % 3 * 3 + i // 3, lambda i: (2 - i % 3) * 3 + 2 - i // 3)))"
    hints:
      - O について向かい合う 2 マスを 1 組にすると、5 マスでは 1 マスあまるね。あまるマスはどこにあるかな。
      - 向かい合う 2 マスの組は何組あるかな。そこからどの 2 組を選ぶかな。
      - 選び方を全部書き出して、線対称になるものをのぞこう。
    paths:
      - [まん中のマスは必ずぬる, 向かい合う 2 マスの組 4 組から 2 組を選んで 6 通り, そのうち 4 すみ と 辺のまん中 4 マス の 2 通りは線対称, 6 − 2 = 4 通り]
    note: 点対称なぬり方は、O について向かい合うマスの組で考えると整理できる（5 マスなら、組にならないまん中のマスが必ず入る）。選んだ 2 組が「すみ」どうし、または「辺のまん中」どうしのときは線対称にもなる。6 通りを書き出して確かめればよい。
