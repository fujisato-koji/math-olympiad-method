# A-002 □を使った式
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習、わけ、混ぜる、確認）で作った。
#   1 日目：たしざんの □（□ + 4 = 9、30 + □ = 47）。2 日目：ひきざんの □ と、場面を □ の しきに する。
#   3 日目：□ を もとめる 計算の わけ。4 日目：N-007 と混ぜる。5 日目：確認。
# 前提は N-007（2 けたの たしざんと ひきざん）だけなので、かけ算と わり算は 使わない。数は 100 まで。
# A-001（てんびん）は前提に ないので、□ の 意味は「いくつと いくつ」（N-001）と 数の せん（N-002）で 説明する。
# しきを えらぶ 問題の check は、場面の ほんとうの 数（たとえば はじめの あめの 数）を 選択肢ごとの しき（lambda）に 入れ、
#   なりたつ ものを 1 つ 選び出す。ほかの 問題の check は □ を もとめる 計算の しき。
# ひきざんの 記号は「−」（U+2212）で 書く。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-001 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる（D-129〜D-131）。
# 図は svg（2026-11-13 に足した）。□ の しきは「テープの 図」で かく。うえの かっこが ぜんぶの 数、テープを 分けた 1 つ 1 つが あわせる 数。
#   てんせんで かこんだ ところが □（まだ わからない 数）。きいろ＝はじめ・のこり、あお＝たした・もらった、あか＝とった・あげた・たべた。
#   ヒントの テープ：下へ ひき出した ぶん＝「とる」（のこった □ を むらさきの わで かこむ）、下から 上へ もどす やじるし＝「もどす」。
#   1 日目・2 日目の 見本は、まる（おはじき）と テープを 上下に ならべ、まるの ならびを テープに かえる ことを 見せる。
#   はなしの 問題は「はじめ → かわる → さいご」の はこを やじるしで つなぐ。かわる 数は やじるしの 上の ふだ（あお＝ふえる、あか＝へる）。
#   2 けたの 計算は、10 の たば（たての ぼう）と ばら（まる）で かく。ひく 数は てんせんの あかで かく。
#   □ + □ の 問題の ヒントは、まるを 1 こずつ 上と 下に 分けて いく とちゅうの 図。
# 前は 1 日目の 見本と 2 問に 文字の 図（figure）が あったが、svg に かきかえた。みかんの check は 問題の 数の しきに した。

id: A-002
days:
  - day: 1
    items:
