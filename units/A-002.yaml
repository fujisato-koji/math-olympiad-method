        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="132" y="16" width="56" height="56" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="76" y="16" width="168" height="168" fill="none" stroke="currentColor" stroke-width="2"/><line x1="132" y1="16" x2="132" y2="184" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="76" y1="72" x2="244" y2="72" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="188" y1="16" x2="188" y2="184" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="76" y1="128" x2="244" y2="128" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="104" y="52" font-size="22" text-anchor="middle" fill="currentColor" font-weight="bold">12</text><rect x="149.6" y="33.6" width="20.9" height="20.9" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><text x="216" y="52" font-size="22" text-anchor="middle" fill="currentColor" font-weight="bold">16</text><text x="160" y="108" font-size="22" text-anchor="middle" fill="currentColor" font-weight="bold">15</text><text x="216" y="164" font-size="22" text-anchor="middle" fill="currentColor" font-weight="bold">18</text><rect x="70" y="12" width="180" height="64" rx="14" fill="none" stroke="#b39ddb" stroke-width="3.5" stroke-dasharray="7 4"/></svg>'
    paths:
      - [ななめ 12 + 15 + 18 = 45, よこ 12 + □ + 16 = 45, 12 + 16 = 28 で □ = 45 − 28 = 17]
      - [よこと ななめは どちらも 12 から はじまる, のこりの 2 つを たした かずが おなじ：□ + 16 = 15 + 18 = 33, □ = 33 − 16 = 17]
    note: あいて いる ますが 多いので、まず「3 つとも わかって いる ならび」（ななめ）を 見つけて 合計を きめるのが かんじん（N-012 の まほうじんの きまり）。そのあとは □ の しき（28 + □ = 45）に なる。上の よこだけを 見て 止まる 子には、ななめも ならびで あることを 思い出させる。
  - part: 離
    id: "cf57895083"
    kinds: [総動員, 読み取り]
    uses: [N-059]
    text: あさ 8 じ 10 ぷんに いえを でました。えきまで 18 ふん あるいて、そこから でんしゃに のりました。でんしゃを おりてから 12 ふん あるいて、9 じ 5 ふんに としょかんに つきました。でんしゃに のって いたのは なんぷんですか。まつ じかんは ありません。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="24" y="86" width="88.7" height="38" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="68.4" y="110.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">18 ふん</text><text x="68.4" y="144" font-size="14" text-anchor="middle" fill="currentColor">あるく</text><rect x="112.7" y="86" width="123.3" height="38" fill="#7fc8f8" fill-opacity="0.15" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><text x="174.4" y="110.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold"><tspan font-size="1.2em">□</tspan> ふん</text><text x="174.4" y="144" font-size="14" text-anchor="middle" fill="currentColor">でんしゃ</text><rect x="236" y="86" width="60" height="38" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="266" y="110.8" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">12 ふん</text><text x="266" y="144" font-size="14" text-anchor="middle" fill="currentColor">あるく</text><line x1="24" y1="64" x2="24" y2="86" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="296" y1="64" x2="296" y2="86" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="24" y="56" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">8 じ 10 ぷん</text><text x="296" y="56" font-size="15" text-anchor="end" fill="currentColor" font-weight="bold">9 じ 5 ふん</text><text x="38" y="174" font-size="22" text-anchor="middle" dominant-baseline="central">🏠</text><text x="56" y="180" font-size="14" text-anchor="start" fill="currentColor">いえ</text><text x="222" y="174" font-size="22" text-anchor="middle" dominant-baseline="central">📚</text><text x="238" y="180" font-size="14" text-anchor="start" fill="currentColor">としょかん</text></svg>'
    answer: 25
    check: "(9 * 60 + 5) - (8 * 60 + 10) - 18 - 12"
    hints:
      - いえを でてから つくまで、ぜんぶで なんぷん かかったかな。
      - text: 9 じで 2 つに わけたよ。8 じ 10 ぷんから 9 じまでは なんぷんかな。そこから 9 じ 5 ふんまでは どうかな。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="24" y="86" width="212" height="38" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><rect x="236" y="86" width="60" height="38" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="130" y="112" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">？ ふん</text><text x="266" y="112" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">？</text><line x1="24" y1="66" x2="24" y2="134" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="236" y1="66" x2="236" y2="134" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="296" y1="66" x2="296" y2="134" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="24" y="58" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">8 じ 10 ぷん</text><text x="236" y="58" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">9 じ</text><text x="296" y="154" font-size="15" text-anchor="end" fill="currentColor" font-weight="bold">9 じ 5 ふん</text><rect x="214" y="36" width="44" height="34" rx="10" fill="none" stroke="#b39ddb" stroke-width="3.5" stroke-dasharray="7 4"/></svg>'
      - ぜんぶの じかんから、あるいた じかんを ひこう。
    paths:
      - [8 じ 10 ぷん から 9 じ まで 50 ぷん、9 じ 5 ふん まで 55 ふん, あるいたのは 18 + 12 = 30 ぷん, でんしゃは 55 − 30 = 25 ふん]
      - [でんしゃの じかんを □ と する, 18 + □ + 12 = 55 で 30 + □ = 55, □ = 25]
    note: じこくから じかんを もとめる（N-059、9 時を またぐ）ことと、□ の しきを 合わせる。「9 じ 5 ふん − 8 じ 10 ぷん」で 5 − 10 が できずに 止まる 子が 多いので、9 時で 一ど 切らせると よい。

