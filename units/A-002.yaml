    hints:
      - テープを みよう。ぜんぶが 54 で、□ と 27 に わかれて いるね。
      - text: 54 から 27 を とると、□ の ぶんが のこるよ。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><path d="M30,48 Q30,40 38,40 L152,40 Q160,40 160,32 Q160,40 168,40 L282,40 Q290,40 290,48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="160" y="26" font-size="20" text-anchor="middle" fill="currentColor" font-weight="bold">54</text><rect x="30" y="62" width="130" height="38" fill="#f3c969" fill-opacity="0.15" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><rect x="85.5" y="71.5" width="19" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="160" y="62" width="130" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/><rect x="160" y="148" width="130" height="36" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="225" y="172.5" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">27</text><line x1="225" y1="106" x2="225" y2="132" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="225,142 219,132 231,132" fill="currentColor"/><text x="235" y="128" font-size="15" text-anchor="start" fill="currentColor">とる</text><rect x="24" y="56" width="142" height="50" rx="10" fill="none" stroke="#b39ddb" stroke-width="3.5" stroke-dasharray="7 4"/></svg>'
      - くりさがりに きを つけて ひこう。でた かずに 27 を たして、54 に なるか たしかめよう。
    paths:
