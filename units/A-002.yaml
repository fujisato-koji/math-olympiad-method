iddle" fill="currentColor" font-weight="bold">9 から 4 を とると <tspan font-size="1.2em">□</tspan> は 5</text></svg>'
        explain: □ は、まだ わからない かずの ばしょです。□ に 4 を たすと 9 に なります。9 この まるの うち、あおい 4 こが たした ぶんで、てんせんで かこんだ のこりが □ です。まるを ならべる かわりに、テープで かいても おなじです（うえの かっこが ぜんぶの 9）。9 は □ と 4 に わけられるので、□ は 9 − 4 = 5 です。5 を いれて 5 + 4 = 9。あって います。
