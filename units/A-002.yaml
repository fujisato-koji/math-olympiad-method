# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: ある かずに 38 を たす ところを、まちがえて 38 を ひいて しまったので、こたえは 19 に なりました。ただしい こたえは いくつですか。
    answer: 95
    check: "19 + 38 + 38"
    hints:
      - まず、「ある かず」を もとめよう。38 を ひいたら 19 に なったよ。
      - □ − 38 = 19 の □ は いくつかな。
      - わかった かずに、こんどは 38 を たそう。
    paths:
      - [□ − 38 = 19, □ = 19 + 38 = 57, ただしくは 57 + 38 = 95]
      - [ひいた 38 を もどして、さらに 38 を たす, 19 に 38 を 2 かい たす, 95]
    note: 間違えた計算を逆にたどって元の数を出し、正しい計算をし直す 2 段の問題。19 に 38 を 1 回だけ足した 57 で止まりやすい。2 本目は、引いた分と足す分で 38 の 2 つ分ずれると見る道。
  - part: 離
    kinds: [総動員]
    uses: [N-012]
    text: まほうじんは、たて、よこ、ななめの どの 3 つの かずを たしても、おなじ かずに なります。□ に はいる かずは いくつですか。
