          - [列の和が 1 なので Aᵀ(1；1) = (1；1), Aᵀ と A の固有値は同じで 1 をもつ, その固有ベクトルが定常状態]
        explain: 「定常状態 v は、1 回移しても変わらない状態なので、A v = v = 1・v。これは固有値 1 の固有ベクトルの定義そのもの。列の和が 1 の行列は 1 を固有値にもち、対応する固有ベクトルが定常状態になる。」と書ければよい。① 定常状態は A v = v、② 固有値 1、③ 定義。子どもには、2×2 の例で確かめさせます。

  - day: 6
    items:
      - part: わけ
        id: "75bedaaf44"
        text: 固有値が特性方程式 det(A−λI)=0 の解になるわけを説明しましょう。
        hints:
          - A v = λ v の右辺を左へ移し、v でくくりましょう（λ v = λ I v）。
          - text: (A − λI) v = 0 で v ≠ 0 なら、A − λI は 0 でない v を原点へつぶします。図のように、正方形は線につぶれます。
            svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><polygon points="40,120 90,120 90,70 40,70" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="40" y1="120" x2="83.6" y2="76.4" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="90,70 86.8,81 79,73.2" fill="#f08080"/><text x="92" y="64" font-size="14" text-anchor="start" fill="currentColor">v</text><line x1="110" y1="95" x2="161" y2="95" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="170,95 160,100.5 160,89.5" fill="currentColor"/><text x="140" y="85" font-size="14" text-anchor="middle" fill="currentColor">A − λI</text><line x1="180" y1="130" x2="280" y2="80" stroke="#b39ddb" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6"/><circle cx="200" cy="120" r="5" fill="#f08080" fill-opacity="0.95" stroke="currentColor" stroke-width="1.2"/><text x="206" y="142" font-size="13" text-anchor="start" fill="currentColor">v は O へ</text><text x="260" y="68" font-size="13" text-anchor="middle" fill="currentColor">直線につぶれる</text><text x="160" y="160" font-size="13" text-anchor="middle" fill="currentColor">正方形が線になる → 行列式は 0</text></svg>'
          - つぶれる行列は逆行列をもたず、その行列式は 0 です（M-004）。
        paths:
          - [(A−λI)v=0, v≠0 で A − λI に逆行列なし, det(A−λI)=0]
          - [逆に det(A−λI)=0 なら A − λI の列は 1 次独立でない, 0 でない v で (A−λI)v = 0, λ は固有値]
        explain: 「A v = λ v を変形すると、A v − λ v = 0、(A−λI)v = 0。v は 0 でないので、A−λI に逆行列があると v=0 になってしまう。だから A−λI は逆行列をもたず、det(A−λI)=0。この式の解が固有値です。」と書ければよい。① (A−λI)v=0、② v≠0、③ det=0。子どもには、2×2 の例で確かめさせます。
      - part: わけ
        text: A の固有ベクトル p₁、p₂（固有値 λ₁、λ₂）を列に並べた P について、A P = P D となるわけを説明しましょう。D は λ₁、λ₂ を対角に並べた行列です。
        hints:
          - text: A P の 1 列目は A p₁、2 列目は A p₂ です（列ごとに A をかける）。
            svg: '<svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg"><text x="55.2" y="41.8" font-size="16" text-anchor="middle" font-style="italic" fill="currentColor">A</text><rect x="82" y="22" width="24.8" height="28" rx="8" fill="#f08080" fill-opacity="0.55"/><rect x="110.8" y="22" width="24.8" height="28" rx="8" fill="#7bc96f" fill-opacity="0.55"/><path d="M78 20 Q70 36 78 52" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M139.6 20 Q147.6 36 139.6 52" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="94.4" y="41.8" font-size="16" text-anchor="middle" fill="currentColor">p₁</text><text x="123.2" y="41.8" font-size="16" text-anchor="middle" fill="currentColor">p₂</text><text x="154.4" y="41.8" font-size="16" text-anchor="middle" fill="currentColor">=</text><rect x="181.2" y="22" width="39.2" height="28" rx="8" fill="#f08080" fill-opacity="0.55"/><rect x="224.4" y="22" width="39.2" height="28" rx="8" fill="#7bc96f" fill-opacity="0.55"/><path d="M177.2 20 Q169.2 36 177.2 52" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M267.6 20 Q275.6 36 267.6 52" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="200.8" y="41.8" font-size="16" text-anchor="middle" fill="currentColor">A p₁</text><text x="244" y="41.8" font-size="16" text-anchor="middle" fill="currentColor">A p₂</text><text x="160" y="72" font-size="13" text-anchor="middle" fill="currentColor">列ごとに A をかける</text></svg>'
          - A p₁ = λ₁ p₁、A p₂ = λ₂ p₂ を入れましょう。
          - P D の列も計算して、くらべましょう。P⁻¹ があれば、右から P⁻¹ をかけて A = P D P⁻¹ になります。
        paths:
          - [A P = (A p₁ A p₂) = (λ₁p₁ λ₂p₂), P D = (λ₁p₁ λ₂p₂), A P = P D で A = P D P⁻¹]
          - [例 A = (2 1；1 2)、P = (1 1；1 −1), A P = (3 1；3 −1) = P D]
        explain: 「P = (p₁ p₂) とすると、A P の 1 列目は A p₁ = λ₁ p₁、2 列目は A p₂ = λ₂ p₂。一方、P D = (p₁ p₂)(λ₁ 0；0 λ₂) の 1 列目は λ₁ p₁、2 列目は λ₂ p₂。だから A P = P D。p₁、p₂ が 1 次独立なら P⁻¹ があり、右から P⁻¹ をかけて A = P D P⁻¹。」と書ければよい。① A P は列ごとに A をかける、② 固有ベクトルの式、③ P D の列とくらべる。子どもには、A = (2 1；1 2)、P = (1 1；1 −1) で確かめさせます。
      - part: わけ
        id: "304697a26f"
        text: 実対称行列が直交行列で対角化できるわけを説明しましょう。
