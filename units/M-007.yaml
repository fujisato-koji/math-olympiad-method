      - part: 見本
        id: "aa999ce03c"
        text: |-
          対角化は、行列のべき乗や、数列のくり返しの式に使えます。
          A^n = P D^n P⁻¹。D^n は対角成分を n 乗するだけです。
          《マルコフ行列》 (0.9 0.1；0.1 0.9) は、図のように、毎回 A と B の 0.9 が残り、0.1 が移るようすを表します。固有値は 1 と 0.8。
          十分時間がたつと、0.8^n の部分は消え、《定常状態》 (1/2；1/2) に近づきます（図の右の棒）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="42" cy="112" r="22" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="42" y="118" font-size="16" text-anchor="middle" font-weight="bold" fill="currentColor">A</text><circle cx="128" cy="112" r="22" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="128" y="118" font-size="16" text-anchor="middle" font-weight="bold" fill="currentColor">B</text><path d="M32 92 C16 56 68 56 53 89" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="51,91 51,80 59,86" fill="currentColor"/><text x="42" y="60" font-size="13" text-anchor="middle" fill="currentColor">0.9</text><path d="M118 92 C102 56 154 56 139 89" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="137,91 137,80 145,86" fill="currentColor"/><text x="128" y="60" font-size="13" text-anchor="middle" fill="currentColor">0.9</text><path d="M62 104 Q85 82 102 103" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="107,105 96,108 100,98" fill="currentColor"/><text x="85" y="87" font-size="13" text-anchor="middle" fill="currentColor">0.1</text><path d="M108 120 Q85 142 68 121" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><polygon points="63,119 74,116 70,126" fill="currentColor"/><text x="85" y="148" font-size="13" text-anchor="middle" fill="currentColor">0.1</text><text x="85" y="186" font-size="13" text-anchor="middle" fill="currentColor">はじめは全部 A</text><rect x="182" y="46" width="14" height="120" rx="1" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="182" y="46" width="14" height="0" rx="1" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="189" y="180" font-size="12" text-anchor="middle" fill="currentColor">0</text><rect x="201.5" y="58" width="14" height="108" rx="1" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="201.5" y="46" width="14" height="12" rx="1" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="208.5" y="180" font-size="12" text-anchor="middle" fill="currentColor">1</text><rect x="221" y="67.6" width="14" height="98.4" rx="1" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="221" y="46" width="14" height="21.6" rx="1" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="228" y="180" font-size="12" text-anchor="middle" fill="currentColor">2</text><rect x="240.5" y="75.3" width="14" height="90.7" rx="1" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="240.5" y="46" width="14" height="29.3" rx="1" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="247.5" y="180" font-size="12" text-anchor="middle" fill="currentColor">3</text><rect x="260" y="81.4" width="14" height="84.6" rx="1" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="260" y="46" width="14" height="35.4" rx="1" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="267" y="180" font-size="12" text-anchor="middle" fill="currentColor">4</text><rect x="279.5" y="86.3" width="14" height="79.7" rx="1" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="279.5" y="46" width="14" height="40.3" rx="1" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="286.5" y="180" font-size="12" text-anchor="middle" fill="currentColor">5</text><rect x="299" y="90.3" width="14" height="75.7" rx="1" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><rect x="299" y="46" width="14" height="44.3" rx="1" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1"/><text x="306" y="180" font-size="12" text-anchor="middle" fill="currentColor">6</text><line x1="178" y1="106" x2="318.5" y2="106" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><text x="176" y="110" font-size="12" text-anchor="end" fill="currentColor">1/2</text><text x="250" y="196" font-size="13" text-anchor="middle" fill="currentColor">n 回あと</text><text x="250" y="30" font-size="13" text-anchor="middle" fill="currentColor">割合の移り変わり</text></svg>'
        explain: |-
          【定義】マルコフ行列とは、成分が 0 以上で、各列の和が 1 の行列です。確率の移り方を表します。
          【定義】定常状態とは、マルコフ行列をかけても変わらない状態です。
          固有値 1 の固有ベクトルが定常状態になります。
          (0.9 0.1；0.1 0.9)(1/2；1/2) = (1/2；1/2)。
          もう 1 つの固有値 0.8 は 1 より小さいので、n が大きくなると 0.8^n → 0。図の棒は、はじめ (1；0) から n 回移したときの A（黄）と B（水色）の割合で、A の割合は 1/2 + (1/2)·0.8^n です。
        note: A^n = P D^n P⁻¹。固有値の絶対値が 1 より小さい部分は消える。
