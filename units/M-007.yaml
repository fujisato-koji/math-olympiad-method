            svg: '<svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg"><text x="20" y="18" font-size="13" text-anchor="start" fill="currentColor">A² = (P D P⁻¹)(P D P⁻¹) のかっこを外すと</text><text x="20" y="46" font-size="18" text-anchor="start" fill="currentColor">A² = P D </text><rect x="90.9" y="28.9" width="47.2" height="24.3" rx="5" fill="#f3c969" fill-opacity="0.55"/><text x="92.9" y="46" font-size="18" text-anchor="start" fill="currentColor">P⁻¹ P</text><text x="136.1" y="46" font-size="18" text-anchor="start" fill="currentColor"> D P⁻¹</text><text x="20" y="84" font-size="13" text-anchor="start" fill="currentColor">黄のところは P⁻¹ P = I（かけても変わらない）</text></svg>'
