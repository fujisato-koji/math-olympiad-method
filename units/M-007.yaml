oke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="258.2" y="39.8" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="284.2" y="39.8" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="258.2" y="63.8" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="284.2" y="63.8" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="252" y="100" font-size="13" text-anchor="middle" fill="currentColor">赤：v = (1；1) が</text><text x="252" y="118" font-size="13" text-anchor="middle" fill="currentColor">(3；3) へ。同じ向き</text><text x="252" y="150" font-size="13" text-anchor="middle" fill="currentColor">むらさき：u = (1；2) が</text><text x="252" y="168" font-size="13" text-anchor="middle" fill="currentColor">(4；5) へ。向きが変わる</text></svg>'
        explain: |-
          【定義】三角行列とは、対角より下（または上）の成分がすべて 0 の行列です。例：(1 2；0 3)。
          三角行列の固有値は、対角の成分になります。
          A v を計算し、それが v の定数倍になっているかを見ます。
          (2 1；1 2)(1；1) = (2+1；1+2) = (3；3) = 3(1；1)。
          (2 1；1 2)(1；−1) = (2−1；1−2) = (1；−1) = 1(1；−1)。固有値 1。
          図のむらさきの u = (1；2) は A u = (4；5) で、u の定数倍ではないので固有ベクトルではありません。
        note: A v = λ v。v ≠ 0。固有値は向きを変えない倍率。
