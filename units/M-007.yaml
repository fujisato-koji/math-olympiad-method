          - その 2 本を列に並べた P で、Pᵀ P を計算しましょう。
        paths:
          - [固有値は実数, 固有ベクトルは直交, 正規化して P は直交行列, A = P D Pᵀ]
          - [例 (2 2；2 5), P = 1/√5 (1 2；2 −1), Pᵀ A P = (6 0；0 1)]
