          - [A^k v = λ^k v とする, A^(k+1) v = A(λ^k v) = λ^k (A v) = λ^(k+1) v, すべての n で成り立つ]
        explain: 「A² v = A(A v) = A(λ v) = λ(A v) = λ(λ v) = λ² v。同じようにくり返すと A^n v = λ^n v。だから A^n の固有値は λ^n で、固有ベクトルは同じ v のまま。」と書ければよい。① A を 1 回ずつかける、② 数 λ を前に出す、③ くり返す。子どもには、A = (1 1；1 1)、v = (1；1)、λ = 2 で確かめさせます。

