  - day: 2
    items:
      - part: 見本
        id: "bc84e0e7b0"
        text: |-
          固有値は、特性方程式 det(A − λ I) = 0 の解です。
          2×2 の A = (a b；c d) では、λ² − (a+d)λ + (ad−bc) = 0。λ の式 det(A − λ I) を、A の特性多項式といいます。
          a+d はトレース、ad−bc は行列式です。固有値の和はトレース、積は行列式になります。
          例：A = (4 1；2 3) は λ² − 7λ + 10 = 0（図の左）。グラフが λ のじくと交わる 5 と 2 が固有値です（図の右）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="26.5" y="51" font-size="14" text-anchor="middle" fill="currentColor">A − λI =</text><line x1="112.8" y1="37.9" x2="138" y2="54.1" stroke="#f08080" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.95"/><line x1="143" y1="34.6" x2="108.2" y2="57.2" stroke="#7fc8f8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.95"/><rect x="78.9" y="18" width="43.5" height="24" rx="11" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1.2"/><rect x="128.4" y="50" width="43.5" height="24" rx="11" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1.2"/><path d="M73.9 10 Q65.9 46 73.9 82" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M176.9 10 Q184.9 46 176.9 82" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="100.7" y="35.4" font-size="15" text-anchor="middle" fill="currentColor">4−λ</text><text x="150.2" y="35.4" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="100.7" y="67.4" font-size="15" text-anchor="middle" fill="currentColor">2</text><text x="150.2" y="67.4" font-size="15" text-anchor="middle" fill="currentColor">3−λ</text><text x="88" y="104" font-size="13" text-anchor="middle" fill="currentColor">(4 − λ)(3 − λ) − 1 × 2</text><text x="88" y="124" font-size="13" text-anchor="middle" fill="currentColor">= λ² − 7λ + 10</text><text x="88" y="160" font-size="13" text-anchor="middle" fill="currentColor">これが 0 になる λ が</text><text x="88" y="178" font-size="13" text-anchor="middle" fill="currentColor">固有値</text><line x1="184" y1="150" x2="309" y2="150" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="316,150 308,154.4 308,145.6" fill="currentColor"/><line x1="190" y1="196" x2="190" y2="37" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="190,30 194.4,38 185.6,38" fill="currentColor"/><text x="312" y="165" font-size="13" text-anchor="middle" font-style="italic" fill="currentColor">λ</text><text x="198" y="38" font-size="13" text-anchor="start" font-style="italic" fill="currentColor">y</text><path d="M190 50 L194.2 66.9 L198.5 82.5 L202.8 96.9 L207 110 L211.2 121.9 L215.5 132.5 L219.8 141.9 L224 150 L228.2 156.9 L232.5 162.5 L236.8 166.9 L241 170 L245.2 171.9 L249.5 172.5 L253.8 171.9 L258 170 L262.2 166.9 L266.5 162.5 L270.8 156.9 L275 150 L279.2 141.9 L283.5 132.5 L287.8 121.9 L292 110 L296.2 96.9 L300.5 82.5 L304.8 66.9 L309 50" stroke="#7fc8f8" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="224" cy="150" r="5" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1.2"/><circle cx="275" cy="150" r="5" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1.2"/><text x="232" y="142" font-size="13" text-anchor="start" fill="currentColor">2</text><text x="267" y="142" font-size="13" text-anchor="end" fill="currentColor">5</text><text x="249.5" y="126" font-size="13" text-anchor="middle" fill="currentColor">固有値</text><text x="252" y="22" font-size="13" text-anchor="middle" fill="currentColor">y = λ² − 7λ + 10</text></svg>'
        explain: |-
          A − λI は、対角から λ を引いた行列。その行列式が 0 になる λ が固有値です。
