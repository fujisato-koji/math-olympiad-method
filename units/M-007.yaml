# M-007 固有値と対角化
#
# 段 6・水準 3・8 日。前提は M-004（行列式）。
# 固有値と固有ベクトル、特性多項式、対角化、対称行列の対角化、行列のべき乗を扱う。
# 行列の書き方は (a b；c d)。答えは子の画面に出さない（保護者の表示だけ）。

id: M-007
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          正方行列 A と、0 でないベクトル v について、A v = λ v となるとき、
          λ を A の固有値、v を固有値 λ の固有ベクトルといいます。
          固有ベクトルは、A で移しても向きが変わらず、長さだけ λ 倍になります。
          例：A = (2 1；1 2)、v = (1；1) なら、A v = (3；3) = 3 v。固有値 3。
        explain: |-
          【定義】三角行列とは、対角より下（または上）の成分がすべて 0 の行列です。例：(1 2；0 3)。
          三角行列の固有値は、対角の成分になります。
          A v を計算し、それが v の定数倍になっているかを見ます。
          (2 1；1 2)(1；1) = (2+1；1+2) = (3；3) = 3(1；1)。
          (2 1；1 2)(1；−1) = (2−1；1−2) = (1；−1) = 1(1；−1)。固有値 1。
        note: A v = λ v。v ≠ 0。固有値は向きを変えない倍率。
      - part: 思い出す
        text: (2 1；1 2)(1；1) はどれですか。
        choices: ["(1；1)", "(2；2)", "(3；3)", "(4；4)"]
        answer: "(3；3)"
        check: "'(3；3)'"
        hints:
          - 1 行目は 2×1 + 1×1 です。
          - 2 行目は 1×1 + 2×1 です。
          - 成分ごとの計算を、行列の形にまとめましょう。
        paths:
          - [2×1+1×1=3, 1×1+2×1=3, (3；3)]
      - part: 今日
        text: A = (2 1；1 2)、v = (1；1) のとき、v は固有値いくつの固有ベクトルですか。
        choices: [1, 2, 3, 4]
        answer: 3
        check: "3"
        hints:
          - A v を計算します。
          - A v = (3；3) = 3(1；1) です。
          - 固有値 3 です。
        paths:
          - [A v = (3；3), 3v, 固有値 3]
      - part: 今日
        text: A = (2 1；1 2)、v = (1；−1) のとき、v は固有値いくつの固有ベクトルですか。
        choices: [−1, 0, 1, 2]
        answer: 1
        check: "1"
        hints:
          - A v を計算します。
          - (2 1；1 2)(1；−1) = (1；−1) です。
          - 固有値 1 です。
        paths:
          - [A v = (1；−1), 1v, 固有値 1]
      - part: 挑戦
        text: 《三角行列》 (1 2；0 3) の固有値はどれですか。
        choices: ["1 と 2", "1 と 3", "2 と 3", "0 と 3"]
        answer: "1 と 3"
        check: "'1 と 3'"
        hints:
          - 三角行列の固有値は、対角の成分です。
          - 対角は 1 と 3 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [三角行列の固有値は対角, 1 と 3]
    extra:
      - part: 今日
        text: 固有ベクトルとして許されないのはどれですか。
        choices: ["(1；1)", "(1；−1)", "(0；0)", "(2；0)"]
        answer: "(0；0)"
        check: "'(0；0)'"
        hints:
          - 固有ベクトルは 0 ではありません。
          - (0；0) は零ベクトルです。
          - 許されません。
        paths:
          - [固有ベクトルは v ≠ 0, (0；0) は除く]
      - part: 今日
        text: A v = λ v で、v が固有ベクトルなら、A で v の向きはどうなりますか。
        choices: ["変わる", "変わらない", "90° 回る", "0 になる"]
        answer: "変わらない"
        check: "'変わらない'"
        hints:
          - A v は v の λ 倍です。
          - λ 倍しても向きは同じ（λ が負なら反対）です。
          - 向きは変わりません。
        paths:
          - [A v = λv, 向きは同じ, 長さだけ λ 倍]
      - part: わけ
        text: 固有値 0 をもつ行列は、逆行列をもたないわけを説明しましょう。
        explain: 「固有値 0 の固有ベクトル v について、A v = 0 v = 0。v は 0 でないので、A は 0 でないベクトルを 0 に写す。逆行列があったら v = A⁻¹ 0 = 0 となってしまい、矛盾する。だから逆行列はない。」と書ければよい。① A v = 0、② v ≠ 0、③ 逆行列があったら矛盾。子どもには、det A = 0 と比べさせます。
        hints:
          - 固有値 0 なら A v = 0 です。
          - v は 0 ではありません。
          - 逆行列があったら v = 0 になってしまいます。
        paths:
          - [A v = 0, v ≠ 0, 逆行列なら矛盾, 逆行列なし]

  - day: 2
    items:
      - part: 見本
        text: |-
          固有値は、特性方程式 det(A − λ I) = 0 の解です。
          2×2 の A = (a b；c d) では、λ² − (a+d)λ + (ad−bc) = 0。
          a+d はトレース、ad−bc は行列式です。固有値の和はトレース、積は行列式になります。
          例：A = (4 1；2 3) は λ² − 7λ + 10 = 0。固有値は 5 と 2。
        explain: |-
          A − λI は、対角から λ を引いた行列。その行列式が 0 になる λ が固有値です。
          2×2 では λ² − (トレース)λ + (行列式) = 0。
          5 + 2 = 7（トレース）、5 × 2 = 10（行列式）になっています。
        note: det(A−λI)=0。2×2 は λ²−(a+d)λ+(ad−bc)=0。和はトレース、積は行列式。
      - part: 思い出す
        text: A = (4 1；2 3) のトレースと行列式はどれですか。
        choices: ["トレース 7、行列式 10", "トレース 10、行列式 7", "トレース 5、行列式 2", "トレース 2、行列式 5"]
        answer: "トレース 7、行列式 10"
        check: "'トレース 7、行列式 10'"
        hints:
          - トレースは対角の和です。
          - 行列式は 4×3 − 1×2 です。
          - 7 と 10 です。
        paths:
          - [トレース 4+3=7, 行列式 12−2=10]
      - part: 今日
        text: A = (4 1；2 3) の固有値はどれですか。
        choices: ["5 と 2", "1 と 10", "−2 と −5", "4 と 3"]
        answer: "5 と 2"
        check: "'5 と 2'"
        hints:
          - λ² − 7λ + 10 = 0 です。
          - (λ−5)(λ−2)=0 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [λ²−7λ+10=0, (λ−5)(λ−2)=0, 5 と 2]
      - part: 今日
        text: A = (1 2；0 3) の特性方程式はどれですか。
        choices: ["(1−λ)(3−λ)=0", "(1+λ)(3+λ)=0", "λ²+2=0", "λ²−3=0"]
        answer: "(1−λ)(3−λ)=0"
        check: "'(1−λ)(3−λ)=0'"
        hints:
          - 三角行列の対角から λ を引きます。
          - ここまでの考えを、自分の言葉でまとめましょう。
          - 対角がそのまま固有値です。
        paths:
          - [三角行列, 対角から λ, (1−λ)(3−λ)=0]
      - part: 挑戦
        text: A = (0 −1；1 0) の固有値はどれですか。
        choices: ["0 と 1", "1 と −1", "i と −i", "2 と −2"]
        answer: "i と −i"
        check: "'i と −i'"
        hints:
          - 特性方程式は λ² + 1 = 0 です。
          - λ² = −1 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [λ²+1=0, λ²=−1, i と −i]
    extra:
      - part: 今日
        text: 2×2 行列の固有値の和は何に等しいですか。
        choices: ["トレース", "行列式", "0", "1"]
        answer: "トレース"
        check: "'トレース'"
        hints:
          - 特性方程式の λ の係数を見ます。
          - 和は a+d です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [固有値の和 = a+d, トレース]
      - part: 今日
        text: 2×2 行列の固有値の積は何に等しいですか。
        choices: ["トレース", "行列式", "0", "1"]
        answer: "行列式"
        check: "'行列式'"
        hints:
          - 特性方程式の定数項を見ます。
          - 積は ad−bc です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [固有値の積 = ad−bc, 行列式]
      - part: わけ
        text: 2×2 行列の固有値の和がトレース、積が行列式になるわけを説明しましょう。
        explain: 「特性方程式は λ² − (a+d)λ + (ad−bc)=0。解を α、β とすると、(λ−α)(λ−β)=λ²−(α+β)λ+αβ。係数をくらべると、α+β=a+d、αβ=ad−bc。」と書ければよい。① 特性方程式、② 解と係数の関係、③ 和と積。子どもには、5 と 2 の例で確かめさせます。
        hints:
          - 特性方程式は λ²−(a+d)λ+(ad−bc)=0 です。
          - (λ−α)(λ−β) とくらべます。
          - α+β=a+d、αβ=ad−bc です。
        paths:
          - [λ²−(a+d)λ+(ad−bc), (λ−α)(λ−β), 和と積]

  - day: 3
    items:
      - part: 見本
        text: |-
          対角化：A = P D P⁻¹ と書けるとき、A は対角化できるといいます。
          D は固有値を対角に並べた行列、P はその固有ベクトルを列に並べた行列です。
          対角化できるのは、2×2 なら 1 次独立な固有ベクトルが 2 本あるときです。
          対角化すると、A^n = P D^n P⁻¹ でべき乗が簡単に計算できます。
        explain: |-
          対角化とは、座標系を固有ベクトルの向きに取り直すことです。
          もとの座標 x を P⁻¹ で固有ベクトルの座標 y に移すと、A は対角行列 D になり、各方向を固有値倍するだけになります。
          計算が終わったら P でもとの座標に戻します。だから A = P D P⁻¹ です。
          対角行列のべき乗は対角成分をべき乗するだけなので、A^n が簡単に求まります。
          例：A = (2 1；1 2) の固有値は 3 と 1。固有ベクトルは (1；1) と (1；−1)。
          P = (1 1；1 −1)、D = (3 0；0 1) とすると、A = P D P⁻¹。
        note: A = P D P⁻¹。P は固有ベクトル、D は固有値。A^n = P D^n P⁻¹。
        svg: |-
          <svg viewBox="0 0 340 180" role="img" aria-label="対角化の図">
            <g fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="20" y="35" width="110" height="36" rx="6"/>
              <rect x="210" y="35" width="110" height="36" rx="6"/>
              <rect x="20" y="115" width="110" height="36" rx="6"/>
              <rect x="210" y="115" width="110" height="36" rx="6"/>
            </g>
            <g font-size="12" fill="currentColor" text-anchor="middle">
              <text x="75" y="58">x（もとの座標）</text>
              <text x="265" y="58">A x</text>
              <text x="75" y="138">y（固有ベクトル）</text>
              <text x="265" y="138">D y</text>
            </g>
            <g stroke="currentColor" fill="none" stroke-width="1.6">
              <line x1="130" y1="53" x2="210" y2="53"/>
              <line x1="130" y1="133" x2="210" y2="133"/>
              <line x1="75" y1="71" x2="75" y2="115"/>
              <line x1="265" y1="115" x2="265" y2="71"/>
            </g>
            <path d="M210 53 L202 49 L202 57 Z" fill="currentColor"/>
            <path d="M210 133 L202 129 L202 137 Z" fill="currentColor"/>
            <path d="M75 115 L71 107 L79 107 Z" fill="currentColor"/>
            <path d="M265 71 L261 79 L269 79 Z" fill="currentColor"/>
            <g font-size="11" fill="currentColor">
              <text x="165" y="46">A</text>
              <text x="155" y="126">D（対角）</text>
              <text x="48" y="96">P⁻¹</text>
              <text x="274" y="96">P</text>
              <text x="20" y="172">固有ベクトルの座標に移すと、A は対角行列 D になる</text>
            </g>
          </svg>
      - part: 思い出す
        text: 対角行列 D = (3 0；0 1) の D² はどれですか。
        choices: ["(3 0；0 1)", "(6 0；0 1)", "(9 0；0 1)", "(9 0；0 2)"]
        answer: "(9 0；0 1)"
        check: "'(9 0；0 1)'"
        hints:
          - 対角行列のべき乗は、対角成分をそれぞれべき乗します。
          - 3² = 9、1² = 1 です。
          - 成分ごとの計算を、行列の形にまとめましょう。
        paths:
          - [対角成分をべき乗, 3²=9、1²=1, (9 0；0 1)]
      - part: 今日
        text: A = (2 1；1 2) を対角化するとき、固有ベクトルを列に並べた P はどれですか。
        choices: ["(1 1；1 −1)", "(1 1；1 1)", "(3 0；0 1)", "(1 −1；1 1)"]
        answer: "(1 1；1 −1)"
        check: "'(1 1；1 −1)'"
        hints:
          - 固有値 3 の固有ベクトルは (1；1) です。
          - 固有値 1 の固有ベクトルは (1；−1) です。
          - 列に並べると (1 1；1 −1) です。
        paths:
          - [固有ベクトル (1；1)、(1；−1), 列に並べる, (1 1；1 −1)]
      - part: 今日
        text: A = (2 1；1 2) を対角化した D はどれですか。
        choices: ["(3 0；0 1)", "(1 0；0 3)", "(2 0；0 2)", "(0 3；1 0)"]
        answer: "(3 0；0 1)"
        check: "'(3 0；0 1)'"
        hints:
          - 固有値は 3 と 1 です。
          - 対角に並べます。
          - 成分ごとの計算を、行列の形にまとめましょう。
        paths:
          - [固有値 3、1, 対角に並べる, (3 0；0 1)]
      - part: 挑戦
        text: A = (2 1；1 2) の A^n の固有値はどれですか。
        choices: ["3^n と 1", "3n と 1", "3 と 1", "3^n と n"]
        answer: "3^n と 1"
        check: "'3^n と 1'"
        hints:
          - A^n = P D^n P⁻¹ です。
          - D^n の対角は 3^n と 1^n です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [A^n = P D^n P⁻¹, D^n の対角 3^n、1, 3^n と 1]
    extra:
      - part: 今日
        text: 2×2 行列が対角化できるのは、どんなときですか。
        choices: ["1 次独立な固有ベクトルが 2 本ある", "固有値が 1 つだけ", "行列式が 0", "対称でない"]
        answer: "1 次独立な固有ベクトルが 2 本ある"
        check: "'1 次独立な固有ベクトルが 2 本ある'"
        hints:
          - P の列が 1 次独立でないと、P⁻¹ が作れません。
          - 2 本の独立な固有ベクトルが要ります。
          - そのときです。
        paths:
          - [P の列が独立, 2 本の固有ベクトル]
      - part: 今日
        text: 対角化すると、行列のべき乗はどうなりますか。
        choices: ["計算しやすくなる", "計算できなくなる", "変わらない", "0 になる"]
        answer: "計算しやすくなる"
        check: "'計算しやすくなる'"
        hints:
          - A^n = P D^n P⁻¹ です。
          - D^n は対角成分のべき乗だけです。
          - 計算しやすくなります。
        paths:
          - [A^n = P D^n P⁻¹, D^n は簡単, 計算しやすい]
      - part: わけ
        text: A = P D P⁻¹ のとき、A^n = P D^n P⁻¹ になるわけを説明しましょう。
        explain: 「A² = (P D P⁻¹)(P D P⁻¹) = P D (P⁻¹P) D P⁻¹ = P D² P⁻¹。P⁻¹P = I で消える。同じように繰り返すと、A^n = P D^n P⁻¹。」と書ければよい。① A² で P⁻¹P が消える、② 繰り返す、③ A^n。子どもには、n=2、3 で確かめさせます。
        hints:
          - A² を計算すると、P⁻¹P = I で消えます。
          - A² = P D² P⁻¹ です。
          - 繰り返すと A^n = P D^n P⁻¹ です。
        paths:
          - [A² = P D² P⁻¹, P⁻¹P=I, 繰り返す, A^n = P D^n P⁻¹]

  - day: 4
    items:
      - part: 見本
        text: |-
          実対称行列（Aᵀ = A）は、必ず対角化できます。
          しかも、固有値はすべて実数で、ちがう固有値の固有ベクトルは直交します。
          固有ベクトルを正規化して並べると、P は直交行列（Pᵀ P = I）になります。
          このとき A = P D Pᵀ と書けます。
        explain: |-
          A = (2 1；1 2) は対称行列。固有値 3、1 は実数。
          固有ベクトル (1；1) と (1；−1) は直交します（内積 0）。
          正規化すると P = 1/√2 (1 1；1 −1) で、Pᵀ P = I になります。
        note: 実対称行列は直交行列で対角化できる。固有値は実数、固有ベクトルは直交。
      - part: 思い出す
        text: 対称行列の条件はどれですか。
        choices: ["Aᵀ = A", "Aᵀ = −A", "A² = A", "A⁻¹ = A"]
        answer: "Aᵀ = A"
        check: "'Aᵀ = A'"
        hints:
          - 転置しても同じ行列です。
          - 求めた量の単位を確かめてから、答えましょう。
          - 対称行列です。
        paths:
          - [転置が同じ, Aᵀ=A]
      - part: 今日
        text: A = (2 1；1 2) の固有ベクトル (1；1) と (1；−1) の内積はいくつですか。
        choices: [−2, 0, 1, 2]
        answer: 0
        check: "1 * 1 + 1 * (-1)"
        hints:
          - 内積は 1×1 + 1×(−1) です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [内積 1×1 + 1×(−1), 0]
      - part: 挑戦
        text: 実対称行列の固有値は、実数ですか、虚数ですか。
        choices: ["実数", "虚数", "どちらもありうる", "0 だけ"]
        answer: "実数"
        check: "'実数'"
        hints:
          - 実対称行列は直交行列で対角化できます。
          - 対角成分は実数です。
          - 固有値は実数です。
        paths:
          - [直交行列で対角化, 対角は実数, 固有値は実数]
    extra:
      - part: 今日
        text: 直交行列 P の条件はどれですか。
        choices: ["Pᵀ P = I", "P² = I", "Pᵀ = −P", "P⁻¹ = 0"]
        answer: "Pᵀ P = I"
        check: "'Pᵀ P = I'"
        hints:
          - 直交行列は、列が正規直交基底です。
          - 転置が逆行列になります。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [列が正規直交, Pᵀ = P⁻¹, PᵀP=I]
      - part: 今日
        text: 実対称行列のちがう固有値の固有ベクトルはどうなっていますか。
        choices: ["直交する", "平行になる", "同じになる", "0 になる"]
        answer: "直交する"
        check: "'直交する'"
        hints:
          - 実対称行列は直交行列で対角化できます。
          - 固有ベクトルを直交するように選べます。
          - 直交します。
        paths:
