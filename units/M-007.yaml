  - day: 7
    items:
      - part: 見本
        id: "34d2fba663"
        text: |-
          固有値と対角化は、1 つの問題で組み合わせられます（図は上から順に使う流れ）。
          ・特性方程式 det(A−λI)=0。
          ・対角化 A = P D P⁻¹。
          ・べき乗 A^n = P D^n P⁻¹。
          ・実対称行列は直交行列で対角化。
          ・マルコフ行列の定常状態は固有値 1 の固有ベクトル。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="18" font-size="13" text-anchor="middle" fill="currentColor">例：A = (2 1；1 2) のとき</text><rect x="10" y="29" width="116" height="26" rx="7" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="68" y="47" font-size="13" text-anchor="middle" fill="currentColor">特性方程式</text><text x="144" y="47" font-size="14" text-anchor="start" fill="currentColor">λ² − 4λ + 3 = 0</text><line x1="68" y1="56" x2="68" y2="60" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="68,65 64.7,59 71.3,59" fill="currentColor"/><rect x="10" y="65" width="116" height="26" rx="7" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="68" y="83" font-size="13" text-anchor="middle" fill="currentColor">固有値</text><text x="144" y="83" font-size="14" text-anchor="start" fill="currentColor">λ = 3、1</text><line x1="68" y1="92" x2="68" y2="96" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="68,101 64.7,95 71.3,95" fill="currentColor"/><rect x="10" y="101" width="116" height="26" rx="7" fill="#7bc96f" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="68" y="119" font-size="13" text-anchor="middle" fill="currentColor">固有ベクトル</text><text x="144" y="119" font-size="14" text-anchor="start" fill="currentColor">(1；1)、(1；−1)</text><line x1="68" y1="128" x2="68" y2="132" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="68,137 64.7,131 71.3,131" fill="currentColor"/><rect x="10" y="137" width="116" height="26" rx="7" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="68" y="155" font-size="13" text-anchor="middle" fill="currentColor">対角化</text><text x="144" y="155" font-size="14" text-anchor="start" fill="currentColor">D = (3 0；0 1)</text><line x1="68" y1="164" x2="68" y2="168" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="68,173 64.7,167 71.3,167" fill="currentColor"/><rect x="10" y="173" width="116" height="26" rx="7" fill="#b39ddb" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="68" y="191" font-size="13" text-anchor="middle" fill="currentColor">べき乗</text><text x="144" y="191" font-size="14" text-anchor="start" fill="currentColor">Aⁿ = P Dⁿ P⁻¹</text></svg>'
        explain: |-
          例：A = (2 1；1 2)。特性方程式 λ² − 4λ + 3 = 0 から固有値 3、1。
          固有ベクトル (1；1)、(1；−1)。P = (1 1；1 −1)、D = (3 0；0 1)。
          A^n = P D^n P⁻¹ = (1/2)(3^n+1 3^n−1；3^n−1 3^n+1)。
        note: 特性方程式→固有値→固有ベクトル→対角化→べき乗の順に使う。
