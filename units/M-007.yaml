  - day: 3
    items:
      - part: 見本
        id: "88f249b4f3"
        text: |-
          対角化：A = P D P⁻¹ と書けるとき、A は対角化できるといいます。
          D は固有値を対角に並べた行列、P はその固有ベクトルを同じ順に列に並べた行列です。
          対角化できるのは、2×2 なら 1 次独立な固有ベクトルが 2 本あるときです。
          図は A = (2 1；1 2) で円を移したようすです。固有ベクトルの向きで見ると、A はそれぞれの向きを固有値倍するだけです。
          対角化すると、A^n = P D^n P⁻¹ でべき乗が簡単に計算できます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="144" x2="114" y2="52" stroke="#f08080" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="22" y1="52" x2="114" y2="144" stroke="#7bc96f" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="68" cy="98" r="28" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="68" y1="98" x2="82.1" y2="83.9" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="87.8,78.2 84.9,88.1 77.9,81.1" fill="#f08080"/><line x1="68" y1="98" x2="82.1" y2="112.1" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="87.8,117.8 77.9,114.9 84.9,107.9" fill="#7bc96f"/><text x="68" y="40" font-size="13" text-anchor="middle" fill="currentColor">赤 (1；1)</text><text x="68" y="162" font-size="13" text-anchor="middle" fill="currentColor">緑 (1；−1)</text><line x1="110" y1="98" x2="151" y2="98" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="160,98 150,103.5 150,92.5" fill="currentColor"/><text x="135" y="88" font-size="16" text-anchor="middle" font-style="italic" fill="currentColor">A</text><line x1="172" y1="164" x2="304" y2="32" stroke="#f08080" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="198" y1="58" x2="278" y2="138" stroke="#7bc96f" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/><ellipse cx="238" cy="98" rx="84" ry="28" transform="rotate(-45 238 98)" fill="#f3c969" fill-opacity=".4" stroke="currentColor" stroke-width="2"/><line x1="238" y1="98" x2="291" y2="45" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="297.4,38.6 294.2,49.6 286.4,41.8" fill="#f08080"/><line x1="238" y1="98" x2="252.1" y2="112.1" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="257.8,117.8 247.9,114.9 254.9,107.9" fill="#7bc96f"/><text x="274" y="30" font-size="14" text-anchor="end" fill="currentColor">3 倍</text><text x="266" y="134" font-size="14" text-anchor="start" fill="currentColor">1 倍</text><text x="160" y="188" font-size="13" text-anchor="middle" fill="currentColor">固有ベクトルの向きに、固有値の倍率でのびる</text></svg>'
        explain: |-
          対角化とは、座標系を固有ベクトルの向きに取り直すことです。
          もとの座標 x を P⁻¹ で固有ベクトルの座標 y に移すと、A は対角行列 D になり、各方向を固有値倍するだけになります。
          計算が終わったら P でもとの座標にもどします。だから A = P D P⁻¹ です。
          対角行列のべき乗は対角成分をべき乗するだけなので、A^n が簡単に求まります。
          例：A = (2 1；1 2) の固有値は 3 と 1。固有ベクトルは (1；1) と (1；−1)。
          P = (1 1；1 −1)、D = (3 0；0 1) とすると、A = P D P⁻¹。図の円は、(1；1) の向きに 3 倍、(1；−1) の向きに 1 倍のだ円になります。
        note: A = P D P⁻¹。P は固有ベクトル、D は固有値。A^n = P D^n P⁻¹。
