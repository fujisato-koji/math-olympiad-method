        id: "7a1a37cbfc"
        text: |-
          実対称行列（Aᵀ = A）は、必ず対角化できます。
          しかも、固有値はすべて実数で、ちがう固有値の固有ベクトルは直交します（図）。
          固有ベクトルを正規化（長さを 1 に）して並べると、P は直交行列（Pᵀ P = I）になります。
