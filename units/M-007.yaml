      - part: わけ
        id: "ccee13ebbd"
        text: 実対称行列の固有値が実数になるわけを説明しましょう。
        hints:
          - A v = λ v の両辺に、左から v†（v の共役をとって転置したもの）をかけましょう。
          - 次に、A v = λ v の共役をとって転置します。A は実対称なので、A の共役の転置は A のままです。
          - text: 2 つの式を並べると、同じ v† A v（黄）が、λ v† v と λ̄ v† v の両方に等しくなります。
            svg: '<svg viewBox="0 0 320 136" xmlns="http://www.w3.org/2000/svg"><text x="172" y="42" font-size="12" text-anchor="start" fill="currentColor">（A v = λ v に v† をかける）</text><rect x="16" y="25.9" width="61.8" height="23" rx="5" fill="#f3c969" fill-opacity="0.55"/><text x="18" y="42" font-size="17" text-anchor="start" fill="currentColor">v† A v</text><text x="75.8" y="42" font-size="17" text-anchor="start" fill="currentColor"> = </text><rect x="94.2" y="25.9" width="16.8" height="23" rx="5" fill="#f08080" fill-opacity="0.55"/><text x="96.2" y="42" font-size="17" text-anchor="start" fill="currentColor">λ</text><text x="108.9" y="42" font-size="17" text-anchor="start" fill="currentColor"> v† v</text><text x="172" y="92" font-size="12" text-anchor="start" fill="currentColor">（共役と転置をとる）</text><rect x="16" y="75.8" width="61.8" height="23" rx="5" fill="#f3c969" fill-opacity="0.55"/><text x="18" y="92" font-size="17" text-anchor="start" fill="currentColor">v† A v</text><text x="75.8" y="92" font-size="17" text-anchor="start" fill="currentColor"> = </text><rect x="94.2" y="75.8" width="16.8" height="23" rx="5" fill="#7bc96f" fill-opacity="0.55"/><text x="96.2" y="92" font-size="17" text-anchor="start" fill="currentColor">λ</text><line x1="97.2" y1="78.1" x2="106.9" y2="78.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><text x="108.9" y="92" font-size="17" text-anchor="start" fill="currentColor"> v† v</text><text x="160" y="128" font-size="13" text-anchor="middle" fill="currentColor">黄のところが同じ。v† v は長さの 2 乗で 0 でない</text></svg>'
        paths:
          - [A v = λv, v† A v = λ v† v = λ̄ v† v, "v† v > 0 で λ = λ̄", 実数]
          - [2×2 の (a b；b d) の判別式 (a − d)² + (2b)², 0 以上, 実数]
        explain: 「実対称行列 A と固有値 λ、固有ベクトル v について、A v = λ v。複素共役をとって転置すると、v† A = λ̄ v†。A が実対称なので、λ v† v = λ̄ v† v。v ≠ 0 なので λ = λ̄、つまり λ は実数。」と書ければよい。① A v = λv、② 転置と共役、③ λ = λ̄。子どもには、2×2 の例で確かめさせます。

