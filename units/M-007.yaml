            svg: '<svg viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg"><text x="16" y="24" font-size="13" text-anchor="start" fill="currentColor">特性方程式</text><text x="24" y="54" font-size="16" text-anchor="start" fill="currentColor">λ² − </text><text x="64.8" y="54" font-size="16" text-anchor="start" fill="currentColor">(a + d)</text><text x="115.4" y="54" font-size="16" text-anchor="start" fill="currentColor">λ + </text><rect x="144.6" y="38.8" width="76.2" height="21.6" rx="5" fill="#b39ddb" fill-opacity="0.55"/><text x="146.6" y="54" font-size="16" text-anchor="start" fill="currentColor">(ad − bc)</text><text x="218.7" y="54" font-size="16" text-anchor="start" fill="currentColor"> = 0</text><text x="16" y="92" font-size="13" text-anchor="start" fill="currentColor">解が α、β なら (λ − α)(λ − β) = 0。展開すると</text><text x="24" y="122" font-size="16" text-anchor="start" fill="currentColor">λ² − </text><text x="64.8" y="122" font-size="16" text-anchor="start" fill="currentColor">(α + β)</text><text x="120.2" y="122" font-size="16" text-anchor="start" fill="currentColor">λ + </text><rect x="149.4" y="106.8" width="28" height="21.6" rx="5" fill="#b39ddb" fill-opacity="0.55"/><text x="151.4" y="122" font-size="16" text-anchor="start" fill="currentColor">αβ</text><text x="175.4" y="122" font-size="16" text-anchor="start" fill="currentColor"> = 0</text></svg>'
