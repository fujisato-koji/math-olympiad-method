# M-007 固有値と対角化
#
# 水準 3・8 日。前提は M-004（行列式）。
# 固有値と固有ベクトル、特性多項式、対角化、対称行列の対角化、行列のべき乗を扱う。
# 行列の書き方は (a b；c d)。答えは子の画面に出さない（保護者の表示だけ）。
# 図とイラストの多い形に直した（D-131、直す係 3）。見本と答える問題に、座標平面の矢印（固有ベクトルは赤と緑、A で移した先は太くうすい矢印）、
#   行列の図（トレースは黄の丸、行列式は赤と水色の線）、マルコフ行列の 2 つの場所の図を付け、ヒントの 1〜2 段に図を付けた（答えは図に書かない）。
# 同じ問題のくり返し（D-191）は、数や場面を変えた新しい問題に作り直した（5 日目 3、6 日目 2、7 日目の予備 3 問、8 日目 1・3〜8、腕だめし 1〜3）。
#   1 日目の予備「向きが変わらない矢印」も図から選ぶ形にした。これらは id を消した。

id: M-007
days:
  - day: 1
    items:
      - part: 見本
        id: "27ce666f00"
        text: |-
          正方行列 A と、0 でないベクトル v について、A v = λ v となるとき、
          λ を A の固有値、v を固有値 λ の固有ベクトルといいます。
          固有ベクトルは、A で移しても向きが変わらず、長さだけ λ 倍になります（図の赤）。向きが変わるもの（図のむらさき）は固有ベクトルではありません。
          例：A = (2 1；1 2)、v = (1；1) なら、A v = (3；3) = 3 v。固有値 3。
          対角より左下がすべて 0 の行列を《三角行列》といいました（M-004）。
