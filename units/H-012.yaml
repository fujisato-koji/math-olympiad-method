    text: "周期表の 原子 20 こを つかって、2 人が かわりばんこに ゲームを します（ひょうの 数は 電子の 数）。自分の 番には、のこって いる 原子を 1 つ えらんで とります。そのとき、えらんだ 原子より IE が 小さいと 言える 原子も、のこって いれば いっしょに とります。IE に ついて 言える ことは、つぎの 2 つの 決まりと、それを つなげた ことだけです。決まり ①：同じ 周期では、右の 原子ほど IE が 大きい。決まり ②：同じ 族では、上の 原子ほど IE が 大きい。つなげるとは、「A が B より 大きく、B が C より 大きいなら、A は C より 大きい」の ことで、もう とられた 原子を 通しても かまいません。ヘリウム（He）を とった 人が 負けです（のこりが He だけの ときは、その 番の 人は He を とるしか ないので 負けです）。先に とる 人が 必ず 勝てる ように する には、さいしょに えらぶ 原子は 1 つだけです。先に とる 人が それを とり、あいてが 2 回目に さんそ（O）を とった とき、先に とる 人が 3 回目に 必ず 勝てる ように する には、えらぶ 原子は 1 つだけです。1 回目と 3 回目に えらぶ 原子の、電子の 数を たすと いくつですか。"
