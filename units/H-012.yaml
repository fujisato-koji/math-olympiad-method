      - part: 見本
        text: いちばん外側の電子かくにある電子を、か電子といいます（赤い点）。ナトリウム（Na）はか電子が 1 こで 1 族、電子かくが 3 つで第 3 周期です。か電子の数は族の数の一の位と同じです。18 族のきガスは外側がいっぱいで安定しているので、赤い点があっても 0 こと数えます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="105" cy="100" r="37.3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="105" cy="100" r="58.7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="105" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="105" cy="100" r="16" fill="#f08080" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="105" y="105" font-size="13" text-anchor="middle" fill="currentColor">+11</text><circle cx="105" cy="62.7" r="5" fill="currentColor"/><circle cx="105" cy="137.3" r="5" fill="currentColor"/><circle cx="105" cy="41.3" r="5" fill="currentColor"/><circle cx="146.5" cy="58.5" r="5" fill="currentColor"/><circle cx="163.7" cy="100" r="5" fill="currentColor"/><circle cx="146.5" cy="141.5" r="5" fill="currentColor"/><circle cx="105" cy="158.7" r="5" fill="currentColor"/><circle cx="63.5" cy="141.5" r="5" fill="currentColor"/><circle cx="46.3" cy="100" r="5" fill="currentColor"/><circle cx="63.5" cy="58.5" r="5" fill="currentColor"/><circle cx="105" cy="20" r="5" fill="#f08080"/><text x="105" y="197" font-size="14" text-anchor="middle" fill="currentColor">Na</text><text x="258" y="66" font-size="14" text-anchor="middle" fill="currentColor">赤い点が</text><text x="258" y="88" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">か電子</text><text x="258" y="128" font-size="14" text-anchor="middle" fill="currentColor">電子かくは</text><text x="258" y="150" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">3 つ</text></svg>'
        explain: 原子がほかの原子と結びつくとき、働くのはいちばん外側の電子かくの電子です。これをか電子といいます。1、2 族のか電子は族の数と同じ、13〜17 族は族の数の一の位と同じです。きガス（He、Ne、Ar）は外側の電子かくがいっぱいで安定していて、結びつきにくいので、か電子は 0 こと数えます。電子かくの数は、周期の数と同じです。
