        text: 原子から電子を 1 こ取り去るのにいるエネルギーを、イオン化エネルギーといいます。大きいほど、電子を取り去りにくい原子です。電子を引きよせる強さは、電気いんせい度といいます。どちらも、同じ周期では右ほど大きく、同じ族では下ほど小さくなります。
