    text: "9 まいの カードに、原子の もけいが かいて あります（赤い 点が か電子）。この 9 この 原子を、イオン化エネルギー（IE）が 大きい 順に、左から 1 列に ならべます。IE について 分かって いる 決まりは、つぎの 2 つだけです。決まり ①：電子かくの 数が 同じ 2 つでは、か電子が 多い ほうが IE が 大きい。決まり ②：か電子の 数が 同じ 2 つでは、電子かくの 数が 少ない ほうが IE が 大きい。この 2 つに、「A が B より 大きく、B が C より 大きいなら、A は C より 大きい」を つなげて 言える ことは、ぜんぶ まもります。ほかの くらべ方は 分からないので、どちらが 先でも かまいません。ならべ方は、全部で 何通り ありますか。"
