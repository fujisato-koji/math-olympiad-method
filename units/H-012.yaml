    paths:
      - ["決まり ①② を つなげると、1 回で えらんだ 原子の 左と 下の 原子（左下の ぜんぶ）が いっしょに とられる", "1 回目に K（19）を とる。K は 左下に ほかの 原子が ない ので 1 こだけ とれる。のこりは He の ほかに 18 こ、電子の 数が 9 ちがう 組（1 と 10、3 と 12、4 と 13、5 と 14、6 と 15、7 と 16、8 と 17、9 と 18、11 と 20）に ちょうど 分かれる", "あいてが どの 原子を とっても、その 組の 相手を とり返すと、とられる 原子が 組ごとに なり、のこりは また 組に 分かれる。さいごに あいてが He だけ のこされ、負ける", "あいてが O（8）を とったら、3 回目は 組の 相手の Cl（17）。19 + 17 = 36"]
      - ["小さい 場合から：周期 2 と 周期 3 だけの 2 行（Ne を とると 負け）で 考える。左下の Na だけを とると、のこりは Li と Mg、Be と Al、B と Si、C と P、N と S、O と Cl、F と Ar の 7 組と、Ne になる", "あいてが 一方を とると、いっしょに とられる 原子は 組ごとに そろう ので、組の 相手を とり返せる。Ne だけが のこり、あいてが 負ける。これで 2 行の ゲームの 勝ち方が 『左下の 角を とって 組で 返す』と わかる", "H と Ca が ふえた 20 この 表でも、H と Ne、Na と Ca を 組に くわえ、左下の K を とれば 同じ 形に なる。K（19）と、O（8）の 組の 相手 Cl（17）で 36"]
    note: "借りた かたち：S17（ゲームの 戦い方：組に して とり返す）、S03（つりあい：電子の 数が 9 ちがう 組）、S16（後ろから 考える：He だけ のこる 形が 負け）、S14（2 行の 小さい 場合から）。種：なし（かたちの リストから 組み立てた。IE の 決まり ①② を つなげた 大小の 関係で、『えらんだ 原子の 左下を とる』ゲームに した）。むずかしい わけ：決まりを つなげると 『左下 ぜんぶ』に なる と 見ぬく 段、勝てる 1 手目が 角の K だけ（全部 ためして 確かめた）と 見つける 段、組の 相手が 電子の 数で 9 ちがう と 気づく 段の 3 段。勝てる 1 手目は 1 つだけで、あて ずっぽうでは 当たりにくい。L-004（取り合いゲーム）、L-010（後ろから 考える 必勝法）、H-011（電子の 数）と 組み合わせる。"
