      - part: わけ
        text: 2×2 の行列 A で det A = 0 のとき、A に逆行列がないわけを、A が平面の図形をどう移すか（M-002）から説明しましょう。
        explain: 「det A は、1 辺 1 の正方形の像（平行四辺形）の面積の倍率（M-002）。det A = 0 なら、像の面積が 0 で、平面全体が直線（または 1 点）につぶれる。すると、ちがう 2 点が同じ点に移る（例：(1 2；2 4) では (2, −1) も (0, 0) も (0, 0) に移る）。移った点から、もとの点を 1 つに決められないので、もとにもどす行列はない。」と書ければよい。① det は面積の倍率、② 0 なら直線につぶれて 2 点が重なる、③ もどす行列がない、の 3 つ。子どもには、(1 2；2 4) で (2, −1) と (0, 0) を移して確かめさせます。
        hints:
          - text: 左は det A ≠ 0、右は det A = 0 のときの、1 辺 1 の正方形（水色）の移り先（黄）です。
