        text: 3×3 の行列式を 1 行目で余因子展開すると、det A = a(ei − fh) − b(di − fg) + c(dh − eg) になるわけを説明しましょう。
        explain: 「1 行目の成分 a、b、c それぞれについて、その行と列を除いた 2×2 の行列式を、+、−、+ の印を付けてたす。a には (e f；h i) の行列式 ei − fh、b には (d f；g i) の行列式 di − fg、c には (d e；g h) の行列式 dh − eg が対応する。」と書ければよい。わけ：3 次の行列式は、各行・各列から 1 つずつ選んだ 6 つの積 aei + bfg + cdh − ceg − bdi − afh の和である。これを a、b、c でくくると a(ei − fh) − b(di − fg) + c(dh − eg) になる。① 行と列を除く、② 残りの 2×2 の行列式を取る、③ +、−、+ の印を付けてたす。子どもには、a、b、c の位置と印を確かめさせます。
