        text: 行基本変形は、どれも逆の変形でもとの形にもどせます。このことを使って、変形の前と後で連立方程式の解がまったく同じになるわけを説明しましょう。
        explain: 「変形の前の式を満たす x、y は、等式の性質から、変形の後の式も満たす。反対に、後の式に逆の変形をすると前の式にもどる（②−①×2 の逆は ②+①×2、c でわる逆は c をかける、入れかえの逆はもう一度入れかえ）ので、後の式を満たす x、y は前の式も満たす。両方の向きが言えるので、解の集まりは同じ。」と書ければよい。① 前 → 後、② 逆の変形で後 → 前、③ 解の集まりが同じ、の 3 つ。子どもには、具体例で、変形の前と後の解が同じになることを確かめさせます。
