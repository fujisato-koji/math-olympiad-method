 fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M258 11 Q266 40 258 69" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="242" y="32.8" font-size="16" text-anchor="middle" fill="currentColor">?</text><text x="242" y="58.8" font-size="16" text-anchor="middle" fill="currentColor">?</text></svg>'
