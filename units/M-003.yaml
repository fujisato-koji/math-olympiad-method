        text: 2×2 の行列 A に逆行列があることと、det A ≠ 0 であることが同値であるわけを説明しましょう。
        explain: 「A = (a b；c d) とする。ad − bc ≠ 0 なら、B = (1/(ad − bc))(d −b；−c a) を作れて、AB = BA = I になる（かけて確かめる）。反対に、逆行列 B があるなら、det A × det B = det(AB) = det I = 1（M-002）なので、det A ≠ 0。よって同値。」と書ければよい。① 公式の行列を作る、② det ≠ 0 ならかけて I になる、③ 逆行列があれば det の積が 1 になる、の 3 つ。「det = 0 だと公式で 0 でわることになる」だけでは、ほかの作り方がないことまでは言えていないので、③ が要ります。子どもには、公式に当てはめて AA⁻¹ = I を確かめさせます。
        hints:
