      - part: わけ
        id: "77709dcc92"
        text: rank A = rank [A|b] < 未知数の数 のとき、解が無限にあるわけを説明しましょう。
        explain: 「rank A = rank [A|b] なので、成り立たない行（0 … 0 | 0 でない数）は出ず、解は存在する。rank が未知数の数より小さいので、掃き出し法で 0 でない行が未知数の数より少なく、自由に動ける未知数が残る。その未知数に何を入れても、ほかの未知数が決まって解になる。よって解は無限にある。」と書ければよい。① 解の存在、② 自由な未知数が残る、③ 無限と結ぶ。子どもには、x+y=1 の 1 本の式で未知数 2 の例を確かめさせます。
