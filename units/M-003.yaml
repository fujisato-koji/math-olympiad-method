# M-003 行列の演算と連立一次方程式（掃き出し法、階数、逆行列）
#
# 段 6・水準 3・8 日。前提は M-002（平面の線形変換と行列式）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 行列の書き方は M-002 と同じ：(a b；c d)、列ベクトルは (x；y)。3 次は (a b c；d e f；g h i)。
# 3 次の行列式は余因子展開で導入する。逆行列は 2 次の公式と、3 次の掃き出し法。
# 掃き出し法の行基本変形は、入れかえ・0 でない数でわる・別の行の定数倍をたす、の 3 つ。
# 図とイラストの多い形に直した（D-131、直す係 3）。見本に積の行と列、掃き出しの流れ、2 直線の 3 通り、逆行列の往復と作り方、
#   余因子展開の消す行と列、解の数の決め方の流れの図を付け、答える問題は行列・拡大係数行列・直線の図を見て答える形にした。
#   ヒントの 1〜2 段に図を付けた（たすきがけ、行と列の組、1 回の変形と ? の成分、消す行と列）。答えの数は図に書かない。
#   同じ問題のくり返し（D-191）は、数を変えた新しい問題にした（その id: は消した）。

id: M-003
days:
  - day: 1
    items:
      - part: 見本
        id: "c46153e6a8"
        text: |-
          行列の積は、左の行列の「行」と右の行列の「列」を組にして、同じ番目どうしをかけてたします（図）。
          和は同じ位置の成分どうしをたし、スカラー倍はすべての成分に同じ数をかけ、転置は行と列を入れかえます。
          連立一次方程式 x + 2y = 5、3x − y = 1 は、(1 2；3 −1)(x；y) = (5；1) と書けます。
