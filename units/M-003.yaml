        id: "8612d1d569"
        text: 行基本変形（行を入れかえる、行を 0 でない数でわる、行に別の行の定数倍をたす）が、連立方程式の解を変えないわけを説明しましょう。
        explain: 「行を入れかえても、方程式の順番が変わるだけ。行を 0 でない数でわっても、両辺を同じ数でわっただけで、等式は成り立つ。行に別の行の定数倍をたしても、もとの等式を使って新しい等式を作るだけで、成り立つ解は変わらない。」と書ければよい。① 入れかえ、② 0 でない数でわる、③ 別の行の定数倍をたす、の 3 つを、等式の性質で確かめる。図の例：x + 2y = 6 と x − y = 0 の交点 P(2, 2) は、①−② の 3y = 6 も満たす。子どもには、1 つの式を変形しても、連立方程式の解は変わらないことを具体例で確かめさせます。
