        explain: |-
          余因子展開は、1 行目の a、b、c それぞれについて、その行と列を消して残る 2×2 の行列式をかけ、+、−、+ の印を付けてたします。
          det (2 1 0；0 1 3；1 0 1) = 2×(1·1 − 3·0) − 1×(0·1 − 3·1) + 0×(0·0 − 1·1) = 2 + 3 + 0 = 5。
