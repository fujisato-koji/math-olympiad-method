        text: |-
          3×3 の行列式は、1 行目の a、b、c それぞれについて、その行と列を消して残る 2×2 の行列式を使って求めます（余因子展開、図）。
          det (a b c；d e f；g h i) = a(ei − fh) − b(di − fg) + c(dh − eg)。まん中の b の前だけが − です。
