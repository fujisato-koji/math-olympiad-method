  - day: 2
    items:
      - part: 見本
        id: "eb7a219746"
        text: |-
          掃き出し法：係数と右辺を並べた表（拡大係数行列。点線の右が右辺）に行基本変形をくり返して、左側を (1 0；0 1) の形にします。
          行基本変形は 3 つ：行を入れかえる、行を 0 でない数でわる、行に別の行の何倍かをたす（ひく）。
          図は x + 2y = 5、2x + 3y = 8 の例です。左側が (1 0；0 1) になると、右の列から x = 1、y = 2 と読めます。
