# M-003 行列の演算と連立一次方程式（掃き出し法、階数、逆行列）
#
# 段 6・水準 3・8 日。前提は M-002（平面の線形変換と行列式）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 行列の書き方は M-002 と同じ：(a b；c d)、列ベクトルは (x；y)。3 次は (a b c；d e f；g h i)。
# 3 次の行列式は余因子展開で導入する。逆行列は 2 次の公式と、3 次の掃き出し法。
# 掃き出し法の行基本変形は、入れかえ・0 でない数でわる・別の行の定数倍をたす、の 3 つ。

id: M-003
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          行列の和・スカラー倍・積・転置をまとめ、連立一次方程式を行列で書きます。
          ・和：同じ形の行列どうし、成分ごとにたす。
          ・スカラー倍：すべての成分に同じ数をかける。
          ・積：A の行と B の列をかけ合わせてたす。(1 2；3 4)(5 6；7 8) = (19 22；43 50)。
          ・連立一次方程式 2x + 3y = 8、x − y = −1 は、(2 3；1 −1)(x；y) = (8；−1) と書ける。
        explain: |-
          和：(1 2；3 4) + (5 6；7 8) = (6 8；10 12)。
          スカラー倍：3(1 2；3 4) = (3 6；9 12)。
          積：(1 2；3 4)(5 6；7 8) の (1,1) 成分は 1×5 + 2×7 = 19、(1,2) 成分は 1×6 + 2×8 = 22、(2,1) 成分は 3×5 + 4×7 = 43、(2,2) 成分は 3×6 + 4×8 = 50。
          連立一次方程式は、係数を左の行列、未知数を列ベクトル、右辺を列ベクトルにして、Ax = b と書けます。
        note: 行列の積は、左の行と右の列をかけ合わせる。順序を変えると結果が変わる。
      - part: 思い出す
        text: (2 1；1 3) の行列式はいくつですか。
        choices: [3, 4, 5, 6]
        answer: 5
        check: "2 * 3 - 1 * 1"
        hints:
          - 2×2 の行列式は ad − bc です。
          - a = 2、b = 1、c = 1、d = 3 です。
          - 2 × 3 − 1 × 1 を計算しましょう。
        paths:
          - [ad − bc = 2×3 − 1×1, 6 − 1 = 5]
      - part: 思い出す
        text: (1 2；3 4)(1；1) はどれですか。
        choices: ["(3；7)", "(4；6)", "(7；3)", "(2；4)"]
        answer: "(3；7)"
        check: "f'({1 * 1 + 2 * 1}；{3 * 1 + 4 * 1})'"
        hints:
          - 行列と列ベクトルの積は、行と列をかけ合わせます。
          - 1 行目は 1×1 + 2×1 です。
          - 2 行目は 3×1 + 4×1 です。
        paths:
          - [1×1 + 2×1 = 3, 3×1 + 4×1 = 7, (3；7)]
      - part: 今日
        text: (1 2；3 4) + (5 6；7 8) はどれですか。
        choices: ["(6 8；10 12)", "(6 8；10 10)", "(5 8；10 12)", "(6 10；8 12)"]
        answer: "(6 8；10 12)"
        check: "f'({1 + 5} {2 + 6}；{3 + 7} {4 + 8})'"
        hints:
          - 行列の和は、同じ位置の成分どうしをたします。
          - 左上は 1 + 5、右上は 2 + 6 です。
          - 左下は 3 + 7、右下は 4 + 8 です。
        paths:
          - [1+5=6、2+6=8, 3+7=10、4+8=12, (6 8；10 12)]
      - part: 今日
        text: (1 2；3 4)(5 6；7 8) はどれですか。
        choices: ["(19 22；43 50)", "(23 34；31 46)", "(19 43；22 50)", "(5 12；21 32)"]
        answer: "(19 22；43 50)"
        check: "(lambda A, B: f'({A[0][0]*B[0][0]+A[0][1]*B[1][0]} {A[0][0]*B[0][1]+A[0][1]*B[1][1]}；{A[1][0]*B[0][0]+A[1][1]*B[1][0]} {A[1][0]*B[0][1]+A[1][1]*B[1][1]})')([[1, 2], [3, 4]], [[5, 6], [7, 8]])"
        hints:
          - 積の (1,1) 成分は、A の 1 行目と B の 1 列目をかけ合わせます。
          - (1,1) は 1×5 + 2×7 = 19 です。
          - (1,2) は 1×6 + 2×8、(2,1) は 3×5 + 4×7、(2,2) は 3×6 + 4×8 です。
        paths:
          - [1×5+2×7=19、1×6+2×8=22, 3×5+4×7=43、3×6+4×8=50, (19 22；43 50)]
        note: 行列の積は、左の行と右の列。かけ算の順序を変えると変わることが多い。
      - part: 挑戦
        text: 連立一次方程式 2x + 3y = 8、x − y = −1 を行列で書くと、どれですか。
        choices: ["(2 3；1 −1)(x；y) = (8；−1)", "(2 1；3 −1)(x；y) = (8；−1)", "(2 3；1 −1)(x；y) = (−1；8)", "(3 2；−1 1)(x；y) = (8；−1)"]
        answer: "(2 3；1 −1)(x；y) = (8；−1)"
        check: "f'(2 3；1 −1)(x；y) = (8；−1)'"
        hints:
          - 1 行目は 2x + 3y = 8 です。
          - 2 行目は x − y = −1 です。
          - 係数を左の行列、右辺を列ベクトルにしましょう。
        paths:
          - [係数は (2 3；1 −1), 未知数は (x；y), 右辺は (8；−1), (2 3；1 −1)(x；y) = (8；−1)]
    extra:
      - part: 今日
        text: 3(1 2；3 4) はどれですか。
        choices: ["(3 6；9 12)", "(3 2；3 4)", "(4 5；6 7)", "(3 6；9 4)"]
        answer: "(3 6；9 12)"
        check: "f'({3 * 1} {3 * 2}；{3 * 3} {3 * 4})'"
        hints:
          - スカラー倍は、すべての成分に同じ数をかけます。
          - 1、2、3、4 のそれぞれに 3 をかけましょう。
          - 3、6、9、12 になります。
        paths:
          - [3×1=3、3×2=6、3×3=9、3×4=12, (3 6；9 12)]
      - part: 今日
        text: (1 2；3 4) の転置はどれですか。
        choices: ["(1 3；2 4)", "(1 2；3 4)", "(4 3；2 1)", "(2 4；1 3)"]
        answer: "(1 3；2 4)"
        check: "f'({1} {3}；{2} {4})'"
        hints:
          - 転置は、行と列を入れかえます。
          - 1 行目の 1、2 は、1 列目になります。
          - 2 行目の 3、4 は、2 列目になります。
        paths:
          - [行と列を入れかえる, (1 3；2 4)]
      - part: わけ
        text: 行列の積 (1 2；3 4)(5 6；7 8) の (1,1) 成分が 1×5 + 2×7 になるわけを説明しましょう。
        explain: 「積の (1,1) 成分は、左の行列の 1 行目 (1, 2) と、右の行列の 1 列目 (5, 7) を、同じ順に掛けてたしたもの。1×5 + 2×7 = 19。」と書ければよい。① 左の 1 行目と右の 1 列目を取る、② 同じ位置どうしを掛ける、③ たす。子どもには、行と列の向きをそろえて指でなぞらせます。
        hints:
          - 左の 1 行目は (1, 2)、右の 1 列目は (5, 7) です。
          - 1×5 と 2×7 を計算しましょう。
          - 2 つをたすと 19 です。
        paths:
          - [左の 1 行目 (1,2)、右の 1 列目 (5,7), 1×5 + 2×7, 19]

  - day: 2
    items:
      - part: 見本
        text: |-
          掃き出し法：行基本変形（行を入れかえる、行を 0 でない数でわる、行に別の行の定数倍をたす）で、連立方程式を解きます。
          例：x + y + z = 6、x − y = 0、z = 2。
          行列にすると (1 1 1；1 −1 0；0 0 1)(x；y；z) = (6；0；2)。
          行基本変形で (1 0 0；0 1 0；0 0 1)(x；y；z) = (2；2；2) にすると、x = 2、y = 2、z = 2。
        explain: |-
          1 行目から 2 行目をひくと、2y + z = 6。z = 2 なので 2y = 4、y = 2。x = y なので x = 2。
          行基本変形は、方程式を同じ解のまま簡単にする操作です。最後に単位行列になれば、右辺がそのまま解になります。
        note: 掃き出し法は、方程式を「未知数が 1 つずつ分かる形」にしていく。行の入れかえ・定数倍・足し引きだけを使う。
      - part: 思い出す
        text: (1 2；1 3) の行列式はいくつですか。
        choices: [1, 2, 3, 5]
        answer: 1
        check: "1 * 3 - 2 * 1"
        hints:
          - 2×2 の行列式は ad − bc です。
          - 1×3 − 2×1 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1×3 − 2×1 = 1]
      - part: 思い出す
        text: (1 2；3 4)(1；1) はどれですか。
        choices: ["(3；7)", "(4；6)", "(7；3)", "(2；4)"]
        answer: "(3；7)"
        check: "f'({1 * 1 + 2 * 1}；{3 * 1 + 4 * 1})'"
        hints:
          - 行と列をかけ合わせます。
          - 1 行目は 1×1 + 2×1 です。
          - 2 行目は 3×1 + 4×1 です。
        paths:
          - [1+2=3、3+4=7, (3；7)]
      - part: 今日
        text: 連立一次方程式 x + y = 5、x − y = 1 の x はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 3
        check: "(5 + 1) // 2"
        hints:
          - 2 つの式をたすと、y が消えます。
          - 2x = 6 になります。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [(x+y)+(x−y)=5+1, 2x=6, x=3]
      - part: 今日
        text: 連立一次方程式 x + y + z = 6、x − y = 0、z = 2 の y はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 2
        check: "(6 - 2) // 2"
        hints:
          - x = y です。
          - x + y + z = 2y + 2 = 6 になります。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [x=y, 2y+2=6, 2y=4, y=2]
      - part: 挑戦
        text: 連立一次方程式 2x + y = 7、x − y = 2 の x はいくつですか。
        choices: [2, 3, 4, 5]
        answer: 3
        check: "(7 + 2) // 3"
        hints:
          - 2 つの式をたすと、y が消えます。
          - 3x = 9 になります。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [(2x+y)+(x−y)=7+2, 3x=9, x=3]
    extra:
      - part: 今日
        text: 連立一次方程式 x + y = 4、x − y = 2 の x はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 3
        check: "(4 + 2) // 2"
        hints:
          - 2 つの式をたすと、2x = 6 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - y = 1 になります。
        paths:
          - [2x=6, x=3]
      - part: 今日
        text: 連立一次方程式 x + y = 3、x − y = 1 の y はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 1
        check: "(3 - 1) // 2"
        hints:
          - 2 つの式をひくと、2y = 2 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - x = 2 になります。
        paths:
          - [2y=2, y=1]
      - part: わけ
        text: 行基本変形（行を入れかえる、行を 0 でない数でわる、行に別の行の定数倍をたす）が、連立方程式の解を変えないわけを説明しましょう。
        explain: 「行を入れかえても、方程式の順番が変わるだけ。行を 0 でない数でわっても、両辺を同じ数でわっただけで、等式は成り立つ。行に別の行の定数倍をたしても、もとの等式を使って新しい等式を作るだけで、成り立つ解は変わらない。」と書ければよい。① 入れかえ、② 0 でない数でわる、③ 別の行の定数倍をたす、の 3 つを、等式の性質で確かめる。子どもには、1 つの式を変形しても、連立方程式の解は変わらないことを具体例で確かめさせます。
        hints:
          - 行を入れかえても、方程式の順番が変わるだけです。
          - 行を 0 でない数でわっても、等式は成り立ちます。
          - 行に別の行の定数倍をたしても、解は変わりません。
        paths:
          - [入れかえは順番だけ, 0 でない数でわっても等式, 別の行の定数倍をたしても解は変わらない, 行基本変形は解を変えない]

  - day: 3
    items:
      - part: 見本
        text: |-
          行列の階数（rank）は、行基本変形で 0 でない行が何本残るかです。
          連立一次方程式 Ax = b について：
          ・rank A = rank [A|b] = 未知数の数 → 解はただ 1 つ。
          ・rank A = rank [A|b] < 未知数の数 → 解は無限にある。
          ・rank A < rank [A|b] → 解はない。
          例：(1 2；2 4)(x；y) = (1；2) は rank A = 1、rank [A|b] = 1、未知数 2 なので、解は無限。
        explain: |-
          階数は、行を基本変形して残る「独立な行」の数です。
          解の存在：rank A < rank [A|b] のとき、右辺が係数の行の組み合わせで書けないので、解がありません。
          解の一意性：rank A = rank [A|b] = 未知数の数なら、未知数がすべて決まります。未知数の数より rank が小さいと、自由に動ける未知数が残り、解が無限にあります。
        note: 階数は「独立な方程式の本数」。未知数の数と比べて、解の存在と一意性が分かる。
      - part: 思い出す
        text: 連立一次方程式 x + y = 5、x − y = 1 の x はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 3
        check: "(5 + 1) // 2"
        hints:
          - 2 つの式をたすと、2x = 6 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - y = 2 になります。
        paths:
          - [2x=6, x=3]
      - part: 思い出す
        text: (2 1；1 3) の行列式はいくつですか。
        choices: [3, 4, 5, 6]
        answer: 5
        check: "2 * 3 - 1 * 1"
        hints:
          - ad − bc を計算しましょう。
          - 2×3 − 1×1 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [2×3 − 1×1 = 5]
      - part: 今日
        text: (1 2；2 4) の階数はいくつですか。
        choices: [0, 1, 2]
        answer: 1
        check: "1 if 1 * 4 - 2 * 2 == 0 else 2"
        hints:
          - 2 行目は 1 行目の 2 倍です。
          - 行基本変形で 2 行目は 0 になります。
          - 0 でない行は 1 本です。
        paths:
          - [2 行目は 1 行目の 2 倍, 2 行目を 0 にできる, 残る行は 1 本, 階数は 1]
      - part: 今日
        text: (1 2；3 4) の階数はいくつですか。
        choices: [0, 1, 2]
        answer: 2
        check: "2 if 1 * 4 - 2 * 3 != 0 else 1"
        hints:
          - 2 行目は 1 行目の定数倍ですか。
          - 行列式は 1×4 − 2×3 = −2 で 0 でありません。
          - 2 本とも独立なので、階数は 2 です。
        paths:
          - [行列式が 0 でない, 2 本とも独立, 階数は 2]
      - part: 挑戦
        text: 連立一次方程式 x + y = 2、2x + 2y = 5 の解はどれですか。
        choices: [1 つ, なし, 無限]
        answer: なし
        check: "'なし' if 1 * 5 != 2 * 2 else '無限'"
        hints:
          - 2 行目は 1 行目の 2 倍に近いですが、右辺はどうですか。
          - 2×(x+y) = 4 ですが、2x+2y = 5 です。
          - 同じ左辺で右辺が違うので、解はありません。
        paths:
          - [1 行目を 2 倍すると 2x+2y=4, 2 行目は 2x+2y=5, 矛盾するので解なし]
    extra:
      - part: 今日
        text: (1 0；0 1) の階数はいくつですか。
        choices: [0, 1, 2]
        answer: 2
        check: "2 if 1 * 1 - 0 * 0 != 0 else 1"
        hints:
          - 2 本の行は独立です。
          - 単位行列の階数は 2 です。
          - 0 でない行は 2 本です。
        paths:
          - [2 本とも独立, 階数は 2]
      - part: 今日
        text: 連立一次方程式 x + y = 2、2x + 2y = 4 の解はどれですか。
        choices: [1 つ, なし, 無限]
        answer: 無限
        check: "'無限' if 1 * 4 == 2 * 2 else 'なし'"
        hints:
          - 2 行目は 1 行目の 2 倍です。
          - 2 つの式は同じことを言っています。
          - 未知数 2 に対して式は 1 本なので、解は無限です。
        paths:
          - [2 行目は 1 行目の 2 倍, 式は実質 1 本, 未知数 2 なので無限]
      - part: わけ
        text: 連立一次方程式 Ax = b で、rank A < rank [A|b] のとき解がないわけを説明しましょう。
        explain: 「rank A < rank [A|b] は、右辺 b が A の列の組み合わせで書けないということ。つまり Ax = b を満たす x が存在しない。よって解がない。」と書ければよい。① 階数の違いの意味、② 右辺が列の組み合わせで書けない、③ 解がないと結ぶ。子どもには、x+y=2、2x+2y=5 の例で、左辺の比と右辺の比が違うことを確かめさせます。
        hints:
          - rank A < rank [A|b] は、右辺が左辺の列の組み合わせで書けないことを意味します。
          - そのとき Ax = b を満たす x はありますか。
          - ないので、解なしです。
        paths:
          - [右辺が列の組み合わせで書けない, Ax=b を満たす x がない, 解なし]

  - day: 4
    items:
      - part: 見本
        text: |-
          逆行列 A⁻¹：AA⁻¹ = A⁻¹A = I となる行列。
          2×2 の A = (a b；c d) は、det A = ad − bc ≠ 0 のとき逆行列を持ち、
          A⁻¹ = (1/(ad−bc))(d −b；−c a)。
          例：(2 1；1 1) の det は 1、逆行列は (1 −1；−1 2)。
          det A = 0 のとき、逆行列はない。
        explain: |-
          2×2 の逆行列の公式：(a b；c d) の逆行列は、(1/(ad−bc))(d −b；−c a)。
          (2 1；1 1) は det = 2×1 − 1×1 = 1 なので、逆行列は (1 −1；−1 2)。
          確かめ：(2 1；1 1)(1 −1；−1 2) = (1 0；0 1)。
          det = 0 のときは、逆行列を作ろうとしても 0 でわることになるので、逆行列はありません。
        note: 逆行列は「行列のかけ算の《逆数》」。det が 0 かどうかが分かれ目。
      - part: 思い出す
        text: (1 2；1 3) の行列式はいくつですか。
        choices: [1, 2, 3, 5]
        answer: 1
        check: "1 * 3 - 2 * 1"
        hints:
          - ad − bc を計算しましょう。
          - 1×3 − 2×1 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1×3 − 2×1 = 1]
      - part: 思い出す
        text: 連立一次方程式 x + y = 5、x − y = 1 の x はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 3
        check: "(5 + 1) // 2"
        hints:
          - 2 つの式をたすと、2x = 6 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - y = 2 になります。
        paths:
          - [2x=6, x=3]
      - part: 今日
        text: (2 1；1 1) の逆行列はどれですか。
