e cx="240" cy="29" r="11.5" fill="#7bc96f" fill-opacity="0.8" stroke="currentColor" stroke-width="1.2"/><path d="M222 13 Q214 42 222 71" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 13 Q296 42 288 71" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="34.8" font-size="16" text-anchor="middle" fill="currentColor">8</text><text x="270" y="34.8" font-size="16" text-anchor="middle" fill="currentColor">11</text><text x="240" y="60.8" font-size="16" text-anchor="middle" fill="currentColor">6</text><text x="270" y="60.8" font-size="16" text-anchor="middle" fill="currentColor">15</text><text x="61" y="90" font-size="13" text-anchor="middle" fill="currentColor">1 行目</text><text x="145" y="90" font-size="13" text-anchor="middle" fill="currentColor">1 列目</text><text x="240" y="90" font-size="13" text-anchor="middle" fill="currentColor">1 行目・1 列目</text><rect x="80.7" y="111" width="42.6" height="24" rx="7" fill="#f08080" fill-opacity="0.55"/><text x="102" y="128" font-size="17" text-anchor="middle" fill="currentColor">1×4</text><text x="136" y="128" font-size="17" text-anchor="middle" fill="currentColor">+</text><rect x="148.7" y="111" width="42.6" height="24" rx="7" fill="#7bc96f" fill-opacity="0.55"/><text x="170" y="128" font-size="17" text-anchor="middle" fill="currentColor">2×2</text><text x="202" y="128" font-size="17" text-anchor="middle" fill="currentColor">=</text><rect x="216.9" y="111" width="22.2" height="24" rx="7" fill="#7bc96f" fill-opacity="0.55"/><text x="228" y="128" font-size="17" text-anchor="middle" fill="currentColor">8</text><text x="160" y="166" font-size="13" text-anchor="middle" fill="currentColor">左の 1 行目（黄）と右の 1 列目（水色）の、</text><text x="160" y="186" font-size="13" text-anchor="middle" fill="currentColor">同じ色の丸どうしをかけてたす</text></svg>'
        explain: |-
          積：(1 2；0 3)(4 1；2 5) の 1 行目・1 列目の成分は 1×4 + 2×2 = 8、1 行目・2 列目は 1×1 + 2×5 = 11、2 行目・1 列目は 0×4 + 3×2 = 6、2 行目・2 列目は 0×1 + 3×5 = 15。だから積は (8 11；6 15)。
          和：(1 2；0 3) + (4 1；2 5) = (5 3；2 8)。スカラー倍：2(1 2；0 3) = (2 4；0 6)。転置：(1 2；0 3) の転置は (1 0；2 3)。
          連立一次方程式は、係数を左の行列、未知数を列ベクトル、右辺を列ベクトルにして、Ax = b と書けます。(1 2；3 −1)(x；y) の上の成分は x + 2y、下の成分は 3x − y です。
        note: 行列の積は、左の行と右の列をかけ合わせる。順序を変えると結果が変わる。
