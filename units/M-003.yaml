      - part: 見本
        id: "3205467144"
        text: |-
          2 つの文字の連立方程式の解は、2 本の直線の交わる点です。直線の並び方で、解の数は 3 通りに分かれます（図）。
          掃き出し法のあとに、0 でない数がある行が何本残るかを、行列の階数（rank）といいます。
          係数の行列 A の階数と、右辺までふくめた [A|b] の階数をくらべると、解の数がわかります。
        svg: '<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="8" width="92" height="92" rx="8" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><line x1="18" y1="80" x2="98" y2="80" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round"/><line x1="32" y1="14" x2="32" y2="94" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round"/><line x1="20" y1="86" x2="96" y2="22" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="30" x2="96" y2="84" stroke="#f08080" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><circle cx="58" cy="55.6" r="5" fill="#7bc96f" fill-opacity="0.9" stroke="currentColor" stroke-width="1.2"/><text x="58" y="120" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">交わる</text><text x="58" y="140" font-size="14" text-anchor="middle" fill="currentColor">解は 1 つ</text><text x="58" y="164" font-size="12" text-anchor="middle" fill="currentColor">rank A = 2</text><text x="58" y="181" font-size="12" text-anchor="middle" fill="currentColor">rank [A|b] = 2</text><rect x="116" y="8" width="92" height="92" rx="8" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><line x1="122" y1="80" x2="202" y2="80" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round"/><line x1="136" y1="14" x2="136" y2="94" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round"/><line x1="124" y1="88" x2="200" y2="46" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><line x1="124" y1="62" x2="200" y2="20" stroke="#f08080" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><text x="162" y="120" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">平行</text><text x="162" y="140" font-size="14" text-anchor="middle" fill="currentColor">解はない</text><text x="162" y="164" font-size="12" text-anchor="middle" fill="currentColor">rank A = 1</text><text x="162" y="181" font-size="12" text-anchor="middle" fill="currentColor">rank [A|b] = 2</text><rect x="220" y="8" width="92" height="92" rx="8" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><line x1="226" y1="80" x2="306" y2="80" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round"/><line x1="240" y1="14" x2="240" y2="94" stroke="#c8ccd6" stroke-width="1.2" stroke-linecap="round"/><line x1="228" y1="84" x2="304" y2="26" stroke="#7fc8f8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/><line x1="228" y1="84" x2="304" y2="26" stroke="#f08080" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/><text x="266" y="120" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">重なる</text><text x="266" y="140" font-size="14" text-anchor="middle" fill="currentColor">解は無限</text><text x="266" y="164" font-size="12" text-anchor="middle" fill="currentColor">rank A = 1</text><text x="266" y="181" font-size="12" text-anchor="middle" fill="currentColor">rank [A|b] = 1</text></svg>'
        explain: |-
          2 つの文字の 1 次式は、座標平面の直線を表します。解は 2 本の直線の両方にのる点なので、交われば 1 つ、平行なら解なし、重なれば直線上の点すべて（無限）です。
          階数（rank）は、行基本変形のあとに残る、0 でない数がある行の本数です。rank A = rank [A|b] = 未知数の数 なら解はただ 1 つ、rank A = rank [A|b] < 未知数の数 なら解は無限、rank A < rank [A|b] なら解なし。
          例：(1 3；2 6)(x；y) = (2；4) は、2 行目が 1 行目の 2 倍なので rank A = 1、rank [A|b] = 1、未知数 2 で、解は無限（直線が重なる）。
        note: 階数は「独立な方程式の本数」。未知数の数と比べて、解の存在と一意性が分かる。
