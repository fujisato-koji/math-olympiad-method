        explain: |-
          ① 2 行目から 1 行目の 2 倍をひくと、2 行目は 0x − y = −2。② 2 行目を −1 でわると y = 2。③ 1 行目から 2 行目の 2 倍をひくと x = 1。
          行基本変形は、方程式を同じ解のまま簡単にする操作です。最後に左側が単位行列になれば、右の列がそのまま解になります。確かめ：1 + 2×2 = 5、2×1 + 3×2 = 8。
        note: 掃き出し法は、方程式を「未知数が 1 つずつ分かる形」にしていく。行の入れかえ・定数倍・足し引きだけを使う。
