      - part: わけ
        id: "c0b55495ea"
        text: 行列の積 (1 2；3 4)(5 6；7 8) の (1,1) 成分が 1×5 + 2×7 になるわけを説明しましょう。
        explain: 「積の (1,1) 成分は、左の行列の 1 行目 (1, 2) と、右の行列の 1 列目 (5, 7) を、同じ順にかけてたしたもの。1×5 + 2×7 = 19。」と書ければよい。わけ：積 AB の 1 列目は、A に B の 1 列目 (5；7) をかけた列ベクトル (1×5 + 2×7；3×5 + 4×7) と決めている（行列と列ベクトルの積、M-002）。だから (1,1) 成分は 1×5 + 2×7。① 右の 1 列目を列ベクトルと見る、② 左の 1 行目とかけ合わせる、③ たす。子どもには、行と列の向きをそろえて指でなぞらせます。
        hints:
