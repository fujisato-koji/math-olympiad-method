        id: "50f2671d2e"
        text: |-
          逆行列 A⁻¹ は、A で移した図形をもとにもどす行列です。AA⁻¹ = A⁻¹A = I（単位行列）となります。
          A = (a b；c d) は、det A = ad − bc が 0 でないとき逆行列を持ち、図のように作れます。
          例：(3 2；1 1) は det = 1 なので、逆行列は (1 −2；−1 3)。det A = 0 のときは、逆行列はありません。
        svg: '<svg viewBox="0 0 320 204" xmlns="http://www.w3.org/2000/svg"><polygon points="26,74 48,74 48,52 26,52" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><polygon points="128,80 158,65 173,50 143,65" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><polygon points="262,74 284,74 284,52 262,52" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="58" y1="50" x2="107" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="116,50 107,54.5 107,45.5" fill="currentColor"/><text x="87" y="40" font-size="13" text-anchor="middle" fill="currentColor">A をかける</text><line x1="184" y1="50" x2="241" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="250,50 241,54.5 241,45.5" fill="currentColor"/><text x="217" y="40" font-size="13" text-anchor="middle" fill="currentColor">A⁻¹ をかける</text><text x="37" y="96" font-size="12" text-anchor="middle" fill="currentColor">もと</text><text x="152" y="96" font-size="12" text-anchor="middle" fill="currentColor">移した形</text><text x="273" y="96" font-size="12" text-anchor="middle" fill="currentColor">もとにもどる</text><text x="21" y="156" font-size="15" text-anchor="end" fill="currentColor">A</text><circle cx="49" cy="137" r="11.5" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><circle cx="75" cy="163" r="11.5" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><circle cx="75" cy="137" r="11.5" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><circle cx="49" cy="163" r="11.5" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><path d="M33 121 Q25 150 33 179" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M91 121 Q99 150 91 179" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="49" y="142.8" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="75" y="142.8" font-size="16" text-anchor="middle" fill="currentColor">b</text><text x="49" y="168.8" font-size="16" text-anchor="middle" fill="currentColor">c</text><text x="75" y="168.8" font-size="16" text-anchor="middle" fill="currentColor">d</text><text x="110" y="156" font-size="15" text-anchor="start" fill="currentColor">A⁻¹ =</text><text x="180" y="144" font-size="15" text-anchor="middle" fill="currentColor">1</text><line x1="152" y1="150" x2="208" y2="150" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="180" y="168" font-size="14" text-anchor="middle" fill="currentColor">ad − bc</text><text x="220" y="156" font-size="16" text-anchor="middle" fill="currentColor">×</text><circle cx="256" cy="137" r="12" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><circle cx="284" cy="163" r="12" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><circle cx="284" cy="137" r="14" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><circle cx="256" cy="163" r="14" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.2"/><path d="M239 121 Q231 150 239 179" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M301 121 Q309 150 301 179" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="256" y="142.8" font-size="16" text-anchor="middle" fill="currentColor">d</text><text x="284" y="142.8" font-size="16" text-anchor="middle" fill="currentColor">−b</text><text x="256" y="168.8" font-size="16" text-anchor="middle" fill="currentColor">−c</text><text x="284" y="168.8" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="160" y="196" font-size="13" text-anchor="middle" fill="currentColor">黄の a と d を入れかえ、赤の b と c に − を付ける</text></svg>'
        explain: |-
          2×2 の逆行列の公式：(a b；c d) の逆行列は、(1/(ad − bc))(d −b；−c a)。a と d を入れかえ、b と c に − を付け、ad − bc でわります。
          (3 2；1 1) は det = 3×1 − 2×1 = 1 なので、逆行列は (1 −2；−1 3)。
          確かめ：(3 2；1 1)(1 −2；−1 3) = (3 − 2、−6 + 6；1 − 1、−2 + 3) = (1 0；0 1)。
          det = 0 のときは、平面が直線につぶれて（M-002）もとにもどせないので、逆行列はありません。
        note: 逆行列は「行列のかけ算の《逆数》」。det が 0 かどうかが分かれ目。
