      - part: わけ
        id: "931bb58030"
        text: 係数行列 A の行列式が 0 でないとき、連立一次方程式 Ax = b の解がただ 1 つであるわけを説明しましょう。
        explain: 「det A ≠ 0 なら A は逆行列を持つ。Ax = b の両辺に左から A⁻¹ をかけると x = A⁻¹b なので、解はこれのほかにない。x = A⁻¹b は A(A⁻¹b) = b で確かに解。よって解はただ 1 つ。」と書ければよい。① det A ≠ 0 から逆行列、② 両辺に左からかける、③ 解の一意性を結ぶ。子どもには、逆行列をかける順序を確かめさせます。
        hints:
          - text: 図の順に考えます。
            svg: '<svg viewBox="0 0 320 88" xmlns="http://www.w3.org/2000/svg"><rect x="4.6" y="10" width="90.2" height="36" rx="8" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="49.7" y="32.7" font-size="13" text-anchor="middle" fill="currentColor">det A ≠ 0</text><line x1="97.8" y1="28" x2="107.8" y2="28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="115.8,28 107.8,32 107.8,24" fill="currentColor"/><rect x="118.8" y="10" width="90.2" height="36" rx="8" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="163.9" y="32.7" font-size="13" text-anchor="middle" fill="currentColor">A⁻¹ がある</text><line x1="212" y1="28" x2="222" y2="28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="230,28 222,32 222,24" fill="currentColor"/><text x="221" y="64" font-size="12" text-anchor="middle" fill="currentColor">両辺に左から</text><rect x="233" y="10" width="82.4" height="36" rx="8" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="274.2" y="32.7" font-size="13" text-anchor="middle" fill="currentColor">x = A⁻¹b</text></svg>'
          - Ax = b の両辺に、左から A⁻¹ をかけましょう。
          - x = A⁻¹b が本当に解になっているかも、A(A⁻¹b) を計算して確かめましょう。
        paths:
          - [det A ≠ 0 で逆行列, Ax=b の両辺に左から A⁻¹, x=A⁻¹b, 解はただ 1 つ]
          - [det A ≠ 0 なら掃き出し法で単位行列にできる, "rank A = rank [A|b] = 未知数の数", 解はただ 1 つ]

