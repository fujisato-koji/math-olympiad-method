        text: 連立一次方程式 Ax = b で、A に逆行列があるとき、解が x = A⁻¹b とただ 1 つになるわけを説明しましょう。
        explain: 「Ax = b を満たす x があれば、両辺に左から A⁻¹ をかけて x = A⁻¹b。だから解は A⁻¹b のほかにない。反対に x = A⁻¹b を入れると A(A⁻¹b) = (AA⁻¹)b = b で、確かに解になる。よって解はただ 1 つ。」と書ければよい。① 両辺に A⁻¹ をかける、② A⁻¹A = I で x だけになる、③ 確かに解になることを確かめ、ただ 1 つと結ぶ。子どもには、A⁻¹ をかける順序（左から）を確かめさせます。
