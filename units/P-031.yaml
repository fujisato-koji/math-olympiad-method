  - day: 3
    items:
      - part: 見本
        text: |-
          球対称：半径 r の球面をガウス面にすると、E × 4πr² = Q/ε₀。E = kQ/r²。
          一様に帯電した球の内部では、囲む電荷が r³ に比例するので、E は r に比例します。
          円柱対称：単位長さあたりの電荷 λ なら、E × 2πrL = λL/ε₀。E = λ/(2πε₀r)。
          平面：一様な面電荷 σ なら、E = σ/(2ε₀)。向きは面に垂直です。
        explain: |-
          ・球の外では、点電荷と同じ E = kQ/r²。
          ・一様な球の内部では、E = kQr/R³（R は球の半径）。
          ・円柱では、電場は軸から放射状。
          ・無限に広い平面では、電場は面に垂直で、距離によらず一定。
          ｜形｜電場｜
          ｜球の外｜E = kQ/r²｜
          ｜一様な球の内部｜E = kQr/R³｜
          ｜円柱｜E = λ/(2πε₀r)｜
          ｜平面｜E = σ/(2ε₀)｜
        note: 球は E=kQ/r²、円柱は E=λ/(2πε₀r)、平面は E=σ/(2ε₀)。
      - part: 思い出す
        text: 点電荷 Q から距離 r の電場はどれですか。
        choices: ["E = kQ/r", "E = kQ/r²", "E = kQr", "E = kQ/r³"]
        answer: "E = kQ/r²"
        check: "'E = kQ/r²'"
        hints:
          - クーロンの法則から E = F/q です。
          - F = kQq/r² なので、E = kQ/r² です。
          - 分母は r² です。
        paths:
          - [F = kQq/r², E = F/q, E = kQ/r²]
      - part: 今日
