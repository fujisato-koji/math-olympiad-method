          - [半径 r の球面, Φ = E × 4πr², Q/ε₀, E = kQ/r²]
          - [ガウスの法則は中の電荷の和だけで決まる, 球の電荷を中心の 1 点に集めても Φ は同じ, 点電荷と同じ E = kQ/r²]
        explain: 「球の外に半径 r の球面をガウス面として選ぶ。対称性から電場は球面に直角で、大きさはどこでも同じ。Φ = E × 4πr²。ガウスの法則から Φ = Q/ε₀。よって E = Q/(4πε₀r²) = kQ/r²。」と書ければよい。① 球面を選ぶ、② Φ = E × 4πr²、③ Q/ε₀ と等しい。子どもには、球面の面積を確かめさせます。

  - day: 4
    items:
      - part: 見本
        id: "f169000924"
        text: |-
          導体の性質：
          ・中の電場は 0。
          ・余分な電荷は表面だけにある。
          ・表面のすぐ外の電場は面に直角で、E = σ/ε₀（σ は表面の 1 m² あたりの電荷）。
          ・導体は等電位（中も表面も同じ電位）。
