# P-031 ガウスの法則と導体
#
# 段 5・水準 3・8 日。前提は P-030（電荷と電場・電位）。
# 電気力線と電束、ガウスの法則、球・円柱・平面の電場、導体、鏡像法と一意性を扱う。
# ε₀ = 8.85 × 10⁻¹² C²/(N·m²)、k = 9 × 10⁹ N·m²/C² を使う。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-031
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          【定義】 電束（電場の流れ）Φ は、面を垂直に貫く電場の量です。Φ = E A cos θ。
          E が面に垂直なら Φ = E A。θ は面の法線と電場のなす角です。
          電気力線の本数は、電束に比例します。単位は N·m²/C。
        explain: |-
          面を貫く電場の成分だけが電束になります。斜めなら、垂直な成分 E cos θ を使います。
          例：E = 2 × 10⁵ N/C、A = 0.5 m²、垂直なら Φ = 10⁵ N·m²/C。
          面が電場に平行なら cos 90° = 0 で、電束は 0。
        note: Φ = E A cos θ。垂直なら Φ = EA。電気力線の本数に比例。
      - part: 思い出す
        text: 電場 E の中の電荷 q が受ける力 F はどれですか。
        choices: ["F = q/E", "F = qE", "F = E/q", "F = q + E"]
        answer: "F = qE"
        check: "'F = qE'"
        hints:
          - 電場は単位電荷あたりの力です。
          - q C なら q 倍です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [電場は単位電荷あたり, q 倍, F = qE]
      - part: 今日
        text: 電場 2 × 10⁵ N/C が面積 0.5 m² の面に垂直に貫くとき、電束はいくつですか。
        choices: [10000, 100000, 400000, 1000000]
        answer: 100000
        check: "f'{2e5 * 0.5:.0f}'"
        hints:
          - Φ = E A です。
          - 2 × 10⁵ × 0.5 を計算します。
          - 1 × 10⁵ N·m²/C です。
        paths:
          - [Φ = EA, 2e5 × 0.5 = 1e5]
      - part: 今日
        text: 電場 100 N/C が、法線と 60° をなす面積 2 m² の面を貫くとき、電束はいくつですか。
        choices: [50, 100, 173, 200]
        answer: 100
        check: "f'{100 * 2 * 0.5:.0f}'"
        hints:
          - Φ = E A cos θ です。
          - cos 60° = 1/2 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [Φ = EA cos θ, 100 × 2 × 1/2 = 100]
      - part: 挑戦
        text: 中に電荷がない閉じた面を貫く電束はいくつですか。
        choices: [0, "Q/ε₀", "EA", "無限大"]
        answer: 0
        check: "0"
        hints:
          - 入った電気力線は、必ずどこかから出ます。
          - 出る本数と入る本数が同じです。
          - 電束の和は 0 です。
        paths:
          - [入る本数 = 出る本数, 電束の和は 0]
    extra:
      - part: 今日
        text: 電場 300 N/C が面積 2 m² の面に垂直に貫くとき、電束はいくつですか。
        choices: [150, 300, 600, 900]
        answer: 600
        check: "300 * 2"
        hints:
