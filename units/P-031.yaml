  - day: 3
    items:
      - part: 見本
        id: "f906dc6521"
        text: |-
          球：球の外に半径 r の球面をガウス面にすると、E × 4πr² = Q/ε₀。E = kQ/r²（点電荷と同じ）。
          一様に帯電した球の中では、囲む電荷が r³ に比例するので、E は r に比例します。
          まっすぐな線（円柱対称）：1 m あたりの電荷 λ なら、半径 r・長さ L の円柱面で E × 2πrL = λL/ε₀。E = λ/(2πε₀r)。
          広い平面：1 m² あたりの電荷 σ なら、E = σ/(2ε₀)。向きは面に直角で、きょりによらず一定です。
