        explain: |-
          【定義】電束 Φ とは、面をつらぬく電気力線の本数のようなものです。面から出る向きを正、入る向きを負とします。
          【定義】ガウス面とは、電荷を包むように自分で選ぶ、想像上の閉じた面です。球でも、風船のような形でもかまいません。実際の物ではありません。
          ガウスの法則：閉じた面全体で電束を足すと、面の中の電荷の和を ε₀ でわった値になります。Φ = Q_(内)/ε₀。
          なぜ外の電荷が効かないか：外の電荷の電気力線は、面のどこかから入り、どこかから出ます。入る −1 と出る +1 が打ち消し合うので、和は 0 です。
          使い方：対称性のよい面を選ぶと、面の上で E の大きさが一定で、面に直角になります。そのとき Φ = E × 面積 なので、E = Q_(内)/(ε₀ × 面積) です。
          ｜記号｜意味｜
          ｜Φ｜面をつらぬく電束｜
          ｜Q_(内)｜閉じた面の内側にある電荷の和｜
          ｜ε₀｜真空の誘電率。8.85 × 10⁻¹² C²/(N·m²)｜
          ｜E｜電場の大きさ｜
          ｜A｜面の面積｜
          例：点電荷 Q を中心とする半径 r の球面を選びます。面積は A = 4πr²、E は面に直角で一定です。
          E × 4πr² = Q/ε₀ から、E = Q/(4πε₀r²) = kQ/r²。
          ｜記号｜意味｜
          ｜Q｜点電荷の電荷。この例では Q_(内) = Q｜
          ｜r｜球面の半径｜
          ｜k｜クーロンの定数。1/(4πε₀) = 9 × 10⁹ N·m²/C²｜

          ｜選ぶ面｜面積 A｜求まる電場｜
          ｜点電荷を包む球面｜4πr²｜E = Q/(4πε₀r²)｜
        note: Φ = Q_(内)/ε₀。外の電荷は入って出るので 0。球面なら E × 4πr² = Q/ε₀。
