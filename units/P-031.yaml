  - day: 7
    items:
      - part: 見本
        id: "6493858ea8"
        text: |-
          ガウスの法則・導体・電位は、1 つの問題で組み合わせられます。
          球の外：E = kQ/r²、V = kQ/r。導体の中：E = 0、電位は一定。
          広い平面：E = σ/(2ε₀)。
          《平行板コンデンサー》は、2 まいの平行な金属の板を向かい合わせたものです。図のように、板の間では 2 まいの電場が足されて E = σ/ε₀、外では打ち消し合って 0 です。電圧は V = E d。
          鏡像法：接地した平面との力は F = kq²/(4d²)。
