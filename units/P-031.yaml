        id: "a32aec64e6"
        text: 電束が Φ = E A cos θ になるわけを説明しましょう。
        hints:
          - 面をつらぬくのは、電場のうち、法線の向きの成分だけです。
          - text: E を、法線の向きと、それに直角な向き（面にそった向き）に分けます。法線の向きの成分（赤）は E cos θ です。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="150" x2="291" y2="150" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" stroke-opacity="0.6"/><polygon points="300,150 290,155 290,145" fill="currentColor" fill-opacity="0.6"/><text x="300" y="172" font-size="14" text-anchor="end" fill="currentColor">法線の向き</text><line x1="50" y1="150" x2="115.5" y2="36.6" stroke="#b39ddb" stroke-width="3" stroke-linecap="round"/><polygon points="120,28.8 119.3,39.9 110.7,34.9" fill="#b39ddb"/><line x1="120" y1="28.8" x2="120" y2="150" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M110 150 v-10 h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="50" y1="150" x2="111" y2="150" stroke="#f08080" stroke-width="4" stroke-linecap="round"/><polygon points="120,150 110,155 110,145" fill="#f08080"/><path d="M80 150 A30 30 0 0 0 65 124" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="86" y="138" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">θ</text><text x="80" y="78.8" font-size="16" text-anchor="end" fill="currentColor" font-weight="bold">E</text><text x="85" y="172" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">E cos θ</text><text x="310" y="24" font-size="13" text-anchor="end" fill="currentColor">赤：法線の向きの成分</text></svg>'
          - 面にそった成分は、面をつらぬきません。のこった成分に面積 A をかけましょう。
        paths:
          - [法線の成分 E cos θ, 面積 A をかける, Φ = EA cos θ]
          - [面を電場に直角な面に写すと、面積は A cos θ にちぢむ, それを E がまっすぐつらぬく, Φ = E × A cos θ]
        explain: 「面をつらぬくのは、電場のうち法線の向きの成分だけ。その成分は E cos θ。面積 A をかけると、つらぬく電束は E A cos θ。」と書ければよい。① 法線の成分、② E cos θ、③ 面積をかける。別の見方：かたむいた面を、電場に直角な面に写すと面積は A cos θ にちぢみ、そこを E がまっすぐつらぬく。子どもには、面をかたむけるとつらぬく本数がへる図（1 日目の見本）で確かめさせます。

