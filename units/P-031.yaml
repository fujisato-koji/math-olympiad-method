        paths:
          - [導体内部は電荷が動く, 電場を打ち消す, E = 0]
      - part: 挑戦
        text: 一様な面電荷 σ = 1 × 10⁻⁶ C/m² が作る電場は約何 × 10⁴ N/C ですか。ε₀ = 8.85 × 10⁻¹² とします。
        choices: [1.13, 5.65, 11.3, 56.5]
