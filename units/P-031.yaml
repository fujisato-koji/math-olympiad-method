          《ガウスの法則》：閉じた面から出る電束の和は、面の中の電荷の和を ε₀ でわったものです。Φ = Q/ε₀。
          ガウス面は、電荷を包むように自分で決める、想像上の閉じた面です（図の緑の点線）。
          図の左：中の +Q の力線は、みな面から出ます。図の右：外の電荷の力線は、面に入って（−）また出る（+）ので、足すと 0 です。
          球対称なら球面を選ぶと、E が一定で面に直角になり、E × 4πr² = Q/ε₀ から E を求められます。
