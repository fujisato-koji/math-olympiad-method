        explain: |-
          Q は球の電荷、r は中心（線）からのきょり、R は球の半径、k はクーロンの定数、λ は線の 1 m あたりの電荷、σ は面の 1 m² あたりの電荷、ε₀ は真空の誘電率です。
          ・球の外では、点電荷と同じ E = kQ/r²。
          ・一様な球の中では、E = kQr/R³。
          ・線では、電場は線から外向きにまっすぐ出て、円柱の側面に直角。
          ・広い平面では、電場は面に直角で、きょりによらず一定。
          ｜形｜電場｜
          ｜球の外｜E = kQ/r²｜
          ｜一様な球の中｜E = kQr/R³｜
          ｜線（円柱）｜E = λ/(2πε₀r)｜
          ｜平面｜E = σ/(2ε₀)｜
        note: 球は E=kQ/r²、円柱は E=λ/(2πε₀r)、平面は E=σ/(2ε₀)。
