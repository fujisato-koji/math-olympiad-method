# P-031 ガウスの法則と導体
#
# 段 5・水準 3・8 日。前提は P-030（電荷と電場・電位）。
# 電気力線と電束、ガウスの法則、球・円柱・平面の電場、導体の性質と接地、鏡像法と一意性を学ぶ。
# ε₀ = 8.85 × 10⁻¹² C²/(N·m²)（真空の誘電率）、k = 9 × 10⁹ N·m²/C² を使う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の決まり：+ の電荷は赤、− の電荷は青、点線の円は鏡像電荷（想像の電荷）。電気力線は線と三角。
#   緑の点線はガウス面（自分で決める閉じた面）。はい色は導体、黄は電場がつらぬく面や電荷のある平面、むらさきの矢印は 1 点の電場 E。
# 答えは子の画面に出さない（保護者の表示だけ）。用語の説明は《用語》で明示する（D-063）。

id: P-031
days:
  - day: 1
    items:
      - part: 見本
        id: "70d6569247"
        text: |-
          【定義】電束 Φ は、面をつらぬく電気力線の本数のような量です。単位は N·m²/C。
          電場 E が面に直角につらぬくと Φ = E A（A は面の面積）。
          面をかたむけると、つらぬく本数がへります：Φ = E A cos θ。θ は、法線（面に直角な線。図のむらさきの点線）と電場の間の角です。
