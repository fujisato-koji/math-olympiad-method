          - 境界の条件を満たす解は、1 つだけです。
        paths:
          - [境界条件 V=0, 鏡像解が満たす, 一意性, 本当の解]
          - [平面上の点 P で kq/r + k(−q)/r = 0, q の側の電荷も同じ, 一意性定理で本当の解と同じ]
        explain: 「接地した導体の平面では、電位が 0 という境界条件がある。鏡像電荷 −q を置いた 2 電荷の解は、平面全体で電位 0 を満たす。一意性定理から、境界条件を満たす解は 1 つだけなので、この解が本当の解。」と書ければよい。① 境界条件、② 鏡像の解が満たす、③ 一意性。子どもには、平面上の電位を確かめさせます。

