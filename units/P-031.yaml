  - day: 5
    items:
      - part: 見本
        id: "8b04c57132"
        text: |-
          一意性定理：電荷のならびと、まわりの境界の電位を決めると、その間の電場・電位はただ 1 つに決まります。
          鏡像法：接地した導体の平面からきょり d に点電荷 q があるとき、平面の向こう側のきょり d に −q の鏡像電荷（想像の電荷。図の点線の円）を置いたのと同じ電場・電位になります（q の側で）。
          平面の上では、q と −q の電位が打ち消し合って 0 になります。
