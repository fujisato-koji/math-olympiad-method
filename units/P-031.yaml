        explain: |-
          面をつらぬくのは、電場のうち法線の向きの成分 E cos θ だけです。
          図の 3 まいは、同じ面を θ = 0°、60°、90° とかたむけたものです。つらぬく力線は 8 本、4 本、0 本で、cos 0° = 1、cos 60° = 1/2、cos 90° = 0 と同じ比でへります。
          例：E = 2 × 10⁵ N/C、A = 0.5 m²、直角なら Φ = 1 × 10⁵ N·m²/C。
        note: Φ = E A cos θ。直角なら Φ = EA。電気力線の本数に比例。
