      - 向かい合う 2 つの面を 1 組とすると、上下・前後・左右の 3 組あるね。組がちがう面どうしは、いつもとなり合うよ。
      - どの組も 1 色でぬるときと、1 組だけ 2 色でぬるときに分けよう。2 組を 2 色でぬることはできるかな。
    paths:
