  - part: 離
    kinds: [道筋]
    text: ドーナツの形を 5 つに分けました。まん中の円はあなで、ぬりません。となり合うのは、アとイ、イとウ、ウとエ、エとオ、オとアです。赤、青、黄の 3 色でぬります。となり合う部分はちがう色にします。同じ色を何回使ってもかまいません。ぬり方は何通りですか。
