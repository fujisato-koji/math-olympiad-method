    text: 3 × 3 の 9 マスを、赤、青、黄の 3 色でぬります。へんでつながっているマスどうしは、ちがう色にします（点だけでふれ合うマスは、同じ色でもかまいません）。同じ色を何回使ってもかまいません。ぬり方は何通りありますか。
    answer: 246
    check: sum(1 for c in itertools.product(range(3), repeat=9) if all(c[i] != c[i + 1] for i in range(9) if i % 3 < 2) and all(c[i] != c[i + 3] for i in range(6)))
    hints:
    - 9 マスのうち、いちばん多くのマスとつながっているのはどこかな。そこから先に決めよう。
    - 中央のまわりの、十字の 4 マスは、中央とちがう色になるね。何色からえらべるかな。
    - 十字の 2 マスが同じ色か、ちがう色かで分けてみよう。
    paths:
    - - 中央のマスは、まわりの十字の 4 マスぜんぶとつながっているので、先に決める。色は 3 通り
      - 十字の 4 マスは、中央とちがう 2 色のどちらかになる。この 2 色を ア、イ とよぶ。十字の 4 マスを、上、右、下、左とぐるりとならべて見ると、どのマスも ア か イ で、2 × 2 × 2 × 2 = 16 通り
      - 四すみのマスは、となり合う十字の 2 マス（上と右、右と下、下と左、左と上の 4 組）の両方とちがう色にする。その 2 マスが同じ色（ア と ア、または イ と イ）なら、四すみには中央と同じ色ともう 1 色の 2 通りがある。その 2 マスがちがう色（ア と イ）なら、のこる色は中央と同じ色の 1 通りだけ
      - 十字の 16 通りを、同じ色がとなり合う組の数で分ける。4 マスが全部同じ色（2 通り）は、4 組とも同じなので、四すみは 2 × 2 × 2 × 2 = 16 通りずつで 2 × 16 = 32。1 マスだけちがう色（8 通り）は、2 組が同じなので、四すみは 2 × 2 × 1 × 1 = 4 通りずつで 8 × 4 = 32。となり合う 2 マスずつ同じ色（4 通り）も 2 組が同じなので、4 × 4 = 16。かわるがわるの色（2 通り）は、同じ組がなく 1 通りずつで 2。合わせて 32 + 32 + 16 + 2 = 82 通り
      - 中央の色が 3 通りで、どれも 82 通りなので、82 × 3 = 82 + 82 + 82 = 246 通り
    - - 中央と四すみの 4 マスは、どれもへんでつながっていない（ふれ合うのは点だけ）ので、この 5 マスの色を先に決められる。十字の 4 マスは、中央と、となり合う四すみの 2 マスの、あわせて 3 マスとちがう色にする。だから十字のマスの色は、3 から「その 3 マスにある色の数」をひいた数だけえらべる
      - 中央の色を決める（3 通り）。この色を「中央色」とよび、四すみのうち中央色のマスの数で分ける。4 つとも中央色なら、十字のどのマスも 3 − 1 = 2 色えらべて、2 × 2 × 2 × 2 = 16 通り。3 つが中央色なら、のこる 1 つの四すみの場所が 4 通り、その色が 2 通りで 8 通り。その四すみのとなりの十字 2 マスは 1 色ずつ、ほかの 2 マスは 2 色ずつなので、1 × 1 × 2 × 2 = 4 通りずつで 8 × 4 = 32
      - 2 つが中央色で、となり合うとき（場所は 4 通り）：中央色でない 2 つの四すみが同じ色（2 通り）なら、その間の十字のマスは 1 色、ちがう色ならぬる色がない。同じ色のとき、中央色の 2 つの間のマスが 2 色、のこる 3 マスは 1 色ずつで 2 通り。だから 1 つの場所で 2 × 2 = 4 通り、4 つの場所で 16 通り。2 つが中央色で、向かい合うとき（場所は 2 通り）：中央色でない 2 つの四すみは 2 色のどちらでもよく 2 × 2 = 4 通り、十字のマスは全部 1 色ずつなので、2 × 4 = 8 通り
      - 中央色が 1 つ（場所は 4 通り）：ほかの 3 つの四すみが全部同じ色（2 通り）でないと、間の十字のマスにぬる色がない。そのとき十字のマスは全部 1 色ずつなので、4 × 2 = 8 通り。中央色が 0 こ：4 つの四すみが全部同じ色（2 通り）で、十字のマスは全部 1 色ずつなので 2 通り
      - ここまでを合わせて、16 + 32 + 16 + 8 + 8 + 2 = 82 通り。中央の色が 3 通りなので、82 × 3 = 82 + 82 + 82 = 246 通り
    note: 考えどころは 3 つ：①多くのマスとつながる所から先に決める（1 本目は中央、2 本目はつながり合わない中央と四すみ）、②十字の 4 マスの色を限る（1 本目は「中央とちがう 2 色」、2 本目は「3 から、まわりの 3 マスにある色の数をひいた数」）、③場合に分けて、もれも重なりもなく数える（1 本目は同じ色がとなり合う組の数、2 本目は中央色の四すみの数）。2 本目は 1 本目と逆に、四すみを先に決めて十字を後から決める。答えの 246 は 100 をこえるので、頭注に例外の 1 行を足し、uses に N-009 を挙げた。check は、9 マスの色を itertools.product で 3 の 9 乗（19,683）通り全部作り、へんでつながる 12 組（よこ 6、たて 6）が全部ちがう色のものを数える（246）。この単元の既出は、ドーナツの形（30）、立方体（96）、2 × 3 の花だん（16）で、どれも先に決める所が見つかると、あとは色の数が 1 通りに決まる。この問題は、十字のマスが中央と四すみの両方に、四すみが十字の 2 マスにつながり、順にぬっても色の数が決まらないので、場合に分けて数える。3 × 3 の 9 マスを 3 色でぬる数 246 は、数え上げの本で知られた数。
