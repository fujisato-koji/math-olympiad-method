  - part: 離
    kinds: [読み取り]
    text: 花だんが 6 つあり、北がわに西からア、イ、ウ、南がわに西からエ、オ、カとならんでいます。アとエ、イとオ、ウとカは南北にとなり合い、アとイ、イとウ、エとオ、オとカは東西にとなり合っています。それぞれの花だんに、赤、白、黄のどれか 1 色の花を植えます。となり合う花だんはちがう色にします。イには白い花を植えます。また、3 色とも少なくとも 1 つの花だんに植えます。植え方は何通りですか。
    answer: 16
    check: "sum(1 for p in itertools.product('赤白黄', repeat=6) if all(p[a] != p[b] for a, b in ((0, 1), (1, 2), (3, 4), (4, 5), (0, 3), (1, 4), (2, 5))) and p[1] == '白' and len(set(p)) == 3)"
    hints:
      - 文を読んで、6 つの花だんのならび方と、となり合い方の図をかこう。
      - イが白なので、イととなり合うア、ウ、オの色は赤か黄だね。エとカはどうかな。
      - 3 色を使わないぬり方もいったん数えてから、あとでのぞこう。
    paths:
      - [イが白なので、ア、ウ、オは赤か黄,オが赤のとき、アが赤ならエは白か黄の 2 通り、アが黄ならエは白の 1 通りで、アとエの組は 3 通り, ウとカの組も 3 通りで、オが赤のときは 3 × 3 = 9 通り, オが黄のときも 9 通りで、合わせて 18 通り, 赤と白だけ、黄と白だけの植え方が 1 通りずつあるのでのぞいて 16 通り]
    note: 長い文から、花だんのならび方ととなり合い方を図にする。イが白と決まっているので、まわりのア、ウ、オは赤か黄。2 色だけで植える植え方（白と赤だけ、白と黄だけ）をのぞくのを忘れて 18 にしやすい。
