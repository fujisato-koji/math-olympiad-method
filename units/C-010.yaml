      </svg>
    answer: 30
    check: "sum(1 for p in itertools.product(range(3), repeat=5) if all(p[i] != p[(i + 1) % 5] for i in range(5)))"
    hints:
      - アからじゅんにぬっていくと、さいごのオでこまるね。オにぬれる色の数は、何で決まるかな。
      - アとエが同じ色のときと、ちがう色のときに分けよう。
      - アからエまでを 1 列とみて、アとエが同じ色になるぬり方が何通りあるか数えよう。
    paths:
