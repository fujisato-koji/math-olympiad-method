# C-010 塗り分け
#
# 書き方は N-001 の頭の注、文の漢字は C-006 の頭の注のとおり（小 3 までの漢字。塗、選、順、最、残、求、旗、印 などはかなで書く）。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 1 列にならんだ部分をぬる（となりだけちがう色）、2 日目 どれもとなり合う部分（順列と同じ）、まん中がほかの全部ととなり合う部分
#   （多くとなり合う所から先にぬる）、ドーナツの形（輪）は挑戦だけ、3 日目 わけ（なぜ 1 つへるだけか、なぜ先にぬる所を選ぶか、なぜ 3 色ではぬれないか）、
#   4 日目 C-006（全部ちがう色＝順列）・C-005（積の法則）と混ぜる、5 日目 確認。
# 前提は C-006 まで。数は 100 まで。2 けた × 1 けたは C-006 と同じく、たし算で出す（12 × 3 = 12 + 12 + 12）。
# 輪のようにぐるりとつながる部分は、はしの 2 つの色が同じかちがうかで分けて数える（場合分け。挑戦と確認の 1 問だけ）。
# 部分の図は svg で描き、部分の名前を ア、イ、ウ… で書く。どの図も、点だけで接する所ができないように描いた（となり合うのは線で接する所だけ）。
#   ドーナツの形は、まん中の円をあなにした図（ぬらない）と、まん中の円もぬる図の 2 つ。
# 「同じ色を何回使ってもかまいません」を毎回書く（となり合わない部分は同じ色でよい）。
# check は、部分ごとの色を itertools.product で全部作り、となり合う部分の組の色がちがうものを数える。

id: C-010
days:
  - day: 1
    items:
      - part: 思い出す
        text: ア、イ、ウ、エの 4 人の中から、1 番目に走る人と 2 番目に走る人を決めます。決め方は何通りですか。
        answer: 12
        check: "len(set(itertools.permutations('アイウエ', 2)))"
        hints:
          - 1 番目は何通りかな。
          - 2 番目は、のこりの何人から決めるかな。
          - 2 つの通りをかけ算にしよう。
        paths:
          - [1 番目 4 通り, 2 番目 3 通り, 4 × 3 = 12 通り]
      - part: 思い出す
        text: ○、△、× のしるしを 3 こならべて、合図をつくります。同じしるしを何回使ってもかまいません。合図は何通りつくれますか。
        answer: 27
        check: "len(set(itertools.product('○△×', repeat=3)))"
        hints:
          - 1 つ目のしるしは何通りかな。
          - 2 つ目、3 つ目にも、同じしるしを使えるね。
          - じゅんにかけていこう。
        paths:
          - [1 つ目 3 通り, 2 つ目まで 3 × 3 = 9 通り, 3 つ目まで 9 × 3 = 27 通り]
      - part: 見本
        text: ア、イ、ウの 3 つの部分を、赤、青、黄の 3 色でぬります。となり合う部分はちがう色にします。同じ色を何回使ってもかまいません。ぬり方は何通りですか。
        svg: |
          <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="40" width="60" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
            <rect x="90" y="40" width="60" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
            <rect x="150" y="40" width="60" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
            <text x="60" y="76" font-size="16" text-anchor="middle">ア</text>
            <text x="120" y="76" font-size="16" text-anchor="middle">イ</text>
            <text x="180" y="76" font-size="16" text-anchor="middle">ウ</text>
          </svg>
        explain: アからじゅんにぬります。アは 3 色のどれでもよいので 3 通りです。イはアととなり合うので、アの色をのぞいた 2 通りです。ウはイととなり合いますが、アとはとなり合わないので、イの色だけをのぞいた 2 通りです（アと同じ色でもかまいません）。3 × 2 = 6、6 × 2 = 12 通りです。どのぬり方でも、のぞく色の数が同じなので、積（せき）の法則（ほうそく）が使えます。
      - part: 今日
        text: ア、イ、ウ、エの 4 つの部分を、赤、青、黄の 3 色でぬります。となり合う部分はちがう色にします。同じ色を何回使ってもかまいません。ぬり方は何通りですか。
        svg: |
          <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="40" width="50" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
            <rect x="70" y="40" width="50" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
            <rect x="120" y="40" width="50" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
            <rect x="170" y="40" width="50" height="60" stroke="currentColor" fill="none" stroke-width="2"/>
