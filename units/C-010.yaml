    note: 輪のぬり分け（4 つの輪は 2 日目と 4 日目の挑戦）を 5 つにふやす。5 つの輪では、はしの 2 つ（アとエ）が同じ色かどうかを数えるところで、もう一度ウの色を考える必要がある。3 × 2 × 2 × 2 × 1 = 24 や 3 × 2 × 2 × 2 × 2 = 48 のように 1 つの式にしてしまいやすい。
