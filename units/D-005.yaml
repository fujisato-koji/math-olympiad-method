          - 分母が 0 になる x = 1 は、もとの関数に入りません。だから、y′ = 0 は分子だけを見ればよいのです。
        paths:
          - [y′ = (2x(x − 1) − (x² + 8))/(x − 1)² = (x² − 2x − 8)/(x − 1)², x² − 2x − 8 = (x − 4)(x + 2) = 0, 正のほうは x = 4]
          - [わり算で y = x + 1 + 9/(x − 1) と書きかえる, y′ = 1 − 9/(x − 1)² = 0 より (x − 1)² = 9, x − 1 = ±3 で正のほうは x = 4]
        note: 分母 (x − 1)² は 0 にならない（x = 1 では関数が決まらない）ので、分子だけを 0 とおけばよい。もう 1 本の接点は x = −2。
