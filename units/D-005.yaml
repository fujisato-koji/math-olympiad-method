      - part: 思い出す
        text: 加法定理で sin(x + h) を表したものは、どれですか。
        choices: [sin x cos h + cos x sin h, sin x cos h − cos x sin h, cos x cos h − sin x sin h, sin x + sin h]
        answer: sin x cos h + cos x sin h
        check: "[c for c, g in {'sin x cos h + cos x sin h': lambda x, h: math.sin(x) * math.cos(h) + math.cos(x) * math.sin(h), 'sin x cos h − cos x sin h': lambda x, h: math.sin(x) * math.cos(h) - math.cos(x) * math.sin(h), 'cos x cos h − sin x sin h': lambda x, h: math.cos(x) * math.cos(h) - math.sin(x) * math.sin(h), 'sin x + sin h': lambda x, h: math.sin(x) + math.sin(h)}.items() if all(abs(g(x, h) - math.sin(x + h)) < 1e-9 for x, h in ((0.7, 0.4), (1.9, -0.6)))][0]"
        hints:
