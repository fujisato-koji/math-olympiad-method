        text: 加法定理を使って sin(π/4 + π/6) を求めると、どれになりますか。
        choices: [(√6 + √2)/4, (√6 − √2)/4, (√3 + 1)/2, (√2 + 1)/2]
        answer: (√6 + √2)/4
        check: "[c for c, v in {'(√6 + √2)/4': (math.sqrt(6) + math.sqrt(2)) / 4, '(√6 − √2)/4': (math.sqrt(6) - math.sqrt(2)) / 4, '(√3 + 1)/2': (math.sqrt(3) + 1) / 2, '(√2 + 1)/2': (math.sqrt(2) + 1) / 2}.items() if abs(v - math.sin(math.pi / 4 + math.pi / 6)) < 1e-9][0]"
        hints:
          - sin(α + β) = sin α cos β + cos α sin β です。
          - text: 図の 2 つの三角形（三角じょうぎの形）の辺の長さから、sin と cos の値を読みましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="20,170 130,170 130,60" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="120" y="160" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1"/><text x="75" y="190" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="138" y="120" font-size="14" text-anchor="start" fill="currentColor">1</text><text x="66" y="106" font-size="14" text-anchor="end" fill="currentColor">√2</text><text x="44" y="164" font-size="12" text-anchor="start" fill="currentColor">π/4</text><polygon points="170,170 300,170 300,95" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="290" y="160" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1"/><text x="235" y="190" font-size="14" text-anchor="middle" fill="currentColor">√3</text><text x="306" y="136" font-size="14" text-anchor="start" fill="currentColor">1</text><text x="228" y="122" font-size="14" text-anchor="end" fill="currentColor">2</text><text x="194" y="164" font-size="12" text-anchor="start" fill="currentColor">π/6</text><text x="294" y="120" font-size="12" text-anchor="end" fill="currentColor">π/3</text></svg>'
