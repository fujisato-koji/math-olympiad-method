        explain: D-004 では、導関数を定義 f′(x) = lim (h→0) (f(x + h) − f(x))/h から求め、(x²)′ = 2x、(x³)′ = 3x² となりました。いっぱんに、n が正の《整数》のとき (xⁿ)′ = nxⁿ⁻¹ です（(x + h)ⁿ − xⁿ = h{(x + h)ⁿ⁻¹ + (x + h)ⁿ⁻²x + … + xⁿ⁻¹} を h でわって h → 0 とすると、かっこの中の n 個のこうがどれも xⁿ⁻¹ に近づきます）。また、定数 c の導関数は (c)′ = 0、k を定数として {kf(x)}′ = kf′(x)、{f(x) + g(x)}′ = f′(x) + g′(x)、{f(x) − g(x)}′ = f′(x) − g′(x) です（極限の性質（D-003）から出ます）。これらを使うと、f′(x) = 2 × 3x² − 5 × 2x + 4 = 6x² − 10x + 4 です。x = 2 での微分係数は f′(2) = 24 − 20 + 4 = 8 で、これは点 (2, f(2)) での接線のかたむきです。f(2) = 16 − 20 + 8 − 1 = 3 なので、接線は y = 8(x − 2) + 3、つまり y = 8x − 13 です（D-004 の接線の式）。これからは、たこうしきの導関数を定義にもどらずに求めます。
      - part: 思い出す
        id: "a74a3ccd2a"
        text: 関数 f(x) = x² + 3x の x = 1 における微分係数を、定義 f′(1) = lim (h→0) (f(1 + h) − f(1))/h で求めましょう。f′(1) はいくつですか。
        answer: 5
        check: "Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: x * x + 3 * x, 1)).limit_denominator(100)"
        hints:
          - f(1 + h) = (1 + h)² + 3(1 + h) のかっこを外して、整理しましょう。
