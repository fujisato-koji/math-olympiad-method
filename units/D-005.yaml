  - day: 2
    items:
      - part: 見本
        id: "6dcb0fd7c4"
        text: 積の微分は {f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x) です。図の長方形のたて f と横 g が少しずつのびると、ふえる面積はほぼ緑と青の 2 つの細長い長方形になります。商の微分は {f(x)/g(x)}′ = (f′(x)g(x) − f(x)g′(x))/{g(x)}² です（分子の順に注意）。
        svg: '<svg viewBox="0 0 320 258" xmlns="http://www.w3.org/2000/svg"><text x="160" y="24" font-size="16" text-anchor="middle" fill="currentColor">(fg)′ = f′g + fg′</text><rect x="50" y="46" width="196" height="30" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="148" y="66" font-size="13" text-anchor="middle" fill="currentColor">f′g の分</text><rect x="50" y="76" width="160" height="130" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="130" y="146" font-size="16" text-anchor="middle" fill="currentColor">f × g</text><rect x="210" y="76" width="36" height="130" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><rect x="210" y="46" width="36" height="30" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/><text x="252" y="146" font-size="13" text-anchor="start" fill="currentColor">fg′ の分</text><text x="252" y="66" font-size="12" text-anchor="start" fill="currentColor">ごく小さい</text><text x="40" y="146" font-size="16" text-anchor="end" fill="currentColor" font-style="italic">f</text><text x="130" y="226" font-size="16" text-anchor="middle" fill="currentColor" font-style="italic">g</text><text x="228" y="224" font-size="12" text-anchor="middle" fill="currentColor">のび</text><text x="40" y="66" font-size="12" text-anchor="end" fill="currentColor">のび</text><text x="160" y="248" font-size="14" text-anchor="middle" fill="currentColor">ふえる面積 ≒ 緑 + 青</text></svg>'
        explain: 2 つの関数 f(x)、g(x) が微分可能なとき、積と商の導関数は次のようになります（積の微分のわけは 6 日目）。積の微分 {f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x)。商の微分 {f(x)/g(x)}′ = (f′(x)g(x) − f(x)g′(x))/{g(x)}²。とくに {1/g(x)}′ = −g′(x)/{g(x)}² です。y = (x² + 1)(3x − 2) は、f(x) = x² + 1、g(x) = 3x − 2 とみて、y′ = 2x(3x − 2) + (x² + 1) × 3 = 9x² − 4x + 3 です（かっこを外してから微分しても同じになります）。y = (2x + 1)/(x − 1) は、y′ = (2(x − 1) − (2x + 1) × 1)/(x − 1)² = −3/(x − 1)² です。分子の順（f′g − fg′）を逆にすると、ふごうが反対になってしまいます。また、n が正の《整数》のとき、x⁻ⁿ = 1/xⁿ を {1/g(x)}′ の式で微分すると (x⁻ⁿ)′ = −nxⁿ⁻¹/x²ⁿ = −nx⁻ⁿ⁻¹ となり、(xⁿ)′ = nxⁿ⁻¹ は n が負の整数でも成り立ちます。たとえば (1/x³)′ = (x⁻³)′ = −3x⁻⁴ = −3/x⁴ です。
