# D-005 導関数の計算と関数のグラフ（微分法）
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   1〜5 日目は新しいきまりが出るので、頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：導関数の公式（(xⁿ)′ = nxⁿ⁻¹、(c)′ = 0、{kf(x)}′ = kf′(x)、{f(x) ± g(x)}′ = f′(x) ± g′(x)）、多項式の微分係数、接線。
#   2 日目：積の微分、商の微分、{1/g(x)}′ = −g′(x)/{g(x)}²、負の整数の指数（(xⁿ)′ = nxⁿ⁻¹ は n が負の整数でも成り立つ）。
#   3 日目：合成関数の微分（{f(g(x))}′ = f′(g(x))g′(x)、dy/dx = (dy/du)(du/dx)）、√ の入った関数。
#   4 日目：lim (h→0) sin h/h = 1（単位円の面積の大小とはさみうち）、(sin x)′ = cos x、(cos x)′ = −sin x、(tan x)′ = 1/cos²x。
#   5 日目：増減と極値（f′(x) の符号、増減表、極大・極小、極値をとる x から係数を求める、f′(x) のグラフから読む）。
#   6 日目：わけ（3 問とも ③：積の微分の公式、(sin x)′ = cos x、x = a で極大なら f′(a) = 0）。
#   7 日目：混ぜる（閉じた区間の最大・最小、箱の容積、法線、方程式の実数解の個数、不等式がいつも成り立つ条件、三角関数の最大）。8 日目：確認。
# 前提は D-004（微分の考え）と G-025（三角関数と加法定理）。どちらも同時に別の係が作っていてファイルがまだないので、次を済んだものとみなした。
#   D-004：微分係数と導関数を定義 f′(x) = lim (h→0) (f(x + h) − f(x))/h で求めること、接線 y = f′(a)(x − a) + f(a)、
#     x²、x³、1/x、√x の導関数を定義から求めたこと（(x²)′ = 2x、(1/x)′ = −1/x²、(√x)′ = 1/(2√x)）、微分可能なら連続であること。
#     D-004 のたどりの D-003 から、極限の性質（和・差・積・商）、片側からの極限、はさみうちの原理も使う。
#   G-025：弧度法、単位円による sin・cos・tan、sin²x + cos²x = 1、加法定理、2 倍角の公式、0 ≦ x < 2π などでの方程式 cos x = −1/2 の解。
#   G-026（座標と図形の方程式）は G-025 の前提なので、垂直な 2 直線の傾きの積が −1 であることを法線に使う。A-012（連立方程式）もたどりにある。
# 指数関数と対数関数（D-001）と数列の極限（D-002）は、地図の前提のたどりにないので、eˣ と log x の導関数、e は扱わない。
#   有理数の指数（x^(1/2)）も D-001 の中身なので使わず、√x、1/x² の形で書く。(xⁿ)′ = nxⁿ⁻¹ は n が整数のときだけ使う。
# 不等式の性質（A-013）もたどりにないので、f′(x) の符号や大小は読むだけにし、不等式を変形して解く問題は出さない
#   （範囲は choices、整数の個数は判別式の値を代入して数える）。4 日目の見本の sin h < h < tan h から cos h < sin h/h < 1 への変形は、見本で見せるだけにした。
# 「f′(x) > 0 の区間で f(x) は増加、f′(x) < 0 の区間で減少」と「ある区間でいつも f′(x) = 0 なら f(x) は定数」は、平均値の定理（後の単元）で示すことなので、
#   5 日目の見本で約束した事実として述べた（D-006 が、原始関数どうしの差が定数になるわけに使う）。
# 第 2 次導関数と凹凸・変曲点は、8 日に収まらないので扱わない。
# 書き方：導関数は f′(x)、y′、dy/dx（′ は U+2032）。極限は lim (h→0) と 1 行で書く。三角関数は sin x、cos²x、sin 2x、角は弧度法。
#   係数の分数は (1/2)x⁴、−(1/3)x のようにかっこでくくる。増減表は svg の表に描く（↗ は増加、↘ は減少）。
# 答えは数を打つ（整数、約分した分数、負の数）。√ と π を含む値、導関数の式、直線の式、k の範囲、極値をとる x は choices。
# check：微分係数は差分 (f(a + 10⁻⁶) − f(a − 10⁻⁶))/(2 × 10⁻⁶) を Fraction(…).limit_denominator(100) にそろえ、負の数は「−」の形にする。
#   導関数を選ぶ問題は、選択肢ごとの式（lambda x）が x = 0.3、0.8、1.7、2.6 で元の関数の差分と等しいものを選び出す。
#   極値は、差分が 0 になる整数をさがし、その前後の差分の符号で極大か極小かを見分ける。最大・最小は区間を 1/100 きざみの分数で調べて max、min をとる。
#   実数解の個数と接線の本数は、1/100 きざみで符号が変わるところを数える。√ や π を含む値は math で計算して近いものを選ぶ。
# 図は svg（D-040）：1 日目の接線、4 日目の単位円、5 日目の増減表と 4 次関数のグラフと f′(x) のグラフ、離の球と円錐。答えの値は図に書かない。
# 導関数の計算と増減は、積分（D-006）、数値計算のニュートン法（K-160）、物理の速度と加速度、最適化（K の流れ）の道具になる（D-026）。

