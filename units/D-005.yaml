        text: f(x)、g(x) が微分可能なとき、{f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x) となります。このわけを、導関数の定義から筋道を立てて書きましょう。
        explain: 例：「y = f(x)g(x) とする。導関数の定義から y′ = lim (h→0) {f(x + h)g(x + h) − f(x)g(x)}/h である。分子から f(x)g(x + h) をひいて足すと、f(x + h)g(x + h) − f(x)g(x) = {f(x + h) − f(x)}g(x + h) + f(x){g(x + h) − g(x)} となるので、h でわると {(f(x + h) − f(x))/h} × g(x + h) + f(x) × {(g(x + h) − g(x))/h} である。h → 0 のとき、導関数の定義から (f(x + h) − f(x))/h → f′(x)、(g(x + h) − g(x))/h → g′(x) であり、g(x) は微分可能なので連続で（D-004）、g(x + h) → g(x) である。極限の性質（和と積の極限、D-003）から、y′ = f′(x)g(x) + f(x)g′(x) である。」と書ければよい。①「〜とする」で y を決め、定義の式を書く、② f(x)g(x + h) をひいて足し、2 つの差の商に分ける式の変形、③ 約束した事実（導関数の定義、微分可能なら連続、極限の性質）で結ぶ、の 3 つと結論がそろっているかを見る。g(x + h) → g(x) を書き落としていたら、どこで連続であることを使うかを話す。y = x × x² のような例で公式が合うことを確かめただけで終わっていたら、例ではすべての関数について示せないことを話す。
        hints:
