    items:
      - part: 見本
        id: "f052baaa94"
        text: y = (3x − 1)⁵ は、u = 3x − 1、y = u⁵ と 2 だんに分けて考えます（合成関数）。図のように、x が少し変わると u はその 3 倍、u が少し変わると y はその 5u⁴ 倍変わるので、dy/dx = (dy/du) × (du/dx) = 5u⁴ × 3 = 15(3x − 1)⁴ です。√(x² + 1) も、u = x² + 1 とおけば同じように微分できます。
        svg: '<svg viewBox="0 0 320 162" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="62" r="24" fill="#c8ccd6" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="40" y="69" font-size="20" text-anchor="middle" fill="currentColor" font-style="italic">x</text><circle cx="160" cy="62" r="24" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="160" y="69" font-size="20" text-anchor="middle" fill="currentColor" font-style="italic">u</text><circle cx="280" cy="62" r="24" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="280" y="69" font-size="20" text-anchor="middle" fill="currentColor" font-style="italic">y</text><line x1="66" y1="62" x2="126.4" y2="62" stroke="currentColor" stroke-width="2.5"/><polygon points="132,62 124.7,65.3 124.7,58.7" fill="currentColor"/><line x1="186" y1="62" x2="246.4" y2="62" stroke="currentColor" stroke-width="2.5"/><polygon points="252,62 244.7,65.3 244.7,58.7" fill="currentColor"/><text x="100" y="32" font-size="13" text-anchor="middle" fill="currentColor">du/dx = 3</text><text x="220" y="32" font-size="13" text-anchor="middle" fill="currentColor">dy/du = 5u⁴</text><text x="160" y="108" font-size="14" text-anchor="middle" fill="currentColor">u = 3x − 1</text><text x="282" y="108" font-size="14" text-anchor="middle" fill="currentColor">y = u⁵</text><rect x="30" y="124" width="260" height="30" rx="8" fill="#7fc8f8" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2"/><text x="160" y="144" font-size="14" text-anchor="middle" fill="currentColor">dy/dx = 5u⁴ × 3 = 15(3x − 1)⁴</text></svg>'
        explain: y = (3x − 1)⁵ は、u = 3x − 1 とおくと y = u⁵ で、x → u → y と 2 だんで決まる関数（合成関数）です。x が少し変わると u が変わり、u が変わると y が変わるので、平均変化率は (y の変化 ÷ u の変化) × (u の変化 ÷ x の変化) と書けます。x の変化を 0 に近づけると、u = 3x − 1 は連続なので u の変化も 0 に近づき、dy/dx = (dy/du) × (du/dx) となります。関数の形で書くと {f(g(x))}′ = f′(g(x))g′(x) です。y = (3x − 1)⁵ では、dy/du = 5u⁴、du/dx = 3 なので、y′ = 5(3x − 1)⁴ × 3 = 15(3x − 1)⁴ です。5 乗のかっこを外してから微分するより、ずっと手早く求められます。y = √(x² + 1) は、u = x² + 1、y = √u とみます。(√u)′ = 1/(2√u)（D-004 で定義から求めました）なので、y′ = 1/(2√(x² + 1)) × 2x = x/√(x² + 1) です。中の関数の導関数 g′(x) をかけわすれないことが大切です。
