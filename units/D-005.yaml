        text: f(x)、g(x) が微分可能なとき、{f(x)g(x)}′ = f′(x)g(x) + f(x)g′(x) となります。このわけを、導関数の定義からすじ道を立てて書きましょう。
        explain: 例：「y = f(x)g(x) とする。導関数の定義から y′ = lim (h→0) {f(x + h)g(x + h) − f(x)g(x)}/h である。分子から f(x)g(x + h) をひいて足すと、f(x + h)g(x + h) − f(x)g(x) = {f(x + h) − f(x)}g(x + h) + f(x){g(x + h) − g(x)} となるので、h でわると {(f(x + h) − f(x))/h} × g(x + h) + f(x) × {(g(x + h) − g(x))/h} である。h → 0 のとき、導関数の定義から (f(x + h) − f(x))/h → f′(x)、(g(x + h) − g(x))/h → g′(x) であり、g(x) は微分可能なので連続で（D-004）、g(x + h) → g(x) である。極限の性質（和と積の極限、D-003）から、y′ = f′(x)g(x) + f(x)g′(x) である。」と書ければよい。①「〜とする」で y を決め、定義の式を書く、② f(x)g(x + h) をひいて足し、2 つの差の商に分ける式の変形、③ 約束した事実（導関数の定義、微分可能なら連続、極限の性質）で結ぶ、の 3 つとけつろんがそろっているかを見る。g(x + h) → g(x) を書き落としていたら、どこで連続であることを使うかを話す。y = x × x² のような例で公式が合うことを確かめただけで終わっていたら、例ではすべての関数について示せないことを話す。
        hints:
          - 導関数の定義から、y′ = lim (h→0) {f(x + h)g(x + h) − f(x)g(x)}/h と書き始めましょう。
          - text: 分子から f(x)g(x + h) をひいて足すと、図の 2 つの細長い長方形（緑と青）の和の形に分けられます。
            svg: '<svg viewBox="0 0 320 246" xmlns="http://www.w3.org/2000/svg"><rect x="50" y="40" width="196" height="30" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="148" y="60" font-size="13" text-anchor="middle" fill="currentColor">① × g(x + h)</text><rect x="50" y="70" width="160" height="120" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="130" y="134" font-size="14" text-anchor="middle" fill="currentColor">f(x) × g(x)</text><rect x="210" y="70" width="36" height="120" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="252" y="134" font-size="13" text-anchor="start" fill="currentColor">f(x) × ②</text><text x="44" y="134" font-size="13" text-anchor="end" fill="currentColor">f(x)</text><text x="44" y="60" font-size="13" text-anchor="end" fill="currentColor">①</text><text x="130" y="208" font-size="13" text-anchor="middle" fill="currentColor">g(x)</text><text x="228" y="208" font-size="13" text-anchor="middle" fill="currentColor">②</text><text x="160" y="236" font-size="13" text-anchor="middle" fill="currentColor">① = f(x + h) − f(x)、② = g(x + h) − g(x)</text></svg>'
          - h → 0 のとき g(x + h) がどうなるかは、D-004 の「微分可能なら連続」で言えます。
        paths:
          - [y = f(x)g(x) とする, 分子から f(x)g(x + h) をひいて足す, "{(f(x + h) − f(x))/h} × g(x + h) + f(x) × {(g(x + h) − g(x))/h}", h → 0 で f′(x)g(x) + f(x)g′(x)]
          - [f(x + h) = f(x) + p、g(x + h) = g(x) + q とおく（h → 0 で p、q → 0）, f(x + h)g(x + h) − f(x)g(x) = pg(x) + f(x)q + pq（長方形の面積の図）, h でわると (p/h)g(x) + f(x)(q/h) + (p/h)q, h → 0 で p/h → f′(x)、q/h → g′(x)、q → 0 なので y′ = f′(x)g(x) + f(x)g′(x)]
