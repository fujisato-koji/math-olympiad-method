">極大 7</text><text x="249" y="274.6" font-size="13" text-anchor="start" fill="currentColor">極小 −25</text></svg>'
        explain: f′(x) のふごうと関数の増減には、次の関係があります。ある区間で f′(x) > 0 なら f(x) はその区間で増加し、f′(x) < 0 なら減少します。また、ある区間でいつも f′(x) = 0 なら、f(x) はその区間で定数です。どちらも平均値の定理（後の単元）で示すことで、ここでは約束した事実として使います。この関数では f′(x) = 3x² − 6x − 9 = 3(x + 1)(x − 3) なので、f′(x) は x < −1 で正、−1 < x < 3 で負、x > 3 で正です。これを表にしたものが増減表で、↗ は増加、↘ は減少を表します。f(x) は x = −1 で増加から減少に変わり、その近くでいちばん大きくなるので、x = −1 で極大になるといい、f(−1) = −1 − 3 + 9 + 2 = 7 を極大値といいます。x = 3 では減少から増加に変わるので極小で、極小値は f(3) = 27 − 27 − 27 + 2 = −25 です。極大値と極小値をまとめて極値といいます。極値をとる x では f′(x) = 0 ですが（わけは 6 日目）、f′(x) = 0 でも前後で f′(x) のふごうが変わらなければ極値ではありません（たとえば f(x) = x³ の x = 0）。
