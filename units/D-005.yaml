        text: 微分可能な関数 f(x) が x = a で極大になるなら、f′(a) = 0 となります。このわけを、すじ道を立てて書きましょう。
        explain: 例：「f(x) は x = a で極大とする。つまり、a に十分近い x（x ≠ a）では f(x) < f(a) である。h が 0 に十分近い正の数のとき、f(a + h) − f(a) < 0 で h > 0 なので、(f(a + h) − f(a))/h < 0 である。h → +0 とすると、負の値の極限は正にならないので f′(a) ≦ 0 である。h が 0 に十分近い負の数のとき、f(a + h) − f(a) < 0 で h < 0 なので、(f(a + h) − f(a))/h > 0 で、h → −0 とすると f′(a) ≧ 0 である。f(x) は x = a で微分可能なので、右からの極限と左からの極限はどちらも f′(a) に等しく、f′(a) ≦ 0 と f′(a) ≧ 0 から f′(a) = 0 である。」と書ければよい。①「〜とする」で極大の意味を式で書く、② h の正と負に分けて差の商のふごうを調べる、③ 約束した事実（微分係数の定義、片側からの極限（D-003）、負の値の極限は正にならない）で結ぶ、の 3 つとけつろんがそろっているかを見る。極小のときも同じすじ道で示せる。逆は成り立たず、f(x) = x³ は f′(0) = 0 だが x = 0 で極値をとらないこと（今日の問題）にもふれる。「グラフの山のちょうじょうでは接線が水平だから」とだけ書いていたら、図ではなく式で示すことを話す。
