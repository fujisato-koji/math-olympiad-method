          - 箱をうめた式は、2 倍角の公式（G-025）で 1 つの三角関数にまとめられます。
        paths:
          - [y′ = cos x × cos x + sin x × (−sin x), cos²x − sin²x = cos 2x]
          - [sin x cos x = (1/2)sin 2x, y′ = (1/2) × 2cos 2x = cos 2x]
