        explain: D-004 では、導関数を定義 f′(x) = lim (h→0) (f(x + h) − f(x))/h から求め、(x²)′ = 2x、(x³)′ = 3x² となりました。一般に、n が正の《整数》のとき (xⁿ)′ = nxⁿ⁻¹ です（(x + h)ⁿ − xⁿ = h{(x + h)ⁿ⁻¹ + (x + h)ⁿ⁻²x + … + xⁿ⁻¹} を h でわって h → 0 とすると、かっこの中の n 個の項がどれも xⁿ⁻¹ に近づきます）。また、定数 c の導関数は (c)′ = 0、k を定数として {kf(x)}′ = kf′(x)、{f(x) + g(x)}′ = f′(x) + g′(x)、{f(x) − g(x)}′ = f′(x) − g′(x) です（極限の性質（D-003）から出ます）。これらを使うと、f′(x) = 2 × 3x² − 5 × 2x + 4 = 6x² − 10x + 4 です。x = 2 での微分係数は f′(2) = 24 − 20 + 4 = 8 で、これは点 (2, f(2)) での接線の傾きです。f(2) = 16 − 20 + 8 − 1 = 3 なので、接線は y = 8(x − 2) + 3、つまり y = 8x − 13 です（D-004 の接線の式）。これからは、多項式の導関数を定義にもどらずに求めます。
      - part: 思い出す
        text: 関数 f(x) = x² + 3x の x = 1 における微分係数を、定義 f′(1) = lim (h→0) (f(1 + h) − f(1))/h で求めましょう。f′(1) はいくつですか。
        answer: 5
        check: "Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: x * x + 3 * x, 1)).limit_denominator(100)"
        hints:
          - f(1 + h) を展開しましょう。
          - f(1 + h) − f(1) を h の式で表すと、h でくくれます。
          - h でわってから、h → 0 とします。
        paths:
          - [f(1 + h) − f(1) = (1 + h)² + 3(1 + h) − 4 = 5h + h², (5h + h²)/h = 5 + h, h → 0 で 5]
      - part: 思い出す
        text: 曲線 y = x² 上の点 (3, 9) における接線と、x 軸の交点の x 座標はいくつですか。
        answer: 3/2
        accept: [1.5]
        check: "(lambda m: Fraction(3 - 9 / m).limit_denominator(100))((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: x * x, 3))"
        hints:
          - y = x² の導関数は、D-004 で定義から求めました。
          - x = 3 での接線の傾きを求め、接線の式をつくりましょう。
          - 接線の式で y = 0 とおきます。
        paths:
          - [y′ = 2x で傾きは 6, 接線は y = 6(x − 3) + 9 = 6x − 9, 6x − 9 = 0 より x = 3/2]
      - part: 今日
        text: 関数 f(x) = x⁴ − 2x³ + 5x の導関数は、どれですか。
        choices: [f′(x) = 4x³ − 6x² + 5, f′(x) = 4x³ − 6x² + 5x, f′(x) = x³ − 2x² + 5, f′(x) = 4x³ − 2x² + 5]
        answer: f′(x) = 4x³ − 6x² + 5
        check: "[c for c, g in {'f′(x) = 4x³ − 6x² + 5': lambda x: 4 * x**3 - 6 * x**2 + 5, 'f′(x) = 4x³ − 6x² + 5x': lambda x: 4 * x**3 - 6 * x**2 + 5 * x, 'f′(x) = x³ − 2x² + 5': lambda x: x**3 - 2 * x**2 + 5, 'f′(x) = 4x³ − 2x² + 5': lambda x: 4 * x**3 - 2 * x**2 + 5}.items() if all(abs(g(x) - (lambda f: (f(x + 1e-6) - f(x - 1e-6)) / 2e-6)(lambda t: t**4 - 2 * t**3 + 5 * t)) < 1e-5 for x in (0.3, 0.8, 1.7, 2.6))][0]"
        hints:
          - 項ごとに (xⁿ)′ = nxⁿ⁻¹ を使いましょう。
          - 係数はそのまま残し、その項の xⁿ の導関数にかけます。
          - 5x の導関数は定数になります。
        paths:
          - [(x⁴)′ = 4x³、(2x³)′ = 6x²、(5x)′ = 5, f′(x) = 4x³ − 6x² + 5]
        note: 5x を微分しても 5x のまま残す誤りと、指数を前に下ろさずに 1 つ下げるだけの誤り（x³ − 2x² + 5）が多い。
      - part: 今日
        text: 関数 f(x) = 3x³ − 4x² + x − 7 で、f′(−1) の値はいくつですか。
        answer: 18
        check: "Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: 3 * x**3 - 4 * x**2 + x - 7, -1)).limit_denominator(100)"
        hints:
          - まず f′(x) を求めましょう。
          - 定数 −7 の導関数は 0 です。
          - x = −1 を代入するときは、(−1)² の符号に気をつけましょう。
        paths:
          - [f′(x) = 9x² − 8x + 1, f′(−1) = 9 + 8 + 1 = 18]
      - part: 挑戦
        text: 曲線 y = x³ − 3x² + 2 の接線のうち、傾きが 9 であるものは 2 本あります。接点の x 座標が正であるほうの接線の y 切片はいくつですか。
        answer: −25
        check: "(lambda f: (lambda v: f'−{-v}' if v < 0 else f'{v}')([Fraction(f(a) - 9 * a) for a in range(1, 30) if abs((f(a + 1e-6) - f(a - 1e-6)) / 2e-6 - 9) < 1e-4][0]))(lambda x: x**3 - 3 * x**2 + 2)"
        hints:
          - 接点の x 座標を a として、接線の傾き y′ を a の式で表しましょう。
          - 傾きが 9 という条件は、a の 2 次方程式になります（A-017）。
          - 正の a での接点の座標を求めて、接線の式をつくります。
        paths:
