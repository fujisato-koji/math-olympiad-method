          - 増減表をかいて、極大値と極小値を求めましょう。
          - 極大値と極小値の符号を調べます。
        paths:
          - [f′(x) = 3(x − 1)(x − 3), 極大値 f(1) = −1、極小値 f(3) = −5, どちらも負なので x 軸と交わるのは x > 3 の 1 か所, 1 個]
        note: 極大値も極小値も負なので、グラフは x = 3 より右で 1 回だけ x 軸と交わる。
    extra:
      - part: 今日
        text: 関数 y = x√x の、x = 4 における微分係数はいくつですか。
        answer: 3
        check: "Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: x * math.sqrt(x), 4)).limit_denominator(100)"
        hints:
          - x と √x の積とみて、積の微分を使いましょう。
          - (√x)′ = 1/(2√x) です。
          - x = 4 のとき √x の値はいくつでしょう。
        paths:
          - [y′ = √x + x/(2√x) = (3/2)√x, x = 4 で (3/2) × 2 = 3]
      - part: 今日
        text: 関数 y = 2sin x + cos 2x の、x = π における微分係数はいくつですか。
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((lambda f, a: (f(a + 1e-6) - f(a - 1e-6)) / 2e-6)(lambda x: 2 * math.sin(x) + math.cos(2 * x), math.pi)).limit_denominator(100))"
        hints:
          - (cos 2x)′ は合成関数の微分で求めます。
          - y′ に x = π を代入しましょう。
          - cos π と sin 2π の値を思い出しましょう。
        paths:
          - [y′ = 2cos x − 2sin 2x, x = π で 2 × (−1) − 0 = −2]
      - part: 今日
        text: 関数 f(x) = x³ − 12x（−3 ≦ x ≦ 5）の最小値はいくつですか。
        answer: −16
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(min((lambda x: x**3 - 12 * x)(Fraction(k, 100)) for k in range(-300, 501)))"
        hints:
          - 増減表をかいて、極大値と極小値を求めましょう。
          - 区間の両はし x = −3、x = 5 での値も求めましょう。
          - 極小値と両はしの値をくらべて、いちばん小さいものが最小値です。
        paths:
          - [f′(x) = 3(x + 2)(x − 2), "f(−3) = 9、f(−2) = 16、f(2) = −16、f(5) = 65", 最小値は x = 2 のときの −16]

