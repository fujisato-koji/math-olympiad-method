      - part: わけ
        text: (sin x)′ = cos x となります。このわけを、導関数の定義と加法定理、lim (h→0) sin h/h = 1 を使って、筋道を立てて書きましょう。
        explain: 例：「f(x) = sin x とする。加法定理から sin(x + h) − sin x = sin x cos h + cos x sin h − sin x = sin x(cos h − 1) + cos x sin h なので、(f(x + h) − f(x))/h = sin x × (cos h − 1)/h + cos x × (sin h/h) である。ここで、(cos h − 1)/h の分子と分母に cos h + 1 をかけると、(cos²h − 1)/{h(cos h + 1)} = −sin²h/{h(cos h + 1)} = −(sin h/h) × sin h/(cos h + 1) となる（sin²h + cos²h = 1）。h → 0 のとき sin h/h → 1、sin h → 0、cos h + 1 → 2 なので、(cos h − 1)/h → −1 × 0/2 = 0 である。極限の性質から、f′(x) = sin x × 0 + cos x × 1 = cos x である。」と書ければよい。① f(x) = sin x として定義の式を書く、② 加法定理で 2 つの項に分け、(cos h − 1)/h を sin²h の形に変形する、③ 約束した事実（lim (h→0) sin h/h = 1（4 日目）、sin²h + cos²h = 1、極限の性質）で結ぶ、の 3 つと結論がそろっているかを見る。(cos h − 1)/h → 0 を「cos h → 1 だから」とだけ書いていたら、分母の h も 0 に近づくので、それだけでは言えないことを話す。同じ筋道で (cos x)′ = −sin x も示せることにも触れる。
        hints:
          - 加法定理で sin(x + h) を展開し、sin x をふくむ項と cos x をふくむ項に分けましょう。
          - (cos h − 1)/h は、分子と分母に cos h + 1 をかけると sin²h が出てきます。
          - sin h/h → 1 と、h → 0 のときの sin h と cos h の近づく値を使いましょう。
        paths:
          - [f(x) = sin x とする, 差の商は sin x × (cos h − 1)/h + cos x × (sin h/h), (cos h − 1)/h = −(sin h/h) × sin h/(cos h + 1) → 0, f′(x) = cos x]
      - part: わけ
        text: 微分可能な関数 f(x) が x = a で極大になるなら、f′(a) = 0 となります。このわけを、筋道を立てて書きましょう。
        explain: 例：「f(x) は x = a で極大とする。つまり、a に十分近い x（x ≠ a）では f(x) < f(a) である。h が 0 に十分近い正の数のとき、f(a + h) − f(a) < 0 で h > 0 なので、(f(a + h) − f(a))/h < 0 である。h → +0 とすると、負の値の極限は正にならないので f′(a) ≦ 0 である。h が 0 に十分近い負の数のとき、f(a + h) − f(a) < 0 で h < 0 なので、(f(a + h) − f(a))/h > 0 で、h → −0 とすると f′(a) ≧ 0 である。f(x) は x = a で微分可能なので、右からの極限と左からの極限はどちらも f′(a) に等しく、f′(a) ≦ 0 と f′(a) ≧ 0 から f′(a) = 0 である。」と書ければよい。①「〜とする」で極大の意味を式で書く、② h の正と負に分けて差の商の符号を調べる、③ 約束した事実（微分係数の定義、片側からの極限（D-003）、負の値の極限は正にならない）で結ぶ、の 3 つと結論がそろっているかを見る。極小のときも同じ筋道で示せる。逆は成り立たず、f(x) = x³ は f′(0) = 0 だが x = 0 で極値をとらないこと（今日の問題）にも触れる。「グラフの山の頂上では接線が水平だから」とだけ書いていたら、図ではなく式で示すことを話す。
        hints:
          - 「x = a で極大とする」から始め、a の近くの x で f(x) と f(a) の大小を式で書きましょう。
          - h > 0 と h < 0 に分けて、(f(a + h) − f(a))/h の符号を調べましょう。
          - 右からの極限と左からの極限は、どちらも f′(a) に等しくなります。
        paths:
          - [x = a で極大とする, h > 0 なら差の商は負なので f′(a) ≦ 0, h < 0 なら差の商は正なので f′(a) ≧ 0, f′(a) = 0]
