        explain: 図で、A(1, 0)、P(cos h, sin h)、T(1, tan h) です。面積は、三角形 OAP が (1/2) sin h、おうぎ形 OAP が (1/2)h（弧度法では、半径 1、中心角 h のおうぎ形の面積は h/2）、三角形 OAT が (1/2) tan h です。図から三角形 OAP < おうぎ形 OAP < 三角形 OAT なので、sin h < h < tan h です。各辺を正の数 sin h でわって《逆数》をとると、cos h < sin h/h < 1 となります。h → +0 のとき cos h → 1 なので、はさみうちの原理（D-003）から sin h/h → 1 です。h < 0 のときも sin(−h)/(−h) = sin h/h なので同じで、lim (h→0) sin h/h = 1 です。これと加法定理から (sin x)′ = cos x が出ます（わけは 6 日目）。同じように (cos x)′ = −sin x で、tan x = sin x/cos x を商の微分で微分すると、(tan x)′ = (cos x × cos x − sin x × (−sin x))/cos²x = 1/cos²x です。合成関数の微分と組み合わせると、たとえば (sin 3x)′ = 3cos 3x、(cos²x)′ = 2cos x × (−sin x) = −2sin x cos x です。角はいつも弧度法で考えます（度数法のままでは sin h/h → 1 になりません）。
