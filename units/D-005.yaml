        answer: y′ = (−x² − 4x + 1)/(x² + 1)²
        check: "[c for c, g in {'y′ = (−x² − 4x + 1)/(x² + 1)²': lambda x: (-x * x - 4 * x + 1) / (x * x + 1) ** 2, 'y′ = (x² + 4x − 1)/(x² + 1)²': lambda x: (x * x + 4 * x - 1) / (x * x + 1) ** 2, 'y′ = (−x² − 4x + 1)/(x² + 1)': lambda x: (-x * x - 4 * x + 1) / (x * x + 1), 'y′ = 1/(2x)': lambda x: 1 / (2 * x)}.items() if all(abs(g(x) - (lambda f: (f(x + 1e-6) - f(x - 1e-6)) / 2e-6)(lambda t: (t + 2) / (t * t + 1))) < 1e-5 for x in (0.3, 0.8, 1.7, 2.6))][0]"
