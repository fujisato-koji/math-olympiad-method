        id: "45ed3e4bd2"
        text: (sin x)′ = cos x となります。このわけを、導関数の定義と加法定理、lim (h→0) sin h/h = 1 を使って、すじ道を立てて書きましょう。
        explain: 例：「f(x) = sin x とする。加法定理から sin(x + h) − sin x = sin x cos h + cos x sin h − sin x = sin x(cos h − 1) + cos x sin h なので、(f(x + h) − f(x))/h = sin x × (cos h − 1)/h + cos x × (sin h/h) である。ここで、(cos h − 1)/h の分子と分母に cos h + 1 をかけると、(cos²h − 1)/{h(cos h + 1)} = −sin²h/{h(cos h + 1)} = −(sin h/h) × sin h/(cos h + 1) となる（sin²h + cos²h = 1）。h → 0 のとき sin h/h → 1、sin h → 0、cos h + 1 → 2 なので、(cos h − 1)/h → −1 × 0/2 = 0 である。極限の性質から、f′(x) = sin x × 0 + cos x × 1 = cos x である。」と書ければよい。① f(x) = sin x として定義の式を書く、② 加法定理で 2 つのこうに分け、(cos h − 1)/h を sin²h の形に変形する、③ 約束した事実（lim (h→0) sin h/h = 1（4 日目）、sin²h + cos²h = 1、極限の性質）で結ぶ、の 3 つとけつろんがそろっているかを見る。(cos h − 1)/h → 0 を「cos h → 1 だから」とだけ書いていたら、分母の h も 0 に近づくので、それだけでは言えないことを話す。同じすじ道で (cos x)′ = −sin x も示せることにもふれる。
        hints:
          - 加法定理で sin(x + h) を書きかえ、sin x をふくむこうと cos x をふくむこうに分けましょう。
          - (cos h − 1)/h は、分子と分母に cos h + 1 をかけると sin²h が出てきます。
          - sin h/h → 1 と、h → 0 のときの sin h と cos h の近づく値を使いましょう。
        paths:
          - [f(x) = sin x とする, 差の商は sin x × (cos h − 1)/h + cos x × (sin h/h), (cos h − 1)/h = −(sin h/h) × sin h/(cos h + 1) → 0, f′(x) = cos x]
          - [加法定理から sin(x + h) − sin x = 2cos(x + h/2)sin(h/2), 差の商は cos(x + h/2) × sin(h/2)/(h/2), h → 0 で cos(x + h/2) → cos x、sin(h/2)/(h/2) → 1, f′(x) = cos x]
