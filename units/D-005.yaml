  - part: 離
    kinds: [道筋]
    text: 点 (0, k) から曲線 y = x³ − 3x² に、ちょうど 3 本の接線が引けるような k の範囲は、どれですか。
    choices: [0 < k < 1, k < 0, 0 ≦ k ≦ 1, k > 1]
    answer: 0 < k < 1
    check: "[c for c, p in {'0 < k < 1': lambda k: 0 < k < 1, 'k < 0': lambda k: k < 0, '0 ≦ k ≦ 1': lambda k: 0 <= k <= 1, 'k > 1': lambda k: k > 1}.items() if all(p(k) == (len([j for j in range(-400, 400) if (lambda g: g((j + 0.5) / 100) * g((j + 1.5) / 100) < 0)(lambda t: (lambda f: f(t) - t * (f(t + 1e-6) - f(t - 1e-6)) / 2e-6 - k)(lambda x: x**3 - 3 * x**2))]) == 3) for k in [Fraction(i, 8) for i in range(-8, 17)])][0]"
    hints:
      - 接点を (t, t³ − 3t²) として、その点での接線の式を t で表そう。
      - 接線が点 (0, k) を通るという条件は、t の 3 次方程式になるよ。
      - 接線の本数は、その 3 次方程式の異なる実数解の個数と同じだね。k = (t の式) と分けて、グラフと直線 y = k の共有点を数えよう。
    paths:
      - [接点 t での接線は y = (3t² − 6t)(x − t) + t³ − 3t², x = 0、y = k を代入して k = −2t³ + 3t², g(t) = −2t³ + 3t² の極小値 g(0) = 0、極大値 g(1) = 1, 直線 y = k と 3 点で交わるのは 0 < k < 1]
    note: 3 次関数のグラフでは、接点がちがえば接線もちがうので、接線の本数は t の方程式の実数解の個数と同じになる。接点を文字でおき、「通る点」の条件を t の方程式にして、さらに定数 k を分けてグラフで数える、という 2 段の言いかえが離の要点。k = 0 と k = 1 では 2 本になる。
  - part: 離
    kinds: [数, 手数]
    text: 関数 f(x) = 2x³ − (15/2)x² + 6x（−1/2 ≦ x ≦ 3）の最大値と最小値の差はいくつですか。
    answer: 77/8
    accept: [9.625]
    check: "(lambda vals: max(vals) - min(vals))([(lambda x: 2 * x**3 - Fraction(15, 2) * x**2 + 6 * x)(Fraction(k, 100)) for k in range(-50, 301)])"
    hints:
      - f′(x) を因数分解しよう。係数の 3 をくくり出すと見やすくなるよ。
      - 極値をとる 2 つの x と、区間の両はしの 2 つの x で、f(x) を計算しよう。
      - 4 つの値のうち、いちばん大きいものといちばん小さいものの差を求めよう。
    paths:
      - [f′(x) = 6x² − 15x + 6 = 3(2x − 1)(x − 2), "f(−1/2) = −41/8、f(1/2) = 11/8、f(2) = −2、f(3) = 9/2", 最大値は 9/2、最小値は −41/8, 差は 9/2 + 41/8 = 77/8]
    note: 《分数》の計算が 4 回続く。最大は区間のはしの x = 3、最小も区間のはしの x = −1/2 で、極大値 11/8 と極小値 −2 はどちらも最大・最小ではない。極値だけをくらべて 11/8 − (−2) = 27/8 としやすい。分母を 8 にそろえて計算するとよい。
