# P-182 電気の通り道
#
# 段 1・水準 1・4 日。乾電池と豆電球・LED、ひとまわりの輪、スイッチを扱う。
# 子の画面には text、figure、choices、ヒントだけを出す。answer、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。

id: P-182
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          乾電池と 豆電球を 導線で つなぐと、明かりが つきます。
          乾電池には + と − の 端子が あります。
          導線は、電気を 通す 道です。
        explain: |-
          【定義】乾電池の + と − を、導線で 豆電球に つなぐと、電気が 流れて 明かりが つきます。
          導線は 銅などで できていて、電気を 通します。
        note: 乾電池・豆電球・導線をつなぐと明かりがつく。+ と − がある。
      - part: 今日
        text: 明かりを つける のに 必要な ものは どれかな。
        figure: 🔋💡
        choices: [乾電池と 豆電球と 導線, 乾電池だけ, 豆電球だけ, 導線だけ]
        answer: 乾電池と 豆電球と 導線
        check: "'乾電池と 豆電球と 導線'"
        hints:
          - 明かりを つける ときの つなぎ方を おもいだそう。
          - 電気を 流す ものと、電気を 使う ものが 要ります。
          - 乾電池、豆電球、導線の 3 つが 要ります。
        paths:
          - [電気を 流す, 電気を 使う, 道, 3 つ]
      - part: 今日
        text: 乾電池の 端子は いくつ あるかな。
        choices: [1 つ, 2 つ, 3 つ, 4 つ]
        answer: 2 つ
        check: "'2 つ'"
        hints:
          - 乾電池の 両はしを 見てみよう。
          - + と − の 2 つの 端子が あります。
          - + と − の 端子を 数えよう。
        paths:
          - [両はし, + と −, 2 つ]
      - part: 挑戦
        text: 導線は、何を 通す 道かな。
        choices: [電気, 水, 空気, 音]
        answer: 電気
        check: "'電気'"
        hints:
          - 導線は、乾電池と 豆電球を つなぎます。
          - 電気が 通る 道です。
          - 導線が 何を 通すか を たしかめよう。
        paths:
          - [つなぐ, 電気の 道, 電気]
