        explain: |-
          かんでんちの + の はしと − の はしを、どうせんで まめでんきゅうに つなぐと、でんきが ながれて あかりが つきます。
          どうせんの なかは どうと いう きんぞくで、でんきを よく とおします。まわりの ビニールは でんきを とおしません。
          LED は むきが あり、ながい あしを + に、みじかい あしを − に つなぐと つきます。はんたいに つなぐと つきません。LED は かんでんち 1 こでは つかない ことが おおいので、えでは 2 こ つないで います。
        note: かんでんち・まめでんきゅう・どうせんで あかりが つく。かんでんちには + と − の はしが ある。LED は ながい あしを + に。
