          電気の 道が ひとまわりの 輪に なると、明かりが つきます。
          どこか 1 か所でも 切れていると、明かりは つきません。
          スイッチは、道を つないだり 切ったり する ものです。
        explain: |-
          乾電池の + から 出た 電気が、豆電球を 通って、− に 戻る ひとまわりの 道が できると、明かりが つきます。
          道が 切れていると、電気が 流れません。スイッチで 道を つなぐと 明かりが つきます。
        note: ひとまわりの輪で明かりがつく。切れているとつかない。スイッチでつなぐ。
