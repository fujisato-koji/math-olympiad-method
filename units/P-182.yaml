        text: 電気の 道が ひとまわりの 輪に なっている とき、明かりは どうなるかな。
        figure: 🔋💡
        choices: [つく, つかない, 光が 弱く なる, こわれる]
        answer: つく
        check: "'つく'"
        hints:
