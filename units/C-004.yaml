# C-004 道順を数える
#
# 段 2・水準 2・5 日。道を全部なぞって数える、マスに数を書きこんで数える（左と下を合わせる）、わけ、C-003（樹形図と表）と混ぜる、確認。
# 子の画面には text、svg、ヒントだけを出す。answer、check、paths、note、explain は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 日のねらい：1 日目 道を全部なぞって数える、2 日目 マスに数を書きこんで数える、3 日目 わけ、
#   4 日目 C-003 と混ぜる（必ず通るマス、町を通る道、カードの表）、5 日目 確認。
# 道はマスで描く。🏠 から 🏁 まで、となりのマスへ右か上に 1 マスずつ進む（碁盤の目の道の角をマスに置きかえたもの）。
# 図の約束（D-129）：マスは角の丸い四角。🌳 のマスは通れない、⭐ のマスは必ず通る。右下の 2 本の矢印は進めるむき（みぎ、うえ）。
#   なぞった道は太い色の線と三角の矢印で、下に「み う …」と書く。書きこむ図はマスに数字を書き、赤い ？ のマスが求めるマス。
#   色の丸は見るマス（赤はひだり、青はした）、× は通れないところ。⭐ で分けた前の道は赤、後ろの道は青の点線でかこむ。
#   町の道（🏠 → 🏪 → 🏫）は曲がった線で描き、本数は文に書かずに絵で数える。カードの表は、左に赤いカード、上に青いカード。
# 前提は C-003 までで、数は 10 まで（腕だめしの 1 問目は N-007 の 2 けたのたし算）。書きこみの「左と下を合わせる」は合わせて 10 まで。
# 町を通る道は樹形図で数える。かけ算（C-005 の積の法則）は使わない。
# check は、マスの図を文字列で書き（行は「/」で区切り、上の行から）、下から読んで（[::-1]）、上へ進む回を itertools.combinations で選び、通れる道を数える。
# 図の svg も同じ文字列から描いた（tools の外の下書きで作り、図と check が食い違わないようにした）。

