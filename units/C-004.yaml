        answer: 3
        check: "(lambda g: sum(1 for c in itertools.combinations(range(len(g[0]) + len(g) - 2), len(g) - 1) if all(g[sum(1 for i in c if i < k)][k - sum(1 for i in c if i < k)] != '🌳' for k in range(len(g[0]) + len(g) - 1))))(fig.splitlines()[::-1])"
