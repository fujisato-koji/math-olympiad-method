# C-004 道順を数える
#
# 書き方は N-001 の頭の注のとおり。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 道を全部なぞって数える、2 日目 マスに数を書きこんで数える（左と下を合わせる）、3 日目 わけ、
#   4 日目 C-003（樹形図と表）と混ぜる（必ず通るマス、町を通る道）、5 日目 確認。
# 道はマスで描く。🏠 から 🏁 まで、となりのマスへ右か上に 1 マスずつ進む（碁盤の目の道の角をマスに置きかえたもの）。
# 🌳 のマスは通れない。⭐ のマスは必ず通る。
# 書きこむ図はマスに全角の数字（１２３）を置き、□ が求めるマス。
# 前提は C-003 までで、数は 10 まで。書きこみの「左と下を合わせる」は、N-001 の「いくつといくつ」の範囲（合わせて 10 まで）にした。
# 町を通る道（🏠 → 🏪 → 🏫）は樹形図で数える。かけ算（C-005 の積の法則）は使わない。
# check は、図の行を下から読み（g は fig.splitlines()[::-1]）、上へ進む回を itertools.combinations で選んで、通れる道を数える。
# 書きこむ図は数字が入っているので、同じ形のマスの図を文字列で書き（行は「/」で区切る）、同じ式で数える。

id: C-004
days:
  - day: 1
    items:
      - part: 思い出す
        text: たべもの（🍞 🍙）を 1 つ、のみもの（🥛 🧃 🍵）を 1 つ えらびます。じゅけいずを かいて、くみあわせが なんとおりか こたえよう。
        figure: "🍞🍙\n🥛🧃🍵"
        answer: 6
        check: "len(set(itertools.product(fig.splitlines()[0], fig.splitlines()[1])))"
        hints:
          - ひだりに たべものを たてに かこう。
          - どの たべものからも、のみものの えだを のばそう。
          - えだの さきを ぜんぶ かぞえよう。
        paths:
          - [たべものを たてに かく, どれからも えだが 3 ぼん, えだの さきを かぞえて 6 とおり]
      - part: 思い出す
        text: あかい カードと あおい カードから 1 まいずつ ひきます。カードの かずは ひょうの とおりです（たてが あか、よこが あお）。あわせて 5 に なる ひきかたは なんとおり ありますか。
        figure: "　１２３\n１□□□\n２□□□\n３□□□"
        answer: 2
        check: "sum(1 for a in range(1, 4) for b in range(1, 4) if a + b == 5)"
        hints:
          - □ に、あわせた かずを かきこもう。
          - かきこんだ かずの なかから 5 を さがそう。
          - あかと あおを いれかえた ものは べつの ひきかただよ。
        paths:
          - [5 に なるのは あか 2 あお 3、あか 3 あお 2, 2 とおり]
      - part: 見本
        text: 🏠 から 🏁 まで、となりの マスへ みぎか うえに 1 マスずつ すすみます。いきかたを ぜんぶ さがそう。
        figure: "⬜🏁\n🏠⬜"
        explain: さきに みぎへ いって うえへ いく みちと、さきに うえへ いって みぎへ いく みちが あります。みちを 1 ぽんずつ ゆびで なぞり、なぞった みちを「みう」「うみ」（み は みぎ、う は うえ）と かいて おくと、もれも かさなりも なく かぞえられます。いきかたは 2 とおりです。
