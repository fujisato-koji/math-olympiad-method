# P-180 音
#
# 段 1・水準 1・4 日。ものが ふるえて 音が 出ること、ふるえが 空気や つくえや 糸を つたわること、大きい 音と 小さい 音・たかい 音と ひくい 音、糸でんわを あつかう。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 ふるえて 音が 出る・ふるえが つたわる（空気、つくえ）、2 日目 大きい 音と 小さい 音・たかい 音と ひくい 音、3 日目 わけ（糸でんわで こえが とどく わけ）、4 日目 確認。
# 図の約束：あかい ギザギザは「ふるえて いる」しるし（大きく ふるえる ほど 大きい ギザギザ）。そらいろの ゆみなりの せんは 空気を つたわる 音（くらべる 図では 大きい 音を 3 本、小さい 音を 1 本）。みどりの かみの きれが はねるのは、たいこの かわが ふるえて いる とき。くろい やじるしは、ふるえが すすむ むき。こたえを えらぶ えでは、あかい ギザギザを こたえの がわだけに つけない（ふくらんで 見える わゴム、はねる かみの きれで 見せる）。
# たかい 音・ひくい 音は「ふるえる ところが みじかい ほど たかい」の 1 つの きまりだけで 問う（もっきんの いた、つくえから はみ出す ものさし、ゆびで おさえた わゴム）。わゴムの ふとさ・はりかた、びんの 水の りょうは、ためしかたで 答えが かわるので 問わない。
# 腕だめし（離）は 2 問とも、絵を 読む 読み取り（kinds: 読み取り）。

id: P-180
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          たいこを たたくと、たいこの かわが ぶるぶる ふるえて、音が 出ます。
          その ふるえは、まわりの 空気を つたわって、耳に とどきます。
          えの あかい ギザギザは「ふるえて いる」しるしです。
          そらいろの せんは、空気を つたわる 音の しるしです。
