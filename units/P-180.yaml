        explain: |-
          「こえを 出すと のどが ふるえ、その ふるえが 空気を つたわって コップの そこを ふるわせる。コップの そこの ふるえは、ぴんと はった 糸を つたわって、むこうの コップの そこを ふるわせる。その ふるえが 空気を つたわって 耳に とどくので、こえが きこえる。」と いえれば よい。
          ① こえは ふるえ、② ふるえは コップの そこ → 糸 → むこうの コップと じゅんに つたわる、③ むこうの コップの ふるえが 耳に とどく、の 3 つが 入れば よい。糸が たるんで いたり、とちゅうを ゆびで つまんだり すると、ふるえが つたわらず きこえにくく なります。かみコップと たこ糸で いっしょに つくって ためすと よい。
