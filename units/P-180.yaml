        explain: |-
          音は、ものが ふるえる ことで 出ます。たいこを たたくと かわが ふるえ、その ふるえが まわりの 空気を つぎつぎに ゆらして、耳まで とどきます。ふるえが とまると、音も とまります。
          ふるえは 空気の ほかに、つくえのような かたい ものも つたわります。ぴんと はった 糸を つたわる ことは、3 日目の 糸でんわで あつかいます。
          きょうは「音が 出て いる ものは ふるえて いる」「ふるえは つたわって 耳に とどく」の 2 つが つかめれば よい。こえを 出しながら のどに 手を あてる、わゴムを はじいて 見る など、みの まわりの もので たしかめると よい。
