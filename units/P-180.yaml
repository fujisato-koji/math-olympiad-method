 x="280" y="208" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">たかい 音</text></svg>'
        explain: |-
          音の 大きさは、ふるえの 大きさで きまります。つよく たたいたり はじいたり すると 大きく ふるえて 大きい 音に、よわいと 小さく ふるえて 小さい 音に なります。
          音の たかさは、ふるえの はやさで きまります。みじかい いたや、つくえから はみ出す ところが みじかい ものさしは、はやく ふるえて たかい 音に なります。ながい ものは ゆっくり ふるえて ひくい 音に なります。
          「大きい・小さい」と「たかい・ひくい」は べつの ことです。つよく たたいても、おなじ いたの 音の たかさは かわりません。こどもは「大きい 音」と「たかい 音」を まぜやすいので、もっきんや ものさしで 1 つずつ ためすと よい。わゴムの ふとさや はりかた、びんに 入れた 水の りょうは、ためしかたで 音の かわりかたが ちがうので、ここでは あつかいません。
