# H-019 結晶と固体の構造（単位格子と充填、イオン結晶・金属結晶・分子結晶・共有結合の結晶）
#
# 水準 3・6 日。単位格子の球の数え方（角・面・中心・辺）、配位数と球のつまり方、イオン結晶（塩化ナトリウム型）、金属結晶・分子結晶・共有結合の結晶の見分け。結晶、配位数。
id: H-019
days:
  - day: 1
    items:
      - part: 見本
        id: "b8e9b3ac92"
        text: 結晶の中では、原子が同じならびをくり返している。そのくり返しの 1 つ分の立方体を、単位格子という。角にある球は、まわりの 8 こ の立方体で分け合うので、1 こ の立方体に入っているのは 8 分の 1 だけである。
