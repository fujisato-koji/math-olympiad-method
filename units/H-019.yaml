      - M⁺ の中心から X⁻ の中心までの長さが、2 つの半径の和になる。M⁺ の半径が出たら、球の体積の和を単位格子の体積でわり算しよう。
    paths:
      - [a = 2 × 1.414 × 100 ≈ 283（面の対角線 4 × 100 は a の √2 倍）、体の対角線の 4 分の 1 は √3 a / 4 ≈ 122.5, M⁺ の半径は 122.5 − 100 = 22.5, 球の体積の和は 4 × (4/3 × 3.14) × (100³ + 22.5³)、a³ でわり算して約 0.75 で 75 %]
      - [X⁻ 4 個の中心を結ぶと正四面体で、辺は 200, その中心から角までの長さは辺の √6 / 4 倍で 122.5, 半径は 22.5, X⁻ だけのしめる分は 74 % で、M⁺ の分の 4 × (4/3 × 3.14) × 22.5³ を足すと 約 75 %]
    note: S06 図形の移動と S25 三角比（体の対角線、正四面体）。G-021 の空間図形、H-019 の配位数とつまり方。種なし。なぜむずかしい：すきまの大きさを 2 つの別の図形（立方体の体の対角線と、正四面体）から出せることに気づき、さらに球の数を数えてしめる分まで 3 段の工夫がいる。
