        explain: イオン結晶は、プラスのイオンとマイナスのイオンが静電気の力で引き合ってできる。塩化ナトリウム型では Cl⁻ が面心立方格子の位置にあり、Na⁺ はそのすきまにある。辺の上のイオンは 4 こ の単位格子で共有される。
