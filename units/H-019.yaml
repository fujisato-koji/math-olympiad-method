  - day: 4
    items:
      - part: わけ
        text: 結晶は、つながり方で 4 つにわけられる。イオン結晶はイオンの引き合い、金属結晶は自由に動く電子、分子結晶は分子どうしの弱い引き合い、共有結合の結晶は原子の共有結合でできている。ある固体は、かたくてもろく、固体のままでは電気を通さないが、水にとかすと電気を通す。どの結晶か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="40" width="150" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="115" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">調べたこと</text><rect x="190" y="40" width="110" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="245" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">結果</text><rect x="40" y="66" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="115" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">かたさ</text><rect x="190" y="66" width="110" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">かたい</text><rect x="40" y="92" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="115" y="109.9" font-size="14" text-anchor="middle" fill="currentColor">たたく</text><rect x="190" y="92" width="110" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245" y="109.9" font-size="14" text-anchor="middle" fill="currentColor">われる</text><rect x="40" y="118" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="115" y="135.9" font-size="14" text-anchor="middle" fill="currentColor">固体で電気</text><rect x="190" y="118" width="110" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245" y="135.9" font-size="14" text-anchor="middle" fill="currentColor">通さない</text><rect x="40" y="144" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="115" y="161.9" font-size="14" text-anchor="middle" fill="currentColor">水にとかして電気</text><rect x="190" y="144" width="110" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245" y="161.9" font-size="14" text-anchor="middle" fill="currentColor">通す</text></svg>'
        choices: [イオン結晶, 金属結晶, 分子結晶, 共有結合の結晶]
        answer: イオン結晶
        check: "'イオン結晶'"
        explain: イオン結晶は、固体ではイオンが動けないので電気を通さないが、水にとかすとイオンが動けて電気を通す。金属結晶は固体でも自由電子で電気を通す。分子結晶は分子が電気を持たず、水にとかしても通らないものが多く、やわらかくてとけやすい。共有結合の結晶（ダイヤモンドなど）は非常にかたく、電気をほとんど通さない。
        hints:
          - 「固体のとき」と「水にとかしたとき」で、電気の通り方を分けて見る。
          - text: 固体のままで電気を通すのは、4 つのうち金属結晶だけである。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="40" width="150" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="105" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">結晶</text><rect x="180" y="40" width="120" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="240" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">固体で電気</text><rect x="30" y="66" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="105" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">イオン結晶</text><rect x="180" y="66" width="120" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="240" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">通らない</text><rect x="30" y="92" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="105" y="109.9" font-size="14" text-anchor="middle" fill="currentColor">金属結晶</text><rect x="180" y="92" width="120" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="240" y="109.9" font-size="14" text-anchor="middle" fill="currentColor">通る</text><rect x="30" y="118" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="105" y="135.9" font-size="14" text-anchor="middle" fill="currentColor">分子結晶</text><rect x="180" y="118" width="120" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="240" y="135.9" font-size="14" text-anchor="middle" fill="currentColor">通らない</text><rect x="30" y="144" width="150" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="105" y="161.9" font-size="14" text-anchor="middle" fill="currentColor">共有結合の結晶</text><rect x="180" y="144" width="120" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="240" y="161.9" font-size="14" text-anchor="middle" fill="currentColor">通らない</text></svg>'
          - 水にとかして電気を通すには、動ける電気のもとが水の中に出てくる必要がある。4 つの説明から、それが出てくるものをさがす。
        paths:
          - [固体で電気を通さないものを選ぶ, 金属結晶ではない, 水にとかして通るのは、イオンに分かれるイオン結晶]
          - [かたくてもろい性質から考える, 決まった位置のイオンが強く引き合い、ずれるとわれる, 電気の通り方も合うのはイオン結晶]
