    paths:
      - [単位格子の X は 4 こぶんで、体積は 4 × 48 / (6.0 × 10²³ × 5.0) = 6.4 × 10⁻²³ cm³、1 辺 a = 4.0 × 10⁻⁸ cm = 400 pm, 面の対角線は 4 r なので r = 1.41 × 400 / 4 = 141 pm, 6 こ にかこまれたすきまは辺にそって a / 2 − r = 200 − 141 = 59 pm、4 こ にかこまれたすきまは体の対角線の 4 分の 1 で 1.73 × 400 / 4 − 141 = 32 pm、Y（50 pm）が入るのは 6 こ のほうだけ, そのすきまは体の中心 1 こ と辺の中ほど 12 × 4 分の 1 = 3 こ で 4 こ ぶん, 単位格子の重さは 4 × 48 から 4 × 48 + 4 × 12 = 240 にふえ、体積は同じなので 5.0 × 240 / 192 = 6.25 g]
      - [a = 400 pm と r = 141 pm まで出す, 4 こ にかこまれたすきま（角と、となりの 3 つの面の中心の X がつくる正四面体の中心）から X の中心までは 1.73 × 400 / 4 = 173 pm で、すきまは 32 pm、Y は入らない, 6 こ にかこまれたすきまは 59 pm で Y が入り、その数は X の数と同じ 4 こ ぶん, 単位格子 1 こ の重さ (4 × 48 + 4 × 12) / (6.0 × 10²³) = 4.0 × 10⁻²² g を体積 6.4 × 10⁻²³ cm³ でわって 6.25 g]
    note: S19 長さの置きかえと S16 逆から考える（重さから辺、辺から半径、半径からすきま、すきまの数から重さへもどる）。H-015 の物質量、G-021 の空間図形、H-019 の面心立方格子と単位格子の数え方。種なし。なぜむずかしい：どのすきまかを文が言わないので、2 通りのすきまの場所と大きさを、辺の向きと体の対角線の向きの 2 つの見方で出してくらべ、入るほうのすきまを角・辺・中心の分け合いで数え、重さまでもどす必要がある。数えちがい（体の中心だけで 1 個、分け合いをわすれて 13 個、2 通りとも入れて 12 個）はどれも別の答えになる。
