        text: 結晶の中では、原子が同じならびをくり返している。そのくり返しの 1 つ分の立方体を、単位格子という。角にある球は、まわりの 8 個の立方体で分け合うので、1 個の立方体に入っているのは 8 分の 1 だけである。
