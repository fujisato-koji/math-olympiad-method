    text: マイナスのイオン X⁻ が面心立方格子にならび、そのすきまのうち、四面体の形のすきまの半分に陽イオン M⁺ が 1 つおきに入った結晶（ZnS 型）がある。X⁻ の半径を 100 とする。M⁺ はちょうど X⁻ 4 個の中心に入って X⁻ に接し、X⁻ どうしも面の対角線の向きに接している。M⁺ の半径を求め、単位格子の体積のうち、X⁻ と M⁺ の球がしめる分を、% で小数第 1 位までもとめて、いちばん近い整数で答えよ。円周率は 3.14 を使う。
