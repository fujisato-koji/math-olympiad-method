    text: ある金属 X は面心立方格子の結晶で、モルしつりょうが 48 g/mol、1 cm³ あたりの重さが 5.0 g である。X の原子は球で、となりの原子とふれている。X の原子のすきまには、6 こ の X にかこまれたすきまと、4 こ の X にかこまれたすきまの 2 通りがある。この結晶に、半径 50 pm、モルしつりょう 12 g/mol の原子 Y を、Y が入れられるすきまのすべてに 1 こずつ入れた。すきまの中心に置いた Y がまわりの X にめりこまないとき、Y はそのすきまに入れられる。Y を入れても、X の位置と単位格子の大きさは変わらない。できた結晶の 1 cm³ あたりの重さは何 g か。アボガドロ定数を 6.0 × 10²³ /mol、√2 を 1.41、√3 を 1.73 とし、1 pm は 10⁻¹⁰ cm とする。答えは小数第 2 位まで書く。
