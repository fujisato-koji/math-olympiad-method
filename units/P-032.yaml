# P-032 電流と磁場（電流のつくる磁場、ビオ＝サバールの法則、アンペールの法則、ローレンツ力、磁場中の荷電粒子のらせん運動とドリフト、磁気双極子、磁性体と磁化（常磁性、キュリーの法則））
#
# 水準 4・8 日。磁場の向きと強さ、直線電流と円電流の磁場、アンペールの法則と無限に長い導線とソレノイド、ローレンツ力と荷電粒子の円運動、らせん運動、磁気双極子と磁性体（常磁性）、電場と磁場の中のドリフトを扱う。
id: P-032
days:
  - day: 1
    items:
      - part: 見本
        text: 電流が流れる導線のまわりには、輪の形の磁場ができる。向きは右ねじの向きで、右手の親指を電流の向きに向けてにぎると、ほかの 4 本の指が回る向きが磁場の向き。強さの単位は T（テスラ）。電流 I [A] の長い導線から r [m] のところでは B = 2 × 10⁻⁷ × I / r。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="100" r="13" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="100" r="4" fill="currentColor"/><circle cx="160" cy="100" r="38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="167" y1="62" x2="161" y2="62" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="153,62 161,58 161,66" fill="currentColor"/><circle cx="160" cy="100" r="68" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="167" y1="32" x2="161" y2="32" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="153,32 161,28 161,36" fill="currentColor"/><text x="160" y="192" font-size="14" text-anchor="middle" fill="currentColor">電流は 手前向き</text><text x="262" y="36" font-size="14" text-anchor="middle" fill="currentColor">磁場の輪</text></svg>'
        explain: 無限に長い直線電流のまわりの磁場は、導線を中心とする同心円で、向きは右ねじの回る向き（電流が手前向きなら反時計回り）。強さは B = μ₀ I / (2π r) で、μ₀ = 4π × 10⁻⁷ を使うと B = 2 × 10⁻⁷ × I / r になる。導線からの長さに反比例し、電流に比例する。
      - part: 今日
        text: 導線に電流が手前向きに流れている。点 P の磁場は、図の上下左右のどの向きか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="13" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="100" r="4" fill="currentColor"/><circle cx="220" cy="100" r="5" fill="currentColor"/><text x="220" y="84" font-size="14" text-anchor="middle" fill="currentColor">P</text><text x="150" y="150" font-size="14" text-anchor="middle" fill="currentColor">電流（手前向き）</text></svg>'
        choices: [上, 下, 左, 右]
        answer: 上
        check: "'上'"
        hints:
          - 右手の親指を電流の向きに合わせたとき、4 本の指がどう回るかを見よう。
          - text: 導線を中心にした輪の上に P がある。磁場はこの輪にそって進む。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="13" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="100" r="4" fill="currentColor"/><circle cx="150" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="220" cy="100" r="5" fill="currentColor"/><text x="220" y="84" font-size="14" text-anchor="middle" fill="currentColor">P</text><circle cx="220" cy="100" r="18" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - 輪の回る向きは、時計のはりと反対。P のところで、その輪が上と下のどちらへ進むかを考える。
        paths:
          - [右手の親指を手前に向ける, 4 本の指は反時計回りに回る, 導線の右側では 回る向きが上向き]
          - [輪の接線で考える, 反時計回りの輪では 右のはしで上へ進む, 磁場は上向き]
      - part: 今日
