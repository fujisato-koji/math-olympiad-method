        check: "'電荷の正負が変わると、電場の力も磁場の力も向きが反対になり、つり合いは保たれるから'"
        explain: 電荷 q が受ける力は、電場の力 q E と磁場の力 q v B の和。どちらも q に比例するので、q のプラスとマイナスが変わると 2 つとも向きが反対になるだけで、大きさのつり合い q E = q v B（v = E / B）は変わらない。q も m も式から消えるため、速さ E / B の粒子だけを通す速さをえらぶ道具（速度せんたく器）になる。電場と磁場が直角にある場所では、まっすぐ進めるかどうかは速さだけで決まる。
        hints:
