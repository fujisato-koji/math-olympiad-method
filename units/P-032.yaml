      - 粒の動きを、じくの方向と、じくに直角な面の 2 つに分けて見よう。じくに直角な面では、粒はどんな運動をしているか。
      - text: 直角な面では、O を通る円運動。じくの方向は、一定の速さ v × cosθ で進む。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="46.2" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="78.8" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="111.2" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="143.8" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="176.2" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="208.8" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="241.2" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="273.8" cy="100" rx="11.4" ry="40" fill="none" stroke="currentColor" stroke-width="2"/><line x1="20" y1="100" x2="300" y2="100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="40" cy="100" r="5" fill="currentColor"/><polyline points="40,100 43.3,94.3 46.7,89 50,84.4 53.3,80.9 56.7,78.7 60,78 63.3,78.7 66.7,80.9 70,84.4 73.3,89 76.7,94.3 80,100 83.3,105.7 86.7,111 90,115.6 93.3,119.1 96.7,121.3 100,122 103.3,121.3 106.7,119.1 110,115.6 113.3,111 116.7,105.7 120,100 123.3,94.3 126.7,89 130,84.4 133.3,80.9 136.7,78.7 140,78 143.3,78.7 146.7,80.9 150,84.4 153.3,89 156.7,94.3 160,100 163.3,105.7 166.7,111 170,115.6 173.3,119.1 176.7,121.3 180,122 183.3,121.3 186.7,119.1 190,115.6 193.3,111 196.7,105.7 200,100" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="100" r="16" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="40" y="126" font-size="14" text-anchor="middle" fill="currentColor">O</text><text x="150" y="190" font-size="14" text-anchor="middle" fill="currentColor">一周の時間は θ によらない</text></svg>'
      - 円運動で O にもどってくるのは、ちょうど何周かしたとき。一周の時間 T を出してから、あなに着くまでの時間が T の何倍になれるか考えよう。
    paths:
      - [じくに直角な面での一周の時間 T は 2π × 重さ ÷（電気 × 磁場）で θ によらない, じくにもどるのは n 周したときで、6 m = n × v × T × cosθ, cosθ が 1/2 以上 1 以下になる n は 10 から 19 の 10 個、θ = 0° は円運動がなく じく上をまっすぐ進んで いつも通るので 1 つたして 11 通り]
      - [あなに着くまでの時間は 6 ÷（v × cosθ）、θ = 0° のとき最短、60° のとき最長, この時間が T の整数倍になる, 最短と最長の間にある T の整数倍は 10 倍から 19 倍の 10 個、θ = 0° は まっすぐ進んで いつも通るので 1 つたして 11 通り]
    note: S32 周期性、S07 極端な場合（0° と 60°）、S25 ベクトル（速度の分解）、S05 数え方の工夫。種なし。一周の時間は角度によらない、じくにもどるのは整数周のとき、整数 n の範囲を数える、θ = 0° は直進で いつも通ると気づく、の 3 段。θ ごとにためすと終わらない。
