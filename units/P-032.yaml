        explain: ローレンツ力は F = q v × B（外積）。右手で v から B へ指を回すと親指が正電荷の力の向き。F は v に直角なので仕事をせず、速さは変わらず向きだけ変わる。B が v に直角なら、向心力 q v B = m v² / r から円運動になり、半径 r = m v / (q B)、周期 T = 2π m / (q B) は速さによらない。
