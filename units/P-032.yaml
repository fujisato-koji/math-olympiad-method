  - day: 3
    items:
      - part: 見本
        text: 道 C を 1 周して、道にそった磁場の成分をたした数は、C の中を通りぬける電流の和の μ₀ 倍になる（アンペールの法則）。長い直線電流では、円の道を使うと B × 2π r = μ₀ I。ソレノイド（導線をコイルの形にまいたもの）の内側の磁場は一様で、1 m あたりの回数を n とすると B = μ₀ n I。μ₀ = 4π × 10⁻⁷。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="167" y1="30" x2="161" y2="30" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="153,30 161,26 161,34" fill="currentColor"/><circle cx="160" cy="100" r="13" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="100" r="4" fill="currentColor"/><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">道 C は電流を 1 回かこむ</text><text x="250" y="40" font-size="14" text-anchor="middle" fill="currentColor">C</text></svg>'
        explain: アンペールの法則は ∮ B・dl = μ₀ I（C をつらぬく電流の和）。直線電流では、まわりのようすが導線を中心に回しても同じなので、円の道 C 上で B の大きさが一定で、向きも C にそう。だからB × 2π r = μ₀ I から B = μ₀ I / (2π r)。ソレノイドは長方形の道をとると、内側の辺だけが B × L に効き、外側の磁場は 0 とみなせるので B L = μ₀ n L I より B = μ₀ n I。電流の向きは右ねじで数え、手前向きを + とすれば逆向きは −。
      - part: 今日
        text: 点線の道 C は、3 本の導線のうち 2 本をかこんでいる。手前向きの電流を + として、C の中を通りぬける電流の和は何 A か。C を 1 周した磁場の成分の和は μ₀ にこの数をかけたものになる。
