        text: 磁場の中で動く電荷 q は、磁場にそって動くのでなければ力を受ける。これがローレンツ力で、速さ v が磁場に直角のとき F = q v B。力の向きは、速さの向きにも磁場の向きにも直角。たとえば正の電荷が右へ進み、磁場がおく向きなら、力は上向き。負の電荷なら下向き。
