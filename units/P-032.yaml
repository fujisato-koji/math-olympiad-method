        answer: 1 × 10⁻⁴ T
        check: "'1 × 10⁻⁴ T'"
        hints:
          - 円の道の長さは 2π r。B は μ₀ I をその長さでわったもの。
          - text: μ₀ / 2π は 4π × 10⁻⁷ / 2π で、π が約分される。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="100" r="13" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="110" cy="100" r="4" fill="currentColor"/><circle cx="110" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="190" cy="100" r="5" fill="currentColor"/><text x="190" y="84" font-size="14" text-anchor="middle" fill="currentColor">P</text><circle cx="190" cy="100" r="18" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
