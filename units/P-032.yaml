    items:
      - part: 見本
        text: 電流 I が面積 S の小さな輪を流れると、輪は小さな磁石のようにはたらく。この強さを磁気モーメントといい、m = I S（回数が N なら N I S）。向きは右ねじで、反時計回りなら手前向き。磁場 B の中では、m と B の間の角を θ として、輪を回そうとする力のはたらき（トルク）τ = m B sinθ を受ける。原子も小さな磁石で、磁場の中でそれが向きをそろえて物体に磁化 M ができるものを、常磁性体という。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="100" r="46" fill="none" stroke="currentColor" stroke-width="2"/><line x1="118" y1="54" x2="112" y2="54" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="102,54 112,49 112,59" fill="currentColor"/><circle cx="110" cy="100" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="110" cy="100" r="2" fill="currentColor"/><text x="110" y="168" font-size="14" text-anchor="middle" fill="currentColor">輪 = 小さな磁石</text><line x1="200" y1="130" x2="270" y2="130" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="280,130 270,135 270,125" fill="currentColor"/><text x="240" y="150" font-size="14" text-anchor="middle" fill="currentColor">磁場 B</text><line x1="200" y1="130" x2="242.9" y2="87.1" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,80 246.5,90.6 239.4,83.5" fill="currentColor"/><text x="246" y="70" font-size="14" text-anchor="middle" fill="currentColor">m</text></svg>'
        explain: 電流の輪の磁気モーメントは m = N I S（向きは面に直角で右ねじの向き）。磁場中では一様な B から受ける力はつり合うが、輪の両側の力が組になって回すので、トルクは τ = m B sinθ。θ = 90° で最大、0° と 180° では 0。原子も電子の運動やスピンのために磁気モーメントをもち、これが磁性のもとになる。
