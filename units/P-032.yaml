  - day: 2
    items:
      - part: 見本
        text: 電流の小さな部分がつくる磁場は、その部分の電流の大きさに比例し、そこまでの長さの 2 乗に反比例する（ビオ＝サバールの法則）。これをたすと、円形の電流の中心の磁場は B = 2π × 10⁻⁷ × I / R（R は円の半径）。向きは、電流の回る向きに右手の指をまげたときの親指の向き。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="2"/><line x1="168" y1="38" x2="162" y2="38" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="152,38 162,33 162,43" fill="currentColor"/><circle cx="160" cy="100" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="160" cy="100" r="2" fill="currentColor"/><line x1="160" y1="100" x2="222" y2="100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><text x="192" y="94" font-size="14" text-anchor="middle" fill="currentColor">R</text><text x="160" y="188" font-size="14" text-anchor="middle" fill="currentColor">電流が反時計回りなら、中心の磁場は手前向き</text></svg>'
        explain: ビオ＝サバールの法則は dB = (μ₀ / 4π) I dl sinθ / r²。円電流では中心まで どの部分も r = R で、dl と r が直角なので sinθ = 1 となり、円周 2πR をたすと B = μ₀ I / (2R) = 2π × 10⁻⁷ × I / R。向きは右ねじの法則で、電流が反時計回りなら円の面に直角で手前向き。
      - part: 今日
        text: 円形の導線に、図のように時計回りに電流が流れている。中心 P の磁場の向きは。
