        text: 長い直線電流 15 A から 0.03 m はなれた点の磁場の強さを、アンペールの法則 B × 2π r = μ₀ I（μ₀ = 4π × 10⁻⁷）で求めよう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="100" r="13" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="110" cy="100" r="4" fill="currentColor"/><circle cx="110" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="190" cy="100" r="5" fill="currentColor"/><text x="190" y="84" font-size="14" text-anchor="middle" fill="currentColor">P</text><text x="110" y="150" font-size="14" text-anchor="middle" fill="currentColor">15 A</text><text x="150" y="124" font-size="14" text-anchor="middle" fill="currentColor">0.03 m</text></svg>'
