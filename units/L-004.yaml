      - part: 挑戦
        text: のこりが 3 こで、あなたの ばんです。あいても いちばん よい とりかたを します。あなたは かてますか。
        figure: 🍬🍬🍬
        choices: [かてる, かてない]
        answer: かてない
        check: "(lambda W: 'かてる' if W(W, n('🍬')) else 'かてない')(lambda f, m: any(not f(f, m - k) for k in (1, 2) if k <= m))"
        hints:
          - 1 こ とると、のこりは いくつかな。そのとき あいては どう するかな。
          - 2 こ とると、のこりは いくつかな。そのとき あいては どう するかな。
          - どちらを とっても、さいごの 1 こを とるのは だれかな。
        paths:
          - [1 こ とると のこり 2 こ → あいてが 2 こ とって かつ, 2 こ とると のこり 1 こ → あいてが とって かつ, かてない]
        note: 「あいても いちばん よい とりかたを する」と かんがえる ことが だいじ。あめや おはじきで じっさいに ためすと わかりやすい。
