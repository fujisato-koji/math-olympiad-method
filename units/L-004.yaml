        answer: 4
        check: "Fraction(fig.split('─')[0]) + fig.split('─').index('🐸') + 3"
        hints:
          - 🐸 は いま どの かずに いるかな。
          - みぎへ ひとつずつ とんでみよう。
          - 3 かい とんだ ところの かずを よもう。
        paths:
          - [🐸 は 1, 2、3、4 と 3 かい とぶ, 4]
          - [1 + 3, 4]
