        figure: 🍬🍬🍬🍬🍬🍬🍬🍬🍬
        answer: 6
        check: "n('🍬') - 3"
        hints:
          - たべた 3 こを、ゆびで かくしてみよう。
          - かくれて いない あめを かぞえよう。
          - 9 から 3 つ もどる と かんがえても いいよ。
        paths:
          - [9 − 3, 6 こ]
          - [9 から 8、7、6 と 3 つ もどる, 6 こ]
