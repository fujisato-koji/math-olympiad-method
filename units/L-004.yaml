# L-004 取り合いゲーム
#
# 書き方は N-001 の頭の注のとおり。段 2 なので、子に見せる文は ひらがなと カタカナの 分かち書き。
# ゲームは「あめを ふたりで こうたいに とる。1 かいに 1 こか 2 こ（3 日目からは 1〜3 こも）。さいごの 1 こを とった ほうが かち」。
# 前提は N-003（10 までの たし算と ひき算）なので、あめは 10 こまで。のこりの けいさんは 1 かいずつ、10 までの ひき算で する。
# 日の並びは地図の既定（導入、練習、練習、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：きまりを知る。とると のこりは いくつか。のこりが 1 こ、2 こ なら かてる。のこり 3 こで じぶんの ばんだと かてない。
#   2 日目 練習：のこりを 3 こに して あいてに わたせば かてる。かつ とりかたを さがす（のこり 4 こ、5 こ）。
#   3 日目 練習：あいてと あわせて 3 こ（1〜3 こ とれる ときは 4 こ）に なるように とる。
#   4 日目 わけ：のこり 3 こで わたせば かてる わけ、あわせて 3 こに すると 3 こずつ へる わけ、1〜3 こなら 4 こに する わけ。
#   5 日目 混ぜる：N-003 の たし算・ひき算、数直線で もどる と まぜる。さいごを とると まけ の きまりも 1 問。
#   6 日目 確認。
# 勝ちの位置と負けの位置を後ろから表にして、いろいろな ゲームの必勝法を見つける方法は L-010（後ろから考える必勝法）で扱う。
# ここでは、のこりが 5 こまでを ためして調べることと、「あわせて 3（4）」の とりかたまでにする。
# check の W は、のこりが m こで じぶんの ばんの とき かてるかを、すべての とりかたを ためして決める（W(W, m)、
# とれる かずは (1, 2) か (1, 2, 3)。さいごを とると まけ の ときは m == 0 で かち）。

id: L-004
days:
  - day: 1
    items:
      - part: 見本
        text: あめとり ゲームの きまりを しろう。
        figure: 🍬🍬🍬🍬🍬
        explain: ふたりで こうたいに、あめを 1 こか 2 こ とります。さいごの 1 こを とった ほうが かち です。たとえば 5 こから、あなたが 2 こ とると のこり 3 こ。あいてが 1 こ とると のこり 2 こ。あなたが 2 こ とって さいごの あめを とったので、あなたの かち です。
      - part: 思い出す
