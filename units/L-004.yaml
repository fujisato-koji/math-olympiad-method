        text: あめ 10 こから はじめました。あなたが 2 こ、あいてが 1 こ、あなたが 2 こ、あいてが 2 こ とりました。のこりは なんこですか。
        figure: 🍬🍬🍬🍬🍬🍬🍬🍬🍬🍬
        answer: 3
        check: "n('🍬') - 2 - 1 - 2 - 2"
        hints:
          - 1 かい とる たびに、のこりを かいて いこう。
          - 10 から 2 こ とると、のこりは いくつかな。
          - そこから 1 こ、2 こ、2 こと じゅんに へらそう。
        paths:
