        id: "d8a3b134a3"
        text: 放物線 y = x² − 4x + 7 の頂点の y 座標はいくつですか。
        answer: 3
        check: '(lambda f: f(2))(lambda x: x * x - 4 * x + 7)'
        hints:
          - x の係数 −4 の半分を使って平方完成しましょう。
          - text: x の係数を半分にして 2 乗した数が、(x − 2)² で足される数です（図）。
            svg: <svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="48" width="84" height="40" rx="8" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="54" y="74" font-size="16" text-anchor="middle" fill="currentColor">−4</text><rect x="118" y="48" width="84" height="40" rx="8" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="160" y="74" font-size="16" text-anchor="middle" fill="currentColor">−2</text><rect x="224" y="48" width="84" height="40" rx="8" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="266" y="74" font-size="16" text-anchor="middle" fill="currentColor">4</text><text x="54" y="36" font-size="13" text-anchor="middle" fill="currentColor">x の係数</text><polygon points="118,68 110,72 110,64" fill="#f08080"/><line x1="96" y1="68" x2="110" y2="68" stroke="#f08080" stroke-width="3"/><text x="107" y="40" font-size="13" text-anchor="middle" fill="currentColor">半分</text><polygon points="224,68 216,72 216,64" fill="#f08080"/><line x1="202" y1="68" x2="216" y2="68" stroke="#f08080" stroke-width="3"/><text x="213" y="40" font-size="13" text-anchor="middle" fill="currentColor">2 乗</text><text x="160" y="126" font-size="15" text-anchor="middle" fill="currentColor">(x − 2)² = x² − 4x + 4</text></svg>
          - y = (x − p)² + q の q を読みましょう。
        paths:
          - [y = (x − 2)² − 4 + 7 = (x − 2)² + 3, 頂点の y 座標は 3]
