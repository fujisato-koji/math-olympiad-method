    note: たての線分 PQ で 2 つに分けると、面積 = (1/2) × 横のはば × PQ になる（G-008 の三角形の面積を 2 つ足す）という見方がかぎ。底辺 AB を固定して高さを最大にする（点と直線のきょり）道もあるが、たてに切れば 2 次関数の最大の問題になる。P の位置は t = 1/2 で、図の P とはちがう。
