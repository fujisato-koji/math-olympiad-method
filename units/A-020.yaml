218" y="60" font-size="13" text-anchor="middle" fill="currentColor">260</text><rect x="238" y="40" width="28" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="252" y="60" font-size="13" text-anchor="middle" fill="currentColor">…</text><rect x="266" y="40" width="40" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="286" y="60" font-size="13" text-anchor="middle" fill="currentColor">?</text><rect x="14" y="70" width="104" height="30" fill="#c8ccd6" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="66" y="90" font-size="13" text-anchor="middle" fill="currentColor">売れる数（個）</text><rect x="118" y="70" width="40" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="138" y="90" font-size="13" text-anchor="middle" fill="currentColor">180</text><rect x="158" y="70" width="40" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="178" y="90" font-size="13" text-anchor="middle" fill="currentColor">174</text><rect x="198" y="70" width="40" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="218" y="90" font-size="13" text-anchor="middle" fill="currentColor">168</text><rect x="238" y="70" width="28" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="252" y="90" font-size="13" text-anchor="middle" fill="currentColor">…</text><rect x="266" y="70" width="40" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="286" y="90" font-size="13" text-anchor="middle" fill="currentColor">?</text></svg>
      - 売り上げ ＝ 値段 × 売れる数 をてんかいして、n の 2 次関数にしよう。
      - 平方完成して、売り上げがいちばん多くなる n を求めよう。
    paths:
      - [n 回上げると値段は (240 + 10n) 円で売れる数は (180 − 6n) 個, 売り上げは (240 + 10n)(180 − 6n) = −60n² + 360n + 43200, = −60(n − 3)² + 43740, n = 3 で最大なので値段は 270 円]
      - [(240 + 10n)(180 − 6n) = 60(24 + n)(30 − n), (24 + n) + (30 − n) = 54 で和が一定なので、2 つが等しく 27 のとき積が最大, n = 3 で値段は 270 円]
    note: 値段そのものを x 円とおくと、売れる数が 180 − 6(x − 240)/10 となって式が重くなる。上げる回数を文字にするのが読み取りのかぎ。問われているのは売り上げの額（43740 円）ではなく値段であることも確かめさせる。
