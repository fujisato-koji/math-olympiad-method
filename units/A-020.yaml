    items:
      - part: 思い出す
        text: 放物線 y = x² − 4x + 7 の頂点の y 座標はいくつですか。
        answer: 3
        check: "(lambda f: f(2))(lambda x: x * x - 4 * x + 7)"
        hints:
          - x の係数 −4 の半分を使って平方完成しましょう。
          - (x − 2)² を展開すると、x² − 4x に何が足されるでしょう。
          - y = (x − p)² + q の q を読みましょう。
