        explain: 例：「y = x² のグラフの上の点を (s, s²) とする（s はどんな数でもよい）。この点を x 軸方向に p だけ動かした点は (s + p, s²) である。X = s + p とおくと s = X − p なので、この点の y 座標は s² = (X − p)² となり、点 (X, (X − p)²) は y = (x − p)² のグラフの上にある。逆に、y = (x − p)² のグラフの上の点 (X, (X − p)²) は、s = X − p とおくと、y = x² の上の点 (s, s²) を x 軸方向に p だけ動かした点である。よって、y = x² のグラフを x 軸方向に p だけ動かすと、y = (x − p)² のグラフにちょうど重なる。」と書ければよい。①「〜とする」で点 (s, s²) を決める、② 動かした点の座標を X で表す（s = X − p と式を変形する）、③ 約束した事実（点がグラフの上にあることと、座標が式を満たすことは同じ、A-019）で結ぶ、の 3 つがそろっているかを見る。逆の向き（グラフのどの点も移動で得られる）まで書けていればなおよい。「x − p だから左へ動く」というまちがいは、x = p のとき (x − p)² = 0 になる、つまり頂点が x = p にあることで正せる、と話す。y 軸方向の平行移動（+ q を足す）は、A-019 の直線のときと同じすじみちである。
