        text: 放物線 y = ax² + bx + c（a は 0 でない数）の軸は、直線 x = −b/(2a) です（図）。このわけを、すじみちを立てて書きましょう。
        svg: <svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="168" x2="300" y2="168" stroke="currentColor" stroke-width="2"/><polygon points="306,168 297,172.5 297,163.5" fill="currentColor"/><text x="308" y="173" font-size="15" text-anchor="start" fill="currentColor" font-style="italic">x</text><polyline points="70,40 74,47.8 78,55.4 82,62.6 86,69.4 90,76 94,82.2 98,88.2 102,93.8 106,99 110,104 114,108.6 118,113 122,117 126,120.6 130,124 134,127 138,129.8 142,132.2 146,134.2 150,136 154,137.4 158,138.6 162,139.4 166,139.8 170,140 174,139.8 178,139.4 182,138.6 186,137.4 190,136 194,134.2 198,132.2 202,129.8 206,127 210,124 214,120.6 218,117 222,113 226,108.6 230,104 234,99 238,93.8 242,88.2 246,82.2 250,76 254,69.4 258,62.6 262,55.4 266,47.8 270,40" fill="none" stroke="currentColor" stroke-width="2.5"/><line x1="170" y1="18" x2="170" y2="176" stroke="#f08080" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="170" cy="140" r="6" fill="#f08080"/><text x="178" y="30" font-size="14" text-anchor="start" fill="currentColor">軸 x = −b/(2a)</text><text x="10" y="24" font-size="14" text-anchor="start" fill="currentColor">y = ax² + bx + c</text></svg>
        explain: 例：「a は 0 でない数とする。x² と x の項を a でくくると、y = a(x² + (b/a)x) + c である（a は 0 でないので、a でわってよい）。乗法公式（A-015）より (x + b/(2a))² = x² + (b/a)x + b²/(4a²) なので、x² + (b/a)x = (x + b/(2a))² − b²/(4a²) である。よって y = a(x + b/(2a))² − b²/(4a) + c となり、これは y = a(x − p)² + q の形で、p = −b/(2a) である。y = a(x − p)² + q のグラフは頂点が (p, q)、軸が直線 x = p の放物線なので（1 日目、わけの 2 問目）、軸は直線 x = −b/(2a) である。」と書ければよい。①「〜とする」で a を決める（a が 0 でないことを、くくるところで使う）、② a でくくって平方完成する、③ 約束した事実（乗法公式、平行移動の結果）で結ぶ、の 3 つがそろっているかを見る。b/a の半分が b/(2a) になること、−b²/(4a²) に a をかけて −b²/(4a) になることの計算でつまずきやすい。y = 2x² − 12x + 7 なら −(−12)/(2 × 2) = 3 で、2 日目の答えと合うことを確かめさせる。
        hints:
          - x² と x の項を a でくくりましょう。
          - text: かっこの中の x² + (b/a)x は、b/a の半分を使って平方完成します（図）。
            svg: <svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="48" width="84" height="40" rx="8" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="54" y="74" font-size="16" text-anchor="middle" fill="currentColor">b/a</text><rect x="118" y="48" width="84" height="40" rx="8" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="160" y="74" font-size="16" text-anchor="middle" fill="currentColor">b/(2a)</text><rect x="224" y="48" width="84" height="40" rx="8" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="266" y="74" font-size="14" text-anchor="middle" fill="currentColor">b²/(4a²)</text><text x="54" y="36" font-size="13" text-anchor="middle" fill="currentColor">x の係数</text><polygon points="118,68 110,72 110,64" fill="#f08080"/><line x1="96" y1="68" x2="110" y2="68" stroke="#f08080" stroke-width="3"/><text x="107" y="40" font-size="13" text-anchor="middle" fill="currentColor">半分</text><polygon points="224,68 216,72 216,64" fill="#f08080"/><line x1="202" y1="68" x2="216" y2="68" stroke="#f08080" stroke-width="3"/><text x="213" y="40" font-size="13" text-anchor="middle" fill="currentColor">2 乗</text><text x="160" y="126" font-size="14" text-anchor="middle" fill="currentColor">(x + b/(2a))² = x² + (b/a)x + b²/(4a²)</text></svg>
