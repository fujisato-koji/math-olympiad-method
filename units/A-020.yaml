        text: 2 次関数 y = 2x² + 4x − 1 の最小値はいくつですか。
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(min((lambda x: 2 * x * x + 4 * x - 1)(Fraction(k, 10)) for k in range(-100, 101)))"
        hints:
