    note: 縦の線分 PQ で 2 つに分けると、面積 = (1/2) × 横の幅 × PQ になる（G-008 の三角形の面積を 2 つ足す）という見方が鍵。底辺 AB を固定して高さを最大にする（点と直線の距離）道もあるが、縦に切れば 2 次関数の最大の問題になる。P の位置は t = 1/2 で、図の P とはちがう。
  - part: 離
    kinds: [道筋]
    text: a を定数とします。2 次関数 y = x² − 2ax + 3 で、x の変域が 0 ≦ x ≦ 2 のときの最小値が −6 になるとき、a はいくつですか。
    answer: 13/4
    accept: [3.25]
    check: "[a for a in [Fraction(k, 4) for k in range(-40, 41)] if min((lambda x: x * x - 2 * a * x + 3)(Fraction(j, 100)) for j in range(0, 201)) == -6][0]"
    hints:
      - 平方完成すると、軸は x = a だね。
      - 軸が変域の左の外、変域の中、変域の右の外の 3 つに分けて、それぞれの最小値を a で表そう。
      - それぞれの場合で出た a が、その場合の範囲に入っているかを確かめよう。
    paths:
      - [y = (x − a)² + 3 − a² で軸は x = a, a が 0 以下なら最小値は x = 0 での 3 で −6 にならない, a が 0 と 2 の間なら最小値は 3 − a² で 3 − a² = −6 より a = ±3 だが範囲に合わない, a が 2 以上なら最小値は x = 2 での 7 − 4a で 7 − 4a = −6 より a = 13/4 で範囲に合う]
    note: 軸が動く場合分けの問題。a = 3 を答えにしやすいが、a = 3 なら軸は変域の右の外で、最小値は x = 2 での −5 になる。場合ごとに出た値をその場合の範囲で確かめる習慣をつけさせる。
  - part: 離
    kinds: [読み取り, 手数]
    text: ある店では、1 個 240 円の品物が 1 日に 180 個売れます。値段を 10 円上げるごとに、1 日に売れる数が 6 個ずつ減ります。値段を 10 円きざみで決めるとき、1 日の売り上げがいちばん多くなる値段は何円ですか。
    answer: 270
    check: "max(range(0, 31), key=lambda n: (240 + 10 * n) * (180 - 6 * n)) * 10 + 240"
    hints:
      - 値段を 10 円上げる回数を n 回として、値段と売れる数を n の式で表そう。
      - 売り上げ ＝ 値段 × 売れる数 を展開して、n の 2 次関数にしよう。
      - 平方完成して、売り上げがいちばん多くなる n を求めよう。
    paths:
      - [n 回上げると値段は (240 + 10n) 円で売れる数は (180 − 6n) 個, 売り上げは (240 + 10n)(180 − 6n) = −60n² + 360n + 43200, = −60(n − 3)² + 43740, n = 3 で最大なので値段は 270 円]
    note: 値段そのものを x 円とおくと、売れる数が 180 − 6(x − 240)/10 となって式が重くなる。上げる回数を文字にするのが読み取りの鍵。問われているのは売り上げの額（43740 円）ではなく値段であることも確かめさせる。
