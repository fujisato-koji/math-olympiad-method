        id: "e797d17b20"
        text: x² + 6x に 9 を足すと、1 辺が x + 3 の正方形になります（図）。だから x² + 6x = (x + 3)² − 9 です。y = x² + 6x + 5 = (x + 3)² − 4 と変えると、頂点 (−3, −4) がわかります。この変形を平方完成といいます。
        svg: <svg viewBox="0 0 320 214" xmlns="http://www.w3.org/2000/svg"><rect x="34" y="34" width="88" height="88" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><rect x="122" y="34" width="36" height="88" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="34" y="122" width="88" height="36" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="122" y="122" width="36" height="36" fill="#f08080" fill-opacity="0.55" stroke="#f08080" stroke-width="2.5" stroke-dasharray="5 3"/><text x="78" y="84" font-size="18" text-anchor="middle" fill="currentColor">x²</text><text x="140" y="83" font-size="14" text-anchor="middle" fill="currentColor">3x</text><text x="78" y="145" font-size="14" text-anchor="middle" fill="currentColor">3x</text><text x="140" y="145" font-size="15" text-anchor="middle" fill="currentColor">9</text><text x="78" y="25" font-size="15" text-anchor="middle" fill="currentColor" font-style="italic">x</text><text x="140" y="25" font-size="15" text-anchor="middle" fill="currentColor">3</text><text x="25" y="83" font-size="15" text-anchor="end" fill="currentColor" font-style="italic">x</text><text x="25" y="145" font-size="15" text-anchor="end" fill="currentColor">3</text><text x="180" y="66" font-size="16" text-anchor="start" fill="currentColor">x² + 6x</text><text x="180" y="96" font-size="14" text-anchor="start" fill="currentColor">に 9 を足すと</text><text x="180" y="126" font-size="16" text-anchor="start" fill="currentColor">(x + 3)²</text><text x="160" y="202" font-size="15" text-anchor="middle" fill="currentColor">x² + 6x = (x + 3)² − 9</text></svg>
        explain: 乗法公式 (x + m)² = x² + 2mx + m²（A-015）を逆に使います。図のように、x² + 6x は、1 辺 x の正方形と、たて 3・横 x の長方形 2 つでできています。角に 3 × 3 = 9 を足すと 1 辺 x + 3 の正方形になるので、x² + 6x = (x + 3)² − 9 です。よって y = x² + 6x + 5 = (x + 3)² − 9 + 5 = (x + 3)² − 4 で、頂点は (−3, −4)、軸は直線 x = −3 です。x の係数 6 の半分の 3 を使い、その 2 乗の 9 をひくのがこつです。x の係数が負のときも同じで、x² − 6x = (x − 3)² − 9 です。このように、ax² + bx + c を a(x − p)² + q の形に変えることを平方完成といいます（A-017 で 2 次方程式を解いたときと同じ変形です）。x² の係数が 1 でないときは、x² と x の項をその係数でくくってから平方完成します。y = 2x² + 8x + 3 = 2(x² + 4x) + 3 = 2((x + 2)² − 4) + 3 = 2(x + 2)² − 8 + 3 = 2(x + 2)² − 5 で、頂点は (−2, −5) です。くくった 2 を −4 にもかけるのをわすれないようにします。最後に、x = 0 を代入して元の定数項（5 や 3）にもどるかを確かめるとよいです。
