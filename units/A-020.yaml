        explain: y が x の 2 次式 y = ax² + bx + c（a は 0 でない数）で表されるとき、「y は x の 2 次関数である」といいます。いちばんかんたんな y = x² では、x = −2、−1、0、1、2 のとき y = 4、1、0、1、4 で、点をなめらかに結ぶと ① の曲線になります。この形の曲線を放物線といいます。放物線は 1 本の直線について対称で、その直線を軸、軸と放物線の交わる点を頂点といいます。y = x² の頂点は原点、軸は y 軸（直線 x = 0）です。y = ax² のグラフは、a が正なら下に凸（谷の形）、a が負なら上に凸（山の形）の放物線で、a の絶対値が大きいほど開き方がせまくなります。次に ② の y = (x − 2)² + 1 を考えます。x = t + 2 のとき (x − 2)² = t² なので、y = x² のグラフの点 (t, t²) を右へ 2、上へ 1 動かした点 (t + 2, t² + 1) が ② の上にあります。つまり ② は、① を x 軸方向に 2、y 軸方向に 1 だけ平行移動した放物線で、頂点は (2, 1)、軸は直線 x = 2 です。いっぱんに、y = a(x − p)² + q のグラフは、y = ax² のグラフを x 軸方向に p、y 軸方向に q だけ平行移動した放物線で、頂点は (p, q)、軸は直線 x = p です（わけは 4 日目）。x − 2 の「−」につられて左へ動かさないように気をつけます。x = 2 のとき (x − 2)² = 0 になるので、頂点の x 座標は 2 です。
