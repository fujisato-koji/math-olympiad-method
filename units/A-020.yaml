        id: "8be3cd276c"
        text: 放物線 y = 2(x + 3)² − 5 の頂点はどれですか。
        choices:
          - (−3, −5)
          - (3, −5)
          - (−3, 5)
          - (3, 5)
        answer: (−3, −5)
