        answer: y = (x − 2)² + 5
        check: "[c for c, f in {'y = (x − 2)² + 5': lambda x: (x - 2) ** 2 + 5, 'y = (x + 2)² + 5': lambda x: (x + 2) ** 2 + 5, 'y = (x − 2)² + 13': lambda x: (x - 2) ** 2 + 13, 'y = (x − 4)² − 7': lambda x: (x - 4) ** 2 - 7}.items() if all(f(x) == x * x - 4 * x + 9 for x in range(-6, 7))][0]"
