        explain: 乗法公式 (x + m)² = x² + 2mx + m²（A-015）を逆に使います。x² − 6x は、x の係数 −6 の半分 −3 を使った (x − 3)² = x² − 6x + 9 より 9 だけ小さいので、x² − 6x = (x − 3)² − 9 です。よって y = x² − 6x + 5 = (x − 3)² − 9 + 5 = (x − 3)² − 4 で、頂点は (3, −4)、軸は直線 x = 3 です。このように、ax² + bx + c を a(x − p)² + q の形に変えることを平方完成といいます（A-017 で 2 次方程式を解いたときと同じ変形です）。x² の係数が 1 でないときは、x² と x の項をその係数でくくってから平方完成します。y = 2x² + 8x + 3 = 2(x² + 4x) + 3 = 2((x + 2)² − 4) + 3 = 2(x + 2)² − 8 + 3 = 2(x + 2)² − 5 で、頂点は (−2, −5) です。くくった 2 を −4 にもかけるのを忘れないようにします。最後に、x = 0 を代入して元の定数項（5 や 3）にもどるかを確かめるとよいです。
