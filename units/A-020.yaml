,85.5" fill="none" stroke="#7fc8f8" stroke-width="2.5"/><circle cx="244" cy="124" r="4.5" fill="#f08080"/><text x="290" y="120" font-size="14" text-anchor="start" fill="currentColor">1 個</text><text x="290" y="138" font-size="13" text-anchor="start" fill="currentColor">b² − 4ac = 0</text><line x1="206" y1="192" x2="282" y2="192" stroke="currentColor" stroke-width="2"/><polyline points="220,152.8 222,155.9 224,158.7 226,161.2 228,163.5 230,165.5 232,167.2 234,168.7 236,169.9 238,170.8 240,171.5 242,171.9 244,172 246,171.9 248,171.5 250,170.8 252,169.9 254,168.7 256,167.2 258,165.5 260,163.5 262,161.2 264,158.7 266,155.9 268,152.8" fill="none" stroke="#7fc8f8" stroke-width="2.5"/><text x="290" y="188" font-size="14" text-anchor="start" fill="currentColor">0 個</text><text x="290" y="206" font-size="13" text-anchor="start" fill="currentColor">b² − 4ac &lt; 0</text></svg>
        explain: 平方完成すると y = (x − 2)² − 3 で、頂点は (2, −3) です。変域 0 ≦ x ≦ 5 の中に軸 x = 2 があるので、実線の部分でいちばん低い点は頂点で、最小値は −3（x = 2 のとき）です。いちばん高い点は、変域の端のうち軸から遠いほうです。軸から x = 0 までは 2、x = 5 までは 3 はなれているので、x = 5 のときの y = 25 − 20 + 1 = 6 が最大値です。下に凸の放物線では、軸から遠いほど y が大きくなるからです（わけは 4 日目）。変域がないときは、最小値は −3 で、最大値はありません。軸が変域の外にあるときは、変域の両端で最大と最小になります。次に、放物線と x 軸の共有点は y = 0 となる点なので、2 次方程式 −x² + 2x + 3 = 0 を解きます。x² − 2x − 3 = 0、(x − 3)(x + 1) = 0 で x = 3、−1 なので、共有点は (3, 0) と (−1, 0) の 2 つです。ax² + bx + c = 0 の実数の解の個数は b² − 4ac の符号で決まるので（A-017）、放物線 y = ax² + bx + c と x 軸の共有点の個数も、b² − 4ac が正なら 2 個、0 なら 1 個（x 軸に接する）、負なら 0 個です。
