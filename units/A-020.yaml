        explain: y が x の 2 次式 y = ax² + bx + c（a は 0 でない数）で表されるとき、「y は x の 2 次関数である」といいます。いちばん簡単な y = x² では、x = −2、−1、0、1、2 のとき y = 4、1、0、1、4 で、点をなめらかに結ぶと ① の曲線になります。この形の曲線を放物線といいます。放物線は 1 本の直線について対称で、その直線を軸、軸と放物線の交わる点を頂点といいます。y = x² の頂点は原点、軸は y 軸（直線 x = 0）です。y = ax² のグラフは、a が正なら下に凸（谷の形）、a が負なら上に凸（山の形）の放物線で、a の絶対値が大きいほど開き方がせまくなります。次に ② の y = (x − 2)² + 1 を考えます。x = t + 2 のとき (x − 2)² = t² なので、y = x² のグラフの点 (t, t²) を右へ 2、上へ 1 動かした点 (t + 2, t² + 1) が ② の上にあります。つまり ② は、① を x 軸方向に 2、y 軸方向に 1 だけ平行移動した放物線で、頂点は (2, 1)、軸は直線 x = 2 です。一般に、y = a(x − p)² + q のグラフは、y = ax² のグラフを x 軸方向に p、y 軸方向に q だけ平行移動した放物線で、頂点は (p, q)、軸は直線 x = p です（わけは 4 日目）。x − 2 の「−」につられて左へ動かさないように気をつけます。x = 2 のとき (x − 2)² = 0 になるので、頂点の x 座標は 2 です。
      - part: 思い出す
        text: 直線 y = 2x − 3 を、y 軸の向きに 5 だけ平行に動かした直線の上で、x 座標が 3 の点の y 座標はいくつですか。
        answer: 8
        check: "2 * 3 - 3 + 5"
        hints:
          - y 軸の向きに動かすと、同じ x での y の値はどう変わるでしょう（A-019）。
          - 動かした直線の式を、y = ax + b の形で書きましょう。
          - x = 3 を代入しましょう。
        paths:
          - [動かした直線は y = 2x + 2, x = 3 を代入, y = 6 + 2 = 8]
      - part: 思い出す
        text: 方程式 (x − 3)² = 16 の解のうち、大きいほうはいくつですか。
        answer: 7
        check: "max(x for x in range(-30, 31) if (x - 3) ** 2 == 16)"
        hints:
          - x − 3 は、2 乗すると 16 になる数です（A-017）。
          - 2 乗すると 16 になる数は 2 つあります。
          - x − 3 = (その数) を、それぞれ解きましょう。
        paths:
          - [x − 3 = ±4, x = 7 または x = −1, 大きいほうは 7]
      - part: 今日
        text: 放物線 y = 2(x + 3)² − 5 の頂点はどれですか。
        choices:
          - (−3, −5)
          - (3, −5)
          - (−3, 5)
          - (3, 5)
        answer: (−3, −5)
        check: "[c for c, (p, q) in {'(−3, −5)': (-3, -5), '(3, −5)': (3, -5), '(−3, 5)': (-3, 5), '(3, 5)': (3, 5)}.items() if (lambda f: f(p) == q and all(f(p + t) == f(p - t) for t in range(1, 6)))(lambda x: 2 * (x + 3) ** 2 - 5)][0]"
        hints:
          - y = a(x − p)² + q の形と見くらべましょう。
          - x + 3 は、x − (−3) と書けます。
          - 頂点は (p, q) です。
        paths:
          - ["2(x + 3)² − 5 = 2(x − (−3))² + (−5)", p = −3、q = −5, "頂点は (−3, −5)"]
        note: x + 3 を見て p = 3 としやすい。x = −3 のとき (x + 3)² = 0 になることで確かめさせる。
      - part: 今日
        text: 放物線 y = −x² を、x 軸方向に 1、y 軸方向に 4 だけ平行移動した放物線の式はどれですか。
        choices: [y = −(x − 1)² + 4, y = −(x + 1)² + 4, y = −(x − 1)² − 4, y = (x − 1)² + 4]
        answer: y = −(x − 1)² + 4
        check: "[c for c, f in {'y = −(x − 1)² + 4': lambda x: -(x - 1) ** 2 + 4, 'y = −(x + 1)² + 4': lambda x: -(x + 1) ** 2 + 4, 'y = −(x − 1)² − 4': lambda x: -(x - 1) ** 2 - 4, 'y = (x − 1)² + 4': lambda x: (x - 1) ** 2 + 4}.items() if all(f(t + 1) == -t * t + 4 for t in range(-5, 6))][0]"
        hints:
          - もとの放物線の頂点 (0, 0) は、どこへ動くでしょう。
          - 平行移動しても、x² の係数（開き方と向き）は変わりません。
          - 頂点が (p, q) の放物線は y = a(x − p)² + q です。
        paths:
          - ["\"頂点 (0, 0) は (1, 4) へ動く\"", "x² の係数は −1 のまま", "y = −(x − 1)² + 4"]
        note: 右へ 1 動かすのに x + 1 と書きやすい。x² の係数の符号（上に凸）を落とすまちがいもある。
      - part: 挑戦
        text: 放物線 y = x² を x 軸方向に p だけ平行移動すると、点 (1, 9) を通ります。p が正の数のとき、p はいくつですか。
        answer: 4
        check: "[p for p in range(1, 31) if (1 - p) ** 2 == 9][0]"
        hints:
          - 移動した放物線の式を、p を使って表しましょう。
          - x = 1、y = 9 を代入して、p の方程式をつくりましょう。
          - 2 乗すると 9 になる数は 2 つあります。p が正のものを選びましょう。
        paths:
          - [移動した放物線は y = (x − p)², 9 = (1 − p)², 1 − p = ±3, p = −2 または 4 で 正のものは 4]
        note: p = −2（左へ 2 動かす）でも点を通るが、正の数という条件で除く。2 つの答えのうち条件に合うものを選ぶ練習。
