      - part: 今日
        text: 頂点が (1, −2) で、点 (−1, 10) を通る放物線の x² の係数はいくつですか。
        answer: 3
        check: "[a for a in range(-20, 21) if a * (-1 - 1) ** 2 - 2 == 10][0]"
        hints:
          - 頂点が (p, q) の放物線は y = a(x − p)² + q とおけます。
          - y = a(x − 1)² − 2 に、通る点の座標を代入しましょう。
          - できた a の 1 次方程式を解きましょう。
        paths:
          - [y = a(x − 1)² − 2, 10 = a(−2)² − 2, 4a = 12, a = 3]
      - part: わけ
        text: a が正の数のとき、2 次関数 y = a(x − p)² + q の最小値は q（x = p のとき）です。このわけを、筋道を立てて書きましょう。
        explain: 例：「x をどんな数でもよいとする。y − q = a(x − p)² である。x − p は正の数か 0 か負の数で、0 でない数の 2 乗は正の数（N-027）、0 の 2 乗は 0 なので、(x − p)² は 0 か正の数である。a は正の数なので、a(x − p)² も 0 か正の数になる（正の数 × 正の数は正、正の数 × 0 は 0）。よって y は、q に 0 か正の数を足した数なので、q より小さくならない。また、x = p のとき (x − p)² = 0 なので y = q になる。したがって、y の最小値は q（x = p のとき）である。」と書ければよい。①「〜とする」で x を決める、② y − q = a(x − p)² と式を見る、③ 約束した事実（2 乗は 0 か正、《正負の数》のかけ算の符号）で結ぶ、の 3 つがそろっているかを見る。「q より小さくならない」だけで終わらず、x = p で q になる（最小値をとる x がある）ことまで書けているかも見る。a が負なら、同じ筋道で y は q から 0 か正の数をひいた数になり、最大値が q になることに触れる。軸からのはなれ方 x − p が大きいほど (x − p)² も大きくなるので、変域の端のうち軸から遠いほうで最大になることも、この式から読める（3 日目の見本）。
        hints:
          - x をどんな数でもよいとして、y − q を式で表しましょう。
          - (x − p)² は、負の数になることがありますか。
          - y = q になるのは、x がいくつのときでしょう。
        paths:
          - [x をどんな数でもよいとする, y − q = a(x − p)², (x − p)² は 0 か正で a は正なので y − q は 0 か正, x = p で y = q となるので最小値は q]
      - part: わけ
        text: 放物線 y = (x − p)² は、放物線 y = x² を x 軸方向に p だけ平行移動したものです。このわけを、筋道を立てて書きましょう。
        explain: 例：「y = x² のグラフの上の点を (s, s²) とする（s はどんな数でもよい）。この点を x 軸方向に p だけ動かした点は (s + p, s²) である。X = s + p とおくと s = X − p なので、この点の y 座標は s² = (X − p)² となり、点 (X, (X − p)²) は y = (x − p)² のグラフの上にある。逆に、y = (x − p)² のグラフの上の点 (X, (X − p)²) は、s = X − p とおくと、y = x² の上の点 (s, s²) を x 軸方向に p だけ動かした点である。よって、y = x² のグラフを x 軸方向に p だけ動かすと、y = (x − p)² のグラフにちょうど重なる。」と書ければよい。①「〜とする」で点 (s, s²) を決める、② 動かした点の座標を X で表す（s = X − p と式を変形する）、③ 約束した事実（点がグラフの上にあることと、座標が式を満たすことは同じ、A-019）で結ぶ、の 3 つがそろっているかを見る。逆の向き（グラフのどの点も移動で得られる）まで書けていればなおよい。「x − p だから左へ動く」というまちがいは、x = p のとき (x − p)² = 0 になる、つまり頂点が x = p にあることで正せる、と話す。y 軸方向の平行移動（+ q を足す）は、A-019 の直線のときと同じ筋道である。
        hints:
          - y = x² のグラフの上の点を (s, s²) とおきましょう。
          - その点を x 軸方向に p 動かした点の座標を書きましょう。
          - 動かした点の x 座標を X として、y 座標を X の式で表しましょう。
        paths:
          - ["\"y = x² の上の点を (s, s²) とする\"", "\"動かした点は (s + p, s²)\"", "X = s + p とおくと s² = (X − p)²", "動かした点は y = (x − p)² の上にある"]
      - part: わけ
        text: 放物線 y = ax² + bx + c（a は 0 でない数）の軸は、直線 x = −b/(2a) です。このわけを、筋道を立てて書きましょう。
        explain: 例：「a は 0 でない数とする。x² と x の項を a でくくると、y = a(x² + (b/a)x) + c である（a は 0 でないので、a でわってよい）。乗法公式（A-015）より (x + b/(2a))² = x² + (b/a)x + b²/(4a²) なので、x² + (b/a)x = (x + b/(2a))² − b²/(4a²) である。よって y = a(x + b/(2a))² − b²/(4a) + c となり、これは y = a(x − p)² + q の形で、p = −b/(2a) である。y = a(x − p)² + q のグラフは頂点が (p, q)、軸が直線 x = p の放物線なので（1 日目、わけの 2 問目）、軸は直線 x = −b/(2a) である。」と書ければよい。①「〜とする」で a を決める（a が 0 でないことを、くくるところで使う）、② a でくくって平方完成する、③ 約束した事実（乗法公式、平行移動の結果）で結ぶ、の 3 つがそろっているかを見る。b/a の半分が b/(2a) になること、−b²/(4a²) に a をかけて −b²/(4a) になることの計算でつまずきやすい。y = 2x² − 12x + 7 なら −(−12)/(2 × 2) = 3 で、2 日目の答えと合うことを確かめさせる。
        hints:
          - x² と x の項を a でくくりましょう。
          - かっこの中の x² + (b/a)x を、b/a の半分を使って平方完成しましょう。
          - できた式を、y = a(x − p)² + q と見くらべましょう。
        paths:
          - [y = a(x² + (b/a)x) + c, = a(x + b/(2a))² − b²/(4a) + c, p = −b/(2a) なので軸は直線 x = −b/(2a)]
    extra:
      - part: 今日
        text: 放物線 y = x² + 6x + 2 の軸はどれですか。
        choices: [直線 x = −3, 直線 x = 3, 直線 x = −6, 直線 x = 6]
        answer: 直線 x = −3
        check: "[c for c, p in {'直線 x = −3': -3, '直線 x = 3': 3, '直線 x = −6': -6, '直線 x = 6': 6}.items() if all((lambda x: x * x + 6 * x + 2)(p + t) == (lambda x: x * x + 6 * x + 2)(p - t) for t in range(1, 6))][0]"
        hints:
          - 平方完成しましょう。
          - x の係数 6 の半分を使います。
          - y = (x − p)² + q の軸は直線 x = p です。
        paths:
