        explain: 例：「x をどんな数でもよいとする。y − q = a(x − p)² である。x − p は正の数か 0 か負の数で、0 でない数の 2 乗は正の数（N-027）、0 の 2 乗は 0 なので、(x − p)² は 0 か正の数である。a は正の数なので、a(x − p)² も 0 か正の数になる（正の数 × 正の数は正、正の数 × 0 は 0）。よって y は、q に 0 か正の数を足した数なので、q より小さくならない。また、x = p のとき (x − p)² = 0 なので y = q になる。したがって、y の最小値は q（x = p のとき）である。」と書ければよい。①「〜とする」で x を決める、② y − q = a(x − p)² と式を見る、③ 約束した事実（2 乗は 0 か正、《正負の数》のかけ算の符号）で結ぶ、の 3 つがそろっているかを見る。「q より小さくならない」だけで終わらず、x = p で q になる（最小値をとる x がある）ことまで書けているかも見る。a が負なら、同じすじみちで y は q から 0 か正の数をひいた数になり、最大値が q になることにふれる。軸からのはなれ方 x − p が大きいほど (x − p)² も大きくなるので、変域の端のうち軸から遠いほうで最大になることも、この式から読める（3 日目の見本）。
