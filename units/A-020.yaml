      - part: 今日
        id: "ab32a806ed"
        text: まわりの長さが 24 cm の長方形（図。正方形もふくめます）のうち、面積がいちばん大きいものの面積は何 cm² ですか。
        svg: <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="104" y="44" width="160" height="100" fill="#7bc96f" fill-opacity="0.3" stroke="currentColor" stroke-width="2.5"/><text x="92" y="99" font-size="15" text-anchor="end" fill="currentColor">たて x cm</text><text x="184" y="30" font-size="15" text-anchor="middle" fill="currentColor">横 ? cm</text><text x="184" y="100" font-size="15" text-anchor="middle" fill="currentColor">面積</text><text x="184" y="182" font-size="15" text-anchor="middle" fill="currentColor">まわり 24 cm</text></svg>
        answer: 36
        check: max(x * (12 - x) for x in [Fraction(k, 10) for k in range(0, 121)])
        hints:
          - text: まわりが同じでも、形で面積が変わります（図）。たてを x cm とすると、横は何 cm でしょう。
            svg: <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="51" y="134" width="110" height="22" fill="#7bc96f" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="45" y="150" font-size="14" text-anchor="end" fill="currentColor">2 cm</text><text x="106" y="126" font-size="14" text-anchor="middle" fill="currentColor">10 cm</text><text x="106" y="150" font-size="14" text-anchor="middle" fill="currentColor">20 cm²</text><rect x="201" y="112" width="88" height="44" fill="#7bc96f" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="195" y="139" font-size="14" text-anchor="end" fill="currentColor">4 cm</text><text x="245" y="104" font-size="14" text-anchor="middle" fill="currentColor">8 cm</text><text x="245" y="139" font-size="14" text-anchor="middle" fill="currentColor">32 cm²</text><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">どちらもまわりは 24 cm</text></svg>
          - 面積を x の 2 次関数で表しましょう。
          - 平方完成して、最大値を求めましょう。
        paths:
          - [たてを x cm とすると横は (12 − x) cm, y = x(12 − x) = −(x − 6)² + 36, 最大値は 36 cm²]
