# A-020 2 次関数と平方完成
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 8 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：2 次関数、y = x² と y = ax² のグラフ（放物線、軸、頂点、凸の向き）、y = a(x − p)² + q は y = ax² の平行移動、頂点と軸。
#   2 日目：平方完成（x² の係数が 1 のとき、1 でないとき）で頂点を求める。
#   3 日目：最大・最小（変域なし、変域つき）、x 軸との共有点とその個数（b² − 4ac の符号、A-017）。
#   4 日目：わけ（3 問とも ③：a が正なら最小値は q、x 軸方向の平行移動、軸の式 x = −b/(2a)）。
#   5 日目：A-017、A-019 と混ぜる（直線との共有点、面積や高さの最大、2 点から式を決める）。6 日目：確認。
# 前提は A-017（2 次方程式）、A-019（1 次関数とグラフ）。たどると A-011、A-012、A-015、A-016、N-027 まで使える。
#   不等式の性質（A-013）は前提のたどりにないので、2 次不等式は扱わず、変域は「0 ≦ x ≦ 5」の書き方を読むだけにした。
#   最小値のわけも、不等式の性質を使わず「0 以上の数を q に足す」と、正負の数のかけ算（N-027）で書く。
#   y = ax²（2 乗に比例する関数）を受け持つ単元が地図にないので、1 日目の見本で y = x² の表から入れた。
#   3 点を通る放物線（3 元の連立方程式）は扱わず、式を決める問題は、頂点と 1 点か、定数項がわかっていて 2 点の形にした。
#   2 次関数のグラフと x 軸の共有点の x 座標の和や積（解と係数の関係、A-026）は使わない。
# グラフは svg で描く（方眼の 1 めもり、原点 O、軸に矢印。放物線は 120 区間の折れ線）。答えの頂点や値は図に書かない。
#   変域つきの図は、変域の外を点線、中を実線にした。見本の 2 つのグラフは ①、② の印で式と結ぶ。
# 答えは数を打つ。頂点・軸・式は choices。頂点の check は、その点で式の値が q になり、x = p の左右で値が等しいかで調べる。
#   式を選ぶ check は、選択肢ごとの式（lambda）が、元の式や移動した点、図の格子点とどの x でも合うかで選ぶ。
#   最大・最小の check は、変域を 1/10 や 1/100 きざみにして min、max をとる（端と頂点がきざみの上にあるようにした）。
# 2 次関数は、指数・対数（D-001）、2 次曲線（G-041）、凸性（A-028）、物の投げ上げ（P の流れ）、最適化（K の流れ）の入口になる（D-026）。

