# G-021 空間図形
#
# 書き方は N-001 の頭の注のとおり。答えの形と √ の check は A-016、G-019 に合わせる。
# ことば：空間の 2 直線の位置関係（平行、交わる、ねじれの位置）、直線と平面の垂直・平行、2 つの平面の垂直・平行、
#   角錐・円錐、母線、球、回転体（平面の図形を、直線 ℓ を軸として 1 回転させてできる立体）、投影図（立面図と平面図）、
#   正多面体、相似な立体（相似比、表面積の比、体積の比）。
# 直方体の頂点の名前は G-014 と同じ（上の面 ABCD、下の面 EFGH。A が手前の左、A の真下が E）。三角柱は ABC-DEF（A の真下が D）、
#   正四角錐は O-ABCD（M は底面の対角線の交点）。
# 円周率は π と書く。G-010、G-011 の「□ × 円周率」と同じく、かける計算を最後まで残し、「□π cm³」の □ の数を答える。
# 前提は G-019（三平方の定理）と G-014（立体の切断）。前提の道に G-011（体積と表面積）、G-010（円とおうぎ形）、G-020（相似）、
#   A-016（平方根）、A-009（累乗）、A-010（文字と式）がある。G-011 で扱わなかった角錐・円錐・球の体積と球の表面積はここで約束する：
#   角錐・円錐の体積 = 底面積 × 高さ × 1/3（立方体を合同な 3 つの四角錐に分けると、その四角錐で確かめられる）、
#   球の体積 = 4/3 × π × 半径³、球の表面積 = 4 × π × 半径²。一般の角錐の 1/3 と球の式のわけ（切り口の面積が等しい立体の体積、
#   積分）は、前提の道具では示せないので約束にした。わけの日は、直方体の対角線、円錐の展開図の中心角、相似な立体の体積の比を示す。
# 方程式（A-011）は前提の道にないので、母線や高さを方程式で求める問題は出さず、三平方の定理と「2 乗すると ○ になる正の数」で求める。
# ねじれの位置などの位置関係は、図の上で線が交わって見えるかではなく、同じ平面の上にあるかで決める。
# 図は svg（D-040）。見取り図は斜めから見た図で、見えない辺は点線。長さの比はおおよそ合わせた。回転の軸 ℓ は一点鎖線。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 空間の直線と平面の位置関係、回転体、投影図　2 日目 角錐・円錐・球の体積、球と円錐の表面積（展開図）
#   3 日目 三平方の定理を空間へ（直方体の対角線、円錐と正四角錐の高さ、展開図で最短の長さ）、相似な立体の体積の比
#   4 日目 わけ（直方体の対角線、円錐の展開図の中心角、相似な立体の体積の比）
#   5 日目 G-014（切断）・G-011（体積・表面積）・G-019 と混ぜる、回転体の体積、正多面体の頂点の数　6 日目 確認
# check：ねじれの位置の辺の数は、頂点の座標から 2 直線が同じ平面の上にないか（三重積が 0 でないか）を数える式。
#   垂直・平行な面は、面の法線と辺の向きをくらべる式。切り口の形は G-014 と同じ式（geo_g11/mf.py の SEC と SHAPE）。
#   体積と表面積は π をのぞいた数の式（Fraction）。√ を含む答えは choices にし、math.isclose で選ぶ。
#   回転体や投影図から立体の名前を選ぶ問題は約束ごとなので check を付けない。
# 空間図形は、空間座標とベクトル（G-049）、結晶と分子の形（H-019、H-018）、CAD と図面（E-204）、球充填（G-048）、
#   オイラーの多面体定理から位相幾何学への入口になる（D-026）。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-011 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

