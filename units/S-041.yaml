        text: ある機械でつめるふくろの重さは、標準偏差 5 g でばらつくことが分かっています。無作為に 100 ふくろを選んで量ると、標本平均は 251.2 g でした。この機械でつめるふくろ全体の平均（母平均）m を推定してみましょう。
