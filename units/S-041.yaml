ight="55" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="223" y="170" font-size="12" text-anchor="middle" fill="currentColor">11</text><text x="223" y="245" font-size="12" text-anchor="middle" fill="currentColor">4</text><rect x="247" y="200" width="26" height="30" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="260" y="195" font-size="12" text-anchor="middle" fill="currentColor">6</text><text x="260" y="245" font-size="12" text-anchor="middle" fill="currentColor">5</text><rect x="284" y="160" width="26" height="70" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="297" y="155" font-size="12" text-anchor="middle" fill="currentColor">14</text><text x="297" y="245" font-size="12" text-anchor="middle" fill="currentColor">6</text><line x1="94" y1="180" x2="304" y2="180" stroke="#3d8fd1" stroke-width="2" stroke-dasharray="6 4"/><text x="10" y="176" font-size="12" text-anchor="start" fill="#3d8fd1">期待される</text><text x="10" y="192" font-size="12" text-anchor="start" fill="#3d8fd1">回数 10</text><text x="84" y="245" font-size="12" text-anchor="end" fill="currentColor">目</text></svg>'
        explain: (1) 母標準偏差 σ が分からないときは、標本の偏差の 2 乗の合計を n − 1 でわった数（不偏分散）の正の平方根 s を代わりに使います。T = (標本平均 − m) ÷ (s/√n) は、自由度 n − 1 の t 分布という分布にしたがいます。t 分布は正規分布より山のすそが厚く、95 % の境目は自由度 15 で 2.131（正規分布の 1.96 より大きい）です。母平均の 95 % 信頼区間は、標本平均 ± 2.131 × s/√n となり、σ が分かっているときより広くなります。(2) 表のように、実際の回数（観測度数）と、仮定（どの目も 1/6）から期待される回数（期待度数）のずれを、χ² = (観測度数 − 期待度数)² ÷ 期待度数 をすべての目についてたした数で表します。この例では (4 + 4 + 1 + 1 + 16 + 16) ÷ 10 = 4.2 です。仮定が正しいとき、χ² は自由度（区分の数 − 1 = 5）の χ² 分布にしたがい、5 % の境目は 11.07 です。4.2 は境目より小さいので、仮定をすてません。境目より大きいと、仮定をすてます（χ² 検定）。
