      - part: 挑戦
        id: "784b46dc20"
        text: 25 個の標本で、標準偏差が 5 だとします。母標準偏差が 5 と分かっているときの信頼区間（1.96 を使う）と、標本から求めた s = 5 を使うときの信頼区間（自由度 24 の境目 2.064 を使う）では、95 % 信頼区間のはばはどれだけちがいますか。
        svg: '<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg"><text x="12" y="28" font-size="13" text-anchor="start" fill="currentColor">σ = 5 が分かっている（1.96）</text><line x1="16" y1="44" x2="304" y2="44" stroke="currentColor" stroke-width="1.2"/><line x1="65" y1="44" x2="255" y2="44" stroke="#3d8fd1" stroke-width="5"/><line x1="65" y1="35" x2="65" y2="53" stroke="#3d8fd1" stroke-width="2.5"/><line x1="255" y1="35" x2="255" y2="53" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="44" r="4.5" fill="#e06666" stroke="none"/><text x="12" y="90" font-size="13" text-anchor="start" fill="currentColor">s = 5 を使う（2.064）</text><line x1="16" y1="106" x2="304" y2="106" stroke="currentColor" stroke-width="1.2"/><line x1="60" y1="106" x2="260" y2="106" stroke="#3d8fd1" stroke-width="5"/><line x1="60" y1="97" x2="60" y2="115" stroke="#3d8fd1" stroke-width="2.5"/><line x1="260" y1="97" x2="260" y2="115" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="106" r="4.5" fill="#e06666" stroke="none"/><line x1="65" y1="44" x2="65" y2="112" stroke="#e06666" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="255" y1="44" x2="255" y2="112" stroke="#e06666" stroke-width="1.2" stroke-dasharray="3 3"/><text x="260" y="128" font-size="12" text-anchor="middle" fill="#e06666">ちがい ?</text></svg>'
        answer: 0.208
        check: "(lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)(2 * (Fraction('2.064') - Fraction('1.96')) * Fraction(5, 5))"
        hints:
          - どちらも、はばは 2 × (境目の数) × 5/√25 です。
          - 5/√25 を求めましょう。
          - text: 2 つのはばを求めて、差を出しましょう。
            svg: '<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg"><text x="12" y="28" font-size="13" text-anchor="start" fill="currentColor">はば = 2 × 1.96 × 5/√25</text><line x1="16" y1="44" x2="304" y2="44" stroke="currentColor" stroke-width="1.2"/><line x1="65" y1="44" x2="255" y2="44" stroke="#3d8fd1" stroke-width="5"/><line x1="65" y1="35" x2="65" y2="53" stroke="#3d8fd1" stroke-width="2.5"/><line x1="255" y1="35" x2="255" y2="53" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="44" r="4.5" fill="#e06666" stroke="none"/><text x="12" y="90" font-size="13" text-anchor="start" fill="currentColor">はば = 2 × 2.064 × 5/√25</text><line x1="16" y1="106" x2="304" y2="106" stroke="currentColor" stroke-width="1.2"/><line x1="60" y1="106" x2="260" y2="106" stroke="#3d8fd1" stroke-width="5"/><line x1="60" y1="97" x2="60" y2="115" stroke="#3d8fd1" stroke-width="2.5"/><line x1="260" y1="97" x2="260" y2="115" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="106" r="4.5" fill="#e06666" stroke="none"/></svg>'
        paths:
          - [5/√25 = 1, はばは 2 × 2.064 = 4.128 と 2 × 1.96 = 3.92, 4.128 − 3.92 = 0.208]
          - [左右のはしは、それぞれ (2.064 − 1.96) × 1 = 0.104 ずつ外に出る, 0.104 × 2 = 0.208]
        note: σ が分からないぶん、t 分布を使う区間は広くなる。標本が大きくなると、t 分布の境目は 1.96 に近づく。

