        explain: 図のように、平均 m を中心に左右対称な山の形で、曲線の下の面積が確率を表す分布を正規分布といい、N(m, σ²) と書きます（σ は標準偏差）。X が N(m, σ²) にしたがうとき、Z = (X − m) ÷ σ（標準化）とおくと、Z は平均 0、標準偏差 1 の標準正規分布 N(0, 1) にしたがいます（わけは 4 日目）。Z が 0 から z までの値をとる確率 P(0 ≦ Z ≦ z) を並べた表を正規分布表といいます。75 点は Z = (75 − 60) ÷ 10 = 1.5 なので、P(X ≧ 75) = P(Z ≧ 1.5) = 0.5 − P(0 ≦ Z ≦ 1.5) = 0.5 − 0.4332 = 0.0668 で、およそ 6.7 % です（曲線の右半分の面積が 0.5）。P(−1 ≦ Z ≦ 1) はおよそ 0.68、P(−2 ≦ Z ≦ 2) はおよそ 0.95、P(−1.96 ≦ Z ≦ 1.96) は 0.95 です。また、二項分布 B(n, p) は、n が大きいとき、平均 np、標準偏差 √(np(1 − p)) の正規分布で近似できます。
