      - [合計は 4473 で、4473 ÷ 9 = 497, 2 乗の和 9 + 4 + 4 + 0 + 0 + 1 + 1 + 4 + 9 = 32、32 ÷ 8 = 4 で s = 2, s/√9 = 2/3 で、T = −3 × 3/2 = −4.5]
