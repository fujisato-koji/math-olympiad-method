# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "cd2f965202"
    kinds: [総動員, 読み取り]
    uses: [C-043, A-011]
    text: ある病気の検査（作り話です）は、病気の人では 90 % が陽性、病気でない人では 10 % が陽性になります。ある町で、病気の人のわりあい p を調べるため、無作為に選んだ 300 人を検査すると、75 人が陽性でした。陽性のわりあいの 95 % 信頼区間を、標本比率 R = 0.25 を使って R ± 1.96 × √(R(1 − R)/300) で求め、そこから p の 95 % 信頼区間を求めます。p の信頼区間の上のはしを、小数で答えましょう。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="28" width="150" height="150" fill="none" stroke="currentColor" stroke-width="2"/><line x1="65" y1="28" x2="65" y2="178" stroke="currentColor" stroke-width="2"/><rect x="20" y="43" width="45" height="135" fill="#f08080" fill-opacity="0.6" stroke="none"/><rect x="65" y="163" width="105" height="15" fill="#f08080" fill-opacity="0.6" stroke="none"/><rect x="20" y="28" width="150" height="150" fill="none" stroke="currentColor" stroke-width="2"/><line x1="65" y1="28" x2="65" y2="178" stroke="currentColor" stroke-width="2"/><text x="42.5" y="20" font-size="12" text-anchor="middle" fill="currentColor">病気</text><text x="117.5" y="20" font-size="12" text-anchor="middle" fill="currentColor">病気でない</text><text x="42.5" y="195" font-size="13" text-anchor="middle" fill="currentColor">p</text><text x="117.5" y="195" font-size="13" text-anchor="middle" fill="currentColor">1 − p</text><text x="42.5" y="110.5" font-size="13" text-anchor="middle" fill="currentColor">90 %</text><text x="117.5" y="171.5" font-size="12" text-anchor="middle" fill="currentColor">10 %</text><text x="184" y="70" font-size="13" text-anchor="start" fill="#e06666">色の所 = 陽性の人</text><text x="184" y="96" font-size="13" text-anchor="start" fill="currentColor">300 人中 75 人が陽性</text><text x="184" y="120" font-size="13" text-anchor="start" fill="currentColor">→ 色の面積 ≒ 0.25</text></svg>'
    answer: 0.24875
    check: "(lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)((lambda s: (Fraction(1, 4) + Fraction('1.96') * s - Fraction(1, 10)) / Fraction(8, 10))([Fraction(k, 1000) for k in range(1, 1000) if Fraction(k * k, 1000000) == Fraction(1, 4) * Fraction(3, 4) / 300][0]))"
    hints:
      - text: 陽性になる確率を p で表そう。色の所の面積を、病気の人と病気でない人に分けて考えるよ（C-043）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="28" width="150" height="150" fill="none" stroke="currentColor" stroke-width="2"/><line x1="65" y1="28" x2="65" y2="178" stroke="currentColor" stroke-width="2"/><rect x="20" y="43" width="45" height="135" fill="#f08080" fill-opacity="0.6" stroke="none"/><rect x="65" y="163" width="105" height="15" fill="#f08080" fill-opacity="0.6" stroke="none"/><rect x="20" y="28" width="150" height="150" fill="none" stroke="currentColor" stroke-width="2"/><line x1="65" y1="28" x2="65" y2="178" stroke="currentColor" stroke-width="2"/><text x="42.5" y="20" font-size="12" text-anchor="middle" fill="currentColor">病気</text><text x="117.5" y="20" font-size="12" text-anchor="middle" fill="currentColor">病気でない</text><text x="42.5" y="195" font-size="13" text-anchor="middle" fill="currentColor">p</text><text x="117.5" y="195" font-size="13" text-anchor="middle" fill="currentColor">1 − p</text><text x="42.5" y="110.5" font-size="13" text-anchor="middle" fill="currentColor">90 %</text><text x="117.5" y="171.5" font-size="12" text-anchor="middle" fill="currentColor">10 %</text><text x="184" y="70" font-size="13" text-anchor="start" fill="#e06666">色の所 = 陽性の人</text><text x="184" y="98" font-size="13" text-anchor="start" fill="currentColor">色の面積</text><text x="184" y="120" font-size="13" text-anchor="start" fill="#e06666">= 0.9 × p</text><text x="184" y="142" font-size="13" text-anchor="start" fill="#e06666">+ 0.1 × (1 − p)</text></svg>'
      - R(1 − R)/300 は何の 2 乗かな。陽性のわりあいの信頼区間の両はしを求めよう。
      - 陽性のわりあいが q のとき、q = 0.1 + 0.8p を p について解くと、p の値が分かるね（A-011）。
    paths:
      - [陽性の確率は 0.9p + 0.1(1 − p) = 0.1 + 0.8p, √(0.25 × 0.75 ÷ 300) = √0.000625 = 0.025 で、陽性のわりあいの区間は 0.25 ± 0.049, 上のはし 0.299 を 0.1 + 0.8p = 0.299 に入れて p = 0.24875]
      - [図の色の面積は 0.9 × p + 0.1 × (1 − p), 上のはし 0.299 から、病気でない人の分 0.1 をのぞくと 0.199, p が 1 ふえると色の面積は 0.8 ふえるので p = 0.199 ÷ 0.8 = 0.24875]
    note: 陽性のわりあいはそのまま病気のわりあいではない。検査のまちがいの分を、条件付き確率（C-043）と 1 次方程式（A-011）で取りのぞいてから、推定のはばを移す。下のはしは同じようにして 0.12625。数は作り話。
  - part: 離
    id: "5613e9b8fa"
