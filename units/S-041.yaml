# S-041 確率分布と統計的推測の入口（二項分布、正規分布と標準化、標本平均と標本比率の分布、t 分布と χ² 検定、推定と検定の手順）
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり（1 日の組は 思い出す 2・今日 2・挑戦 1、わけの深さは ③）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）に次のねらいを当てた。題の中身が多いので、
#   練習の日と混ぜるの日の頭に見本を置いて新しいきまりを出した（brief の決めごと 5）。
#   1 日目：確率分布の平均（期待値）・分散・標準偏差、二項分布（場合を数えて確率を出す、平均 np、分散 np(1 − p)）。
#   2 日目：正規分布と標準化（頭に見本）。正規分布表を読む、二項分布を正規分布で近似する。
#   3 日目：標本平均と標本比率の分布、母平均と母比率の推定（95 % 信頼区間）（頭に見本）。
#   4 日目：わけ（3 問とも ③：二項分布の平均は np、標準化した値の平均は 0 で標準偏差は 1、検定の考え方）と、検定の手順。
#   5 日目：t 分布と χ² 検定の入口（頭に見本）と、1〜4 日目の型を混ぜる。6 日目：確認。
# 前提は C-020、S-030、S-031（たどると C-011、C-007、S-029、A-009、A-010、A-011、A-019 など）。
#   平方根（A-016）は前提のたどりにないので、S-030 と同じく「2 乗するとその数になる正の数」として、
#   √n や √(np(1 − p)) が整数や有限小数になる数（n = 25、36、64、100、144、400 など）だけを使う。
#   独立な試行のかけ算（C-043）は前提のたどりにないので、二項分布の確率は、全部の場合を積の法則で数えて出す
#   （サイコロを 3 回なら 6³ 通りのうち 1 の目がちょうど 1 回は 3 × 5 × 5 通り）。₅C₂ の記号は、この単元で「5 個から 2 個を選ぶ選び方の数」として出す。
#   二項分布の分散 np(1 − p) と、標本平均の標準偏差 σ/√n は、事実として示して使う（わけは独立な確率変数の分散の和がいるので S-002、S-018）。
#   正規分布は、曲線の下の面積が確率になる山の形の分布として扱い、積分（D-017）は使わない。確率は正規分布表で読む。
#   t 分布と χ² 検定は入口として、境目の値を問題の中で与え、値を計算して判定する手順までにする（くわしくは S-018、S-019）。
# 正規分布表は P(0 ≦ Z ≦ z) の表（日本の教科書の形）で、使う値だけを図の表にのせる。表の値は check で math.erf から 4 けたに丸めて確かめた。
#   確率の答えは、表の値をたしひきした小数（たとえば 0.8185）。百分率で聞くときは % の前の数。判定や区間を選ぶ問題は choices。
#   標本平均は「標本平均」と言葉で書く（上線の書き方は画面に出ない）。母標準偏差は σ と書く。
# 二項分布の正規近似は、半整数の補正をしない形で使う（入口なので、ずれがあることを note に書いた）。
# 場面とデータはすべて自作で、実在の調査の数ではない（検査の数、製品の重さ、遺伝の比なども作り話）。
# 推定と検定は、点推定と区間推定（S-018）、仮説検定（S-019）、多重検定（S-040）、臨床試験（I-003）、実験計画法（S-050）の入口になる（D-026）。

id: S-041
days:
  - day: 1
    items:
      - part: 見本
        text: サイコロを 3 回投げて、1 の目が出る回数を X とします。X の確率分布と、平均・分散を調べてみましょう。
        svg: |
          <svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
            <line x1="40" y1="140" x2="286" y2="140" stroke="currentColor" stroke-width="1.5"/>
            <line x1="40" y1="140" x2="40" y2="12" stroke="currentColor" stroke-width="1.5"/>
            <text x="44" y="12" font-size="11">確率</text>
            <rect x="49.2" y="22.7" width="43.0" height="117.3" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1"/>
            <text x="70.8" y="154" font-size="10" text-anchor="middle">0</text>
            <rect x="110.7" y="69.6" width="43.0" height="70.4" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1"/>
            <text x="132.2" y="154" font-size="10" text-anchor="middle">1</text>
            <rect x="172.2" y="125.9" width="43.0" height="14.1" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1"/>
            <text x="193.8" y="154" font-size="10" text-anchor="middle">2</text>
            <rect x="233.7" y="139.1" width="43.0" height="0.9" fill="#f3c969" fill-opacity=".55" stroke="currentColor" stroke-width="1"/>
            <text x="255.2" y="154" font-size="10" text-anchor="middle">3</text>
          </svg>
        explain: 3 回の目の出方は 6 × 6 × 6 = 216 通りで、どれも同じ程度に起こります。X = 1 となるのは、1 の目が出る回の選び方が 3 通りで、そのどれでも残り 2 回は 1 以外の 5 通りずつなので、3 × 5 × 5 = 75 通りです。同じように数えると、P(X = 0) = 125/216、P(X = 1) = 75/216、P(X = 2) = 15/216、P(X = 3) = 1/216 です（図の棒は 216 通りのうちの数）。一般に、1 回で起こる確率が p のことを n 回くり返すとき、起こる回数 X は P(X = k) = ₙCₖ × p^k × (1 − p)^(n − k) となります。ₙCₖ は n 回から起こる k 回を選ぶ選び方の数です（例：₃C₁ = 3）。この確率分布を二項分布といい、B(n, p) と書きます。確率変数の平均（期待値）を m とするとき、(X − m)² の期待値を X の分散 V(X)、2 乗すると V(X) になる正の数を標準偏差 σ(X) といいます（S-030 のデータの分散と同じ考え）。二項分布 B(n, p) の平均は np（C-020 の線形性、わけは 4 日目）、分散は np(1 − p) です。この例では、平均 3 × 1/6 = 1/2、分散 3 × 1/6 × 5/6 = 5/12 です。
      - part: 思い出す
        text: サイコロを 12 回投げます。6 の目が出る回数の期待値を求めましょう。
        answer: 2
        check: "12 * Fraction(1, 6)"
        hints:
          - 1 回ごとに、6 が出たら 1、出なかったら 0 とする確率変数を考えましょう。
          - その期待値は 1/6 です。
          - 和の期待値は、期待値の和です（C-020）。
        paths:
          - [12 × 1/6 = 2]
      - part: 思い出す
        text: 5 人の記録は、2、4、6、8、10（回）でした。分散を求めましょう。
        answer: 8
        check: "(lambda d: sum((x - Fraction(sum(d), len(d))) ** 2 for x in d) / len(d))([2, 4, 6, 8, 10])"
        hints:
          - 平均値を求めましょう。
          - 偏差を 2 乗しましょう。
          - 2 乗の合計を 5 でわりましょう。
        paths:
          - [平均値は 6、偏差は −4、−2、0、2、4, (16 + 4 + 0 + 4 + 16) ÷ 5 = 8]
      - part: 今日
        text: 2 枚の硬貨を投げて、表が出た枚数を X とします。X の確率分布は P(X = 0) = 1/4、P(X = 1) = 1/2、P(X = 2) = 1/4 です。X の分散を求めましょう。
        answer: 1/2
        accept: [0.5]
        check: "(lambda dist: (lambda m: sum(p * (x - m) ** 2 for x, p in dist))(sum(p * x for x, p in dist)))([(0, Fraction(1, 4)), (1, Fraction(1, 2)), (2, Fraction(1, 4))])"
        hints:
          - まず、X の平均（期待値）を求めましょう。
          - それぞれの値の偏差 (X − 平均) を 2 乗しましょう。
          - (偏差の 2 乗 × 確率) をすべてたしましょう。
        paths:
          - [平均は 0 × 1/4 + 1 × 1/2 + 2 × 1/4 = 1, 分散は 1 × 1/4 + 0 × 1/2 + 1 × 1/4 = 1/2]
      - part: 今日
        text: 硬貨を 5 回投げます。表がちょうど 2 回出る確率を求めましょう。
        answer: 5/16
        check: "Fraction(sum(1 for t in itertools.product((0, 1), repeat=5) if sum(t) == 2), 32)"
        hints:
          - 5 回の出方は全部で何通りでしょう。
          - 表が出る 2 回の選び方は何通りでしょう（₅C₂）。
          - 場合の数の比を約分しましょう。
        paths:
          - [出方は 2⁵ = 32 通り, 表の 2 回の選び方は ₅C₂ = 10 通り, 10/32 = 5/16]
      - part: 挑戦
        text: サイコロを 180 回投げて、1 の目が出る回数を X とします。X の標準偏差を求めましょう。
        answer: 5
        check: "[k for k in range(1, 100) if k * k == 180 * Fraction(1, 6) * Fraction(5, 6)][0]"
        hints:
          - X は二項分布 B(180, 1/6) にしたがいます。
          - 分散は np(1 − p) です。
          - 2 乗すると分散になる正の数を求めましょう。
        paths:
          - [分散は 180 × 1/6 × 5/6 = 25, 5² = 25 なので標準偏差は 5]
        note: 平均は 30 回。180 回投げると、1 の目の回数はおおよそ 30 ± 5 回くらいの範囲に散らばる。
    extra:
      - part: 今日
        text: サイコロを 4 回投げます。6 の目がちょうど 1 回出る確率を求めましょう。
        answer: 125/324
        check: "Fraction(sum(1 for t in itertools.product(range(1, 7), repeat=4) if t.count(6) == 1), 1296)"
        hints:
          - 4 回の出方は 6⁴ 通りです。
          - 6 が出る回の選び方は 4 通りで、残り 3 回は 6 以外です。
          - 場合の数を求めて、比を約分しましょう。
        paths:
          - [4 × 5 × 5 × 5 = 500 通り, 500/1296 = 125/324]
      - part: 今日
        text: 硬貨を 64 回投げて、表が出た回数を X とします。X の標準偏差を求めましょう。
        answer: 4
        check: "[k for k in range(1, 100) if k * k == 64 * Fraction(1, 2) * Fraction(1, 2)][0]"
        hints:
          - X は二項分布 B(64, 1/2) にしたがいます。
          - 分散は np(1 − p) です。
          - 2 乗すると分散になる正の数を求めましょう。
        paths:
          - [分散は 64 × 1/2 × 1/2 = 16, 標準偏差は 4]
      - part: 挑戦
        text: 確率変数 X の確率分布は、P(X = 1) = 1/2、P(X = 2) = 1/3、P(X = 3) = 1/6 です。X の分散を求めましょう。
        answer: 5/9
        check: "(lambda dist: (lambda m: sum(p * (x - m) ** 2 for x, p in dist))(sum(p * x for x, p in dist)))([(1, Fraction(1, 2)), (2, Fraction(1, 3)), (3, Fraction(1, 6))])"
        hints:
          - まず、平均を求めましょう。
          - それぞれの値の偏差を 2 乗します。平均は分数になります。
          - (偏差の 2 乗 × 確率) をすべてたしましょう。
        paths:
          - [平均は 1/2 + 2/3 + 1/2 = 5/3, 偏差の 2 乗は 4/9、1/9、16/9, 4/9 × 1/2 + 1/9 × 1/3 + 16/9 × 1/6 = 6/27 + 1/27 + 8/27 = 5/9]

