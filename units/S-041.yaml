idth="5"/><line x1="77.6" y1="183" x2="77.6" y2="201" stroke="#3d8fd1" stroke-width="2.5"/><line x1="234.4" y1="183" x2="234.4" y2="201" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="156" cy="192" r="5" fill="#e06666" stroke="none"/><polygon points="79.6,174 85.6,170.7 85.6,177.3" fill="#3d8fd1"/><line x1="156" y1="174" x2="85.6" y2="174" stroke="#3d8fd1" stroke-width="2"/><polygon points="232.4,174 226.4,177.3 226.4,170.7" fill="#3d8fd1"/><line x1="156" y1="174" x2="226.4" y2="174" stroke="#3d8fd1" stroke-width="2"/><text x="116.8" y="168" font-size="12" text-anchor="middle" fill="#3d8fd1">0.98</text><text x="195.2" y="168" font-size="12" text-anchor="middle" fill="#3d8fd1">0.98</text><text x="77.6" y="214" font-size="13" text-anchor="middle" fill="currentColor">250.22</text><text x="234.4" y="214" font-size="13" text-anchor="middle" fill="currentColor">252.18</text><text x="156" y="214" font-size="13" text-anchor="middle" fill="#e06666">標本平均 251.2</text><text x="160" y="236" font-size="13" text-anchor="middle" fill="currentColor">この区間に m があると考える</text></svg>'
        explain: 母集団（平均 m、標準偏差 σ）から大きさ n の標本を無作為に選ぶとき、標本平均も確率変数で、その平均は m、標準偏差は σ/√n です（√n は 2 乗すると n になる正の数）。n が大きいとき、標本平均はおよそ正規分布 N(m, (σ/√n)²) にしたがいます（中心極限定理）。標準化すると、(標本平均 − m) ÷ (σ/√n) が −1.96 から 1.96 の間に入る確率は 0.95 です。これを m について書き直すと、「標本平均 − 1.96 × σ/√n ≦ m ≦ 標本平均 + 1.96 × σ/√n」となり、これを母平均 m の 95 % 信頼区間といいます。この例では σ/√n = 5 ÷ 10 = 0.5、1.96 × 0.5 = 0.98 なので、250.22 ≦ m ≦ 252.18 です。標本比率（標本の中のわりあい）R は、母比率を p とすると、平均 p、標準偏差 √(p(1 − p)/n) の正規分布で近似できます。母比率の推定では、p の代わりに標本比率を入れて、R ± 1.96 × √(R(1 − R)/n) を 95 % 信頼区間とします。
