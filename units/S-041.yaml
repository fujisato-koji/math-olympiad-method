          - 分散は (Z − 平均)² の期待値です。(X − m)² を使って表しましょう。
        paths:
          - [Z = (1/σ)X − m/σ, E(Z) = m/σ − m/σ = 0, V(Z) = E((X − m)²) ÷ σ² = σ² ÷ σ² = 1, 標準偏差は 1]
          - [S-030 のデータと同じに考える, m をひくと平均は 0 にずれ、偏差は変わらない, σ でわると偏差も標準偏差も 1/σ 倍で、標準偏差は σ ÷ σ = 1]
      - part: わけ
        id: "19da4bf4f9"
        text: 今日の問題では、表が 61 回出たことから「表とうらが同じ程度に出る」という仮定をすてました。このような判断がなぜすじが通っているのかを書きましょう。また、もし表が 55 回（標準化した値 1）だったら、「仮定が正しいと示された」と言えるかどうかも書きましょう。
        explain: 例：「仮定が正しいとすると、表の回数は近似的に N(50, 5²) にしたがい、標準化した値が −1.96 と 1.96 の外に出る確率は 0.05 しかない。実際には 2.2 という外の値が出た。仮定が正しいとすれば 5 % 以下の確率でしか起こらないことが起きたことになるので、仮定のほうがまちがっていると判断するのがすじが通っている（仮定からおかしなことが起きたら、仮定のほうをうたがう考え）。ただし、仮定が正しくても 5 % の確率でこの判断をするので、まちがえるきけんは 5 % ある。表が 55 回なら、標準化した値は 1 で、仮定のもとでもよく起こる結果である。しかし、これは仮定と食いちがわないというだけで、たとえば表の出る確率が 0.52 のコインでもよく起こる結果なので、仮定が正しいと示されたとは言えない（「すてられない」と「正しい」はちがう）。」と書ければよい。① 仮定のもとでの分布と、外に出る確率 0.05 を書く、② 起こりにくいことが起きたので仮定をすてる、というすじ道を書く、③ すてられないときは正しいとまでは言えないことを書く、の 3 つを見る。有意水準（5 %）は、まちがってすてるきけんをどこまでみとめるかを前もって決めた数であることにふれる。
        hints:
          - text: 仮定が正しいとすると、標準化した値が −1.96 と 1.96 の外（色の所）に出る確率はどれくらいでしょう。
