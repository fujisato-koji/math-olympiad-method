# S-041 確率分布と統計的推測の入口（二項分布、正規分布と標準化、標本平均と標本比率の分布、t 分布と χ² 検定、推定と検定の手順）
#
# 書き方は N-001 の頭の注、前の段 5 の決まりは A-019 の頭の注のとおり（1 日の組は 思い出す 2・今日 2・挑戦 1、わけの深さは ③）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）に次のねらいを当てた。題の中身が多いので、
#   練習の日と混ぜるの日の頭に見本を置いて新しいきまりを出した（brief の決めごと 5）。
#   1 日目：確率分布の平均（期待値）・分散・標準偏差、二項分布（場合を数えて確率を出す、平均 np、分散 np(1 − p)）。
#   2 日目：正規分布と標準化（頭に見本）。正規分布表を読む、二項分布を正規分布で近似する。
#   3 日目：標本平均と標本比率の分布、母平均と母比率の推定（95 % 信頼区間）（頭に見本）。
#   4 日目：わけ（3 問とも ③：二項分布の平均は np、標準化した値の平均は 0 で標準偏差は 1、検定の考え方）と、検定の手順。
#   5 日目：t 分布と χ² 検定の入口（頭に見本）と、1〜4 日目の型を混ぜる。6 日目：確認。
# 前提は C-020、S-030、S-031（たどると C-011、C-007、S-029、A-009、A-010、A-011、A-019 など）。
#   平方根（A-016）は前提のたどりにないので、S-030 と同じく「2 乗するとその数になる正の数」として、
#   √n や √(np(1 − p)) が整数や有限小数になる数（n = 25、36、64、100、144、400 など）だけを使う。
#   独立な試行のかけ算（C-043）は前提のたどりにないので、二項分布の確率は、全部の場合を積の法則で数えて出す
#   （サイコロを 3 回なら 6³ 通りのうち 1 の目がちょうど 1 回は 3 × 5 × 5 通り）。₅C₂ の記号は、この単元で「5 個から 2 個を選ぶ選び方の数」として出す。
#   二項分布の分散 np(1 − p) と、標本平均の標準偏差 σ/√n は、事実として示して使う（わけは独立な確率変数の分散の和がいるので S-002、S-018）。
#   正規分布は、曲線の下の面積が確率になる山の形の分布として扱い、積分（D-017）は使わない。確率は正規分布表で読む。
#   t 分布と χ² 検定は入口として、境目の値を問題の中で与え、値を計算して判定する手順までにする（くわしくは S-018、S-019）。
# 正規分布表は P(0 ≦ Z ≦ z) の表（日本の教科書の形）で、問題ごとに使う値とまぎれの値の 4 つだけを図の表にのせる（2 行目の見出しは、0 から z までをぬった小さな山の絵）。表の値は check で math.erf から 4 けたに丸めて確かめた。
#   確率の答えは、表の値をたしひきした小数（たとえば 0.8185）。百分率で聞くときは % の前の数。判定や区間を選ぶ問題は choices。
#   標本平均は「標本平均」と言葉で書く（上線の書き方は画面に出ない）。母標準偏差は σ と書く。
# 二項分布の正規近似は、半整数の補正をしない形で使う（入口なので、ずれがあることを note に書いた）。
# 場面とデータはすべて自作で、実在の調査の数ではない（検査の数、製品の重さ、遺伝の比なども作り話）。
# 推定と検定は、点推定と区間推定（S-018）、仮説検定（S-019）、多重検定（S-040）、臨床試験（I-003）、実験計画法（S-050）の入口になる（D-026）。
# 図とイラストの多い形に直した（直す係 -fix3、D-131）。見本 4 つすべてに図（1 日目 二項分布のぼうと平均、2 日目 山の面積と z の目もり、
#   3 日目 母集団の山と標本平均の細い山と信頼区間、5 日目 t 分布のすそと χ² の観測と期待のぼう）。確率や区間を聞く問題は、
#   求める面積を山にぬった図や数直線の区間の図を見て答える形にし、ヒントの 1〜2 段を図（左右対称で折り返す、右半分 0.5 から表の面積をのぞく、
#   棄却域にぬった z の山、√n を正方形のならびで見る、など）にした。答えそのものの数や、判定の結果の位置は図に描かない。
# 子の文で使う統計の用語：無作為（S-031 で学ぶ）、棄却（検定で仮定をすてること）、二項分布、標準偏差、推定、信頼区間。
#   前の段 5 より上のふつうのことばはかなに開いた（コイン、まい、うら、すてる、わりあい、ふくろ、はば、すじ道 など）。

id: S-041
days:
  - day: 1
    items:
      - part: 見本
        id: "1ff1433fb9"
        text: サイコロを 3 回投げて、1 の目が出る回数を X とします。図のぼうの高さが、X が 0、1、2、3 になる確率です。X の確率分布と、平均・分散を調べてみましょう。
        svg: '<svg viewBox="0 0 320 214" xmlns="http://www.w3.org/2000/svg"><line x1="36" y1="168" x2="304" y2="168" stroke="currentColor" stroke-width="1.5"/><line x1="36" y1="168" x2="36" y2="30" stroke="currentColor" stroke-width="1.5"/><text x="40" y="22" font-size="12" text-anchor="start" fill="currentColor">確率</text><rect x="50" y="58" width="44" height="110" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="72" y="52" font-size="12" text-anchor="middle" fill="currentColor">125/216</text><text x="72" y="184" font-size="12" text-anchor="middle" fill="currentColor">0 回</text><rect x="118" y="102" width="44" height="66" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="140" y="96" font-size="12" text-anchor="middle" fill="currentColor">75/216</text><text x="140" y="184" font-size="12" text-anchor="middle" fill="currentColor">1 回</text><rect x="186" y="154.8" width="44" height="13.2" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="208" y="148.8" font-size="12" text-anchor="middle" fill="currentColor">15/216</text><text x="208" y="184" font-size="12" text-anchor="middle" fill="currentColor">2 回</text><rect x="254" y="167.1" width="44" height="0.9" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="276" y="161.1" font-size="12" text-anchor="middle" fill="currentColor">1/216</text><text x="276" y="184" font-size="12" text-anchor="middle" fill="currentColor">3 回</text><polygon points="106,170 98,183 114,183" fill="#e06666"/><text x="106" y="200" font-size="13" text-anchor="middle" fill="#e06666">平均 1/2</text><rect x="196" y="22" width="24" height="24" rx="4.32" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="208" cy="34" r="3.1" fill="#e06666" stroke="none"/><rect x="226" y="22" width="24" height="24" rx="4.32" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="238" cy="34" r="3.1" fill="#e06666" stroke="none"/><rect x="256" y="22" width="24" height="24" rx="4.32" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="268" cy="34" r="3.1" fill="#e06666" stroke="none"/><text x="240" y="64" font-size="12" text-anchor="middle" fill="currentColor">1 の目が出る回数 X</text></svg>'
        explain: 3 回の目の出方は 6 × 6 × 6 = 216 通りで、どれも同じ程度に起こります。X = 1 となるのは、1 の目が出る回の選び方が 3 通りで、そのどれでも残り 2 回は 1 以外の 5 通りずつなので、3 × 5 × 5 = 75 通りです。同じように数えると、P(X = 0) = 125/216、P(X = 1) = 75/216、P(X = 2) = 15/216、P(X = 3) = 1/216 です（図のぼうの上の数）。いっぱんに、1 回で起こる確率が p のことを n 回くり返すとき、起こる回数 X は P(X = k) = ₙCₖ × p^k × (1 − p)^(n − k) となります。ₙCₖ は n 回から起こる k 回を選ぶ選び方の数です（例：₃C₁ = 3）。この確率分布を二項分布といい、B(n, p) と書きます。確率変数の平均（期待値）を m とするとき、(X − m)² の期待値を X の分散 V(X)、2 乗すると V(X) になる正の数を標準偏差 σ(X) といいます（S-030 のデータの分散と同じ考え）。二項分布 B(n, p) の平均は np（C-020 の線形性、わけは 4 日目）、分散は np(1 − p) です。この例では、平均 3 × 1/6 = 1/2、分散 3 × 1/6 × 5/6 = 5/12 です。
