      - part: 今日
        text: ある硬貨を 100 回投げると、表が 61 回出ました。「この硬貨は表と裏が同じ程度に出る」と仮定すると、表の回数は近似的に正規分布 N(50, 5²) にしたがいます。有意水準 5 % で検定すると（標準化した値が −1.96 より小さいか 1.96 より大きければ仮定を捨てる）、どう判定しますか。
        choices: [仮定を捨てる（棄却する）, 仮定を捨てない（棄却しない）]
        answer: 仮定を捨てる（棄却する）
        check: "'仮定を捨てる（棄却する）' if abs(Fraction(61 - 50, 5)) > Fraction('1.96') else '仮定を捨てない（棄却しない）'"
        hints:
          - 61 回を標準化しましょう。
          - z = (61 − 50) ÷ 5 です。
          - z が 1.96 より大きいかを見ましょう。
        paths:
          - [z = 11 ÷ 5 = 2.2, 2.2 > 1.96 なので、仮定を捨てる]
        note: 仮定（帰無仮説）のもとでは 5 % より起こりにくい結果が出たので、仮定がまちがっていると判断する。検定の手順：仮説を立てる → 仮説のもとでの分布 → 標準化 → 境目と比べる → 判定。
      - part: わけ
        text: 1 回で起こる確率が p のことを n 回くり返すとき、起こる回数 X は二項分布 B(n, p) にしたがいます。X の平均（期待値）が np になるわけを、筋道を立てて書きましょう。
        explain: 例：「1 回目、2 回目、…、n 回目のそれぞれについて、その回に起こったら 1、起こらなかったら 0 となる確率変数を X₁、X₂、…、Xₙ とする。どの回も起こる確率は p なので、E(X₁) = 1 × p + 0 × (1 − p) = p で、ほかの回も同じである。起こる回数 X は、起こった回だけ 1 を数えるので X = X₁ + X₂ + … + Xₙ である。和の期待値は期待値の和（C-020）なので、E(X) = E(X₁) + E(X₂) + … + E(Xₙ) = p × n = np である。」と書ければよい。① 0 か 1 の確率変数を n 個決める、② X をその和で表す、③ 期待値の線形性（約束した事実、C-020）で結ぶ、の 3 つがそろっているかを見る。B(3, 1/6) で 0 × 125/216 + 1 × 75/216 + 2 × 15/216 + 3 × 1/216 = 1/2 を確かめただけで終わっていたら、例ではすべての n、p を示せないことを話す。分散 np(1 − p) は、同じように X₁、…、Xₙ の分散 p(1 − p) をたして得られるが、そのわけ（独立な確率変数の分散は和になる）は S-002 で示す。
        hints:
          - その回に起こったら 1、起こらなかったら 0 となる確率変数を、1 回ごとに決めましょう。
          - 起こる回数 X は、それらの確率変数の和で表せます。
          - 和の期待値は期待値の和（C-020）を使いましょう。
        paths:
          - [1 回ごとに 0 か 1 の確率変数を決める, その期待値はどれも p, X はその n 個の和, E(X) = n × p = np]
      - part: わけ
        text: 確率変数 X の平均を m、標準偏差を σ とします。Z = (X − m) ÷ σ とすると、Z の平均は 0、標準偏差は 1 になります。このわけを、筋道を立てて書きましょう。
        explain: 例：「Z = (1/σ) × X − m/σ と書ける。期待値の線形性（C-020 の E(aX + b) = aE(X) + b）から、E(Z) = (1/σ) × m − m/σ = 0 である。分散は (Z − 0)² の期待値で、Z − 0 = (X − m)/σ なので、(Z − 0)² = (X − m)² ÷ σ² である。線形性から E((X − m)² ÷ σ²) = E((X − m)²) ÷ σ² = V(X) ÷ σ² = σ² ÷ σ² = 1。よって Z の分散は 1 で、標準偏差も 1 である。」と書ければよい。① Z を X の式で表す、② 平均と分散を線形性で変形する、③ 分散と標準偏差の決め方（V(X) = σ²）で結ぶ、の 3 つを見る。S-030 で、データのすべての値から同じ数をひくと平均がその分ずれて偏差は変わらず、σ でわると偏差も標準偏差も 1/σ 倍になったことと同じ筋道であることに触れる。標準化すると、どんな正規分布の確率も 1 つの表（標準正規分布表）で読めるようになる。
        hints:
          - Z を、(1/σ) × X − m/σ の形に書きましょう。
          - C-020 の E(aX + b) = aE(X) + b を使って、Z の平均を求めましょう。
          - 分散は (Z − 平均)² の期待値です。(X − m)² を使って表しましょう。
        paths:
          - [Z = (1/σ)X − m/σ, E(Z) = m/σ − m/σ = 0, V(Z) = E((X − m)²) ÷ σ² = σ² ÷ σ² = 1, 標準偏差は 1]
      - part: わけ
        text: 今日の問題では、表が 61 回出たことから「表と裏が同じ程度に出る」という仮定を捨てました。このような判断がなぜ筋が通っているのかを書きましょう。また、もし表が 55 回（標準化した値 1）だったら、「仮定が正しいと示された」と言えるかどうかも書きましょう。
        explain: 例：「仮定が正しいとすると、表の回数は近似的に N(50, 5²) にしたがい、標準化した値が −1.96 と 1.96 の外に出る確率は 0.05 しかない。実際には 2.2 という外の値が出た。仮定が正しいとすれば 5 % 以下の確率でしか起こらないことが起きたことになるので、仮定のほうがまちがっていると判断するのが筋が通っている（背理法に似た考え）。ただし、仮定が正しくても 5 % の確率でこの判断をするので、まちがえる危険は 5 % ある。表が 55 回なら、標準化した値は 1 で、仮定のもとでもよく起こる結果である。しかし、これは仮定と食いちがわないというだけで、たとえば表の出る確率が 0.52 の硬貨でもよく起こる結果なので、仮定が正しいと示されたとは言えない（「捨てられない」と「正しい」はちがう）。」と書ければよい。① 仮定のもとでの分布と、外に出る確率 0.05 を書く、② 起こりにくいことが起きたので仮定を捨てる、という筋道を書く、③ 捨てられないときは正しいとまでは言えないことを書く、の 3 つを見る。有意水準（5 %）は、まちがって捨てる危険をどこまで認めるかを前もって決めた数であることに触れる。
        hints:
          - 仮定が正しいとすると、標準化した値が −1.96 と 1.96 の外に出る確率はどれくらいでしょう。
          - その起こりにくいことが実際に起きたとき、何を疑うのが自然でしょう。
