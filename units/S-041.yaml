    check: "[n for n in range(1, 2000) if (2 * Fraction('1.96') * 10) ** 2 <= 4 * n][0]"
    hints:
      - 信頼区間のはばは 2 × 1.96 × 10/√n だね。図のように、n を大きくすると はばは小さくなるよ。
      - はばが 2 以下になる条件を、√n についての不等式に書きかえよう。
      - text: √n がある数以上なら、n はその数の 2 乗以上だね。
        svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="16" width="104" height="104" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="82" y="72" font-size="14" text-anchor="middle" fill="currentColor">面積 n</text><line x1="30" y1="130" x2="134" y2="130" stroke="#e06666" stroke-width="2"/><text x="82" y="146" font-size="12" text-anchor="middle" fill="#e06666">1 辺 √n ≧ 19.6</text><text x="152" y="60" font-size="13" text-anchor="start" fill="currentColor">1 辺が 19.6 以上なら、</text><text x="152" y="82" font-size="13" text-anchor="start" fill="currentColor">面積は 19.6 × 19.6 以上</text></svg>'
    paths:
      - [2 × 1.96 × 10/√n ≦ 2, √n ≧ 19.6, n ≧ 19.6² = 384.16 なので、n は 385 以上]
      - [はばがちょうど 2 になる n を先に求める：39.2/√n = 2 から √n = 19.6, n = 384.16, n は整数で、384 でははばが 2 をこえるので 385]
    note: 信頼区間の式を、はばから n を求める向きに逆にたどる。√ の計算をせず、両辺を 2 乗した形で n を求めるのが要点。384 でははばがわずかに 2 をこえる。
