  - day: 3
    items:
      - part: 見本
        text: ある機械でつめる袋の重さは、標準偏差 5 g でばらつくことが分かっています。無作為に 100 袋を選んで量ると、標本平均は 251.2 g でした。この機械でつめる袋全体の平均（母平均）m を推定してみましょう。
        explain: 母集団（平均 m、標準偏差 σ）から大きさ n の標本を無作為に選ぶとき、標本平均も確率変数で、その平均は m、標準偏差は σ/√n です（√n は 2 乗すると n になる正の数）。n が大きいとき、標本平均はおよそ正規分布 N(m, (σ/√n)²) にしたがいます（中心極限定理）。標準化すると、(標本平均 − m) ÷ (σ/√n) が −1.96 から 1.96 の間に入る確率は 0.95 です。これを m について書き直すと、「標本平均 − 1.96 × σ/√n ≦ m ≦ 標本平均 + 1.96 × σ/√n」となり、これを母平均 m の 95 % 信頼区間といいます。この例では σ/√n = 5 ÷ 10 = 0.5、1.96 × 0.5 = 0.98 なので、250.22 ≦ m ≦ 252.18 です。標本比率（標本の中の割合）R は、母比率を p とすると、平均 p、標準偏差 √(p(1 − p)/n) の正規分布で近似できます。母比率の推定では、p の代わりに標本比率を入れて、R ± 1.96 × √(R(1 − R)/n) を 95 % 信頼区間とします。
