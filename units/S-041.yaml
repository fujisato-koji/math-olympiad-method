      - part: 挑戦
        id: "fbf49e6a11"
        text: ある市で無作為に 400 人を選んで聞くと、80 人が新しい公園に行ったことがありました。標本比率 R = 0.2 を使って、母比率の 95 % 信頼区間を R ± 1.96 × √(R(1 − R)/400) で求めるとき、信頼区間のはば（上のはし − 下のはし）を求めましょう。
        svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><text x="160" y="16" font-size="13" text-anchor="middle" fill="currentColor">400 人（1 マス = 40 人）</text><rect x="30" y="24" width="26" height="24" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="56" y="24" width="26" height="24" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><rect x="82" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="108" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="134" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="160" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="186" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="212" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="238" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="264" y="24" width="26" height="24" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="56" y="64" font-size="12" text-anchor="middle" fill="#3c8a2e">行った 80 人</text><line x1="16" y1="112" x2="304" y2="112" stroke="currentColor" stroke-width="1.5"/><line x1="90" y1="112" x2="230" y2="112" stroke="#3d8fd1" stroke-width="5"/><line x1="90" y1="103" x2="90" y2="121" stroke="#3d8fd1" stroke-width="2.5"/><line x1="230" y1="103" x2="230" y2="121" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="112" r="5" fill="#e06666" stroke="none"/><text x="160" y="136" font-size="13" text-anchor="middle" fill="#e06666">R = 0.2</text><path d="M90 100 V94 H230 V100" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="160" y="88" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">はば ?</text></svg>'
        answer: 0.0784
        check: "(lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)(2 * Fraction('1.96') * [Fraction(k, 1000) for k in range(1, 1000) if Fraction(k * k, 1000000) == Fraction(2, 10) * Fraction(8, 10) / 400][0])"
        hints:
          - R(1 − R)/400 = 0.2 × 0.8 ÷ 400 を計算しましょう。
          - その数は、何の 2 乗になっているでしょう（小数で考えましょう）。
          - text: はばは、まん中の R から左右に 1.96 × (標準偏差) ずつです。
            svg: '<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg"><line x1="16" y1="74" x2="304" y2="74" stroke="currentColor" stroke-width="1.5"/><line x1="70" y1="74" x2="250" y2="74" stroke="#3d8fd1" stroke-width="5"/><line x1="70" y1="65" x2="70" y2="83" stroke="#3d8fd1" stroke-width="2.5"/><line x1="250" y1="65" x2="250" y2="83" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="74" r="5" fill="#e06666" stroke="none"/><text x="160" y="98" font-size="13" text-anchor="middle" fill="#e06666">R = 0.2</text><polygon points="72,56 78,52.7 78,59.3" fill="#3d8fd1"/><line x1="160" y1="56" x2="78" y2="56" stroke="#3d8fd1" stroke-width="2"/><text x="115" y="50" font-size="12" text-anchor="middle" fill="#3d8fd1">1.96 × ?</text><polygon points="248,56 242,59.3 242,52.7" fill="#3d8fd1"/><line x1="160" y1="56" x2="242" y2="56" stroke="#3d8fd1" stroke-width="2"/><text x="205" y="50" font-size="12" text-anchor="middle" fill="#3d8fd1">1.96 × ?</text><path d="M70 32 V26 H250 V32" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="160" y="20" font-size="13" text-anchor="middle" fill="currentColor">はば</text></svg>'
        paths:
          - [0.2 × 0.8 ÷ 400 = 0.0004, 0.02² = 0.0004 なので標準偏差は 0.02, はばは 2 × 1.96 × 0.02 = 0.0784]
          - [信頼区間は 0.2 ± 1.96 × 0.02 = 0.2 ± 0.0392, 上のはし 0.2392 − 下のはし 0.1608 = 0.0784]
        note: 信頼区間はおよそ 0.161 から 0.239。「16 % から 24 % くらい」とはばをつけて推定する。
