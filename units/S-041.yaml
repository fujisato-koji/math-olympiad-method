    text: 「内容量 500 g」と書かれた製品を無作為に 9 個選んで量ると、494、495、495、497、497、498、498、499、500（g）でした。母平均が 500 g であるという仮定のもとで、T = (標本平均 − 500) ÷ (s/√9) の値を求めましょう。s は、偏差の 2 乗の合計を 9 − 1 でわった数の、正の平方根です。
    answer: −4.5
    accept: [−9/2]
    check: "(lambda d: (lambda m: (lambda s: (lambda t: f'−{-t.numerator / t.denominator}' if t < 0 else t)((m - 500) / Fraction(s, 3)))([k for k in range(1, 50) if k * k == sum((x - m) ** 2 for x in d) / 8][0]))(Fraction(sum(d), 9)))([494, 495, 495, 497, 497, 498, 498, 499, 500])"
