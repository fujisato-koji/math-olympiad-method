    note: 自由度 8 の t 分布の 5 % の境目は 2.306 なので、−4.5 なら「平均 500 g」を捨てる（平均は表示より軽いと判断）。n でなく n − 1 でわること、s/√n の √9 を忘れないことがつまずきやすい。
