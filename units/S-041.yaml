      - part: 挑戦
        id: "95c71caa16"
        text: 確率変数 X の確率分布は、図のとおりです。X の分散を求めましょう。
        svg: '<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="136" x2="260" y2="136" stroke="currentColor" stroke-width="1.5"/><text x="12" y="16" font-size="12" text-anchor="start" fill="currentColor">確率</text><rect x="80" y="26" width="40" height="110" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="100" y="20" font-size="12" text-anchor="middle" fill="currentColor">1/2</text><rect x="140" y="62.7" width="40" height="73.3" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="160" y="56.7" font-size="12" text-anchor="middle" fill="currentColor">1/3</text><rect x="200" y="99.3" width="40" height="36.7" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="220" y="93.3" font-size="12" text-anchor="middle" fill="currentColor">1/6</text><text x="100" y="152" font-size="12" text-anchor="middle" fill="currentColor">1</text><text x="160" y="152" font-size="12" text-anchor="middle" fill="currentColor">2</text><text x="220" y="152" font-size="12" text-anchor="middle" fill="currentColor">3</text></svg>'
        answer: 5/9
        check: "(lambda dist: (lambda m: sum(p * (x - m) ** 2 for x, p in dist))(sum(p * x for x, p in dist)))([(1, Fraction(1, 2)), (2, Fraction(1, 3)), (3, Fraction(1, 6))])"
        hints:
          - text: まず、ぼうがつり合う所（平均）を求めましょう。平均は《分数》になります。
            svg: '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><line x1="60" y1="136" x2="260" y2="136" stroke="currentColor" stroke-width="1.5"/><text x="12" y="16" font-size="12" text-anchor="start" fill="currentColor">確率</text><rect x="80" y="26" width="40" height="110" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="100" y="20" font-size="12" text-anchor="middle" fill="currentColor">1/2</text><rect x="140" y="62.7" width="40" height="73.3" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="160" y="56.7" font-size="12" text-anchor="middle" fill="currentColor">1/3</text><rect x="200" y="99.3" width="40" height="36.7" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="220" y="93.3" font-size="12" text-anchor="middle" fill="currentColor">1/6</text><text x="100" y="128" font-size="12" text-anchor="middle" fill="currentColor">1</text><text x="160" y="128" font-size="12" text-anchor="middle" fill="currentColor">2</text><text x="220" y="128" font-size="12" text-anchor="middle" fill="currentColor">3</text><polygon points="140,138 132,151 148,151" fill="#e06666"/><text x="140" y="166" font-size="13" text-anchor="middle" fill="#e06666">平均 = ?</text></svg>'
          - それぞれの値の偏差（値 − 平均）を 2 乗します。
          - (偏差の 2 乗 × 確率) をすべてたしましょう。
        paths:
          - [平均は 1/2 + 2/3 + 1/2 = 5/3, 偏差の 2 乗は 4/9、1/9、16/9, 4/9 × 1/2 + 1/9 × 1/3 + 16/9 × 1/6 = 6/27 + 1/27 + 8/27 = 5/9]
          - [X² の平均は 1 × 1/2 + 4 × 1/3 + 9 × 1/6 = 10/3, 分散 = (X² の平均) − (平均)² = 10/3 − 25/9 = 5/9]

