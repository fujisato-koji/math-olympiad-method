      - part: 今日
        id: "244fc04d08"
        text: 内容量の標準偏差が 6 g の製品から、無作為に 144 個を選んで量ると、標本平均は 498.6 g でした。母平均の 95 % 信頼区間の下のはし（図の ?）は何 g ですか。
        svg: '<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg"><line x1="16" y1="74" x2="304" y2="74" stroke="currentColor" stroke-width="1.5"/><line x1="70" y1="74" x2="250" y2="74" stroke="#3d8fd1" stroke-width="5"/><line x1="70" y1="65" x2="70" y2="83" stroke="#3d8fd1" stroke-width="2.5"/><line x1="250" y1="65" x2="250" y2="83" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="74" r="5" fill="#e06666" stroke="none"/><text x="160" y="98" font-size="13" text-anchor="middle" fill="#e06666">標本平均 498.6</text><text x="70" y="98" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><text x="160" y="18" font-size="13" text-anchor="middle" fill="currentColor">95 % 信頼区間</text></svg>'
        answer: 497.62
        check: "(lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)(Fraction('498.6') - Fraction('1.96') * Fraction(6, 12))"
        hints:
          - σ/√n を求めましょう。√144 = 12 です。
          - 1.96 × σ/√n を求めましょう。
          - text: 下のはしは、標本平均から左へ 1.96 × σ/√n だけ進んだ所です。
            svg: '<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg"><line x1="16" y1="74" x2="304" y2="74" stroke="currentColor" stroke-width="1.5"/><line x1="70" y1="74" x2="250" y2="74" stroke="#3d8fd1" stroke-width="5"/><line x1="70" y1="65" x2="70" y2="83" stroke="#3d8fd1" stroke-width="2.5"/><line x1="250" y1="65" x2="250" y2="83" stroke="#3d8fd1" stroke-width="2.5"/><circle cx="160" cy="74" r="5" fill="#e06666" stroke="none"/><text x="160" y="98" font-size="13" text-anchor="middle" fill="#e06666">標本平均 498.6</text><text x="70" y="98" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">?</text><polygon points="72,56 78,52.7 78,59.3" fill="#3d8fd1"/><line x1="160" y1="56" x2="78" y2="56" stroke="#3d8fd1" stroke-width="2"/><text x="115" y="50" font-size="12" text-anchor="middle" fill="#3d8fd1">1.96 × σ/√n</text></svg>'
        paths:
          - [σ/√n = 6 ÷ 12 = 0.5, 1.96 × 0.5 = 0.98, 498.6 − 0.98 = 497.62]
