          - text: 起こる回数 X は、それらの確率変数の和で表せます。
            svg: '<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg"><text x="45" y="22" font-size="12" text-anchor="middle" fill="currentColor">1 回目</text><rect x="20" y="30" width="50" height="34" rx="6" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="45" y="53" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="103" y="22" font-size="12" text-anchor="middle" fill="currentColor">2 回目</text><rect x="78" y="30" width="50" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="103" y="53" font-size="15" text-anchor="middle" fill="currentColor">0</text><text x="161" y="22" font-size="12" text-anchor="middle" fill="currentColor">3 回目</text><rect x="136" y="30" width="50" height="34" rx="6" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="161" y="53" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="219" y="52" font-size="16" text-anchor="middle" fill="currentColor">…</text><text x="277" y="22" font-size="12" text-anchor="middle" fill="currentColor">n 回目</text><rect x="252" y="30" width="50" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="277" y="53" font-size="15" text-anchor="middle" fill="currentColor">0</text><text x="160" y="92" font-size="13" text-anchor="middle" fill="#e06666">1 の数 = 起こった回数 X</text><text x="160" y="114" font-size="12" text-anchor="middle" fill="currentColor">X = (1 回目の数) + (2 回目の数) + … + (n 回目の数)</text></svg>'
          - 和の期待値は期待値の和（C-020）を使いましょう。
        paths:
          - [1 回ごとに 0 か 1 の確率変数を決める, その期待値はどれも p, X はその n 個の和, E(X) = n × p = np]
          - [E(X) = (k × ₙCₖ × p^k × (1 − p)^(n − k) の k = 0 から n までの和), k × ₙCₖ = n × ₙ₋₁Cₖ₋₁ を使って np をくくり出す, '残りは B(n − 1, p) の確率の合計で 1 なので E(X) = np']
      - part: わけ
        id: "4a357ff9e6"
        text: 確率変数 X の平均を m、標準偏差を σ とします。Z = (X − m) ÷ σ とすると、Z の平均は 0、標準偏差は 1 になります。このわけを、すじ道を立てて書きましょう。
        explain: 例：「Z = (1/σ) × X − m/σ と書ける。期待値の線形性（C-020 の E(aX + b) = aE(X) + b）から、E(Z) = (1/σ) × m − m/σ = 0 である。分散は (Z − 0)² の期待値で、Z − 0 = (X − m)/σ なので、(Z − 0)² = (X − m)² ÷ σ² である。線形性から E((X − m)² ÷ σ²) = E((X − m)²) ÷ σ² = V(X) ÷ σ² = σ² ÷ σ² = 1。よって Z の分散は 1 で、標準偏差も 1 である。」と書ければよい。① Z を X の式で表す、② 平均と分散を線形性で変形する、③ 分散と標準偏差の決め方（V(X) = σ²）で結ぶ、の 3 つを見る。S-030 で、データのすべての値から同じ数をひくと平均がその分ずれて偏差は変わらず、σ でわると偏差も標準偏差も 1/σ 倍になったことと同じすじ道であることにふれる。標準化すると、どんな正規分布の確率も 1 つの表（標準正規分布表）で読めるようになる。
        hints:
          - Z を、(1/σ) × X − m/σ の形に書きましょう。
          - text: C-020 の E(aX + b) = aE(X) + b を使って、Z の平均を求めましょう。図は、m をひいてから σ でわる様子です。
