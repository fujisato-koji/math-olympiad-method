# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [C-043, A-011]
    text: ある病気の検査（作り話です）は、病気の人では 90 % が陽性、病気でない人では 10 % が陽性になります。ある町で、病気の人の割合 p を調べるため、無作為に選んだ 300 人を検査すると、75 人が陽性でした。陽性の割合の 95 % 信頼区間を、標本比率 R = 0.25 を使って R ± 1.96 × √(R(1 − R)/300) で求め、そこから p の 95 % 信頼区間を求めます。p の信頼区間の上のはしを、小数で答えましょう。
    answer: 0.24875
    check: "(lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)((lambda s: (Fraction(1, 4) + Fraction('1.96') * s - Fraction(1, 10)) / Fraction(8, 10))([Fraction(k, 1000) for k in range(1, 1000) if Fraction(k * k, 1000000) == Fraction(1, 4) * Fraction(3, 4) / 300][0]))"
    hints:
      - 陽性になる確率を p で表そう。病気の人と病気でない人に分けて考えるよ（C-043）。
      - R(1 − R)/300 は何の 2 乗かな。陽性の割合の信頼区間の両はしを求めよう。
      - 陽性の割合が q のとき、q = 0.1 + 0.8p を p について解くと、p の値が分かるね（A-011）。
    paths:
      - [陽性の確率は 0.9p + 0.1(1 − p) = 0.1 + 0.8p, √(0.25 × 0.75 ÷ 300) = √0.000625 = 0.025 で、陽性の割合の区間は 0.25 ± 0.049, 上のはし 0.299 を 0.1 + 0.8p = 0.299 に入れて p = 0.24875]
    note: 陽性の割合はそのまま病気の割合ではない。検査のまちがいの分を、条件付き確率（C-043）と 1 次方程式（A-011）で取り除いてから、推定の幅を移す。下のはしは同じようにして 0.12625。数は作り話。
  - part: 離
