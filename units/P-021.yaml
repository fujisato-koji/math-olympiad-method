        explain: |-
          【定義】・λ は波長（山から次の山までの長さ）。
          ・T は周期（1 回の振動にかかる時間）。
          ・f は振動数（1 秒あたりの振動の回数）。f = 1/T。
          ・速さは v = λ/T = fλ。
          ｜量｜記号｜意味｜
          ｜波長｜λ｜山から次の山までの長さ｜
          ｜周期｜T｜1 回の振動にかかる時間｜
          ｜振動数｜f｜1 秒あたりの振動の回数｜
          ｜速さ｜v｜1 秒に進むきょり。v = fλ｜
          ・例：f = 2 Hz、λ = 3 m なら、v = 6 m/s、T = 0.5 s。
          ・横波：光、弦の波。縦波：音（空気のこい所とうすい所が伝わる）。
        note: v = fλ は、振動数と波長と速さの関係。単位は f が Hz、λ が m、v が m/s。
      - part: 思い出す
        id: "a2ae4c35ce"
        text: 図の直角三角形で、sin 30° はいくつですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="60,168 250,168 250,58.3" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><path d="M238 168 L238 156 L250 156" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M94 168 A34 34 0 0 0 89.4 151" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="104" y="162" font-size="13" text-anchor="start" fill="currentColor">30°</text><text x="147" y="105.2" font-size="16" text-anchor="end" fill="currentColor" font-weight="bold">2</text><text x="260" y="118.2" font-size="16" text-anchor="start" fill="currentColor" font-weight="bold">?</text></svg>'
        choices: ["1/2", "√2/2", "√3/2", "1"]
        answer: "1/2"
        check: "Fraction(1, 2)"
        hints:
          - sin 30° は、30° の角の向かい側の辺 ÷ いちばん長い辺です。
          - text: 同じ三角形を上下に 2 つ合わせると、正三角形になります。赤い辺は、正三角形の 1 辺の何分の 1 でしょう。
