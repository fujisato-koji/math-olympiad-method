      - part: わけ
        id: "5fff3b3fe9"
        text: 固定端で反射した波の位相が π ずれるわけを説明しましょう。
        explain: 「固定端では、ロープのはしが動けない。入ってきた波が山ではしを持ち上げようとしても、はしは動かないので、反射した波が逆向きの変位を作って打ち消す。入ってきた波と反射した波の変位が逆になるので、位相が π ずれる。」と書ければよい。① はしが動けない、② 変位を打ち消す、③ 逆向きで位相 π。子どもには、ロープのはしを固定した図で確かめさせます。
