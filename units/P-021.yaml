          - sin 30° = 1/2 です。両方の辺を 4/3 でわりましょう。
        paths:
          - [n₁ sin θ₁ = n₂ sin θ₂, 1 × 1/2 = (4/3) sin θ₂, sin θ₂ = 3/8]
