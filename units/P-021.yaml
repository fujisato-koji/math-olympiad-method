          - (A+B)/2 = ωt、(A−B)/2 = −kx です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [A = ωt−kx、B = ωt+kx, 平均 ωt、差の半分 −kx, 2 sin(ωt) cos(kx)]
      - part: 今日
        text: 波長 4 m の定常波で、節の位置はどれですか。
        choices: ["x=0, 2, 4, …", "x=1, 3, 5, …", "x=0, 4, 8, …", "x=2, 6, 10, …"]
