      - part: 見本
        id: "588b969a6a"
        text: |-
          弦の定常波、すき間の干渉、うなりは、どれも波の重なりで説明できます。
          長さ L の弦の両はしが固定されているとき、両はしは節です。基本振動では λ = 2L です。
          図の左のように、n 倍振動では弦に半波長が n こ入り、λ = 2L/n、振動数は f = v/λ = nv/(2L) です。
          2 つのすき間の干渉（図の右）：すき間の間を d とすると、道のりの差は d sin θ です。d sin θ = mλ の向きに明るい線ができます。
          うなり：|f₁ − f₂|。
