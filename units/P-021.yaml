      - part: わけ
        id: "5432b789a8"
        text: 定常波の式が y = 2A sin(ωt) cos(kx) になるわけを説明しましょう。
        explain: 「y₁ = A sin(ωt − kx)、y₂ = A sin(ωt + kx)。和積の公式 sin A + sin B = 2 sin((A+B)/2) cos((A−B)/2) で、A = ωt − kx、B = ωt + kx とすると、(A+B)/2 = ωt、(A−B)/2 = −kx。cos(−kx) = cos(kx) なので、y = 2A sin(ωt) cos(kx)。」と書ければよい。① 2 つの波、② 和積の公式、③ cos(−kx) = cos(kx)。子どもには、具体的な x で確かめさせます。
        hints:
          - text: 2 つの波は、同じ形で逆向きに進みます。同じ位置で、2 つの高さを足します。
