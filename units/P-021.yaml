  - day: 4
    items:
      - part: 見本
        text: |-
          《反射》：固定端では波は逆さになって返る（位相が π ずれる）。自由端ではそのまま返る。
          《屈折》：光が境界で曲がる。n₁ sin θ₁ = n₂ sin θ₂。《屈折率》 n の媒質では速さ v = c/n。
          《回折》：波が障害物の陰に回り込む。すき間が波長くらいだとよく回り込む。
          《干渉》：2 つの波の道のりの差が mλ なら強め合い、(m + 1/2)λ なら弱め合う。
        explain: |-
          固定端反射は、壁に押さえられて逆さになる。自由端は自由に動けるので、そのまま。
          屈折は、速さが変わるために進む向きが変わる。n₁ sin θ₁ = n₂ sin θ₂。
          2 つのすき間からの光は、道のりの差で強め合い・弱め合いが決まる。
        note: 固定端は位相 π ずれ。屈折は n₁ sin θ₁ = n₂ sin θ₂。干渉は道のりの差。
      - part: 思い出す
        text: sin 45° はいくつですか。
