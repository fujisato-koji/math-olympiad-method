  - day: 3
    items:
      - part: 見本
        text: |-
          重ね合わせの原理：2 つの波が同じ所に来たとき、変位は足し合わされます。
          逆向きに進む同じ波 y₁ = A sin(ωt − kx)、y₂ = A sin(ωt + kx) を重ねると、
          y = y₁ + y₂ = 2A sin(ωt) cos(kx) になります。これが《定常波》です。
          cos(kx) = 0 の所は《節》（動かない）、|cos(kx)| = 1 の所は《腹》（大きく振動）です。
        explain: |-
          sin A + sin B = 2 sin((A+B)/2) cos((A−B)/2)。A = ωt − kx、B = ωt + kx とすると、和は 2 sin(ωt) cos(kx)。
          節は cos(kx) = 0、つまり kx = π/2、3π/2、…。x = λ/4、3λ/4、…。
          腹は cos(kx) = ±1、つまり x = 0、λ/2、λ、…。節と節の間は λ/2。
        note: 定常波は、場所によって節と腹ができる。節の間隔は λ/2。
      - part: 思い出す
        text: sin A + sin B を積の形にすると、どれですか。
        choices: ["2 sin((A+B)/2) cos((A−B)/2)", "2 cos((A+B)/2) sin((A−B)/2)", "2 sin((A+B)/2) sin((A−B)/2)", "2 cos((A+B)/2) cos((A−B)/2)"]
        answer: "2 sin((A+B)/2) cos((A−B)/2)"
        check: "'2 sin((A+B)/2) cos((A−B)/2)'"
        hints:
          - G-025 の和積の公式です。
          - sin の和は、2 sin(平均) cos(差の半分) です。
          - 求めた量の単位を確かめてから、答えましょう。
        paths:
          - [G-025 の和積, sin の和, 2 sin(平均) cos(差の半分)]
      - part: 今日
        text: y₁ = sin(ωt − kx)、y₂ = sin(ωt + kx) を重ねると、どれですか。
        choices: ["2 sin(ωt) cos(kx)", "2 cos(ωt) sin(kx)", "2 sin(ωt) sin(kx)", "0"]
