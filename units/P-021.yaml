# P-021 波の性質
#
# 段 5・水準 3・8 日。前提は G-025（三角関数の加法定理）。
# 波の表し方、正弦波、重ね合わせと定常波、反射・屈折・回折・干渉、うなりと群速度を扱う。
# 微積分は使わず、差分で群速度を考える。答えは子の画面に出さない（保護者の表示だけ）。
# 用語の説明は、原稿で《用語》と囲んだ所だけに付く（D-063）。

id: P-021
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          波は、振動が空間を伝わるものです。波の山から次の山までの距離を《波長》 λ、1 つの振動にかかる時間を《周期》 T といいます。
          《振動数》 f は 1 秒あたりの振動の回数で、f = 1/T。
          波の速さ v は、1 周期でちょうど 1 波長進むので、v = λ/T = fλ です。
          横波は振動の向きが進む向きに垂直、縦波は平行です。
        explain: |-
          【定義】・λ は波長（山から次の山までの長さ）。
          ・T は周期（1 回の振動にかかる時間）。
          ・f は振動数（1 秒あたりの振動の回数）。f = 1/T。
          ・速さは v = λ/T = fλ。
          ｜量｜記号｜意味｜
          ｜波長｜λ｜山から次の山までの長さ｜
          ｜周期｜T｜1 回の振動にかかる時間｜
          ｜振動数｜f｜1 秒あたりの振動の回数｜
          ｜速さ｜v｜1 秒に進む距離。v = fλ｜
          ・例：f = 2 Hz、λ = 3 m なら、v = 6 m/s、T = 0.5 s。
          ・横波：光、弦の波。縦波：音（空気の疎密）。
        note: v = fλ は、振動数と波長と速さの関係。単位は f が Hz、λ が m、v が m/s。
      - part: 思い出す
        text: sin 30° はいくつですか。
        choices: ["1/2", "√2/2", "√3/2", "1"]
        answer: "1/2"
        check: "Fraction(1, 2)"
        hints:
          - 30°、60°、90° の直角三角形を思い出しましょう。
          - 30° の向かい側の辺は、斜辺の半分です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [30° の直角三角形, 向かい側は斜辺の半分, sin 30° = 1/2]
      - part: 今日
        text: 振動数 2 Hz、波長 3 m の波の速さはいくつですか。
        choices: [1.5, 5, 6, 12]
        answer: 6
        check: "2 * 3"
        hints:
          - v = fλ です。
          - 2 × 3 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [v = fλ, 2 × 3 = 6 m/s]
      - part: 今日
        text: 周期 0.5 s の波の振動数はいくつですか。
        choices: [0.5, 1, 2, 4]
        answer: 2
        check: "f'{1 / 0.5:.0f}'"
        hints:
          - f = 1/T です。
          - 1 ÷ 0.5 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [f = 1/T, 1/0.5 = 2 Hz]
      - part: 挑戦
        text: 速さ 340 m/s、振動数 170 Hz の音の波長はいくつですか。
        choices: [0.5, 1, 2, 4]
        answer: 2
        check: "f'{340 / 170:.0f}'"
        hints:
          - v = fλ を λ = v/f に直しましょう。
          - 340 ÷ 170 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [λ = v/f, 340/170 = 2 m]
