        text: 正弦波の式 y = A sin(ωt − kx) で、ω = 2π/T、k = 2π/λ になるわけを説明しましょう。
        explain: 「位置 x を固定すると、t が T だけ進むときに位相 ωt が 2π 進んで、もとの形にもどる。だから ωT = 2π、ω = 2π/T。時間 t を固定すると、x が λ だけ進むときに位相 kx が 2π 進む。だから kλ = 2π、k = 2π/λ。」と書ければよい。① 1 周期で位相 2π、② 1 波長で位相 2π、③ ω と k の定義。子どもには、具体的な T、λ で確かめさせます。
        hints:
