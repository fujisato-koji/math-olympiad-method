      - part: わけ
        id: "b188547c42"
        text: 弦の n 倍振動の振動数が nv/(2L) になるわけを説明しましょう。
        explain: 「両はしが節なので、弦の上には半波長が整数個入る。n 倍振動では n 個の半波長が入るので、L = nλ/2、λ = 2L/n。f = v/λ = nv/(2L)。」と書ければよい。① 両はしが節、② 半波長が n 個、③ f = v/λ。子どもには、n=1、2、3 の図で確かめさせます。
        hints:
          - 弦の両はしは節です。
