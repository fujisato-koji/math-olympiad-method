or" stroke-width="1" stroke-dasharray="3 3"/><line x1="235" y1="92" x2="235" y2="118" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="109.9" y1="96" x2="230.1" y2="96" stroke="currentColor" stroke-width="1.5"/><polygon points="235,96 228,99.5 228,92.5" fill="currentColor" stroke="none"/><polygon points="105,96 112,92.5 112,99.5" fill="currentColor" stroke="none"/><text x="170" y="90" font-size="12" text-anchor="middle" fill="currentColor">うなり 1 回</text><text x="306" y="196" font-size="12" text-anchor="end" fill="#b39ddb">点線：包絡線</text></svg>'
        explain: |-
          sin(2πf₁t) + sin(2πf₂t) = 2 cos(2π((f₁−f₂)/2)t) sin(2π((f₁+f₂)/2)t)。包絡線の振動数は |f₁−f₂|/2 ですが、山の重なりは 1 周期に 2 回なので、うなりは |f₁−f₂| 回です。
          例：440 Hz と 442 Hz なら、うなりは 2 Hz。図は f₁ = 10、f₂ = 12 の 1 秒分で、うなりは 2 回。
          群速度：ω₁=10、k₁=2、ω₂=12、k₂=3 なら、v_g = (12−10)/(3−2) = 2。
        note: うなりは振動数の差。群速度は Δω/Δk、位相速度は ω/k。
