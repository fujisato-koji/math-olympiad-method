      - part: 見本
        id: "b00ed73b6a"
        text: |-
          《反射》：はしを固定したロープ（固定端）では、波は上下が逆さになって返ります（位相が π ずれる）。はしが自由に動ける自由端では、そのまま返ります。
          《回折》：波が、すき間を通ったあと、かべのかげの方へ回りこみます。すき間の広さが波長くらいだと、よく回りこみます。
          《屈折》：光が境の面で曲がります。n₁ sin θ₁ = n₂ sin θ₂。《屈折率》 n の物の中では、光の速さは v = c/n です。
          《干渉》：2 つの波の道のりの差が mλ なら強め合い、(m + 1/2)λ なら弱め合います（m = 0、1、2、…）。
