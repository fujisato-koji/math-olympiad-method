# P-021 波の性質
#
# 水準 4・8 日。前提は G-025（三角関数の加法定理）。
# 波の表し方、正弦波、重ね合わせと定常波、反射・屈折・回折・干渉、うなりと群速度を扱う。
# 微積分は使わず、差分で群速度を考える。答えは子の画面に出さない（保護者の表示だけ）。
# 用語の説明は、原稿で《用語》と囲んだ所だけに付く（D-063）。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の直し（D-131、-fix3）：どの見本にも図を付けた（1 日目 横波の波長と縦波のこい所・うすい所、2 日目 振幅と波長と単振動する点、
#   3 日目 定常波の節と腹、4 日目 固定端と自由端の反射・回折・屈折・干渉、5 日目 うなりと包絡線、7 日目 弦の n 倍振動とすき間の道のりの差）。
#   答える問題は、目もり付きの波、ゆれのグラフ、定常波、光の道すじ、弦、(k, ω) の点の図を見て読む形にした。
#   ヒントの図は、1 秒間にならぶ波長、式のどこに何があるかの色分け、1 波長の中のふくらみ、P でそろえた 2 つの波、
#   1 回多くゆれるとそろう山、弦の波をつづけた 1 波長など。正解の値や向きはかかない。
#   この単元の用語の 振幅、固定端、自由端、縦波、弦、包絡線 は漢字のまま書く。
#   4 日目の予備の回折の問いは、前の選択肢では「すき間が波長よりずっとせまい」も正しくなりうるので、
#   すき間 ア・イ の図をくらべる形に直した（id を消した）。

id: P-021
days:
  - day: 1
    items:
      - part: 見本
        id: "c5c36a560e"
        text: |-
          波は、ゆれ（振動）が次々に伝わっていくものです。山から次の山までの長さを《波長》 λ、1 回ゆれるのにかかる時間を《周期》 T といいます。
          《振動数》 f は 1 秒あたりにゆれる回数で、f = 1/T です。
          波は 1 周期のあいだに、ちょうど 1 波長進みます。だから、速さは v = λ/T = fλ です。
          図の上の横波は、ゆれる向きが進む向きと直角です。下の縦波は、ゆれる向きが進む向きと同じで、こい所とうすい所が伝わります。
