      - part: 見本
        text: |-
          正弦波は y = A sin(2π(t/T − x/λ)) と書けます。A は振幅、T は周期、λ は波長です。
          ω = 2πf = 2π/T を角振動数、k = 2π/λ を波数といい、y = A sin(ωt − kx) とも書けます。
          位置 x を止めると、y は時間の単振動。時間 t を止めると、y は空間の正弦波です。
        explain: |-
          A は山の高さ、T は 1 振動の時間、λ は 1 波長の長さ。ω = 2π/T、k = 2π/λ。
          例：A = 2、T = 4、λ = 8 なら、ω = 2π/4 = π/2、k = 2π/8 = π/4。
          t = 0、x = 0 で y = 0。t = 1、x = 0 で y = 2 sin(π/2) = 2。
        note: y = A sin(ωt − kx)。ω は時間の角、k は空間の角。v = ω/k = fλ。
        svg: |-
          <svg viewBox="0 0 360 120" role="img" aria-label="正弦波のグラフ">
            <line x1="20" y1="60" x2="340" y2="60" stroke="currentColor" stroke-width="1" opacity=".45"/>
            <line x1="20" y1="15" x2="20" y2="105" stroke="currentColor" stroke-width="1" opacity=".45"/>
            <path d="M20 60 C 60 10, 100 10, 140 60 S 220 110, 260 60 S 320 10, 340 40" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <text x="328" y="78" font-size="12" fill="currentColor">x</text>
            <text x="7" y="22" font-size="12" fill="currentColor">y</text>
            <text x="24" y="56" font-size="11" fill="currentColor">0</text>
          </svg>
