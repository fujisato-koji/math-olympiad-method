  - day: 5
    items:
      - part: 見本
        id: "6c37da05e4"
        text: |-
          《うなり》：振動数が少しちがう 2 つの音を重ねると、図のように、大きくなったり小さくなったりをくり返します。f₁、f₂ のうなりの振動数は |f₁ − f₂| です。
          《群速度》：波の大きさの変わり方をなぞった線（包絡線、図の点線）が進む速さです。2 つの波の角振動数の差を Δω、波数の差を Δk とすると、v_g = Δω/Δk です。
          《位相速度》：1 つ 1 つの山が進む速さで、v_p = ω/k です。真空中の光では v_g = v_p = c ですが、水の波などではちがうことがあります。
