        paths:
          - [1 周期で位相 2π, ωT = 2π, 1 波長で位相 2π, kλ = 2π]
      - part: わけ
        text: 定常波の節と節の間隔が λ/2 になるわけを説明しましょう。
        explain: 「定常波は y = 2A sin(ωt) cos(kx)。節は cos(kx) = 0 の所で、kx = π/2、3π/2、5π/2、…。k = 2π/λ なので、x = λ/4、3λ/4、5λ/4、…。となりの節の差は 3λ/4 − λ/4 = λ/2。」と書ければよい。① 節は cos(kx)=0、② k=2π/λ、③ 差をとる。子どもには、λ の具体例で確かめさせます。
        hints:
          - 節は cos(kx) = 0 の所です。
          - k = 2π/λ を入れて、x を求めましょう。
          - x = λ/4、3λ/4、… なので、間隔は λ/2 です。
        paths:
          - [節は cos(kx)=0, k=2π/λ, x=λ/4、3λ/4、…, 間隔 λ/2]
      - part: わけ
        text: 2 つの波の群速度が v_g = Δω/Δk になるわけを説明しましょう。
        explain: 「2 つの波を足すと、2A cos((Δω t − Δk x)/2) sin((ω_avg t − k_avg x)/2) の形になる。包絡線の cos が一定になる所は Δω t − Δk x = 一定。これを x について解くと、x = (Δω/Δk)t + 一定。よって包絡線は v_g = Δω/Δk で進む。」と書ければよい。① 2 つの波の和、② 包絡線が一定になる条件、③ x について解く。子どもには、具体例で確かめさせます。
        hints:
          - 2 つの波を足すと、包絡線の cos と、速く振動する sin に分かれます。
          - 包絡線が一定になるのは、Δω t − Δk x が一定のときです。
          - x = (Δω/Δk)t + 一定 なので、速さは Δω/Δk です。
        paths:
          - [2 つの波の和, 包絡線 Δω t − Δk x, x = (Δω/Δk)t + 一定, v_g = Δω/Δk]

