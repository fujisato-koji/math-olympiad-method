      - part: わけ
        id: "5ba25bdfcb"
        text: 2 つの波の群速度が v_g = Δω/Δk になるわけを説明しましょう。
        explain: 「2 つの波を足すと、2A cos((Δω t − Δk x)/2) sin(ω t − k x) の形になる。ここで ω、k は 2 つの波の平均の角振動数と波数です。包絡線の cos が一定になる所は Δω t − Δk x = 一定。これを x について解くと、x = (Δω/Δk)t + 一定。よって包絡線は v_g = Δω/Δk で進む。」と書ければよい。① 2 つの波の和、② 包絡線が一定になる条件、③ x について解く。子どもには、具体例で確かめさせます。
        hints:
          - 2 つの波を足すと、ゆっくり変わる包絡線の cos と、速くゆれる sin に分かれます。
          - text: 包絡線の山（赤い点）は、Δω t − Δk x が一定の所です。時こくが進むと、赤い点は右へ動きます。
