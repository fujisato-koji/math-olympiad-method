        explain: |-
          弦の両はしが節になるので、基本振動では弦の長さが半波長。λ = 2L。
          n 倍振動では、弦の上に n 個の半波長が入る。λ = 2L/n。
          すき間の干渉では、道のりの差 d sin θ が mλ のとき強め合う。
        note: 弦は両端が節。基本 λ=2L、n 倍振動 λ=2L/n。干渉は道のりの差。
