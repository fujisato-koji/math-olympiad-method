idth="5" height="20" rx="0" fill="#c8ccd6" stroke="currentColor" stroke-width="1" fill-opacity="0.7"/><rect x="200" y="162" width="5" height="30" rx="0" fill="#c8ccd6" stroke="currentColor" stroke-width="1" fill-opacity="0.7"/><line x1="306" y1="104" x2="306" y2="194" stroke="currentColor" stroke-width="2"/><line x1="205" y1="133" x2="306" y2="118" stroke="#f08080" stroke-width="2"/><line x1="205" y1="159" x2="306" y2="118" stroke="#3b8fd0" stroke-width="2"/><circle cx="306" cy="118" r="4" fill="#f3c969" stroke="currentColor" stroke-width="1.5"/><text x="250" y="190" font-size="11" text-anchor="middle" fill="currentColor">道のりの差</text></svg>'
        explain: |-
          固定端反射は、かべに止められて逆さになる。自由端は自由に動けるので、そのまま。
          回折は、すき間の中の各点から小さな丸い波が広がると考えると説明できる（ホイヘンスの原理）。
          屈折は、速さが変わるために進む向きが変わる。n₁ sin θ₁ = n₂ sin θ₂。
          2 つのすき間からの光は、道のりの差で強め合い・弱め合いが決まる。
        note: 固定端は位相 π ずれ。屈折は n₁ sin θ₁ = n₂ sin θ₂。干渉は道のりの差。
      - part: 思い出す
        id: "d1725b0d36"
        text: 図の直角二等辺三角形で、sin 45° はどれですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="70,170 210,170 210,30" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><path d="M198 170 L198 158 L210 158" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M100 170 A30 30 0 0 0 91.2 148.8" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="106" y="162" font-size="13" text-anchor="start" fill="currentColor">45°</text><text x="140" y="190" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><text x="220" y="105" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">1</text><text x="130" y="92" font-size="15" text-anchor="end" fill="currentColor" font-weight="bold">√2</text></svg>'
        choices: ["1/2", "√2/2", "√3/2", "1"]
        answer: "√2/2"
        check: "'√2/2'"
        hints:
          - sin 45° は、45° の角の向かい側の辺 ÷ いちばん長い辺です。
          - text: 向かい側の辺を赤、いちばん長い辺を青にしました。赤 ÷ 青を計算しましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="70,170 210,170 210,30" fill="#f3c969" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="210" y1="170" x2="210" y2="30" stroke="#f08080" stroke-width="5"/><line x1="70" y1="170" x2="210" y2="30" stroke="#3b8fd0" stroke-width="5"/><path d="M198 170 L198 158 L210 158" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M100 170 A30 30 0 0 0 91.2 148.8" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="106" y="162" font-size="13" text-anchor="start" fill="currentColor">45°</text><text x="140" y="190" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><text x="220" y="105" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">1</text><text x="130" y="92" font-size="15" text-anchor="end" fill="currentColor" font-weight="bold">√2</text></svg>'
          - 1/√2 は、分母と分子に √2 をかけると形が変わります。
        paths:
          - [45° の直角二等辺三角形, 1:1:√2, sin 45° = √2/2]
