      - part: わけ
        id: "e06c1e6a56"
        text: うなりの振動数が |f₁ − f₂| になるわけを説明しましょう。
        explain: 「sin(2πf₁t) + sin(2πf₂t) = 2 cos(2π((f₁−f₂)/2)t) sin(2π((f₁+f₂)/2)t)。包絡線の cos は振動数 |f₁−f₂|/2 で、1 周期のあいだに山が 2 回通る。だから、音が大きくなる回数は |f₁−f₂| 回。」と書ければよい。① 和積の公式、② 包絡線の振動数、③ 山は 1 周期に 2 回。子どもには、具体的な数で確かめさせます。
        hints:
          - 2 つの音を足して和積の公式を使うと、包絡線の cos の振動数は |f₁ − f₂|/2 になります。
