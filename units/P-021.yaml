        text: 図のように、空気（n = 1）から屈折率 √2 の物に、入射角 45° で光が入ります。屈折角 θ₂ はいくつですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="100" width="312" height="94" rx="0" fill="#7fc8f8" stroke="none" stroke-width="0" fill-opacity="0.25"/><line x1="4" y1="100" x2="316" y2="100" stroke="currentColor" stroke-width="2"/><line x1="160" y1="14" x2="160" y2="190" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/><text x="164" y="14" font-size="12" text-anchor="start" fill="currentColor">法線</text><text x="12" y="30" font-size="14" text-anchor="start" fill="currentColor">空気 n = 1</text><text x="12" y="184" font-size="14" text-anchor="start" fill="currentColor">屈折率 n = √2</text><line x1="94.9" y1="34.9" x2="160" y2="100" stroke="#f08080" stroke-width="2.5"/><polygon points="127.5,67.5 117.9,64.3 124.3,57.9" fill="#f08080" stroke="none"/><line x1="160" y1="100" x2="206" y2="179.7" stroke="#f08080" stroke-width="2.5"/><polygon points="186,145 177.6,139.5 185.4,135" fill="#f08080" stroke="none"/><path d="M160 66 A34 34 0 0 0 136 76" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="122" y="78" font-size="13" text-anchor="end" fill="currentColor">θ₁ = 45°</text><path d="M160 134 A34 34 0 0 0 177 129.4" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="193.1" y="140" font-size="13" text-anchor="start" fill="currentColor">θ₂</text></svg>'
        choices: ["30°", "45°", "60°", "90°"]
        answer: "30°"
        check: "'30°'"
        hints:
          - n₁ sin θ₁ = n₂ sin θ₂ です。角は法線から測ります。
          - text: 空気の側と下の側で、n × sin（角）が等しくなります。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="100" width="312" height="94" rx="0" fill="#7fc8f8" stroke="none" stroke-width="0" fill-opacity="0.25"/><line x1="4" y1="100" x2="316" y2="100" stroke="currentColor" stroke-width="2"/><rect x="40" y="40" width="240" height="36" rx="6" fill="#f3c969" stroke="currentColor" stroke-width="1.5" fill-opacity="0.35"/><text x="160" y="64" font-size="16" text-anchor="middle" fill="currentColor">空気：1 × sin 45°</text><rect x="40" y="126" width="240" height="36" rx="6" fill="#f3c969" stroke="currentColor" stroke-width="1.5" fill-opacity="0.35"/><text x="160" y="150" font-size="16" text-anchor="middle" fill="currentColor">√2 × sin θ₂</text><text x="160" y="108" font-size="22" text-anchor="middle" fill="currentColor" font-weight="bold">=</text></svg>'
          - sin 45° = √2/2 です。sin θ₂ を求めてから、その角を考えましょう。
        paths:
          - [1 × √2/2 = √2 sin θ₂, sin θ₂ = 1/2, θ₂ = 30°]
