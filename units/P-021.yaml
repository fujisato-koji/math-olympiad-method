  - day: 2
    items:
      - part: 見本
        id: "556e325d2d"
        text: |-
          正弦波は y = A sin(2π(t/T − x/λ)) と書けます。A は振幅（山の高さ）、T は周期、λ は波長です。
          ω = 2πf = 2π/T を角振動数、k = 2π/λ を波数といい、y = A sin(ωt − kx) とも書けます。
          図のように、ある時こくの波の形は正弦の曲線です。1 つの位置の点（むらさきの点）は、上下に単振動します。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="98" x2="306" y2="98" stroke="currentColor" stroke-width="1.5"/><polygon points="312,98 305,101.5 305,94.5" fill="currentColor" stroke="none"/><text x="312" y="116" font-size="13" text-anchor="end" fill="currentColor">x</text><line x1="40" y1="172" x2="40" y2="30" stroke="currentColor" stroke-width="1.5"/><polygon points="40,24 43.5,31 36.5,31" fill="currentColor" stroke="none"/><text x="32" y="30" font-size="13" text-anchor="end" fill="currentColor">y</text><text x="34" y="114" font-size="12" text-anchor="end" fill="currentColor">0</text><path d="M40 98 L42 102.6 L44 107.2 L46 111.7 L48 116.1 L50 120.3 L52 124.3 L54 128.1 L56 131.5 L58 134.7 L60 137.5 L62 140 L64 142 L66 143.7 L68 144.9 L70 145.7 L72 146 L74 145.9 L76 145.3 L78 144.3 L80 142.9 L82 141 L84 138.8 L86 136.1 L88 133.1 L90 129.8 L92 126.2 L94 122.3 L96 118.2 L98 113.9 L100 109.5 L102 104.9 L104 100.3 L106 95.7 L108 91.1 L110 86.5 L112 82.1 L114 77.8 L116 73.7 L118 69.8 L120 66.2 L122 62.9 L124 59.9 L126 57.2 L128 55 L130 53.1 L132 51.7 L134 50.7 L136 50.1 L138 50 L140 50.3 L142 51.1 L144 52.3 L146 54 L148 56 L150 58.5 L152 61.3 L154 64.5 L156 67.9 L158 71.7 L160 75.7 L162 79.9 L164 84.3 L166 88.8 L168 93.4 L170 98 L172 102.6 L174 107.2 L176 111.7 L178 116.1 L180 120.3 L182 124.3 L184 128.1 L186 131.5 L188 134.7 L190 137.5 L192 140 L194 142 L196 143.7 L198 144.9 L200 145.7 L202 146 L204 145.9 L206 145.3 L208 144.3 L210 142.9 L212 141 L214 138.8 L216 136.1 L218 133.1 L220 129.8 L222 126.2 L224 122.3 L226 118.2 L228 113.9 L230 109.5 L232 104.9 L234 100.3 L236 95.7 L238 91.1 L240 86.5 L242 82.1 L244 77.8 L246 73.7 L248 69.8 L250 66.2 L252 62.9 L254 59.9 L256 57.2 L258 55 L260 53.1 L262 51.7 L264 50.7 L266 50.1 L268 50 L270 50.3 L272 51.1 L274 52.3 L276 54 L278 56 L280 58.5 L282 61.3 L284 64.5 L286 67.9 L288 71.7 L290 75.7 L292 79.9 L294 84.3 L296 88.8 L298 93.4 L300 98" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><line x1="137.5" y1="93.1" x2="137.5" y2="54.9" stroke="#f08080" stroke-width="1.5"/><polygon points="137.5,50 141,57 134,57" fill="#f08080" stroke="none"/><polygon points="137.5,98 134,91 141,91" fill="#f08080" stroke="none"/><text x="129.5" y="42" font-size="13" text-anchor="end" fill="#f08080">A（振幅）</text><line x1="137.5" y1="50" x2="137.5" y2="26" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="267.5" y1="50" x2="267.5" y2="26" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="142.4" y1="30" x2="262.6" y2="30" stroke="#7fc8f8" stroke-width="1.5"/><polygon points="267.5,30 260.5,33.5 260.5,26.5" fill="#7fc8f8" stroke="none"/><polygon points="137.5,30 144.5,26.5 144.5,33.5" fill="#7fc8f8" stroke="none"/><text x="202.5" y="24" font-size="13" text-anchor="middle" fill="currentColor">λ（波長）</text><circle cx="72.5" cy="146" r="5" fill="#b39ddb" stroke="currentColor" stroke-width="1.5"/><line x1="86.5" y1="141.1" x2="86.5" y2="74.9" stroke="#b39ddb" stroke-width="1.5"/><polygon points="86.5,70 90,77 83,77" fill="#b39ddb" stroke="none"/><polygon points="86.5,146 83,139 90,139" fill="#b39ddb" stroke="none"/><text x="94.5" y="190" font-size="12" text-anchor="start" fill="currentColor">この点は上下に単振動</text></svg>'
        explain: |-
          A は山の高さ、T は 1 振動の時間、λ は 1 波長の長さ。ω = 2π/T、k = 2π/λ。
          例：A = 2、T = 4、λ = 8 なら、ω = 2π/4 = π/2、k = 2π/8 = π/4。
          t = 0、x = 0 で y = 0。t = 1、x = 0 で y = 2 sin(π/2) = 2。
          図は t = 0 の形（y = −A sin kx）。
        note: y = A sin(ωt − kx)。ω は時間の角、k は空間の角。v = ω/k = fλ。
      - part: 思い出す
        id: "a850366db0"
        text: 図は半径 1 の単位円で、P は 90° の点です。sin 90° はどれですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="70" y1="112" x2="250" y2="112" stroke="currentColor" stroke-width="1.5"/><polygon points="256,112 249,115.5 249,108.5" fill="currentColor" stroke="none"/><text x="258" y="130" font-size="13" text-anchor="end" fill="currentColor">x</text><line x1="160" y1="192" x2="160" y2="26" stroke="currentColor" stroke-width="1.5"/><polygon points="160,20 163.5,27 156.5,27" fill="currentColor" stroke="none"/><text x="152" y="26" font-size="13" text-anchor="end" fill="currentColor">y</text><circle cx="160" cy="112" r="72" fill="none" stroke="currentColor" stroke-width="2"/><text x="154" y="128" font-size="13" text-anchor="end" fill="currentColor">O</text><text x="236" y="128" font-size="13" text-anchor="start" fill="currentColor">1</text><line x1="160" y1="112" x2="160" y2="40" stroke="#f08080" stroke-width="2.5"/><circle cx="160" cy="40" r="5" fill="#f08080" stroke="currentColor" stroke-width="1.5"/><text x="170" y="38" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">P</text><path d="M172 112 L172 100 L160 100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><text x="178" y="96" font-size="13" text-anchor="start" fill="currentColor">90°</text></svg>'
