    items:
      - part: 見本
        text: |-
          《うなり》：振動数が少しちがう 2 つの音を重ねると、大きくなったり小さくなったりをくり返します。
          f₁、f₂ のうなりの振動数は |f₁ − f₂| です。
          《群速度》（波の束が進む速さ）：2 つの波の角振動数と波数の差を Δω、Δk とすると、波の束（包絡線）は v_g = Δω/Δk で進みます。
          《位相速度》は v_p = ω/k です。真空中の光では v_g = v_p = c ですが、媒質の中ではちがうことがあります。
        explain: |-
          sin(2πf₁t) + sin(2πf₂t) = 2 cos(2π((f₁−f₂)/2)t) sin(2π((f₁+f₂)/2)t)。包絡線の振動数は |f₁−f₂|/2 ですが、山の重なりは 1 周期に 2 回なので、うなりは |f₁−f₂| 回です。
          例：440 Hz と 442 Hz なら、うなりは 2 Hz。
          群速度：ω₁=10、k₁=2、ω₂=12、k₂=3 なら、v_g = (12−10)/(3−2) = 2。
        note: うなりは振動数の差。群速度は Δω/Δk、位相速度は ω/k。
