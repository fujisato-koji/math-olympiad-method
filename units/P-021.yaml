            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="70" y1="112" x2="250" y2="112" stroke="currentColor" stroke-width="1.5"/><polygon points="256,112 249,115.5 249,108.5" fill="currentColor" stroke="none"/><text x="258" y="130" font-size="13" text-anchor="end" fill="currentColor">x</text><line x1="160" y1="192" x2="160" y2="26" stroke="currentColor" stroke-width="1.5"/><polygon points="160,20 163.5,27 156.5,27" fill="currentColor" stroke="none"/><text x="152" y="26" font-size="13" text-anchor="end" fill="currentColor">y</text><circle cx="160" cy="112" r="72" fill="none" stroke="currentColor" stroke-width="2"/><text x="154" y="128" font-size="13" text-anchor="end" fill="currentColor">O</text><text x="236" y="128" font-size="13" text-anchor="start" fill="currentColor">1</text><line x1="160" y1="112" x2="222.4" y2="76" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/><line x1="222.4" y1="76" x2="222.4" y2="112" stroke="#f08080" stroke-width="3"/><circle cx="222.4" cy="76" r="4" fill="#f08080" stroke="currentColor" stroke-width="1.5"/><text x="230.4" y="74" font-size="12" text-anchor="start" fill="currentColor">30°</text><line x1="160" y1="112" x2="196" y2="49.6" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/><line x1="196" y1="49.6" x2="196" y2="112" stroke="#f08080" stroke-width="3"/><circle cx="196" cy="49.6" r="4" fill="#f08080" stroke="currentColor" stroke-width="1.5"/><text x="204" y="47.6" font-size="12" text-anchor="start" fill="currentColor">60°</text><circle cx="160" cy="40" r="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="170" y="38" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">P</text></svg>'
