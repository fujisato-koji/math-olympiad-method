# L-013 命題と条件（必要条件と十分条件）
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の文（です・ます）。
# 前提は L-008（条件を整理する推理）、A-010（文字と式）、A-013（不等式の性質と 1 次不等式）。
#   たどると A-011（1 次方程式）、N-027（正負の数）、N-011（絶対値）、N-017（倍数と約数）、A-009（累乗）までなので、
#   数は負の数と分数まで、式は 1 次の式と x²（x × x）までにした。平方根（A-016）と展開（A-015）は前提にないので使わない。
#   偶数・奇数は A-010 のとおり 2n、2n + 1 と表す。
# 集合（A-024）はこの単元のあとなので、記号 ⊂ や「集合」の語は使わず、範囲は数直線と「〜を満たす数」で言う。
# 背理法（L-011）もこの単元のあとなので、ここでは「仮定して矛盾を導く」示し方は使わない。対偶は「真偽が一致する」として使う。
# 日の並びは地図の既定（導入、練習、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：命題と真偽。「すべての〜」「p ならば q」が偽であることは反例 1 つで示せる。命題の否定（「すべて」の否定は「〜でないものがある」）。
#   2 日目 練習：逆と対偶（裏にもふれる）。必要条件、十分条件、必要十分条件。頭に見本を置く。
#   3 日目 わけ：「ならば」が真であることを不等式の性質と文字で示す、十分だが必要でないことを示す、対偶を使って示す（段 4 の深さ ③）。
#   4 日目 混ぜる：「かつ」「または」の否定（頭に見本）。L-008 の推理（並び、正直者とうそつき、「ならば」のヒント）と A-013 の不等式を混ぜる。
#   5 日目 確認。
# 地図の 5 日には、命題・反例・否定・逆と対偶・必要十分・「かつ」「または」が入り、1 日の中身が多い。
# 選択肢の言い方は、必要十分の問題では次の 4 つにそろえた：
#   必要条件だが十分条件ではない、十分条件だが必要条件ではない、必要十分条件、必要条件でも十分条件でもない。
# check：
#   真偽は、数の範囲を全部ためして「ならば」の前を満たすものがすべて後ろも満たすかを all で調べる。
#   実数の範囲は −20 から 20 までの 1/2 きざみ（Fraction）、整数は range で代わりに調べる（反例がこの範囲にあることも確かめる）。
#   必要十分は、p ならば q（十分）を 1、q ならば p（必要）を 2 として足し、4 つの言い方のどれかを返す。
#   否定を選ぶ問題は、選択肢ごとの条件が、どの場合にも「もとの条件が成り立たない」ことと一致するものを選び出す。1 つでないときは「きまらない」。
#   推理は L-008 の形（ありうる場合を itertools で全部作り、ヒントに合うものだけを残す。1 つに決まらないときは「きまらない」）。
#   命題を選ぶ問題と、逆や対偶の形だけをたずねる問題は約束ごとなので check を付けない。

id: L-013
days:
  - day: 1
    items:
      - part: 見本
        text: 「4 の倍数はすべて 2 の倍数である」と「2 の倍数はすべて 4 の倍数である」は、それぞれ正しいでしょうか。
        explain: 正しいか正しくないかがはっきり決まる文を命題といい、正しい命題を真、正しくない命題を偽といいます。4 の倍数は整数 k を使って 4k と書け、4k = 2 × 2k なので、どれも 2 の倍数です。だから前の命題は真です。後ろの命題は、6 が 2 の倍数なのに 4 の倍数ではないので偽です。このように、合わない例（反例）を 1 つ挙げれば、「すべての〜は…である」が偽だと示せます。真だと示すには、例をいくつ挙げても足りず、どの場合にも成り立つわけが要ります。また、命題 p に対して「p でない」を p の否定といいます。p が真なら否定は偽、p が偽なら否定は真です。「すべての〜は…である」の否定は「…でない〜が少なくとも 1 つある」です。
      - part: 思い出す
        text: 犬、ねこ、うさぎが、赤・青・黄のかさを 1 本ずつ持っています。犬は赤ではありません。ねこは赤でも青でもありません。うさぎのかさは何色ですか。
        figure: "　🟥🟦🟨\n🐶⬜⬜⬜\n🐱⬜⬜⬜\n🐰⬜⬜⬜"
        choices: [赤, 青, 黄]
        answer: 赤
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[2] for p in itertools.permutations(['赤', '青', '黄']) if p[0] != '赤' and p[1] not in ['赤', '青']])))"
        hints:
          - ヒントを表に ⭕ と ❌ で書きこもう。
          - ねこの行は ❌ がいくつになるかな。
          - ねこが決まったら、犬、うさぎの順に決めよう。
        paths:
          - [ねこは赤でも青でもないので黄, 犬は赤でも黄でもないので青, うさぎは赤]
      - part: 思い出す
        text: 不等式 3x − 4 > 11 を解くと、x > □ になります。□ にあてはまる数はいくつですか。
        answer: 5
        check: "Fraction(11 + 4, 3)"
        hints:
          - −4 を右辺に移項しよう。
          - 3x > 15 になるね。
          - 両辺を正の数でわっても、不等号の向きは変わらないよ。
        paths:
          - [3x > 11 + 4, 3x > 15, x > 5]
      - part: 今日
        text: 命題「2 けたの整数で 3 の倍数であるものは、すべて 9 の倍数である」は、真ですか、偽ですか。
        choices: [真, 偽]
        answer: 偽
        check: "'真' if all(n % 9 == 0 for n in range(10, 100) if n % 3 == 0) else '偽'"
        hints:
          - 2 けたの 3 の倍数を、小さいほうからいくつか書き出そう。
          - 書き出した数は、9 の倍数になっているかな。
          - 合わない例が 1 つでもあれば、命題はどうなるかな。
        paths:
          - [12 は 3 の倍数, 12 は 9 の倍数ではない, 反例があるので偽]
        note: 18、27 のように 9 の倍数になる例だけを見て「真」と答えやすい。合う例をいくつ見つけても真とは言えないが、反例は 1 つで偽と言える。
      - part: 今日
        text: 命題「x > 2 ならば x > 5」の反例になるのは、どれですか。
        choices: [x = 1, x = 4, x = 7]
        answer: x = 4
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, x in {'x = 1': 1, 'x = 4': 4, 'x = 7': 7}.items() if x > 2 and not x > 5])"
        hints:
          - 反例は「x > 2 は満たすのに、x > 5 は満たさない」x のことだね。
          - x = 1 は、x > 2 を満たすかな。
          - 3 つとも、2 つの不等式にあてはめて調べよう。
        paths:
          - [x = 1 は x > 2 を満たさない, x = 7 は x > 5 も満たす, x = 4 は x > 2 を満たし x > 5 を満たさない, x = 4]
        note: x = 1 を選びやすい。x = 1 は「ならば」の前（x > 2）を満たしていないので、反例にならない。
      - part: 今日
        text: 袋に玉が 3 個入っています。命題「袋の玉はすべて赤い」の否定は、どれですか。
        choices: [袋の玉はすべて赤くない, 袋の玉に赤くないものが少なくとも 1 個ある, 袋の玉に赤いものが少なくとも 1 個ある]
        answer: 袋の玉に赤くないものが少なくとも 1 個ある
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'袋の玉はすべて赤くない': lambda t: all(x != '赤' for x in t), '袋の玉に赤くないものが少なくとも 1 個ある': lambda t: any(x != '赤' for x in t), '袋の玉に赤いものが少なくとも 1 個ある': lambda t: any(x == '赤' for x in t)}.items() if all(f(t) == (not all(x == '赤' for x in t)) for t in itertools.product(['赤', '白'], repeat=3))])"
        hints:
          - 否定は、もとの命題が偽のときにちょうど真になる文だね。
          - 「すべて赤い」が偽になるのは、玉がどうなっているときかな。
          - 赤・赤・白の袋のとき、3 つの文がそれぞれ真か偽かを調べよう。
        paths:
          - [「すべて赤い」が偽になるのは 1 個でも赤くない玉があるとき, 赤くないものが少なくとも 1 個ある]
        note: 「すべて赤くない」（全部が赤以外）を選びやすい。赤・赤・白の袋では、もとの命題も「すべて赤くない」も偽になってしまう。
      - part: 挑戦
        text: 命題「どんな整数 x でも、x² > x である」は偽です。反例になる整数のうち、いちばん大きいものはいくつですか。
        answer: 1
        check: "max(x for x in range(-50, 51) if not x * x > x)"
        hints:
          - x = 3、x = −2 などで、x² と x をくらべよう。
          - x² は x × x だね。x² が x より大きくならない整数をさがそう。
          - x² と x が等しくなるのは、どんな x のときかな。
        paths:
          - [x が 2 以上なら x² > x, x が負なら x² は正で x より大きい, x = 0 と x = 1 は x² = x, いちばん大きい反例は 1]
        note: 「整数」と決めているので反例は 0 と 1 だけ。分数まで広げると x = 1/2（x² = 1/4）も反例になる。どの数の範囲で考えるかで真偽や反例が変わる。
    extra:
      - part: 今日
        text: 次のうち、命題（正しいか正しくないかがはっきり決まる文）はどれですか。
        choices: [12 は 5 の倍数である, 12 は大きな数である, 12 はきれいな数である]
        answer: 12 は 5 の倍数である
        hints:
          - 人によって答えが変わる文は、命題ではないね。
          - 「大きな数」は、何とくらべるかで変わるかな。
          - 正しくない文でも、正しくないとはっきり決まれば命題だよ。
        paths:
          - [「大きな」「きれいな」は人で変わる, 12 は 5 の倍数かどうかははっきり決まる（偽）, 12 は 5 の倍数である]
        note: 偽の文は命題ではないと思いやすい。「12 は 5 の倍数である」は偽の命題である。
      - part: 今日
        text: 命題「1 から 300 までの整数で 6 の倍数であるものは、すべて 3 の倍数である」は、真ですか、偽ですか。
        choices: [真, 偽]
        answer: 真
        check: "'真' if all(n % 3 == 0 for n in range(1, 301) if n % 6 == 0) else '偽'"
        hints:
          - 6 の倍数を 6k と書いてみよう。
          - 6k を 3 × （ ） の形にできるかな。
          - （ ）の中が整数なら、何の倍数と言えるかな。
        paths:
          - [6 の倍数は 6k, 6k = 3 × 2k, 2k は整数なので 3 の倍数, 真]
      - part: 今日
        text: 命題「x² = 4 ならば x = 2」は偽です。反例になる x の値はいくつですか。
        answer: −2
        check: "(lambda c: (f'−{-c[0]}' if c[0] < 0 else f'{c[0]}') if len(c) == 1 else 'きまらない')([x for x in range(-20, 21) if x * x == 4 and x != 2])"
        hints:
          - 反例は「x² = 4 なのに、x = 2 でない」x だね。
          - 2 のほかに、2 回かけて 4 になる数はあるかな。
          - 負の数 × 負の数 は正の数だったね。
        paths:
          - [x² = 4 になるのは x = 2 と x = −2, x = −2 は x = 2 でない, −2]

  - day: 2
    items:
      - part: 見本
        text: 2 つの条件 p「x = 3」と q「x² = 9」があります。「p ならば q」と「q ならば p」は、それぞれ真でしょうか。
        explain: x = 3 なら x² = 9 なので、「p ならば q」は真です。前とうしろを入れかえた「q ならば p」を、もとの命題の逆といいます。逆は、x = −3 が反例なので偽です。「p ならば q」が真のとき、p は q であるための十分条件、q は p であるための必要条件といいます。x = 3 であれば x² = 9 になるのに十分で、x = 3 であるためには x² = 9 が必ず要る、という意味です。逆も真なら、p は q であるための必要十分条件といいます。また、「q でないならば p でない」をもとの命題の対偶といいます。対偶「x² ≠ 9 ならば x ≠ 3」は真で、対偶ともとの命題は、いつも真偽が一致します。「p でないならば q でない」は裏といい、逆の対偶なので、逆と真偽が一致します。
      - part: 思い出す
        text: 命題「x が 4 の倍数ならば、x は 8 の倍数である」は偽です。反例になる 2 けたの整数のうち、いちばん小さいものはいくつですか。
        answer: 12
        check: "min(x for x in range(10, 100) if x % 4 == 0 and x % 8 != 0)"
        hints:
          - 反例は「4 の倍数なのに、8 の倍数でない」数だね。
          - 2 けたの 4 の倍数を、小さいほうから書き出そう。
          - 書き出した数を、1 つずつ 8 でわってみよう。
        paths:
          - [2 けたの 4 の倍数は 12、16、20…, 12 は 8 の倍数でない, 12]
      - part: 思い出す
        text: 3 つの整数があります。命題「3 つの数はどれも 10 より小さい」の否定は、どれですか。
        choices: [3 つの数はどれも 10 以上である, 3 つの数に 10 以上のものが少なくとも 1 つある, 3 つの数に 10 より小さいものが少なくとも 1 つある]
        answer: 3 つの数に 10 以上のものが少なくとも 1 つある
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'3 つの数はどれも 10 以上である': lambda t: all(x >= 10 for x in t), '3 つの数に 10 以上のものが少なくとも 1 つある': lambda t: any(x >= 10 for x in t), '3 つの数に 10 より小さいものが少なくとも 1 つある': lambda t: any(x < 10 for x in t)}.items() if all(f(t) == (not all(x < 10 for x in t)) for t in itertools.product([5, 9, 10, 15], repeat=3))])"
        hints:
          - 「どれも〜」の否定は、どんな形だったかな。
          - 「10 より小さい」の否定は「10 以上」だね。
          - 5、9、10 のとき、3 つの文がそれぞれ真か偽かを調べよう。
        paths:
          - [「どれも〜である」の否定は「〜でないものが少なくとも 1 つある」, 10 より小さくない＝10 以上, 10 以上のものが少なくとも 1 つある]
      - part: 今日
        text: 命題「x > 5 ならば x > 2」は真です。この命題の逆は、真ですか、偽ですか。
        choices: [真, 偽]
        answer: 偽
        check: "'真' if all(x > 5 for x in [Fraction(k, 2) for k in range(-40, 41)] if x > 2) else '偽'"
        hints:
          - 逆は、「ならば」の前とうしろを入れかえた命題だね。
          - 逆を書いてみよう。「x > 2 ならば …」
          - x > 2 なのに x > 5 でない数はあるかな。
        paths:
          - [逆は「x > 2 ならば x > 5」, x = 3 は反例, 偽]
        note: もとの命題が真なら逆も真だと思いやすい。逆の真偽は、もとの命題とは別に調べる。
      - part: 今日
        text: 整数 n について、「n は 4 の倍数である」は「n は 2 の倍数である」であるための何ですか。
        choices: [必要条件だが十分条件ではない, 十分条件だが必要条件ではない, 必要十分条件, 必要条件でも十分条件でもない]
        answer: 十分条件だが必要条件ではない
        check: "(lambda S, p, q: ['必要条件でも十分条件でもない', '十分条件だが必要条件ではない', '必要条件だが十分条件ではない', '必要十分条件'][all(q(x) for x in S if p(x)) + 2 * all(p(x) for x in S if q(x))])(range(-60, 61), lambda n: n % 4 == 0, lambda n: n % 2 == 0)"
        hints:
          - 「p ならば q」と「q ならば p」の両方の真偽を調べよう。
          - 4 の倍数は、いつも 2 の倍数かな。
          - 2 の倍数は、いつも 4 の倍数かな。合わない例はあるかな。
        paths:
          - [4 の倍数ならば 2 の倍数は真, 2 の倍数ならば 4 の倍数は偽（6）, 十分条件だが必要条件ではない]
        note: 必要と十分を取りちがえやすい。「p ⇒ q」と矢印で書かせ、矢印の出る側が十分条件、矢印の向かう側が必要条件と確かめさせる。
      - part: 今日
        text: 命題「x = 2 ならば x² = 4」の逆・裏・対偶のうち、真であるものはどれですか。
        choices: [x² = 4 ならば x = 2, x ≠ 2 ならば x² ≠ 4, x² ≠ 4 ならば x ≠ 2]
        answer: x² ≠ 4 ならば x ≠ 2
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, (p, q) in {'x² = 4 ならば x = 2': (lambda x: x * x == 4, lambda x: x == 2), 'x ≠ 2 ならば x² ≠ 4': (lambda x: x != 2, lambda x: x * x != 4), 'x² ≠ 4 ならば x ≠ 2': (lambda x: x * x != 4, lambda x: x != 2)}.items() if all(q(x) for x in [Fraction(k, 2) for k in range(-40, 41)] if p(x))])"
        hints:
          - 3 つが、それぞれ逆・裏・対偶のどれかを考えよう。
          - x = −2 のとき、3 つの命題はどうなるかな。
          - もとの命題と真偽が一致するのは、逆・裏・対偶のどれだったかな。
        paths:
          - [1 つ目は逆で x = −2 が反例, 2 つ目は裏で x = −2 が反例, 3 つ目は対偶でもとと同じく真]
      - part: 挑戦
        text: 「x > 0」は「x² > 0」であるための何ですか。
        choices: [必要条件だが十分条件ではない, 十分条件だが必要条件ではない, 必要十分条件, 必要条件でも十分条件でもない]
        answer: 十分条件だが必要条件ではない
        check: "(lambda S, p, q: ['必要条件でも十分条件でもない', '十分条件だが必要条件ではない', '必要条件だが十分条件ではない', '必要十分条件'][all(q(x) for x in S if p(x)) + 2 * all(p(x) for x in S if q(x))])([Fraction(k, 2) for k in range(-40, 41)], lambda x: x > 0, lambda x: x * x > 0)"
        hints:
          - 正の数を 2 回かけると、正かな。
          - x² > 0 なのに x > 0 でない数はあるかな。
          - 負の数 × 負の数 の符号を思い出そう。
        paths:
          - [x > 0 ならば x² > 0 は真, x² > 0 ならば x > 0 は偽（x = −1）, 十分条件だが必要条件ではない]
        note: x = 0 では x > 0 も x² > 0 も成り立たない。x² > 0 と同じ条件は「x ≠ 0」である。
    extra:
      - part: 今日
        text: 「x + 4 = 9」は「x = 5」であるための何ですか。
        choices: [必要条件だが十分条件ではない, 十分条件だが必要条件ではない, 必要十分条件, 必要条件でも十分条件でもない]
        answer: 必要十分条件
        check: "(lambda S, p, q: ['必要条件でも十分条件でもない', '十分条件だが必要条件ではない', '必要条件だが十分条件ではない', '必要十分条件'][all(q(x) for x in S if p(x)) + 2 * all(p(x) for x in S if q(x))])([Fraction(k, 2) for k in range(-40, 41)], lambda x: x + 4 == 9, lambda x: x == 5)"
        hints:
          - x + 4 = 9 を解くと、x はいくつかな。
          - x = 5 なら、x + 4 = 9 は成り立つかな。
          - 両方の向きが真なら、何と言うかな。
        paths:
          - [x + 4 = 9 ならば x = 5 は真, x = 5 ならば x + 4 = 9 も真, 必要十分条件]
      - part: 今日
        text: 整数 m、n について、「m と n はどちらも偶数である」は「m + n は偶数である」であるための何ですか。
