# G-001 形を見分ける、位置の言葉（前後、左右、上下、内外）
#
# 段 1・水準 1・5 日。さんかく・しかく・まるを、かどの数で見分ける。かどとへんを数える。いろやむきがちがっても、同じ形の仲間に分ける。
# 地図の plan に位置の言葉の日がないので、位置の言葉（まえ・うしろ、みぎ・ひだり、うえ・した、なか・そと）は、形をたずねる言い方として 4・5 日目に混ぜる。
# 書き方は N-001 の頭の注のとおり。子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note、explain は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図は svg（D-129）。かどは赤い点、へんは青い太い線で示す。選ぶ問題は、形に ア・イ・ウ（・エ）を付けて、記号で答える。
# check は図の並びから答えを出す（T 上むきの三角、V さかさまの三角、S 四角、D かたむいた四角、C 丸。2 字目は色）。形の名前を答えるだけの問題には check を付けない。

id: G-001
days:
  - day: 1
    items:
      - part: 見本
        id: "96301b307b"
        text: |-
          かたちの なまえを おぼえよう。
          とがった ところを「かど」と いうよ。
          かどが 3 つなら さんかく、4 つなら しかく、かどが ないのが まる。
          いろや むきが かわっても、なまえは かわらないよ。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="60,49.3 19.2,115.6 100.8,115.6" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="49.3" r="5.1" fill="#d9534f"/><circle cx="19.2" cy="115.6" r="5.1" fill="#d9534f"/><circle cx="100.8" cy="115.6" r="5.1" fill="#d9534f"/><polygon points="126,51 194,51 194,119 126,119" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="126" cy="51" r="5.1" fill="#d9534f"/><circle cx="194" cy="51" r="5.1" fill="#d9534f"/><circle cx="194" cy="119" r="5.1" fill="#d9534f"/><circle cx="126" cy="119" r="5.1" fill="#d9534f"/><circle cx="260" cy="85" r="36.7" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="104" y="30" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">かど</text><line x1="94" y1="35" x2="67" y2="49" stroke="#d9534f" stroke-width="2"/><text x="60" y="152" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">さんかく</text><text x="160" y="152" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">しかく</text><text x="260" y="152" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">まる</text><text x="60" y="178" font-size="13" text-anchor="middle" fill="currentColor">かど 3 つ</text><text x="160" y="178" font-size="13" text-anchor="middle" fill="currentColor">かど 4 つ</text><text x="260" y="178" font-size="13" text-anchor="middle" fill="currentColor">かど なし</text></svg>'
        explain: さんかくは とがった かどが 3 つ、しかくは かどが 4 つ、まるは かどが なく、ぐるっと まるい かたちです。いろや むき、おおきさが かわっても、かどの かずで なまえが きまります。えの あかい ●（かど）を いっしょに ゆびで さして かぞえて ください。
