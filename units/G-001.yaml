# G-001 形を見分ける、位置の言葉（前後、左右、上下、内外）
#
# 書き方は N-001 の頭の注のとおり。
# 形は絵文字で描く：さんかく 🔺🔻、しかく 🟥🟦🟩🟨🟧🔷（🔷 はかたむいたしかく）、まる 🔴🔵🟢🟡🟠⚪。
# 地図の plan に位置の言葉の日がないので、位置の言葉は形をたずねる言い方として 4・5 日目に混ぜる。
# 形の名前を答えるだけの問題は計算で確かめられないので check を付けない。
# 数える問題は n(c)、点を結ぶ問題は点の数（かどの数）、位置の問題は図の並びから check で答えを出す。

id: G-001
days:
  - day: 1
    items:
      - part: 見本
        text: かたちの なまえを おぼえよう。
        figure: "🔺　🟦　🔵"
        explain: 🔺 は さんかく。とがった かどが 3 つ あります。🟦 は しかく。かどが 4 つ あります。🔵 は まる。かどが なくて、ぐるっと まるい かたちです。
      - part: 今日
        text: さんかくは どれですか。
        choices: [🟩, 🔺, 🟡]
        answer: 🔺
        hints:
          - とがった かどを さがそう。
          - かどは いくつ あるかな。ゆびで さして かぞえよう。
          - かどが 3 つの かたちが さんかくだよ。
        paths:
          - [かどを かぞえる, かどが 3 つ, さんかく]
      - part: 今日
        text: まるは どれですか。
        choices: [🔷, 🔻, 🟠]
        answer: 🟠
        hints:
          - かどが ある かたちと、ない かたちが あるね。
          - ゆびで ふちを なぞってみよう。
          - かどが ひとつも ない かたちを えらぼう。
        paths:
          - [ふちを なぞる, かどが ない, まる]
      - part: 今日
        text: さんかくは いくつ ありますか。
        figure: 🔺🟦🔺🟢🟥🔺
        answer: 3
        check: "n('🔺')"
        hints:
          - さんかくだけを ゆびで さそう。
          - さした さんかくに、こころの なかで しるしを つけよう。
          - しるしを つけた かずを かぞえよう。
        paths:
          - [さんかくだけを えらぶ, 1、2、3 と かぞえる, 3 こ]
      - part: 挑戦
        text: しかくは いくつ ありますか。
        figure: 🟦🔺🟥🟢🔷🟩🟨
        answer: 5
        check: "n('🟦') + n('🟥') + n('🔷') + n('🟩') + n('🟨')"
        hints:
          - かどが 4 つ ある かたちを さがそう。
          - いろや むきが ちがっても、かどが 4 つなら しかくだよ。
          - しかくだけに しるしを つけて かぞえよう。
        paths:
          - [かどが 4 つの かたちを えらぶ, 🟦 🟥 🔷 🟩 🟨, 5 こ]
        note: 🔷 は かたむいた しかく。むきが ちがうので しかくに いれず 4 と こたえやすい。かどを かぞえれば しかくと わかる。
