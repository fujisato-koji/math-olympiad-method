# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 道筋]
    text: 17 × 4 + 8 × 4 を、くふうして計算しましょう。
    answer: 100
    check: "17 * 4 + 8 * 4"
    hints:
      - 17 × 4 は「17 が 4 こ分」、8 × 4 は「8 が 4 こ分」だね。
      - 17 が 4 こと 8 が 4 こをあわせると、何が 4 こ分になるかな。
      - 「分ける」きまりを、反対からつかってみよう。
    paths:
      - [17 が 4 こと 8 が 4 こで、17 + 8 = 25 が 4 こ分, 25 × 4 = 20 × 4 + 5 × 4, 80 + 20 = 100]
      - [17 × 4 = 10 × 4 + 7 × 4 = 68, 8 × 4 = 32, 68 + 32 = 100]
    note: 「分ける」（12 × 4 = 10 × 4 + 2 × 4）を逆向きに使い、同じ数をかけている 2 つの式をまとめる。2 本目のように別々に計算してもよいが、まとめると 25 × 4 のきりのよい計算になることに気づかせたい。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [A-002]
    text: □ × 6 + □ × 4 + 15 = 85 です。2 つの □ には同じ数が入ります。□ に入る数はいくつですか。
    answer: 7
    check: "[x for x in range(1, 10) if x * 6 + x * 4 + 15 == 85][0]"
    hints:
      - はじめに、□ × 6 + □ × 4 の部分がいくつになるかを考えよう。何に 15 をたすと 85 かな。
      - □ が 6 こと □ が 4 こをあわせると、□ が何こ分かな。
      - □ × 10 がその数になる □ をさがそう。
    paths:
      - [□ × 6 + □ × 4 は 85 − 15 = 70, □ が 6 こと 4 こで □ が 10 こ分, □ × 10 = 70 なので □ = 7]
      - [□ に 1、2、3、… を入れてためす, □ = 7 のとき 42 + 28 + 15 = 85, 7]
    note: □ を求める（A-002）と、同じ数をかける式をまとめる（分けるの逆）を合わせる。まとめずに 1 つずつためしても解けるが、「□ が 10 こ分」と見ると 1 回で決まる。
  - part: 離
    kinds: [読み取り, 手数]
    text: 赤い箱には、あめが 7 こ入ったふくろが 6 ふくろと、ガムが 2 こ入ったふくろが 6 ふくろあります。青い箱には、あめが 7 こ入ったふくろが 4 ふくろと、ガムが 2 こ入ったふくろが 4 ふくろあります。2 つの箱のあめとガムは、あわせて何こですか。
    answer: 90
    check: "7 * 6 + 2 * 6 + 7 * 4 + 2 * 4"
    hints:
      - 赤い箱のあめ、赤い箱のガム、青い箱のあめ、青い箱のガムを、それぞれ計算してみよう。
      - あめのふくろとガムのふくろを 1 つずつ組にすると、1 組は何こかな。
      - 組は、2 つの箱で全部で何組あるかな。
    paths:
      - [あめ 1 ふくろとガム 1 ふくろの組は 7 + 2 = 9 こ, 組は 6 + 4 = 10 組, 9 × 10 = 90]
      - [赤い箱は 7 × 6 = 42 と 2 × 6 = 12, 青い箱は 7 × 4 = 28 と 2 × 4 = 8, 42 + 12 + 28 + 8 = 90]
    note: 4 つのかけ算をする道（2 本目）は手数が多い。入れかえ・まとめ・分けるを使って「9 こが 10 組」と見ると 1 回のかけ算になる。場面から、どの数が同じかを読み取る。
