# N-015 計算のきまり（入れかえ、まとめ、分ける）
#
# 書き方は N-001 の頭の注、文の漢字は N-013 の頭の注のとおり（小 3 までの漢字。順・求・位・工夫の夫 などはかなで書く）。
# 前提は N-013 だけ。わり算（N-014）は使わない。100 より大きい数（N-009）は前提にないので、とちゅうの数も答えも 100 まで。
# 入れかえ：たし算とかけ算は、2 つの数を入れかえても答えは同じ（ひき算はかわる）。1 日目。
# まとめ：3 つの数のたし算とかけ算は、どこをまとめて先に計算しても答えは同じ（ひき算はかわる）。2 日目。
#   ( ) は「先に計算するしるし」としてこの単元で初めて出す。( ) のない 3 つの数の式は前から計算する。
# 分ける：12 × 4 = 10 × 4 + 2 × 4 のように、かけられる数を何十といくつに分けて計算する。3 日目の見本で出す。
#   この式を読むために、「× と + がまじった式では × を先に計算する」ことも 3 日目の見本で出す（地図に計算の順序の単元がない）。
#   10 × 4 は「10 が 4 こ分」で 40（N-006 の 10 のまとまり、N-013 の × 10）。ひいて分ける（9 × 8 = 10 × 8 − 8）は扱わない。
# 文字（A-010）と □（A-002）は前提にないので、きまりは「どんな数でも」と言葉で言い、わけは代表の例と図で文に書く（段 3 の深さ）。
# 式を選ぶ問題の check は、選択肢ごとの式の値を計算して、元の式と同じ値のものを選ぶ（選択肢の値はたがいにちがう）。
#   入れかえてかわるかを問う問題は、選択肢ごとの計算（lambda）に 2 つの数を入れ、入れかえる前と後をくらべる。
# 地図の日の並びは既定（導入・練習・わけ・混ぜる・確認）。

id: N-015
days:
  - day: 1
    items:
      - part: 見本
        text: 🟦 の数を、2 つのかけ算で表そう。
        figure: "🟦🟦🟦🟦\n🟦🟦🟦🟦\n🟦🟦🟦🟦"
        explain: 横に見ると、4 こずつの行が 3 つで 4 × 3。たてに見ると、3 こずつの列が 4 つで 3 × 4。どちらも同じ 12 こを数えているので、4 × 3 = 3 × 4 です。かけ算は、かけられる数とかける数を入れかえても答えは同じです。たし算も、5 + 8 = 8 + 5 のように入れかえても答えは同じです。ひき算は、8 − 5 = 3 ですが、5 − 8 は 3 になりません。
      - part: 思い出す
        text: 7 × 6 はいくつですか。
        answer: 42
        check: "7 * 6"
        hints:
          - 7 のだんを言ってみよう。
          - 7 × 5 = 35 から考えよう。
          - かける数が 1 ふえると、答えは 7 ふえるよ。
        paths:
          - [7 × 5 = 35, 35 + 7 = 42]
      - part: 思い出す
        text: 8 × 4 はいくつですか。
        answer: 32
        check: "8 * 4"
        hints:
          - 8 のだんを言ってみよう。
          - 8 × 3 = 24 から考えよう。
          - かける数が 1 ふえると、答えは 8 ふえるよ。
        paths:
          - [8 × 3 = 24, 24 + 8 = 32]
      - part: 今日
        text: 9 × 6 と答えが同じになる式はどれですか。
        choices: [6 × 9, 9 + 6, 9 × 5]
        answer: 6 × 9
        check: "[s for s, v in {'6 × 9': 6 * 9, '9 + 6': 9 + 6, '9 × 5': 9 * 5}.items() if v == 9 * 6][0]"
        hints:
          - かけ算は、入れかえても答えがかわらないね。
          - 9 と 6 を入れかえた式はどれかな。
          - たし算の式は、かけ算と答えが同じになるかな。
        paths:
          - [9 × 6 の 9 と 6 を入れかえる, 6 × 9]
          - [9 × 6 = 54, 6 × 9 = 54, 6 × 9]
      - part: 今日
        text: 3 + 58 を、58 + 3 に入れかえて計算しましょう。
        answer: 61
        check: "58 + 3"
        hints:
          - たし算は、入れかえても答えは同じだね。
          - 58 から、3 つ数えて進もう。
          - 58 は、あと 2 で 60 だね。
        paths:
          - [58 + 3, 58 は あと 2 で 60, 60 と 1 で 61]
        note: 大きい数から数えはじめると楽になる。入れかえのよさに気づかせる。
      - part: 今日
        text: 入れかえても答えが同じになるのは、どちらの式ですか。
        choices: [7 − 3, 7 × 3]
        answer: 7 × 3
        check: "[s for s, f in {'7 − 3': lambda a, b: a - b, '7 × 3': lambda a, b: a * b}.items() if f(7, 3) == f(3, 7)][0]"
        hints:
          - 7 − 3 と 3 − 7 は、同じ答えになるかな。
          - 7 × 3 と 3 × 7 は、同じ答えになるかな。
          - 入れかえた式を計算して、くらべよう。
        paths:
          - [7 × 3 = 21、3 × 7 = 21, 同じ, 7 × 3]
          - [7 − 3 = 4 だが 3 から 7 はひけない, ひき算は入れかえられない, 7 × 3]
      - part: 挑戦
        text: 37 + 18 + 3 を、くふうして計算しましょう。
        answer: 58
        check: "37 + 18 + 3"
        hints:
          - 3 つの数のうち、たすときりのよい数になる 2 つはどれかな。
          - たし算は、たすじゅんばんをかえても答えは同じだよ。
          - 37 に 3 を先にたすと、いくつになるかな。
        paths:
          - [37 + 3 = 40, 40 + 18 = 58]
          - [37 + 18 = 55, 55 + 3 = 58]
        note: 2 本目の道（前から計算）でも答えは同じ。1 本目の道で計算が楽になることを話す。
    extra:
      - part: 今日
        text: 4 × 7 と答えが同じになる式はどれですか。
        choices: [7 × 4, 7 + 4, 4 × 6]
        answer: 7 × 4
        check: "[s for s, v in {'7 × 4': 7 * 4, '7 + 4': 7 + 4, '4 × 6': 4 * 6}.items() if v == 4 * 7][0]"
        hints:
          - かけ算は、入れかえても答えがかわらないね。
          - 4 と 7 を入れかえた式はどれかな。
          - 計算してたしかめてもよいね。
        paths:
          - [4 と 7 を入れかえる, 7 × 4]
      - part: 今日
        text: 3 + 68 を、68 + 3 に入れかえて計算しましょう。
        answer: 71
        check: "68 + 3"
        hints:
          - たし算は、入れかえても答えは同じだね。
          - 68 から、3 つ数えて進もう。
          - 68 は、あと 2 で 70 だね。
        paths:
          - [68 は あと 2 で 70, 70 と 1 で 71]
      - part: 今日
        text: 入れかえても答えが同じになるのは、どちらの式ですか。
        choices: [5 + 9, 9 − 5]
        answer: 5 + 9
        check: "[s for s, f in {'5 + 9': lambda a, b: a + b, '9 − 5': lambda a, b: a - b}.items() if f(5, 9) == f(9, 5)][0]"
        hints:
          - 5 + 9 と 9 + 5 は、同じ答えになるかな。
          - 9 − 5 と 5 − 9 は、同じ答えになるかな。
          - 入れかえた式を計算して、くらべよう。
        paths:
          - [5 + 9 = 14、9 + 5 = 14, 同じ, 5 + 9]

  - day: 2
    items:
      - part: 見本
        text: ( ) を使った式を計算しよう。
        explain: ( ) は「先に計算する」しるしです。(16 + 7) + 3 は、16 + 7 = 23 を先にして 23 + 3 = 26。16 + (7 + 3) は、7 + 3 = 10 を先にして 16 + 10 = 26。たし算は、どこをまとめて先に計算しても答えは同じです。かけ算も、(2 × 4) × 2 = 8 × 2 = 16、2 × (4 × 2) = 2 × 8 = 16 で同じです。( ) がない式は、前から計算します。
      - part: 思い出す
        text: 6 + 27 を、27 + 6 に入れかえて計算しましょう。
        answer: 33
        check: "27 + 6"
        hints:
          - たし算は、入れかえても答えは同じだね。
          - 27 から、6 つ数えて進もう。
          - 27 は、あと 3 で 30 だね。
        paths:
          - [27 は あと 3 で 30, 6 を 3 と 3 に分ける, 30 と 3 で 33]
      - part: 思い出す
        text: 3 × 8 と答えが同じになる式はどれですか。
        choices: [8 × 3, 8 − 3, 3 × 7]
        answer: 8 × 3
        check: "[s for s, v in {'8 × 3': 8 * 3, '8 − 3': 8 - 3, '3 × 7': 3 * 7}.items() if v == 3 * 8][0]"
        hints:
          - かけ算は、入れかえても答えがかわらないね。
          - 3 と 8 を入れかえた式はどれかな。
          - 計算してたしかめてもよいね。
        paths:
          - [3 と 8 を入れかえる, 8 × 3]
      - part: 今日
        text: 13 − (4 + 5) はいくつですか。
        answer: 4
        check: "13 - (4 + 5)"
        hints:
          - ( ) は「先に計算する」しるしだったね。
          - ( ) の中の 4 + 5 を先に計算しよう。
          - 13 から、その答えをひこう。
        paths:
          - [4 + 5 = 9, 13 − 9 = 4]
        note: ( ) を「先に計算するしるし」と読む足場。( ) を見のがして前から 13 − 4 = 9 とし、そのあと 9 + 5 = 14 とたしてしまいやすい。( ) の中を先に 9 にまとめてから、13 から 9 をひく。
      - part: 今日
        text: (25 + 8) + 2 を、まとめ方をかえて計算しましょう。
        answer: 35
        check: "25 + (8 + 2)"
        hints:
          - 8 + 2 を先に計算すると、きりのよい数になるね。
          - 25 + (8 + 2) と書きかえよう。
          - 25 に 10 をたそう。
        paths:
          - [25 + (8 + 2), 8 + 2 = 10, 25 + 10 = 35]
          - [25 + 8 = 33, 33 + 2 = 35]
      - part: 今日
        text: (3 × 2) × 5 を、まとめ方をかえて計算しましょう。
        answer: 30
        check: "3 * (2 * 5)"
        hints:
          - 2 × 5 を先に計算すると、きりのよい数になるね。
          - 3 × (2 × 5) と書きかえよう。
          - 3 × 10 を計算しよう。
        paths:
          - [3 × (2 × 5), 2 × 5 = 10, 3 × 10 = 30]
          - [3 × 2 = 6, 6 × 5 = 30]
      - part: 今日
        text: (15 − 6) − 3 と 15 − (6 − 3) は、同じ答えになりますか。
        choices: [同じ, ちがう]
        answer: ちがう
        check: "'同じ' if (15 - 6) - 3 == 15 - (6 - 3) else 'ちがう'"
        hints:
          - ( ) の中を先に計算しよう。
          - (15 − 6) − 3 と 15 − (6 − 3) を、それぞれ計算しよう。
          - 2 つの答えをくらべよう。
        paths:
          - [(15 − 6) − 3 = 9 − 3 = 6, 15 − (6 − 3) = 15 − 3 = 12, ちがう]
        note: ひき算は、まとめ方をかえると答えがかわる。たし算・かけ算との違いを確かめる。
      - part: 挑戦
        text: 2 × 9 × 5 を、くふうして計算しましょう。
        answer: 90
        check: "2 * 9 * 5"
        hints:
          - 3 つの数のうち、かけるときりのよい数になる 2 つはどれかな。
          - かけ算は、じゅんばんをかえても答えは同じだよ。
          - 2 × 5 を先に計算しよう。
        paths:
          - [2 × 5 = 10, 9 × 10 = 90]
          - [2 × 9 = 18, 18 × 5 は九九にないので 2 × 5 を先に, 90]
        note: 前から計算すると 18 × 5 になり、九九でできない。入れかえとまとめを両方使うと 9 × 10 になる。
    extra:
