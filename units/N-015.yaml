        note: 10 × 5 だけを計算して 50 としやすい。分けた 2 つの答えを合わせる。
      - part: わけ
        text: 「かけ算は、かけられる数とかける数を入れかえても答えが同じ」ことを、5 × 3 と 3 × 5 で、図を使って文で書きましょう。
        figure: "🟦🟦🟦🟦🟦\n🟦🟦🟦🟦🟦\n🟦🟦🟦🟦🟦"
        explain: 例：「図を横に見ると、5 こずつの行が 3 つで 5 × 3。たてに見ると、3 こずつの列が 5 つで 3 × 5。同じ 15 こを、見る向きをかえて数えただけなので、5 × 3 と 3 × 5 は同じ答えになる。」と書ければよい。どんな数でも、長方形にならべれば同じように言えるので、かけ算はいつも入れかえられることに触れるとよい。計算して 15 = 15 を確かめただけなら、ほかの数でも同じになるわけを聞く。
        hints:
          - 図を横に見ると、何こずつの行がいくつあるかな。
          - たてに見ると、何こずつの列がいくつあるかな。
          - 「同じ図を〜から数えただけだから」と書こう。
        paths:
          - [横に見て 5 × 3, たてに見て 3 × 5, 同じ 15 こを数えている, だから同じ答え]
      - part: わけ
        text: 14 × 6 = 10 × 6 + 4 × 6 になるわけを、文で書きましょう。
        explain: 例：「14 × 6 は 14 が 6 こ分。14 を 10 と 4 に分けると、10 が 6 こ分と、4 が 6 こ分を合わせたものになる。だから 10 × 6 + 4 × 6 = 60 + 24 = 84。」と書ければよい。10 この列と 4 この列が 6 だんの図をかいて説明してもよい。
        hints:
          - 14 × 6 は、14 が何こ分かな。
          - 14 を 10 と 4 に分けると、それぞれ何こ分あるかな。
          - 「14 が 6 こ分は、〜と〜を合わせたものだから」と書こう。
        paths:
          - [14 が 6 こ分, 14 を 10 と 4 に分ける, 10 が 6 こ分と 4 が 6 こ分, だから 10 × 6 + 4 × 6]
      - part: わけ
        text: (18 + 7) + 3 と 18 + (7 + 3) が同じ答えになるわけを、文で書きましょう。
        explain: 例：「どちらも 18 と 7 と 3 を全部合わせた数。先にどの 2 つを合わせても、さいごに全部を合わせることはかわらないので、同じ答えになる。」と書ければよい。おはじきを 3 つの山に分けて、合わせる順をかえて見せるとよい。計算して 28 = 28 を確かめるだけでなく、どんな数でも同じになるわけが書けているかを見る。
        hints:
          - 2 つの式は、それぞれ何と何と何を合わせているかな。
          - 合わせるじゅんばんがちがうと、全部の数はかわるかな。
          - 「どちらも〜を全部合わせた数だから」と書こう。
        paths:
          - [どちらも 18 と 7 と 3 を合わせる, 合わせるじゅんばんがちがうだけ, だから同じ答え]
    extra:
