  - day: 3
    items:
      - part: 見本
        text: 12 × 4 を、12 を 10 と 2 に分けて計算しよう。
        figure: "🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔴🔴\n🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔴🔴\n🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔴🔴\n🔵🔵🔵🔵🔵🔵🔵🔵🔵🔵🔴🔴"
        explain: 12 × 4 は 12 が 4 こ分です。12 を 10 と 2 に分けると、青は 10 が 4 こ分で 10 × 4 = 40、赤は 2 が 4 こ分で 2 × 4 = 8。合わせて 40 + 8 = 48 です。式に書くと 12 × 4 = 10 × 4 + 2 × 4 です。× と + がまじった式では、× を先に計算します。
      - part: 思い出す
        text: (6 + 9) + 1 を、まとめ方をかえて計算しましょう。
        answer: 16
        check: "6 + (9 + 1)"
        hints:
