        explain: かずの せんは、0 の ひだりにも つづきます。0 から ひだりへ 1 もどった ところが −1、2 もどった ところが −2 です。「マイナス 1」「マイナス 2」と よみます。さむい ひに「マイナス 2 ど」と いうのは、0 ど より 2 ど ひくい おんどの ことです。
      - part: 思い出す
        text: 8 − 5 は いくつですか。
        answer: 3
        check: "8 - 5"
        hints:
          - かみに かずの せんを かいてみよう。
          - 8 に ゆびを おこう。
          - ひだりへ 5 かい もどろう。
        paths:
          - [8 から ひだりへ 7、6、5、4、3, 3]
      - part: 思い出す
        text: 6 − 6 は いくつですか。
        answer: 0
        check: "6 - 6"
        hints:
          - 6 から ひだりへ 6 もどる ことだよ。
          - かみの かずの せんで、6 から もどってみよう。
          - ついた ところの かずを よもう。
        paths:
          - [6 から ひだりへ 6 かい もどる, 0]
          - [6 こから 6 こ とると なにも ない, 0]
      - part: 今日
        text: □に はいる かずは どれですか。
        figure: "−4 ─ −3 ─ □ ─ −1 ─ 0 ─ 1 ─ 2"
        choices: [−2, 2, −3]
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(fig.split(' ─ ').index('□') - fig.split(' ─ ').index('0'))"
        hints:
          - 0 の ところを さがそう。
          - 0 から ひだりへ、ひとつずつ よもう。
          - □は 0 から ひだりへ いくつ もどった ところかな。
        paths:
          - [0 から ひだりへ −1、□, 2 つ もどった ところ, −2]
          - [−3 の みぎ どなり, −2]
        note: 0 の右の 2 と取り違えやすい。0 の左の数には「−」が付く。
      - part: 今日
