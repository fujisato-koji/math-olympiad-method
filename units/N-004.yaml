# N-004 0 より小さい数
#
# 書き方は N-001 の頭の注のとおり。
# 0 より小さい数は「−3」と書いて「マイナス 3」と読む（− は U+2212）。
# 数直線は「 ─ 」（前後に空白）で目もりを区切る。「−3─−2」では − と ─ が見分けにくいため（N-002 の図と区切りが違う）。
#   check の fig.split(' ─ ') は目もりを左から並べたもの、index('0') は 0 の位置。目もりの数は（その位置 − 0 の位置）。
# 温度計は縦の図（上ほど高い）。check の fig.splitlines() は上から並べたもの。目もりの数は（0 の位置 − その位置）。
# 段 2 の鍵盤では − を打てないので、答えに符号が要る問題は choices にする。選ぶか打つかで符号の見当がつかないように、
#   数直線や温度の問題は、答えが 0 や正の数でも choices にする。数をそのまま打つのは、はなれている数と物の数だけ。
#   check で数を「−3」の形にするのは (lambda v: f'−{-v}' if v < 0 else f'{v}')(式)。
# 地図の plan にある「地下の階」は使わない。日本の建物には 0 階がなく、1 階のすぐ下が地下 1 階なので、数直線と 1 ずれる。
# 0 より小さい数を式に入れたたし算とひき算（(−2) + 5 など）は N-010。ここでは、ひく数のほうが大きいひき算（2 − 5）と、
#   数直線や温度計の上で 0 より小さい所から動くこと（式には書かない）まで。

id: N-004
