# L-011 背理法
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の文（です・ます）。
# 前提は L-013（命題と条件）と A-016（平方根、2026-11-08 に足された）。たどると L-008（推理）、A-013（不等式）、
#   A-011（1 次方程式）、A-010（文字と式）、A-015（展開）、N-021（素数）、N-017・N-018（倍数と約数、公約数）、
#   N-019（分数）、N-027（正負の数）、A-009（累乗）までなので、これらを道具にする。
#   偶数・奇数は A-010 のとおり 2n、2n + 1 と表し、偶数 + 奇数 などは文字の式で確かめる。
#   n² は n × (2k + 1) = 2nk + n のように分配法則 1 回で扱った（A-015 の展開を使ってもよい）。
#   A-016 が前提になったので、5 日目のわけに「√2 は分数で表せない」を入れた（A-016 の係は背理法がないので入れていない）。
#   「素数はいくらでもある」の証明は、この単元を前提にする N-030（素数の性質）にまかせ、ここでは扱わない。
# 「和が○なら少なくとも 1 つは○以上」は、不等式を足して矛盾を出す背理法の練習として扱う。
#   物を箱に入れる形の鳩の巣原理（L-006）は前提にないので使わず、一般の形は L-015 にまわす。
# 日の並びは地図の既定（導入、練習 3 日、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：背理法の形（結論の否定を仮定する → 矛盾を導く → 結論が正しい）。仮定を正しく書く。「いちばん大きい偶数はない」。
#   2 日目 練習：「少なくとも 1 つは」を、どれも小さいと仮定して和や積を押さえて示す（頭に見本：積の場合）。
#   3 日目 練習：整数の性質（倍数、偶数・奇数）で矛盾を出す。「〜となる整数はない」「2 つの組に分けられない」（頭に見本）。
#   4 日目 練習：「解がない」「ただ 1 つ」を示す（頭に見本）。正直者とうそつきの推理で、かりに決めて矛盾を出す。
#   5 日目 わけ：和の押さえ、n² が偶数なら n は偶数、√2 は分数で表せない、を背理法で書く（段 4 の深さ ③）。
#   6 日目 混ぜる：L-013（必要十分、対偶）と L-008（表の推理）、1〜4 日目の型を混ぜる。対偶と背理法の使い分け。
#   7 日目 確認。
# check：
#   仮定を選ぶ問題は、選択肢ごとの条件が、どの場合にも「結論が成り立たない」ことと一致するものを選び出す（L-013 の否定と同じ形）。
#   「少なくとも 1 つは m 以上」と言える m は、どれも m − 1 以下と仮定した和の上限が条件の和より小さくなる m のうち、いちばん大きいもの。
#   総当たりできる小さい場合は、すべての組を itertools で作り、いちばん大きい数のいちばん小さい値を出して確かめる。
#   「ない」「できない」は、範囲の中の整数や分け方を全部ためして、1 つもないことを確かめる（できるときは「できる」）。
#   正直者とうそつきは L-008 の形（正直者かを True と False の組で全部作り、ことばの真偽と合う組だけを残す。1 つでないなら「きまらない」）。

id: L-011
days:
  - day: 1
    items:
      - part: 見本
        text: 2 つの数 a、b について、「a + b > 10 ならば、a > 5 または b > 5」が成り立つことを示しましょう。
        explain: 結論「a > 5 または b > 5」が成り立たないと仮定します。その否定は「a ≤ 5 かつ b ≤ 5」です。2 つの不等式を足すと a + b ≤ 10 となり、a + b > 10 と合いません。これを矛盾といいます。仮定がまちがっていたので、結論が成り立ちます。このように、示したいことの否定を仮定して矛盾を導き、もとのことが正しいと結論する方法を背理法といいます。手順は、① 結論の否定を仮定する、② 条件や正しい事実を使って矛盾を導く、③「よって〜である」と結ぶ、の 3 つです。① の否定は、L-013 で学んだ「かつ」「または」「すべて」「少なくとも 1 つ」の否定の作り方で書きます。
      - part: 思い出す
        text: 2 つの数 x、y について、「x と y の少なくとも一方は 3 より大きい」の否定は、どれですか。
        choices: [x と y はどちらも 3 以下である, x と y はどちらも 3 より小さい, x と y の少なくとも一方は 3 以下である]
        answer: x と y はどちらも 3 以下である
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'x と y はどちらも 3 以下である': lambda x, y: x <= 3 and y <= 3, 'x と y はどちらも 3 より小さい': lambda x, y: x < 3 and y < 3, 'x と y の少なくとも一方は 3 以下である': lambda x, y: x <= 3 or y <= 3}.items() if all(f(x, y) == (not (x > 3 or y > 3)) for x, y in itertools.product([Fraction(k, 2) for k in range(0, 13)], repeat=2))])"
        hints:
          - 「少なくとも一方は」は「x > 3 または y > 3」と書けるね。
          - 「または」の否定は、それぞれを否定して「かつ」でつなぐのだったね。
          - 「3 より大きい」の否定に、3 は入るかな。
        paths:
          - [x > 3 または y > 3, 否定は x ≤ 3 かつ y ≤ 3, どちらも 3 以下]
      - part: 思い出す
        text: 《整数》 n について、「n は 3 の《倍数》である」は「n は 9 の倍数である」であるための何ですか。
        choices: [必要条件だが十分条件ではない, 十分条件だが必要条件ではない, 必要十分条件, 必要条件でも十分条件でもない]
        answer: 必要条件だが十分条件ではない
        check: "(lambda S, p, q: ['必要条件でも十分条件でもない', '十分条件だが必要条件ではない', '必要条件だが十分条件ではない', '必要十分条件'][all(q(x) for x in S if p(x)) + 2 * all(p(x) for x in S if q(x))])(range(-90, 91), lambda n: n % 3 == 0, lambda n: n % 9 == 0)"
        hints:
          - 9 の倍数は、いつも 3 の倍数かな。
          - 3 の倍数は、いつも 9 の倍数かな。
          - 「ならば」が真になる向きの、出る側が十分条件、向かう側が必要条件だったね。
        paths:
          - [9 の倍数ならば 3 の倍数は真, 3 の倍数ならば 9 の倍数は偽（3）, 必要条件だが十分条件ではない]
      - part: 今日
        text: 「整数 a、b、c の和が 20 ならば、a、b、c の少なくとも 1 つは 7 以上である」を背理法で示します。はじめに仮定することは、どれですか。
        choices: [a、b、c はどれも 7 以上である, a、b、c はどれも 6 以下である, a、b、c のどれか 1 つは 6 以下である]
        answer: a、b、c はどれも 6 以下である
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'a、b、c はどれも 7 以上である': lambda t: all(x >= 7 for x in t), 'a、b、c はどれも 6 以下である': lambda t: all(x <= 6 for x in t), 'a、b、c のどれか 1 つは 6 以下である': lambda t: any(x <= 6 for x in t)}.items() if all(f(t) == (not any(x >= 7 for x in t)) for t in itertools.product(range(0, 12), repeat=3))])"
        hints:
          - 背理法では、結論の否定を仮定するのだったね。
          - 「少なくとも 1 つは 7 以上」の否定は、どんな形かな。
          - 整数で「7 以上でない」は、「いくつ以下」と言いかえられるかな。
        paths:
          - [結論は「少なくとも 1 つは 7 以上」, 否定は「どれも 7 以上でない」, 整数なので「どれも 6 以下」]
        note: 「どれも 7 以上」と、結論を強めたものを選びやすい。背理法で仮定するのは、結論の否定である。
      - part: 今日
        text: 整数 a、b、c がどれも 6 以下のとき、a + b + c は最大でいくつですか。
        answer: 18
        check: "max(a + b + c for a, b, c in itertools.product(range(-10, 7), repeat=3))"
        hints:
          - 3 つの数をそれぞれ、いちばん大きくするといくつかな。
          - a ≤ 6、b ≤ 6、c ≤ 6 を足すと、どうなるかな。
          - 前の問題の「和が 20」とくらべてみよう。
        paths:
          - [a ≤ 6、b ≤ 6、c ≤ 6, 足すと a + b + c ≤ 18, 最大 18]
        note: 和は 18 以下なので、和が 20 であることと矛盾する。前の問題と合わせて、背理法が 1 回分そろう。
      - part: 今日
        text: 「いちばん大きい偶数はない」ことを背理法で示します。いちばん大きい偶数 N があると仮定したとき、矛盾を導くのに使える数は、どれですか。
        choices: [N − 2, N + 1, N + 2]
        answer: N + 2
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'N − 2': lambda N: N - 2, 'N + 1': lambda N: N + 1, 'N + 2': lambda N: N + 2}.items() if all(f(N) % 2 == 0 and f(N) > N for N in range(-20, 21, 2))])"
        hints:
          - 矛盾させたいのは「N がいちばん大きい偶数」ということだね。
          - N より大きく、しかも偶数である数をさがそう。
          - N + 1 は偶数かな。
        paths:
          - [N + 2 は偶数, N + 2 は N より大きい, いちばん大きいことに矛盾, N + 2]
        note: N + 1 も N より大きいが奇数なので、「いちばん大きい偶数」との矛盾にはならない。
      - part: 挑戦
        text: 4 つの整数の和が 30 のとき、「少なくとも 1 つは □ 以上である」と必ず言えます。□ にあてはまる整数のうち、いちばん大きいものはいくつですか。
        answer: 8
        check: "min(max(a, b, c, 30 - a - b - c) for a, b, c in itertools.product(range(-5, 31), repeat=3))"
        hints:
          - どれも 7 以下と仮定すると、和は最大でいくつかな。
          - 「必ず言える」には、どんな 4 つの整数でも成り立つ必要があるね。
          - それより大きい数では言えないことを、例を 1 つ作って確かめよう。
        paths:
          - [どれも 7 以下なら和は 28 以下で 30 と矛盾, 少なくとも 1 つは 8 以上, 8、8、7、7 なら 9 以上はないので 8 がいちばん大きい]
        note: 8 で言えることは背理法で示し、9 では言えないことは例（8、8、7、7）で示す。両方がそろって「いちばん大きい」と言える。
    extra:
      - part: 今日
        text: 5 つの整数がどれも 8 以下のとき、5 つの和は最大でいくつですか。
        answer: 40
        check: "max(sum(t) for t in itertools.product(range(5, 9), repeat=5))"
        hints:
          - 5 つの数をそれぞれ、いちばん大きくするといくつかな。
          - 5 つの不等式を足そう。
          - 8 が 5 つ分だね。
        paths:
          - [どれも 8 以下, 足すと 40 以下, 最大 40]
        note: このことから「5 つの整数の和が 42 ならば、少なくとも 1 つは 9 以上」が背理法で示せる。
      - part: 今日
        text: 「x + y ≥ 0 ならば、x ≥ 0 または y ≥ 0」を背理法で示します。はじめに仮定することは、どれですか。
        choices: [x < 0 かつ y < 0, x < 0 または y < 0, x ≤ 0 かつ y ≤ 0]
        answer: x < 0 かつ y < 0
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'x < 0 かつ y < 0': lambda x, y: x < 0 and y < 0, 'x < 0 または y < 0': lambda x, y: x < 0 or y < 0, 'x ≤ 0 かつ y ≤ 0': lambda x, y: x <= 0 and y <= 0}.items() if all(f(x, y) == (not (x >= 0 or y >= 0)) for x, y in itertools.product(range(-3, 4), repeat=2))])"
        hints:
          - 結論は「x ≥ 0 または y ≥ 0」だね。
          - 「または」の否定は「かつ」でつなぐよ。
          - 「x ≥ 0」の否定に、0 は入るかな。
        paths:
          - [結論の否定を仮定する, x ≥ 0 の否定は x < 0, 「または」は「かつ」に, x < 0 かつ y < 0]
        note: このとき x + y < 0 となり、x + y ≥ 0 と矛盾する。
      - part: 今日
        text: 「いちばん小さい正の《分数》はない」ことを背理法で示します。いちばん小さい正の分数 p があると仮定したとき、矛盾を導くのに使える数は、どれですか。
        choices: [p × 2, p ÷ 2, p − 1]
        answer: p ÷ 2
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'p × 2': lambda p: p * 2, 'p ÷ 2': lambda p: p / 2, 'p − 1': lambda p: p - 1}.items() if all(f(p) > 0 and f(p) < p for p in [Fraction(a, b) for a in range(1, 6) for b in range(1, 6)])])"
        hints:
          - 矛盾させたいのは「p がいちばん小さい正の分数」ということだね。
          - p より小さく、しかも正の分数である数をさがそう。
          - p − 1 は、いつも正かな。p = 1/2 で調べよう。
        paths:
          - [p ÷ 2 は正の分数, p ÷ 2 は p より小さい, いちばん小さいことに矛盾, p ÷ 2]

  - day: 2
    items:
      - part: 見本
        text: 正の数 a、b について、「ab > 25 ならば、a > 5 または b > 5」を示しましょう。
        explain: 背理法で、結論の否定「a ≤ 5 かつ b ≤ 5」を仮定します。b は正の数なので、a ≤ 5 の両辺に b をかけても向きは変わらず、ab ≤ 5b です。また b ≤ 5 の両辺に 5 をかけて 5b ≤ 25 です。2 つを合わせると ab ≤ 25 となり、ab > 25 と矛盾します。よって a > 5 または b > 5 です。和のときと同じように、「どれも小さいと仮定すると、全体が足りなくなる」形で矛盾を導けます。正の数をかけるところで、a、b が正であることを使っています。
      - part: 思い出す
        text: 3 つの《整数》の和が 25 のとき、「少なくとも 1 つは □ 以上である」と必ず言えます。□ にあてはまる整数のうち、いちばん大きいものはいくつですか。
        answer: 9
        check: "min(max(a, b, 25 - a - b) for a, b in itertools.product(range(-10, 26), repeat=2))"
        hints:
          - どれも 8 以下と仮定すると、和は最大でいくつかな。
          - その和は 25 とくらべてどうかな。
          - それより大きい数では言えないことを、例を 1 つ作って確かめよう。
        paths:
          - [どれも 8 以下なら和は 24 以下で矛盾, 少なくとも 1 つは 9 以上, 9、8、8 があるので 10 以上は言えない, 9]
      - part: 思い出す
        text: 「整数 m、n で mn が偶数ならば、m と n の少なくとも一方は偶数である」を背理法で示します。はじめに仮定することは、どれですか。
        choices: [m と n はどちらも偶数である, m と n はどちらも奇数である, m と n の少なくとも一方は奇数である]
        answer: m と n はどちらも奇数である
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'m と n はどちらも偶数である': lambda m, n: m % 2 == 0 and n % 2 == 0, 'm と n はどちらも奇数である': lambda m, n: m % 2 == 1 and n % 2 == 1, 'm と n の少なくとも一方は奇数である': lambda m, n: m % 2 == 1 or n % 2 == 1}.items() if all(f(m, n) == (not (m % 2 == 0 or n % 2 == 0)) for m, n in itertools.product(range(-5, 6), repeat=2))])"
        hints:
          - 結論は「m と n の少なくとも一方は偶数」だね。
          - 「少なくとも一方は」の否定は、「どちらも〜でない」だったね。
          - 偶数でない整数は、何と言うかな。
        paths:
          - [結論の否定を仮定する, 「少なくとも一方は偶数」の否定は「どちらも偶数でない」, どちらも奇数]
      - part: 今日
        text: 7 人で玉を合わせて 50 個持っています。「少なくとも 1 人は □ 個以上持っている」と必ず言えます。□ にあてはまる数のうち、いちばん大きいものはいくつですか。
        answer: 8
        check: "max(m for m in range(1, 51) if 7 * (m - 1) < 50)"
        hints:
          - どの人も 7 個以下と仮定すると、合わせて最大何個かな。
          - その数は 50 とくらべてどうかな。
          - それより大きい数では言えないことを、例を 1 つ作って確かめよう。
        paths:
          - [どの人も 7 個以下なら合わせて 49 個以下で 50 と矛盾, 少なくとも 1 人は 8 個以上, 8 と 7 が 6 人で 50 になるので 9 個以上は言えない, 8]
      - part: 今日
        text: 3 つの数（整数とはかぎりません）の和が 20 のとき、「少なくとも 1 つは □ 以上である」と必ず言えます。□ にあてはまる数のうち、いちばん大きいものはいくつですか。《分数》で答えましょう。
        answer: 20/3
        check: "max(t for t in [Fraction(k, 3) for k in range(0, 61)] if 3 * t <= 20)"
        hints:
          - 3 つとも同じ数のときを考えてみよう。
          - どれも t より小さいと仮定すると、和はどうなるかな。
          - 和が 3t より小さくなって 20 と矛盾するのは、t がどんなときかな。
        paths:
          - [どれも 20/3 より小さいと仮定すると和は 20 より小さい, 矛盾するので少なくとも 1 つは 20/3 以上, 3 つとも 20/3 なら それより大きいものはない, 20/3]
        note: 整数のときは 7 以上と言えたが、整数とかぎらないと 20/3（6 と 2/3）までしか言えない。どの数で考えるかで答えが変わる。
      - part: 今日
        text: 6 つの整数の和が 46 のとき、「少なくとも 1 つは □ 以下である」と必ず言えます。□ にあてはまる整数のうち、いちばん小さいものはいくつですか。
        answer: 7
        check: "min(m for m in range(-50, 51) if 6 * (m + 1) > 46)"
        hints:
          - 「□ 以下のものはない」と仮定すると、どれもいくつ以上かな。
          - どれも 8 以上と仮定すると、和は最小でいくつかな。
          - それより小さい数では言えないことを、例を 1 つ作って確かめよう。
        paths:
          - [どれも 8 以上なら和は 48 以上で 46 と矛盾, 少なくとも 1 つは 7 以下, 7 が 2 つと 8 が 4 つで 46 になるので 6 以下は言えない, 7]
        note: 今度は「以下」。仮定は「どれも 8 以上」で、和の下限で矛盾を出す。
      - part: 挑戦
        text: 1 から 6 までの整数を 1 つずつ、輪の形に並べます。どう並べても、となり合う 3 つの数の和が □ 以上になるところが必ずあります。□ にあてはまる数のうち、いちばん大きいものはいくつですか。
        answer: 11
        check: "min(max(q[i] + q[(i + 1) % 6] + q[(i + 2) % 6] for i in range(6)) for q in [(1,) + p for p in itertools.permutations(range(2, 7))])"
        hints:
          - となり合う 3 つの組は、輪の上に 6 組あるね。
          - 6 組の和を全部足すと、それぞれの数は何回ずつ足されるかな。
          - どの組の和も 10 以下と仮定すると、6 組の和の合計はどうなるかな。
        paths:
          - [6 組の和の合計は 1 から 6 の和の 3 倍で 63, どの組も 10 以下なら合計は 60 以下で矛盾, 11 以上の組がある, 1・4・5・2・3・6 と並べるとどの組も 11 以下なので 12 以上は言えない, 11]
        note: 63 を 6 でわると 10.5。「平均より大きいものが少なくとも 1 つある」を背理法で示した形。12 以上と言えないことは並べ方の例で示す。
    extra:
      - part: 今日
        text: 「正の数 a、b で ab > 36 ならば、a > 6 または b > 6」を背理法で示します。はじめに仮定することは、どれですか。
