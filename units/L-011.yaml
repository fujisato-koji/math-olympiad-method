        explain: 例：「a、b、c がどれも 11 以上でない、つまり整数なのでどれも 10 以下であると仮定する。a ≤ 10、b ≤ 10、c ≤ 10 を足すと a + b + c ≤ 30 となる。これは a + b + c = 31 と矛盾する。よって、a、b、c の少なくとも 1 つは 11 以上である。」と書ければよい。①「〜と仮定する」で結論の否定を書く（「どれも 10 以下」）、② 不等式を足して和を押さえる、③ 条件の和 31 と矛盾するので結論が成り立つと結ぶ、の 3 点を見る。否定を「どれも 11 より小さい」と書いた場合も、整数なので 10 以下と言いかえられることを話す。10、10、11 のような例を 1 つ挙げただけで終わっていたら、例ではすべての a、b、c を示せないことを話す。
