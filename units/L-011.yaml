      - part: わけ
        text: 「√2 は《分数》で表せない」ことを、背理法で示しましょう。前の問題の「n² が偶数ならば、n は偶数」を使ってよいとします。
        explain: 例：「√2 が分数で表せると仮定する。√2 = a/b（a、b は正の整数で、a/b はこれ以上約分できない分数）とおく。両辺を 2 乗して 2 = a²/b²、つまり a² = 2b²。a² は偶数なので、a は偶数であり、a = 2c（c は正の整数）と書ける。代入すると 4c² = 2b²、つまり b² = 2c²。b² も偶数なので、b も偶数である。a と b がどちらも偶数なので、a/b は 2 で約分できる。これは、約分できない分数としたことと矛盾する。よって、√2 は分数で表せない。」と書ければよい。①「分数で表せると仮定し、約分できない a/b とおく」、② 2 乗して a² = 2b² を導き、a = 2c を代入して b² = 2c² にする、③「a も b も偶数なので約分できない分数であることと矛盾」と結ぶ、の 3 点を見る。はじめに「約分できない」と置くのがかぎで、これがないと矛盾が出ないことを話す。√2 = 1.414… と小数で計算して終わっていたら、小数をいくら書いても分数でないことは示せないことを話す。
        hints:
