        text: 「整数 n について、n² が偶数ならば、n は偶数である」を、背理法で示しましょう。
        explain: 例：「n が偶数でない、つまり奇数であると仮定する。n = 2k + 1（k は整数）とおくと、n² = n × (2k + 1) = 2nk + n = 2nk + 2k + 1 = 2(nk + k) + 1。nk + k は整数なので、n² は奇数である。これは n² が偶数であることと矛盾する。よって n は偶数である。」と書ければよい。① 奇数と仮定して n = 2k + 1 とおく、② n² を 2 × （整数） + 1 の形に変形する、③「奇数になるので、n² が偶数であることと矛盾する」と結ぶ、の 3 点を見る。L-013 で対偶を使って同じ形を示したことにふれ、対偶は「n が奇数ならば n² は奇数」を示すだけで終わり、背理法は仮定（n² は偶数）と結論の否定（n は奇数）から矛盾を出す、というちがいを話すとよい。
        hints:
