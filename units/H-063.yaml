# H-063 まざった物を分ける
#
# 段 2・水準 1・4 日。ふるい（つぶの大きさのちがい）、磁石（鉄が引きつけられる）、水に入れる（浮く物と沈む物）、こす（紙の細かい目に水だけを通す）、水にとかしてこしてから水をかわかす（とける物ととけない物）で、まざった物を分けることを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 ふるい・磁石・浮く物と沈む物、2 日目 こす・水にとかして分ける、3 日目 わけ（ちがいを使って分ける、やり方を選ぶ）、4 日目 確認（やり方をつなげる）。
# 図の約束：まめは黄色の楕円、すなは茶色の小さな点、こめは白い小さな楕円、しおは白い小さな四角、さとうは白い小さな丸、小石は灰色の丸い形、くぎとクリップは灰色（鉄）、磁石は赤い U の形で足の先が灰色、水は水色に波の線。ふるいは茶色のわくと、底のあみを点線（すき間があな）でかく。紙でこすのは、ろうとに白い紙（コーヒーのフィルター）でかく。
# 熱いお茶をこす問題には「おうちの ひとと いっしょに」を付けた。水をなくすのは火を使わず、ひなたでかわかす。
# すなには磁石につく砂鉄がまざることがあるので、すなが入る問題では磁石を答えにしない（砂鉄は 1 日目の予備で扱う）。
# 重さと体積は H-064、浮き沈みのわけ（密度）は H-007、結晶は H-065、にごった水をきれいにするのは E-210 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも、図の結果を読む読み取り（kinds: 読み取り）。

id: H-063
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          まざった ものは、ちがいを つかうと 分けられます。
          ふるいは、そこに あなの ある あみです。ビーズを 入れて ゆすると、あなより 小さい ビーズは 下へ おち、大きい ビーズは 上に のこります。
          じしゃくを ちかづけると、てつの クリップだけが くっついて きます。
          水に 入れると、ペットボトルの ふたは うき、10 円玉は しずみます。
