        explain: |-
          「まざった ものが 分けられるのは、もの どうしに ちがいが あるから。ふるいは つぶの 大きさ、じしゃくは てつで できて いるか どうか、水に 入れるのは うくか しずむか、とかして こすのは 水に とけるか どうかの ちがいを つかって いる。」と いえれば よい。
          ちがいが ない もの どうし（同じ 大きさの 木の 玉と 石を ふるいに かける など）は、その やり方では 分けられない。べつの ちがい（うくか しずむか）を さがせば 分けられる、と 気づければ なお よい。
        hints:
          - ふるいで 分けた まめと すなは、どこが ちがったかな。
