        explain: |-
          まざった ものを 分ける ときは、まざって いる もの どうしの ちがいを さがし、その ちがいが はっきり 出る やり方を えらびます。ふるいは つぶの 大きさの ちがい、じしゃくは てつで できて いるか どうかの ちがい、水に 入れるのは 水に うくか しずむかの ちがいを つかいます。
          きょうは 3 つの やり方で「なにが 分かれて、どこに のこるか」が わかれば よい。だいどころの ざるで 大きさの ちがう ものを ゆすって みたり、おふろで うく ものと しずむ ものを ためしたり すると よい。
      - part: 今日
        text: まめと すなが まざって います。ふるいに 入れて ゆすると、ふるいの 上に のこる のは どちらかな。
