        explain: |-
          こすとは、紙や ぬのの こまかい 目に 水を 通して、目より 大きい つぶを 上に のこす やり方です。ふるいと にて いますが、水と いっしょに 通す ところが ちがいます。
          しおや さとうは 水に とけると、目に 見えない ほど 小さく なって、水と いっしょに 紙を 通りぬけます。だから こした だけでは、しおと 水は 分かれません。こした 水を ひなたに おいて 水を なくすと、しおが のこります。コーヒーの フィルターと コップで、しおと すなを 分ける じっけんが できます。見本の えは さとうと 土で 見せ、しおと すなは きょうの もんだいで たしかめます。
