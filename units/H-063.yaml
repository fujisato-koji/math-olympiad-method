    items:
      - part: 見本
        text: |-
          土が まざった 水を、目の こまかい 紙（コーヒーの フィルター）で こすと、土の つぶは 紙の 上に のこり、水が 下へ 出て きます。
          しおや さとうは 水に とけて 見えなく なり、水と いっしょに 紙を 通りぬけます。
          さとうと 土を 分ける ときは、① 水に とかして、② 紙で こし、③ こした 水を ひなたで かわかします。水が なくなると、さとうが のこります。
