# G-017 三角形と四角形の性質
#
# 書き方は N-001 の頭の注のとおり。
# ことば：定義、定理、二等辺三角形（頂角、底辺、底角）、正三角形、逆、反例、直角三角形の斜辺、鋭角、
#   平行四辺形（対辺、対角、対角線）、長方形、ひし形、正方形。
# 定義：二等辺三角形は 2 つの辺が等しい三角形、正三角形は 3 つの辺が等しい三角形、平行四辺形は 2 組の対辺がそれぞれ平行な四角形、
#   長方形は 4 つの角が等しい四角形、ひし形は 4 つの辺が等しい四角形、正方形は 4 つの角と 4 つの辺が等しい四角形。
# 約束した事実は G-016 のもの（平行線と角、三角形の合同条件、内角の和など）。ここで示すもの：二等辺三角形の底角は等しい、
#   平行四辺形の対辺・対角は等しい、長方形の対角線は等しい。2 つの角が等しい三角形は二等辺三角形（底角の定理の逆）、
#   直角三角形の合同条件、平行四辺形になる条件、ひし形の対角線が垂直に交わることは、見本で知らせて使う。
# 前提は G-016（→ G-009）なので、数の計算は G-009 の範囲（1000 まで、九九の範囲のわり算、何十 ÷ 1 けた）にした。
#   面積（G-008）は前提にないので、平行線と面積（等積変形）は扱わない（G-012）。文字の式を使った計算はしない。
# 図は svg（D-040）。角はおおよそ本当の大きさで描いた。等しい辺は短い線、平行は ＞、直角は四角のしるし。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 二等辺三角形（定義と定理、頂角の二等分線）　2 日目 二等辺三角形になる条件、逆と反例、正三角形、直角三角形の合同条件
#   3 日目 平行四辺形の性質と条件、長方形・ひし形・正方形の対角線　4 日目 わけ（底角、平行四辺形の対辺と対角、長方形の対角線）
#   5 日目 G-016 と 1〜3 日目を混ぜる　6 日目 確認
# check：角と長さは計算の式。逆の文、正しいかどうか、合同条件、平行四辺形になる条件を選ぶ問題は約束ごとなので check を付けない。

