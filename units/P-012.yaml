# P-012 非慣性系（慣性力、遠心力、コリオリ力、回転座標系での位置エネルギー）
#
# 水準 4・8 日。前提は P-007、D-004。加速する台や回る円板の上から見たときの見かけの力：慣性力、遠心力、コリオリ力、遠心力の位置エネルギー。
# 重力加速度は 10 m/s²、円周率は 3。単位は m、s、kg、N、J、m/s、m/s²、rad/s。
id: P-012
days:
  - day: 1
    items:
      - part: 見本
        text: 電車が右へ加速すると、中の人は左へ引かれるように感じる。これが慣性力。大きさは、質量 × 加速度で、向きは加速度と逆になる。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="95" y="126" width="110" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="122.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="177.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="108" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="215" y1="60" x2="265" y2="60" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="275,60 265,65 265,55" fill="currentColor"/><text x="245" y="50" font-size="14" text-anchor="middle" fill="currentColor">加速度 a</text><line x1="150" y1="108" x2="105" y2="108" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="95,108 105,103 105,113" fill="#f08080"/><text x="105" y="92" font-size="14" text-anchor="middle" fill="currentColor">慣性力</text></svg>'
        explain: 加速する電車の中（加速している場所）では、ニュートンの運動の法則をそのまま使えない。そこで、加速度と逆向きに大きさ m a の見かけの力（慣性力）をつけ足すと、電車の中ではふつうの力のつりあいで考えられる。電車の外（止まっている場所）から見れば、慣性力はなく、人は慣性で進み続けようとしているだけ。
      - part: 今日
        text: 質量 50 kg の人が、加速度 2 m/s² で加速する電車に乗っている。この人にはたらく慣性力の大きさは何 N か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="95" y="126" width="110" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="122.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="177.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="108" r="14" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="215" y1="60" x2="265" y2="60" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="275,60 265,65 265,55" fill="currentColor"/><text x="245" y="50" font-size="14" text-anchor="middle" fill="currentColor">2 m/s²</text><text x="150" y="70" font-size="14" text-anchor="middle" fill="currentColor">50 kg</text></svg>'
        choices: [25 N, 52 N, 100 N, 150 N]
        answer: 100 N
        check: "'100 N'"
        hints:
          - 慣性力の大きさは、質量と加速度でわかる。
          - text: 質量と加速度の 2 つの数を、図で見つける。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="95" y="126" width="110" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="122.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="177.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="108" r="14" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="245" cy="55" r="26" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><circle cx="150" cy="70" r="22" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="245" y="50" font-size="14" text-anchor="middle" fill="currentColor">2 m/s²</text><text x="150" y="70" font-size="14" text-anchor="middle" fill="currentColor">50 kg</text></svg>'
          - 質量に加速度をかける。
        paths:
          - [慣性力の式 m a, 50 × 2]
          - [力の単位 N は kg m/s², 質量 × 加速度]
      - part: 今日
        text: 電車が右へ進みながら、ブレーキをかけて速さを落としている。電車の中の人にはたらく慣性力は、どちら向きか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="95" y="126" width="110" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="122.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="177.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="108" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="215" y1="60" x2="265" y2="60" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="275,60 265,65 265,55" fill="currentColor"/><text x="245" y="50" font-size="14" text-anchor="middle" fill="currentColor">進む向き</text><text x="150" y="70" font-size="14" text-anchor="middle" fill="currentColor">ブレーキ</text></svg>'
        choices: [右向き, 左向き, はたらかない]
        answer: 右向き
        check: "'右向き'"
        hints:
          - 速さが落ちるとき、加速度は進む向きとどう関係するか。
          - text: 加速度の向きが決まれば、慣性力はその逆向き。加速度の向きを図に出した。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="95" y="126" width="110" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="122.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="177.5" cy="158" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="215" y1="60" x2="170" y2="60" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><polygon points="160,60 170,55 170,65" fill="currentColor"/><text x="190" y="50" font-size="14" text-anchor="middle" fill="currentColor">加速度</text></svg>'
          - 慣性力は加速度と逆向き。
      - part: 今日
        text: 右へ加速する電車のてんじょうから、糸で玉をつるした。電車の中から見ると、玉はどうなるか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="75" y="136" width="150" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="112.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="187.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="150" y1="60" x2="150" y2="100" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="150" cy="100" r="11" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="260" y1="50" x2="290" y2="50" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="300,50 290,55 290,45" fill="currentColor"/><text x="280" y="40" font-size="14" text-anchor="middle" fill="currentColor">加速</text></svg>'
        choices: [進む向きにかたむく, 進む向きと逆にかたむく, まっすぐ下がる]
        answer: 進む向きと逆にかたむく
        check: "'進む向きと逆にかたむく'"
        hints:
          - 玉には、重力と糸の力のほかに、電車の中から見たときの見かけの力がはたらく。
          - text: 見かけの力の向きは、加速度の逆。重力と見かけの力を合わせた向きを考える。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="150" y1="100" x2="150" y2="140" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="150,150 145,140 155,140" fill="currentColor"/><line x1="150" y1="100" x2="115" y2="100" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="105,100 115,95 115,105" fill="#f08080"/><text x="170" y="150" font-size="14" text-anchor="middle" fill="currentColor">重力</text></svg>'
          - 糸は、重力と見かけの力を合わせた向きにのびる。
      - part: 今日
        text: 質量 2 kg の玉を糸でつるした電車が、右へ 7.5 m/s² で加速している。糸が玉を引く力は何 N か。重力加速度は 10 m/s² とする。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="75" y="136" width="150" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="112.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="187.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="150" y1="60" x2="150" y2="100" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="150" cy="100" r="11" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="200" y1="50" x2="250" y2="50" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="260,50 250,55 250,45" fill="currentColor"/><text x="230" y="40" font-size="14" text-anchor="middle" fill="currentColor">7.5 m/s²</text></svg>'
        choices: [15 N, 20 N, 25 N, 35 N]
        answer: 25 N
        check: "'25 N'"
        hints:
          - 玉はつりあっている。糸の力は、重力と慣性力を合わせた力と同じ大きさ。
          - text: 重力は下向きに 20 N。慣性力は横向きに何 N かを出す。2 つは直角になる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="150" y1="100" x2="150" y2="150" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="150,160 145,150 155,150" fill="currentColor"/><line x1="150" y1="100" x2="100" y2="100" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="90,100 100,95 100,105" fill="#f08080"/><text x="170" y="160" font-size="14" text-anchor="middle" fill="currentColor">重力 20 N</text><text x="100" y="85" font-size="14" text-anchor="middle" fill="currentColor">慣性力</text></svg>'
          - 直角をはさむ 2 辺の長さから、三平方の定理でななめの長さを出す。
        paths:
          - [重力 m g = 20 N, 慣性力 m a = 15 N, 三平方の定理で 25 N]
          - [見かけの重力加速度 √(10² + 7.5²) = 12.5 m/s², 2 kg をかける]
      - part: 今日
        text: 上向きに加速度 2 m/s² で動くエレベーターの中で、質量 60 kg の人が体重計に乗った。体重計は何 N を示すか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="100" y="50" width="100" height="100" fill="#7fc8f8" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><line x1="90" y1="150" x2="210" y2="150" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="105" r="12" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="250" y1="140" x2="250" y2="80" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,70 255,80 245,80" fill="currentColor"/><text x="270" y="105" font-size="14" text-anchor="middle" fill="currentColor">2 m/s²</text></svg>'
        choices: [480 N, 600 N, 720 N, 120 N]
        answer: 720 N
        check: "'720 N'"
        hints:
          - 体重計の読みは、体重計が人をおす力の大きさ。
          - text: エレベーターの中では、慣性力が下向きにはたらく。重力と同じ向きか逆向きかを見る。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="100" y="50" width="100" height="100" fill="#7fc8f8" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><line x1="90" y1="150" x2="210" y2="150" fill="none" stroke="currentColor" stroke-width="2"/><line x1="150" y1="100" x2="150" y2="140" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="150,150 145,140 155,140" fill="currentColor"/><line x1="150" y1="100" x2="150" y2="140" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="150,150 145,140 155,140" fill="#f08080"/><text x="190" y="120" font-size="14" text-anchor="middle" fill="currentColor">重力と慣性力</text></svg>'
