ri:
  - part: 離
    kinds: [総動員, 道筋]
    uses: [P-007, D-004]
    text: 水平でなめらかなぼうが、回る中心のまわりを回っています。ぼうはモーターで回されていて、角速度はいつも 4 rad/s に保たれています。ぼうを通った質量 0.5 kg の玉が、ばね定数 26 N/m のばねで回る中心につながれています。ばねの自然の長さは 0.9 m です。はじめ、玉はばねが自然の長さの位置で、ぼうに対して止まっていました。そこから玉は、ぼうにそって動き出します。ぼうに対する玉の速さがはじめて最大になるまでに、地面から見て、ぼうが玉にした仕事は何 J ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="110" r="7" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="60" y1="110" x2="290" y2="110" fill="none" stroke="currentColor" stroke-width="3"/><polyline points="60,110 75,96 90,124 105,96 120,124 135,96 150,110" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="110" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="60" y="150" font-size="14" text-anchor="middle" fill="currentColor">中心</text><text x="60" y="85" font-size="14" text-anchor="middle" fill="currentColor">モーター</text><text x="150" y="150" font-size="14" text-anchor="middle" fill="currentColor">0.9 m</text><text x="230" y="60" font-size="14" text-anchor="middle" fill="currentColor">4 rad/s</text><path d="M200 75 Q230 95 251.7 80.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="260,75 254.5,84.7 248.9,76.4" fill="currentColor"/><text x="230" y="140" font-size="14" text-anchor="middle" fill="currentColor">26 N/m</text></svg>'
    answer: 7.04
    check: "1.0 * (Fraction(1, 2) * 4 ** 2 * ((26 * Fraction(9, 10) / (26 - Fraction(1, 2) * 4 ** 2)) ** 2 - Fraction(9, 10) ** 2))"
    hints:
      - まず、ぼうといっしょに回る人から見て、ぼうに対する速さがはじめて最大になる位置を見つけます。そこは、ばねの力と外へ向かう力（遠心力）がつりあう所です。
      - text: 地面から見ると、玉は外へ動きながら回るので、横向きの速さ（角速度 × 中心からのきょり）がふえていきます。その速さをふやしているのは、ぼうが横から玉をおす力です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="110" r="7" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="60" y1="110" x2="290" y2="110" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="190" cy="110" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="190" y1="110" x2="190" y2="70" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="190,60 195,70 185,70" fill="#f08080"/><text x="240" y="55" font-size="14" text-anchor="middle" fill="currentColor">ぼうがおす力</text><circle cx="190" cy="110" r="22" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><rect x="177" y="152" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="190" y="170" font-size="16" text-anchor="middle" fill="currentColor">？</text></svg>'
      - 地面から見たエネルギーは、運動エネルギー（ぼうにそった速さと横向きの速さの両方）と、ばねの位置エネルギーの和です。ぼうがした仕事は、この和がふえた分です。
    paths:
      - [回る人から見る：つりあう位置は 26 × 0.9 ÷（26 − 0.5 × 4 × 4）= 1.3 m で、ぼうに対する速さはそこではじめて最大, 力はばね定数 26 − 8 = 18 N/m のばねと同じ形なので、ふれはば 0.4 m、角振動数 6 rad/s の往復で、そこでのぼうにそった速さは 6 × 0.4 = 2.4 m/s, 地面から見た速さの 2 乗は 2.4² +（4 × 1.3）² = 32.8 で、運動エネルギーは 8.2 J、はじめは ½ × 0.5 ×（4 × 0.9）² = 3.24 J, ばねの位置エネルギーは ½ × 26 × 0.4² = 2.08 J, ぼうの仕事は（8.2 − 3.24）+ 2.08 = 7.04 J]
      - [回る勢いで見る：地面から見て、ぼうの力が玉を中心のまわりに回そうとする強さ（力のモーメント）は、回る勢い m ω r² のふえ方に等しい, 仕事率は力のモーメント × ω なので、仕事は ω ×（回る勢いのふえた分）, 回る勢いは 0.5 × 4 × 0.9² = 1.62 から 0.5 × 4 × 1.3² = 3.38 にふえる, 仕事は 4 ×（3.38 − 1.62）= 7.04 J（ぼうにそった速さを出さなくてよい）]
    note: かりた こうぞう：S19 おきかえ・変数の取り方（回る人の見方で、遠心力の位置エネルギーをばねに足すと、新しいばねの形になる。仕事は地面の見方にもどして数える）、S03 たいしょうせい（つりあいの位置を中心にした往復）、S01 ふへんりょう（回る人から見たエネルギーの和は変わらないが、地面から見たエネルギーは変わる）。たね：なし（ri_seeds.py で 0 けん。ばねと遠心力の問題を構造の一覧から組み立てた）。なぜ むずかしいか：ぼうに対する速さが最大になる位置を回る人の見方で出したうえで、仕事は地面から見て数えなおす、と見方を 2 回変える。回る人から見たエネルギーの和が変わらないので「ぼうは仕事をしない」とまちがえやすい。横向きの速さも運動エネルギーに入れる、ばねの位置エネルギーも足す、と落としやすい所が 2 つある。回る勢いで見ると、ぼうにそった速さを出さずに出る。2 回目の直し：もとの問い（ぼうに対する速さの最大 2.4 m/s）は手順を当てれば終わったので、地面から見た仕事を問う形にした。
  - part: 離
    kinds: [道筋, 読み取り]
    uses: [P-007]
    text: 水平でなめらかな円板が、中心のまわりを 3 rad/s で回っています。円板の半径は 2 m です。中心から 0.4 m の所にある小さな玉を、円板の上から見て、中心から遠ざかる向きに 1.2 m/s ですべらせました。玉は円板の上をなめらかに動いて、やがてふちに着きます。ふちに着いたときの、円板の上から見た玉の速さは何 m/s ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="80" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="100" r="3" fill="currentColor"/><circle cx="166" cy="100" r="6" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="172" y1="100" x2="195" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="205,100 195,105 195,95" fill="currentColor"/><text x="190" y="88" font-size="14" text-anchor="middle" fill="currentColor">1.2 m/s</text><text x="300" y="40" font-size="14" text-anchor="middle" fill="currentColor">3 rad/s</text><path d="M262 70 Q264.4 99.2 278 112.9" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="285,120 274.4,116.4 281.5,109.4" fill="currentColor"/><line x1="150" y1="100" x2="150" y2="20" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><text x="120" y="60" font-size="14" text-anchor="middle" fill="currentColor">2 m</text><text x="150" y="190" font-size="14" text-anchor="middle" fill="currentColor">0.4 m は中心から玉まで</text></svg>'
    answer: 6
    check: "math.isqrt(144 + 9 * (400 - 16)) // 10"
    hints:
      - 円板の上から見る方法と、地面から見る方法があります。回る人から見ると、玉には遠心力のほかにコリオリ力もはたらきます。
      - text: コリオリ力は、玉が動く向きといつも直角にはたらきます。直角にはたらく力は、玉の速さを変えるでしょうか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="80" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="100" r="3" fill="currentColor"/><circle cx="190" cy="70" r="6" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="190" y1="70" x2="226.7" y2="45.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="235,40 229.5,49.7 223.9,41.4" fill="currentColor"/><line x1="190" y1="70" x2="204.5" y2="91.7" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="210,100 200.3,94.5 208.6,88.9" fill="#f08080"/><text x="255" y="40" font-size="14" text-anchor="middle" fill="currentColor">動く向き</text><text x="235" y="110" font-size="14" text-anchor="middle" fill="currentColor">コリオリ力</text><circle cx="210" cy="100" r="18" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="190" y="88" font-size="14" text-anchor="middle" fill="currentColor">1.2 m/s</text></svg>'
      - 速さを変える力は遠心力だけです。遠心力がする仕事は、位置エネルギーの変化として、はじめとふちの半径だけで決まります。
    paths:
      - [円板の上から見る：コリオリ力は動く向きと直角なので、仕事をしない, 遠心力の位置エネルギーは − ½ m ω² r², 運動エネルギーと足した和が一定なので ½ v² − ½ ω² r² が一定, v² = 1.2² + 3² × (2² − 0.4²) = 36, v = 6 m/s]
      - [地面から見る：玉には力がはたらかないので、まっすぐ一定の速さで進む, はじめの速度は、外向きに 1.2 m/s と、円板の回りの向きに 3 × 0.4 = 1.2 m/s の 2 つ, 玉の位置は x = 0.4 + 1.2 t、y = 1.2 t で、中心から 2 m になるのは 1 秒後, そこで円板がその点を動かす速度は 3 × 2 = 6 m/s で、向きは半径と直角, 玉の速度から円板の速度を引いて大きさを求めると 6 m/s]
    note: かりた こうぞう：S01 ふへんりょう（回る人から見て、½ v² − ½ ω² r² が変わらない）、S19 おきかえ・変数の取り方（地面から見ると、力のない直線の運動になる）。たね：なし（ri_seeds.py で 0 けん。回る台の上のすべる玉を構造の一覧から組み立てた）。なぜ むずかしいか：コリオリ力が仕事をしないと気づくか、地面から見て直線にもどせるか、見方を変える一手が要る。数を出すだけなら、球の道すじを円板の上の曲線として追うと行きづまる。
  - part: 離
    kinds: [手数, 総動員]
    uses: [P-007]
    text: 台車が水平な地面の上を、右向きに 7.5 m/s² で一定に加速しています。台車の上のはしから、長さ 0.8 m の軽い糸で、質量 0.4 kg の玉をつるしました。台車が加速を始めたとき、糸は真下を向いていて、玉は台車に対して止まっていました。玉が台車に対してはじめていちばん大きくふれて止まったとき、台車は加速をやめ、そのあとは同じ速さで走り続けます。加速をやめる前とあとを通して、糸の張力の最大は何 N ですか。重力加速度は 10 m/s² とします。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="70" y="146" width="160" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="110" cy="178" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="190" cy="178" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="150" y1="60" x2="150" y2="120" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="125" r="11" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="215" y1="60" x2="265" y2="60" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="275,60 265,65 265,55" fill="currentColor"/><text x="245" y="50" font-size="14" text-anchor="middle" fill="currentColor">7.5 m/s²</text><text x="190" y="100" font-size="14" text-anchor="middle" fill="currentColor">0.8 m</text><text x="100" y="125" font-size="14" text-anchor="middle" fill="currentColor">0.4 kg</text></svg>'
    answer: 9.76
    check: "1.0 * max(Fraction(2, 5) * Fraction(math.isqrt(10000 + 5625), 10) * (3 - 2 * 10 / Fraction(math.isqrt(10000 + 5625), 10)), Fraction(2, 5) * 10 * (3 - 2 * (2 * (10 / Fraction(math.isqrt(10000 + 5625), 10)) ** 2 - 1)))"
    hints:
      - 加速しているあいだと、加速をやめたあとに分けて考えます。加速しているあいだは、台車の上から見て、重力と加速と反対向きの力（慣性力）をまとめた「新しい重力」で見ます。
      - text: 玉は新しい重力の下向きをはさんで、左右に同じ角だけふれます。いちばんふれた所の糸は、真下からどれだけの角でしょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="150" y1="40" x2="150" y2="120" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="150" cy="120" r="8" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="150" y1="40" x2="108" y2="96" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="102,104 104,93 112,99" fill="#f08080"/><text x="95" y="125" font-size="14" text-anchor="middle" fill="currentColor">新しい下</text><line x1="150" y1="40" x2="75" y2="62" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><rect x="47" y="42" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="60" y="60" font-size="16" text-anchor="middle" fill="currentColor">？</text></svg>'
      - 加速をやめると、台車の上から見ても重力だけになります。いちばんふれた所で止まっていた玉が、ふつうのふりことしてふれ出します。そのいちばん下での張力を、加速しているあいだの最大とくらべます。
    paths:
      - [台車の上から見る：加速中の新しい重力は 10 と 7.5 から 12.5 m/s² で、真下に対して cos θ = 0.8 の向き, 玉は新しい下をはさんで往復するので、いちばんふれた所は真下から 2θ で、cos 2θ = 2 × 0.8² − 1 = 0.28, 加速中の張力の最大は新しい下で 0.4 × 12.5 ×（3 − 2 × 0.8）= 7 N, 加速をやめたあとは、2θ の所で止まった玉がふつうのふりこになり、いちばん下で v² = 2 × 10 × 0.8 ×（1 − 0.28）= 11.52, 張力は 0.4 ×（10 + 11.52 ÷ 0.8）= 9.76 N で、こちらが最大]
      - [仕事で見る：糸が真下から角 φ の所で台車に対して止まるのは、重力の仕事と慣性力の仕事の和が 0 のときで、10 ×（1 − cos φ）= 7.5 × sin φ, 半分の角で書くと tan（φ ÷ 2）= 0.75 なので、cos φ =（1 − 0.5625）÷（1 + 0.5625）= 0.28, 加速をやめたあとは、この角で止まった所から下りるふりこで、いちばん下の張力は m g（3 − 2 cos φ）= 4 × 2.44 = 9.76 N, 加速中の最大 7 N より大きいので、答えは 9.76 N]
    note: かりた こうぞう：S19 おきかえ・変数の取り方（重力と慣性力を 1 つの新しい重力にまとめる）、S03 たいしょうせい（新しい下を中心にした往復で、いちばんふれた所は 2 θ）、S10 上限と下限の評価（加速中と加速をやめたあとの、2 つの場面の張力の最大をくらべる）。たね：なし（ri_seeds.py で 0 けん。加速する台車のふりこを構造の一覧から組み立てた）。なぜ むずかしいか：加速をやめる場面が足され、見方を 2 回変える（新しい重力のふりこから、ふつうの重力のふりこへ）。2 つ目の場面の出発点は、たいしょうせいで真下から 2 θ と見ぬき、2 倍の角の cos を出す一手が要る。加速中だけを見て 7 N と答えるまちがいが起こりやすい。2 回目の直し：もとの問い（加速を続けたときの最大 7 N）は手順を当てれば終わったので、加速をやめる場面を足した。
