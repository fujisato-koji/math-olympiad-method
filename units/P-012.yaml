        explain: 円板の外（止まっている場所）から見ると、円板上の物は向心力 m r ω²（内向き）を受けて円運動している。円板の上（回っている場所）から見ると物は止まっているので、向心力とつりあう外向きの力 m r ω² がある、と考える。これが遠心力で、v ＝ r ω を使えば m v² ÷ r とも書ける。
