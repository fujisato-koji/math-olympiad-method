  - day: 2
    items:
      - part: 見本
        text: 糸でつるした玉を、右へ加速する電車の中で見ると、玉は左へかたむく。重力 m g と慣性力 m a が合わさって、かたむきの大きさは、慣性力 ÷ 重力 ＝ a ÷ g で決まる。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="75" y="136" width="150" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="112.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="187.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="150" y1="60" x2="120" y2="110" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="120" cy="110" r="11" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="215" y1="60" x2="265" y2="60" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="275,60 265,65 265,55" fill="currentColor"/><text x="245" y="50" font-size="14" text-anchor="middle" fill="currentColor">加速度 a</text><line x1="120" y1="110" x2="120" y2="140" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="120,150 115,140 125,140" fill="currentColor"/><line x1="120" y1="110" x2="90" y2="110" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="80,110 90,105 90,115" fill="#f08080"/><text x="70" y="95" font-size="14" text-anchor="middle" fill="currentColor">慣性力</text><text x="145" y="150" font-size="14" text-anchor="middle" fill="currentColor">重力</text></svg>'
        explain: 電車の中では、玉にかかる力は重力 m g（下向き）、慣性力 m a（加速度と逆向き）、糸の力の 3 つで、つりあっている。糸の向きは、重力と慣性力を合わせた向き。糸が下向きとなす角を θ とすると、tan θ ＝ m a ÷ m g ＝ a ÷ g。質量は消える。見かけの重力加速度は √(g² + a²) となる。
