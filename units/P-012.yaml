        text: 回る円板の上で、物が外へ動くと、遠心力は物を外へ動かして仕事をする。中心から r の所での遠心力の位置エネルギー U は、U ＝ −½ m ω² r² で、外へ行くほど小さくなる。r₁ から r₂ へ動くときの遠心力の仕事は、½ m ω² (r₂² − r₁²)。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="130" cy="100" r="70" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="130" cy="100" r="3" fill="currentColor"/><circle cx="130" cy="100" r="4" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="130" y1="100" x2="190" y2="100" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><polygon points="200,100 190,105 190,95" fill="currentColor"/><circle cx="160" cy="100" r="8" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="195" cy="100" r="8" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="160" y1="80" x2="185" y2="80" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="195,80 185,85 185,75" fill="currentColor"/><text x="178" y="68" font-size="14" text-anchor="middle" fill="currentColor">外へ</text><text x="262" y="120" font-size="14" text-anchor="middle" fill="currentColor">仕事 ＞ 0</text></svg>'
        explain: 回る人から見ると、遠心力 m r ω² は外向きの力で、r だけの関数なので位置エネルギーが決められる。F ＝ −dU/dr から U ＝ −½ m ω² r²。回る人から見ると、運動エネルギー ＋ 遠心力の位置エネルギー（＋ほかの力の位置エネルギー）が、一定に保たれる。
      - part: 今日
        text: 回る円板の上で、質量 2 kg の物を、中心 (r ＝ 0) から r ＝ 2 m まで外へ動かす。角速度は 3 rad/s。この間に遠心力がする仕事は何 J か。
