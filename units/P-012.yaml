      - part: 挑戦
        text: 台車の上に、質量 m の荷物がある。荷物と台車のあいだの静止まさつ係数は 0.4 で、重力加速度は 10 m/s²。台車を加速させたとき、荷物がすべり出さない最大の加速度は何 m/s² か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="75" y="136" width="150" height="28" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="112.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><circle cx="187.5" cy="168" r="7" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="130" y="105" width="40" height="30" fill="#c9a36b" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="215" y1="70" x2="265" y2="70" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="275,70 265,75 265,65" fill="currentColor"/><text x="245" y="60" font-size="14" text-anchor="middle" fill="currentColor">加速</text></svg>'
        choices: [0.4 m/s², 2.5 m/s², 4 m/s², 10 m/s²]
        answer: 4 m/s²
        check: "'4 m/s²'"
        hints:
          - 台車といっしょに動く人から見ると、荷物は止まっている。力のつりあいで考える。
          - text: 荷物にはたらく力は、慣性力とまさつ力。まさつ力の最大は、係数 × 面からの力。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="130" y="100" width="40" height="30" fill="#c9a36b" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="150" y1="115" x2="110" y2="115" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="100,115 110,110 110,120" fill="#f08080"/><line x1="150" y1="115" x2="190" y2="115" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="200,115 190,120 190,110" fill="currentColor"/><text x="100" y="95" font-size="14" text-anchor="middle" fill="currentColor">慣性力</text><text x="205" y="100" font-size="14" text-anchor="middle" fill="currentColor">まさつ力</text></svg>'
          - 慣性力が、まさつ力の最大の大きさと同じになるところが限界。質量は両方に出て消える。
        paths:
          - [慣性力 m a ＝ 最大まさつ力 0.4 m g, a ＝ 0.4 × 10]
          - [台車の外から見て、荷物を加速させる力はまさつ力だけ, m a ＝ 0.4 m g]
