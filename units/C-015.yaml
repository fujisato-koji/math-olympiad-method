      - part: わけ
        id: "f5421c32aa"
        text: どんな n と r（0 ≦ r ≦ n）でも、ₙCᵣ = ₙCₙ₋ᵣ が成り立ちます。そのわけを、すじ道を立てて書きましょう。
        explain: 例：「n このものから r こを選ぶ選び方を 1 つとる。選んだ r こが決まると、選ばなかった n − r こも 1 つに決まる。反対に、選ばない n − r こを決めると、残りの r こが選ぶものとして 1 つに決まる。r この選び方と n − r この選び方は 1 つずつ組になるので、数は等しい。ₙCᵣ は n こから r こを選ぶ数、ₙCₙ₋ᵣ は n こから n − r こを選ぶ数なので、ₙCᵣ = ₙCₙ₋ᵣ。」と書ければよい。① n こから r こを選ぶ選び方をとると決める、② 選ぶものと選ばないものを組にする、③ ₙCᵣ の意味（選び方の数）で結ぶ、の 3 点を見る。₅C₂ = ₅C₃ = 10 をたしかめただけで終わったら、例だけでは、すべての n と r で成り立つとは言えないことを話す。
        hints:
          - r こを選ぶと、選ばなかったものは何こかな。
          - text: 5 こから 2 こを選ぶ例だよ。選ぶ 2 こ（黄）を決めると、選ばない 3 こ（青）も決まるね。反対に、選ばない 3 こを先に決めるとどうなるかな。
