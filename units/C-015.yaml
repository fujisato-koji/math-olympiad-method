# C-015 二項係数とパスカルの三角形
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の漢字まじりの文。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 記号 ₙCᵣ（n 個から r 個を選ぶ選び方の数、二項係数）と計算、ₙCᵣ = ₙCₙ₋ᵣ、ₙC₀ = 1、
#   2 日目 道順（C-004）を「右と上の並び」にして ₙCᵣ で数える、⭐ を通る道、🌳 を通らない道（全体からひく）、
#   3 日目 パスカルの三角形（上の 2 つの和）、段の数の和が 2 の累乗になること、ₙCᵣ = ₙ₋₁Cᵣ₋₁ + ₙ₋₁Cᵣ、
#   4 日目 わけ（なぜ道順が ₙCᵣ か、なぜ ₙCᵣ = ₙCₙ₋ᵣ か、なぜ上の 2 つの和になるか）、
#   5 日目 C-007（組合せ）・A-010（文字の式）・C-004（道順の書きこみ）と混ぜる、6 日目 確認。
# 前提は C-007、A-010、C-004（→ A-009、N-074、N-009 など）。数は 1000 まで（1000 をこえる数の N-073 は前提にない）。
#   段の数の和は 2⁹ = 512 まで。2 けた × 2 けたの筆算（N-074）までで計算できる数にした。
# 記号は ₅C₂ のように下つきの数字で書く。ₙCᵣ = n × (n − 1) × … を r 個 ÷（r × (r − 1) × … × 1）と言葉で約束し、n! の記号は使わない
#   （階乗の記号は N-024 で使うが、ここの前提にはない）。式の中では「/」を使わず「÷」と書く（画面が「/」を分数にするため）。
# わけは段 4 の ③：explain に、①「〜とする」で文字を決める、② 選び方を分ける・組にする、③ 約束した事実（和の法則、積の法則、ₙCᵣ の意味）で結ぶ、の 3 点を書いた。
#   1 問目（道順と ₙCᵣ）は代表の例で書く ②。
# 二項定理（(a + b)ⁿ の展開の係数）は C-016 なので出さない。三角形の斜めの和（ホッケースティック）は挑戦だけ。
# 道順の図は C-004 と同じ（🏠 から 🏁 へ右か上に 1 マスずつ、🌳 は通れない、⭐ は必ず通る）。パスカルの三角形は svg で書き、□ が求める数。
# check：ₙCᵣ は itertools.combinations で選び方を作って数える。道順は C-004 と同じ式。三角形の □ は選び方の数、段の和は全部の部分の数を数える。

id: C-015
days:
  - day: 1
    items:
      - part: 見本
        text: 5 個のものから 2 個を選ぶ選び方の数を、記号で ₅C₂ と書きます。₅C₂ を求めましょう。
        explain: 5 個から 2 個を順番をつけて並べると 5 × 4 = 20 通りで、同じ 2 個の組を 2 × 1 = 2 回ずつ数えているので、₅C₂ = 5 × 4 ÷ (2 × 1) = 10 です（C-007）。一般に、n 個から r 個を選ぶ選び方の数を ₙCᵣ と書き、二項係数といいます。ₙCᵣ は、n から 1 ずつ小さくした数を r 個かけて、r × (r − 1) × … × 2 × 1 でわった数です。たとえば ₇C₃ = 7 × 6 × 5 ÷ (3 × 2 × 1) = 35。また、5 個から 3 個を選ぶことは、選ばない 2 個を選ぶことと同じなので ₅C₃ = ₅C₂ = 10 です。何も選ばない選び方は 1 通りなので、ₙC₀ = 1 と決めます。
      - part: 思い出す
        text: 7 人の中から、3 人の係を選びます。選び方は何通りですか。
        answer: 35
        check: "len(set(itertools.combinations(range(7), 3)))"
        hints:
          - 順番をつけて並べると何通りかな。
          - 3 人の組 1 つを、並べ方の中で何回ずつ数えているかな。
          - 並べ方の数を、その回数でわろう。
        paths:
          - [並べると 7 × 6 × 5 = 210 通り, 3 人の組は 3 × 2 × 1 = 6 回ずつ, 210 ÷ 6 = 35 通り]
      - part: 思い出す
        text: n = 6 のとき、n(n − 1) ÷ 2 の値はいくつですか。
        answer: 15
        check: "6 * (6 - 1) // 2"
        hints:
          - n に 6 を代入しよう。
          - かっこの中を先に計算しよう。
          - かけ算をしてから、2 でわろう。
        paths:
          - [6 × (6 − 1) ÷ 2, 6 × 5 ÷ 2, 15]
      - part: 今日
        text: ₈C₃ を求めましょう。
        answer: 56
        check: "len(set(itertools.combinations(range(8), 3)))"
        hints:
          - 8 から 1 ずつ小さくした数を、何個かけるかな。
          - わる数は 3 × 2 × 1 だね。
          - 約分してから計算すると楽になるよ。
        paths:
          - [8 × 7 × 6 ÷ (3 × 2 × 1), 336 ÷ 6, 56]
          - [6 ÷ (3 × 2 × 1) = 1 と先に約分, 8 × 7 = 56]
      - part: 今日
        text: A、B、C、D、E のみかんが 1 個ずつあります。この中から 4 個を選んで、かごに入れます。どのみかんを入れるかだけを考えると、入れ方は何通りですか。
        answer: 5
        check: "len(set(itertools.combinations(range(5), 4)))"
        hints:
          - みかんは全部で何個で、かごに入れないのは何個になるかな。
          - 入れない 1 個を決めると、入れる 4 個はどうなるかな。
          - 入れない 1 個を A、B、C、…と変えて、入れる 4 個の組を作っていこう。
        paths:
          - [入れない 1 個で考える, 入れない 1 個を決めると入れる 4 個の組も 1 つに決まる, 入れない 1 個は A〜E の 5 通りなので入れ方も 5 通り]
          - [入れる 4 個の組を書き出す, A、B、C、D と A、B、C、E と A、B、D、E と A、C、D、E と B、C、D、E, 5 組あるので 5 通り]
        note: 入れる 4 個を決めることと、入れない 1 個を決めることは 1 組ずつ向き合うので、入れ方の数は等しくなる（₅C₄ = ₅C₁）。このあとの、選ばないほうを数える問題につながる考え方である。「4 個を選ぶ」の 4 を見て 4 通りと答えやすいが、4 は入れる個数で、入れ方の数ではない。また、入れない 1 個を 1 つ決めたところで止まって 1 通りと答えるまちがいもある。入れない 1 個の選び方がいくつあるかまで数える。
      - part: 今日
        text: ₇C₅ を求めましょう。
        answer: 21
        check: "len(set(itertools.combinations(range(7), 5)))"
        hints:
          - 7 個から 5 個を選ぶことは、何個を選ばないことと同じかな。
          - ₇C₅ は ₇C₂ と同じだね。
          - ₇C₂ を計算しよう。
        paths:
          - [₇C₅ = ₇C₂, 7 × 6 ÷ (2 × 1), 21]
        note: 7 × 6 × 5 × 4 × 3 ÷ (5 × 4 × 3 × 2 × 1) と計算してもよいが、選ばないほうを数えると早い。
      - part: 今日
        text: ₁₀C₈ を求めましょう。
        answer: 45
        check: "len(set(itertools.combinations(range(10), 8)))"
        hints:
          - 選ばないほうは何個かな。
          - ₁₀C₈ は ₁₀C₂ と同じだね。
          - ₁₀C₂ を計算しよう。
        paths:
          - [₁₀C₈ = ₁₀C₂, 10 × 9 ÷ (2 × 1), 45]
      - part: 挑戦
        text: ₙC₂ = 28 になる n はいくつですか。
        answer: 8
        check: "[n for n in range(2, 30) if len(set(itertools.combinations(range(n), 2))) == 28][0]"
        hints:
          - ₙC₂ は n(n − 1) ÷ 2 だね。
          - n(n − 1) はいくつになるかな。
          - となり合う 2 つの《整数》の積が、その数になるものをさがそう。
        paths:
          - [n(n − 1) ÷ 2 = 28, n(n − 1) = 56, 8 × 7 = 56 なので n = 8]
          - [₂C₂、₃C₂、₄C₂ … を 1、3、6、10、15、21、28 と順に出す, n = 8]
    extra:
      - part: 今日
        text: ₆C₃ を求めましょう。
        answer: 20
        check: "len(set(itertools.combinations(range(6), 3)))"
        hints:
          - 6 から 1 ずつ小さくした数を 3 個かけよう。
          - わる数は 3 × 2 × 1 だね。
