        explain: 例：「どの行き方も、5 回進むうち、右が 3 回、上が 2 回。たとえば右、右、上、右、上 と進む行き方は、5 回のうち 3 回目と 5 回目が上。行き方 1 つから、上に進む回の組（3 回目と 5 回目）が 1 つ決まる。反対に、上に進む 2 回を選ぶと、残りは右なので、行き方が 1 つ決まる。行き方と、5 回から 2 回を選ぶ選び方は 1 つずつ組になるので、₅C₂ = 10 通り。」と書ければよい。「行き方 → 上の回」「上の回 → 行き方」の両方が書けているかを見る（C-014 の対応させて数える）。
        hints:
          - 行き方 1 つを、右と上の並びで書いてみよう。
          - その並びから、上に進む回はどれとどれかな。
          - 「行き方と選び方が 1 つずつ組になるから」を使って書こう。
        paths:
          - [行き方 → 右と上の並び → 上の 2 回が決まる, 上の 2 回を選ぶ → 行き方が決まる, 1 つずつ組, ₅C₂]
      - part: わけ
        text: どんな n と r（0 ≦ r ≦ n）でも、ₙCᵣ = ₙCₙ₋ᵣ が成り立ちます。そのわけを、筋道を立てて書きましょう。
        explain: 例：「n 個のものから r 個を選ぶ選び方を 1 つとる。選んだ r 個が決まると、選ばなかった n − r 個も 1 つに決まる。反対に、選ばない n − r 個を決めると、残りの r 個が選ぶものとして 1 つに決まる。r 個の選び方と n − r 個の選び方は 1 つずつ組になるので、数は等しい。ₙCᵣ は n 個から r 個を選ぶ数、ₙCₙ₋ᵣ は n 個から n − r 個を選ぶ数なので、ₙCᵣ = ₙCₙ₋ᵣ。」と書ければよい。① n 個から r 個を選ぶ選び方をとると決める、② 選ぶものと選ばないものを組にする、③ ₙCᵣ の意味（選び方の数）で結ぶ、の 3 点を見る。₅C₂ = ₅C₃ = 10 を確かめただけで終わったら、例ではすべての n と r を示せないことを話す。
        hints:
          - r 個を選ぶと、選ばなかったものは何個かな。
          - 選ばないものを先に決めても、選び方は 1 つに決まるかな。
          - 「1 つずつ組になるので等しい」と、ₙCᵣ の意味で結ぼう。
        paths:
          - [n 個から r 個を選ぶ選び方をとる, 選ばない n − r 個が決まる, 逆も決まる, 1 つずつ組なので ₙCᵣ = ₙCₙ₋ᵣ]
      - part: わけ
        text: パスカルの三角形の数は、すぐ左上とすぐ右上の和です。つまり ₙCᵣ = ₙ₋₁Cᵣ₋₁ + ₙ₋₁Cᵣ（1 ≦ r ≦ n − 1）。これが成り立つわけを、n 個のうちの 1 個に目をつけて、筋道を立てて書きましょう。
        explain: 例：「n 個のものの 1 つを A とする。n 個から r 個を選ぶ選び方を、A を選ぶものと A を選ばないものに分ける。A を選ぶときは、残りの n − 1 個から r − 1 個を選ぶので ₙ₋₁Cᵣ₋₁ 通り。A を選ばないときは、残りの n − 1 個から r 個を選ぶので ₙ₋₁Cᵣ 通り。どの選び方もどちらか一方だけに入るので、和の法則で ₙCᵣ = ₙ₋₁Cᵣ₋₁ + ₙ₋₁Cᵣ。」と書ければよい。① 1 つのものを A と決める、② A をふくむかどうかで重ならずに分ける、③ 和の法則で結ぶ、の 3 点を見る。₅C₂ = ₄C₁ + ₄C₂（10 = 4 + 6）のような例だけで終わったら、例ではすべての場合を示せないことを話す。
        hints:
