            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="16" y="75" font-size="14" text-anchor="start" fill="currentColor">0 こを選ぶ</text><circle cx="130" cy="70" r="12" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><circle cx="168" cy="70" r="12" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><circle cx="206" cy="70" r="12" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><circle cx="244" cy="70" r="12" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><circle cx="282" cy="70" r="12" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><text x="16" y="145" font-size="14" text-anchor="start" fill="currentColor">5 こを選ぶ</text><circle cx="130" cy="140" r="12" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><circle cx="168" cy="140" r="12" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><circle cx="206" cy="140" r="12" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><circle cx="244" cy="140" r="12" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><circle cx="282" cy="140" r="12" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="225" y="112" font-size="13" text-anchor="middle" fill="#e06c6c">選ぶ ⇄ 選ばない</text></svg>'
          - 選ばないほうを考えると、₅C₅ は ₅C₀ と同じだね。
        paths:
          - [何も選ばない選び方は 1 通りで ₅C₀ = 1, 全部選ぶのも 1 通りで ₅C₅ = 1, 1 + 1 = 2]
