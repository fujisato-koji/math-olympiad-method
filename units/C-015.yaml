3c969" fill-opacity="0.95" stroke="currentColor" stroke-width="1.5"/><text x="160" y="150" font-size="13" text-anchor="middle" fill="currentColor">ならべると 5 × 4 = 20 通り。同じ組を 2 回ずつ数える</text><text x="160" y="182" font-size="17" text-anchor="middle" fill="#e06c6c" font-weight="bold">₅C₂ = 20 ÷ 2 = 10 通り</text></svg>'
        explain: 5 こから 2 こを順番をつけてならべると 5 × 4 = 20 通りで、同じ 2 この組を 2 × 1 = 2 回ずつ数えているので、₅C₂ = 5 × 4 ÷ (2 × 1) = 10 です（C-007）。まとめると、n こから r こを選ぶ選び方の数を ₙCᵣ と書き、二項係数といいます。ₙCᵣ は、n から 1 ずつ小さくした数を r こかけて、r × (r − 1) × … × 2 × 1 でわった数です。たとえば ₇C₃ = 7 × 6 × 5 ÷ (3 × 2 × 1) = 35。また、5 こから 3 こを選ぶことは、選ばない 2 こを選ぶことと同じなので ₅C₃ = ₅C₂ = 10 です。何も選ばない選び方は 1 通りなので、ₙC₀ = 1 と決めます。
