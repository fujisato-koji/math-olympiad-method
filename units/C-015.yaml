        note: 右へ進む回数は横にならぶマスの数より 1 少なく、上へ進む回数もたてにならぶマスの数より 1 少ない（🏠 のマスにはもう立っているため）。この図は横 3 マス、たて 5 マスなので、3 + 5 = 8 回や、マス全部の 15 回と答えやすい。
