      - それぞれの道で、🌳 を通る行き方を ₙCᵣ で数えて、全体からひこう。
      - 前の道と後ろの道の行き方を、積の法則で合わせよう。
    paths:
      - [🏠 から ⭐ までは右 3 上 2 で ₅C₂ = 10 通り, そのうち左の 🌳 を通るのは 🏠 から 🌳 まで ₃C₁ = 3 通りで 🌳 から ⭐ までは 1 通りなので 3 通り、残りは 7 通り, ⭐ から 🏁 までは右 3 上 2 で 10 通り, そのうち右の 🌳 を通るのは ₃C₁ × ₂C₁ = 6 通りなので、残りは 4 通り, 7 × 4 = 28 通り]
      - [🏠 から ⭐ まで、マスに行き方の数を書きこむ（🌳 は 0）と ⭐ は 7, ⭐ を 1 として ⭐ から 🏁 まで書きこむ（🌳 は 0）と 🏁 は 4, 7 × 4 = 28 通り]
    note: 道順を ₙCᵣ で数える（2 日目）を、必ず通るマスと通れないマスが両方ある場合に広げる。前の道と後ろの道で 🌳 を通る数をそれぞれひいてから、積の法則で合わせる。全体の 210 通りや ⭐ を通る 100 通りからまとめてひこうとして、重なりを数えまちがえやすい。マスに数を書きこむ道（C-004）でたしかめてもよい。
