# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 道筋]
    uses: [N-008]
    text: パスカルの三角形の、₀C₀ だけの段から、₁₅C₀、₁₅C₁、…、₁₅C₁₅ の段までの 16 段に並ぶ数（全部で 136 個）のうち、奇数は何個ありますか。
    answer: 81
    check: "sum(1 for n in range(16) for r in range(n + 1) if math.comb(n, r) % 2 == 1)"
    time: 1080
    hints:
      - 大きな数を計算しなくても、上の 2 つの和のきまりで、偶数か奇数かだけを書きこめるよ。
      - 奇数 + 奇数 = 偶数、奇数 + 偶数 = 奇数、偶数 + 偶数 = 偶数を使って、奇数のところだけぬってみよう。
      - 0〜1 段、0〜3 段、0〜7 段までで、奇数の個数を数えてみよう。どんなきまりがあるかな。
    paths:
      - [上の 2 つの和のきまりで、偶数か奇数かだけを書きこむ, 0〜1 段で奇数は 3 個、0〜3 段で 9 個、0〜7 段で 27 個, 段の数を 2 倍にすると、上の三角形と同じぬり方の三角形が左下と右下に 1 つずつでき、その間は全部偶数になるので、奇数の個数は 3 倍になる, 0〜15 段では 27 × 3 = 81 個]
    note: パスカルの三角形の作り方（上の 2 つの和）と、偶数・奇数の和のきまり（N-008）を合わせる。大きな数（₁₅C₇ = 6435 など）を計算しなくても、偶奇だけで書きこめることと、同じ形がくり返されることに気づくのが要点。0〜15 段を全部書きこんで数えてもよい。
  - part: 離
    kinds: [数]
    text: ₁₀C₀ + ₁₀C₁ + ₁₀C₂ + ₁₀C₃ + ₁₀C₄ はいくつですか。
    answer: 386
    check: "sum(sum(1 for c in itertools.combinations(range(10), r)) for r in range(5))"
    hints:
      - 1 つずつ計算してもよいけれど、ₙCᵣ = ₙCₙ₋ᵣ を使う道もあるよ。
      - ₁₀C₀ から ₁₀C₁₀ までの和は、いくつだったかな。
      - ₁₀C₀ から ₁₀C₄ までの和と、₁₀C₆ から ₁₀C₁₀ までの和は同じだね。まん中の ₁₀C₅ をのぞいて考えよう。
    paths:
      - [₁₀C₀ = 1、₁₀C₁ = 10、₁₀C₂ = 45、₁₀C₃ = 120、₁₀C₄ = 210, 1 + 10 + 45 + 120 + 210 = 386]
      - [₁₀C₀ から ₁₀C₁₀ までの和は 2¹⁰ = 1024, ₁₀C₅ = 252 をのぞいた 772 は、左半分と右半分が同じ大きさ, 772 ÷ 2 = 386]
    note: ₁₀C₃ = 10 × 9 × 8 ÷ (3 × 2 × 1)、₁₀C₄ = 10 × 9 × 8 × 7 ÷ (4 × 3 × 2 × 1) の大きな数の計算でまちがえやすい。段の和 2¹⁰ と左右対称を使う 2 本目は、検算にもなる。
  - part: 離
    kinds: [手数, 読み取り]
    text: ⭐ のマスを必ず通ります。🌳 のマスは通れません。🏠 から 🏁 まで、右か上に 1 マスずつ進みます。行き方は何通りですか。
    figure: "⬜⬜⬜⬜⬜⬜🏁\n⬜⬜⬜⬜⬜🌳⬜\n⬜🌳⬜⭐⬜⬜⬜\n⬜⬜⬜⬜⬜⬜⬜\n🏠⬜⬜⬜⬜⬜⬜"
    answer: 28
    check: "(lambda g: sum(1 for c in itertools.combinations(range(len(g[0]) + len(g) - 2), len(g) - 1) if all(g[sum(1 for i in c if i < k)][k - sum(1 for i in c if i < k)] != '🌳' for k in range(len(g[0]) + len(g) - 1)) and any(g[sum(1 for i in c if i < k)][k - sum(1 for i in c if i < k)] == '⭐' for k in range(len(g[0]) + len(g) - 1))))(fig.splitlines()[::-1])"
    hints:
      - ⭐ で道を 2 つに分けよう。🏠 から ⭐ までと、⭐ から 🏁 までだね。
      - それぞれの道で、🌳 を通る行き方を ₙCᵣ で数えて、全体からひこう。
      - 前の道と後ろの道の行き方を、積の法則で合わせよう。
    paths:
      - [🏠 から ⭐ までは右 3 上 2 で ₅C₂ = 10 通り, そのうち左の 🌳 を通るのは 🏠 から 🌳 まで ₃C₁ = 3 通りで 🌳 から ⭐ までは 1 通りなので 3 通り、残りは 7 通り, ⭐ から 🏁 までは右 3 上 2 で 10 通り, そのうち右の 🌳 を通るのは ₃C₁ × ₂C₁ = 6 通りなので、残りは 4 通り, 7 × 4 = 28 通り]
    note: 道順を ₙCᵣ で数える（2 日目）を、必ず通るマスと通れないマスが両方ある場合に広げる。前の道と後ろの道で 🌳 を通る数をそれぞれひいてから、積の法則で合わせる。全体の 210 通りや ⭐ を通る 100 通りからまとめてひこうとして、重なりを数えまちがえやすい。マスに数を書きこむ道（C-004）で確かめてもよい。
