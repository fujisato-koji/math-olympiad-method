        text: パスカルの三角形の数は、すぐ左上とすぐ右上の和です。つまり ₙCᵣ = ₙ₋₁Cᵣ₋₁ + ₙ₋₁Cᵣ（1 ≦ r ≦ n − 1）。これが成り立つわけを、n このうちの 1 こに目をつけて、すじ道を立てて書きましょう。
        explain: 例：「n このものの 1 つを A とする。n こから r こを選ぶ選び方を、A を選ぶものと A を選ばないものに分ける。A を選ぶときは、残りの n − 1 こから r − 1 こを選ぶので ₙ₋₁Cᵣ₋₁ 通り。A を選ばないときは、残りの n − 1 こから r こを選ぶので ₙ₋₁Cᵣ 通り。どの選び方もどちらか一方だけに入るので、和の法則で ₙCᵣ = ₙ₋₁Cᵣ₋₁ + ₙ₋₁Cᵣ。」と書ければよい。① 1 つのものを A と決める、② A をふくむかどうかで重ならずに分ける、③ 和の法則で結ぶ、の 3 点を見る。₅C₂ = ₄C₁ + ₄C₂（10 = 4 + 6）のような例だけで終わったら、例だけでは、すべての場合で成り立つとは言えないことを話す。
        hints:
          - n このうちの 1 こを A として、A を選ぶか選ばないかで分けよう。
          - text: 5 こから 2 こを選ぶ例だよ。A を選ぶときと選ばないときに分けたよ。それぞれ、のこりの 4 こから何こを選ぶかな。
