      - part: 今日
        text: ₉C₇ を求めましょう。
        answer: 36
        check: "len(set(itertools.combinations(range(9), 7)))"
        hints:
          - 選ばないほうは何個かな。
          - ₉C₇ は ₉C₂ と同じだね。
          - ₉C₂ を計算しよう。
        paths:
          - [₉C₇ = ₉C₂, 9 × 8 ÷ 2, 36]
      - part: 今日
        text: ₅C₀ + ₅C₅ はいくつですか。
        answer: 2
        check: "len(set(itertools.combinations(range(5), 0))) + len(set(itertools.combinations(range(5), 5)))"
        hints:
          - 5 個から 0 個を選ぶ選び方は何通りかな。
          - 5 個から 5 個を選ぶ選び方は何通りかな。
          - 選ばないほうを考えると、₅C₅ は ₅C₀ と同じだね。
        paths:
          - [何も選ばない選び方は 1 通りで ₅C₀ = 1, 全部選ぶのも 1 通りで ₅C₅ = 1, 1 + 1 = 2]
        note: ₅C₀ = 0 としやすい。「何も選ばない」という 1 つの選び方がある、と決めておくと、ₙCᵣ = ₙCₙ₋ᵣ が r = 0 のときにも成り立つ。

  - day: 2
    items:
      - part: 見本
        text: 🏠 から 🏁 まで、となりのマスへ右か上に 1 マスずつ進みます。行き方は何通りですか。
        figure: "⬜⬜⬜🏁\n⬜⬜⬜⬜\n🏠⬜⬜⬜"
        explain: どの行き方も、右に 3 回、上に 2 回、合わせて 5 回進みます。行き方 1 つは「右右上右上」のような、右 3 つと上 2 つの並び 1 つで表せて、どの並びも行き方 1 つを表します。並びは、5 回のうち上に進む 2 回を選べば決まるので、₅C₂ = 10 通りです。C-004 のようにマスに数を書きこんでも 10 になります。右に a 回、上に b 回進む道順は、ₐ₊ᵦCᵦ 通りです。
      - part: 思い出す
        text: ₆C₄ を求めましょう。
        answer: 15
        check: "len(set(itertools.combinations(range(6), 4)))"
        hints:
          - 選ばないほうは何個かな。
          - ₆C₄ は ₆C₂ と同じだね。
          - ₆C₂ を計算しよう。
        paths:
          - [₆C₄ = ₆C₂, 6 × 5 ÷ 2, 15]
      - part: 思い出す
        text: マスの数は、🏠 からそこまで行く行き方の数です（右か上に 1 マスずつ進む）。□ のマスまでの行き方は何通りですか。
        figure: "１３□\n１２３\n🏠１１"
        answer: 6
        check: "(lambda g: sum(1 for c in itertools.combinations(range(len(g[0]) + len(g) - 2), len(g) - 1) if all(g[sum(1 for i in c if i < k)][k - sum(1 for i in c if i < k)] != '🌳' for k in range(len(g[0]) + len(g) - 1))))('⬜⬜🏁/⬜⬜⬜/🏠⬜⬜'.split('/')[::-1])"
        hints:
          - □ のマスには、どのマスから来られるかな。
          - 左のマスから来るか、下のマスから来るかだね。
          - 2 つのマスの数をたそう。
        paths:
          - [左のマスは 3、下のマスは 3, 3 + 3 = 6 通り]
      - part: 今日
