# A-021 複素数の計算
#
# 書き方は N-001 の頭の注のとおり。段 5 の決まりは A-019 の頭の注と同じ（思い出す 2・今日 2・挑戦 1、各日に予備 3 問）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 8 問にした。
# 地図に plan がないので、既定の並び（導入、練習、わけ、混ぜる、確認）で作った。
#   1 日目：虚数単位 i（i² = −1）、複素数 a + bi（実部、虚部、純虚数）、負の数の平方根 √(−k) = √k i、和・差・積。
#   2 日目：共役な複素数、わり算（分母と共役な数をかける）、複素数の相等、2 次方程式の虚数解（解の公式）。
#   3 日目：わけ。4 日目：A-017、A-016 と混ぜる（解の種類、解を代入する、i の累乗の和、係数を決める）。5 日目：確認。
# この単元の水準は 2（計算の決まりを当てはめる）。段 5 のわけの深さは ③ なので、わけの 3 問のうち 2 問は ③
#   （共役な数との積は 0 以上の実数、実数係数の 2 次方程式の虚数解は共役）、1 問は水準に合わせて ②（わり算で共役な数をかけるわけを例で書く）にした。
# 前提は A-017（2 次方程式）。たどると A-015（展開）、A-016（平方根、分母の有理化）、A-011、N-027 まで使える。
#   複素数平面、絶対値、極形式は A-034 なので扱わない。解と係数の関係（A-026）も使わない。
#   √(−k) は k が正の数のときだけ決め、√(−9) × √(−4) を √36 としないこと（予備の問題）に触れる。
#   複素数の大小は決めない（「虚数解をもつ」は b² − 4ac が負のこととして A-017 の判定だけで扱う）。
# 複素数の答えは鍵盤で打てないので choices。打つ問題は、実部、虚部、実数になる値、解の個数、整数の係数にした。
#   複素数の check は Python の複素数（2 + 3j）で計算し、選択肢ごとの値と差の絶対値が 1e-9 より小さいものを選ぶ。
#   打つ値は Fraction(…real) で整数や分数の形にし、負の数は「−」にそろえる。解を選ぶ check は、選択肢の 2 つの数を元の式に代入して 0 になるものを選ぶ。
#   i の累乗は、[1, i, −1, −i] の並びを 4 でわった余りで引いて計算する（大きな指数の累乗で誤差を出さないため）。
# 複素数は、極形式と 1 の累乗根（A-034）、交流回路のインピーダンス（E の流れ）、量子力学の波動関数（P の流れ）、信号のフーリエ変換の入口になる（D-026）。

id: A-021
days:
  - day: 1
    items:
      - part: 見本
        text: 2 乗すると −1 になる数を考えて、計算をしてみましょう。
        explain: 実数は 2 乗すると 0 以上になるので（N-027）、x² = −1 をみたす実数はありません（A-017 の「解がない」場合）。そこで、2 乗すると −1 になる新しい数を 1 つ考えて i と書き、虚数単位といいます。i² = −1 です。a、b を実数として a + bi の形に表される数を複素数といい、a を実部、b を虚部といいます。b = 0 なら実数 a で、b が 0 でない数を虚数、とくに a = 0 の bi を純虚数といいます。正の数 k について、√(−k) = √k i と決めます。たとえば √(−9) = 3i で、(3i)² = 9i² = −9 です。−9 の平方根は 3i と −3i の 2 つです。複素数の和・差・積は、i を文字のように計算し、i² が出たら −1 におきかえます。(2 + 3i) + (4 − i) = 6 + 2i、(2 + 3i) − (4 − i) = −2 + 4i、(2 + 3i)(4 − i) = 8 − 2i + 12i − 3i² = 8 + 10i + 3 = 11 + 10i です。答えは、実部と虚部を分けて a + bi の形に整えます。
      - part: 思い出す
        text: (√7 + √3)(√7 − √3) を計算しましょう。
        answer: 4
        check: "[k for k in range(-50, 51) if math.isclose((math.sqrt(7) + math.sqrt(3)) * (math.sqrt(7) - math.sqrt(3)), k)][0]"
        hints:
          - (a + b)(a − b) = a² − b² を使いましょう（A-015）。
          - (√7)² はいくつでしょう（A-016）。
          - 7 − 3 を計算しましょう。
        paths:
          - [(√7)² − (√3)², 7 − 3, 4]
      - part: 思い出す
        text: 2 次方程式 x² − 2x − 4 = 0 を解の公式で解くとき、√ の中の数 b² − 4ac はいくつですか。
        answer: 20
        check: "(-2) ** 2 - 4 * 1 * (-4)"
        hints:
          - a = 1、b = −2、c = −4 です。
          - (−2)² を先に計算しましょう。
          - −4 × 1 × (−4) の符号に気をつけましょう。
        paths:
          - [b² − 4ac = 4 − 4 × 1 × (−4), 4 + 16, 20]
      - part: 今日
        text: (3 + 2i) − (5 − 4i) を計算しましょう。
        choices: [−2 + 6i, −2 − 2i, 8 − 2i, −2 + 2i]
        answer: −2 + 6i
        check: "[c for c, v in {'−2 + 6i': -2 + 6j, '−2 − 2i': -2 - 2j, '8 − 2i': 8 - 2j, '−2 + 2i': -2 + 2j}.items() if abs(v - ((3 + 2j) - (5 - 4j))) < 1e-9][0]"
        hints:
          - かっこを外すとき、ひく数の符号が変わります。
          - 実部どうし、虚部どうしをまとめましょう。
          - 2i − (−4i) はいくつでしょう。
        paths:
          - [3 + 2i − 5 + 4i, 実部は 3 − 5 = −2, 虚部は 2 + 4 = 6, −2 + 6i]
        note: −(5 − 4i) を −5 − 4i としやすい。文字の式 (3 + 2x) − (5 − 4x) と同じ計算だと話す。
      - part: 今日
        text: (2 − i)(3 + 4i) を計算したときの実部はいくつですか。
        answer: 10
        check: "Fraction(((2 - 1j) * (3 + 4j)).real)"
        hints:
          - 文字の式のように展開しましょう。
          - −i × 4i = −4i² です。
          - i² = −1 におきかえて、実部と虚部に分けましょう。
        paths:
          - [6 + 8i − 3i − 4i², 6 + 5i + 4, 10 + 5i で実部は 10]
        note: i² を −1 におきかえ忘れて、実部を 6 − 4 = 2 としやすい。
      - part: 挑戦
        text: (1 + i)⁴ の値はいくつですか。
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(((1 + 1j) * (1 + 1j) * (1 + 1j) * (1 + 1j)).real))"
        hints:
          - まず (1 + i)² を計算しましょう。
          - (1 + i)⁴ = ((1 + i)²)² です（A-009）。
          - (2i)² を計算しましょう。
        paths:
          - [(1 + i)² = 1 + 2i + i² = 2i, (1 + i)⁴ = (2i)² = 4i², −4]
        note: 4 乗をそのまま展開せず、2 乗の 2 乗とみると軽い。虚数どうしの積が実数になることに気づかせる。
    extra:
      - part: 今日
        text: √(−9) × √(−4) の値はいくつですか。
        answer: −6
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(((3j) * (2j)).real))"
        hints:
          - まず √(−9) と √(−4) を、i を使って書きましょう。
          - √(−9) = 3i です。
          - 3i × 2i を計算し、i² = −1 を使いましょう。
        paths:
          - [√(−9) = 3i、√(−4) = 2i, 3i × 2i = 6i², −6]
        note: √(−9) × √(−4) = √36 = 6 としやすい。√a × √b = √(ab) は a、b が正の数のときの決まり（A-016）で、負の数には使えない。
      - part: 今日
        text: (4 + 3i)(4 − 3i) の値はいくつですか。
        answer: 25
        check: "Fraction(((4 + 3j) * (4 - 3j)).real)"
        hints:
          - (a + b)(a − b) = a² − b² の形です。
          - (3i)² = 9i² です。
          - i² = −1 を使いましょう。
        paths:
          - [4² − (3i)², 16 − 9i², 16 + 9 = 25]
      - part: 挑戦
        text: (2 + 3i)² を計算したときの虚部はいくつですか。
        answer: 12
        check: "Fraction(((2 + 3j) * (2 + 3j)).imag)"
        hints:
          - (a + b)² = a² + 2ab + b² を使いましょう。
          - (3i)² は負の数です。
          - 実部と虚部に分けましょう。
        paths:
          - [4 + 12i + 9i², 4 + 12i − 9, −5 + 12i で虚部は 12]
        note: 虚部は i の係数の 12 で、12i と答えないように。

  - day: 2
    items:
      - part: 見本
        text: 複素数 3 + i を 1 − 2i でわってみましょう。また、2 次方程式 x² + 2x + 5 = 0 を解いてみましょう。
        explain: 複素数 a + bi に対して、a − bi を共役な複素数といいます。(a + bi)(a − bi) = a² − b²i² = a² + b² で、共役な複素数どうしの積は実数になります。わり算は、分母と共役な複素数を分母と分子にかけて、分母を実数にします（A-016 の分母の有理化と同じ考え）。(3 + i)/(1 − 2i) = (3 + i)(1 + 2i)/((1 − 2i)(1 + 2i)) = (3 + 6i + i + 2i²)/(1 + 4) = (1 + 7i)/5 = 1/5 + (7/5)i です。また、a、b、c、d が実数のとき、a + bi = c + di となるのは a = c かつ b = d のときだけです（とくに a + bi = 0 となるのは a = 0 かつ b = 0 のとき）。これを複素数の相等といいます。2 次方程式 x² + 2x + 5 = 0 は、解の公式（A-017）で x = (−2 ± √(4 − 20))/2 = (−2 ± √(−16))/2 = (−2 ± 4i)/2 = −1 ± 2i となります。b² − 4ac が負のとき、実数の解はありませんが、複素数の範囲では 2 つの虚数の解（虚数解）があります。−1 + 2i を代入すると (−1 + 2i)² + 2(−1 + 2i) + 5 = (1 − 4i − 4) + (−2 + 4i) + 5 = 0 となり、たしかに解です。
      - part: 思い出す
        text: (1 + 2i)(3 − i) を計算しましょう。
        choices: [5 + 5i, 1 + 5i, 3 − 2i, 5 + 7i]
        answer: 5 + 5i
        check: "[c for c, v in {'5 + 5i': 5 + 5j, '1 + 5i': 1 + 5j, '3 − 2i': 3 - 2j, '5 + 7i': 5 + 7j}.items() if abs(v - (1 + 2j) * (3 - 1j)) < 1e-9][0]"
        hints:
          - 文字の式のように展開しましょう。
          - 2i × (−i) = −2i² です。
          - i² = −1 におきかえて、実部と虚部をまとめましょう。
        paths:
          - [3 − i + 6i − 2i², 3 + 5i + 2, 5 + 5i]
      - part: 思い出す
        text: 2/(√5 − √3) の分母を有理化した式はどれですか。
        choices: [√5 + √3, √5 − √3, (√5 + √3)/2, 2√5 + 2√3]
        answer: √5 + √3
        check: "[c for c, v in {'√5 + √3': math.sqrt(5) + math.sqrt(3), '√5 − √3': math.sqrt(5) - math.sqrt(3), '(√5 + √3)/2': (math.sqrt(5) + math.sqrt(3)) / 2, '2√5 + 2√3': 2 * math.sqrt(5) + 2 * math.sqrt(3)}.items() if math.isclose(v, 2 / (math.sqrt(5) - math.sqrt(3)))][0]"
        hints:
          - 分母と分子に √5 + √3 をかけましょう（A-016）。
          - 分母は (√5)² − (√3)² になります。
          - 分子の 2 と分母の 2 を約分しましょう。
        paths:
          - [2(√5 + √3)/((√5 − √3)(√5 + √3)), 2(√5 + √3)/2, √5 + √3]
        note: 複素数のわり算で共役な数をかけるのは、この有理化と同じ考え。
      - part: 今日
        text: (5 + i)/(1 + i) を計算しましょう。
        choices: [3 − 2i, 3 + 2i, 2 − 3i, 6 − 4i]
        answer: 3 − 2i
        check: "[c for c, v in {'3 − 2i': 3 - 2j, '3 + 2i': 3 + 2j, '2 − 3i': 2 - 3j, '6 − 4i': 6 - 4j}.items() if abs(v - (5 + 1j) / (1 + 1j)) < 1e-9][0]"
        hints:
          - 分母と共役な複素数は 1 − i です。
          - 分母と分子に 1 − i をかけましょう。
          - 分母は (1 + i)(1 − i) = 1 − i² になります。
        paths:
          - [(5 + i)(1 − i)/((1 + i)(1 − i)), (5 − 5i + i − i²)/2, (6 − 4i)/2, 3 − 2i]
        note: 分母の 2 でわり忘れると 6 − 4i になる。答えに 1 + i をかけて 5 + i にもどるかで確かめさせる。
      - part: 今日
        text: 2 次方程式 x² − 4x + 13 = 0 の解はどれですか。
        choices: [x = 2 ± 3i, x = −2 ± 3i, x = 2 ± 3, x = 4 ± 6i]
        answer: x = 2 ± 3i
        check: "[c for c, zs in {'x = 2 ± 3i': (2 + 3j, 2 - 3j), 'x = −2 ± 3i': (-2 + 3j, -2 - 3j), 'x = 2 ± 3': (5, -1), 'x = 4 ± 6i': (4 + 6j, 4 - 6j)}.items() if all(abs(z * z - 4 * z + 13) < 1e-9 for z in zs)][0]"
        hints:
          - 解の公式に a = 1、b = −4、c = 13 を入れましょう。
          - √ の中の b² − 4ac は負の数になります。
          - √(−36) = 6i です。分子と分母を 2 でわりましょう。
        paths:
          - [x = (4 ± √(16 − 52))/2, = (4 ± √(−36))/2 = (4 ± 6i)/2, x = 2 ± 3i]
          - ["(x − 2)² = −9 と平方完成する", x − 2 = ±3i, x = 2 ± 3i]
      - part: 挑戦
        text: x、y が実数で、(x + 4i)(1 + 2i) = −5 + yi のとき、y はいくつですか。
        answer: 10
        check: "[y for x in range(-20, 21) for y in range(-40, 41) if (x + 4j) * (1 + 2j) == -5 + y * 1j][0]"
        hints:
          - 左辺を展開して、実部と虚部に分けましょう。
          - 複素数の相等から、実部どうし、虚部どうしが等しくなります。
          - 実部の式から x を求めてから、虚部の式で y を求めましょう。
        paths:
          - [(x + 4i)(1 + 2i) = (x − 8) + (2x + 4)i, x − 8 = −5 で x = 3, y = 2 × 3 + 4 = 10]
        note: x、y が実数であることが、相等を使う条件。8i² = −8 を実部に入れ忘れやすい。
    extra:
      - part: 今日
        text: 2 + 5i と、それと共役な複素数との積はいくつですか。
        answer: 29
        check: "Fraction(((2 + 5j) * (2 - 5j)).real)"
        hints:
          - 2 + 5i と共役な複素数は 2 − 5i です。
          - (a + bi)(a − bi) = a² + b² です。
          - 2² + 5² を計算しましょう。
        paths:
          - [(2 + 5i)(2 − 5i) = 4 − 25i², 4 + 25 = 29]
      - part: 今日
        text: 15/(1 + 2i) を計算しましょう。
        choices: [3 − 6i, 3 + 6i, 15 − 30i, 1 − 2i]
        answer: 3 − 6i
        check: "[c for c, v in {'3 − 6i': 3 - 6j, '3 + 6i': 3 + 6j, '15 − 30i': 15 - 30j, '1 − 2i': 1 - 2j}.items() if abs(v - 15 / (1 + 2j)) < 1e-9][0]"
        hints:
          - 分母と共役な複素数は 1 − 2i です。
          - 分母は (1 + 2i)(1 − 2i) = 1 + 4 になります。
          - 分子の 15 と分母を約分しましょう。
        paths:
          - [15(1 − 2i)/((1 + 2i)(1 − 2i)), 15(1 − 2i)/5, 3 − 6i]
      - part: 今日
        text: 2 次方程式 x² + 6x + 10 = 0 の解はどれですか。
        choices: [x = −3 ± i, x = 3 ± i, x = −3 ± 2i, x = −6 ± 2i]
        answer: x = −3 ± i
        check: "[c for c, zs in {'x = −3 ± i': (-3 + 1j, -3 - 1j), 'x = 3 ± i': (3 + 1j, 3 - 1j), 'x = −3 ± 2i': (-3 + 2j, -3 - 2j), 'x = −6 ± 2i': (-6 + 2j, -6 - 2j)}.items() if all(abs(z * z + 6 * z + 10) < 1e-9 for z in zs)][0]"
        hints:
          - 解の公式か、平方完成で解きましょう。
          - (x + 3)² = −1 の形にできます。
          - 2 乗すると −1 になる数は ±i です。
        paths:
          - [(x + 3)² = −1, x + 3 = ±i, x = −3 ± i]
          - [x = (−6 ± √(36 − 40))/2 = (−6 ± 2i)/2, x = −3 ± i]

  - day: 3
    items:
      - part: 思い出す
        text: (3 − 2i)(3 + 2i) の値はいくつですか。
        answer: 13
        check: "Fraction(((3 - 2j) * (3 + 2j)).real)"
        hints:
          - 共役な複素数どうしの積です。
          - (a − bi)(a + bi) = a² + b² です。
          - 3² + 2² を計算しましょう。
        paths:
          - [9 − 4i², 9 + 4, 13]
      - part: 思い出す
        text: 2 次方程式 x² + 2x + 3 = 0 の解はどれですか。
        choices: [x = −1 ± √2 i, x = 1 ± √2 i, x = −1 ± 2i, x = −1 ± √2]
        answer: x = −1 ± √2 i
        check: "[c for c, zs in {'x = −1 ± √2 i': ((-1 + (math.sqrt(2)) * 1j), (-1 + (-math.sqrt(2)) * 1j)), 'x = 1 ± √2 i': ((1 + (math.sqrt(2)) * 1j), (1 + (-math.sqrt(2)) * 1j)), 'x = −1 ± 2i': (-1 + 2j, -1 - 2j), 'x = −1 ± √2': (-1 + math.sqrt(2), -1 - math.sqrt(2))}.items() if all(abs(z * z + 2 * z + 3) < 1e-9 for z in zs)][0]"
        hints:
          - 平方完成すると (x + 1)² = −2 です。
          - 2 乗すると −2 になる数は ±√2 i です。
          - x + 1 = ±√2 i を解きましょう。
        paths:
          - [(x + 1)² = −2, x + 1 = ±√2 i, x = −1 ± √2 i]
      - part: 今日
        text: i⁶ の値はいくつですか。
        answer: −1
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction([1, 1j, -1, -1j][6 % 4].real))"
        hints:
          - i² = −1 です。
          - i⁶ = (i²)³ と書けます（A-009）。
          - (−1)³ を計算しましょう。
        paths:
          - [i⁶ = (i²)³, = (−1)³, −1]
          - [i⁴ = 1 なので i⁶ = i⁴ × i² = −1]
      - part: わけ
        text: a、b を実数とします。複素数 a + bi と、それと共役な複素数 a − bi の積は、いつも 0 以上の実数になります。このわけを、筋道を立てて書きましょう。
        explain: 例：「a、b を実数とする。(a + bi)(a − bi) = a² − abi + abi − b²i² = a² − b²i²（(x + y)(x − y) = x² − y²、A-015）。i² = −1 なので、これは a² + b² である。a、b は実数なので、a² と b² はどちらも 0 以上の実数（N-027）で、その和 a² + b² も 0 以上の実数である。よって、積はいつも 0 以上の実数である。」と書ければよい。①「〜とする」で a、b を実数と決める、② 展開して i² = −1 でおきかえる、③ 約束した事実（実数の 2 乗は 0 以上）で結ぶ、の 3 つがそろっているかを見る。a、b が実数であることを使っている（虚数の 2 乗は負になることがある）ことに気づかせる。積が 0 になるのは a = b = 0 のときだけであり、0 でない複素数でわるときに分母が 0 にならないわけにもなる、と話す。
        hints:
          - 「a、b を実数とする」から書き始めましょう。
          - (a + bi)(a − bi) を展開して、i² = −1 を使いましょう。
          - a² と b² が負の数になることはあるでしょうか。
        paths:
          - [a、b を実数とする, (a + bi)(a − bi) = a² − b²i² = a² + b², a² も b² も 0 以上の実数なので和も 0 以上の実数]
      - part: わけ
        text: p、q を実数とし、p² − 4q が負の数とします。このとき、2 次方程式 x² + px + q = 0 の 2 つの解は、互いに共役な複素数になります。このわけを、筋道を立てて書きましょう。
        explain: 例：「D = p² − 4q とし、D は負の数とする。解の公式（A-017）から x = (−p ± √D)/2 である。−D は正の数なので、√D = √(−D) i（√(−k) = √k i の決め方）と書ける。よって x = −p/2 ± (√(−D)/2)i となる。ここで m = −p/2、n = √(−D)/2 とおくと、m、n は実数で、2 つの解は m + ni と m − ni である。これは互いに共役な複素数である。」と書ければよい。①「〜とする」で D を決める、② 解の公式の √D を √(−D) i に書きかえて、実部と虚部に分ける、③ 約束した事実（解の公式、負の数の平方根の決め方、共役の定義）で結ぶ、の 3 つがそろっているかを見る。p、q が実数でなければ m、n が実数とは限らないので、「実数の係数」が要ることに触れる。x² − 4x + 13 = 0 の解 2 ± 3i（2 日目）で確かめさせる。
