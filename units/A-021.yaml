          - a + bi の形にしたら、i の前の数を読みましょう。
        paths:
          - [a + bi = 5/(2 + i), = 5(2 − i)/5 = 2 − i, b = −1]
          - [左辺を展開すると (2a − b) + (a + 2b)i, 相等より 2a − b = 5 と a + 2b = 0, a = 2、b = −1]

