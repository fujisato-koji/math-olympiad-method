fill="currentColor">1 + 2i</text><line x1="255" y1="54" x2="313" y2="54" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="284" y="74" font-size="16" text-anchor="middle" fill="currentColor">1 + 2i</text><line x1="206" y1="92" x2="206" y2="113.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="206,118 201.6,110 210.4,110" fill="currentColor"/><text x="216" y="102" font-size="13" text-anchor="start" fill="currentColor">上下に 1 + 2i</text><text x="216" y="118" font-size="13" text-anchor="start" fill="currentColor">をかける</text><rect x="171" y="156" width="70" height="26" rx="4" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.2"/><text x="206" y="144" font-size="18" text-anchor="middle" fill="currentColor">1 + 7i</text><line x1="173" y1="152" x2="239" y2="152" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="206" y="174" font-size="18" text-anchor="middle" fill="currentColor">5</text><text x="250" y="178" font-size="13" text-anchor="start" fill="currentColor">← 実数</text></svg>'
        explain: 複素数 a + bi に対して、a − bi を共役な複素数といいます。(a + bi)(a − bi) = a² − b²i² = a² + b² で、共役な複素数どうしの積は実数になります。わり算は、分母と共役な複素数を分母と分子にかけて、分母を実数にします（A-016 の分母の有理化と同じ考え）。(3 + i)/(1 − 2i) = (3 + i)(1 + 2i)/((1 − 2i)(1 + 2i)) = (3 + 6i + i + 2i²)/(1 + 4) = (1 + 7i)/5 = 1/5 + (7/5)i です。また、a、b、c、d が実数のとき、a + bi = c + di となるのは a = c かつ b = d のときだけです（とくに a + bi = 0 となるのは a = 0 かつ b = 0 のとき）。これを複素数の相等といいます。2 次方程式 x² + 2x + 5 = 0 は、解の公式（A-017）で x = (−2 ± √(4 − 20))/2 = (−2 ± √(−16))/2 = (−2 ± 4i)/2 = −1 ± 2i となります。b² − 4ac が負のとき、実数の解はありませんが、複素数まで考えると 2 つの虚数の解（虚数解）があります。−1 + 2i を代入すると (−1 + 2i)² + 2(−1 + 2i) + 5 = (1 − 4i − 4) + (−2 + 4i) + 5 = 0 となり、たしかに解です。
