      - part: わけ
        id: "f3ee6ad9a6"
        text: a、b を実数とします。複素数 a + bi と、それと共役な複素数 a − bi の積は、いつも 0 以上の実数になります。このわけを、すじ道を立てて書きましょう。
        explain: 例：「a、b を実数とする。(a + bi)(a − bi) = a² − abi + abi − b²i² = a² − b²i²（(x + y)(x − y) = x² − y²、A-015）。i² = −1 なので、これは a² + b² である。a、b は実数なので、a² と b² はどちらも 0 以上の実数（N-027）で、その和 a² + b² も 0 以上の実数である。よって、積はいつも 0 以上の実数である。」と書ければよい。①「〜とする」で a、b を実数と決める、② 展開して i² = −1 でおきかえる、③ 約束した事実（実数の 2 乗は 0 以上）で結ぶ、の 3 つがそろっているかを見る。a、b が実数であることを使っている（虚数の 2 乗は負になることがある）ことに気づかせる。積が 0 になるのは a = b = 0 のときだけであり、0 でない複素数でわるときに分母が 0 にならないわけにもなる、と話す。
        hints:
          - 「a、b を実数とする」から書き始めましょう。
          - text: (a + bi)(a − bi) を表にすると、赤い 2 つのますが消しあいます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="170" y="22" font-size="14" text-anchor="middle" fill="currentColor">(a + bi)(a − bi) の表</text><rect x="40" y="34" width="60" height="32" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="70" y="55" font-size="14" text-anchor="middle" fill="currentColor">×</text><rect x="100" y="34" width="100" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="150" y="55" font-size="15" text-anchor="middle" fill="currentColor">a</text><rect x="200" y="34" width="100" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="250" y="55" font-size="15" text-anchor="middle" fill="currentColor">−bi</text><rect x="40" y="66" width="60" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="70" y="93" font-size="15" text-anchor="middle" fill="currentColor">a</text><rect x="100" y="66" width="100" height="44" rx="0" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="150" y="93" font-size="15" text-anchor="middle" fill="currentColor">a²</text><rect x="200" y="66" width="100" height="44" rx="0" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="250" y="93" font-size="15" text-anchor="middle" fill="currentColor">−abi</text><rect x="40" y="110" width="60" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="70" y="137" font-size="15" text-anchor="middle" fill="currentColor">+bi</text><rect x="100" y="110" width="100" height="44" rx="0" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="150" y="137" font-size="15" text-anchor="middle" fill="currentColor">+abi</text><rect x="200" y="110" width="100" height="44" rx="0" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.