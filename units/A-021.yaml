        text: 2 乗すると −1 になる数を i と書き、虚数単位といいます（i² = −1）。a + bi の形の数を複素数といい、a を実部、b を虚部といいます。かけ算は図のように表にして、i を文字のように計算し、i² が出たら −1 におきかえます。
