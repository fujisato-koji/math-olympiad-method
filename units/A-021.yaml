# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "63bb6f0038"
    kinds: [道筋, 手数]
    text: 複素数 z が z² − z + 1 = 0 をみたすとき、z¹⁰⁰ + 1/z¹⁰⁰ の値はいくつですか。
    answer: −1
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([k for k in range(-5, 6) for z in [(0.5 + (math.sqrt(3) / 2) * 1j)] if abs(z ** 100 + 1 / z ** 100 - k) < 1e-6][0])"
    hints:
      - z を求めて 100 乗するのは大変だね。z² − z + 1 に何かをかけると、きれいな式にならないかな。
      - text: (z + 1)(z² − z + 1) を表で展開してみよう。z³ はいくつになるかな。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">(z + 1)(z² − z + 1) の表</text><rect x="30" y="34" width="50" height="32" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="55" y="55" font-size="14" text-anchor="middle" fill="currentColor">×</text><rect x="80" y="34" width="76" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="118" y="55" font-size="15" text-anchor="middle" fill="currentColor">z²</text><rect x="156" y="34" width="76" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="194" y="55" font-size="15" text-anchor="middle" fill="currentColor">−z</text><rect x="232" y="34" width="76" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="270" y="55" font-size="15" text-anchor="middle" fill="currentColor">+1</text><rect x="30" y="66" width="50" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="55" y="93" font-size="15" text-anchor="middle" fill="currentColor">z</text><rect x="80" y="66" width="76" height="44" rx="0" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="118" y="93" font-size="15" text-anchor="middle" fill="currentColor">z³</text><rect x="156" y="66" width="76" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="194" y="93" font-size="15" text-anchor="middle" fill="currentColor">−z²</text><rect x="232" y="66" width="76" height="44" rx="0" fill="#7bc96f" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="270" y="93" font-size="15" text-anchor="middle" fill="currentColor">+z</text><rect x="30" y="110" width="50" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="55" y="137" font-size="15" text-anchor="middle" fill="currentColor">+1</text><rect x="80" y="110" width="76" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="118" y="137" font-size="15" text-anchor="middle" fill="currentColor">+z²</text><rect x="156" y="110" width="76" height="44" rx="0" fill="#7bc96f" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="194" y="137" font-size="15" text-anchor="middle" fill="currentColor">−z</text><rect x="232" y="110" width="76" height="44" rx="0" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="270" y="137" font-size="15" text-anchor="middle" fill="currentColor">+1</text><text x="160" y="182" font-size="13" text-anchor="middle" fill="currentColor">はい色どうし、緑どうしは消しあう</text></svg>'
      - 100 を 3 でわった《余り》を使おう。z + 1/z は、元の式を z でわると出てくるよ。
    paths:
      - [(z + 1)(z² − z + 1) = z³ + 1 なので z³ = −1, z¹⁰⁰ = (z³)³³ × z = −z で 1/z¹⁰⁰ = −1/z, z² − z + 1 = 0 を z でわって z + 1/z = 1, z¹⁰⁰ + 1/z¹⁰⁰ = −(z + 1/z) = −1]
      - [z² = z − 1 を使うと z³ = z × z² = z² − z = −1, z¹⁰⁰ = (z³)³³ × z = −z、z(1 − z) = 1 より 1/z = 1 − z なので 1/z¹⁰⁰ = −1/z = z − 1, z¹⁰⁰ + 1/z¹⁰⁰ = −z + z − 1 = −1]
    note: 解の公式で z = (1 ± √3 i)/2 を出しても、100 乗は手で計算できない。z³ = −1 という短い式を見つけるのが鍵（A-034 の 1 の累乗根につながる）。z は 0 でないので z でわってよい。
