67" font-size="15" text-anchor="middle" fill="currentColor">3</text><rect x="148" y="76" width="32" height="38" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="164" y="101" font-size="15" text-anchor="middle" fill="currentColor">−i</text><rect x="180" y="46" width="32" height="30" rx="0" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/><text x="196" y="67" font-size="15" text-anchor="middle" fill="currentColor">4</text><rect x="180" y="76" width="32" height="38" rx="0" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="196" y="101" font-size="15" text-anchor="middle" fill="currentColor">1</text><rect x="212" y="46" width="32" height="30" rx="0" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/><text x="228" y="67" font-size="15" text-anchor="middle" fill="currentColor">5</text><rect x="212" y="76" width="32" height="38" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="228" y="101" font-size="15" text-anchor="middle" fill="currentColor">i</text><rect x="244" y="46" width="32" height="30" rx="0" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/><text x="260" y="67" font-size="15" text-anchor="middle" fill="currentColor">6</text><rect x="244" y="76" width="32" height="38" rx="0" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="260" y="101" font-size="15" text-anchor="middle" fill="currentColor">−1</text><rect x="276" y="46" width="32" height="30" rx="0" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/><text x="292" y="67" font-size="15" text-anchor="middle" fill="currentColor">7</text><rect x="276" y="76" width="32" height="38" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="292" y="101" font-size="15" text-anchor="middle" fill="currentColor">−i</text><text x="160" y="150" font-size="13" text-anchor="middle" fill="currentColor">黄色の列が、k = 0、2、4、… のところ</text></svg>'
      - (1 + i)²⁰ の実部が求める値だよ。(1 + i)² = 2i を使おう。
    paths:
      - [二項定理で (1 + i)²⁰ = ₂₀C₀ + ₂₀C₁ i + ₂₀C₂ i² + … + ₂₀C₂₀ i²⁰, 実部は ₂₀C₀ − ₂₀C₂ + ₂₀C₄ − … + ₂₀C₂₀, (1 + i)²⁰ = ((1 + i)²)¹⁰ = (2i)¹⁰ = 1024 i¹⁰ = −1024, 求める値は −1024]
      - [₂₀Cₖ の値を並べて直接たす, 1 − 190 + 4845 − 38760 + 125970 − 184756 + 125970 − 38760 + 4845 − 190 + 1, −1024]
    note: 二項係数に + と − をかわるがわる付けた和を、複素数の累乗の実部と読みかえる問題。虚部を見ると ₂₀C₁ − ₂₀C₃ + … = 0 もわかる。直接計算する道もある（1 − 190 + 4845 − …）が、けたが大きく手数が多い。
  - part: 離
    id: "eb71542b9f"
    kinds: [数]
    text: (2 + i)/(3 − 2i) + (2 − i)/(3 + 2i) の値はいくつですか。
    answer: 8/13
    check: "(lambda v: [Fraction(p, 13) for p in range(-60, 61) if abs(v - p / 13) < 1e-9][0])((2 + 1j) / (3 - 2j) + (2 - 1j) / (3 + 2j))"
    hints:
      - 2 つの《分数》を別々に計算してもよいけれど、2 つの数はたがいにどんな関係かな。
      - 1 つめの分数の分母と分子に 3 + 2i をかけよう。分母は 13 になるね。
      - text: 共役な複素数どうしの和は、実部の 2 倍になるよ。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="14" y1="104" x2="295.2" y2="104" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="300,104 292,108.4 292,99.6" fill="currentColor"/><line x1="40" y1="192" x2="40" y2="18.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="40,14 44.4,22 35.6,22" fill="currentColor"/><text x="298" y="122" font-size="13" text-anchor="end" fill="currentColor">実部</text><text x="48" y="26" font-size="13" text-anchor="start" fill="currentColor">虚部</text><line x1="145" y1="34" x2="145" y2="174" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="40" y1="34" x2="145" y2="34" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="40" y1="174" x2="145" y2="174" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="145" cy="34" r="6" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="145" cy="174" r="6" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="157" y="39" font-size="15" text-anchor="start" fill="currentColor">p + qi</text><text x="157" y="179" font-size="15" text-anchor="start" fill="currentColor">p − qi</text><text x="240" y="88" font-size="13" text-anchor="middle" fill="currentColor">たすと虚部が消える</text></svg>'
    paths:
      - [(2 + i)/(3 − 2i) = (2 + i)(3 + 2i)/13 = (4 + 7i)/13, 2 つめはその共役で (4 − 7i)/13, 和は 8/13]
      - [通分すると分母は (3 − 2i)(3 + 2i) = 13, 分子は (2 + i)(3 + 2i) + (2 − i)(3 − 2i) = (4 + 7i) + (4 − 7i) = 8, 8/13]
    note: 分母が 13 の分数の計算が続く。2 つの数が共役になっていることに気づくと、虚部の計算を省ける。
