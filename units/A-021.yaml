# A-021 複素数の計算
#
# 書き方は N-001 の頭の注のとおり。段 5 の決まりは A-019 の頭の注と同じ（思い出す 2・今日 2・挑戦 1、各日に予備 3 問）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 8 問にした。
# 地図に plan がないので、既定の並び（導入、練習、わけ、混ぜる、確認）で作った。
#   1 日目：虚数単位 i（i² = −1）、複素数 a + bi（実部、虚部、純虚数）、負の数の平方根 √(−k) = √k i、和・差・積。
#   2 日目：共役な複素数、わり算（分母と共役な数をかける）、複素数の相等、2 次方程式の虚数解（解の公式）。
#   3 日目：わけ。4 日目：A-017、A-016 と混ぜる（解の種類、解を代入する、i の累乗の和、係数を決める）。5 日目：確認。
# この単元の水準は 2（計算の決まりを当てはめる）。段 5 のわけの深さは ③ なので、わけの 3 問のうち 2 問は ③
#   （共役な数との積は 0 以上の実数、実数係数の 2 次方程式の虚数解は共役）、1 問は水準に合わせて ②（わり算で共役な数をかけるわけを例で書く）にした。
# 前提は A-017（2 次方程式）。たどると A-015（展開）、A-016（平方根、分母の有理化）、A-011、N-027 まで使える。
#   複素数平面、絶対値、極形式は A-034 なので扱わない。解と係数の関係（A-026）も使わない。
#   √(−k) は k が正の数のときだけ決め、√(−9) × √(−4) を √36 としないこと（予備の問題）に触れる。
#   複素数の大小は決めない（「虚数解をもつ」は b² − 4ac が負のこととして A-017 の判定だけで扱う）。
# 複素数の答えは鍵盤で打てないので choices。打つ問題は、実部、虚部、実数になる値、解の個数、整数の係数にした。
#   複素数の check は Python の複素数（2 + 3j）で計算し、選択肢ごとの値と差の絶対値が 1e-9 より小さいものを選ぶ。
#   打つ値は Fraction(…real) で整数や分数の形にし、負の数は「−」にそろえる。解を選ぶ check は、選択肢の 2 つの数を元の式に代入して 0 になるものを選ぶ。
#   i の累乗は、[1, i, −1, −i] の並びを 4 でわった余りで引いて計算する（大きな指数の累乗で誤差を出さないため）。
# 複素数は、極形式と 1 の累乗根（A-034）、交流回路のインピーダンス（E の流れ）、量子力学の波動関数（P の流れ）、信号のフーリエ変換の入口になる（D-026）。
# 図（D-131）：かけ算は左の数と上の数の表にし、実部になるます（実数どうし、i どうし）を青、虚部になるますを赤でぬる。
#   たし算・ひき算は実部と虚部の 2 列の表、わり算は分数の図、i の累乗は 1 → i → −1 → −i の 4 つでひとまわりする図、
#   虚数解の 2 次方程式は x 軸とまじわらないグラフと平方完成の面積図。腕だめしの 2 問目は二項定理（C-016）に x = i を入れる。

