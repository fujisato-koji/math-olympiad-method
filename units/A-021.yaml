# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋, 手数]
    text: 複素数 z が z² − z + 1 = 0 をみたすとき、z¹⁰⁰ + 1/z¹⁰⁰ の値はいくつですか。
    answer: −1
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([k for k in range(-5, 6) for z in [(0.5 + (math.sqrt(3) / 2) * 1j)] if abs(z ** 100 + 1 / z ** 100 - k) < 1e-6][0])"
    hints:
      - z を求めて 100 乗するのは大変だね。z² − z + 1 に何かをかけると、きれいな式にならないかな。
      - (z + 1)(z² − z + 1) を展開してみよう。z³ はいくつになるかな。
      - 100 = 3 × 33 + 1 だね。z + 1/z の値は、元の式を z でわると出てくるよ。
    paths:
      - [(z + 1)(z² − z + 1) = z³ + 1 なので z³ = −1, z¹⁰⁰ = (z³)³³ × z = −z で 1/z¹⁰⁰ = −1/z, z² − z + 1 = 0 を z でわって z + 1/z = 1, z¹⁰⁰ + 1/z¹⁰⁰ = −(z + 1/z) = −1]
    note: 解の公式で z = (1 ± √3 i)/2 を出しても、100 乗は手で計算できない。z³ = −1 という短い式を見つけるのが鍵（A-034 の 1 の累乗根につながる）。z は 0 でないので z でわってよい。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [C-016]
    text: ₂₀C₀ − ₂₀C₂ + ₂₀C₄ − ₂₀C₆ + … − ₂₀C₁₈ + ₂₀C₂₀ の値はいくつですか（符号は + と − が交互に並びます）。
    answer: −1024
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(sum((-1) ** (k // 2) * math.comb(20, k) for k in range(0, 21, 2)))"
    hints:
      - 1 つずつ計算すると大変だね。二項定理（C-016）で (1 + x)²⁰ を展開した式に、どんな x を入れるとこの和が出てくるかな。
      - x = i を入れると、iᵏ は 1、i、−1、−i をくり返すね。偶数番目の項の符号はどうなるかな。
      - (1 + i)²⁰ の実部が求める値だよ。(1 + i)² = 2i を使おう。
    paths:
      - [二項定理で (1 + i)²⁰ = ₂₀C₀ + ₂₀C₁ i + ₂₀C₂ i² + … + ₂₀C₂₀ i²⁰, 実部は ₂₀C₀ − ₂₀C₂ + ₂₀C₄ − … + ₂₀C₂₀, (1 + i)²⁰ = ((1 + i)²)¹⁰ = (2i)¹⁰ = 1024 i¹⁰ = −1024, 求める値は −1024]
    note: 二項係数の交互の和を、複素数の累乗の実部と読みかえる問題。虚部を見ると ₂₀C₁ − ₂₀C₃ + … = 0 もわかる。直接計算する道もある（1 − 190 + 4845 − …）が、桁が大きく手数が多い。
  - part: 離
    kinds: [数]
    text: (2 + i)/(3 − 2i) + (2 − i)/(3 + 2i) の値はいくつですか。
    answer: 8/13
    check: "(lambda v: [Fraction(p, 13) for p in range(-60, 61) if abs(v - p / 13) < 1e-9][0])((2 + 1j) / (3 - 2j) + (2 - 1j) / (3 + 2j))"
    hints:
      - 2 つの《分数》を別々に計算してもよいけれど、2 つの項は互いにどんな関係かな。
      - 1 つめの分数の分母と分子に 3 + 2i をかけよう。分母は 13 になるね。
      - 共役な複素数どうしの和は、実部の 2 倍になるよ。
    paths:
      - [(2 + i)/(3 − 2i) = (2 + i)(3 + 2i)/13 = (4 + 7i)/13, 2 つめはその共役で (4 − 7i)/13, 和は 8/13]
      - [通分すると分母は (3 − 2i)(3 + 2i) = 13, 分子は (2 + i)(3 + 2i) + (2 − i)(3 − 2i) = (4 + 7i) + (4 − 7i) = 8, 8/13]
    note: 分母が 13 の分数の計算が続く。2 つの項が共役になっていることに気づくと、虚部の計算を省ける。
