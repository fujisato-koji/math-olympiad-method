        text: 2 次方程式 x² − 4x + 13 = 0 の解はどれですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="14" y1="160" x2="301.2" y2="160" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="306,160 298,164.4 298,155.6" fill="currentColor"/><line x1="100" y1="190" x2="100" y2="18.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="100,14 104.4,22 95.6,22" fill="currentColor"/><text x="304" y="152" font-size="14" text-anchor="end" fill="currentColor">x</text><text x="92" y="24" font-size="14" text-anchor="end" fill="currentColor">y</text><text x="94" y="176" font-size="13" text-anchor="end" fill="currentColor">O</text><path d="M128 26 Q190 198 252 26 L252 26" fill="#7bc96f" fill-opacity="0.12" stroke="none"/><path d="M128 26 Q190 198 252 26" fill="none" stroke="currentColor" stroke-width="2.5"/><line x1="190" y1="116" x2="190" y2="157" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="198" y="142" font-size="13" text-anchor="start" fill="currentColor">x 軸とまじわらない</text><text x="308" y="186" font-size="14" text-anchor="end" fill="currentColor">y = x² − 4x + 13</text></svg>'
        choices: [x = 2 ± 3i, x = −2 ± 3i, x = 2 ± 3, x = 4 ± 6i]
        answer: x = 2 ± 3i
        check: "[c for c, zs in {'x = 2 ± 3i': (2 + 3j, 2 - 3j), 'x = −2 ± 3i': (-2 + 3j, -2 - 3j), 'x = 2 ± 3': (5, -1), 'x = 4 ± 6i': (4 + 6j, 4 - 6j)}.items() if all(abs(z * z - 4 * z + 13) < 1e-9 for z in zs)][0]"
