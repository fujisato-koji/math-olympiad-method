      - part: わけ
        id: "5e4dc26578"
        text: p、q を実数とし、p² − 4q が負の数とします。このとき、2 次方程式 x² + px + q = 0 の 2 つの解は、たがいに共役な複素数になります。このわけを、すじ道を立てて書きましょう。
        explain: 例：「D = p² − 4q とし、D は負の数とする。解の公式（A-017）から x = (−p ± √D)/2 である。−D は正の数なので、√D = √(−D) i（√(−k) = √k i の決め方）と書ける。よって x = −p/2 ± (√(−D)/2)i となる。ここで m = −p/2、n = √(−D)/2 とおくと、m、n は実数で、2 つの解は m + ni と m − ni である。これはたがいに共役な複素数である。」と書ければよい。①「〜とする」で D を決める、② 解の公式の √D を √(−D) i に書きかえて、実部と虚部に分ける、③ 約束した事実（解の公式、負の数の平方根の決め方、共役の定義）で結ぶ、の 3 つがそろっているかを見る。p、q が実数でなければ m、n が実数とは限らないので、「実数の係数」が要ることに触れる。x² − 4x + 13 = 0 の解 2 ± 3i（2 日目）で確かめさせる。
        hints:
          - D = p² − 4q とおいて、解の公式で解を書きましょう。
          - D が負の数のとき、√D を i を使って書きかえましょう。
          - text: 例の x² − 4x + 13 = 0（2 日目）では、2 つの解は図のように上下に並びました。p、q のままでも、2 つの解を実部と虚部に分けて書きましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="14" y1="104" x2="295.2" y2="104" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="300,104 292,108.4 292,99.6" fill="currentColor"/><line x1="40" y1="192" x2="40" y2="18.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="40,14 44.4,22 35.6,22" fill="currentColor"/><text x="298" y="122" font-size="13" text-anchor="end" fill="currentColor">実部</text><text x="48" y="26" font-size="13" text-anchor="start" fill="currentColor">虚部</text><line x1="84" y1="38" x2="84" y2="170" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="40" y1="38" x2="84" y2="38" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="40" y1="170" x2="84" y2="170" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="90" y="120" font-size="13" text-anchor="start" fill="currentColor">2</text><text x="34" y="43" font-size="13" text-anchor="end" fill="currentColor">3</text><text x="34" y="175" font-size="13" text-anchor="end" fill="currentColor">−3</text><circle cx="84" cy="38" r="6" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><circle cx="84" cy="170" r="6" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="96" y="43" font-size="15" text-anchor="start" fill="currentColor">2 + 3i</text><text x="96" y="175" font-size="15" text-anchor="start" fill="currentColor">2 − 3i</text></svg>'
