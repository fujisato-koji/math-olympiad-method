      - part: わけ
        id: "2d7f0564f0"
        text: (2 + 3i)/(1 + i) を計算するとき、分母と分子に 1 − i をかけます。なぜ 1 − i をかけるのか、この例で計算しながら文で説明しましょう。
        explain: 例：「(1 + i)(1 − i) = 1 − i² = 2 で、分母が実数になる。分母と分子に同じ数 1 − i（0 でない）をかけても、《分数》の値は変わらない。分子は (2 + 3i)(1 − i) = 2 − 2i + 3i − 3i² = 5 + i なので、(2 + 3i)/(1 + i) = (5 + i)/2 = 5/2 + (1/2)i となり、a + bi の形で答えられる。分母に i が残ったままでは、実部と虚部がわからない。」と書ければよい（水準 2 の単元なので、代表の例で文に書く ②）。① 分母と共役な数をかけると分母が実数になる、② 同じ数をかけても値は変わらない、③ 実部と虚部に分けて a + bi の形にできる、の 3 つが言えているかを見る。A-016 の分母の有理化（√ を消す）と同じ考えであることに触れる。答えに 1 + i をかけて 2 + 3i にもどることで確かめさせる。
        hints:
          - text: (1 + i)(1 − i) を表にすると、赤い 2 つのますが消しあいます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="170" y="22" font-size="14" text-anchor="middle" fill="currentColor">(1 + i)(1 − i) の表</text><rect x="40" y="34" width="60" height="32" rx="0" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="70" y="55" font-size="14" text-anchor="middle" fill="currentColor">×</text><rect x="100" y="34" width="100" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="150" y="55" font-size="15" text-anchor="middle" fill="currentColor">1</text><rect x="200" y="34" width="100" height="32" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="250" y="55" font-size="15" text-anchor="middle" fill="currentColor">−i</text><rect x="40" y="66" width="60" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="70" y="93" font-size="15" text-anchor="middle" fill="currentColor">1</text><rect x="100" y="66" width="100" height="44" rx="0" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="150" y="93" font-size="15" text-anchor="middle" fill="currentColor">?</text><rect x="200" y="66" width="100" height="44" rx="0" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="250" y="93" font-size="15" text-anchor="middle" fill="currentColor">−i</text><rect x="40" y="110" width="60" height="44" rx="0" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="70" y="137" font-size="15" text-anchor="middle" fill="currentColor">+i</text><rect x="100" y="110" width="100" height="44" rx="0" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="150" y="137" font-size="15" text-anchor="middle" fill="currentColor">+i</text><rect x="200" y="110" width="100" height="44" rx="0" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text