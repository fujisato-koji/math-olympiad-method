        id: "b50c4d2832"
        text: a + bi と a − bi のように、虚部の + と − だけがちがう 2 つの数を、たがいに共役な複素数といいます。2 つの積は a² + b² で実数になるので、わり算では、分母と共役な数を分母と分子にかけます。b² − 4ac が負の数の 2 次方程式も、i を使うと解（虚数解）が見つかります。
