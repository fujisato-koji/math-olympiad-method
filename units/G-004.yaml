# G-004 折る、映す、回す
#
# 段 1・水準 1・5 日。半分に折ると重なる形、鏡に映した形、回した形（向きを変えても同じか）、G-002 と混ぜる、確かめ。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図は svg（D-129）。色板は角の丸い四角、影は灰色のます、色板のない所はてんせんのます（G-002 と同じ）。紙にぬった模様は、ますの線と色で描く。
# 折る線は太いてんせん。鏡は水色の細い板で、鏡の中はてんせんのわく（？）。動物は正面の顔だけを描き（映しても同じ顔）、向きは矢印で扱う。
# 回す：形がどう見えるかを問うのは「はんぶん まわす（さかさまにする）」だけ。4 日目の影をうめる問題では色板を回してよいが、回す角の大きさは G-015。
# 6 と 9 は数の形として使う（数の大きさは問わない）。
# 前提は G-002 と G-001 なので、数は 1 つずつ数えて答える（たし算は使わない）。答えは 10 まで。
# 地図の plan にわけの日がないので、わけは 2〜4 日目に 1 問ずつ置く。
# check は並びを文字で書いた式（R あか、B あお、Y きいろ、G みどり、W しろ、K かげ、. なし、U 上向きの三角、D 下向きの三角、S 四角、C 丸。
# 動物は i いぬ、n ねこ、u うさぎ、k くま、b ぶた、f かえる、p パンダ）。

id: G-004
