        note: すぐ左の 🟨 や、鏡のそばの 🟦 を写しやすい。折り目から何番目かで対応させる。
      - part: 挑戦
        text: しかくい おりがみを はんぶんに おって、ぴったり かさなる おりかたは いくつ ありますか。
        answer: 4
        hints:
          - たてに おると かさなるかな。よこは どうかな。
          - かどと かどを あわせる おりかたも あるよ。
          - おった せんに しるしを つけて、おりかたを かぞえよう。
        paths:
          - [たてと よこで 2 つ, ななめの 2 つを たす, 4 つ]
          - ["正方形の 対称の 軸は、たて・よこ・ななめ 2 本", "2 + 2 = 4", "4 つ"]
        note: 斜めの折り方を見落として 2 と答えやすい。折り紙で実際に折って、折り目を数える。
