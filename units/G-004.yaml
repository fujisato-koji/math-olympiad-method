# G-004 折る、映す、回す
#
# 書き方は N-001 の頭の注のとおり。形と色板の絵文字は G-001、G-002 と同じ。
# 折る：まん中の線で折って、ぴったり重なるか。模様はマス（🟦⬜ など）で描く。
# 選ぶ問題のボタンには 1 列しか書けないので、選択肢は 1 列の並びにする。
# 映す：「｜」を鏡とする。絵文字そのものの左右の反転は描けないので、鏡に映すと「並びの順が逆になる」で表し、
# 向きは矢印（← →）だけで扱う。向きのある絵文字は使わず、正面を向いた顔（🐶🐱🐰🐻🐼🐨🐷🐵🐸🐯）と色の形を使う。
# 回す：形がどう見えるかを問うのは「はんぶん まわす（さかさまにする）」だけにする。
# 4 日目の影を埋める問題では色板を回して向きを変えてよいが、回す角の大きさ（4 分の 1 回転など）を問うのは G-015。
# 6 と 9 は数の形として使う（数の大きさは問わない）。
# 前提は G-002 と G-001 なので、数は 1 つずつ数えて答える（たし算は使わない）。答えは 10 まで。
# 地図の plan にわけの日がないので、わけは 2〜4 日目に 1 問ずつ置く。
# check：折って重なるは「どの列も逆から読んで同じか」、鏡は「逆から読む」、
# はんぶん回すは「列の順と各列を逆にし、🔺 と 🔻 を入れかえる」式。

id: G-004
days:
  - day: 1
    items:
      - part: 見本
        text: まんなかの たての せんで おると、ぴったり かさなるかな。
        figure: "🟦⬜🟦\n🟦🟦🟦"
        explain: まんなかで おると、ひだりがわが みぎがわに かさなります。どの だんも、ひだりから よんでも みぎから よんでも おなじ ならび なので、ぴったり かさなります。
      - part: 思い出す
        text: ⬜ は いろいたの ない ところ です。いろいたは なんまい ですか。
        figure: "🟨🟨🟨\n🟨🟨⬜"
        answer: 5
        check: "n('🟨')"
        hints:
          - ⬜ は かぞえないよ。
          - うえの ならびから かぞえよう。
          - したの ならびは、うえの つづきの かずから かぞえよう。
        paths:
          - [うえ 1、2、3, した 4、5, 5 まい]
      - part: 思い出す
        text: ⬛ は かげ です。あと なんまいで、かげが ぜんぶ かくれますか。
        figure: "🟥⬛⬛\n🟥🟥⬛"
        answer: 3
        check: "n('⬛')"
        hints:
          - まだ みえる ⬛ を みよう。
          - ⬛ 1 つに いろいた 1 まい だよ。
          - ⬛ だけを ゆびで さして かぞえよう。
        paths:
          - [⬛ を さがす, 1、2、3, 3 まい]
      - part: 今日
        text: まんなかの たての せんで おると、ぴったり かさなる ならびは どれですか。
        choices: [🟥🟦🟥, 🟥🟥🟦, 🟦🟥🟥]
        answer: 🟥🟦🟥
        check: "[c for c in ['🟥🟦🟥', '🟥🟥🟦', '🟦🟥🟥'] if c == c[::-1]][0]"
        hints:
          - おると、ひだりはしと みぎはしが かさなるよ。
          - ひだりはしと みぎはしの いろを くらべよう。
          - ひだりから よんでも みぎから よんでも おなじ ならびを さがそう。
        paths:
          - [はしと はしを くらべる, 🟥 と 🟥 で おなじ, 🟥🟦🟥]
      - part: 今日
        text: この もようを、まんなかの たての せんで おります。ぴったり かさなりますか。
        figure: "🟩⬜⬜🟩\n🟩🟩🟩🟩"
        choices: [かさなる, かさならない]
        answer: かさなる
        check: "'かさなる' if all(r == r[::-1] for r in fig.splitlines()) else 'かさならない'"
        hints:
          - うえの だんを、ひだりからと みぎから よんでみよう。
          - したの だんも おなじように よんでみよう。
          - どの だんも おなじ ならびなら、かさなるよ。
        paths:
          - [うえの だんは おなじ, したの だんも おなじ, かさなる]
      - part: 今日
        text: まんなかの せん（｜）で おって ぴったり かさなるように、❓ に いろを ぬります。❓ は なにいろ ですか。
        figure: 🟥🟨🟦｜🟦🟨❓
