    kinds: [数, 手数]
    text: 80 cm の テープから、27 cm 4 mm と 18 cm 9 mm を きりとりました。のこりの テープは なん mm ですか。
    answer: 337
    check: "80 * 10 - (27 * 10 + 4) - (18 * 10 + 9)"
    hints:
      - cm と mm を べつべつに けいさん しよう。mm が たりない ときは、1 cm を 10 mm に くずそう。
      - きりとった 2 ほんを、さきに あわせても よいよ。
      - さいごに「なん cm なん mm」を「なん mm」に なおそう。1 cm は 10 mm だよ。
