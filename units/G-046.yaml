# G-046 長さ・重さ・かさの単位と測定
#
# 書き方は N-001 の頭の注のとおり。
# G-005 の「マスの いくつぶん」を、だれが測っても同じになる単位に置きかえる。
# 単位：長さ mm・cm・m（1 cm = 10 mm、1 m = 100 cm）、かさ mL・dL・L（1 dL = 100 mL、1 L = 10 dL）、重さ g と kg。
#   前提の数は N-007（100 まで）なので、1000 を使う km（1 km = 1000 m）、1 L = 1000 mL、1 kg = 1000 g の換算は扱わない。
#   kg は「重い物に使う単位」として選ぶ問題にだけ出す。m は 1 m = 100 cm と、100 から引く・100 になるたし算まで。
# 図：ものさし・1 L ます・はかりは svg（D-040）。ものさしの 1 目もりは 1 mm、数字は cm。ますの 1 目もりは 1 dL。はかりの 1 目もりは 2 g。
#   はしが欠けたものさしは、左はしの数字が 0 でない。
# 答えは数で打つ（なん mm、なん cm、なん dL、なん g）。「6 cm 4 mm」のように 2 つの単位を使う答えは選ぶ問題にした。
# かけ算は前提にないので、3 cm を 30 mm にするのは「10 の まとまりが 3 つ」で考える（N-006 の位）。同じ長さを 4 回たすのはよい。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 長さ（mm、cm、m とものさし）　2 日目 かさ（L、dL、mL）と重さ（g、kg）
#   3 日目 わけ（単位をそろえて比べる、同じ単位を使う、欠けたものさし）　4 日目 G-005（まわりの長さ）と N-007 を混ぜる　5 日目 確認
# check：ものさしとはかりは「大きい目もりの数と小さい目もりの数」から読む式、換算と計算はその式。単位の名前を選ぶ問題は約束ごとなので check を付けない。

