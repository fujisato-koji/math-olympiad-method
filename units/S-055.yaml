  - part: 離
    kinds: [道筋]
    text: 1 組は 30 人、2 組は 20 人です。犬をかっている人の割合は、1 組が 40%、2 組が 25% です。1 組と 2 組を合わせた 50 人では、犬をかっている人の割合は何 % ですか。
    answer: 34
    check: "(Fraction(30 * 40, 100) + Fraction(20 * 25, 100)) * 100 / 50"
    hints:
      - 40% と 25% をたして 2 でわってよいかな。2 つの組の人数はちがうね。
      - それぞれの組で、犬をかっている人は何人かな。
      - 合わせた 50 人をもとにする量にして、百分率を求めよう。
    paths:
      - [1 組でかっている人は 30 × 0.4 = 12 人, 2 組では 20 × 0.25 = 5 人, 合わせて 17 人, 17 ÷ 50 = 0.34 で 34%]
    note: 全体の量がちがう割合は、そのままでは合わせられない（3 日目のわけ）ことを計算で使う。40% と 25% の平均の 32.5% と答えやすい。人数にもどしてから合わせるのが要点。
