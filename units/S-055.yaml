        explain: 横に月、縦に気温をとり、はかった気温のところに点をうって、点を順に直線で結んだグラフを、折れ線（おれせん）グラフといいます。縦の 1 目もりは 2 度です。7 月の点は 20 度の線から 3 目もり上なので 26 度です。線が右上がりのところは気温が上がり、右下がりのところは下がっています。8 月から 9 月は、28 度から 24 度へ 4 度下がりました。線のかたむきが急なところほど、変わり方が大きいことを表します。
