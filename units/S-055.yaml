# S-055 折れ線グラフと割合のグラフ（円グラフ、帯グラフ）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く。A-005 にならい、割合、百分率、
#   比べる量、もとにする量、求める、変わる、差は漢字にし、増える・減るも漢字にした（中身が小 4〜5 のため）。
#   グラフの名前（折れ線グラフ、帯グラフ、円グラフ）は、1 日目と 2 日目の見本で読みをそえる。
# 前提は S-027（表と棒グラフ、1 目もりの大きさを先に決める）と A-005（比と割合、百分率）。
#   たどると N-077（小数のかけ算とわり算）、N-078、N-019、N-020 がある。比べる量 = もとにする量 × 割合 と
#   もとにする量 = 比べる量 ÷ 割合 は、小数（200 × 0.25）か、分母を 100 にそろえる形で計算する。
# 前提にないので使わないもの：
#   角度（G-009）：円グラフは、まわりの百分率の目もり（1 目もり 5%）で読む。中心の角（360° × 割合）は扱わない。
#   概数と四捨五入：割合はわり切れる数にして、合計がちょうど 100% になるようにした。
#   負の数（N-010）：気温は 0 度より上だけにする。時刻と時間（N-059）：横の軸は月、週、曜日にし、時刻を読ませない。
#   長さ・重さの単位（G-046）：場面は人数、こ数、さっ数、ひき数と気温にする（気温の「度」は読むだけ）。
#   平均（S-028）：「月の平均気温」とは書かず、「毎月 1 日にはかった気温」にする。
# 扱うもの：折れ線グラフ（点を読む、2 つの点の差、線のかたむきと変わり方、波線で省いた軸、2 本の線）、
#   帯グラフと円グラフ（目もりで百分率を読む、割合から量、量から割合、区切りの線をかく目もり）、
#   全体の量がちがう割合のグラフでは割合だけで量を比べられないこと、表したいことに合うグラフを選ぶこと（棒、折れ線、円と帯）。
#   islp-poster の「グラフを選んで描く」は、選ぶ問題と、かくときに要る計算（百分率、区切りの位置）で受け持つ。
#   画面で線や点をかかせる問題はない。
# 図：グラフと表は svg で描く。答えにあたる数はグラフに書かない。目もりで読めない割合（24% など）は、グラフに
#   書かずに文で示す。折れ線グラフは、読ませる点を目もりの線の上に置いた。
#   2 本の折れ線は、実線と丸い点、点線と四角い点で見分け、上に見分けの印（凡例）を置く。
# check：グラフの数を式に書き直して確かめる。百分率は Fraction(部分 * 100, 全体)、量は Fraction(全体 * 百分率, 100)
#   （わり切れなければ分数になって答えと合わないので、わり切れることも確かめられる）。
#   「増え方がいちばん大きいところ」は、となりの差が最大（減り方は最小）の位置で選ぶ。比は '%d:%d' % (分子, 分母)（A-005 と同じ）。
#   グラフを選ぶ問題は約束ごとなので check を付けない。
# 日の並びは地図の既定（導入・練習・わけ・混ぜる・確認）。ねらいは次のとおりにした。
#   1 日目 導入：折れ線グラフ（点を読む、差、変わり方がいちばん大きいところ、波線で省いた軸）。
#   2 日目 練習：帯グラフと円グラフ（頭に見本 2 つ）。百分率を読む、量を求める、表から百分率、区切りの線の目もり。
#   3 日目 わけ：線のかたむきが変わり方を表すわけ、全体がちがう割合のグラフでは量を比べられないわけ、グラフの選び方のわけ。
#   4 日目 混ぜる：S-027（棒グラフ）、A-005（比、もとにする量）と、1〜3 日目の型を混ぜる。
#   5 日目 確認。

