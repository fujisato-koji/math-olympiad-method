        explain: 例：「2 週目から 3 週目は 20 ぴきから 30 ぴきで 10 ぴき、3 週目から 4 週目は 30 ぴきから 60 ぴきで 30 ぴき増えた。どちらも、横には 1 週間分の 1 目もりだけ進む。その間に線が縦に進む分が、増えた数になる。横に進む分が同じなら、縦に多く進むほど線は急になる。だから、線がいちばん急なところが、いちばん多く増えたところ。」と書ければよい。① 横の 1 目もり（1 週間）はどこも同じ、② 増えた数が線の縦の進み方になる、の 2 点を見る。点の高さだけを比べて「4 週目は数が多いから」と書いていたら、「6 週目は 4 週目より多いのに、5 週目から 6 週目の線がゆるやかなのはなぜか」を聞く。
