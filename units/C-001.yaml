# C-001 もれなく数える
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-001（10 までの数）だけなので、数は 10 まで。合わせる・残りは N-001 の「いくつといくつ」の言い方にし、たし算とひき算の式は使わない。
# 「いくつ多い」（ちがい）は N-003 の中身なので出さない。
# 図のばらばらの並びは、絵文字のあいだを全角の空白（　）であける。✅ は「もう数えた物」のしるし。
# check は n(c) で図の中を数える。並べ直した列を選ぶ問題は、数えた数だけ絵文字を並べた文字列を check で作る。
# 種類の数は、図の行をつないだ文字の集まりの大きさ（len(set(...))）で数える（その図には空白を入れない）。

