# C-001 もれなく数える
#
# 段 1・水準 1・5 日。印をつけて数える（数え落としと二重に数えるのを防ぐ）、並べ直して 5 のまとまりで数える、散らばったものを種類ごとに数える、N-001 と混ぜる、確認。
# 書き方は N-001 の頭の注のとおり。子の画面には text、figure、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# 前提は N-001（10 までの数）だけなので、数は 10 まで。合わせる・残りは N-001 の「いくつといくつ」の言い方にし、たし算とひき算の式は使わない。
# 「いくつ多い」（ちがい）は N-003 の中身なので出さない。
# 図のばらばらの並びは、絵文字のあいだを全角の空白（　）であける。✅ は「もう数えた物」のしるし。
# check は n(c) で図の中を数える。並べ直した列を選ぶ問題は、数えた数だけ絵文字を並べた文字列を check で作る。
# 種類の数は、図の行をつないだ文字の集まりの大きさ（len(set(...))）で数える（その図には空白を入れない）。
# 図（svg）のきまり（D-129）：物は、文字の図と同じ絵文字・同じ並び（行ごとに中よせ）でかく。きいろのふだの 1、2、3 は、しるしをつけたじゅん。
# うすい絵は「いまは数えない物」、うしろの赤いまるは「同じ種類」、赤いやじるしは「数えるむき」。わの並びは svg でかき、check にはその数を書く。
# ヒントの図は、はじめの 2〜3 こにふだをつける・数えない物をうすくする・5 のわくや 10 のまるをとちゅうまでぬる、までにして、数えおえた数はかかない。

