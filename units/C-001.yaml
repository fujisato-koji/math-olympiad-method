  - part: 離
    kinds: [総動員, 読み取り]
    uses: [L-001]
    text: くだものが きまった じゅんばんで 10 こ ならんで います。❓ の ところは かくれて いて みえません。🍌 は ぜんぶで なんこ ありますか。
