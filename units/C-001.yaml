        explain: ばらばらに ある ときは、かぞえた ほしに しるしを つけながら かぞえます。「1」と いって 1 こめに しるし、「2」と いって 2 こめに しるし…。しるしの ない ほしが なくなったら おわりです。とばした ほしも、2 かい かぞえた ほしも ないので、ほしは 6 こです。
