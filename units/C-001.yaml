# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "bc7098a58c"
    kinds: [総動員, 読み取り]
    uses: [L-001]
    text: くだものを 3 こずつ おなじ じゅんばんで くりかえして、10 こ ならべました。❓ の ところは かくれて いて みえません。🍌 は ぜんぶで なんこ ありますか。
    figure: 🍎🍌🍌🍎❓❓❓❓🍌🍎
    answer: 6
    check: "sum(1 for i in range(len(fig)) if '🍎🍌🍌'[i % 3] == '🍌')"
    hints:
      - みえて いる ところから、くりかえしの きまりを みつけよう。
      - text: 🍎🍌🍌 の くりかえしだね。❓ の ところに はいる くだものを、ひだりから じゅんに いって みよう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="25" y="100" font-size="24" text-anchor="middle" dominant-baseline="central">🍎</text><text x="55" y="100" font-size="24" text-anchor="middle" dominant-baseline="central">🍌</text><text x="85" y="100" font-size="24" text-anchor="middle" dominant-baseline="central">🍌</text><text x="115" y="100" font-size="24" text-anchor="middle" dominant-baseline="central">🍎</text><rect x="132" y="82" width="26" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="145" y="100" font-size="18" text-anchor="middle" dominant-baseline="central" opacity="0.5">❓</text><rect x="162" y="82" width="26" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="175" y="100" font-size="18" text-anchor="middle" dominant-baseline="central" opacity="0.5">❓</text><rect x="192" y="82" width="26" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="205" y="100" font-size="18" text-anchor="middle" dominant-baseline="central" opacity="0.5">❓</text><rect x="222" y="82" width="26" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="235" y="100" font-size="18" text-anchor="middle" dominant-baseline="central" opacity="0.5">❓</text><text x="265" y="100" font-size="24" text-anchor="middle" dominant-baseline="central">🍌</text><text x="295" y="100" font-size="24" text-anchor="middle" dominant-baseline="central">🍎</text><path d="M12 121V128H98V121" fill="none" stroke="#f08080" stroke-width="2"/><text x="55" y="150" font-size="13" text-anchor="middle" fill="currentColor">ひとまとまり</text></svg>'
      - かくれて いた 🍌 も わすれずに、はしから じゅんに しるしを つけて かぞえよう。
    paths:
      - [🍎🍌🍌 の くりかえし, ❓ には 🍌🍌🍎🍌 が はいる, 10 この ならびを かいて 🍌 を はしから かぞえる, 6]
      - [🍎 で くぎると 🍎🍌🍌 の まとまりが 3 つと 🍎, 1 つの まとまりに 🍌 が 2 ほん, 2、4、6, "6"]
    note: きまりを見つける（L-001）と、もれなく数えるを合わせる。見えている 🍌 だけを数えて 3 とこたえやすい。かくれたところを絵にかき足してから、しるしをつけて数えさせる。「3 こずつ」がないと、6 こごとのくりかえし（🍎🍌🍌🍎 のあとがなんでもよい）でも見えているところと合い、こたえが 1 つにきまらないので、文に書いた。
