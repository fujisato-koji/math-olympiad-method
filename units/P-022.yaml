        explain: 振動数 f₁、f₂ の波を足すと、sin(2πf₁t) + sin(2πf₂t) = 2 cos(π(f₁ − f₂)t) sin(π(f₁ + f₂)t) となり、へいきんの振動数でふるえながら、音の大きさが 1 秒に |f₁ − f₂| 回、大小をくり返す。うなりの振動数は |f₁ − f₂|。
