        text: 管の中の空気（気柱）も、音の波で共鳴します。ふさがったはしは動けないので節に、開いたはしは腹になります。両はしが開いた管（開管）のきほん振動は、管の長さが半波長。かたほうがふさがった管（へいかん）のきほん振動は、管の長さが波長の 4 分の 1 です。
