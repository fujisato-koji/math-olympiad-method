        text: 600 Hz のスピーカーが止まっています。人が 17 m/s で、スピーカーに近づいていきます。近づく人に聞こえる振動数は「もとの振動数 ×（音の速さ ＋ 人の速さ）÷ 音の速さ」です。音の速さは 340 m/s です。聞こえる音は何 Hz ですか。
