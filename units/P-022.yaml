# P-022 音（音の性質、弦の振動と気柱の共鳴、うなり、ドップラー効果、音速、マッハ円錐）
#
# 水準 3・8 日。扱うこと：音は空気のふるえが伝わる波（音速 v = fλ、気温でかわる）、弦の振動（腹と節、n 倍振動）、気柱の共鳴（開管と閉管、開口端）、うなり、ドップラー効果、マッハ円錐。音源、閉管、開口端、超音速、基本振動。
id: P-022
days:
  - day: 1
    items:
      - part: 見本
        text: 音は空気のふるえが波になって伝わるものです。山から山までの長さが《波長》、1 秒にふるえる回数が《振動数》です。音の速さは「振動数 × 波長」で、空気中ではおよそ 340 m/s です。
