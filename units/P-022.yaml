"currentColor" stroke-width="1.5"/><text x="242" y="89.9" font-size="14" text-anchor="middle" fill="currentColor">588</text><rect x="268" y="70" width="52" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="294" y="89.9" font-size="14" text-anchor="middle" fill="currentColor">756</text><text x="160" y="130" font-size="14" text-anchor="middle" fill="currentColor">げんとへいかんの出せる音の一部（Hz）</text></svg>'
      - げんは 180 の倍数、へいかんは 84 のきすう倍です。最初に両方に出てくる音をさがすには、180 と 84 の最小公倍数を見て、そのうちへいかんの側がきすう倍になるところを選びます。そのあとのくり返しの間かくを考えましょう。
