        explain: 静止したかんそくしゃに向かっておんげんが速さ v_s で近づくと、波長が (V − v_s)/f にちぢみ、f' = fV/(V − v_s)。遠ざかるときは f' = fV/(V + v_s)。かんそくしゃが動く場合は、かんそくしゃに対する波の速さが V ± v_o になるので f' = f(V ± v_o)/V。
