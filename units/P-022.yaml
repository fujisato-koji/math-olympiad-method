  - day: 5
    items:
      - part: 見本
        id: "a3a456b654"
        text: 音を出すもの（おんげん）が動くと、音の高さがかわって聞こえます。これがドップラー効果です。救急車が右へ進むと、前（右）に出た波はつまって波長が短くなり、高い音に聞こえます。後ろ（左）では波が広がって、低い音に聞こえます。
