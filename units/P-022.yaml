    note: S09 ぐうきと余り、S11 約数の構造（180 と 84 の最小公倍数）、S32 周期性、S15 場合分け。種なし。節の位置から n が 3 の倍数に限られる（見方を変える一手）と、閉管はきすう倍だけ、の二つの制限が重なるので、基本の何倍かを数えるだけでは、共通の音が 1 つおきの周期になることを見落とします。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [G-025]
    text: ジェット機が地上から高さ H の所を、水平にまっすぐ、一定の速さ u で飛んでいます。地上の同じ場所に立つ人にとって、ジェット機が真上を通ったときに出された音がとどくのは、通った 5 秒後でした。また、とつぜんのはげしい音（ソニックブーム）が聞こえたのは、真上を通った 3 秒後でした。空気は風がなく、音の速さは 340 m/s で、機は音より速く飛んでいます。ジェット機の速さ u は何 m/s ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="170" x2="300" y2="170" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="100" cy="170" r="6" fill="currentColor"/><text x="100" y="190" font-size="14" text-anchor="middle" fill="currentColor">聞く人</text><ellipse cx="230" cy="40" rx="22" ry="8" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="256" y1="40" x2="290" y2="40" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="300,40 290,45 290,35" fill="currentColor"/><circle cx="100" cy="40" r="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><line x1="100" y1="46" x2="100" y2="164" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/><text x="88" y="110" font-size="14" text-anchor="end" fill="currentColor">H</text><line x1="230" y1="46" x2="100" y2="164" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/><text x="190" y="84" font-size="14" text-anchor="middle" fill="currentColor">3 秒後</text></svg>'
    answer: 425
    check: "min(u for u in range(341, 3000) if (340 * 5) ** 2 * (u * u - 340 ** 2) == 3 ** 2 * 340 ** 2 * u * u)"
    hints:
      - 真上で出した音は、聞く人にまっすぐ下むきに進みます。この 5 秒から、まずジェット機の高さがわかります。つぎに、3 秒後に機がどこにいるかを考えましょう。
      - text: 音が出された点を中心に、音は円（球）に広がります。機が 3 秒進むあいだ、真上で出した音の円は半径 340 × 3 m に広がります。ソニックブームの音の波面は、機の位置から、いくつもの円にそっとふれる直線で作られます。直角三角形が見つかるでしょうか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="60,150 60,40 270,150" fill="#7fc8f8" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><line x1="60" y1="150" x2="270" y2="150" fill="none" stroke="currentColor" stroke-width="2"/><line x1="60" y1="40" x2="60" y2="150" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="50" y="100" font-size="14" text-anchor="end" fill="currentColor">H</text><text x="170" y="172" font-size="14" text-anchor="middle" fill="currentColor">機が 3 秒で進んだ長さ</text><circle cx="60" cy="150" r="45" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><text x="130" y="128" font-size="14" text-anchor="middle" fill="currentColor">音の円</text><circle cx="105" cy="150" r="14" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - 高さ H は 340 × 5 m です。波面の線と機の進む向きのなす角を θ とすると、sin θ は音の速さ ÷ 機の速さです。この θ と H、3 秒間に進んだ長さの 3 つのあいだの関係を、直角三角形で書いてみましょう。
    paths:
      - [真上で出した音が 5 秒でとどくので H = 340 × 5 = 1700 m, ソニックブームの波面と機の進む向きのなす角を θ とすると sin θ = 340 ÷ u, 波面は聞く人の所を通るので、機が真上から進んだ長さ u × 3 と H が直角をはさむ辺で tan θ = H ÷ (3 × u), cos θ = √(u × u − 340 × 340) ÷ u を使い H × √(u × u − 340 × 340) = 3 × 340 × u と式を立てる, 両辺を 2 乗して u × u × (1700 × 1700 − 1020 × 1020) = 1700 × 1700 × 340 × 340, 1700 と 1020 の差から 1360 になり u = 425 m/s]
      - [H = 1700 m は同じ, 機が真上から s 秒の位置にいるときに出した音が聞く人にちょくせつとどく時こく s + √(H × H + u × u × s × s) ÷ 340 を考え、ソニックブームは s をいろいろ動かしたときの最も早い着く時こく, u = 400 と 450 では 3 秒にならないことを s を動かして調べ、u = 425 のとき s = −16 ÷ 3（真上の 16/3 秒前）で √(1700 × 1700 + 425 × 425 × 16 × 16 ÷ 9) ÷ 340 = 25 ÷ 3 、−16/3 + 25/3 = 3 秒に合う, 答えは 425 m/s]
    note: S25 三角比（sin θ = 音の速さ ÷ 機の速さ）、S23 相似、S07 最初に着く音を考える（波面は円のふくろ）。種なし。高さを真上の音から先に決める必要があり、ソニックブームの波面を円の包みとして図にできないと式が立ちません。
