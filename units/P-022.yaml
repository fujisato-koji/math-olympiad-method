    answer: 8
    check: "len([f for f in range(20, 20001) if f % 180 == 0 and f % 84 == 0 and (f // 84) % 2 == 1])"
    hints:
      - 指でおさえた点が節になるには、げんの長さの何分の何が節と節のあいだの長さの整数倍になればよいでしょう。まずげんの出せる音を、きほんの音の何倍と書いてみましょう。
      - text: げんのきほん振動は 60 Hz です。おさえた点が節になれるのは、n 倍振動の n がある数の倍のときだけです。へいかんのきほん振動は 84 Hz で、へいかんはきすう倍の音しか出せません。二つの表を作って、ならべてくらべましょう。
