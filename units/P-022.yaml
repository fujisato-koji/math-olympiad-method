        explain: 開管は両はしが腹なので λ = 2L/n、f = nv/(2L)（n = 1, 2, 3, …）。へいかんはとじたはしが節・かいこうたんが腹なので、L = (2m − 1)λ/4、f = (2m − 1)v/(4L)（きすう倍だけ）。かいこうたんの先で腹の位置が少し外にずれる分は、ここでは考えない。
