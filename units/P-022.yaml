ri:
  - part: 離
    id: "72027b6b56"
    kinds: [数]
    text: まっすぐな道に、聞く人が止まって立っています。そこから先の道の行き止まりに、かたいかべがあります。聞く人とかべのあいだを、おんげんがかべにむかって一定の速さ u m/s で進んでいます。おんげんは 399 Hz の音を出しつづけています。聞く人には、おんげんからちょくせつとどく音と、かべではね返ってとどく音が同時に聞こえ、うなりが 1 秒に 40 回ありました。音の速さを 340 m/s として、u は何 m/s ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="272" y="30" width="16" height="140" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="280" y="190" font-size="14" text-anchor="middle" fill="currentColor">かべ</text><circle cx="40" cy="110" r="6" fill="currentColor"/><text x="40" y="140" font-size="14" text-anchor="middle" fill="currentColor">聞く人</text><circle cx="140" cy="110" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="140" y="84" font-size="14" text-anchor="middle" fill="currentColor">おんげん</text><line x1="156" y1="110" x2="222" y2="110" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="232,110 222,115 222,105" fill="currentColor"/><text x="196" y="134" font-size="14" text-anchor="middle" fill="currentColor">速さ u</text><rect x="213" y="77" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="226" y="95" font-size="16" text-anchor="middle" fill="currentColor">？</text></svg>'
    answer: 17
    check: "min(u for u in range(1, 340) if Fraction(399 * 340, 340 - u) - Fraction(399 * 340, 340 + u) == 40)"
    hints:
      - 聞く人にちょくせつとどく音では、おんげんは聞く人から遠ざかっています。はね返ってきた音は、どこにいるおんげんから来たように聞こえるでしょう。かべを鏡と見てみましょう。
      - text: かべのむこうに、おんげんの鏡のうつりがあると考えます。うつりは、本物とは反対にかべへ近づくので、聞く人から見ると、そのうつりが速さ u で近づいてきます。二つの音の振動数を、遠ざかるおんげんと近づくおんげんのドップラー効果の式で書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="196" y="30" width="12" height="140" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="202" y="190" font-size="14" text-anchor="middle" fill="currentColor">かべ</text><circle cx="30" cy="110" r="6" fill="currentColor"/><text x="30" y="140" font-size="14" text-anchor="middle" fill="currentColor">聞く人</text><circle cx="100" cy="110" r="9" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="112" y1="110" x2="150" y2="110" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="160,110 150,115 150,105" fill="currentColor"/><circle cx="304" cy="110" r="9" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><line x1="292" y1="110" x2="254" y2="110" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="4 3"/><polygon points="244,110 254,105 254,115" fill="currentColor"/><text x="304" y="84" font-size="14" text-anchor="middle" fill="currentColor">うつり</text><text x="100" y="84" font-size="14" text-anchor="middle" fill="currentColor">本物</text></svg>'
      - ちょくせつとどく音の振動数を f、はね返ってきた音の振動数を g とすると、g − f = 40 です。f と g それぞれが 399 と 340 と u でどう書けるかを見て、1 ÷ f と 1 ÷ g の和か差が、u を消した形になるところをさがしましょう。
    paths:
      - [かべを鏡と見ると、はね返った音は、うつりのおんげんが速さ u で聞く人に近づきながら出した音と同じ, ちょくせつの音の振動数は 399 × 340 ÷ (340 + u)、はね返った音は 399 × 340 ÷ (340 − u), 差が 40 なので 399 × 340 × 2 × u ÷ (340 × 340 − u × u) = 40, 整理して u × u + 6783 × u − 115600 = 0, u = 17 が合う（17 × 17 = 289 と 6783 × 17 = 115311 の和が 115600）, 答えは 17 m/s]
      - [ちょくせつの音の振動数を f、はね返った音を g とすると、1 ÷ f と 1 ÷ g の和は (340 + u) ÷ (399 × 340) + (340 − u) ÷ (399 × 340) = 2 ÷ 399 で、u が消える, g = f + 40 を入れると f × f − 359 × f − 7980 = 0, f = 380（380 × 380 = 144400 で 359 × 380 = 136420 、差 7980）, 399 × 340 ÷ 380 = 357 = 340 + u, 答えは 17 m/s]
    note: S03 対称性（かべを鏡と見て、はね返りを音源のうつりに言いかえる、S04）、S19 置きかえ。種なし。ドップラー効果の二つの式とうなりをつなぐので、式を当てるだけでは u が出ません。u を式から取り出すのに二次式をとくか 1 ÷ f の和が一定になる性質に気づく必要があり、ここがむずかしい。
  - part: 離
    id: "7914d7e7d6"
    kinds: [数, 道筋]
    text: 長さ 0.5 m のげんの両はしを固定し、げんを伝わる波の速さは 60 m/s です。げんのはしから 1/6 m の所を指で軽くおさえたまま、げんをはじきます。このときげんは、おさえた点が節になる振動のうち、いろいろな高さの音を出します。いっぽう、長さ 1.0 m のへいかん（かたほうがとじた管）があり、音の速さは 336 m/s です。人に聞こえるのは 20 Hz から 20000 Hz までとします。げんの出す音とへいかんが共鳴できる音とで、同じ振動数になるものは、聞こえるはんいに何こありますか。管の口の外のずれは考えません。
