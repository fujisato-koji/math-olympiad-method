        answer: げんと開管
        check: "'げんと開管'"
        explain: げんは両はしが節、開管は両はしが腹で、どちらもきほん振動の波長は 2L（半波長が L）。へいかんは一方のはしが節・もう一方が腹で、きほん振動の波長は 4L（4 分の 1 波長が L）。同じ速さなら、波長が同じものは振動数も同じ。f = v/(2L) = 200 Hz（げん・開管）、f = v/(4L) = 100 Hz（へいかん）。「はしの形（節か腹か）」で見わけるのが要点。
        hints:
          - どれもきほん振動のとき、波長が管やげんの長さの何倍になっているかをくらべよう。
          - text: 長さが同じなので、図の波が、長さの中にどれだけ入っているかを見くらべよう。
