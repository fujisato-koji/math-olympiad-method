        explain: 音は空気のこみぐあい（空気がこんでいるところとすいているところ）が波として伝わる波である。1 秒に f 回ふるえ、1 回で波が λ 進むので、音の速さは v = fλ になる。空気中の音速は約 340 m/s（15 ℃ 付近）。
