# N-009 大きな数と位
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-007 まで。N-006 の「十の位と一の位」を百の位へ広げ、1000（100 が 10 こ）までを扱う。
# 図の 💯 は 100、🔟 は 10、🔵 は 1。check は n('💯') * 100 + n('🔟') * 10 + n('🔵')。
# 数の線は N-002 と同じく「─」で目もりを区切る。10 とび・100 とびの線は、左はしの数 + とびの大きさ × □の位置。
# 段 2 の鍵盤は 3 けたまで（D-039）なので、1000 を答える問題は選ぶ問題にした。4 けた（千の位）と万の位は扱わない。
# 3 日目のわけは ①〜②：305 と 35 のちがい（0 は空いた位のしるし）、上の位から比べるわけ、999 + 1 のくり上がり。

