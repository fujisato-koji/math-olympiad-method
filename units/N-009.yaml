# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 1 から 200 までの かずを、ぜんぶ じゅんに かきます。すうじの 0 は、なんかい かきますか。
    answer: 31
    check: "sum(f'{k}'.count('0') for k in range(1, 201))"
    hints:
      - 1 から 99 まで、100 から 199 まで、200、と わけて かぞえよう。
      - 100 から 199 までは、じゅうの くらいの 0 と、いちの くらいの 0 を べつべつに かぞえよう。
      - 100 と 200 には、すうじの 0 が いくつ あるかな。
    paths:
      - [1 から 99 は 10、20、……、90 の 9 かい, 100 から 199 は いちの くらいの 0 が 10 かい、じゅうの くらいの 0 が 10 かい, 200 は 2 かい, 9 と 20 と 2 を あわせる, 31 かい]
    note: 位ごと・区間ごとに分けて数える。100 と 200 の 0 を 1 回と数える、1 から 99 までを 10 回と数える（100 を入れてしまう）、などの誤りが多い。N-006 の腕だめし（7 を何回書くか）を 3 けたへ広げ、0 は空いた位のしるし（3 日目のわけ）であることを使う。
  - part: 離
    kinds: [総動員]
    uses: [C-003]
    text: 0、3、5、8 の カードが 1 まいずつ あります。3 まいを ならべて、3 けたの かずを つくります。500 より おおきい かずは、なんこ できますか。
    figure: "［0］［3］［5］［8］"
    answer: 12
    check: "len([1 for a, b, c in itertools.permutations([0, 3, 5, 8], 3) if 100 * a + 10 * b + c > 500])"
    hints:
      - ひゃくの くらいに なにを おけば、500 より おおきく なるかな。
      - ひゃくの くらいを 5 に した ときの じゅけいずを かこう。
      - ひゃくの くらいが 8 の ときも、じゅけいずを かいて くらべよう。
    paths:
      - [ひゃくの くらいは 5 か 8, 5 の とき 503、508、530、538、580、583 の 6 こ, 8 の とき 803、805、830、835、850、853 の 6 こ, 6 こと 6 こ で 12 こ]
    note: 百の位で大きさが決まること（N-009）と、樹形図（C-003）で抜けなく数えることを合わせる。百の位が 5 のとき 500 そのものはできないので、どれも 500 より大きい。百の位に 0 を置けないこと、3 を百の位にすると 500 より小さいことを確かめる。
  - part: 離
    kinds: [数, 手数, 読み取り]
    text: 💯 が 4 こ、🔟 が 17 こ、🔵 が 35 こ あります。ぜんぶで いくつですか。
    answer: 605
    check: "4 * 100 + 17 * 10 + 35"
    hints:
      - 🔟 が 10 こ あつまると、💯 1 こと おなじだね。
      - 🔵 が 10 こ あつまると、🔟 1 こと おなじだね。
      - 🔵 を 🔟 に、🔟 を 💯 に まとめてから、それぞれの くらいの すうじを きめよう。
    paths:
