      - part: わけ
        id: "0777469b27"
        text: 微積分の基本定理 F′(x) = f(x) が成り立つわけを説明しましょう。
        explain: 「F(x) は a から x までの面積。x を Δx だけ動かすと、面積は f(x)Δx ほどふえる。だから差の割合 (F(x + Δx) − F(x))/Δx は f(x) に近づく。よって F′(x) = f(x)。」と書ければよい。① 面積のふえ方、② 差の割合、③ 極限で f(x)。子どもには、帯の図で、帯が高さ f(x) の長方形とほとんど同じことを確かめさせます。
        hints:
          - F(x) は、a から x までのグラフの下の面積です。
          - text: x を Δx だけ動かしたときの面積のふえ方 F(x + Δx) − F(x) は、図の赤い帯の面積です。帯は、点線の長方形とほとんど同じです。
