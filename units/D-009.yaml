      - part: わけ
        id: "61a7266600"
        text: 定積分がリーマン和の極限で定義されるわけを説明しましょう。
        explain: 「区間を細かく分けて長方形を並べると、その面積の和はグラフの下の面積に近づく。分割を細かくするほど、長方形とグラフのずれが小さくなる。だから、和の極限を面積（定積分）と定義する。」と書ければよい。① 長方形の和、② 細かくするとずれが小さい、③ 極限が面積。子どもには、x² の図で、赤いずれが細かくするほど小さくなることを確かめさせます。
        hints:
          - 長方形を並べると、グラフの下の面積に近い値になります。
          - text: 分け方を細かくすると、長方形とグラフのずれ（赤い部分）はどうなりますか。
