    items:
      - part: 見本
        id: "0bddd5566a"
        text: |-
          微積分の基本定理：
          ① F(x) = ∫(a→x) f(t) dt（a から x までの面積）とおくと、F′(x) = f(x)。
          ② f の原始関数 F（微分すると f になる関数）を使うと、∫(a→b) f(x) dx = F(b) − F(a)。
          x を Δx だけ右へ動かすと、面積は図の赤い帯の分だけふえます。帯はほぼ高さ f(x) の長方形なので、ふえ方の割合は f(x) です。微分と積分は、たがいに逆の操作です。
