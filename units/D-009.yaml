ld">n を大きくすると、曲線の下の面積に近づく</text></svg>'
        explain: 【定義】[a, b] を n 個の小さな区間に分け、i 番目の区間のはばを Δx、その中の点 xᵢ での値を f(xᵢ) とすると、長方形の面積の和は Σ f(xᵢ)Δx です。分け方を細かくするほど、長方形とグラフのずれが小さくなり、和はグラフの下の面積に近づきます。例：f(x) = x²、[0, 1] を 4 等分して右はしの値を使うと、Δx = 1/4、和は (1/16 + 4/16 + 9/16 + 16/16) × 1/4 = 15/32 です（図の左）。グラフが x 軸より下にあるところでは f(xᵢ) が負なので、その部分の面積は − をつけて足されます。だから定積分は「符号付きの面積」です。
        note: リーマン和は Σf(xᵢ)Δx。細かくした極限が定積分。定積分は符号付きの面積。
