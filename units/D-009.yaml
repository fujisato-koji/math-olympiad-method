        text: |-
          定積分の性質：
          ・線形性：∫(a→b) (αf + βg) dx = α∫(a→b) f dx + β∫(a→b) g dx。
          ・区間を分ける：∫(a→b) f dx = ∫(a→c) f dx + ∫(c→b) f dx（図の左。A + B）。
          ・向き：∫(b→a) f dx = −∫(a→b) f dx（図の右。b から a へ進むと、はば Δx が負になる）。
          ・同じはし：∫(a→a) f dx = 0。
