        id: "c00b66f6a4"
        text: |-
          置換積分と部分積分は、微分の公式を逆に使って積分する方法です（D-006 のふり返り）。
          置換積分：u = g(x) とおくと ∫ f(g(x))g′(x) dx = ∫ f(u) du。定積分では、はしも x の値から u の値に移します（図の左）。
          部分積分：∫ uv′ dx = uv − ∫ u′v dx。微分すると簡単になるものを u に、積分しやすいものを v′ にして、表にします（図の右）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="84" y="18" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">置換積分：はしを移す</text><line x1="30" y1="56" x2="144" y2="56" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="30" y1="126" x2="144" y2="126" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="60" font-size="14" text-anchor="middle" fill="currentColor" font-style="italic">x</text><text x="16" y="130" font-size="14" text-anchor="middle" fill="currentColor" font-style="italic">u</text><line x1="40" y1="52" x2="40" y2="60" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="40" y="46" font-size="13" text-anchor="middle" fill="currentColor">0</text><line x1="40" y1="122" x2="40" y2="130" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="40" y="145" font-size="13" text-anchor="middle" fill="#2f7fc1" font-weight="bold">0</text><polygon points="40,118 36.5,111 43.5,111" fill="#c98512" stroke="none"/><line x1="40" y1="63" x2="40" y2="111" stroke="#c98512" stroke-width="1.8" stroke-linecap="round"/><line x1="85" y1="52" x2="85" y2="60" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="85" y="46" font-size="13" text-anchor="middle" fill="currentColor">1</text><line x1="64" y1="122" x2="64" y2="130" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="64" y="145" font-size="13" text-anchor="middle" fill="#2f7fc1" font-weight="bold">1</text><polygon points="64,118 63.2,110.2 69.8,112.7" fill="#c98512" stroke="none"/><line x1="85" y1="63" x2="66.5" y2="111.5" stroke="#c98512" stroke-width="1.8" stroke-linecap="round"/><line x1="130" y1="52" x2="130" y2="60" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="130" y="46" font-size="13" text-anchor="middle" fill="currentColor">2</text><line x1="136" y1="122" x2="136" y2="130" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="136" y="145" font-size="13" text-anchor="middle" fill="#2f7fc1" font-weight="bold">4</text><polygon points="136,118 131.8,111.4 138.7,110.7" fill="#c98512" stroke="none"/><line x1="130" y1="63" x2="135.2" y2="111" stroke="#c98512" stroke-width="1.8" stroke-linecap="round"/><rect x="78" y="78" width="42" height="24" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="99" y="94.3" font-size="12" text-anchor="middle" fill="currentColor">u = x²</text><text x="84" y="170" font-size="12" text-anchor="middle" fill="currentColor">例：u = x² のとき</text><text x="84" y="188" font-size="12" text-anchor="middle" fill="#2f7fc1" font-weight="bold">x：0 → 2 は u：0 → 4</text><line x1="153" y1="10" x2="153" y2="192" stroke="#c8ccd6" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="238" y="18" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">部分積分：表にする</text><rect x="160" y="40" width="80" height="30" rx="8" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="200" y="59.7" font-size="13" text-anchor="middle" fill="currentColor">u = x</text><polygon points="256,55 250,58 250,52" fill="#c98512" stroke="none"/><line x1="242" y1="55" x2="250" y2="55" stroke="#c98512" stroke-width="1.8" stroke-linecap="round"/><text x="249" y="37" font-size="11" text-anchor="middle" fill="#c98512" font-weight="bold">微分</text><rect x="258" y="40" width="58" height="30" rx="8" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="287" y="59.3" font-size="12" text-anchor="middle" fill="currentColor">u&#39; = 1</text><rect x="160" y="92" width="80" height="30" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="200" y="111.7" font-size="13" text-anchor="middle" fill="currentColor">v&#39; = cos x</text><polygon points="256,107 250,110 250,104" fill="#c98512" stroke="none"/><line x1="242" y1="107" x2="250" y2="107" stroke="#c98512" stroke-width="1.8" stroke-linecap="round"/><text x="249" y="89" font-size="11" text-anchor="middle" fill="#c98512" font-weight="bold">積分</text><rect x="258" y="92" width="58" height="30" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="287" y="111.3" font-size="12" text-anchor="middle" fill="currentColor">v = sin x</text><text x="238" y="152" font-size="13" text-anchor="middle" fill="currentColor">∫ x cos x dx</text><text x="238" y="172" font-size="13" text-anchor="middle" fill="#2f7fc1" font-weight="bold">= x sin x − ∫ sin x dx</text></svg>'
        explain: 置換積分は、合成関数の微分 (F(g(x)))′ = f(g(x))g′(x) を逆に読んだものです。例：∫(0→2) 2x(x²)² dx は、u = x² とおくと du = 2x dx、はしは x = 0 → u = 0、x = 2 → u = 4（図の左）なので、∫(0→4) u² du = 64/3 です。部分積分は、積の微分 (uv)′ = u′v + uv′ を積分して uv = ∫u′v dx + ∫uv′ dx とし、移したものです。例：∫ x cos x dx は u = x、v′ = cos x とおくと u′ = 1、v = sin x なので、x sin x − ∫ sin x dx = x sin x + cos x + C です（図の右）。
        note: 置換積分は u = g(x) とはしの移しかえ、部分積分は ∫uv′ = uv − ∫u′v。
