      - part: わけ
        id: "bb822562b8"
        text: 広義積分を極限で定義するわけを説明しましょう。
        explain: 「無限に続く区間や、はしで無限大になる関数は、そのままではふつうの積分（リーマン和）にならない。有限の b まで、または ε だけ内側までの積分を考え、b → ∞ や ε → 0 の極限をとれば、面積が有限か無限かを決められる。だから極限で定義する。」と書ければよい。① そのままでは積分できない、② 有限の所まで積分、③ 極限で決める。子どもには、1/x² の図で、b を右へ動かしたときの面積の変わり方を確かめさせます。
        hints:
