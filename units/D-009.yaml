vg>'
        explain: 定積分はリーマン和の極限なので、和のきまりがそのまま使えます。Σ(αf(xᵢ) + βg(xᵢ))Δx = αΣf(xᵢ)Δx + βΣg(xᵢ)Δx なので線形性が成り立ちます。[a, b] を c で分ければ、長方形も c の左と右に分けて足せます。b から a へ向かって分けると、はば Δx が負になるので、和の符号が反対になります。同じはしなら、はばが 0 なので 0 です。
        note: 線形性、区間を分ける、向きを逆にすると符号が反対、同じはしは 0。
