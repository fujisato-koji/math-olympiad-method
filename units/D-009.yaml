        explain: 広義積分は「有限の所まで積分してから、極限をとる」ものです。∫(1→b) 1/x³ dx = [−1/(2x²)](1→b) = 1/2 − 1/(2b²) は、b → ∞ で 1/2 に近づきます（図の表）。遠くで関数が速く小さくなれば面積は有限になり、小さくなり方がおそいと、面積はいくらでも大きくなります。0 < x ≦ 1 のように、はしで関数が限りなく大きくなるときも、∫(ε→1) を計算して ε → 0 とすれば、有限の値になることがあります。
        note: 広義積分は極限で定義する。収束と発散。
