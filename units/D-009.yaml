        explain: 基本定理①は「面積のふえる速さは、その場所の高さ」という定理です。F(x + Δx) − F(x) は、はば Δx の細い帯の面積で、ほぼ f(x)Δx です。Δx でわって Δx → 0 とすると、F′(x) = f(x) になります（f が連続のとき）。②は①から出ます。f の原始関数どうしは定数の差しかないので、∫(a→x) f(t) dt = F(x) − F(a)。x = b とおくと ∫(a→b) f(x) dx = F(b) − F(a) です。原始関数がわかれば、はしの値の差で定積分が計算できます。
        note: F′ = f。∫(a→b) f = F(b) − F(a)。微分と積分は逆。
