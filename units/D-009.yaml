# D-009 リーマン積分と微積分の基本定理、広義積分
#
# 段 6・水準 3・8 日。前提は D-006（微分係数と導関数）。
# リーマン和と定積分、定積分の性質、微積分の基本定理、置換積分と部分積分、広義積分を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: D-009
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          リーマン和：区間 [a, b] を n 個に分け、各小区間で f(x) の値を 1 つ選び、幅をかけて足します。
          Σ f(xᵢ) Δx。
          n を大きくして、どの選び方でも同じ値に近づくとき、その値を定積分 ∫(a→b) f(x) dx といいます。
          定積分は、グラフと x 軸の間の符号付きの面積です。
        explain: |-
          区間を細かく分けるほど、リーマン和は面積に近づきます。
          例：f(x)=x²、[0,1] を 2 等分し、右端の値を使うと、Δx=1/2、和は (1/4+1)×1/2 = 5/8。
          分割を細かくすると、この和は 1/3 に近づきます。
        note: リーマン和は Σf(xᵢ)Δx。細かくすると定積分。定積分は符号付き面積。
      - part: 今日
        text: f(x) = x² を [0, 1] で 2 等分し、右端の値でリーマン和を作るといくつですか。
        choices: ["1/8", "3/8", "5/8", "1"]
        answer: "5/8"
        check: "Fraction(5, 8)"
        hints:
          - 区間を 2 等分すると、幅は 1/2 です。
          - 右端は x=1/2 と x=1 です。
          - f(1/2) と f(1) に幅をかけて足します。
        paths:
          - [Δx=1/2, 右端 1/2、1, f の値を足して幅をかける]
      - part: 今日
        text: 定積分は、グラフと x 軸の間の何を表しますか。
        choices: ["符号付きの面積", "傾き", "長さ", "体積"]
        answer: "符号付きの面積"
        check: "'符号付きの面積'"
        hints:
          - x 軸より上が正、下が負です。
          - 面積に符号をつけたものです。
          - 面積に符号をつけることを思い出しましょう。
        paths:
          - [上が正、下が負, 面積に符号, 符号付き面積]
      - part: 挑戦
        text: 分割を細かくすると、リーマン和は何に近づきますか。
        choices: ["定積分", "微分", "傾き", "0"]
        answer: "定積分"
        check: "'定積分'"
        hints:
          - 幅 Δx を小さくしていきます。
          - 和が面積に近づきます。
          - その極限が定積分です。
        paths:
          - [Δx を小さく, 和が面積に近づく, 定積分]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          定積分の性質：
          ・線形性：∫(αf + βg) = α∫f + β∫g。
          ・区間の分解：∫(a→b) f = ∫(a→c) f + ∫(c→b) f。
          ・向き：∫(a→b) f = −∫(b→a) f。
          ・同じ端：∫(a→a) f = 0。
          ・面積との関係：f ≧ 0 なら ∫(a→b) f は面積。
        explain: |-
          積分は和の極限なので、和の性質がそのまま使えます。
          区間を分けて足せます。向きを逆にすると符号が変わります。
          同じ所から同じ所までの積分は 0 です。
        note: 線形性、区間の分解、向き、同じ端は 0。
      - part: 今日
        text: ∫(a→b) (2f + 3g) dx はどれですか。
        choices: ["2∫f + 3∫g", "5∫f", "2∫f − 3∫g", "∫f × ∫g"]
        answer: "2∫f + 3∫g"
        check: "'2∫f + 3∫g'"
        hints:
          - 定積分は線形です。
          - 定数は外に出せます。
          - 和は積分の和になります。
        paths:
          - [線形性, 定数を外へ, 和に分ける]
      - part: 今日
        text: ∫(a→b) f dx と ∫(b→a) f dx の関係はどれですか。
        choices: ["等しい", "符号が反対", "2 倍", "0"]
        answer: "符号が反対"
        check: "'符号が反対'"
        hints:
          - 積分の向きを逆にします。
          - 幅 Δx の符号が変わります。
          - 積分の向きを逆にしたときの幅の符号を考えましょう。
        paths:
          - [向きを逆, Δx の符号, 符号が反対]
      - part: 挑戦
        text: ∫(0→2) f dx を区間を分けて書くとどれですか。
        choices: ["∫(0→1) f + ∫(1→2) f", "∫(0→1) f − ∫(1→2) f", "∫(1→2) f − ∫(0→1) f", "2∫(0→1) f"]
        answer: "∫(0→1) f + ∫(1→2) f"
        check: "'∫(0→1) f + ∫(1→2) f'"
        hints:
          - 区間 [0,2] を [0,1] と [1,2] に分けます。
          - 面積を足します。
          - 2 つの積分の和です。
        paths:
          - [区間を分ける, 面積を足す, 和]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          微積分の基本定理：
          ① F(x) = ∫(a→x) f(t) dt とおくと、F'(x) = f(x)。
          ② f の原始関数 F を使うと、∫(a→b) f(x) dx = F(b) − F(a)。
          微分と積分は、互いに逆の操作です。
          F は、微分すると f になる関数です。
        explain: |-
          基本定理は「面積の変化率は、もとの関数の値」という定理です。
          x を少し動かすと、面積は f(x) の高さの分だけ増えます。
          原始関数が分かれば、端の値の差で定積分が計算できます。
        note: F'=f。∫(a→b) f = F(b)−F(a)。微分と積分は逆。
      - part: 今日
        text: ∫(0→1) x dx はいくつですか。
        choices: ["1/4", "1/2", "1", "2"]
        answer: "1/2"
        check: "Fraction(1, 2)"
        hints:
          - x の原始関数を求めます。
          - 端の値の差をとります。
          - 面積が三角形になることでも確かめられます。
        paths:
          - [原始関数, 端の値の差, 三角形の面積]
      - part: 今日
        text: ∫(0→2) x² dx はいくつですか。
        choices: ["4/3", "8/3", "4", "8"]
        answer: "8/3"
        check: "Fraction(8, 3)"
        hints:
          - x² の原始関数を求めます。
          - 端の値の差をとります。
          - 分数になります。
        paths:
          - [原始関数 x³/3, 端の値の差, 分数]
      - part: 挑戦
        text: d/dx ∫(0→x) f(t) dt はどれですか。
        choices: ["f(x)", "F(x)", "f'(x)", "0"]
        answer: "f(x)"
        check: "'f(x)'"
        hints:
          - 基本定理の ① です。
          - 面積を x で微分します。
          - もとの関数の値になります。
        paths:
          - [基本定理 ①, 面積の変化率, f(x)]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          置換積分：∫f(g(x)) g'(x) dx = ∫f(u) du（u = g(x)）。
          部分積分：∫u v' dx = u v − ∫u' v dx。
          置換積分は、合成関数の微分の逆。部分積分は、積の微分の逆です。
          定積分では、置換したら端も変えます。
        explain: |-
          置換積分は、内側の関数とその微分がそろっているときに使います。
          部分積分は、多項式 × 指数関数、多項式 × 三角関数などで使います。
          例：∫(0→1) 2x(x²+1) dx は u=x²+1 とおくと、du=2x dx、端は 1 から 2。
        note: 置換積分は u=g(x)、部分積分は ∫uv' = uv − ∫u'v。
      - part: 今日
        text: ∫(0→1) 2x(x²+1) dx はいくつですか。
        choices: ["1", "3/2", "2", "5/2"]
        answer: "3/2"
        check: "Fraction(3, 2)"
        hints:
          - u = x²+1 とおきます。
          - du = 2x dx です。
          - 端を x から u に変えて積分します。
        paths:
          - [u=x²+1, du=2x dx, 端を変える, 積分]
      - part: 今日
        text: ∫(0→1) x e^x dx はいくつですか。
        choices: [1, "e", "e−1", "e+1"]
        answer: 1
        check: "1"
        hints:
          - 部分積分を使います。
          - u=x、v'=e^x とおきます。
          - 端の値の差をとります。
        paths:
          - [部分積分, u=x、v'=e^x, 端の値]
      - part: 挑戦
        text: 部分積分の公式はどれですか。
        choices: ["∫uv' = uv − ∫u'v", "∫uv' = uv + ∫u'v", "∫uv = u'v'", "∫uv' = u'v"]
        answer: "∫uv' = uv − ∫u'v"
        check: "\"∫uv' = uv − ∫u'v\""
        hints:
          - 積の微分 (uv)' = u'v + uv' を積分します。
          - uv' を移項します。
          - 符号に注意します。
        paths:
          - [(uv)'=u'v+uv', 積分, 移項]
    extra: []

  - day: 5
    items:
      - part: 見本
        text: |-
          広義積分：積分区間が無限に続く、または端点で関数が無限大になるときの積分です。
          極限で定義します。∫(a→∞) f(x) dx = lim(b→∞) ∫(a→b) f(x) dx。
          例：∫(1→∞) 1/x² dx は 1 に収束。∫(1→∞) 1/x dx は発散。
          端点で無限大のときも、lim(ε→0) で定義します。
        explain: |-
          広義積分は「限界まで積分して、その極限をとる」ものです。
          1/x² は遠くで急に小さくなるので、面積は有限。1/x は小さくなり方が遅く、面積は無限になります。
          0 の近くで 1/√x は無限大ですが、積分は有限です。
        note: 広義積分は極限で定義。1/x² は収束、1/x は発散。
      - part: 今日
        text: ∫(1→∞) 1/x² dx はいくつですか。
        choices: [0, 1, 2, "発散"]
        answer: 1
        check: "1"
        hints:
          - 1/x² の原始関数を求めます。
          - b までの積分を計算します。
          - b→∞ の極限をとります。
        paths:
          - [原始関数 −1/x, b まで, 極限]
      - part: 今日
        text: ∫(1→∞) 1/x dx はどうなりますか。
        choices: ["0 に収束", "1 に収束", "2 に収束", "発散"]
        answer: "発散"
        check: "'発散'"
        hints:
          - 1/x の原始関数は log x です。
          - b までの積分は log b です。
          - b→∞ の極限を考えます。
        paths:
          - [原始関数 log x, log b, b→∞]
      - part: 挑戦
        text: ∫(0→1) 1/√x dx はいくつですか。
        choices: [1, 2, 4, "発散"]
        answer: 2
        check: "2"
        hints:
          - 1/√x = x^(−1/2) です。
          - 原始関数を求めます。
          - ε→0 の極限をとります。
        paths:
          - [x^(−1/2), 原始関数 2√x, ε→0]
    extra: []

  - day: 6
    items:
      - part: わけ
        text: 微積分の基本定理 F'(x)=f(x) が成り立つわけを説明しましょう。
        explain: 「F(x) は a から x までの面積。x を Δx だけ動かすと、面積は f(x)Δx ほど増える。だから差の割合 (F(x+Δx)−F(x))/Δx は f(x) に近づく。よって F'(x)=f(x)。」と書ければよい。① 面積の増え方、② 差の割合、③ 極限で f(x)。子どもには、長方形の面積で確かめさせます。
        hints:
          - F(x) は面積です。
          - x を少し動かすと、面積は高さ f(x) の分だけ増えます。
          - 差の割合の極限を考えます。
        paths:
          - [面積の増え方, 差の割合, 極限 f(x)]
      - part: わけ
        text: 定積分がリーマン和の極限で定義されるわけを説明しましょう。
        explain: 「区間を細かく分けて長方形を並べると、その面積の和はグラフの下の面積に近づく。分割を細かくするほど、長方形とグラフのずれが小さくなる。だから、和の極限を面積（定積分）と定義する。」と書ければよい。① 長方形の和、② 細かくするとずれが小さい、③ 極限が面積。子どもには、x² の例で確かめさせます。
        hints:
          - 長方形を並べて面積を近似します。
          - 分割を細かくすると、ずれが小さくなります。
          - 和の極限を定積分とします。
        paths:
          - [長方形の和, ずれが小さい, 極限が面積]
      - part: わけ
        text: 広義積分を極限で定義するわけを説明しましょう。
        explain: 「無限に続く区間や、端点で無限大になる関数は、そのままでは普通の積分にならない。有限の b まで、または ε だけ内側までの積分を考え、b→∞ や ε→0 の極限をとれば、面積が有限か無限かを決められる。だから極限で定義する。」と書ければよい。① そのままでは積分できない、② 有限の所まで積分、③ 極限で決める。子どもには、1/x² で確かめさせます。
        hints:
          - 無限区間や無限大の端点は、そのままでは扱えません。
          - 有限の所までの積分を考えます。
          - その極限で面積を決めます。
        paths:
          - [そのままでは不可, 有限まで, 極限]

