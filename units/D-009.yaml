# D-009 リーマン積分と微積分の基本定理、広義積分
#
# 水準 4・8 日。前提は D-006（積分の考え：面積と原始関数、置換積分と部分積分）。
# リーマン和と定積分、定積分の性質、微積分の基本定理、置換積分と部分積分、広義積分を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 1 日目：リーマン和（長方形の面積の和）と、その極限としての定積分。x 軸より下の部分は − をつけて数える（符号付きの面積）。
# 2 日目：線形性、区間を分ける、向きを逆にすると符号が反対。3 日目：基本定理（F′(x) = f(x)、∫(a→b) f(x) dx = F(b) − F(a)）。
# 4 日目：置換積分と部分積分（D-006 のふり返り。はしを u に移す 2 本の数直線、部分積分の表）。5 日目：広義積分（b → ∞、ε → 0 の極限）。
# 6 日目：わけ 3 つ。7 日目：混ぜる（リーマン和と定積分の差、2 つの曲線の間の面積、置換積分、置換を使う広義積分）。8 日目：確認。
# 指数関数と対数関数（D-001、D-011）はたどりにないので、eˣ と log x は子の問いでは使わない（4 日目は x sin x、x² cos x にした）。
#   ∫(1→∞) 1/x dx の発散は、はばが 2 倍ずつの長方形（どれも面積 1/2）の図で示す。
# 図とイラストの多い形に直した（D-131、直す係 3）：見本 5 つと答える問題 24 問に図、ヒント 32 段に図。
#   7 日目・8 日目・腕だめしの、前の日と同じ問いのくり返しは、ちがう数の問いに直した（その id は消した）。
#   1 日目の 2 問目と挑戦、2〜4 日目の挑戦、4 日目の 2 問目も、図を見て答える問いに直した（id を消した）。
# 子の文の用語：符号（符号付きの面積）、x 軸、置換積分は、この単元と前提の用語として使う。

