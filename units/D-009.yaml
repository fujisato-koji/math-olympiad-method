        text: |-
          広義積分：区間が無限に続くときや、はしで関数の値が限りなく大きくなるときの積分です。
          有限の b までの積分を計算してから、b を大きくした極限をとります。∫(a→∞) f(x) dx = lim(b→∞) ∫(a→b) f(x) dx。極限があれば「収束する」、なければ「発散する」といいます。
          例：∫(1→b) 1/x³ dx = 1/2 − 1/(2b²) は、b → ∞ で 1/2 に近づくので、∫(1→∞) 1/x³ dx = 1/2 です（図）。
          はしで限りなく大きくなるときは、ε だけ内側までの積分を計算して、ε → 0 の極限をとります。
