      - part: 今日
        text: 1、2、2、3、3、3、4、4、4、4、… と並んでいます。25 番目の数はいくつですか。
        answer: 7
        check: "[g for g in range(1, 10) for k in range(g)][25 - 1]"
        hints:
          - 同じ数のまとまりで区切ろう。2 は 2 こ、3 は 3 こ並んでいるね。
          - 6 のまとまりの終わりまでに、何こ並んでいるかな。
          - 25 番目は、どの数のまとまりに入るかな。
        paths:
