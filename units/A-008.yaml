# A-008 規則性と群数列
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：くり返しのきまり（周期）。何番目かを、くり返しの長さでわったあまりで決める。曜日。
#   2 日目：群数列（区切りを入れて組に分ける、何組目の何番目、組の終わりは全体の何番目）。
#   3 日目：図と表のきまり（ご石の並び、ふえ方がふえていく並び（1、3、6、10、…）、表に並べた数の行と列）。
#   4 日目：わけ。5 日目：A-004、N-014、N-015 と混ぜる。6 日目：確認。
# 前提は A-004（→ N-015、L-001、N-014、N-009）。A-004 と同じく、かけ算は九九と 2 けた × 1 けた（N-015 の分ける）まで、
#   わり算は九九の範囲（あまりあり）、数は 200 くらいまでにした。
# 分数（N-016）は前提にないので、分数の群数列（1/1、1/2、2/2、…）は扱わない。
# 文字（A-010）は前提にないので、「n 番目」の式は使わず、数の例とことばで言う。
# 組の終わりが全体の何番目かは、1 + 2 + 3 + … の和（A-004 の「はしから組にする」）で求める。
# 並びの図は、くり返しは 1 字の絵文字（○●、🔴🔵🟡 など）、ご石は ⚫ と全角の空白で描く。
#   表は全角の数字と全角の空白で列をそろえる（行ごとに中央へそろえて表示されるため）。
# check は、くり返しは（番目 − 1）% 長さ で並びの文字を取り出し、群数列は組を順に書き出した並び（内包表記）から取り出す。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-016 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-008
days:
  - day: 1
    items:
      - part: 見本
        text: 🔴🔵🟡 の 3 つが、くり返し並んでいます。20 番目は何色かな。
        figure: 🔴🔵🟡🔴🔵🟡🔴🔵🟡…
        explain: 🔴🔵🟡 の 3 こを 1 組と考えます。20 ÷ 3 = 6 あまり 2 なので、20 番目は、6 組（18 こ）のあとの 2 こ目です。組の 2 番目は 🔵 なので、20 番目は 🔵 です。あまりが 0 のときは、組の最後（🟡）になります。
      - part: 思い出す
        text: 4、9、14、19、□ の □ に入る数はいくつですか。
        answer: 24
        check: "19 + 5"
        hints:
          - となりどうしの数のちがいを見よう。
          - いくつずつふえているかな。
          - 19 に、そのふえる数を足そう。
        paths:
          - [5 ずつふえている, 19 + 5 = 24]
      - part: 思い出す
        text: 1 + 2 + 3 + … + 10 を計算しましょう。
        answer: 55
        check: "sum(range(1, 11))"
        hints:
          - はしとはしを組にしてみよう。
          - 1 と 10、2 と 9、… の和はいくつかな。
          - その組がいくつできるかな。
        paths:
          - [1 + 10 = 11 の組が 5 つ, 11 × 5 = 55]
      - part: 今日
        text: 🍎🍊🍊🍇 の 4 つが、くり返し並んでいます。23 番目はどれですか。
        figure: 🍎🍊🍊🍇🍎🍊🍊🍇…
        choices: [🍎, 🍊, 🍇]
        answer: 🍊
        check: "'🍎🍊🍊🍇'[(23 - 1) % 4]"
        hints:
          - 何こで 1 組になっているかな。
          - 23 を 1 組のこ数でわると、何組とあまりいくつかな。
          - あまりの数だけ、組のはじめから数えよう。
        paths:
          - [4 こで 1 組, 23 ÷ 4 = 5 あまり 3, 組の 3 番目は 🍊]
      - part: 今日
        text: 2、7、5、2、7、5、… と、きまりにしたがって並んでいます。30 番目の数はいくつですか。
        answer: 5
        check: "[2, 7, 5][(30 - 1) % 3]"
        hints:
          - 何こで 1 組になっているかな。
          - 30 を 1 組のこ数でわると、あまりはいくつかな。
          - あまりが 0 のときは、組のどこになるかな。
        paths:
          - [3 こで 1 組, 30 ÷ 3 = 10 あまり 0, ちょうど 10 組目の最後で 5]
        note: あまり 0 を「組の 0 番目」と考えてとまどいやすい。ちょうど組が終わるので、組の最後の数。
      - part: 今日
        text: ある月の 1 日は水曜日です。この月の 25 日は何曜日ですか。
        choices: [土曜日, 金曜日, 水曜日]
        answer: 土曜日
        check: "'水木金土日月火'[(25 - 1) % 7] + '曜日'"
        hints:
          - 曜日は、何日ごとにくり返すかな。
          - 1 日から 25 日までは、何日あとかな。
          - 7 日ずつ進めると同じ曜日になるね。あまりの日数だけ進めよう。
        paths:
          - [25 日は 1 日の 24 日あと, 24 ÷ 7 = 3 あまり 3, 水曜日から 3 つ進んで土曜日]
          - [1 日、8 日、15 日、22 日が水曜日, 22 日から 3 日あとで土曜日]
        note: 25 ÷ 7 のあまり 4 を使って、水曜日から 4 つ進めて日曜日としやすい。1 日が水曜日なので、「1 日から何日あとか」を数える。
      - part: 挑戦
        text: 1、2、3、1、2、3、… と並んでいます。1 番目から 20 番目までの数を、すべて足すといくつですか。
        answer: 39
        check: "sum([1, 2, 3][i % 3] for i in range(20))"
        hints:
          - 1 組の数を足すと、いくつかな。
          - 20 番目までに、組は何組と、あと何こあるかな。
          - 組の和の分と、残りのこの分を足そう。
        paths:
          - [1 組の和は 6, 20 ÷ 3 = 6 あまり 2, 6 × 6 + 1 + 2 = 39]
    extra:
      - part: 今日
        text: 🔵🔵🔴 の 3 つが、くり返し並んでいます。25 番目は何色ですか。
        figure: 🔵🔵🔴🔵🔵🔴🔵🔵🔴…
