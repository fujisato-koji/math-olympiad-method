    text: 集合 A = {1, 2, …, 12} から A への写像 f を、「f(n) は 5n を 13 でわった余り」と決めます。f は全単射です。f を k 回合成した写像 f ∘ f ∘ … ∘ f が、A のすべての要素 n を n 自身に写すような、いちばん小さい正の整数 k はいくつですか。
