# A-024 集合と写像（単射と全射）、二項関係と同値関係、順序関係
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、わけ、混ぜる、確認）で作った。
#   1 日目 導入：集合と要素（∈、∉）、書き方（要素を並べる、{x | 条件}）、部分集合 ⊂、共通部分 ∩、和集合 ∪、全体集合と補集合 Ā、空集合 ∅。
#     L-013 の「かつ」「または」「でない」「ならば」と結びつける。
#   2 日目 練習：写像 f：A → B、像と値域、単射・全射・全単射、逆写像 f⁻¹、合成写像 g ∘ f。頭に見本。
#   3 日目 わけ（3 問とも ③：2 つの集合が等しいこと、1 次式の写像が全単射であること、単射どうしの合成は単射）。
#   4 日目 混ぜる：頭に見本を置いて、二項関係（反射律・対称律・推移律）、同値関係と同値類、順序関係（反対称律）、全順序を入れ、
#     集合・写像と L-013（必要条件と十分条件）の型と混ぜる。同値関係のわけを 1 問置く。5 日目 確認。
#   地図の 5 日に題の 3 つの中身（集合と写像、同値関係、順序関係）が入りきらないので、関係は混ぜるの日の見本で入れた（報告に書く）。
# 前提は L-013 と A-006。たどると A-013（不等式）、A-011（1 次方程式）、A-010（文字と式）、N-017・N-018（倍数と約数、公倍数）、
#   N-014（余り）、N-011（絶対値）、N-027（正負の数）、G-050（座標）、G-015（点の移動）までなので、これらを道具にする。
# 1 次関数とグラフ（A-019）は前提にないので、写像は式（f(x) = 3x − 4 など）と表で扱い、グラフは描かない。
#   関数の記号 f(x) は、2 日目の見本で写像の像として約束する（A-023 は前提にない）。
# 数え上げ（C の流れ）は前提にないので、写像の個数や全単射の個数は数えない（C-019 で扱う）。要素の個数は書き出して数える。
#   2 つの集合の和集合の要素の個数の公式（包除原理 C-021）は後ろの単元なので使わない。
# 整数全体の集合を Z、実数全体の集合を R と書く（2 日目の見本で約束）。補集合は Ā、B̄ と書き、選択肢ではことばでも書く。
#   写像は f：A → B と書く（「f: A」の半角のコロンと空白は YAML で使えないので、全角のコロンにした）。
#   同値関係は a ∼ b と書く。順序関係は ≦ と「a は b の約数」と ⊂ の例で扱う。
# 集合や区間を選ぶ問題の選択肢は "{1, 5, 7}" のように引用符で書く（YAML の都合）。paths の中では集合を「要素は 1、5、7」のように書く。
# check：集合は Python の set で計算し、選択肢ごとの set と比べる。区間は 1/4 や 1/8 きざみの数（Fraction）で、入るかどうかを全部くらべる。
#   単射・全射は、有限の集合なら像の個数と値域で、Z や R の写像なら −50〜50 などの範囲で像が重ならないか、−20〜20 の各数に写る数が
#   あるかで調べる。関係の性質は、−6〜6 などの範囲の整数の組・3 つ組を全部ためす。
# 集合と写像は、全単射で数える（C-019）、関数方程式（A-029）、可算と非可算（L-020）、半順序とツォルンの補題（L-022）、
#   オートマトン（L-027）、群の準同型（R-001）の土台になる（D-026）。

id: A-024
days:
  - day: 1
    items:
      - part: 見本
        text: 集合 A = {1, 2, 3, 6}（6 の正の約数）と B = {1, 3, 5, 7, 9}（10 以下の正の奇数）を例に、集合の言葉と記号を調べてみましょう。
