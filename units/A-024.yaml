        explain: 集合 A のどの要素 x にも、集合 B の要素がただ 1 つ対応しているとき、この対応を A から B への写像といい、f：A → B と書きます。x に対応する B の要素を f(x) と書き、x の像といいます。図では f(1) = 5、f(2) = 4、f(3) = 6 です。像全体の集合 {f(x) | x ∈ A} を f の値域といい、ここでは {4, 5, 6} です。関数（A-006）は、数の集合から数の集合への写像です。A のちがう要素がいつもちがう要素に写るとき、つまり x₁ ≠ x₂ ならば f(x₁) ≠ f(x₂) のとき、f は単射であるといいます。対偶をとって「f(x₁) = f(x₂) ならば x₁ = x₂」と言っても同じです（L-013）。B のどの要素 y にも f(x) = y となる A の要素 x があるとき、f は全射であるといいます。図の f は単射ですが、7 に写る要素がないので全射ではありません。単射でも全射でもある写像を全単射といいます。f が全単射なら、B のどの要素 y にも f(x) = y となる x がただ 1 つあるので、y にその x を対応させる写像 B → A が決まります。これを f の逆写像といい、f⁻¹ と書きます。また、f：A → B と g：B → C があるとき、x に g(f(x)) を対応させる写像 A → C を合成写像といい、g ∘ f と書きます。整数全体の集合を Z、実数全体の集合を R と書きます。f：Z → Z、f(n) = 2n は単射ですが、奇数に写る整数がないので全射ではありません。g：R → R、g(x) = x + 3 は全単射で、逆写像は g⁻¹(x) = x − 3 です。
