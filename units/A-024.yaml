    text: 座標平面の点を点に写す写像 f と g を、f(x, y) = (−y, x)（原点のまわりに 90° 回す）、g(x, y) = (x, −y)（x 軸に関して対称に移す）と決めます。点 P を f、g、f の順に移したら、点 (3, −7) になりました。P の座標は、どれですか。
    choices:
      - "(3, 7)"
      - "(−3, 7)"
      - "(7, 3)"
      - "(−7, −3)"
    answer: "(3, 7)"
    check: "[c for c, (x, y) in {'(3, 7)': (3, 7), '(−3, 7)': (-3, 7), '(7, 3)': (7, 3), '(−7, −3)': (-7, -3)}.items() if (lambda f, g: f(*g(*f(x, y))))(lambda x, y: (-y, x), lambda x, y: (x, -y)) == (3, -7)][0]"
    hints:
      - P を (x, y) として、f、g、f の順に移した点を x、y で表しましょう。
      - 合成写像 f ∘ g ∘ f は、1 つの簡単な移動になります。
      - 逆にたどるなら、f⁻¹（逆向きに 90° 回す）、g⁻¹（= g）、f⁻¹ の順に (3, −7) を移しましょう。
    paths:
      - [f で (−y, x)、g で (−y, −x)、f で (x, −y), f ∘ g ∘ f は x 軸に関する対称移動, (x, −y) = (3, −7) より P = (3, 7)]
      - [(3, −7) を f⁻¹ で (−7, −3)、g で (−7, 3)、f⁻¹ で (3, 7)]
    note: 点の移動（G-015）を写像として合成し、全単射なので逆写像で逆にたどれる。合成の順（先に f）と、f⁻¹ の向きでつまずきやすい。3 回の移動が 1 回の対称移動にまとまることに気づくと速い。
