            <text x="170" y="110" font-size="13" text-anchor="middle">9</text>
          </svg>
        explain: はっきり決まったものの集まりを集合といい、集合をつくっている 1 つ 1 つのものを要素といいます。a が集合 A の要素であることを a ∈ A、要素でないことを a ∉ A と書きます。3 ∈ A、4 ∉ A です。集合は、要素を並べて {1, 2, 3, 6} と書くほかに、条件を使って {x | x は 6 の正の約数} とも書きます。集合 A のどの要素も集合 B の要素であるとき、A は B の部分集合であるといい、A ⊂ B と書きます。たとえば {1, 3} ⊂ A です。A と B の両方に入っている要素全体の集合を共通部分といい A ∩ B、少なくとも一方に入っている要素全体の集合を和集合といい A ∪ B と書きます。図では A ∩ B = {1, 3}（色をつけた部分）、A ∪ B = {1, 2, 3, 5, 6, 7, 9} です。考えるもの全体の集合 U（全体集合）を決めたとき、U の要素で A に入らないもの全体の集合を A の補集合といい、Ā と書きます。U = {1, 2, …, 10} なら Ā = {4, 5, 7, 8, 9, 10} です。要素が 1 つもない集合を空集合といい、∅ と書きます。L-013 の条件とくらべると、「p かつ q」を満たすもの全体が共通部分、「p または q」が和集合、「p でない」が補集合にあたります。また、「p ならば q」が真であることは、p を満たすもの全体の集合が、q を満たすもの全体の集合の部分集合であることと同じです。
      - part: 思い出す
        text: 命題「x² = 4 ならば x = 2」の真偽はどちらですか。
        choices: [真, 偽]
        answer: 偽
        check: "'真' if all(x == 2 for x in range(-20, 21) if x * x == 4) else '偽'"
        hints:
          - x² = 4 を満たす数を、すべて考えましょう。
          - 負の数も 2 乗すると正の数になります。
          - 反例が 1 つでもあれば、命題は偽です（L-013）。
        paths:
          - [x = −2 は x² = 4 を満たすが x = 2 でない, 反例があるので偽]
      - part: 思い出す
        text: 36 の正の約数は、いくつありますか。
        answer: 9
        check: "len([d for d in range(1, 37) if 36 % d == 0])"
        hints:
          - 36 をわり切る数を、1 から順にさがしましょう。
          - かけて 36 になる 2 つの数の組を考えると、もれなく見つかります。
          - 6 × 6 のように、同じ数の組は 1 つと数えます。
        paths:
          - [1 × 36、2 × 18、3 × 12、4 × 9、6 × 6, 1、2、3、4、6、9、12、18、36 の 9 個]
      - part: 今日
        text: A = {x | x は 18 の正の約数}、B = {x | x は 12 の正の約数} とします。A ∩ B の要素は、いくつありますか。
        answer: 4
        check: "len(set(d for d in range(1, 19) if 18 % d == 0) & set(d for d in range(1, 13) if 12 % d == 0))"
        hints:
          - A と B を、要素を並べて書きましょう。
          - A ∩ B は、両方に入っている要素全体の集合です。
          - 18 と 12 の公約数を考えても同じです（N-018）。
        paths:
          - [A の要素は 1、2、3、6、9、18, B の要素は 1、2、3、4、6、12, A ∩ B の要素は 1、2、3、6 の 4 個]
      - part: 今日
        text: 全体集合を U = {1, 2, 3, …, 10} とし、A = {x | x は偶数}、B = {x | x は 3 の倍数} とします。A ∪ B の補集合は、どれですか。
        choices:
          - "{1, 5, 7}"
          - "{1, 3, 5, 7, 9}"
          - "{1, 2, 3, 4, 5, 7, 8, 9, 10}"
          - "{6}"
        answer: "{1, 5, 7}"
        check: "(lambda U, A, B: [c for c, s in {'{1, 5, 7}': {1, 5, 7}, '{1, 3, 5, 7, 9}': {1, 3, 5, 7, 9}, '{1, 2, 3, 4, 5, 7, 8, 9, 10}': {1, 2, 3, 4, 5, 7, 8, 9, 10}, '{6}': {6}}.items() if s == U - (A | B)][0])(set(range(1, 11)), set(range(2, 11, 2)), set(range(3, 11, 3)))"
        hints:
          - まず A ∪ B を、要素を並べて書きましょう。
          - 補集合は、U の要素で A ∪ B に入らないもの全体です。
          - 偶数でもなく、3 の倍数でもない数をさがしても同じです。
        paths:
          - [A ∪ B の要素は 2、3、4、6、8、9、10, 残りは 1、5、7]
        note: 「または」の否定は「でもなく、でもない」（L-013）。A ∩ B の補集合（6 以外のすべて）や、A の補集合（奇数）と取りちがえやすい。
      - part: 挑戦
        text: A = {x | 2 < x < 5}、B = {x | a < x < a + 4}（a は定数）とします。A ⊂ B となる a の値の範囲は、どれですか。
        choices: [1 ≦ a ≦ 2, 1 < a < 2, 2 ≦ a ≦ 5, a ≦ 2]
        answer: 1 ≦ a ≦ 2
        check: "[c for c, ok in {'1 ≦ a ≦ 2': lambda a: 1 <= a <= 2, '1 < a < 2': lambda a: 1 < a < 2, '2 ≦ a ≦ 5': lambda a: 2 <= a <= 5, 'a ≦ 2': lambda a: a <= 2}.items() if all(ok(a) == all(a < x < a + 4 for x in [Fraction(k, 8) for k in range(17, 40)]) for a in [Fraction(k, 4) for k in range(-8, 30)])][0]"
        hints:
          - A と B を数直線に描いてみましょう。
          - A が B の中に入るには、B の左はしと右はしがどこにあればよいでしょう。
          - a = 2 のとき、x = 2 は A にも B にも入らないことに気をつけて、等号がつくかを考えましょう。
        paths:
          - [B の左はし a が 2 以下, B の右はし a + 4 が 5 以上, a ≦ 2 かつ a ≧ 1, 1 ≦ a ≦ 2]
        note: どちらの集合も端をふくまないので、a = 2 や a = 1 でも A ⊂ B になる。等号を落として 1 < a < 2 としやすい。
    extra:
