    hints:
      - 1 から始めて、f で次々に移していきましょう。1 → 5 → … と、いつ 1 にもどるでしょう。
      - ほかの数（たとえば 2）から始めても、同じ回数でもどるでしょうか。
      - すべての要素がもとにもどる回数を考えましょう。
    paths:
      - [1 → 5 → 12 → 8 → 1, 2 → 10 → 11 → 3 → 2、4 → 7 → 9 → 6 → 4, どの輪も 4 つなので k = 4]
      - [f を k 回合成すると n を 5ᵏn の余りに写す, 5² = 25 の余りは 12、5⁴ の余りは 12 × 12 = 144 の余りで 1, k = 4]
    note: 全単射 f を何回も合成すると、要素は輪になってまわる。12 個の要素が 4 つずつの 3 つの輪に分かれることを書き出して見つける。2 本目は、余りの計算でまとめる見方。
  - part: 離
    kinds: [総動員]
    uses: [N-011]
    text: 実数 x についての条件 p、q、r を、p：|x − 2| ≦ 3、q：|x − a| ≦ 6、r：x ≦ 9 とします（a は整数の定数）。p が q の十分条件であり、q が r の十分条件でもあるような整数 a は、いくつありますか。
    answer: 5
    check: "(lambda X: len([a for a in range(-30, 31) if all(abs(x - a) <= 6 for x in X if abs(x - 2) <= 3) and all(x <= 9 for x in X if abs(x - a) <= 6)]))([Fraction(k, 4) for k in range(-160, 161)])"
    hints:
      - p、q、r を満たす x 全体の集合を、不等式で表しましょう（N-011）。
      - 「p が q の十分条件」は、p の集合が q の集合の部分集合であることです。
      - 2 つの包含の条件を、a の不等式にしましょう。
    paths:
      - [P は −1 ≦ x ≦ 5、Q は a − 6 ≦ x ≦ a + 6、R は x ≦ 9, P ⊂ Q は a − 6 ≦ −1 かつ a + 6 ≧ 5 で −1 ≦ a ≦ 5, Q ⊂ R は a + 6 ≦ 9 で a ≦ 3, −1 ≦ a ≦ 3 の整数は 5 個]
    note: 絶対値の不等式（N-011）を区間に直し、十分条件（L-013）を集合の包含に言いかえ、2 つの包含を合わせる。P ⊂ Q と Q ⊂ P の向きを取りちがえやすい。端の等号（a = −1、a = 3 も入る）に気をつける。
