        text: 整数 a、b について「a − b が 5 の倍数である」ことを a ∼ b と書きます。∼ が整数全体の集合の上の同値関係であることを、筋道を立てて書きましょう。
        explain: 例：「反射律：a を整数とする。a − a = 0 = 5 × 0 なので a ∼ a。対称律：a ∼ b とすると、a − b = 5k（k は整数）と書ける。b − a = −(a − b) = 5 × (−k) で、−k は整数なので b ∼ a。推移律：a ∼ b かつ b ∼ c とすると、a − b = 5k、b − c = 5l（k、l は整数）と書ける。a − c = (a − b) + (b − c) = 5k + 5l = 5(k + l) で、k + l は整数なので a ∼ c。3 つが成り立つので、∼ は同値関係である。」と書ければよい。①「〜とする」で a、b、c と k、l を決める、② a − c = (a − b) + (b − c) のように式を変形し、5 でくくる、③ 約束した事実（倍数の意味、整数の和と −k は整数、同値関係の定義）で結ぶ、の 3 つがそろっているかを見る。推移律で、a − b と b − c に同じ文字 k を使っていたら、それでは「同じ倍数」だと決めてしまうので、別の文字にする必要があることを話す。同値類は 5 でわった余りが 0〜4 の 5 つになることにも触れる。
