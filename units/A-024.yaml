      - part: 挑戦
        text: 全体集合を U = {1, 2, …, 60} とし、A、B、C をそれぞれ 2 の倍数、3 の倍数、5 の倍数の集合とします。A ∩ B ∩ C̄ の要素は、いくつありますか。
        answer: 8
        check: "len(set(range(2, 61, 2)) & set(range(3, 61, 3)) - set(range(5, 61, 5)))"
        hints:
          - A ∩ B は、2 の倍数でも 3 の倍数でもある数の集合です。
          - それは 6 の倍数の集合です（N-018）。
          - そのうち、5 の倍数でないものを数えましょう。
        paths:
          - [A ∩ B は 6 の倍数で 10 個, そのうち 5 の倍数は 30 と 60, 10 − 2 = 8]

  - day: 2
    items:
      - part: 見本
        text: 集合 A = {1, 2, 3} の要素に、集合 B = {4, 5, 6, 7} の要素を、図の矢印のように対応させます。このような対応を調べてみましょう。
        svg: |
          <svg viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg">
