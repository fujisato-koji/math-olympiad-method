  - day: 4
    items:
      - part: 見本
        text: 整数 a、b について、「a − b が 3 の倍数である」ことを a ∼ b と書きます。この関係の性質を調べてみましょう。
        explain: 集合 A の 2 つの要素 a、b について、ある関係があるかないかが決まっているとき、それを A の上の二項関係といいます。a ∼ b を「a − b が 3 の倍数」とすると、次の 3 つが成り立ちます。① 反射律：どの a でも a ∼ a（a − a = 0 = 3 × 0）。② 対称律：a ∼ b ならば b ∼ a（b − a = −(a − b) も 3 の倍数）。③ 推移律：a ∼ b かつ b ∼ c ならば a ∼ c（a − c = (a − b) + (b − c) は 3 の倍数どうしの和）。この 3 つが成り立つ関係を同値関係といいます。同値関係があると、要素を、たがいに関係にあるものどうしの組に分けられます。a と関係にある要素全体の集合を、a の同値類といいます。ここでは、整数は 3 でわった余りが 0、1、2 の 3 つの同値類に分かれ、どの整数もちょうど 1 つの同値類に入ります。一方、数の大小 a ≦ b は、反射律（a ≦ a）と推移律は成り立ちますが、対称律は成り立ちません。そのかわりに、④ 反対称律：a ≦ b かつ b ≦ a ならば a = b が成り立ちます。反射律、反対称律、推移律の 3 つが成り立つ関係を順序関係といいます。正の整数の「a は b の約数」や、集合の ⊂ も順序関係です。ただし、2 と 3 はどちらも他方の約数でないように、くらべられない 2 つの要素がある順序関係もあります。どの 2 つの要素もくらべられる順序関係（数の ≦ など）を全順序といいます。a < b は反射律が成り立たないので、この決め方では順序関係ではありません。
