        explain: |-
          バーンサイドの補題：軌道の数 = (1/|G|) Σ |Fix(g)|。
          D4 の Fix の数：e は 16、90° と 270° は 2 ずつ、180° は 4、頂点を通る鏡映 2 つは 8 ずつ、辺の中点を通る鏡映 2 つは 4 ずつ。和は 48。48 / 8 = 6 軌道。
