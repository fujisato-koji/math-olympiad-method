  - day: 8
    items:
      - part: 見本
        id: "2733c20a16"
        text: |-
          D4（正方形の《対称移動》の《群》、《位数》 8）の作用を調べましょう。図の点線は鏡映の軸、赤い線は調べる辺や対角線です。
          ・4 つの頂点：どの頂点も移り合うので、軌道は 1 つ。頂点の安定化群は位数 2（恒等と、その頂点を通る《鏡映》）。
          ・4 つの辺：どの辺も移り合うので、軌道は 1 つ。辺の安定化群は位数 2。
          ・2 つの対角線：90° 回転で入れかわるので、軌道は 1 つ。対角線の安定化群は位数 4。
          D3（正三角形、位数 6）でも、頂点・辺の軌道はそれぞれ 1 つです。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="35.2,56.2 74.8,56.2 74.8,95.8 35.2,95.8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="26" y1="47" x2="84" y2="105" fill="none" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><circle cx="35.2" cy="56.2" r="9" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="74.8" cy="56.2" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="74.8" cy="95.8" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="35.2" cy="95.8" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="55" y="140" font-size="14" text-anchor="middle" fill="currentColor">頂点</text><text x="55" y="160" font-size="13" text-anchor="middle" fill="currentColor">軌道 4・安定 2</text><polygon points="140.2,56.2 179.8,56.2 179.8,95.8 140.2,95.8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="160" y1="108.8" x2="160" y2="43.2" fill="none" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><circle cx="140.2" cy="56.2" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="179.8" cy="56.2" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="179.8" cy="95.8" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="140.2" cy="95.8" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><line x1="140.2" y1="56.2" x2="179.8" y2="56.2" fill="none" stroke="#f08080" stroke-width="4"/><text x="160" y="140" font-size="14" text-anchor="middle" fill="currentColor">辺</text><text x="160" y="160" font-size="13" text-anchor="middle" fill="currentColor">軌道 4・安定 2</text><polygon points="245.2,56.2 284.8,56.2 284.8,95.8 245.2,95.8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="245.2" cy="56.2" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="284.8" cy="56.2" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="284.8" cy="95.8" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="245.2" cy="95.8" r="9" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><line x1="245.2" y1="56.2" x2="284.8" y2="95.8" fill="none" stroke="#f08080" stroke-width="4"/><text x="265" y="140" font-size="14" text-anchor="middle" fill="currentColor">対角線</text><text x="265" y="160" font-size="13" text-anchor="middle" fill="currentColor">軌道 2・安定 4</text></svg>'
        explain: |-
          D4 の頂点：|G| = 8、軌道 4、安定化群 2（8 = 4 × 2）。辺：軌道 4、安定化群 2。対角線：軌道 2、安定化群 4（8 = 2 × 4）。
          D3 の頂点：軌道 3、安定化群 2。辺：軌道 3、安定化群 2。
        note: 図形の対称群の作用では、軌道は「同じ形の場所」、安定化群は「その場所を動かさない移動」。
