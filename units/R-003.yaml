        explain: |-
          証明の考え方：f：G → Orb(x) を f(g) = g·x と決めます。f は《全射》です。y = g·x となる g を 1 つ選ぶと、f(h) = y となる h は、g·Stab(x) = {g·s | s ∈ Stab(x)} の要素です。この集合の要素は |Stab(x)| 個で、どの y にも同じ個数ずつ g が対応します。よって |G| = |Orb(x)| × |Stab(x)|。
          例：D3 の頂点 1 では、Orb(1) = {1,2,3}、Stab(1) は e と頂点 1 を通る《鏡映》の 2 つ。6 = 3 × 2。
        note: 軌道が大きいほど、安定化群は小さい。|G| を 2 つの数に分ける見方。
