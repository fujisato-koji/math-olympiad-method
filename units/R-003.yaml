        explain: 「① 反射律：e·x = x なので x ∼ x。② 対称律：x ∼ y なら y = g·x で、x = g⁻¹·y なので y ∼ x。③ 推移律：x ∼ y、y ∼ z なら y = g·x、z = h·y で、z = (hg)·x なので x ∼ z。」と書ければよい。①〜③を、作用の 2 つの決まり（e·x=x、(gh)·x=g·(h·x)）で示す。子どもには、《逆元》 g⁻¹ と積 hg を使わせます。
