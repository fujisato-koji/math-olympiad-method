        text: 中心化群 C_G(x) = {g ∈ G | gx = xg} が G の部分群であるわけを説明しましょう。
        explain: 「① e ∈ C_G(x)：ex = xe。② g、h ∈ C_G(x) なら (gh)x = g(hx) = g(xh) = (gx)h = (xg)h = x(gh) なので gh ∈ C_G(x)。③ g ∈ C_G(x) なら gx = xg の両辺に左右から g⁻¹ をかけて xg⁻¹ = g⁻¹x なので g⁻¹ ∈ C_G(x)。よって部分群。」と書ければよい。①〜③を、可換の定義に沿って示す。子どもには、《結合法則》を使って g と h を動かす順を確かめさせます。
        hints:
