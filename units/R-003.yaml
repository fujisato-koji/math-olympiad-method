        text: |-
          有限《群》 G が有限集合 X に作用するとき、軌道の数は
          (1/|G|) × Σ |Fix(g)|（g ∈ G についての和）
          で求められます（バーンサイドの補題）。Fix(g) = {x ∈ X | g·x = x}。
          D3 が 3 つの頂点に作用する例：
          Fix(e) = 3、Fix(r) = Fix(r²) = 0、3 つの《鏡映》はそれぞれ 1 つの頂点を固定するので Fix(s) = 1。
          和は 3 + 0 + 0 + 1 + 1 + 1 = 6。6 / 6 = 1 軌道。
          G = {e, s} が 3 つの頂点に作用する例：Fix(e) = 3、Fix(s) = 1。和 4、4 / 2 = 2 軌道。
        explain: |-
          バーンサイドの補題は、{(g, x) | g·x = x} を 2 通りに数えます。g ごとに数えると Σ |Fix(g)|、x ごとに数えると Σ |Stab(x)|。軌道・安定化群の定理から、各軌道の寄与は |G| です。よって軌道の数 = (1/|G|) Σ |Fix(g)|。
          D3 の頂点：6 / 6 = 1。G = {e, s}：4 / 2 = 2。
