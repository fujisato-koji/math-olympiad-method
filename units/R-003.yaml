    items:
      - part: 見本
        id: "118c7255c4"
        text: |-
          D4（《位数》 8）が、正方形の 4 つの頂点を 2 色で塗り分けたものに作用します。回転・裏返しで同じ塗り方は同じ軌道に入ります。
          バーンサイドの補題で軌道の数を求めましょう。図は、D4 の 8 つの要素ごとの Fix の数（塗り方のうち、g で動かないものの数）です。
          D4 の 8 つの要素の Fix の数：
          ・e：2⁴ = 16
          ・90°、270° 回転：すべて同じ色の 2 通りずつ
          ・180° 回転：2² = 4
          ・頂点を通る《鏡映》 2 つ：2³ = 8 ずつ
          ・辺の中点を通る鏡映 2 つ：2² = 4 ずつ
          和 = 16 + 2 + 2 + 4 + 8 + 8 + 4 + 4 = 48。48 / 8 = 6 軌道。
