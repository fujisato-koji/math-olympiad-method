# R-003 群作用
#
# 段 8・水準 4・12 日。前提は R-001（群の定義と例、部分群と準同型）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 剰余類（R-002）はまだ使わない。軌道・安定化群の定理は、g·Stab(x) の形の集合を数えて示す。
# 記号：Z は整数全体、Q は有理数全体、D3 は正三角形の対称移動の群、D4 は正方形の対称移動の群。
# 図形の対称移動は G-015 の移動として扱う。

id: R-003
days:
  - day: 1
    items:
      - part: 見本
        id: "1853803a79"
        text: |-
          《群》 G が集合 X に作用するとは、G の各要素 g と X の各要素 x に、X の要素 g·x を対応させて、次の 2 つを満たすことです。
          ① e·x = x（《単位元》は何も変えない）
          ② (gh)·x = g·(h·x)（続けて作用すると、積の作用になる）
          図は、D3（正三角形の《対称移動》の群）の要素 s が、3 つの頂点に作用するようすです。
          次の 4 つが作用の例です。
          ・D3 が、3 つの頂点に作用する。
          ・G = (Z/4Z, +) が、4 つの頂点に、g·x = g + x で作用する。
          ・群 G が G 自身に、g·x = gx（左からかける）で作用する。
          ・群 G が G 自身に、g·x = gxg⁻¹（共役）で作用する。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="68,54 104.4,117 31.6,117" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="68" y1="41" x2="68" y2="130" fill="none" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><circle cx="68" cy="54" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="68" y="59" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="104.4" cy="117" r="11" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="104.4" y="122" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="31.6" cy="117" r="11" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="31.6" y="122" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><line x1="122" y1="96" x2="188" y2="96" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="198,96 188,101 188,91" fill="currentColor"/><text x="160" y="84" font-size="15" text-anchor="middle" fill="currentColor">s</text><polygon points="252,54 288.4,117 215.6,117" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="252" cy="54" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="252" y="59" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="288.4" cy="117" r="11" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="288.4" y="122" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><circle cx="215.6" cy="117" r="11" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="215.6" y="122" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><text x="160" y="162" font-size="14" text-anchor="middle" fill="currentColor">s は 2 と 3 を入れかえる鏡映</text><text x="160" y="186" font-size="14" text-anchor="middle" fill="currentColor">s·1 = 1　s·2 = 3　s·3 = 2</text></svg>'
        explain: |-
          ① D3 は頂点を移すので作用です。e は動かさず、(gh)·x = g·(h·x) は「続けて移す」ことです。
          ② Z/4Z の g·x = g + x は作用です。0 + x = x、(g + h) + x = g + (h + x)。
          ③ 左からかける作用：e·x = ex = x、(gh)·x = (gh)x = g(hx) = g·(h·x)。
          ④ 共役作用：e·x = exe⁻¹ = x、(gh)·x = (gh)x(gh)⁻¹ = g(hxh⁻¹)g⁻¹ = g·(h·x)。
          共役作用は、G が可換なら自明な作用になります。
        note: 作用の 2 つの決まりを、具体例で確かめる。左からの作用と共役作用は、同じ群 G が自分自身に作用する例。
