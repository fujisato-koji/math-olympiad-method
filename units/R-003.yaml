          - g、h が x と可換なら、gh も x と可換ですか。
          - g が x と可換なら、g⁻¹ も x と可換ですか。
        paths:
          - [ex=xe で e ∈ C_G(x), (gh)x=x(gh) で閉じている, g⁻¹x=xg⁻¹ で逆元がある, 部分群である]
