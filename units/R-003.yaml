      - part: 見本
        id: "6320d4e580"
        text: |-
          《群》 G が X に作用しているとき、x ∈ X について、次の 2 つを考えます。
          ・軌道 Orb(x) = {g·x | g ∈ G}（x から行ける先全体）
          ・安定化群 Stab(x) = {g ∈ G | g·x = x}（x を動かさない G の要素全体）
          D3 が 3 つの頂点に作用する例で調べましょう。図の左は頂点 1 の軌道、右は頂点 1 の安定化群です。
          ・頂点 1 の軌道は {1, 2, 3}。
          ・頂点 1 の安定化群は {e, 頂点 1 を通る《鏡映》} で、《位数》 2。
          Z/4Z が 4 つの頂点に作用する例では、頂点 1 の軌道は 4 つ全体、安定化群は {0} です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="80,52 114.6,112 45.4,112" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="80" cy="52" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="80" y="57" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="114.6" cy="112" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="114.6" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="45.4" cy="112" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="45.4" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><path d="M103.2 39.9 A57.0 57.0 0 0 1 136.8 87.0" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="136.7,98.0 142.8,87.5 132.9,86.5" fill="currentColor"/><path d="M113.5 138.1 A57.0 57.0 0 0 1 56.0 143.7" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="46.5,138.1 52.5,148.6 58.3,140.5" fill="currentColor"/><path d="M23.3 98.0 A57.0 57.0 0 0 1 47.3 45.3" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="56.8,39.9 44.7,39.8 48.8,49.0" fill="currentColor"/><text x="80" y="176" font-size="14" text-anchor="middle" fill="currentColor">軌道：行ける先</text><polygon points="240,52 274.6,112 205.4,112" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="240" y1="39" x2="240" y2="125" fill="none" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><circle cx="240" cy="52" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="240" y="57" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="274.6" cy="112" r="11" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="274.6" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="205.4" cy="112" r="11" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="205.4" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><text x="240" y="176" font-size="14" text-anchor="middle" fill="currentColor">安定化群：動かさない</text></svg>'
        explain: |-
          軌道は、x に G の要素を次々に作用させて行ける先の全体です。D3 では、どの頂点も 120° 回転で他の頂点に移るので、軌道は {1, 2, 3} です。
          安定化群は、x を動かさない G の要素の集まりです。D3 で頂点 1 を動かさないのは、恒等移動 e と、頂点 1 を通る鏡映の 2 つです。この 2 つは《部分群》になります。
          Z/4Z の作用 g·x = g + x では、頂点 1 は 0、1、2、3 のどれにも移るので軌道は 4 つ全体、1 を動かさないのは 0 だけなので安定化群は {0} です。
        note: 軌道は「行ける先」、安定化群は「動かさない要素」。安定化群は、いつも G の部分群になる。
