  - day: 7
    items:
      - part: 見本
        id: "f7a5ca2c8a"
        text: |-
          有限《群》 G が有限集合 X に作用するとき、軌道の数は
          (1/|G|) × Σ |Fix(g)|（g ∈ G についての和）
          で求められます（バーンサイドの補題）。Fix(g) = {x ∈ X | g·x = x}。
          D3 が 3 つの頂点に作用する例：図は、D3 の 6 つの要素ごとに、動かない頂点（緑）を示したものです。
          Fix(e) = 3、Fix(r) = Fix(r²) = 0、3 つの《鏡映》はそれぞれ 1 つの頂点を固定するので Fix(s) = 1。
          和は 3 + 0 + 0 + 1 + 1 + 1 = 6。6 / 6 = 1 軌道。
          G = {e, s} が 3 つの頂点に作用する例：Fix(e) = 3、Fix(s) = 1。和 4、4 / 2 = 2 軌道。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="35,42 50.6,69 19.4,69" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="35" cy="42" r="6" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="50.6" cy="69" r="6" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="19.4" cy="69" r="6" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="35" y="104" font-size="14" text-anchor="middle" fill="currentColor">e</text><text x="35" y="128" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><polygon points="85,42 100.6,69 69.4,69" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="85" cy="42" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="100.6" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="69.4" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="85" y="104" font-size="14" text-anchor="middle" fill="currentColor">r</text><text x="85" y="128" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">0</text><polygon points="135,42 150.6,69 119.4,69" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="135" cy="42" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="150.6" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="119.4" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="135" y="104" font-size="14" text-anchor="middle" fill="currentColor">r²</text><text x="135" y="128" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">0</text><polygon points="185,42 200.6,69 169.4,69" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="185" cy="42" r="6" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="200.6" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="169.4" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="185" y="104" font-size="14" text-anchor="middle" fill="currentColor">s</text><text x="185" y="128" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><polygon points="235,42 250.6,69 219.4,69" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="235" cy="42" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="250.6" cy="69" r="6" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="219.4" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="235" y="104" font-size="14" text-anchor="middle" fill="currentColor">sr</text><text x="235" y="128" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><polygon points="285,42 300.6,69 269.4,69" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="285" cy="42" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="300.6" cy="69" r="6" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><circle cx="269.4" cy="69" r="6" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="285" y="104" font-size="14" text-anchor="middle" fill="currentColor">sr²</text><text x="285" y="128" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><text x="160" y="156" font-size="14" text-anchor="middle" fill="currentColor">緑：g で動かない頂点。下の数が Fix(g)</text><text x="160" y="182" font-size="15" text-anchor="middle" fill="currentColor">和 6、6 ÷ 6 ＝ 1 軌道</text></svg>'
        explain: |-
          バーンサイドの補題は、{(g, x) | g·x = x} を 2 通りに数えます。g ごとに数えると Σ |Fix(g)|、x ごとに数えると Σ |Stab(x)|。軌道・安定化群の定理から、各軌道の寄与は |G| です。よって軌道の数 = (1/|G|) Σ |Fix(g)|。
          D3 の頂点：6 / 6 = 1。G = {e, s}：4 / 2 = 2。
        note: バーンサイドの補題は「固定点の数の平均が軌道の数」。数え上げの強力な道具。
