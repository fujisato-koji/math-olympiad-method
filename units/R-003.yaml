      - part: わけ
        text: D3 が頂点に作用します。x ∼ y を「y = g·x となる g がある」と決めます。1 ∼ 3（r² で 1 が 3 に移る）、3 ∼ 2（r² で 3 が 2 に移る）のとき、1 ∼ 2 となるわけを説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="160,56 201.6,128 118.4,128" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="56" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="160" y="61" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="201.6" cy="128" r="11" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="201.6" y="133" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="118.4" cy="128" r="11" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="118.4" y="133" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><path d="M186.4 44.6 A65.0 65.0 0 0 1 224.9 99.8" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="224.6,110.8 230.8,100.4 220.8,99.3" fill="currentColor"/><path d="M198.2 156.6 A65.0 65.0 0 0 1 131.2 162.3" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="121.8,156.6 127.8,167.1 133.6,159.0" fill="currentColor"/><path d="M95.4 110.8 A65.0 65.0 0 0 1 123.9 49.9" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="133.6,44.6 121.5,44.5 125.5,53.7" fill="currentColor"/></svg>'
        explain: 「r²·1 = 3、r²·3 = 2 なので、(r²r²)·1 = r²·(r²·1) = r²·3 = 2。r²r² = r⁴ = r なので r·1 = 2。よって 1 ∼ 2。一般には y = g·x、z = h·y なら z = h·(g·x) = (hg)·x なので x ∼ z（推移律）。」と書ければよい。① 作用の決まり (gh)·x = g·(h·x) を使う、② 続けて作用させた結果が 1 つの要素の作用になる、③ 1 ∼ 2 と結ぶ。子どもには、r² を 2 回続けた r⁴ が r になることも確かめさせます。
        hints:
