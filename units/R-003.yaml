  - day: 3
    items:
      - part: 見本
        id: "abe55cea2d"
        text: |-
          X の 2 つの要素 x、y について、y = g·x となる g ∈ G があるとき、x ∼ y と書きます。これは同値関係で、X は軌道に分かれます（軌道分解）。図では、同じ色の頂点が同じ軌道に入っています。
          D3 が 3 つの頂点に作用するとき、頂点はすべて 1 つの軌道に入ります。
          G = {e, s}（s は頂点 1 を固定し、2 と 3 を入れかえる《鏡映》）が 3 つの頂点に作用するとき、軌道は {1} と {2, 3} の 2 つです。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="80,52 114.6,112 45.4,112" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="80" cy="52" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="80" y="57" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="114.6" cy="112" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="114.6" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="45.4" cy="112" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="45.4" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><path d="M103.2 39.9 A57.0 57.0 0 0 1 136.8 87.0" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="136.7,98.0 142.8,87.5 132.9,86.5" fill="currentColor"/><path d="M113.5 138.1 A57.0 57.0 0 0 1 56.0 143.7" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="46.5,138.1 52.5,148.6 58.3,140.5" fill="currentColor"/><path d="M23.3 98.0 A57.0 57.0 0 0 1 47.3 45.3" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="56.8,39.9 44.7,39.8 48.8,49.0" fill="currentColor"/><text x="80" y="176" font-size="14" text-anchor="middle" fill="currentColor">D3：軌道は 1 つ</text><polygon points="240,52 274.6,112 205.4,112" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="240" y1="39" x2="240" y2="125" fill="none" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><circle cx="240" cy="52" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="240" y="57" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="274.6" cy="112" r="11" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="274.6" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="205.4" cy="112" r="11" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="205.4" y="117" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><text x="240" y="176" font-size="14" text-anchor="middle" fill="currentColor">{e, s}：軌道は 2 つ</text></svg>'
        explain: |-
          軌道分解：① x ∼ x（e·x = x）。② x ∼ y なら y ∼ x（y = g·x なら x = g⁻¹·y）。③ x ∼ y、y ∼ z なら x ∼ z（y = g·x、z = h·y なら z = (hg)·x）。よって ∼ は同値関係で、X は軌道に分かれます。
          D3 では、どの頂点も 120° 回転で他の頂点に移るので、軌道は 1 つです。G = {e, s} では、頂点 1 は動かず、2 と 3 は入れかわるので、軌道は {1} と {2, 3} の 2 つです。
        note: 軌道は、X を重なりなく分ける。作用する《群》が小さいほど、軌道は細かく分かれる。
