        text: D3 が 3 つの頂点に作用するとき、頂点 1 の安定化群が部分群であるわけを説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="160,52 201.6,124 118.4,124" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="160" y1="39" x2="160" y2="137" fill="none" stroke="#b39ddb" stroke-width="2" stroke-dasharray="6 4"/><circle cx="160" cy="52" r="11" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="160" y="57" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="201.6" cy="124" r="11" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="201.6" y="129" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="118.4" cy="124" r="11" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="118.4" y="129" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><text x="160" y="184" font-size="15" text-anchor="middle" fill="currentColor">Stab(1) = {e, s}</text></svg>'
        explain: 「Stab(1) = {e, s}（s は頂点 1 を通る鏡映）とする。① e ∈ Stab(1)。② s·s = e なので、2 つの積も Stab(1) に入る。③ e の逆元は e、s の逆元は s で、どちらも Stab(1) に入る。よって部分群。」と書ければよい。①〜③を、部分群の 3 つの条件に沿って示す。子どもには、s·s = e を図形の移動で確かめさせます。
