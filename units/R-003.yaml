        text: |-
          G が有限《群》で X に作用するとき、x ∈ X について
          |G| = |Orb(x)| × |Stab(x)|
          が成り立ちます（軌道・安定化群の定理）。
          図は、D3 の 6 つの移動を、頂点 1 の行き先で 3 つの組に分けたものです。
          D3 の頂点：|G| = 6、|Orb| = 3、|Stab| = 2 で、6 = 3 × 2。
          Z/4Z の頂点：|G| = 4、|Orb| = 4、|Stab| = 1 で、4 = 4 × 1。
