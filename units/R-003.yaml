        id: "d3959a78d1"
        text: |-
          G が X に作用し、H が G の《部分群》のとき、H も X に作用します（作用を H に制限する）。
          G の軌道は、H の軌道に細かく分かれます。
          図は、D3 の頂点への作用で、G = D3 全体、H = 回転だけ、H = {e, s} の 3 つの場合です。同じ色の頂点が同じ軌道です。
          ・G = D3 全体：軌道は {1, 2, 3} の 1 つ。
          ・H = {e, r, r²}（回転だけ）：軌道は {1, 2, 3} の 1 つ（回転で移り合う）。
