        explain: 「頂点 1 を同じ頂点へ移す移動 g、h を比べる。g⁻¹h は頂点 1 を動かさないので Stab(1) の要素で、h = g·(g⁻¹h)。よって 1 つの組は g·Stab(1) の形で、どの組も |Stab(1)| = 2 個。組の数は軌道の要素の数 |Orb(1)| = 4。8 つの移動はこの 4 組に分かれるので、8 = 4 × 2。」と書ければよい。① 組の個数が |Orb| ② 1 組の大きさが |Stab| ③ 全体は組の数 × 組の大きさ。子どもには、図の組ごとの個数を数えさせます。
