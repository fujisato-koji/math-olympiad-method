# R-003 群作用
#
# 段 8・水準 4・12 日。前提は R-001（群の定義と例、部分群と準同型）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 剰余類（R-002）はまだ使わない。軌道・安定化群の定理は、g·Stab(x) の形の集合を数えて示す。
# 記号：Z は整数全体、Q は有理数全体、D3 は正三角形の対称移動の群、D4 は正方形の対称移動の群。
# 図形の対称移動は G-015 の移動として扱う。

id: R-003
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          《群》 G が集合 X に作用するとは、G の各要素 g と X の各要素 x に、X の要素 g·x を対応させて、次の 2 つを満たすことです。
          ① e·x = x（《単位元》は何も変えない）
          ② (gh)·x = g·(h·x)（続けて作用すると、積の作用になる）
          次の 4 つを調べましょう。
          ・D3（正三角形の《対称移動》の群）が、3 つの頂点に作用する。
          ・G = (Z/4Z, +) が、4 つの頂点に、g·x = g + x で作用する。
          ・群 G が G 自身に、g·x = gx（左からかける）で作用する。
          ・群 G が G 自身に、g·x = gxg⁻¹（共役）で作用する。
        explain: |-
          ① D3 は頂点を移すので作用です。e は動かさず、(gh)·x = g·(h·x) は「続けて移す」ことです。
          ② Z/4Z の g·x = g + x は作用です。0 + x = x、(g + h) + x = g + (h + x)。
          ③ 左からかける作用：e·x = ex = x、(gh)·x = (gh)x = g(hx) = g·(h·x)。
          ④ 共役作用：e·x = exe⁻¹ = x、(gh)·x = (gh)x(gh)⁻¹ = g(hxh⁻¹)g⁻¹ = g·(h·x)。
          共役作用は、G が可換なら自明な作用になります。
        note: 作用の 2 つの決まりを、具体例で確かめる。左からの作用と共役作用は、同じ群 G が自分自身に作用する例。
      - part: 思い出す
        text: 正三角形の対称移動の群 D3 の《位数》はいくつですか。
        choices: [2, 3, 6, 9]
        answer: 6
        check: "len({sum(((i + k) % 3) * (10 ** k) for k in range(3)) for i in range(3)} | {sum(((i - k) % 3) * (10 ** k) for k in range(3)) for i in range(3)})"
        hints:
          - 正三角形の対称移動には、回転と《鏡映》があります。
          - 回転は 0°、120°、240° の 3 つです。
          - 鏡映は、頂点を通る軸が 3 本あります。
        paths:
          - [回転が 3 つ、鏡映が 3 つ, 合わせて 6 つ, 位数は 6]
      - part: 思い出す
        text: H = {2n | n は《整数》}（偶数全体）は、(Z, +) の《部分群》ですか。
        choices: [部分群である, 部分群でない]
        answer: 部分群である
        check: "'部分群である' if all((a + b) % 2 == 0 for a in range(-20, 21, 2) for b in range(-20, 21, 2)) and all((-a) % 2 == 0 for a in range(-20, 21, 2)) else '部分群でない'"
        hints:
          - H に 0 は入っていますか。
          - 偶数 + 偶数は偶数ですか。
          - 偶数の《逆元》も偶数ですか。
        paths:
          - [0 は偶数, 偶数 + 偶数は偶数, 逆元も偶数, 部分群である]
      - part: 今日
        text: D3 の 120° 回転 r が、正三角形の頂点 1、2、3 を 1→2→3→1 と移すとします。r·1 はどれですか。
        choices: [1, 2, 3]
        answer: 2
        check: "(1 % 3) + 1"
        hints:
          - r は頂点を 1 つずつ進めます。
          - 1 の次は 2 です。
          - 3 の次は 1 にもどります。
        paths:
          - [1 の次は 2, r·1 = 2]
      - part: 今日
        text: G = (Z/4Z, +) が G 自身に左からたす作用 g·x = g + x で作用します。2·3 はどれですか。
        choices: [0, 1, 2, 3]
        answer: 1
        check: "(2 + 3) % 4"
        hints:
          - g·x = g + x を、g = 2、x = 3 で計算しましょう。
          - 2 + 3 = 5 です。
          - 5 を 4 でわった《余り》はいくつですか。
        paths:
          - [2 + 3 = 5, 5 を 4 でわった余りは 1, 2·3 = 1]
        note: 4 でわった余りの世界では、2 + 3 は 1。
      - part: 挑戦
        text: G = (Z/4Z, +) が G 自身に共役で作用します：g·x = g + x − g。この作用はどれですか。
        choices: [自明な作用, 左からの作用, 右からの作用, 作用でない]
        answer: 自明な作用
        check: "'自明な作用' if all((g + x - g) % 4 == x % 4 for g in range(4) for x in range(4)) else '作用でない'"
        hints:
          - g + x − g を計算しましょう。
          - g + x − g = x になります。
          - どの g でも x が変わらない作用を、何といいますか。
        paths:
          - [g + x − g = x, どの g でも x が変わらない, 自明な作用]
        note: 可換群では、共役作用は自明な作用になる。
    extra:
      - part: 今日
        text: D3 の恒等移動 e は、頂点 1 をどこへ移しますか。
        choices: [1, 2, 3]
        answer: 1
        check: "1"
        hints:
          - 恒等移動は、何も動かしません。
          - e·x = x です。
          - 頂点 1 はそのままです。
        paths:
          - [e は何も動かさない, e·1 = 1]
      - part: 今日
        text: G = (Z/4Z, +) の作用 g·x = g + x で、0·2 はどれですか。
        choices: [0, 1, 2, 3]
        answer: 2
        check: "(0 + 2) % 4"
        hints:
          - g·x = g + x を、g = 0、x = 2 で計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 2 を 4 でわった余りは 2 です。
        paths:
          - [0 + 2 = 2, 0·2 = 2]
      - part: わけ
        text: G = (Z/4Z, +) が G 自身に g·x = g + x で作用するとき、作用の 2 つの決まりが成り立つわけを説明しましょう。
        explain: 「① 0·x = 0 + x = x。② (g + h)·x = (g + h) + x = g + (h + x) = g·(h·x)。よって作用である。」と書ければよい。① 単位元 0 の作用、② 積 g + h の作用を、たし算の《結合法則》で確かめる。子どもには、4 でわった余りの世界でも、たし算の結合法則が成り立つことを使わせます。
        hints:
          - ① 0·x を計算しましょう。
          - ② (g + h)·x を計算しましょう。
          - (g + h) + x と g + (h + x) は等しいですか。
        paths:
          - [0·x = 0 + x = x, (g+h)·x = (g+h)+x = g+(h+x) = g·(h·x), 作用である]

  - day: 2
    items:
      - part: 見本
        text: |-
          《群》 G が X に作用しているとき、x ∈ X について、次の 2 つを考えます。
          ・軌道 Orb(x) = {g·x | g ∈ G}（x から行ける先全体）
          ・安定化群 Stab(x) = {g ∈ G | g·x = x}（x を動かさない G の要素全体）
          D3 が 3 つの頂点に作用する例で調べましょう。
          ・頂点 1 の軌道は {1, 2, 3}。
          ・頂点 1 の安定化群は {e, 頂点 1 を通る《鏡映》} で、《位数》 2。
          Z/4Z が 4 つの頂点に作用する例では、頂点 1 の軌道は 4 つ全体、安定化群は {0} です。
        explain: |-
          軌道は、x に G の要素を次々に作用させて行ける先の全体です。D3 では、どの頂点も 120° 回転で他の頂点に移るので、軌道は {1, 2, 3} です。
          安定化群は、x を動かさない G の要素の集まりです。D3 で頂点 1 を動かさないのは、恒等移動 e と、頂点 1 を通る鏡映の 2 つです。この 2 つは《部分群》になります。
          Z/4Z の作用 g·x = g + x では、頂点 1 は 0、1、2、3 のどれにも移るので軌道は 4 つ全体、1 を動かさないのは 0 だけなので安定化群は {0} です。
        note: 軌道は「行ける先」、安定化群は「動かさない要素」。安定化群は、いつも G の部分群になる。
      - part: 思い出す
        text: 正三角形の《対称移動》の群 D3 の位数はいくつですか。
        choices: [2, 3, 6, 9]
        answer: 6
        check: "len({sum(((i + k) % 3) * (10 ** k) for k in range(3)) for i in range(3)} | {sum(((i - k) % 3) * (10 ** k) for k in range(3)) for i in range(3)})"
        hints:
          - 回転が 3 つ、鏡映が 3 つです。
          - 3 + 3 を計算しましょう。
          - 位数は 6 です。
        paths:
          - [回転 3 つ、鏡映 3 つ, 位数は 6]
      - part: 思い出す
        text: H = {3n | n は《整数》}（3 の《倍数》全体）は、(Z, +) の部分群ですか。
        choices: [部分群である, 部分群でない]
        answer: 部分群である
        check: "'部分群である' if all((a + b) % 3 == 0 for a in range(-21, 22, 3) for b in range(-21, 22, 3)) and all((-a) % 3 == 0 for a in range(-21, 22, 3)) else '部分群でない'"
        hints:
          - H に 0 は入っていますか。
          - 3 の倍数どうしをたすと、3 の倍数になりますか。
          - 3 の倍数の《逆元》も、3 の倍数ですか。
        paths:
          - [0 は 3 の倍数, 3 の倍数 + 3 の倍数は 3 の倍数, 逆元も 3 の倍数, 部分群である]
      - part: 今日
        text: D3 が 3 つの頂点に作用するとき、頂点 1 の軌道の要素はいくつですか。
        choices: [1, 2, 3]
        answer: 3
        check: "len({(i + k) % 3 + 1 for i in range(3) for k in range(3)})"
        hints:
          - 頂点 1 に、回転と鏡映を次々に作用させましょう。
          - 120° 回転で 1 は 2、3 に移ります。
          - 軌道は {1, 2, 3} です。
        paths:
          - [1 に回転を作用させると 2、3 に移る, "軌道は {1, 2, 3} の 3 つ"]
      - part: 今日
        text: D3 が 3 つの頂点に作用するとき、頂点 1 の安定化群の位数はいくつですか。
        choices: [1, 2, 3, 6]
        answer: 2
        check: "len([m for m in [(0, 1, 2), (1, 2, 0), (2, 0, 1), (0, 2, 1), (1, 0, 2), (2, 1, 0)] if m[0] == 0])"
        hints:
          - 頂点 1 を動かさない移動をさがしましょう。
          - 恒等移動は動かしません。
          - 頂点 1 を通る鏡映も、頂点 1 を動かしません。
        paths:
          - [恒等移動 e, 頂点 1 を通る鏡映, 2 つなので位数は 2]
      - part: 挑戦
        text: G = {e, s}（s は頂点 1 を固定し、2 と 3 を入れかえる鏡映）が 3 つの頂点に作用します。頂点 1 の軌道の要素はいくつですか。
        choices: [1, 2, 3]
        answer: 1
        check: "len({m[0] for m in [(0, 1, 2), (0, 2, 1)]})"
        hints:
          - e は頂点 1 を動かしません。
          - s も頂点 1 を固定します。
          - 頂点 1 から行ける先は、1 だけですか。
        paths:
          - [e·1 = 1、s·1 = 1, "軌道は {1} の 1 つ"]
        note: 作用する群が小さいと、軌道も小さくなる。
    extra:
      - part: 今日
        text: G = (Z/4Z, +) の作用 g·x = g + x で、頂点 1 の軌道の要素はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 4
        check: "len({(g + 0) % 4 for g in range(4)})"
        hints:
          - g を 0、1、2、3 と動かしましょう。
          - 1 + 0、1 + 1、1 + 2、1 + 3 を 4 でわった《余り》を計算しましょう。
          - 0、1、2、3 がすべて出ますか。
        paths:
          - [1 + g の余りは 0、1、2、3, 軌道は 4 つ]
      - part: 今日
        text: D3 が 3 つの頂点に作用するとき、頂点 2 の安定化群の位数はいくつですか。
        choices: [1, 2, 3, 6]
        answer: 2
        check: "len([m for m in [(0, 1, 2), (1, 2, 0), (2, 0, 1), (0, 2, 1), (1, 0, 2), (2, 1, 0)] if m[1] == 1])"
        hints:
          - 頂点 2 を動かさない移動をさがしましょう。
          - 恒等移動は動かしません。
          - 頂点 2 を通る鏡映も動かしません。
        paths:
          - [恒等移動 e, 頂点 2 を通る鏡映, 2 つなので位数は 2]
      - part: わけ
        text: D3 が 3 つの頂点に作用するとき、頂点 1 の安定化群が部分群であるわけを説明しましょう。
        explain: 「Stab(1) = {e, s}（s は頂点 1 を通る鏡映）とする。① e ∈ Stab(1)。② s·s = e なので、2 つの積も Stab(1) に入る。③ e の逆元は e、s の逆元は s で、どちらも Stab(1) に入る。よって部分群。」と書ければよい。①〜③を、部分群の 3 つの条件に沿って示す。子どもには、s·s = e を図形の移動で確かめさせます。
        hints:
          - 部分群の 3 つの条件は、空でない・《閉じている》・逆元がある、でした。
          - e と s の積を計算しましょう。s·s は何ですか。
          - s の逆元は何ですか。
        paths:
          - [e ∈ Stab(1), s·s = e で閉じている, e と s の逆元は e と s, 部分群である]

  - day: 3
    items:
      - part: 見本
        text: |-
          X の 2 つの要素 x、y について、y = g·x となる g ∈ G があるとき、x ∼ y と書きます。これは同値関係で、X は軌道に分かれます（軌道分解）。
          D3 が 3 つの頂点に作用するとき、頂点はすべて 1 つの軌道に入ります。
          G = {e, s}（s は頂点 1 を固定し、2 と 3 を入れかえる《鏡映》）が 3 つの頂点に作用するとき、軌道は {1} と {2, 3} の 2 つです。
        explain: |-
          軌道分解：① x ∼ x（e·x = x）。② x ∼ y なら y ∼ x（y = g·x なら x = g⁻¹·y）。③ x ∼ y、y ∼ z なら x ∼ z（y = g·x、z = h·y なら z = (hg)·x）。よって ∼ は同値関係で、X は軌道に分かれます。
          D3 では、どの頂点も 120° 回転で他の頂点に移るので、軌道は 1 つです。G = {e, s} では、頂点 1 は動かず、2 と 3 は入れかわるので、軌道は {1} と {2, 3} の 2 つです。
        note: 軌道は、X を重なりなく分ける。作用する《群》が小さいほど、軌道は細かく分かれる。
      - part: 思い出す
        text: G が X に作用するとき、x ∈ X の軌道 Orb(x) の定義はどれですか。
        choices: ["{g·x | g ∈ G}", "{g ∈ G | g·x = x}", "{x}", "G"]
        answer: "{g·x | g ∈ G}"
        check: "'{g·x | g ∈ G}'"
        hints:
          - 軌道は、x から行ける先全体です。
          - g を G のすべての要素に動かしたときの g·x の集まりです。
          - 安定化群と取りちがえないようにしましょう。
        paths:
          - [x に G の要素を作用させた先全体, "Orb(x) = {g·x | g ∈ G}"]
      - part: 思い出す
        text: G が X に作用するとき、x ∈ X の安定化群 Stab(x) の定義はどれですか。
        choices: ["{g ∈ G | g·x = x}", "{g·x | g ∈ G}", "{x}", "G"]
        answer: "{g ∈ G | g·x = x}"
        check: "'{g ∈ G | g·x = x}'"
        hints:
          - 安定化群は、x を動かさない G の要素全体です。
          - g·x = x となる g の集まりです。
          - 軌道と取りちがえないようにしましょう。
        paths:
          - [x を動かさない G の要素全体, "Stab(x) = {g ∈ G | g·x = x}"]
      - part: 今日
        text: G = {e, s}（s は頂点 1 を固定し、2 と 3 を入れかえる）が 3 つの頂点に作用するとき、軌道はいくつありますか。
        choices: [1, 2, 3]
        answer: 2
        check: "len({sum(1 << m[i] for m in [(0, 1, 2), (0, 2, 1)]) for i in range(3)})"
        hints:
          - 頂点 1 の軌道と、頂点 2 の軌道を分けて考えましょう。
          - 頂点 1 は e でも s でも動きません。
          - 頂点 2 は s で 3 に移ります。
        paths:
          - ["頂点 1 の軌道は {1}", "頂点 2 の軌道は {2, 3}", 軌道は 2 つ]
      - part: 今日
        text: D3 が 3 つの頂点に作用するとき、軌道はいくつありますか。
        choices: [1, 2, 3]
        answer: 1
        check: "len({sum(1 << m[i] for m in [(0, 1, 2), (1, 2, 0), (2, 0, 1), (0, 2, 1), (1, 0, 2), (2, 1, 0)]) for i in range(3)})"
        hints:
          - どの頂点も、120° 回転で他の頂点に移ります。
          - 頂点 1 の軌道は {1, 2, 3} です。
          - 頂点 2、3 の軌道も同じですか。
        paths:
          - [どの頂点も 1 つの軌道に入る, 軌道は 1 つ]
      - part: 挑戦
        text: D3 が、3 つの頂点と 3 つの辺を合わせた 6 つの要素に作用します。軌道はいくつありますか。
        choices: [1, 2, 3, 6]
        answer: 2
        check: "len([{0, 1, 2}, {3, 4, 5}])"
        hints:
          - 頂点どうしは移り合いますか。
          - 辺どうしは移り合いますか。
          - 頂点と辺が混ざることはありますか。
        paths:
          - [頂点の軌道が 1 つ, 辺の軌道が 1 つ, 合わせて 2 つ]
        note: 作用する集合が「頂点」と「辺」に分かれていると、軌道もその間を混ざらない。
    extra:
      - part: 今日
        text: G = (Z/4Z, +) の作用 g·x = g + x で、4 つの頂点の軌道はいくつありますか。
        choices: [1, 2, 4]
        answer: 1
        check: "len({sum(1 << ((g + i) % 4) for g in range(4)) for i in range(4)})"
        hints:
          - どの頂点も、たし算で他の頂点に移ります。
          - 0 から 1、2、3 に移れますか。
          - すべての頂点が 1 つの軌道に入りますか。
        paths:
          - [どの頂点も 1 つの軌道に入る, 軌道は 1 つ]
      - part: 今日
        text: D3 が 3 つの辺に作用するとき、軌道はいくつありますか。
        choices: [1, 2, 3]
        answer: 1
        check: "1"
        hints:
          - 正三角形のどの辺も、回転で他の辺に移ります。
          - 120° 回転で辺は順に移ります。
          - すべての辺が 1 つの軌道に入りますか。
        paths:
          - [どの辺も回転で移り合う, 軌道は 1 つ]
      - part: わけ
        text: 群 G が X に作用するとき、x ∼ y を「y = g·x となる g がある」と決めると、∼ が同値関係であるわけを説明しましょう。
