            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="98" r="52" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="160" cy="46" r="12" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="160" y="51" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">0</text><circle cx="212" cy="98" r="12" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="212" y="103" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><circle cx="160" cy="150" r="12" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="160" y="155" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><circle cx="108" cy="98" r="12" fill="#c8ccd6" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="108" y="103" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><circle cx="160" cy="150" r="19" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - 0 + 2 を 4 でわった余りを考えましょう。
        paths:
          - [0 + 2 = 2, 0·2 = 2]
      - part: わけ
        id: "e51c3b2f69"
        text: G = (Z/4Z, +) が G 自身に g·x = g + x で作用するとき、作用の 2 つの決まりが成り立つわけを説明しましょう。
        explain: 「① 0·x = 0 + x = x。② (g + h)·x = (g + h) + x = g + (h + x) = g·(h·x)。よって作用である。」と書ければよい。① 単位元 0 の作用、② 積 g + h の作用を、たし算の《結合法則》で確かめる。子どもには、4 でわった余りの世界でも、たし算の結合法則が成り立つことを使わせます。
        hints:
          - ① 0·x を計算しましょう。
          - ② (g + h)·x を計算しましょう。
          - (g + h) + x と g + (h + x) は等しいですか。
        paths:
          - [0·x = 0 + x = x, (g+h)·x = (g+h)+x = g+(h+x) = g·(h·x), 作用である]
