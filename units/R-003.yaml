      - part: わけ
        id: "3a75942130"
        text: 群 G が X に作用するとき、x ∼ y を「y = g·x となる g がある」と決めると、∼ が同値関係であるわけを説明しましょう。
        explain: 「① 反射律：e·x = x なので x ∼ x。② 対称律：x ∼ y なら y = g·x で、x = g⁻¹·y なので y ∼ x。③ 推移律：x ∼ y、y ∼ z なら y = g·x、z = h·y で、z = (hg)·x なので x ∼ z。」と書ければよい。①〜③を、作用の 2 つの決まり（e·x=x、(gh)·x=g·(h·x)）で示す。子どもには、《逆元》 g⁻¹ と積 hg を使わせます。
        hints:
          - 反射律は、e·x = x から。
          - 対称律は、y = g·x から x = g⁻¹·y を出します。
          - text: 推移律は、図のように x から y、y から z へ進みます。z を x から直接作るには、どんな要素を作用させますか。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="70" r="16" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="50" y="75" font-size="15" text-anchor="middle" fill="currentColor">x</text><line x1="70" y1="70" x2="130" y2="70" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="140,70 130,75 130,65" fill="currentColor"/><text x="105" y="58" font-size="15" text-anchor="middle" fill="currentColor">g</text><circle cx="160" cy="70" r="16" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="160" y="75" font-size="15" text-anchor="middle" fill="currentColor">y</text><line x1="180" y1="70" x2="240" y2="70" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,70 240,75 240,65" fill="currentColor"/><text x="215" y="58" font-size="15" text-anchor="middle" fill="currentColor">h</text><circle cx="270" cy="70" r="16" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="270" y="75" font-size="15" text-anchor="middle" fill="currentColor">z</text><path d="M54 90 Q160 140 257 94.3" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="266,90 259.1,98.8 254.8,89.7" fill="currentColor"/><text x="160" y="160" font-size="14" text-anchor="middle" fill="currentColor">直接 x から z へ</text></svg>'
        paths:
          - [e·x=x で反射律, y=g·x なら x=g⁻¹·y で対称律, z=h·y=h·(g·x)=(hg)·x で推移律, 同値関係である]
