      - part: わけ
        id: "98b3af3d83"
        text: 群 G が G 自身に共役で作用するとき、x の安定化群が中心化群 C_G(x) = {g ∈ G | gx = xg} になるわけを説明しましょう。
        explain: 「g·x = x は gxg⁻¹ = x と同じ。両辺に右から g をかけると gx = xg。よって、x を動かさない g は、x と可換な g 全体になる。」と書ければよい。① g·x = x を gxg⁻¹ = x と書く、② 右から g をかけて gx = xg にする、③ 中心化群の定義と結ぶ。子どもには、g⁻¹ をかける操作を丁寧に確かめさせます。
        hints:
          - g·x = x を、共役の定義で書きましょう。
          - gxg⁻¹ = x の両辺に、右から g をかけましょう。
          - gx = xg となる g の集まりは、何といいますか。
        paths:
          - [g·x = x は gxg⁻¹ = x, 右から g をかけて gx = xg, 中心化群 C_G(x)]
  - day: 6
    items:
      - part: 見本
        id: "1cb9132255"
        text: |-
          《群》 G の中心 Z(G) = {z ∈ G | すべての g ∈ G で gz = zg}。
          中心の要素は、自分だけの共役類に入ります。
          類等式：G が有限群のとき、
          |G| = |Z(G)| + Σ |G| / |C_G(x_i)|
          ここで x_i は中心にない共役類の代表を 1 つずつ選びます。
          図は、D3 の共役類を、中心と中心でない類に分けたものです。
          D3 の例：中心は {e} で |Z(D3)| = 1。中心でない共役類は {r, r²}（大きさ 2）と {s, sr, sr²}（大きさ 3）。類等式は 6 = 1 + 2 + 3。
          Z/4Z の例：可換なので中心は全体、類等式は 4 = 4。
