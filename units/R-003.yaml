  - day: 5
    items:
      - part: 見本
        id: "41e963b814"
        text: |-
          《群》 G が G 自身に共役で作用するとき、g·x = gxg⁻¹ です。
          ・この作用の軌道を共役類といいます。x の共役類は {gxg⁻¹ | g ∈ G}。
          ・この作用の安定化群を中心化群といいます。C_G(x) = {g ∈ G | gx = xg}。
          ・G が可換なら、すべての共役類は 1 つの要素だけです。
          図は、D3 の 6 つの要素を、共役類ごとに囲んだものです。
          ・e の共役類は {e}。
          ・回転 r の共役類は {r, r²}。
          ・《鏡映》 s の共役類は {s, sr, sr²}（3 つ）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="40" font-size="15" text-anchor="middle" fill="currentColor">共役類ごとに囲む</text><rect x="10.5" y="73" width="52" height="46" rx="8" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><rect x="72.5" y="73" width="93" height="46" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><rect x="175.5" y="73" width="134" height="46" rx="8" fill="#7bc96f" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><rect x="18.5" y="83" width="36" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="36.5" y="101" font-size="14" text-anchor="middle" fill="currentColor">e</text><rect x="80.5" y="83" width="36" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="98.5" y="101" font-size="14" text-anchor="middle" fill="currentColor">r</text><rect x="121.5" y="83" width="36" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="139.5" y="101" font-size="14" text-anchor="middle" fill="currentColor">r²</text><rect x="183.5" y="83" width="36" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="201.5" y="101" font-size="14" text-anchor="middle" fill="currentColor">s</text><rect x="224.5" y="83" width="36" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="242.5" y="101" font-size="14" text-anchor="middle" fill="currentColor">sr</text><rect x="265.5" y="83" width="36" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="283.5" y="101" font-size="14" text-anchor="middle" fill="currentColor">sr²</text><text x="36.5" y="139" font-size="14" text-anchor="middle" fill="currentColor">1 つ</text><text x="119" y="139" font-size="14" text-anchor="middle" fill="currentColor">2 つ</text><text x="242.5" y="139" font-size="14" text-anchor="middle" fill="currentColor">3 つ</text></svg>'
        explain: |-
          共役作用：e·x = exe⁻¹ = x、(gh)·x = (gh)x(gh)⁻¹ = g(hxh⁻¹)g⁻¹。作用です。
          D3 の関係：srs⁻¹ = r² なので、r と r² は共役です。鏡映どうしも共役で、3 つの鏡映が 1 つの共役類になります。中心（すべての要素と可換な要素）は e だけです。
          Z/4Z は可換なので、各要素の共役類は 1 つずつ（4 つの共役類）です。
        note: 共役類は「形が同じ要素」をまとめたもの。回転どうし、鏡映どうしがそれぞれ 1 つの類になる。
      - part: 思い出す
