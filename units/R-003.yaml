      - part: わけ
        id: "4b1cd98076"
        text: G の作用を部分群 H に制限すると、G の軌道が H の軌道に分かれるわけを説明しましょう。
        explain: 「H の要素は G の要素でもあるので、H の作用は G の作用の一部。x から H で行ける先は、G で行ける先に含まれる。よって H の軌道は G の軌道の中に入る。G の軌道の要素は、H の軌道に重なりなく分かれる。」と書ければよい。① H の作用が G の作用の一部、② H の軌道が G の軌道に含まれる、③ 軌道分解で分かれる、の 3 つ。子どもには、D3 と {e,s} の例で確かめさせます。
        hints:
