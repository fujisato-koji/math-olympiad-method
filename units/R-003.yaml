      - part: わけ
        id: "9860c59075"
        text: G が有限群で X に作用するとき、|G| = |Orb(x)| × |Stab(x)| が成り立つわけを説明しましょう。
        explain: 「f：G → Orb(x) を f(g) = g·x と決める。f は全射。y = g·x となる g を 1 つ選ぶと、f(h) = y となる h は g·s（s ∈ Stab(x)）の形で、その個数は |Stab(x)| 個。よって、Orb(x) の各要素に |Stab(x)| 個ずつ g が対応し、|G| = |Orb(x)| × |Stab(x)|。」と書ければよい。① f が全射、② 1 つの y に写る g の個数が |Stab(x)|、③ 全体の個数を数える、の 3 つ。子どもには、g·s の形の集合を数えさせます。
        hints:
          - f(g) = g·x は、G から Orb(x) への全射です。
