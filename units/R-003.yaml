        explain: 「{(g, x) | g·x = x} を 2 通りに数える。g ごとに数えると Σ |Fix(g)|。x ごとに数えると Σ |Stab(x)|。x の軌道を Orb(x) とすると、軌道・安定化群の定理から |Orb(x)| × |Stab(x)| = |G|。よって x ごとの寄与の和は、軌道の数 × |G|。両方の数え方が等しいので、軌道の数 = (1/|G|) Σ |Fix(g)|。」と書ければよい。① 2 通りの数え方、② 軌道ごとに |G| になること、③ 割って結論。子どもには、x ごとの寄与が |Stab(x)| であることを確かめさせます。
        hints:
