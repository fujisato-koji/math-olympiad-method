        explain: 「頂点 1 を同じ場所へ移す 2 つの移動 g、h を比べる。g⁻¹h は頂点 1 を動かさないので、Stab(1) = {e, s} の要素。よって h = g·e または h = g·s。どの組にも、このように 2 つずつ入る。」と書ければよい。① g⁻¹h が頂点 1 を動かさないこと、② h が g と Stab(1) の要素の積になること、③ 組の大きさが |Stab(1)| = 2 になること。子どもには、g⁻¹·(h·1) を計算させます。
