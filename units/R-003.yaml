        explain: 「① e ∈ Stab(x)：e·x = x。② g、h ∈ Stab(x) なら (gh)·x = g·(h·x) = g·x = x なので gh ∈ Stab(x)。③ g ∈ Stab(x) なら g·x = x で、両辺に g⁻¹ を作用させると x = g⁻¹·x なので g⁻¹ ∈ Stab(x)。よって部分群。」と書ければよい。①〜③を、部分群の 3 つの条件に沿って示す。子どもには、g⁻¹ を作用させる操作を確かめさせます。
