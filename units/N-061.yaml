      - part: 挑戦
        text: 四捨五入して百の位までのがい数にすると 500 になる《整数》のうち、いちばん小さい数はいくつですか。
        answer: 450
        check: "min(n for n in range(1000) if (n + 50) // 100 * 100 == 500)"
        hints:
          - 500 より小さい数で、500 になるのはどんな数かな。
          - 400 と 500 のちょうどまん中の数はいくつかな。
          - まん中の数は、四捨五入すると切り上げるかな、切り捨てるかな。
        paths:
