        explain: 286 を百の位までのがい数にすると 300、417 は 400 です。300 + 400 = 700 なので、286 + 417 はおよそ 700 です（くわしく計算すると 703）。かけ算も見積もれます。38 × 7 は、38 を上から 1 けたのがい数にして 40 × 7 と考えます。40 は 10 が 4 こなので、40 × 7 は 10 が 4 × 7 = 28 こで 280。38 × 7 はおよそ 280 です（くわしくは 266）。見積もりは、くわしく計算する前におよその大きさをつかむことで、答えのまちがいに気づくのにも使えます。
