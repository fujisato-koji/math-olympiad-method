# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 道筋]
    text: 2 つの《整数》があります。それぞれを四捨五入して十の位までのがい数にすると、40 と 70 になります。もとの 2 つの整数の差として考えられる、いちばん大きい数はいくつですか。
    answer: 39
    check: "max(b - a for a in range(30, 50) for b in range(60, 80) if (a + 5) // 10 * 10 == 40 and (b + 5) // 10 * 10 == 70)"
    hints:
      - 十の位までのがい数が 40 になる整数は、いくつからいくつまでかな。70 になる整数はどうかな。
      - 差を大きくするには、大きいほうの数をできるだけ大きく、小さいほうの数をできるだけ小さくしよう。
      - 70 になる整数でいちばん大きいのはいくつかな。75 は入るかな。
    paths:
      - [40 になるのは 35 以上 45 未満で 35 から 44 まで, 70 になるのは 65 から 74 まで, 差がいちばん大きいのは 74 − 35, 39]
    note: がい数どうしの差（70 − 40 = 30）ではなく、もとの数のはんい（以上・未満）から考える。大きいほうはいちばん大きく、小さいほうはいちばん小さくとる、という組み合わせの判断が要る。75 や 45 を入れるまちがいに気をつける。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [N-060]
    text: 1 さつ 88 円のノートを 8 さつと、1 本 63 円のペンを 3 本買います。1000 円で買えますか。くわしく計算しないで、見積もって考えましょう。
    choices: [買える, 買えない]
    answer: 買える
    check: "'買える' if 88 * 8 + 63 * 3 <= 1000 else '買えない'"
    hints:
      - 足りるかどうかを調べるときは、本当の代金より少なく見積もってはいけないね。
      - 88 円を 90 円、63 円を 70 円とすると、本当の代金より多いかな、少ないかな。
      - 多めに見積もった代金が 1000 円以下なら、本当の代金も 1000 円以下だね。
    paths:
      - [88 円は 90 円より安い、63 円は 70 円より安い, 90 × 8 = 720、70 × 3 = 210, 多めに見積もっても 720 + 210 = 930 円, 1000 円以下なので買える]
    note: 四捨五入で 63 円を 60 円にすると少なめになり、足りるかどうかの判断には使えない。「足りるか」は多めに見積もる、という見積もりの向きの判断が道筋の要点（お金の計算、N-060）。90 × 8 は「10 が 9 × 8 = 72 こ」で計算できる。
  - part: 離
    kinds: [手数, 読み取り]
    text: 2 けたの整数があります。この整数を四捨五入して十の位までのがい数にすると 70 になります。また、この整数の十の位の数字と一の位の数字を入れかえた数を、四捨五入して十の位までのがい数にすると 40 になります。もとの整数はいくつですか。
    answer: 73
    check: "[k for k in range(10, 100) if (k + 5) // 10 * 10 == 70 and ((k % 10) * 10 + k // 10 + 5) // 10 * 10 == 40][0]"
    hints:
      - はじめに、十の位までのがい数が 70 になる 2 けたの整数を、ぜんぶ書き出そう。
      - 入れかえた数のがい数が 40 になるには、入れかえた数は 35 から 44 までのどれかだね。
      - 入れかえた数の十の位は、もとの数の一の位だね。もとの数の一の位は何かな。
    paths:
      - [70 になるのは 65 から 74 まで, 入れかえた数は 35 から 44 までなので、もとの数の一の位は 3 か 4, 65 から 74 で一の位が 3 か 4 なのは 73 と 74, 入れかえると 37 と 47 で、40 になるのは 37 なので 73]
    note: 2 つの条件を順に読み取って候補をしぼる。入れかえた数の十の位が、もとの数の一の位になることを読みかえられるかがポイント。74 を入れかえた 47 は 50 になる。
