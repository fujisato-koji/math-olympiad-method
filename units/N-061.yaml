      - part: わけ
        text: 四捨五入で十の位までのがい数にするとき、一の位が 0〜4 なら切り捨て、5〜9 なら切り上げます。このきまりのわけを、40 から 50 までの数を例にして文に書きましょう。
        explain: 例：「41、42、43、44 は 40 のほうが近く、46、47、48、49 は 50 のほうが近い。だから、近いほうのがい数にすると、一の位が 1〜4 なら切り捨て、6〜9 なら切り上げになる。45 は 40 と 50 のちょうどまん中で、どちらにも 5 はなれているので、どちらにするかを決めておかないと人によって答えがちがう。そこで 5 は切り上げると決めている。」と書ければよい。「近いほうにする」がもとのきまりで、5 のときだけは決めごとであることが書けていればよい。「0〜4 の 5 つと 5〜9 の 5 つで半分ずつになる」と書けたら、なおよい。
        hints:
          - 43 は、40 と 50 のどちらに近いかな。47 はどうかな。
          - 45 は、40 と 50 から、それぞれいくつはなれているかな。
          - 「〜は 40 に近い。〜は 50 に近い。45 はまん中なので〜。だから〜。」と書いてみよう。
        paths:
          - [1〜4 は 40 に近い, 6〜9 は 50 に近い, 45 はまん中なので決めごとで切り上げる]
      - part: わけ
        text: 四捨五入して百の位までのがい数にすると 300 になる整数は、250 から 349 までです。250 は入り、350 は入らないわけを、数の線を使って文に書きましょう。このはんいを「250 以上 350 未満」と言います（以上はその数をふくみ、未満はその数をふくみません）。
        figure: 200 ─ 250 ─ 300 ─ 350 ─ 400
        explain: 例：「百の位までのがい数にするときは十の位を見る。250 は十の位が 5 なので切り上げて 300、249 は十の位が 4 なので切り捨てて 200。349 は十の位が 4 なので切り捨てて 300、350 は十の位が 5 なので切り上げて 400。だから 300 になるのは 250 から 349 まで。数の線では、200 と 300 のまん中の 250 から、300 と 400 のまん中の 350 の手前まで。」と書ければよい。はしの数（249 と 250、349 と 350）を実際に四捨五入して確かめていれば、なおよい。「以上」と「未満」のちがい（はしをふくむか）を言えるかもたずねる。
        hints:
          - 250 と 249 を、それぞれ百の位までのがい数にしてみよう。
          - 349 と 350 を、それぞれ百の位までのがい数にしてみよう。
          - 「〜は 300 になる。〜は 400 になる。だから〜。」と書いてみよう。
        paths:
          - [249 は 200、250 は 300, 349 は 300、350 は 400, だから 250 から 349 まで]
      - part: わけ
        text: ある人が 289 + 403 を計算して、592 と答えました。見積もりを使うと、この答えがまちがいだと気づけます。そのわけを文に書きましょう。
        explain: 例：「289 を百の位までのがい数にすると 300、403 は 400。300 + 400 = 700 なので、答えはおよそ 700 になるはず。592 は 700 から 100 以上はなれていて、およその大きさが合わないので、計算がまちがっていると考えられる。」と書ければよい。くわしい答え（692）を出すことは求めない。見積もりで分かるのは「まちがっていそうだ」ということで、くわしい答えまでは分からないことにも触れる。
        hints:
