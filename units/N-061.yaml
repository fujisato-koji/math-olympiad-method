# N-061 概数と見積もり（四捨五入）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く（「概」は小学校で習わないので「がい数」と書く）。
# 前提は N-009（1000 までの数と位）と N-013（九九）。数は 1000 まで。
#   たし算とひき算は N-009 の「何百 ± 何百」の形にして見積もるだけで、3 けたどうしのくわしい計算はさせない（見積もりの答えを打つ）。
#   かけ算の見積もりは、2 けたの数を上から 1 けたのがい数（何十）にして「何十 × 1 けた」にする。40 × 7 は「10 が 4 × 7 = 28 こで 280」と、
#   N-009 の「10 が何こ」と N-013 の九九でつくる（2 日目の見本）。
# わり算（N-014）、小数（N-020）、お金（N-060）、長さの単位（G-046）は前提にないので使わない。場面は、こ数、まい数、人数にした。
# 四捨五入は「十の位までのがい数」（一の位を四捨五入する）と「百の位までのがい数」（十の位を四捨五入する）。上から 1 けたのがい数は 2 けたの数だけ。
#   四捨五入の説明の中で「切り捨てる・切り上げる」の言葉は使うが、切り捨て・切り上げを別の丸め方としては扱わない。
# 「以上」「未満」は 3 日目に、四捨五入して同じがい数になる整数のはんい（上と下のはし）で出す。小数のがい数と有効数字は N-070。
# check：十の位までは (n + 5) // 10 * 10、百の位までは (n + 50) // 100 * 100 で計算する（round は使えない）。はんいの問題は range で全部の整数を調べる。
# 日の並び（既定）：1 日目 四捨五入、2 日目 見積もり（和、差、積）、3 日目 わけとはんい、4 日目 N-009・N-013 と混ぜる、5 日目 確認。

id: N-061
days:
  - day: 1
    items:
      - part: 見本
        text: 368 を四捨五入して、百の位までのがい数にしましょう。
        explain: 百の位までのがい数にするときは、そのすぐ下の十の位の数字を見ます。十の位が 0、1、2、3、4 のときは切り捨てて 300、5、6、7、8、9 のときは切り上げて 400 にします。368 の十の位は 6 なので、切り上げて 400 です。数の線で見ると、368 は 300 より 400 に近い数です。このようなしかたを四捨五入といい、368 はおよそ 400（約 400）と言います。十の位までのがい数にするときは一の位の数字を見ます。これを「一の位を四捨五入する」とも言います。
      - part: 思い出す
        text: 547 の、十の位の数字は何ですか。
        answer: 4
        check: "547 // 10 % 10"
        hints:
          - 547 は、100 が 5 こ、10 がいくつ、1 がいくつかな。
          - 右から 2 番目の数字が十の位だよ。
          - 百の位の 5 と、まちがえないようにしよう。
        paths:
          - [百の位が 5、十の位が 4、一の位が 7, 4]
      - part: 思い出す
