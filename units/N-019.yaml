        check: "6 / Fraction(2, 5)"
        hints:
          - 分子の 2 は、何倍すると 6 になるかな。
          - 分母にも、同じ数をかけよう。
          - 分母と分子には、同じ数をかけるよ。
        paths:
          - [2 × 3 = 6, 分母も 5 × 3, 15]
      - part: 挑戦
        text: 1/3 と大きさが等しい分数のうち、分母と分子をたすと 20 になるものがあります。その分数の分子はいくつですか。
        answer: 5
        check: "[k for k in range(1, 20) if k + 3 * k == 20][0]"
        hints:
          - 1/3 と大きさが等しい分数を、2/6、3/9…とならべよう。
          - それぞれ、分母と分子をたしてみよう。
          - たした数は、どのようにふえていくかな。
