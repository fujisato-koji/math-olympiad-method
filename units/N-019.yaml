  - day: 1
    items:
      - part: 見本
        id: "ca418e69ef"
        text: 同じ図を 2 通りに見ます。上と下の 2 だんで見ると、色は 1 だんで 1/2。6 つのますで見ると、色は 3 つで 3/6。同じところなので 1/2 = 3/6 です。分母と分子に同じ数をかけると、大きさの等しい《分数》ができます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="81" y="32" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2 だんで 見る</text><rect x="30" y="44" width="102" height="30" fill="#7fc8f8" fill-opacity="0.7" stroke="none" stroke-width="0"/><rect x="30" y="44" width="102" height="30" fill="none" stroke="currentColor" stroke-width="2"/><rect x="30" y="74" width="102" height="30" fill="none" stroke="currentColor" stroke-width="2"/><text x="81" y="132" font-size="20" text-anchor="middle" fill="currentColor" font-weight="bold">1/2</text><text x="239" y="32" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">ますで 見る</text><rect x="188" y="44" width="102" height="30" fill="#7fc8f8" fill-opacity="0.7" stroke="none" stroke-width="0"/><rect x="188" y="44" width="34" height="30" fill="none" stroke="currentColor" stroke-width="2"/><rect x="222" y="44" width="34" height="30" fill="none" stroke="currentColor" stroke-width="2"/><rect x="256" y="44" width="34" height="30" fill="none" stroke="currentColor" stroke-width="2"/><rect x="188" y="74" width="34" height="30" fill="none" stroke="currentColor" stroke-width="2"/><rect x="222" y="74" width="34" height="30" fill="none" stroke="currentColor" stroke-width="2"/><rect x="256" y="74" width="34" height="30" fill="none" stroke="currentColor" stroke-width="2"/><text x="239" y="132" font-size="20" text-anchor="middle" fill="currentColor" font-weight="bold">3/6</text><text x="160" y="96" font-size="22" text-anchor="middle" fill="currentColor" font-weight="bold">=</text><text x="160" y="132" font-size="20" text-anchor="middle" fill="currentColor" font-weight="bold">=</text><text x="160" y="172" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">分母と 分子に 同じ数 3 を かけた</text><text x="160" y="192" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">1/2 = 3/6</text></svg>'
        explain: 上と下の 2 だんに分けて見ると、色をぬったのは 2 だんのうちの 1 だんなので 1/2 です。6 つのますに分けて見ると、6 つのうちの 3 つなので 3/6 です。同じところを表しているので、1/2 と 3/6 は大きさが等しい《分数》です。1/2 の分母と分子に同じ数 3 をかけると 3/6 になります。分母と分子に同じ数をかけると、大きさの等しい分数ができます。
