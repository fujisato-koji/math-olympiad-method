        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="302" y1="20" x2="302" y2="184" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="66" y1="20" x2="66" y2="184" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="34" y="51" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">1/2</text><rect x="66" y="26" width="118" height="40" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="184" y="26" width="118" height="40" fill="none" stroke="currentColor" stroke-width="2"/><text x="34" y="107" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">+ 1/3</text><rect x="66" y="82" width="78.7" height="40" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="144.7" y="82" width="78.7" height="40" fill="none" stroke="currentColor" stroke-width="2"/><rect x="223.3" y="82" width="78.7" height="40" fill="none" stroke="currentColor" stroke-width="2"/><text x="34" y="163" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">2/5 ？</text><rect x="66" y="138" width="47.2" height="40" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="113.2" y="138" width="47.2" height="40" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="160.4" y="138" width="47.2" height="40" fill="none" stroke="currentColor" stroke-width="2"/><rect x="207.6" y="138" width="47.2" height="40" fill="none" stroke="currentColor" stroke-width="2"/><rect x="254.8" y="138" width="47.2" height="40" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
        explain: 答えのれい：「2/5 は 1/2 より小さい（1/2 = 5/10、2/5 = 4/10）。1/2 に 1/3 をたしたのに 1/2 より小さくなるのはおかしい。だから 2/5 はまちがい。」や「1/2 と 1/3 は 1 つ分の大きさがちがうので、分子をそのままたせない。通分して 3/6 + 2/6 とすると、1/6 が 5 こで 5/6 になる。」と書ければよい。どちらか 1 つでよい。2 つめだけなら、「では 2/5 はどうしておかしいとわかるかな」とたずね、大きさでたしかめる見方にもつなげる。
        hints:
