# N-019 分数の計算（約分と通分）
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-016（分数の意味）まで。地図では N-017（倍数と約数）と N-018（公約数と公倍数）が前提にないので、
#   「約数」「公倍数」などの語は使わず、約分は「分母と分子を同じ数でわる（もうわれなくなるまで）」、
#   通分は「大きいほうの分母の段の数を順に見て、もう一方の分母でわり切れる数をさがす」で教える。
#   N-018 を前提に足したら、ヒントとみちすじに「最大公約数でわる」「最小公倍数にそろえる」を足してよい。
# 答えの分数は約分した形（D-039）。約分の前の形をたずねるときは、□ に入る整数を答えさせる。
#   check は Fraction で計算する（Fraction は自動で約分するので、答えが約分した形かも確かめられる）。
# 帯分数は 5 日目に書き方だけを入れ、答えを打つ問題は仮分数で答えさせる（帯分数は打てないので選ぶ問題にした）。
#   帯分数の check は '%d と %s' % (商, Fraction(あまり, 分母)) で選択肢の文字を作る。
# 分数 × 整数は「同じ分数を何回かたす」として 5 日目から入れた。分数 × 分数と分数のわり算は、地図に受け持つ単元がないので扱わない。
# 小数（N-020）は前提にないので、分数を小数に直す問題と accept の小数は入れない。
# 図の 🟦 と ⬜ は N-016 と同じ。1 つの図を「段」と「ます」の 2 通りに読んで、大きさの等しい分数を見せる。
# 日の並び（既定）：1 日目 大きさの等しい分数、2 日目 約分、3 日目 通分と大小、4 日目 たし算とひき算、
#   5 日目 帯分数・1 より大きい分数の計算・分数 × 整数、6 日目 わけ、7 日目 N-016 と混ぜる、8 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-017、N-018 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: N-019
days:
  - day: 1
    items:
      - part: 見本
        text: 色をぬったところは、全体の何分のいくつですか。2 通りに答えましょう。
        figure: "🟦🟦🟦\n⬜⬜⬜"
        explain: 上と下の 2 段に分けて見ると、色をぬったのは 2 段のうちの 1 段なので 1/2 です。6 つのますに分けて見ると、6 つのうちの 3 つなので 3/6 です。同じところを表しているので、1/2 と 3/6 は大きさが等しい《分数》です。1/2 の分母と分子に同じ数 3 をかけると 3/6 になります。分母と分子に同じ数をかけると、大きさの等しい分数ができます。
      - part: 思い出す
        text: 色をぬったところは、テープ全体の何分のいくつですか。
        figure: 🟦🟦🟦🟦⬜⬜⬜
        answer: 4/7
        check: "Fraction(n('🟦'), n('🟦') + n('⬜'))"
        hints:
          - テープは、ぜんぶでいくつに分かれているかな。
          - 色をぬったのは、そのうちいくつかな。
          - 分けた数が分母、色をぬった数が分子だよ。
        paths:
          - [ぜんぶで 7 つ, 色は 4 つ, 4/7]
      - part: 思い出す
        text: 2/9 と 5/9 では、どちらが大きいですか。
        choices: [2/9, 5/9]
        answer: 5/9
        check: "max(Fraction(2, 9), Fraction(5, 9))"
        hints:
          - どちらも、1/9 のいくつ分かな。
          - 1/9 が何こあるかでくらべよう。
          - 1/9 が多いほうが大きいね。
        paths:
          - [2/9 は 1/9 が 2 こ、5/9 は 5 こ, 5/9]
      - part: 今日
        text: 色をぬったところは、3 段のうちの 2 段なので 2/3 です。ますで数えると □/6 です。□ にあてはまる数はいくつですか。
        figure: "🟦🟦\n🟦🟦\n⬜⬜"
        answer: 4
        check: "n('🟦')"
        hints:
          - ますは、ぜんぶでいくつあるかな。
          - 色をぬったますを数えよう。
          - 2/3 の分母と分子に、何をかけると分母が 6 になるかな。
        paths:
          - [ますは 6 つ, 色は 4 つ, 2/3 = 4/6]
          - [分母 3 に 2 をかけて 6, 分子 2 にも 2 をかけて 4]
      - part: 今日
        text: 3/4 = □/12 です。□ にあてはまる数はいくつですか。
        answer: 9
        check: "Fraction(3, 4) * 12"
        hints:
          - 分母の 4 は、何倍すると 12 になるかな。
          - 分子にも、同じ数をかけよう。
          - 分母と分子には、同じ数をかけるよ。
        paths:
          - [4 × 3 = 12, 分子も 3 × 3, 9]
        note: 分子に 12 − 4 = 8 をたして 11 としやすい。たすのではなく、同じ数をかける。
      - part: 今日
        text: 2/5 = 6/□ です。□ にあてはまる数はいくつですか。
