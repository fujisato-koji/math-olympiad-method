        explain: 例：「図を 3 段に分けて見ると、色をぬったのは 1 段で 1/3。それぞれの段を 2 つに切ると、全体は 3 × 2 = 6 こ、色をぬったところは 1 × 2 = 2 こになって 2/6。切っただけで、色をぬったところの大きさは変わっていない。だから 1/3 = 2/6。」と書ければよい。「分母と分子に同じ数をかけるのは、1 つ分を同じ数ずつに切り分けること」とまとめられれば、なおよい。分母にだけ、分子にだけかけると、大きさが変わることにも触れる（1/6 は 1/3 より小さい）。
