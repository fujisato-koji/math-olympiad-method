# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 分子が 7 の《分数》 7/□ が、1/2 より大きく、3/5 より小さくなるようにします。□ に入る《整数》をすべてたすと、いくつですか。
    answer: 25
    check: "sum(d for d in range(1, 100) if Fraction(1, 2) < Fraction(7, d) < Fraction(3, 5))"
    hints:
      - 分母をそろえるかわりに、分子をそろえてみよう。分子が同じなら、分母が小さいほうが大きいね。
      - 1/2 を、分子が 7 の分数になおそう。7/□ が 1/2 より大きくなるのは、□ がいくつより小さいときかな。
      - 3/5 と 7/□ の分子を、どちらも 21 にそろえてくらべよう。
    paths:
      - [1/2 = 7/14 なので □ は 14 より小さい, 3/5 = 21/35、7/□ の分子を 21 にすると分母は □ の 3 倍, 7/□ は 3/5 より小さいので □ の 3 倍は 35 より大きい, □ は 12 と 13 で 12 + 13 = 25]
      - [□ に 13、12、11 を入れてためす, 7/12 = 35/60 と 3/5 = 36/60 で 7/12 のほうが小さい, 7/11 = 35/55 と 3/5 = 33/55 で 7/11 は大きすぎる, □ は 13 と 12 で 25]
    note: 分母でなく分子をそろえるのが道筋の要点（分子が同じなら分母の小さいほうが大きい、N-016）。2 本目のように候補をしぼって通分で確かめてもよい。7/14 は 1/2 と等しいので入らない。あてはまる □ をすべて見つけたかを、和で確かめる。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [A-003]
    text: 本を、1 日目に全体の 1/3 読み、2 日目に全体の 1/4 読みました。のこりは 30 ページです。この本は全部で何ページですか。
    answer: 72
    check: "30 / (1 - Fraction(1, 3) - Fraction(1, 4))"
    hints:
      - 本全体を 1 本の線分図にかいて、1 日目と 2 日目に読んだところに区切りを入れよう。
      - のこりは、全体の何分のいくつかな。1/3 + 1/4 を計算して、1 からひこう。
      - のこりの 30 ページが全体の □/12 なら、全体の 1/12 は何ページかな。
    paths:
      - [読んだのは 1/3 + 1/4 = 7/12, のこりは 1 − 7/12 = 5/12, 5/12 が 30 ページなので 1/12 は 30 ÷ 5 = 6 ページ, 全体は 6 × 12 = 72 ページ]
    note: 線分図（A-003）で「全体の 5/12 が 30 ページ」を見つけ、分数の意味（N-016 の □ の 3/4 の逆）で全体にもどす。のこりの割合を通分の計算で出すところが N-019。
  - part: 離
    kinds: [数, 手数]
    text: 24/64 + 35/84 + 18/48 を計算しましょう。答えは仮分数で打ちましょう。
    answer: 7/6
    check: "Fraction(24, 64) + Fraction(35, 84) + Fraction(18, 48)"
    hints:
      - このまま通分すると、分母がとても大きくなるね。先に 1 つずつ約分しよう。
      - 24 と 64、35 と 84、18 と 48 は、それぞれ何でわれるかな。もうわれなくなるまでわろう。
      - 約分した 3 つの分数のうち、同じものを先にたすと楽だよ。
    paths:
      - [24/64 = 3/8、35/84 = 5/12、18/48 = 3/8, 3/8 + 3/8 = 6/8 = 3/4, 3/4 + 5/12 = 9/12 + 5/12 = 14/12, 約分して 7/6]
    note: 分母が大きく見えるが、約分すると 8 と 12 の分母になる。35/84 は 7 でわる（84 = 7 × 12）ことに気づきにくい。先に約分してから通分するという順番の判断も見る。
