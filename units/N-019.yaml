roke-dasharray="3 2" stroke-linecap="round"/><line x1="154.5" y1="99" x2="154.5" y2="135" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 2" stroke-linecap="round"/><line x1="213.5" y1="99" x2="213.5" y2="135" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 2" stroke-linecap="round"/><line x1="272.5" y1="99" x2="272.5" y2="135" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 2" stroke-linecap="round"/><text x="160" y="188" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2 ますずつ まとめると 6/8 = 3/4</text></svg>'
