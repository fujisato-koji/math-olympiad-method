# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "07d4f0812e"
    kinds: [道筋]
    text: 分子が 7 の《分数》 7/□ が、1/2 より大きく、3/5 より小さくなるようにします。□ に入る《整数》をすべてたすと、いくつですか。
    answer: 25
    check: "sum(d for d in range(1, 100) if Fraction(1, 2) < Fraction(7, d) < Fraction(3, 5))"
    hints:
      - text: 分母をそろえるかわりに、分子をそろえてみよう。分子が同じなら、分母が小さいほうが大きいね。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="160" y="86" width="26" height="24" fill="#f3c969" fill-opacity="0.6" stroke="none" stroke-width="0"/><line x1="30" y1="110" x2="290" y2="110" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="30" y1="101" x2="30" y2="119" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="30" y="138" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">0</text><line x1="290" y1="101" x2="290" y2="119" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="290" y="138" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><line x1="160" y1="101" x2="160" y2="119" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="156" y="138" font-size="14" text-anchor="end" fill="currentColor" font-weight="bold">1/2</text><line x1="186" y1="101" x2="186" y2="119" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="190" y="138" font-size="14" text-anchor="start" fill="currentColor" font-weight="bold">3/5</text><text x="173" y="74" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">7/□ は この あいだ</text></svg>'
      - 1/2 を、分子が 7 の分数になおそう。7/□ が 1/2 より大きくなるのは、□ がいくつより小さいときかな。
      - 3/5 と 7/□ の分子を、どちらも 21 にそろえてくらべよう。
    paths:
      - [1/2 = 7/14 なので □ は 14 より小さい, 3/5 = 21/35、7/□ の分子を 21 にすると分母は □ の 3 倍, 7/□ は 3/5 より小さいので □ の 3 倍は 35 より大きい, □ は 12 と 13 で 12 + 13 = 25]
      - [□ に 13、12、11 を入れてためす, 7/12 = 35/60 と 3/5 = 36/60 で 7/12 のほうが小さい, 7/11 = 35/55 と 3/5 = 33/55 で 7/11 は大きすぎる, □ は 13 と 12 で 25]
    note: 分母でなく分子をそろえるのが道筋の要点（分子が同じなら分母の小さいほうが大きい、N-016）。2 本目のようにあてはまりそうな数をしぼって通分でたしかめてもよい。7/14 は 1/2 と等しいので入らない。あてはまる □ をすべて見つけたかを、和でたしかめる。
  - part: 離
    id: "ce5f103af3"
    kinds: [総動員, 読み取り]
    uses: [A-003]
    text: 本を、1 日目に全体の 1/3 読み、2 日目に全体の 1/4 読みました。のこりは 30 ページです。この本は全部で何ページですか。
    answer: 72
    check: "30 / (1 - Fraction(1, 3) - Fraction(1, 4))"
    hints:
      - text: 本全体を 1 本の線分図にかいて、1 日目と 2 日目に読んだところに区切りを入れよう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="80" width="80" height="40" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="120" y="80" width="60" height="40" fill="#7bc96f" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="180" y="80" width="100" height="40" fill="none" stroke="currentColor" stroke-width="2"/><text x="80" y="105" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1/3</text><text x="150" y="105" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1/4</text><text x="80" y="70" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">1 日目</text><text x="150" y="70" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">2 日目</text><text x="230" y="70" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">のこり</text><path d="M180,124 L180,132 L280,132 L280,124" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="230" y="150" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">30 ページ</text><path d="M40,52 L40,44 L280,44 L280,52" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="160" y="38" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">本 ぜんぶ</text></svg>'
      - のこりは、全体の何分のいくつかな。1/3 + 1/4 を計算して、1 からひこう。
      - のこりの 30 ページが全体の □/12 なら、全体の 1/12 は何ページかな。
    paths:
      - [読んだのは 1/3 + 1/4 = 7/12, のこりは 1 − 7/12 = 5/12, 5/12 が 30 ページなので 1/12 は 30 ÷ 5 = 6 ページ, 全体は 6 × 12 = 72 ページ]
      - [本全体を 12 とみる, 1 日目 4、2 日目 3、のこり 5, 5 が 30 ページなので 1 が 6 ページ、12 は 72 ページ]
    note: 線分図（A-003）で「全体の 5/12 が 30 ページ」を見つけ、分数の意味（N-016 の □ の 3/4 の逆）で全体にもどす。のこりの分を通分の計算で出すところが N-019。
  - part: 離
