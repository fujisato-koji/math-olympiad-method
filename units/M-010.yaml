ddle" fill="currentColor">λ₁</text><circle cx="116" cy="116" r="8" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="116" y="100" font-size="15" text-anchor="middle" fill="currentColor">λ₂</text></svg>'
          - λ がすべてプラスのときと、1 つでもマイナスのときを、くらべます。
