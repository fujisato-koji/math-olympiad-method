# M-010 双線形形式と二次形式
#
# 段 6・水準 3・8 日。前提は M-007（固有値と対角化）。
# 双線形形式、二次形式、対称行列との対応、正定値、標準形を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: M-010
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          双線形形式は、2 つのベクトル u、v から数を決める写像 B(u, v) で、
          どちらの引数についても線形なものです。
          行列 A を使って B(u, v) = uᵀ A v と書けます。
          例：A = (2 1；1 3)、u=(1,0)、v=(0,1) なら、B(u,v)=1。
        explain: |-
          【定義】双線形形式は「内積の一般化」です。u を 2 倍すれば B も 2 倍、v を 2 倍すれば B も 2 倍。
          uᵀAv は、u を横ベクトル、v を縦ベクトルとして計算します。
          A の成分が、B の値を決めます。
        note: B(u,v)=uᵀAv。どちらの引数にも線形。
      - part: 今日
        text: A = (2 1；1 3)、u=(1,0)、v=(0,1) のとき、B(u,v)=uᵀAv はいくつですか。
        choices: [1, 2, 3, 7]
        answer: 1
        check: "1"
        hints:
          - A v を計算します。
          - u との内積をとります。
          - 成分をかけます。
        paths:
          - [A v=(1,3), uᵀ(A v)=1, 1]
      - part: 今日
        text: A = (2 1；1 3)、u=(1,1)、v=(1,1) のとき、B(u,v) はいくつですか。
        choices: [3, 5, 7, 9]
        answer: 7
        check: "7"
        hints:
          - A v を計算します。
          - u との内積をとります。
          - 成分を足します。
        paths:
          - [A v=(3,4), uᵀ(3,4)=7, 7]
      - part: 挑戦
        text: B(u,v)=uᵀAv の行列 A はどれですか。
        choices: ["(2 1；1 3)", "(2 3；1 1)", "(1 1；2 3)", "(3 1；1 2)"]
        answer: "(2 1；1 3)"
        check: "'(2 1；1 3)'"
        hints:
          - 問題文の A を読みます。
          - 2 行 2 列の成分を並べます。
          - 行列を選びます。
        paths:
          - [A の成分, (2 1；1 3)]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          二次形式は、Q(x) = B(x, x) = xᵀ A x で決まる関数です。
          Q(x) は x の 2 次式になります。
          A が対称でなくても、Q には対称部分 (A+Aᵀ)/2 だけが効きます。
          例：A=(2 1；1 3) なら、Q(x,y)=2x²+2xy+3y²。
        explain: |-
          二次形式は、ベクトル x に数を対応させる 2 次関数です。
          xᵀAx を展開すると、x²、xy、y² の項が出ます。
          交代部分は xᵀAx で消えるので、対称行列で代表できます。
        note: Q(x)=xᵀAx。二次形式には対称部分だけが効く。
      - part: 今日
        text: A = (2 1；1 3) の二次形式 Q(x,y) はどれですか。
        choices: ["2x² + 2xy + 3y²", "2x² + xy + 3y²", "x² + 2xy + 3y²", "2x² + 3y²"]
        answer: "2x² + 2xy + 3y²"
        check: "'2x² + 2xy + 3y²'"
        hints:
          - xᵀAx を展開します。
          - 対角から x²、y² の係数が出ます。
          - 非対角から xy の項が出ます。
        paths:
          - [xᵀAx, 2x²+2xy+3y²]
      - part: 今日
        text: Q(x,y) = 2x² + 2xy + 3y² の対称行列はどれですか。
        choices: ["(2 1；1 3)", "(2 2；2 3)", "(2 1；1 2)", "(1 2；2 3)"]
        answer: "(2 1；1 3)"
        check: "'(2 1；1 3)'"
        hints:
          - x² の係数が対角成分です。
          - xy の係数の半分が非対角成分です。
          - 対称行列を組みます。
        paths:
          - [対角 2、3, 非対角 1, (2 1；1 3)]
      - part: 挑戦
        text: A = (0 2；0 0) の二次形式 Q(x,y) はどれですか。
        choices: ["2xy", "2x²", "2y²", "0"]
        answer: "2xy"
        check: "'2xy'"
        hints:
          - xᵀAx を展開します。
          - A の非対角だけが残ります。
          - xy の項になります。
        paths:
          - [xᵀAx, 2xy]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          二次形式 Q(x,y) = ax² + 2bxy + cy² は、対称行列 (a b；b c) で表されます。
          xy の係数が 2b なので、行列の非対角は b です。
          対角成分は x²、y² の係数。
          この対応で、二次形式と対称行列を行き来できます。
        explain: |-
          Q = ax² + 2bxy + cy² の行列は (a b；b c)。
          xy の係数が 4 なら、b=2 です。半分にするのを忘れない。
          対称行列なので、非対角は上下同じです。
        note: Q=ax²+2bxy+cy² ↔ (a b；b c)。xy の係数の半分が非対角。
      - part: 今日
        text: Q(x,y) = 2x² + 4xy + 5y² の対称行列はどれですか。
        choices: ["(2 2；2 5)", "(2 4；4 5)", "(2 1；1 5)", "(4 2；2 5)"]
        answer: "(2 2；2 5)"
        check: "'(2 2；2 5)'"
        hints:
          - x² の係数は対角です。
          - xy の係数の半分を非対角にします。
          - 行列を組みます。
        paths:
          - [対角 2、5, 非対角 2, (2 2；2 5)]
      - part: 今日
        text: 対称行列 (3 1；1 2) の二次形式はどれですか。
        choices: ["3x² + 2xy + 2y²", "3x² + xy + 2y²", "3x² + 4xy + 2y²", "x² + 2xy + 2y²"]
        answer: "3x² + 2xy + 2y²"
        check: "'3x² + 2xy + 2y²'"
        hints:
          - 対角が x²、y² の係数です。
          - 非対角の 2 倍が xy の係数です。
          - 式を組みます。
        paths:
          - [対角 3、2, 非対角 1, 3x²+2xy+2y²]
      - part: 挑戦
        text: Q(x,y) = x² + 6xy + y² の対称行列はどれですか。
        choices: ["(1 3；3 1)", "(1 6；6 1)", "(1 2；2 1)", "(3 1；1 3)"]
        answer: "(1 3；3 1)"
        check: "'(1 3；3 1)'"
        hints:
          - 対角は 1 と 1 です。
          - xy の係数の半分を非対角にします。
          - 行列を組みます。
        paths:
          - [対角 1、1, 非対角 3, (1 3；3 1)]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          正定値：x ≠ 0 のすべての x で Q(x) > 0 となる二次形式。
          対称行列 A では、固有値がすべて正であることと同値。
          2×2 の (a b；b c) では、a > 0 かつ ac − b² > 0 が条件。
          負定値は Q(x) < 0、不定は正にも負にもなる場合です。
        explain: |-
          正定値は「どの方向にも谷になっている」ことです。
          対角化すると Q=λ1 y1²+λ2 y2² なので、固有値がすべて正なら Q>0。
          2×2 では、左上の a と行列式 ac−b² の符号を見ます。
        note: 正定値は Q>0（x≠0）。固有値がすべて正。2×2 は a>0、ac−b²>0。
      - part: 今日
        text: A = (2 1；1 2) の二次形式は正定値ですか。
        choices: [正定値, 負定値, 不定, 判定できない]
        answer: 正定値
        check: "'正定値'"
        hints:
          - 固有値を求めます。
          - 固有値の符号を見ます。
          - 正定値の条件とくらべます。
        paths:
          - [固有値 3、1, すべて正, 正定値]
      - part: 今日
        text: A = (1 2；2 1) の二次形式は正定値ですか。
        choices: [正定値, 負定値, 不定, 判定できない]
        answer: 不定
        check: "'不定'"
        hints:
          - 固有値を求めます。
          - 固有値の符号を見ます。
          - 正と負が混ざるか を 考えます。
        paths:
          - [固有値 3、−1, 正と負, 不定]
      - part: 挑戦
        text: 2×2 の対称行列 (a b；b c) が正定値になる条件はどれですか。
        choices: ["a > 0 かつ ac − b² > 0", "a > 0 だけ", "ac − b² > 0 だけ", "a < 0 かつ ac − b² > 0"]
        answer: "a > 0 かつ ac − b² > 0"
        check: "'a > 0 かつ ac − b² > 0'"
        hints:
          - 左上の成分の符号を見ます。
          - 行列式の符号を見ます。
          - 2 つの条件を組みます。
        paths:
          - [a>0, ac−b²>0, 正定値]
    extra: []

  - day: 5
    items:
      - part: 見本
        text: |-
          二次形式の標準形：対称行列 A を直交行列で対角化すると、
          Q(x) = λ1 y1² + λ2 y2² になります。
          λ1、λ2 は固有値、y は新しい座標です。
          このときの座標軸を主軸といいます。
          正定値なら、すべての λ が正です。
        explain: |-
          直交行列で対角化すると、二次形式の交叉項が消えます。
          Q は固有値を係数とする平方の和になります。
          主軸は、二次形式の等高線（楕円）の軸です。
        note: 直交対角化で Q=λ1y1²+λ2y2²。軸は主軸。
      - part: 今日
        text: A = (2 1；1 2) の固有値はどれですか。
        choices: ["3 と 1", "2 と 1", "3 と −1", "1 と 1"]
        answer: "3 と 1"
        check: "'3 と 1'"
        hints:
          - 特性方程式を立てます。
          - トレースと行列式を使います。
          - 固有値を求めます。
        paths:
          - [λ²−4λ+3=0, 3 と 1]
      - part: 今日
        text: A = (2 1；1 2) の二次形式の標準形はどれですか。
        choices: ["3y1² + y2²", "y1² + 3y2²", "3y1² − y2²", "2y1² + 2y2²"]
        answer: "3y1² + y2²"
        check: "'3y1² + y2²'"
        hints:
          - 固有値を求めます。
          - 大きい固有値を y1² の係数にします。
          - 標準形を書きます。
        paths:
          - [固有値 3、1, 3y1²+y2²]
      - part: 挑戦
        text: 二次形式の主軸は何を表しますか。
        choices: ["等高線の楕円の軸", "原点からの距離", "行列の対角", "固有ベクトルの長さ"]
        answer: "等高線の楕円の軸"
        check: "'等高線の楕円の軸'"
        hints:
          - 標準形にすると交叉項が消えます。
          - 座標軸が楕円の軸になります。
          - 主軸です。
        paths:
          - [標準形, 交叉項が消える, 楕円の軸]
    extra: []

  - day: 6
    items:
      - part: わけ
        text: 二次形式 Q(x)=xᵀAx には、A の対称部分だけが効くわけを説明しましょう。
        explain: 「xᵀAx を展開すると、A の非対称部分は xᵀ(A−Aᵀ)x/2 の形で残る。しかし xᵀMx は M が交代行列なら 0 になる。だから Q には (A+Aᵀ)/2 だけが効く。」と書ければよい。① 展開、② 交代部分は 0、③ 対称部分だけ。子どもには、2×2 の例で確かめさせます。
        hints:
          - xᵀAx を展開します。
          - 交代行列の部分を考えます。
          - 残る部分を確認します。
        paths:
          - [展開, 交代部分は 0, 対称部分だけ]
      - part: わけ
        text: 正定値が「固有値がすべて正」と同値になるわけを説明しましょう。
        explain: 「対称行列は直交行列で対角化でき、Q=λ1y1²+…+λnyn² になる。y≠0 なら y1²+…+yn²>0。すべての λ が正なら Q>0。逆にどれか λ が 0 以下なら、その方向で Q≤0 になる。だから同値。」と書ければよい。① 対角化、② 平方の和、③ 符号。子どもには、2×2 で確かめさせます。
        hints:
          - 対称行列を直交対角化します。
          - Q を平方の和で書きます。
          - 係数の符号を考えます。
        paths:
          - [直交対角化, Q=Σλy², 符号, 同値]
      - part: わけ
        text: 二次形式を直交行列で対角化すると、交叉項が消えるわけを説明しましょう。
        explain: 「A を直交行列 P で対角化すると、A=PDPᵀ。x=Py とおくと、Q=xᵀAx=yᵀPᵀAPy=yᵀDy。D は対角なので、交叉項が消えて λ1y1²+λ2y2² になる。」と書ければよい。① A=PDPᵀ、② x=Py、③ yᵀDy。子どもには、2×2 の例で確かめさせます。
        hints:
          - 対角化 A=PDPᵀ を使います。
          - x=Py とおきます。
          - yᵀDy を展開します。
        paths:
          - [A=PDPᵀ, x=Py, yᵀDy, 交叉項が消える]

