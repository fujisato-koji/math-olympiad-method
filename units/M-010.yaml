        id: "e8b4b076ff"
        text: "二次形式 Q の値を、等高線（Q が同じ値になる点をつないだ線）で見ます。青い実線は Q > 0、赤い点線は Q < 0 の線です。\n正定値：x ≠ 0 のすべての x で Q(x) > 0。等高線は青い輪になります（左）。\n負定値は、すべてで Q(x) < 0（中）。不定は、Q が正にも負にもなる場合（右）です。\nたいしょうぎょうれつ A では、正定値は固有値がすべて正であることと同じ意味です。2×2 の (a b；b c) では、a > 0 かつ ac − b² > 0 が条件です。"
