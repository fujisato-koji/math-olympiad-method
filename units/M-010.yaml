        id: "38e40808fd"
        text: "二次形式 Q(x, y) = ax² + 2bxy + cy² は、たいしょうぎょうれつ (a b；b c) で表されます。\n図の同じ色が対応しています。x² の係数 a は左上、y² の係数 c は右下に入ります。\nxy の係数 2b は、半分の b ずつに分けて、右上と左下に入ります。\nこの対応で、二次形式とたいしょうぎょうれつを行き来できます。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="37.6" y="17" width="52.8" height="23" rx="4" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1"/><text x="64" y="34" font-size="16" text-anchor="middle" fill="currentColor">a x²</text><rect x="132" y="17" width="56" height="23" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="1"/><text x="160" y="34" font-size="16" text-anchor="middle" fill="currentColor">2b xy</text><rect x="229.6" y="17" width="52.8" height="23" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1"/><text x="256" y="34" font-size="16" text-anchor="middle" fill="currentColor">c y²</text><text x="112" y="34" font-size="16" text-anchor="middle" fill="currentColor">＋</text><text x="208" y="34" font-size="16" text-anchor="middle" fill="currentColor">＋</text><rect x="112" y="62" width="52" height="38" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="138" y="87" font-size="16" text-anchor="middle" fill="currentColor">a</text><rect x="164" y="62" width="52" height="38" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="190" y="87" font-size="16" text-anchor="middle" fill="currentColor">b</text><rect x="112" y="100" width="52" height="38" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="138" y="125" font-size="16" text-anchor="middle" fill="currentColor">b</text><rect x="164" y="100" width="52" height="38" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="190" y="125" font-size="16" text-anchor="middle" fill="currentColor">c</text><path d="M108 59 h-9 v82 h9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M220 59 h9 v82 h-9" fill="none" stroke="currentColor" stroke-width="2"/><text x="92" y="106" font-size="16" text-anchor="end" fill="currentColor">A =</text><text x="160" y="166" font-size="14" text-anchor="middle" fill="currentColor">2b ＝ b ＋ b（半分ずつ）</text></svg>'
        explain: "Q = ax² + 2bxy + cy² の行列は (a b；b c)。\nxy の係数が 4 なら、b=2 です。半分にするのを忘れない。\nたいしょうぎょうれつなので、非対角は上下同じです。"
        note: Q=ax²+2bxy+cy² ↔ (a b；b c)。xy の係数の半分が非対角。
