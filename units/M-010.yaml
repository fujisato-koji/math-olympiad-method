# M-010 双線形形式と二次形式
#
# 水準 4・8 日。前提は M-007（固有値と対角化）。
# 双線形形式、二次形式、対称行列との対応、正定値、標準形、主軸を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: M-010
days:
  - day: 1
    items:
      - part: 見本
        id: "9bbcd87a7d"
        text: |-
          双線形形式は、2 つのベクトル u、v から数を 1 つ決める式 B(u, v) で、u についても v についても線形（1 次式）です。
          行列 A を使って B(u, v) = uᵀ A v と書けます。
          図は A = (3 1；2 4)、u = (0, 1)、v = (1, 0) の例です。u が行を、v が列を選びます。
          色が重なった 2 行 1 列のますの数 2 が、B(u, v) の値です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="140" y="34" width="60" height="26" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="74" y="104" width="64" height="42" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="140" y="62" width="60" height="42" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="170" y="89" font-size="16" text-anchor="middle" fill="currentColor">3</text><rect x="200" y="62" width="60" height="42" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230" y="89" font-size="16" text-anchor="middle" fill="currentColor">1</text><rect x="140" y="104" width="60" height="42" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="170" y="131" font-size="16" text-anchor="middle" fill="currentColor">2</text><rect x="200" y="104" width="60" height="42" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="230" y="131" font-size="16" text-anchor="middle" fill="currentColor">4</text><text x="132" y="88" font-size="14" text-anchor="end" fill="currentColor">u₁ = 0</text><text x="132" y="130" font-size="14" text-anchor="end" fill="currentColor">u₂ = 1</text><text x="170" y="52" font-size="14" text-anchor="middle" fill="currentColor">v₁ = 1</text><text x="230" y="52" font-size="14" text-anchor="middle" fill="currentColor">v₂ = 0</text><text x="102" y="52" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">A</text><text x="200" y="178" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">B(u, v) = 2</text></svg>'
        explain: |-
          【定義】双線形形式は、内積を広げたものです。u を 2 倍にすれば B も 2 倍、v を 2 倍にすれば B も 2 倍になります。
          uᵀAv は、u を横ベクトル、v を縦ベクトルとして計算します。成分で書くと、「u の重み × A の成分 × v の重み」をすべてのますについて足したものです。
          u = (0, 1)、v = (1, 0) のように 1 か所だけが 1 のときは、A のそのますの数が、そのまま B の値になります。
        note: B(u,v)=uᵀAv。どちらの引数にも線形。
      - part: 今日
