        text: 二次形式を直交行列で対角化すると、xy の部分が消えるわけを説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="72" cy="88" rx="28" ry="48" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2" transform="rotate(-45 72 88)"/><line x1="18" y1="88" x2="126" y2="88" fill="none" stroke="#8a93a6" stroke-width="1.5"/><line x1="72" y1="34" x2="72" y2="142" fill="none" stroke="#8a93a6" stroke-width="1.5"/><text x="135" y="93" font-size="14" text-anchor="middle" fill="currentColor">x</text><text x="81" y="30" font-size="14" text-anchor="middle" fill="currentColor">y</text><line x1="72" y1="88" x2="101.2" y2="58.8" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="108.3,51.7 104.7,62.3 97.7,55.3" fill="currentColor"/><text x="117.5" y="47.5" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">y₁</text><line x1="72" y1="88" x2="42.8" y2="58.8" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="35.7,51.7 46.3,55.3 39.3,62.3" fill="currentColor"/><text x="26.5" y="47.5" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">y₂</text><ellipse cx="248" cy="88" rx="28" ry="48" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><line x1="248" y1="88" x2="289.3" y2="88" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="299.3,88 289.3,93 289.3,83" fill="currentColor"/><text x="312.3" y="93" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">y₁</text><line x1="248" y1="88" x2="248" y2="46.7" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="248,36.7 253,46.7 243,46.7" fill="currentColor"/><text x="248" y="28.7" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">y₂</text><line x1="144" y1="88" x2="166" y2="88" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="176,88 166,93 166,83" fill="currentColor"/><text x="160" y="76" font-size="14" text-anchor="middle" fill="currentColor">回す</text><text x="72" y="168" font-size="13" text-anchor="middle" fill="currentColor">Q = 2x² + 2xy + 2y²</text><text x="248" y="168" font-size="13" text-anchor="middle" fill="currentColor">Q = 3y₁² + y₂²</text><text x="72" y="188" font-size="13" text-anchor="middle" fill="currentColor">xy の部分がある</text><text x="248" y="188" font-size="13" text-anchor="middle" fill="currentColor">xy の部分がない</text></svg>'
        explain: 「A を直交行列 P で対角化すると、A=PDPᵀ。x=Py とおくと、Q=xᵀAx=yᵀPᵀAPy=yᵀDy。D は対角なので、xy の部分が消えて λ_1 y_1² + λ_2 y_2² になる。」と書ければよい。① A=PDPᵀ、② x=Py、③ yᵀDy。子どもには、2×2 の例で確かめさせます。
        hints:
          - text: 対角化 A=PDPᵀ を使います。D は図のような対角行列です。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="137" y="77" font-size="16" text-anchor="middle" fill="currentColor">λ₁</text><text x="187" y="77" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="137" y="121" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="187" y="121" font-size="16" text-anchor="middle" fill="currentColor">λ₂</text><path d="M109 48 h-8 v92 h8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M215 48 h8 v92 h-8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="187" cy="72" r="19" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><circle cx="137" cy="116" r="19" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="160" y="28" font-size="15" text-anchor="middle" fill="currentColor">D（対角行列）</text><text x="160" y="160" font-size="15" text-anchor="middle" fill="currentColor">輪の中は 0 です</text></svg>'
          - x=Py とおきます。
          - yᵀDy を展開します。
        paths:
          - [A=PDPᵀ, x=Py, yᵀDy, xy の部分が消える]
          - ["じくを回してだ円のじくにそろえる", "だ円がじくに重なる", "xy の部分が消える"]
