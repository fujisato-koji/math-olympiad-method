        explain: 「たいしょうぎょうれつは直交行列で対角化でき、Q = λ_1 y_1² + … + λ_n y_n² になる。y≠0 なら y_1² + … + y_n² > 0。すべての λ が正なら Q>0。逆にどれか λ が 0 以下なら、その方向で Q≤0 になる。だから同値。」と書ければよい。① 対角化、② 平方の和、③ 正か負か。子どもには、2×2 で確かめさせます。
        hints:
          - たいしょうぎょうれつを直交対角化します。Q を平方の和で書きます。
          - text: y₁² も y₂² も 0 以上です。λ がマイナスだと、その向きで Q がどうなるか考えます。
