    items:
      - part: 見本
        id: "b2572e3be5"
        text: "二次形式は、Q(x) = B(x, x) = xᵀ A x で決まる関数です。x = (x, y) のとき、Q は x、y の 2 次式になります。\n図は A = (4 3；3 5) の例で、同じ色のますと部分が対応しています。\nx² の係数は左上の 4、y² の係数は右下の 5 です。xy の係数は、右上と左下の 3 と 3 を足した 6 です。\nつまり Q(x, y) = 4x² + 6xy + 5y² です。A がたいしょうでなくても、Q に効くのはたいしょうな部分 (A + Aᵀ) / 2 だけです。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="42.4" y="17" width="43.2" height="23" rx="4" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1"/><text x="64" y="34" font-size="16" text-anchor="middle" fill="currentColor">4x²</text><rect x="141.6" y="17" width="36.8" height="23" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="1"/><text x="160" y="34" font-size="16" text-anchor="middle" fill="currentColor">6xy</text><rect x="234.4" y="17" width="43.2" height="23" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1"/><text x="256" y="34" font-size="16" text-anchor="middle" fill="currentColor">5y²</text><text x="112" y="34" font-size="16" text-anchor="middle" fill="currentColor">＋</text><text x="208" y="34" font-size="16" text-anchor="middle" fill="currentColor">＋</text><rect x="112" y="62" width="52" height="38" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="138" y="87" font-size="16" text-anchor="middle" fill="currentColor">4</text><rect x="164" y="62" width="52" height="38" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="190" y="87" font-size="16" text-anchor="middle" fill="currentColor">3</text><rect x="112" y="100" width="52" height="38" fill="#7bc96f" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="138" y="125" font-size="16" text-anchor="middle" fill="currentColor">3</text><rect x="164" y="100" width="52" height="38" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="190" y="125" font-size="16" text-anchor="middle" fill="currentColor">5</text><path d="M108 59 h-9 v82 h9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M220 59 h9 v82 h-9" fill="none" stroke="currentColor" stroke-width="2"/><text x="92" y="106" font-size="16" text-anchor="end" fill="currentColor">A =</text><text x="160" y="166" font-size="14" text-anchor="middle" fill="currentColor">xy の係数 6 ＝ 3 ＋ 3</text></svg>'
        explain: "二次形式は、ベクトル x に数を対応させる 2 次関数です。\nxᵀAx を展開すると、x²、xy、y² の部分が出ます。x² の係数が左上、y² の係数が右下、xy の係数が右上と左下の和です。\n交代部分（A − Aᵀ が作る部分）は xᵀAx に出てこないので、二次形式はたいしょうぎょうれつで代表できます。"
        note: Q(x)=xᵀAx。二次形式には対称部分だけが効く。
