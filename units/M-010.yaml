        explain: 「xᵀAx を展開すると、A のひたいしょうぶぶんは xᵀ(A−Aᵀ)x/2 の形で残る。しかし xᵀMx は M が交代行列なら 0 になる。だから Q には (A+Aᵀ)/2 だけが効く。」と書ければよい。① 展開、② 交代部分は 0、③ たいしょうぶぶんだけ。子どもには、2×2 の例で確かめさせます。
