  - day: 5
    items:
      - part: 見本
        text: 中心のまわりを往復する動きで、中心からのずれ x が x = A sin ω t で表されるものを単振動という（sin は、円を回る物の高さを角から出す関数）。A は最大のずれで振幅、ω は角速度（円運動と同じ ω）。周期は T = 2 π ÷ ω。ばねの先につけた質量 m の物は T = 2 π √(m ÷ k)（k はばね定数）、長さ l のふりこは T = 2 π √(l ÷ g)。√ は、2 回かけるとその数になる数（√4 = 2）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="40" y1="100" x2="282" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="290,100 282,104 282,96" fill="currentColor"/><line x1="40" y1="45" x2="40" y2="155" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="40,100 42.5,96.7 45,93.4 47.5,90.2 50,87 52.5,83.9 55,80.9 57.5,78.1 60,75.3 62.5,72.7 65,70.3 67.5,68.1 70,66 72.5,64.2 75,62.6 77.5,61.2 80,60.1 82.5,59.2 85,58.5 87.5,58.1 90,58 92.5,58.1 95,58.5 97.5,59.2 100,60.1 102.5,61.2 105,62.6 107.5,64.2 110,66 112.5,68.1 115,70.3 117.5,72.7 120,75.3 122.5,78.1 125,80.9 127.5,83.9 130,87 132.5,90.2 135,93.4 137.5,96.7 140,100 142.5,103.3 145,106.6 147.5,109.8 150,113 152.5,116.1 155,119.1 157.5,121.9 160,124.7 162.5,127.3 165,129.7 167.5,131.9 170,134 172.5,135.8 175,137.4 177.5,138.8 180,139.9 182.5,140.8 185,141.5 187.5,141.9 190,142 192.5,141.9 195,141.5 197.5,140.8 200,139.9 202.5,138.8 205,137.4 207.5,135.8 210,134 212.5,131.9 215,129.7 217.5,127.3 220,124.7 222.5,121.9 225,119.1 227.5,116.1 230,113 232.5,109.8 235,106.6 237.5,103.3 240,100" fill="none" stroke="currentColor" stroke-width="2.5"/><line x1="48" y1="166" x2="232" y2="166" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="240,166 232,170 232,162" fill="currentColor"/><polygon points="40,166 48,162 48,170" fill="currentColor"/><text x="140" y="188" font-size="14" text-anchor="middle" fill="currentColor">周期 T</text><text x="24" y="58" font-size="15" text-anchor="middle" fill="currentColor">A</text><line x1="34" y1="58" x2="50" y2="58" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="285" y="118" font-size="13" text-anchor="middle" fill="currentColor">時間 t</text></svg>'
        explain: 単振動は復元力が変位に比例する運動（F = −k x）。ばね振り子は m ω² = k から ω = √(k/m)、ふりこは小さな角で回復力が m g (x/l) になり ω = √(g/l)。周期はどちらも振幅によらない。T = 2π/ω なので、ω がわかれば T が出る。この単元では π = 3 で計算する。
