        text: たて向きの円では、中心は、最も低い点では上、最も高い点では下にある。中心向きの力の合計が m v² ÷ r になる。糸の張力を T、重力を m g とすると、最も低い点では T − m g = m v² ÷ r、最も高い点では T + m g = m v² ÷ r。
