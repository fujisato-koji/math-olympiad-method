        choices: [1.5 m/s, 3 m/s, 6 m/s, 12 m/s]
        answer: 3 m/s
        check: "'3 m/s'"
        hints:
          - 1 周で進む道のりは、円のまわりの長さ。
          - text: 円のまわりの長さは 2 π r。これを周期でわる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="95" r="64" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="160" cy="95" r="3" fill="currentColor"/><circle cx="212.4" cy="58.3" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">1 周 = 2 π r</text></svg>'
