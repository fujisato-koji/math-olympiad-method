# P-007 円運動と単振動（向心加速度、振り子、単振動の表し方）
#
# 水準 4・8 日。前提は P-003、G-025、P-188。等速円運動、周期、角速度（ラジアン毎秒）、向心加速度、向心力（水平面とたて向きの円）、単振動、振幅、ばね振り子とふりこの周期、円運動の影としての単振動。
# 円周率は 3、重力加速度は 10 m/s²（整数で計算できるように）。単位は m、s、kg、N、m/s、m/s²、rad/s。エネルギー保存は使わない。
id: P-007
days:
  - day: 1
    items:
      - part: 見本
        text: 一定の速さで円を回る動きを等速円運動という。1 周する時間を周期 T、1 秒に回る角度を角速度 ω（ラジアン毎秒）という。1 周は 2 π ラジアン。円周率は 3 として、半径 r の円の 1 周は 2 π r なので、速さは v = 2 π r ÷ T、角速度は ω = 2 π ÷ T、まとめて v = r ω になる。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="150" cy="100" r="3" fill="currentColor"/><line x1="150" y1="100" x2="197.5" y2="60.1" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="162.4" y="70.5" font-size="13" text-anchor="middle" fill="currentColor">r</text><line x1="197.5" y1="60.1" x2="182.1" y2="41.8" fill="none" stroke="#2a6fb0" stroke-width="2"/><polygon points="175.6,34.1 185.9,38.5 178.2,45" fill="#2a6fb0"/><circle cx="197.5" cy="60.1" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="150" y="190" font-size="14" text-anchor="middle" fill="currentColor">1 周の時間が周期 T</text><text x="192" y="26" font-size="16" text-anchor="middle" fill="currentColor">v</text></svg>'
        explain: 等速円運動は速さが一定でも向きが変わり続けるので、速度（ベクトル）は一定ではない。角速度 ω は 1 秒あたりに回る角（rad/s）で、1 周が 2π rad なので ω = 2π/T。円周の一部の長さ = 半径 × 角なので v = rω が出る。この単元では π = 3 として整数で計算する。
      - part: 今日
        text: 半径 2 m の円を、周期 4 s で回る物がある。速さは何 m/s か。円周率は 3 として計算する。
