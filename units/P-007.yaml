  - day: 3
    items:
      - part: 見本
        text: 円運動をする物には、中心向きの加速度があるので、中心向きの力がはたらく。これを向心力という。運動方程式 F = m a から、F = m v² ÷ r = m r ω² になる。向心力は新しい種類の力ではなく、中心向きにはたらく力につけた名前である。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="150" cy="100" r="3" fill="currentColor"/><line x1="150" y1="100" x2="197.5" y2="60.1" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="162.4" y="70.5" font-size="13" text-anchor="middle" fill="currentColor">r</text><line x1="197.5" y1="60.1" x2="180.8" y2="40.2" fill="none" stroke="#2a6fb0" stroke-width="2"/><polygon points="174.4,32.6 184.6,37 177,43.4" fill="#2a6fb0"/><line x1="197.5" y1="60.1" x2="177.6" y2="76.9" fill="none" stroke="#d04040" stroke-width="2"/><polygon points="169.9,83.3 174.4,73 180.8,80.7" fill="#d04040"/><circle cx="197.5" cy="60.1" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="192" y="24" font-size="16" text-anchor="middle" fill="currentColor">v</text><text x="190" y="96" font-size="16" text-anchor="middle" fill="currentColor">F</text><text x="150" y="190" font-size="14" text-anchor="middle" fill="currentColor">中心向きの力が向心力</text></svg>'
        explain: 向心力は、円運動に必要な「中心向きの力の合計」。ひもの張力、まさつ力、重力、台がおす力などが合わさって中心向きの成分が F = m v²/r になる。力が足りなければ円の外へ、大きすぎれば内へ進路がそれる。遠心力はふつうの見方では使わない（P-012 で学ぶ）。
      - part: 思い出す
        text: 半径 4 m の円を、速さ 8 m/s で回る物の、向心加速度の大きさは何 m/s² か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="95" r="64" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="160" cy="95" r="3" fill="currentColor"/><line x1="160" y1="95" x2="215.4" y2="127" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="195.7" y="101.1" font-size="13" text-anchor="middle" fill="currentColor">4 m</text><line x1="215.4" y1="127" x2="227.4" y2="106.2" fill="none" stroke="#2a6fb0" stroke-width="2"/><polygon points="232.4,97.6 231.8,108.7 223.1,103.7" fill="#2a6fb0"/><line x1="215.4" y1="127" x2="194.6" y2="115" fill="none" stroke="#d04040" stroke-width="2"/><polygon points="186,110 197.1,110.7 192.1,119.3" fill="#d04040"/><circle cx="215.4" cy="127" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">v = 8 m/s</text></svg>'
        choices: [2 m/s², 16 m/s², 32 m/s², 64 m/s²]
        answer: 16 m/s²
        check: "'16 m/s²'"
        hints:
          - 昨日の式。速さと半径から出す。
          - text: 加速度 = 速さの 2 回かけたものを半径でわる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="95" r="64" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="160" cy="95" r="3" fill="currentColor"/><line x1="160" y1="95" x2="215.4" y2="127" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="215.4" y1="127" x2="227.4" y2="106.2" fill="none" stroke="#2a6fb0" stroke-width="2"/><polygon points="232.4,97.6 231.8,108.7 223.1,103.7" fill="#2a6fb0"/><line x1="215.4" y1="127" x2="194.6" y2="115" fill="none" stroke="#d04040" stroke-width="2"/><polygon points="186,110 197.1,110.7 192.1,119.3" fill="#d04040"/><circle cx="215.4" cy="127" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">a = v² ÷ r</text></svg>'
          - 8 × 8 を 4 でわる。
