  - day: 2
    items:
      - part: 見本
        text: 円を回る物は、速さが一定でも向きが変わり続ける。だから加速度がある。その向きは円の中心。これを向心加速度という。大きさは a = v² ÷ r = r ω²。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="100" r="62" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="150" cy="100" r="3" fill="currentColor"/><line x1="150" y1="100" x2="197.5" y2="60.1" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="162.4" y="70.5" font-size="13" text-anchor="middle" fill="currentColor">r</text><line x1="197.5" y1="60.1" x2="182.1" y2="41.8" fill="none" stroke="#2a6fb0" stroke-width="2"/><polygon points="175.6,34.1 185.9,38.5 178.2,45" fill="#2a6fb0"/><line x1="197.5" y1="60.1" x2="179.1" y2="75.6" fill="none" stroke="#d04040" stroke-width="2"/><polygon points="171.4,82 175.9,71.7 182.3,79.4" fill="#d04040"/><circle cx="197.5" cy="60.1" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><text x="192" y="26" font-size="16" text-anchor="middle" fill="currentColor">v</text><text x="190" y="96" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="150" y="190" font-size="14" text-anchor="middle" fill="currentColor">向心加速度 a は中心向き</text></svg>'
        explain: 速度 v の向きは接線方向で、速さが一定でも向きが変わるので加速度が生じる。ごく短い時間 Δt での速度の変化は、円の中心向きの大きさ v Δθ = v ω Δt なので、a = v ω = v²/r = r ω² で中心向き。力の向きも中心向き（向心力）になる。
