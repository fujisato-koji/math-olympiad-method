    items:
      - part: わけ
        text: 半径 0.5 m の円の上を、角速度 2 rad/s で回る玉がある。玉の真下の直線に、玉のかげが落ちている。かげは、円の中心の真上に玉が来たとき、中心を通る。そのときのかげの速さは何 m/s か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="80" r="54" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="160" cy="80" r="3" fill="currentColor"/><line x1="160" y1="80" x2="160" y2="26" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="160" y1="26" x2="126" y2="26" fill="none" stroke="#2a6fb0" stroke-width="2"/><polygon points="116,26 126,21 126,31" fill="#2a6fb0"/><circle cx="160" cy="26" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><line x1="160" y1="38" x2="160" y2="168" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="50" y1="172" x2="270" y2="172" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="160" cy="172" r="6" fill="currentColor"/><text x="160" y="192" font-size="14" text-anchor="middle" fill="currentColor">かげ</text><text x="212" y="70" font-size="13" text-anchor="middle" fill="currentColor">A = 0.5 m</text><text x="232" y="50" font-size="13" text-anchor="middle" fill="currentColor">ω = 2 rad/s</text></svg>'
        choices: [0.25 m/s, 1 m/s, 2 m/s, 4 m/s]
        answer: 1 m/s
        check: "'1 m/s'"
        explain: 等速円運動を横から見たかげの動きが単振動（x = A sin ω t）になる。だから単振動の ω は円運動の角速度、振幅 A は円の半径、周期は円運動の周期に等しい。玉が中心の真上を通るとき、玉の速度は水平で大きさ v = A ω なので、かげの速さも A ω（単振動の最大の速さ）。はしでは玉の速度がかげの向きと直角で、かげは止まる。加速度も、玉の向心加速度 A ω² の水平成分で、はしで最大 A ω²、中心で 0。
        hints:
          - かげの動きは、玉の動きの横の成分。玉が中心の真上にあるとき、玉はどの向きに動いているか。
          - text: 玉の速度は、円の接線の向き。真上では水平になる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="80" r="54" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><circle cx="160" cy="80" r="3" fill="currentColor"/><line x1="160" y1="80" x2="160" y2="26" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="160" y1="26" x2="126" y2="26" fill="none" stroke="#2a6fb0" stroke-width="2"/><polygon points="116,26 126,21 126,31" fill="#2a6fb0"/><circle cx="160" cy="26" r="9" fill="#f3c969" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><line x1="160" y1="38" x2="160" y2="168" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="50" y1="172" x2="270" y2="172" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="160" cy="172" r="6" fill="currentColor"/><circle cx="160" cy="26" r="14" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - 水平なら、玉の速さのすべてがかげの動きになる。v = r ω を使う。
        paths:
          - [真上では玉の速度が水平, かげの速さ = 玉の速さ = v, v = r ω = 0.5 × 2]
          - [かげは x = A sin ω t で動く, 中心を通るときがいちばん速く A ω, 0.5 × 2]
