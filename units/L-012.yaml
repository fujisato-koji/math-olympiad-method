# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 平面に直線を引いて、平面をいくつかの部分に分けます。どの 2 本も平行でなく、どの 3 本も 1 点で交わらないように引きます。1 本なら 2 つ、2 本なら 4 つ、3 本なら 7 つに分かれます。10 本引くと、平面はいくつに分かれますか。
    svg: |
      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="115" x2="230" y2="45" stroke="currentColor" fill="none" stroke-width="2"/><line x1="10" y1="40" x2="230" y2="120" stroke="currentColor" fill="none" stroke-width="2"/><line x1="40" y1="135" x2="100" y2="5" stroke="currentColor" fill="none" stroke-width="2"/></svg>
    answer: 56
    check: "(lambda R: R(R, 10))(lambda f, n: 1 if n == 0 else f(f, n - 1) + n)"
    hints:
      - 3 本の図に 4 本目を引くと、4 本目はほかの直線と何回交わりますか。
      - 4 本目は、交わる点でいくつの部分に切られますか。その 1 つずつが、もとの部分を 2 つに分けます。
      - n 本目を引くと部分がいくつふえるかを使って、10 本まで進めましょう。
    paths:
      - [n 本目はほかの n − 1 本と n − 1 回交わる, n 本目は n 個に切られ 部分が n ふえる, 1 + 1 + 2 + … + 10 = 1 + 55 = 56, 56]
      - [n 本で 1 + n(n + 1)/2 と予想する, n = k で成り立つとして k + 1 本目で k + 1 ふえる, 1 + k(k + 1)/2 + (k + 1) = 1 + (k + 1)(k + 2)/2, n = 10 で 56]
    note: 数の列のきまり（aₙ₊₁ = aₙ + n + 1）が与えられておらず、図から自分で見つけるのが離の要点。n 本目の直線はほかの n − 1 本と交わって n 個に切られ、それぞれが 1 つの部分を 2 つに分ける。2 本目は帰納法で式を確かめる道。
