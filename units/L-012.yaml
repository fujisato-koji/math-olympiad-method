    text: 1/(1 × 2) + 1/(2 × 3) + 1/(3 × 4) + … + 1/(20 × 21) を計算しましょう。
    answer: 20/21
    check: "sum(Fraction(1, k * (k + 1)) for k in range(1, 21))"
    hints:
