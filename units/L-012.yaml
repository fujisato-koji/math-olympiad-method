        check: "[c for c, f in {'3k': lambda k: 3 * k, '3(k + 1)': lambda k: 3 * (k + 1), '3k + 1': lambda k: 3 * k + 1}.items() if all(f(k) == sum(range(3, 3 * k + 4, 3)) - sum(range(3, 3 * k + 1, 3)) for k in range(1, 30))][0]"
        hints:
