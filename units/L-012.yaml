    items:
      - part: 見本
        text: 4ⁿ − 1 は、どんな正の《整数》 n でも 3 の《倍数》であることを示しましょう。
        explain: ① n = 1 のとき、4 − 1 = 3 で 3 の倍数です。② n = k のとき 3 の倍数、つまり 4ᵏ − 1 = 3m（m は整数）だとします。すると 4ᵏ = 3m + 1 なので、4ᵏ⁺¹ − 1 = 4 × 4ᵏ − 1 = 4(3m + 1) − 1 = 12m + 3 = 3(4m + 1) となります。4m + 1 は整数なので、4ᵏ⁺¹ − 1 も 3 の倍数です。① と ② から、どの n でも 3 の倍数です。「つぎへ」では、n = k のときの式を「3m」と文字で置き、4ᵏ⁺¹ を 4 × 4ᵏ と分けて、置いた式を使える形にするのがかぎです。
