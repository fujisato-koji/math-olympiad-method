      - part: 今日
        text: 式「3 + 6 + 9 + … + 3n = 3n(n + 1)/2」を帰納法で示します。n = k から n = k + 1 へ進むとき、左辺に足す数は、どれですか。
        choices: [3k, 3(k + 1), 3k + 1]
