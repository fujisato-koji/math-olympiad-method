      - part: 今日
        text: 1 + 2 + … + n が 78 になるのは、n がいくつのときですか。
        answer: 12
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([n for n in range(1, 100) if sum(range(1, n + 1)) == 78])"
        hints:
          - n(n + 1)/2 = 78 なので、n(n + 1) はいくつかな。
          - となり合う 2 つの整数をかけて 156 になるのは、どれかな。
          - n(n + 1) が 156 になる n を、小さい n から順にためそう。
        paths:
          - [n(n + 1) = 156, 12 × 13 = 156, n = 12]

  - day: 3
    items:
      - part: 見本
        text: 1 = 1、1 + 3 = 4、1 + 3 + 5 = 9 …。「1 + 3 + 5 + … + (2n − 1) = n²」が、どんな正の《整数》 n でも成り立つことを、図で考えましょう。
        figure: "🔵🔵🔵🟠\n🔵🔵🔵🟠\n🔵🔵🔵🟠\n🟠🟠🟠🟠"
        explain: ① n = 1 のとき、左辺は 1、右辺は 1² = 1 で成り立ちます。② n = k のとき成り立つ、つまり 1 から k 個の奇数の和が k² だとします。k² は、たて k 個・横 k 個の正方形に並べた 🔵 の数です。n = k + 1 のときは、次の奇数 2k + 1 を足します。図のように、右に k 個、下に k 個、すみに 1 個（あわせて 2k + 1 個の 🟠）を足すと、たて k + 1 個・横 k + 1 個の正方形になります。だから k² + (2k + 1) = (k + 1)² で、n = k + 1 のときも成り立ちます。① と ② から、どの n でも成り立ちます。図は k = 3 のときで、9 + 7 = 16 です。
      - part: 思い出す
        text: 1 + 2 + … + k = S のとき、1 + 2 + … + k + (k + 1) + (k + 2) を S と k で表すと、どれですか。
