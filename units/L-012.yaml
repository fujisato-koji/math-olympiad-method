    note: 階段の上り方（8 日目）と同じ「2 つ前から決まる」形だが、横 2 マス分のふさぎ方が 2 通り（横置き 2 まい、2 × 2 のタイル）あるので 2tₙ₋₂ になる。左はしで場合に分けて前の結果から数える（C-009）のが要点。tₙ = (2ⁿ⁺¹ + (−1)ⁿ)/3 と予想して帰納法で確かめる発展もある。
