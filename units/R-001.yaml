        text: G = {0, 1, 2, 3} に、a ⊕ b を「a + b を 4 でわった余り」と決めます。G が 1 で生成されるわけを説明しましょう。
        explain: 「1 を 1 回、2 回、3 回、4 回たすと、1、2、3、0 になる。これは G のすべての要素である。よって 1 は G の生成元で、G は巡回群である。」と書ければよい。① 1 の累乗（ここではたし算の繰り返し）を順に書く、② 4 回で 0 に戻ることを見る、③ すべての要素が出たので生成元と結ぶ。子どもには、1 ⊕ 1 ⊕ 1 ⊕ 1 = 0 を、4 でわった余りで確かめさせます。
