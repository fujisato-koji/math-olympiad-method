        text: G = (Z, +)、H = (Z, +)、f(n) = 2n、K = 3Z とします。f を K に制限すると、K から 6Z への同型になるわけを説明しましょう。
        explain: 「K の要素は 3m と書け、f(3m) = 6m なので、行き先は 6Z。準同型は f から引き継がれる。単射：f(3a) = f(3b) なら 6a = 6b で a = b。全射：6Z の要素 6m は f(3m) と書ける。よって同型。」と書ければよい。① 行き先を 6Z に決める、② 準同型・単射・全射を順に確かめる、③ 同型と結ぶ。子どもには、制限した写像の核が {0} であることを確かめさせます。
