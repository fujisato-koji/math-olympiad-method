t x="246.5" y="104.5" font-size="13" text-anchor="middle" fill="currentColor">4</text><circle cx="271.3" cy="100" r="10" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/><text x="271.3" y="104.5" font-size="13" text-anchor="middle" fill="currentColor">5</text><circle cx="296" cy="100" r="10" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="296" y="104.5" font-size="13" text-anchor="middle" fill="currentColor">6</text><path d="M221.8 87 Q258.9 43 289.6 79.4" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="296,87 285.7,82.6 293.4,76.1" fill="currentColor"/><text x="258.9" y="59" font-size="14" text-anchor="middle" fill="currentColor">3 + 3 = 6</text><path d="M221.8 113 Q147.6 157 82.1 118.1" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="73.5,113 84.6,113.8 79.5,122.4" fill="currentColor"/><text x="147.6" y="152" font-size="14" text-anchor="middle" fill="currentColor">3 の逆元 −3</text><rect x="24" y="179" width="12" height="12" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="40" y="190" font-size="13" text-anchor="start" fill="currentColor">H：3 の倍数</text></svg>'
        text: |-
          《群》 G の《部分集合》 H が、G と同じ演算で群になるとき、H を G の《部分群》といいます。
          部分群かどうかは、次の 3 つで確かめられます（《結合法則》は G から引き継がれます）。
          ① 空でない：H に要素が 1 つ以上ある。
          ② 《閉じている》：a、b が H の要素なら、a·b も H の要素。
          ③ 《逆元》がある：a が H の要素なら、a の逆元も H の要素。
          G = (Z, +) と、その部分集合 H = {3n | n は《整数》}（3 の《倍数》全体）で、確かめてみましょう。図の黄色の丸が H の要素です。
          ・H は空ではありません（0 が入ります）。
          ・3 と 3 を選ぶと、3 + 3 = 6 で、6 も H に入ります（図の上の矢印）。
          ・3 の逆元は −3 で、−3 も H に入ります（図の下の矢印）。
          よって、H は (Z, +) の部分群です。
        explain: |-
          H = {3n | n は整数} は (Z, +) の部分群です。a、b が 3 の倍数なら、a = 3m、b = 3n と書けて、a + b = 3(m + n) も 3 の倍数です。a = 3m の逆元は −a = 3(−m) で、これも 3 の倍数です。0 = 3 × 0 も H にあります。
          一方、H = {1, 2, 3, …}（正の整数）は (Z, +) の部分群ではありません。0 が H になく、1 の逆元 −1 も H にないからです。
          H = {1, −1} は (Q \ {0}, ×) の部分群です。1 × 1 = 1、1 × (−1) = −1、(−1) × (−1) = 1 で閉じており、逆元も H にあります。
          正三角形の《対称移動》の群のうち、回転だけの {e, 120°, 240°} は部分群です。回転どうしの合成は回転で、逆元も回転です。
          子どもには、①〜③を順に確かめさせ、とくに「逆元が H に入るか」を見させます。
        note: 部分群は、G の一部の集まりが、G と同じ演算で群になるものです。①〜③のうち、③の「逆元が H に入るか」が抜けやすい。3Z のように、倍数の集まりは部分群の例になります。
