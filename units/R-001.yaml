        text: f：G → H を群の準同型とします。ker f が G の《部分群》であることを示しましょう。
        explain: 例：「① e_G ∈ ker f：f(e_G) = e_H。② a、b ∈ ker f なら f(ab) = f(a)f(b) = e_H e_H = e_H なので ab ∈ ker f。③ a ∈ ker f なら f(a⁻¹) = f(a)⁻¹ = e_H⁻¹ = e_H なので a⁻¹ ∈ ker f。よって ker f は G の部分群。」と書ければよい。①〜③を、部分群の 3 つの条件に沿って示す。子どもには、核の定義（f(x)=e_H）を、それぞれの条件で使わせます。
