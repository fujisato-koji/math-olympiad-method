          ・ker f = {e_G} である（《単位元》に写るのは単位元だけ）。
          わけ：f(a) = f(b) なら、f(a·b⁻¹) = f(a)·f(b)⁻¹ = e_H なので、a·b⁻¹ は《核》に入ります。核が {e_G} なら a·b⁻¹ = e_G、つまり a = b です。逆に、f が単射で f(a) = e_H = f(e_G) なら、a = e_G です。
          図は、f(n) = n を 4 でわった《余り》の対応です（n は 0〜7 だけを描いています）。同じ色の丸は、同じ行き先に集まっています。
          次の 3 つを調べましょう。
          ・f：(Z, +) → (Z, +)、f(n) = 2n
          ・f：(Z, +) → ({0, 1, 2, 3}, 4 でわった余りのたし算)、f(n) = n を 4 でわった余り
          ・f：(Q \ {0}, ×) → (Q \ {0}, ×)、f(x) = x²
        explain: |-
          ① f(n) = 2n：核は {0} なので単射です。実際、2a = 2b なら a = b です。
          ② f(n) = n を 4 でわった余り：核は 4Z で {0} ではないので単射ではありません。0 と 4 はどちらも 0 に写ります。
          ③ f(x) = x²：核は {1, −1} で {1} ではないので単射ではありません。1 と −1 はどちらも 1 に写ります。
        note: 単射かどうかは、核が単位元だけかで分かる。核に単位元以外の要素があれば、その要素と単位元が同じ所に写るので単射でない。
