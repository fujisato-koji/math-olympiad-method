# R-001 群の定義と例、部分群と準同型
#
# 12 日分と腕だめし 5 問を書いた。1 日目は群の定義と例、2〜9 日目は部分群・準同型・同型・巡回群、10 日目は証明、11 日目は混ぜる、12 日目は確認。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   画面が正誤を判定するため、数や選択肢の問題には answer を残す。証明・説明の問題は part: わけ にして answer を持たない。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 段 8・水準 4・12 日。1 日目は群の定義と例（閉じている、結合法則、単位元、逆元）。
# 前提は A-024（集合と写像）。A-024（集合と写像）の単射・全射、N-014（わり算とあまり）の余り、G-015（点の移動と図形の回転）の点の移動を使う。
# 4 でわった余りの演算は N-014 の言葉で書き、合同式の記号はまだ使わない。
# Z（整数全体）と Q（有理数全体）の記号は、《Z》《Q》と書いてマウスオーバーの説明を付ける。
# 正三角形の対称移動は G-015 の移動として扱う。

id: R-001
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          《群》とは、集合 G と、その上の演算 · の組で、次の 4 つの決まりを満たすものです。
          ① 《閉じている》：G のどの 2 つの要素 a、b についても、a·b がまた G に入る。
          ② 《結合法則》：(a·b)·c = a·(b·c) が、G のどの a、b、c でも成り立つ。
          ③ 《単位元》：G に e があり、G のどの a でも e·a = a·e = a となる。
          ④ 《逆元》：G のどの a にも、a·b = b·a = e となる b が G にある。
          この 4 つの決まりで、次の 4 つを調べましょう。
          ・《整数》全体の集合 《Z》 と、たし算
          ・整数全体の集合 Z と、かけ算
          ・1 と −1 を要素とする集合 {1, −1} と、かけ算
          ・正三角形の《対称移動》（回転と裏返し）と、「続けて行う」こと
          調べ方は、①から④までを順に確かめ、1 つでも成り立たなければ「群ではない」とすることです。
        explain: |-
          ① 整数全体 Z とたし算：(Z, +) は群です。整数どうしの和は整数で閉じており、(a + b) + c = a + (b + c)、単位元は 0、a の逆元は −a です。
          ② 整数全体 Z とかけ算：(Z, ×) は群ではありません。閉じている、結合法則、単位元 1 までは成り立ちますが、2 の逆元 1/2 が Z にないからです。
          ③ 1 と −1 を要素とする集合 {1, −1} とかけ算：群です。1 × 1 = 1、1 × (−1) = −1、(−1) × (−1) = 1 で閉じており、単位元は 1、1 の逆元は 1、−1 の逆元は −1 です（《位数》 2）。
          ④ 正三角形の対称移動と「続けて行う」こと：群です。6 つの対称移動（恒等、120° 回転、240° 回転、3 つの《鏡映》）は、2 つ続けて行うとまた対称移動になり、《写像》の合成は結合法則を満たし、恒等移動が単位元、回転の逆は逆向きの回転、鏡映の逆は自分自身です（位数 6）。ただし、回転してから鏡映するのと、鏡映してから回転するのは一般に違うので、この群は可換ではありません。群は可換でなくてもよい、ということをここで見ます。
          子どもには、4 つの決まりのどれが崩れるかを 1 つずつ確かめさせ、最後に「Z のかけ算は、どの要素にも逆元があるわけではない」とまとめさせます。
        note: 4 つの例を、①〜④の順に確かめさせる。Z のかけ算が崩れるのは④。正三角形の対称移動は、回転と鏡映の順を入れかえると結果が変わる（非可換）ことを見る。
      - part: 思い出す
        text: 写像 f：Z → Z を f(n) = 2n と決めます。f は《単射》ですか、《全射》ですか。A-024（集合と写像）の定義に戻って考えましょう。
        choices:
          - 単射だが全射でない
          - 全射だが単射でない
          - 全単射
          - 単射でも全射でもない
        answer: 単射だが全射でない
        check: "(lambda f: (lambda inj, sur: '全単射' if inj and sur else '単射だが全射でない' if inj else '全射だが単射でない' if sur else '単射でも全射でもない')(len(set(f(n) for n in range(-50, 51))) == 101, all(any(f(n) == y for n in range(-60, 61)) for y in range(-20, 21))))(lambda n: 2 * n)"
        hints:
          - 単射は「f(n₁) = f(n₂) ならば n₁ = n₂」です。2n₁ = 2n₂ から何が言えますか。
          - 全射は「どの整数 y にも f(n) = y となる n がある」です。y = 1 のとき、2n = 1 を満たす整数 n はありますか。
          - A-024（集合と写像）の単射・全射の定義を見直しましょう。
        paths:
          - [2n₁ = 2n₂ なら n₁ = n₂ で単射, 2n = 1 を満たす整数 n はない, 奇数に写らないので全射でない, 単射だが全射でない]
        note: f(n) = 2n は単射だが全射でない。奇数に写る整数がない。後の日で、f(a + b) = f(a) + f(b) を満たす群の《準同型》としてまた出てくる。
      - part: わけ
        text: G = {0, 1, 2, 3} に、a ⊕ b を「a + b を 4 でわった《余り》」と決めます。この演算で、3 の逆元を、単位元の定義から見つけ、見つけたわけを説明しましょう。
        explain: 単位元は、どの a にも a ⊕ e = a となる e です。0 を試すと a ⊕ 0 = a なので、単位元は 0 です。3 の逆元は、3 ⊕ b = 0 となる b です。b = 0、1、2、3 を順に試すと、3 ⊕ 1 = (3 + 1) を 4 でわった余り = 0 です。よって 3 の逆元は 1 です。4 でわった余りの世界では、3 の逆元は −3 ではなく 1 であることを、子どもに説明させます。N-014（わり算とあまり）の余りの求め方を見直してもよいです。
        hints:
          - まず単位元をさがしましょう。a ⊕ e = a となる e はどれですか。
          - 3 の逆元は、3 ⊕ b = 単位元 となる b です。
          - b = 0、1、2、3 を順に試し、3 + b が 4 でわり切れるものをさがしましょう。
        paths:
          - [単位元は 0（a ⊕ 0 = a）, 3 ⊕ b = 0 となる b をさがす, 3 ⊕ 1 = 4 の余り 0, 3 の逆元は 1]
        note: 4 でわった余りの世界では、3 の逆元は −3 ではなく 1。3 + 1 = 4 が 0 になる。N-014（わり算とあまり）の余りの求め方を使う。
      - part: 挑戦
        text: 正の《有理数》全体の集合 《Q》_(>0) は、かけ算について群になります。この群で、2/3 の逆元はどれですか。
        choices:
          - 2/3
          - 3/2
          - −2/3
          - 1
        answer: 3/2
        check: "Fraction(3, 2)"
        hints:
          - 逆元は、かけると単位元 1 になる数です。
          - (2/3) × b = 1 を満たす b をさがしましょう。
          - N-078（《分数》のかけ算とわり算）の《逆数》をかける計算を見直しましょう。
        paths:
          - [(2/3) × b = 1, b = 1 ÷ (2/3) = 3/2, (2/3) × (3/2) = 1]
        note: 正の有理数全体はかけ算で群。0 を入れると 0 の逆元がないので、Q 全体はかけ算で群でない。
      - part: わけ
        text: 群 G の単位元は、ただ 1 つだけであることを示しましょう。
        explain: 例：「e と e′ を、どちらも G の単位元とします。e は単位元なので、e·e′ = e′ です。e′ も単位元なので、e·e′ = e です。よって e = e·e′ = e′ で、単位元はただ 1 つです。」と書ければよい。① e と e′ を単位元と仮定する、② 同じ積 e·e′ を、e が単位元であることと e′ が単位元であることで 2 通りに読む、③ 2 つの結果が等しいので e = e′、と結ぶ。単位元の定義（e·a = a·e = a がすべての a で成り立つ）を、a = e′ と a = e の場合に使う。e·e′ = e′ と e·e′ = e の 2 つを書ければよい。A-024（集合と写像）の「2 つの集合が等しいことを示す」ときと同じで、仮定を置いて、定義を当てはめる。子どもには、e と e′ の両方を単位元と仮定したとき、e·e′ を 2 通りに読めることに気づかせます。
        hints:
          - e と e′ を、どちらも単位元だと仮定しましょう。
          - e が単位元であることを e·e′ に使うと、e·e′ は何になりますか。
          - e′ が単位元であることを使うと、e·e′ は何になりますか。
        paths:
          - [e、e′ を単位元とする, e が単位元なので e·e′ = e′, e′ が単位元なので e·e′ = e, よって e = e′]
        note: e と e′ の両方を単位元と仮定し、同じ積 e·e′ を 2 通りに読むのが要点。単位元の定義を、ほかの単位元自身に使う。
    extra:
      - part: 今日
