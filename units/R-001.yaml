      - part: わけ
        id: "bd67eae208"
        text: 準同型 f：G → H の像 im f が H の部分群であるわけを説明しましょう。
        explain: 「① e_H = f(e_G) なので e_H ∈ im f。② f(a)、f(b) ∈ im f なら、f(a)f(b) = f(ab) で、ab ∈ G なので f(ab) ∈ im f。③ f(a) ∈ im f なら、f(a)⁻¹ = f(a⁻¹) で、a⁻¹ ∈ G なので f(a⁻¹) ∈ im f。よって im f は H の部分群。」と書ければよい。①〜③を、H の演算で確かめる。子どもには、像の要素を f(a)、f(b) と書いて、G の要素 a、b に戻して考えるように伝えます。
        hints:
          - e_H は像に入りますか。f(e_G) を考えましょう。
          - text: a と b を例にして、2 通りの道を見ましょう。f(a) と f(b) の積は、どの箱に書けますか。
