    text: 正方形の対称移動の群で、回転だけの {e, 90°, 180°, 270°} は《部分群》ですか。また、《鏡映》を 1 つだけ入れた {e, s} は部分群ですか。
    choices: ["回転だけは部分群で、{e, s} も部分群", "回転だけは部分群だが、{e, s} は部分群でない", "回転だけは部分群でなく、{e, s} も部分群でない", "どちらも部分群でない"]
    answer: "回転だけは部分群で、{e, s} も部分群"
    check: "'回転だけは部分群で、{e, s} も部分群' if all((a + b) % 4 in range(4) for a in range(4) for b in range(4)) and all((-a) % 4 in range(4) for a in range(4)) and all((a + b) % 2 in range(2) for a in range(2) for b in range(2)) and all((-a) % 2 in range(2) for a in range(2)) else 'どちらも部分群でない'"
    hints:
      - 回転だけの集まりは、2 つ続けても回転ですか。《逆元》も回転ですか。
      - text: 鏡映 s は、赤い線を軸に裏返す移動です。2 回続けると、頂点はどうなりますか。
