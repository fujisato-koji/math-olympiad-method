          - b = 0、1、2、3 を順に試しましょう。
        paths:
          - [単位元は 0, 1 ⊕ 3 = 4 の余り 0, 1 の逆元は 3]
      - part: 今日
        text: G = {1, −1} のかけ算で、単位元はどれですか。
        choices: [1, −1, 0, 2]
        answer: 1
        check: "[e for e in [1, -1, 0, 2] if all(e * a == a for a in [1, -1])][0]"
        hints:
          - 単位元は、どの a にも e × a = a × e = a となる e です。
          - 1 をかけたときと、−1 をかけたときを比べましょう。
          - 1 × a = a が、a = 1 でも a = −1 でも成り立つか確かめましょう。
        paths:
          - [1 × 1 = 1、1 × (−1) = −1, 1 はどの a にも a を変えない, 単位元は 1]
      - part: わけ
        text: 次の 4 つの組のうち、群でないものを 1 つ選び、群でないわけを説明しましょう。① (Z, +) ② ({1, −1}, ×) ③ (Z, ×) ④ (正の有理数全体, ×)
        explain: 群でないのは ③ (Z, ×) です。① (Z, +) は、単位元 0、a の逆元 −a があり、群です。② ({1, −1}, ×) は、単位元 1、1 の逆元 1、−1 の逆元 −1 があり、群です。④ (正の有理数全体, ×) は、0 を含まないので、a/b の逆元 b/a がいつも正の有理数になり、群です。③ (Z, ×) は、閉じている、結合法則、単位元 1 までは成り立ちますが、2 の逆元 1/2 が Z にないので群ではありません。「どの要素にも逆元がある」がどこで崩れるかを見ます。子どもには、4 つの決まりのうち、どの決まりが崩れるかを 1 つ言わせます。
        hints:
          - 4 つの決まりのうち、どれが崩れるかを見ましょう。
          - かけ算の組では、2 の逆元がその集合に入るかを確かめましょう。
          - ④ は 0 を含まないことに注意しましょう。
        paths:
          - [① は 0 が単位元、−a が逆元で群, ② は 1 が単位元、−1 の逆元は −1 で群, ③ は 2 の逆元 1/2 が Z にないので群でない, ④ は 0 を含まず、a/b の逆元 b/a があるので群, 群でないのは ③]
        note: Z のかけ算は、閉じている・結合法則・単位元までは成り立つが、逆元で崩れる。群でない理由を 1 つ言えればよい。

  - day: 2
    items:
      - part: 見本
        text: |-
          《群》 G の《部分集合》 H が、G と同じ演算で群になるとき、H を G の《部分群》といいます。
          部分群かどうかは、次の 3 つで確かめられます（《結合法則》は G から引き継がれます）。
          ① 空でない：H に要素が 1 つ以上ある。
          ② 《閉じている》：a、b が H の要素なら、a·b も H の要素。
          ③ 《逆元》がある：a が H の要素なら、a の逆元も H の要素。
          G = (Z, +) と、その部分集合 H = {3n | n は《整数》}（3 の《倍数》全体）で、確かめてみましょう。
          ・H は空ではありません（0 が入ります）。
          ・3 と 6 を選ぶと、3 + 6 = 9 で、9 も H に入ります。
          ・3 の逆元は −3 で、−3 も H に入ります。
          よって、H は (Z, +) の部分群です。
        explain: |-
          H = {3n | n は整数} は (Z, +) の部分群です。a、b が 3 の倍数なら、a = 3m、b = 3n と書けて、a + b = 3(m + n) も 3 の倍数です。a = 3m の逆元は −a = 3(−m) で、これも 3 の倍数です。0 = 3 × 0 も H にあります。
          一方、H = {1, 2, 3, …}（正の整数）は (Z, +) の部分群ではありません。0 が H になく、1 の逆元 −1 も H にないからです。
          H = {1, −1} は (Q \ {0}, ×) の部分群です。1 × 1 = 1、1 × (−1) = −1、(−1) × (−1) = 1 で閉じており、逆元も H にあります。
          正三角形の《対称移動》の群のうち、回転だけの {e, 120°, 240°} は部分群です。回転どうしの合成は回転で、逆元も回転です。
          子どもには、①〜③を順に確かめさせ、とくに「逆元が H に入るか」を見させます。
        note: 部分群は、G の一部の集まりが、G と同じ演算で群になるものです。①〜③のうち、③の「逆元が H に入るか」が抜けやすい。3Z のように、倍数の集まりは部分群の例になります。
      - part: 思い出す
        text: G = {0, 1, 2, 3} に、a ⊕ b を「a + b を 4 でわった《余り》」と決めます。3 の逆元はどれですか。
        choices: [0, 1, 2, 3]
        answer: 1
        check: "[b for b in range(4) if (3 + b) % 4 == 0][0]"
        hints:
          - 《単位元》は 0 です。3 ⊕ b = 0 となる b をさがしましょう。
          - 3 + b が 4 でわり切れる b を、0〜3 からさがしましょう。
          - 3 + 1 = 4 です。4 を 4 でわった余りはいくつですか。
        paths:
          - [単位元は 0, 3 ⊕ 1 = 4 の余り 0, 3 の逆元は 1]
      - part: 思い出す
        text: Z のたし算で、5 の逆元はいくつですか。
        answer: −5
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(-5)"
        hints:
          - 逆元は、たすと単位元 0 になる数です。
          - 5 + ? = 0 を満たす数を考えましょう。
          - 5 の反対の数は、《数直線》のどこにありますか（N-027 《正負の数》のかけ算とわり算）。
        paths:
          - [5 + (−5) = 0, 5 の逆元は −5]
        note: たし算の逆元は、符号を変えた数。かけ算の逆元（《逆数》）と取りちがえない。
      - part: 今日
        text: H = {2n | n は整数}（偶数全体）は、(Z, +) の部分群ですか。
        choices: [部分群である, 部分群でない]
        answer: 部分群である
        check: "'部分群である' if all((a + b) % 2 == 0 for a in range(-20, 21, 2) for b in range(-20, 21, 2)) and all((-a) % 2 == 0 for a in range(-20, 21, 2)) else '部分群でない'"
        hints:
          - H に 0 は入っていますか。
          - 偶数と偶数をたすと、偶数になりますか。
          - 偶数の逆元（符号を変えた数）も、偶数ですか。
        paths:
          - [0 は偶数なので H に入る, 偶数 + 偶数は偶数なので閉じている, 偶数 a の逆元 −a も偶数, 部分群である]
        note: 偶数全体は 2Z と書き、(Z, +) の部分群。3Z、4Z も同じように部分群になる。
      - part: 今日
        text: H = {2n + 1 | n は 0 以上の整数}（正の奇数全体）は、(Z, +) の部分群ですか。
        choices: [部分群である, 部分群でない]
        answer: 部分群でない
        check: "'部分群でない' if any((a + b) % 2 == 0 for a in [1, 3, 5, 7] for b in [1, 3, 5, 7]) else '部分群である'"
        hints:
          - H に 0 は入っていますか。
          - 1 と 3 をたすと、H に入りますか。
          - 1 の逆元 −1 は、H に入っていますか。
        paths:
          - [0 は奇数でないので H に入らない, 1 + 3 = 4 は奇数でないので閉じていない, 1 の逆元 −1 も H にない, 部分群でない]
        note: 正の奇数は、0 がない・和が閉じない・逆元がない、の 3 つで崩れる。1 つ見つければ部分群でないと言える。
      - part: 挑戦
        text: H = {3n | n は整数}（3 の倍数全体）は、(Z, +) の部分群です。H の要素 3 の、H の中での逆元はどれですか。
        choices: [−3, 0, 3, 6]
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([b for b in range(-30, 31, 3) if 3 + b == 0][0])"
        hints:
          - H は 3 の倍数全体です。3 の逆元は、H の要素 b で 3 + b = 0 となるものです。
          - Z の中での 3 の逆元を考え、それが H の要素でもあるかを確かめましょう。
          - H には負の倍数も入ります。3 とたして 0 になる数を、H の中からさがしましょう。
        paths:
          - [3 + (−3) = 0, −3 は 3 の倍数なので H に入る, 3 の H の中での逆元は −3]
        note: H の中での逆元は、G の中での逆元と同じとは限らないが、3Z のように G の逆元が H にも入っていれば同じになる。
    extra:
      - part: 今日
        text: H = {5n | n は整数}（5 の倍数全体）は、(Z, +) の部分群ですか。
        choices: [部分群である, 部分群でない]
        answer: 部分群である
        check: "'部分群である' if all((a + b) % 5 == 0 for a in range(-20, 21, 5) for b in range(-20, 21, 5)) and all((-a) % 5 == 0 for a in range(-20, 21, 5)) else '部分群でない'"
        hints:
          - H に 0 は入っていますか。
          - 5 の倍数どうしをたすと、5 の倍数になりますか。
          - 5 の倍数の逆元も、5 の倍数ですか。
        paths:
          - [0 は 5 の倍数, 5 の倍数 + 5 の倍数は 5 の倍数, 逆元も 5 の倍数, 部分群である]
      - part: 今日
        text: H = {0, 1} は、(Z, +) の部分群ですか。
        choices: [部分群である, 部分群でない]
        answer: 部分群でない
        check: "'部分群でない' if any((a + b) not in [0, 1] for a in [0, 1] for b in [0, 1]) else '部分群である'"
        hints:
