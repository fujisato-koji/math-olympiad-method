        text: |-
          《群》 G から群 H への《準同型》 f について、次の 2 つを考えます。
          ・《像》 im f：H の要素で、f(g) = h となる g があるもの全体。im f = {f(g) | g は G の要素}。
          ・《核》 ker f：G の要素で、f(g) = e_H となるもの全体。ker f = {g | f(g) = e_H}。
          次の 4 つの像と核を調べましょう。
          ・f: (Z, +) → (Z, +)、f(n) = 2n
          ・f: (Z, +) → ({0, 1, 2, 3}, 4 でわった《余り》のたし算)、f(n) = n を 4 でわった余り
          ・f: (Z, +) → ({1, −1}, ×)、f(n) = (−1)^n
          ・f: (Q \ {0}, ×) → (Q \ {0}, ×)、f(x) = x²
        explain: |-
          ① f(n) = 2n：像は 2Z（偶数全体）、核は {0}。2n = 0 となる n は 0 だけです。
          ② f(n) = n を 4 でわった余り：像は {0, 1, 2, 3} 全体、核は 4Z（4 の《倍数》全体）。4 でわって余りが 0 になる《整数》は 4 の倍数です。
          ③ f(n) = (−1)^n：像は {1, −1}、核は 2Z（偶数全体）。(−1)^n = 1 となる n は偶数です。
          ④ f(x) = x²：像は正の《有理数》の平方全体 {q² | q は 0 でない有理数}、核は {1, −1}。x² = 1 となる x は 1 と −1 です。像は正の有理数全体ではありません（2 は有理数の平方にならない）。
        note: 像は H の《部分集合》、核は G の部分集合。像を「正の有理数全体」と取りちがえないこと。核は《単位元》に写る要素の集まり。
