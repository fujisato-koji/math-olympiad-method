        text: H = {5n | n は整数}（5 の倍数全体）が、(Z, +) の部分群であるわけを説明しましょう。
        explain: H の要素は 5n（n は整数）と書けます。① 空でない：0 = 5 × 0 が H にあります。② 閉じている：5m + 5n = 5(m + n) で、m + n は整数なので、和も H に入ります。③ 逆元：5m の逆元は −5m = 5(−m) で、−m は整数なので、逆元も H に入ります。よって H は部分群です。子どもには、5m と 5n の文字を使って、和と逆元を H の形（5 × 整数）に書かせます。
