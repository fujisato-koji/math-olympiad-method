        text: f：(Z, +) → (2Z, +)、f(n) = 2n が同型であるわけを説明しましょう。
        explain: 「準同型：f(m+n)=2(m+n)=2m+2n=f(m)+f(n)。単射：f(a)=f(b) なら 2a=2b で a=b。全射：2Z の任意の要素 2n は f(n) と書ける。よって全単射の準同型なので同型。」と書ければよい。① 準同型、② 単射、③ 全射（行き先は 2Z）の 3 つを順に示す。子どもには、全射の行き先が Z ではなく 2Z であることに注意させます。
        hints:
          - 準同型であることを示しましょう。
          - 単射であることを示しましょう。
