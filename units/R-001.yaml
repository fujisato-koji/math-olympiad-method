    items:
      - part: 見本
        text: |-
          《群》 G のすべての要素が、1 つの要素 g の累乗（g、g²、g³、…、g⁻¹、…）で書けるとき、G を《巡回群》といい、g を《生成元》といいます。
          ・(Z, +) は 1 で生成される（…、−2、−1、0、1、2、… は 1 の《倍数》）。
          ・G = ({0, 1, 2, 3}, 4 でわった《余り》のたし算) は 1 で生成される（1、2、3、0）。
          ・G = ({0, 1, 2, 3}, 4 でわった余りのたし算) は 3 でも生成される（3、2、1、0）。
          ・G = ({1, −1}, ×) は −1 で生成される（−1、1）。
          また、要素 g の《位数》は、g^n = e となる最小の正の《整数》 n です。
          ・4 でわった余りのたし算で、2 の位数は 2（2、0）。
          ・({1, −1}, ×) で、−1 の位数は 2（−1、1）。
          次の 3 つを調べましょう。
          ・G = ({0, 1, 2, 3}, 4 でわった余りのたし算) で、1 は生成元か。
          ・同じ G で、2 は生成元か。
          ・G = ({1, −1}, ×) で、−1 の位数はいくつか。
        explain: |-
          ① 1 は生成元：1、1 + 1 = 2、1 + 1 + 1 = 3、1 + 1 + 1 + 1 = 0 で、すべての要素が出ます。
          ② 2 は生成元でない：2、2 + 2 = 0、2 + 2 + 2 = 2、… で、0 と 2 しか出ません。
          ③ −1 の位数：−1、(−1)² = 1 で 1 になります。最小の正の整数は 2 です。
        note: 生成元は 1 つとは限らない。4 でわった余りのたし算では、1 と 3 が生成元。位数は、《単位元》に戻るまでの最小の回数。
