        text: 図は f：(Z, +) → (Z, +)、f(n) = 2n の対応です（左が n、右が f(n)）。f の《核》はどれですか。
        choices: ["{0}", "2Z", "Z", "4Z"]
        answer: "{0}"
        check: "[c for c, s in {'{0}': {0}, '2Z': set(range(-20, 21, 2)), 'Z': set(range(-20, 21)), '4Z': set(range(-20, 21, 4))}.items() if s == {n for n in range(-20, 21) if 2 * n == 0}][0]"
        hints:
