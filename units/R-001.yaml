      - part: わけ
        text: f：G → H を《群》の《準同型》とします。f(e_G) = e_H であることを示しましょう。
        explain: 例：「f(e_G) = f(e_G·e_G) = f(e_G)·f(e_G)。両辺に f(e_G) の《逆元》をかけると、e_H = f(e_G)。」と書ければよい。① e_G = e_G·e_G を使う、② 準同型の定義で f(e_G)·f(e_G) にする、③ 両辺に f(e_G)⁻¹ をかけて e_H = f(e_G) を出す。子どもには、f(e_G) を 1 つの群の要素として、その逆元をかけさせます。
