      - part: わけ
        id: "ee8b5a96d7"
        text: 準同型 f：G → H が単射であることと、ker f = {e_G} であることが同値であるわけを説明しましょう。
        explain: 「f が単射なら、f(a) = e_H = f(e_G) から a = e_G なので、ker f = {e_G}。逆に、ker f = {e_G} とし、f(a) = f(b) とすると、f(a·b⁻¹) = f(a)·f(b)⁻¹ = e_H なので a·b⁻¹ ∈ ker f。よって a·b⁻¹ = e_G、すなわち a = b。だから f は単射。」と書ければよい。① 単射 → 核が単位元だけ、② 核が単位元だけ → 単射、の両方を示す。② では f(a·b⁻¹) を使う。子どもには、f(b⁻¹) = f(b)⁻¹ を使って a·b⁻¹ を作らせます。
        hints:
          - 単射なら、f(a) = e_H = f(e_G) から何が言えますか。
          - 逆に、f(a) = f(b) として、a·b⁻¹ を f に入れると何になりますか。
          - a·b⁻¹ が核に入るので、a·b⁻¹ = e_G です。そこから a = b を出しましょう。
        paths:
          - [単射なら f(a)=e_H=f(e_G) から a=e_G, 逆に f(a)=f(b) なら f(a·b⁻¹)=e_H, a·b⁻¹=e_G, a=b, 単射]

