          ① 空でない：f(e_G) = e_H なので、e_G は核に入る。
          ② 《閉じている》：a、b が核に入るなら、f(a·b) = f(a)·f(b) = e_H·e_H = e_H なので、a·b も核に入る。
          ③ 《逆元》：a が核に入るなら、f(a⁻¹) = f(a)⁻¹ = e_H⁻¹ = e_H なので、a⁻¹ も核に入る。
          《像》も同じように、e_H = f(e_G)、f(a)·f(b) = f(a·b)、f(a)⁻¹ = f(a⁻¹) で確かめられます。
          例：f：(Z, +) → ({0, 1, 2, 3}, 4 でわった《余り》のたし算)、f(n) = n を 4 でわった余り では、ker f = 4Z は Z の部分群、im f = {0, 1, 2, 3} は行き先の《群》そのものです。
        explain: |-
          核：① e_G ∈ ker f。② a、b ∈ ker f なら f(ab)=e_H e_H=e_H。③ a ∈ ker f なら f(a⁻¹)=f(a)⁻¹=e_H⁻¹=e_H。よって部分群です。
          像：① e_H=f(e_G) ∈ im f。② f(a)、f(b) ∈ im f なら f(a)f(b)=f(ab) ∈ im f。③ f(a) ∈ im f なら f(a)⁻¹=f(a⁻¹) ∈ im f。よって部分群です。
          例：f(n)=n mod 4 では、ker f=4Z、im f={0,1,2,3}。f(n)=2n では、ker f={0}、im f=2Z。f(n)=(−1)^n では、ker f=2Z、im f={1,−1}。
        note: 核は G の部分群、像は H の部分群。行き先の群が違うので、どちらの部分群かを取りちがえない。
