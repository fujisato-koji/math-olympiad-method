        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="95" cy="100" rx="82" ry="88" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><ellipse cx="95" cy="100" rx="58" ry="64" fill="#f08080" fill-opacity="0.2" stroke="currentColor" stroke-width="1.5"/><text x="95" y="32" font-size="13" text-anchor="middle" fill="currentColor">ker f</text><ellipse cx="250" cy="100" rx="56" ry="88" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="108" y1="58" x2="226.4" y2="97.5" fill="none" stroke="currentColor" stroke-width="1.6"/><polygon points="234,100 225.1,101.3 227.7,93.7" fill="currentColor"/><line x1="108" y1="86" x2="226" y2="99.1" fill="none" stroke="currentColor" stroke-width="1.6"/><polygon points="234,100 225.6,103.1 226.5,95.1" fill="currentColor"/><line x1="108" y1="114" x2="226" y2="100.9" fill="none" stroke="currentColor" stroke-width="1.6"/><polygon points="234,100 226.5,104.9 225.6,96.9" fill="currentColor"/><line x1="108" y1="142" x2="226.4" y2="102.5" fill="none" stroke="currentColor" stroke-width="1.6"/><polygon points="234,100 227.7,106.3 225.1,98.7" fill="currentColor"/><circle cx="95" cy="58" r="12" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="95" y="62.5" font-size="13" text-anchor="middle" fill="currentColor">e</text><circle cx="95" cy="86" r="12" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="95" y="90.5" font-size="13" text-anchor="middle" fill="currentColor">a</text><circle cx="95" cy="114" r="12" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="95" y="118.5" font-size="13" text-anchor="middle" fill="currentColor">b</text><circle cx="95" cy="142" r="12" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="95" y="146.5" font-size="13" text-anchor="middle" fill="currentColor">ab</text><circle cx="250" cy="100" r="14" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="1.5"/><text x="250" y="105" font-size="13" text-anchor="middle" fill="currentColor">e</text><text x="95" y="194" font-size="14" text-anchor="middle" fill="currentColor">G</text><text x="250" y="194" font-size="14" text-anchor="middle" fill="currentColor">H</text></svg>'
        text: |-
          《準同型》 f：G → H について、次が成り立ちます。
          ・ker f は G の《部分群》である。
          ・im f は H の部分群である。
          《核》が部分群であることの確かめ方：
          ① 空でない：f(e_G) = e_H なので、e_G は核に入る。
          ② 《閉じている》：a、b が核に入るなら、f(a·b) = f(a)·f(b) = e_H·e_H = e_H なので、a·b も核に入る。
          ③ 《逆元》：a が核に入るなら、f(a⁻¹) = f(a)⁻¹ = e_H⁻¹ = e_H なので、a⁻¹ も核に入る。
          図は、核の要素 e、a、b と積 ab が、どれも行き先の e_H に集まるようすです（赤い囲みが核）。
          《像》も同じように、e_H = f(e_G)、f(a)·f(b) = f(a·b)、f(a)⁻¹ = f(a⁻¹) で確かめられます。
          例：f：(Z, +) → ({0, 1, 2, 3}, 4 でわった《余り》のたし算)、f(n) = n を 4 でわった余り では、ker f = 4Z は Z の部分群、im f = {0, 1, 2, 3} は行き先の《群》そのものです。
        explain: |-
          核：① e_G ∈ ker f。② a、b ∈ ker f なら f(ab)=e_H e_H=e_H。③ a ∈ ker f なら f(a⁻¹)=f(a)⁻¹=e_H⁻¹=e_H。よって部分群です。
          像：① e_H=f(e_G) ∈ im f。② f(a)、f(b) ∈ im f なら f(a)f(b)=f(ab) ∈ im f。③ f(a) ∈ im f なら f(a)⁻¹=f(a⁻¹) ∈ im f。よって部分群です。
          例：f(n)=n mod 4 では、ker f=4Z、im f={0,1,2,3}。f(n)=2n では、ker f={0}、im f=2Z。f(n)=(−1)^n では、ker f=2Z、im f={1,−1}。
        note: 核は G の部分群、像は H の部分群。行き先の群が違うので、どちらの部分群かを取りちがえない。
