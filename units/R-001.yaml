  - day: 4
    items:
      - part: 見本
        text: |-
          《群》 G から群 H への《写像》 f が、G のどの a、b でも
          f(a·b) = f(a)·f(b)
          を満たすとき、f を群の《準同型》といいます。
          準同型では、次の 2 つも成り立ちます。
          ・f(e_G) = e_H（G の《単位元》は H の単位元に写る）
          ・f(a⁻¹) = f(a)⁻¹（a の《逆元》は f(a) の逆元に写る）
          次の 4 つを調べましょう。
          ・f: (Z, +) → (Z, +)、f(n) = 2n
          ・f: (Z, +) → ({1, −1}, ×)、f(n) = (−1)^n
          ・f: (Q \ {0}, ×) → (Q \ {0}, ×)、f(x) = x²
          ・f: (Z, +) → (Z, +)、f(n) = n + 1
        explain: |-
          f(a·b) = f(a)·f(b) を確かめます。
          ① f(n) = 2n：f(m + n) = 2(m + n) = 2m + 2n = f(m) + f(n) で、準同型です。
          ② f(n) = (−1)^n：f(m + n) = (−1)^(m + n) = (−1)^m(−1)^n = f(m)f(n) で、準同型です。
          ③ f(x) = x²：f(xy) = (xy)² = x²y² = f(x)f(y) で、準同型です。
          ④ f(n) = n + 1：f(m + n) = m + n + 1 ですが、f(m) + f(n) = (m + 1) + (n + 1) = m + n + 2 で、一般に等しくなりません。とくに f(0 + 0) = 1、f(0) + f(0) = 2 なので、準同型ではありません。
          ③ の《像》は正の《有理数》の平方全体、《核》は {1, −1} です。② の像は {1, −1}、核は 《2Z》 です。
        note: 準同型は「かけ算（演算）を保つ写像」。④ のように、単位元を単位元に写さない写像は準同型でない。③ の像は「正の有理数全体」ではなく「平方全体」なので注意。
