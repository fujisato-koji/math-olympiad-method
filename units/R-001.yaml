      - part: 挑戦
        id: "0d7ab71f1d"
        text: 正の《有理数》全体の集合 《Q》_(>0) は、かけ算について群になります。この群で、2/3 の逆元はどれですか。
        choices:
          - 2/3
          - 3/2
          - −2/3
          - 1
        answer: 3/2
        check: "Fraction(3, 2)"
        hints:
          - 逆元は、かけると単位元になる数です。この群の単位元は、どの数ですか。
          - もとの数にかけて単位元になる相手を、分数のかけ算で見つけましょう。
          - N-078（《分数》のかけ算とわり算）の《逆数》を見直しましょう。
        paths:
          - [(2/3) × b = 1, b = 1 ÷ (2/3) = 3/2, (2/3) × (3/2) = 1]
        note: 正の有理数全体はかけ算で群。0 を入れると 0 の逆元がないので、Q 全体はかけ算で群でない。
      - part: わけ
        id: "2d6fe62ce9"
        text: 群 G の単位元は、ただ 1 つだけであることを示しましょう。
        explain: 例：「e と e′ を、どちらも G の単位元とします。e は単位元なので、e·e′ = e′ です。e′ も単位元なので、e·e′ = e です。よって e = e·e′ = e′ で、単位元はただ 1 つです。」と書ければよい。① e と e′ を単位元と仮定する、② 同じ積 e·e′ を、e が単位元であることと e′ が単位元であることで 2 通りに読む、③ 2 つの結果が等しいので e = e′、と結ぶ。単位元の定義（e·a = a·e = a がすべての a で成り立つ）を、a = e′ と a = e の場合に使う。e·e′ = e′ と e·e′ = e の 2 つを書ければよい。A-024（集合と写像）の「2 つの集合が等しいことを示す」ときと同じで、仮定を置いて、定義を当てはめる。子どもには、e と e′ の両方を単位元と仮定したとき、e·e′ を 2 通りに読めることに気づかせます。
        hints:
          - e と e′ を、どちらも単位元だと仮定しましょう。
          - text: e が単位元であることを e·e′ に使うと、e·e′ は何になりますか。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="110" y="30" width="100" height="32" rx="6" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/><text x="160" y="52" font-size="16" text-anchor="middle" fill="currentColor">e · e′</text><line x1="138" y1="68" x2="94.8" y2="106.1" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="88,112 91.8,102.7 97.7,109.4" fill="currentColor"/><line x1="182" y1="68" x2="225.2" y2="106.1" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="232,112 222.3,109.4 228.2,102.7" fill="currentColor"/><text x="80" y="138" font-size="16" text-anchor="middle" fill="currentColor">= ？</text><text x="240" y="138" font-size="16" text-anchor="middle" fill="currentColor">= ？</text><text x="80" y="166" font-size="13" text-anchor="middle" fill="currentColor">e が単位元と読む</text><text x="240" y="166" font-size="13" text-anchor="middle" fill="currentColor">e′ が単位元と読む</text></svg>'
          - e′ が単位元であることを使うと、e·e′ は何になりますか。
        paths:
          - [e、e′ を単位元とする, e が単位元なので e·e′ = e′, e′ が単位元なので e·e′ = e, よって e = e′]
        note: e と e′ の両方を単位元と仮定し、同じ積 e·e′ を 2 通りに読むのが要点。単位元の定義を、ほかの単位元自身に使う。
