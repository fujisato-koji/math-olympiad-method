        text: |-
          《群》・《部分群》・《準同型》を組み合わせた例を調べましょう。
          例 1：G = (Z, +)、H = (Z, +)、f(n) = 2n、K = 3Z とします。図の黄色の丸が K と、その行き先 f(K) です。
          ・f は準同型である。
          ・f の《核》は {0}、《像》は 2Z。
          ・K は G の部分群である。
          ・f(K) = {2n | n は 3 の《倍数》} = 6Z は、H の部分群である。
          ・f を K に制限すると、K から 6Z への《同型》になる。
          例 2：g：Z → ({0, 1, 2, 3}, 4 でわった《余り》のたし算)、g(n) = n を 4 でわった余り、L = 2Z とします。
          ・g(L) = {0, 2}。
          ・g を L に制限すると、0 と 4 がどちらも 0 に写るので、《単射》でない。同型にならない。
          次の 3 つを調べましょう。
          ・f(K) は何か。
          ・g(L) は何か。
          ・g を L に制限すると同型になるか。
        explain: |-
          例 1：f(K) は、3 の倍数 n に対する 2n の集まりで、6 の倍数全体 6Z です。f を K に制限すると、K から 6Z への《写像》になり、準同型・単射・《全射》なので同型です。
          例 2：g(L) は、偶数 n の 4 でわった余りで、{0, 2} です。g を L に制限すると、0 と 4 がどちらも 0 に写るので単射でなく、同型ではありません。
        note: 準同型を部分群に制限すると、行き先は像に制限する。単射かどうかは、制限した写像の核で確かめる。
