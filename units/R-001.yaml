        text: |-
          2 つの《群》 G、H の間に、《全単射》で《準同型》な《写像》 f：G → H があるとき、G と H は《同型》であるといい、G ≅ H と書きます。f を同型写像といいます。
          図は f(n) = 2n：Z → 2Z の対応です。左のどの丸にも右のどの丸にも、矢印がちょうど 1 本ずつあります（全単射）。
          同型な群は、演算の仕組みが同じです。次の 4 つを調べましょう。
          ・f：(Z, +) → (2Z, +)、f(n) = 2n
          ・f：({1, −1}, ×) → ({0, 1}, 2 でわった《余り》のたし算)、f(1) = 0、f(−1) = 1
          ・f：(Q \ {0}, ×) → (Q \ {0}, ×)、f(x) = 1/x
          ・f：(Z, +) → (Z, +)、f(n) = n + 1
        explain: |-
          ① f(n) = 2n：準同型で、《単射》（《核》 {0}）かつ《全射》（《像》 2Z）なので、同型です。
          ② f(1) = 0、f(−1) = 1：全単射で、f(ab) = f(a) + f(b) を 4 通り確かめると準同型です。同型です。
          ③ f(x) = 1/x：準同型で、f(f(x)) = x なので全単射です。同型です。
          ④ f(n) = n + 1：全単射ですが、f(0 + 0) = 1、f(0) + f(0) = 2 なので準同型ではありません。同型ではありません。
        note: 同型は「見た目が違っても、演算の仕組みが同じ」ということ。全単射だけでは足りず、準同型であることが要る。
