        explain: 例：「f(a)·f(a⁻¹) = f(a·a⁻¹) = f(e_G) = e_H。同様に f(a⁻¹)·f(a) = e_H。よって f(a⁻¹) は f(a) の逆元で、f(a⁻¹) = f(a)⁻¹。」と書ければよい。① f(a)·f(a⁻¹) を準同型の定義で f(a·a⁻¹) にする、② f(e_G) = e_H を使う、③ 逆元の一意性で f(a⁻¹) = f(a)⁻¹ と結ぶ。子どもには、f(a) の逆元がただ 1 つであることを使わせます。
        hints:
