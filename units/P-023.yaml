        text: 物とスクリーンを 90 cm はなして置き、そのあいだで、焦点距離 20 cm のレンズを動かした。スクリーンにくっきりした像がうつるレンズの位置が 2 つある。物からレンズまでの長さが大きいほうは何 cm か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="100" x2="290" y2="100" fill="none" stroke="currentColor" stroke-width="1"/><rect x="26" y="70" width="8" height="60" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="30" y1="70" x2="30" y2="130" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="120" cy="100" rx="8" ry="40" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="286" y="70" width="8" height="60" fill="#c8ccd6" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><line x1="44" y1="160" x2="276" y2="160" fill="none" stroke="currentColor" stroke-width="1"/><polygon points="286,160 276,165 276,155" fill="currentColor"/><polygon points="34,160 44,155 44,165" fill="currentColor"/><text x="160" y="184" font-size="14" text-anchor="middle" fill="currentColor">90 cm</text><text x="120" y="56" font-size="14" text-anchor="middle" fill="currentColor">レンズを動かす</text></svg>'
        choices: ['30', '45', '60']
        answer: '60'
        check: "math.floor((90 + math.sqrt(90 ** 2 - 4 * 20 * 90)) / 2 + 0.5)"
        hints:
          - 物からレンズまでを a 、レンズからスクリーンまでを b とすると、a + b = 90 。
          - text: レンズの式を通分すると、(a + b)/(ab) = 1/20 。a + b = 90 を入れる。
