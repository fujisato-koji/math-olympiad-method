ri:
  - part: 離
    kinds: [総動員, 数]
    uses: [G-025]
    text: すきまなく重ねた 3 つのすきとおった液体があります。下から、屈折率 5/3 で厚さ 8 cm、屈折率 5/4 で厚さ 9 cm、屈折率 13/12 で厚さ 10 cm で、いちばん上は空気にふれています。いちばん下の底の中心に小さな光を出すものがあり、あらゆる向きに光を出します。液面の上に、光を出すものの真上を中心にした円板をのせて、空気中に光が出ないようにします。円板の半径は、いちばん小さくて何 cm ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="40" width="200" height="50" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><rect x="40" y="90" width="200" height="45" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><rect x="40" y="135" width="200" height="40" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="46" y="68" font-size="13" text-anchor="start" fill="currentColor">屈折率 13/12　厚さ 10 cm</text><text x="46" y="117" font-size="13" text-anchor="start" fill="currentColor">屈折率 5/4　厚さ 9 cm</text><text x="46" y="160" font-size="13" text-anchor="start" fill="currentColor">屈折率 5/3　厚さ 8 cm</text><rect x="110" y="31" width="100" height="8" fill="#f3c969" fill-opacity="0.8" stroke="currentColor" stroke-width="2"/><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">円板</text><circle cx="160" cy="175" r="5" fill="currentColor"/><text x="160" y="192" font-size="13" text-anchor="middle" fill="currentColor">光を出すもの</text><text x="275" y="36" font-size="14" text-anchor="middle" fill="currentColor">空気</text><line x1="212" y1="35" x2="240" y2="35" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,35 240,40 240,30" fill="currentColor"/><rect x="255" y="47" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="268" y="65" font-size="16" text-anchor="middle" fill="currentColor">？</text><text x="268" y="82" font-size="13" text-anchor="middle" fill="currentColor">半径</text></svg>'
    answer: 42
    check: "math.floor(sum(d / math.sqrt(n * n - 1) for d, n in [(8, 5 / 3), (9, 5 / 4), (10, 13 / 12)]) + 0.5)"
    hints:
      - 円板のふちにとどく光は、空気に出られるか出られないかのぎりぎりの光です。いちばん上の液から空気に出るぎりぎりの角は、どんな角でしょう。
      - text: 3 つの液のどこでも、屈折率 × 角の sin は同じ数です。その数は、空気に出るぎりぎりでは 1 です。いちばん下の液でその光は、たて 4、横 3 の直角三角形の向きに進みます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="135" width="200" height="40" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="175" r="5" fill="currentColor"/><line x1="160" y1="175" x2="190" y2="135" fill="none" stroke="#d9534f" stroke-width="3"/><line x1="160" y1="135" x2="190" y2="135" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="160" y1="135" x2="160" y2="175" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><text x="148" y="160" font-size="13" text-anchor="middle" fill="currentColor">たて</text><text x="176" y="128" font-size="13" text-anchor="middle" fill="currentColor">横</text><circle cx="175" cy="155" r="28" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - 2 つめと 3 つめの液でも、屈折率 × 角の sin = 1 から、角の sin を出します。たてと横の比が出れば、液ごとの横のずれを足せます。
    paths:
      - [空気に出るぎりぎりでは、空気の屈折率 1 × sin 90° = 1 なので、どの液でも屈折率 × 角の sin = 1, 3 つの液で sin は 3/5、4/5、12/13 で、たてと横の比は 4 対 3、3 対 4、5 対 12, 横のずれは 8 × 3/4 = 6、9 × 4/3 = 12、10 × 12/5 = 24, 円板の半径は 6 + 12 + 24 = 42 cm]
      - [円板のふちから光を逆にたどる。空気中を水平にすれすれに来て、液面で曲がって入る, 液ごとの屈折率 n で、角の sin は 1 ÷ n で、三平方の定理からたて：横 = √(n × n − 1)：1, 横のずれ = 厚さ ÷ √(n × n − 1) なので、8 ÷ 4/3 = 6、9 ÷ 3/4 = 12、10 ÷ 5/12 = 24, 合わせて 42 cm]
    note: S01 不変量（どの液でも屈折率 × 角の sin が同じ）、S07 極端な場合（空気に出るぎりぎりの光）、S25 三角比（P-023 の全反射と臨界角、G-025）。種なし。1 つの液なら臨界角の 1 回の手順で終わるが、3 つの液で液のさかい目の曲がり方を 1 つずつ追うと、角がつながらず手数が多くなる。境で変わらない値（屈折率 × sin）を見つけ、空気の側の 1 を全部の層にあてる一手が要る。どの液も空気に出るぎりぎりの角の sin が 3/5、4/5、12/13 で、3-4-5 と 5-12-13 の直角三角形になるように屈折率を選んだ。まん中の液の屈折率が小さくても、まわりの液のさかい目で全反射はおきない。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [G-025]
    text: 物とスクリーンを置き、そのあいだで 1 まいの凸レンズを動かすと、スクリーンにくっきりした像がうつるレンズの位置が 2 か所あります。物の高さは分かりませんが、像の高さは、一方の位置では 32 cm、もう一方の位置では 2 cm でした。次に、物は動かさずにスクリーンだけを 27 cm 動かして、またレンズを動かしてさがすと、くっきりした像がうつるレンズの位置は 1 か所だけになりました。図の長さは正確ではありません。このレンズの焦点距離は何 cm ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="150" x2="290" y2="150" fill="none" stroke="currentColor" stroke-width="1"/><line x1="40" y1="150" x2="40" y2="110" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="40,100 45,110 35,110" fill="currentColor"/><text x="40" y="172" font-size="14" text-anchor="middle" fill="currentColor">物</text><rect x="250" y="80" width="8" height="70" fill="#c8ccd6" fill-opacity="0.8" stroke="currentColor" stroke-width="2"/><text x="254" y="172" font-size="13" text-anchor="middle" fill="currentColor">スクリーン</text><ellipse cx="100" cy="120" rx="8" ry="40" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><ellipse cx="185" cy="120" rx="8" ry="40" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="100" y="66" font-size="13" text-anchor="middle" fill="currentColor">位置 1</text><text x="185" y="66" font-size="13" text-anchor="middle" fill="currentColor">位置 2</text><line x1="228" y1="52" x2="280" y2="52" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="290,52 280,57 280,47" fill="currentColor"/><polygon points="218,52 228,47 228,57" fill="currentColor"/><text x="254" y="40" font-size="13" text-anchor="middle" fill="currentColor">27 cm 動かす</text><text x="160" y="192" font-size="13" text-anchor="middle" fill="currentColor">像の高さ 32 cm と 2 cm</text><rect x="129" y="99" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="142" y="117" font-size="16" text-anchor="middle" fill="currentColor">？</text></svg>'
    answer: 12
    check: "math.floor(sum(a * b / (a + b) for a in range(1, 500) for b in [a * math.sqrt(32 / 2)] for s in [27, -27] if abs(a + b - s - 4 * a * b / (a + b)) < 1e-9) + 0.5)"
    hints:
      - 物の高さが分からないので、そのままでは倍率が出ません。くっきりうつる 2 つの位置で、物からレンズまでの長さと、レンズからスクリーンまでの長さに、どんな関係があるでしょう。
      - text: 1 つめの位置で、物からレンズまでを a、レンズからスクリーンまでを b とすると、2 つめの位置では a と b がいれかわります。ですから 2 つの倍率をかけると 1 になり、物の高さと、b が a の何倍かが分かります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="150" x2="290" y2="150" fill="none" stroke="currentColor" stroke-width="1"/><line x1="40" y1="150" x2="40" y2="110" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="40,100 45,110 35,110" fill="currentColor"/><rect x="250" y="80" width="8" height="70" fill="#c8ccd6" fill-opacity="0.8" stroke="currentColor" stroke-width="2"/><ellipse cx="100" cy="120" rx="8" ry="40" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><ellipse cx="185" cy="120" rx="8" ry="40" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><line x1="50" y1="176" x2="90" y2="176" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="100,176 90,181 90,171" fill="currentColor"/><polygon points="40,176 50,171 50,181" fill="currentColor"/><text x="70" y="170" font-size="14" text-anchor="middle" fill="currentColor">a</text><line x1="110" y1="188" x2="240" y2="188" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,188 240,193 240,183" fill="currentColor"/><polygon points="100,188 110,183 110,193" fill="currentColor"/><text x="175" y="182" font-size="14" text-anchor="middle" fill="currentColor">b</text><line x1="50" y1="76" x2="175" y2="76" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="185,76 175,81 175,71" fill="currentColor"/><polygon points="40,76 50,71 50,81" fill="currentColor"/><text x="112" y="70" font-size="14" text-anchor="middle" fill="currentColor">b</text><line x1="195" y1="90" x2="240" y2="90" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,90 240,95 240,85" fill="currentColor"/><polygon points="185,90 195,85 195,95" fill="currentColor"/><text x="218" y="84" font-size="14" text-anchor="middle" fill="currentColor">a</text></svg>'
      - くっきりうつる位置が 1 か所だけになるのは、2 つの位置が重なって a と b が等しくなるときです。そのときの物からスクリーンまでの長さは、焦点距離の何倍でしょう。スクリーンを遠ざけたのか近づけたのかも考えます。
    paths:
      - [2 つの位置で、物からレンズまでの長さ a とレンズからスクリーンまでの長さ b がいれかわる（レンズの式が a と b で同じ形なので）, 倍率は b ÷ a と a ÷ b でかけると 1。物の高さを h とすると (32 ÷ h) × (2 ÷ h) = 1 なので h × h = 64 で h = 8 cm。大きい像の倍率は 32 ÷ 8 = 4 なので b = 4 × a, 物からスクリーンまでは a + b = 5 × a で、焦点距離 = a × b ÷ (a + b) = 4 × a ÷ 5, 1 か所だけになるのは 2 つの位置が重なり a = b のときで、レンズの式から a = b = 焦点距離の 2 倍、物からスクリーンまでは焦点距離の 4 倍 = 16 × a ÷ 5。5 × a より短いので、スクリーンは物に近づけた（遠ざけると 2 か所のまま）, 5 × a − 27 = 16 × a ÷ 5 から 9 × a ÷ 5 = 27 で a = 15 cm、b = 60 cm, 焦点距離 = 15 × 60 ÷ 75 = 12 cm]
      - [焦点距離を f とする。像の高さの比 32 ÷ 2 = 16 は、倍率の比 (b ÷ a) ÷ (a ÷ b) = (b ÷ a) × (b ÷ a) に等しいので b ÷ a = 4, レンズの式 1 ÷ a + 1 ÷ b = 1 ÷ f に b = 4 × a を入れると 5 ÷ (4 × a) = 1 ÷ f で a = 5 × f ÷ 4、b = 5 × f、物からスクリーンまで 25 × f ÷ 4, 物からスクリーンまでが 4 × f より短いと像はうつらず、長いと 2 か所、ちょうど 4 × f で 1 か所（a = b = 2 × f）, 25 × f ÷ 4 は 4 × f より 9 × f ÷ 4 長いので、近づけた 27 cm がこれに等しく 9 × f ÷ 4 = 27 で f = 12 cm]
    note: S03 対称性（レンズの 2 つの位置で、物からレンズまでとレンズからスクリーンまでがいれかわる）、S04 言いかえ（高さの比を倍率の比に）、S07 極端な場合（2 つの位置が重なって 1 か所になる）。種なし（P-023 の「レンズの式と倍率」の 2 つの位置の考え方）。D-201 で一段上げた：はじめの形は 2 つの位置のあいだの長さ（30 cm）を文に書いていて、高さの比から b ÷ a を出して引き算するだけの手順で解けた。ここでは 2 つの位置のあいだの長さを書かず、スクリーンを 27 cm 動かすと 1 か所だけになる、とした。a と b がいれかわる対称の重なる所（a = b、物からスクリーンまでが焦点距離の 4 倍）を見る一手と、動かした向き（遠ざけると 2 か所のまま、近づけたときだけ合う）を決める一手が要る。高さの比 16 から b ÷ a = 4、物からスクリーンまで 5a、焦点距離 4a ÷ 5 で、5a − 27 = 16a ÷ 5 から a = 15、b = 60、焦点距離 12 cm（はじめ 75 cm、動かしたあと 48 cm = 4 × 12）。
