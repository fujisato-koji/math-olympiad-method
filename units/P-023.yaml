  - day: 6
    items:
      - part: 見本
        text: 光は、2 点のあいだを、かかる時間がいちばん短くなる道を通る。これをフェルマーの原理という。光が進む時間は、道の長さを速さでわったもの。鏡ではね返る光も、入しゃ角と反しゃ角が等しくなる道が、いちばん短い道になる。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="150" x2="300" y2="150" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="70" cy="70" r="5" fill="currentColor"/><circle cx="250" cy="70" r="5" fill="currentColor"/><text x="70" y="58" font-size="16" text-anchor="middle" fill="currentColor">A</text><text x="250" y="58" font-size="16" text-anchor="middle" fill="currentColor">B</text><polyline points="70,70 160,150 250,70" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="70,70 110,150 250,70" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><polyline points="70,70 210,150 250,70" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><text x="160" y="176" font-size="14" text-anchor="middle" fill="currentColor">鏡</text></svg>'
        explain: フェルマーの原理（光は所要時間が最小（または最大）になる経路を通る）。真空中の速さ c と、屈折率 n の物質中の速さ c/n から、時間 = n × 距離 ÷ c 。n × 距離を光路長といい、光路長が最短の経路を光は通る。そこからスネルの法則も導かれる。
