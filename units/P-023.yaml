      - part: 思い出す
        text: 焦点距離 12 cm のレンズから 36 cm の所に物を置いた。像はレンズから何 cm の所にできるか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="100" x2="312" y2="100" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="130" cy="100" rx="9" ry="66" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><circle cx="106" cy="100" r="3" fill="currentColor"/><circle cx="154" cy="100" r="3" fill="currentColor"/><text x="106" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><text x="154" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><line x1="58" y1="100" x2="58" y2="93" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="58,84 62.5,93 53.5,93" fill="currentColor"/></svg>'
        choices: ['18', '24', '48']
        answer: '18'
        check: "math.floor(1 / (1 / 12 - 1 / 36) + 0.5)"
        hints:
          - 1/a + 1/b = 1/f に、a と f を入れる。
          - text: 1/b = 1/12 − 1/36 。通分して引く。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="100" x2="312" y2="100" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="130" cy="100" rx="9" ry="66" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><circle cx="106" cy="100" r="3" fill="currentColor"/><circle cx="154" cy="100" r="3" fill="currentColor"/><text x="106" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><text x="154" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><line x1="58" y1="100" x2="58" y2="93" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="58,84 62.5,93 53.5,93" fill="currentColor"/><line x1="58" y1="84" x2="130" y2="84" fill="none" stroke="currentColor" stroke-width="1"/><line x1="130" y1="84" x2="166" y2="108" fill="none" stroke="currentColor" stroke-width="1"/><line x1="58" y1="84" x2="166" y2="108" fill="none" stroke="currentColor" stroke-width="1"/></svg>'
          - 引いた結果の分数の、分母と分子を入れかえたものが b 。
        paths:
          - [1/b = 3/36 − 1/36 = 1/18, b = 18 cm]
          - [物が 3f の位置にあるとき、像は f の 1.5 倍の所, 12 × 1.5 = 18]
