  - day: 4
    items:
      - part: 見本
        text: 物からレンズまでを a 、レンズから像までを b 、焦点距離を f とすると、1/a + 1/b = 1/f が成り立つ。像の大きさは物の何倍かを表す倍率は m = b/a 。図は a = 30 cm 、f = 10 cm の例で、b は 15 cm 、m は 1/2 になる。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="100" x2="312" y2="100" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="130" cy="100" rx="9" ry="66" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><circle cx="100" cy="100" r="3" fill="currentColor"/><circle cx="160" cy="100" r="3" fill="currentColor"/><text x="100" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><text x="160" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><line x1="40" y1="100" x2="40" y2="85" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="40,76 44.5,85 35.5,85" fill="currentColor"/><line x1="40" y1="76" x2="130" y2="76" fill="none" stroke="currentColor" stroke-width="1"/><line x1="130" y1="76" x2="175" y2="112" fill="none" stroke="currentColor" stroke-width="1"/><line x1="40" y1="76" x2="175" y2="112" fill="none" stroke="currentColor" stroke-width="1"/><line x1="175" y1="100" x2="175" y2="103" fill="none" stroke="#d05050" stroke-width="3"/><polygon points="175,112 170.5,103 179.5,103" fill="#d05050"/><text x="45" y="190" font-size="14" text-anchor="middle" fill="currentColor">a</text><text x="176" y="190" font-size="14" text-anchor="middle" fill="currentColor">b</text><line x1="50" y1="176" x2="116" y2="176" fill="none" stroke="currentColor" stroke-width="1"/><polygon points="126,176 116,181 116,171" fill="currentColor"/><polygon points="40,176 50,171 50,181" fill="currentColor"/><line x1="144" y1="176" x2="166" y2="176" fill="none" stroke="currentColor" stroke-width="1"/><polygon points="176,176 166,181 166,171" fill="currentColor"/><polygon points="134,176 144,171 144,181" fill="currentColor"/></svg>'
        explain: レンズの式 1/a + 1/b = 1/f 。b が負なら像は物と同じ側のきょ像。倍率は |b|/a 。像はスクリーン上に実像としてできるとき b > 0 。
      - part: 今日
