# P-023 光の反射・屈折とレンズ（全反射、凸レンズと像、フェルマーの原理とスネルの法則、光学機器と分解能、測光）
#
# 水準 3・8 日。屈折とスネルの法則、凸レンズ・焦点・焦点距離・光軸・虚像、全反射と臨界角、凸レンズの作図と像、レンズの式と倍率、フェルマーの原理、光学機器と分解能、測光（光度・照度・光束・点光源・光源）。
#
id: P-023
days:
  - day: 1
    items:
      - part: 見本
        text: 光が空気からガラスにななめに入ると、境目で《屈折》して曲がる。境目に直角な線を法線といい、光と法線がつくる角を、入しゃ角、屈折角という。ガラスの中では光がおそくなるので、光は法線に近づく。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">空気</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">ガラス</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="108.6" y1="38.7" x2="154.2" y2="93.1" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 150.8,96 157.7,90.2" fill="currentColor"/><text x="106.7" y="59.6" font-size="14" text-anchor="middle" fill="currentColor">入しゃ角</text><line x1="160" y1="100" x2="190" y2="164.3" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="193.8,172.5 185.9,166.2 194.1,162.4" fill="currentColor"/><text x="200.5" y="156.6" font-size="14" text-anchor="middle" fill="currentColor">屈折角</text><text x="250" y="42" font-size="14" text-anchor="middle" fill="currentColor">n₁ sinθ₁ = n₂ sinθ₂</text></svg>'
        explain: スネルの法則。境目を通るとき、n sinθ（n は《屈折率》）が変わらない。屈折率の大きいほう（光がおそいほう）で、法線からの角が小さくなる。空気は n = 1.0 とみなす。
      - part: 今日
        text: 空気から屈折率 √2 のガラスに、入しゃ角 45° で光が入る。屈折角は何度か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">空気 n=1</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">ガラス n=√2</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="103.4" y1="43.4" x2="153.6" y2="93.6" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 150.5,96.8 156.8,90.5" fill="currentColor"/><text x="103" y="63" font-size="14" text-anchor="middle" fill="currentColor">45°</text></svg>'
        choices: ['30', '45', '60']
        answer: '30'
        check: "math.floor(math.degrees(math.asin(math.sin(math.radians(45)) / math.sqrt(2))) + 0.5)"
        hints:
          - 境目で変わらないのは n sinθ。空気側とガラス側で、それぞれ書いてみよう。
          - text: 空気側の n sinθ は 1 × sin45° 。これがガラス側の √2 × sinθ₂ に等しい。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">空気 n=1</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">ガラス n=√2</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="103.4" y1="43.4" x2="153.6" y2="93.6" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 150.5,96.8 156.8,90.5" fill="currentColor"/><text x="103" y="63" font-size="14" text-anchor="middle" fill="currentColor">45°</text><circle cx="112" cy="72" r="24" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - sin45° は √2/2 。√2 でわると、sinθ₂ がきれいな数になる。
        paths:
          - [n₁ sinθ₁ = n₂ sinθ₂ に入れる, 1 × (√2/2) = √2 × sinθ₂, sinθ₂ = 1/2 なので 30°]
          - [ガラスに入ると法線に近づくので 45° より小さい, 45° より小さい答えは 30 だけ]
      - part: 今日
        text: 屈折率 1.5 のガラスから空気に光が出る。ガラスの中の角が 30° のとき、空気中の角を θ とすると、sinθ はいくつか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">空気 n=1</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">ガラス n=1.5</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="120" y1="169.3" x2="155.5" y2="107.8" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 159.4,110 151.6,105.5" fill="currentColor"/><text x="115" y="154.2" font-size="14" text-anchor="middle" fill="currentColor">30°</text></svg>'
        choices: ['0.33', '0.5', '0.75']
        answer: '0.75'
        check: "math.floor(1.5 * math.sin(math.radians(30)) * 100 + 0.5) / 100"
        hints:
          - ガラス側の n sinθ と、空気側の n sinθ が等しい。
          - text: ガラス側は 1.5 × sin30° 。空気側は 1 × sinθ 。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">空気 n=1</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">ガラス n=1.5</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="120" y1="169.3" x2="155.5" y2="107.8" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 159.4,110 151.6,105.5" fill="currentColor"/><text x="115" y="154.2" font-size="14" text-anchor="middle" fill="currentColor">30°</text><circle cx="112" cy="128" r="24" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - sin30° は 0.5 。屈折率の大きいほうの角は小さいことも思い出そう。
        paths:
          - [1.5 × sin30° = 1 × sinθ, sinθ = 1.5 × 0.5 = 0.75]
          - [空気に出ると法線から遠ざかる, 0.5 より大きい答えは 0.75 だけ]
      - part: 今日
        text: 光の速さは真空中で c = 3.0 × 10⁸ m/s 。屈折率 1.5 のガラスの中での速さは、v = c/n で求められる。何 m/s か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="60" width="260" height="80" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="40" y1="80" x2="110" y2="80" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="120,80 110,85 110,75" fill="currentColor"/><text x="80" y="70" font-size="14" text-anchor="middle" fill="currentColor">c</text><line x1="190" y1="120" x2="240" y2="120" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,120 240,125 240,115" fill="currentColor"/><text x="220" y="110" font-size="14" text-anchor="middle" fill="currentColor">v</text><text x="160" y="168" font-size="14" text-anchor="middle" fill="currentColor">ガラス n=1.5</text></svg>'
        choices: ['2.0 × 10⁸', '1.0 × 10⁸', '4.5 × 10⁸']
        answer: '2.0 × 10⁸'
        check: "'2.0 × 10⁸'"
        hints:
          - 《屈折率》が大きいほど、光はおそくなる。ガラスの中の速さを求めたい。
          - text: ガラスの中の矢印は、真空中より短い。v は c より小さいはず。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="60" width="260" height="80" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="40" y1="80" x2="110" y2="80" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="120,80 110,85 110,75" fill="currentColor"/><text x="80" y="70" font-size="14" text-anchor="middle" fill="currentColor">c</text><line x1="190" y1="120" x2="240" y2="120" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="250,120 240,125 240,115" fill="currentColor"/><text x="220" y="110" font-size="14" text-anchor="middle" fill="currentColor">v</text><circle cx="220" cy="120" r="30" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - v = c/n に、c = 3.0 × 10⁸ と n = 1.5 を入れて 3.0 ÷ 1.5 を計算する。
        paths:
          - [v = c/n, 3.0 × 10⁸ ÷ 1.5, 2.0 × 10⁸ m/s]
          - [ガラスの中は c より小さい, c を 1.5 でわった速さ]
      - part: 今日
        text: 光が物質 A から物質 B に入ると、法線から遠ざかる向きに曲がった。屈折率が大きいのはどちらか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">A</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">B</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="120" y1="30.7" x2="155.5" y2="92.2" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 151.6,94.5 159.4,90" fill="currentColor"/><text x="115" y="53.8" font-size="14" text-anchor="middle" fill="currentColor">A</text><line x1="160" y1="100" x2="214.4" y2="145.6" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="221.3,151.4 211.5,149.1 217.3,142.2" fill="currentColor"/><text x="220.4" y="141.3" font-size="14" text-anchor="middle" fill="currentColor">B</text></svg>'
        choices: ['A のほう', 'B のほう', '同じ']
        answer: 'A のほう'
        check: "'A のほう'"
        hints:
          - 屈折率が大きいほうは、法線に近い角になる。
          - text: 図で、法線との角が大きいのは A 側か B 側か見くらべよう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">A</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">B</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="120" y1="30.7" x2="155.5" y2="92.2" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 151.6,94.5 159.4,90" fill="currentColor"/><text x="115" y="53.8" font-size="14" text-anchor="middle" fill="currentColor">A</text><line x1="160" y1="100" x2="214.4" y2="145.6" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="221.3,151.4 211.5,149.1 217.3,142.2" fill="currentColor"/><text x="220.4" y="141.3" font-size="14" text-anchor="middle" fill="currentColor">B</text><circle cx="130" cy="60" r="28" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><circle cx="190" cy="140" r="28" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - 角が小さいほうが、屈折率が大きい。
        paths:
          - [n sinθ が等しい, 角が小さいほうが n が大きい, 図では A 側の角のほうが小さいので A]
          - [法線に近づくとき、おそいほうに入る, 遠ざかるので、おそいほうから速いほうへ出る, A のほうがおそい]
      - part: 今日
        text: 空気から物質に、入しゃ角 60° で入ると、屈折角は 30° になった。この物質の屈折率はいくつか（小数第 1 位まで）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">空気 n=1</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">物質 n=？</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="90.7" y1="60" x2="152.2" y2="95.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 150,99.4 154.5,91.6" fill="currentColor"/><text x="93.8" y="75" font-size="14" text-anchor="middle" fill="currentColor">60°</text><line x1="160" y1="100" x2="195.5" y2="161.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="200,169.3 191.6,163.7 199.4,159.2" fill="currentColor"/><text x="205" y="154.2" font-size="14" text-anchor="middle" fill="currentColor">30°</text></svg>'
        choices: ['1.4', '1.7', '2.0']
        answer: '1.7'
        check: "math.floor(math.sin(math.radians(60)) / math.sin(math.radians(30)) * 10 + 0.5) / 10"
        hints:
          - 空気側は 1 × sin60° 、物質側は n × sin30° 。
          - text: 等しいとおくと、n は sin の比になる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><text x="46" y="22" font-size="14" text-anchor="middle" fill="currentColor">空気 n=1</text><text x="46" y="192" font-size="14" text-anchor="middle" fill="currentColor">物質 n=？</text><line x1="160" y1="15" x2="160" y2="185" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="90.7" y1="60" x2="152.2" y2="95.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 150,99.4 154.5,91.6" fill="currentColor"/><text x="93.8" y="75" font-size="14" text-anchor="middle" fill="currentColor">60°</text><line x1="160" y1="100" x2="195.5" y2="161.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="200,169.3 191.6,163.7 199.4,159.2" fill="currentColor"/><text x="205" y="154.2" font-size="14" text-anchor="middle" fill="currentColor">30°</text><circle cx="112" cy="70" r="22" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><circle cx="206" cy="130" r="22" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - sin60° は √3/2 、sin30° は 1/2 。
        paths:
