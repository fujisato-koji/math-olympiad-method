    uses: [G-025]
    text: 陸を走る速さは毎秒 4 m、水の中を泳ぐ速さは毎秒 3 m です。水ぎわは点 O で直角に曲がっていて、図のように O の右下が水、そのほかは陸です。陸の点 A は O から左へ 27 m、上へ 30 m の所に、水の中の点 B は O から右へ 40 m、下へ 36 m の所にあります。A を出発して、水ぎわの点 P まで陸をまっすぐ走り、P から B までを水の中でまっすぐ泳ぎます。P を水ぎわのどこにとってもよいとき、かかる時間はいちばん短くて何秒ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="5" width="300" height="190" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><rect x="120" y="92" width="190" height="103" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="120" y1="92" x2="310" y2="92" fill="none" stroke="currentColor" stroke-width="3"/><line x1="120" y1="92" x2="120" y2="195" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="120" cy="92" r="4" fill="currentColor"/><text x="108" y="108" font-size="15" text-anchor="middle" fill="currentColor">O</text><text x="225" y="45" font-size="13" text-anchor="middle" fill="currentColor">陸：走る 毎秒 4 m</text><text x="272" y="118" font-size="13" text-anchor="middle" fill="currentColor">水</text><text x="272" y="136" font-size="13" text-anchor="middle" fill="currentColor">泳ぐ</text><text x="272" y="154" font-size="13" text-anchor="middle" fill="currentColor">毎秒 3 m</text><circle cx="58" cy="23" r="5" fill="currentColor"/><text x="46" y="27" font-size="15" text-anchor="middle" fill="currentColor">A</text><circle cx="212" cy="175" r="5" fill="currentColor"/><text x="226" y="180" font-size="15" text-anchor="middle" fill="currentColor">B</text><line x1="58" y1="23" x2="120" y2="23" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><text x="89" y="17" font-size="13" text-anchor="middle" fill="currentColor">27 m</text><line x1="120" y1="23" x2="120" y2="92" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><text x="140" y="60" font-size="13" text-anchor="middle" fill="currentColor">30 m</text><line x1="120" y1="175" x2="212" y2="175" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><text x="166" y="168" font-size="13" text-anchor="middle" fill="currentColor">40 m</text><line x1="212" y1="92" x2="212" y2="175" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><text x="194" y="135" font-size="13" text-anchor="middle" fill="currentColor">36 m</text></svg>'
    answer: "27.5"
    check: "math.floor(2 * min([math.hypot(27 + x, 30) / 4 + math.hypot(40 - x, 36) / 3 for x in [i / 100 for i in range(0, 4001)]] + [math.hypot(27, 30 + y) / 4 + math.hypot(40, 36 - y) / 3 for y in [i / 100 for i in range(0, 3601)]]) + 0.5) / 2"
    hints:
      - 水に入る P は、O から右へのびる水ぎわにも、O から下へのびる水ぎわにもとれます。2 つに分けて、それぞれでいちばん短い時間を考えます。
      - text: どちらの水ぎわでも、いちばん短い時間になる P では、光が曲がるときと同じように、水ぎわに直角に立てた線との角の sin の比が、速さの比 4 対 3 になります。3、4、5 の直角三角形の仲間で、sin が 4/5 と 3/5 になる向きをさがします。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="5" width="300" height="190" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><rect x="120" y="92" width="190" height="103" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="120" y1="92" x2="310" y2="92" fill="none" stroke="currentColor" stroke-width="3"/><line x1="120" y1="92" x2="120" y2="195" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="120" cy="92" r="4" fill="currentColor"/><text x="108" y="108" font-size="15" text-anchor="middle" fill="currentColor">O</text><circle cx="58" cy="23" r="5" fill="currentColor"/><text x="46" y="27" font-size="15" text-anchor="middle" fill="currentColor">A</text><circle cx="212" cy="175" r="5" fill="currentColor"/><text x="226" y="180" font-size="15" text-anchor="middle" fill="currentColor">B</text><line x1="58" y1="23" x2="160" y2="92" fill="none" stroke="#d9534f" stroke-width="3"/><line x1="160" y1="92" x2="212" y2="175" fill="none" stroke="#d9534f" stroke-width="3"/><line x1="160" y1="50" x2="160" y2="140" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="58" y1="23" x2="120" y2="112" fill="none" stroke="#d9534f" stroke-width="3" stroke-dasharray="6 4"/><line x1="120" y1="112" x2="212" y2="175" fill="none" stroke="#d9534f" stroke-width="3" stroke-dasharray="6 4"/><line x1="80" y1="112" x2="170" y2="112" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><circle cx="160" cy="92" r="18" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><circle cx="120" cy="112" r="18" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - 2 つの道で、走る長さと泳ぐ長さをそれぞれ出してくらべます。同じ 2 つの長さなら、速く進める陸で長いほうを行くと、時間が短くなります。
    paths:
      - [P が O の右の水ぎわのとき、A から水ぎわまで 30 m、B まで 36 m、水ぎわにそって 27 + 40 = 67 m, 角の sin が 4/5 と 3/5 なら、走る横は 30 × 4 ÷ 3 = 40 m で長さ 50 m、泳ぐ横は 36 × 3 ÷ 4 = 27 m で長さ 45 m（40 + 27 = 67）。時間は 50 ÷ 4 + 45 ÷ 3 = 12.5 + 15 = 27.5 秒, P が O の下の水ぎわのとき、A から 27 m、B まで 40 m、水ぎわにそって 30 + 36 = 66 m。走るたては 27 × 4 ÷ 3 = 36 m で長さ 45 m、泳ぐたては 40 × 3 ÷ 4 = 30 m で長さ 50 m（36 + 30 = 66）。時間は 45 ÷ 4 + 50 ÷ 3 = 11.25 + 16.66… で約 27.9 秒, O で入る道はどちらの水ぎわのはしでもあるので、それぞれのいちばん短い時間より長い。いちばん短いのは O の右の水ぎわから入る 27.5 秒]
      - [O から右へ x m の所を P とすると、時間 = √((27 + x) × (27 + x) + 30 × 30) ÷ 4 + √((40 − x) × (40 − x) + 36 × 36) ÷ 3。x を変えて調べると x = 13 で 50 ÷ 4 + 45 ÷ 3 = 27.5 秒がいちばん小さい（x = 12 と 14 では 27.5 秒より少し大きい）, O から下へ y m の所を P とすると、同じように y = 6 で 45 ÷ 4 + 50 ÷ 3 で約 27.9 秒がいちばん小さい, O（x = 0）では √1629 ÷ 4 + √2896 ÷ 3 で約 10.1 + 17.9 = 28.0 秒。くらべると、いちばん短いのは 27.5 秒]
    note: S07 極端な場合（P を O にした場合を調べる）、S12 作ってみせる（整数の直角三角形になる P を見つける）、S25 三角比（P-023 のフェルマーの原理とスネルの法則、G-025）。種なし。D-201 で一段上げた：はじめの形はまっすぐな水ぎわ 1 本で、スネルの法則を思い出して 3-4-5 の三角形を当てれば解けた。ここでは水ぎわを O で直角に曲げて、P をとれる水ぎわを 2 本にした。どちらの水ぎわでもスネルの法則の点が 3-4-5 の三角形になるように A（O から左 3 × 9、上 3 × 10）と B（右 4 × 10、下 4 × 9）をおいたので、2 つの道を両方出してくらべる一手が要る。2 つの道は走る長さと泳ぐ長さが 50 m と 45 m の入れかえで、速い陸で長いほうを行く右の水ぎわが速い（27.5 秒、P は O から右へ 13 m）。A に近い下の水ぎわ（27 m）から入ると約 27.9 秒、O を通ると約 28.0 秒、A と B を結ぶまっすぐな道は約 27.8 秒で、どれもわなになる。
