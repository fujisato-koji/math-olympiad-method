            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="100" x2="312" y2="100" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="130" cy="100" rx="9" ry="66" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><circle cx="90" cy="100" r="3" fill="currentColor"/><circle cx="170" cy="100" r="3" fill="currentColor"/><text x="90" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><text x="170" y="118" font-size="14" text-anchor="middle" fill="currentColor">F</text><line x1="70" y1="100" x2="70" y2="77" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="70,68 74.5,77 65.5,77" fill="currentColor"/><line x1="70" y1="68" x2="130" y2="68" fill="none" stroke="currentColor" stroke-width="1"/><line x1="130" y1="68" x2="250" y2="164" fill="none" stroke="currentColor" stroke-width="1"/><line x1="70" y1="68" x2="250" y2="164" fill="none" stroke="currentColor" stroke-width="1"/></svg>'
          - 1/10 − 1/15 を通分すると、分子が 1 の分数になる。b はその逆数。
        paths:
          - [1/b = 1/10 − 1/15 = 1/30, b = 30 cm]
          - [物が焦点の外にあるので実像, 作図では f の 2 倍より遠くにできるので 20 では足りない]
