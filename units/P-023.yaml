      - part: 今日
        text: 光が空気中を 6 m 進む時間と、屈折率 1.5 のガラスの中を 4 m 進む時間をくらべる。どうなるか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="170" y="60" width="120" height="80" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="20" y1="100" x2="150" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 150,105 150,95" fill="currentColor"/><text x="90" y="90" font-size="14" text-anchor="middle" fill="currentColor">空気 6 m</text><line x1="172" y1="100" x2="278" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="288,100 278,105 278,95" fill="currentColor"/><text x="230" y="90" font-size="14" text-anchor="middle" fill="currentColor">ガラス 4 m</text></svg>'
        choices: ['空気中のほうが時間が長い', 'ガラスのほうが時間が長い', '同じ時間']
        answer: '同じ時間'
        check: "'同じ時間'"
        hints:
          - 時間は、光路長 n × 道の長さに比例する。
          - text: 空気の光路長は 1 × 6 。ガラスの光路長は 1.5 × 4 。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="170" y="60" width="120" height="80" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="20" y1="100" x2="150" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,100 150,105 150,95" fill="currentColor"/><text x="90" y="90" font-size="14" text-anchor="middle" fill="currentColor">空気 6 m</text><line x1="172" y1="100" x2="278" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="288,100 278,105 278,95" fill="currentColor"/><text x="230" y="90" font-size="14" text-anchor="middle" fill="currentColor">ガラス 4 m</text><circle cx="90" cy="90" r="36" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - 2 つの光路長をくらべる。
        paths:
          - [1 × 6 = 6, 1.5 × 4 = 6 で等しい]
          - [ガラスの中では速さが 1/1.5 倍, 4 m を進む時間は空気中の 6 m と同じ]
      - part: わけ
        text: 空気中を速さ 2 、水中を速さ 1 で光が進む（単位は同じ）。A から水面を通って B まで行く。水面上の点 P を、A の真下から 3 、4 、5 の所にとって、通る道を 3 つくらべる。かかる時間がいちばん短いのはどれか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="25" r="5" fill="currentColor"/><circle cx="190" cy="175" r="5" fill="currentColor"/><text x="58" y="30" font-size="16" text-anchor="middle" fill="currentColor">A</text><text x="206" y="186" font-size="16" text-anchor="middle" fill="currentColor">B</text><circle cx="115" cy="100" r="3" fill="currentColor"/><circle cx="140" cy="100" r="3" fill="currentColor"/><circle cx="165" cy="100" r="3" fill="currentColor"/><text x="115" y="92" font-size="14" text-anchor="middle" fill="currentColor">3</text><text x="140" y="92" font-size="14" text-anchor="middle" fill="currentColor">4</text><text x="165" y="92" font-size="14" text-anchor="middle" fill="currentColor">5</text></svg>'
        choices: ['3', '4', '5']
        answer: '5'
        check: "'5'"
        explain: A の高さ 3 、B の深さ 3 、横は 6 とすると、P の位置 x のときの時間は T(x) = √(x² + 9)/2 + √((6 − x)² + 9)/1 。T(3) ≈ 6.36 、T(4) ≈ 6.11 、T(5) ≈ 6.08 。最小は x ≈ 4.6 で、直線（x = 3）より水中の道を短くしたほうが速い。ここから sinθ₁/v₁ = sinθ₂/v₂ が出て、スネルの法則と同じ式になる。
        hints:
          - 時間 = 道の長さ ÷ 速さ 。空気中の部分と水中の部分に分けて足す。
          - text: A の高さは 3 、B の深さも 3 。P を決めると、直角三角形が 2 つできる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="100" width="320" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="0" y1="100" x2="320" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="25" r="5" fill="currentColor"/><circle cx="190" cy="175" r="5" fill="currentColor"/><polyline points="40,25 140,100 190,175" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><line x1="40" y1="25" x2="40" y2="100" fill="none" stroke="currentColor" stroke-width="1"/><line x1="190" y1="100" x2="190" y2="175" fill="none" stroke="currentColor" stroke-width="1"/><text x="30" y="66" font-size="14" text-anchor="middle" fill="currentColor">3</text><text x="204" y="140" font-size="14" text-anchor="middle" fill="currentColor">3</text><text x="90" y="112" font-size="14" text-anchor="middle" fill="currentColor">x</text><text x="166" y="114" font-size="14" text-anchor="middle" fill="currentColor">6 − x</text></svg>'
          - text: x = 3 のとき、時間は約 6.36 。表の長さを使い、x = 4 と x = 5 の時間（長さ ÷ 速さ）を計算してくらべる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="40" width="80" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="60" y="59.9" font-size="14" text-anchor="middle" fill="currentColor">P</text><rect x="100" y="40" width="80" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="140" y="59.9" font-size="14" text-anchor="middle" fill="currentColor">空気中</text><rect x="180" y="40" width="80" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="220" y="59.9" font-size="14" text-anchor="middle" fill="currentColor">水中</text><rect x="20" y="70" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="60" y="89.9" font-size="14" text-anchor="middle" fill="currentColor">3</text><rect x="100" y="70" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="140" y="89.9" font-size="14" text-anchor="middle" fill="currentColor">4.24</text><rect x="180" y="70" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="220" y="89.9" font-size="14" text-anchor="middle" fill="currentColor">4.24</text><rect x="20" y="100" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="60" y="119.9" font-size="14" text-anchor="middle" fill="currentColor">4</text><rect x="100" y="100" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="140" y="119.9" font-size="14" text-anchor="middle" fill="currentColor">5.00</text><rect x="180" y="100" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="220" y="119.9" font-size="14" text-anchor="middle" fill="currentColor">3.61</text><rect x="20" y="130" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="60" y="149.9" font-size="14" text-anchor="middle" fill="currentColor">5</text><rect x="100" y="130" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="140" y="149.9" font-size="14" text-anchor="middle" fill="currentColor">5.83</text><rect x="180" y="130" width="80" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="220" y="149.9" font-size="14" text-anchor="middle" fill="currentColor">3.16</text></svg>'
        paths:
          - [x = 4 は 5.00 ÷ 2 + 3.61 = 6.11, x = 5 は 5.83 ÷ 2 + 3.16 = 6.08, x = 5 が最短]
          - [x = 3 の直線は約 6.36, 速いほうの空気中で長く進んで、おそい水中を短くしたほうが時間が短くなる, 水中の道が短い x = 5 が最短]
      - part: 挑戦
        text: 厚さ 3 cm 、屈折率 1.5 のガラス板を、光が直角に通りぬける。ガラスがなく空気だけのときとくらべて、光路長は何 cm 増えるか。
