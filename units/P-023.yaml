        hints:
          - ガラス板がないとき、同じ 3 cm の光路長は何 cm か。
          - text: ガラス板があるとき、3 cm の部分の光路長は 1.5 × 3 。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="120" y="50" width="80" height="100" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="30" y1="100" x2="280" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="290,100 280,105 280,95" fill="currentColor"/><circle cx="160" cy="40" r="24" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><rect x="134" y="174" width="52" height="22" rx="6" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">3 cm</text><text x="160" y="40" font-size="14" text-anchor="middle" fill="currentColor">n = 1.5</text></svg>'
          - 板がある場合と、ない場合の光路長の差をとる。
