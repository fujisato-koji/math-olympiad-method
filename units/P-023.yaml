      - part: 思い出す
        text: 対物レンズの焦点距離が 80 cm 、接眼レンズの焦点距離が 5 cm の望遠鏡の倍率は何倍か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="100" x2="310" y2="100" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="60" cy="100" rx="8" ry="70" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><ellipse cx="240" cy="100" rx="6" ry="30" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><circle cx="200" cy="100" r="4" fill="currentColor"/><polyline points="10,80 60,80 200,100 240,105.7 305,105.7" fill="none" stroke="currentColor" stroke-width="1"/><polyline points="10,120 60,120 200,100 240,94.3 305,94.3" fill="none" stroke="currentColor" stroke-width="1"/><text x="60" y="28" font-size="14" text-anchor="middle" fill="currentColor">f₁ = 80 cm</text><text x="240" y="56" font-size="14" text-anchor="middle" fill="currentColor">f₂ = 5 cm</text></svg>'
        choices: ['16', '75', '85']
        answer: '16'
        check: "80 // 5"
        hints:
          - 望遠鏡の倍率は、2 つの焦点距離の比。
          - text: 倍率 M = f₁/f₂ 。大きいほうを小さいほうでわる。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="90" font-size="16" text-anchor="middle" fill="currentColor">M = f₁ ÷ f₂</text><text x="160" y="130" font-size="16" text-anchor="middle" fill="currentColor">＝ 80 ÷ 5</text></svg>'
          - 80 ÷ 5 を計算する。
