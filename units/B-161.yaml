Color" stroke-width="2" stroke-linecap="round"/><polyline points="264,222.7 276,238" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
        explain: |-
          水べには、水の ようすが ちがう ばしょが あります。池は 水が ながれず 水草が しげり、メダカや アメンボ、オタマジャクシなどが くらします。川は 水が ながれて いるので、ながされない ように 石の うらや すきまに くらす 小さな 虫（カゲロウや カワゲラの ようちゅう）や、きれいな 川の サワガニが 見つかります。いそ（海べの 岩場）では、しおが ひいた ときに 岩の くぼみに のこる 水たまり（しおだまり）に、ヒトデや ヤドカリが います。
          きょうは「ばしょが ちがうと、見つかる いきものが ちがう」が つかめれば よい。水べは ふかい ところ、ながれの はやい ところ、すべる 岩が あって あぶないので、かならず おとなと いっしょに 行き、いそは しおが ひく 時こくを しらべて から 出かけましょう。
      - part: 今日
        text: いそで 見つかる いきものは、ア、イ、ウ の どれかな。
