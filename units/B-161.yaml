      - part: 見本
        text: |-
          いきものを 見つけたら、きろくカードの、見つけた ばしょの ますに ○を 1 つ かきます。
          ○は、下から じゅんに おなじ 大きさで かきます。
          あとで ○を かぞえると、どこで いくつ 見つけたか わかります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><g transform="translate(52 46) scale(1 1)"><path d="M19 -2L32 -11Q29 0 32 11L19 2Z" fill="#c9a36b" fill-opacity=".5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M-26 0Q-14 -10 8 -7Q16 -6 20 -3L20 3Q16 6 8 7Q-14 10 -26 0Z" fill="#c9a36b" fill-opacity=".5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M5 -7L12 -12L15 -5" fill="#c9a36b" fill-opacity=".5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M-12 -5Q-9 0 -12 5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="-17.5" cy="-2.5" r="2.4" fill="currentColor"/></g><text x="52" y="80" font-size="13" text-anchor="middle" fill="currentColor">池で</text><text x="52" y="96" font-size="13" text-anchor="middle" fill="currentColor">見つけた</text><line x1="62" y1="110" x2="119.4" y2="127.4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="128,130 117.8,132.7 121,122" fill="currentColor"/><rect x="112" y="18" width="196" height="170" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><line x1="112" y1="44" x2="308" y2="44" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="177.3" y1="18" x2="177.3" y2="188" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="242.7" y1="18" x2="242.7" y2="188" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="144.7" y="36" font-size="15" text-anchor="middle" fill="currentColor">池</text><text x="210" y="36" font-size="15" text-anchor="middle" fill="currentColor">川</text><text x="275.3" y="36" font-size="15" text-anchor="middle" fill="currentColor">いそ</text><circle cx="144.7" cy="172" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="144.7" cy="152" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="144.7" cy="132" r="8" fill="#f3c969" fill-opacity=".7" stroke="currentColor" stroke-width="2"/><circle cx="210" cy="172" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="275.3" cy="172" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="275.3" cy="152" r="8" fill="none" stroke="currentColor" stroke-width="2"/><text x="56" y="150" font-size="13" text-anchor="middle" fill="currentColor">池の ますに</text><text x="56" y="166" font-size="13" text-anchor="middle" fill="currentColor">○を 1 つ</text></svg>'
        explain: |-
          見つけた ばしょごとに、1 ぴきに つき ○を 1 つ かくと、あとで かぞえたり くらべたり できます。○を おなじ 大きさで 下から ならべて かくと、○の ならびの 高さを 見る だけで、どこで 多く 見つけたかが わかります（あとの S-027 の 絵グラフに つながります）。
          おなじ いきものを 2 ど かぞえない ように、見つけたら すぐに ○を かきましょう。つかまえた いきものは、見おわったら もとの ばしょに かえします。
