      - part: わけ
        text: |-
          おうちの ひとと いっしょに 池の 水を くんで、とうめいな コップで 見ると、小さな つぶが ぴょんぴょん うごいて います。
          虫めがねで 見ると、くろい 目と、うでの ような 2 本の しょっかくが 見えます。ミジンコと いう いきものです。
          この 小さな つぶが いきものだと いえる わけを、えを 見ながら くちで いって みよう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><path d="M13.4 76Q17.4 74 21.4 76T29.4 76T37.4 76T45.4 76T53.4 76T61.4 76T69.4 76T77.4 76T85.4 76L86.6 76L80.4 158L19.6 158Z" fill="#7fc8f8" fill-opacity=".4"/><path d="M13.4 76Q17.4 74 21.4 76T29.4 76T37.4 76T45.4 76T53.4 76T61.4 76T69.4 76T77.4 76T85.4 76L86.6 76" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 58L19.6 158L80.4 158L88 58" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="37" cy="100" r="2.2" fill="currentColor" fill-opacity=".8"/><circle cx="61" cy="118" r="2.2" fill="currentColor" fill-opacity=".8"/><circle cx="47" cy="140" r="2.2" fill="currentColor" fill-opacity=".8"/><circle cx="65" cy="86" r="2.2" fill="currentColor" fill-opacity=".8"/><path d="M31 94q-4 -5 0 -10M69 112q4 -5 0 -10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><text x="50" y="182" font-size="14" text-anchor="middle" fill="currentColor">目だけ</text><line x1="94" y1="108" x2="119" y2="108" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="128,108 119,113.6 119,102.4" fill="currentColor"/><circle cx="232" cy="110" r="70" fill="#7fc8f8" fill-opacity=".15"/><g transform="translate(230 118) scale(1.15 1.15)"><polyline points="11,-14 26,-24 40,-34" fill="none" stroke="currentColor" stroke-width="1.74" stroke-linejoin="round" stroke-linecap="round"/><line x1="26" y1="-24" x2="42" y2="-20" stroke="currentColor" stroke-width="1.74" stroke-linecap="round"/><path d="M40 -34L47 -36M40 -34L44 -41M42 -20L49 -19M42 -20L47 -14" fill="none" stroke="currentColor" stroke-width="1.04" stroke-linecap="round"/><polyline points="-11,-14 -26,-24 -40,-34" fill="none" stroke="currentColor" stroke-width="1.74" stroke-linejoin="round" stroke-linecap="round"/><line x1="-26" y1="-24" x2="-42" y2="-20" stroke="currentColor" stroke-width="1.74" stroke-linecap="round"/><path d="M-40 -34L-47 -36M-40 -34L-44 -41M-42 -20L-49 -19M-42 -20L-47 -14" fill="none" stroke="currentColor" stroke-width="1.04" stroke-linecap="round"/><line x1="5" y1="31" x2="13" y2="43" stroke="currentColor" stroke-width="1.74" stroke-linecap="round"/><path d="M0 -24Q20 -22 19 4Q17 26 3 33Q-15 27 -19 4Q-20 -22 0 -24Z" fill="#7fc8f8" fill-opacity=".35" stroke="currentColor" stroke-width="1.74" stroke-linejoin="round"/><path d="M-1 -7Q7 6 2 25" fill="none" stroke="currentColor" stroke-width="1.22" stroke-opacity=".5" stroke-linecap="round"/><circle cx="-1" cy="-15" r="4.6" fill="currentColor"/></g><circle cx="232" cy="110" r="70" fill="none" stroke="currentColor" stroke-width="3.5"/><line x1="223" y1="99" x2="176" y2="46" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="172" y="44" font-size="15" text-anchor="end" fill="currentColor">目</text><line x1="276" y1="79" x2="288" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="300" y="28" font-size="14" text-anchor="end" fill="currentColor">しょっかく</text><text x="232" y="196" font-size="13" text-anchor="middle" fill="currentColor">虫めがねで 見ると</text></svg>'
        explain: |-
          「じぶんで うごいて いる。虫めがねで 見ると、目や しょっかくが ある。すなや ごみの つぶは じぶんで うごかないし、目も ない。だから いきものだ。」と いえれば よい。① じぶんで うごく（B-015 で ならった いきものの しるし）、② 目や しょっかくなど、からだの つくりが ある、の 2 つが 入れば よい。
          ミジンコは 1〜2 ミリほどの 小さな いきもので、大きな しょっかくを かいて ぴょんぴょん およぎます。からだが すきとおって いるので、もっと 大きく 見える けんびきょうでは、心ぞうが うごく ようすも 見えます。池の 水は おうちの ひとと いっしょに くみ、見おわったら もとの 池に かえしましょう。
        hints:
