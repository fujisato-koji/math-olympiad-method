# B-161 水辺の生き物しらべ
#
# 水準 1・5 日。池・川・いそでいきものをさがす（ばしょがちがうと見つかるいきものがちがう）、見つけた数をばしょごとにきろくカードに○でかき、かぞえてくらべる、池の水の中の小さないきもの（ミジンコ）を虫めがねで見て、じぶんでうごくことと目やしょっかくがあることからいきものとわかる、を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。1 日目 池・川・いそでさがす、2 日目 きろくカードに○でかいてかぞえる・くらべる、3 日目 わけ（虫めがねでミジンコを見る、いきものといえるわけ）、4 日目 混ぜる、5 日目 確認。
# 図の約束：池は水草のあるおわんの形の水、川はながれのすじと石のある水、いそはうしろに海のなみ・手前に大きな岩 2 つとそのあいだの水たまり。きろくカードは池・川・いその 3 つのますで、○は下からおなじ大きさでならべる。見るところは赤い点線の丸。
# 答えが 1 つに決まるように、池にも川にもいるいきもの（メダカ、アメンボ）を「池か川か」をえらぶ問いに使わない。サワガニ（川にだけすむカニ）は川のいきものとして扱う。いそも海の水がうごくので「水がながれているばしょ」とはいわず、はっぱがながされた川（1 日目）をさして問う。
# 水べでさがすときは「おうちのひとといっしょに」を見本の文で子に伝える。見おわったいきものと石はもとにもどす（3 日目、4 日目）。
# 前提は B-015（いきものはじぶんでうごく、虫めがねで大きく見る、虫めがねでお日さまを見ない）。表とグラフは S-027、こん虫のからだは B-017、かびなど目に見えないいきものは B-074 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも読み取り（石をめじるしにはっぱのうごきから川のながれの向きを読む、いきものの絵のカードをいきものごとに数えなおす）。

id: B-161
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          池の 水は ながれません。水草の あいだに メダカ、水の 上に アメンボが います。
          川の 水は、→ の ほうへ ながれて います。石の うらや まわりに、小さな 虫や サワガニが います。
          いそは、海の 岩の ところです。岩の あいだの 水たまりに、ヒトデや ヤドカリが います。
          水べで さがす ときは、かならず おうちの ひとと いっしょに 行きます。
