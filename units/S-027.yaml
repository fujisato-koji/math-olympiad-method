# S-027 表とグラフ（読み方と整理）
#
# 書き方は N-001 の頭の注のとおり。段 2 なので、子に見せる文はひらがなとカタカナで、語の切れ目を空ける。
# 前提は N-006（100 までの数）で、たどると N-005（20 までの数とくり上がり）、N-003、N-002、N-001。
#   2 けたのたし算・ひき算（N-007）とかけ算（N-013）は前提にないので、合わせる数とちがいは 20 までの計算にするか、
#   グラフのめもりを数えて出す（めもり 5 つ分のちがいを 5、10、15 … と数える）。
#   1 めもりが 2、5、10 のグラフは、N-006 のとびとびの数え方（2 ずつ、5 ずつ、10 ずつ）で読む。
#   📦 はあめが 10 こ入ったはこ、🍬 はばらのあめ（N-006 と同じ）。
# 扱うもの：ばらばらの物を種類ごとに数えて表にする、絵グラフ（同じ大きさの絵をはしをそろえて横に並べる）、
#   棒グラフ（1 めもりが 1、2、5、10）、2 つのことをまとめた表（組と好きなもの）。
#   折れ線グラフ（変わり方）と円グラフ・帯グラフ（割合、A-005）は前提にないので扱わない。
# 絵グラフは figure に、種類ごとに 1 行ずつ絵文字を並べて書く（絵文字そのものが種類の名前の代わり）。
#   表と棒グラフは svg で描く。表の □ は、たずねる数。
# check：図の中を数えるものは n(c)。表と棒グラフは svg から数えられないので、数を式に書き直して確かめる。
#   いちばん多いものを選ぶ問題は、数の並びの max の位置で選ぶ。
# 日の並びは地図の既定（導入・練習・わけ・混ぜる・確認）。ねらいは次のとおりにした。
#   1 日目 導入：種類ごとに数えて表にする。絵グラフでいちばん多いもの、ちがいを読む。
#   2 日目 練習：棒グラフを読む（頭に見本）。1 めもりの大きさを先に決める（1、2、5）。2 つのことをまとめた表。
#   3 日目 わけ：棒グラフだと多い少ないがすぐ分かるわけ、1 めもりが 2 のときの読み方のわけ、絵グラフで絵の大きさとはしをそろえるわけ。
#   4 日目 混ぜる：N-006（10 のまとまり）、N-005（20 までの計算）と、1〜3 日目の型を混ぜる。
#   5 日目 確認。

