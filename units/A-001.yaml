  - part: 離
    kinds: [読み取り]
    text: 🟥 🟦 🟨 🟩 の なかに、1 つだけ おもい はこが あります。のこりの 3 つは おなじ おもさです。てんびんを 2 かい つかったら、えの ように なりました。おもい はこは どれですか。
    balance: [{left: "🟥🟦", right: "🟨🟩", tilt: right}, {left: "🟥🟨", right: "🟦🟩", tilt: left}]
    choices: [🟥, 🟦, 🟨, 🟩]
    answer: 🟨
    check: "[c for c in '🟥🟦🟨🟩' if c in bal[0][bal[0]['tilt']] and c in bal[1][bal[1]['tilt']]][0]"
    hints:
      - 1 かいめの てんびんで、さがった さらに のって いるのは どれと どれかな。
      - おもい はこは、さがった さらに いる はずだよ。2 かいめも おなじ ように みよう。
      - どちらの てんびんでも、さがった さらに いる はこは どれかな。
    paths:
      - [1 かいめ で さがったのは 🟨🟩 の さら, おもい はこは 🟨 か 🟩, 2 かいめ で さがったのは 🟥🟨 の さら, どちらにも いるのは 🟨]
      - [🟩 は 2 かいめ で あがった さらに いる, だから 🟩 では ない, 1 かいめ から 🟨 か 🟩 なので 🟨]
    note: 2 つのてんびんの手がかりを重ねて 1 つに決める（L-002 の推理と同じ考え）。皿に 2 こずつ乗っているので、「重い箱が乗っている皿が下がる」ことを 1 回ずつ確かめさせる。1 回目だけを見て 🟩 を選ぶ子が多い。
  - part: 離
    kinds: [総動員, 手数]
    uses: [N-003]
    text: 🟦 1 こは 🟥 2 こと、🟥 1 こは 🟨 3 こと つりあいます。🟦 1 こと 🟥 1 こを いっしょに のせると、🟨 なんこと つりあいますか。
    balance: [{left: "🟦", right: "🟥🟥", tilt: level}, {left: "🟥", right: "🟨🟨🟨", tilt: level}]
    answer: 9
    check: "bal[0]['right'].count('🟥') * bal[1]['right'].count('🟨') + bal[1]['right'].count('🟨')"
    hints:
      - 🟦 は 🟥 なんこと おなじかな。
      - 🟥 1 こを 🟨 3 こに とりかえてみよう。🟦 は 🟨 なんこに なるかな。
      - さいごに、のせた 🟥 1 こも 🟨 に とりかえて、ぜんぶ たそう。
    paths:
      - [🟦 は 🟥🟥, 🟥 1 こ は 🟨 3 こ なので 🟦 は 🟨 3 + 3 = 6 こ, のせた 🟥 の ぶん 🟨 3 こ を たして 6 + 3 = 9 こ]
      - [🟦 と 🟥 で 🟥 3 こ ぶん, 🟨 3 こ が 3 くみ, 3 + 3 + 3 = 9 こ]
    note: とりかえ（置きかえ）を 2 回続け、最後に N-003 のたし算でまとめる。途中の「🟦 は 🟨 6 こ」を覚えておく必要がある。おはじきを箱の代わりに並べて、とりかえを手で動かしてもよい。
  - part: 離
    kinds: [道筋]
    text: 🟥 2 こと 🟦 3 こを のせたら、つりあいました。🟥 1 こと 🟦 1 こでは、どちらが おもいですか。
    balance: {left: "🟥🟥", right: "🟦🟦🟦", tilt: level}
    choices: [🟥, 🟦, おなじ]
    answer: 🟥
    check: "'🟥' if bal['left'].count('🟥') < bal['right'].count('🟦') else ('🟦' if bal['left'].count('🟥') > bal['right'].count('🟦') else 'おなじ')"
    hints:
      - 🟥 と 🟦 が おなじ おもさ だったら、てんびんは どう なるかな。
      - 🟥 は 2 こ、🟦 は 3 こ。かずが すくない ほうと つりあって いるね。
      - すくない かずで おなじ おもさに なるのは、1 こが おもい ほうかな、かるい ほうかな。
    paths:
      - [おなじ おもさ なら 3 こ の ほうが さがる はず, でも つりあった, だから 🟥 1 こ の ほうが おもい]
      - [みぎから 🟦 を 1 こ とると ひだりが さがる, 🟥🟥 は 🟦🟦 より おもい, だから 🟥 1 こ の ほうが おもい]
    note: 数の多いほうが重いと思いこみやすい。「同じ重さなら 3 こ側が下がるはず」と仮に考えて比べる。2 本目は、片方から 1 こ取ったらどうなるかを考える道。どちらも、てんびんの見た目だけでなく理由を言わせたい。

  - part: 離
    kinds: [数]
    uses: [N-001]
    text: 🟦 1 こと ⚪ 2 こが つりあいます。⚪ 1 こは 1 g です。🟦 1 こは なん g ですか。
    answer: 2
    check: "2 * 1"
    hints:
      - ⚪ 1 こは 1 g だね。
      - 🟦 1 こは ⚪ 2 こと つりあうよ。
      - 1 g が 2 こで なん g かな。
    paths:
      - [⚪ 1 こは 1 g, 🟦 1 こは ⚪ 2 こ分, 1 × 2 = 2 g]
    note: てんびんが つりあうとき、両がわの おもさは おなじ。⚪ の かずを かぞえて おもさに しよう。
