# A-001 てんびんと重さくらべ
#
# 書き方は N-001 の頭の注のとおり。
# てんびんの図は balance（D-042）：{left: ひだりの さらの 物, right: みぎの さらの 物, tilt: さがる ほう（left、right、level）}。
#   2 つの てんびんは 並び（[{…}, {…}]）に して、よこに ならべる。かぞえる ための 絵（くり、あめ）は figure の まま。
# check：bal は balance の 値（1 つなら 辞書、2 つなら 並び）。おもい ほう（さがった ほう）は bal[bal['tilt']]、かるい ほうは のこりの さら。
#   いちばん おもいのは かるい ほうに いちども ない もの、いちばん かるいのは おもい ほうに いちども ない もの。
#   おもい じゅんは「かるい ほうに ある かず − おもい ほうに ある かず」の 小さい じゅん。
# 重さは じっさいと くいちがわない ものを えらぶ（くだもの）。じっさいの 重さが わからない ものは、いろの ちがう はこ（🟥🟦🟨🟩）に する。
# 前提は N-001 だけなので、たし算の しきは つかわない。置きかえは「1 こずつ とりかえて かぞえる」で考え、数は 10 まで。
# 地図の plan の 4 日目は「L-002 と混ぜる」だが、L-002 は前提（needs）にない。L-002 の道具（表に〇と×）は使わず、
#   N-001 と 1〜3 日目の型を混ぜ、L-002 の「ヒントから 1 つに決める」形を てんびんだけで作った（1 つだけ おもい はこを さがす）。
# plan に わけの 日が ないので、2〜4 日目に 1 問ずつ わけを 置いた。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした L-002 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

