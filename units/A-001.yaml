# A-001 てんびんと重さくらべ
#
# 段 1・水準 1・5 日。てんびんで どちらが おもいかを よむ（1 つ）、2 つの てんびんから 3 つを おもい じゅんに ならべる、つりあいで とりかえる、のせなかった はこから おもい はこを きめる。
# 書き方は N-001 の頭の注のとおり。子の画面には text、svg、figure、choices、ヒント、explain、paths を出す。answer、check、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# てんびんの図は svg（D-129〜D-131）で、上皿てんびん（さらが ぼうの 上に のる）に そろえた。おもい ほうの さらが さがる。
#   前は balance（D-042）で書いていたが、答えを見ない解き直し（tools/blind.py）と図の PNG（tools/unitqc.py）が svg しか見ないので、svg に書きかえた（2026-11-12）。
#   check は答えをそのまま書くか、問題の数から計算する式にした（bal は使わない）。
#   ヒントの図：みずいろの てんせん＝まっすぐの ときの さらの たかさ。むらさきの わ＝見る ところ。うすい てんびん＝「もし …なら」。
#   2 つの てんびんの 問題では、どちらにも のって いる 物（まんなかの おもさ）を わで かこむ（2 日目の 見本と同じ）。
# 重さは じっさいと くいちがわない ものを えらぶ（くだもの）。じっさいの 重さが わからない ものは、いろの ちがう はこ（🟥🟦🟨🟩）に する。
# 作ったときの前提は N-001 だけなので、たし算の しきは つかわない。置きかえは「1 こずつ とりかえて かぞえる」で考え、数は 10 まで。
# 地図の plan の 4 日目は「L-002 と混ぜる」。L-002 の「ヒントから 1 つに決める」形を てんびんだけで作った（1 つだけ おもい はこを さがす）。
# plan に わけの 日が ないので、2〜4 日目に 1 問ずつ わけを 置いた。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、L-002 は前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

