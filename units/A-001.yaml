  - day: 1
    items:
      - part: 見本
        text: てんびんに 🍎 と 🍋 を のせました。どちらが おもいかな。
        figure: "　　　　🍋\n　　／　　\n🍎　▲　　"
        explain: てんびんは、おもい ほうが したに さがります。🍎 の ほうが したに さがって いるので、🍎 の ほうが おもいです。🍋 は うえに あがって いるので、かるいです。
      - part: 思い出す
        text: くりは なんこ ありますか。
        figure: "🌰🌰🌰🌰🌰\n🌰🌰"
        answer: 7
        check: "n('🌰')"
        hints:
          - うえの ならびから かぞえよう。
          - したの ならびに つづけて かぞえよう。
          - うえは 5 こ。したは 6 から かぞえはじめるよ。
        paths:
          - [うえを かぞえる（5）, したに つづけて 6、7, 7 こ]
      - part: 思い出す
        text: 4 と 6 では、どちらが おおきいですか。
        choices: [4, 6]
        answer: 6
        check: "max(4, 6)"
        hints:
          - 1 から じゅんに かぞえてみよう。
          - さきに でて くるのは どちらかな。
          - あとから でて くる かずの ほうが おおきいよ。
        paths:
          - [1 から かぞえる, 4 の あとに 6 が でて くる, 6]
      - part: 今日
        text: どちらが おもいですか。
        figure: "🍊　　　　\n　　＼　　\n　　▲　🍇"
        choices: [みかん, ぶどう]
        answer: ぶどう
        check: "'ぶどう' if '🍇' in fig.splitlines()[-1] else 'みかん'"
        hints:
          - てんびんは どちらに かたむいて いるかな。
          - したに さがって いるのは どちらかな。
          - おもい ほうが したに さがるよ。
        paths:
          - [ぶどうの ほうが したに さがって いる, おもい ほうが さがる, ぶどう]
