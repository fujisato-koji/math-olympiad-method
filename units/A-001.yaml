        note: 「かるい ほう」を きかれて いる。さがった ほうを えらびやすいので、もんだいを いっしょに よむ。
      - part: 今日
        text: てんびんに 🍎 と 🍐 を のせたら、まっすぐに なって とまりました。どう いえますか。
