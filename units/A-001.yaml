# A-001 てんびんと重さくらべ
#
# 書き方は N-001 の頭の注のとおり。
# てんびんの図：かるい ほう（あがった ほう）を いちばん うえの 行に、おもい ほう（さがった ほう）を いちばん したの 行に かく。
#   ▲ は ささえ、／ と ＼ は かたむいた うで、─ は つりあって まっすぐな うで（つりあった てんびんは 2 行）。
#   2 つの てんびんは よこに ならべる（行を そろえる）。
# check：おもい ほうは fig.splitlines()[-1] に、かるい ほうは fig.splitlines()[0] に ある。
#   いちばん おもいのは うえの 行に いちども ない もの、いちばん かるいのは したの 行に いちども ない もの。
#   おもい じゅんは「うえの 行に ある かず − したの 行に ある かず」の 小さい じゅん。
# 重さは じっさいと くいちがわない ものを えらぶ（くだもの）。じっさいの 重さが わからない ものは、いろの ちがう はこ（🟥🟦🟨🟩）に する。
# 前提は N-001 だけなので、たし算の しきは つかわない。置きかえは「1 こずつ とりかえて かぞえる」で考え、数は 10 まで。
# 地図の plan の 4 日目は「L-002 と混ぜる」だが、L-002 は前提（needs）にない。L-002 の道具（表に〇と×）は使わず、
#   N-001 と 1〜3 日目の型を混ぜ、L-002 の「ヒントから 1 つに決める」形を てんびんだけで作った（1 つだけ おもい はこを さがす）。
# plan に わけの 日が ないので、2〜4 日目に 1 問ずつ わけを 置いた。

id: A-001
