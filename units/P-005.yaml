# P-005 平面内の運動と剛体のつり合い（曲線運動の速度と加速度、放物運動、力のモーメント、重心）
#
# 水準 3・8 日。前提は P-001、P-003、D-006、E-174。曲線運動の速度と加速度、水平投射、斜方投射、力のモーメント、重心、剛体のつり合い。
# 重力加速度は 10 m/s²（整数で計算できるように）。単位は m、s、N、N·m、m/s、m/s²。
id: P-005
days:
  - day: 1
    items:
      - part: 見本
        text: 曲がって進む物の速度の向きは、通り道にふれる線（接線）の向きです。向きが変わり続けるので、速度も変わり続けます。速度が変わるとき、加速度があります。
