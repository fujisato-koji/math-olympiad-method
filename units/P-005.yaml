ri:
  - part: 離
    kinds: [総動員, 道筋]
    uses: [E-174]
    text: 長さ 24 cm で同じ重さの積み木が 3 つある。1 つずつ、下の積み木の上に、右へずらして重ねる。いちばん上の積み木の右のはしに、積み木 1 つと同じ重さのおもりをぶらさげる。いちばん下の積み木は台の上にあり、台の右のはしから右へ出してよい。くずれないようにして、できるだけ右へ出すとき、おもりは台の右のはしから右へ最大で何 cm のところにありますか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="150" width="110" height="24" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="36" y="126" width="96" height="24" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="52" y="102" width="96" height="24" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="76" y="78" width="96" height="24" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="172" y1="102" x2="172" y2="125" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="172" cy="133" r="8" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="120" y1="46" x2="120" y2="150" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/><text x="120" y="36" font-size="14" text-anchor="middle" fill="currentColor">台のはし</text><line x1="127" y1="66" x2="165" y2="66" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="172,66 165,69.5 165,62.5" fill="currentColor"/><polygon points="120,66 127,62.5 127,69.5" fill="currentColor"/><text x="146" y="60" font-size="13" text-anchor="middle" fill="currentColor">？ cm</text><line x1="43" y1="190" x2="125" y2="190" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="132,190 125,193.5 125,186.5" fill="currentColor"/><polygon points="36,190 43,186.5 43,193.5" fill="currentColor"/><text x="84" y="184" font-size="13" text-anchor="middle" fill="currentColor">24 cm</text></svg>'
    choices: [11, 12, 13, 14]
    answer: 13
    check: "sum(Fraction(24,2*n) for n in (2,3,4))//1"
    hints:
      - くずれないのは、上にのっているものすべての重心が、下の積み木の上にあるときです。上から順に、1 つずつ考えます。
      - text: いちばん上の積み木とおもりを、1 つのかたまりと見ます。かたまりの重心は、積み木の重心とおもりの真ん中です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="76" y="100" width="96" height="24" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><rect x="52" y="124" width="96" height="24" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="172" y1="124" x2="172" y2="146" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="172" cy="154" r="8" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="124" cy="112" r="4" fill="currentColor"/><circle cx="172" cy="154" r="4" fill="currentColor"/><circle cx="148" cy="133" r="20" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - 下の積み木のはしに、上のかたまりの重心がちょうどくるのが限度です。下の積み木へ行くほど、のっている重さが 1 つずつふえます。
    paths:
      - [上から順にかたまりの重心を考える, 上のかたまりの重心が 1 つ下の積み木のはしの真上, ずれの長さは 6、4、3, 合わせて 13]
      - [台のはしを 0 として、3 つのはしの位置を文字でおく, 積み木ごとに重心がはしにくる式を立てる, 連立して解く, 13]
    note: S16 後ろから考える、S03 重心のつり合い。種なし、構造の表から組み立てた。積み木の積み上げ（ずらし）の型に、おもりを足して重さの比を変え、ずれの長さを 6、4、3 と不ぞろいにした。ずれの長さが段ごとに変わることに気づき、上から順に重さをふやして考える 3 つの手順が要る。
  - part: 離
    kinds: [数, 総動員]
    uses: [G-027]
    text: 高さ 80 m のがけの上から、球 A を水平に右へ 20 m/s で投げた。A を投げた 1 秒後に、同じ場所から球 B を水平に左へ 30 m/s で投げた。2 つの球が地面に着く前に、2 つの速度の向きが直角になった。それは A を投げてから何秒後ですか。空気の ていこうは考えない。重力加速度は 10 m/s² とする。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="130" y="70" width="40" height="110" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="10" y1="180" x2="310" y2="180" fill="none" stroke="currentColor" stroke-width="2"/><line x1="170" y1="70" x2="225" y2="70" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="235,70 225,75 225,65" fill="currentColor"/><text x="270" y="66" font-size="14" text-anchor="middle" fill="currentColor">A 20 m/s</text><line x1="130" y1="70" x2="75" y2="70" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="65,70 75,65 75,75" fill="currentColor"/><text x="45" y="62" font-size="14" text-anchor="middle" fill="currentColor">B 30 m/s</text><text x="150" y="130" font-size="14" text-anchor="middle" fill="currentColor">80 m</text><text x="150" y="56" font-size="14" text-anchor="middle" fill="currentColor">B は 1 秒おくれ</text></svg>'
    choices: [2, 3, 4, 5]
    answer: 3
    check: "[t for t in range(2,5) if 10*t*10*(t-1)==20*30][0]"
    hints:
      - 速度を、横と下に分けます。横の速さはずっと変わらず、下向きの速さは 10 × 落ちはじめてからの時間です。
      - text: B は A より 1 秒おそく落ちはじめるので、同じ時間の下向きの速さは A より 10 m/s 小さくなります。表にして、2 本の矢のようすを見てみましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="50" width="90" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="75" y="69.9" font-size="14" text-anchor="middle" fill="currentColor">A を投げて</text><rect x="120" y="50" width="90" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="165" y="69.9" font-size="14" text-anchor="middle" fill="currentColor">A の下向き</text><rect x="210" y="50" width="90" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="255" y="69.9" font-size="14" text-anchor="middle" fill="currentColor">B の下向き</text><rect x="30" y="80" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="75" y="99.9" font-size="14" text-anchor="middle" fill="currentColor">2 秒後</text><rect x="120" y="80" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="165" y="99.9" font-size="14" text-anchor="middle" fill="currentColor">20</text><rect x="210" y="80" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="255" y="99.9" font-size="14" text-anchor="middle" fill="currentColor">10</text><rect x="30" y="110" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="75" y="129.9" font-size="14" text-anchor="middle" fill="currentColor">3 秒後</text><rect x="120" y="110" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="165" y="129.9" font-size="14" text-anchor="middle" fill="currentColor">？</text><rect x="210" y="110" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="255" y="129.9" font-size="14" text-anchor="middle" fill="currentColor">？</text><rect x="30" y="140" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="75" y="159.9" font-size="14" text-anchor="middle" fill="currentColor">4 秒後</text><rect x="120" y="140" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="165" y="159.9" font-size="14" text-anchor="middle" fill="currentColor">？</text><rect x="210" y="140" width="90" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="255" y="159.9" font-size="14" text-anchor="middle" fill="currentColor">？</text></svg>'
      - 同じ点から 2 本の矢を引くと、横の 20 と 30、下の 2 つの速さの 4 つの数が出てきます。矢が直角になるとき、これらの数の間に成り立つ関係を、相似な三角形で さがします。
    paths:
      - [時間 t で A の速度は右 20 と下 10t, B の速度は左 30 と下 10(t-1), 向きが直角なら内積が 0, 100t(t-1) が 600, t は 3]
      - [2 本の矢を下向きの線から測った角が足して 90 度, 2 つの直角三角形が相似, 下向きの速さの積が 20 × 30, 表で 2、3、4 秒を ためして 3]
    note: S25 ベクトルと直角、S23 相似。種なし。1 秒おくれの 2 球の速度が直角になる時間を求める。両方の下向きの速さの積が横の速さの積と等しいという関係を見つけるまでが山。A の着地は 4 秒後なので、3 秒後が答えに合う。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [E-174]
    text: 長さ 5 m のはしごを、つるつるのかべに立てかけた。はしごの上のはしは、ゆかから 4 m の高さでかべにふれている。はしごの重さは 100 N で、重さの力は真ん中にはたらく。重さ 500 N の人が、はしごを下から登る。ゆかがはしごを直角におす力の 0.5 倍までは、ゆかの まさつ力がはたらく。はしごがすべりださないで、人が登れる最高の位置は、ゆかから何 cm の高さですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="170" x2="310" y2="170" fill="none" stroke="currentColor" stroke-width="2"/><rect x="230" y="20" width="12" height="150" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="140" y1="170" x2="230" y2="50" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="171" cy="130" r="7" fill="currentColor"/><text x="150" y="118" font-size="14" text-anchor="middle" fill="currentColor">人</text><text x="185" y="160" font-size="14" text-anchor="middle" fill="currentColor">3 m</text><text x="255" y="120" font-size="14" text-anchor="middle" fill="currentColor">4 m</text><text x="110" y="60" font-size="14" text-anchor="middle" fill="currentColor">100 N</text><text x="110" y="78" font-size="14" text-anchor="middle" fill="currentColor">はしご</text><rect x="67" y="117" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="80" y="135" font-size="16" text-anchor="middle" fill="currentColor">？</text><line x1="150" y1="110" x2="150" y2="170" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/></svg>'
    choices: [240, 260, 280, 300]
    answer: 280
    check: "max(s for s in range(501) if 15000+300*s<=120000)*4//5"
    hints:
      - すべりださない限度は、ゆかの まさつ力が 0.5 × （ゆかがおす力）になるときです。ゆかがおす力は、はしごと人の重さの和です。
      - text: かべはつるつるなので、かべからは水平な力だけがはたらきます。まさつ力と、かべからの力は等しくなります。力の向きを矢で見てみましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="170" x2="310" y2="170" fill="none" stroke="currentColor" stroke-width="2"/><rect x="230" y="20" width="12" height="150" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><line x1="140" y1="170" x2="230" y2="50" fill="none" stroke="currentColor" stroke-width="4"/><line x1="230" y1="50" x2="180" y2="50" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="170,50 180,45 180,55" fill="currentColor"/><text x="190" y="40" font-size="14" text-anchor="middle" fill="currentColor">かべの力</text><line x1="140" y1="170" x2="180" y2="170" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="190,170 180,175 180,165" fill="currentColor"/><text x="165" y="190" font-size="14" text-anchor="middle" fill="currentColor">まさつ力</text><line x1="140" y1="170" x2="140" y2="130" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="140,120 145,130 135,130" fill="currentColor"/><circle cx="190" cy="50" r="20" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - かべの力が限度の大きさになるときが、いちばん高い位置です。はしごの下のはしを回転の中心にして、力のモーメントのつり合いを考えます。
    paths:
      - [下のはしを回転の中心にした力のモーメント, はしごと人の重さのモーメントとかべの力 × 4 m が等しい, かべの力 = まさつ力の限度 300 N, 人の位置は下から 3.5 m, 高さは 3.5 × 4/5 = 2.8 m]
      - [はしごと人の重さを 1 つの合力にまとめる, 3 つの力は 1 点で交わる, 合力の作用線が通る位置がかべの力の高さ 4 m と交わる点, まさつが限度なら合力の横の位置は 2 m, 人の位置を式で出して 280 cm]
    note: S23 相似・比、S03 作用線の交点。種なし。はしごのまさつの型で、最高の位置を問う。つり合いの式を 3 つ立てる手もあるが、3 つの力が 1 点で交わることを使うと合力の位置だけで解ける。3 4 5 の三角形で、かべの高さとゆかの上の長さが整数になるようにした。
