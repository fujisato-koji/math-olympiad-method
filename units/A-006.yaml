# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 歯車 A（歯の数 30）と歯車 B（歯の数 18）がかみ合い、歯車 B と歯車 C（歯の数 12）がかみ合っています。かみ合った 2 つの歯車は、同じ時間に同じ数の歯が進みます。A が 8 回転する間に、C は何回転しますか。
    answer: 20
    check: "30 * 8 // 12"
    hints:
      - A が 8 回転すると、A の歯は全部でいくつ進むかな。
      - B の歯も同じ数だけ進むね。では C の歯はどうかな。
      - 進んだ歯の数が同じとき、回転数は歯の数に反比例するよ。
    paths:
      - [A の歯は 30 × 8 = 240 進む, B の歯も C の歯も 240 進む, C は 240 ÷ 12 = 20 回転]
      - [歯の数 × 回転数 がいつも同じ, A と C で 30 × 8 = 12 × □, □ = 20]
    note: 間の B の回転数（240 ÷ 18 はわり切れない）を求めようとして止まる子が多い。進む歯の数が 3 つとも同じなので B は考えなくてよい、と気づくのが道筋。歯の数と回転数が反比例することにもふれたい。
  - part: 離
    kinds: [総動員, 手数]
    uses: [G-011]
    text: たて 30 cm、横 40 cm の直方体の水そうに、毎分 2.4 L ずつ水を入れます。水そうははじめ空で、水の深さは時間に比例します。深さが 18 cm になるのは、水を入れ始めてから何分後ですか。
    answer: 9
    check: "18 * 30 * 40 // 2400"
    hints:
      - 1 L は何 cm³ かな。
      - 1 分に入る水の体積を底面積でわると、1 分に何 cm 深くなるかがわかるよ。
      - 深さは時間に比例するね。18 cm になるのは何分後かな。
    paths:
      - [毎分 2.4 L = 2400 cm³, 底面積は 30 × 40 = 1200 cm², 1 分に 2400 ÷ 1200 = 2 cm 深くなる, 18 ÷ 2 = 9 分後]
      - [深さ 18 cm の水の体積は 1200 × 18 = 21600 cm³ で 21.6 L, 21.6 ÷ 2.4 = 9 分後]
    note: 体積（G-011、1 L = 1000 cm³）と底面積から「1 分に何 cm」を出し、比例で時間を求める。L と cm³ の換算と、2.4 L の小数で間ちがえやすい。
  - part: 離
    kinds: [数]
    text: 面積が同じ長方形をいくつか考えます。たてが 1.2 m のとき、横は 5/6 m です。たてが 4/9 m のとき、横は何 m ですか。
    answer: 9/4
    accept: [2.25]
    check: "Fraction(12, 10) * Fraction(5, 6) / Fraction(4, 9)"
    hints:
      - 面積が同じとき、たてと横は反比例するね。
      - まず、面積を求めよう。1.2 を《分数》に直すとよいよ。
      - 横 ＝ 面積 ÷ たて。分数のわり算をしよう。
    paths:
      - [1.2 = 6/5, 面積は 6/5 × 5/6 = 1 m², 横は 1 ÷ 4/9 = 9/4 m]
      - [たては 4/9 ÷ 6/5 = 10/27 倍になる, 横は 27/10 倍で 5/6 × 27/10 = 9/4 m]
    note: 小数と分数がまざるので、小数を分数に直してそろえるのがこつ。面積がちょうど 1 m² になることに気づくと計算が楽になる。たてが小さくなったので横も小さくなると考えて、かけ算にしてしまう間ちがいに注意。

  - part: 離
    kinds: [読み取り]
    uses: [G-008]
    text: 面積が 24 cm² の長方形があります。縦が 4 cm のとき横は 6 cm、縦が 3 cm のとき横は 8 cm です。縦が 2.4 cm のとき、横は何 cm ですか。
    answer: 10
    check: "[x for x in range(1, 100) if Fraction(24, 10) * x == 24][0]"
    hints:
      - 長方形の面積は、縦 × 横。
      - 面積が 24 cm² で一定なら、縦と横は反比例する。
      - 縦 × 横 = 24 になる横をさがそう。
    paths:
      - [面積は 縦 × 横 = 24, 縦 2.4 cm のとき, 2.4 × 横 = 24, 横 = 10]
    note: 面積が一定の長方形では、縦と横は反比例する。縦が 1/2 になれば横は 2 倍。
