# A-006 比例と反比例
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：比例の意味（一方が 2 倍、3 倍…になると、もう一方も 2 倍、3 倍…）。2 日目：決まった数（1 あたりの量）と、ことばの式。
#   3 日目：反比例（一方が 2 倍、3 倍…になると、もう一方は 1/2、1/3…。2 つの量の積がいつも同じ）。4 日目：わけ。
#   5 日目：A-005 と混ぜる（比例と比、割合）。6 日目：確認。
# 前提は A-005（→ N-019、N-020）。文字（A-010）は前提にないので x、y は使わず、表の見出しの量の名前と、
#   ことばの式（深さ ＝ 3 × 時間）で表す。
# 比例のグラフは、座標（G-050）が前提にないので扱わない。グラフは A-019（1 次関数とグラフ）で扱う。
# A-005 と同じく、小数のかけ算とわり算と N-015 は前提にないので、計算は九九と、何十・何百の計算（80 × 6 = 480）でできる数にした。
#   九九をこえるわり算（48 ÷ 4）は、反比例の「人数が半分なら 1 人分は 2 倍」のように、比例・反比例の考えで求める道を本線にした。
# 速さは A-007 で扱うので場面に使わない。面積（G-008）とまわりの長さ（G-005）も前提にないので、場面は代金、重さ、水の深さ、
#   同じ数ずつ分ける、本を読む日数などにした。
# 表は全角の数字と全角の空白で、列の幅をそろえて書く（行ごとに中央へそろえて表示されるため）。check は表を読まず、表の数で計算する。
# 比例・反比例かを選ぶ問題の check は、表の数の組から、商（後ろの量 ÷ 前の量）や積が 1 つにそろうかを調べる。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-005、G-008、G-050、N-015 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-006
days:
  - day: 1
    items:
      - part: 見本
        text: 水そうに水を入れます。入れた時間と水の深さは、下の表のようになりました。時間が 2 倍、3 倍になると、深さはどうなるかな。
        figure: "時間（分）｜　１｜　２｜　３｜　４\n深さ（cm）｜　２｜　４｜　６｜　８"
        explain: 時間が 1 分から 2 分へ 2 倍になると、深さは 2 cm から 4 cm へ 2 倍になります。1 分から 3 分へ 3 倍になると、深さも 2 cm から 6 cm へ 3 倍です。このように、一方が 2 倍、3 倍…になると、もう一方も 2 倍、3 倍…になるとき、「深さは時間に比例する」といいます。
      - part: 思い出す
        text: 3:4 = 12:□ の □ に入る数はいくつですか。
        answer: 16
        check: "4 * (12 // 3)"
        hints:
          - 前の数は、3 から 12 になったね。何倍したのかな。
          - 後ろの数も、同じ数をかけよう。
          - 4 に、その数をかけた数が □ だよ。
        paths:
          - [3 × 4 = 12, 4 × 4 = 16, 16]
      - part: 思い出す
        text: 40 人の 3/5 は何人ですか。
        answer: 24
        check: "40 // 5 * 3"
        hints:
          - 3/5 は、40 人を 5 つに分けた 3 つ分だよ。
          - まず、5 つに分けた 1 つ分を求めよう。
          - 1 つ分の 3 つ分を求めよう。
        paths:
          - [1 つ分は 40 ÷ 5 = 8 人, 8 × 3 = 24 人]
      - part: 今日
        text: 1 さつ 60 円のノートを買います。さつ数と代金は、下の表のようになります。さつ数が 2 倍になると、代金はどうなりますか。
        figure: "さつ数　　｜　　１｜　　２｜　　３｜　　４\n代金（円）｜　６０｜１２０｜１８０｜２４０"
        choices: [2 倍になる, 半分になる, 変わらない]
        answer: 2 倍になる
        check: "'2 倍になる' if 120 == 60 * 2 and 240 == 120 * 2 else 'ちがう'"
        hints:
          - 1 さつから 2 さつへ、さつ数は何倍になったかな。
          - そのとき、代金は 60 円から何円になったかな。
          - 2 さつから 4 さつのときも、同じように見てみよう。
        paths:
          - [1 さつ → 2 さつで 2 倍, 60 円 → 120 円で 2 倍, 2 倍になる]
          - [2 さつ → 4 さつで 2 倍, 120 円 → 240 円で 2 倍, 2 倍になる]
      - part: 今日
        text: 同じ紙を重ねて、重さをはかりました。重さは、紙の枚数に比例していますか。
        figure: "枚数　　　｜　１｜　２｜　３｜　４\n重さ（ｇ）｜　５｜１０｜１５｜２０"
        choices: [比例している, 比例していない]
        answer: 比例している
        check: "'比例している' if len(set(Fraction(y, x) for x, y in [(1, 5), (2, 10), (3, 15), (4, 20)])) == 1 else '比例していない'"
        hints:
          - 枚数が 1 枚から 2 枚へ 2 倍になると、重さはどうなったかな。
          - 1 枚から 3 枚へ 3 倍になると、重さは何倍かな。
          - どこを比べても「同じだけ倍」になっているかを見よう。
        paths:
          - [1 枚 → 2 枚で 2 倍、5 g → 10 g で 2 倍, 1 枚 → 3 枚で 3 倍、5 g → 15 g で 3 倍, 比例している]
      - part: 今日
        text: くぎの重さは、本数に比例します。くぎ 10 本の重さは 30 g です。くぎ 40 本の重さは何 g ですか。
        answer: 120
        check: "30 * (40 // 10)"
        hints:
          - 10 本から 40 本へ、本数は何倍になったかな。
          - 比例しているので、重さも同じだけ倍になるよ。
          - 30 g に、その数をかけよう。
        paths:
          - [10 本 → 40 本で 4 倍, 30 g の 4 倍, 120 g]
          - [1 本は 30 ÷ 10 = 3 g, 40 本で 3 × 40 = 120 g]
        note: 40 − 10 = 30 本ふえたから 30 g ふえる、と考えて 60 g としやすい。比例は「何倍」で考える。
      - part: 挑戦
        text: 次の 3 つのうち、比例しているのはどれですか。あ：1 こ 30 円のあめを買うときの、こ数と代金。い：20 cm のろうそくが 1 分に 2 cm ずつ燃えるときの、時間と残りの長さ。う：3 さいちがいの兄弟の、弟の年れいと兄の年れい。
        choices: [あ, い, う]
        answer: あ
        check: "[c for c, t in {'あ': [(1, 30), (2, 60), (3, 90)], 'い': [(1, 18), (2, 16), (3, 14)], 'う': [(1, 4), (2, 5), (3, 6)]}.items() if len(set(Fraction(y, x) for x, y in t)) == 1][0]"
        hints:
          - それぞれ、表をかいてみよう。
          - 前の量が 1 から 2 へ 2 倍になると、後ろの量も 2 倍になっているかな。
          - いの残りの長さは、時間がたつとふえるかな、へるかな。
        paths:
          - [あ：1 こ 30 円、2 こ 60 円で 2 倍, い：1 分で 18 cm、2 分で 16 cm で 2 倍でない, う：弟 1 さいで兄 4 さい、弟 2 さいで兄 5 さいで 2 倍でない, あ]
          - ["あの表：1 こ 30 円、2 こ 60 円、3 こ 90 円", "いの表：1 分 18 cm、2 分 16 cm、3 分 14 cm", "うの表：弟 1 さいで兄 4 さい、2 さいで 5 さい", "2 倍になるのは あ だけ"]
        note: 「一方がふえると、もう一方もふえる」だけでは比例とはいえない（う）。2 倍、3 倍になっているかを確かめさせる。
    extra:
      - part: 今日
        text: 水そうに水を入れると、深さは時間に比例します。3 分で 12 cm になりました。6 分では何 cm になりますか。
        answer: 24
        check: "12 * (6 // 3)"
        hints:
          - 3 分から 6 分へ、時間は何倍になったかな。
          - 比例しているので、深さも同じだけ倍になるよ。
          - 12 cm に、その数をかけよう。
        paths:
          - [3 分 → 6 分で 2 倍, 12 cm の 2 倍, 24 cm]
      - part: 今日
        text: カードを 5 枚持っていて、毎日 3 枚ずつもらいます。持っている枚数は、日数に比例していますか。
        figure: "日数　　｜　１｜　２｜　３｜　４\n枚数　　｜　８｜１１｜１４｜１７"
        choices: [比例している, 比例していない]
        answer: 比例していない
        check: "'比例している' if len(set(Fraction(y, x) for x, y in [(1, 8), (2, 11), (3, 14), (4, 17)])) == 1 else '比例していない'"
        hints:
          - 日数が 1 日から 2 日へ 2 倍になると、枚数はどうなったかな。
          - 8 枚の 2 倍は何枚かな。
          - 表の枚数と、2 倍した枚数を比べよう。
        paths:
          - [1 日 → 2 日で 2 倍, 8 枚 → 11 枚で 2 倍ではない, 比例していない]
        note: 毎日同じ数ずつふえるので比例と考えやすい。はじめの 5 枚があるので、2 倍にはならない。
      - part: 挑戦
        text: 紙の重さは枚数に比例します。紙 20 枚で 60 g です。紙 5 枚では何 g ですか。
        answer: 15
        check: "60 // (20 // 5)"
        hints:
          - 20 枚から 5 枚へ、枚数は何分の 1 になったかな。
          - 比例しているので、重さも同じだけ小さくなるよ。
          - 60 g を、その数でわろう。
        paths:
          - [20 枚 → 5 枚で 1/4, 60 g の 1/4, 15 g]
          - [1 枚は 60 ÷ 20 = 3 g, 5 枚で 3 × 5 = 15 g]

  - day: 2
    items:
      - part: 見本
        text: 水を入れた時間と深さが、下の表のようになりました。深さ ÷ 時間 を計算すると、どうなるかな。
        figure: "時間（分）｜　１｜　２｜　３｜　４\n深さ（cm）｜　３｜　６｜　９｜１２"
        explain: 3 ÷ 1 = 3、6 ÷ 2 = 3、9 ÷ 3 = 3、12 ÷ 4 = 3 で、いつも 3 になります。比例する 2 つの量では、後ろの量 ÷ 前の量 がいつも同じ数になります。この数を決まった数といい、ここでは 1 分あたりに深くなる長さ（3 cm）です。だから「深さ ＝ 3 × 時間」と、ことばの式で表せます。10 分なら 3 × 10 = 30 cm です。
      - part: 思い出す
        text: くぎの重さは本数に比例します。くぎ 20 本で 50 g です。くぎ 80 本では何 g ですか。
        answer: 200
        check: "50 * (80 // 20)"
        hints:
          - 20 本から 80 本へ、本数は何倍になったかな。
          - 比例しているので、重さも同じだけ倍になるよ。
          - 50 g に、その数をかけよう。
        paths:
          - [20 本 → 80 本で 4 倍, 50 g の 4 倍, 200 g]
      - part: 思い出す
        text: 60 % を《分数》で表しましょう。
        answer: 3/5
        check: "Fraction(60, 100)"
        hints:
          - 60 % は、100 分のいくつかな。
          - 60/100 を約分しよう。
          - 60 と 100 は、どちらも 20 でわれるね。
        paths:
          - [60 % = 60/100, 約分して 3/5]
      - part: 今日
        text: 2 m のリボンを 3 人で同じ長さに分けます。1 人分は何 m ですか。分数で答えましょう。
        answer: 2/3
        check: "Fraction(2, 3)"
        hints:
          - 全部の長さを人数で分けるから、わり算の式になるね。
          - 2 と 3 の、どちらをどちらでわるかな。1 人分は 1 m より長いかな、短いかな。
          - わり切れないわり算は、分数で表せたね。わられる数が上、わる数が下になるよ。
        paths:
          - [式は 2 ÷ 3, わり切れないので分数にする, 2/3 m]
          - [1 m を 3 つに分けた 1 つ分は 1/3 m, 2 m ぶんだから 1/3 m の 2 つ分, 2/3 m]
        note: 2 ÷ 3 を 3 ÷ 2 としやすい。1 人分は 1 m より短いはず、と場面にもどって確かめさせる。
      - part: 今日
        text: えん筆の本数と代金は比例します。下の表で、代金 ÷ 本数 の決まった数はいくつですか。
        figure: "本数　　　｜　　３｜　　６｜　　９\n代金（円）｜１２０｜２４０｜３６０"
        answer: 40
        check: "Fraction(120, 3)"
        hints:
          - 決まった数は、代金 ÷ 本数 だよ。
          - 3 本で 120 円のところで計算してみよう。
          - 12 ÷ 3 を考えて、10 倍しよう。
        paths:
          - [120 ÷ 3 = 40, 240 ÷ 6 = 40 で同じ, 40]
        note: 決まった数は、1 本あたりの値段（40 円）にあたる。
      - part: 今日
        text: 水を入れた時間と深さは、下の表のようになりました。深さを表すことばの式は、どれですか。
        figure: "時間（分）｜　１｜　２｜　３\n深さ（cm）｜　４｜　８｜１２"
        choices: [深さ ＝ 4 × 時間, 深さ ＝ 時間 ＋ 4, 時間 ＝ 4 × 深さ]
        answer: 深さ ＝ 4 × 時間
        check: "[c for c, f in {'深さ ＝ 4 × 時間': lambda t: 4 * t, '深さ ＝ 時間 ＋ 4': lambda t: t + 4, '時間 ＝ 4 × 深さ': lambda t: Fraction(t, 4)}.items() if all(f(t) == d for t, d in [(1, 4), (2, 8), (3, 12)])][0]"
        hints:
          - 深さ ÷ 時間 の決まった数はいくつかな。
          - 2 分のところで、式に数を入れて確かめよう。
          - 表のどの列でも合う式をえらぼう。
        paths:
          - [決まった数は 4 ÷ 1 = 4, 深さ ＝ 4 × 時間, 2 分で 4 × 2 = 8 で合う]
        note: 「深さ ＝ 時間 ＋ 4」は 1 分のときだけ合う。2 つ以上の列で確かめさせる。
      - part: 今日
        text: ガムの代金は、ことばの式で「代金 ＝ 80 × こ数」と表せます。7 こ買うと、代金は何円ですか。
        answer: 560
        check: "80 * 7"
        hints:
          - こ数のところに 7 を入れよう。
          - 80 × 7 を計算しよう。
          - 8 × 7 を先に計算して、10 倍しよう。
        paths:
          - [80 × 7, 8 × 7 = 56 の 10 倍, 560 円]
      - part: 挑戦
        text: 水を入れる時間と深さは比例します。2 分で 3 cm 深くなります。1 分あたり何 cm 深くなりますか。分数で答えましょう。
        answer: 3/2
        check: "Fraction(3, 2)"
        hints:
          - 決まった数は、深さ ÷ 時間 だね。
          - 2 分で 3 cm だから、どの数をどの数でわればよいかな。
          - わり切れないわり算は、分数で表せたね。
        paths:
          - [決まった数は 3 ÷ 2, 分数で 3/2 cm]
          - ["1 分は 2 分の半分", "深さも半分になる", "3 ÷ 2 = 3/2 cm"]
        note: 決まった数は《整数》とはかぎらない。3/2 cm は 1.5 cm と同じだが、ここは分数で答える。
    extra:
      - part: 今日
        text: おもりのこ数と重さは比例します。下の表で、重さ ÷ こ数 の決まった数はいくつですか。
        figure: "こ数　　　｜　２｜　５｜　８\n重さ（ｇ）｜１２｜３０｜４８"
        answer: 6
        check: "Fraction(12, 2)"
        hints:
          - 決まった数は、重さ ÷ こ数 だよ。
          - 2 こで 12 g のところで計算してみよう。
          - ほかの列でも同じになるか、確かめよう。
        paths:
          - [12 ÷ 2 = 6, 30 ÷ 5 = 6 で同じ, 6]
      - part: 今日
        text: おもりの重さは、ことばの式で「重さ ＝ 6 × こ数」と表せます。9 こでは何 g ですか。
        answer: 54
        check: "6 * 9"
        hints:
          - こ数のところに 9 を入れよう。
          - 6 × 9 を計算しよう。
          - 6 の段の九九を思い出そう。
        paths:
          - [6 × 9, 54 g]
      - part: 挑戦
        text: 針金の重さは長さに比例します。3 m で 60 g です。8 m では何 g ですか。
        answer: 160
        check: "60 // 3 * 8"
        hints:
          - 3 m から 8 m へは、何倍かわかりにくいね。
          - まず、1 m あたりの重さを求めよう。
          - 1 m あたりの重さを 8 つ分にしよう。
        paths:
          - [1 m あたり 60 ÷ 3 = 20 g, 20 × 8 = 160 g]
        note: 何倍かが整数にならないときは、決まった数（1 あたりの量）を先に求める。

  - day: 3
    items:
      - part: 見本
        text: 24 このあめを、何人かで同じ数ずつ分けます。人数と 1 人分のこ数は、下の表のようになります。人数が 2 倍、3 倍になると、1 人分はどうなるかな。
        figure: "人数　｜　１｜　２｜　３｜　６\n１人分｜２４｜１２｜　８｜　４"
        explain: 人数が 1 人から 2 人へ 2 倍になると、1 人分は 24 こから 12 こへ 1/2 になります。1 人から 3 人へ 3 倍になると、1 人分は 8 こで 1/3 です。一方が 2 倍、3 倍…になると、もう一方が 1/2、1/3…になるとき、「1 人分は人数に反比例する」といいます。人数 × 1 人分 はいつも 24（全部のあめの数）になります。
      - part: 思い出す
        text: ジュースの代金は、ことばの式で「代金 ＝ 50 × 本数」と表せます。6 本買うと、代金は何円ですか。
        answer: 300
        check: "50 * 6"
        hints:
          - 本数のところに 6 を入れよう。
          - 50 × 6 を計算しよう。
          - 5 × 6 を先に計算して、10 倍しよう。
        paths:
          - [50 × 6, 5 × 6 = 30 の 10 倍, 300 円]
      - part: 思い出す
        text: 紙の重さは枚数に比例します。紙 15 枚で 40 g です。45 枚では何 g ですか。
        answer: 120
        check: "40 * (45 // 15)"
        hints:
          - 15 枚から 45 枚へ、枚数は何倍になったかな。
          - 比例しているので、重さも同じだけ倍になるよ。
          - 40 g に、その数をかけよう。
        paths:
          - [15 枚 → 45 枚で 3 倍, 40 g の 3 倍, 120 g]
      - part: 今日
        text: 36 このおはじきを、何人かで同じ数ずつ分けます。表の □ に入る数はいくつですか。
        figure: "人数　｜　１｜　２｜　３｜　４\n１人分｜３６｜１８｜１２｜　□"
        answer: 9
        check: "36 // 4"
        hints:
          - 人数 × 1 人分 は、いつもいくつかな。
          - 4 人で分けると、1 人分はいくつかな。
          - 2 人から 4 人へ 2 倍になると、1 人分はどうなるかも考えてみよう。
        paths:
          - [人数 × 1 人分 ＝ 36, 36 ÷ 4 = 9, 9 こ]
          - [2 人 → 4 人で 2 倍, 1 人分は 18 の 1/2, 9 こ]
      - part: 今日
        text: 決まった数のクッキーを、同じ数ずつ箱に入れます。箱の数を 3 倍にすると、1 箱に入るクッキーの数はどうなりますか。
        choices: [3 倍になる, 1/3 になる, 変わらない]
        answer: 1/3 になる
        check: "'1/3 になる' if Fraction(24, 2 * 3) == Fraction(24, 2) / 3 else 'ちがう'"
        hints:
          - クッキーが 24 こで、箱が 2 こなら 1 箱に何こかな。
          - 箱を 3 倍の 6 こにすると、1 箱に何こかな。
          - 2 つの数をくらべよう。
        paths:
          - [箱 2 こなら 1 箱 12 こ, 箱 6 こなら 1 箱 4 こ, 12 こが 4 こで 1/3]
        note: 1 箱の数は箱の数に反比例する。数を決めて表にすると考えやすい。
      - part: 今日
        text: 本を 1 日に同じページずつ読みます。1 日に読むページ数と日数の関係は、どれですか。
        figure: "ページ数｜　５｜１０｜１５｜２０\n日数　　｜１２｜　６｜　４｜　３"
        choices: [比例, 反比例, どちらでもない]
        answer: 反比例
