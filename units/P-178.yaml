        explain: ひかりは、とちゅうに じゃまな ものが なければ、まっすぐに すすみます。ゆげや ほこりの ある くらい へやで ライトを つけると、ひかりの すじが まっすぐに 見えます。ストローを のぞくと、まっすぐな ときだけ むこうの ものが 見えるのも、ひかりが まがらないからです。ライトの ひかりは、人の 目に むけないように させます。
