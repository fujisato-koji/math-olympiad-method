# P-178 光と影
#
# 段 1・水準 1・4 日。光はまっすぐ進むこと、影は光の反対側にできること、日なたと日かげのちがいを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 日の並び：1 日目 導入（光はまっすぐ進む）、2 日目 練習（影は光の反対側、日なたと日かげ）、3 日目 わけ（影ができるわけ、日なたが暖かいわけ）、4 日目 確認。
# ライトや電球の光は人の目に向けない。太陽は直接見ない（見本の text と explain にも書いた）。
# 腕だめし（離）の kinds は読み取り（絵の中の影の向きや位置を読み取って答える）。

