      - part: わけ
        text: ライトで はこを てらすと、ライトと はんたいの がわに かげが できます。どうしてかな。くちで せつめいして みよう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><ellipse cx="215" cy="167" rx="50" ry="5.5" fill="currentColor" fill-opacity=".45"/><line x1="8" y1="165" x2="312" y2="165" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="130" y="110" width="35" height="55" rx="2" stroke="currentColor" stroke-width="2" fill="#c9a36b" fill-opacity=".55"/><g transform="translate(52 48) rotate(35)"><rect x="-40" y="-7" width="31" height="14" rx="3" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity=".75"/><polygon points="-9,-7 0,-12 0,12 -9,7" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".65" stroke-linejoin="round"/></g><text x="215" y="190" font-size="14" text-anchor="middle" fill="currentColor">かげ</text></svg>'
        explain: 「ひかりは まっすぐ すすみます。はこに あたった ひかりは そこで とまり、まがって はこの うしろへ まわる ことは できません。だから、はこの うしろ（ライトと はんたいの がわ）には ひかりが とどかず、くらく なります。それが かげです。」と いえれば よい。① ひかりは まっすぐ すすむ、② ものに あたると とまる、③ うしろへ まわれないので、はんたいの がわが くらく なる。おうちでは、ライトと 小さな はこで たしかめさせます。
