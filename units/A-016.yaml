          - Q が正の数であることも書いて、√12 と結びましょう。
        paths:
          - [Q = 2√3 とする, Q² = 4 × 3 = 12, Q は正の数, 2 乗して 12 になる正の数は √12]
          - [√12 = √(4 × 3), √4 × √3（前の問題）, 2√3]
