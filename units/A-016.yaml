4</text><text x="74" y="220" font-size="15" text-anchor="middle" fill="currentColor">2</text><rect x="120" y="141.8" width="58.2" height="58.2" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="149.1" y="175.9" font-size="15" text-anchor="middle" fill="currentColor">7</text><text x="149.1" y="220" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">√7</text><rect x="202.2" y="134" width="66" height="66" fill="#c8ccd6" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="235.2" y="172" font-size="15" text-anchor="middle" fill="currentColor">9</text><text x="235.2" y="220" font-size="15" text-anchor="middle" fill="currentColor">3</text></svg>'
        explain: 3² = 9、(−3)² = 9 なので、2 乗すると 9 になる数は 3 と −3 の 2 つです。2 乗すると a になる数を a の平方根といい、正のほうを √a（ルート a と読む）、負のほうを −√a と書きます。√9 = 3 です。図のように、面積 7 の正方形の 1 辺の長さが √7 で、(√7)² = 7 です。7 は 4 と 9 の間なので、√7 は 2 と 3 の間にあります。正方形は面積が大きいほど 1 辺も長いので、√a と √b の大小は、a と b の大小と同じです。3 と √7 なら、3 = √9 と見てくらべます。
