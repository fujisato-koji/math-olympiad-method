# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員]
    uses: [G-005, G-008]
    text: 面積が 50 cm² の正方形と、面積が 18 cm² の正方形を、図のように下をそろえて横にくっつけて並べました。この図形のまわりの長さは何 cm ですか。
    svg: |
      <svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="20" width="100" height="100" fill="#f3c969" fill-opacity=".35" stroke="currentColor" stroke-width="2"/>
        <rect x="120" y="60" width="60" height="60" fill="#f3c969" fill-opacity=".35" stroke="currentColor" stroke-width="2"/>
        <text x="70" y="75" font-size="14" text-anchor="middle">50 cm²</text>
        <text x="150" y="95" font-size="12" text-anchor="middle">18 cm²</text>
      </svg>
    choices: [26√2, 29√2, 32√2]
    answer: 26√2
    check: "[c for c, v in {'26√2': 26 * math.sqrt(2), '29√2': 29 * math.sqrt(2), '32√2': 32 * math.sqrt(2)}.items() if math.isclose(v, 4 * math.sqrt(50) + 2 * math.sqrt(18))][0]"
    hints:
      - 面積が 50 cm² の正方形の 1 辺は、2 乗すると 50 になる数だね。a√b の形にしよう。
      - 2 つの正方形の 1 辺を求めたら、図形のまわりを 1 周たどって、辺を足そう。
      - 大きい正方形の右の辺は、一部だけがまわりになるよ。
    paths:
      - [1 辺は √50 = 5√2 cm と √18 = 3√2 cm, 下 8√2、左 5√2、上 5√2 と 3√2、右 3√2、段差 2√2, 合わせて 26√2 cm]
      - [段差の辺を右へ、小さい正方形の上の辺を上へずらすと 外側の長方形と同じまわりになる, 長方形は たて 5√2、横 8√2, 2 × (5√2 + 8√2) = 26√2 cm]
    note: 面積（G-008）から 1 辺を平方根で出し、まわりの長さ（G-005）をたどる。2 つの正方形のまわりをそのまま足した 32√2 や、くっついた辺を 1 回分しかひかない 29√2 を選びやすい。√50 + √18 を √68 とまとめてしまう間ちがいにも注意。
  - part: 離
    kinds: [道筋]
    text: √(2026 − 3n) が整数になるような自然数 n のうち、いちばん小さいものはいくつですか。
    answer: 30
    check: "min(n for n in range(1, 676) if math.isqrt(2026 - 3 * n) ** 2 == 2026 - 3 * n)"
    hints:
      - n が小さいほど、根号の中の数は大きくなるね。
      - 2026 より小さい平方数を、大きいほうから順に調べよう。45² はいくつかな。
      - 2026 − (平方数) が 3 でわり切れれば、n が求められるよ。
    paths:
      - [2026 − 3n が平方数になればよい, 45² = 2025 なら 3n = 1 で n は自然数にならない, 44² = 1936 なら 3n = 90 で n = 30, 30]
    note: n を 1 から順にためすと大変。根号の中が大きいほど n が小さいので、2026 以下の大きい平方数から逆に調べるのが道筋。45² = 2025 で 3n = 1 となり、n が自然数にならないことを確かめる一手間がある。
  - part: 離
    kinds: [数, 手数]
    text: x = 3 − 2√2 のとき、x² + 1/x² の値はいくつですか。
    answer: 34
    check: "[k for k in range(0, 100) if math.isclose((3 - 2 * math.sqrt(2)) ** 2 + 1 / (3 - 2 * math.sqrt(2)) ** 2, k)][0]"
    hints:
      - 1/x の分母を有理化しよう。
      - x + 1/x の値を先に求めると、計算が楽になるよ。
      - (x + 1/x)² を展開すると、x² + 1/x² が出てくるね。
    paths:
      - [1/x = 1/(3 − 2√2) = 3 + 2√2, x + 1/x = 6, (x + 1/x)² = x² + 2 + 1/x² = 36, x² + 1/x² = 34]
      - [x² = 17 − 12√2、1/x² = (3 + 2√2)² = 17 + 12√2, 足して 34]
    note: 分母の有理化（(3 − 2√2)(3 + 2√2) = 1）、乗法公式、根号の計算を続けて使う。x + 1/x = 6 を作ってから 2 乗すると楽だが、2 乗したときの「+ 2」を忘れて 36 と答えやすい。
