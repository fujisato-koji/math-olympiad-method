        id: "05e32ea48e"
        text: √12 = 2√3 となるわけを、平方根の意味を使って、すじ道を立てて書きましょう。
        explain: 例：「Q = 2√3 とする。Q を 2 乗すると、Q² = 2² × (√3)² = 4 × 3 = 12。また、2 も √3 も正の数なので、Q は正の数である。2 乗すると 12 になる正の数は √12 なので、Q = √12、つまり √12 = 2√3 である。」と書ければよい。①「〜とする」、② 2 乗する変形、③ 平方根の意味と、正の数どうしの積は正、で結ぶ、がそろっているかを見る。前の問題の √a × √b = √(ab) を使って、√12 = √(4 × 3) = √4 × √3 = 2√3 と書いてもよい（約束した事実として使ってよいことをたしかめる）。12 = 2² × 3 と素因数分解して、2² の 2 が外に出ることを言えていれば、なおよい。ヒントの図は、1 辺が 2√3 の正方形の面積が 12 になることを見せている。
        hints:
          - 「Q = 2√3 とする」から書き始め、Q を 2 乗しましょう。
          - text: 2² と (√3)² を、それぞれ計算しましょう。図のように、1 辺が Q = 2√3 の正方形は、1 辺が √3 の正方形 4 こに分けられます。
