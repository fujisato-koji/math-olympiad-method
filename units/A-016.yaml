      - part: 今日
        text: √27 − √12 を計算すると、どれになりますか。
        choices: [√3, √15, 5√3]
        answer: √3
        check: "[c for c, v in {'√3': math.sqrt(3), '√15': math.sqrt(15), '5√3': 5 * math.sqrt(3)}.items() if math.isclose(v, math.sqrt(27) - math.sqrt(12))][0]"
        hints:
          - √27 と √12 を、それぞれ a√3 の形にしましょう。
          - 根号の中がそろったら、係数をひきましょう。
