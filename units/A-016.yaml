    uses: [G-005, G-008]
    text: 面積が 50 cm² の正方形と、面積が 18 cm² の正方形を、図のように下をそろえて横にくっつけてならべました。この図形のまわりの長さは何 cm ですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="52" width="110" height="110" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><rect x="170" y="96" width="66" height="66" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="115" y="113" font-size="16" text-anchor="middle" fill="currentColor">50 cm²</text><text x="203" y="135" font-size="14" text-anchor="middle" fill="currentColor">18 cm²</text></svg>'
    choices: [26√2, 29√2, 32√2]
    answer: 26√2
    check: "[c for c, v in {'26√2': 26 * math.sqrt(2), '29√2': 29 * math.sqrt(2), '32√2': 32 * math.sqrt(2)}.items() if math.isclose(v, 4 * math.sqrt(50) + 2 * math.sqrt(18))][0]"
    hints:
      - 面積が 50 cm² の正方形の 1 辺は、2 乗すると 50 になる数だね。a√b の形にしよう。
      - text: 2 つの正方形の 1 辺を求めたら、図形のまわりを 1 から 6 の順にたどって、辺を足そう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="52" width="110" height="110" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><rect x="170" y="96" width="66" height="66" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="115" y="113" font-size="16" text-anchor="middle" fill="currentColor">50 cm²</text><text x="203" y="135" font-size="14" text-anchor="middle" fill="currentColor">18 cm²</text><polyline points="60,162 60,52 170,52 170,96 236,96 236,162 60,162" fill="none" stroke="#f08080" stroke-width="4" stroke-opacity=".9"/><text x="46" y="112" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">1</text><text x="115" y="42" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">2</text><text x="182" y="79" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">3</text><text x="203" y="86" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">4</text><text x="250" y="134" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">5</text><text x="148" y="184" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">6</text></svg>'
      - 大きい正方形の右の辺は、上の一部だけがまわりになるよ（図の 3）。
    paths:
      - [1 辺は √50 = 5√2 cm と √18 = 3√2 cm, 下 8√2、左 5√2、上 5√2 と 3√2、右 3√2、大きい正方形の右の辺の上の部分 2√2, 合わせて 26√2 cm]
      - [大きい正方形の右の辺の上の部分を右へ、小さい正方形の上の辺を上へずらすと、外がわの長方形と同じまわりになる, 長方形は たて 5√2、横 8√2, 2 × (5√2 + 8√2) = 26√2 cm]
    note: 面積（G-008）から 1 辺を平方根で出し、まわりの長さ（G-005）をたどる。2 つの正方形のまわりをそのまま足した 32√2 や、くっついた辺を 1 回分しかひかない 29√2 を選びやすい。√50 + √18 を √68 とまとめてしまう間ちがいにも注意。
  - part: 離
    id: "0a5942bd42"
    kinds: [道筋]
    text: √(2026 − 3n) が《整数》になるような自然数 n のうち、いちばん小さいものはいくつですか。
    answer: 30
    check: "min(n for n in range(1, 676) if math.isqrt(2026 - 3 * n) ** 2 == 2026 - 3 * n)"
    hints:
      - text: n が小さいほど、根号の中の数は大きくなるね。2026 から 3n だけもどった数が、ある整数の 2 乗になればよい。
        svg: '<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><line x1="16" y1="112" x2="306" y2="112" stroke="currentColor" stroke-width="2"/><line x1="84" y1="105" x2="84" y2="119" stroke="currentColor" stroke-width="2"/><text x="84" y="140" font-size="15" text-anchor="middle" fill="currentColor">44²</text><line x1="238" y1="105" x2="238" y2="119" stroke="currentColor" stroke-width="2"/><text x="238" y="140" font-size="15" text-anchor="middle" fill="currentColor">45²</text><line x1="288" y1="105" x2="288" y2="119" stroke="currentColor" stroke-width="2"/><text x="288" y="140" font-size="15" text-anchor="middle" fill="currentColor">2026</text><circle cx="288" cy="112" r="5" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><path d="M288 100 Q186 42 89.2 97" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="84,100 88.8,92.2 93.1,99.9" fill="currentColor"/><text x="186" y="60" font-size="15" text-anchor="middle" fill="currentColor">3n だけ もどる</text><text x="160" y="26" font-size="14" text-anchor="middle" fill="currentColor">もどった先が、ある整数の 2 乗になればよい</text></svg>'
      - 2026 より小さい平方数を、大きいほうから順に調べよう。45² はいくつかな。
      - 2026 − (平方数) が 3 でわり切れれば、n が求められるよ。
    paths:
      - [2026 − 3n が平方数になればよい, 45² = 2025 なら 3n = 1 で n は自然数にならない, 44² = 1936 なら 3n = 90 で n = 30, 30]
      - [2026 は 3 でわると 1 あまるので、2026 − 3n も 3 でわると 1 あまる, 45² = 2025 は 3 でわり切れるのでだめ, 44² = 1936 は 3 でわると 1 あまり、3n = 90 で n = 30]
    note: n を 1 から順にためすと大変。根号の中が大きいほど n が小さいので、2026 以下の平方数を、大きいほうから順に調べるのがすじ道。45² = 2025 で 3n = 1 となり、n が自然数にならないことをたしかめる一手間がある。
  - part: 離
    id: "16c22f115f"
    kinds: [数, 手数]
    text: x = 3 − 2√2 のとき、x² + 1/x² の値はいくつですか。
    answer: 34
    check: "[k for k in range(0, 100) if math.isclose((3 - 2 * math.sqrt(2)) ** 2 + 1 / (3 - 2 * math.sqrt(2)) ** 2, k)][0]"
    hints:
      - 1/x の分母を有理化しよう。
      - x + 1/x の値を先に求めると、計算が楽になるよ。
      - (x + 1/x)² を展開すると、x² + 1/x² が出てくるね。
    paths:
      - [1/x = 1/(3 − 2√2) = 3 + 2√2, x + 1/x = 6, (x + 1/x)² = x² + 2 + 1/x² = 36, x² + 1/x² = 34]
      - [x² = 17 − 12√2、1/x² = (3 + 2√2)² = 17 + 12√2, 足して 34]
    note: 分母の有理化（(3 − 2√2)(3 + 2√2) = 1）、乗法公式、根号の計算を続けて使う。x + 1/x = 6 を作ってから 2 乗すると楽だが、2 乗したときの「+ 2」をわすれて 36 と答えやすい。

  - part: 離
    id: "c9870f9db1"
    kinds: [総動員]
    uses: [N-017]
    text: √(45n) が整数になるような自然数 n のうち、いちばん小さいものはいくつですか。
    answer: 5
    check: "[n for n in range(1, 100) if math.isqrt(45 * n) ** 2 == 45 * n][0]"
    hints:
      - 45 を素因数分解しよう。
      - text: 45 = 3 × 3 × 5 だよ。どの素因数も、2 つずつ組にしたいね。
        svg: '<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><polyline points="41,86 48,82 57,112 69,46 283,46" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="77" y="61" width="92" height="42" rx="14" fill="#7bc96f" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="97" cy="82" r="16" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="97" y="88" font-size="16" text-anchor="middle" fill="currentColor">3</text><text x="123" y="87" font-size="14" text-anchor="middle" fill="currentColor">×</text><circle cx="149" cy="82" r="16" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="149" y="88" font-size="16" text-anchor="middle" fill="currentColor">3</text><text x="175" y="87" font-size="14" text-anchor="middle" fill="currentColor">×</text><circle cx="201" cy="82" r="16" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="201" y="88" font-size="16" text-anchor="middle" fill="currentColor">5</text><text x="227" y="87" font-size="14" text-anchor="middle" fill="currentColor">×</text><rect x="235" y="64" width="36" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="253" y="88" font-size="16" text-anchor="middle" fill="currentColor">n</text><text x="160" y="24" font-size="14" text-anchor="middle" fill="currentColor">45 × n = 3 × 3 × 5 × n</text><text x="160" y="150" font-size="14" text-anchor="middle" fill="currentColor">赤い数には、組のあいてがいない</text></svg>'
      - n をかけた 45n が、ある整数の 2 乗になっているか、計算してたしかめよう。
    paths:
      - [45 = 3² × 5, √(45n) = 3√(5n), 5n が平方数になる最小の n は 5, √225 = 15]
      - [n = 1、2、3、… と順にためす, 45、90、135、180 は整数の 2 乗でない, 45 × 5 = 225 = 15² で n = 5]
    note: 根号の中の素因数を、2 乗のペアにそろえる。3² はすでに外に出せる。
  - part: 離
    id: "ae6b5811b0"
    kinds: [総動員]
    uses: [G-008, G-019]
    text: 対角線の長さが 2√6 cm の正方形の面積は何 cm² ですか。
    svg: '<svg viewBox="0 0 320 195" xmlns="http://www.w3.org/2000/svg"><rect x="102" y="30" width="120" height="120" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="102" y1="150" x2="222" y2="30" stroke="#f08080" stroke-width="3"/><text x="140" y="74" font-size="15" text-anchor="middle" fill="currentColor">2√6 cm</text><text x="160" y="180" font-size="15" text-anchor="middle" fill="currentColor">面積は？</text></svg>'
    answer: 12
    check: "2 * 2 * 6 // 2"
    hints:
      - text: 正方形の対角線を d とすると、面積は d² ÷ 2。図のように、対角線と同じ長さの辺をもつ大きな正方形の、ちょうど半分になるよ。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="92" y="14" width="150" height="150" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><polygon points="167,14 242,89 167,164 92,89" fill="#7fc8f8" fill-opacity=".45" stroke="currentColor" stroke-width="2"/><line x1="92" y1="89" x2="242" y2="89" stroke="#f08080" stroke-width="3"/><line x1="167" y1="14" x2="167" y2="164" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><text x="200" y="81" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">2√6</text><line x1="92" y1="174" x2="242" y2="174" stroke="currentColor" stroke-width="2"/><line x1="92" y1="169" x2="92" y2="179" stroke="currentColor" stroke-width="2"/><line x1="242" y1="169" x2="242" y2="179" stroke="currentColor" stroke-width="2"/><text x="167" y="193" font-size="15" text-anchor="middle" fill="currentColor">2√6</text></svg>'
      - d = 2√6 なので、d² = 2² × (√6)² だね。
      - 大きな正方形の面積を求めて、その半分にしよう。
    paths:
      - [対角線 d = 2√6, 面積は d²/2, d² = 24, 24 ÷ 2 = 12]
      - [1 辺を a cm とすると、三平方の定理で a² + a² = (2√6)² = 24, a² = 12, 面積は a² なので 12 cm²]
    note: 正方形はひし形でもあるので、面積は「対角線 × 対角線 ÷ 2」で求められる。

