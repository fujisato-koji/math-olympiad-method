        id: "833084db4c"
        text: √2 × √3 = √6 となるわけを、平方根の意味（√a は、2 乗すると a になる正の数）を使って、すじ道を立てて書きましょう。
        explain: 例：「P = √2 × √3 とする。P を 2 乗すると、P² = (√2 × √3)² = (√2)² × (√3)²（積の 2 乗は 2 乗の積、A-009）= 2 × 3 = 6（平方根の意味）。また、√2 も √3 も正の数なので、その積 P も正の数である。2 乗すると 6 になる正の数は √6 なので、P = √6、つまり √2 × √3 = √6 である。」と書ければよい。①「〜とする」で P を決める、② 2 乗して式を変形する、③ 約束した事実（平方根の意味、積の累乗、正の数どうしの積は正）で結ぶ、の 3 つがそろっているかを見る。「P は正の数」を書き落としていたら、2 乗して 6 になる数には −√6 もあるので、正であることが要ると話す。同じすじ道で、正の数 a、b について √a × √b = √(ab) が言えることにもふれる。
        hints:
          - 「P = √2 × √3 とする」から書き始め、P を 2 乗しましょう。
          - (√2)² と (√3)² は、平方根の意味から、それぞれいくつでしょう。
          - P が正の数であることも書いて、√6 と結びましょう。
        paths:
          - [P = √2 × √3 とする, P² = (√2)² × (√3)² = 6, P は正の数, 2 乗して 6 になる正の数は √6]
          - [√2 × √3 を 2 乗すると (√2)² × (√3)² = 6, √6 を 2 乗しても 6, どちらも正の数で、2 乗が同じなので等しい]
