# A-016 平方根
#
# 書き方は N-001 の頭の注のとおり。答えの形は A-011 に合わせる（負の数は「−」U+2212）。
# 地図に plan がないので、既定の並び（導入、練習、わけ、混ぜる、確認）で作った。
#   1 日目：平方根の意味（2 乗すると a になる数、正と負の 2 つ）、√ の記号、(√a)² = a、大小（2 乗してくらべる）、整数の間。
#   2 日目：√a × √b = √(ab)、√a ÷ √b、根号の中の 2 乗の因数を外に出す（a√b、素因数分解）、分母の有理化、根号の中が同じもののたし算・ひき算。
#   3 日目：わけ。4 日目：A-015、N-021、A-009 と混ぜる（乗法公式で展開、√(60n) が整数になる n、式の値）。5 日目：確認。
# 前提は A-015（展開と因数分解）、N-021（素因数分解）、A-009（累乗）。前提の道に小数（N-020）がないので、
#   √2 = 1.41… のような近い値は出さず、「どの整数とどの整数の間にあるか」で大きさをとらえる。
#   方程式（A-011）も前提にないので、x² = 9 を解く形ではなく、「2 乗すると 9 になる数」と聞く（2 次方程式は A-017）。
#   √2 が分数で表せないこと（無理数）の証明は、背理法（L の流れ）が前提にないので扱わない。負の数の平方根も扱わない（A-021）。
# √ を含む答えは鍵盤で打てないので choices にし、check は math.sqrt の値が元の式と近い（math.isclose）ものを選び出す。
#   打つ問題は、整数になる値（√64、(√5 + √2)(√5 − √2)）、a√b の a、√(60n) が整数になる n などにした。
#   整数になる値の check は、2 乗してその数になる整数をさがすか、math.isclose で近い整数をさがす。
# a√b の形では、b をできるだけ小さい自然数にする。選択肢に、値は等しいが形のちがう式（√60 と 2√15 など）を並べない。
# 平方根は、三平方の定理（G-019）、2 次方程式の解（A-017）、標準偏差（S-029 の先）、物理の公式（周期、速さ）の計算に使う（D-026）。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-020 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-016
days:
  - day: 1
    items:
      - part: 見本
        text: 2 乗すると 9 になる数を、すべて求めてみましょう。
        explain: 3² = 9、(−3)² = 9 なので、2 乗すると 9 になる数は 3 と −3 の 2 つです。2 乗すると a になる数を、a の平方根といいます。正の数の平方根は、正と負の 2 つあり、絶対値は等しくなります。正のほうを √a（ルート a と読む）、負のほうを −√a と書き、2 つをまとめて ±√a と書きます。9 の平方根は ±3 で、√9 = 3 です。2 の平方根は ±√2 で、√2 は 1 と 2 の間にある数です。0 の平方根は 0 だけです。√a は 2 乗すると a になる正の数なので、(√a)² = a です。正の数どうしでは、2 乗が大きいほうが、もとの数も大きいので、√a と √b の大小は、a と b の大小と同じです。3 と √7 をくらべるときは、3 = √9 と見て、√7 < √9 から √7 < 3 です。
      - part: 思い出す
        text: (−7)² の値はいくつですか。
        answer: 49
        check: "(-7) ** 2"
        hints:
          - (−7)² は (−7) × (−7) のことです。
          - 負の数どうしのかけ算の符号は、どうなるでしょう。
          - 7 × 7 を計算しましょう。
        paths:
          - [(−7) × (−7), 符号は正, 49]
      - part: 思い出す
        text: 180 を素因数分解すると、どれになりますか。
        choices: [2² × 3² × 5, 2 × 3 × 30, 2² × 45]
        answer: 2² × 3² × 5
        check: "[c for c, fs in {'2² × 3² × 5': ((2, 2), (3, 2), (5, 1)), '2 × 3 × 30': ((2, 1), (3, 1), (30, 1)), '2² × 45': ((2, 2), (45, 1))}.items() if all(all(p % d for d in range(2, p)) for p, e in fs) and math.prod(p ** e for p, e in fs) == 180][0]"
        hints:
          - 素因数分解は、素数だけの積に表すことです。
          - 180 を、小さい素数から順にわっていきましょう。
          - 30 や 45 は素数でしょうか。
        paths:
          - [180 = 2 × 90 = 2 × 2 × 45, 45 = 3 × 3 × 5, 2² × 3² × 5]
      - part: 今日
        text: 49 の平方根はどれですか。
        choices: [7 と −7, 7, −7]
        answer: 7 と −7
        check: "[c for c, vs in {'7 と −7': (7, -7), '7': (7,), '−7': (-7,)}.items() if set(vs) == set(x for x in range(-60, 61) if x * x == 49)][0]"
        hints:
          - 平方根は、2 乗すると 49 になる数です。
          - 7² はいくつでしょう。
          - (−7)² はいくつでしょう。
        paths:
          - [7² = 49, (−7)² = 49, 49 の平方根は 7 と −7]
        note: 7 だけを答えやすい。平方根は正と負の 2 つあり、√49 = 7 は正のほうだけを表す。
      - part: 今日
        text: √64 の値はいくつですか。
        answer: 8
        check: "[k for k in range(0, 100) if k * k == 64][0]"
        hints:
          - √64 は、2 乗すると 64 になる正の数です。
          - 九九で、同じ数をかけて 64 になるものをさがしましょう。
          - 答えは正の数です。
        paths:
          - [2 乗して 64 になる正の数, 8 × 8 = 64, 8]
        note: 64 ÷ 2 = 32 としやすい。√ は 2 でわることではない。
      - part: 今日
        text: 次の 3 つの数のうち、いちばん大きいものはどれですか。
        choices: [3, √10, √8]
        answer: √10
        check: "[c for c, v in {'3': 3, '√10': math.sqrt(10), '√8': math.sqrt(8)}.items() if v == max(3, math.sqrt(10), math.sqrt(8))][0]"
        hints:
          - 3 を、√ を使って表しましょう。
          - 3 は、2 乗すると 9 になる正の数です。
          - 根号の中の数をくらべましょう。
        paths:
          - [3 = √9, √8 < √9 < √10, √10]
      - part: 挑戦
        text: √n が 4 より大きく 5 より小さくなる整数 n は、何こありますか。
        answer: 8
        check: "sum(1 for n in range(1, 100) if 4 < math.sqrt(n) < 5)"
        hints:
          - 4 と 5 を、√ を使って表しましょう。
          - √16 < √n < √25 となる n を考えます。
          - 16 と 25 はふくまれるでしょうか。
        paths:
          - [4 = √16、5 = √25, 16 < n < 25, 17 から 24 までの 8 こ]
        note: 16 と 25 も数えて 10 こ、としやすい。
    extra:
      - part: 今日
        text: (√7)² の値はいくつですか。
        answer: 7
        check: "[k for k in range(0, 50) if math.isclose(math.sqrt(7) ** 2, k)][0]"
        hints:
          - √7 は、2 乗すると何になる数でしょう。
          - √7 の意味を、そのまま思い出しましょう。
          - (√7)² は √7 × √7 です。
        paths:
          - [√7 は 2 乗すると 7 になる数, (√7)² = 7]
      - part: 今日
        text: √((−5)²) の値はいくつですか。
        answer: 5
        check: "[k for k in range(0, 50) if k * k == (-5) ** 2][0]"
        hints:
          - まず、根号の中の (−5)² を計算しましょう。
          - √25 は、2 乗すると 25 になる正の数です。
          - √ のついた数は、0 か正の数です。
        paths:
          - [(−5)² = 25, √25, 5]
        note: −5 と答えやすい。√ は正のほうの平方根を表す。
      - part: 挑戦
        text: √n が整数になる、50 以下の自然数 n は何こありますか。
        answer: 7
        check: "sum(1 for n in range(1, 51) if math.isqrt(n) ** 2 == n)"
        hints:
          - √n が整数になるのは、n がどんな数のときでしょう。
          - n は、ある整数の 2 乗です。
          - 1²、2²、3²、… と、50 をこえるまで書き出しましょう。
        paths:
          - [n は整数の 2 乗, 1、4、9、16、25、36、49, 7 こ]

  - day: 2
    items:
      - part: 見本
        text: √2 × √3、√12、1/√2、√8 + √2 を、くふうして表してみましょう。
        explain: a、b が正の数のとき、√a × √b = √(ab)、√a ÷ √b = √(a/b) です。たとえば √2 × √3 = √6、√15 ÷ √3 = √5 です。根号の中に 2 乗の因数があるときは、素因数分解（N-021）して外に出します。12 = 2² × 3 なので、√12 = √(2²) × √3 = 2√3 です。a√b の形にするときは、根号の中の数をできるだけ小さい自然数にします。分母に根号がある数は、分母と分子に同じ数をかけて、分母に根号がない形にします。これを分母の有理化といいます。1/√2 = (1 × √2)/(√2 × √2) = √2/2 です。たし算とひき算は、同類項（A-010）と同じように、根号の中が同じものどうしをまとめます。2√3 + 5√3 = 7√3、√8 + √2 = 2√2 + √2 = 3√2 です。√2 + √3 は √5 にはなりません。
      - part: 思い出す
        text: √81 の値はいくつですか。
        answer: 9
        check: "[k for k in range(0, 100) if k * k == 81][0]"
        hints:
          - √81 は、2 乗すると 81 になる正の数です。
          - 九九で、同じ数をかけて 81 になるものをさがしましょう。
          - 答えは正の数です。
        paths:
          - [9 × 9 = 81, 9]
      - part: 思い出す
        text: 次の 3 つの数のうち、いちばん小さいものはどれですか。
        choices: [√5, 2, √3]
        answer: √3
        check: "[c for c, v in {'√5': math.sqrt(5), '2': 2, '√3': math.sqrt(3)}.items() if v == min(math.sqrt(5), 2, math.sqrt(3))][0]"
        hints:
          - 2 を、√ を使って表しましょう。
          - 2 は、2 乗すると 4 になる正の数です。
          - 根号の中の数をくらべましょう。
        paths:
          - [2 = √4, √3 < √4 < √5, √3]
      - part: 今日
        text: √3 × √12 の値はいくつですか。
        answer: 6
        check: "[k for k in range(0, 100) if k * k == 3 * 12][0]"
        hints:
          - √a × √b = √(ab) を使いましょう。
          - 根号の中は 3 × 12 です。
          - 根号の中の数が、ある整数の 2 乗になっていないか見ましょう。
        paths:
          - [√(3 × 12) = √36, 6]
          - [√12 = 2√3, √3 × 2√3 = 2 × 3, 6]
      - part: 今日
        text: √50 を a√b の形（b はできるだけ小さい自然数）に表すと、どれになりますか。
        choices: [5√2, 2√5, 25√2]
        answer: 5√2
        check: "[c for c, v in {'5√2': 5 * math.sqrt(2), '2√5': 2 * math.sqrt(5), '25√2': 25 * math.sqrt(2)}.items() if math.isclose(v, math.sqrt(50))][0]"
        hints:
          - 50 を素因数分解しましょう。
          - 50 の中に、2 乗の因数はあるでしょうか。
          - √(5²) は根号の外に出せます。
        paths:
          - [50 = 5² × 2, √(5²) × √2, 5√2]
        note: 25√2 としやすい。外に出すのは 5² の 5 で、25 ではない。
      - part: 今日
        text: 6/√3 の分母を有理化すると、どれになりますか。
        choices: [2√3, 6√3, √2]
        answer: 2√3
        check: "[c for c, v in {'2√3': 2 * math.sqrt(3), '6√3': 6 * math.sqrt(3), '√2': math.sqrt(2)}.items() if math.isclose(v, 6 / math.sqrt(3))][0]"
        hints:
          - 分母と分子に、同じ数をかけましょう。
          - √3 × √3 はいくつでしょう。
          - 分母が整数になったら、約分しましょう。
        paths:
          - [(6 × √3)/(√3 × √3), 6√3/3, 2√3]
        note: 分子に √3 をかけ忘れて 6/3 = 2 としやすい。分母と分子の両方にかける。
      - part: 挑戦
        text: √8 + √18 を計算すると、どれになりますか。
        choices: [5√2, √26, 6√2]
        answer: 5√2
        check: "[c for c, v in {'5√2': 5 * math.sqrt(2), '√26': math.sqrt(26), '6√2': 6 * math.sqrt(2)}.items() if math.isclose(v, math.sqrt(8) + math.sqrt(18))][0]"
        hints:
          - √8 と √18 を、それぞれ a√b の形にしましょう。
          - 根号の中が同じになったら、同類項のようにまとめます。
          - √8 + √18 は √26 になるでしょうか。
        paths:
          - [√8 = 2√2、√18 = 3√2, 2√2 + 3√2, 5√2]
        note: 根号の中どうしを足して √26 としやすい。√4 + √9 = 2 + 3 = 5 で、√13 ではないことと見くらべさせる。
    extra:
      - part: 今日
        text: √45 = a√5 のとき、a はいくつですか。
        answer: 3
        check: "[a for a in range(1, 20) if a * a * 5 == 45][0]"
        hints:
