      - part: 挑戦
        text: 5√3 − √27 + √12 を計算すると、どれになりますか。
        choices: [4√3, 2√3, 6√3]
        answer: 4√3
        check: "[c for c, v in {'4√3': 4 * math.sqrt(3), '2√3': 2 * math.sqrt(3), '6√3': 6 * math.sqrt(3)}.items() if math.isclose(v, 5 * math.sqrt(3) - math.sqrt(27) + math.sqrt(12))][0]"
        hints:
          - √27 と √12 を、それぞれ a√3 の形にしましょう。
          - 根号の中がそろったら、係数を計算しましょう。
          - ひく項の符号に気をつけましょう。
        paths:
          - [√27 = 3√3、√12 = 2√3, 5√3 − 3√3 + 2√3, 4√3]

  - day: 3
    items:
      - part: 思い出す
        text: √72 を a√b の形（b はできるだけ小さい自然数）に表すと、どれになりますか。
        choices: [6√2, 2√6, 36√2]
        answer: 6√2
        check: "[c for c, v in {'6√2': 6 * math.sqrt(2), '2√6': 2 * math.sqrt(6), '36√2': 36 * math.sqrt(2)}.items() if math.isclose(v, math.sqrt(72))][0]"
        hints:
