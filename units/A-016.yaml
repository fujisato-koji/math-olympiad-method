    choices: ["6√2 cm", "6 cm", "8√2 cm", "12√2 cm"]
    answer: "6√2 cm"
    check: "[ch for ch, f in {'6√2 cm': lambda: 6 * math.sqrt(2), '6 cm': lambda: 6, '8√2 cm': lambda: 8 * math.sqrt(2), '12√2 cm': lambda: 12 * math.sqrt(2)}.items() if math.isclose(f() ** 2, 72, abs_tol=1e-9)][0]"
    hints:
      - 正方形の面積は、1 辺 × 1 辺。
      - 1 辺を x cm とすると、x² = 72。
      - text: √72 を a√b の形に直そう。72 = 2 × 2 × 2 × 3 × 3 だよ。
        svg: '<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg"><polyline points="15,86 22,82 31,112 43,46 309,46" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="51" y="61" width="92" height="42" rx="14" fill="#7bc96f" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><rect x="207" y="61" width="92" height="42" rx="14" fill="#7fc8f8" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="71" cy="82" r="16" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="71" y="88" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="97" y="87" font-size="14" text-anchor="middle" fill="currentColor">×</text><circle cx="123" cy="82" r="16" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="123" y="88" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="149" y="87" font-size="14" text-anchor="middle" fill="currentColor">×</text><circle cx="175" cy="82" r="16" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="175" y="88" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="201" y="87" font-size="14" text-anchor="middle" fill="currentColor">×</text><circle cx="227" cy="82" r="16" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="227" y="88" font-size="16" text-anchor="middle" fill="currentColor">3</text><text x="253" y="87" font-size="14" text-anchor="middle" fill="currentColor">×</text><circle cx="279" cy="82" r="16" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="279" y="88" font-size="16" text-anchor="middle" fill="currentColor">3</text><line x1="97" y1="106" x2="97" y2="129" stroke="currentColor" stroke-width="2"/><polygon points="97,136 92.6,128 101.4,128" fill="currentColor"/><rect x="80" y="138" width="34" height="34" rx="6" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="97" y="161" font-size="18" text-anchor="middle" fill="currentColor">?</text><line x1="253" y1="106" x2="253" y2="129" stroke="currentColor" stroke-width="2"/><polygon points="253,136 248.6,128 257.4,128" fill="currentColor"/><rect x="236" y="138" width="34" height="34" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="253" y="161" font-size="18" text-anchor="middle" fill="currentColor">?</text><text x="175" y="160" font-size="15" text-anchor="middle" fill="currentColor">×</text><text x="160" y="24" font-size="14" text-anchor="middle" fill="currentColor">同じ数の 2 つ組は、√ の外へ 1 つ出る</text></svg>'
    paths:
      - [1 辺を x とする, x² = 72, x = √72, √72 = 6√2]
