      - part: わけ
        text: √2 × √3 = √6 となるわけを、平方根の意味（√a は、2 乗すると a になる正の数）を使って、筋道を立てて書きましょう。
        explain: 例：「P = √2 × √3 とする。P を 2 乗すると、P² = (√2 × √3)² = (√2)² × (√3)²（積の 2 乗は 2 乗の積、A-009）= 2 × 3 = 6（平方根の意味）。また、√2 も √3 も正の数なので、その積 P も正の数である。2 乗すると 6 になる正の数は √6 なので、P = √6、つまり √2 × √3 = √6 である。」と書ければよい。①「〜とする」で P を決める、② 2 乗して式を変形する、③ 約束した事実（平方根の意味、積の累乗、正の数どうしの積は正）で結ぶ、の 3 つがそろっているかを見る。「P は正の数」を書き落としていたら、2 乗して 6 になる数には −√6 もあるので、正であることが要ると話す。同じ筋道で、正の数 a、b について √a × √b = √(ab) が言えることにも触れる。
        hints:
          - 「P = √2 × √3 とする」から書き始め、P を 2 乗しましょう。
          - (√2)² と (√3)² は、平方根の意味から、それぞれいくつでしょう。
          - P が正の数であることも書いて、√6 と結びましょう。
        paths:
          - [P = √2 × √3 とする, P² = (√2)² × (√3)² = 6, P は正の数, 2 乗して 6 になる正の数は √6]
      - part: わけ
        text: √12 = 2√3 となるわけを、平方根の意味を使って、筋道を立てて書きましょう。
        explain: 例：「Q = 2√3 とする。Q を 2 乗すると、Q² = 2² × (√3)² = 4 × 3 = 12。また、2 も √3 も正の数なので、Q は正の数である。2 乗すると 12 になる正の数は √12 なので、Q = √12、つまり √12 = 2√3 である。」と書ければよい。①「〜とする」、② 2 乗する変形、③ 平方根の意味と、正の数どうしの積は正、で結ぶ、がそろっているかを見る。前の問題の √a × √b = √(ab) を使って、√12 = √(4 × 3) = √4 × √3 = 2√3 と書いてもよい（約束した事実として使ってよいことを確かめる）。12 = 2² × 3 と素因数分解して、2² の 2 が外に出ることを言えていれば、なおよい。
        hints:
          - 「Q = 2√3 とする」から書き始め、Q を 2 乗しましょう。
          - 2² と (√3)² を、それぞれ計算しましょう。
          - Q が正の数であることも書いて、√12 と結びましょう。
        paths:
          - [Q = 2√3 とする, Q² = 4 × 3 = 12, Q は正の数, 2 乗して 12 になる正の数は √12]
          - [√12 = √(4 × 3), √4 × √3（前の問題）, 2√3]
      - part: わけ
        text: √10 が 3 と 4 の間にあるわけを、3² と 4² を使って、文で書きましょう。
        explain: 例：「3² = 9、4² = 16 で、9 < 10 < 16。正の数では、2 乗が大きいほうが、もとの数も大きい。√10 は 2 乗すると 10 になる正の数なので、2 乗した 9、10、16 の順と同じに、3 < √10 < 4 となる。」と書ければよい。「正の数では、2 乗の大小と、もとの数の大小が同じ」が書けているかを見る（代表の例で書くわけ ②）。面積 9、10、16 の正方形をならべると、一辺も 3、√10、4 の順にならぶ、と説明してもよい。
        hints:
          - 3² と 4² を計算しましょう。
          - 10 は、9 と 16 の間にあるでしょうか。
          - 正の数では、2 乗の大小と、もとの数の大小はどんな関係でしょう。
        paths:
          - [3² = 9、4² = 16, 9 < 10 < 16, 正の数は 2 乗の順と同じ, 3 < √10 < 4]
    extra:
