        id: "17df529fa9"
        text: √2 × √3、√12、1/√2、√8 + √2 を、くふうして表してみましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="60" y="34" font-size="15" text-anchor="middle" fill="currentColor">面積 12</text><rect x="18" y="50" width="84" height="84" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><line x1="60" y1="50" x2="60" y2="134" stroke="currentColor" stroke-width="1.5"/><line x1="18" y1="92" x2="102" y2="92" stroke="currentColor" stroke-width="1.5"/><text x="39" y="76" font-size="15" text-anchor="middle" fill="currentColor">3</text><text x="39" y="118" font-size="15" text-anchor="middle" fill="currentColor">3</text><text x="81" y="76" font-size="15" text-anchor="middle" fill="currentColor">3</text><text x="81" y="118" font-size="15" text-anchor="middle" fill="currentColor">3</text><text x="39" y="154" font-size="15" text-anchor="middle" fill="currentColor">√3</text><text x="81" y="154" font-size="15" text-anchor="middle" fill="currentColor">√3</text><text x="60" y="182" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">√12 = 2√3</text><line x1="124" y1="20" x2="124" y2="196" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.4"/><text x="180" y="46" font-size="14" text-anchor="middle" fill="currentColor">面積 8</text><rect x="140" y="54" width="80" height="80" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><line x1="180" y1="54" x2="180" y2="134" stroke="currentColor" stroke-width="1.5"/><line x1="140" y1="94" x2="220" y2="94" stroke="currentColor" stroke-width="1.5"/><text x="160" y="79" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="160" y="119" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="200" y="79" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="200" y="119" font-size="14" text-anchor="middle" fill="currentColor">2</text><rect x="220" y="94" width="40" height="40" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="240" y="119" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="266" y="119" font-size="14" text-anchor="start" fill="currentColor">面積 2</text><text x="160" y="154" font-size="15" text-anchor="middle" fill="currentColor">√2</text><text x="200" y="154" font-size="15" text-anchor="middle" fill="currentColor">√2</text><text x="240" y="154" font-size="15" text-anchor="middle" fill="currentColor">√2</text><text x="200" y="182" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">√8 + √2 = 3√2</text></svg>'
        explain: a、b が正の数のとき、√a × √b = √(ab)、√a ÷ √b = √(a/b) です。たとえば √2 × √3 = √6、√15 ÷ √3 = √5 です。図の左のように、面積 12 の正方形は、面積 3 の正方形 4 こに分けられるので、1 辺は √3 の 2 つ分で、√12 = 2√3 です。12 = 2² × 3 と素因数分解（N-021）して、2² の 2 を根号の外に出すと考えても同じです。a√b の形では、根号の中の数をできるだけ小さい自然数にします。分母に根号があるときは、分母と分子に同じ数をかけて、分母に根号がない形にします。これを分母の有理化といいます。1/√2 = (1 × √2)/(√2 × √2) = √2/2 です。たし算とひき算は、根号の中が同じものどうしをまとめます。図の右のように、√8 + √2 = 2√2 + √2 = 3√2 です。√2 + √3 は √5 にはなりません。
