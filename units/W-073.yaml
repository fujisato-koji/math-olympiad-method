          - "矢印が回る中心が、地球か太陽かを見分けて、「1 年で 1 周」に合うほうを選ぼう。"
      - part: "今日"
        text: "北の空を 3 時間、カメラでとり続けた。北極星のまわりを回る星 ● は、3 時間で何度動くか。"
