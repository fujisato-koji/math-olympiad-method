    items:
      - part: "わけ"
        text: "新月も満月も、1 か月（約 29.5 日）に 1 回ずつ来る。日食は新月のとき、月食は満月のときに、太陽・月・地球が一直線にならんで起こる。それなのに、日食や月食は毎月は起こらない。どうしてだろう。"
