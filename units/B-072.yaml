        explain: "「白い けは ゆきと おなじ いろなので、ゆきの 上に いても 目立たない。だから たかや きつねに 見つかりにくく、たべられにくい」と いえれば よい。① まわりの ゆきと おなじ いろ、② 見つかりにくい、③ たべられにくいので 生きのこりやすい、の 3 つが 入れば よい。\nちゃいろの うさぎと くらべて、どちらが 先に 見つかるかを はなしあうと よい。この うさぎは、なつには けが ちゃいろに なり、土や かれた 草の いろに まぎれます。"
        hints:
