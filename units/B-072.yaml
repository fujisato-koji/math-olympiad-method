        text: "とりの くちばしの かたちは、たべる ものに あって います。\nわしや たかの ように、先が まがった くちばしは、にくを ひきさきます。\nふとくて みじかい くちばしは、かたい たねを わります。\nほそながい くちばしは、花の おくの みつを すいます。\nどうぶつの 口の 中の「は」も おなじです。とがった はで にくを かみきり、ひらたい はで 草を すりつぶします。"
