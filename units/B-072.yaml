        explain: "からだの いろや もようが まわりと にて いると、ほかの 生きものの 目に つきにくく なります。たべられる がわは てきに 見つかりにくく、たべる がわは えものに 気づかれずに ちかづけます。ばったには、みどりの ものも ちゃいろの ものも います。\nきょうは「まわりと おなじ いろ → 見つかりにくい」が つかめれば よい。みどりの かみと 白い かみの 上に みどりの まめを おいて、どちらが さがしにくいか ためして みると よい。"
