      - part: 見本
        id: "ff7c49c7b2"
        text: "水の 中で くらす 生きものの からだは、水の 中を すすむのに あって います。\nあひるの 足には、ゆびと ゆびの あいだに うすい まくが あります。これを 水かきと いいます。\nさかなには ひれが あります。さかなは ひれを うごかして、水を おして すすみます。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(88 100) scale(1.45)" stroke-width="1.4"><path d="M-3 -46L-3 -8M3 -46L3 -8" stroke-width="2"/><path d="M0 -6L-26 22Q-13 15 0 28Q13 15 26 22Z" fill="#f3c969" fill-opacity=".6" stroke-width="1.5"/><path d="M0 -6L-26 22M0 -6L0 28M0 -6L26 22" stroke-width="3"/><path d="M-26 22l-3 4M0 28l0 5M26 22l3 4" stroke-width="2"/></g><line x1="30" y1="166" x2="53.8" y2="135.8" stroke="#f08080" stroke-width="2.5"/><polygon points="60,128 58.5,139.6 49.1,132.1" fill="#f08080" stroke="none"/><text x="32" y="186" font-size="15" text-anchor="middle" fill="currentColor" stroke="none">水かき</text><text x="88" y="20" font-size="14" text-anchor="middle" fill="currentColor" stroke="none">あひるの 足</text><g transform="translate(222 92) scale(0.95)" stroke-width="2.1"><path d="M58 0L84 -24Q78 0 84 24Z" fill="#7fc8f8" fill-opacity=".55"/><path d="M-4 -24Q10 -46 32 -20Z" fill="#7fc8f8" fill-opacity=".55"/><path d="M-62 0Q-38 -30 10 -26Q44 -22 60 0Q44 22 10 26Q-38 30 -62 0Z" fill="#7fc8f8" fill-opacity=".5"/><path d="M-26 6Q-10 2 -4 18Q-18 20 -26 6Z" fill="#7fc8f8" fill-opacity=".7"/><path d="M-36 -14Q-30 0 -36 14" stroke-width="1.5" stroke-opacity=".6"/><circle cx="-46" cy="-5" r="3.5" fill="currentColor" stroke="none"/><path d="M-62 0L-55 3" stroke-width="1.5"/></g><line x1="262" y1="160" x2="285" y2="120.6" stroke="#f08080" stroke-width="2.5"/><polygon points="290,112 290.1,123.7 279.8,117.6" fill="#f08080" stroke="none"/><line x1="232" y1="160" x2="222.6" y2="125.6" stroke="#f08080" stroke-width="2.5"/><polygon points="220,116 228.4,124.1 216.8,127.2" fill="#f08080" stroke="none"/><text x="248" y="182" font-size="15" text-anchor="middle" fill="currentColor" stroke="none">ひれ</text><text x="222" y="22" font-size="14" text-anchor="middle" fill="currentColor" stroke="none">さかな</text></g></svg>'
        explain: "あひるや かもは、水かきを ひろげた 足で 水を うしろへ おし、その いきおいで まえへ すすみます。足を まえへ もどす ときは、水かきを たたんで、水に おしもどされないように します。かえるの うしろ足にも 水かきが あります。\nさかなは おびれを 左右に ふって 水を うしろへ おし、まえへ すすみます。せびれや むなびれは、むきを かえたり、からだを まっすぐに たもったり する はたらきが あります。\nおふろで、ゆびを とじた 手と ゆびを ひらいた 手で 水を かいて くらべると、水かきの はたらきが わかります。"
