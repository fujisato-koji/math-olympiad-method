        explain: "とりには 手が ないので、くちばしで たべものを とります。わしや たかの 先が まがった くちばしは、つかまえた どうぶつの にくを ひっかけて ひきさくのに、しめや いかるの ふとくて みじかい くちばしは かたい たねを はさんで わるのに、はちどりの ほそながい くちばしは 花の おくの みつに とどくのに あって います。\nどうぶつの はも おなじで、ライオンや おおかみは とがった はで にくに ささって かみきり、うしや うまは ひらたい おくばで 草を すりつぶします。\nきょうは「かたちを 見て、なにを たべるかを かんがえる」ことが できれば よい。ずかんで とりの くちばしを 見くらべたり、かがみで じぶんの はを 見たり すると よい。子の 文では、口の 中の「は」と はっぱを かきわけるため、はっぱは「はっぱ」と かきます。"
