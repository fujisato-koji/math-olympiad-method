# B-072 すみかに合ったからだ
#
# 水準 1・4 日。くちばしと口の中の「は」の形が食べるものに合っていること（先がまがったくちばしは肉、太くみじかいくちばしはかたいたね、細長いくちばしは花のおくのみつ。とがったはで肉、ひらたいはで草）、水かきとひれ（水を後ろへおして前へすすむ）、まわりの色にかくれる（見つかりにくい。食べられにくく、えものに近づきやすい）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 くちばしと口の中のは、2 日目 水かきとひれ、3 日目 わけ（まわりの色にかくれる。雪の山の白いうさぎが見つかりにくいわけ）、4 日目 確認。
# 子の文では、口の中の「は」と見分けるため、草木のはを「はっぱ」と書く。「はは」と続く言い方はさける。
# 図の約束：鳥の頭は右向きで、くちばしを黄でぬる。口の中のはを白、はぐきをうすい赤でぬる。水かきは黄（鳥）、みどり（かえる）、ちゃいろ（けもの）でぬり、水かきのない足は線だけ。赤いてんせんの丸は「見るところ」。ばったは B-017 と同じ上から見た形。
# くちばしの形は 3 つ（先がまがった・太くみじかい・細長い）、口の中のはの形は 2 つ（とがった・ひらたい）だけをつかう。人のはを出すのは 1 日目の挑戦だけで、とがったはとひらたいはの両方がある、とだけ扱う。
# こん虫の足が 6 本（3 日目のななふし）と、食べものがあるところにすむこと（4 日目のはちどり）は B-017 で学んだことをつかう。なかま分けは B-018、相同と相似・自然選択は B-027 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも読み取り（くちばしと食べものをむすんだ線と、ばしょと生きものの色をくらべる図を読む）。

