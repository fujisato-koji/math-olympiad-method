# M-012 直交座標のテンソル
#
# 段 6・水準 3・8 日。前提は M-007（固有値と対角化）。
# テンソル、添字と変換、直交変換、対称・反対称テンソル（符号）、主軸、応用を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: M-012
days:
  - day: 1
    items:
      - part: 見本
        id: "c2d9875c4b"
        text: |-
          テンソルは、方向をもつ量を数で表すしくみです。成分につく添字の数を「階」といいます。
          0 階はスカラーで、温度のように向きのない量です。成分は 1 つです。
          1 階はベクトルで、速度のように 1 つの向きをもつ量です。成分は 3 つです。
          2 階は応力のように 2 つの向きの関係を表す量で、3 次元なら 3 × 3 = 9 個の成分を T_(ij) のように 2 つの添字で書きます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="55" y="20" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">0 階</text><text x="152" y="20" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">1 階</text><text x="259" y="20" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">2 階</text><text x="55" y="40" font-size="14" text-anchor="middle" fill="currentColor">温度</text><text x="152" y="40" font-size="14" text-anchor="middle" fill="currentColor">速度</text><text x="259" y="40" font-size="14" text-anchor="middle" fill="currentColor">応力</text><rect x="24" y="68" width="62" height="40" rx="8" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="55" y="94" font-size="16" text-anchor="middle" fill="currentColor">20 度</text><line x1="122" y1="112" x2="171.2" y2="66.2" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="180,58 175.3,70.6 167.1,61.8" fill="#f08080"/><rect x="104" y="121" width="32" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="120" y="138.9" font-size="14" text-anchor="middle" fill="currentColor">v₁</text><rect x="136" y="121" width="32" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="152" y="138.9" font-size="14" text-anchor="middle" fill="currentColor">v₂</text><rect x="168" y="121" width="32" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="184" y="138.9" font-size="14" text-anchor="middle" fill="currentColor">v₃</text><rect x="208" y="52" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="225" y="71.9" font-size="14" text-anchor="middle" fill="currentColor">T₁₁</text><rect x="242" y="52" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="259" y="71.9" font-size="14" text-anchor="middle" fill="currentColor">T₁₂</text><rect x="276" y="52" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="293" y="71.9" font-size="14" text-anchor="middle" fill="currentColor">T₁₃</text><rect x="208" y="82" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="225" y="101.9" font-size="14" text-anchor="middle" fill="currentColor">T₂₁</text><rect x="242" y="82" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="259" y="101.9" font-size="14" text-anchor="middle" fill="currentColor">T₂₂</text><rect x="276" y="82" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="293" y="101.9" font-size="14" text-anchor="middle" fill="currentColor">T₂₃</text><rect x="208" y="112" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="225" y="131.9" font-size="14" text-anchor="middle" fill="currentColor">T₃₁</text><rect x="242" y="112" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="259" y="131.9" font-size="14" text-anchor="middle" fill="currentColor">T₃₂</text><rect x="276" y="112" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="293" y="131.9" font-size="14" text-anchor="middle" fill="currentColor">T₃₃</text><text x="55" y="170" font-size="14" text-anchor="middle" fill="currentColor">成分 1 つ</text><text x="152" y="170" font-size="14" text-anchor="middle" fill="currentColor">成分 3 つ</text><text x="259" y="170" font-size="14" text-anchor="middle" fill="currentColor">成分 9 つ</text><text x="55" y="190" font-size="14" text-anchor="middle" fill="currentColor">添字 0 つ</text><text x="152" y="190" font-size="14" text-anchor="middle" fill="currentColor">添字 1 つ</text><text x="259" y="190" font-size="14" text-anchor="middle" fill="currentColor">添字 2 つ</text></svg>'
        explain: |-
          【定義】テンソルとは、座標を回しても物理的な意味が変わらないように、方向をもつ量を表す数の組です。
          スカラーは温度のように向きをもたない量、ベクトルは速度のように 1 つの向きをもつ量です。
          2 階テンソルは、面の向き（1 つ目の添字）と力の向き（2 つ目の添字）のように、2 つの向きの関係を表します。
          3 次元では、2 階テンソルは 3 × 3 = 9 個の成分をもちます。成分は T_(ij) と書きます。
          座標を回すと成分の値は変わりますが、テンソルが表す物理的な関係は変わりません。
        note: 0 階スカラー、1 階ベクトル、2 階行列。3 次元の 2 階テンソルは 9 成分。成分は T_(ij)。
      - part: 今日
        id: "20a4e2980b"
        text: 図は温度 T です。数 1 つで表すスカラーは、何階のテンソルですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="70" y="24" width="26" height="104" rx="13" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="83" cy="146" r="22" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><rect x="77" y="64" width="12" height="82" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="205" y="80" font-size="15" text-anchor="middle" fill="currentColor">温度</text><text x="205" y="108" font-size="16" text-anchor="middle" fill="currentColor">T = 20 度</text></svg>'
        choices: [0 階, 1 階, 2 階, 3 階]
        answer: "0 階"
        check: "'0 階'"
        hints:
          - 階は、成分につく添字の数でした。
          - text: 温度 T には、添字がいくつついているでしょう。図の 3 つの書き方とくらべます。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="22" y="66" width="76" height="44" rx="8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="55" y="94" font-size="16" text-anchor="start" fill="currentColor">T</text><rect x="122" y="66" width="76" height="44" rx="8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="151" y="94" font-size="16" text-anchor="start" fill="currentColor">T</text><text x="161.9" y="99" font-size="13" text-anchor="start" fill="currentColor">i</text><rect x="222" y="66" width="76" height="44" rx="8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="247" y="94" font-size="16" text-anchor="start" fill="currentColor">T</text><text x="257.9" y="99" font-size="13" text-anchor="start" fill="currentColor">ij</text><circle cx="60" cy="88" r="34" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="160" y="156" font-size="15" text-anchor="middle" fill="currentColor">階 ＝ 添字の数</text></svg>'
          - 添字が 1 つなら 1 階、2 つなら 2 階でした。温度 T にはいくつついているかを数えます。
        paths:
          - [向きなし, 添字 0, 0 階]
      - part: 今日
        id: "f30b3e8ebd"
        text: 図は速度 v です。向きをもつベクトルは、何階のテンソルですか。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="40" y1="135" x2="140.1" y2="66.8" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="150,60 143.5,71.7 136.7,61.8" fill="#f08080"/><text x="95" y="170" font-size="15" text-anchor="middle" fill="currentColor">速度 v</text><rect x="215" y="44" width="60" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245" y="65.9" font-size="14" text-anchor="middle" fill="currentColor">v₁</text><rect x="215" y="78" width="60" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245" y="99.9" font-size="14" text-anchor="middle" fill="currentColor">v₂</text><rect x="215" y="112" width="60" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="245" y="133.9" font-size="14" text-anchor="middle" fill="currentColor">v₃</text><text x="245" y="172" font-size="14" text-anchor="middle" fill="currentColor">v の成分</text></svg>'
        choices: [0 階, 1 階, 2 階, 3 階]
        answer: "1 階"
        check: "'1 階'"
        hints:
          - 成分につく添字がいくつかを数えます。
          - text: v の成分は v₁、v₂、v₃ です。図の 3 つの書き方のうち、どれに近いでしょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="22" y="66" width="76" height="44" rx="8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="55" y="94" font-size="16" text-anchor="start" fill="currentColor">T</text><rect x="122" y="66" width="76" height="44" rx="8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="151" y="94" font-size="16" text-anchor="start" fill="currentColor">T</text><text x="161.9" y="99" font-size="13" text-anchor="start" fill="currentColor">i</text><rect x="222" y="66" width="76" height="44" rx="8" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><text x="247" y="94" font-size="16" text-anchor="start" fill="currentColor">T</text><text x="257.9" y="99" font-size="13" text-anchor="start" fill="currentColor">ij</text><circle cx="160" cy="88" r="34" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/><text x="160" y="156" font-size="15" text-anchor="middle" fill="currentColor">階 ＝ 添字の数</text></svg>'
          - T_(ij) のように添字が 2 つなら 2 階でした。v の成分の添字はいくつでしょう。
        paths:
          - [1 つの向き, 添字 1, 1 階]
      - part: 挑戦
        id: "936da336a3"
        text: 図は 2 階テンソルの 3 × 3 の表です。色のついた 1 つのますを指すには、番号をいくつ使いますか。
