# M-012 直交座標のテンソル
#
# 段 6・水準 3・8 日。前提は M-007（固有値と対角化）。
# テンソル、添字と変換、直交変換、対称・反対称テンソル、応用を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: M-012
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          テンソルは、方向をもつ量の間の関係を表す数の組です。
          スカラーは 0 階（向きなし）、ベクトルは 1 階（1 つの向き）、2 階テンソルは 2 つの向きの関係を表します。
          2 階テンソルは、3 次元なら 3 × 3 = 9 個の成分を、T_(ij) のように 2 つの添字で書きます。
          例えば応力テンソルは、面の向きと、その面にはたらく力の向きの関係を表します。
        explain: |-
          【定義】テンソルとは、座標を回しても物理的な意味が変わらないように、方向をもつ量を表す数の組です。
          スカラーは温度のように向きをもたない量、ベクトルは速度のように 1 つの向きをもつ量です。
          2 階テンソルは、面の向き（1 つ目の添字）と力の向き（2 つ目の添字）のように、2 つの向きの関係を表します。
          3 次元では、2 階テンソルは 3 × 3 = 9 個の成分をもちます。成分は T_(ij) と書きます。
          座標を回すと成分の値は変わりますが、テンソルが表す物理的な関係は変わりません。
        note: 0 階スカラー、1 階ベクトル、2 階行列。3 次元の 2 階テンソルは 9 成分。成分は T_(ij)。
      - part: 今日
        text: スカラーは何階のテンソルですか。
        choices: [0 階, 1 階, 2 階, 3 階]
        answer: "0 階"
        check: "'0 階'"
        hints:
          - 向きをもたない量です。
          - 添字がいくつあるか を 考えます。
          - 添字が いくつあるか を 考えよう。
        paths:
          - [向きなし, 添字 0, 0 階]
      - part: 今日
        text: ベクトルは何階のテンソルですか。
        choices: [0 階, 1 階, 2 階, 3 階]
        answer: "1 階"
        check: "'1 階'"
        hints:
          - 1 つの向きをもつ量です。
          - 添字が 1 つです。
          - 添字が いくつあるか を 考えよう。
        paths:
          - [1 つの向き, 添字 1, 1 階]
      - part: 挑戦
        text: 2 階のテンソルの成分は、添字がいくつですか。
        choices: [1 つ, 2 つ, 3 つ, 4 つ]
        answer: "2 つ"
        check: "'2 つ'"
        hints:
          - 2 階は行列に対応します。
          - 行と列の 2 つの添字が要ります。
          - 行列の 行と列の 添字を 数えよう。
        paths:
          - [行列, 行と列, 2 つ]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          2 階テンソル T の成分は、T_(ij) のように 2 つの添字で書きます。
          i は「どの行か」、j は「どの列か」を表し、3 次元なら i、j は 1、2、3 のどれかです。
          同じ添字が 2 回出たら、その添字について 1 から 3 まで足し合わせます（アインシュタインの縮約）。
          例えば T_(ii) は T_(11) + T_(22) + T_(33) で、対角成分の和（トレース）です。
          δ_(ij) は、i = j のとき 1、i ≠ j のとき 0 になる単位テンソルです。
        explain: |-
          【定義】添字とは、テンソルの成分が「どの方向・どの行・どの列」のものかを示す番号です。
          3 次元の 2 階テンソルは、i と j がそれぞれ 1、2、3 の 3 通りなので、3 × 3 = 9 個の成分をもちます。
          T_(ij) は i 行 j 列の成分です。T_(12) なら 1 行 2 列、T_(23) なら 2 行 3 列です。
          ｜T_(ij)｜j=1｜j=2｜j=3｜
          ｜i=1｜T_(11)｜T_(12)｜T_(13)｜
          ｜i=2｜T_(21)｜T_(22)｜T_(23)｜
          ｜i=3｜T_(31)｜T_(32)｜T_(33)｜
          【定義】アインシュタインの縮約とは、同じ添字が 2 回出たとき、その添字について 1、2、3 と足し合わせる約束です。
          例：T_(ii) = T_(11) + T_(22) + T_(33)。これは対角成分の和で、トレースといいます。
          例：A_(ij) δ_(jk) = A_(ik)。δ_(jk) は j = k のときだけ 1 なので、j について足すと k の項だけ残ります。
          【定義】δ_(ij) はクロネッカーのデルタです。i = j なら 1、i ≠ j なら 0。単位行列を添字で書いたものです。
        note: T_(ij) は i 行 j 列。同じ添字は 1〜3 で足す。δ_(ij) は i=j で 1。trace は T_(ii)。
        svg: |-
