# M-012 直交座標のテンソル
#
# 段 6・水準 3・8 日。前提は M-007（固有値と対角化）。
# テンソル、添字と変換、直交変換、対称・反対称テンソル、応用を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: M-012
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          テンソルは、いくつかのベクトルから数（またはベクトル）を決める多重線形な写像です。
          0 階のテンソルはスカラー、1 階はベクトル、2 階は行列に対応します。
          2 階のテンソルは T_ij のように 2 つの添字で成分を書きます。
          応力テンソル、慣性テンソル、電磁場テンソルなどが例です。
        explain: |-
          【定義】テンソルは「方向をもつ量を、座標の選び方によらずに表す」ための道具です。
          スカラーは向きなし、ベクトルは 1 つの向き、2 階テンソルは 2 つの向きの関係を表します。
          座標を回しても、テンソルの物理的な意味は変わりません。
        note: 0 階スカラー、1 階ベクトル、2 階行列。成分は T_ij。
      - part: 今日
        text: スカラーは何階のテンソルですか。
        choices: [0 階, 1 階, 2 階, 3 階]
        answer: "0 階"
        check: "'0 階'"
        hints:
          - 向きをもたない量です。
          - 添字がいくつあるか を 考えます。
          - 添字が いくつあるか を 考えよう。
        paths:
          - [向きなし, 添字 0, 0 階]
      - part: 今日
        text: ベクトルは何階のテンソルですか。
        choices: [0 階, 1 階, 2 階, 3 階]
        answer: "1 階"
        check: "'1 階'"
        hints:
          - 1 つの向きをもつ量です。
          - 添字が 1 つです。
          - 添字が いくつあるか を 考えよう。
        paths:
          - [1 つの向き, 添字 1, 1 階]
      - part: 挑戦
        text: 2 階のテンソルの成分は、添字がいくつですか。
        choices: [1 つ, 2 つ, 3 つ, 4 つ]
        answer: "2 つ"
        check: "'2 つ'"
        hints:
          - 2 階は行列に対応します。
          - 行と列の 2 つの添字が要ります。
          - 行列の 行と列の 添字を 数えよう。
        paths:
          - [行列, 行と列, 2 つ]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          添字の表し方：T_ij は 2 階テンソルの成分。同じ添字が 2 回出たら、その添字について足し合わせます（アインシュタインの縮約）。
          δ_ij はクロネッカーのデルタ。i=j のとき 1、i≠j のとき 0。
          trace は T_ii（対角成分の和）。
          例：3 次元では δ_ii = δ_11+δ_22+δ_33 = 3。
        explain: |-
          添字をそろえると、テンソルの式が簡潔に書けます。
          δ_ij は「i と j が同じなら 1」の単位テンソル。
          T_ii は対角成分の和で、トレースです。
        note: 同じ添字は足す。δ_ij は i=j で 1。trace は T_ii。
      - part: 今日
        text: 3 次元で δ_ii はいくつですか。
        choices: [0, 1, 3, 9]
        answer: 3
        check: "3"
        hints:
          - δ_ii は i について足します。
          - i=1、2、3 の場合を足します。
          - i=1、2、3 の 場合を 足そう。
        paths:
          - [δ_11+δ_22+δ_33, 1+1+1, 3]
      - part: 今日
        text: A_ij δ_jk はどれですか。
        choices: ["A_ik", "A_ij", "δ_ik", "0"]
        answer: "A_ik"
        check: "'A_ik'"
        hints:
          - δ_jk は j=k のとき 1 です。
          - j について足します。
          - k が残ります。
        paths:
          - [δ_jk, j=k だけ残る, A_ik]
      - part: 挑戦
        text: 2 階テンソル T_ij のトレースはどれですか。
        choices: ["T_ii", "T_ij", "T_11", "δ_ij"]
        answer: "T_ii"
        check: "'T_ii'"
        hints:
          - トレースは対角成分の和です。
          - 同じ添字を足します。
          - 対角成分を 同じ添字で 書こう。
        paths:
          - [対角の和, T_ii]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          直交変換：座標を回転しても、テンソルの成分は T'_ij = Q_ik Q_jl T_kl と変わります。
          Q は直交行列（QᵀQ=I）。
          トレース T_ii と行列式 det T は、直交変換で変わりません（不変量）。
          δ_ij も直交変換で変わりません。
        explain: |-
          座標を回すと、テンソルの成分は変わるが、物理的な意味は変わらない。
          トレースと行列式は、座標の選び方によらない量です。
          δ_ij はどの向きでも同じ形をしています。
        note: T'_ij=Q_ik Q_jl T_kl。trace と det は不変。δ も不変。
      - part: 今日
        text: 直交変換で変わらないものはどれですか。
        choices: ["トレース", "T_11", "T_12", "成分の並び"]
        answer: "トレース"
        check: "'トレース'"
        hints:
          - 座標を回すと成分は変わります。
          - 対角の和はどうか を 考えます。
          - トレースは不変です。
        paths:
          - [座標を回す, 成分は変わる, 対角の和は不変, トレース]
      - part: 今日
        text: 直交変換で δ_ij はどうなりますか。
        choices: ["変わらない", "2 倍になる", "0 になる", "行列式が変わる"]
        answer: "変わらない"
        check: "'変わらない'"
        hints:
          - δ は単位テンソルです。
          - どの向きでも同じ形です。
          - 変わりません。
        paths:
          - [単位テンソル, どの向きでも同じ, 不変]
      - part: 挑戦
        text: 2 階テンソルの成分の変換式はどれですか。
        choices: ["T'_ij = Q_ik Q_jl T_kl", "T'_ij = Q_ij T_ij", "T'_ij = T_ij", "T'_ij = Q_ik T_kj"]
        answer: "T'_ij = Q_ik Q_jl T_kl"
        check: "\"T'_ij = Q_ik Q_jl T_kl\""
        hints:
          - 2 つの添字をそれぞれ変換します。
          - 添字ごとに Q をかけます。
          - 2 つの Q が付きます。
        paths:
          - [添字ごとに Q, 2 つの Q, T'_ij=Q_ik Q_jl T_kl]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          対称テンソル：T_ij = T_ji。反対称テンソル：T_ij = −T_ji。
          任意の 2 階テンソルは、対称部分と反対称部分に分けられます。
          T_ij = (T_ij+T_ji)/2 + (T_ij−T_ji)/2。
          3 次元の反対称テンソルは、独立な成分が 3 つです。
        explain: |-
          対称部分は、2 つの方向を入れかえても同じ部分。
          反対称部分は、入れかえると符号が変わる部分。
          反対称 2 階テンソルは、3 次元ではベクトル（軸性ベクトル）と対応します。
        note: 対称 T_ij=T_ji、反対称 T_ij=−T_ji。2 つに分解できる。
      - part: 今日
        text: 対称テンソルの条件はどれですか。
        choices: ["T_ij = T_ji", "T_ij = −T_ji", "T_ij = 0", "T_ii = 0"]
        answer: "T_ij = T_ji"
        check: "'T_ij = T_ji'"
        hints:
          - 添字を入れかえても同じです。
          - 行列でいう対称行列です。
          - 添字を 入れかえた ときの 関係を 書こう。
        paths:
          - [添字を入れかえる, 同じ, T_ij=T_ji]
      - part: 今日
        text: 反対称テンソルの条件はどれですか。
        choices: ["T_ij = T_ji", "T_ij = −T_ji", "T_ij = 0", "T_ii = 0"]
        answer: "T_ij = −T_ji"
        check: "'T_ij = −T_ji'"
        hints:
          - 添字を入れかえると符号が変わります。
          - 対角は 0 になります。
          - 添字を 入れかえた ときの 符号を 考えよう。
        paths:
          - [入れかえると符号, T_ij=−T_ji]
      - part: 挑戦
        text: 3 次元の反対称テンソルの独立な成分はいくつですか。
        choices: [1, 3, 6, 9]
        answer: 3
        check: "3"
        hints:
          - 反対称なので対角は 0 です。
          - 上三角の成分だけが独立です。
          - 3 次元では 3 つです。
        paths:
          - [対角 0, 上三角, 3 つ]
    extra: []

  - day: 5
    items:
      - part: 見本
        text: |-
          応用：
          応力テンソルは対称（σ_ij = σ_ji）。面に働く力を表します。
          慣性テンソルも対称。回転のしにくさを表します。
          電磁場テンソル F_μν は反対称。電場と磁場をまとめます。
          対称テンソルは、主軸に回すと対角になります。
        explain: |-
          応力テンソルは、面の向きと力の向きの関係を表す 2 階テンソルです。
          慣性テンソルは、回転軸と角運動量の関係を表します。
          電磁場テンソルは、電場と磁場を 1 つの反対称テンソルにまとめます。
        note: 応力・慣性は対称、電磁場は反対称。対称テンソルは主軸で対角化。
      - part: 今日
        text: 応力テンソルは対称ですか、反対称ですか。
        choices: [対称, 反対称, どちらでもない, スカラー]
        answer: 対称
        check: "'対称'"
        hints:
          - 面の向きを入れかえても同じです。
          - σ_ij=σ_ji です。
          - 添字の 関係を 考えよう。
        paths:
          - [面の向き, σ_ij=σ_ji, 対称]
      - part: 今日
        text: 電磁場テンソルは対称ですか、反対称ですか。
        choices: [対称, 反対称, どちらでもない, スカラー]
        answer: 反対称
        check: "'反対称'"
        hints:
          - 電場と磁場をまとめます。
          - F_μν=−F_νμ です。
          - 添字を 入れかえた ときの 符号を 考えよう。
        paths:
          - [電場と磁場, F_μν=−F_νμ, 反対称]
      - part: 挑戦
        text: 対称テンソルを主軸に回すと、どうなりますか。
        choices: [対角になる, 反対称になる, 0 になる, スカラーになる]
        answer: 対角になる
        check: "'対角になる'"
        hints:
          - 対称行列は直交行列で対角化できます。
          - 主軸は固有ベクトルの方向です。
          - 直交行列で 対角化した 結果を 考えよう。
        paths:
          - [直交対角化, 主軸, 対角]
    extra: []

  - day: 6
    items:
      - part: わけ
        text: 2 階テンソルが対称部分と反対称部分に分けられるわけを説明しましょう。
        explain: 「任意の T について、S=(T+Tᵀ)/2 は対称、A=(T−Tᵀ)/2 は反対称。S+A = T になる。だから対称部分と反対称部分に分けられる。」と書ければよい。① S の定義、② A の定義、③ 和が T。子どもには、2×2 の例で確かめさせます。
        hints:
          - 対称部分の作り方を考えます。
          - 反対称部分の作り方を考えます。
          - 2 つを足します。
        paths:
          - [S=(T+Tᵀ)/2, A=(T−Tᵀ)/2, S+A=T]
      - part: わけ
        text: 直交変換でトレースが変わらないわけを説明しましょう。
        explain: 「T'_ii = Q_ik Q_il T_kl。Q は直交行列なので Q_ik Q_il = δ_kl。よって T'_ii = δ_kl T_kl = T_kk。トレースは変わらない。」と書ければよい。① 変換式、② Q の直交性、③ δ で元に戻る。子どもには、2×2 の回転で確かめさせます。
        hints:
          - 変換式で i について足します。
          - Q の直交性を使います。
          - δ が出てきます。
        paths:
          - [T'_ii, Q_ik Q_il=δ_kl, T_kk]
      - part: わけ
        text: 3 次元の反対称テンソルの独立な成分が 3 つになるわけを説明しましょう。
        explain: 「反対称なので対角は 0。独立なのは上三角の 3 つの成分だけ。下三角は符号が決まる。だから 3 次元では 3 つの独立な成分をもち、ベクトルと対応する。」と書ければよい。① 対角 0、② 上三角だけ独立、③ 3 つ。子どもには、2×2 と 3×3 をくらべさせます。
        hints:
          - 反対称なので対角はどうなりますか。
          - 上三角と下三角の関係を考えます。
          - 独立な成分を数えます。
        paths:
          - [対角 0, 上三角だけ独立, 3 つ]

