        id: "ce074aed5c"
        text: |-
          対称テンソルは T_(ij) = T_(ji)、つまり向かい側のますが同じ数です。反対称テンソルは T_(ij) = −T_(ji)、つまり向かい側は符号だけ反対で、対角は 0 です。
          任意の 2 階テンソルは、対称部分と反対称部分に分けられます。
          T_(ij) = (T_(ij)+T_(ji))/2 + (T_(ij)−T_(ji))/2。
          3 次元の反対称テンソルは、独立な成分が 3 つです。
