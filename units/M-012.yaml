lor">成分 (4, 3)</text><text x="245" y="184" font-size="15" text-anchor="middle" fill="currentColor">成分 (5, 0)</text></svg>'
        explain: |-
          座標を回すと、テンソルの成分は変わるが、物理的な意味は変わらない。
          図の矢印 v は、(4, 3) でも (5, 0) でも長さは √(16 + 9) = 5 で同じです。
          トレースと行列式は、座標の選び方によらない量です。
          δ_(ij) はどの向きでも同じ形をしています。
        note: T'_(ij)=Q_(ik) Q_(jl) T_(kl)。trace と det は不変。δ も不変。
