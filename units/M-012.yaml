    items:
      - part: 見本
        id: "8e864ddf0f"
        text: |-
          テンソルは、応力・慣性・電磁場のような、方向をもつ量を 1 つのまとまりで表します。
          応力テンソルは対称（σ_(ij) = σ_(ji)）で、面にはたらく力を表します。左の図のように、向かい合うせん断の力は同じ大きさです。慣性テンソルも対称で、回転のしにくさを表します。
          電磁場テンソル F_μν は反対称で、電場と磁場をまとめます。
          対称テンソルは、右の図のようにだ円で表せます。座標を主軸の向きに回すと、表は対角だけになります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="34" y="76" width="66" height="66" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="118" y1="140" x2="118" y2="90" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="118,80 123,90 113,90" fill="#f08080"/><text x="142" y="112" font-size="14" text-anchor="middle" fill="currentColor">σ₁₂</text><line x1="40" y1="62" x2="86" y2="62" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="96,62 86,67 86,57" fill="#f08080"/><text x="68" y="50" font-size="14" text-anchor="middle" fill="currentColor">σ₂₁</text><text x="70" y="176" font-size="14" text-anchor="middle" fill="currentColor">σ₁₂ = σ₂₁（対称）</text><ellipse cx="240" cy="98" rx="56" ry="26" fill="#7fc8f8" fill-opacity="0.4" stroke="currentColor" stroke-width="2" transform="rotate(-30 240 98)"/><line x1="170" y1="98" x2="310" y2="98" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="240" y1="160" x2="240" y2="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="183.7" y1="130.5" x2="296.3" y2="65.5" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="304.1,61 298.5,69.4 294,61.6" fill="#f08080"/><polygon points="175.9,135 181.5,126.6 186,134.4" fill="#f08080"/><line x1="257.5" y1="128.3" x2="222.5" y2="67.7" fill="none" stroke="#f08080" stroke-width="2"/><polygon points="218,59.9 226.4,65.4 218.6,69.9" fill="#f08080"/><polygon points="262,136.1 253.6,130.6 261.4,126.1" fill="#f08080"/><text x="286" y="44" font-size="14" text-anchor="middle" fill="#f08080">主軸</text><text x="240" y="176" font-size="14" text-anchor="middle" fill="currentColor">主軸に回すと対角だけ</text></svg>'
        explain: |-
          応力テンソルは、面の向きと力の向きの関係を表す 2 階テンソルです。
          慣性テンソルは、回転軸と角運動量の関係を表します。
          電磁場テンソルは、電場と磁場を 1 つの反対称テンソルにまとめます。
        note: 応力・慣性は対称、電磁場は反対称。対称テンソルは主軸で対角化。
