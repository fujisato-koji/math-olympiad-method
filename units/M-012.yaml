  - day: 2
    items:
      - part: 見本
        id: "b53ca70481"
        text: |-
          2 階テンソル T の成分は、T_(ij) のように 2 つの添字で書きます。i は行、j は列の番号で、3 次元なら 1、2、3 のどれかです。
          同じ添字が 2 回出たら、その添字について 1 から 3 まで足し合わせます（アインシュタインの縮約）。
          例：T_(ii) = T_(11) + T_(22) + T_(33)。図の青いますの和で、トレースといいます。
          δ_(ij) は、i = j のとき 1、i ≠ j のとき 0 になる単位テンソルです（図の右）。
