        id: "4d8734b647"
        text: |-
          座標の軸を回すことを、直交変換といいます。同じ矢印 v でも、軸を回すと成分は (4, 3) から (5, 0) に変わりますが、矢印そのものは変わりません。
          2 階テンソルの成分も、T'_(ij) = Q_(ik) Q_(jl) T_(kl) のように変わります。Q は直交行列（QᵀQ = I）です。
          トレース T_(ii) と行列式 det T は、軸を回しても変わりません（不変量）。δ_(ij) も変わりません。
