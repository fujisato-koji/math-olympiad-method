  - day: 3
    items:
      - part: 見本
        text: |-
          直交変換は、座標軸を回す変換です。テンソルの成分は変わりますが、物理的な意味は変わりません。
          座標を回すと、成分は T'_(ij) = Q_(ik) Q_(jl) T_(kl) と変わります。
          Q は直交行列（QᵀQ=I）。
          トレース T_(ii) と行列式 det T は、直交変換で変わりません（不変量）。
          δ_(ij) も直交変換で変わりません。
        explain: |-
          座標を回すと、テンソルの成分は変わるが、物理的な意味は変わらない。
          トレースと行列式は、座標の選び方によらない量です。
          δ_(ij) はどの向きでも同じ形をしています。
        note: T'_(ij)=Q_(ik) Q_(jl) T_(kl)。trace と det は不変。δ も不変。
      - part: 今日
        text: 直交変換で変わらないものはどれですか。
        choices: ["トレース", "T_(11)", "T_(12)", "成分の並び"]
        answer: "トレース"
        check: "'トレース'"
        hints:
          - 座標を回すと成分は変わります。
          - 対角の和はどうか を 考えます。
          - トレースは不変です。
        paths:
          - [座標を回す, 成分は変わる, 対角の和は不変, トレース]
      - part: 今日
        text: 直交変換で δ_(ij) はどうなりますか。
        choices: ["変わらない", "2 倍になる", "0 になる", "行列式が変わる"]
        answer: "変わらない"
        check: "'変わらない'"
        hints:
          - δ は単位テンソルです。
          - どの向きでも同じ形です。
          - 変わりません。
        paths:
          - [単位テンソル, どの向きでも同じ, 不変]
      - part: 挑戦
        text: 2 階テンソルの成分の変換式はどれですか。
        choices: ["T'_(ij) = Q_(ik) Q_(jl) T_(kl)", "T'_(ij) = Q_(ij) T_(ij)", "T'_(ij) = T_(ij)", "T'_(ij) = Q_(ik) T_(kj)"]
        answer: "T'_(ij) = Q_(ik) Q_(jl) T_(kl)"
        check: "\"T'_(ij) = Q_(ik) Q_(jl) T_(kl)\""
        hints:
          - 2 つの添字をそれぞれ変換します。
          - 添字ごとに Q をかけます。
          - 2 つの Q が付きます。
        paths:
          - [添字ごとに Q, 2 つの Q, T'_(ij)=Q_(ik) Q_(jl) T_(kl)]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          対称テンソル：T_(ij) = T_(ji)。反対称テンソル：T_(ij) = −T_(ji)。
          任意の 2 階テンソルは、対称部分と反対称部分に分けられます。
          T_(ij) = (T_(ij)+T_(ji))/2 + (T_(ij)−T_(ji))/2。
          3 次元の反対称テンソルは、独立な成分が 3 つです。
        explain: |-
          対称部分は、2 つの方向を入れかえても同じ部分。
          反対称部分は、入れかえると符号が変わる部分。
          反対称 2 階テンソルは、3 次元ではベクトル（軸性ベクトル）と対応します。
        note: 対称 T_(ij)=T_(ji)、反対称 T_(ij)=−T_(ji)。2 つに分解できる。
      - part: 今日
        text: 対称テンソルの条件はどれですか。
        choices: ["T_(ij) = T_(ji)", "T_(ij) = −T_(ji)", "T_(ij) = 0", "T_(ii) = 0"]
        answer: "T_(ij) = T_(ji)"
        check: "'T_(ij) = T_(ji)'"
        hints:
          - 添字を入れかえても同じです。
          - 行列でいう対称行列です。
          - 添字を 入れかえた ときの 関係を 書こう。
        paths:
          - [添字を入れかえる, 同じ, T_(ij)=T_(ji)]
      - part: 今日
        text: 反対称テンソルの条件はどれですか。
        choices: ["T_(ij) = T_(ji)", "T_(ij) = −T_(ji)", "T_(ij) = 0", "T_(ii) = 0"]
        answer: "T_(ij) = −T_(ji)"
        check: "'T_(ij) = −T_(ji)'"
        hints:
          - 添字を入れかえると符号が変わります。
          - 対角は 0 になります。
          - 添字を 入れかえた ときの 符号を 考えよう。
        paths:
          - [入れかえると符号, T_(ij)=−T_(ji)]
      - part: 挑戦
        text: 3 次元の反対称テンソルの独立な成分はいくつですか。
        choices: [1, 3, 6, 9]
        answer: 3
        check: "3"
        hints:
          - 反対称なので対角は 0 です。
          - 上三角の成分だけが独立です。
          - 3 次元では 3 つです。
        paths:
          - [対角 0, 上三角, 3 つ]
    extra: []

  - day: 5
    items:
      - part: 見本
        text: |-
          テンソルは、応力・慣性・電磁場のような、方向をもつ量を 1 つのまとまりで表します。
          応力テンソルは対称（σ_(ij) = σ_(ji)）。面に働く力を表します。
          慣性テンソルも対称。回転のしにくさを表します。
          電磁場テンソル F_μν は反対称。電場と磁場をまとめます。
          対称テンソルは、主軸に回すと対角になります。
        explain: |-
          応力テンソルは、面の向きと力の向きの関係を表す 2 階テンソルです。
          慣性テンソルは、回転軸と角運動量の関係を表します。
          電磁場テンソルは、電場と磁場を 1 つの反対称テンソルにまとめます。
        note: 応力・慣性は対称、電磁場は反対称。対称テンソルは主軸で対角化。
      - part: 今日
        text: 応力テンソルは対称ですか、反対称ですか。
        choices: [対称, 反対称, どちらでもない, スカラー]
        answer: 対称
        check: "'対称'"
        hints:
          - 面の向きを入れかえても同じです。
          - σ_(ij)=σ_(ji) です。
          - 添字の 関係を 考えよう。
        paths:
          - [面の向き, σ_(ij)=σ_(ji), 対称]
      - part: 今日
        text: 電磁場テンソルは対称ですか、反対称ですか。
        choices: [対称, 反対称, どちらでもない, スカラー]
        answer: 反対称
        check: "'反対称'"
        hints:
          - 電場と磁場をまとめます。
          - F_μν=−F_νμ です。
          - 添字を 入れかえた ときの 符号を 考えよう。
        paths:
          - [電場と磁場, F_μν=−F_νμ, 反対称]
      - part: 挑戦
        text: 対称テンソルを主軸に回すと、どうなりますか。
        choices: [対角になる, 反対称になる, 0 になる, スカラーになる]
        answer: 対角になる
        check: "'対角になる'"
        hints:
          - 対称行列は直交行列で対角化できます。
          - 主軸は固有ベクトルの方向です。
          - 直交行列で 対角化した 結果を 考えよう。
        paths:
          - [直交対角化, 主軸, 対角]
    extra: []

  - day: 6
    items:
      - part: わけ
        text: 2 階テンソルが対称部分と反対称部分に分けられるわけを説明しましょう。
        explain: 「任意の T について、S=(T+Tᵀ)/2 は対称、A=(T−Tᵀ)/2 は反対称。S+A = T になる。だから対称部分と反対称部分に分けられる。」と書ければよい。① S の定義、② A の定義、③ 和が T。子どもには、2×2 の例で確かめさせます。
        hints:
          - 対称部分の作り方を考えます。
          - 反対称部分の作り方を考えます。
          - 2 つを足します。
        paths:
          - [S=(T+Tᵀ)/2, A=(T−Tᵀ)/2, S+A=T]
      - part: わけ
        text: 直交変換でトレースが変わらないわけを説明しましょう。
        explain: 「T'_(ii) = Q_(ik) Q_(il) T_(kl)。Q は直交行列なので Q_(ik) Q_(il) = δ_(kl)。よって T'_(ii) = δ_(kl) T_(kl) = T_(kk)。トレースは変わらない。」と書ければよい。① 変換式、② Q の直交性、③ δ で元に戻る。子どもには、2×2 の回転で確かめさせます。
        hints:
          - 変換式で i について足します。
          - Q の直交性を使います。
          - δ が出てきます。
        paths:
          - [T'_(ii), Q_(ik) Q_(il)=δ_(kl), T_(kk)]
      - part: わけ
        text: 3 次元の反対称テンソルの独立な成分が 3 つになるわけを説明しましょう。
        explain: 「反対称なので対角は 0。独立なのは上三角の 3 つの成分だけ。下三角は符号が決まる。だから 3 次元では 3 つの独立な成分をもち、ベクトルと対応する。」と書ければよい。① 対角 0、② 上三角だけ独立、③ 3 つ。子どもには、2×2 と 3×3 をくらべさせます。
        hints:
          - 反対称なので対角はどうなりますか。
          - 上三角と下三角の関係を考えます。
          - 独立な成分を数えます。
        paths:
          - [対角 0, 上三角だけ独立, 3 つ]

