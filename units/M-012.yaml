      - part: 今日
        text: 3 次元で δ_(ii) はいくつですか。
        choices: [0, 1, 3, 9]
        answer: 3
        check: "3"
        hints:
          - δ_(ii) は i について足します。
          - i=1、2、3 の場合を足します。
