      - part: 挑戦
        text: 2 階テンソル T_(ij) のトレースはどれですか。
        choices: ["T_(ii)", "T_(ij)", "T_(11)", "δ_(ij)"]
        answer: "T_(ii)"
        check: "'T_(ii)'"
        hints:
          - トレースは対角成分の和です。
          - 同じ添字を足します。
          - 対角成分を 同じ添字で 書こう。
        paths:
