# S-029 度数分布と箱ひげ図（データの分析）
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の文（です・ます）。
# 前提は S-028（平均と代表値、範囲）と A-005（比と割合）。たどると N-077（小数のかけ算とわり算）、N-074・N-075（筆算）、
#   N-019（分数の計算）など。文字と式（A-010）と負の数（N-004、N-010）は前提にないので使わない。
#   長さ・時間などの単位（G-046、N-059）も前提にないので、場面は点数と回数にする。
# 扱うもの：度数分布表（階級、階級の幅、度数）、ヒストグラム、相対度数、累積度数、累積相対度数、階級値、
#   度数分布表から平均と最頻値を出す、四分位数（第 1・第 2・第 3）、四分位範囲、箱ひげ図、分布をくらべる。
# 決めごと：
#   階級は「○ 以上 △ 未満」。ちょうど △ の値は次の階級に入る。
#   四分位数は、小さい順に並べたデータを前半と後半に分け、前半の中央値を第 1 四分位数、後半の中央値を第 3 四分位数とする。
#   データの数が奇数のときは、中央値を除いて前半と後半に分ける（日本の中学校の決め方）。
#   度数分布表から出す平均は、どの値も階級値だったとみなした値（もとのデータの平均とはずれることがある）。最頻値は度数がいちばん多い階級の階級値。
#   相対度数は「小数で答えましょう」と書いて、小数だけを答えにする（分数は accept に入れない）。百分率は % の前の数を答える。
# わけの深さ：単元の水準は 2 なので、わけは ②（代表の例で、文に書いて説明する）にする（brief の 6）。
#   文字の式は前提にないので、③ の「文字を決めて式を変形する」わけは置かない。
# 表とヒストグラムと箱ひげ図は svg で描く。check は svg から読めないので、データを式に書き直して確かめる。
#   中央値は (lambda h: Fraction(h[(len(h) - 1) // 2] + h[len(h) // 2], 2))、前半は s[:len(s) // 2]、後半は s[(len(s) + 1) // 2:]。
#   小数の答えは (lambda x: x.numerator if x.denominator == 1 else x.numerator / x.denominator)(…) で小数の文字にする。
# 日の並びは地図の既定（導入・練習 2 日・わけ・混ぜる・確認）。ねらいは次のとおりにした。
#   1 日目 導入：度数分布表とヒストグラム。データから度数を数える、ヒストグラムを読む、境目の値の階級。
#   2 日目 練習：相対度数、累積度数、累積相対度数、階級値、度数分布表から平均と最頻値（頭に見本）。人数のちがう組を割合でくらべる。
#   3 日目 練習：四分位数、四分位範囲、箱ひげ図（頭に見本）。箱ひげ図から人数を見積もる。
#   4 日目 わけ：相対度数でくらべるわけ、箱ひげ図から「半分以上」「4 分の 1 以下」と言えるわけ、四分位範囲が外れた値に強いわけ。
#   5 日目 混ぜる：S-028（平均、中央値）、A-005（百分率）と、1〜3 日目の型を混ぜる。
#   6 日目 確認。

