        explain: 例：「B 組の中央値は 70 点より大きい（約 72 点）。20 人を小さい順に並べると、中央値は 10 番目と 11 番目の平均なので、11 番目は中央値以上で 70 点より大きく、11 番目から 20 番目までの 10 人（半分）は 70 点以上である。A 組の第 3 四分位数は 70 点より小さい（約 68 点）。これは 15 番目と 16 番目の平均なので、15 番目は 70 点より小さく、70 点以上になれるのは 16 番目から 20 番目までの 5 人（4 分の 1）以下である。だから 70 点以上の人の割合は、B 組は半分以上、A 組は 4 分の 1 以下で、B 組のほうが大きい。」と書ければよい。中央値より上に半分、第 3 四分位数より上に約 4 分の 1 のデータがある、という箱ひげ図の意味を使えているかを見る。「B 組の箱のほうが右にあるから」だけで終わっていたら、どの値を見て何人と言えるのかを聞く。
        hints:
