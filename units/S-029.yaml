        text: 25 人の小テスト（50 点満点）の度数分布表に、列を足しました。相対度数は 度数 ÷ 合計、累積度数ははじめの階級からの度数の合計（それを合計でわると累積相対度数）、階級値は階級の真ん中の値です。表から平均を出すときは、どの人も階級値の点数だったとみなします。度数がいちばん多い階級の階級値を、表からの最頻値とします。
        svg: '<svg viewBox="0 0 346 252" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="334" height="24" fill="#f3c969" fill-opacity=".4"/><rect x="6" y="78" width="334" height="24" fill="#f3c969" fill-opacity=".4"/><rect x="6" y="6" width="334" height="168" fill="none" stroke="currentColor" stroke-width="2"/><line x1="6" y1="30" x2="340" y2="30" stroke="currentColor" stroke-width="1"/><line x1="6" y1="54" x2="340" y2="54" stroke="currentColor" stroke-width="1"/><line x1="6" y1="78" x2="340" y2="78" stroke="currentColor" stroke-width="1"/><line x1="6" y1="102" x2="340" y2="102" stroke="currentColor" stroke-width="1"/><line x1="6" y1="126" x2="340" y2="126" stroke="currentColor" stroke-width="1"/><line x1="6" y1="150" x2="340" y2="150" stroke="currentColor" stroke-width="1"/><line x1="108" y1="6" x2="108" y2="174" stroke="currentColor" stroke-width="1"/><line x1="154" y1="6" x2="154" y2="174" stroke="currentColor" stroke-width="1"/><line x1="220" y1="6" x2="220" y2="174" stroke="currentColor" stroke-width="1"/><line x1="286" y1="6" x2="286" y2="174" stroke="currentColor" stroke-width="1"/><text x="57" y="22.6" font-size="13" text-anchor="middle" fill="currentColor">階級（点）</text><text x="131" y="22.6" font-size="13" text-anchor="middle" fill="currentColor">度数</text><text x="187" y="22.6" font-size="13" text-anchor="middle" fill="currentColor">相対度数</text><text x="253" y="22.6" font-size="13" text-anchor="middle" fill="currentColor">累積度数</text><text x="313" y="22.6" font-size="13" text-anchor="middle" fill="currentColor">階級値</text><text x="57" y="46.6" font-size="13" text-anchor="middle" fill="currentColor">0 以上 10 未満</text><text x="131" y="46.6" font-size="13" text-anchor="middle" fill="currentColor">2</text><text x="187" y="46.6" font-size="13" text-anchor="middle" fill="currentColor">0.08</text><text x="253" y="46.6" font-size="13" text-anchor="middle" fill="currentColor">2</text><text x="313" y="46.6" font-size="13" text-anchor="middle" fill="currentColor">5</text><text x="57" y="70.6" font-size="13" text-anchor="middle" fill="currentColor">10 以上 20 未満</text><text x="131" y="70.6" font-size="13" text-anchor="middle" fill="currentColor">5</text><text x="187" y="70.6" font-size="13" text-anchor="middle" fill="currentColor">0.20</text><text x="253" y="70.6" font-size="13" text-anchor="middle" fill="currentColor">7</text><text x="313" y="70.6" font-size="13" text-anchor="middle" fill="currentColor">15</text><text x="57" y="94.6" font-size="13" text-anchor="middle" fill="currentColor">20 以上 30 未満</text><text x="131" y="94.6" font-size="13" text-anchor="middle" fill="currentColor">8</text><text x="187" y="94.6" font-size="13" text-anchor="middle" fill="currentColor">0.32</text><text x="253" y="94.6" font-size="13" text-anchor="middle" fill="currentColor">15</text><text x="313" y="94.6" font-size="13" text-anchor="middle" fill="currentColor">25</text><text x="57" y="118.6" font-size="13" text-anchor="middle" fill="currentColor">30 以上 40 未満</text><text x="131" y="118.6" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="187" y="118.6" font-size="13" text-anchor="middle" fill="currentColor">0.24</text><text x="253" y="118.6" font-size="13" text-anchor="middle" fill="currentColor">21</text><text x="313" y="118.6" font-size="13" text-anchor="middle" fill="currentColor">35</text><text x="57" y="142.6" font-size="13" text-anchor="middle" fill="currentColor">40 以上 50 未満</text><text x="131" y="142.6" font-size="13" text-anchor="middle" fill="currentColor">4</text><text x="187" y="142.6" font-size="13" text-anchor="middle" fill="currentColor">0.16</text><text x="253" y="142.6" font-size="13" text-anchor="middle" fill="currentColor">25</text><text x="313" y="142.6" font-size="13" text-anchor="middle" fill="currentColor">45</text><text x="57" y="166.6" font-size="13" text-anchor="middle" fill="currentColor">合計</text><text x="131" y="166.6" font-size="13" text-anchor="middle" fill="currentColor">25</text><text x="187" y="166.6" font-size="13" text-anchor="middle" fill="currentColor">1.00</text><ellipse cx="187" cy="90" rx="26" ry="10" fill="none" stroke="#f08080" stroke-width="2.5"/><ellipse cx="253" cy="90" rx="26" ry="10" fill="none" stroke="#f08080" stroke-width="2.5"/><ellipse cx="313" cy="90" rx="24" ry="10" fill="none" stroke="#f08080" stroke-width="2.5"/><text x="8" y="198" font-size="14" text-anchor="start" fill="currentColor">相対度数：8 ÷ 25 = 0.32</text><text x="8" y="220" font-size="14" text-anchor="start" fill="currentColor">累積度数：2 + 5 + 8 = 15</text><text x="8" y="242" font-size="14" text-anchor="start" fill="currentColor">階級値：(20 + 30) ÷ 2 = 25</text></svg>'
        explain: 相対度数は、その階級の度数が全体のどれだけの割合かを表す数で、度数 ÷ 度数の合計 です。20 点以上 30 点未満は 8 ÷ 25 = 0.32 です。累積度数は、最初の階級からその階級までの度数の合計で、30 点未満の人は 2 + 5 + 8 = 15 人です（累積度数 ÷ 合計 が累積相対度数で、15 ÷ 25 = 0.6）。階級値は階級の真ん中の値で、20 点以上 30 点未満の階級値は 25 点です。表から平均を求めるときは、どの人も自分の階級の階級値をとったとみなして、（階級値 × 度数）の合計 ÷ 度数の合計 を計算します。5 × 2 + 15 × 5 + 25 × 8 + 35 × 6 + 45 × 4 = 675 なので、675 ÷ 25 = 27 点です。度数がいちばん多い階級の階級値 25 点を、表からの最頻値とします。
