        explain: 「15 回以上 20 回未満」のように区切った区間を階級、区間の幅（ここでは 5 回）を階級の幅、それぞれの階級に入るデータの数を度数といいます。15 回以上 20 回未満の階級には 15、16、17、18、19 が入り、20 は入りません（20 は次の 20 回以上 25 回未満に入ります）。数えると、度数は 5 回以上 10 回未満から順に 1、3、5、7、4 人です。階級ごとに度数を整理した表を度数分布表といい、それを柱のグラフにしたものをヒストグラムといいます。柱の幅が階級の幅、柱の高さが度数を表します。ヒストグラムを見ると、20 回以上 25 回未満の人がいちばん多く、データが全体としてどのあたりに集まっているかが分かります。
