        text: 9 人の記録は、21、15、30、12、26、17、33、20、24（回）でした。四分位範囲は何回ですか。
        answer: 12
        check: "(lambda s: (lambda h: Fraction(h[1] + h[2], 2))(s[5:]) - (lambda h: Fraction(h[1] + h[2], 2))(s[:4]))(sorted([21, 15, 30, 12, 26, 17, 33, 20, 24]))"
        hints:
          - まず、小さい順に並べましょう。
          - 9 個なので、中央値を除いて前半 4 個と後半 4 個に分けます。
          - 第 3 四分位数から第 1 四分位数をひきましょう。
        paths:
          - [12、15、17、20、21、24、26、30、33, 第 1 四分位数は (15 + 17) ÷ 2 = 16、第 3 四分位数は (26 + 30) ÷ 2 = 28, 28 − 16 = 12]
