# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: ある組の 6 人が国語と数学のテストを受けたところ、どの人も 2 教科の合計点がちょうど 150 点でした（6 人の点はすべて同じではありません）。国語の点と数学の点の相関係数を求めましょう。
    answer: −1
    check: "(lambda r: '−1' if abs(r + 1) < 1e-9 else r)((lambda p: (lambda n, mx, my: sum((x - mx) * (y - my) for x, y in p) / math.sqrt(sum((x - mx) ** 2 for x, y in p) * sum((y - my) ** 2 for x, y in p)))(len(p), sum(x for x, y in p) / len(p), sum(y for x, y in p) / len(p)))([(x, 150 - x) for x in [62, 70, 75, 81, 88, 94]]))"
    hints:
      - 国語の点を x、数学の点を y とすると、y はどんな式で表せるかな。
      - 散布図の点は、どんな形に並ぶかな。
      - y の偏差は x の偏差の何倍かな。それを使って、共分散と標準偏差を x の分散で表そう。
    paths:
      - [y = 150 − x, y の平均値は 150 − (x の平均値) なので、y の偏差は x の偏差の −1 倍, 共分散 = −(x の分散)、y の標準偏差 = x の標準偏差, r = −(x の分散) ÷ (x の標準偏差)² = −1]
    note: 1 人ずつの点数がわからなくても、変わらない量（合計点）に目をつけると決まる。相関係数が −1 になるのは、点がすべて右下がりの直線の上にあるときだけであることにも触れる。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [A-012]
    text: あるデータで、x から y を予測する回帰直線は y = 0.5x + 20、y から x を予測する回帰直線は x = 0.8y − 4 でした。どちらの回帰直線も、x の平均値と y の平均値の点を通ります。y の平均値を求めましょう。
    answer: 30
    check: "[y for x in range(0, 100) for y in range(0, 100) if 2 * y == x + 40 and 5 * x == 4 * y - 20][0]"
    hints:
      - 2 本の直線がどちらも通る点は、どんな点かな。
      - 平均値の点は、2 本の回帰直線の交点だね。
      - 2 つの式を連立方程式として解こう（A-012）。
    paths:
      - [平均値の点は 2 本の回帰直線の交点, x = 0.8(0.5x + 20) − 4 = 0.4x + 12, 0.6x = 12 で x = 20、y = 0.5 × 20 + 20 = 30]
    note: 「どちらの直線も平均値の点を通る」を「交点が平均値の点」と言いかえ、連立方程式（A-012）で解く。y から x を予測する直線は、y を横軸にした回帰直線で、x から y を予測する直線とは一般にちがう直線になる。
