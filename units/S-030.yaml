          - それぞれの偏差を求めて、2 乗しましょう。
          - 偏差の 2 乗の合計を、人数でわりましょう。
        paths:
          - [平均値は 50 ÷ 5 = 10, 偏差は 2、−4、−1、5、−2, 4 + 16 + 1 + 25 + 4 = 50 で、50 ÷ 5 = 10]
      - part: 今日
        text: 5 人の記録は、14、18、20、22、26（回）でした。標準偏差は何回ですか。
        answer: 4
        check: "(lambda v: [k for k in range(0, 101) if k * k == v][0])((lambda d: sum((x - Fraction(sum(d), len(d))) ** 2 for x in d) / len(d))([14, 18, 20, 22, 26]))"
        hints:
          - 平均値と偏差を求めましょう。
          - 偏差の 2 乗の平均が分散です。
          - 2 乗すると分散になる正の数が、標準偏差です。
        paths:
          - [平均値は 20、偏差は −6、−2、0、2、6, 分散は (36 + 4 + 0 + 4 + 36) ÷ 5 = 16, 4² = 16 なので 4]
        note: 分散 16 を答えてしまうまちがいが多い。標準偏差はもとの単位（回）にもどした数。
