  - day: 2
    items:
      - part: 見本
        text: 5 人の上体起こしの回数は、7、9、10、11、13（回）でした。記録の散らばりの大きさを、1 つの数で表してみましょう。
        explain: 平均値は 50 ÷ 5 = 10 回です。それぞれの値から平均値をひいた数を偏差といいます。偏差は −3、−1、0、1、3 です。偏差の合計はいつも 0 になるので（わけは 4 日目）、偏差の平均では散らばりを表せません。そこで、偏差を 2 乗して 9、1、0、1、9 とし、その平均 20 ÷ 5 = 4 を考えます。偏差の 2 乗の平均を分散といいます。分散の単位は（回）² になるので、もとの単位にもどすために、2 乗すると分散になる正の数を使います。これを標準偏差といいます（分散の正の平方根）。分散 4 の標準偏差は、2² = 4 なので 2 回です。標準偏差が大きいほど、データは平均値から離れて散らばっています。この単元では、分散が 4、16、25 のように《整数》の 2 乗になるデータで標準偏差を求めます。
      - part: 思い出す
        text: 6 人の記録は、12、15、9、18、14、16（回）でした。平均値は何回ですか。
        answer: 14
        check: "Fraction(12 + 15 + 9 + 18 + 14 + 16, 6)"
        hints:
          - 6 人の記録をすべてたしましょう。
          - 合計を人数でわります。
          - 合計は 84 になるか確かめましょう。
        paths:
          - [合計は 84, 84 ÷ 6 = 14]
      - part: 思い出す
        text: (−3)² + (−1)² + 2² + 2² を計算しましょう。
        answer: 18
        check: "(-3) ** 2 + (-1) ** 2 + 2 ** 2 + 2 ** 2"
        hints:
          - (−3)² は (−3) × (−3) です。
          - 負の数どうしのかけ算は正の数になります。
          - 4 つの数をたしましょう。
        paths:
          - [9 + 1 + 4 + 4 = 18]
      - part: 今日
        text: 5 人の点数は、12、6、9、15、8（点）でした。分散を求めましょう。
        answer: 10
        check: "(lambda d: sum((x - Fraction(sum(d), len(d))) ** 2 for x in d) / len(d))([12, 6, 9, 15, 8])"
        hints:
