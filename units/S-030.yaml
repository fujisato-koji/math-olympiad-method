      - part: わけ
        text: どんなデータでも、偏差（それぞれの値 − 平均値）の合計は 0 になります。このわけを、筋道を立てて書きましょう。
        explain: 例：「データの値が n 個あり、その合計を S、平均値を m とする。平均値の決め方から m = S ÷ n なので、S = n × m である。偏差の合計は (1 個目の値 − m) + (2 個目の値 − m) + … + (n 個目の値 − m) で、たす順を入れかえてまとめると、(値の合計) − (m を n 個たした数) = S − n × m になる。S = n × m なので、これは 0 である。」と書ければよい。①「n 個、合計 S、平均値 m とする」で文字を決める、② 偏差の合計を「値の合計 − m の n 個分」に変形する、③ 平均値の決め方（m = S ÷ n）で結ぶ、の 3 つがそろっているかを見る。2 日目の 7、9、10、11、13 の偏差の合計が 0 になることを確かめただけで終わっていたら、例ではすべてのデータを示せないことを話す。だから偏差をそのまま平均しても散らばりを表せず、2 乗してから平均する（分散）ことにも触れる。
        hints:
          - データの値を n 個、その合計を S、平均値を m としましょう。
          - 偏差の合計を、値の合計と、m を何個かたした数に分けましょう。
          - 平均値の決め方 m = S ÷ n を使いましょう。
        paths:
          - [n 個の値の合計を S、平均値を m とする, 偏差の合計 = S − n × m, m = S ÷ n なので S − n × m = 0]
      - part: わけ
        text: あるデータのすべての値に 5 を足しても、分散は変わりません。また、すべての値を 3 倍すると、分散は 9 倍、標準偏差は 3 倍になります。この 2 つのわけを、筋道を立てて書きましょう。
        explain: 例：「データの値が n 個あり、平均値を m とする。すべての値に 5 を足すと、合計は 5 × n だけ増えるので、平均値は m + 5 になる。それぞれの偏差は (値 + 5) − (m + 5) = 値 − m で、もとの偏差と同じなので、偏差の 2 乗の平均である分散は変わらない。すべての値を 3 倍すると、合計も 3 倍になるので平均値は 3m になり、偏差は 3 × 値 − 3m = 3 × (値 − m) で、もとの偏差の 3 倍になる。偏差の 2 乗は (3 × 偏差)² = 9 × (偏差)²（指数法則、A-009）なので、その平均の分散は 9 倍になる。標準偏差を s とすると (3s)² = 9s² は新しい分散と等しく、3s は正なので、新しい標準偏差は 3s である。」と書ければよい。①「n 個、平均値 m とする」で文字を決める、② 新しい平均値と偏差を式で表す（分配法則）、③ 分散と標準偏差の決め方、指数法則で結ぶ、の 3 つを見る。5 と 3 をほかの数にしても同じ筋道で、a 倍して b を足すと分散は a² 倍、標準偏差は a 倍（a が正のとき）になることに触れる。点数を 2 倍する例で確かめただけで終わっていたら、例ではすべてのデータを示せないことを話す。
        hints:
          - データの値を n 個、平均値を m としましょう。
          - 5 を足したとき、3 倍したときの平均値と偏差を、それぞれ式で表しましょう。
          - 分散は偏差の 2 乗の平均、標準偏差は 2 乗して分散になる正の数です。
        paths:
          - [n 個の値の平均値を m とする, 5 を足すと平均値は m + 5 で、偏差は変わらない, 3 倍すると平均値は 3m で、偏差は 3 倍、偏差の 2 乗は 9 倍, 分散は 9 倍、標準偏差は 3 倍]
      - part: わけ
        text: 5 人の身長 x（cm）と体重 y（kg）の相関係数は 0.6 でした。身長を mm で表した値（x の 10 倍）に変えても、相関係数は 0.6 のままです。このわけを、前の問題を使って筋道を立てて書きましょう。
        explain: 例：「身長を mm で表した値を X とすると、X は x の 10 倍である。X の平均値は x の平均値の 10 倍なので、X の偏差は x の偏差の 10 倍になる（前の問題）。y は変わらないので、X の偏差と y の偏差の積はどれも 10 倍になり、その平均である共分散も 10 倍になる。X の標準偏差は x の標準偏差の 10 倍である（前の問題）。よって X と y の相関係数は (10 × 共分散) ÷ (10 × x の標準偏差 × y の標準偏差) で、分子と分母の 10 が約分されて、もとの相関係数 0.6 と同じになる。」と書ければよい。① X を決める、② 偏差・共分散・標準偏差がそれぞれ何倍になるかを式で表す、③ 相関係数の決め方と約分で結ぶ、の 3 つを見る。値に同じ数を足しても偏差は変わらないので、相関係数は変わらないことにも触れる（たとえば体重から 40 をひいても同じ）。相関係数は単位の取り方によらないので、ちがう量の関係の強さを比べられる。負の数をかけると共分散の符号だけが変わり、相関係数の符号が逆になることも話すとよい。
        hints:
          - 身長を mm で表した値を X とし、X の偏差は x の偏差の何倍かを考えましょう。
          - 共分散と、X の標準偏差は、それぞれ何倍になるでしょう。
          - 相関係数の式の分子と分母を比べましょう。
        paths:
