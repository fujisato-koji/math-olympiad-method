# S-030 散布図と相関（記述統計）
#
# 書き方は N-001 の頭の注、段 5 の決まりは A-019 の頭の注のとおり（1 日の組は 思い出す 2・今日 2・挑戦 1、わけの深さは ③）。
#   わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）に次のねらいを当てた。
#   1 日目：散布図、正の相関・負の相関・相関がない、散布図から条件に合う人数を読む（直線 y = x などを引いて読む）。
#   2 日目：偏差、分散（偏差の 2 乗の平均）、標準偏差（頭に見本）。人が加わったときの分散。
#   3 日目：共分散（偏差の積の平均）、相関係数 r ＝ 共分散 ÷ (x の標準偏差 × y の標準偏差)（頭に見本）。
#   4 日目：わけ（3 問とも ③：偏差の合計は 0、値に同じ数を足す・何倍かするときの分散と標準偏差、相関係数は単位によらない）。
#   5 日目：S-029（箱ひげ図）、A-019（直線の式）と混ぜる。回帰直線（平均値の点を通る直線）で予測する、相関と因果、外れ値、得点の換算。
#   6 日目：確認。
# 分散と標準偏差は、地図のどの単元にもまだないので、相関係数の前にこの単元で扱う（S-041 の標準化の前提にもなる）。
# 前提は S-029 と A-019（たどると A-010、A-011、A-012、A-009、N-027 など）。平方根（A-016）と展開（A-015）は前提のたどりにないので、
#   標準偏差は「2 乗すると分散になる正の数」と決め、分散が 4、16、25、36 のように整数の 2 乗になるデータだけで求めさせる。
#   分散の公式「(2 乗の平均) − (平均の 2 乗)」は展開がいるので扱わない。−1 ≦ r ≦ 1 は事実として示すだけにする（わけは S-020 以降）。
#   回帰直線は「平均値の点を通り、傾きが r × (y の標準偏差) ÷ (x の標準偏差) の直線」と問題の中で決めて使い、
#   最小二乗法で求めるわけ（2 次関数 A-020 が要る）は扱わない（S-020 線形モデル）。Σ の記号（A-018）は使わず、言葉で「合計」と書く。
# 平均は「平均値」、x の平均値を x̄ のように上線で書く書き方は画面に出ないので使わない。
# データはすべて自作の場面（点数、勉強時間、身長と体重、気温と売上）で、実在の調査の数ではない。
# 答えは整数、約分した分数、小数（分数が有限小数になるときは accept に小数）。負の数は「−」U+2212。
#   相関の向きや強さ、相関と因果を選ぶ問題は choices。散布図の点の数は、check にデータを書き直して数える。
#   相関係数を選ぶ問題の check は、データから r を計算して、いちばん近い選択肢を選ぶ。
# 散布図は svg（方眼、目盛り、点）。答えの数や直線は図に書かない（読み取りの手がかりの直線は、ヒントで引かせる）。
# 相関と回帰は、線形モデル（S-020）、因果推論（S-042）、測定と誤差の直線の当てはめ（P-117）、表計算での分析（K-143）の入口になる（D-026）。

