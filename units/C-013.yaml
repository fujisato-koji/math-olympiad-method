        explain: 例：「赤玉を赤 1、赤 2 と区別すると、3 このならべ方は 3 × 2 × 1 = 6 通り。名前を消すと、赤 1 と赤 2 を入れかえた 2 つのならび（図の左と右）が同じならびになる。どのならびも、ちょうど 2 回ずつ数えている。だから 6 ÷ 2 = 3 通り。」と書ければよい。「どのならびも同じ 2 回ずつ」と、回数がそろっていることが書けているかを見る（そろっていないとわり算はできない）。C-007 で 2 人を選ぶとき 2 でわったのと同じ考え方であることにもふれる。
        hints:
