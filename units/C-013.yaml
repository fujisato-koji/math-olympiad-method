    svg: '<svg viewBox="0 0 320 155" xmlns="http://www.w3.org/2000/svg"><rect x="48" y="38" width="44" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="58.1" cy="48.1" r="3.2" fill="currentColor"/><circle cx="70" cy="60" r="3.2" fill="currentColor"/><circle cx="81.9" cy="71.9" r="3.2" fill="currentColor"/><text x="70" y="108" font-size="13" text-anchor="middle" fill="currentColor">1 回目</text><rect x="138" y="38" width="44" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="148.1" cy="48.1" r="3.2" fill="currentColor"/><circle cx="160" cy="60" r="3.2" fill="currentColor"/><circle cx="171.9" cy="71.9" r="3.2" fill="currentColor"/><text x="160" y="108" font-size="13" text-anchor="middle" fill="currentColor">2 回目</text><rect x="228" y="38" width="44" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="238.1" cy="48.1" r="3.2" fill="currentColor"/><circle cx="261.9" cy="48.1" r="3.2" fill="currentColor"/><circle cx="238.1" cy="71.9" r="3.2" fill="currentColor"/><circle cx="261.9" cy="71.9" r="3.2" fill="currentColor"/><text x="250" y="108" font-size="13" text-anchor="middle" fill="currentColor">3 回目</text><text x="160" y="140" font-size="14" text-anchor="middle" fill="currentColor">たとえば 3 + 3 + 4 = 10</text></svg>'
    answer: 27
    check: "sum(1 for p in itertools.product(range(1, 7), repeat=3) if sum(p) == 10)"
    hints:
      - text: 目から 1 ずつひいた数（0〜5）の和を考えると、○ と仕切りのならべ方が使えるね。
        svg: '<svg viewBox="0 0 320 145" xmlns="http://www.w3.org/2000/svg"><rect x="53" y="13" width="34" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="60.8" cy="20.8" r="3.2" fill="currentColor"/><circle cx="70" cy="30" r="3.2" fill="currentColor"/><circle cx="79.2" cy="39.2" r="3.2" fill="currentColor"/><text x="100" y="36" font-size="13" text-anchor="start" fill="currentColor">→ 2</text><rect x="143" y="13" width="34" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="150.8" cy="20.8" r="3.2" fill="currentColor"/><circle cx="160" cy="30" r="3.2" fill="currentColor"/><circle cx="169.2" cy="39.2" r="3.2" fill="currentColor"/><text x="190" y="36" font-size="13" text-anchor="start" fill="currentColor">→ 2</text><rect x="233" y="13" width="34" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="240.8" cy="20.8" r="3.2" fill="currentColor"/><circle cx="259.2" cy="20.8" r="3.2" fill="currentColor"/><circle cx="240.8" cy="39.2" r="3.2" fill="currentColor"/><circle cx="259.2" cy="39.2" r="3.2" fill="currentColor"/><text x="280" y="36" font-size="13" text-anchor="start" fill="currentColor">→ 3</text><text x="160" y="76" font-size="13" text-anchor="middle" fill="currentColor">1 ずつひいた数を ○ にする</text><rect x="34" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="48" cy="120" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="62" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="76" cy="120" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="90" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><rect x="101.5" y="106" width="5" height="28" rx="1" fill="#f08080"/><rect x="118" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="132" cy="120" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="146" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="160" cy="120" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="174" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><rect x="185.5" y="106" width="5" height="28" rx="1" fill="#f08080"/><rect x="202" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="216" cy="120" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="230" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="244" cy="120" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><rect x="258" y="103" width="28" height="34" rx="0" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="272" cy="120" r="9" fill="#7fc8f8" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/></svg>'
      - 目が 7 以上でもよいとしたら、何通りかな。
      - 7 以上の目が出る数え方を、全体からのぞこう。3 回のうち 2 回が 7 以上になることはあるかな。
    paths:
      - [目から 1 ずつひいた数を a、b、c とすると a + b + c = 7, 上限がなければ ○ 7 こと仕切り 2 本のならべ方で 9 × 8 ÷ 2 = 36 通り, a が 6 以上（目が 7 以上）になるのは、残りの 1 を 3 つに分ける 3 通りで、b、c も同じなので 9 通り, 2 つが同時に 6 以上になることはない, 36 − 9 = 27 通り]
