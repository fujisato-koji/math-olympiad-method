# C-013 区別と重複のある数え方
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の漢字まじりの文。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 同じものをふくむ並べ方（区別して並べてから同じ並びをまとめる、置く場所を選ぶ）、
#   2 日目 輪に並べる（回して同じものは同じ。1 人の席を決める）、首飾り（裏返しても同じ）、
#   3 日目 同じ種類を何回選んでもよい選び方（○ と仕切り｜の並びにする）、区別のない玉を区別のある箱に入れる、
#   4 日目 わけ（なぜ 2 でわるか、なぜ 1 人の席を決めてよいか、なぜ ○ と｜の並びと同じ数か）、
#   5 日目 C-005（何回でも使える並べ方）・C-006（順列）・C-007（組合せ）と混ぜる、6 日目 確認。
# 前提は C-007 だけ（→ C-006、C-005、N-013、N-014）。3 けたの数（N-009）が前提にないので、C-007 と同じく答えも途中の数も 100 までにした。
#   そのため 5 つ以上のものを全部並べる数（5 × 4 × 3 × 2 × 1 = 120）は出さず、同じものをふくむ並べ方は「置く場所を選ぶ」道を本線にした。
#   6 人以上の輪、6 こから 3 こを選ぶ数（ならべ方が 120）も出さない。
# 文字の式（A-010）も前提にないので、わけは「何人でも」「どの並びも」と言葉で一般に書く（段 4 の ③ の筋道を、文字を使わずに書く）。
#   explain には、① 何を数えるかを決める、② どう対応させるか・何回ずつ数えたかを示す、③ 約束した事実（積の法則、組合せの数）で結ぶ、の 3 点を書いた。
#   1 問目は代表の例で書く ②。
# 記号（ₙCᵣ、ₙHᵣ、n!）は使わない（二項係数の記号は C-015）。対応させて数える方法そのものは C-014 で広げる。
# 輪の図は全角の文字と全角の空白で、席を上下左右に置いて描く。
# check：同じものをふくむ並べ方は set(itertools.permutations(…)) の数。輪は、回したものの中でいちばん小さい並びにそろえてから数え、
#   首飾りは裏返したものもそろえる。何回でも選べる選び方は itertools.combinations_with_replacement か、個数の組を itertools.product で作って数える。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-010 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: C-013
days:
  - day: 1
    items:
      - part: 見本
        text: 赤玉 2 個と青玉 1 個を 1 列に並べます。並べ方は何通りですか。同じ色の玉は区別しません。
        figure: "🔴🔴🔵\n🔴🔵🔴\n🔵🔴🔴"
        explain: 2 個の赤玉に赤 1、赤 2 と名前をつけて区別すると、3 個の並べ方は 3 × 2 × 1 = 6 通りです。けれども、赤 1 と赤 2 を入れかえた 2 つの並び（赤 1 赤 2 青 と 赤 2 赤 1 青）は、名前を消すと同じ並びに見えます。どの並びも 2 回ずつ数えているので、6 ÷ 2 = 3 通りです。別の数え方もあります。3 つの場所のうち、青玉を置く場所を 1 つ選べば並びが決まるので、3 通りです。同じものをふくむ並べ方は、「区別して数えてから、同じになるものの数でわる」か、「同じものを置く場所を選ぶ」で数えます。
      - part: 思い出す
        text: 5 人の中から、2 人の係を選びます。選び方は何通りですか。
        answer: 10
        check: "len(set(itertools.combinations(range(5), 2)))"
        hints:
          - 順番をつけて並べると何通りかを考えよう。
          - 同じ 2 人の組を何回ずつ数えているかを考えよう。
          - 並べ方の数をその回数でわろう。
        paths:
          - [並べると 5 × 4 = 20 通り, どの組も 2 回ずつ, 20 ÷ 2 = 10 通り]
      - part: 思い出す
        text: 4 人が 1 列に並びます。並び方は何通りですか。
        answer: 24
        check: "len(set(itertools.permutations(range(4))))"
        hints:
          - 先頭は何通りあるかを考えよう。
          - 1 人決めるごとに、残りの人は 1 人ずつ減るね。
          - 積の法則を使おう。
        paths:
          - [4 × 3 × 2 × 1 = 24 通り]
      - part: 今日
        text: 赤玉 2 個と青玉 2 個を 1 列に並べます。並べ方は何通りですか。
        answer: 6
        check: "len(set(itertools.permutations('赤赤青青')))"
        hints:
          - 4 つの場所のうち、赤玉を置く場所を選ぶと考えよう。
          - 赤玉を置く 2 つの場所の選び方は、組合せで数えられるね。
          - 赤玉の場所が決まれば、青玉の場所も決まるかな。
        paths:
          - [4 つの場所から赤玉の場所を 2 つ選ぶ, 4 × 3 ÷ 2 = 6 通り]
          - [区別すると 4 × 3 × 2 × 1 = 24 通り, 赤どうし・青どうしの入れかえで 2 × 2 = 4 回ずつ数えている, 24 ÷ 4 = 6 通り]
        note: 2 でわって 12 としやすい。赤どうしの入れかえと青どうしの入れかえの両方で、同じ並びが 4 回ずつ出てくる。
      - part: 今日
        text: 赤玉 3 個と青玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 4
        check: "len(set(itertools.permutations('赤赤赤青')))"
        hints:
          - 青玉は 1 個だけだね。
          - 青玉を置く場所を選ぶと考えよう。
          - 青玉の場所が決まると、並びは決まるかな。
        paths:
          - [4 つの場所から青玉の場所を 1 つ選ぶ, 4 通り]
      - part: 今日
        text: 「あ」「あ」「い」「う」の 4 枚のカードを 1 列に並べます。並べ方は何通りですか。
        answer: 12
        check: "len(set(itertools.permutations('ああいう')))"
        hints:
          - 2 枚の「あ」を区別すると、並べ方は何通りかな。
          - 2 枚の「あ」を入れかえた並びは、同じに見えるね。
          - 同じ並びを何回ずつ数えているかを考えよう。
        paths:
          - [区別すると 4 × 3 × 2 × 1 = 24 通り, 「あ」の入れかえで 2 回ずつ, 24 ÷ 2 = 12 通り]
          - [「あ」の場所を 2 つ選ぶ 4 × 3 ÷ 2 = 6 通り, 残り 2 つの場所に「い」「う」を並べる 2 通り, 6 × 2 = 12 通り]
      - part: 挑戦
        text: 赤玉 2 個、青玉 2 個、白玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 30
        check: "len(set(itertools.permutations('赤赤青青白')))"
        hints:
          - まず、5 つの場所から赤玉の場所を選ぼう。
          - 残った場所から、青玉の場所を選ぼう。
          - 2 つの選び方を、積の法則でかけよう。
        paths:
          - [赤玉の場所 5 × 4 ÷ 2 = 10 通り, 残り 3 つから青玉の場所 3 × 2 ÷ 2 = 3 通り, 10 × 3 = 30 通り]
          - [白玉の場所 5 通り, 残り 4 つから赤玉の場所 6 通り, 5 × 6 = 30 通り]
        note: どの色から場所を選んでも、同じ 30 通りになる。選ぶ順を変えて確かめるとよい。
    extra:
      - part: 今日
        text: 赤玉 4 個と青玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 5
        check: "len(set(itertools.permutations('赤赤赤赤青')))"
        hints:
          - 青玉は 1 個だけだね。
          - 青玉を置く場所を選ぼう。
          - 場所はいくつあるかな。
        paths:
          - [5 つの場所から青玉の場所を 1 つ選ぶ, 5 通り]
      - part: 今日
        text: 赤玉 2 個、青玉 1 個、白玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 12
        check: "len(set(itertools.permutations('赤赤青白')))"
        hints:
          - 赤玉を置く場所を先に選ぼう。
          - 残った 2 つの場所に、青玉と白玉をどう置くかな。
          - 積の法則を使おう。
        paths:
          - [赤玉の場所 4 × 3 ÷ 2 = 6 通り, 青と白の置き方 2 通り, 6 × 2 = 12 通り]
      - part: 挑戦
        text: 赤玉 3 個、青玉 2 個、白玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 60
        check: "len(set(itertools.permutations('赤赤赤青青白')))"
        hints:
          - 1 個しかない白玉の場所から選ぶと、数が小さくてすむよ。
          - 残った 5 つの場所から、青玉の場所を選ぼう。
          - 残りは全部赤玉になるね。
        paths:
          - [白玉の場所 6 通り, 残り 5 つから青玉の場所 5 × 4 ÷ 2 = 10 通り, 6 × 10 = 60 通り]

  - day: 2
    items:
      - part: 見本
        text: ア、イ、ウ、エの 4 人が、丸いテーブルのまわりの 4 つの席にすわります。全員が同じ向きに 1 つずつ席をずれたものは、同じすわり方とします。すわり方は何通りですか。
        figure: "　ア\nエ　イ\n　ウ"
        explain: 4 人を 1 列に並べると 4 × 3 × 2 × 1 = 24 通りです。けれども、丸いテーブルでは、全員が 1 つずつずれると、だれのとなりにだれがいるかは変わりません。そこで、アの席を 1 つに決めてしまいます。どのすわり方も、回すとアがその席に来るものがちょうど 1 つあるからです。アから右回りに残りの 3 人を並べると、3 × 2 × 1 = 6 通りです。24 通りの並べ方を、回すと同じになる 4 つずつにまとめて、24 ÷ 4 = 6 通りと数えることもできます。輪に並べるときは、1 人を決めて、残りを並べます。
      - part: 思い出す
        text: 赤玉 3 個と青玉 2 個を 1 列に並べます。並べ方は何通りですか。
        answer: 10
        check: "len(set(itertools.permutations('赤赤赤青青')))"
        hints:
          - 5 つの場所のうち、青玉を置く場所を選ぼう。
          - 青玉の場所 2 つの選び方は、組合せで数えられるね。
          - 青玉の場所が決まると、赤玉の場所も決まるかな。
        paths:
          - [5 つの場所から青玉の場所を 2 つ選ぶ, 5 × 4 ÷ 2 = 10 通り]
      - part: 思い出す
        text: 6 人の中から、2 人の代表を選びます。選び方は何通りですか。
        answer: 15
        check: "len(set(itertools.combinations(range(6), 2)))"
        hints:
          - 順番をつけて並べると何通りかな。
          - 同じ 2 人の組を何回ずつ数えているかな。
          - わり算にしよう。
        paths:
          - [並べると 6 × 5 = 30 通り, 2 回ずつ, 30 ÷ 2 = 15 通り]
      - part: 今日
        text: 5 人が、丸いテーブルのまわりの 5 つの席にすわります。全員が同じ向きにずれたものは同じすわり方とします。すわり方は何通りですか。
        answer: 24
        check: "len(set(min(p[i:] + p[:i] for i in range(5)) for p in itertools.permutations('アイウエオ')))"
        hints:
          - 1 人の席を決めてしまおう。
          - 残りの人を、その人から右回りに並べると考えよう。
          - 残りは何人で、並べ方は何通りかな。
        paths:
          - [アの席を決める, 残り 4 人を並べる, 4 × 3 × 2 × 1 = 24 通り]
        note: 1 列のときと同じに 5 × 4 × 3 × 2 × 1 と数えると、回して同じになるものを 5 回ずつ数えてしまう。
      - part: 今日
        text: 3 人が輪になって手をつなぎます。全員が同じ向きにずれたものは同じつなぎ方とします。つなぎ方は何通りですか。
        answer: 2
        check: "len(set(min(p[i:] + p[:i] for i in range(3)) for p in itertools.permutations('アイウ')))"
        hints:
          - 1 人の場所を決めよう。
          - 残りの 2 人を、右回りにどう並べるかな。
          - 右回りに ア、イ、ウ と、ア、ウ、イ は同じかな。
        paths:
          - [アを決める, 残り 2 人を並べる 2 × 1 = 2 通り]
      - part: 今日
        text: ア、イ、ウ、エ、オの 5 人が、丸いテーブルのまわりの 5 つの席にすわります。アとイがとなり合うすわり方は何通りですか。全員が同じ向きにずれたものは同じとします。
        answer: 12
        check: "len(set(min(p[i:] + p[:i] for i in range(5)) for p in itertools.permutations('アイウエオ') if abs(p.index('ア') - p.index('イ')) in (1, 4)))"
        hints:
          - となり合うアとイを、ひとまとまりと考えよう。
          - まとまり 1 つと残り 3 人を、輪に並べると何通りかな。
          - まとまりの中で、アとイの並び方は何通りかな。
        paths:
          - [アイをひとまとまりにする, まとまりと 3 人の 4 つを輪に並べる 3 × 2 × 1 = 6 通り, まとまりの中が 2 通りで 6 × 2 = 12 通り]
      - part: 挑戦
        text: 色のちがう 5 個のビーズに糸を通して、首飾りを作ります。回したものと、裏返したものは同じ首飾りとします。首飾りは何通りできますか。
        answer: 12
        check: "len(set(min(min(q[i:] + q[:i] for i in range(5)) for q in (p, p[::-1])) for p in itertools.permutations(range(5))))"
        hints:
          - まず、回したものだけを同じとすると、何通りかな。
          - 首飾りを裏返すと、右回りと左回りが入れかわるね。
          - 裏返すと同じになるものは、何個ずつ組になっているかな。
        paths:
          - [回したものを同じとすると 4 × 3 × 2 × 1 = 24 通り, 裏返すと同じになるものが 2 つずつ組, 24 ÷ 2 = 12 通り]
        note: 輪の並べ方を、さらに裏返しで 2 つずつまとめる。どの並びも、裏返すと自分とは別の並びになる（5 個の色がちがうから）ので、ちょうど 2 でわれる。
    extra:
      - part: 今日
        text: 色のちがう 4 個の玉を、円の上の 4 つの場所に並べます。回して同じになるものは同じとします。並べ方は何通りですか。
        answer: 6
        check: "len(set(min(p[i:] + p[:i] for i in range(4)) for p in itertools.permutations(range(4))))"
        hints:
          - 1 個の玉の場所を決めよう。
          - 残りの玉を、右回りに並べよう。
          - 残りは何個かな。
        paths:
          - [1 個を決める, 残り 3 個を並べる 3 × 2 × 1 = 6 通り]
      - part: 今日
        text: ア、イ、ウ、エの 4 人が輪になって手をつなぎます。アとイがとなり合うつなぎ方は何通りですか。全員が同じ向きにずれたものは同じとします。
        answer: 4
        check: "len(set(min(p[i:] + p[:i] for i in range(4)) for p in itertools.permutations('アイウエ') if abs(p.index('ア') - p.index('イ')) in (1, 3)))"
        hints:
          - アとイをひとまとまりにしよう。
          - まとまりと残りの 2 人を輪に並べると、何通りかな。
          - まとまりの中の並び方もわすれずに。
        paths:
          - [まとまりと 2 人の 3 つを輪に並べる 2 × 1 = 2 通り, まとまりの中が 2 通り, 2 × 2 = 4 通り]
      - part: 挑戦
        text: 色のちがう 4 個のビーズで首飾りを作ります。回したものと、裏返したものは同じとします。首飾りは何通りできますか。
        answer: 3
        check: "len(set(min(min(q[i:] + q[:i] for i in range(4)) for q in (p, p[::-1])) for p in itertools.permutations(range(4))))"
        hints:
          - 回したものだけを同じとすると、何通りかな。
          - 裏返すと同じになるものは、何個ずつ組になるかな。
          - わり算にしよう。
        paths:
          - [回したものを同じとすると 3 × 2 × 1 = 6 通り, 裏返しで 2 つずつ組, 6 ÷ 2 = 3 通り]

  - day: 3
    items:
      - part: 見本
        text: りんご、みかん、かきの 3 種類のくだものを、合わせて 4 個買います。同じ種類を何個買ってもよく、買わない種類があってもかまいません。買い方は何通りですか。
        figure: "○○｜○｜○　りんご 2、みかん 1、かき 1\n○○○○｜｜　りんご 4\n｜○○｜○○　みかん 2、かき 2"
        explain: 買うくだもの 4 個を ○ で表し、りんご、みかん、かきの順に並べて、種類の境目に仕切り ｜ を 2 本入れます。たとえば ○○｜○｜○ は、りんご 2 個、みかん 1 個、かき 1 個です。どの買い方も ○ 4 個と ｜ 2 本の並び 1 つで表せて、どの並びも 1 つの買い方を表します。○ と ｜ の並びは、6 つの場所から ｜ を置く場所を 2 つ選べば決まるので、6 × 5 ÷ 2 = 15 通りです。だから買い方も 15 通りです。
      - part: 思い出す
        text: 4 人が、丸いテーブルのまわりの 4 つの席にすわります。全員が同じ向きにずれたものは同じすわり方とします。すわり方は何通りですか。
        answer: 6
        check: "len(set(min(p[i:] + p[:i] for i in range(4)) for p in itertools.permutations('アイウエ')))"
        hints:
          - 1 人の席を決めよう。
          - 残りの人を右回りに並べよう。
          - 残りは何人かな。
        paths:
          - [1 人を決める, 残り 3 人を並べる 3 × 2 × 1 = 6 通り]
      - part: 思い出す
        text: 3 種類のシールが、どれもたくさんあります。ア、イ、ウの 3 人に 1 枚ずつ配ります。同じ種類を何人に配ってもかまいません。配り方は何通りですか。
        answer: 27
        check: "len(set(itertools.product(range(3), repeat=3)))"
        hints:
          - アに配るシールは、何通りかな。
          - イにも、同じ種類をまた配れるね。
          - 積の法則を使おう。
        paths:
          - [ア 3 通り、イ 3 通り、ウ 3 通り, 3 × 3 × 3 = 27 通り]
        note: 人には区別があるので、だれに何を配ったかで別の配り方になる。今日の「何個買うか」とのちがいを確かめる。
      - part: 今日
        text: あめとガムの 2 種類のおかしを、合わせて 5 個買います。同じ種類を何個買ってもよく、買わない種類があってもかまいません。買い方は何通りですか。
        answer: 6
        check: "len(set(itertools.combinations_with_replacement('あガ', 5)))"
        hints:
          - 5 個を ○ で表すと、仕切り ｜ は何本いるかな。
          - ○ と ｜ を並べる場所は全部でいくつかな。
          - 仕切りを置く場所の選び方を数えよう。
        paths:
          - [○ 5 個と ｜ 1 本の並び, 6 つの場所から ｜ の場所を 1 つ選ぶ, 6 通り]
          - [あめが 0 個から 5 個まで, 6 通り]
      - part: 今日
        text: 赤、青、黄の 3 色の色紙を、合わせて 3 枚もらいます。同じ色を何枚もらってもよく、もらわない色があってもかまいません。もらい方は何通りですか。
        answer: 10
        check: "len(set(itertools.combinations_with_replacement('赤青黄', 3)))"
        hints:
          - 3 枚を ○ で、色の境目を ｜ で表そう。
          - ○ 3 個と ｜ 2 本を並べると考えよう。
          - 5 つの場所から ｜ の場所を選ぼう。
        paths:
          - [○ 3 個と ｜ 2 本の並び, 5 つの場所から ｜ の場所を 2 つ選ぶ, 5 × 4 ÷ 2 = 10 通り]
