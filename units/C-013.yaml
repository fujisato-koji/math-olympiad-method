        explain: 例：「買い方を、りんご、みかん、かきの順に ○ をならべ、種類のさかい目に ｜ を入れて表すとする。どの買い方からも、○ 4 こと ｜ 2 本のならびが 1 つだけできる。反対に、○ 4 こと ｜ 2 本のどのならびも、1 本目の ｜ の左の ○ をりんご、2 本の間をみかん、右をかきと読めば、1 つの買い方になる。買い方とならびは 1 つずつ組になるので、数は同じ。ならびは 6 つの場所から ｜ の場所を 2 つ選ぶので 6 × 5 ÷ 2 = 15 通り。」と書ければよい。① 表し方を決める、② 両方向に 1 つずつ組になる（どちらからも 1 つだけ決まる）ことをしめす、③ 組合せの数で結ぶ、の 3 点を見る。｜ がならんだ所（｜｜）は「その種類を買わない」ことにふれられれば、なおよい。
        hints:
