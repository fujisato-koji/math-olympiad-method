        text: 丸いテーブルに人がすわるとき（全員が同じ向きにずれたものは同じとする）、1 人の席を決めて残りの人を並べれば、すわり方の数が出せます。何人のときでもそう言えるわけを、筋道を立てて書きましょう。
        explain: 例：「すわる人の 1 人をアとし、テーブルの席の 1 つを席 1 とする。どのすわり方も、全員を同じ向きにずらしていくと、アが席 1 に来るものがちょうど 1 つある（ずらし方は席の数だけあり、アが席 1 に来るのはそのうち 1 つだけ）。だから、回して同じものをまとめたすわり方と、アが席 1 にいるすわり方は、1 つずつ組になる。アが席 1 にいるすわり方は、残りの人を残りの席に 1 列に並べる数と同じなので、積の法則で数えられる。」と書ければよい。① 何を数えるか（アが席 1 にいるすわり方）を決める、② 1 つずつ組になることを示す、③ 積の法則で結ぶ、の 3 点がそろっているかを見る。4 人のときに 6 通りと確かめただけで終わったら、例ではすべての人数を示せないことを話す。
        hints:
          - 1 つのすわり方を回していくと、アはどの席にも来るかな。
          - アが決めた席に来るものは、いくつあるかな。
          - 「1 つずつ組になるから同じ数」と、残りを並べる数を結んで書こう。
        paths:
          - [アの席を席 1 と決める, どのすわり方も回すとアが席 1 のものがちょうど 1 つ, 1 つずつ組になる, 残りを 1 列に並べる数になる]
      - part: わけ
        text: 3 種類のくだものから合わせて 4 個買う買い方は、○ 4 個と ｜ 2 本の並べ方と同じ数です。なぜ同じ数なのかを、筋道を立てて書きましょう。
