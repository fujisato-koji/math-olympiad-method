        explain: 4 人を 1 列にならべると 4 × 3 × 2 × 1 = 24 通りです。けれども、丸いテーブルでは、全員が 1 つずつずれると、だれのとなりにだれがいるかは変わりません。そこで、アの席を 1 つに決めてしまいます。どのすわり方も、回すとアがその席に来るものがちょうど 1 つあるからです。アから右回りに残りの 3 人をならべると、3 × 2 × 1 = 6 通りです。24 通りのならべ方を、回すと同じになる 4 つずつにまとめて、24 ÷ 4 = 6 通りと数えることもできます。輪にならべるときは、1 人を決めて、残りをならべます。
