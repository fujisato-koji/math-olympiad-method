    note: 何回でも選べる選び方（○ と仕切り、3 日目）に、上限をこえるものを全体からのぞく考え（C-008 の重なりとのぞき方）を合わせる。7 以上の目が 2 回出ることはない（ひいた数の和が 12 以上になる）ので、重なりは 0。上限をわすれて 36 と答えやすい。
