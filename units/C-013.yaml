      - part: 挑戦
        text: 色のちがう 4 個のビーズで首飾りを作ります。回したものと、裏返したものは同じとします。首飾りは何通りできますか。
        answer: 3
        check: "len(set(min(min(q[i:] + q[:i] for i in range(4)) for q in (p, p[::-1])) for p in itertools.permutations(range(4))))"
        hints:
          - 回したものだけを同じとすると、何通りかな。
          - 裏返すと同じになるものは、何個ずつ組になるかな。
          - わり算にしよう。
        paths:
          - [回したものを同じとすると 3 × 2 × 1 = 6 通り, 裏返しで 2 つずつ組, 6 ÷ 2 = 3 通り]

  - day: 3
    items:
