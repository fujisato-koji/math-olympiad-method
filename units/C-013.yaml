    text: 正十二角形（辺の長さがみな等しく、角の大きさもみな等しい十二角形）の 12 この頂点は、1 つの円の上にあります。この 12 この頂点から 4 こをえらび、円のまわりの順に結んで、四角形を作ります。折り返すと自分にぴったり重なる（線対称な）四角形になるえらび方は、何通りですか。頂点は 1 つ 1 つ区別し、回すと重なるえらび方も別々に数えます。長方形や正方形もふくめます。
    answer: 159
    check: sum(1 for S in itertools.combinations(range(12), 4) if any(p != S and all(min((S[i] - S[j]) % 12, (S[j] - S[i]) % 12) == min((p[i] - p[j]) % 12, (p[j] - p[i]) % 12) for i in range(4) for j in range(4)) for p in itertools.permutations(S)))
    hints:
    - 頂点の数が少ない正多角形（正六角形や正八角形など）で、線対称な四角形を全部かいて数えてみよう。
    - 四角形の 4 つの頂点は、折り返すとどこにうつるかな。
    - 数え終えたあと、同じ四角形を 2 回以上数えていないか、たしかめてみよう。
    paths:
    - - 四角形が折り返して自分に重なるとき、4 つの頂点は 4 つの頂点にうつる。4 つの頂点がみな折る線（対称の軸）の上にあることはない（直線は円と 2 点でしか交わらない）ので、入れかわる頂点が 2 つある。それを A、B とする。軸は、A と B を結ぶ線を直角に 2 等分する線である。A、B は同じ円の上にあり、円の中心 O からの長さが等しいので、軸は O を通る。また軸は、A から B までの円のまわりの部分のまん中も通る。A から B まで進む辺の数が 2 でわり切れるときは、そのまん中は頂点、あまりが 1 のときは辺のまん中である。だから軸は、正十二角形の 12 本の軸（頂点を通る 6 本と、辺のまん中を通る 6 本）のどれかになる
      - ひとつの軸について数える。軸の上にない頂点は、軸をはさんで 2 つずつ入れかわるので、その数は 2 でわり切れる。四角形の頂点は 4 こだから、軸の上にある頂点の数も 2 でわり切れ、0 こか 2 こか 4 こ。軸の上に正十二角形の頂点は 2 こまでしかないので、0 こか 2 こである。だから、この軸で線対称な四角形は、「軸をはさんで入れかわる 2 つの頂点の組」を何組かと、軸の上の頂点を 0 こか 2 こ使って作ったものだけで、反対に、そう作った 4 こは、軸で折り返すと自分に重なる
      - 頂点を通る軸（6 本）：軸の上にない 10 この頂点は 5 組。軸の上の頂点を使わないなら、5 組から 2 組をえらぶので、5 × 4 = 20、20 ÷ 2 = 10 通り。軸の上の 2 こを使うなら、のこりの 1 組を 5 組からえらぶので 5 通り。合わせて 15 通り。辺のまん中を通る軸（6 本）：頂点 12 こは 6 組で、6 組から 2 組をえらぶので、6 × 5 = 30、30 ÷ 2 = 15 通り。どの軸も 15 通りで、軸は 12 本だから、軸ごとに数えると 15 × 12 = 180 通り
      - 180 通りには、軸が 2 本以上ある四角形が、軸の本数だけ入っている。軸が 2 本ある四角形を調べる。2 本の軸はどちらも O を通る。1 本目で折り返してから 2 本目で折り返すと、四角形は自分に重なる。折るたびに表とうらが入れかわるので、2 回折ると表のままにもどり、O は動かないので、これは O を中心に回した形である（円の上の点は、1 本目の軸から 2 本目の軸までの角の 2 倍だけまわる）。この回転では円の上の点が動かないままになることはないので、4 つの頂点は輪になって入れかわる。何回くり返すともとにもどるかは、どの頂点でも同じで、4 つの頂点が同じ数ずつの輪に分かれるから、2 回か 4 回。4 回のときも 2 回くり返せば半回転になるので、どちらでも、半回転で四角形は自分に重なる。半回転では、頂点は O の反対がわの頂点と入れかわる。だから 4 つの頂点は、2 本の直径の両はしになり、2 本の対角線が長さの等しい直径で、たがいのまん中で交わるので、長方形（正方形をふくむ）である
      - 2 本の直径の両はしを結んでできる長方形は、6 本の直径から 2 本をえらぶので、6 × 5 = 30、30 ÷ 2 = 15 こ。この長方形の軸は、長方形なら 2 本、正方形なら 4 本で、どれも 12 本の軸のどれかだから、上で数えたことになる。正方形は 2 本の直径が直角に交わるもので、6 本の直径のうち直角に交わる組は 3 組だから 3 こ。軸が 4 本で、4 回数えている。のこりの長方形は 15 − 3 = 12 こ。軸は 2 本で、2 回数えている。ほかの四角形は軸が 1 本で、1 回だけ数えている。数えすぎは、12 × 1 + 3 × 3 = 12 + 9 = 21 だから、180 − 21 = 159 通り
    - - 4 つの頂点を、円のまわりを時計回りに P1、P2、P3、P4 とする。P1 から P2、P2 から P3、P3 から P4、P4 から P1 まで、円のまわりを進む間にある正十二角形の辺の数を、順に a、b、c、d とする。a、b、c、d はどれも 1 以上で、a + b + c + d = 12。a、b、c、d のならびと、P1 が 12 この頂点のどれかを決めると、四角形が 1 つ決まる
      - 四角形が線対称のとき、軸は円の中心を通る（4 つの頂点が全部は軸にのらないので、入れかわる 2 つの頂点があり、軸はその 2 点を結ぶ線を直角に 2 等分する。2 点は中心から同じ長さにあるので、その線は中心を通る）。だから軸は円を 2 つの半円に分け、2 つの半円は軸で折り返すと重なる。だから、軸の上にない頂点は、2 つの半円に同じ数ずつある。軸の上の頂点が 0 こなら半円に 2 こずつ、2 こなら半円に 1 こずつ（軸の上の頂点が 1 こだと、のこり 3 こが同じ数ずつに分けられない。軸は円と 2 点でしか交わらないので、3 こ以上にはならない）。軸の上の 2 こは、のこりの 2 こを両がわの半円に 1 こずつ分けるので、円のまわりでとなり合わない。だから P1 と P3 か、P2 と P4。軸の上に頂点がないとき：半円にのる 2 こは円のまわりでとなり合う。P1、P2 が 1 つの半円、P3、P4 がもう 1 つの半円なら、折り返すと P2 と P3、P1 と P4 が重なるので、P1 から P2 の部分と P4 から P3 の部分が重なって a = c。P2、P3 が 1 つの半円、P4、P1 がもう 1 つの半円なら、P1 と P2、P3 と P4 が重なって b = d。軸の上に頂点が 2 こあるとき：P1 と P3 が軸の上なら、P2 と P4 が入れかわって a = d、b = c。P2 と P4 が軸の上なら、P1 と P3 が入れかわって a = b、c = d
      - 反対に、この 4 つのどれかが成り立つなら、線対称になる。a = c のとき、P2 と P3 を結ぶ線を直角に 2 等分する線（円の中心を通る）で折ると、P2 と P3 が重なる。P1 は P2 から a 辺はなれた所、P4 は P3 から c = a 辺はなれた所にあり、折ると重なる位置だから、P1 と P4 も重なる。b = d も、P1 と P2 を結ぶ線を直角に 2 等分する線で、同じようになる。a = d かつ b = c のとき、2 × a + 2 × b = 12 から a + b = 6 で、P1 から P3 までは辺 6 本分だから、P1 と P3 は直径の両はし。この直径で折ると、P2 と P4 は P1 から a 辺ずつ両がわにあるので重なり、P3 は動かない。a = b かつ c = d のときは、a + c = 6 で、P2 と P4 が直径の両はしになるので、その直径で折る
      - 線対称になる (a, b, c, d) を数える。a = c のならびは、a = 1 のとき b + d = 10 で、b を 1 から 9 のどれかにすれば d も決まるので 9 通り。同じように、a = 2、3、4、5 のときは b + d が 8、6、4、2 で、7、5、3、1 通り。合わせて 9 + 7 + 5 + 3 + 1 = 25 通り。b = d も同じで 25 通り。両方成り立つのは、a + b = 6 の 5 通り。だから、a = c か b = d のならびは 25 + 25 − 5 = 45 通り。a = d かつ b = c は a + b = 6 で 5 通り、a = b かつ c = d は a + c = 6 で 5 通り、両方成り立つのは a = b = c = d = 3 の 1 通りだけだから、5 + 5 − 1 = 9 通り。この 2 組を同時に満たすならびは、どれも 4 つとも等しくなるので、a = b = c = d = 3 の 1 通りだけ。合わせて 45 + 9 − 1 = 53 通り
      - 53 通りのならびそれぞれに、P1 の場所が 12 通りあるので、（ならび、P1 の場所）の組は 53 × 12 通り。1 つの四角形は、P1 を 4 つの頂点のどれにするかで、4 回数えられる（P1 を別の頂点に変えるとならびは回り、a = c と b = d、a = d かつ b = c と a = b かつ c = d がたがいに入れかわるので、4 つの決まりのどれかが成り立つことは変わらない。だから 1 つの四角形は、P1 の 4 通りのどれでも数えられる）。だから四角形の数は 53 × 12 ÷ 4。12 ÷ 4 = 3 を先に計算して、53 × 3 = 159 通り
    note: 考えどころは 3 つ：①4 つの頂点は円の上にあるので、折り返す線（対称の軸）は円の中心を通り、正十二角形の 12 本の軸のどれかになる。軸の上にのる頂点は 0 こか 2 こ（1 こだと残りの 3 こが 2 こずつ入れかわれない）、②軸ごとに「軸をはさんで入れかわる頂点の組」をえらぶと、頂点を通る軸でも辺のまん中を通る軸でも 15 通りで、12 本で 180 通り、③軸を 2 本以上もつ四角形（長方形 12 こ、正方形 3 こ）を何回も数えているので、12 × 1 + 3 × 3 = 21 を引いて 159。2 本目は、軸を使わず、四角形を「頂点の間の辺の数のならび a、b、c、d と P1 の場所」に言いかえて、線対称になるならび（a = c か b = d、または a = d かつ b = c、または a = b かつ c = d）の数 53 を数え、P1 の場所 12 通りをかけて、同じ四角形を 4 回数えた分で 4 でわる（53 × 12 ÷ 4 = 159）。1 本目は図形の軸ごとに数えて重なりを引き、2 本目は数のならびの決まりで数えて出発点の数でわる。どちらも「軸の上に頂点があるかないか」で形を分けて重なりを引くところは同じだが、数えるものが軸と数のならびでちがう。check は、12 この頂点から 4 こをえらぶ 495 通りを全部ためし、「もとと同じでない入れかえで、4 つの点の間の 6 つの長さがすべて変わらないもの」があるものを数える。頂点 i と j の間の長さは、円のまわりを短いほうに数えた辺の数 min((i − j) % 12, (j − i) % 12) で決まる。円の上の 4 点で長さを変えない入れかえは、中心のまわりの回転か折り返しで、回転で重なるのは長方形と正方形だけ（これも線対称）だから、これが線対称な四角形になる。1 本目のように軸を数えない。既出・出典：正多角形の頂点で作る二等辺三角形のこ数を軸ごとに数える入試の定番を、四角形に広げたもの（1 本目はそれを広げたもので、新しいのは長方形と正方形の重なりを引くだん。2 本目の数のならびの道がこの問題の中心）。大会の同じ問いは見つけていない。わな：長方形と正方形の重なりを引くのをわすれて 180 と答える。長方形と正方形を線対称でないとして数えない。軸の上に 2 つの頂点がのる形（たこ形）を落とす。
