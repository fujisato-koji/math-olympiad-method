      - part: わけ
        id: "1b05ae2dcd"
        text: 丸いテーブルに人がすわるとき（全員が同じ向きにずれたものは同じとする）、1 人の席を決めて残りの人をならべれば、すわり方の数が出せます。何人のときでもそう言えるわけを、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 175" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="100" r="30" fill="#c9a36b" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="110" cy="48" r="14" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="3"/><text x="110" y="53" font-size="14" text-anchor="middle" fill="currentColor">ア</text><circle cx="162" cy="100" r="14" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="162" y="105" font-size="14" text-anchor="middle" fill="currentColor">イ</text><circle cx="110" cy="152" r="14" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="110" y="157" font-size="14" text-anchor="middle" fill="currentColor">ウ</text><circle cx="58" cy="100" r="14" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="58" y="105" font-size="14" text-anchor="middle" fill="currentColor">エ</text><text x="134" y="42" font-size="13" text-anchor="start" fill="currentColor">← 席 1</text><text x="250" y="90" font-size="13" text-anchor="middle" fill="currentColor">どのすわり方も</text><text x="250" y="110" font-size="13" text-anchor="middle" fill="currentColor">回していくと…</text></svg>'
        explain: 例：「すわる人の 1 人をアとし、テーブルの席の 1 つを席 1 とする。どのすわり方も、全員を同じ向きにずらしていくと、アが席 1 に来るものがちょうど 1 つある（ずらし方は席の数だけあり、アが席 1 に来るのはそのうち 1 つだけ）。だから、回して同じものをまとめたすわり方と、アが席 1 にいるすわり方は、1 つずつ組になる。アが席 1 にいるすわり方は、残りの人を残りの席に 1 列にならべる数と同じなので、積の法則で数えられる。」と書ければよい。① 何を数えるか（アが席 1 にいるすわり方）を決める、② 1 つずつ組になることをしめす、③ 積の法則で結ぶ、の 3 点がそろっているかを見る。4 人のときに 6 通りとたしかめただけで終わったら、例ではすべての人数をしめせないことを話す。
        hints:
          - text: 1 つのすわり方を回していくと、アはどの席にも来るかな。
