      - part: 今日
        text: 赤玉 2 個、青玉 1 個、白玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 12
        check: "len(set(itertools.permutations('赤赤青白')))"
        hints:
          - 赤玉を置く場所を先に選ぼう。
          - 残った 2 つの場所に、青玉と白玉をどう置くかな。
          - 積の法則を使おう。
        paths:
          - [赤玉の場所 4 × 3 ÷ 2 = 6 通り, 青と白の置き方 2 通り, 6 × 2 = 12 通り]
      - part: 挑戦
        text: 赤玉 3 個、青玉 2 個、白玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 60
        check: "len(set(itertools.permutations('赤赤赤青青白')))"
        hints:
          - 1 個しかない白玉の場所から選ぶと、数が小さくてすむよ。
          - 残った 5 つの場所から、青玉の場所を選ぼう。
          - 残りは全部赤玉になるね。
        paths:
          - [白玉の場所 6 通り, 残り 5 つから青玉の場所 5 × 4 ÷ 2 = 10 通り, 6 × 10 = 60 通り]

  - day: 2
    items:
      - part: 見本
        text: ア、イ、ウ、エの 4 人が、丸いテーブルのまわりの 4 つの席にすわります。全員が同じ向きに 1 つずつ席をずれたものは、同じすわり方とします。すわり方は何通りですか。
        figure: "　ア\nエ　イ\n　ウ"
        explain: 4 人を 1 列に並べると 4 × 3 × 2 × 1 = 24 通りです。けれども、丸いテーブルでは、全員が 1 つずつずれると、だれのとなりにだれがいるかは変わりません。そこで、アの席を 1 つに決めてしまいます。どのすわり方も、回すとアがその席に来るものがちょうど 1 つあるからです。アから右回りに残りの 3 人を並べると、3 × 2 × 1 = 6 通りです。24 通りの並べ方を、回すと同じになる 4 つずつにまとめて、24 ÷ 4 = 6 通りと数えることもできます。輪に並べるときは、1 人を決めて、残りを並べます。
      - part: 思い出す
        text: 赤玉 3 個と青玉 2 個を 1 列に並べます。並べ方は何通りですか。
        answer: 10
        check: "len(set(itertools.permutations('赤赤赤青青')))"
        hints:
          - 5 つの場所のうち、青玉を置く場所を選ぼう。
          - 青玉の場所 2 つの選び方は、組合せで数えられるね。
          - 青玉の場所が決まると、赤玉の場所も決まるかな。
        paths:
          - [5 つの場所から青玉の場所を 2 つ選ぶ, 5 × 4 ÷ 2 = 10 通り]
      - part: 思い出す
        text: 6 人の中から、2 人の代表を選びます。選び方は何通りですか。
        answer: 15
        check: "len(set(itertools.combinations(range(6), 2)))"
        hints:
          - 順番をつけて並べると何通りかな。
          - 同じ 2 人の組を何回ずつ数えているかな。
          - わり算にしよう。
        paths:
          - [並べると 6 × 5 = 30 通り, 2 回ずつ, 30 ÷ 2 = 15 通り]
      - part: 今日
        text: メリーゴーラウンドの 5 つの席に、ア、イ、ウ、エ、オの 5 人が図のようにすわっています。いつも上の席から右回りに読んで並びを書くと、いまは「アイウエオ」です。全員が右回りに 1 つ先の席へずれることを何回でもくり返し、そのたびに並びを書きます。書いた並びがちがえば、ちがう並びとして数えます。「アイウエオ」もふくめて、書ける並びは全部で何通りですか。
        figure: "　　ア\nオ　　　イ\n　エ　ウ"
        answer: 5
        check: "len(set('アイウエオ'[-i % 5:] + 'アイウエオ'[:-i % 5] for i in range(12)))"
        hints:
          - 全員が右回りに 1 つ先の席へずれたら、上の席にはだれが来るかな。
          - 上の席にはオが来るね。ずれたあとも上の席から右回りに読むと、「オアイウエ」と書けるよ。
          - 同じようにずれて書き出し、「アイウエオ」にもどったらそこでやめて、いまの並びもふくめて、書いた並びを数えよう。
        paths:
          - [「アイウエオ」から、全員が 1 つ先の席へずれるたびに、上の席から右回りに読んで書く, 「オアイウエ」「エオアイウ」「ウエオアイ」「イウエオア」と続く, 次でもとの「アイウエオ」にもどるので、そこでやめる。書いた 4 つと、いまの「アイウエオ」とで 5 通り]
          - [上の席にすわる人で分ける, 上の席の人が決まると、右回りの順は変わらないので、書いた並びも 1 つに決まる, 上の席にすわるのはア、イ、ウ、エ、オの 5 人のだれかなので、書ける並びは 5 通り]
        note: 全員が同じ向きにずれたものは同じすわり方でも、書いた並びは 5 通りある（5 回ずれるともとにもどる）。「同じすわり方だから 1 通り」と答えたり、いまの「アイウエオ」をのぞいて 4 通りと答えやすい。
      - part: 今日
        text: 5 人が、丸いテーブルのまわりの 5 つの席にすわります。全員が同じ向きにずれたものは同じすわり方とします。すわり方は何通りですか。
        answer: 24
        check: "len(set(min(p[i:] + p[:i] for i in range(5)) for p in itertools.permutations('アイウエオ')))"
        hints:
          - 1 人の席を決めてしまおう。
          - 残りの人を、その人から右回りに並べると考えよう。
          - 残りは何人で、並べ方は何通りかな。
        paths:
          - [アの席を決める, 残り 4 人を並べる, 4 × 3 × 2 × 1 = 24 通り]
        note: 1 列のときと同じに 5 × 4 × 3 × 2 × 1 と数えると、回して同じになるものを 5 回ずつ数えてしまう。
      - part: 今日
        text: 3 人が輪になって手をつなぎます。全員が同じ向きにずれたものは同じつなぎ方とします。つなぎ方は何通りですか。
        answer: 2
        check: "len(set(min(p[i:] + p[:i] for i in range(3)) for p in itertools.permutations('アイウ')))"
        hints:
          - 1 人の場所を決めよう。
          - 残りの 2 人を、右回りにどう並べるかな。
          - 右回りに ア、イ、ウ と、ア、ウ、イ は同じかな。
        paths:
          - [アを決める, 残り 2 人を並べる 2 × 1 = 2 通り]
      - part: 今日
        text: ア、イ、ウ、エ、オの 5 人が、丸いテーブルのまわりの 5 つの席にすわります。アとイがとなり合うすわり方は何通りですか。全員が同じ向きにずれたものは同じとします。
        answer: 12
        check: "len(set(min(p[i:] + p[:i] for i in range(5)) for p in itertools.permutations('アイウエオ') if abs(p.index('ア') - p.index('イ')) in (1, 4)))"
        hints:
          - となり合うアとイを、ひとまとまりと考えよう。
          - まとまり 1 つと残り 3 人を、輪に並べると何通りかな。
          - まとまりの中で、アとイの並び方は何通りかな。
        paths:
          - [アイをひとまとまりにする, まとまりと 3 人の 4 つを輪に並べる 3 × 2 × 1 = 6 通り, まとまりの中が 2 通りで 6 × 2 = 12 通り]
      - part: 挑戦
        text: 色のちがう 5 個のビーズに糸を通して、首飾りを作ります。回したものと、裏返したものは同じ首飾りとします。首飾りは何通りできますか。
        answer: 12
        check: "len(set(min(min(q[i:] + q[:i] for i in range(5)) for q in (p, p[::-1])) for p in itertools.permutations(range(5))))"
        hints:
          - まず、回したものだけを同じとすると、何通りかな。
          - 首飾りを裏返すと、右回りと左回りが入れかわるね。
          - 裏返すと同じになるものは、何個ずつ組になっているかな。
        paths:
          - [回したものを同じとすると 4 × 3 × 2 × 1 = 24 通り, 裏返すと同じになるものが 2 つずつ組, 24 ÷ 2 = 12 通り]
        note: 輪の並べ方を、さらに裏返しで 2 つずつまとめる。どの並びも、裏返すと自分とは別の並びになる（5 個の色がちがうから）ので、ちょうど 2 でわれる。
    extra:
      - part: 今日
        text: 色のちがう 4 個の玉を、円の上の 4 つの場所に並べます。回して同じになるものは同じとします。並べ方は何通りですか。
        answer: 6
        check: "len(set(min(p[i:] + p[:i] for i in range(4)) for p in itertools.permutations(range(4))))"
        hints:
          - 1 個の玉の場所を決めよう。
          - 残りの玉を、右回りに並べよう。
          - 残りは何個かな。
        paths:
          - [1 個を決める, 残り 3 個を並べる 3 × 2 × 1 = 6 通り]
      - part: 今日
        text: ア、イ、ウ、エの 4 人が輪になって手をつなぎます。アとイがとなり合うつなぎ方は何通りですか。全員が同じ向きにずれたものは同じとします。
        answer: 4
        check: "len(set(min(p[i:] + p[:i] for i in range(4)) for p in itertools.permutations('アイウエ') if abs(p.index('ア') - p.index('イ')) in (1, 3)))"
        hints:
