# C-013 区別と重複のある数え方
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の漢字まじりの文。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 同じものをふくむ並べ方（区別して並べてから同じ並びをまとめる、置く場所を選ぶ）、
#   2 日目 輪に並べる（回して同じものは同じ。1 人の席を決める）、首飾り（裏返しても同じ）、
#   3 日目 同じ種類を何回選んでもよい選び方（○ と仕切り｜の並びにする）、区別のない玉を区別のある箱に入れる、
#   4 日目 わけ（なぜ 2 でわるか、なぜ 1 人の席を決めてよいか、なぜ ○ と｜の並びと同じ数か）、
#   5 日目 C-005（何回でも使える並べ方）・C-006（順列）・C-007（組合せ）と混ぜる、6 日目 確認。
# 前提は C-007 だけ（→ C-006、C-005、N-013、N-014）。3 けたの数（N-009）が前提にないので、C-007 と同じく答えも途中の数も 100 までにした。
#   そのため 5 つ以上のものを全部並べる数（5 × 4 × 3 × 2 × 1 = 120）は出さず、同じものをふくむ並べ方は「置く場所を選ぶ」道を本線にした。
#   6 人以上の輪、6 こから 3 こを選ぶ数（ならべ方が 120）も出さない。
# 文字の式（A-010）も前提にないので、わけは「何人でも」「どの並びも」と言葉で一般に書く（段 4 の ③ の筋道を、文字を使わずに書く）。
#   explain には、① 何を数えるかを決める、② どう対応させるか・何回ずつ数えたかを示す、③ 約束した事実（積の法則、組合せの数）で結ぶ、の 3 点を書いた。
#   1 問目は代表の例で書く ②。
# 記号（ₙCᵣ、ₙHᵣ、n!）は使わない（二項係数の記号は C-015）。対応させて数える方法そのものは C-014 で広げる。
# 輪の図は全角の文字と全角の空白で、席を上下左右に置いて描く。
# check：同じものをふくむ並べ方は set(itertools.permutations(…)) の数。輪は、回したものの中でいちばん小さい並びにそろえてから数え、
#   首飾りは裏返したものもそろえる。何回でも選べる選び方は itertools.combinations_with_replacement か、個数の組を itertools.product で作って数える。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-010 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# ただし腕だめしの最難関（正十二角形の頂点で作る線対称な四角形）だけは例外で、uses に G-053、C-008、N-009、N-074 を挙げて、線対称（対称の軸）と、重なりをひく数え方（C-008）と、100 をこえる数（159、180 など）と、2 けた × 2 けたのかけ算（15 × 12 = 180）を使う。

id: C-013
days:
  - day: 1
    items:
      - part: 見本
        text: 赤玉 2 個と青玉 1 個を 1 列に並べます。並べ方は何通りですか。同じ色の玉は区別しません。
        figure: "🔴🔴🔵\n🔴🔵🔴\n🔵🔴🔴"
        explain: 2 個の赤玉に赤 1、赤 2 と名前をつけて区別すると、3 個の並べ方は 3 × 2 × 1 = 6 通りです。けれども、赤 1 と赤 2 を入れかえた 2 つの並び（赤 1 赤 2 青 と 赤 2 赤 1 青）は、名前を消すと同じ並びに見えます。どの並びも 2 回ずつ数えているので、6 ÷ 2 = 3 通りです。別の数え方もあります。3 つの場所のうち、青玉を置く場所を 1 つ選べば並びが決まるので、3 通りです。同じものをふくむ並べ方は、「区別して数えてから、同じになるものの数でわる」か、「同じものを置く場所を選ぶ」で数えます。
      - part: 思い出す
        text: 5 人の中から、2 人の係を選びます。選び方は何通りですか。
        answer: 10
        check: "len(set(itertools.combinations(range(5), 2)))"
        hints:
          - 順番をつけて並べると何通りかを考えよう。
          - 同じ 2 人の組を何回ずつ数えているかを考えよう。
          - 並べ方の数をその回数でわろう。
        paths:
          - [並べると 5 × 4 = 20 通り, どの組も 2 回ずつ, 20 ÷ 2 = 10 通り]
      - part: 思い出す
        text: 4 人が 1 列に並びます。並び方は何通りですか。
        answer: 24
        check: "len(set(itertools.permutations(range(4))))"
        hints:
          - 先頭は何通りあるかを考えよう。
          - 1 人決めるごとに、残りの人は 1 人ずつ減るね。
          - 積の法則を使おう。
        paths:
          - [4 × 3 × 2 × 1 = 24 通り]
      - part: 今日
        text: 赤玉 2 個と青玉 2 個に、赤 1、赤 2、青 1、青 2 と名前をつけて、1 列に並べます。名前を消すと「赤青赤青」に見える並びは、名前つきの並びで何通りありますか。
        figure: "🔴🔵🔴🔵"
        answer: 4
        check: "sum(1 for p in itertools.permutations(('赤1', '赤2', '青1', '青2')) if all(p[i][0] == '赤青赤青'[i] for i in range(4)))"
        hints:
          - 赤が入る 2 つの場所に、赤 1 と赤 2 をどう入れるか考えよう。
          - 青が入る 2 つの場所にも、青 1 と青 2 を入れよう。
          - 赤の入れ方と青の入れ方を、積の法則でかけ合わせよう。
        paths:
          - [赤の場所への入れ方 2 通り, 青の場所への入れ方 2 通り, 2 × 2 = 4 通り]
          - [「赤 1 青 1 赤 2 青 2」をもとに、赤どうし・青どうしの入れかえを書き出す, 赤 2 青 1 赤 1 青 2 など 4 つの並びが書ける, 4 通り]
        note: 名前を消すと同じに見える並びは、赤の入れかえ 2 通りと青の入れかえ 2 通りの両方で重なる。赤だけの 2 でわって終わりにしないための、小さな足場。
      - part: 今日
        text: 赤玉 2 個と青玉 2 個を 1 列に並べます。並べ方は何通りですか。
        answer: 6
        check: "len(set(itertools.permutations('赤赤青青')))"
        hints:
          - 4 つの場所のうち、赤玉を置く場所を選ぶと考えよう。
          - 赤玉を置く 2 つの場所の選び方は、組合せで数えられるね。
          - 赤玉の場所が決まれば、青玉の場所も決まるかな。
        paths:
          - [4 つの場所から赤玉の場所を 2 つ選ぶ, 4 × 3 ÷ 2 = 6 通り]
          - [区別すると 4 × 3 × 2 × 1 = 24 通り, 赤どうし・青どうしの入れかえで 2 × 2 = 4 回ずつ数えている, 24 ÷ 4 = 6 通り]
        note: 2 でわって 12 としやすい。赤どうしの入れかえと青どうしの入れかえの両方で、同じ並びが 4 回ずつ出てくる。
      - part: 今日
        text: 赤玉 3 個と青玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 4
        check: "len(set(itertools.permutations('赤赤赤青')))"
        hints:
          - 青玉は 1 個だけだね。
          - 青玉を置く場所を選ぶと考えよう。
          - 青玉の場所が決まると、並びは決まるかな。
        paths:
          - [4 つの場所から青玉の場所を 1 つ選ぶ, 4 通り]
      - part: 今日
        text: 「あ」「あ」「い」「う」の 4 枚のカードを 1 列に並べます。並べ方は何通りですか。
        answer: 12
        check: "len(set(itertools.permutations('ああいう')))"
        hints:
          - 2 枚の「あ」を区別すると、並べ方は何通りかな。
          - 2 枚の「あ」を入れかえた並びは、同じに見えるね。
          - 同じ並びを何回ずつ数えているかを考えよう。
        paths:
          - [区別すると 4 × 3 × 2 × 1 = 24 通り, 「あ」の入れかえで 2 回ずつ, 24 ÷ 2 = 12 通り]
          - [「あ」の場所を 2 つ選ぶ 4 × 3 ÷ 2 = 6 通り, 残り 2 つの場所に「い」「う」を並べる 2 通り, 6 × 2 = 12 通り]
      - part: 挑戦
        text: 赤玉 2 個、青玉 2 個、白玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 30
        check: "len(set(itertools.permutations('赤赤青青白')))"
        hints:
          - まず、5 つの場所から赤玉の場所を選ぼう。
          - 残った場所から、青玉の場所を選ぼう。
          - 2 つの選び方を、積の法則でかけよう。
        paths:
          - [赤玉の場所 5 × 4 ÷ 2 = 10 通り, 残り 3 つから青玉の場所 3 × 2 ÷ 2 = 3 通り, 10 × 3 = 30 通り]
          - [白玉の場所 5 通り, 残り 4 つから赤玉の場所 6 通り, 5 × 6 = 30 通り]
        note: どの色から場所を選んでも、同じ 30 通りになる。選ぶ順を変えて確かめるとよい。
    extra:
      - part: 今日
        text: 赤玉 4 個と青玉 1 個を 1 列に並べます。並べ方は何通りですか。
        answer: 5
        check: "len(set(itertools.permutations('赤赤赤赤青')))"
        hints:
          - 青玉は 1 個だけだね。
          - 青玉を置く場所を選ぼう。
          - 場所はいくつあるかな。
        paths:
