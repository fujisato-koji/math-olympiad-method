        text: 赤玉 2 個と青玉 1 個の並べ方は、3 × 2 × 1 = 6 を 2 でわって 3 通りです。なぜ 2 でわるのかを、赤玉に名前をつけて書きましょう。
        figure: "赤1 赤2 青　赤2 赤1 青\n赤1 青 赤2　赤2 青 赤1\n青 赤1 赤2　青 赤2 赤1"
        explain: 例：「赤玉を赤 1、赤 2 と区別すると、3 個の並べ方は 3 × 2 × 1 = 6 通り。名前を消すと、赤 1 と赤 2 を入れかえた 2 つの並び（図の左と右）が同じ並びになる。どの並びも、ちょうど 2 回ずつ数えている。だから 6 ÷ 2 = 3 通り。」と書ければよい。「どの並びも同じ 2 回ずつ」と、回数がそろっていることが書けているかを見る（そろっていないとわり算はできない）。C-007 で 2 人を選ぶとき 2 でわったのと同じ考え方であることにもふれる。
        hints:
          - 赤 1 と赤 2 を区別すると、何通りかな。
          - 図の左と右の並びは、名前を消すとどうなるかな。
          - 「どの並びも〜回ずつ数えているから」を使って書こう。
        paths:
          - [区別すると 6 通り, 名前を消すと 2 つずつ同じになる, どれも 2 回ずつ, 6 ÷ 2 = 3 通り]
