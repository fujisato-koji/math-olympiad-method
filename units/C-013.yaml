          - [1 列のならべ方（席 1 から右回りに読む）を考える, 1 つのすわり方を回すと、ちがう 1 列のならべ方が人数と同じ数だけ出る, すわり方の数は 1 列のならべ方 ÷ 人数, これは 1 人を決めて残りをならべる数と同じ]
