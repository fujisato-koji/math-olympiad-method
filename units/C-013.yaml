        explain: 例：「買い方を、りんご、みかん、かきの順に ○ を並べ、種類の境目に ｜ を入れて表すとする。どの買い方からも、○ 4 個と ｜ 2 本の並びが 1 つだけできる。反対に、○ 4 個と ｜ 2 本のどの並びも、1 本目の ｜ の左の ○ をりんご、2 本の間をみかん、右をかきと読めば、1 つの買い方になる。買い方と並びは 1 つずつ組になるので、数は同じ。並びは 6 つの場所から ｜ の場所を 2 つ選ぶので 6 × 5 ÷ 2 = 15 通り。」と書ければよい。① 表し方を決める、② 両方向に 1 つずつ組になる（どちらからも 1 つだけ決まる）ことを示す、③ 組合せの数で結ぶ、の 3 点を見る。｜ が並んだ所（｜｜）は「その種類を買わない」ことにふれられれば、なおよい。
        hints:
          - 買い方から、○ と ｜ の並びはいくつできるかな。
