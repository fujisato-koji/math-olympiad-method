        text: 3 + 4 + 5 + 6 + 8 は偶数ですか、奇数ですか。計算しないで考えましょう。
        choices: [偶数, 奇数]
        answer: 偶数
        check: "'偶数' if (3 + 4 + 5 + 6 + 8) % 2 == 0 else '奇数'"
        hints:
          - たす数の中に、奇数はいくつあるかな。
          - 奇数の《余り》の 1 つずつを、2 つずつ組にしてみよう。
          - 奇数の数が偶数こなら、和はどうなったかな。
        paths:
          - [奇数は 3 と 5 の 2 こ, 余りが 2 つで組になる, 偶数]
