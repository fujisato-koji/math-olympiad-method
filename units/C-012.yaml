# C-012 一筆書きとグラフ
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く（L-005 と同じ）。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 点と線の図（グラフ）、点に集まる線の数、奇点（集まる線の数が奇数の点）、一筆書きできるか・どこから始めるか、
#   2 日目 線を 1 本足してできるようにする、川と橋の地図を点と線にする、集まる線の数の合計、何回に分けてかくか、
#   3 日目 わけ（なぜ途中の点は偶数か、なぜ奇点から始めるか、なぜ合計は偶数か）、
#   4 日目 L-005（和の偶奇、交互に変わる、輪に交互に並べる）と混ぜる。あく手を点と線で考える。つながっていない図、5 日目 確認。
# 前提は L-005 だけ（→ N-008、N-007）なので、数は 100 まで、たし算とひき算だけ。合計を半分にするのは「同じ数ずつ 2 つに分ける」と言う。
# 一筆書きの決まり「つながっている図は、奇点が 0 こか 2 このときにかけて、それ以外はかけない」は見本で事実として教える。
#   わけの日に示すのは「かけるなら奇点は 0 こか 2 こ」の向きだけ。0 こか 2 こなら必ずかけることの証明（オイラーの定理）は C-022 にまわす。
#   「できる」と答える問題は、実際のかき方を paths に書いた。
# 「グラフ」「次数」の言葉は C-022 で使うので、ここでは「点と線の図」「点に集まる線の数」と言い、言葉は奇点（きてん）だけを教える。
# 点と線の図は svg で描き、点の名前を ア、イ、ウ… で書く。線どうしは点のほかでは交わらないように描いた。
#   同じ 2 点を結ぶ 2 本目の線は弧で描く。川と橋の地図は、川を淡い青、島を淡い黄で塗り、橋を太い線で描く。
# check：一筆書きは、残りの線から今の点につながる線を 1 本ずつ選んでたどる自分を呼ぶ lambda で、全部の線をなぞれるかを調べる。
#   始めた点にもどるかは、最後の点が始めの点と同じかも調べる。何回に分けるかは、線を 2 組に分ける分け方を全部ためす。
#   点に集まる線の数は、線の文字列の中にその点の字が何回出るかで数える。あく手は、5 人のあく手の組を全部（2 の 10 乗通り）ためす。

