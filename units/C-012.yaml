        answer: ついている
        check: "'ついている' if 7 % 2 == 1 else '消えている'"
        hints:
          - 1 回おすと、どうなるかな。
          - 2 回おすと、はじめと同じになるね。
          - 7 は偶数かな、奇数かな。
        paths:
          - [2 回ごとにはじめにもどる, 7 回は奇数, ついている]
