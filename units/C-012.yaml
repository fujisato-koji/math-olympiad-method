        explain: 点に集まる線の数を書くと、ア 2、イ 3、ウ 3、エ 2、オ 2 です。集まる線の数が奇数の点を奇点（きてん）といいます。この図の奇点はイとウの 2 こです。つながっている図は、奇点が 0 こか 2 このときに一筆書きできて、それ以外のときはできません。奇点が 2 このときは、一方の奇点から始めて、もう一方の奇点で終わります。たとえば イ → ア → ウ → イ → エ → オ → ウ とかけます。
