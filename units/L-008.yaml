          - 犬が決まったら、くまとうさぎの行を見直そう。
        paths:
          - [ねこは 🍌, 犬は 🍎 でも 🍇 でも 🍌 でもないので 🍓, くまは 🍎 でないので 🍇, 🍇 はくま]
          - [🍇 の列を見る, 犬は ❌、ねこは 🍌 なので ❌, うさぎとくまのどちらか, うさぎが 🍇 だと くまは 🍎 になりヒントに合わない, くま]
        note: 「だれが 🍇 か」とたずねているので、たての列で考えることもできる。行と列の両方から見られるのが表のよいところ。
      - part: 挑戦
        text: 犬、ねこ、うさぎ、くまが、⚽ 🎈 📕 🎁 を 1 つずつ持っています。犬は ⚽ でも 🎈 でもありません。ねこは ⚽ でも 📕 でも 🎁 でもありません。うさぎは 🎈 でも 📕 でも 🎁 でもありません。くまは 🎁 ではありません。犬が持っているのはどれですか。
        figure: "　⚽🎈📕🎁\n🐶⬜⬜⬜⬜\n🐱⬜⬜⬜⬜\n🐰⬜⬜⬜⬜\n🐻⬜⬜⬜⬜"
