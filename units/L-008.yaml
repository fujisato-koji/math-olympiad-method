# L-008 条件を整理する推理
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は学年に合う漢字で書く。
# 前提は L-003（本当とうその推理）で、たどっても L-002、L-001、N-001 だけなので、数は数えるだけで 10 まで。
# 人の代わりにどうぶつ（犬、ねこ、うさぎ、くま、さる、ぶた、かえる、ねずみ）を使う。表の図は 🐶🐱🐰🐻🐵🐷🐸 で行を表す。
# 表の図は、横の並びがどうぶつ、たての並びが物や色。⬜ はまだ分からない所（⭕ は「そう」、❌ は「ちがう」と、子が紙に書く）。
# 日の並びは地図の既定（導入、練習、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：4 ひきと 4 つの物の表を ⭕ と ❌ でうめる。たてにも横にも ⭕ は 1 つだけ。❌ が 3 つの行は残りが ⭕。
#   2 日目 練習：2 つのことがら（ぼうしの色とくだもの、順位とゼッケン）を 2 つの表にして、「青いぼうし＝うさぎ」のようにつなぐ。
#                順番の推理を、ヒント 3〜4 つで 4〜5 ひきに広げる（すぐ前、あいだに何びき、より前）。
#   3 日目 わけ：代表の例で、❌ が 3 つなら決まるわけ、ヒントに合う場合が 2 つあると決まらないわけ、
#                ためしに入れてヒントに合わない場合を消すわけを文に書く。
#   4 日目 混ぜる：L-003 の型（本当とうそ）と混ぜる。ことばがほかのどうぶつをさす推理（「〇〇はうそつき」）、
#                うそが 1 ぴきだけの物の推理を表で整理する。
#   5 日目 確認。
# 「必要条件と十分条件」のような言葉は L-013 なので使わない。
# check は、ありうる組をすべて並べ（itertools.permutations、product）、ヒントに合うものだけを残す（L-002、L-003 の形）。
# たずねた答えが 1 つに決まらないときは「きまらない」を返すので、答えが 1 つに決まることも確かめられる。
# 正直者とうそつきは、それぞれが正直者かを True と False の組で全部作り、ことばが本当かどうかが正直者かどうかと合う組だけを残す。

id: L-008
days:
  - day: 1
    items:
      - part: 見本
        text: 犬、ねこ、うさぎ、くまが、🍎 🍌 🍇 🍓 を 1 つずつ食べました。ヒントは「犬は 🍎」「ねこは 🍌 でも 🍇 でもない」「くまは 🍇 ではない」です。表に ⭕ と ❌ を書いて整理しましょう。
        figure: "　🍎🍌🍇🍓\n🐶⬜⬜⬜⬜\n🐱⬜⬜⬜⬜\n🐰⬜⬜⬜⬜\n🐻⬜⬜⬜⬜"
        explain: 犬の 🍎 に ⭕ を書くと、犬の横の残りと、🍎 のたての残りは全部 ❌ になります。ねこは 🍌 と 🍇 も ❌ なので、❌ が 3 つになり、残った 🍓 が ⭕ です。くまは 🍇 が ❌ で、🍎 と 🍓 はもう決まっているので 🍌 が ⭕。最後にうさぎは 🍇 です。どの行にも、どの列にも ⭕ は 1 つだけになります。
      - part: 思い出す
        text: 🍪 を食べたのは、犬、ねこ、うさぎのだれか 1 ぴきです。犬「ねこが食べたよ」、ねこ「ぼくじゃないよ」、うさぎ「犬が食べたよ」。うそをついているのは 1 ぴきだけです。食べたのはだれですか。
        figure: 🐶🐱🐰🍪
        choices: [犬, ねこ, うさぎ]
        answer: 犬
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([x for x in ['犬', 'ねこ', 'うさぎ'] if [x == 'ねこ', x != 'ねこ', x == '犬'].count(False) == 1])"
        hints:
          - 犬が食べたとして、1 ぴきずつ本当かうそか調べよう。
          - 次はねこ、その次はうさぎが食べたとして調べよう。
          - うそがちょうど 1 ぴきになるのはどれかな。
        paths:
          - [犬とすると うそは犬だけ, ねことすると うそはねことうさぎ, うさぎとすると うそは犬とうさぎ, 犬]
      - part: 思い出す
        text: さるは、いつもうそしか言いません。さるが「ぼくのかさは青い」と言いました。かさは、青か黄のどちらかです。さるのかさは何色ですか。
        figure: 🐵
        choices: [青, 黄]
        answer: 黄
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([x for x in ['青', '黄'] if (x == '青') == False])"
        hints:
          - さるの言ったことは、本当かな、うそかな。
          - 「青い」がうそなら、かさは青かな。
          - 青でないほうの色はどれかな。
        paths:
          - [さるはうそしか言わない, 「青い」はうそ, 黄]
      - part: 今日
        text: 犬、ねこ、うさぎ、くまが、⚽ 🎈 📕 🎁 を 1 つずつ持っています。ねこは ⚽ です。犬は 🎈 でも 📕 でもありません。うさぎは 📕 ではありません。くまが持っているのはどれですか。
        figure: "　⚽🎈📕🎁\n🐶⬜⬜⬜⬜\n🐱⬜⬜⬜⬜\n🐰⬜⬜⬜⬜\n🐻⬜⬜⬜⬜"
        choices: [⚽, 🎈, 📕, 🎁]
        answer: 📕
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[3] for p in itertools.permutations('⚽🎈📕🎁') if p[1] == '⚽' and p[0] not in '🎈📕' and p[2] != '📕'])))"
        hints:
          - ねこの ⚽ に ⭕ を書いて、⚽ のたての残りに ❌ を書こう。
          - 犬の行で、❌ でないのはどれかな。
          - うさぎ、くまの順に、残ったものを決めよう。
        paths:
          - [ねこは ⚽, 犬は 🎈 でも 📕 でも ⚽ でもないので 🎁, うさぎは 📕 ではないので 🎈, くまは 📕]
        note: ⭕ を 1 つ書いたら、同じ行と同じ列の残りに ❌ を書くのをわすれやすい。1 つ決めるたびに、たてと横を見直させる。
      - part: 今日
        text: 犬、ねこ、うさぎ、くまが、赤・青・黄・緑のぼうしを 1 つずつかぶっています。ねこは赤です。犬は青でも緑でもありません。くまは緑ではありません。うさぎのぼうしは何色ですか。
        figure: "　🟥🟦🟨🟩\n🐶⬜⬜⬜⬜\n🐱⬜⬜⬜⬜\n🐰⬜⬜⬜⬜\n🐻⬜⬜⬜⬜"
        choices: [赤, 青, 黄, 緑]
        answer: 緑
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[2] for p in itertools.permutations(['赤', '青', '黄', '緑']) if p[1] == '赤' and p[0] not in ['青', '緑'] and p[3] != '緑'])))"
        hints:
