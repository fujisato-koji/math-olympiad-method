          - 犬の行の ❌ を数えよう。残りは何色かな。
          - くまの行も同じように見て、最後にうさぎを決めよう。
        paths:
          - [ねこは赤, 犬は青でも緑でも赤でもないので黄, くまは緑でも赤でも黄でもないので青, うさぎは緑]
      - part: 今日
        text: 犬、ねこ、うさぎ、くまが、🍎 🍌 🍇 🍓 を 1 つずつ食べました。ねこは 🍌 です。犬は 🍎 でも 🍇 でもありません。うさぎは 🍓 ではありません。くまは 🍎 ではありません。🍇 を食べたのはだれですか。
        figure: "　🍎🍌🍇🍓\n🐶⬜⬜⬜⬜\n🐱⬜⬜⬜⬜\n🐰⬜⬜⬜⬜\n🐻⬜⬜⬜⬜"
        choices: [犬, ねこ, うさぎ, くま]
        answer: くま
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([['犬', 'ねこ', 'うさぎ', 'くま'][p.index('🍇')] for p in itertools.permutations('🍎🍌🍇🍓') if p[1] == '🍌' and p[0] not in '🍎🍇' and p[2] != '🍓' and p[3] != '🍎'])))"
        hints:
