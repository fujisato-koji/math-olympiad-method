# H-064 物の重さと体積
#
# 水準 2・5 日。かたちを かえても 分けても おもさは 同じ、同じ 大きさ（かさ）でも なにで できて いるかで おもさが ちがう、はかりで g を 読む、を あつかう。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。1 日目 かたちを かえる・分ける（てんびんと はかり）、2 日目 同じ 大きさで ちがう もの と はかりの 目もり、
#   3 日目 わけ（たしも とりも しなければ おもさは 同じ）、4 日目 A-001（2 つの てんびん、つりあいで とりかえる）と G-046（はかりの 目もり、ひき算）を まぜる、5 日目 確認。
# 図の約束：てんびんは A-001 と 同じ 上皿てんびん（おもい ほうの さらが 下がる）。はかりは G-046 と 同じ 目もり（1 まわり 100 g、小さい 目もり 1 つ 2 g、はりは あか）。
#   ねんどは みどり。きいろの ふだは はかった おもさ、てんせんの ふだ「? g」は たずねる おもさ。むらさきの わは 見る ところ、みずいろの てんせんは つりあった ときの さらの 高さ。
#   つみきは 1 つの 図の 中で 同じ 大きさに かき、てつ（こい はいいろ）、アルミ（うすい はいいろに 水色の わく）、木（ちゃいろと もくめ）で かき分けた。テープの 図は 2 年の たし算・ひき算と 同じ。
# おもさの 数：2 cm ほどの つみきで てつ 66 g、アルミ 22 g、木 4 g と し、てつ 1 こと アルミ 3 こが つりあう ように そろえた（じっさいの てつは アルミの ほぼ 3 ばい）。
#   たいじゅうけいの 24 kg は、kg を「おもい ものに つかう たんい」と して 読むだけ（G-046 と 同じ あつかい）。
# 腕だめし（離）は 2 問とも 読み取り（はかりの 目もりと 分けた おもさ、2 つの てんびんで とりかえ）。
# すがたが かわる（とける・こおる、H-002・H-060）、水に とかした ときの おもさ、密度の 数（H-007）は ここでは 問わない。

id: H-064
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          ねんどを はかりで はかると 50 g でした。
          ひらたく しても、3 つに 分けて ぜんぶ のせても、50 g の ままです。
          かたちを かえても、分けても、おもさは かわりません。
          きいろの ふだは、はかった おもさです。
