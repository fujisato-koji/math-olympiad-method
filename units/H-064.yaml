ity=".9"/><circle cx="268" cy="78" r="12" fill="#7bc96f" fill-opacity=".6" stroke="currentColor" stroke-width="2"/><path d="M261.4 76.2Q262 71.4 266.8 70.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-opacity=".9"/><rect x="245.3" y="128" width="45.4" height="24" rx="6" fill="#f3c969" fill-opacity=".5" stroke="currentColor" stroke-width="1.5"/><text x="268" y="145" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">50 g</text><text x="268" y="178" font-size="14" text-anchor="middle" fill="currentColor">3 つに 分けた</text></svg>'
        explain: |-
          ねんどを たしたり とったり しない かぎり、まるめても、ひらたく しても、ほそながく しても、いくつに 分けても、ぜんぶの おもさは かわりません。かたちが かわっても、ねんどの りょう（ぜんぶで どれだけ あるか）は かわらないからです。
          こどもは「ひらたく すると 大きく 見えるから おもく なる」「ほそく すると かるく なる」と 思いがちです。おうちの はかりで、ねんどや アルミホイルの かたちを かえて はかって みると よい。はかりの 小さい 目もり 1 つは 2 g で、G-046 と 同じです。
