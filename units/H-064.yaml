        explain: |-
          同じ 大きさ（かさ）でも、なにで できて いるかで おもさが ちがいます。てつは 木より 中みが ぎっしり つまって いて、同じ 大きさなら ずっと おもく なります。
          こどもは「大きい ほうが おもい」と 思いがちです。おもさは 見た 大きさで きめずに、てんびんや はかりで たしかめます。おうちでは、同じ コップに 水と すなを 同じ 高さまで 入れて、はかりで くらべて みると よい。
