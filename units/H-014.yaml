        explain: 電子式は、原子のいちばん外側の電子（外の電子）を点で書いたもの。点は上・右・下・左に 1 つずつ置き、5 つ目からは組にする。外の電子が 8 こ（ヘリウムは 2 こ）そろうと安定で、ほかの原子は電子を出す・もらう・分け合うことで、この形に近づく。これが原子が結びつく理由。
