        explain: 金ぞくでは、外側の電子がそれぞれの原子からはなれて、全体に広がる。動き回る自由電子がプラスのイオンをまとめるので、電気を通し、たたいても切れずにのびる。
      - part: 見本
        text: NH₃ の N には、結合に使っていない電子の組（ひ共有電子対）がある。この組を N だけが出して、電子のない H⁺ と共有すると、NH₄⁺ になる。このように、どちらか一方の原子だけが電子の組を出す結びつきを配位結合という。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="86.6" y1="92.9" x2="58.4" y2="69.1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="86.6" y1="107.1" x2="58.4" y2="130.9" fill="none" stroke="currentColor" stroke-width="2"/><line x1="95" y1="111" x2="95" y2="141" fill="none" stroke="currentColor" stroke-width="2"/><text x="95" y="105.2" font-size="15" text-anchor="middle" fill="currentColor">N</text><text x="50" y="67.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="50" y="143.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><text x="95" y="157.2" font-size="15" text-anchor="middle" fill="currentColor">H</text><circle cx="110" cy="94" r="3.4" fill="#e8575a"/><circle cx="110" cy="106" r="3.4" fill="#e8575a"/><line x1="135" y1="100" x2="190" y2="100" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="200,100 190,105 190,95" fill="currentColor"/><text x="168" y="84" font-size="14" text-anchor="middle" fill="currentColor">電子の組</text><circle cx="240" cy="100" r="22" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="236.5" y="105" font-size="14" text-anchor="middle" fill="currentColor">H</text><text x="245.2" y="97" font-size="13" text-anchor="start" fill="currentColor">+</text><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">N だけが出す → 配位結合</text></svg>'
        explain: 配位結合も共有結合の仲間。できたあとの NH₄⁺ では、4 本の N−H はどれも同じで、どれが配位結合だったか見分けがつかない。H₂O に H⁺ が結びつく H₃O⁺ も同じしくみ。
