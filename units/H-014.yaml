#
# 段 4・水準 2・7 日。電子式（外の電子を点で）、イオン結合、共有結合と構造式、金属結合と配位結合、わけ、混ぜる、確認。
id: H-014
days:
  - day: 1
    items:
      - part: 見本
        text: 原子のいちばん外側にある電子（外の電子）を、原子の記号の周りに点で書いたものが電子式。Na は外の電子が 1 こだから、点も 1 つ。ネオンやアルゴンの仲間（きガス）は、外の電子が 8 こ（ヘリウムは 2 こ）で安定。ほかの原子も、この形になろうとして結びつく。
