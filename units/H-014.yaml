  - day: 4
    items:
      - part: 見本
        text: 金ぞくの原子は、外側の電子を手放しやすい。手放した電子は、どの原子のものでもなく、金ぞくの中を自由に動く（自由電子）。プラスのイオンを、自由電子がまとめてつなぎ止める。この結びつきが金ぞく結合。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="67.6" y="29.6" width="184.8" height="140.8" rx="8" fill="#c8ccd6" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/><circle cx="94" cy="56" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="94" y="61" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="138" cy="56" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="138" y="61" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="182" cy="56" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="182" y="61" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="226" cy="56" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="226" y="61" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="94" cy="100" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="94" y="105" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="138" cy="100" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="138" y="105" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="182" cy="100" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="182" y="105" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="226" cy="100" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="226" y="105" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="94" cy="144" r="15" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="94" y="149" font-size="16" text-anchor="middle" fill="currentColor">+</text><circle cx="138" cy="144" r="15" fill="#f08080" fill-opacity="0.