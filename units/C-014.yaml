# C-014 対応させて数える
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の漢字まじりの文。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 数えにくいものを、1 つずつ組になる数えやすいものに言いかえる（勝ちぬき戦の試合 ↔ 負けたチーム、
#          円の上の点を結ぶ線の交点 ↔ 4 点の選び方、直線の交点 ↔ 2 本の選び方、何人かを選ぶ選び方 ↔ ○× の並び）、
#   2 日目 長方形 ↔ 縦線 2 本と横線 2 本、順番のある和 ↔ 仕切りを入れるか入れないか、1 個以上ずつ分ける ↔ ○ の間の仕切り、
#   3 日目 わけ（なぜ試合の数と負けたチームの数が同じか、なぜ交点と 4 点の選び方が同じ数か、なぜ和の表し方が 2 × 2 × … か）、
#   4 日目 C-013（同じものをふくむ並べ方、何回でも選べる選び方、輪）と C-007（組合せ）と混ぜる、5 日目 確認。
# 前提は C-013 だけ（→ C-007、C-006、C-005）。C-013 と同じく、3 けたの数（N-009）が前提にないので答えも途中の数も 100 までにした
#   （7 こから 3 こを選ぶ数のように、並べ方が 100 をこえるものは出さない）。累乗（A-009）も前提にないので 2 × 2 × 2 × 2 と書く。
# 文字の式（A-010）が前提にないので、わけは言葉で一般に書く（C-013 の頭の注と同じ 3 点）。1 問目は代表の例で書く ②。
# 道順を右と上の並びに対応させる数え方は、道順（C-004）が前提にないので出さない（C-015 で扱う）。
# 円の上の点は、どの 3 本の線も 1 点で交わらないように、間をそろえずに置いた（正六角形にすると、まん中で 3 本が交わる）。
# 図：格子と円の上の点は svg。勝ちぬき戦の図はかかず、文だけで出す（組み方によらないことを言うため）。
# check：勝ちぬき戦は、毎回 2 チームずつ組にして試合をし、余った 1 チームは次へ進むとして、試合の数を足していく。
#   線の交点は、2 本の線の両はしが円の上で交互に並ぶ組を数える。長方形は、左上と右下のマスの組を全部ためす。
#   和の表し方と分け方は、itertools.product で数の並びを全部作って数える。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-009、A-010 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: C-014
days:
  - day: 1
    items:
      - part: 見本
        text: 8 チームが勝ちぬき戦（トーナメント）をします。引き分けはなく、負けたチームはそこで終わりです。優勝が決まるまでに、試合は全部で何回ありますか。
        explain: 試合を 1 回すると、負けるチームがちょうど 1 つ出ます。負けたチームはもう試合をしないので、同じチームが 2 回負けることはありません。優勝したチーム以外の 7 チームは、どれもどこかで 1 回だけ負けます。だから「試合」と「負けたチーム」は 1 つずつ組になり、試合の数は負けたチームの数と同じ 7 回です。組み合わせ表をかいて 4 + 2 + 1 と数えなくても、組み方によらずに答えが出ます。数えにくいものを、1 つずつ組になる数えやすいものに言いかえて数えることを「対応させて数える」といいます。
      - part: 思い出す
        text: 赤玉 3 個と青玉 2 個を 1 列に並べます。並べ方は何通りですか。
        answer: 10
        check: "len(set(itertools.permutations('赤赤赤青青')))"
        hints:
          - 青玉を置く場所を選ぼう。
          - 5 つの場所から 2 つを選ぶ数だね。
          - 組合せの数え方を使おう。
        paths:
          - [5 つの場所から青玉の場所を 2 つ, 5 × 4 ÷ 2 = 10 通り]
      - part: 思い出す
        text: りんご、みかん、かきの 3 種類のくだものを、合わせて 4 個買います。買わない種類があってもかまいません。買い方は何通りですか。
        answer: 15
        check: "len(set(itertools.combinations_with_replacement('りみか', 4)))"
        hints:
          - 4 個を ○ で、種類の境目を ｜ で表そう。
          - ○ 4 個と ｜ 2 本を並べると考えよう。
          - 6 つの場所から ｜ の場所を選ぼう。
        paths:
          - [○ 4 個と ｜ 2 本, 6 つの場所から 2 つ, 6 × 5 ÷ 2 = 15 通り]
      - part: 今日
        text: 13 チームが勝ちぬき戦をします。引き分けはなく、不戦勝で次に進むチームもあります。優勝が決まるまでに、試合は全部で何回ありますか。
        answer: 12
        check: "(lambda f: f(f, 13))(lambda f, n: 0 if n == 1 else n // 2 + f(f, n - n // 2))"
        hints:
          - 試合を 1 回すると、負けるチームはいくつ出るかな。
          - 優勝チームのほかは、どのチームも何回負けるかな。
          - 試合の数と、負けたチームの数をくらべよう。
        paths:
          - [1 試合で 1 チームが負ける, 優勝以外の 12 チームが 1 回ずつ負ける, 試合は 12 回]
          - [1 回戦 6 試合（1 チーム不戦勝）, 2 回戦 3 試合（1 チーム不戦勝）, 準決勝 2 試合、決勝 1 試合, 6 + 3 + 2 + 1 = 12 回]
        note: 不戦勝があると組み合わせ表で数えにくい。負けたチームの数に言いかえると、組み方によらず 13 − 1 で決まる。
      - part: 今日
        text: 円の上に 6 つの点があります。どの 2 点も線で結ぶと、円の中に線の交わる点（交点）ができます。どの 3 本の線も 1 点では交わらないとき、交点は全部で何個ですか。
        svg: |
          <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120" cy="70" r="52" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="120.0" cy="18.0" r="4" fill="currentColor"/>
            <circle cx="80.2" cy="36.6" r="4" fill="currentColor"/>
            <circle cx="72.9" cy="92.0" r="4" fill="currentColor"/>
            <circle cx="102.2" cy="118.9" r="4" fill="currentColor"/>
            <circle cx="159.8" cy="103.4" r="4" fill="currentColor"/>
            <circle cx="167.1" cy="48.0" r="4" fill="currentColor"/>
          </svg>
        answer: 15
        check: "sum(1 for (a, b), (c, d) in itertools.combinations(itertools.combinations(range(6), 2), 2) if a < c < b < d or c < a < d < b)"
        hints:
          - 交点が 1 つできるには、点がいくつ要るかな。4 つの点で考えよう。
          - 円の上の 4 つの点を選ぶと、交わる線の組はいくつできるかな。
          - 交点の数は、6 つの点から何個を選ぶ数と同じかな。
        paths:
          - [4 つの点を選ぶと、交わる線（四角形の対角線）が 1 組だけできる, 交点 1 つと 4 つの点の選び方が 1 つずつ組, 選ばない 2 点を決める 6 × 5 ÷ 2 = 15 個]
        note: 線をかいて交点を数えると、数えもれが出やすい。4 つの点の選び方に言いかえると、かかずに数えられる。6 こから 4 こを選ぶ数は、選ばない 2 こを選ぶ数と同じ（C-007）。
      - part: 今日
        text: ア、イ、ウ、エの 4 人の中から、何人かを選んで買い物に行きます。だれも選ばない選び方も 1 通りと数えます。選び方は全部で何通りですか。
        answer: 16
        check: "sum(1 for k in range(5) for c in itertools.combinations('アイウエ', k))"
        hints:
          - ア、イ、ウ、エの 1 人ずつに、選ぶ ○ か選ばない × をつけると考えよう。
          - 選び方 1 つと、○ と × の並び 1 つは組になるかな。
          - ○ と × の並びは、何通りあるかな。
        paths:
          - [選び方を ア イ ウ エ の順の ○× の並びにする, 1 人ごとに 2 通り, 2 × 2 × 2 × 2 = 16 通り]
          - [0 人 1、1 人 4、2 人 6、3 人 4、4 人 1, 1 + 4 + 6 + 4 + 1 = 16 通り]
      - part: 挑戦
        text: 平面に 5 本の直線があります。どの 2 本も平行でなく、どの 3 本も 1 点では交わりません。交点は全部で何個ですか。
        answer: 10
        check: "sum(range(5))"
        hints:
          - 交点 1 つは、何本の直線が交わってできるかな。
          - どの 2 本の直線を選んでも、交点はいくつできるかな。
          - 交点の数を、5 本から 2 本を選ぶ数に言いかえよう。
        paths:
          - [交点 1 つと直線 2 本の選び方が 1 つずつ組, 5 × 4 ÷ 2 = 10 個]
          - [直線を 1 本ずつ引くと、交点は 0、1、2、3、4 個ずつふえる, 0 + 1 + 2 + 3 + 4 = 10 個]
