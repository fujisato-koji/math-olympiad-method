# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 数]
    uses: [N-025]
    text: 1 から 255 までの《整数》を、2 進法で表します。表したときに 1 がちょうど 3 個ある数は、何個ありますか。
    answer: 56
    check: "sum(1 for x in range(1, 256) if sum(x >> i & 1 for i in range(8)) == 3)"
    hints:
      - 255 を 2 進法で表すと、何けたかな。
      - 8 けたより短い数は、前に 0 をつけて 8 けたにそろえてみよう。
      - 1 が 3 個ある 8 けたの並びは、8 つの位から 1 にする位を 3 つ選ぶことと、1 つずつ組になるね。
    paths:
      - [255 は 2 進法で 11111111 の 8 けた, 1 から 255 までの数は、前に 0 をつけてそろえた 8 けたの 0 と 1 の並び（00000000 をのぞく）と 1 つずつ組になる, 1 が 3 個の並びは、8 つの位から 3 つを選ぶ選び方と同じ数, 8 × 7 × 6 ÷ (3 × 2 × 1) = 56 個]
    note: n 進法（N-025）の数を 0 と 1 の並びに、さらに「1 にする位の選び方」に対応させる。けた数のちがう数を、前に 0 をつけてそろえるのが要点。けた数ごとに場合を分けると長くなる。
  - part: 離
    kinds: [道筋]
    text: 1 から 15 までの整数から、異なる 3 つの数を選びます。どの 2 つの数も連続しない（差が 1 にならない）ようにします。選び方は何通りありますか。
    answer: 286
    check: "sum(1 for c in itertools.combinations(range(1, 16), 3) if c[1] - c[0] > 1 and c[2] - c[1] > 1)"
    hints:
      - 選んだ 3 つの数を小さい順に a、b、c とすると、b − a と c − b は 2 以上だね。
      - b から 1 を、c から 2 をひいた数を考えると、a と b − 1 と c − 2 はどんな 3 つの数になるかな。
      - 新しい 3 つの数は、1 から何までの数から選んだことになるかな。逆にもどせるかも確かめよう。
    paths:
      - [選んだ数を小さい順に a、b、c とする, a、b − 1、c − 2 は 1 から 13 までの異なる 3 つの数になる, 逆に 1 から 13 までの異なる 3 つの数 x < y < z を選ぶと、x、y + 1、z + 2 は連続しない 3 つの数にもどる, 選び方は 1 から 13 までから 3 つを選ぶ数と同じで 13 × 12 × 11 ÷ 6 = 286 通り]
    note: 連続しない選び方を、ずらして普通の選び方に 1 つずつ対応させる。逆向き（どの選び方からももどせる）も確かめると、1 対 1 であることが言える。全部（455 通り）から連続をふくむものをひく道は、場合分けが多く重なりも出る。
  - part: 離
    kinds: [読み取り, 手数]
    text: 24 チームが出る大会があります。まず 24 チームを 6 チームずつ 4 つの組に分け、組の中でどのチームとも 1 回ずつ試合をします（リーグ戦）。次に、各組の上位 2 チーム、合わせて 8 チームが勝ちぬき戦（トーナメント）をして、優勝チームを決めます。勝ちぬき戦に引き分けはありません。また、準決勝で負けた 2 チームで 3 位決定戦を行います。試合は全部で何試合ありますか。
    answer: 68
    check: "4 * sum(1 for c in itertools.combinations(range(6), 2)) + (8 - 1) + 1"
    hints:
      - 1 つの組のリーグ戦の試合は、6 チームから 2 チームを選ぶ選び方と同じ数だね。
      - 勝ちぬき戦の試合の数は、負けたチームの数と同じだね。優勝しなかったチームは何チームかな。
      - 3 位決定戦の 1 試合を忘れないようにしよう。
    paths:
      - [1 つの組のリーグ戦は 6 × 5 ÷ 2 = 15 試合で、4 組で 60 試合, 勝ちぬき戦では 1 試合で 1 チームが負け、優勝以外の 7 チームが 1 回ずつ負けるので 7 試合, 3 位決定戦が 1 試合, 60 + 7 + 1 = 68 試合]
    note: 試合を「選んだ 2 チーム」と「負けたチーム」の 2 通りに対応させ、長い大会の説明から試合の種類を拾う。3 位決定戦を落として 67 にしたり、リーグ戦を 24 チーム全体の総当たり（276 試合）と読んだりしやすい。
