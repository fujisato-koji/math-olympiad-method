idth="2"/><text x="254" y="87" font-size="17" text-anchor="middle" fill="currentColor">1</text><text x="290" y="52" font-size="13" text-anchor="middle" fill="currentColor">1</text><rect x="275" y="64" width="30" height="34" rx="4" fill="#f3c969" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="290" y="87" font-size="17" text-anchor="middle" fill="currentColor">1</text><text x="20" y="30" font-size="14" text-anchor="start" fill="currentColor">位</text><text x="160" y="140" font-size="14" text-anchor="middle" fill="currentColor">前に 0 をつけて 8 けたにそろえる</text></svg>'
