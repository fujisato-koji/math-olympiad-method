        explain: 例：「5 を ○ 5 このならびで表し、和の切れ目に ｜ を入れるとする。○ の間は 4 か所あり、どの表し方も、4 か所のそれぞれに ｜ を入れるか入れないかで 1 つだけ表せる。反対に、4 か所のそれぞれに ｜ を入れるか入れないかを決めると、｜ で区切られた ○ のこ数を左から読んで、和の表し方が 1 つ決まる（区切られた所には ○ が 1 こ以上ある）。表し方と、4 か所の入れる・入れないの決め方は 1 つずつ組になる。決め方は 1 か所ごとに 2 通りなので、積の法則で 2 × 2 × 2 × 2 = 16 通り。」と書ければよい。① ○ と ｜ で表すことを決める、② 両方向で 1 つずつ組になる、③ 積の法則で結ぶ、の 3 点を見る。｜ は ○ の間にしか入らないので、0 を足す形ができないことにもふれる。
