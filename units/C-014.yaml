        explain: 例：「試合を 1 回すると、負けるチームがちょうど 1 つ出る。負けたチームはもう試合をしないので、2 回負けるチームはない。ゆうしょうしたチームは 1 回も負けず、ほかの 7 チームはどれも 1 回だけ負ける。だから、試合 1 つに負けたチーム 1 つが組になり、どの負けたチームにも、負けた試合が 1 つだけある。試合と負けたチームは 1 つずつ組になるので、試合の数は 7 回。」と書ければよい。① 何と何を組にするか、② どちらからも 1 つだけ決まること、③ 負けたチームが 7 つであること、が書けているかを見る。組み合わせ表を 1 つかいて 4 + 2 + 1 と数えただけなら、ほかの組み方でも同じかは言えないことを話す（図の 2 つ目の表は 1 + 1 + 1 + 1 + 1 + 1 + 1 になる）。
