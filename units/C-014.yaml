      - [全部の選び方は 15 × 14 × 13 ÷ 6 = 455 通り, となり合う 2 つ（14 組）と、のこりの 1 つ（13 通り）で 14 × 13 = 182 通り。3 つ続き（13 通り）はここで 2 回数えているので、となり合う数をふくむ選び方は 182 − 13 = 169 通り, 455 − 169 = 286 通り]
    note: 連続しない選び方を、ずらして普通の選び方に 1 つずつ対応させる。逆向き（どの選び方からももどせる）もたしかめると、1 対 1 であることが言える。全部（455 通り）から連続をふくむものをひく道は、場合分けが多く重なりも出る。
