iddle" fill="currentColor">たて 2・4 本目</text><text x="242" y="170" font-size="14" text-anchor="middle" fill="currentColor">横 1・3 本目</text></svg>'
        explain: 長方形を 1 つ選ぶと、その左の辺と右の辺になるたて線が 2 本、上の辺と下の辺になる横線が 2 本決まります。反対に、図の赤いたて線 2 本と青い横線 2 本のように、たて線 2 本と横線 2 本を選ぶと、長方形が 1 つだけ決まります。選ぶ線がちがうと、長方形もちがいます。だから長方形の数は、たて線 2 本と横線 2 本の選び方の数と同じです。たて線は 4 × 3 ÷ 2 = 6 通り、横線は 3 × 2 ÷ 2 = 3 通りなので、積の法則で 6 × 3 = 18 こです。
