# C-014 対応させて数える
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の漢字まじりの文。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 数えにくいものを、1 つずつ組になる数えやすいものに言いかえる（勝ちぬき戦の試合 ↔ 負けたチーム、
#          円の上の点を結ぶ線の交点 ↔ 4 点の選び方、直線の交点 ↔ 2 本の選び方、何人かを選ぶ選び方 ↔ ○× の並び）、
#   2 日目 長方形 ↔ 縦線 2 本と横線 2 本、順番のある和 ↔ 仕切りを入れるか入れないか、1 個以上ずつ分ける ↔ ○ の間の仕切り、
#   3 日目 わけ（なぜ試合の数と負けたチームの数が同じか、なぜ交点と 4 点の選び方が同じ数か、なぜ和の表し方が 2 × 2 × … か）、
#   4 日目 C-013（同じものをふくむ並べ方、何回でも選べる選び方、輪）と C-007（組合せ）と混ぜる、5 日目 確認。
# 前提は C-013 だけ（→ C-007、C-006、C-005）。C-013 と同じく、3 けたの数（N-009）が前提にないので答えも途中の数も 100 までにした
#   （7 こから 3 こを選ぶ数のように、並べ方が 100 をこえるものは出さない）。累乗（A-009）も前提にないので 2 × 2 × 2 × 2 と書く。
# 文字の式（A-010）が前提にないので、わけは言葉で一般に書く（C-013 の頭の注と同じ 3 点）。1 問目は代表の例で書く ②。
# 道順を右と上の並びに対応させる数え方は、道順（C-004）が前提にないので出さない（C-015 で扱う）。
# 円の上の点は、どの 3 本の線も 1 点で交わらないように、間をそろえずに置いた（正六角形にすると、まん中で 3 本が交わる）。
# 図（D-129〜D-131 の直し）：見本と答える問題に svg の図を付け、ヒントの 1〜2 段を図の付いたヒントにした（答えの手前までを見せる）。
#   勝ちぬき戦の組み合わせ表は、見本（8 チーム）とわけ（形のちがう 2 つの表）にだけかき、問題はチームの数の絵にする（組み方によらないことを言うため）。
#   直線の図は、どの交点も図の中に入り、ほかの線から見分けられるように置いた。仕切りの ｜ は紫の線、○ は黄の丸に、単元の中でそろえた。
# check：勝ちぬき戦は、毎回 2 チームずつ組にして試合をし、余った 1 チームは次へ進むとして、試合の数を足していく。
#   線の交点は、2 本の線の両はしが円の上で交互に並ぶ組を数える。長方形は、左上と右下のマスの組を全部ためす。
#   和の表し方と分け方は、itertools.product で数の並びを全部作って数える。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-009、A-010 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

