    text: 赤い玉 6 こと白い玉 5 こを 1 列にならべます。同じ色の玉が 3 こつづく所があってはいけません。玉は色だけで区別します（同じ色の玉どうしは入れかえても同じならべ方です）。ならべ方は全部で何通りですか。
    answer: 113
    check: sum(1 for s in itertools.combinations(range(11), 6) if all(len({i in s for i in range(j, j + 3)}) == 2 for j in range(9)))
    hints:
    - 小さい場合（赤 2 こと白 1 こ、赤 3 こと白 2 こなど）で、ルールに合うならべ方を全部かいてみよう。数え上げやすいかたちに言いかえられないかな。
    - 小さい場合で、同じ色のつづきを 1 つずつ区切って、長さを書き出してみよう。
    - つづきの数え方をそろえると、赤のつづきと白のつづきは、ならび方の中でどうならぶかな。
    paths:
    - - 同じ色がつづく所を 1 つの「かたまり」と見る。3 こつづきはないので、かたまりは 1 こか 2 こ。赤のかたまりと白のかたまりはかわるがわるにならぶので、赤のかたまりの数 k と白のかたまりの数 l は、等しいか、1 ちがい。
      - ならべ方は、「赤 6 こを k この かたまり（1 こか 2 こ）に分ける分け方」「白 5 こを l この かたまりに分ける分け方」「どちらの色から始めるか」の 3 つで決まる。逆に、この 3 つが決まれば、かたまりをかわるがわるにならべて、ならべ方が 1 つ決まる。だから、ならべ方の数は、この 3 つの選び方の数と同じ（1 対 1 の対応）
      - 赤 6 こを k この かたまりに分けると、2 このかたまりは 6 − k こ。k この場所から 6 − k この場所を選べばよいので、k = 3、4、5、6 で 1、6、5、1 通り（k = 2 以下は、2 こずつでも 6 こにならない）。白 5 こは、2 このかたまりが 5 − l こ。l = 3、4、5 で 3、4、1 通り（l = 2 以下は 4 こまでしかならない）
      - 始める色は、k = l なら赤はじまりと白はじまりの 2 通り。k = l + 1 なら赤のかたまりが多いので両はしが赤で、1 通り。l = k + 1 なら両はしが白で、1 通り。k = l：(3, 3) は 1 × 3 × 2 = 6、(4, 4) は 6 × 4 × 2 = 48、(5, 5) は 5 × 1 × 2 = 10 で、64 通り
      - k = l + 1：(4, 3) は 6 × 3 = 18、(5, 4) は 5 × 4 = 20、(6, 5) は 1 × 1 = 1 で、39 通り。l = k + 1：(3, 4) は 1 × 4 = 4、(4, 5) は 6 × 1 = 6 で、10 通り。ほかの (k, l) は分け方が 0 通り。合計 64 + 39 + 10 = 113 通り
    - - 赤 r こと白 w こをならべ、3 こつづきのないならべ方のうち、赤でおわるものの数を R(r, w)、白でおわるものの数を W(r, w) とする。何もならべない場合は「赤でおわる」とも「白でおわる」とも見て、R(0, 0) = W(0, 0) = 1 とする
      - 赤でおわるならべ方では、いちばん右の赤のつづきは 1 こか 2 こ。そのつづきをとりのぞくと、白でおわるならべ方（か、何もない）が残り、逆に、白でおわるならべ方に赤を 1 こか 2 こ足せば、もとにもどる。だから R(r, w) = W(r − 1, w) + W(r − 2, w)。同じように W(r, w) = R(r, w − 1) + R(r, w − 2)（0 こより少なくなるときは 0）
      - 表を作る。(R, W) の組で、w = 0 の行は r = 0〜3 で (1, 1)、(1, 0)、(1, 0)、(0, 0)。w = 1 の行は r = 0〜4 で (0, 1)、(1, 1)、(2, 1)、(2, 0)、(1, 0)。w = 2 の行は r = 0〜6 で (0, 1)、(1, 2)、(3, 3)、(5, 2)、(5, 1)、(3, 0)、(1, 0)。w = 3 の行は r = 0〜6 で (0, 0)、(0, 2)、(2, 5)、(7, 7)、(12, 6)、(13, 3)、(9, 1)
      - w = 4 の行は r = 1〜6 で (0, 1)、(1, 5)、(6, 12)、(17, 17)、(29, 16)、(33, 10)。w = 5 の行は r = 2〜6 で (0, 3)、(3, 13)、(16, 29)、(42, 42)、(71, 42)。たとえば R(6, 5) = W(5, 5) + W(4, 5) = 42 + 29 = 71、W(6, 5) = R(6, 4) + R(6, 3) = 33 + 9 = 42
      - 求める数は R(6, 5) + W(6, 5) = 71 + 42 = 113 通り。たしかめ：同じ表から、赤白 4 こずつは R(4, 4) + W(4, 4) = 17 + 17 = 34、5 こずつは 42 + 42 = 84。1 本目の考え方を (4, 4)、(5, 5) に使っても、34、84 になる
    note: 考えどころは 3 つ：①同じ色のつづきを「1 こか 2 このかたまり」に言いかえ、ならべ方と「赤の分け方・白の分け方・始める色」の組が 1 対 1 に対応することを見ぬく、②6 こを k この かたまりに分ける分け方を、2 このかたまりの場所の選び方（k こから 6 − k こを選ぶ）として数える、③かたまりの数 (k, l) の場合分け（等しいか 1 ちがい）と始める色をくみ立てて、すべて足す。2 本目は、1 本目のように全体を一度にかたまりへばらして式にするのではなく、いちばん右のつづき（1 こか 2 こ）をとりのぞいて小さい場合へもどし、表を 1 つずつのばして (6, 5) まで求める（かたまりの数の場合分けも分け方の数の選び方も使わない）。check は、11 か所から赤の場所 6 つを選ぶ全部の選び方をためし、3 つずつのどの区切りにも赤と白の両方がある（同じ色が 3 こつづかない）ものを数える（113）。赤白 4 こずつの 34、5 こずつの 84 も、同じ式で数えて 2 本の考えの値と合うことをたしかめた。既出：「同じものが 3 つつづかないならべ方」は受験の型にあるが、ここは 2 色ともこ数が決まっていて、かたまりの数の場合分けを自分でくみ立てる所がちがう。わな：k と l が 1 ちがいのときは両はしの色が決まるのに、始める色を 2 通りと数えてしまう（k = l のときだけ 2 通り）。
