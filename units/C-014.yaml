y1="157" x2="292" y2="145" stroke="#e06666" stroke-width="3" stroke-linecap="round"/><circle cx="286" cy="177" r="10" fill="#f08080" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="286" y="181.6" font-size="13" text-anchor="middle" fill="currentColor">6</text></svg>'
        explain: 試合を 1 回すると、負けるチームがちょうど 1 つ出ます。負けたチームはそこで終わりなので、同じチームが 2 回負けることはありません。ゆうしょうしたチームのほかの 7 チームは、どれもどこかで 1 回だけ負けます。図の黄色い丸（試合の番号）と、負けたチームの下の赤い丸の番号を見ると、「試合」と「負けたチーム」が 1 つずつ組になっています。だから、試合の数は負けたチームの数と同じ 7 回です。組み合わせ表を見て 4 + 2 + 1 と数えなくても、組み方によらずに答えが出ます。数えにくいものを、1 つずつ組になる数えやすいものに言いかえて数えることを「対応させて数える」といいます。
