        text: 1 から 45 までの数のうち、7 の倍数の数は ［45 ÷ 7］ = 6 こです。商が倍数の数になるわけを、文に書きましょう。
        svg: '<svg viewBox="0 0 320 124" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">7 の倍数と 45</text><line x1="16" y1="84" x2="306" y2="84" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="22" y1="76" x2="22" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="22" y="110" font-size="13" text-anchor="middle" fill="currentColor">0</text><line x1="61.4" y1="76" x2="61.4" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="61.4" y="110" font-size="13" text-anchor="middle" fill="currentColor">7</text><line x1="100.9" y1="76" x2="100.9" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="100.9" y="110" font-size="13" text-anchor="middle" fill="currentColor">14</text><line x1="140.3" y1="76" x2="140.3" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="140.3" y="110" font-size="13" text-anchor="middle" fill="currentColor">21</text><line x1="179.7" y1="76" x2="179.7" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="179.7" y="110" font-size="13" text-anchor="middle" fill="currentColor">28</text><line x1="219.1" y1="76" x2="219.1" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="219.1" y="110" font-size="13" text-anchor="middle" fill="currentColor">35</text><line x1="258.6" y1="76" x2="258.6" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="258.6" y="110" font-size="13" text-anchor="middle" fill="currentColor">42</text><line x1="298" y1="76" x2="298" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="298" y="110" font-size="13" text-anchor="middle" fill="currentColor">49</text><polygon points="275.5,73 269.5,63 281.5,63" fill="#f08080" stroke="currentColor" stroke-width="1.5"/><text x="275.5" y="58" font-size="15" text-anchor="middle" fill="currentColor">45</text></svg>'
        explain: たとえば、「7 の倍数は 7 × 1、7 × 2、7 × 3、…と 7 ずつ大きくなる。45 ÷ 7 = 6 あまり 3 なので、7 × 6 = 42 は 45 をこえず、7 × 7 = 49 は 45 をこえる。だから 45 までの 7 の倍数は 7 × 1 から 7 × 6 までの 6 こで、商の 6 と同じになる。あまりの 3 は、42 の後の 43、44、45 の分で、7 の倍数にはならない。」と書ければよい。「7、14、21、28、35、42 の 6 こ」と書き出しただけでは、商と同じになるわけにはならないので、「7 × 6 まで」と「7 × 7 は 45 をこえる」の 2 つが書けているかを見る。
        hints:
          - 7 の倍数を、7 × 1、7 × 2、…とならべよう。
          - text: 45 をこえない いちばん大きい 7 の倍数は、7 × 何かな。7 × 7 は 45 をこえるかな。
