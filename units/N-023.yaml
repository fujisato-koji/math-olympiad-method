          - 「50 までの 3 の倍数は 3 × 1 から 3 × 16。そのうち 6 の倍数は〜。だから〜。」と書いてみよう。
        paths:
          - [6 = 3 × 2、12 = 3 × 4、18 = 3 × 6, 3 にかける数が 2 の倍数なら 6 の倍数, 3 にかける数は 1 から 16 まで, その中の 2 の倍数は ［16 ÷ 2］ = 8 こ, ［50 ÷ 6］ = 8 と同じ]
          - [50 こを 3 こずつのまとまりにすると 16 まとまり（あまり 2）, まとまりを 2 つずつまとめると 6 こずつのまとまりになる, 16 ÷ 2 = 8 で 6 こずつのまとまりは 8 つ, それは 50 ÷ 6 の商の 8 と同じ]
