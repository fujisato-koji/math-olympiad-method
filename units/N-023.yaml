        explain: たとえば、「3 の倍数は 3 × 1、3 × 2、3 × 3、…。そのうち 6 の倍数は 6 = 3 × 2、12 = 3 × 4、18 = 3 × 6、…のように、3 にかける数が 2 の倍数になっているもの。50 までの 3 の倍数は 3 × 1 から 3 × 16 までの 16 こなので、6 の倍数の数は、1 から 16 までにある 2 の倍数の数で ［16 ÷ 2］ = 8 こ。これは 50 までの 6 の倍数の数なので、［50 ÷ 6］ = 8 と同じ。」と書ければよい。わり算を 2 回くり返しても、まとめて 3 × 2 = 6 でわっても、同じになる。2 つの数（6、12）で「3 にかける数が 2 の倍数」と書けていれば十分。
