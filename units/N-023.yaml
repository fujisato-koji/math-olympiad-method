y2="92" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="276.1" y="108" font-size="13" text-anchor="middle" fill="currentColor">49</text><text x="276.1" y="126" font-size="13" text-anchor="middle" fill="currentColor">7 × 7</text><line x1="294" y1="77" x2="294" y2="87" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="204.7,70 198.7,60 210.7,60" fill="#f08080" stroke="currentColor" stroke-width="1.5"/><text x="204.7" y="56" font-size="15" text-anchor="middle" fill="currentColor">45</text></svg>'
          - 「7 × 6 は〜、7 × 7 は〜。だから 45 までの 7 の倍数は〜。」と書いてみよう。
        paths:
