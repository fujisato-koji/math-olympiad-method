ircle cx="147" cy="75" r="6" fill="#c9a36b"/><circle cx="171" cy="75" r="6" fill="#c9a36b"/><circle cx="232" cy="63" r="6" fill="#c9a36b"/><circle cx="264" cy="63" r="6" fill="#c9a36b"/></g><path d="M29 49.5h.01M32.8 52.8h.01M53 49.5h.01M56.8 52.8h.01M41 61.5h.01M44.8 64.8h.01M29 73.5h.01M32.8 76.8h.01M53 73.5h.01M56.8 76.8h.01M87 49.5h.01M90.8 52.8h.01M111 49.5h.01M114.8 52.8h.01M99 61.5h.01M102.8 64.8h.01M87 73.5h.01M90.8 76.8h.01M111 73.5h.01M114.8 76.8h.01M145 49.5h.01M148.8 52.8h.01M169 49.5h.01M172.8 52.8h.01M157 61.5h.01M160.8 64.8h.01M145 73.5h.01M148.8 76.8h.01M169 73.5h.01M172.8 76.8h.01M230 61.5h.01M233.8 64.8h.01M262 61.5h.01M265.8 64.8h.01" stroke="currentColor" stroke-width="2.0" stroke-linecap="round"/></svg>'
        explain: ［ ］ は、中のわり算の商（あまりを考えない答え）を表すしるしで、ガウス記号といいます。17 ÷ 5 = 3 あまり 2 なので、［17 ÷ 5］ = 3 です。あまりの 2 はすてます。わり切れるときは、［20 ÷ 5］ = 4 のように、わり算の答えそのものです。
      - part: 思い出す
