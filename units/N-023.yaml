currentColor">1</text><text x="257" y="57" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="279" y="57" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="301" y="57" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="50" y="85" font-size="13" text-anchor="middle" fill="currentColor">［□ ÷ 7］</text><text x="103" y="85" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="125" y="85" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="147" y="85" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="169" y="85" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="191" y="85" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="213" y="85" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="235" y="85" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="257" y="85" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="279" y="85" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="301" y="85" font-size="14" text-anchor="middle" fill="currentColor">1</text></svg>'
      - 両方が 1 になるのは、□ が 6 から 11 までで、しかも 7 から 13 までのときだね。両方に入る □ はどれかな。
      - 両方が 2、3、… になる □ も同じように調べよう。どこまでつづくかな。
    paths:
      - [両方 0 は 1 から 5 の 5 こ, 両方 1 は 7 から 11 の 5 こ、両方 2 は 14 から 17 の 4 こ, 両方 3 は 21 から 23 の 3 こ、両方 4 は 28 と 29 の 2 こ、両方 5 は 35 の 1 こ, 両方 6 からは 1 つもないので 5 + 5 + 4 + 3 + 2 + 1 = 20]
      - [両方が q になる □ は 7 × q から 6 × q + 5 まで, その数は 6 − q こ（q = 0 は 1 から 5 の 5 こ）, 5 + 5 + 4 + 3 + 2 + 1 = 20]
    note: 商ごとに場合を分け、「6 でわった商がその数になるはんい」と「7 でわった商がその数になるはんい」の重なりを数える。重なりが 1 こずつへり、商が 6 からはなくなるきまりに気づけるとよい。
