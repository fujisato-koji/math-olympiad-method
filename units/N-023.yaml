# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 手数]
    text: ［1 ÷ 3］ + ［2 ÷ 3］ + ［3 ÷ 3］ + ［4 ÷ 3］ + … + ［30 ÷ 3］ はいくつですか。
    answer: 145
    check: "sum(k // 3 for k in range(1, 31))"
    hints:
      - はじめのいくつかを計算してみよう。［1 ÷ 3］、［2 ÷ 3］、［3 ÷ 3］、［4 ÷ 3］、… はいくつかな。
      - 同じ答えが何こずつならんでいるかな。0 は 2 こ、1 は何こかな。
      - 1 から 9 までは、それぞれ同じ数ずつあるね。さいごの ［30 ÷ 3］ だけは 1 こだよ。
    paths:
      - [0 が 2 こ（1 と 2）, 1 から 9 までが 3 こずつ（3 から 5 で 1、…、27 から 29 で 9）, ［30 ÷ 3］ = 10 が 1 こ, 1 + 2 + … + 9 = 45 で 45 × 3 + 10 = 145]
    note: 30 こを 1 つずつ計算せず、同じ値が 3 こずつ続くまとまりで数える。0 が 2 こしかないことと、さいごの 10 が 1 こだけのことを落としやすい。1 + 2 + … + 9 = 45 の計算も要る。
  - part: 離
    kinds: [総動員, 道筋, 読み取り]
    uses: [C-008, N-018]
    text: 1 から 100 までの数のうち、4 でも 6 でもわり切れない数は何こありますか。
    answer: 67
    check: "sum(1 for k in range(1, 101) if k % 4 != 0 and k % 6 != 0)"
    hints:
      - 4 でわり切れる数と 6 でわり切れる数は、それぞれ何こあるかな。ガウス記号で出そう。
      - 4 でも 6 でもわり切れる数は、2 回数えているね。それは何の《倍数》かな。24 の倍数でよいかな。
      - 4 か 6 のどちらかでわり切れる数の数を出して、100 からひこう。
    paths:
      - [4 の倍数は ［100 ÷ 4］ = 25 こ、6 の倍数は ［100 ÷ 6］ = 16 こ, 両方の倍数は 4 と 6 の最小公倍数 12 の倍数で ［100 ÷ 12］ = 8 こ, どちらかでわり切れるのは 25 + 16 − 8 = 33 こ, 100 − 33 = 67]
    note: 倍数の数（ガウス記号）に、重なりを引く数え方（C-008）と最小公倍数（N-018）を合わせる。両方の倍数を 4 × 6 = 24 の倍数（4 こ）とするまちがいが多い。
  - part: 離
    kinds: [道筋]
    text: 1 から 100 までの数 □ のうち、［□ ÷ 6］ と ［□ ÷ 7］ が同じ数になるものは何こありますか。
    answer: 20
    check: "sum(1 for k in range(1, 101) if k // 6 == k // 7)"
    hints:
      - ［□ ÷ 6］ と ［□ ÷ 7］ の両方が 0 になる □ は、どれかな。
      - 両方が 1 になるのは、□ が 6 から 11 までで、しかも 7 から 13 までのときだね。両方に入る □ はどれかな。
      - 両方が 2、3、… になる □ も同じように調べよう。どこまで続くかな。
    paths:
      - [両方 0 は 1 から 5 の 5 こ, 両方 1 は 7 から 11 の 5 こ、両方 2 は 14 から 17 の 4 こ, 両方 3 は 21 から 23 の 3 こ、両方 4 は 28 と 29 の 2 こ、両方 5 は 35 の 1 こ, 両方 6 からは 1 つもないので 5 + 5 + 4 + 3 + 2 + 1 = 20]
    note: 商ごとに場合を分け、「6 でわった商がその数になるはんい」と「7 でわった商がその数になるはんい」の重なりを数える。重なりが 1 こずつへり、商が 6 からはなくなるきまりに気づけるとよい。
