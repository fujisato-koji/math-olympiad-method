        explain: 8 の倍数は 8 × 1、8 × 2、8 × 3、…です。60 をこえないのは 8 × 7 = 56 までなので 7 こです。これは 60 ÷ 8 = 7 あまり 4 の商で、［60 ÷ 8］ = 7 と書けます。1 から □ までの 8 の倍数の数は ［□ ÷ 8］ です。20 から 60 までなら、1 から 60 までの 7 こから、1 から 19 までの ［19 ÷ 8］ = 2 こ（8 と 16）をひいて 5 こです。20 までをひくのではなく、20 の 1 つ前の 19 までをひきます。
