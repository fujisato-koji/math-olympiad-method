>2</text><text x="257" y="57" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="279" y="57" font-size="14" text-anchor="middle" fill="currentColor">3</text><text x="301" y="57" font-size="14" text-anchor="middle" fill="currentColor">3</text></svg>'
      - 0 は 2 こだけ。1 から 9 までは、それぞれ何こずつあるかな。
      - さいごの ［30 ÷ 3］ だけは 1 こだよ。
    paths:
      - [0 が 2 こ（1 と 2）, 1 から 9 までが 3 こずつ（3 から 5 で 1、…、27 から 29 で 9）, ［30 ÷ 3］ = 10 が 1 こ, 1 + 2 + … + 9 = 45 で 45 × 3 + 10 = 145]
      - [□ = 3 × ［□ ÷ 3］ + あまり なので、［□ ÷ 3］ の和は（□ の和 − あまりの和）÷ 3, 1 から 30 の和は 465、あまりは 1、2、0 のくり返しで和は 30, (465 − 30) ÷ 3 = 145]
    note: 30 こを 1 つずつ計算せず、同じ値が 3 こずつつづくまとまりで数える。0 が 2 こしかないことと、さいごの 10 が 1 こだけのことを落としやすい。1 + 2 + … + 9 = 45 の計算もいる。
  - part: 離
    id: "273aa4bbfa"
    kinds: [総動員, 道筋, 読み取り]
    uses: [C-008, N-018]
    text: 1 から 100 までの数のうち、4 でも 6 でもわり切れない数は何こありますか。
    answer: 67
    check: "sum(1 for k in range(1, 101) if k % 4 != 0 and k % 6 != 0)"
    hints:
      - 4 でわり切れる数と 6 でわり切れる数は、それぞれ何こあるかな。ガウス記号で出そう。
      - text: 4 の倍数と 6 の倍数をならべたよ。上と下の両方に出てくる数は、2 回数えているね。両方に出てくる数を、小さいほうからさがそう。
        svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><text x="10" y="48" font-size="14" text-anchor="start" fill="currentColor">4 の倍数</text><rect x="107" y="30" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="120" y="48" font-size="13" text-anchor="middle" fill="currentColor">4</text><rect x="143" y="30" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="156" y="48" font-size="13" text-anchor="middle" fill="currentColor">8</text><rect x="179" y="30" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="192" y="48" font-size="13" text-anchor="middle" fill="currentColor">12</text><rect x="215" y="30" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="228" y="48" font-size="13" text-anchor="middle" fill="currentColor">16</text><rect x="251" y="30" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="264" y="48" font-size="13" text-anchor="middle" fill="currentColor">20</text><rect x="287" y="30" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="300" y="48" font-size="13" text-anchor="middle" fill="currentColor">24</text><text x="10" y="102" font-size="14" text-anchor="start" fill="currentColor">6 の倍数</text><rect x="125" y="84" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="138" y="102" font-size="13" text-anchor="middle" fill="currentColor">6</text><rect x="179" y="84" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="192" y="102" font-size="13" text-anchor="middle" fill="currentColor">12</text><rect x="233" y="84" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="246" y="102" font-size="13" text-anchor="middle" fill="currentColor">18</text><rect x="287" y="84" width="26" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="300" y="102" font-size="13" text-anchor="middle" fill="currentColor">24</text><text x="160" y="140" font-size="13" text-anchor="middle" fill="currentColor">（100 までつづく）</text></svg>'
      - 4 か 6 のどちらかでわり切れる数の数を出して、100 からひこう。
    paths:
      - [4 の倍数は ［100 ÷ 4］ = 25 こ、6 の倍数は ［100 ÷ 6］ = 16 こ, 両方の倍数は 4 と 6 の公倍数でいちばん小さい 12 の倍数で ［100 ÷ 12］ = 8 こ, どちらかでわり切れるのは 25 + 16 − 8 = 33 こ, 100 − 33 = 67]
      - [1 から 12 までで 4 でも 6 でもわり切れないのは 1、2、3、5、7、9、10、11 の 8 こ, 12 こずつの組は 96 までに 8 組で 8 × 8 = 64 こ, 97 から 100 では 97、98、99 の 3 こ, 64 + 3 = 67]
    note: 倍数の数（ガウス記号）に、重なりを引く数え方（C-008）と公倍数（N-018）を合わせる。両方の倍数を 4 × 6 = 24 の倍数（4 こ）とするまちがいが多い。ヒントの図は 4 の倍数と 6 の倍数を数の大きさのところにならべ、12 と 24 が上下にそろうのを見せる（前のヒント「24 の倍数でよいかな」は 24 へさそうので直した）。
