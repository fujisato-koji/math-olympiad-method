oke-linecap="round"/><line x1="243.8" y1="77" x2="243.8" y2="87" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="260.5" y1="72" x2="260.5" y2="92" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text x="260.5" y="108" font-size="13" text-anchor="middle" fill="currentColor">42</text><text x="260.5" y="126" font-size="13" text-anchor="middle" fill="currentColor">6 × 7</text><line x1="277.2" y1="77" x2="277.2" y2="87" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="294" y1="77" x2="294" y2="87" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="193.5,70 187.5,60 199.5,60" fill="#f08080" stroke="currentColor" stroke-width="1.5"/><text x="193.5" y="56" font-size="15" text-anchor="middle" fill="currentColor">38</text></svg>'
