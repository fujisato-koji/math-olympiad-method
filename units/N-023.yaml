# N-023 床関数（ガウス記号、整数の部分）
#
# 書き方は N-001 の頭の注、文の漢字は N-017 にそろえた（段 3。分かち書きはしない）。「÷」は U+00F7、check は「//」と「%」。
# 前提は N-014（わり算とあまり）と N-022（あまりの性質）。小数（N-020）と分数（N-016）は前提にないので、
#   ガウス記号の中はわり算の式だけにした：［17 ÷ 5］ は 17 ÷ 5 の商（あまりを考えない答え）で 3。
#   「その数をこえない いちばん大きい整数」という言い方と、［3.7］ のような小数の整数の部分は扱っていない（地図の点に書いた）。
# ガウス記号は全角の ［ ］ で書く（YAML の列の [ ] とぶつからないように）。
# 数は 100 まで（N-009 は前提にない）。商が 2 けたになるわり算は、N-022 と同じく「何十とのこり」に分けて求める
#   （［70 ÷ 6］ は 70 = 60 + 10 として 10 + 1 = 11）。
# 中身は 3 つにした：
#   ［n ÷ k］ は 1 から n までにある k の倍数の数（N-017 の「商が倍数の数」を記号にする）。
#   区切った範囲（a から b まで）の倍数の数は ［b ÷ k］ − ［(a − 1) ÷ k］。「a − 1 までをひく」ことをくり返し注意する。
#   ［［n ÷ a］ ÷ b］ = ［n ÷ (a × b)］（3 日目のわけ。N-024 の階乗の素因数の個数と N-034 のルジャンドルの公式へつながる）。
#   あまりは n − k × ［n ÷ k］（4 日目に N-014 と混ぜる）。
# 「2 または 3 の倍数」のような重なりのある数え方は、ベン図の C-008 が前提にないので出さない。公倍数（N-018）も前提にないので、
#   「4 の倍数だが 8 の倍数ではない」のように、片方がもう片方の倍数になっている組だけにした。
# 曜日の問題は N-022 と同じく '月火水木金土日' の何文字目かで check する。
# 日の並び（既定）：1 日目 ガウス記号、2 日目 倍数の数、3 日目 わけ、4 日目 N-014（あまり）・N-022（曜日、和のあまり）と混ぜる、5 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-009、N-016、N-020 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: N-023
days:
  - day: 1
    items:
      - part: 見本
        text: ［17 ÷ 5］ はいくつですか。
        explain: ［ ］ は、中のわり算の商（あまりを考えない答え）を表すしるしで、ガウス記号といいます。17 ÷ 5 = 3 あまり 2 なので、［17 ÷ 5］ = 3 です。あまりの 2 はすてます。わり切れるときは、［20 ÷ 5］ = 4 のように、わり算の答えそのものです。
      - part: 思い出す
        text: 38 ÷ 6 の答えはどれですか。
        choices: [5 あまり 8, 6 あまり 2, 6 あまり 4]
        answer: 6 あまり 2
        check: "(lambda q, r: f'{q} あまり {r}')(*divmod(38, 6))"
        hints:
          - 6 の段の九九で、38 をこえない いちばん大きい答えはどれかな。
          - 38 から、その数をひこう。
          - あまりは、わる数の 6 より小さくなるよ。
        paths:
          - [6 × 6 = 36 で 38 をこえない, 38 − 36 = 2, 6 あまり 2]
        note: 5 あまり 8 は、あまりがわる数より大きいのでまちがい。
      - part: 思い出す
        text: 5 でわると 3 あまる数に、4 をたしました。その数を 5 でわると、あまりはいくつですか。
        answer: 2
        check: "sum({(x + 4) % 5 for x in range(3, 100, 5)})"
        hints:
          - あまりどうしをたそう。
          - 3 + 4 はいくつかな。
          - 5 以上なら、もう一度 5 でわろう。
        paths:
          - [3 + 4 = 7, 7 ÷ 5 = 1 あまり 2, 2]
      - part: 今日
        text: ［29 ÷ 4］ はいくつですか。
        answer: 7
        check: "29 // 4"
        hints:
          - 29 ÷ 4 のわり算をしよう。
          - 4 の段の九九で、29 をこえない いちばん大きい答えはどれかな。
          - ［ ］ は、あまりをすてた商だよ。
        paths:
          - [4 × 7 = 28 で 29 をこえない, 29 ÷ 4 = 7 あまり 1, 7]
      - part: 今日
        text: ［48 ÷ 6］ はいくつですか。
        answer: 8
        check: "48 // 6"
        hints:
          - 48 ÷ 6 のわり算をしよう。
          - 6 の段の九九で、答えが 48 になるのはどれかな。
          - わり切れるときは、わり算の答えそのものだよ。
        paths:
          - [6 × 8 = 48, わり切れる, 8]
      - part: 今日
        text: ［□ ÷ 5］ = 6 となる □ のうち、いちばん大きい数はいくつですか。
        answer: 34
        check: "max(x for x in range(100) if x // 5 == 6)"
        hints:
          - ［30 ÷ 5］ はいくつかな。
          - □ を 30 から 1 ずつ大きくしてみよう。
          - 商が 7 にかわるのは、□ がいくつのときかな。
        paths:
          - [5 × 6 = 30、5 × 7 = 35, □ は 30 から 34 まで, 34]
        note: 35 と答えやすい。［35 ÷ 5］ = 7 になる。あまりは 4 までしかない。
      - part: 挑戦
        text: ［□ ÷ 6］ = 4 となる □ のうち、いちばん小さいものと、いちばん大きいものをたすと、いくつですか。
        answer: 53
        check: "min(x for x in range(100) if x // 6 == 4) + max(x for x in range(100) if x // 6 == 4)"
        hints:
          - いちばん小さいのは、6 でわり切れるときだね。
          - いちばん大きいのは、あまりがいちばん大きいときだね。
          - あまりは、いくつまで大きくなれるかな。
        paths:
          - [いちばん小さいのは 6 × 4 = 24, いちばん大きいのは 24 + 5 = 29, 24 + 29 = 53]
    extra:
