          - [45 こを 7 こずつのまとまりに分けると 6 まとまりと 3 こ, まとまりの終わりの数 7、14、…、42 がちょうど 7 の倍数, のこりの 43、44、45 は 7 の倍数でない, 7 の倍数の数はまとまりの数の 6 で商と同じ]
