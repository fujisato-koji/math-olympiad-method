ntColor">1 ふえる</text><circle cx="131.7" cy="119" r="8" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="145.7" y="124" font-size="13" text-anchor="start" fill="currentColor">4 の倍数</text></svg>'
        explain: たとえば、「［□ ÷ 4］ は、1 から □ までにある 4 の倍数の数。□ を 1 大きくすると、数える数が 1 こふえる。ふえた数が 4 の倍数なら、4 の倍数の数が 1 こふえるので、［□ ÷ 4］ も 1 ふえる。4 の倍数でなければ、4 の倍数の数はかわらない。12 は 4 の倍数なので ［12 ÷ 4］ は ［11 ÷ 4］ より 1 大きく、11 は 4 の倍数ではないので ［11 ÷ 4］ は ［10 ÷ 4］ と同じ。」と書ければよい。あまりを使って「11 ÷ 4 はあまり 3。1 ふえるとあまりが 4 になって、4 のまとまりが 1 つふえる」と書いてもよい（N-022 のくり返し）。
