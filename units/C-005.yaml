    text: 3 けたの数（100 から 999 まで）のうち、4 という数字を 1 つもふくまない数は何こありますか。
    answer: 648
    check: "sum(1 for x in range(100, 1000) if '4' not in '%d' % x)"
    hints:
      - 百のくらい、十のくらい、一のくらいのじゅんに、使える数字が何こあるか考えよう。
      - 百のくらいには 0 も 4 も使えないよ。十のくらいと一のくらいはどうかな。
      - 積の法則で、くらいごとの数をかけよう。
    paths:
      - [百のくらいは 1、2、3、5、6、7、8、9 の 8 通り, 十のくらいと一のくらいは 0 から 9 のうち 4 をのぞいた 9 通りずつ, 8 × 9 = 72、72 × 9 = 648, 648 こ]
    note: 積の法則（C-005）に、3 けたの数のくらい（N-009）とかけ算の筆算（N-074）を合わせる。百のくらいに 0 を入れて 729 にしたり、4 をのぞき忘れたりしやすい。
  - part: 離
    kinds: [道筋]
    text: 1 点のカードが 3 まい、5 点のカードが 2 まい、10 点のカードが 1 まいあります。この中から何まいか（1 まいでも、全部でもよい）出して、点数の合計をつくります。つくれる合計は何通りありますか。
    answer: 19
    check: "len({a + 5 * b + 10 * c for a in range(4) for b in range(3) for c in range(2)} - {0})"
    hints:
      - 1 点のカードだけ、5 点のカードだけで、つくれる合計を書き出してみよう。
      - 5 点のカード 2 まいと、10 点のカード 1 まいは、どちらも 10 点だね。同じ合計を 2 回数えていないかな。
      - 5 点と 10 点のカードでつくれる合計（何も出さない 0 点もふくめて）を先に数え、そこに 1 点のカードの 0 点から 3 点をたそう。
    paths:
      - [5 点と 10 点のカードでつくれるのは 0、5、10、15、20 点の 5 通り, それぞれに 1 点のカードで 0、1、2、3 点をたす, 5 × 4 = 20 通り, 何も出さない 0 点をのぞいて 19 通り]
    note: 出し方は 4 × 3 × 2 − 1 = 23 通りあるが、5 点 2 まいと 10 点 1 まいが同じ 10 点になるので、合計の数はそれより少ない（4 日目のわけ「かけ算が使えないとき」）。数えるのが出し方か合計かを区別させる。23 と答えやすい。
  - part: 離
    kinds: [読み取り, 手数]
    text: おべんとうをつくります。主食は、ごはん、パン、めんから 1 つえらびます。おかずは、肉のおかず 3 しゅるいか、魚のおかず 2 しゅるいから 1 つえらびます。デザートは、3 しゅるいから 1 つえらぶか、つけないかのどちらかです。ただし、パンのときは魚のおかずにしません。おべんとうの組み合わせは何通りですか。
    answer: 52
    check: "sum(1 for s, o, d in itertools.product(('ごはん', 'パン', 'めん'), ('肉1', '肉2', '肉3', '魚1', '魚2'), range(4)) if not (s == 'パン' and o[0] == '魚'))"
    hints:
      - デザートは「つけない」もふくめて何通りかな。
      - パンのときと、ごはんやめんのときに分けて考えよう。
      - それぞれ、おかずの数 × デザートの数を出してから合わせよう。
    paths:
      - [デザートはつけないもふくめて 4 通り, ごはんのとき おかず 5 通り × 4 通り = 20 通り, めんのときも 20 通り, パンのとき おかず 3 通り × 4 通り = 12 通り, 20 + 20 + 12 = 52 通り]
      - [きまりがなければ 3 × 5 × 4 = 60 通り, パンと魚の組み合わせは 1 × 2 × 4 = 8 通り, 60 − 8 = 52 通り]
    note: 和の法則（おかずは肉か魚）、積の法則、「つけない」も 1 通りと数えること、条件で場合を分けることを、長い文から順に拾う。デザートを 3 通りとして 39 にしたり、パンの条件を落として 60 にしたりしやすい。
