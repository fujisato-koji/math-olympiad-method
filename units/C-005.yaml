# C-005 和の法則と積の法則
#
# 書き方は N-001 の頭の注のとおり。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 積の法則、2 日目 和の法則と、たすかかけるかの見分け、3 日目 3 つ以上の積と、和と積の組み合わせ、
#   4 日目 わけ（なぜかけるか、なぜたすか、かけ算が使えないとき）、5 日目 C-003（表と樹形図）・N-013（九九）と混ぜる、6 日目 確認。
# 段 3 なので文は漢字まじり。漢字は小 3 までにし、それより後の字（選、種、類、枝、順など）はひらがなで書く。わけは代表の例で文に書く（②）。
# 前提は C-003 と N-013。かけ算は九九の範囲（2 × 3 × 4 のように九九をつづけて使うのはよい）。3 けたの数（N-009）は前提にないので使わない。
# 同じ物を 2 度使えない並べ方（順列、C-006）と、重なりのある「または」（ベン図、C-008）は後ろの単元なので出さない。和の法則は重ならない場合だけ。
# check は itertools.product で組を作って数えるか、重ならない集まり（set）の和の大きさで数える。
# 式を選ぶ問題の check は、選択肢ごとの式の値と、そうして数えた場合の数とが合うものを選ぶ。

id: C-005
days:
  - day: 1
    items:
      - part: 思い出す
        text: ぼうしが 2 しゅるい、くつが 3 しゅるいあります。ぼうしとくつを 1 つずつえらぶ組み合わせは何通りですか。じゅけい図をかいて数えましょう。
        figure: "🧢🎩\n👟👞🥾"
        answer: 6
        check: "len(set(itertools.product(fig.splitlines()[0], fig.splitlines()[1])))"
        hints:
          - ぼうしを左にたてに書こう。
          - どのぼうしからも、くつのえだをのばそう。
          - えだの先を全部数えよう。
        paths:
          - [じゅけい図をかく, どのぼうしからもえだが 3 本, えだの先を数えて 6 通り]
      - part: 思い出す
        text: 7 × 6 はいくつですか。
        answer: 42
        check: "7 * 6"
        hints:
          - 7 のだんの九九を思い出そう。
          - 7 × 5 = 35 だね。
          - 7 × 6 は、7 × 5 より 7 大きいよ。
        paths:
          - [7 のだんの九九, しちろく 42]
          - [7 × 5 = 35, 35 + 7 = 42]
      - part: 見本
        text: シャツが 3 まい（ア、イ、ウ）、ズボンが 4 本（①②③④）あります。シャツとズボンを 1 つずつえらぶ組み合わせは何通りですか。
        figure: "ア ─ ①②③④\nイ ─ ①②③④\nウ ─ ①②③④"
        explain: じゅけい図をかくと、どのシャツからもズボンのえだが 4 本ずつ出ます。えだの先は、4 本が 3 つ分なので 4 × 3 = 12 通りです。1 つ目のえらび方がどれでも、2 つ目のえらび方が同じ数ずつあるときは、かけ算で数えられます。これを「積（せき）の法則（ほうそく）」といいます。
      - part: 今日
        text: パンが 5 しゅるい、飲み物が 3 しゅるいあります。パンと飲み物を 1 つずつえらぶ組み合わせは何通りですか。
        answer: 15
        check: "len(set(itertools.product(range(5), range(3))))"
        hints:
          - じゅけい図を思いうかべよう。パン 1 つから、飲み物のえだは何本出るかな。
          - どのパンからも、同じ数のえだが出るね。
          - 「〜本ずつが〜つ分」をかけ算の式にしよう。
        paths:
          - [どのパンからもえだが 3 本, 3 本が 5 つ分, 3 × 5 = 15 通り]
        note: 5 + 3 = 8 とたしてしまいやすい。樹形図の枝の先を思いうかべさせ、パン 1 つごとに飲み物が 3 通りずつあることを確かめる。
      - part: 今日
        text: 家から公園まで道が 3 本、公園から駅まで道が 6 本あります。公園を通って、家から駅まで行く行き方は何通りですか。
        answer: 18
        check: "len(set(itertools.product(range(3), range(6))))"
        hints:
          - 家から公園までの道 1 本ごとに、公園から駅までの道は何本あるかな。
          - どの道を通っても、そのあとの道の数は同じだね。
          - かけ算の式にしよう。
        paths:
          - [家から公園の道 1 本ごとに、そのあとが 6 本, 6 本が 3 つ分, 6 × 3 = 18 通り]
        note: C-004 の「町を通る道」を、樹形図を書かずにかけ算で数える問題。
      - part: 今日
        text: 十のくらいを 1、2、3、4 のどれか、一のくらいを 6、7、8、9 のどれかにして、2 けたの数をつくります。何こつくれますか。
        answer: 16
        check: "len(set(10 * a + b for a in range(1, 5) for b in range(6, 10)))"
        hints:
          - 十のくらいを 1 にすると、一のくらいは何通りかな。
          - 十のくらいが 2、3、4 のときも同じだね。
          - 〜通りが何こ分あるかを考えよう。
        paths:
          - [十のくらいが 1 のとき、一のくらいは 4 通り, 十のくらいは 4 通り, 4 × 4 = 16 こ]
      - part: 挑戦
        text: 大小 2 つのサイコロを投げます。目の出方は全部で何通りですか。
        answer: 36
        check: "len(set(itertools.product(range(1, 7), repeat=2)))"
        hints:
          - 大きいサイコロの目は、1 から 6 の 6 通りだね。
          - 大きいサイコロの目が 1 のとき、小さいサイコロの目は何通りかな。
          - 大きいサイコロの目がどれでも、小さいサイコロの目の数は同じだよ。
        paths:
          - [大きいサイコロ 6 通り, そのどれにも小さいサイコロ 6 通り, 6 × 6 = 36 通り]
          - ["6 × 6 の表を書く", "たて 6、よこ 6 のマスを全部かぞえる", "36 通り"]
        note: 大と小を分けずに考えると 21 になる。ここでは大小で分けるので、大 1 小 2 と大 2 小 1 は別の出方。
    extra:
