        explain: えらぶのは、ケーキかアイスのどちらか 1 つです。ケーキをえらぶのは 4 通り、アイスをえらぶのは 3 通りで、ケーキでもありアイスでもあるものはありません。だから 4 + 3 = 7 通りです。「A か B のどちらか」で、A と B が重ならないときは、たし算で数えます。これを「和（わ）の法則」といいます。ケーキとアイスを 1 つずつえらぶときは、積の法則で 4 × 3 = 12 通りです。
