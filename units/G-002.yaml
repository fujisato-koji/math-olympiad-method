  - part: 離
    id: "da2eed6b02"
    kinds: [数, 道筋]
    text: しかくの かみに、まっすぐな せんを 3 ぼん ひきます。ひく ばしょと むきは、じぶんで きめます。かみが いちばん おおく わかれるように ひくと、いくつに わかれますか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="30" width="140" height="140" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="215" y1="55" x2="295" y2="55" stroke="#e05a5a" stroke-width="4" stroke-linecap="round"/><line x1="222" y1="142" x2="256" y2="92" stroke="#e05a5a" stroke-width="4" stroke-linecap="round"/><line x1="280" y1="88" x2="280" y2="148" stroke="#e05a5a" stroke-width="4" stroke-linecap="round"/><text x="255" y="180" font-size="15" text-anchor="middle" fill="currentColor">せん 3 ぼん</text></svg>'
    answer: 7
    check: "1 + 1 + 2 + 3"
    hints:
      - text: 2 ほんの ときは、かみの なかで まじわらせると 4 つに なったね。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="90" y="30" width="140" height="140" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="90" y1="100" x2="230" y2="100" stroke="#e05a5a" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="30" x2="160" y2="170" stroke="#e05a5a" stroke-width="3" stroke-linecap="round"/><text x="125" y="72" font-size="18" text-anchor="middle" fill="currentColor">1</text><text x="195" y="72" font-size="18" text-anchor="middle" fill="currentColor">2</text><text x="125" y="142" font-size="18" text-anchor="middle" fill="currentColor">3</text><text x="195" y="142" font-size="18" text-anchor="middle" fill="currentColor">4</text></svg>'
      - text: 3 ぼんを 1 つの ところで まじわらせると、6 つ。もっと ふやせるかな。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="90" y="30" width="140" height="140" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><line x1="90" y1="100" x2="230" y2="100" stroke="#e05a5a" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="30" x2="230" y2="170" stroke="#e05a5a" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="30" x2="90" y2="170" stroke="#e05a5a" stroke-width="3" stroke-linecap="round"/><text x="160" y="58" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="113" y="86" font-size="16" text-anchor="middle" fill="currentColor">2</text><text x="207" y="86" font-size="16" text-anchor="middle" fill="currentColor">3</text><text x="113" y="128" font-size="16" text-anchor="middle" fill="currentColor">4</text><text x="207" y="128" font-size="16" text-anchor="middle" fill="currentColor">5</text><text x="160" y="156" font-size="16" text-anchor="middle" fill="currentColor">6</text></svg>'
      - 3 ぼんめの せんは、まえの 2 ほんと べつべつの ところで まじわるように、ずらして ひこう。
    paths:
      - [1 ぽんで 2 つ, 2 ほんめが 1 ぽんめと まじわって 4 つ, 3 ぼんめが 2 ほんと べつべつの ところで まじわって 7 つ, 7]
      - [3 ぼんを 1 つの ところで まじわらせると 6 つ, 1 ぽんを すこし ずらすと まんなかに ちいさい さんかくが できる, 7]
    note: 3 ぼんを 1 つの ところで まじわらせると 6 つ、ならべて ひくと 4 つに なる。3 ぼんめが まえの 2 ほんと べつべつの ところで まじわると、3 ぼんめは 3 つの ぶぶんを とおり、それぞれを 2 つに わけるので 3 つ ふえる。かみに かいて、わかれた ぶぶんを 1 つずつ かぞえさせる。
  - part: 離
    id: "d6c7d695a6"
    kinds: [総動員, 手数]
    uses: [C-002]
    text: あかい いろいた（1 ます）と みどりの いろいた（2 ます つながった もの）が、どちらも たくさん あります。これで かげの ますを すきまなく うめます。1 つの いろだけで うめても よい です。いろいたの むきは かえません。うめかたは なんとおり ありますか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="72" y="28" width="44" height="44" fill="#8a8f9c" fill-opacity="0.6" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/><rect x="116" y="28" width="44" height="44" fill="#8a8f9c" fill-opacity="0.6" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/><rect x="160" y="28" width="44" height="44" fill="#8a8f9c" fill-opacity="0.6" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/><rect x="204" y="28" width="44" height="44" fill="#8a8f9c" fill-opacity="0.6" stroke="currentColor" stroke-width="1" stroke-opacity="0.55"/><rect x="70" y="110" width="44" height="44" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="180" y="110" width="88" height="44" rx="3" fill="#7bc96f" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><line x1="224" y1="114" x2="224" y2="150" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="92" y="180" font-size="15" text-anchor="middle" fill="currentColor">1 ます</text><text x="224" y="180" font-size="15" text-anchor="middle" fill="currentColor">2 ます</text></svg>'
    answer: 5
    check: "sum(1 for k in range(5) for c in itertools.product((1, 2), repeat=k) if sum(c) == 4)"
    hints:
      - ひだりから じゅんに、あかを おくか みどりを おくか きめて いこう。
      - text: みどりを つかわないと 1 とおり、2 こ つかうと 1 とおり。みどりを 1 こ だけ つかう ときは どうかな。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="30" width="40" height="40" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="100" y="30" width="40" height="40" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="140" y="30" width="40" height="40" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="180" y="30" width="40" height="40" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="60" y="110" width="80" height="40" rx="3" fill="#7bc96f" fill-opacity="0.75" stroke="currentColor" stroke-width="2.5"/><line x1="100" y1="114" x2="100" y2="146" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="140" y="110" width="80" height="40" rx="3" fill="#7bc96f" fill-opacity="0.75" stroke="currentColor" stroke-width="2.5"/><line x1="180" y1="114" x2="180" y2="146" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="232" y="56" font-size="14" text-anchor="start" fill="currentColor">みどり 0 こ</text><text x="232" y="136" font-size="14" text-anchor="start" fill="currentColor">みどり 2 こ</text></svg>'
      - かいた うめかたが、おなじに なって いないか たしかめよう。
    paths:
      - [みどり なしは あか 4 まいの 1 とおり, みどり 1 こは ひだり・まんなか・みぎ に おいて 3 とおり, みどり 2 こは 1 とおり, ぜんぶで 5 とおり]
      - [ひだりはしに あかを おくと のこり 3 ますで 3 とおり, ひだりはしに みどりを おくと のこり 2 ますで 2 とおり, つづけて かぞえて 5 とおり]
    note: かきだして かぞえる（C-002）を かたちに つかう。みどりの かずで わけると、もれと かさなりが ふせげる。みどりが 1 この ときの おきばしょは「ひだり 2 ます」「まんなか 2 ます」「みぎ 2 ます」の 3 とおり。この かぞえかたは、まえの けっかから かぞえる（C-009）に つながる。
  - part: 離
    id: "ce4cfa4784"
    kinds: [読み取り]
    text: いろの さかいめで きりはなします。いくつの かたちに わかれますか。おなじ いろでも、はなれて いれば べつの かたちです。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="52" y="19" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="106" y="19" width="54" height="54" rx="3" fill="#6fa8f0" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="160" y="19" width="54" height="54" rx="3" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="214" y="19" width="54" height="54" rx="3" fill="#6fa8f0" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="52" y="73" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="106" y="73" width="54" height="54" rx="3" fill="#6fa8f0" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="160" y="73" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="214" y="73" width="54" height="54" rx="3" fill="#6fa8f0" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="52" y="127" width="54" height="54" rx="3" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="106" y="127" width="54" height="54" rx="3" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="160" y="127" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="214" y="127" width="54" height="54" rx="3" fill="#f3c969" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/></svg>'
    answer: 7
    check: "(lambda g: 12 - sum(1 for r in range(3) for c in range(3) if g[r][c] == g[r][c + 1]) - sum(1 for r in range(2) for c in range(4) if g[r][c] == g[r + 1][c]))(['RBYB', 'RBRB', 'YYRY'])"
    hints:
      - text: あかだけを のこして、ほかを うすく したよ。あかは いくつの まとまりかな。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="52" y="19" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="106" y="19" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><rect x="160" y="19" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><rect x="214" y="19" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><rect x="52" y="73" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="106" y="73" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><rect x="160" y="73" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="214" y="73" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><rect x="52" y="127" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><rect x="106" y="127" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/><rect x="160" y="127" width="54" height="54" rx="3" fill="#f08080" fill-opacity="0.75" stroke="currentColor" stroke-width="2"/><rect x="214" y="127" width="54" height="54" rx="3" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/></svg>'
      - あおと きいろも、まとまりごとに かぞえよう。
      - かぞえた まとまりに しるしを つけて、のこりが ないか たしかめよう。
    paths:
      - [あかは 2 つ, あおは 2 つ, きいろは 3 つ（1 ますだけの ところが 2 つ）, 7 こ]
      - [いろの かずの 3 では ない, うえの だんから じゅんに まとまりに しるしを つける, しるしを かぞえて 7 こ]
    note: いろの かず（3）を こたえやすい。おなじ いろでも、へんで つながって いなければ べつの かたち。1 ますだけの かたち（うえの だんの きいろと、したの だんの みぎはしの きいろ）を みおとしやすい。check は、おなじ いろで となりあう へんの かずを、ますの かずから ひく しき（どの かたちも わに なって いないので、これで かたちの かずに なる）。
