# G-002 形を分ける、組み合わせる
#
# 書き方は N-001 の頭の注のとおり。形の絵文字は G-001 と同じ。
# 色板は四角のマス（🟥🟦🟨🟩🟧🟪）で描く。文字の図では三角の色板を組み合わせた形が描けないので、
# 三角の色板は言葉と選ぶ問題で扱い、家で折り紙を対角線で折って確かめる（はさみは使わない）。
# 図の ⬜ は色板のない所、⬛ は影（色板で埋める所）。色の境目を「分けた線」とみる。
# 前提は G-001 だけなので、数は 1 つずつ数えて答える（たし算は使わない）。答えは 10 まで。
# タングラムの日は、影の形を四角の色板で埋める問題にした。本物のタングラム（7 枚）は家にあれば使う。
# 色板を回して入れる・裏返すのは G-004 で扱うので、ここでは向きを変えずに置ける問題だけにする。
# 地図の plan にわけの日がないので、わけは 2〜4 日目に 1 問ずつ置く。
# 色板の数は n(c)、分かれた数は色の種類 len(set(...))、ぴったり入る色板は ⬛ の数で check を付ける。

id: G-002
days:
  - day: 1
    items:
      - part: 見本
        text: しかくの いろいたを ならべて、かたちを つくろう。
        figure: "🟦🟦\n🟦🟦"
        explain: しかくの いろいたを 4 まい ならべると、おおきな しかくが できます。いろいたは ゆびで さして「1、2、3、4」と かぞえて 4 まい です。
      - part: 思い出す
        text: しかくは いくつ ありますか。
        figure: 🟥🔺🟦🔵🟩
        answer: 3
        check: "n('🟥') + n('🟦') + n('🟩')"
        hints:
          - かどが 4 つ ある かたちを さがそう。
          - いろが ちがっても、かどが 4 つなら しかくだよ。
          - しかくだけに しるしを つけて かぞえよう。
        paths:
          - [かどが 4 つの かたちを えらぶ, 🟥 🟦 🟩, 3 こ]
      - part: 思い出す
        text: ひとつだけ ちがう かたちが あります。なかまはずれは どれですか。
        choices: [🔺, 🔻, 🟦]
        answer: 🟦
        hints:
          - それぞれの かどを かぞえてみよう。
          - さかさまでも、かどが 3 つなら さんかくだよ。
          - ひとつだけ かどの かずが ちがうのは どれかな。
        paths:
          - [かどを かぞえる, 🔺 🔻 は 3 つ、🟦 は 4 つ, 🟦]
      - part: 今日
        text: いろいたは なんまい つかって いますか。
        figure: "🟥🟥🟥🟥\n🟥🟥🟥🟥"
        answer: 8
        check: "n('🟥')"
        hints:
          - うえの ならびから かぞえよう。
          - うえを かぞえおわったら、したの ならびに つづけよう。
          - ゆびで さした いろいたに、こころの なかで しるしを つけよう。
        paths:
          - [うえの ならび 1、2、3、4, したに つづけて 5、6、7、8, 8 まい]
        note: 2 列を別々に数えて「4」で止めやすい。下の列は上の続きから数える。
      - part: 今日
        text: かいだんの かたちを つくりました。⬜ は いろいたの ない ところ です。いろいたは なんまい ですか。
        figure: "🟩⬜⬜\n🟩🟩⬜\n🟩🟩🟩"
        answer: 6
        check: "n('🟩')"
        hints:
          - ⬜ は かぞえないよ。
          - うえの だんから じゅんに かぞえよう。
          - したの だんは、うえの つづきの かずから かぞえよう。
        paths:
          - [うえの だん 1, まんなか 2、3, した 4、5、6, 6 まい]
        note: ⬜ も色板と思って数えやすい。何もない所だと言葉で確かめる。
      - part: 今日
        text: さんかくの いろいたを 2 まい、いちばん ながい へんで ぴったり あわせます。どんな かたちが できますか。
        choices: [さんかく, しかく, まる]
        answer: しかく
        hints:
          - おりがみを、かどと かどが あうように ななめに おってみよう。
          - ひらくと、おりめで さんかくが 2 つに わかれて いるね。
          - 2 つ あわせた かたちの かどを かぞえよう。
        paths:
          - [おりがみを ななめに おる, ひらくと さんかく 2 つ, あわせると もとの しかく]
        note: 色板（直角二等辺三角形）がなければ、折り紙を対角線で折って確かめる。はさみは使わなくてよい。
      - part: 挑戦
        text: おなじ しかくの いろいたを 9 まい ならべて、おおきな しかくを つくります。たても よこも おなじ まいすう ならべます。1 れつに なんまい ならべますか。
        answer: 3
        check: "[k for k in range(1, 10) if k * k == 9][0]"
        hints:
          - ためしに 1 れつ 2 まいで ならべてみよう。ぜんぶで なんまい つかうかな。
          - いろいたが あまったら、1 れつを ながく してみよう。
          - ならべた いろいたを かぞえて、ぜんぶ つかえたか たしかめよう。
        paths:
          - [1 れつ 2 まい だと 4 まいで あまる, 1 れつ 3 まい だと 9 まい ぴったり, 3 まい]
        note: おはじきや紙の四角で実際に並べてよい。かけ算は使わず、並べて数える。
