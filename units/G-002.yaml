# G-002 形を分ける、組み合わせる
#
# 段 1・水準 1・5 日。色板を並べて形をつくる、形を線で分ける、影の形を色板でうめる（タングラム）、G-001 と混ぜる、確かめ。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図は svg（D-129）。色板は角の丸い四角、影は灰色のます、色板のない所はてんせんのます。三角の色板（直角二等辺三角形）も svg で描く。
# 色の言い方：あか、あお、きいろ、みどり、むらさき、オレンジ。色の境目を「分けた線」とみる。
# 前提は G-001 だけなので、数は 1 つずつ数えて答える（たし算は使わない）。答えは 10 まで。
# 色板を回して入れる・裏返すのは G-004 で扱うので、ここでは向きを変えずに置ける問題だけにする。
# 地図の plan にわけの日がないので、わけは 2〜4 日目に 1 問ずつ置く。
# check は図の並びを文字で書いた式（R あか、B あお、Y きいろ、G みどり、P むらさき、O オレンジ、K かげ、. なし、d てんせん）。
# 三角の色板や紙を分ける問題は、家で折り紙を折って確かめる（はさみは使わない）。本物のタングラム（7 枚）は家にあれば使う。

