# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: しかくの かみに、まっすぐな せんを 3 ぼん ひきます。かみが いちばん おおく わかれるように ひくと、いくつに わかれますか。
    answer: 7
    check: "1 + 1 + 2 + 3"
    hints:
      - 2 ほんの ときは、2 ほんを かみの なかで まじわらせると 4 つに なったね。
      - 3 ぼんめの せんは、まえの 2 ほんの どちらとも まじわるように ひこう。
      - 3 ぼんの せんが 1 つの ところに あつまらないように、ずらして ひこう。
    paths:
      - [1 ぽんで 2 つ, 2 ほんめが 1 ぽんめと まじわって 4 つ, 3 ぼんめが 2 ほんと べつべつの ところで まじわって 7 つ, 7]
    note: 3 本を 1 点で交わらせると 6 つ、平行にすると 4 つになる。3 本目が前の 2 本と別々の所で交わると、3 本目は 3 つの部分を通り、それぞれを 2 つに分けるので 3 つ増える。紙にかいて、分かれた部分を 1 つずつ数えさせる。
  - part: 離
    kinds: [総動員, 手数]
    uses: [C-002]
    text: ⬛ の かげ 4 マスを、🟥（1 マスの いろいた）と 🟩🟩（2 マス つながった いろいた）で すきまなく うめます。いろいたの むきは かえません。うめかたは なんとおり ありますか。
    figure: "⬛⬛⬛⬛"
    answer: 5
    check: "sum(1 for k in range(5) for c in itertools.product((1, 2), repeat=k) if sum(c) == 4)"
    hints:
      - ひだりから じゅんに、🟥 を おくか 🟩🟩 を おくか きめていこう。
      - 🟩🟩 を つかわない、1 こ つかう、2 こ つかう、の 3 つに わけて かきだそう。
      - かいた うめかたが おなじに なって いないか、たしかめよう。
    paths:
      - [🟩🟩 なしは 🟥🟥🟥🟥 の 1 とおり, 🟩🟩 1 こは ひだり・まんなか・みぎ に おいて 3 とおり, 🟩🟩 2 こは 1 とおり, ぜんぶで 5 とおり]
    note: 書き出して数える（C-002）を形に使う。🟩🟩 の数で分けると、もれと重なりが防げる。🟩🟩 1 こ のときの置き場所は「左 2 マス」「まん中 2 マス」「右 2 マス」の 3 通り。この数え方は、前の結果から数える（C-009）につながる。
  - part: 離
    kinds: [読み取り]
    text: いろの さかいめで きりはなします。いくつの かたちに わかれますか。おなじ いろでも、はなれて いれば べつの かたちです。
    figure: "🟥🟦🟨🟦\n🟥🟦🟥🟦\n🟨🟨🟥🟨"
    answer: 7
    check: "(lambda g: 12 - sum(1 for r in range(3) for c in range(3) if g[r][c] == g[r][c + 1]) - sum(1 for r in range(2) for c in range(4) if g[r][c] == g[r + 1][c]))(fig.splitlines())"
    hints:
      - まず 🟥 だけを みよう。🟥 は いくつの まとまりに なって いるかな。
      - 🟦 と 🟨 も、まとまりごとに かぞえよう。
      - かぞえた まとまりに しるしを つけて、のこりが ないか たしかめよう。
    paths:
      - [🟥 は 2 つ, 🟦 は 2 つ, 🟨 は 3 つ（1 マスだけの ところが 2 つ）, 7 こ]
    note: 色の数（3）を答えやすい。同じ色でも、辺でつながっていなければ別の形。1 マスだけの形（上の段の 🟨 と、下の段の右はしの 🟨）を見落としやすい。check は、つながった同じ色の辺の数を全部のマスの数からひく式（どの形もぐるりと輪になっていないので、これで形の数になる）。
