# N-008 偶数と奇数
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-007 まで。かけ算とわり算はまだ習っていないので、「2 で割り切れる」は使わず、
# 偶数は「2 こずつ くみに すると あまりが ない かず」、奇数は「1 こ あまる かず」で決める。
# 2 日目の「一の位で見分ける」は、N-006 の位（10 のまとまりは いつも くみに できる）から導く。
# 3 日目のわけは ①〜②：くみと あまりの絵を指して「だから」で言う（偶数＋偶数、奇数＋奇数、偶数＋奇数）。
# 0 は偶数（2 日目の予備の挑戦）。2 ずつ跳ぶと偶数にしか止まらない問題は、後の不変量の考えの入口（D-026）。
# 偶数・奇数を文字で表す（A-010）と、余りの類（段 6）は先取りしない。
# 偶奇を選ぶ問題の check は、% 2 で決める式。

id: N-008
days:
  - day: 1
    items:
      - part: 見本
        text: ぐうすうと きすうを しろう。りんごと みかんを、2 こずつ くみに しました。
        figure: "🍎🍎　🍎🍎　🍎🍎\n🍊🍊　🍊🍊　🍊🍊　🍊"
        explain: りんごは 6 こ。2 こずつの くみが 3 つ できて、あまりが ありません。このような かずを ぐうすう と いいます。みかんは 7 こ。くみを つくると 1 こ あまります。1 こ あまる かずを きすう と いいます。6 は ぐうすう、7 は きすう です。
      - part: 思い出す
        text: 24 + 5 は いくつですか。
        answer: 29
        check: "24 + 5"
        hints:
          - いちの くらいどうしを たそう。
          - 4 + 5 は いくつかな。
          - じゅうの くらいの 2 は、そのままだよ。
        paths:
          - [4 + 5 = 9, じゅうの くらいは 2 の まま, 29]
      - part: 思い出す
        text: 38 − 6 は いくつですか。
        answer: 32
        check: "38 - 6"
        hints:
          - いちの くらいから ひこう。
          - 8 − 6 は いくつかな。
          - じゅうの くらいの 3 は、そのままだよ。
        paths:
          - [8 − 6 = 2, じゅうの くらいは 3 の まま, 32]
      - part: 今日
        text: ドーナツの かずは、ぐうすう ですか、きすう ですか。2 こずつ くみに して かんがえよう。
        figure: "🍩🍩🍩🍩🍩🍩🍩🍩"
        choices: [ぐうすう, きすう]
        answer: ぐうすう
        check: "'ぐうすう' if n('🍩') % 2 == 0 else 'きすう'"
        hints:
          - ドーナツを 2 こずつ、ゆびで かこもう。
          - くみに なれなかった ドーナツは あるかな。
          - のこりが ないか、1 こ のこるかを みよう。
        paths:
          - [2 こずつ かこむ, 4 くみ できて あまりが ない, ぐうすう]
      - part: 今日
        text: さかなの かずは、ぐうすう ですか、きすう ですか。
        figure: "🐟🐟🐟🐟🐟🐟🐟🐟🐟"
        choices: [ぐうすう, きすう]
        answer: きすう
        check: "'ぐうすう' if n('🐟') % 2 == 0 else 'きすう'"
        hints:
          - さかなを 2 ひきずつ、ゆびで かこもう。
          - くみに なれなかった さかなは あるかな。
          - のこりが ないか、1 ぴき のこるかを みよう。
        paths:
          - [2 ひきずつ かこむ, 4 くみ できて 1 ぴき あまる, きすう]
        note: 9 ひき と かぞえた ところで とまりやすい。かぞえた あとに、2 ひきずつ かこませる。
      - part: 今日
        text: 5 は、ぐうすう ですか、きすう ですか。
        choices: [ぐうすう, きすう]
        answer: きすう
        check: "'ぐうすう' if 5 % 2 == 0 else 'きすう'"
        hints:
          - かみに まるを 5 こ かいてみよう。
          - まるを 2 こずつ せんで かこもう。
          - かこめずに のこった まるは あるかな。
        paths:
          - [まるを 5 こ かく, 2 くみ できて 1 こ のこる, きすう]
        note: えが ない もんだい。まるを かいて くみに して よいと つたえる。
      - part: 挑戦
        text: 1 から 10 までの かずの なかに、ぐうすうは いくつ ありますか。
        answer: 5
        check: "len([k for k in range(1, 11) if k % 2 == 0])"
        hints:
          - 1 から 10 まで、じゅんに かいてみよう。
          - ひとつずつ、まるを かいて くみに できるか しらべよう。
          - くみに できた かずに しるしを つけて、しるしを かぞえよう。
        paths:
          - [1 から 10 を かく, 2、4、6、8、10 が ぐうすう, 5 こ]
        note: ぐうすうと きすうが 1 つおきに ならぶ ことに きづけば なお よい（2 にちめに つながる）。
