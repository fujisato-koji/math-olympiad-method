# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 🐸 は 0 から、みぎへ とびます。1 かいに とぶのは、3 つか 5 つの どちらかです。ちょうど 4 かい とんで、15 に とまる ことは できますか。
    choices: [できる, できない]
    answer: できない
    check: "('できる' if any(sum(c) == 15 for c in itertools.product([3, 5], repeat=4)) else 'できない')"
    hints:
      - 3 も 5 も、ぐうすうかな、きすうかな。
      - きすうと きすうを たすと、ぐうすうと きすうの どちらに なるかな。
      - 4 かい ぶんを、2 かいずつの くみに して かんがえよう。
    paths:
      - [3 も 5 も きすう, 2 かい とぶと きすう + きすうで ぐうすう, 4 かいは 2 かいの くみが 2 つで ぐうすう, 15 は きすうなので できない]
      - [ためしてみる, とまるのは 12、14、16、18、20 の どれか, 15 は ない, できない]
    note: 1 回ずつ試すと組み合わせが多い。「奇数＋奇数は偶数」（3 日目のわけ）を使えば、4 回とんだあとの位置はいつも偶数だとすぐ分かる。後の不変量（L-009）の考えの入口。「できない」は、全部の場合を調べたか、偶奇で言えたときにだけ言える。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [C-002]
    text: 1 から 7 までの カードが 1 まいずつ あります。2 まいを えらんで、かずを たします。こたえが ぐうすうに なる えらびかたは、なんとおり ありますか。
    figure: "［1］［2］［3］［4］［5］［6］［7］"
    answer: 9
    check: "len([c for c in itertools.combinations(range(1, 8), 2) if sum(c) % 2 == 0])"
    hints:
      - たして ぐうすうに なるのは、どんな 2 まいの ときかな。
      - ぐうすうと ぐうすう、きすうと きすう の ときに わけて かんがえよう。
      - きすうの カードは 1、3、5、7。ここから 2 まいを えらぶ えらびかたを かきだそう。
    paths:
      - [ぐうすうに なるのは ぐうすう どうしか きすう どうし, きすう 2 まいは 1 と 3、1 と 5、1 と 7、3 と 5、3 と 7、5 と 7 の 6 とおり, ぐうすう 2 まいは 2 と 4、2 と 6、4 と 6 の 3 とおり, 6 と 3 を あわせる, 9 とおり]
    note: 偶数＋偶数、奇数＋奇数が偶数になること（3 日目）で調べる組をしぼってから、もれなく書き出す（C-002）。全部の組（21 通り）を足して確かめても解けるが手数が多い。「1 と 3」と「3 と 1」を 2 回数える誤りに気をつける。
  - part: 離
    kinds: [数]
    text: 1 + 2 + 3 + …… + 98 + 99 の こたえは、ぐうすうですか、きすうですか。
    choices: [ぐうすう, きすう]
    answer: ぐうすう
    check: "('ぐうすう', 'きすう')[sum(range(1, 100)) % 2]"
    hints:
      - ぜんぶ たさなくても わかるよ。ぐうすうを いくつ たしても、どう なるかな。
      - 1 から 99 までに、きすうは いくつ あるかな。
      - きすうを 2 こずつ くみに して たすと、どう なるかな。
    paths:
      - [ぐうすうは いくつ たしても ぐうすう, 1 から 99 までの きすうは 50 こで ぐうすう こ, きすうは 2 こずつ くみに できて どの くみも たすと ぐうすう, ぜんぶ ぐうすうの たしざんに なるので ぐうすう]
    note: 答えの数（4950）は段 2 では大きすぎてたせない。偶数は何個たしても偶数、奇数は 2 個ずつ組にすると偶数、と偶奇だけを追う。1 から 99 までの奇数の個数（50）を 49 や 51 と数えちがえやすい（2 日目の「1 から 30 までの奇数」と同じ数え方）。
