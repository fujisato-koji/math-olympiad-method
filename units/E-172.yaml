# E-172 強い形
#
# 段 2・水準 1・4 日。三角形の骨組はくずれにくいこと、紙を折る・丸めると強くなること、アーチがおもさを支えることを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。各日のねらいは次のように決めた。
#   1 日目 三角のわく（四角は押すとたおれる、ななめの棒で三角に分ける）　2 日目 紙を折る（じゃばら）・丸める（つつ）・アーチ
#   3 日目 わけ（三角は 3 本の長さで形が 1 つに決まる）、アーチのあしが外へ開くこと、つつは立てて使うこと　4 日目 確認
# 場面は家でできる実験にした：ストローとモールのわく、積み木（または本）2 つの間にわたした紙のはしと 10 円玉、紙のつつ、ダンボールの切り口。
#   刃物と火は使わない（ストローは切らずにモールでつなぐ）。
# 図の約束：わくはストローを線、つなぎ目を黒い点で描く（つなぎ目はくるくる回る）。紙のはしは斜めから見た図（アーチのあしの問題は横から見た図）で、積み木は茶色。
#   じゃばらは、おりめが積み木から積み木へのびる向きにおる（2 日目の挑戦は、おりめの向きの違い）。
# 数の check は、図の中の数え方（上むき・下むきの三角など）を式にした。
# 腕だめし（離）は 2 問とも読み取り：じっけんの絵の 10 円玉を数えてくらべる、5 つのわくから くずれないものを数える。

