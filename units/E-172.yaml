      - くずれる わくを 数えて、5 から ひいても よいよ。
    paths:
      - [三角だけに 分かれた わくを 数える, 三角、ななめ入りの 四角、ななめ 2 本の 五角, 3 つ]
      - [くずれるのは 四角と 家の 形, 5 − 2 = 3, 3 つ]
    note: 家の形（四角の上に三角）は、下の四角がくずれる。五角はななめ 2 本で三角 3 つになる。
