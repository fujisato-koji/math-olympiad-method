        explain: ストローの つなぎ目が くるくる 回る わくで 考えます。四角の わくは、ぼうの 長さを かえないまま、かどの ひらき方だけを かえられるので、よこから おすと ななめに たおれます。三角の わくは、3 本の ぼうの 長さが きまると、形が 1 つに きまります。だから、つなぎ目が 回っても 形が かわりません。てつの はしや てっとう、家の かべの 中の ななめの ぼう（すじかい）は、この せいしつを 生かして います。おうちでは、ストローに モールを さしこんで つなぎ、四角と 三角の わくを 作って、おして くらべて みましょう。
        note: 四角は押すとななめにたおれる。三角は 3 本の棒の長さで形が決まるのでくずれない。
