        explain: 紙は うすいので、ひらたい ままでは まげる 力に とても 弱いです。じゃばらに おると、紙が たてに 立った ところが でき、まがりにくく なります。ダンボールの 中の なみの 紙も 同じ くふうです。まるめて つつに すると、上からの おもさを つつの まわり ぐるりで ささえるので、たてて 本を のせても つぶれにくく なります。アーチは、上からの おもさを まがった 紙に そって 左右の あしへ つたえます。その とき あしは そとへ ひらこうと するので、つみきなどで あしを おさえると よく ささえます。おうちでは、つみきか 本を 2 つの 山に して 間に 紙を わたし、10 円玉を いくつ のせられるか くらべて みましょう。じゃばらは、おりめが つみきから つみきへ のびる むきに おります。
        note: 同じ紙でも、折る（じゃばら）・丸める（つつ）・アーチにすると強くなる。
