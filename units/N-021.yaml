        explain: たとえば：「50 までの 11 の倍数は 22、33、44。22 = 11 × 2 は 2 の倍数、33 = 11 × 3 は 3 の倍数、44 = 11 × 4 は 2 の倍数なので、どれも 2 や 3 の倍数として、もう消えている。11 × 5 = 55 は 50 をこえる。だから 11 の倍数を消さなくても同じになる。」と書ければよい。13 や 17 の倍数も同じわけで消さなくてよい。7 の倍数の 49 = 7 × 7 は 2、3、5 の倍数ではないので、7 までは消さないといけない（2 日目の、1 から 50 までの素数を数える問題）。100 までなら 7 まで、つまり かけて 100 をこえない「同じ数どうしのかけ算」の数（7 × 7 = 49、11 × 11 は 100 をこえる）まで調べればよい、と話してよい。
