          - 36 を素因数分解すると、どんな素数が出てくるかな。それは 5 や 7 かな。
          - 「35 は〜の倍数なので、36 は〜でわると〜あまる。だから 36 の素因数は〜。」と書いてみよう。
        paths:
          - [35 は 5 の倍数でも 7 の倍数でもある, 36 は 5 でも 7 でもわると 1 あまる, 36 の素因数 2 と 3 は 5 でも 7 でもない, だから新しい素数が見つかる]
