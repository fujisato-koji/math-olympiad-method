# N-021 素数と素因数分解、素数はいくらでもある（主張）
#
# 書き方は N-001 の頭の注、文の漢字は N-017 にそろえた（段 3。分かち書きはしない。えらぶ・こ・まい はかなで書く）。
# 前提は N-017（倍数と約数）と A-009（累乗）。数は 100 まで（1000 までの N-009 は前提にない）。
#   かけ算とわり算は N-017 と同じ範囲（九九と、同じ数をたしていく形）。2 けたの数が 3 や 7 でわり切れるかは、
#   N-017 のわけと同じく「何十とのこり」に分けて見る（51 = 30 + 21）。位の数の和で見分けるのは N-022 なので使わない。
# 素数は「約数が 1 とその数自身の 2 こだけの数」。1 は約数が 1 こなので素数に入れない。
#   素数かどうかは、2、3、5、7 で順にわって調べる（100 までの数なら 7 まででよいわけは 4 日目）。
# 素因数分解は、九九で 2 つの数のかけ算に分け、分けられなくなるまで続ける（かけ算の木）。答えは小さい素数から順にならべ、
#   同じ素数は累乗でまとめる（2 × 2 × 3 = 2² × 3）。累乗は A-009 にならい、右上の小さい数字で書く。check では「**」。
#   素因数分解の式を答える問題は choices にし、check は（選択肢の文字, 素因数の組）の中から、かけると元の数になり、
#   どれも素数であるものをえらぶ。素数かどうかの check は all(p % d for d in range(2, p))。
# 「素数はいくらでもある」は主張として示し、わけは 2 × 3 × 5 + 1 = 31 や 5 × 7 + 1 = 36 のような代表の例で書く（段 3 は ②）。
#   どんな素数の組でも同じことが言えるという筋道（背理法）は N-030 なので、ここでは求めない。
#   素因数分解が 1 通りしかないことも主張として使う（わけは示さない。どの分け方でも同じになる例を見るだけ）。
# 約数の個数を素因数分解から出すのは N-024、公約数と公倍数は N-018（前提にない）なので出さない。
#   偶数・奇数の語は N-008 が前提にないので使わない（「2 の倍数」と書く）。
# 2 つの素数の和の問題は、ゴールドバッハの予想（open-kids の未解決問題）への入口として置いた（D-026）。
# 日の並び（既定）：1 日目 素数、2 日目 素数のさがし方（ふるい、2・3・5・7 でわる）、3 日目 素因数分解、4 日目 わけ、
#   5 日目 N-017（倍数と約数）と A-009（累乗）と混ぜる、6 日目 確認。
# 図は svg で描く（D-129）。素数は ○ を長方形にならべた図（1 列にしかならない）、ふるいは数の表に消した倍数の色のななめ線、
#   2 けたの数は 10 のたばとばら、「何十とのこり」は 2 つに分けた帯、素因数分解はかけ算の木（素数は色の丸。2 空色・3 緑・5 赤・7 むらさき）。
# ただし腕だめしの総動員（倍数にならない 10 こ）だけは例外で、uses に L-006、L-007、C-005、C-008 を挙げて、10 の組に 1 こずつ入ること（鳩の巣の考え）、場合分け、積の法則、ベン図で重なりを数えることを使う。

