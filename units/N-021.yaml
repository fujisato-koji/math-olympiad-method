        explain: たとえば：「5 × 7 = 35 は 5 の倍数でも 7 の倍数でもあるので、36 は 5 でわっても 7 でわっても 1 あまる。だから 36 の素因数（2 と 3）は、5 でも 7 でもない。36 は 1 より大きいので、素因数分解すると素数が少なくとも 1 つは出てくる。それは 5 と 7 のほかの、新しい素数になる。」と書ければよい。どんな素数を集めても、ぜんぶかけて 1 をたした数を素因数分解すれば、集めた素数にない素数が出てくるので、素数はいくらでもある（これがこの単元で言いたいこと）。ここでは 5 と 7 のような 1 つの組で書ければ十分で、どんな素数の集まりでも言えることを、すじ道を立てて書くのは N-030。「5 × 7 + 1 そのものが素数になる」とはかぎらない（36 は素数ではない）ことにも気づかせる。
        hints:
