    check: "min(p * q * r for p in range(2, 30) for q in range(p + 1, 30) for r in range(q + 1, 30) if p + q + r == 30 and all(all(x % d for d in range(2, x)) for x in (p, q, r)))"
    hints:
      - 2 のほかの素数は、どれも奇数だね。奇数を 3 つたすと、偶数になるかな、奇数になるかな。
      - 30 は偶数なので、3 つの素数の中に 2 が入っているはずだね。のこりの 2 つの素数をたすといくつかな。
      - たすとその数になる 2 つのちがう素数の組を、ぜんぶさがそう。それぞれ 3 つの素数をかけてくらべよう。
    paths:
      - [3 つとも奇数だと和は奇数になるので、2 が入る, のこりの 2 つの素数の和は 28, 28 = 5 + 23 = 11 + 17, 2 × 5 × 23 = 230 と 2 × 11 × 17 = 374 で、小さいのは 230]
    note: 偶奇（L-005）で「3 つの素数の 1 つは 2」と決めてから、2 つの素数の和（1 日目の挑戦の型）にする。2 が入ることに気づかないと、さがす組がとても多くなる。
  - part: 離
    kinds: [手数]
    text: 2 けたの数のうち、素因数分解すると、ちがう素数がちょうど 3 種類出てくる数は何こありますか。たとえば 60 = 2² × 3 × 5 は、2、3、5 の 3 種類です。
    answer: 8
    check: "sum(1 for k in range(10, 100) if sum(1 for p in range(2, k + 1) if k % p == 0 and all(p % d for d in range(2, p))) == 3)"
    hints:
      - 3 種類の素数をかけると、いちばん小さい組でも 2 × 3 × 5 = 30 になるね。使える素数の組はあまり多くないよ。
      - まず、ちがう 3 つの素数を 1 回ずつかけて 2 けたになる組を、2 × 3 × □ から順にさがそう。
      - 次に、どれかの素数を 2 回以上使っても 2 けたのままの数をさがそう。
    paths:
      - [1 回ずつは 2 × 3 × 5 = 30、2 × 3 × 7 = 42、2 × 3 × 11 = 66、2 × 3 × 13 = 78、2 × 5 × 7 = 70 の 5 こ, 2 回使うのは 2² × 3 × 5 = 60、2² × 3 × 7 = 84、2 × 3² × 5 = 90 の 3 こ, 3 × 5 × 7 = 105 や 2³ × 3 × 5 = 120 は 3 けた, 5 + 3 = 8 こ]
    note: 素数の組を小さいほうから順にさがし、同じ素数をくり返し使う場合も落とさない（場合の分け方と手数）。例に出した 60 も数える中に入る。1 回ずつの組だけで 5 こと答えやすい。
  - part: 離
    kinds: [道筋]
    text: 続いた 3 つの《整数》をかけると 990 になります。3 つの整数のうち、いちばん小さい数はいくつですか。
    answer: 9
    check: "[k for k in range(1, 30) if k * (k + 1) * (k + 2) == 990][0]"
    hints:
      - 990 を素因数分解してみよう。990 = 99 × 10 と分けるとやりやすいよ。
      - 素因数の中に 11 があるので、3 つの数のどれかは 11 の《倍数》だね。10 × 10 × 10 = 1000 なので、3 つの数はどれも 10 に近そうだよ。
      - 11 をふくむ続いた 3 つの数をかけて、たしかめよう。
    paths:
      - [990 = 99 × 10 = 2 × 3² × 5 × 11, 3 つの数のどれかは 11 の倍数, 11 をふくむ続いた 3 つの数は 9、10、11 と 10、11、12 と 11、12、13, 9 × 10 × 11 = 990 なので 9]
    note: 素因数分解から、大きな素因数 11 をふくむ続いた 3 つの数にしぼる。10 × 11 × 12 = 1320 は大きすぎる。いきなり当てはめるより、素因数の 11 に目を付けるのが道筋。
  - part: 離
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - L-006
    - L-007
    - C-005
    text: 1 から 20 までの数の中から、ちがう数を 10 こえらびます。ただし、えらんだ数のどの 2 つをとっても、大きいほうが小さいほうの倍数になってはいけません。たとえば、6 と 18 は、18 が 6 の倍数なので、両方はえらべません。えらび方はぜんぶで何通りありますか。
    answer: 26
    check: sum(1 for s in itertools.combinations(range(1, 21), 10) if all(b % a for a, b in itertools.combinations(s, 2)))
    hints:
    - 3、6、12 や 5、10、20 のように、どの 2 つも大きいほうが小さいほうの倍数になっている数のなかまを見つけよう。なかまはいくつできるかな。10 こえらぶには、なかまをどう使えばよいかな。
    - 1 こしか入っていないなかまの数は、かならず入るね。その数から、入れない数が決まるよ。
    - えらぶ数で、ほかのなかまの数がいちばん多く入れなくなるのは、1、2、4、8、16 のなかまだね。そこからどれをえらぶかで分けよう。
    paths:
    - - どの数も、2 でわれるだけわると、2 でわり切れない数がのこる（12 → 6 → 3）。これを「もと」とよぶ。もとが同じ数どうし（3、6、12 など）は、小さいほうに 2 を何回かかけると大きいほうになるので、大きいほうが小さいほうの倍数。だから、もとが同じ数は 1 こまでしかえらべない
      - 1 から 20 までで、もとは 1、3、5、…、19 の 10 こ。10 こえらぶには、もとごとの 10 の組から、1 こずつえらぶしかない
      - 11、13、15、17、19 は、組に 1 こしかないのでかならず入る。15 が入るので、15 の約数の 3 と 5 は入れない。だから、3 の組からは 6 か 12、5 の組からは 10 か 20 で、どれも 2 でわり切れる。1 はどの数の約数でもあり、2 は 6、12、10、20 の約数なので、1 と 2 も入れない。1 の組からは 4、8、16 のどれか
      - 1 の組からえらぶ数で分ける。5 の組の 10、20 と、7 の組の 7、14 は、4 のほかは、のこりのどの数とも倍数の関係にならない。4 なら、4 は 12 と 20 の約数なので 6 と 10、6 は 18 の約数なので 9。7 の組は 7 か 14 で 2 通り。8 なら、8 はほかのどの数の約数でも倍数でもないので、3 の組と 9 の組は 6 と 9、12 と 9、12 と 18 の 3 通り（6 と 18 はだめ）、5 の組は 10 か 20、7 の組は 7 か 14 で、3 × 2 × 2 = 12 通り。16 も、ほかのどの数の約数でも倍数でもないので、8 のときと同じで 12 通り
      - 合わせて 2 + 12 + 12 = 26 通り
    - - どの数も、2 でわれるだけわると、2 でわり切れない数がのこる（12 → 6 → 3）。これを「もと」とよぶ。もとが同じ数どうし（3、6、12 など）は、小さいほうに 2 を何回かかけると大きいほうになるので、大きいほうが小さいほうの倍数。だから、もとが同じ数は 1 こまでしかえらべない。もとは 1 から 19 の 10 こなので、10 の組から 1 こずつえらぶ
      - もと ○ の組からえらんだ数が、○ に 2 を何回かけた数かを「○ の回数」とよぶ。○ に 2 を a 回かけた数が、△ に 2 を b 回かけた数の約数になるのは、○ が △ の約数で、a が b 以下のとき（素因数分解で、2 の数と、のこりの素因数を見る）。だから、○ が △ の約数（○ と △ はちがうもと）なら、○ の回数は △ の回数より多くなければならない。△ のほうが大きいので、△ の側が ○ の側の約数になることはない。約数の関係にないもとどうしは、回数を自由にえらべる
      - 20 までのもとで約数と倍数の関係にあるのは、1 とほかの全部、3 と 9、3 と 15、5 と 15。11 から 19 の回数は 0（2 をかけると 20 をこえる）。回数は、1 が 4 まで、3 と 5 が 2 まで、7 と 9 が 1 まで。だから、3 の回数と 5 の回数は 1 以上、9 の回数は 3 の回数より少なく、1 の回数はほかのどれよりも多い
      - 3 の回数で分ける。1 のとき、9 の回数は 0。5 の回数が 1 なら 1 の回数は 2、3、4 の 3 通り、2 なら 3、4 の 2 通りで、7 の回数の 0 か 1 とあわせて (3 + 2) × 2 = 10 通り。2 のとき、9 の回数は 0 か 1、5 の回数は 1 か 2、7 の回数は 0 か 1、1 の回数は 3 か 4 で、2 × 2 × 2 × 2 = 16 通り
      - 合わせて 10 + 16 = 26 通り
    note: 工夫は 3 段：①2 でわれるだけわったのこり（もと）で 10 の組に分け、もとが同じ数どうしは倍数の関係なので、10 の組から 1 こずつえらぶ（素因数分解、docs/hardest-structures.md の S11、鳩の巣 S08）、②1 こだけの組の 11〜19 がかならず入り、15 から 3 と 5 が、6 か 12 と 10 か 20 から 1 と 2 が入れないと決まる、③しばりのいちばん強い 1 の組からえらぶ数で場合分けする（場合分けの設計、S15）。2 本目は、2 をかけた回数を数におきかえ、「約数の関係にあるもとでは、小さいほうの回数が多い」というきまりの数え上げにする（置きかえ、S19）。単元の頭注に合わせて「奇数」「整数」の語は使わず、「もと」とよぶ。同じ問いで数の大きいもの（1 から 50 で 25 こ）が 2022 年の JMO 予選の 10 番にあり、ここでは 1 から 20 で 10 こにした類題（問題文の写しではない）。数の並びは OEIS A174094。check は、1 から 20 から 10 こえらぶ 184,756 通りを全部調べ、どの 2 つも倍数の関係にならないものを数える（26）。1 から n で n ÷ 2 こえらぶ数は、n が 10、12、14、16、18 で 4、6、12、10、14。
