        id: "e520cda508"
        text: 70 を素因数分解したものはどれですか。
        svg: '<svg viewBox="0 0 320 122" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="15" text-anchor="middle" fill="currentColor">70 をかけ算の木で分ける</text><line x1="160" y1="66" x2="230" y2="87" stroke="currentColor" stroke-width="1.5"/><line x1="160" y1="66" x2="90" y2="87" stroke="currentColor" stroke-width="1.5"/><rect x="73" y="88" width="34" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="90" y="107" font-size="15" text-anchor="middle" fill="currentColor">?</text><rect x="213" y="88" width="34" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/><text x="230" y="107" font-size="15" text-anchor="middle" fill="currentColor">?</text><text x="160" y="107" font-size="15" text-anchor="middle" fill="currentColor">×</text><rect x="141" y="38" width="38" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="160" y="57" font-size="15" text-anchor="middle" fill="currentColor">70</text></svg>'
        choices: [2 × 5 × 7, 7 × 10, 2 × 35]
        answer: 2 × 5 × 7
        check: "[s for s, f in (('2 × 5 × 7', (2, 5, 7)), ('7 × 10', (7, 10)), ('2 × 35', (2, 35))) if math.prod(f) == 70 and all(all(p % d for d in range(2, p)) for p in f)][0]"
        hints:
          - 素因数分解は、かけ算の木で、いちばん下の数がぜんぶ素数になるまで分けたものだね。
          - text: 70 = 7 × 10 から、さらに分けていこう。
