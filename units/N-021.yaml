  - day: 3
    items:
      - part: 見本
        id: "b6f051fa74"
        text: 60 を、素数だけのかけ算で表します。かけ算の木で、素数になるまで分けていきます。60 = 2 × 2 × 3 × 5 = 2² × 3 × 5。これを 60 の素因数分解といい、2、3、5 を 60 の素因数といいます。
        svg: '<svg viewBox="0 0 320 204" xmlns="http://www.w3.org/2000/svg"><text x="160" y="20" font-size="15" text-anchor="middle" fill="currentColor">かけ算の木</text><line x1="160" y1="66" x2="230" y2="87" stroke="currentColor" stroke-width="1.5"/><line x1="230" y1="116" x2="265" y2="137" stroke="currentColor" stroke-width="1.5"/><line x1="230" y1="116" x2="195" y2="137" stroke="currentColor" stroke-width="1.5"/><line x1="160" y1="66" x2="90" y2="87" stroke="currentColor" stroke-width="1.5"/><line x1="90" y1="116" x2="125" y2="137" stroke="currentColor" stroke-width="1.5"/><line x1="90" y1="116" x2="55" y2="137" stroke="currentColor" stroke-width="1.5"/><circle cx="55" cy="152" r="15" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="55" y="157" font-size="15" text-anchor="middle" fill="currentColor">2</text><circle cx="125" cy="152" r="15" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="125" y="157" font-size="15" text-anchor="middle" fill="currentColor">3</text><text x="90" y="157" font-size="15" text-anchor="middle" fill="currentColor">×</text><rect x="71" y="88" width="38" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="90" y="107" font-size="15" text-anchor="middle" fill="currentColor">6</text><circle cx="195" cy="152" r="15" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="195" y="157" font-size="15" text-anchor="middle" fill="currentColor">2</text><circle cx="265" cy="152" r="15" fill="#f08080" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5"/><text x="265" y="157" font-size="15" text-anchor="middle" fill="currentColor">5</text><text x="230" y="157" font-size="15" text-anchor="middle" fill="currentColor">×</text><rect x="211" y="88" width="38" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="230" y="107" font-size="15" text-anchor="middle" fill="currentColor">10</text><text x="160" y="107" font-size="15" text-anchor="middle" fill="currentColor">×</text><rect x="141" y="38" width="38" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="160" y="57" font-size="15" text-anchor="middle" fill="currentColor">60</text><text x="160" y="192" font-size="15" text-anchor="middle" fill="currentColor">60 = 2 × 2 × 3 × 5 = 2² × 3 × 5</text></svg>'
        explain: 60 を九九で 2 つの数のかけ算に分けると 60 = 6 × 10 です。6 = 2 × 3、10 = 2 × 5 なので、60 = 2 × 3 × 2 × 5。どれも素数になったら、小さいじゅんにならべて 2 × 2 × 3 × 5。同じ 2 が 2 こあるので、2² × 3 × 5 と書きます。このように、素数だけのかけ算で表すことを素因数分解といい、2、3、5 を 60 の素因数といいます。はじめに 60 = 4 × 15 と分けても、4 = 2 × 2、15 = 3 × 5 で、同じ 2² × 3 × 5 になります。図の木では、素数（もう分けられない数）を色の丸、まだ分けられる数を四角でかいています。素数ごとに色をそろえています（2 は空色、3 は緑、5 は赤、7 はむらさき）。
