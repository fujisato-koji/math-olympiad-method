        explain: 《約数》が 1 とその数自身の 2 こだけの数を、素数といいます。2 の約数は 1、2。3 は 1、3。4 は 1、2、4 で 3 こあるので素数ではありません。同じように調べると、1 から 10 までの素数は 2、3、5、7 です。1 は約数が 1 の 1 こだけなので、素数に入れません。4、6、8、9、10 は、2 つの数のかけ算（2 × 2、2 × 3、2 × 4、3 × 3、2 × 5）に分けられるので、素数ではありません。図では、その数だけの ○ を長方形にならべています。たて × よこ のならべ方が 1 × その数 しかない（1 列にしかならない）のが素数です。たての数とよこの数が約数になります（N-017 のタイルの図と同じ）。
