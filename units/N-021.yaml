    paths:
    - - どの数も、2 でわれるだけわると、2 でわり切れない数がのこる（12 → 6 → 3）。これを「もと」とよぶ。もとが同じ数どうし（3、6、12 など）は、小さいほうに 2 を何回かかけると大きいほうになるので、大きいほうが小さいほうの倍数。だから、もとが同じ数は 1 こまでしかえらべない
      - 1 から 20 までで、もとは 1、3、5、…、19 の 10 こ。10 こえらぶには、もとごとの 10 の組から、1 こずつえらぶしかない
      - 11、13、15、17、19 は、組に 1 こしかないのでかならず入る。15 が入るので、15 の約数の 3 と 5 は入れない。だから、3 の組からは 6 か 12、5 の組からは 10 か 20 で、どれも 2 でわり切れる。1 はどの数の約数でもあり、2 は 6、12、10、20 の約数なので、1 と 2 も入れない。1 の組からは 4、8、16 のどれか
      - 1 の組からえらぶ数で分ける。5 の組の 10、20 と、7 の組の 7、14 は、4 のほかは、のこりのどの数とも倍数の関係にならない。4 なら、4 は 12 と 20 の約数なので 6 と 10、6 は 18 の約数なので 9。7 の組は 7 か 14 で 2 通り。8 なら、8 はほかのどの数の約数でも倍数でもないので、3 の組と 9 の組は 6 と 9、12 と 9、12 と 18 の 3 通り（6 と 18 はだめ）、5 の組は 10 か 20、7 の組は 7 か 14 で、3 × 2 × 2 = 12 通り。16 も、ほかのどの数の約数でも倍数でもないので、8 のときと同じで 12 通り
      - 合わせて 2 + 12 + 12 = 26 通り
    - - えらんだ数を、20 をこえない間 2 倍していくと、11 から 20 のどれかで止まる（7 → 14、3 → 6 → 12、5 → 10 → 20。11 から 20 の数はそのまま）。2 つのえらんだ数が同じ数で止まるなら、小さいほうを何回か 2 倍すると大きいほうになるので、大きいほうが小さいほうの倍数になる。止まる数は 11 から 20 の 10 こしかないので、えらぶ 10 こは、11、12、…、20 のそれぞれに 1 こずつ止まる
      - 11、13、15、17、19 は 2 でわり切れないので、2 倍してこの数になる数はなく、この 5 つで止まる数はそれ自身だけ。だから 5 つともかならず入る。15 が入るので 3 と 5 は入れない。12 で止まる数は 3、6、12 なので 6 か 12、20 で止まる数は 5、10、20 なので 10 か 20 で、どちらも 2 でわり切れる。1 はどの数の約数でもあり、2 は 6、12、10、20 の約数なので、16 で止まる 1、2、4、8、16 のうち 1 と 2 は入れない。14 で止まる数は 7 か 14、18 で止まる数は 9 か 18
      - のこる 12、14、16、18、20 で止まる数のえらび方は、2 × 2 × 3 × 2 × 2 = 48 通り。この中で、止まる数がちがうのに倍数の関係になる 2 つは、4 と 12、4 と 20、6 と 18 だけ（4 の倍数 8、12、16、20 のうち 8 と 16 は 4 と同じ 16 で止まる。6 の倍数 12、18 のうち 12 は同じ 12 で止まる。7、8、9、10 の倍数で 20 までのものは同じ数で止まる。12 から 20 の数の倍数は 20 までにない）
      - だめなえらび方を、2 つの集まりのベン図を 2 回使って数える。まず、4 と 12 をふくむもの（14、18、20 で止まる数を自由にえらんで 2 × 2 × 2 = 8 通り）と、4 と 20 をふくむもの（14、12、18 で止まる数で 8 通り）の重なりは、4、12、20 をふくむもので、14、18 で止まる数の 2 × 2 = 4 通り。どちらかをふくむものは 8 + 8 − 4 = 12 通り
      - 次に、この 12 通りと、6 と 18 をふくむもの（14、16、20 で止まる数で 2 × 3 × 2 = 12 通り）の重なりは、4、6、18、20 をふくむもの（12 で止まる数は 6 なので、12 は入らない）で、14 で止まる数の 2 通り。だめなものは 12 + 12 − 2 = 22 通り。よいえらび方は 48 − 22 = 26 通り
    note: 考えどころは 3 つ：①2 でわれるだけわったのこり（もと）で 10 の組に分け、もとが同じ数どうしは倍数の関係なので、10 の組から 1 こずつえらぶ（素因数分解、docs/hardest-structures.md の S11、鳩の巣 S08）、②1 こだけの組の 11〜19 がかならず入り、15 から 3 と 5 が、6 か 12 と 10 か 20 から 1 と 2 が入れないと決まる、③しばりのいちばん強い 1 の組からえらぶ数で場合分けする（場合分けのくみ立て、S15）。2 本目は、もとの代わりに、20 をこえない間 2 倍して止まる数（11〜20）で 10 の組を見る（S04）。かならず入る数と入れない数を決めたあとは場合分けをせず、のこる 48 通りから、倍数の関係になる 3 つの組（4 と 12、4 と 20、6 と 18）のどれかをふくむ 22 通りを、2 つの集まりのベン図を 2 回使って引く（重なりを数える、C-008。3 つの集まりの重なりは使わない）。1 本目は 1 の組からえらぶ数で分けてよいものを数え、2 本目はだめなものを数えて全体から引く。単元の頭注に合わせて「奇数」「整数」の語は使わず、「もと」とよぶ。同じ問いで数の大きいもの（1 から 50 で 25 こ）が 2022 年の JMO 予選の 10 番にあり、ここでは 1 から 20 で 10 こにしたにた問題（問題文の写しではない）。数の並びは OEIS A174094。check は、1 から 20 から 10 こえらぶ 184,756 通りを全部調べ、どの 2 つも倍数の関係にならないものを数える（26）。1 から n で n ÷ 2 こえらぶ数は、n が 10、12、14、16、18 で 4、6、12、10、14。
