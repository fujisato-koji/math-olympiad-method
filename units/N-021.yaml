        explain: たとえば：「2 × 3 × 5 = 30 は、2 の倍数でも、3 の倍数でも、5 の倍数でもある。31 は 30 より 1 大きいので、2 でわっても、3 でわっても、5 でわっても 1 あまる。だから 31 は 2、3、5 のどれでもわり切れない。」と書ければよい。31 を 2、3、5 で 1 つずつわってたしかめただけでは、「かけた数に 1 をたすと、かけた素数ではわり切れない」というわけにならないことを話す。図の 30 こは、2 こずつでも 3 こずつでも 5 こずつでもぴったりかこめ、ふえた 1 こ（赤）はどのかこみにも入らない。
        hints:
          - text: 30 こを 2 こずつ、3 こずつ、5 こずつかこむと、どれもぴったりかこめるね。2 × 3 × 5 は、2 の倍数かな。3 の倍数、5 の倍数ではどうかな。
