        explain: 「一般解には任意定数 C が 1 つあります。初期条件 y(x₀) = y₀ を入れると、C についての方程式が 1 つでき、C が 1 つに決まります。1 階の微分方程式は C が 1 つなので、条件 1 つで解が 1 つに決まります。」と書ければよい。① C は 1 つ、② 条件を入れる、③ C が決まる。図で見ると、C のちがう曲線は上下にずれていて交わらないので、1 つの点を通るのは 1 本だけです。y′ = 2x、y(1) = 3 なら 3 = 1 + C で C = 2 です。
        hints:
          - 一般解には、決まっていない定数がいくつありますか。
          - text: 図で、x = 1 の線の上の曲線の高さを見ましょう。C のちがう曲線どうしは交わるでしょうか。
