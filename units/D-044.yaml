        id: "395685790b"
        text: |-
          応用：y′ = ky は「ふえる速さが、いまの量 y に比例する」という式です（t は時間で、y′ は y を t で微分したもの）。
          k > 0 ならふえ続け、k < 0 ならへり続け、k = 0 ならそのままです（図）。ふえるほど速くふえ、へるほどゆっくりへります。
          へるとき、量が半分になるまでの時間を半減期といいます。半分のさらに半分になるのにも、同じ時間がかかります。
          お茶が冷めるときのお茶と部屋の温度の差や、体の中の薬の量も、この形の式で表せます。
