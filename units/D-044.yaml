        id: "5982c88820"
        text: |-
          初期条件：「x = x₀ のとき y = y₀」という条件 y(x₀) = y₀ をあたえると、C が決まり、解が 1 つになります。
          例：y′ = x、y(2) = 1。一般解 y = x²/2 + C に x = 2、y = 1 を入れると 1 = 2 + C で C = −1。解は y = x²/2 − 1 です。
          図で、一般解の曲線のうち点 (2, 1) を通るものは 1 本だけです。1 階の微分方程式は、初期条件 1 つで解が決まります。
