        explain: |-
          y が正のとき、k > 0 なら y′ = ky > 0 でふえ、ふえるほど y′ も大きくなるので、ふえ方はどんどん速くなります。k < 0 なら y′ < 0 でへり、へるほど y′ の大きさも小さくなるので、へり方はゆっくりになって 0 に近づきます。
          y′ = ky の解は指数関数になり（今日の 1 問目）、同じ時間がたつごとに同じ倍率で変わります。だから、どの時刻から数えても、半分になるまでの時間は同じです。
        note: y′ = ky → y = y₀ e^(kt)。半減期 T = log 2/|k|。見本には今日の 2 問の答え（解の式と T の式）を書かない。
