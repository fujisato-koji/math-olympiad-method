 x2="234" y2="25" stroke="#2f7fc1" stroke-width="2.6" stroke-linecap="round"/><text x="240" y="30" font-size="13" text-anchor="start" fill="#2f7fc1">y = x² + 2</text><line x1="218" y1="47" x2="234" y2="47" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><text x="240" y="52" font-size="13" text-anchor="start" fill="currentColor">y = x²</text><line x1="218" y1="69" x2="234" y2="69" stroke="#d0504a" stroke-width="2.6" stroke-linecap="round"/><text x="240" y="74" font-size="13" text-anchor="start" fill="#d0504a">y = x² − 1</text><text x="265" y="122" font-size="13" text-anchor="middle" fill="currentColor">x = 1 での</text><text x="265" y="140" font-size="13" text-anchor="middle" fill="#3a8f3f" font-weight="bold">傾き（緑の線）は</text><text x="265" y="158" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">どれも同じ</text></svg>'
        explain: 「y′ = 2x の両辺を x で積分すると y = x² + C。C は定数なので微分すると 0 になり、C がどんな値でも式を満たします。逆に、解 y があれば (y − x²)′ = 2x − 2x = 0 なので、y − x² は定数です。だから一般解は y = x² + C で、ほかに解はありません。」と書ければよい。① 両辺を積分、② 積分定数 C は何でもよい、③ 微分して確かめる（ほかに解がないことも）。C に 0、1、−5 などを入れて、微分して確かめましょう。
        hints:
          - 両辺を x で積分します。微分すると 2x になる関数を 1 つ見つけましょう。
          - text: 見つけた関数に定数を足しても、微分した結果は変わりません。
            svg: '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><rect x="24" y="14" width="100" height="36" rx="8" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="1.6"/><text x="74" y="38" font-size="16" text-anchor="middle" fill="currentColor">x²</text><line x1="130" y1="32" x2="182" y2="32" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="190,32 182,36 182,28" fill="#c98512" stroke="none"/><text x="160" y="24" font-size="12" text-anchor="middle" fill="#c98512" font-weight="bold">微分</text><rect x="196" y="14" width="100" height="36" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="246" y="38" font-size="16" text-anchor="middle" fill="currentColor">2x</text><rect x="24" y="60" width="100" height="36" rx="8" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="1.6"/><text x="74" y="84" font-size="16" text-anchor="middle" fill="currentColor">x² + 5</text><line x1="130" y1="78" x2="182" y2="78" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="190,78 182,82 182,74" fill="#c98512" stroke="none"/><text x="160" y="70" font-size="12" text-anchor="middle" fill="#c98512" font-weight="bold">微分</text><rect x="196" y="60" width="100" height="36" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="246" y="84" font-size="16" text-anchor="middle" fill="currentColor">2x</text><rect x="24" y="106" width="100" height="36" rx="8" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="1.6"/><text x="74" y="130" font-size="16" text-anchor="middle" fill="currentColor">x² − 3</text><line x1="130" y1="124" x2="182" y2="124" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="190,124 182,128 182,120" fill="#c98512" stroke="none"/><text x="160" y="116" font-size="12" text-anchor="middle" fill="#c98512" font-weight="bold">微分</text><rect x="196" y="106" width="100" height="36" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6"/><text x="246" y="130" font-size="16" text-anchor="middle" fill="currentColor">2x</text><text x="160" y="168" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">定数を足しても、微分は同じ</text></svg>'
          - 逆に、解 y があれば、y − x² を微分すると 0 です。微分して 0 になる関数は定数です（D-005）。
        paths:
          - [両辺を積分して x² + C, (x² + C)′ = 2x で C は何でもよい, 一般解は y = x² + C]
          - [解 y があれば (y − x²)′ = 0, y − x² は定数 C, y = x² + C のほかに解はない]
      - part: わけ
        id: "cb5605b57f"
        text: 変数分離で y′ = xy が解けるわけを説明しましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="36" font-size="20" text-anchor="middle" fill="currentColor"><tspan fill="#2f7fc1" font-weight="bold">dy</tspan><tspan fill="currentColor">/</tspan><tspan fill="#c98512" font-weight="bold">dx</tspan><tspan fill="currentColor"> = </tspan><tspan fill="#c98512" font-weight="bold">x</tspan><tspan fill="currentColor"> × </tspan><tspan fill="#2f7fc1" font-weight="bold">y</tspan></text><text x="160" y="66" font-size="13" text-anchor="middle" fill="#c98512" font-weight="bold">y の仲間を左へ、x の仲間を右へ</text><line x1="160" y1="73" x2="160" y2="89" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="160,96 156.5,89 163.5,89" fill="#c98512" stroke="none"/><text x="82" y="108" font-size="13" text-anchor="middle" fill="#2f7fc1" font-weight="bold">y の仲間</text><text x="238" y="108" font-size="13" text-anchor="middle" fill="#c98512" font-weight="bold">x の仲間</text><rect x="14" y="116" width="136" height="46" rx="8" fill="#7fc8f8" fill-opacity="0.35" stroke="#2f7fc1" stroke-width="1.8"/><rect x="170" y="116" width="136" height="46" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="#c98512" stroke-width="1.8"/><text x="160" y="146" font-size="20" text-anchor="middle" fill="currentColor">=</text><text x="82" y="146" font-size="15" text-anchor="middle" fill="currentColor">y だけの式</text><text x="238" y="146" font-size="15" text-anchor="middle" fill="currentColor">x だけの式</text><text x="160" y="188" font-size="13" text-anchor="middle" fill="currentColor">左は y で、右は x で積分できる</text></svg>'
        explain: 「y′ = xy の両辺を y でわると (1/y) y′ = x。この両辺を x で積分すると、左辺は置換積分（D-006）で ∫ (1/y) dy になります。左辺は y だけ、右辺は x だけの式なので、それぞれ積分できます。log|y| = x²/2 + C、y = C e^(x²/2)。」と書ければよい。① y と x を分ける、② 両辺を積分、③ log|y| = A から y = ±e^A。出した式は、微分して確かめましょう：(C e^(x²/2))′ = C e^(x²/2) × x = xy。
        hints:
          - 両辺を y でわると (1/y) y′ = x。この両辺を x で積分します。
          - text: 左辺の ∫ (1/y)(dy/dx) dx は、置換積分（D-006）で ∫ (1/y) dy になります。
            svg: '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="13" text-anchor="middle" fill="currentColor">(1/y) y<tspan font-family="Arial, Helvetica, sans-serif">′</tspan> = x の両辺を x で積分</text><text x="160" y="54" font-size="17" text-anchor="middle" fill="currentColor"><tspan fill="currentColor">∫ (1/y)·(dy/</tspan><tspan fill="#c98512" font-weight="bold">dx</tspan><tspan fill="currentColor">) </tspan><tspan fill="#c98512" font-weight="bold">dx</tspan><tspan fill="currentColor"> = ∫ x dx</tspan></text><line x1="110" y1="64" x2="110" y2="87" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="110,94 106.5,87 113.5,87" fill="#c98512" stroke="none"/><text x="120" y="84" font-size="12" text-anchor="start" fill="#c98512" font-weight="bold">置換積分（D-006）</text><text x="160" y="124" font-size="17" text-anchor="middle" fill="currentColor"><tspan fill="#2f7fc1" font-weight="bold">∫ (1/y) dy</tspan><tspan fill="currentColor"> = ∫ x dx</tspan></text><text x="160" y="164" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">左は y で、右は x で積分できる</text></svg>'
          - 積分したあと、log|y| = A なら y = ±e^A を使って、y の形にしましょう。
        paths:
          - [(1/y) dy = x dx, 両辺を積分, log|y| = x²/2 + C, y = C e^(x²/2)]
          - [(1/y) y′ = x を x で積分, 置換積分で左は ∫ (1/y) dy, 分けて積分してよい]
      - part: わけ
