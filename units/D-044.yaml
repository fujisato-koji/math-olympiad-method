# D-044 1 階常微分方程式
#
# 段 6・水準 3・8 日。前提は D-006（積分の考え）。地図の plan のとおり、導入・練習 4 日・わけ・混ぜる・確認の並び。
#   1 日目：微分方程式と解（解は関数。C のちがう解の家族が一般解）。傾きの場（点ごとに傾き y′ の短い線）で見る。
#   2 日目：変数分離（y の仲間を左、x の仲間を右の 2 つの箱に分けて積分）。3 日目：1 階線形（積分因子、一定の解と右辺を 0 にした式の解の和）。
#   4 日目：初期条件（点を 1 つ決めると、家族の曲線が 1 本に決まる）。5 日目：応用（y′ = ky のふえ方とへり方、半減期、冷めるお茶）。
#   6 日目：わけ 3 問。7 日目：混ぜる。8 日目：確認。
# 前提のたどり（D-006、D-005）に指数関数と対数関数（D-001、D-011）がないので、(e^x)′ = e^x、(e^(kx))′ = k e^(kx)、
#   ∫ (1/y) dy = log|y| + C（log は e を底とする対数）、log|y| = A なら y = ±e^A を、1 日目と 2 日目の見本で約束として示した。
# 子の画面には text、svg、choices、explain、paths、ヒントが出る。answer、check、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図とイラストの多い形に直した（D-131、直す係 3）：見本 5 つ、わけ 3 つ、答える問題 28 問の全部に図。ヒントの 1〜2 段に図。
#   7 日目・8 日目・腕だめしは、前の日のくり返しだったので、数や場面を変えた新しい問題に作り直した（D-191）。
# 用語の字：一般解、変数分離、傾き、置換積分 は、この単元とその前で教えることばなので漢字で書く。

id: D-044
days:
  - day: 1
    items:
      - part: 見本
        id: "e1d7c2b8a0"
        text: |-
          y′ = 2 のように、関数 y とその導関数 y′ の関係を表す式を、微分方程式といいます。式を満たす関数が「解」です。
          y′ = 2 は「どこでも傾きが 2」という式なので、y = 2x も y = 2x + 4 も y = 2x − 4 も解です（図）。
          まとめて y = 2x + C と書き、一般解といいます。C はどんな数でもよい定数です。
          y′ = y のように、y そのものが入る式もあります。この単元では、指数関数 e^x の (e^x)′ = e^x と、(e^(kx))′ = k e^(kx) も使います。
