  - day: 2
    items:
      - part: 見本
        id: "8d0da0daf4"
        text: |-
          変数分離：y′ =（x の式）×（y の式）の形なら、y′ を dy/dx と書き、y の仲間を左辺、x の仲間を右辺に分けます（図）。
          例：y′ = x²y なら、両辺を y でわって dx をかけると (1/y) dy = x² dx。両辺を積分して log|y| = x³/3 + C。
          これを y について解くと、y = C e^(x³/3) が一般解です。
          ここでは ∫ (1/y) dy = log|y| + C（log は e を底とする対数）と、「log|y| = A なら y = ±e^A」を使います。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="36" font-size="20" text-anchor="middle" fill="currentColor"><tspan fill="#2f7fc1" font-weight="bold">dy</tspan><tspan fill="currentColor">/</tspan><tspan fill="#c98512" font-weight="bold">dx</tspan><tspan fill="currentColor"> = </tspan><tspan fill="#c98512" font-weight="bold">x²</tspan><tspan fill="currentColor"> × </tspan><tspan fill="#2f7fc1" font-weight="bold">y</tspan></text><text x="160" y="66" font-size="13" text-anchor="middle" fill="#c98512" font-weight="bold">両辺を y でわり、dx をかける</text><line x1="160" y1="73" x2="160" y2="89" stroke="#c98512" stroke-width="2" stroke-linecap="round"/><polygon points="160,96 156.5,89 163.5,89" fill="#c98512" stroke="none"/><text x="82" y="108" font-size="13" text-anchor="middle" fill="#2f7fc1" font-weight="bold">y の仲間</text><text x="238" y="108" font-size="13" text-anchor="middle" fill="#c98512" font-weight="bold">x の仲間</text><rect x="14" y="116" width="136" height="46" rx="8" fill="#7fc8f8" fill-opacity="0.35" stroke="#2f7fc1" stroke-width="1.8"/><rect x="170" y="116" width="136" height="46" rx="8" fill="#f3c969" fill-opacity="0.4" stroke="#c98512" stroke-width="1.8"/><text x="160" y="146" font-size="20" text-anchor="middle" fill="currentColor">=</text><text x="82" y="146" font-size="18" text-anchor="middle" fill="currentColor">(1/y) dy</text><text x="238" y="146" font-size="18" text-anchor="middle" fill="currentColor">x² dx</text><text x="160" y="188" font-size="13" text-anchor="middle" fill="currentColor">両辺を積分 → log|y| = x³/3 + C</text></svg>'
        explain: |-
          y′ を dy/dx と書くと、dy/dx = x²y の両辺を y でわって dx をかける形に見えます。正しくは、(1/y) y′ = x² の両辺を x で積分し、左辺に置換積分（D-006）を使うと ∫ (1/y) dy になる、という意味です。
          左辺は y だけ、右辺は x だけの式なので、それぞれ積分できます。log|y| = x³/3 + C₁ から |y| = e^(C₁) e^(x³/3)、y = ±e^(C₁) e^(x³/3)。±e^(C₁) を新しい定数 C にまとめて、y = C e^(x³/3) と書きます（y = 0 も解なので、C = 0 もふくめます）。
          微分して確かめると、(C e^(x³/3))′ = C e^(x³/3) × x² = x²y です。
        note: y′ = g(x)h(y) → (1/h(y)) dy = g(x) dx。見本の例は今日の問題と重ならない y′ = x²y にした。
