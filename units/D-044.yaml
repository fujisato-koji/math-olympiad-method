        explain: |-
          微分方程式を解くとは、式を満たす関数を全部見つけることです。答えは数ではなく関数です。
          y′ = 2 なら、両辺を x で積分して y = 2x + C です（D-006 の不定積分）。C を変えるとグラフは上下に平行にずれますが、どの点でも傾きは 2 のままです。
          このように、どんな数にしてもよい定数（任意定数）C を 1 つふくむ解の集まりを、一般解といいます。解かどうかは、微分して元の式にもどるかで確かめます。(2x + C)′ = 2 です。
          e^x（e は 2.718… という数）は、微分しても形が変わらない関数です。合成関数の微分（D-005）から (e^(kx))′ = k e^(kx) です。指数関数と対数関数は D-001 と D-011 でくわしく学びます。
        note: 微分方程式の解は関数で、任意定数 C がつく。見本の例は y′ = 2（今日の問題と重ならないように、y′ = 2x と y′ = y の解は書かない）。
