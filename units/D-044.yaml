      - part: わけ
        text: y' = 2x の一般解が y = x² + C になるわけを説明しましょう。
        explain: 「y' = 2x の両辺を x で積分すると、y = x² + C。積分定数 C は、微分すると 0 になるので、どんな値でも式を満たす。だから一般解は y=x²+C。」と書ければよい。① 両辺を積分、② 積分定数、③ 微分して確かめる。子どもには、C を変えて確かめさせます。
        hints:
          - 両辺を x で積分します。
          - 積分すると定数がつきます。
          - 微分して元の式に戻るか確かめます。
        paths:
          - [両辺を積分, 積分定数 C, 微分して確かめる]
      - part: わけ
        text: 変数分離で y' = xy が解けるわけを説明しましょう。
        explain: 「y'=xy を dy/dx=xy と書き、両辺を y でわって dx をかけます。dy/y = x dx。左辺は y だけ、右辺は x だけになり、それぞれ積分できます。積分して log|y|=x²/2+C、指数をとって y=C e^(x²/2)。」と書ければよい。① y と x を分ける、② 両辺を積分、③ 指数をとる。子どもには、微分して確かめさせます。
        hints:
          - y の項と x の項を分けます。
          - 両辺を積分します。
          - log を外して y の形にします。
        paths:
          - [dy/y=x dx, 積分, log y=x²/2+C, y=C e^(x²/2)]
      - part: わけ
        text: 初期条件があると解が 1 つに決まるわけを説明しましょう。
        explain: 「一般解には任意定数 C が 1 つあります。初期条件 y(x₀)=y₀ を代入すると、C についての方程式が 1 つでき、C が決まります。1 階の微分方程式は C が 1 つなので、条件 1 つで解が 1 つに定まります。」と書ければよい。① 任意定数 1 つ、② 条件を代入、③ C が決まる。子どもには、y'=2x の例で確かめさせます。
        hints:
          - 一般解には任意定数がいくつありますか。
          - 初期条件を代入します。
          - C が決まります。
        paths:
          - [任意定数 1 つ, 初期条件を代入, C が決まる]

