      - 差は v′ = −kv にしたがうので、同じ時間ごとに同じ倍率になります（5 日目）。
      - 次の 10 分で差が何倍になるかを考え、最後に部屋の温度 20 ℃ を足しましょう。
    paths:
      - [差は 10 分で 80 → 40 の 1/2 倍, 次の 10 分で 40 → 20, u = 20 + 20 = 40 ℃]
      - [u = 20 + 80 e^(−kt), e^(−10k) = 1/2, u(20) = 20 + 80 × 1/4 = 40]
    note: 応用（ニュートンの冷え方）。「10 分で 40 ℃ 下がったので、あと 40 ℃ 下がって 20 ℃」とする誤りが多い。
