        explain: |-
          【定義】積分因子とは、y′ + P(x)y = Q(x) の両辺にかけると、左辺を積の微分の形にできる関数 e^(∫P dx) です。
          積の微分（D-005）から (e^(3x) y)′ = 3e^(3x) y + e^(3x) y′ = e^(3x)(y′ + 3y) なので、y′ + 3y = 3 の両辺に e^(3x) をかけると、左辺は (e^(3x) y)′ になります。右辺 3e^(3x) を積分すると e^(3x) + C です。
          y = 1 は y′ = 0 なので 0 + 3 × 1 = 3 となり、式を満たす一定の解（特解）です。C e^(−3x) は、右辺を 0 にした式（同次の式）の一般解です。1 階線形の一般解は、特解 1 つと同次の式の一般解の和になります。
          x が大きくなると e^(−3x) は 0 に近づくので、どの解も y = 1 に近づきます。
        note: y′ + Py = Q。積分因子 e^(∫P dx) をかける。一般解は特解 + 同次解。見本の例は今日の問題と重ならない y′ + 3y = 3 にした。
