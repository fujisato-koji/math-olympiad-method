        explain: |-
          初期条件は「ある点での関数の値」です。一般解に代入すると C の方程式が 1 つでき、C が決まります。微分方程式と初期条件の組を、初期値問題といいます。
          グラフで見ると、C のちがう曲線は上下にずれていて交わらないので、1 つの点を通る曲線は 1 本だけです。
          y′ = x の一般解は、∫ x dx = x²/2 + C から y = x²/2 + C です。
        note: 初期条件で C が決まる。1 階なら条件は 1 つ。見本の例は今日の問題と重ならない y′ = x、y(2) = 1 にした。
      - part: 今日
        id: "557250150f"
        text: y′ = 2x、y(0) = 3 の解はどれですか。図の曲線は y′ = 2x の解のいくつかで、赤い点は (0, 3) です。赤い点を通る曲線は、図にはかいていません。
