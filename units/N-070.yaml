        explain: 例：「1.2 m は小数第一位までのがい数で、本当の長さは 1.15 m 以上 1.25 m 未満のどこか。1.20 m は小数第二位まで測った値で、本当の長さは 1.195 m 以上 1.205 m 未満のどこか。1.20 m のほうがはんいがせまく、くわしく測っている。だから、最後の 0 にも意味がある。」と書ければよい（代表の例で書く ②）。このように、測った値で意味のある（本当の値のはんいを決める）数字を有効数字といい、1.2 は有効数字 2 けた、1.20 は有効数字 3 けたという（問いの文の終わりで名前を出す）。0.0052 のはじめの 0 は位を表すだけなので数えず、有効数字は 5 と 2 の 2 けたである。5200 のような数では、最後の 0 が有効数字かどうか分からないので、有効数字 2 けたなら 5.2 × 10³、3 けたなら 5.20 × 10³ と、標準形で書き分けることも話す。有効数字 2 けたにするのは、上から 3 けた目を四捨五入して「上から 2 けたのがい数」にすることである。問いの図は、0.1 m の目もりだけのものさしで読んだ 1.2 m と、0.01 m の目もりまであるものさしで読んだ 1.20 m。
        hints:
