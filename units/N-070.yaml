  - day: 3
    items:
      - part: 思い出す
        text: 0.083 を標準形で表すと、8.3 × 10 の □ 乗です。□ に入る数はいくつですか。
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([k for k in range(-10, 11) if Fraction(83, 10) * Fraction(10) ** k == Fraction(83, 1000)][0])"
        hints:
          - 8.3 を 10 で何回わると、0.083 になるかな。
          - 8.3 → 0.83 → … と続けよう。
          - 10 で □ 回わることは、10 の −□ 乗をかけることだね。
        paths:
          - [8.3 → 0.83 → 0.083, 10 で 2 回わる, −2]
      - part: 思い出す
        text: 四捨五入して十の位までのがい数にすると 60 になる整数のうち、いちばん小さい数はいくつですか。
        answer: 55
        check: "min(n for n in range(1000) if (n + 5) // 10 * 10 == 60)"
        hints:
          - 十の位までのがい数にするときは、一の位の数字を見るね。
          - 50 台の数で、切り上げて 60 になるのはどれかな。
          - 一の位が 5 以上なら切り上げだよ。
        paths:
          - [一の位が 5 以上なら切り上げ, 55 から 59 は 60 になる, 54 は 50 になる, 55]
      - part: わけ
        text: 10⁰ = 1、10⁻¹ = 0.1 と決めると、指数法則（10³ × 10² = 10⁵ のように、かけ算はかける回数のたし算になる）が、そのまま使えます。10³ × 10⁰ と 10³ × 10⁻¹ を例にして、そのわけを文に書きましょう。
        explain: 例：「10³ × 10⁰ は、10⁰ = 1 なので 1000 × 1 = 1000 = 10³。指数法則で考えても、10 を 3 回かけて、さらに 0 回かけるので 10³ になり、同じになる。10³ × 10⁻¹ は、10⁻¹ = 0.1 なので 1000 × 0.1 = 100 = 10²（0.1 が 1000 こで 100）。10⁻¹ をかけることは 10 で 1 回わることで、10 を 3 回かけて 1 回わると、10 を 2 回かけた数になり、これも同じになる。だから、10⁰ = 1、10⁻¹ = 0.1 と決めておくと、指数法則がくずれない。」と書ければよい（代表の例で書く ②）。もし 10⁰ = 0 と決めたら 10³ × 10⁰ = 0 となり、10³ と食いちがうことまで言えたら、なおよい。「0 回かけるから 0」と考えていたら、1000 → 100 → 10 → 1 と、指数が 1 へるたびに 10 でわる並びを見せる。
        hints:
          - 10⁰ = 1 なので、10³ × 10⁰ はいくつかな。指数法則で考えた答えとくらべよう。
          - 10⁻¹ をかけることは、10 でどうすることかな。
          - 10³ × 10⁻¹ を計算して、10 の何乗になるかを見よう。
        paths:
          - [10³ × 10⁰ = 1000 × 1 = 10³, 10³ × 10⁻¹ は 1000 を 10 でわって 100 = 10², どちらも指数法則の答えと合う, だから 10⁰ = 1、10⁻¹ = 0.1 と決める]
      - part: わけ
        text: 四捨五入して小数第一位までのがい数にすると 3.4 になる数は、3.35 以上 3.45 未満です。3.35 は入り、3.45 は入らないわけを、文に書きましょう。
