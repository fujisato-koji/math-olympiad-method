        id: "ccc2d76122"
        text: 10⁰ = 1、10⁻¹ = 0.1 と決めると、指数法則（10³ × 10² = 10⁵ のように、かけ算はかける回数のたし算になる）が、そのまま使えます。10³ × 10⁰ と 10³ × 10⁻¹ を例にして、そのわけを文に書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="122" y="41" font-size="16" text-anchor="end" fill="currentColor">10³</text><text x="130" y="41" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="138" y="41" font-size="16" text-anchor="start" fill="currentColor">1000</text><text x="122" y="73" font-size="16" text-anchor="end" fill="currentColor">10²</text><text x="130" y="73" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="138" y="73" font-size="16" text-anchor="start" fill="currentColor">100</text><text x="122" y="105" font-size="16" text-anchor="end" fill="currentColor">10¹</text><text x="130" y="105" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="138" y="105" font-size="16" text-anchor="start" fill="currentColor">10</text><rect x="70" y="119" width="150" height="26" rx="6" fill="#f3c969" fill-opacity="0.45"/><text x="122" y="137" font-size="16" text-anchor="end" fill="currentColor">10⁰</text><text x="130" y="137" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="138" y="137" font-size="16" text-anchor="start" fill="currentColor">1</text><rect x="70" y="151" width="150" height="26" rx="6" fill="#f3c969" fill-opacity="0.45"/><text x="122" y="169" font-size="16" text-anchor="end" fill="currentColor">10⁻¹</text><text x="130" y="169" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="138" y="169" font-size="16" text-anchor="start" fill="currentColor">0.1</text><path d="M208 36 C224 36 224 68 215 68" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208,68 216,63.5 216,72.5" fill="#f08080"/><text x="229" y="57" font-size="13" text-anchor="start" fill="currentColor">÷ 10</text><path d="M208 68 C224 68 224 100 215 100" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208,100 216,95.5 216,104.5" fill="#f08080"/><text x="229" y="89" font-size="13" text-anchor="start" fill="currentColor">÷ 10</text><path d="M208 100 C224 100 224 132 215 132" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208,132 216,127.5 216,136.5" fill="#f08080"/><text x="229" y="121" font-size="13" text-anchor="start" fill="currentColor">÷ 10</text><path d="M208 132 C224 132 224 164 215 164" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="208,164 216,159.5 216,168.5" fill="#f08080"/><text x="229" y="153" font-size="13" text-anchor="start" fill="currentColor">÷ 10</text></svg>'
        explain: 例：「10³ × 10⁰ は、10⁰ = 1 なので 1000 × 1 = 1000 = 10³。指数法則で考えても、10 を 3 回かけて、さらに 0 回かけるので 10³ になり、同じになる。10³ × 10⁻¹ は、10⁻¹ = 0.1 なので 1000 × 0.1 = 100 = 10²（0.1 が 1000 こで 100）。10⁻¹ をかけることは 10 で 1 回わることで、10 を 3 回かけて 1 回わると、10 を 2 回かけた数になり、これも同じになる。だから、10⁰ = 1、10⁻¹ = 0.1 と決めておくと、指数法則がくずれない。」と書ければよい（代表の例で書く ②）。もし 10⁰ = 0 と決めたら 10³ × 10⁰ = 0 となり、10³ と食いちがうことまで言えたら、なおよい。「0 回かけるから 0」と考えていたら、1000 → 100 → 10 → 1 と、指数が 1 へるたびに 10 でわる並びを見せる（問いの図）。
        hints:
          - 10⁰ = 1 なので、10³ × 10⁰ はいくつかな。指数法則で考えた答えとくらべよう。
          - text: 10⁻¹ をかけることは、10 で 1 回わること。「× 10」が 3 こと「÷ 10」が 1 こだよ。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="34" y="64" font-size="17" text-anchor="middle" fill="currentColor">10³</text><rect x="62" y="44" width="28" height="28" rx="6" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="76" y="63" font-size="13" text-anchor="middle" fill="currentColor">×10</text><rect x="94" y="44" width="28" height="28" rx="6" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="108" y="63" font-size="13" text-anchor="middle" fill="currentColor">×10</text><rect x="126" y="44" width="28" height="28" rx="6" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="140" y="63" font-size="13" text-anchor="middle" fill="currentColor">×10</text><text x="34" y="126" font-size="17" text-anchor="middle" fill="currentColor">10⁻¹</text><rect x="62" y="106" width="28" height="28" rx="6" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="76" y="125" font-size="13" text-anchor="middle" fill="currentColor">÷10</text></svg>'
          - 10³ × 10⁻¹ を計算して、10 の何乗になるかを見よう。
        paths:
          - [10³ × 10⁰ = 1000 × 1 = 10³, 10³ × 10⁻¹ は 1000 を 10 でわって 100 = 10², どちらも指数法則の答えと合う, だから 10⁰ = 1、10⁻¹ = 0.1 と決める]
          - [指数が 1 へるたびに 10 でわる並び 1000、100、10 を続ける, 10⁰ = 1、10⁻¹ = 0.1 はこの並びのつづき, 10³ にこの並びの数をかけると指数どうしのたし算と合う, 指数法則がくずれない]
