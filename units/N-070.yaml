><polygon points="306,80 314,75.5 314,84.5" fill="#f08080"/><path d="M306 80 C318 80 318 110 312 110" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="306,110 314,105.5 314,114.5" fill="#f08080"/><path d="M306 110 C318 110 318 140 312 140" fill="none" stroke="#f08080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="306,140 314,135.5 314,144.5" fill="#f08080"/><text x="235.5" y="172" font-size="13" text-anchor="middle" fill="currentColor">10 で 3 回わる</text><text x="235.5" y="192" font-size="15" text-anchor="middle" fill="currentColor">0.0034 = 3.4 × 10⁻³</text></svg>'
        explain: 10³ = 1000、10² = 100、10¹ = 10 と、指数が 1 へるたびに、数は 10 でわった大きさになります。このきまりを続けて、10⁰ = 1、10⁻¹ = 0.1、10⁻² = 0.01、10⁻³ = 0.001 と決めます。10⁻³ は「10 の −3 乗」と読み、1 を 10 で 3 回わった数のことです（0.001 は、0.01 を同じ大きさずつ 10 こに分けた 1 こ分）。10 でわるたびに、数字の並びはそのままで、位が 1 つずつ下がります。3.4 は 0.1 が 34 こ分なので、10 でわると 0.01 が 34 こ分の 0.34 です（3.4 → 0.34 → 0.034 → 0.0034）。だから 0.0034 は 3.4 を 10 で 3 回わった数で、0.0034 = 3.4 × 10⁻³ です。指数の −3 は、3.4 の小数点を左へ 3 けた動かすと 0.0034 になることを表しています。10⁻³ をかけることは、10 で 3 回わることと同じです。図の左は 10 の累乗の並び（黄は今日決めたもの）、右は 3.4 を 10 で 3 回わるようす。
