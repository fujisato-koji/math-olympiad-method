      - part: 今日
        text: 太陽から地球までのきょりは、約 149600000 km です。上から 2 けたのがい数にして、□ × 10⁸ km と表すとき、□ に入る数はいくつですか。
        answer: 1.5
        check: "(149600000 + 5000000) // 10000000 / 10"
        hints:
          - 上から 2 けたのがい数にするには、上から 3 けた目の数字を四捨五入しよう。
          - 上から 3 けた目は 9 だね。切り上げると、上から 2 けたはいくつになるかな。
          - がい数にした数を、□ × 10⁸ の形にしよう。
        paths:
          - [上から 3 けた目の 9 を切り上げて 150000000, 150000000 = 1.5 × 10⁸, 1.5]
      - part: 挑戦
        text: (3 × 10⁴) × (6 × 10²) を標準形で表すと、1.8 × 10 の □ 乗です。□ に入る数はいくつですか。
        answer: 7
        check: "[k for k in range(20) if Fraction(18, 10) * 10 ** k == 3 * 10 ** 4 * 6 * 10 ** 2][0]"
        hints:
          - (3 × 6) × (10⁴ × 10²) にしよう。
          - 10⁴ × 10² は、10 の何乗かな。
