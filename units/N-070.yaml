    note: 差の上のはしは「大きいほうの上のはし − 小さいほうの下のはし」で、4 日目の和の範囲とは組み合わせが変わる。2450 − 650 = 1800 とする誤りが多い。A も B も範囲のはばは 100 m で、差の範囲（1700 m より長く 1900 m より短い）のはばはその和の 200 m になる（ひき算でも、誤差のはばは足し合わさる）。
