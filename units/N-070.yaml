# N-070 標準形（10 の累乗の表し方）と有効数字、誤差の区間
#
# 書き方は N-001 の頭の注、負の数の答えの書き方と check は N-010 の頭の注のとおり。段 4 なので普通の文。
# 前提は A-009（累乗と指数法則）、N-061（がい数と四捨五入、以上・未満）、N-020（小数）。たどると N-016（分数の意味）、
#   N-009（1000 までの数と位）、N-013・N-014（九九、わり算）、N-074（かけ算の筆算）までなので、これらを道具にする。
# 前提にないものの扱い（地図の点として報告した）：
#   10 倍・10 分の 1 で位が動くきまり（N-073）は前提にないので、1 日目の見本で N-020 の「0.1 のいくつ分」から導く
#   （3.4 は 0.1 が 34 こ、10 倍すると 0.1 が 340 こで 34）。万・億の位の名前は使わず、数字の並びと 10 の累乗で表す。
#   0 乗と負の指数は A-009 で「段 4 から」とされ、網羅表でもこの単元が受け持つので、2 日目の見本で決める。
#   負の数（N-004、N-010）は前提にないので、10⁻³ は「1 を 10 で 3 回わった数」と読む記号として扱い、負の数の計算はしない
#   （10⁸ × 10⁻³ は「10 を 8 回かけて 3 回わる」で 10⁵）。答えの指数は段 4 の鍵盤で「−3」と打つ。
#   文字の式（A-010）は前提にないので、標準形は「1 以上 10 未満の数 × 10 の累乗」と言葉で言い、問いは「10 の □ 乗」の □ で書く。
#   小数のかけ算とわり算（N-077）は前提にないので、標準形どうしのかけ算は、前の数が整数か、「0.1 のいくつ分」で整数にもどせるもの
#   （2.5 × 4 は 0.1 が 100 こで 10）だけにした。わり算はしない。
# わけは水準 2 なので、代表の例で文に書く（②）。文字を使った ③ は前提にないので求めない。
# 有効数字は「測った値で、意味のある（本当の値のはんいを決める）数字」。0.0052 のはじめの 0 は数えない。
#   有効数字 2 けたにするのは上から 3 けた目を四捨五入すること（N-061 の「上から 1 けたのがい数」と同じ考え）。
#   1 日目と 2 日目は「上から 2 けたのがい数」と言い、有効数字という名前は 3 日目のわけで出す。
# 誤差の区間は、四捨五入して □ になる数のはんい（□ 以上 ○ 未満）。N-061 の 3 日目の整数のはんいを小数に広げる。
#   4 日目に、測った長さから周りの長さのはんい（上のはしと下のはし）を出す。
# 最先端へのつながり（D-026）：光の速さ、太陽までのきょり、細菌の大きさ。測った値の誤差は P-117（測定と誤差の解析）につながる。
# check：指数は [k for k in range(…) if Fraction(…) * Fraction(10) ** k == …] でさがす。小数の答えは「整数 / 10 の累乗」で作る
#   （表示が 0.0047 のようになるのは小数第四位まで）。四捨五入は (n + 5) // 10 の形（round は使えない）。
#   有効数字のけた数は、文字列から小数点とはじめの 0 を取って数える。
# 日の並び（既定）：1 日目 導入（大きな数の標準形）、2 日目 練習（0 乗と負の指数、小さな数の標準形。頭に見本）、
#   3 日目 わけ（指数の決め方、誤差の区間、有効数字）、4 日目 A-009・N-061・N-020 と混ぜる、5 日目 確認。

id: N-070
days:
  - day: 1
    items:
      - part: 見本
        text: 3400 を標準形で表しましょう。
        figure: "3.4 → 34 → 340 → 3400"
        explain: 大きな数や小さな数を「1 以上 10 未満の数 × 10 の累乗」の形で書いたものを、標準形（指数表記）といいます。3400 は 3.4 を 1000 倍した数です。3.4 は 0.1 が 34 こ分で、10 倍すると 0.1 が 340 こ分、つまり 34 になります。このように 10 倍するたびに、数字の並び 3、4 はそのままで、位が 1 つずつ上がります（3.4 → 34 → 340 → 3400）。1000 = 10³ なので、3400 = 3.4 × 10³ です。指数の 3 は、3.4 の小数点を右へ 3 けた動かすと 3400 になることを表しています。34 × 10² や 0.34 × 10⁴ も 3400 ですが、前の数が 1 以上 10 未満でないので、標準形ではありません。地球から月までのきょり約 380000 km も、3.8 × 10⁵ km と短く書けます。
      - part: 思い出す
        text: 10⁵ × 10² は 10 の □ 乗です。□ に入る数はいくつですか。
        answer: 7
        check: "[k for k in range(20) if 10 ** k == 10 ** 5 * 10 ** 2][0]"
        hints:
          - 10⁵ は 10 を何回、10² は 10 を何回かけた数かな。
          - 合わせて 10 を何回かけているかな。
          - かける回数が指数だよ。
        paths:
          - [10 を 5 回と 2 回かける, 5 + 2 = 7 回, 10⁷]
      - part: 思い出す
        text: 472 を四捨五入して、百の位までのがい数にしましょう。
        answer: 500
        check: "(472 + 50) // 100 * 100"
        hints:
          - 百の位までのがい数にするときは、どの位の数字を見るかな。
          - 472 の十の位の数字はいくつかな。
          - 5 以上なら切り上げ、4 以下なら切り捨てだよ。
        paths:
          - [十の位を見る, 7 なので切り上げ, 500]
      - part: 今日
        text: 52000 を標準形で表すと、5.2 × 10 の □ 乗です。□ に入る数はいくつですか。
        answer: 4
        check: "[k for k in range(20) if Fraction(52, 10) * 10 ** k == 52000][0]"
        hints:
          - 5.2 を何回 10 倍すると、52000 になるかな。
          - 5.2 → 52 → 520 → … と続けよう。
          - 10 倍を □ 回することは、10 の □ 乗をかけることだね。
        paths:
          - [5.2 → 52 → 520 → 5200 → 52000, 10 倍を 4 回, 5.2 × 10⁴, 4]
        note: 0 の数（3 こ）を数えて 3 と答えやすい。5.2 の小数点から数えると 4 けた動く。
      - part: 今日
        text: 6.3 × 10⁵ を、ふつうの数で表しましょう。
        answer: 630000
        check: "63 * 10 ** 4"
        hints:
          - 10⁵ をかけることは、10 倍を何回することかな。
          - 10 倍するたびに、位が 1 つ上がるね。
          - 6.3 → 63 → 630 → … と続けよう。
        paths:
          - [10 倍を 5 回, 6.3 → 63 → 630 → 6300 → 63000 → 630000, 630000]
        note: 63 のあとに 0 を 5 こつけて 6300000 としやすい。6.3 の小数点が右へ 5 けた動く。
      - part: 今日
        text: 34000 を表した次の式のうち、標準形になっているものは、どれですか。
        choices: [34 × 10³, 3.4 × 10⁴, 0.34 × 10⁵]
        answer: 3.4 × 10⁴
        check: "[c for c, a in {'34 × 10³': 34, '3.4 × 10⁴': Fraction(34, 10), '0.34 × 10⁵': Fraction(34, 100)}.items() if 1 <= a < 10 and a * 10 ** {'34 × 10³': 3, '3.4 × 10⁴': 4, '0.34 × 10⁵': 5}[c] == 34000][0]"
        hints:
          - どの式も、計算すると 34000 になるか確かめよう。
          - 標準形では、10 の累乗の前の数を、何以上何未満にするのだったかな。
          - 前の数が 1 以上 10 未満のものを選ぼう。
        paths:
          - [3 つとも 34000, 前の数は 34、3.4、0.34, 1 以上 10 未満なのは 3.4, 3.4 × 10⁴]
      - part: 挑戦
        text: (4 × 10⁵) × (5 × 10³) を標準形で表すと、2 × 10 の □ 乗です。□ に入る数はいくつですか。
        answer: 9
        check: "[k for k in range(20) if 2 * 10 ** k == 4 * 10 ** 5 * 5 * 10 ** 3][0]"
        hints:
          - かける順番を入れかえて、(4 × 5) × (10⁵ × 10³) にしよう。
          - 10⁵ × 10³ は、10 の何乗かな。
          - 4 × 5 = 20 は 1 以上 10 未満ではないので、20 = 2 × 10 となおそう。
        paths:
          - [(4 × 5) × (10⁵ × 10³) = 20 × 10⁸, 20 = 2 × 10, 2 × 10⁹, 9]
        note: 20 × 10⁸ で止めて 8 と答えやすい。前の数を 1 以上 10 未満にそろえると、指数が 1 ふえる。
    extra:
      - part: 今日
        text: 7.05 × 10⁴ を、ふつうの数で表しましょう。
        answer: 70500
        check: "705 * 10 ** 2"
        hints:
