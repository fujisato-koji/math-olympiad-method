        check: "min({'3 × 10⁻⁴': Fraction(3, 10000), '2.9 × 10⁻³': Fraction(29, 10000), '8 × 10⁻⁵': Fraction(8, 100000)}.items(), key=lambda kv: kv[1])[0]"
        hints:
          - まず、10 の累乗の部分をくらべよう。
          - 10 で何回もわった数ほど、小さくなるね。
          - いちばん多く 10 でわっているものはどれかな。
