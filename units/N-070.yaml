        explain: 大きな数や小さな数を「1 以上 10 未満の数 × 10 の累乗」の形で書いたものを、標準形（指数表記）といいます。3400 は 3.4 を 1000 倍した数です。3.4 は 0.1 が 34 こ分で、10 倍すると 0.1 が 340 こ分、つまり 34 になります。このように 10 倍するたびに、数字の並び 3、4 はそのままで、位が 1 つずつ上がります（3.4 → 34 → 340 → 3400）。1000 = 10³ なので、3400 = 3.4 × 10³ です。指数の 3 は、3.4 の小数点を右へ 3 けた動かすと 3400 になることを表しています。34 × 10² や 0.34 × 10⁴ も 3400 ですが、前の数が 1 以上 10 未満でないので、標準形ではありません。地球から月までのきょり約 380000 km も、3.8 × 10⁵ km と短く書けます。図は位の表で、先頭の 3 が 1 つずつ左の位へ動くようすを見せる。
