# N-070 標準形（10 の累乗の表し方）と有効数字、誤差の区間
#
# 書き方は N-001 の頭の注、負の数の答えの書き方と check は N-010 の頭の注のとおり。段 4 なので普通の文。
# 前提は A-009（累乗と指数法則）、N-061（がい数と四捨五入、以上・未満）、N-020（小数）。たどると N-016（分数の意味）、
#   N-009（1000 までの数と位）、N-013・N-014（九九、わり算）、N-074（かけ算の筆算）までなので、これらを道具にする。
# 前提にないものの扱い（地図の点として報告した）：
#   10 倍・10 分の 1 で位が動くきまり（N-073）は前提にないので、1 日目の見本で N-020 の「0.1 のいくつ分」から導く
#   （3.4 は 0.1 が 34 こ、10 倍すると 0.1 が 340 こで 34）。万・億の位の名前は使わず、数字の並びと 10 の累乗で表す。
#   0 乗と負の指数は A-009 で「段 4 から」とされ、網羅表でもこの単元が受け持つので、2 日目の見本で決める。
#   負の数（N-004、N-010）は前提にないので、10⁻³ は「1 を 10 で 3 回わった数」と読む記号として扱い、負の数の計算はしない
#   （10⁸ × 10⁻³ は「10 を 8 回かけて 3 回わる」で 10⁵）。答えの指数は段 4 の鍵盤で「−3」と打つ。
#   文字の式（A-010）は前提にないので、標準形は「1 以上 10 未満の数 × 10 の累乗」と言葉で言い、問いは「10 の □ 乗」の □ で書く。
#   小数のかけ算とわり算（N-077）は前提にないので、標準形どうしのかけ算は、前の数が整数か、「0.1 のいくつ分」で整数にもどせるもの
#   （2.5 × 4 は 0.1 が 100 こで 10）だけにした。わり算はしない。
# わけは水準 2 なので、代表の例で文に書く（②）。文字を使った ③ は前提にないので求めない。
# 有効数字は「測った値で、意味のある（本当の値のはんいを決める）数字」。0.0052 のはじめの 0 は数えない。
#   有効数字 2 けたにするのは上から 3 けた目を四捨五入すること（N-061 の「上から 1 けたのがい数」と同じ考え）。
#   1 日目と 2 日目は「上から 2 けたのがい数」と言い、有効数字という名前は 3 日目のわけ（1.2 m と 1.20 m）の文で出す。
# 誤差の区間は、四捨五入して □ になる数のはんい（□ 以上 ○ 未満）。N-061 の 3 日目の整数のはんいを小数に広げる。
#   4 日目に、測った長さから周りの長さのはんい（上のはしと下のはし）を出す。
# 最先端へのつながり（D-026）：光の速さ、太陽までのきょり、細菌の大きさ。測った値の誤差は P-117（測定と誤差の解析）につながる。
# check：指数は [k for k in range(…) if Fraction(…) * Fraction(10) ** k == …] でさがす。小数の答えは「整数 / 10 の累乗」で作る
#   （表示が 0.0047 のようになるのは小数第四位まで）。四捨五入は (n + 5) // 10 の形（round は使えない）。
#   有効数字のけた数は、文字列から小数点とはじめの 0 を取って数える。
# 日の並び（既定）：1 日目 導入（大きな数の標準形）、2 日目 練習（0 乗と負の指数、小さな数の標準形。頭に見本）、
#   3 日目 わけ（指数の決め方、誤差の区間、有効数字）、4 日目 A-009・N-061・N-020 と混ぜる、5 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-004、N-010、N-073、N-077 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# 図は svg（D-129、D-131 で直した）。子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
#   図の決まり：位の表（数字が 1 つずつ左・右の位へ動く。先頭の数字に黄の丸、10 倍・10 でわるは右の赤い矢印）、数の線（● は入る、○ は入らない、▼ はまん中）、
#   数字に印（上から 2 けたに黄、3 けた目に赤の ○、位を表すだけの 0 はうすく）。ヒントの図は答えの手前まで。

id: N-070
