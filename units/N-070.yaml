        id: "a42fa6f0ed"
        text: |-
          3.4 を 10 倍するたびに、数字のならび 3、4 はそのままで、位が 1 つずつ上がります。10 倍を 3 回すると 3400 です。
          10 倍を 3 回することは 10³ をかけることなので、3400 = 3.4 × 10³ と書けます。
          このように「1 以上 10 未満の数 × 10 の累乗」で表した形を、標準形といいます。
