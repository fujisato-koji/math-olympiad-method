  - day: 2
    items:
      - part: 見本
        text: 0.0034 を標準形で表しましょう。
        figure: "10² = 100\n10¹ = 10\n10⁰ = 1\n10⁻¹ = 0.1\n10⁻² = 0.01\n10⁻³ = 0.001"
        explain: 10³ = 1000、10² = 100、10¹ = 10 と、指数が 1 へるたびに、数は 10 でわった大きさになります。このきまりを続けて、10⁰ = 1、10⁻¹ = 0.1、10⁻² = 0.01、10⁻³ = 0.001 と決めます。10⁻³ は「10 の −3 乗」と読み、1 を 10 で 3 回わった数のことです（0.001 は、0.01 を同じ大きさずつ 10 こに分けた 1 こ分）。10 でわるたびに、数字の並びはそのままで、位が 1 つずつ下がります。3.4 は 0.1 が 34 こ分なので、10 でわると 0.01 が 34 こ分の 0.34 です（3.4 → 0.34 → 0.034 → 0.0034）。だから 0.0034 は 3.4 を 10 で 3 回わった数で、0.0034 = 3.4 × 10⁻³ です。指数の −3 は、3.4 の小数点を左へ 3 けた動かすと 0.0034 になることを表しています。10⁻³ をかけることは、10 で 3 回わることと同じです。
      - part: 思い出す
        text: 8.1 × 10³ を、ふつうの数で表しましょう。
        answer: 8100
        check: "81 * 10 ** 2"
        hints:
          - 10³ をかけることは、10 倍を何回することかな。
          - 10 倍するたびに、位が 1 つ上がるね。
          - 8.1 → 81 → … と続けよう。
        paths:
          - [10 倍を 3 回, 8.1 → 81 → 810 → 8100, 8100]
      - part: 思い出す
        text: 0.01 が 47 こで、いくつですか。
        answer: 0.47
        check: "47 / 100"
        hints:
          - 0.01 が 10 こで、0.1 だね。
          - 47 こは、40 こと 7 こに分けられるね。
          - 0.01 が 40 こは、0.1 が何こ分かな。
        paths:
          - [0.01 が 40 こで 0.4, 7 こで 0.07, 0.47]
      - part: 今日
        text: 0.00052 を標準形で表すと、5.2 × 10 の □ 乗です。□ に入る数はいくつですか。
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([k for k in range(-10, 11) if Fraction(52, 10) * Fraction(10) ** k == Fraction(52, 100000)][0])"
        hints:
          - 5.2 を 10 で何回わると、0.00052 になるかな。
          - 5.2 → 0.52 → 0.052 → … と続けよう。
          - 10 で □ 回わることは、10 の −□ 乗をかけることだね。
        paths:
          - [5.2 → 0.52 → 0.052 → 0.0052 → 0.00052, 10 で 4 回わる, 5.2 × 10⁻⁴, −4]
        note: 小数点のあとの 0 の数（3 こ）を数えて −3 としやすい。5 が小数第四位にあるので 4 けた動く。
      - part: 今日
        text: 6 × 10⁻³ を、ふつうの数で表しましょう。
        answer: 0.006
        check: "6 / 1000"
        hints:
          - 10⁻³ は、1 を 10 で何回わった数かな。
          - 6 を、10 で 1 回ずつわっていこう。
          - 6 → 0.6 → … と続けよう。
        paths:
          - [10⁻³ をかけるのは 10 で 3 回わること, 6 → 0.6 → 0.06 → 0.006, 0.006]
      - part: 今日
        text: 次の 3 つの数のうち、いちばん大きいものは、どれですか。
        choices: [4.1 × 10⁻², 9.8 × 10⁻³, 2.5 × 10⁻²]
        answer: 4.1 × 10⁻²
        check: "max({'4.1 × 10⁻²': Fraction(41, 1000), '9.8 × 10⁻³': Fraction(98, 10000), '2.5 × 10⁻²': Fraction(25, 1000)}.items(), key=lambda kv: kv[1])[0]"
        hints:
          - まず、10 の累乗の部分をくらべよう。
          - 10⁻² と 10⁻³ では、どちらが大きいかな。
          - 10 の累乗が同じものは、前の数をくらべよう。
        paths:
          - [10⁻² = 0.01 のほうが 10⁻³ = 0.001 より大きい, 10⁻² の 2 つのうち前の数が大きいのは 4.1, 4.1 × 10⁻²]
        note: 前の数の 9.8 がいちばん大きいので選びやすい。9.8 × 10⁻³ = 0.0098 は、4.1 × 10⁻² = 0.041 より小さい。
      - part: 挑戦
        text: (4 × 10⁻³) × (5 × 10⁸) を標準形で表すと、2 × 10 の □ 乗です。□ に入る数はいくつですか。
        answer: 6
        check: "[k for k in range(-10, 20) if 2 * Fraction(10) ** k == 4 * Fraction(10) ** -3 * 5 * 10 ** 8][0]"
        hints:
          - (4 × 5) × (10⁻³ × 10⁸) にしよう。
          - 10⁸ をかけて 10⁻³ をかけるのは、10 を 8 回かけて 3 回わることだね。
          - 4 × 5 = 20 を、2 × 10 となおそう。
        paths:
          - [10⁻³ × 10⁸ は 10 を 8 回かけて 3 回わるので 10⁵, 20 × 10⁵, 2 × 10⁶, 6]
    extra:
      - part: 今日
        text: ある細菌の長さは、約 0.000002 m です。標準形で表すと 2 × 10 の □ 乗 m です。□ に入る数はいくつですか。
        answer: −6
