      - 逆向きの斜めにも 1、2、3 を書いて、両方で「多い数」になっているマスをさがそう。そこに置けば本当にしきつめられるかも確かめよう。
    paths:
      - [左上から右下への斜めに 1、2、3 をくり返して書くと、ある数が 22 マス、ほかの 2 つが 21 マスずつ, 棒 21 本は 1、2、3 を 21 マスずつおおうので、正方形は 22 マスある数のマスに置くしかない, 右上から左下への斜めに書いても同じことが言えるので、置けるのは両方で 22 マスの数になっている 4 マスだけ, たとえば上から 3 マス目・左から 3 マス目に置くと、左上の たて 5・横 5 の部分は正方形のまわりを風車のように 8 本で、右の たて 5・横 3 の部分は横向きに 5 本で、下の たて 3・横 8 の部分は縦向きに 8 本でしきつめられる, ほかの 3 マスは盤を回したものなので、4 マス]
    note: 3 日目の挑戦（5 × 5 の盤）の論法を、2 つの向きの斜めで重ねる。色（数）の論法は「置けないマス」を示す道具で、置けるマスは実際のしきつめ方で示す（いくつか試してできなかった、では示したことにならない）。片方の斜めだけで終えると、候補が 22 マス残る。
