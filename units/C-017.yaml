        text: たて 3 マス、横 5 マスの盤（15 マス）を、ドミノでしきつめられますか。
        choices: [できる, できない]
        answer: できない
        check: "'できる' if (lambda f: f(f, '...............', 5, 2))(lambda f, s, w, k: 1 if '.' not in s else (lambda i: (f(f, s[:i] + '#' * k + s[i + k:], w, k) if i % w <= w - k and s[i:i + k] == '.' * k else 0) + (f(f, ''.join('#' if j in range(i, i + k * w, w) else s[j] for j in range(len(s))), w, k) if i + (k - 1) * w < len(s) and all(s[i + t * w] == '.' for t in range(k)) else 0))(s.index('.'))) else 'できない'"
