  - part: 離
    kinds: [数]
    text: たて 99 マス、横 99 マスの盤から 1 マスを切り取り、残りのマスをドミノ（1 × 2 の板）ですきまなくしきつめます。切り取るマスとしてありえるのは、何マスですか。
    answer: 4901
    check: "(99 * 99 + 1) // 2"
    time: 900
    hints:
      - 左上を黒にして市松にぬると、黒マスと白マスはそれぞれ何マスかな。
      - ドミノ 1 枚は、黒 1 マスと白 1 マスをおおうね。どちらの色のマスを切り取らないといけないかな。
      - 黒マスならどこを切り取ってもしきつめられるかを、切り取るマスが上から何番目・左から何番目かで場合を分けて、しきつめ方を作って確かめよう。
    paths:
      - [左上を黒にすると、黒マスは 4901 マス、白マスは 4900 マス, ドミノは黒と白を 1 マスずつおおうので、切り取るのは黒マスでなければならない, 黒マスは、上から何番目と左から何番目が両方奇数か両方偶数のマス, 両方奇数なら、その行の上と下はそれぞれ偶数行あるので 2 行ずつ縦のドミノで、その行の左と右は偶数マスずつなので横のドミノでしきつめられる, 両方偶数なら、そのマスをかこむ たて 3・横 3 の 8 マスを輪にして 4 枚で、その 3 行の左右と、上下の残りも偶数ずつに分けてしきつめられる, どの黒マスでもできるので 4901 マス]
    note: 色の数（1 日目）で「白マスは切り取れない」を示し、「黒マスならどこでもできる」をしきつめ方を作って示す。できる方も示さないと、答えは決まらない。99 × 99 = 9801 の計算と、黒が 1 マス多いことの確認でまちがえやすい。
