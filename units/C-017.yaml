# C-017 盤面とタイル張り（塗り分けの論法）
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の漢字まじりの文。
# 地図に日ごとのねらいがないので、既定の並び（導入・練習・練習・わけ・混ぜる・確認）に次のねらいを当てた：
#   1 日目 盤を市松にぬる。ドミノ（2 マスの板）1 枚は黒 1・白 1 をおおうので、黒と白の数がちがう盤はしきつめられない。
#          数が同じなら、実際のしきつめ方を示して「できる」と言う、
#   2 日目 コマを上下左右に 1 マス動かすと色が変わる（交互）。奇数回ではもとのマスにもどれない。部屋を 1 回ずつ通る道、ナイトの動き、
#   3 日目 ほかのぬり方：斜めに 1、2、3 と数を書くと、1 × 3 の棒は 1、2、3 を 1 つずつおおう。切り取ってよいマスを決める、
#   4 日目 わけ（なぜ黒と白の数で決まるか、なぜ奇数回でもどれないか、なぜ 1 × 3 の棒で決まるか）、
#   5 日目 L-009（変わらないもの：合計、偶奇）・L-005（偶奇）と混ぜる。1 × 4 の棒と 4 つの数、6 日目 確認。
# 前提は L-009 と L-005（→ N-008、N-007）だけなので、計算はたし算とひき算だけ（かけ算 N-013 は前提にない）。
#   盤の大きさは「たて 4 マス、横 4 マス」と書き、マスの数が要るときは文に書く（8 × 8 の盤は「黒と白が 32 マスずつ」と書く）。
#   文字の式（A-010）も前提にないので、わけは言葉で一般に書く。
# 考え方の水準は 3 なので、わけはすべて ③（約束した事実から筋道を立てて書く）：explain に、① 約束（となり合うマスは色がちがう、
#   棒はどこに置いても 1、2、3 を 1 つずつおおう）、② 1 枚ごとの事実から全体へ（何枚でも同じ数ずつ）、③ 盤の数とくらべて結論、の 3 点を書いた。
#   いくつか置いてみて「できなかった」だけでは示したことにならない、と毎回ふれる。
# 黒と白が同じ数でも、しきつめられるとはかぎらない（色の数は「できない」を示す道具）。「できる」はしきつめ方を paths に書いた。
# 盤の図は svg。黒マスは濃い灰色、白マスは白で描く（画面が暗くても黒マス・白マスと呼べるように、色を決めて描いた）。左上を黒にする。
#   切り取ったマスは描かない。数を書く盤は、数だけを書いて色はぬらない。部屋の図は絵文字（🐭 が出発、🧀 が終わり）。
# 一筆書き（C-012）は前提にないので、点と線の図にはしない。
# check：しきつめは、左上から最初の空いたマスに、棒を横か縦に置く置き方を全部ためす自分を呼ぶ lambda で、しきつめ方の数を数える。
#   8 × 8 の盤は数え上げが大きすぎるので黒と白のマスの数で、7 × 7 の盤はマスの数の偶奇で確かめる（どちらも示したい論法そのもの）。
#   コマの動きは、動ける先の集まりを回数だけ広げる。部屋の道は、1 回ずつ通る道をすべてたどって、終わりの部屋の集まりを出す。
#   コインと石は、たどり着ける様子の集まりを、ふえなくなるまで広げる。黒板の数は、2 つの選び方を全部ためして最後の数の集まりを出す。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-010、N-013 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

