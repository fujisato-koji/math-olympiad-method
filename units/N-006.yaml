# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 道筋]
    text: 1 から 100 までの かずを、ぜんぶ じゅんに かきます。すうじの 7 は、なんかい かきますか。
    answer: 20
    check: "sum(f'{k}'.count('7') for k in range(1, 101))"
    hints:
      - いちの くらいに 7 が でてくる かずを さがそう。7、17、27、……
      - じゅうの くらいに 7 が でてくる かずも さがそう。
      - 77 には、すうじの 7 が いくつ あるかな。
    paths:
      - [いちの くらいの 7 は 7、17、……、97 の 10 かい, じゅうの くらいの 7 は 70 から 79 の 10 かい, 10 と 10 を あわせる, 20 かい]
    note: 一の位と十の位に分けて数える。77 を 1 回だけ数えて 19 とする誤りが多い（7 をふくむ数は 19 個だが、7 を書く回数は 20 回）。どの位の 7 を数えているかを、位ごとに確かめさせる。
  - part: 離
    kinds: [総動員]
    uses: [C-002]
    text: 2、4、7、9 の カードが 1 まいずつ あります。2 まいを ならべて、2 けたの かずを つくります。30 より おおきくて、80 より ちいさい かずは、いくつ できますか。
    figure: "［2］［4］［7］［9］"
    answer: 6
    check: "len([1 for a, b in itertools.permutations([2, 4, 7, 9], 2) if 30 < 10 * a + b < 80])"
    hints:
      - じゅうの くらいに おける カードは どれかな。
      - 30 より おおきくて 80 より ちいさいなら、じゅうの くらいの すうじは いくつかな。
      - じゅうの くらいを きめたら、いちの くらいに おける カードを ぜんぶ かきだそう。
    paths:
      - [じゅうの くらいは 4 か 7, 4 の とき 42、47、49, 7 の とき 72、74、79, 6 こ]
    note: 十の位で数の大きさの範囲が決まること（2・3 日目）と、もれなく書き出すこと（C-002）を合わせる。十の位が 2 や 9 の数（27、92 など）を入れてしまう誤り、同じカードを 2 回使う誤り（44、77）に気をつける。
  - part: 離
    kinds: [読み取り]
    text: ある 2 けたの かずを あてよう。じゅうの くらいの すうじと、いちの くらいの すうじを たすと 12 です。じゅうの くらいと いちの くらいの すうじを いれかえると、もとの かずより おおきく なります。じゅうの くらいの すうじは 4 より おおきいです。もとの かずは なんですか。
    answer: 57
    check: "[10 * a + b for a in range(1, 10) for b in range(10) if a + b == 12 and 10 * b + a > 10 * a + b and a > 4][0]"
    hints:
      - たして 12 に なる 2 つの すうじの くみを かきだそう。
      - いれかえて おおきく なるのは、いちの くらいの すうじの ほうが おおきい とき だね。
      - 「じゅうの くらいの すうじは 4 より おおきい」で、1 つに きめよう。
    paths:
      - [たして 12 に なるのは 3 と 9、4 と 8、5 と 7、6 と 6 など, いれかえて おおきく なるのは 39、48、57, じゅうの くらいが 4 より おおきいのは 1 つだけ, 57]
    note: 条件を順に使って候補をしぼる。「入れかえて大きくなる」を「一の位のほうが大きい」と言いかえられるかが分かれ目。12 になる組（N-005）を書き出すときに、9 と 3、8 と 4 のような向きのちがう組を落としやすい。
