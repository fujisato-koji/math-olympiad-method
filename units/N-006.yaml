# N-006 100 までの数
#
# 書き方は N-001 の頭の注、数直線の図と check は N-002 の頭の注のとおり。
# 📦 はあめが 10 こ入ったはこ（10 のまとまり）、🍬 はばらのあめ。check は n('📦') * 10 + n('🍬')。
# めもりが 10 ずつの数直線の check は Fraction(fig.split('─')[0]) + 10 * fig.split('─').index('□')。
# とびとびの数の並びは「、」で区切る。check は fig.split('、') で並べ、はじめの数に（ふえる数 × 位置）をたす。
# 位の名前は「じゅうの くらい」「いちの くらい」。数は 100 まで（100 より大きい数と百の位は N-009）。
# 2 けたのたし算・ひき算は N-007。ここでは数のしくみと、N-005 の 20 までの計算（混ぜるの日）まで。
#   4 日目の「38 に 2 たす」「まとまり 2 つとばら 15」は、10 をつくる考え（N-005）でばらをまとめる問題として置く。
# 地図の plan にわけの日がないので、練習の日（2・3 日目）と混ぜるの日（4 日目）にわけを 1 問ずつ置く。

