        explain: |-
          めだかの めすは、朝 たまごを うみ、しばらく はらに つけた あと、水草に からめて つけます。たまごの 大きさは 1 mm ほどで、まわりの ほそい いとで 水草に くっつきます。たまごの 中では からだが でき、2〜3 日で 目が 黒く なり、やがて たまごの 中で くるくる うごきます。水の あたたかさで かわりますが、25 ど くらいなら 10〜11 日で かえります。かえった ばかりの 子めだかは、はらの ふくろの えいようで 2〜3 日 すごすので、その あいだは えさを ほとんど 食べません。
          きょうは「たまごの 中で からだが できて いく じゅん（目が できる → うごく → かえる）」と「はらの ふくろ」が つかめれば よい。親の めだかは たまごを 食べて しまう ことが あるので、たまごの ついた 水草は べつの 入れものに うつすと よい。
