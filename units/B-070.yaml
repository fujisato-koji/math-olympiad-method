      - part: 見本
        text: |-
          めだかは、水草に たまごを うみつけます。
          たまごの 中で、すこしずつ 魚の からだが できて いきます。黒い 目が 見えて きて、やがて 中で うごきだします。
          10 日 ほどで かえります。かえった 子めだかの はらには、えいよう（生きて 大きく なる ための もと）の 入った ふくろが あります。
