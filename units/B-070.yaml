 0"/><path d="M3 -23C18 -47 45 -52 50 -40C54 -26 40 -12 4 -13Z" fill="#fff" fill-opacity=".9"/><path d="M3 -12C28 -14 42 -2 37 12C32 26 15 30 3 4Z" fill="#fff" fill-opacity=".9"/><path d="M40 -46C46 -47 50 -44 50 -40C51 -35 49 -31 46 -29Z" fill="currentColor" fill-opacity=".55" stroke="none"/><circle cx="28" cy="-30" r="4" fill="currentColor" fill-opacity=".6" stroke="none"/><circle cx="33" cy="-20" r="3.4" fill="currentColor" fill-opacity=".6" stroke="none"/><path d="M-3 -23C-18 -47 -45 -52 -50 -40C-54 -26 -40 -12 -4 -13Z" fill="#fff" fill-opacity=".9"/><path d="M-3 -12C-28 -14 -42 -2 -37 12C-32 26 -15 30 -3 4Z" fill="#fff" fill-opacity=".9"/><path d="M-40 -46C-46 -47 -50 -44 -50 -40C-51 -35 -49 -31 -46 -29Z" fill="currentColor" fill-opacity=".55" stroke="none"/><circle cx="-28" cy="-30" r="4" fill="currentColor" fill-opacity=".6" stroke="none"/><circle cx="-33" cy="-20" r="3.4" fill="currentColor" fill-opacity=".6" stroke="none"/><ellipse cx="0" cy="4" rx="3.2" ry="14" fill="#c8ccd6" fill-opacity=".9"/><ellipse cx="0" cy="-17" rx="4.5" ry="7" fill="#c8ccd6" fill-opacity=".9"/><circle cx="0" cy="-28" r="4.5" fill="#c8ccd6" fill-opacity=".9"/><path d="M1.5 -32L9 -52"/><path d="M-1.5 -32L-9 -52"/><circle cx="9.6" cy="-53.3" r="2.2" fill="currentColor" stroke="none"/><circle cx="-9.6" cy="-53.3" r="2.2" fill="currentColor" stroke="none"/></g></g><text x="40" y="170" font-size="14" text-anchor="middle" fill="currentColor">たまご</text><text x="124" y="170" font-size="14" text-anchor="middle" fill="currentColor">ようちゅう</text><text x="203" y="170" font-size="14" text-anchor="middle" fill="currentColor">さなぎ</text><text x="279" y="170" font-size="14" text-anchor="middle" fill="currentColor">せいちゅう</text></svg>'
        explain: |-
          もんしろちょうは、キャベツや アブラナの なかまの はの うらに、1 mm ほどの 黄色い たまごを 1 こずつ うみます。数日で かえった ようちゅうは、さいしょに じぶんの たまごの からを 食べ、その あと はを 食べながら かわを 4 回 ぬいで、3 cm ほどに なります。さなぎに なると なにも 食べず、10 日 ほどで せいちゅうが 出て きます。
          きょうは「たまご → ようちゅう → さなぎ → せいちゅう」の じゅんと、ようちゅうは はを 食べて 大きく なり、さなぎは 食べない ことが つかめれば よい。えの たまごは、見やすい ように 大きく かいて あります。キャベツの はの うらを いっしょに さがして みると よい。
      - part: 今日
        text: もんしろちょうの この すがたを、なんと いうかな。
