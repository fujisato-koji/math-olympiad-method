# B-070 生き物の一生
#
# 段 2・水準 1・6 日。たまご・ようちゅう・さなぎ・せいちゅうと形をかえてそだつこと（もんしろちょう、かぶとむし）、さなぎにならない虫（ばった、とんぼ）、めだかのたまごの中で目ができてうごき、かえること、そだてて毎日かんさつカードに書き、日づけと長さでくらべることを扱う。
# 日の並びは 導入（もんしろちょうの一生）・練習（さなぎになる虫とならない虫）・練習（めだかのたまご）・わけ（毎日きろくする）・混ぜる・確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の約束：一生のならびは左から右へ黒いやじるし。もんしろちょうは たまご＝黄色のほそながいつぶ、ようちゅう＝みどりのまるがならぶ形、さなぎ＝茶色のとがった形（くきにとまる）、せいちゅう＝上から見た白いはね。かぶとむしと ばったは よこから見た形。ばったの ようちゅうは、ならべる せいちゅうの 0.75 ばいほどの 大きさで はねが みじかく、せいちゅうの はねは こい ぬりと ふとい ふちで はらの 先より 長く かく。めだかのたまごは水色のまるで、黒い目が見えるほどそだっている。赤いてんせんの丸は「見るところ」。
# 卵は 1 mm ほどと小さいが、見やすいように大きくかいた。こん虫のからだと食べものは B-017、すみかに合ったからだは B-072、めだかのおすとめすのちがいは、ここでは問わない。
# 腕だめし（離）は 2 問とも読み取り（ことばのカードから虫を当てる、めだかのカードから日数を読む）。

id: B-070
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          もんしろちょうは、たまご → ようちゅう → さなぎ → せいちゅう の じゅんに すがたを かえて そだちます。
          たまごは、キャベツの はに うみつけられます。たまごから 子どもが 出て くる ことを「かえる」と いいます。
          かえった 子どもを ようちゅう、おとなを せいちゅうと いいます。ようちゅうは はを 食べて 大きく なります。
          さなぎの あいだは、なにも 食べずに じっと して います。
