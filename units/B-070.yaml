        explain: |-
          「1 日だけ 見ても、ようちゅうが 大きく なって いるか わからない。毎日 おなじ ように 書いて ならべると、1 cm、2 cm、3 cm と すこしずつ 長く なった ことや、19 日に さなぎに かわった ことが わかる（えの 4 まいは、毎日の カードから 3 日ごとに えらんだ もの）。日づけと 長さを 書いて おくと、なん日で どれだけ かわったかを あとで くらべられる。」と いえれば よい。
          ① 1 日の かわりは 小さい、② ならべると かわって いく ようすが わかる、③ 日づけと 長さを 書くと くらべられる、の 3 つが 入れば よい。カードには、日づけ・天気・えと 長さ・気づいた ことを 書きます。おなじ じかんに、おなじ ものさしで はかると くらべやすい。いっしょに カードを 1 まい 書いて みると よい。
        hints:
