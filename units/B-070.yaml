        explain: |-
          かぶとむしの ようちゅうは、おちばが くさって できた 土（ふようど）の 中で、その 土を 食べて 大きく なります。ようちゅうの まま ふゆを こし、はつなつに 土の 中に へやを 作って さなぎに なり、なつに せいちゅうが 土から 出て きます。
          ちょうや かぶとむしの ように さなぎに なる 虫と、ばった・とんぼ・せみ・かまきりの ように さなぎに ならない 虫が います。さなぎに ならない 虫の ようちゅうは、かわを ぬぐ たびに せいちゅうに 近い すがたに なり、さいごに はねが のびて せいちゅうに なります。とんぼの ようちゅうは やごと よばれ、水の 中で くらします。きょうは「さなぎに なる 虫と ならない 虫が いる」ことが つかめれば よい。
