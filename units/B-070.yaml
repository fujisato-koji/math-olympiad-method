      - part: 見本
        text: |-
          かぶとむしも、たまご → ようちゅう → さなぎ → せいちゅう の じゅんに そだちます。ようちゅうは 土の 中で くらします。
          ばったや とんぼは、さなぎに なりません。たまご → ようちゅう → せいちゅう と そだちます。とんぼの ようちゅうは、水の 中で くらします。
          ばったの ようちゅうは、せいちゅうと にた かたちで、はねが みじかい です。
