    text: 図の 2 本の直線（なす角 25°）を、それぞれ鏡とする鏡映を、s1、s2 とします。s1 のあとに s2 をかけてできるへんかんは、どれですか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="20" y1="110" x2="220" y2="110" fill="none" stroke="#f08080" stroke-width="3"/><line x1="29.4" y1="152.3" x2="210.6" y2="67.7" fill="none" stroke="#7bc96f" stroke-width="3"/><path d="M170 110 A50 50 0 0 0 165.3 88.9" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="186" y="100" font-size="14" text-anchor="middle" fill="currentColor">25°</text><text x="224" y="128" font-size="14" text-anchor="start" fill="currentColor">鏡 1</text><text x="216.6" y="63.7" font-size="14" text-anchor="start" fill="currentColor">鏡 2</text><text x="262" y="150" font-size="13" text-anchor="middle" fill="currentColor">s1：鏡 1 の鏡映</text><text x="262" y="172" font-size="13" text-anchor="middle" fill="currentColor">s2：鏡 2 の鏡映</text></svg>'
    choices: ["50° の回転", "25° の回転", "鏡映", "何もしないへんかん"]
    answer: "50° の回転"
    check: "'50° の回転'"
    hints:
      - text: 鏡の線の角が φ なら、角 θ の点は、角 2φ − θ の点に動きます。点 p を、s1、s2 の順に動かした先を追いましょう（図）。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="38" y1="110" x2="202" y2="110" fill="none" stroke="#f08080" stroke-width="1.5"/><line x1="45.7" y1="144.7" x2="194.3" y2="75.3" fill="none" stroke="#7bc96f" stroke-width="1.5"/><circle cx="120" cy="110" r="62" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 4"/><circle cx="181.1" cy="99.2" r="5" fill="currentColor"/><text x="195.1" y="103.2" font-size="14" text-anchor="start" fill="currentColor">p</text><circle cx="181.1" cy="120.8" r="5" fill="#f08080"/><text x="195.1" y="124.8" font-size="14" text-anchor="start" fill="currentColor">s1 p</text><circle cx="151" cy="56.3" r="5" fill="#7bc96f"/><text x="155" y="46.3" font-size="14" text-anchor="start" fill="currentColor">s2 s1 p</text></svg>'
      - 点 p から、最後の点まで、どれだけ回っているでしょう。
      - 行列式は、鏡映 1 つで −1 です。2 つかけると、何になるでしょう。
    paths:
      - [s1 で折り返す, s2 で折り返す, p から 50° 回る]
      - [det = (−1)(−1) = 1, 回転, 角は 2 × 25°]
    note: 鏡映 2 つの積は、なす角の 2 倍の回転。O(2) の det=1 の部分が SO(2)。
