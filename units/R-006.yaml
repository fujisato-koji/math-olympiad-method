        text: "ユニタリ群 U(n)：U† U = I を満たす n×n ふくそ行列の全体です。U† は、U を転置して、成分のふくそきょうやくをとった行列です。\nとくしゅユニタリ群 SU(n)：U(n) のうち、det U = 1 のもの。\nU(1) は、ぜったいち 1 のふくそすう e^(iθ) の全体で、図のように円の上にあります。でんじきの位相のへんかんです。\nSU(2) はスピン 1/2 の回転を表し、物理で重要です。"
