# R-006 行列群、結晶群と空間群
#
# 水準 6・12 日。前提は R-001（群の定義と例、部分群と準同型）と R-037（行列群と点群の入口）。
# 水準を 3 から 6 に見直し、定義を当てて値や個数を答える中身は R-037 に分けた（D-229）。中身はまだ水準 3 の書き方で、
#   水準 6 の形（常体・漢字・1 日 90 分・わけは公理から）への作り直しと、3 の中身の R-037 への移しは、あとの fix で行う。
# 行列群（GL、SL、O、SO、U、SU、ローレンツ群）、結晶群と点群、空間群、ビーベルバッハの定理、
# 表現と指標の入口、群の作用と対称性を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。
# 図とイラストの多い形に直した（D-131、直す係 3）。見本に、正方形が行列で移る図、回転と鏡映、複素数の平面の円、ローレンツ群の時空図、
#   立方体の回転軸、並進と回転の模様、表現と指標の表、群の作用の図を付けた。答える問題は、図を見て数える・選ぶ・読む形にし、
#   ヒントの 1〜2 段に、つぶれる形、たすきがけ、内積の表、折り返し、同じ曲線、軸の表、目盛りの図などを付けた（答えは図に書かない）。
#   同じ問題のくり返し（D-191）と、答えが 2 つに読めた 8 日目の問い、不正確だった 4 日目の見本を直し、答えや問いが変わった問題の id を消した。

