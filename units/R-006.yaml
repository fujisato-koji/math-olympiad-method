        text: 直交行列がベクトルの長さを保つわけを説明しましょう。
        explain: 「||Qv||² = (Qv)ᵀ(Qv) = vᵀQᵀQv。QᵀQ=I なので、= vᵀv = ||v||²。長さの 2 乗が等しいので、長さも等しい。」と書ければよい。① ノルムの 2 乗、② QᵀQ=I、③ ||v||²。子どもには、回転で確かめさせます。
        hints:
          - 長さの 2 乗を内積で書きます。
          - QᵀQ=I を使います。
          - vᵀv になります。
        paths:
          - ["||Qv||²", "QᵀQ=I", "||v||²"]
      - part: わけ
        text: SU(n) が SL(n, C) の部分群になるわけを説明しましょう。
        explain: 「SU(n) の要素は U†U=I を満たす。両辺の行列式をとると、det(U†)det(U)=1。det(U†) は det(U) の複素共役なので、|det U|²=1。SU(n) ではさらに det U=1 と定めている。行列式 1 の行列は SL(n,C) に入る。だから SU(n) は SL(n,C) の部分群。」と書ければよい。① U†U=I、② |det U|=1、③ det U=1 に限る。子どもには、U(1) で確かめさせます。
        hints:
          - U†U=I の行列式をとります。
          - "|det U|²=1 になります。"
          - SU(n) は det U=1 に限っています。
        paths:
          - [U†U=I, "|det U|=1", det U=1, SL の部分群]
      - part: わけ
        text: ビーベルバッハの定理が、空間群の分類の土台になるわけを説明しましょう。
        explain: 「結晶の対称性の群は、離散的で、空間全体を覆う等長変換群。ビーベルバッハの定理から、格子の並進部分群を有限指数でもつ。並進で割ると有限の点群が残る。点群と並進の組み合わせを分類すると、空間群の分類になる。」と書ければよい。① 離散・コンパクト、② 格子の並進、③ 有限の点群に分ける。子どもには、2 次元の格子で確かめさせます。
        hints:
          - 結晶の群は離散的で、空間全体を覆います。
          - 定理から、格子の並進部分群があります。
          - 並進で割ると有限の点群が残ります。
        paths:
          - [離散・コンパクト, 格子の並進, 有限の点群, 空間群の分類]

