          - text: 図の 2 つ目の箱のように、群はこうしのへいしん部分群 T をもちます。T でわると、何が残るでしょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="8" width="260" height="34" rx="6" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="160" y="30" font-size="14" text-anchor="middle" fill="currentColor">G：りさんてきで、空間全体をおおう群</text><line x1="160" y1="42" x2="160" y2="49" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,56 156.5,49 163.5,49" fill="currentColor"/><rect x="30" y="56" width="260" height="34" rx="6" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="160" y="78" font-size="14" text-anchor="middle" fill="currentColor">へいしん部分群 T（こうし）</text><line x1="160" y1="90" x2="160" y2="97" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,104 156.5,97 163.5,97" fill="currentColor"/><rect x="30" y="104" width="260" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="147" y="108" width="26" height="26" rx="6" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="160" y="126" font-size="16" text-anchor="middle" fill="currentColor">？</text><line x1="160" y1="138" x2="160" y2="145" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,152 156.5,145 163.5,145" fill="currentColor"/><rect x="30" y="152" width="260" height="34" rx="6" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/><text x="160" y="174" font-size="14" text-anchor="middle" fill="currentColor">空間群の分類</text></svg>'
          - 残るゆうげんの群とへいしんの組み合わせ方を分類すると、何の分類になるでしょう。
        paths:
