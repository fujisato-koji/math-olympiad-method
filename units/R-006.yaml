        explain: 「結晶のたいしょうせいの群は、りさんてきで、空間全体をおおうとうちょうへんかん群。ビーベルバッハの定理から、こうしのへいしん部分群をゆうげん指数でもつ。へいしんでわるとゆうげんの点群が残る。点群とへいしんの組み合わせを分類すると、空間群の分類になる。」と書ければよい。① りさん・コンパクト、② こうしのへいしん、③ ゆうげんの点群に分ける。子どもには、2 次元のこうしでたしかめさせます。
