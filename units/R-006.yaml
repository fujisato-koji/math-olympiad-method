      - part: 見本
        id: "a86d25ed04"
        text: "直交群 O(n)：長さと角度を変えない n×n の実行列 Q の全体です。Qᵀ Q = I を満たします。\nとくしゅ直交群 SO(n)：O(n) のうち、det Q = 1 のもの。回転だけを表します。\ndet Q = −1 の直交行列は、鏡映をふくみます。\n図は、正方形を回転（左）と鏡映（右）でうつしたものです。赤は 1 列目、緑は 2 列目の矢印で、どちらも長さ 1 のまま、たがいに直角です。\nSO(2) は平面の回転群、SO(3) は空間の回転群です。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="73.5" y1="120" x2="154" y2="120" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="85" y1="131.5" x2="85" y2="46.4" fill="none" stroke="#c8ccd6" stroke-width="1"/><circle cx="85" cy="120" r="46" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 4"/><polygon points="85,120 120.2,90.4 90.7,55.2 55.4,84.8" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><polygon points="85,120 131,120 131,74 85,74" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="85" y1="120" x2="113.3" y2="96.2" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="120.2,90.4 116.2,99.7 110.5,92.8" fill="#f08080"/><line x1="85" y1="120" x2="61.2" y2="91.7" fill="none" stroke="#7bc96f" stroke-width="3"/><polygon points="55.4,84.8 64.7,88.8 57.8,94.5" fill="#7bc96f"/><line x1="233.5" y1="120" x2="314" y2="120" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="245" y1="131.5" x2="245" y2="46.4" fill="none" stroke="#c8ccd6" stroke-width="1"/><circle cx="245" cy="120" r="46" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="6 4"/><polygon points="245,120 291,120 291,166 245,166" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><polygon points="245,120 291,120 291,74 245,74" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="245" y1="120" x2="282" y2="120" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="291,120 282,124.5 282,115.5" fill="#f08080"/><line x1="245" y1="120" x2="245" y2="157" fill="none" stroke="#7bc96f" stroke-width="3"/><polygon points="245,166 240.5,157 249.5,157" fill="#7bc96f"/><text x="95" y="26" font-size="15" text-anchor="middle" fill="currentColor">回転：det = 1</text><text x="255" y="26" font-size="15" text-anchor="middle" fill="currentColor">鏡映：det = −1</text><text x="160" y="192" font-size="14" text-anchor="middle" fill="currentColor">長さも、直角も、そのまま</text></svg>'
        explain: "O(n) は「長さを変えないへんかん」全体。直交行列は Q⁻¹ = Qᵀ。\nSO(n) はそのうち向きをたもつもの。det が 1 なら回転、−1 なら鏡映が入ります。\nSO(2) の行列は (cos θ、−sin θ；sin θ、cos θ)。"
        note: O(n) は QᵀQ=I、SO(n) はさらに det=1。SO(2) は平面回転。
