        text: |-
          ビーベルバッハの定理：n 次元のユークリッド空間の離散的な等長変換群で、
          商空間がコンパクトなものは、並進の部分群を有限指数でもちます。
          その並進部分群は、階数 n の格子です。
          3 次元では、この定理が空間群の分類の土台になります。
        explain: |-
          結晶の対称性のような「離散的で、空間全体を覆う」群は、必ず格子の並進を含みます。
          並進で割ると、有限の点群が残ります。
          ビーベルバッハは、この構造を一般的に証明しました。
        note: 離散・コンパクトな等長変換群は、格子の並進を有限指数でもつ。
      - part: 今日
