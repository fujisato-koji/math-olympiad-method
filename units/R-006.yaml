pacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="192.2" cy="66.8" r="5" fill="#f08080"/><polyline points="182,90 177,90 177,134 182,134" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="228,90 233,90 233,134 228,134" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="193" y="106" font-size="13" text-anchor="middle" fill="currentColor">−1</text><text x="217" y="106" font-size="13" text-anchor="middle" fill="currentColor">0</text><text x="193" y="128" font-size="13" text-anchor="middle" fill="currentColor">0</text><text x="217" y="128" font-size="13" text-anchor="middle" fill="currentColor">−1</text><text x="205" y="162" font-size="14" text-anchor="middle" fill="currentColor">χ = −2</text><text x="285" y="20" font-size="15" text-anchor="middle" fill="currentColor">r³</text><rect x="270" y="39" width="30" height="30" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="297.8" cy="66.8" r="5" fill="#f08080"/><polyline points="262,90 257,90 257,134 262,134" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="308,90 313,90 313,134 308,134" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="273" y="106" font-size="13" text-anchor="middle" fill="currentColor">0</text><text x="297" y="106" font-size="13" text-anchor="middle" fill="currentColor">1</text><text x="273" y="128" font-size="13" text-anchor="middle" fill="currentColor">−1</text><text x="297" y="128" font-size="13" text-anchor="middle" fill="currentColor">0</text><text x="285" y="162" font-size="14" text-anchor="middle" fill="currentColor">χ = 0</text><text x="160" y="192" font-size="14" text-anchor="middle" fill="currentColor">自明なひょうげん：どの g も (1) に写し、χ はいつも 1</text></svg>'
        explain: "ひょうげんは「群のようそを行列で表す」ことです。積は行列の積にたいおうします。\n指標は行列のトレースで、ひょうげんの性質をまとめて表します。\n自明なひょうげんは、すべてを 1 にする 1 次元ひょうげんです。"
        note: 表現は G→GL(V) の準同型。指標はトレース。単位元の指標は次元。
