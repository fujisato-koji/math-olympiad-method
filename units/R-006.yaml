  - day: 7
    items:
      - part: 見本
        id: "da20a603ee"
        text: "ビーベルバッハの定理：n 次元のユークリッド空間の、りさんてきなとうちょうへんかん群で、わった空間（商空間）がコンパクトなものは、へいしんの部分群をゆうげんしすうでもちます。\nそのへいしん部分群は、階数 n のこうしです。図は n = 2 の例で、a、b の 2 本のへいしんがこうしを決めます。\n3 次元では、この定理が空間群の分類の土台になります。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="46,150 96,150 120,104 70,104" fill="#f3c969" fill-opacity="0.5"/><circle cx="46" cy="150" r="3.5" fill="currentColor"/><circle cx="70" cy="104" r="3.5" fill="currentColor"/><circle cx="94" cy="58" r="3.5" fill="currentColor"/><circle cx="96" cy="150" r="3.5" fill="currentColor"/><circle cx="120" cy="104" r="3.5" fill="currentColor"/><circle cx="144" cy="58" r="3.5" fill="currentColor"/><circle cx="146" cy="150" r="3.5" fill="currentColor"/><circle cx="170" cy="104" r="3.5" fill="currentColor"/><circle cx="194" cy="58" r="3.5" fill="currentColor"/><circle cx="196" cy="150" r="3.5" fill="currentColor"/><circle cx="220" cy="104" r="3.5" fill="currentColor"/><circle cx="244" cy="58" r="3.5" fill="currentColor"/><circle cx="246" cy="150" r="3.5" fill="currentColor"/><circle cx="270" cy="104" r="3.5" fill="currentColor"/><circle cx="294" cy="58" r="3.5" fill="currentColor"/><line x1="50" y1="162" x2="82" y2="162" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="92,162 82,167 82,157" fill="#f08080"/><text x="71" y="180" font-size="15" text-anchor="middle" fill="currentColor">a</text><line x1="32" y1="148" x2="51" y2="114.7" fill="none" stroke="#7bc96f" stroke-width="3"/><polygon points="56,106 55.4,117.2 46.7,112.2" fill="#7bc96f"/><text x="20" y="126" font-size="15" text-anchor="middle" fill="currentColor">b</text><text x="160" y="26" font-size="14" text-anchor="middle" fill="currentColor">へいしん部分群 ＝ a、b で作るこうし（階数 2）</text><text x="160" y="196" font-size="14" text-anchor="middle" fill="currentColor">黄色：くり返しの 1 つぶん（きほんりょういき）</text></svg>'
        explain: "結晶のたいしょうせいのような「りさんてきで、空間全体をおおう」群は、必ずこうしのへいしんをふくみます。\nへいしんでわると、ゆうげんの点群が残ります。\nビーベルバッハは、このこうぞうをいっぱんてきにしょうめいしました。"
        note: 離散・コンパクトな等長変換群は、格子の並進を有限指数でもつ。
      - part: 今日
        id: "d816c0fdfa"
        text: 図は、平面いっぱいにくり返されるもようです（L の字がならんでいます）。このもようを自分に重ねる動かし方のうち、へいしんだけを集めた部分群は、どくりつなへいしんを何本ならべたもの（階数）ですか。
