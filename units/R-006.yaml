  - day: 10
    items:
      - part: わけ
        id: "9da714c4ff"
        text: 直交行列がベクトルの長さをたもつわけを説明しましょう。図は、ベクトル v と、直交行列 Q でうつした Qv です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="108" r="70" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="30" y1="108" x2="190" y2="108" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="110" y1="108" x2="166.4" y2="87.5" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="175.8,84.1 168.1,92.2 164.7,82.8" fill="#f08080"/><line x1="110" y1="108" x2="120.4" y2="48.9" fill="none" stroke="#7bc96f" stroke-width="3"/><polygon points="122.2,39.1 125.3,49.8 115.5,48" fill="#7bc96f"/><path d="M138.2 97.7 A30 30 0 0 0 115.2 78.5" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="187.8" y="80.1" font-size="16" text-anchor="middle" fill="currentColor">v</text><text x="136.2" y="35.1" font-size="16" text-anchor="middle" fill="currentColor">Qv</text><text x="262" y="96" font-size="15" text-anchor="middle" fill="currentColor">v と Qv の</text><text x="262" y="118" font-size="15" text-anchor="middle" fill="currentColor">長さは？</text></svg>'
        explain: 「||Qv||² = (Qv)ᵀ(Qv) = vᵀQᵀQv。QᵀQ=I なので、= vᵀv = ||v||²。長さの 2 乗が等しいので、長さも等しい。」と書ければよい。① ノルムの 2 乗、② QᵀQ=I、③ ||v||²。子どもには、回転でたしかめさせます。
        hints:
          - 長さの 2 乗は、自分自身との内積 vᵀ v で書けます。Qv の長さの 2 乗を、内積で書きましょう。
          - text: (Qv)ᵀ = vᵀ Qᵀ を使うと、図の形になります。四角で囲んだ部分に注目しましょう。
