    items:
      - part: 見本
        id: "fd95277af4"
        text: "【定義】同じサイズの正方行列の集まりのうち、行列のかけ算を演算として、単位行列 I を単位元とし、《群》の公理（《閉じている》・《結合法則》・《単位元》・《逆元》）を満たすものを「行列群（線形群）」と呼びます。\n【定義】行列式が 0 でない n×n の実行列の全体に、行列のかけ算を演算として考えたものを、いっぱん線形群といい、GL(n, R) と書きます。\n【定理】GL(n, R) は、行列のかけ算について群になります。\n証明：群のじょうけん（R-001）を、1 つずつたしかめます。\n① 積でとじている：A、B が GL(n, R) に入れば、det(AB) = det A · det B ≠ 0（《行列式の積の定理》、M-004）なので、AB も入ります。\n② 結合法則：(AB)C = A(BC) は、行列のかけ算でなりたちます。\n③ 単位元：単位行列 I は det I = 1 ≠ 0 なので入り、AI = IA = A です。\n④ 逆元：det A ≠ 0 のとき、ぎゃくぎょうれつ A⁻¹ があり（《逆行列の存在条件》、M-004）、det(A⁻¹) = 1/det A ≠ 0（《逆行列の行列式》）なので、A⁻¹ も入ります。\n【定義】GL(n, R) のうち、行列式が 1 のものの全体を、とくしゅ線形群といい、SL(n, R) と書きます。\n【定理】SL(n, R) も、GL(n, R) の部分群になります（わけは、挑戦でたしかめます）。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polyline points="30,16 25,16 25,56 30,56" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="76,16 81,16 81,56 76,56" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="41" y="31" font-size="14" text-anchor="middle" fill="currentColor">2</text><text x="65" y="31" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="41" y="51" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="65" y="51" font-size="14" text-anchor="middle" fill="currentColor">1</text><line x1="18" y1="128" x2="89.4" y2="128" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="25" y1="135" x2="25" y2="63.6" fill="none" stroke="#c8ccd6" stroke-width="1"/><polygon points="25,128 81,128 81,100 25,100" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><polygon points="25,128 53,128 53,100 25,100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><text x="53" y="164" font-size="14" text-anchor="middle" fill="currentColor">det = 2</text><text x="53" y="184" font-size="14" text-anchor="middle" fill="currentColor">GL だけ</text><polyline points="137,16 132,16 132,56 137,56" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="183,16 188,16 188,56 183,56" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="148" y="31" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="172" y="31" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="148" y="51" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="172" y="51" font-size="14" text-anchor="middle" fill="currentColor">1</text><line x1="125" y1="128" x2="196.4" y2="128" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="132" y1="135" x2="132" y2="63.6" fill="none" stroke="#c8ccd6" stroke-width="1"/><polygon points="132,128 160,128 188,100 160,100" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><polygon points="132,128 160,128 160,100 132,100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><text x="160" y="164" font-size="14" text-anchor="middle" fill="currentColor">det = 1</text><text x="160" y="184" font-size="14" text-anchor="middle" fill="currentColor">GL と SL</text><polyline points="244,16 239,16 239,56 244,56" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="290,16 295,16 295,56 290,56" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="255" y="31" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="279" y="31" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="255" y="51" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="279" y="51" font-size="14" text-anchor="middle" fill="currentColor">1</text><line x1="232" y1="128" x2="303.4" y2="128" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="239" y1="135" x2="239" y2="63.6" fill="none" stroke="#c8ccd6" stroke-width="1"/><line x1="239" y1="128" x2="295" y2="72" fill="none" stroke="#7fc8f8" stroke-width="7"/><polygon points="239,128 267,128 267,100 239,100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><text x="267" y="164" font-size="14" text-anchor="middle" fill="currentColor">det = 0</text><text x="267" y="184" font-size="14" text-anchor="middle" fill="currentColor">つぶれる</text></svg>'
        explain: "図の読み方：1 辺 1 の正方形（点線）を、3 つの行列でうつしました。行列式のぜったいちが面積のばいりつ、ふごうが向きです（《面積の倍率としての行列式》、《行列式の符号と向き》）。\n・(2 0；0 1)：行列式は 2。面積が 2 倍になります。GL(2,R) には入りますが、SL(2,R) には入りません。\n・(1 1；0 1)：行列式は 1。面積も向きもかわりません。SL(2,R) に入ります。\n・(1 1；1 1)：行列式は 0。正方形が線につぶれ、ぎゃくぎょうれつがありません。GL(2,R) に入りません。\nなぜこう定めるか：群には逆元が要ります。行列で逆元にあたるのはぎゃくぎょうれつで、ぎゃくぎょうれつをもつのは、行列式が 0 でないときだけです（《逆行列の存在条件》）。だから「行列式が 0 でない」で GL(n,R) を定めると、ぎゃくぎょうれつをもつ行列を、ちょうど全部集められます。 SL(n,R) を「行列式が 1」で定めるのは、面積も向きもかえない行列を集めるためです。\n気をつけること：「面積をかえない」だけなら、行列式は 1 か −1 です。(1 0；0 −1) は行列式が −1 で、面積はかえませんが、向きをうら返すので、GL(n,R) には入りますが、SL(n,R) には入りません。"
        note: GL は正則行列全体、SL は行列式 1 の行列全体。行列式の絶対値が面積の倍率、符号が向き（D-229）。単位元は I。
