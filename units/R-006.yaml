  - day: 9
    items:
      - part: 見本
        text: |-
          群の作用は、群の要素で集合の点を動かすことです。
          群 G が集合 X に作用するとは、各 g と x に g·x を対応させ、
          e·x = x、(gh)·x = g·(h·x) を満たすこと。
          軌道：G·x = {g·x | g ∈ G}。安定化群：G_x = {g | g·x = x}。
          結晶の対称性は、原子の位置の集合に作用します。
        explain: |-
          群の作用は「群の要素で集合を動かす」ことです。
          軌道は、1 つの点から到達できる点全体。安定化群は、その点を動かさない要素全体。
          結晶では、回転や鏡映が原子の配置を動かします。
        note: 作用は g·x。軌道は到達できる点、安定化群は動かさない要素。
      - part: 今日
        text: 群 G の作用で、点 x の軌道はどれですか。
