      - part: 見本
        text: |-
          表現は、群の要素をベクトル空間の線形変換（行列）として表すことです。
          群 G から GL(V) への準同型 ρ を、G の表現といいます。
          ρ(g) のトレースを指標 χ(g) = Tr ρ(g) といいます。
          表現の次元は、V の次元。単位元の指標は次元に等しい。
          自明な表現：すべての g を 1 に対応させる。指標はいつも 1。
        explain: |-
          表現は「群の要素を行列で表す」ことです。積は行列の積に対応します。
          指標は行列のトレースで、表現の性質をまとめて表します。
          自明な表現は、すべてを 1 にする 1 次元表現です。
        note: 表現は G→GL(V) の準同型。指標はトレース。単位元の指標は次元。
      - part: 今日
        text: 表現の指標 χ(g) は何ですか。
        choices: ["Tr ρ(g)", "det ρ(g)", "ρ(g) の次元", "ρ(g) の逆行列"]
        answer: "Tr ρ(g)"
        check: "'Tr ρ(g)'"
        hints:
          - 指標はトレースです。
          - 行列の対角成分の和です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [指標, トレース, Tr ρ(g)]
      - part: 今日
        text: 自明な表現の指標はいつもいくつですか。
        choices: [0, 1, "次元", "群の位数"]
        answer: 1
        check: "1"
        hints:
          - 自明な表現は、すべての g を 1 に対応させます。
          - 1×1 行列のトレースです。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
