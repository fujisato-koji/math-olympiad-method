  - day: 9
    items:
      - part: 見本
        id: "4396e79f36"
        text: "群の作用は、群のようそで集合の点を動かすことです。\n群 G が集合 X に作用するとは、各 g と x に g·x をたいおうさせ、e·x = x、(gh)·x = g·(h·x) を満たすこと。\nきどう：G·x = {g·x | g ∈ G}。安定化群：G_x = {g | g·x = x}。\n図は、4 回回転の群 G = {e, g, g², g³} が、正方形のちょうてんと中心に作用する例です。結晶のたいしょうせいは、原子の位置の集合に作用します。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="34" y="62" width="92" height="92" fill="#c8ccd6" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/><circle cx="34" cy="62" r="6" fill="#f08080"/><circle cx="34" cy="154" r="6" fill="#f08080"/><circle cx="126" cy="62" r="6" fill="#f08080"/><circle cx="126" cy="154" r="6" fill="#f08080"/><circle cx="80" cy="108" r="6" fill="#b39ddb"/><path d="M97.3 98 A20 20 0 0 0 70 90.7" fill="none" stroke="currentColor" stroke-width="2.5"/><polygon points="70,90.7 74.9,83.2 78.9,90.1" fill="currentColor"/><text x="80" y="184" font-size="14" text-anchor="middle" fill="currentColor">g：90° の回転</text><rect x="150" y="66" width="40" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><rect x="190" y="66" width="52" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="216" y="85.5" font-size="13" text-anchor="middle" fill="currentColor">きどう</text><rect x="242" y="66" width="78" height="30" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="281" y="85.5" font-size="13" text-anchor="middle" fill="currentColor">安定化群</text><rect x="150" y="96" width="40" height="30" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="170" y="115.5" font-size="13" text-anchor="middle" fill="currentColor">ちょうてん</text><rect x="190" y="96" width="52" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="216" y="115.5" font-size="13" text-anchor="middle" fill="currentColor">4 点</text><rect x="242" y="96" width="78" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="281" y="115.5" font-size="13" text-anchor="middle" fill="currentColor">e だけ</text><rect x="150" y="126" width="40" height="30" fill="#b39ddb" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="170" y="145.6" font-size="13" text-anchor="middle" fill="currentColor">中心</text><rect x="190" y="126" width="52" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="216" y="145.6" font-size="13" text-anchor="middle" fill="currentColor">1 点</text><rect x="242" y="126" width="78" height="30" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="281" y="145.6" font-size="13" text-anchor="middle" fill="currentColor">4 つ全部</text></svg>'
        explain: "群の作用は「群のようそで集合を動かす」ことです。\nきどうは、1 つの点からとうたつできる点全体。安定化群は、その点を動かさないようそ全体。\n結晶では、回転や鏡映が原子の配置を動かします。"
        note: 作用は g·x。軌道は到達できる点、安定化群は動かさない要素。
