  - day: 5
    items:
      - part: 見本
        id: "4c4db0aa25"
        text: "結晶の点群：結晶のこうしをたもち、1 点を固定するへんかんの群です。回転・鏡映・反転などをふくみます。\n結晶では、5 回回転たいしょうはゆるされません（しゅうきこうしのため）。結晶点群は、7 つのけっしょうけいに分けられます。\n立方体の回転群 O は、図の 3 種類のじく（面の中心、辺の中点、ちょうてんを通るじく）のまわりの回転で、全部で 24 こ のようそをもちます。鏡映も入れた全たいしょう群 O_h は 48 こです。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="54.3,159.6 54.3,90.2 18.6,62.9 18.6,132.3" fill="#c8ccd6" fill-opacity="0.3"/><polygon points="54.3,159.6 54.3,90.2 121.4,75.7 121.4,145.1" fill="#c8ccd6" fill-opacity="0.3"/><polygon points="54.3,90.2 18.6,62.9 85.7,48.4 121.4,75.7" fill="#c8ccd6" fill-opacity="0.3"/><line x1="54.3" y1="159.6" x2="54.3" y2="90.2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="54.3" y1="90.2" x2="18.6" y2="62.9" fill="none" stroke="currentColor" stroke-width="2"/><line x1="18.6" y1="132.3" x2="18.6" y2="62.9" fill="none" stroke="currentColor" stroke-width="2"/><line x1="54.3" y1="159.6" x2="18.6" y2="132.3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="121.4" y1="145.1" x2="121.4" y2="75.7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="121.4" y1="75.7" x2="85.7" y2="48.4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="85.7" y1="117.8" x2="85.7" y2="48.4" fill="none" stroke="#c8ccd6" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="121.4" y1="145.1" x2="85.7" y2="117.8" fill="none" stroke="#c8ccd6" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="54.3" y1="90.2" x2="121.4" y2="75.7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="54.3" y1="159.6" x2="121.4" y2="145.1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="18.6" y1="62.9" x2="85.7" y2="48.4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="18.6" y1="132.3" x2="85.7" y2="117.8" fill="none" stroke="#c8ccd6" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="70" y1="152.6" x2="70" y2="55.4" fill="none" stroke="#f08080" stroke-width="3"/><line x1="49.6" y1="131.2" x2="90.4" y2="76.8" fill="none" stroke="#7bc96f" stroke-width="3"/><line x1="50.4" y1="173.5" x2="89.6" y2="34.5" fill="none" stroke="#b39ddb" stroke-width="3"/><rect x="140" y="29" width="13" height="13" fill="#f08080" fill-opacity="0.9" stroke="currentColor" stroke-width="1"/><text x="160" y="40" font-size="14" text-anchor="start" fill="currentColor">面のじく 3 本 × 3 = 9</text><rect x="140" y="61" width="13" height="13" fill="#7bc96f" fill-opacity="0.9" stroke="currentColor" stroke-width="1"/><text x="160" y="72" font-size="14" text-anchor="start" fill="currentColor">辺のじく 6 本 × 1 = 6</text><rect x="140" y="93" width="13" height="13" fill="#b39ddb" fill-opacity="0.9" stroke="currentColor" stroke-width="1"/><text x="160" y="104" font-size="14" text-anchor="start" fill="currentColor">ちょうてんのじく 4 本 × 2 = 8</text><text x="140" y="136" font-size="14" text-anchor="start" fill="currentColor">何もしない 1</text><text x="140" y="170" font-size="15" text-anchor="start" fill="currentColor" font-weight="bold">合わせて 24</text></svg>'
        explain: "点群は「結晶の見た目のたいしょうせい」を表す群です。\n立方体は、24 こ の回転で自分に重なります。面のじく 3 本（90°、180°、270° の 3 つ）で 9、辺のじく 6 本（180° の 1 つ）で 6、ちょうてんのじく 4 本（120°、240° の 2 つ）で 8、何もしない 1 で、合わせて 24 です。鏡映も入れると 48 こ。\n5 回たいしょうは、平面をすきまなく周期的にうめられないので、結晶ではあらわれません。"
        note: 点群は格子を保つ点の変換。結晶点群は 32 種類。立方体の回転群は 24、全対称群は 48。
      - part: 今日
