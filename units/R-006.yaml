    items:
      - part: 見本
        id: "0259668f2e"
        text: "ローレンツ群 O(1,3)：Λᵀ η Λ = η を満たす 4×4 実行列 Λ の全体です。η は計量で、対角に (1, −1, −1, −1) をならべたものです。\n図は、横が空間 x、たてが時間 ct の時空です。ブーストは、時間と空間をまぜるへんかんで、点 P を同じ曲線の上の点 P' へ動かします。曲線の上では、かんかく (ct)² − x² が同じです。\nとくしゅローレンツ群 SO(1,3)：det Λ = 1 のもの。ブーストと空間の回転をふくみます。時間の向きもたもつものは、SO⁺(1,3) といいます。"
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="19.8" y1="168" x2="256.4" y2="168" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="263.4,168 256.4,171.5 256.4,164.5" fill="currentColor"/><line x1="130" y1="168" x2="130" y2="30" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="130,23 133.5,30 126.5,30" fill="currentColor"/><line x1="130" y1="168" x2="240.2" y2="57.8" fill="none" stroke="#c8ccd6" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="130" y1="168" x2="19.8" y2="57.8" fill="none" stroke="#c8ccd6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="273.4" y="173" font-size="15" text-anchor="middle" fill="currentColor">x</text><text x="144" y="29" font-size="15" text-anchor="start" fill="currentColor">ct</text><polyline points="31.5,53.7 43.3,63.7 54.1,72.5 64.1,80.2 73.2,86.8 81.7,92.5 89.6,97.3 97,101.3 104.1,104.5 110.8,106.9 117.3,108.6 123.7,109.7 130,110 136.3,109.7 142.7,108.6 149.2,106.9 155.9,104.5 163,101.3 170.4,97.3 178.3,92.5 186.8,86.8 195.9,80.2 205.9,72.5 216.7,63.7 228.5,53.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="99.8,102.6 103.3,104.1 106.7,105.5 110.1,106.7 113.3,107.7 116.6,108.5 119.8,109.1 123,109.6 126.1,109.9 129.3,110 132.4,109.9 135.6,109.7 138.7,109.3 141.9,108.8 145.2,108.1 148.4,107.1 151.7,106.1 155.1,104.8 158.6,103.3 162.1,101.7 165.8,99.8 169.5,97.8 173.4,95.6 177.4,93.1 181.5,90.4" fill="none" stroke="#f08080" stroke-width="3"/><polygon points="181.5,90.4 175.7,100 170.4,91.5" fill="#f08080"/><circle cx="99.8" cy="102.6" r="5" fill="currentColor"/><text x="85.8" y="98.6" font-size="15" text-anchor="middle" fill="currentColor">P</text><text x="197.5" y="100.4" font-size="15" text-anchor="middle" fill="currentColor">P''</text><text x="160" y="192" font-size="14" text-anchor="middle" fill="currentColor">かんかく (ct)² − x² は、動いても変わらない</text></svg>'
        explain: "ローレンツ群は、とくしゅそうたいろんで時空のきょり（かんかく）をたもつへんかんです。\nブーストは、等速で動くざひょうけいへのへんかん。回転は空間の向きを変えるへんかん。\nSO(1,3) は 6 次元の群で、ブースト 3 と回転 3 にたいおうします。時間の向きまでたもつ部分 SO⁺(1,3) は、ブーストと回転だけでできています。"
        note: O(1,3) は ΛᵀηΛ=η。SO(1,3) は det=1。ブーストと回転を含む。時間の向きを保つのは SO⁺(1,3)。
