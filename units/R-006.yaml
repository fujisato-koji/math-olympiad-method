        text: "空間群：結晶のへいしんと点群のへんかんを合わせた群です。\nへいしんはこうしのベクトル（図の矢印 a、b）によるいどう、点群は 1 点を固定する回転・鏡映などです。図のもようは、a、b のへいしんと、点のまわりの 90° 回転で、自分に重なります。\n3 次元では、空間群は 230 種類あります。へいしんのパターンであるブラベーこうしの種類は、今日の問題で数えましょう。"
