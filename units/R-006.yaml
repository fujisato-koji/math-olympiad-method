      - part: 挑戦
        id: "09a339a2cb"
        text: "SL(2, R) のどの 2 つの行列 A、B でも、積とぎゃくぎょうれつが SL(2, R) に入るかを考えます。図は 1 つの例で、正方形を A でうつし、続けて B でうつしたものです（赤は 1 列目、緑は 2 列目の矢印。det A = det B = 1 で、面積も向きもかわりません）。SL(2, R) が GL(2, R) の部分群になる理由として正しいものはどれですか。"
