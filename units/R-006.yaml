      - part: わけ
        id: "1b872809af"
        text: SU(n) が SL(n, C) の部分群になるわけを説明しましょう。図は、U(n) と SL(n, C) を、集合として重ねたものです。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="125" cy="100" r="62" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><circle cx="195" cy="100" r="62" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="2"/><text x="92" y="105" font-size="15" text-anchor="middle" fill="currentColor">U(n)</text><text x="224" y="105" font-size="14" text-anchor="middle" fill="currentColor">SL(n, C)</text><text x="160" y="105" font-size="14" text-anchor="middle" fill="currentColor" font-weight="bold">SU(n)</text><text x="160" y="190" font-size="13" text-anchor="middle" fill="currentColor">重なった部分は、何を表すでしょう</text></svg>'
        explain: "「次の 3 つを確かめる。\n① 単位元：I†I = I、det I = 1 なので、I は SU(n) に入る。\n② 積：U、V が SU(n) に入れば、(UV)†(UV) = V†U†UV = V†V = I、det(UV) = det U · det V = 1 なので、UV も入る。\n③ 逆元：U⁻¹ = U† で、(U†)†U† = UU† = I、det(U⁻¹) = 1/det U = 1 なので、U⁻¹ も入る。\nだから SU(n) は、SL(n, C) の中で単位元をふくみ、積と逆元でとじていて、SL(n, C) の部分群である。」と書ければよい。\nSU(n) = U(n) ∩ SL(n, C) で、どちらも GL(n, C) の部分群なので、部分群どうしの共通部分は部分群である、と言ってもよい。\nU†U = I の両辺の行列式から |det U| = 1 が出るが、これは U(n) の行列の行列式が円の上にあることを言うだけで、部分群であることのわけにはならない。子どもには、U(1) でたしかめさせます。"
        hints:
          - U†U=I の両辺の行列式をとります。det(U†) は det U のふくそきょうやくです。
          - text: det U は、ふくそすうの平面で、原点からきょり 1 の円の上にあります（図）。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="26.3" y1="108" x2="186.7" y2="108" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="193.7,108 186.7,111.5 186.7,104.5" fill="currentColor"/><line x1="110" y1="185.5" x2="110" y2="37.5" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="110,30.5 113.5,37.5 106.5,37.5" fill="currentColor"/><circle cx="110" cy="108" r="62" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="160.8" cy="72.4" r="5" fill="#f08080"/><circle cx="62.5" cy="68.1" r="5" fill="#f08080"/><circle cx="88.8" cy="166.3" r="5" fill="#f08080"/><circle cx="141" cy="161.7" r="5" fill="#f08080"/><text x="262" y="96" font-size="15" text-anchor="middle" fill="currentColor">det U は</text><text x="262" y="118" font-size="15" text-anchor="middle" fill="currentColor">円の上の数</text></svg>'
          - SU(n) は、さらに det U = 1 にかぎります。部分群と言うには、単位元 I が入ることと、かけ算とぎゃくぎょうれつでとじていることも、たしかめます（R-001）。
        paths:
          - ["I が入る", "UV も入る：(UV)†(UV) = I、det(UV) = 1", "U⁻¹ = U† も入る", "SL(n, C) の部分群"]
          - ["SU(n) = U(n) ∩ SL(n, C)", "どちらも GL(n, C) の部分群", "部分群どうしの共通部分は部分群"]
