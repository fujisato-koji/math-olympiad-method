  - day: 8
    items:
      - part: 見本
        id: "cbe1c331f2"
        text: "ひょうげんは、群のようそをベクトル空間のせんけいへんかん（行列）として表すことです。群 G から GL(V) への準同型 ρ を、G のひょうげんといいます。\n図は、4 回回転の群 {e, r, r², r³} の、平面でのひょうげんです。ρ(g) は、その回転を表す行列です。\nρ(g) のトレース（対角成分の和）を、指標 χ(g) = Tr ρ(g) といいます。ひょうげんの次元は V の次元で、単位元の指標は次元に等しくなります（図では χ(e) = 2）。\n自明なひょうげん：すべての g を 1 にたいおうさせます。指標はいつも 1 です。"
