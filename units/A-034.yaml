        text: 2(cos 300° + i sin 300°) を a + bi の形で表したものはどれですか。
        choices: [1 − √3 i, 1 + √3 i, √3 − i, −1 − √3 i]
        answer: 1 − √3 i
        check: "[c for c, v in {'1 − √3 i': 1 - math.sqrt(3) * 1j, '1 + √3 i': 1 + math.sqrt(3) * 1j, '√3 − i': math.sqrt(3) - 1j, '−1 − √3 i': -1 - math.sqrt(3) * 1j}.items() if abs(v - 2 * (math.cos(math.radians(300)) + 1j * math.sin(math.radians(300)))) < 1e-9][0]"
        hints:
          - cos 300° と sin 300° の値を求めましょう（G-025）。
          - 300° = 360° − 60° です。
          - cos 300° = 1/2、sin 300° = −(√3)/2 です。
        paths:
          - [2(1/2 − ((√3)/2)i), 1 − √3 i]
      - part: 挑戦
        text: 複素数 √3 − i の偏角はどれですか。偏角は 0° 以上 360° 未満で答えます。
        choices: [330°, 30°, 150°, 210°]
        answer: 330°
        check: "[c for c, t in {'330°': 330, '30°': 30, '150°': 150, '210°': 210}.items() if abs(2 * (math.cos(math.radians(t)) + 1j * math.sin(math.radians(t))) - (math.sqrt(3) - 1j)) < 1e-9][0]"
        hints:
          - 絶対値は 2 です。
          - cos θ = (√3)/2、sin θ = −1/2 となる θ をさがしましょう。
          - 点 (√3, −1) は第 4 象限にあります。
        paths:
          - [絶対値は 2, cos θ = (√3)/2、sin θ = −1/2, 第 4 象限なので θ = 330°]
        note: 30° としやすい。虚部が負なので、点は実軸の下にある。−30° と答えたら、0° 以上 360° 未満では 330° になると話す。

