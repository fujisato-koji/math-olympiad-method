# A-034 複素数の極形式と 1 の累乗根（ド・モアブル）
#
# 書き方は N-001 の頭の注のとおり。段 5 の決まりは A-019 の頭の注と同じ（思い出す 2・今日 2・挑戦 1、わけの深さ ③、各日に予備 3 問）。
#   練習の日は新しい決まりが出るので頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 8 問にした。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：複素数平面（実軸、虚軸）、絶対値 |z| = √(a² + b²)、2 点の距離 |z − w|、偏角、極形式 r(cos θ + i sin θ)。
#   2 日目：積と商（絶対値はかけ算・わり算、偏角はたし算・ひき算。加法定理から）、原点のまわりの回転（i をかけると 90°）。
#   3 日目：ド・モアブルの定理、(1 + i)ⁿ のような累乗、1 の n 乗根（単位円に内接する正 n 角形）、zⁿ = a の形。
#   4 日目：わけ（3 問とも ③：積の公式を加法定理から、ド・モアブルを数学的帰納法で、ω² + ω + 1 = 0）。
#   5 日目：A-021、G-025 と混ぜる（ω の計算、正三角形の頂点、実数になる累乗、回転）。6 日目：確認。
# 前提は G-025（三角関数と加法定理）、A-021（複素数の計算）、L-012（数学的帰納法の入口）、A-009（累乗）。
#   たどると G-024（三角比）、G-026（座標と距離）、G-019（三平方の定理）、A-017、A-016 まで使える。
#   G-025 のファイルは同時に作られていて読めなかったので、題と G-024 の頭の注（「単位円と一般角、弧度法は G-025 で扱う」）から、
#   一般角の三角関数（0° 以上 360° 未満の角と負の角）と加法定理が済んでいるものとした。角はすべて度で書き、弧度法（π）は使わない
#   （G-025 が弧度法を扱うなら、言いかえの問題を足してよい）。2 倍角・3 倍角の公式は使わない。
#   偏角は「0° 以上 360° 未満」で答える約束にした（−15° のような角は見本で 345° と同じと話すだけ）。
#   複素数平面での図形（三角形の形、回転の中心が原点でない回転、軌跡）は、正三角形の頂点の 1 問を除いて扱わない（後の単元）。
# 「√3/2」は画面で 3/2 だけが上下に重なるので、複素数は (−1 + √3 i)/2、実数は (√3)/2 のように書く（G-024 と同じ）。
# 角、√ をふくむ値、複素数、極形式は choices。打つ答えは、絶対値、実部、虚部、個数、実数の値（整数と分数）。
#   check は Python の複素数と math.cos、math.sin（math.radians で度を変換）で計算し、選択肢の値との差の絶対値が 1e-9（累乗は 1e-6）より
#   小さいものを選ぶ。打つ値は、計算した数に近い整数や分数（math.isclose）を選ぶ。
# 図は svg（D-040）。複素数平面は方眼と目もりつきで、横の軸を「実軸」、縦の軸を「虚軸」とした。答えの点や角の値は図に書かない。
# 極形式と 1 の累乗根は、多項式の根の配置（A-036）、円分多項式と整数論（N の流れ）、交流回路と信号の周波数解析、高速フーリエ変換、
#   量子計算の位相（K の流れ）につながる（D-026）。

