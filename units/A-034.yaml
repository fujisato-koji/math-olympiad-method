      - part: わけ
        text: z = r(cos α + i sin α)、w = s(cos β + i sin β)（r、s は正の数）のとき、zw = rs(cos(α + β) + i sin(α + β)) が成り立ちます。このわけを、筋道を立てて書きましょう。
        explain: 例：「z = r(cos α + i sin α)、w = s(cos β + i sin β) とする（r、s は正の数）。zw = rs(cos α + i sin α)(cos β + i sin β) を展開すると、rs(cos α cos β + i cos α sin β + i sin α cos β + i² sin α sin β) である。i² = −1 なので、zw = rs((cos α cos β − sin α sin β) + i(sin α cos β + cos α sin β)) となる。加法定理（G-025）より、cos α cos β − sin α sin β = cos(α + β)、sin α cos β + cos α sin β = sin(α + β) なので、zw = rs(cos(α + β) + i sin(α + β)) である。」と書ければよい。①「〜とする」で z、w を極形式で決める、② 展開して i² = −1 を使い、実部と虚部に分ける、③ 約束した事実（加法定理）で結ぶ、の 3 つがそろっているかを見る。cos の加法定理の符号（cos α cos β − sin α sin β の「−」）を取りちがえやすい。rs が正の数なので、これは絶対値 rs、偏角 α + β の極形式であり、「絶対値はかけ算、偏角はたし算」の決まりになる、と話す。商は、w × (z/w) = z にこの決まりを使えば出てくる。
        hints:
          - z と w を極形式で書いて、積を展開しましょう。
          - i² = −1 を使って、実部と虚部に分けましょう。
          - 実部と虚部を、加法定理（G-025）の形と見くらべましょう。
        paths:
          - [z、w を極形式で書く, 展開して実部は rs(cos α cos β − sin α sin β)、虚部は rs(sin α cos β + cos α sin β), 加法定理から rs(cos(α + β) + i sin(α + β))]
      - part: わけ
        text: どんな自然数 n でも、(cos θ + i sin θ)ⁿ = cos nθ + i sin nθ が成り立ちます（ド・モアブルの定理）。このわけを、数学的帰納法で筋道を立てて書きましょう。
        explain: 例：「はじめ：n = 1 のとき、両辺とも cos θ + i sin θ で、成り立つ。つぎへ：n = k のとき成り立つ、つまり (cos θ + i sin θ)ᵏ = cos kθ + i sin kθ とする。このとき (cos θ + i sin θ)ᵏ⁺¹ = (cos θ + i sin θ)ᵏ × (cos θ + i sin θ)（A-009）= (cos kθ + i sin kθ)(cos θ + i sin θ) である。前の問題の積の決まり（r = s = 1）から、これは cos(kθ + θ) + i sin(kθ + θ) = cos (k + 1)θ + i sin (k + 1)θ となり、n = k + 1 のときも成り立つ。はじめとつぎへが示せたので、数学的帰納法（L-012）により、すべての自然数 n で成り立つ。」と書ければよい。①「〜とする」で n = k のときを仮定する、② 指数法則で 1 つ分け、仮定と積の決まりで式を変形する、③ 約束した事実（数学的帰納法の 2 つの段）で結ぶ、の 3 つがそろっているかを見る。「つぎへ」で、n = k のときの式（仮定）をどこで使ったかを言えるかを見る。n = 2、3 で確かめただけで終わっていたら、例ではすべての n を示せないことを話す。
        hints:
          - 「はじめ」として、n = 1 のときを確かめましょう。
          - 「つぎへ」として、n = k のとき成り立つとして、(cos θ + i sin θ)ᵏ⁺¹ を 2 つの積に分けましょう。
          - 積の決まり（前の問題）を使いましょう。
        paths:
          - [n = 1 のとき成り立つ, n = k のとき成り立つとする, (cos θ + i sin θ)ᵏ⁺¹ = (cos kθ + i sin kθ)(cos θ + i sin θ), 積の決まりで cos (k + 1)θ + i sin (k + 1)θ となり n = k + 1 でも成り立つ]
      - part: わけ
        text: ω を、1 の 3 乗根のうち 1 でないものとします。このとき、ω² + ω + 1 = 0 が成り立ちます。このわけを、筋道を立てて書きましょう。
        explain: 例：「ω は 1 の 3 乗根なので、ω³ = 1、つまり ω³ − 1 = 0 である。(ω − 1)(ω² + ω + 1) を展開すると ω³ + ω² + ω − ω² − ω − 1 = ω³ − 1 なので、(ω − 1)(ω² + ω + 1) = 0 である。ω は 1 でないので ω − 1 は 0 でない。0 でない数でわってよいので（A-021）、両辺を ω − 1 でわると ω² + ω + 1 = 0 である。」と書ければよい。①「〜とする」で ω の条件（ω³ = 1、ω は 1 でない）を置く、② ω³ − 1 を (ω − 1)(ω² + ω + 1) と因数分解する（展開で確かめる）、③ 約束した事実（AB = 0 で A が 0 でなければ B = 0、A-017）で結ぶ、の 3 つがそろっているかを見る。ω = (−1 + √3 i)/2 を代入して確かめるだけで終わっていたら、もう 1 つの (−1 − √3 i)/2 でも成り立つことを、この筋道なら一度に示せると話す。1 + ω + ω² = 0 は、単位円に内接する正三角形の 3 つの頂点の和が 0（重心が原点）であることも表している。
        hints:
