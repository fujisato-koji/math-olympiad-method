        explain: 複素数 z = a + bi（a、b は実数）を、座標平面の点 (a, b) で表します。この平面を複素数平面といい、横の軸を実軸、縦の軸を虚軸といいます。実数は実軸の上に、純虚数は虚軸の上にあります。原点 O と点 z の距離を z の絶対値といい、|z| と書きます。三平方の定理（G-019）から |a + bi| = √(a² + b²) です。また、z が 0 でないとき、実軸の正の向きから線分 Oz まで、反時計回りに測った角を z の偏角といいます（ここでは 0° 以上 360° 未満で答えます）。|z| = r、偏角を θ とすると、z の実部は r cos θ、虚部は r sin θ なので（G-025 の三角関数）、z = r(cos θ + i sin θ) と書けます。これを z の極形式といいます。1 + √3 i は、絶対値が √(1 + 3) = 2 で、cos θ = 1/2、sin θ = (√3)/2 から θ = 60° なので、1 + √3 i = 2(cos 60° + i sin 60°) です。−2 + 2i は、絶対値が √(4 + 4) = 2√2、偏角が 135° で、−2 + 2i = 2√2(cos 135° + i sin 135°) です。2 つの複素数 z、w の点の距離は |z − w| です。a + bi と共役な複素数 a − bi は、実軸について対称な点になります。
      - part: 思い出す
        text: (2 + i)(2 − i) の値はいくつですか。
        answer: 5
        check: "Fraction(((2 + 1j) * (2 - 1j)).real)"
        hints:
          - 共役な複素数どうしの積です（A-021）。
          - (a + bi)(a − bi) = a² + b² です。
          - 2² + 1² を計算しましょう。
        paths:
          - [4 − i², 4 + 1, 5]
      - part: 思い出す
        text: cos 120° の値はいくつですか。
        answer: −1/2
        accept: [−0.5]
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')([Fraction(k, 2) for k in range(-4, 5) if math.isclose(math.cos(math.radians(120)), k / 2)][0])"
        hints:
          - 単位円の上で、120° の点を考えましょう（G-025）。
          - 120° = 180° − 60° です。
          - 点は y 軸の左側にあるので、cos は負の数です。
        paths:
          - [cos 120° = −cos 60°, −1/2]
      - part: 今日
        text: 複素数 −6 + 8i の絶対値はいくつですか。
        answer: 10
        check: "[k for k in range(0, 100) if math.isclose(abs(-6 + 8j), k)][0]"
        hints:
          - "|a + bi| = √(a² + b²) です。"
          - (−6)² + 8² を計算しましょう。
          - 2 乗すると 100 になる正の数をさがしましょう。
        paths:
          - [√((−6)² + 8²), √100, 10]
      - part: 今日
        text: −1 + i を極形式で表したものはどれですか。
        choices: [√2(cos 135° + i sin 135°), √2(cos 45° + i sin 45°), 2(cos 135° + i sin 135°), √2(cos 225° + i sin 225°)]
        answer: √2(cos 135° + i sin 135°)
        check: "[c for c, (r, t) in {'√2(cos 135° + i sin 135°)': (math.sqrt(2), 135), '√2(cos 45° + i sin 45°)': (math.sqrt(2), 45), '2(cos 135° + i sin 135°)': (2, 135), '√2(cos 225° + i sin 225°)': (math.sqrt(2), 225)}.items() if abs(r * (math.cos(math.radians(t)) + 1j * math.sin(math.radians(t))) - (-1 + 1j)) < 1e-9][0]"
        hints:
          - まず、絶対値 √((−1)² + 1²) を求めましょう。
          - 点 (−1, 1) は、第何象限にあるでしょう。
          - 実軸の正の向きから反時計回りに、何度回ると点の向きになるでしょう。
        paths:
          - ["絶対値は √2", "点 (−1, 1) は第 2 象限で 偏角は 135°", "√2(cos 135° + i sin 135°)"]
        note: 偏角を 45° としやすい。点の位置を図にかかせて、象限から角を決めさせる。
      - part: 挑戦
        text: 複素数平面の 2 点 1 + 2i と 4 − 2i の距離はいくつですか。
        answer: 5
        check: "[k for k in range(0, 100) if math.isclose(abs((4 - 2j) - (1 + 2j)), k)][0]"
        hints:
          - 2 点 z、w の距離は |z − w| です。
          - (4 − 2i) − (1 + 2i) を計算しましょう。
          - その複素数の絶対値を求めましょう。
        paths:
          - [(4 − 2i) − (1 + 2i) = 3 − 4i, "|3 − 4i| = √(9 + 16)", 5]
          - ["\"点 (1, 2) と (4, −2) の距離を三平方の定理で求める\"", "√(3² + 4²) = 5"]
