      - part: 見本
        text: かずの せんです。□に はいる かずは なにかな。
        figure: "0─1─2─□─4─5"
        explain: ひだりの はしが 0 です。0 は なにも ない ときの かずです。みぎへ ひとつ すすむごとに、かずが 1 ずつ おおきく なります。2 の つぎだから、□は 3 です。
      - part: 思い出す
        text: ほしは いくつ ありますか。
        figure: "⭐⭐⭐⭐⭐\n⭐⭐"
        answer: 7
        check: "n('⭐')"
        hints:
          - うえの ならびから かぞえよう。
          - したの ならびに つづけて かぞえよう。
          - うえは 5 こ。したは 6 から かぞえはじめるよ。
