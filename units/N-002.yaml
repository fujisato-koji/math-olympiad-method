# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 道筋]
    text: 🐸 は ある かずの ところに いました。みぎへ 4 つ すすんで、それから ひだりへ 6 つ もどったら、🏁 に つきました。🐸 は はじめ どこに いましたか。
    figure: "0─1─2─🏁─4─5─6─7─8─9─10"
    answer: 5
    check: "Fraction(fig.split('─')[0]) + fig.split('─').index('🏁') + 6 - 4"
    hints:
      - おわりの 🏁 から、はじめに むかって もどって みよう。
      - さいごに ひだりへ 6 つ もどったのだから、🏁 から みぎへ 6 つ すすむと どこかな。
      - そこから こんどは、ひだりへ 4 つ もどろう。
    paths:
      - [🏁 は 3, 3 から みぎへ 6 で 9, 9 から ひだりへ 4 で もどる, 5]
      - [はじめの ばしょを きめて ためす, 5 から みぎへ 4 で 9、ひだりへ 6 で 3, 🏁 に つくので 5]
    note: 後ろから逆にたどる問題。逆にたどると「左へもどった」は「右へ進む」に変わることに気づくのが要点。2 本目のように、はじめの位置を決めて試し、合わなければ動かすのもよい道。
  - part: 離
    kinds: [読み取り, 手数]
    text: 🐰 は 4 に います。🐸 は 🐰 より 4 つ みぎに います。🐻 は 🐸 より 6 つ ひだりに います。🐻 と 🐸 の ちょうど まんなかに ある かずは なんですか。
    figure: "0─1─2─3─🐰─5─6─7─8─9─10"
    answer: 5
    check: "(lambda r: (r + 4 + r + 4 - 6) // 2)(fig.split('─').index('🐰'))"
    hints:
      - まず 🐸 が どこに いるか、🐰 から ゆびで かぞえよう。
      - つぎに 🐸 から ひだりへ 6 つ もどって、🐻 の ところを みつけよう。
      - 🐻 と 🐸 から 1 つずつ ちかづいて、であう ところを さがそう。
    paths:
      - [🐸 は 4 から みぎへ 4 で 8, 🐻 は 8 から ひだりへ 6 で 2, 2 と 8 から 1 つずつ ちかづく, 5]
    note: 3 つの文から順に位置を決める。🐻 を 🐰 から数えてしまう誤りが多いので、文ごとに「だれから数えるか」を指で確かめる。まんなかは 4 日目と同じく、両はしから 1 つずつ近づけて見つける。
