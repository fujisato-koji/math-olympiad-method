# N-002 数直線
#
# 書き方は N-001 の頭の注のとおり。
# 図の数直線は「─」で目もりを区切る。check の fig.split('─') は目もりを左から並べたもの、
# Fraction(fig.split('─')[0]) は左はしの数（0 から始まらない線にも使える）。
# 🐸 や 🐰 は今いる所、🏁 は着く所、□ は入る数をたずねる所。

