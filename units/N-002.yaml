# N-002 数直線
#
# 段 1・水準 1・5 日。かずの せんに かずを ならべる、みぎへ すすむと ふえ ひだりへ もどると へる、いくつ すすんだか もどったか、N-001 と まぜる、5 日目は ぜんぶの たしかめ。
# 書き方は N-001 の頭の注のとおり。子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる（D-129〜D-131）。
# 図は svg。かずの せんは、よこの せんに めもりを うち、めもりの したに かずを かく。みぎはしの やじるしは「みぎへ いくほど おおきい」。
#   ひだりはしの てんせんは「とちゅうから かいた せん（ひだりへ つづく）」。きいろの しかく □ は はいる かずを たずねる ところ、てんせんの まるの ？ は かくれた かず。
#   🐸 🐰 🐻 は いまいる ところ（したの さんかくが めもりを さす）、🏁 は つく ところ。うすい どうぶつは「とちゅうで いた ところ」。
#   だいだいいろの ゆみなりの やじるしは「1 つ とぶ」。なかの きいろの まるの 1、2… は とんだ じゅんで、ヒントでは とちゅうまでに する。
#   むらさきの わは「見る ところ」。かずの したの きいろの まると したの やじるしは「ここまで よんだ」。
#   ● の はしら（見本・わけ）は、その かずだけ ● を つむ（みぎへ 1 つ いくと 1 こ ふえる）。
# まえは かずの せんを もじの 図（figure）で かいていたが、svg に かきかえた（2026-11-13）。check は もんだいの かずから けいさんする しきに した。
# 「3 から 8 まで」のように 図の ない もんだいは、かみに せんを かいて とく れんしゅうなので 図を つけず、ヒントに かく せんの 図を つけた。

