# G-022 作図（定規とコンパス）
#
# 書き方は N-001 の頭の注のとおり。
# 作図は、定規とコンパスだけで図をかくこと。定規は直線をひくだけに使い（目もりで長さを測らない）、
#   コンパスは円や弧をかくことと、長さを写すことに使う。分度器は使わない。
# 柱は 3 つの基本の作図：① 線分の垂直二等分線　② 角の二等分線　③ 垂線（直線の上の点を通る垂線は 180° の角の二等分線、
#   直線の外の点 P からの垂線は、P を中心にかいた弧と直線の 2 つの交点を結ぶ線分の垂直二等分線）。
#   組み合わせて、正三角形の 60°、2 等分の 30°・15°、垂線の 90°・45°、その和と差の角をつくる。
# 点の集まりの見方（のちの軌跡）：2 点から等しい距離の点は垂直二等分線の上、角の 2 辺から等しい距離の点は角の二等分線の上、
#   1 点から決まった距離の点は円の上。2 つの条件を満たす点は 2 つの線の交点として作図する（交わる点の数を、距離をくらべて数える）。
# 前提は G-017（二等辺三角形の頂角の二等分線は底辺を垂直に 2 等分する、ひし形の対角線、直角三角形の合同条件）と、
#   その前の G-016（合同条件、平行線と同位角、外角）。
#   円（G-010）は前提にないので、円は「中心から同じ距離にある点の集まり」としてだけ使い、円周や面積は使わない。
#   3 点から等しい距離の点（2 本の垂直二等分線の交点）は 1 日目の挑戦と 4 日目の挑戦で作図だけを扱う。
#   名前（外心）と、3 本目の垂直二等分線も同じ点を通ることは G-028 で扱う。
#   円の接線の作図は、接線と半径の関係を G-023 で扱うので、ここでは扱わない。
# 長さの答えは cm の数、角の答えは度の数を打つ。半分の長さは小数で答え、分数も正しいとする（accept）。
# 図は svg（D-040）。作図の弧は細い線でかいた。点線は、ひいた補助の線。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 垂直二等分線と「2 点から等しい距離」　2 日目 角の二等分線と垂線、60° と 90° からつくる角
#   3 日目 わけ（垂直二等分線と角の二等分線の作図が正しいわけ、垂直二等分線の上の点が両はしから等しい距離にあるわけ）
#   4 日目 G-016・G-017（平行線、二等辺三角形、ひし形、外角）と混ぜる　5 日目 確認
# check：長さと角の計算の式。交わる点の数は、距離と線分の半分をくらべる式。
#   作図の手順や性質を選ぶ問題は約束ごとなので check を付けない。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-010 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

