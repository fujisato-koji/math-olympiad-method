          - 合同が言えたら、どの角とどの角が等しいかな。
        paths:
          - [OP = OQ（O を中心の弧）, PR = QR（同じ半径の弧）, OR は共通, △OPR ≡ △OQR（3 辺）, ∠POR = ∠QOR]
