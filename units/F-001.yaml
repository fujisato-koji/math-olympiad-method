# F-001 収入・支出と残高
#
# 水準 2・4 日。入るお金（収入）、出るお金（支出）、のこり（残高）と、それを日のじゅんに 1 行ずつ書くこづかい帳を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 入るお金・出るお金・のこり（さいふの絵）、2 日目 こづかいちょう（1 行ずつのこりを出す、
#   できごとを正しいらんに書く）、3 日目 わけ（いちばん下ののこりは、いまのさいふのお金と同じになる。ちがえば書きわすれか計算のまちがい）、4 日目 確認。
# 子の文では「収入・支出・残高・帳」の字を使わず、入る お金・出る お金・のこり・こづかいちょう と書く（おとなのことばは explain にだけ書いた）。
# 前提は N-060（お金の計算）と、その前の N-007（2 けたのたし算・ひき算）。金額は N-060 にそろえて 100 円までにし、かけ算（N-013）は子に使わせない（check は * で書く）。
# 図の約束：さいふは紫。お金は丸に数（10 円玉は茶、50 円玉と 100 円玉は灰）。ねだんは黄色のふだ。みどりのやじるしは入るお金、あかいやじるしは出るお金。
#   こづかいちょうは「日・なにの お金・入った・出た・のこり」の 5 つのらんで、入ったのらんはみどり、出たのらんはあかにうすくぬる。
#   ? の点線の四角はたずねるところ、? のない点線の四角はまだ書いていないところ。
# 腕だめし（離）は、4 つの絵を順に読むもの（読み取り）と、さいふのお金から下のぎょうへもどって本のねだんを出すもの（道筋）。
# 値段は計算のための数で、実際の店の値段に合わせていない。

