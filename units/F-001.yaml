        explain: |-
          お金の うごきを 3 つに 分けて 見る 日です。入る お金（おとなの ことばで しゅうにゅう）、出る お金（ししゅつ）、のこり（ざんだか）。入ると のこりは ふえ、出ると のこりは へります。
          きょうは 1 つか 2 つの できごとの あとの のこりを、2 けたの たし算・ひき算で 出します。10 円玉は 10 ずつ、50 円玉・100 円玉は その 数から かぞえます。おうちの 10 円玉と さいふで、もらう・はらうを じっさいに やって みると よい。
