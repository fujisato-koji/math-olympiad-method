        text: |-
          おてつだいを して お金を もらうと、さいふに お金が 入ります。これが「入る お金」です。
          かいものを すると、さいふから お金が 出て いきます。これが「出る お金」です。
          さいふの 中に のこって いる お金を「のこり」と いいます。
          えでは、入る お金を みどりの やじるし、出る お金を あかい やじるしで かきます。
