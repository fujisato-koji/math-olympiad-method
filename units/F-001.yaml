          「さいふの お金が かわるのは、お金が 入る ときと 出る ときだけ。その たびに こづかいちょうに 1 ぎょう 書いて、入れば のこりに たし、出れば のこりから ひく。さいふと ちょうの のこりは、おなじ 数から はじまって、いつも おなじ だけ ふえたり へったり するので、いちばん 下の のこりは さいふの お金と おなじに なる。」と 言えれば よい。
          ① さいふが かわるのは 入る・出る ときだけ、② ちょうにも その たびに 書いて、おなじ だけ たす・ひく、③ だから おなじ、の 3 つが 入って いれば よい。もし ちがって いたら、書きわすれか、けいさんの まちがいか、お金を おとしたかの どれかです。きょうの ほかの もんだいは、この ちがいから わけを さがします。おうちで つけた こづかいちょうと さいふを、ときどき くらべて みると よい。
