# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 道筋]
    uses: [C-002]
    text: 1 から 9 までの カードが 1 まいずつ あります。ちがう カードを 3 まい えらんで、かずを たします。こたえが 20 に なる えらびかたは、なんとおり ありますか。
    figure: "［1］［2］［3］［4］［5］［6］［7］［8］［9］"
    answer: 4
    check: "len([c for c in itertools.combinations(range(1, 10), 3) if sum(c) == 20])"
    hints:
      - いちばん おおきい カードを さきに きめてから かんがえよう。
      - 9 を えらぶと、のこりの 2 まいで いくつに すれば よいかな。
      - 9 を えらぶ とき、8 を えらぶ とき、7 を えらぶ とき、と じゅんに かきだそう。
    paths:
      - [いちばん おおきいのが 9 なら のこり 2 まいで 11, 3 と 8、4 と 7、5 と 6 の 3 とおり, いちばん おおきいのが 8 なら のこり 2 まいで 12 で 5 と 7 だけ, いちばん おおきいのが 7 だと 7 + 6 + 5 = 18 で とどかない, 4 とおり]
    note: 3 つの数のたし算（4 日目）と、もれなく書き出すこと（C-002）を合わせる。いちばん大きいカードを決めてから残りをさがすと、重なりと抜けが出ない。「9 と 8 と 3」と「3 と 8 と 9」を別に数える誤り、6 と 6 のように同じカードを 2 回使う誤りに気をつける。
  - part: 離
    kinds: [道筋, 手数]
    text: バスに なんにんか のって いました。1 つめの バスていで 5 にん おりて、8 にん のりました。2 つめの バスていで 9 にん おりて、いま 7 にん のって います。はじめに なんにん のって いましたか。
    answer: 13
    check: "7 + 9 - 8 + 5"
    hints:
      - いまの 7 にんから、じかんを もどして かんがえよう。
      - 2 つめの バスていで 9 にん おりる まえは、なんにん いたかな。
      - 8 にん のる まえ、5 にん おりる まえ、と じゅんに もどそう。
    paths:
      - [9 にん おりる まえは 7 + 9 = 16, 8 にん のる まえは 16 − 8 = 8, 5 にん おりる まえは 8 + 5, 13 にん]
    note: 後ろから逆にたどる。もどすときは「おりた」がたし算、「のった」がひき算に変わる。前から □ を置いて考えるのは A-002 の道具なので、ここでは逆にたどる道だけを示す。途中の 16 はくり上がり、16 − 8 はくり下がりの計算。
  - part: 離
    kinds: [数, 手数, 読み取り]
    text: こうえんに こどもが 13 にん、おとなが 7 にん いました。こどもが 5 にん かえり、おとなが 6 にん きました。その あと、こどもが 8 にん きました。いま、こどもは おとなより なんにん おおいですか。
    answer: 3
    check: "(13 - 5 + 8) - (7 + 6)"
    hints:
      - こどもと おとなを、べつべつに かんがえよう。
      - こどもは 13 にんから どう かわったかな。おとなは どう かわったかな。
      - いまの こどもと おとなの かずを くらべよう。
    paths:
      - [こどもは 13 − 5 = 8、8 + 8 = 16, おとなは 7 + 6 = 13, 16 と 13 を くらべる, 3 にん]
    note: 子どもと大人の出入りがまざって書かれているので、文ごとにどちらの数が変わるかを確かめる。大人が来たのを子どもにたしてしまう誤りが多い。「こども」「おとな」の 2 列の表にして書き分けるとよい。
