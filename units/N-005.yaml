# 十の位・一の位の言葉は N-006 なので、ここでは「10 と いくつ」と言う。
# 図の 🔵 は 1 行に 10 こまで（上の行がいっぱいで 10）。⚪ は、たす数をあらわす。
# 地図の plan にわけの日がないので、練習の日（2・4 日目）と混ぜるの日（5 日目）にわけを 1 問ずつ置く。
# くり下がりのひき算は「10 からひく」を 1 本目の道、「ひいてひく」（15 − 5 − 2）を 2 本目の道にする。

