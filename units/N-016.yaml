        explain: 例：「テープを 1 本ずつ 3 等分すると、1 人は 1 本から 1/3 本ずつもらう。テープは 2 本あるので、1 人分は 1/3 本の 2 つ分で 2/3 本。だから 2 ÷ 3 = 2/3。」と書ければよい。別の書き方で「2 本を 3 等分ずつに切ると 1/3 本が 6 こ。6 こを 3 人で分けると 1 人 2 こ。1/3 本が 2 こで 2/3 本。」でもよい。2 ÷ 3 の答えを 3/2 と書いていたら、1 人分は 1 本より多いか少ないかをたずねる。
        hints:
          - 1 本のテープを 3 人で分けると、1 人分は何本かな。
          - テープが 2 本あると、1 人は何回もらえるかな。
          - 「1 本ずつ 3 等分すると〜。だから〜。」と書いてみよう。
        paths:
          - [1 本を 3 等分すると 1 人 1/3 本, 2 本あるので 2 回もらう, 1/3 本の 2 つ分で 2/3 本]
