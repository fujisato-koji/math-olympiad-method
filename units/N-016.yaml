# N-016 分数の意味（わる、分ける）
#
# 書き方は N-001 の頭の注のとおり。
# 前提は N-014（わり算とあまり）まで。わり算は九九を 1 回使う形（商は 1 けた）と、そのあまりに収めた。
# テープの図は 1 行が 1 まい（1 本）を同じ大きさに分けたもの。🟦 は色をぬったところ、⬜ はぬっていないところ。
#   check は Fraction(n('🟦'), n('🟦') + n('⬜'))。Fraction は約分するので、答えが約分できる図は使っていない（約分は N-019）。
# 数直線は N-002 と同じく「─」で目もりを区切る。・は数の書いていない目もり。□ の分数は Fraction(□の位置, 1 の位置)。
# 分数は 3/4 の形で書き、見本で「4 分の 3」と読むこと、/ の右が分母、左が分子であることを話す。
# 大きさの等しい分数（1/2 = 2/4）、分母のちがう分数の大小、分数のたし算とひき算は N-019 で扱うので、ここでは出さない。
#   くらべるのは、分母が同じ分数と、分子が 1 の分数（と、分子が同じ分数を 1 問だけ）。
# 帯分数の書き方も N-019 にまわし、ここでは「17/5 は 1 が 3 こと 1/5 が 2 こ」と、わり算のあまりにつなげて言うだけにした。
# 日の並び（既定）：1 日目 分ける（等分と、1/□ のいくつ分）、2 日目 数直線と 1 より大きい分数、
#   3 日目 わる（a ÷ b = a/b）と「□ の 3/4 は いくつ」、4 日目 わけ、5 日目 N-014 と混ぜる、6 日目 確認。

id: N-016
days:
  - day: 1
    items:
      - part: 見本
        text: 1 本のテープを、同じ長さに 5 つに分けました。色をぬったところは、テープ全体の何分のいくつですか。
        figure: 🟦🟦🟦⬜⬜
        explain: 同じ長さに 5 つに分けることを「5 等分する」といいます。5 等分した 1 つ分を 1/5 と書き、「5 分の 1」と読みます。色をぬったところは 1/5 の 3 つ分なので、3/5（5 分の 3）です。/ の右の 5 を分母（いくつに分けたか）、左の 3 を分子（そのいくつ分か）といいます。ノートには、横の線の下に 5、上に 3 と書きます。
      - part: 思い出す
        text: 18 ÷ 3 はいくつですか。
        answer: 6
        check: "18 // 3"
        hints:
          - 18 こを 3 人で同じ数ずつ分ける、と考えよう。
          - 3 の段の九九で、答えが 18 になるのはどれかな。
          - 3 × □ = 18 の □ をさがそう。
        paths:
          - [3 × □ = 18 をさがす, 3 × 6 = 18, 6]
      - part: 思い出す
        text: 20 このあめを、6 人で同じ数ずつ分けます。あめは何こあまりますか。
        answer: 2
        check: "20 % 6"
        hints:
          - 1 人に何こずつ分けられるかを先に考えよう。
          - 6 の段の九九で、20 をこえない いちばん大きい答えはどれかな。
          - 20 から、その数をひいてみよう。
        paths:
          - [6 × 3 = 18 で 20 をこえない, 1 人 3 こずつ, 20 − 18 = 2, 2 こ]
        note: 6 × 4 = 24 は 20 をこえるので使えない。あまりが 6 より小さいことも確かめさせる。
      - part: 今日
        text: 色をぬったところは、テープ全体の何分のいくつですか。
        figure: 🟦🟦⬜⬜⬜⬜⬜
        answer: 2/7
        check: "Fraction(n('🟦'), n('🟦') + n('⬜'))"
        hints:
          - テープは、ぜんぶでいくつに分かれているかな。
          - そのうち、色をぬったのはいくつかな。
          - 分けた数が分母、色をぬった数が分子だよ。
        paths:
          - [ぜんぶで 7 つに分けている, 色をぬったのは 2 つ, 1/7 の 2 つ分で 2/7]
        note: 色をぬったところとぬっていないところをくらべて 2/5 としやすい。分母は「ぜんぶでいくつに分けたか」だと確かめる。
      - part: 今日
        text: 1/6 の 5 つ分は、いくつですか。分数で答えましょう。
        answer: 5/6
        check: "Fraction(1, 6) * 5"
        hints:
          - 1/6 は、6 等分した 1 つ分だね。
          - その 5 つ分は、6 等分したうちのいくつかな。
          - 分母は 6 のまま、分子が 1 つ分から 5 つ分になるよ。
        paths:
          - [1/6 は 6 等分した 1 つ分, その 5 つ分, 5/6]
      - part: 今日
        text: 3/8 は、1/8 のいくつ分ですか。
        answer: 3
        check: "Fraction(3, 8) / Fraction(1, 8)"
        hints:
          - 3/8 は、8 等分したうちのいくつ分かな。
          - 1/8 は、8 等分した 1 つ分だね。
          - 分子を見てみよう。
        paths:
          - [3/8 は 8 等分した 3 つ分, 1/8 は 1 つ分, 3 つ分]
      - part: 挑戦
        text: 1 まいの紙を同じ大きさに分けて、色をぬりました。色をぬったところは、紙全体の何分のいくつですか。
        figure: "🟦🟦⬜⬜\n🟦⬜⬜⬜"
        answer: 3/8
        check: "Fraction(n('🟦'), n('🟦') + n('⬜'))"
        hints:
          - 紙は、上の列と下の列をあわせて、いくつに分かれているかな。
          - 色をぬったところも、上と下をあわせて数えよう。
          - 分けた数が分母、色をぬった数が分子だよ。
        paths:
          - [上 4 つと下 4 つで 8 等分, 色は上 2 つと下 1 つで 3 つ, 3/8]
        note: 上の列だけを見て 2/4 としやすい。1 まい全体がいくつに分かれているかを数えさせる。
    extra:
