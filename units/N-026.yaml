# N-026 分数の計算のくふう
#
# 書き方は N-001 の頭の注、分数の答えと check は N-019 の頭の注のとおり（答えは約分した形、1 より大きい答えは仮分数で打つ、
#   check は Fraction で計算する）。段 3 なので、子に見せる文は学年に合う漢字で書く。
# 前提は N-019（約分と通分）と N-018（公約数と公倍数）まで。数は 100 まで（N-009 は前提のたどりにない）。
#   分数 × 分数、分数のわり算、小数（N-020）は前提にないので使わない。分数 × 整数は N-019 の「同じ分数を何回かたす」まで。
# 前提に N-015（計算のきまり）がないので、( ) で先に計算するしるしは式に書かない。使うのは、たす順を入れかえても答えは同じ（N-003）と、
#   整数の部分と分数の部分を分けてたす（N-019 の 2 本目の道）まで。「先にたす組」は言葉で言う。
# くふうは 3 つ。どれも、通分すると分母が大きくなる計算を、通分しないか小さい分母ですませるためのもの。
#   1 日目 導入：たすと 1 になる組を先にたす（たす順を入れかえる）。
#   2 日目 練習：1 とのちがいで見る（7/8 と 8/9 の大小、1/2 + 1/4 + 1/8 … の足りない分）。
#   3 日目 練習：差に分ける（1/6 = 1/2 − 1/3）。分母がとなり合う数の積の分数の和を、数直線で進むはばの和として求める。
#   4 日目 わけ（代表の例で文に書く）、5 日目 N-019・N-018 と混ぜる（最小公倍数で通分、最大公約数で 1 回で約分）、6 日目 確認。
# 差に分けるとき「1/(2 × 3)」のような ( ) の書き方はせず、「分母が 2 × 3 = 6 の 1/6」と言う。どの数でも成り立つことを文字で示すのは段 4。
# 数直線の図は、止まる点を「─→」でつないだだけで、長さはそろえていない（はばの大きさは図から読ませない）。
# 地図では measure: true（算数オリンピックなどの計算のくふうのため）。

id: N-026
days:
  - day: 1
    items:
      - part: 見本
        text: 1/4 + 2/3 + 3/4 を、くふうして計算しましょう。
        explain: 1/4 と 3/4 は分母が同じで、分子をたすと分母と同じ 4 になるので、たすとちょうど 1 になります。たす順を入れかえても答えは同じなので、1/4 と 3/4 を先にたして 1、それに 2/3 をたして 1 と 2/3 です（仮分数では 5/3）。前から順に計算すると、1/4 + 2/3 = 3/12 + 8/12 = 11/12、11/12 + 3/4 = 11/12 + 9/12 = 20/12 = 5/3 となり、通分が 2 回と約分がいります。たすと 1 になる組を先に見つけるのが、くふうの 1 つめです。
      - part: 思い出す
        text: 5/6 + 1/4 を計算しましょう。答えは仮分数で打ちましょう。
        answer: 13/12
        check: "Fraction(5, 6) + Fraction(1, 4)"
        hints:
          - 分母がちがうので、通分しよう。
          - 6 の段の数で、4 でわり切れる いちばん小さい数はいくつかな。
          - 分母をそろえたら、分子をたそう。
        paths:
          - [分母を 12 にそろえる, 10/12 + 3/12, 13/12]
      - part: 思い出す
        text: 3/4 − 1/6 を計算しましょう。
        answer: 7/12
        check: "Fraction(3, 4) - Fraction(1, 6)"
        hints:
          - 分母がちがうので、通分しよう。
          - 4 の段の数で、6 でわり切れる いちばん小さい数はいくつかな。
          - 分母をそろえたら、分子をひこう。
        paths:
          - [分母を 12 にそろえる, 9/12 − 2/12, 7/12]
      - part: 今日
        text: 2/5 + 1/3 + 3/5 を、くふうして計算しましょう。答えは仮分数で打ちましょう。
        answer: 4/3
        check: "Fraction(2, 5) + Fraction(1, 3) + Fraction(3, 5)"
        hints:
          - 分母が同じ分数をさがそう。
          - 2/5 と 3/5 をたすと、いくつになるかな。
          - たす順を入れかえて、その組を先にたそう。
        paths:
          - [2/5 と 3/5 を先にたして 1, 1 + 1/3 = 1 と 1/3, 仮分数で 4/3]
          - [前から通分して 6/15 + 5/15 = 11/15, 11/15 + 9/15 = 20/15, 約分して 4/3]
        note: 前から通分してもできるが手間がかかる。1 と 1/3 と言えたら、仮分数になおして打つ。
      - part: 今日
        text: 3/7 + 5/8 + 4/7 + 3/8 を、くふうして計算しましょう。
        answer: 2
        check: "Fraction(3, 7) + Fraction(5, 8) + Fraction(4, 7) + Fraction(3, 8)"
        hints:
          - 分母が同じ分数どうしを組にしよう。
          - 3/7 と 4/7、5/8 と 3/8 を、それぞれたそう。
          - 組ごとにたした数を合わせよう。
        paths:
          - [3/7 + 4/7 = 1, 5/8 + 3/8 = 1, 合わせて 2]
        note: 前から順に計算すると分母が 56 になる。分母が同じものを組にすれば通分がいらない。
      - part: 今日
        text: 1 と 1/6 + 2/9 + 5/6 を、くふうして計算しましょう。答えは仮分数で打ちましょう。
        answer: 20/9
        check: "1 + Fraction(1, 6) + Fraction(2, 9) + Fraction(5, 6)"
        hints:
          - 1 と 1/6 は、整数の 1 と分数の 1/6 を合わせた数だね。
          - 1/6 と 5/6 をたすと、いくつになるかな。
          - 整数の部分を合わせてから、2/9 をたそう。
        paths:
          - [1/6 + 5/6 = 1, 整数の部分の 1 と合わせて 2, 2 と 2/9 = 20/9]
        note: 整数の部分と分数の部分を分けてたすのは、N-019 の帯分数のたし算の 2 本目の道と同じ。2 と 2/9 は 18/9 + 2/9 で仮分数にする。
      - part: 挑戦
        text: 1/9 + 2/9 + 3/9 + 4/9 + 5/9 + 6/9 + 7/9 + 8/9 を、くふうして計算しましょう。
        answer: 4
        check: "sum(Fraction(k, 9) for k in range(1, 9))"
        hints:
          - たすと 1 になる組をさがそう。
          - いちばん小さい 1/9 と、いちばん大きい 8/9 をたしてみよう。
          - 1 になる組は、いくつできるかな。
        paths:
          - [1/9 と 8/9、2/9 と 7/9、3/9 と 6/9、4/9 と 5/9 で 4 組, どの組も 1, 合わせて 4]
          - [分子だけたすと 1 + 2 + … + 8 = 36, 36/9 = 4]
        note: はしとはしを組にすると、どの組も分子の和が 9 になる。分子の和を 9 でわる 2 本目の道もある。
    extra:
      - part: 今日
        text: 5/9 + 1/2 + 4/9 を、くふうして計算しましょう。答えは仮分数で打ちましょう。
        answer: 3/2
        check: "Fraction(5, 9) + Fraction(1, 2) + Fraction(4, 9)"
        hints:
          - 分母が同じ分数をさがそう。
          - 5/9 と 4/9 をたすと、いくつになるかな。
          - その数に 1/2 をたして、仮分数で打とう。
        paths:
          - [5/9 + 4/9 = 1, 1 + 1/2 = 1 と 1/2, 仮分数で 3/2]
      - part: 今日
        text: 2/3 + 3/4 + 1/3 + 1/4 を、くふうして計算しましょう。
        answer: 2
        check: "Fraction(2, 3) + Fraction(3, 4) + Fraction(1, 3) + Fraction(1, 4)"
        hints:
          - 分母が同じ分数どうしを組にしよう。
          - 2/3 と 1/3、3/4 と 1/4 を、それぞれたそう。
          - 組ごとにたした数を合わせよう。
        paths:
          - [2/3 + 1/3 = 1, 3/4 + 1/4 = 1, 合わせて 2]
      - part: 挑戦
        text: 1/11 + 2/11 + 3/11 + … + 10/11 を、くふうして計算しましょう。（分子が 1 から 10 までの、分母が 11 の分数を全部たします。）
        answer: 5
        check: "sum(Fraction(k, 11) for k in range(1, 11))"
        hints:
          - はしとはしを組にしてみよう。
          - 1/11 と 10/11 をたすと、いくつになるかな。
          - 1 になる組は、いくつできるかな。
        paths:
          - [1/11 と 10/11、2/11 と 9/11、… 5/11 と 6/11 で 5 組, どの組も 1, 合わせて 5]
          - [分子だけたすと 1 + 2 + … + 10 = 55, 55/11 = 5]

  - day: 2
    items:
      - part: 見本
        text: 7/8 と 8/9 では、どちらが大きいですか。通分しないでくらべましょう。
        explain: 7/8 は 1 より 1/8 小さく、8/9 は 1 より 1/9 小さい数です。1 を 9 こに分けた 1/9 は、8 こに分けた 1/8 より小さいので、1 からへった分が少ない 8/9 のほうが大きいとわかります。通分すると 63/72 と 64/72 で、同じ答えになります。「1 とのちがい」を見ると、大きな分母にそろえなくてもくらべられます。これがくふうの 2 つめです。
      - part: 思い出す
        text: 1/4 + 5/6 + 3/4 を、くふうして計算しましょう。答えは仮分数で打ちましょう。
        answer: 11/6
        check: "Fraction(1, 4) + Fraction(5, 6) + Fraction(3, 4)"
        hints:
          - 分母が同じ分数をさがそう。
          - 1/4 と 3/4 をたすと、いくつになるかな。
          - その数に 5/6 をたして、仮分数で打とう。
        paths:
          - [1/4 + 3/4 = 1, 1 + 5/6 = 1 と 5/6, 仮分数で 11/6]
      - part: 思い出す
        text: 1 − 3/8 を計算しましょう。
        answer: 5/8
        check: "1 - Fraction(3, 8)"
        hints:
          - 1 を、分母が 8 の分数で表そう。
          - 1 は 1/8 がいくつ分かな。
          - 分子をひこう。
        paths:
          - [1 = 8/8, 8/8 − 3/8, 5/8]
      - part: 今日
        text: 5/6 と 6/7 では、どちらが大きいですか。
        choices: [5/6, 6/7]
        answer: 6/7
        check: "max(Fraction(5, 6), Fraction(6, 7))"
        hints:
          - 5/6 は、1 よりいくつ小さいかな。
          - 6/7 は、1 よりいくつ小さいかな。
          - 1 とのちがいが小さいほうが、大きい数だよ。
        paths:
          - [5/6 は 1 より 1/6 小さい、6/7 は 1 より 1/7 小さい, 1/7 のほうが小さい, 6/7 が大きい]
          - [通分して 35/42 と 36/42, 6/7 が大きい]
        note: 「分母が大きいほうが大きい」と覚えると、5/6 と 2/7 のような場合にまちがえる。1 とのちがいで見ているかを確かめる。
      - part: 今日
        text: 99/100 と 98/99 では、どちらが大きいですか。
        choices: [99/100, 98/99]
        answer: 99/100
        check: "max(Fraction(99, 100), Fraction(98, 99))"
        hints:
          - 99/100 は、1 よりいくつ小さいかな。
          - 98/99 は、1 よりいくつ小さいかな。
          - 1/100 と 1/99 では、どちらが小さいかな。
        paths:
          - [1 とのちがいは 1/100 と 1/99, 1/100 のほうが小さい, 99/100 が大きい]
        note: 通分すると分母が 9900 になり、計算がたいへん。くふうのよさが分かる問題。
      - part: 今日
        text: 1/2 + 1/4 + 1/8 + 1/16 を計算しましょう。
        answer: 15/16
        check: "Fraction(1, 2) + Fraction(1, 4) + Fraction(1, 8) + Fraction(1, 16)"
        hints:
          - 1/2 は、1 にあといくつ足りないかな。
          - 1/2 に 1/4 をたすと、1 にあといくつ足りないかな。
          - たすたびに、足りない分が半分になるね。最後に足りない分はいくつかな。
        paths:
          - [1/2 で足りないのは 1/2, 1/4 をたすと足りないのは 1/4, 1/8、1/16 とたすと足りないのは 1/16, 1 − 1/16 = 15/16]
          - [16 に通分して 8/16 + 4/16 + 2/16 + 1/16, 15/16]
      - part: 挑戦
        text: 1/2 + 1/4 + 1/8 + 1/16 + 1/32 + 1/64 を計算しましょう。
        answer: 63/64
        check: "sum(Fraction(1, 2 ** k) for k in range(1, 7))"
        hints:
          - 前の問題と同じように、1 にあといくつ足りないかを見よう。
          - 最後に 1/64 をたしたとき、足りない分はいくつかな。
          - 1 から、足りない分をひこう。
        paths:
          - [たすたびに足りない分が半分になる, 最後に足りないのは 1/64, 1 − 1/64 = 63/64]
        note: 64 に通分してもできるが、足りない分を見るほうが速い。
    extra:
      - part: 今日
        text: 9/10 と 10/11 では、どちらが大きいですか。
        choices: [9/10, 10/11]
        answer: 10/11
        check: "max(Fraction(9, 10), Fraction(10, 11))"
        hints:
          - 9/10 は、1 よりいくつ小さいかな。
          - 10/11 は、1 よりいくつ小さいかな。
          - 1 とのちがいが小さいほうが、大きい数だよ。
        paths:
          - [1 とのちがいは 1/10 と 1/11, 1/11 のほうが小さい, 10/11 が大きい]
      - part: 今日
        text: 1/2 + 1/4 + 1/8 を計算しましょう。
        answer: 7/8
        check: "Fraction(1, 2) + Fraction(1, 4) + Fraction(1, 8)"
        hints:
          - 1/2 に 1/4 をたすと、1 にあといくつ足りないかな。
          - さらに 1/8 をたすと、足りない分はどうなるかな。
          - 1 から、足りない分をひこう。
        paths:
          - [足りない分は 1/2、1/4、1/8 と半分になる, 1 − 1/8 = 7/8]
          - [8 に通分して 4/8 + 2/8 + 1/8, 7/8]
      - part: 挑戦
        text: 2/3 と 3/5 では、どちらが大きいですか。
        choices: [2/3, 3/5]
        answer: 2/3
        check: "max(Fraction(2, 3), Fraction(3, 5))"
        hints:
          - 2/3 は 1 より 1/3、3/5 は 1 より 2/5 小さいね。
          - 1/3 と 2/5 では、どちらが大きいかな。
          - 1 とのちがいが小さいほうが、大きい数だよ。
        paths:
          - [1 とのちがいは 1/3 と 2/5, 1/3 = 5/15、2/5 = 6/15, 1/3 のほうが小さいので 2/3 が大きい]
          - [分子を 6 にそろえて 6/9 と 6/10, 1/9 が 6 こと 1/10 が 6 こ, 2/3 が大きい]
        note: 1 とのちがいの分子が 1 でないので、ちがいどうしをくらべる一手間がいる。分子をそろえる 2 本目の道もある。

  - day: 3
    items:
      - part: 見本
        text: 1/2 + 1/6 + 1/12 を、くふうして計算しましょう。
        figure: 1/4 ─→ 1/3 ─→ 1/2 ─→ 1
        explain: 1/2 − 1/3 = 3/6 − 2/6 = 1/6、1/3 − 1/4 = 4/12 − 3/12 = 1/12 です。1/6 は 1/2 と 1/3 の差、1/12 は 1/3 と 1/4 の差です。数直線で 1/4 から 1/3、1/2、1 と止まりながら進むと、進むはばは 1/12、1/6、1/2 です。3 つのはばを合わせると、1/4 から 1 まで進んだはばになるので、答えは 1 − 1/4 = 3/4 です。6 = 2 × 3、12 = 3 × 4 のように、分母がとなり合う 2 つの数の積で分子が 1 の分数は、2 つの分数の差に分けられます（分母が 2 × 3 = 6 の 1/6 は 1/2 − 1/3）。これがくふうの 3 つめです。
      - part: 思い出す
        text: 1/4 − 1/5 を計算しましょう。
        answer: 1/20
        check: "Fraction(1, 4) - Fraction(1, 5)"
        hints:
          - 分母がちがうので、通分しよう。
          - 5 の段の数で、4 でわり切れる いちばん小さい数はいくつかな。
          - 分母をそろえたら、分子をひこう。
        paths:
          - [分母を 20 にそろえる, 5/20 − 4/20, 1/20]
      - part: 思い出す
        text: 6/7 と 7/8 では、どちらが大きいですか。
        choices: [6/7, 7/8]
        answer: 7/8
        check: "max(Fraction(6, 7), Fraction(7, 8))"
        hints:
          - 6/7 は、1 よりいくつ小さいかな。
          - 7/8 は、1 よりいくつ小さいかな。
          - 1 とのちがいが小さいほうが、大きい数だよ。
        paths:
          - [1 とのちがいは 1/7 と 1/8, 1/8 のほうが小さい, 7/8 が大きい]
      - part: 今日
        text: 1/30 は、どの 2 つの分数の差ですか。
        choices: [1/5 − 1/6, 1/3 − 1/10, 1/6 − 1/5]
        answer: 1/5 − 1/6
        check: "[c for c, v in {'1/5 − 1/6': Fraction(1, 5) - Fraction(1, 6), '1/3 − 1/10': Fraction(1, 3) - Fraction(1, 10), '1/6 − 1/5': Fraction(1, 6) - Fraction(1, 5)}.items() if v == Fraction(1, 30)][0]"
        hints:
          - 30 を、となり合う 2 つの数の積で表せるかな。
          - 九九で、となり合う 2 つの数をかけて 30 になるのはどれかな。
          - 差は、大きいほうから小さいほうをひいた形だよ。
        paths:
          - [30 = 5 × 6, 1/5 − 1/6 = 6/30 − 5/30, 1/30]
        note: 1/6 − 1/5 は小さいほうから大きいほうをひいていて、ひけない。1/3 − 1/10 は 10/30 − 3/30 = 7/30。
      - part: 今日
        text: 1/2 + 1/6 + 1/12 + 1/20 を、くふうして計算しましょう。
        answer: 4/5
        check: "Fraction(1, 2) + Fraction(1, 6) + Fraction(1, 12) + Fraction(1, 20)"
        hints:
          - 1/6、1/12、1/20 を、それぞれ 2 つの分数の差に分けよう。
          - 20 = 4 × 5 なので、1/20 は 1/4 − 1/5 だね。
          - 数直線で、どこからどこまで進んだかを考えよう。
        paths:
          - [1/2 = 1 − 1/2、1/6 = 1/2 − 1/3、1/12 = 1/3 − 1/4、1/20 = 1/4 − 1/5, 1/5 から 1 まで進んだはば, 1 − 1/5 = 4/5]
          - [前から順にたす, 1/2 + 1/6 = 2/3, 2/3 + 1/12 = 3/4, 3/4 + 1/20 = 4/5]
        note: 前から順にたすと、とちゅうの答えが 2/3、3/4、4/5 と並ぶ。このきまりに気づかせるのもよい。
      - part: 今日
        text: 1/6 + 1/12 + 1/20 + 1/30 を、くふうして計算しましょう。
        answer: 1/3
        check: "Fraction(1, 6) + Fraction(1, 12) + Fraction(1, 20) + Fraction(1, 30)"
        hints:
          - どの分母も、となり合う 2 つの数の積だね。
          - いちばん大きい 1/6 と、いちばん小さい 1/30 を、それぞれ差に分けよう。
          - 数直線で、どこからどこまで進んだかを考えよう。
        paths:
          - [1/6 から 1/2 まで進んだはば, 1/2 − 1/6 = 3/6 − 1/6 = 2/6, 約分して 1/3]
        note: 1 から始まらないので、1 − 1/6 としやすい。出発と到着の点を確かめる。
      - part: 挑戦
        text: 1/2 + 1/6 + 1/12 + 1/20 + 1/30 + 1/42 + 1/56 + 1/72 + 1/90 を、くふうして計算しましょう。
        answer: 9/10
        check: "sum(Fraction(1, k * (k + 1)) for k in range(1, 10))"
        hints:
          - 分母はどれも、となり合う 2 つの数の積だね。
          - 90 = 9 × 10 なので、1/90 は 1/9 − 1/10 だね。
          - 数直線で、どこからどこまで進んだかを考えよう。
        paths:
          - [どの分数も、となり合う数の分数の差, 1/10 から 1 まで進んだはば, 1 − 1/10 = 9/10]
        note: 通分すると分母がとても大きくなる。差に分けると、とちゅうがすべて消える。
    extra:
      - part: 今日
        text: 1/20 = 1/4 − □ です。□ にあてはまる分数はいくつですか。
        answer: 1/5
        check: "Fraction(1, 4) - Fraction(1, 20)"
        hints:
          - 1/4 から 1/20 をひくと、□ が出るね。
          - 1/4 を、分母が 20 の分数になおそう。
