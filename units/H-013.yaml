# H-013 イオンと電離（イオンのでき方、電解質、イオンからなる物質）
#
# 水準 2・5 日。1 日目 イオンのでき方（電子を出して陽イオン、受け取って陰イオン、電気の向きと数）、2 日目 イオンからなる物質と電解質（結晶、電離、電気を通すわけ、電気の合計 0 と数のつり合い）、3 日目 わけ（電子の並びと貴ガス）、4 日目 混ぜる、5 日目 確認。
id: H-013
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          原子は電気を持ちません。+の陽子と −の電子が同じ数だからです。
          電子を出すと +の電気を持つ陽イオンに、電子を受け取ると −の電気を持ついんイオンになります。
          点線の丸は出ていった電子、色のついた点は入ってきた電子です。
          電気の数は、陽子の数 − 電子の数です。
