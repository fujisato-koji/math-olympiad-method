    note: "借りた形：S02 ぬり分け（Na⁺ と Cl⁻ を市松に見ると、組になる 2 この色は 1 こずつ。かけらは 8 と 8 で同じ数だが、それだけでは足りない）、S08 はとの巣（同じ 1 こにだけつながる 2 こは 1 こしか組になれない）、S10（少なくとも 4 をおさえ、4 でできる分け方を作る）。種：なし（かけたばんのドミノ分けの考え方を借りて、食塩のけっしょうのかけらに組み立てた）。なぜむずかしいか：色の数が 8 と 8 でそろうので「0 こ」と答えたくなる。はしの小さなまとまりごとに少なくともいくつあまるかを見つけ（3 か所で 1 ＋ 1 ＋ 2）、4 こでほんとうに分けられる例を作って、少なくともの数と合わせる、の 3 段が要る。G-002 の形を分ける見方と、H-013 のけっしょうで Na⁺ と Cl⁻ がたがいちがいにならぶこと（電気の合計 0 の組）を組み合わせる。"
