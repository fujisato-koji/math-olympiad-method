        explain: 原子は陽子（+）と電子（−）が同じ数なので電気を帯びません。電子を失うと陽子のほうが多くなって陽イオン、電子を得ると電子のほうが多くなって陰イオンになります。変わるのは電子の数だけで、陽子の数（核の数字）は変わりません。電気の数は「陽子の数 − 電子の数」で読めます。
