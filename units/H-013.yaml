    kinds: [総動員, 数]
    uses: [H-011]
    text: えんさんの中には、H⁺ と Cl⁻ だけがあります（水はのぞきます）。図の − の丸は Cl⁻ で、H⁺ は書いてありません。金ぞくのつぶを入れると、とけるつぶは電子を出して陽イオンになります。Mg は電子を 2 こ、Al は 3 こ出します。出た電子は H⁺ が 1 こずつ受け取って H 原子になり、H 原子 2 こであわ 1 こになります。ぎん色のつぶは Mg か Al、赤茶色のつぶはどう（Cu）です。入れたらあわが 5 こ出て、ぎん色のつぶは全部とけました。このとき、水の中のイオンは全部でいくつですか。
