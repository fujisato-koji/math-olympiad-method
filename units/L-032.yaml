    answer: 2 と 3
    check: "' と '.join([['0', '1', '2', '3', '4'][v] for v in range(5) if all(v in {len([i for i in c if j <= i < j + 4]) for j in range(13)} for c in itertools.combinations(range(16), 10))])"
    hints:
      - 1〜4、5〜8、9〜12、13〜16 試合目の、重ならない 4 つの区間の勝ち数の合計はいくつですか。
