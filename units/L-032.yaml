# L-032 離散的な中間値の議論
#
# 書き方は N-001 の頭の注のとおり。段 4 なので、子に見せる文は普通の文（です・ます）。
# 前提は L-011（背理法）。たどると L-013（命題と条件）、A-016、A-013（不等式）、A-010（文字と式）、N-027・N-010（正負の数）、
#   N-011（絶対値）、N-021（素数）、N-017（倍数）、N-014（わり算とあまり）などなので、これらを道具にする。
# 中心の事実（離散的な中間値の定理）：整数の列で、となりどうしの差がいつも 1 以下なら、はじめの項と最後の項のあいだの整数は、
#   どれも列のどこかに現れる。1 日目の見本で事実として示し、3 日目のわけで背理法で示す。
#   「はじめて k 以上になる項」をとる証明は L-014（極端なものに着目する）の考えで、この単元の前提にないので使わない。
#   わけは「どの項も k でないと仮定 → 項は k − 1 以下の組と k + 1 以上の組に分かれる → 組が変わるとなり合う 2 項の差が 2 以上で矛盾」で書く。
#   鳩の巣原理（L-006、L-015）と帰納法（L-012）も前提にないので使わない。実数の連続関数の中間値の定理は解析の流れにまかせる。
# 使う「1 ずつしか変わらない量」：点差（1 点ずつ入る試合）、続いて並んだ k 個の中の個数（窓を 1 つずらすと 1 個出て 1 個入る）、
#   1 から n までの中の倍数や素数の個数（n が 1 ふえると 0 か 1 ふえる）、左から k 個の（赤の数 − 白の数）。
#   1 回に 2 や 3 変わる量（バスケットボールの点差）では成り立たないことを、反例で必ず並べて示す。
# 日の並びは地図の既定（導入・練習・わけ・混ぜる・確認）。ねらいは次のとおりにした。
#   1 日目 導入：中間値の定理の形。必ず現れる整数を数える。点差（1 点ずつと、2・3 点ずつの反例）。窓の中の個数。
#   2 日目 練習：それまでの個数（倍数の個数）、左から k 個の差、輪に並んだ玉の半分の窓、差が 3 以下の列。
#   3 日目 わけ：中間値の定理を背理法で示す、同点の時点があることを示す、輪の半分の窓で赤がちょうど半分のところがあることを示す（③）。
#   4 日目 混ぜる：L-013（必要条件と十分条件、反例）、L-011（否定、和の押さえ）、N-021（素数の個数）と、1〜3 日目の型を混ぜる。
#   5 日目 確認。
# check：
#   「必ず〜か」は、小さい場合の並べ方や点の入り方を itertools で全部作り、すべてで成り立つか（all）を調べる。
#   点差は、点の入り方の列 g から d = [sum(g[:i]) …] を作り、d[s] と d[t] のあいだに 0 があるかを調べる。
#   窓の個数は図の文字列 fig を fig[i:i + k].count('●') で数える。輪は j % n で番号を回す。
#   仮定を選ぶ問題と必要十分の問題は L-011、L-013 の形（product の結果はくり返し使うので [ ] で並べておく）。

id: L-032
days:
  - day: 1
    items:
      - part: 見本
        text: 《整数》の列 3、4、5、4、5、6、7、6、7、8 は、となりどうしの差がいつも 1 です。はじめの項 3 と最後の項 8 のあいだの整数 4、5、6、7 は、どれも列に現れるでしょうか。
        explain: 現れます。《数直線》の上で、コマを 1 ずつ右か左に動かすと考えると、3 から 8 へ行くあいだに 4、5、6、7 を通らずにはいられません。1 回に 1 しか動けないので、あいだの整数をとびこえられないからです。一般に、「整数の列 a₁、a₂、…、aₙ で、となりどうしの差がいつも 1 以下なら、a₁ と aₙ のあいだの整数はどれも、列のどこかに現れる」が成り立ちます。これを離散的な中間値の定理といいます（わけは 3 日目に背理法で示します）。差が 2 になれると、3、5、7、8 のように 4 と 6 をとびこえられるので、「差が 1 以下」が大事な条件です。使うときは、問題の中から「1 ずつしか変わらない量」を見つけるのがかぎです。試合の点差、続いて並んだいくつかの中の個数、それまでに数えた個数などがその例です。
      - part: 思い出す
        text: 「列の中に 6 に等しい項がある」ことを背理法で示します。はじめに仮定することは、どれですか。
        choices: [列のどの項も 6 ではない, 列のある項は 6 ではない, 列のどの項も 6 より小さい]
        answer: 列のどの項も 6 ではない
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([k for k, f in {'列のどの項も 6 ではない': lambda t: all(x != 6 for x in t), '列のある項は 6 ではない': lambda t: any(x != 6 for x in t), '列のどの項も 6 より小さい': lambda t: all(x < 6 for x in t)}.items() if all(f(t) == (not any(x == 6 for x in t)) for t in itertools.product(range(4, 9), repeat=3))])"
        hints:
          - 背理法では、示したいことの否定を仮定するのでした。
          - 「6 に等しい項がある」の否定は、「6 に等しい項が □ 」の形です。
          - 「ある」の否定は「どれも〜でない」でした。
        paths:
          - [示したいのは「6 に等しい項がある」, 否定は「6 に等しい項は 1 つもない」, 列のどの項も 6 ではない]
      - part: 思い出す
        text: 4 つの整数の和が 37 のとき、「少なくとも 1 つは □ 以上である」と必ず言えます。□ にあてはまる整数のうち、いちばん大きいものはいくつですか。
        answer: 10
        check: max(m for m in range(1, 38) if 4 * (m - 1) < 37)
        hints:
          - どれも 9 以下と仮定すると、和は最大でいくつですか。
          - その和は 37 と比べてどうですか。
          - それより大きい数では言えないことを、例を 1 つ作って確かめましょう。
        paths:
          - [どれも 9 以下なら和は 36 以下で矛盾, 少なくとも 1 つは 10 以上, 10、9、9、9 で 37 なので 11 以上は言えない, 10]
      - part: 今日
        text: 整数の列で、となりどうしの差はいつも 1 です。はじめの項は 3、最後の項は 11 です。この列に必ず現れる整数は、全部で何個ですか。
        answer: 9
        check: len(range(3, 12))
        hints:
          - 3 と 11 のあいだの整数は、とびこえられますか。
          - はじめの項 3 と最後の項 11 も、列に現れています。
          - 3 から 11 までの整数を数えましょう。
        paths:
          - [差が 1 なのであいだの整数はとびこえられない, 3 から 11 までの整数はすべて現れる, 11 − 3 + 1 = 9 個]
        note: 11 − 3 = 8 と答えやすい。両はしの 3 と 11 も入れて 9 個。12 や 2 が現れることもあるが、「必ず」ではない。
      - part: 今日
        text: 1 点ずつ点が入るサッカーの試合で、前半のある時点では A チームが 2 点リードしていました。後半のある時点では B チームが 1 点リードしていました。そのあいだに、同点の時点は必ずありましたか。
        choices: [必ずあった, なかったこともありうる]
        answer: 必ずあった
        check: "(lambda ok: '必ずあった' if ok else 'なかったこともありうる')(all(any(d[u] == 0 for u in range(s, t)) for g in itertools.product([1, -1], repeat=8) for d in [[sum(g[:i]) for i in range(9)]] for s in range(9) for t in range(s, 9) if d[s] == 2 and d[t] == -1))"
        hints:
          - 「A の点 − B の点」を点差とします。1 点入ると、点差はどれだけ変わりますか。
          - 点差は 2 から −1 まで変わりました。
          - 1 ずつしか変わらない数は、あいだの整数をとびこえられますか。
        paths:
          - [点差 = A の点 − B の点, 1 点入るごとに点差は 1 だけ変わる, 2 から −1 へ変わるあいだに 0 を通る, 必ず同点の時点があった]
      - part: 今日
        text: バスケットボールで、点は 1 回に 2 点か 3 点入るものとします。A チームが 1 点リードしていた時点のあとで、B チームが 2 点リードしていた時点がありました。そのあいだに、同点の時点は必ずありましたか。
        choices: [必ずあった, なかったこともありうる]
        answer: なかったこともありうる
        check: "'必ずあった' if all(any(d[u] == 0 for u in range(s, t)) for g in itertools.product([2, 3, -2, -3], repeat=5) for d in [[sum(g[:i]) for i in range(6)]] for s in range(6) for t in range(s, 6) if d[s] == 1 and d[t] == -2) else 'なかったこともありうる'"
        hints:
          - 1 回に点が入ると、点差はどれだけ変わりますか。
          - 点差が 1 のときに B チームが 3 点入れると、点差はいくつになりますか。
          - 同点を通らない点の入り方を、1 つ作ってみましょう。
        paths:
          - [A が 3 点、B が 2 点で A の 1 点リード, 次に B が 3 点入れて 3 対 5, 点差は 1 から −2 へとんで同点がない, なかったこともありうる]
        note: 前の問題とのちがいは、点差が 1 回に 2 や 3 変わること。「1 以下しか変わらない」がこの考えのかぎ。反例を 1 つ作れば「必ず」ではないと示せる（L-013）。
      - part: 挑戦
        text: ● と ○ が 12 個並んでいます。続いて並んだ 3 個を 1 組とみて、その中の ● の個数を調べます。● の個数として現れる数は、何通りありますか。
        figure: ●●●●○○○●○○●●
        answer: 4
        check: len(set(fig[i:i + 3].count('●') for i in range(len(fig) - 2)))
        hints:
          - 3 個の組を 1 つ右へずらすと、● の個数はどれだけ変わりますか。
          - ● の個数がいちばん多い組と、いちばん少ない組を探しましょう。
          - そのあいだの個数は、とびこえられますか。
        paths:
          - [ずらすと 1 個出て 1 個入るので個数の変化は 1 以下, いちばん多いのは左はしの 3 個, いちばん少ないのは 5〜7 番目の 0 個, あいだの 1 と 2 も現れて 4 通り]
          - [10 の組を全部数える, 3、3、2、1、0、1、1、1、1、2, 4 通り]
        note: 全部の組を数えてもよいが、いちばん多い組といちばん少ない組を見つければ、あいだの個数はこの日の考えで必ず現れると分かる。
    extra:
      - part: 今日
        text: 整数の列で、となりどうしの差はいつも 1 です。はじめの項は −4、最後の項は 5 です。この列に必ず現れる整数は、全部で何個ですか。
        answer: 10
        check: len(range(-4, 6))
        hints:
          - −4 と 5 のあいだの整数は、とびこえられますか。
          - 0 も整数です。
          - −4 から 5 までの整数を数えましょう。
        paths:
          - [−4 から 5 までの整数はすべて現れる, 負の数が 4 個、0、正の数が 5 個, 10 個]
      - part: 今日
        text: 階段を 1 段ずつ上ったり下りたりします。はじめは 3 段目にいて、そのあと 12 段目に立ったことがありました。そのあいだに、7 段目に立ったことは必ずありますか。
        choices: [必ずある, ないこともある]
        answer: 必ずある
        check: "'必ずある' if all(7 in d for g in itertools.product([1, -1], repeat=11) for d in [[3 + sum(g[:i]) for i in range(12)]] if 12 in d) else 'ないこともある'"
        hints:
          - 立っている段の番号は、1 回でどれだけ変わりますか。
          - 3 から 12 へ変わるあいだに、とびこえられる番号はありますか。
          - 7 は 3 と 12 のあいだにありますか。
        paths:
          - [段の番号は 1 ずつしか変わらない, 3 から 12 へ行くあいだにとびこえられない, 7 段目に必ず立った]
      - part: 今日
        text: 1 点ずつ点が入る試合で、A チームが 3 点リードした時点、そのあとで B チームが 4 点リードした時点、さらにそのあとで A チームが 1 点リードした時点がありました。同点の時点は、少なくとも何回ありましたか。
        answer: 2
        check: (1 if 3 > 0 > -4 else 0) + (1 if -4 < 0 < 1 else 0)
        hints:
          - 点差（A − B）は、3 → −4 → 1 と変わりました。
          - 3 から −4 へ変わるあいだに、点差は 0 を通りますか。
          - −4 から 1 へ変わるあいだはどうですか。その 2 つの時点は同じになりえますか。
        paths:
          - [点差は 3 から −4 へ変わるあいだに 0 を通る, −4 から 1 へ変わるあいだにも 0 を通る, あいだに B のリードの時点があるので別の時点, 少なくとも 2 回]

  - day: 2
    items:
      - part: 思い出す
        text: 《整数》の列で、となりどうしの差はいつも 1 です。はじめの項は 7、最後の項は −2 です。この列に必ず現れる整数は、全部で何個ですか。
        answer: 10
        check: len(range(-2, 8))
        hints:
          - 7 から −2 へ減るあいだに、とびこえられる整数はありますか。
          - −2 から 7 までの整数を考えましょう。
          - 0 も入れて数えましょう。
        paths:
          - [−2 から 7 までの整数はすべて現れる, 7 − (−2) + 1 = 10 個]
      - part: 思い出す
        text: 1 点ずつ点が入る試合で、A チームが 1 点リードしていた時点のあとで、B チームが 3 点リードしていた時点がありました。そのあいだに、同点の時点は必ずありましたか。
        choices: [必ずあった, なかったこともありうる]
        answer: 必ずあった
        check: "(lambda ok: '必ずあった' if ok else 'なかったこともありうる')(all(any(d[u] == 0 for u in range(s, t)) for g in itertools.product([1, -1], repeat=8) for d in [[sum(g[:i]) for i in range(9)]] for s in range(9) for t in range(s, 9) if d[s] == 1 and d[t] == -3))"
        hints:
          - 点差を「A の点 − B の点」とします。
          - 点差は 1 から −3 まで、1 ずつ変わります。
          - 0 は 1 と −3 のあいだにありますか。
        paths:
          - [点差は 1 ずつ変わる, 1 から −3 へ行くあいだに 0 を通る, 必ずあった]
      - part: 今日
        text: 1 から n までの整数のうち、3 の《倍数》の個数を c(n) とします。たとえば c(7) = 2 です。c(n) = 7 となる正の整数 n のうち、いちばん大きいものはいくつですか。
        answer: 23
        check: max(n for n in range(1, 100) if n // 3 == 7)
        hints:
          - n が 1 ふえると、c(n) はどれだけふえますか。
          - c(n) が 7 になるのは、7 個目の 3 の倍数に着いたときです。それはいくつですか。
          - c(n) が 8 になるのはいつですか。その直前の n を答えましょう。
        paths:
          - [c(n) は 0 か 1 ずつふえる, 7 個目の 3 の倍数は 21, 8 個目は 24 なので c(n) = 7 は n = 21、22、23, いちばん大きいのは 23]
        note: c(n) は 1 以下ずつしかふえないので、0、1、2、… のどの値もとびこえずにとる。だから c(n) = 7 となる n は必ずある。
      - part: 今日
        text: 赤玉 6 個と白玉 6 個を 1 列に並べます。左はしと右はしは、どちらも赤玉です。左から何個か（1 個以上 11 個以下）を取ると、その中の赤玉と白玉を同じ数にできますか。
        choices: [どう並べても必ずできる, できない並べ方もある]
        answer: どう並べても必ずできる
        check: "'どう並べても必ずできる' if all(any(sum(1 for j in range(k) if j in s) * 2 == k for k in range(1, 12)) for s in [set((0, 11) + c) for c in itertools.combinations(range(1, 11), 4)]) else 'できない並べ方もある'"
        hints:
          - 左から k 個の（赤の数 − 白の数）を d(k) とします。k が 1 ふえると、d はどれだけ変わりますか。
          - d(1) はいくつですか。全部の 12 個では d(12) = 0 です。右はしが赤なら d(11) はいくつですか。
          - 1 ずつ変わる d が、1 から −1 まで変わります。
        paths:
          - [d(k) = 左から k 個の赤 − 白, d(1) = 1, d(12) = 0 で右はしが赤なので d(11) = −1, d は 1 ずつ変わるので途中で 0 になる, 必ずできる]
        note: 右はしが白玉だと d(11) = 1 となり、必ずできるとは言えない（3 日目の思い出す）。
      - part: 今日
        text: 10 個の玉が輪の形に並んでいて、そのうち 4 個が ● です（図は並べ方の 1 つの例）。どう並べても、続いて並んだ 5 個の中に ● がちょうど 2 個のところがありますか。
        svg: |
          <svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120.0" cy="23.0" r="8" stroke="currentColor" fill="currentColor" stroke-width="2"/>
            <circle cx="150.6" cy="32.9" r="8" stroke="currentColor" fill="currentColor" stroke-width="2"/>
            <circle cx="169.5" cy="58.9" r="8" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="169.5" cy="91.1" r="8" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="150.6" cy="117.1" r="8" stroke="currentColor" fill="currentColor" stroke-width="2"/>
            <circle cx="120.0" cy="127.0" r="8" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="89.4" cy="117.1" r="8" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="70.5" cy="91.1" r="8" stroke="currentColor" fill="currentColor" stroke-width="2"/>
            <circle cx="70.5" cy="58.9" r="8" stroke="currentColor" fill="none" stroke-width="2"/>
            <circle cx="89.4" cy="32.9" r="8" stroke="currentColor" fill="none" stroke-width="2"/>
          </svg>
        choices: [どう並べても必ずある, ない並べ方もある]
        answer: どう並べても必ずある
        check: "'どう並べても必ずある' if all(any(sum(1 for j in range(i, i + 5) if j % 10 in s) == 2 for i in range(10)) for s in [set(c) for c in itertools.combinations(range(10), 4)]) else 'ない並べ方もある'"
        hints:
          - ある 5 個と、残りの 5 個（反対がわ）の ● の個数を足すと、いくつですか。
          - 5 個の組を 1 つずつ回すと、● の個数はどれだけ変わりますか。
          - 半周回すと、● の個数は x 個から 4 − x 個に変わります。2 をはさんでいますか。
        paths:
          - [ある 5 個の ● を x 個とすると反対がわは 4 − x 個, x が 2 ならそれでよい, 2 でないなら x と 4 − x は 2 をはさむ, 1 つずつ回すと 1 以下しか変わらないので途中で 2 になる, 必ずある]
      - part: 挑戦
        text: 整数の列で、となりどうしの差はいつも 3 以下です。はじめの項は 0、最後の項は 30 です。「0 から 30 までの、続いた □ 個の整数のうち、少なくとも 1 つは必ず列に現れる」と言えます。□ にあてはまる数のうち、いちばん小さいものはいくつですか。
        answer: 3
        check: min(m for m in range(1, 10) if all(any(x in range(k, k + m) for x in range(0, 31, 3)) for k in range(0, 31 - m + 1)))
        hints:
          - 0、3、6、…、30 の列では、どの整数がとびこえられていますか。続いた 2 個の整数が両方とびこえられることはありますか。
          - 続いた 3 個の整数 k、k + 1、k + 2 をどれもとびこえるには、となり合う 2 項がどんな値でないといけませんか。
          - その 2 項の差はいくつ以上になりますか。
        paths:
          - [0、3、6、…、30 では 1 と 2 がどちらも現れないので 2 では言えない, 続いた 3 個をとびこえるには k − 1 以下から k + 3 以上へとぶ, 差が 4 以上になり矛盾, 3]
        note: 差が 1 以下のときは「1 個」で言えるのが中間値の定理。差が d 以下なら、続いた d 個のどれかが現れる、と広げられる。
    extra:
      - part: 今日
        text: 1 から n までの整数のうち、4 の倍数の個数を c(n) とします。c(n) = 5 となる正の整数 n のうち、いちばん小さいものはいくつですか。
        answer: 20
        check: min(n for n in range(1, 100) if n // 4 == 5)
