    text: あるチームが 16 試合を行い、10 勝 6 敗でした（引き分けはありません）。続いて行った 4 試合を 1 つの区間とみて、区間ごとの勝ち数を調べます（区間は 1〜4 試合目、2〜5 試合目、…、13〜16 試合目の 13 通り）。勝ち負けがどんな順でも、必ず現れる勝ち数をすべて選んだものはどれですか。
