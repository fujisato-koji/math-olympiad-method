        explain: "【定義】回転行列 R(θ) = (cos θ −sin θ；sin θ cos θ) は、原点のまわりの角 θ の回転を表す行列で、成分に《三角関数》の cos θ、sin θ を使います（G-025）。\n図の左は θ = 30° の回転、右は x じくについてのうら返し (1 0；0 −1) です。\n(1, 0) と (0, 1) の行き先（赤と緑）は、どちらも長さ 1 で、直角のままです。\n行列式の正負は、向きがそのままか反対かを表しました（M-004）。"
