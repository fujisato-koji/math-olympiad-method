        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><path d="M76.5 26.7 L82 38.7 L87.5 50.1 L93 60.8 L98.5 70.9 L104 80.3 L109.5 89.1 L115 97.2 L120.5 104.7 L126 111.5 L131.5 117.7 L137 123.2 L142.5 128.1 L148 132.3 L153.5 135.9 L159 138.8 L164.5 141.1 L170 142.7 L175.5 143.7 L181 144 L186.5 143.7 L192 142.7 L197.5 141.1 L203 138.8 L208.5 135.9 L214 132.3 L219.5 128.1 L225 123.2 L230.5 117.7 L236 111.5 L241.5 104.7 L247 97.2 L252.5 89.1 L258 80.3 L263.5 70.9 L269 60.8 L274.5 50.1 L280 38.7" stroke="#7fc8f8" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="30" y1="160" x2="300" y2="160" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><polygon points="306,160 297,155.5 297,164.5" fill="currentColor" fill-opacity="1"/><line x1="40" y1="170" x2="40" y2="20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><polygon points="40,14 35.5,23 44.5,23" fill="currentColor" fill-opacity="1"/><text x="300" y="178" font-size="14" text-anchor="end" font-style="italic" fill="currentColor">t</text><text x="48" y="24" font-size="13" text-anchor="start" font-style="italic" fill="currentColor">f(t)</text><text x="180" y="186" font-size="13" text-anchor="middle" fill="currentColor">どんな t でも f(t) ≧ 0</text><text x="181" y="52" font-size="14" text-anchor="middle" fill="currentColor">f(t) = ||u − tv||²</text></svg>'
        hints:
          - どんな t でも ||u − tv||² ≧ 0 です（長さの 2 乗だから）。
          - text: "||u − tv||² をてんかいすると、t の 2 次関数になります。グラフは横の線より下に出ません。"
            svg: '<svg viewBox="0 0 320 84" xmlns="http://www.w3.org/2000/svg"><rect x="60" y="48" width="76" height="26" rx="8" fill="#f3c969" fill-opacity="0.5"/><rect x="146" y="48" width="72" height="26" rx="8" fill="#7fc8f8" fill-opacity="0.5"/><rect x="228" y="48" width="72" height="26" rx="8" fill="#7bc96f" fill-opacity="0.5"/><text x="160" y="30" font-size="14" text-anchor="middle" fill="currentColor">||u − tv||² = ||v||² t² − 2⟨u, v⟩ t + ||u||²</text><text x="98" y="66" font-size="14" text-anchor="middle" fill="currentColor">a = ||v||²</text><text x="182" y="66" font-size="14" text-anchor="middle" fill="currentColor">b = ⟨u, v⟩</text><text x="264" y="66" font-size="14" text-anchor="middle" fill="currentColor">c = ||u||²</text></svg>'
          - 下に出ない 2 次関数では、はんべつしきがどうなるかを考えます。
        paths:
          - [f(t) = ||u − tv||² ≧ 0, t の 2 次関数にてんかい, はんべつしき ≦ 0, "|⟨u, v⟩| ≦ ||u|| ||v||"]
          - [u を v の向きの部分と残りに分ける：u = cv + w（w は v にすいちょく）, "||u||² = c²||v||² + ||w||² ≧ c²||v||²", "⟨u, v⟩ = c||v||² を入れる"]
        explain: 「v ≠ 0 とする。どんな実数 t でも f(t) = ||u − tv||² ≧ 0。てんかいすると f(t) = ||v||²t² − 2⟨u, v⟩t + ||u||² で、t の 2 次関数。グラフが横の線より下に出ないので、はんべつしき D/4 = ⟨u, v⟩² − ||u||² ||v||² ≦ 0。よって ⟨u, v⟩² ≦ ||u||² ||v||² で、|⟨u, v⟩| ≦ ||u|| ||v||。v = 0 なら両辺とも 0。」と書ければよい。① 長さの 2 乗は 0 以上、② t の 2 次関数にてんかい、③ はんべつしき。子どもには、u = (1, 2)、v = (3, 1) で両辺を計算させます。
      - part: わけ
        text: グラム–シュミットで v₁、v₂ を作ったあと、v₃ = u₃ − c₁v₁ − c₂v₂（c₁ = ⟨u₃, v₁⟩ / ⟨v₁, v₁⟩、c₂ = ⟨u₃, v₂⟩ / ⟨v₂, v₂⟩）とします。v₃ が v₁ とも v₂ とも直交するわけを説明しましょう。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><polygon points="20,166 210,166 300,112 110,112" fill="#c8ccd6" fill-opacity="0.35" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><line x1="90" y1="150" x2="190.5" y2="150" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="200,150 189,155.5 189,144.5" fill="#f08080"/><line x1="90" y1="150" x2="139.4" y2="126.1" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="148,122 140.5,131.7 135.7,121.8" fill="#7bc96f"/><line x1="90" y1="150" x2="212.6" y2="51.9" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="220,46 214.8,57.2 208,48.6" fill="#7fc8f8"/><line x1="220" y1="46" x2="220" y2="132" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="220" cy="132" r="5" fill="#f3c969" fill-opacity="1" stroke="currentColor" stroke-width="1"/><line x1="90" y1="150" x2="90" y2="73.5" stroke="#b39ddb" stroke-width="3" stroke-linecap="round"/><polygon points="90,64 95.5,75 84.5,75" fill="#b39ddb"/><polyline points="90,140 100,140 100,150" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="204" y="164" font-size="14" text-anchor="start" fill="currentColor">v₁</text><text x="152" y="120" font-size="14" text-anchor="start" fill="currentColor">v₂</text><text x="226" y="44" font-size="14" text-anchor="start" fill="currentColor">u₃</text><text x="82" y="70" font-size="14" text-anchor="end" fill="currentColor">v₃</text><text x="250" y="184" font-size="12" text-anchor="middle" fill="currentColor">v₁、v₂ の平面</text><text x="228" y="98" font-size="12" text-anchor="start" fill="currentColor">黄：足</text></svg>'
        hints:
          - v₃ と v₁ の内積 ⟨v₃, v₁⟩ を、v₃ の式を入れててんかいします。
          - text: むらさきの ⟨v₂, v₁⟩ は、先に作った v₂ と v₁ の内積です。
            svg: '<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg"><rect x="256" y="54" width="60" height="26" rx="8" fill="#b39ddb" fill-opacity="0.5"/><text x="160" y="30" font-size="14" text-anchor="middle" fill="currentColor">v₃ = u₃ − c₁v₁ − c₂v₂</text><text x="64" y="72" font-size="14" text-anchor="middle" fill="currentColor">⟨v₃, v₁⟩ =</text><text x="138" y="72" font-size="14" text-anchor="middle" fill="currentColor">⟨u₃, v₁⟩</text><text x="198" y="72" font-size="14" text-anchor="middle" fill="currentColor">− c₁⟨v₁, v₁⟩</text><text x="272" y="72" font-size="14" text-anchor="middle" fill="currentColor">− c₂⟨v₂, v₁⟩</text></svg>'
          - 残った 2 つが、2 本のときと同じように打ち消し合うかを見ます。v₂ との内積も同じように考えます。
        paths:
          - ["⟨v₃, v₁⟩ をてんかい", "⟨v₂, v₁⟩ = 0 で 1 つ消える", "c₁⟨v₁, v₁⟩ = ⟨u₃, v₁⟩ で打ち消して 0", v₂ も同じ]
          - [図：u₃ から、v₁、v₂ の平面への足を引く, 残りの v₃ は平面にすいちょく, だから v₁ にも v₂ にも直交]
        explain: 「⟨v₃, v₁⟩ = ⟨u₃, v₁⟩ − c₁⟨v₁, v₁⟩ − c₂⟨v₂, v₁⟩。v₂ と v₁ はもう直交しているので ⟨v₂, v₁⟩ = 0 で 3 つ目が消え、c₁⟨v₁, v₁⟩ = ⟨u₃, v₁⟩ なので前の 2 つが打ち消して 0。v₂ との内積も同じで、⟨v₁, v₂⟩ = 0 と c₂⟨v₂, v₂⟩ = ⟨u₃, v₂⟩ から 0。」と書ければよい。① v₁ との内積、② 先に作った組の直交で 1 つ消える、③ 係数が打ち消す。子どもには、u₁ = (1, 0, 0)、u₂ = (1, 1, 0)、u₃ = (1, 1, 1) で v₃ = (0, 0, 1) になることをたしかめさせます。
      - part: わけ
        text: どんなベクトル u、v でも、||u + v||² + ||u − v||² = 2||u||² + 2||v||² が成り立つわけを説明しましょう（中線定理）。
        svg: '<svg viewBox="0 0 320 204" xmlns="http://www.w3.org/2000/svg"><polygon points="70,160 214,144 262,40 118,56" fill="#f3c969" fill-opacity="0.25" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><line x1="70" y1="160" x2="204.6" y2="145" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="214,144 203.7,150.7 202.5,139.7" fill="#f08080"/><text x="220" y="152" font-size="15" text-anchor="start" font-style="italic" fill="currentColor">u</text><line x1="70" y1="160" x2="114" y2="64.6" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="118,56 118.4,68.3 108.4,63.7" fill="#7bc96f"/><text x="110" y="54" font-size="15" text-anchor="end" font-style="italic" fill="currentColor">v</text><line x1="70" y1="160" x2="253.9" y2="45" stroke="#7fc8f8" stroke-width="2.6" stroke-linecap="round"/><polygon points="262,40 255.6,50.5 249.8,41.2" fill="#7fc8f8"/><line x1="118" y1="56" x2="207" y2="137.6" stroke="#b39ddb" stroke-width="2.6" stroke-linecap="round"/><polygon points="214,144 202.2,140.6 209.6,132.5" fill="#b39ddb"/><circle cx="155" cy="173.5" r="5" fill="#7fc8f8" fill-opacity="0.9"/><text x="165" y="178" font-size="13" text-anchor="start" fill="currentColor">対角線 u + v</text><circle cx="155" cy="192.5" r="5" fill="#b39ddb" fill-opacity="0.9"/><text x="165" y="197" font-size="13" text-anchor="start" fill="currentColor">対角線 u − v</text></svg>'
        hints:
          - "||u + v||² と ||u − v||² を、それぞれ内積でてんかいします。"
          - text: てんかいした 2 つの式を、たてにそろえて書きました。むらさきの部分を見ます。
            svg: '<svg viewBox="0 0 320 92" xmlns="http://www.w3.org/2000/svg"><text x="104" y="36" font-size="15" text-anchor="end" fill="currentColor">||u + v||² =</text><text x="144" y="36" font-size="15" text-anchor="middle" fill="currentColor">||u||²</text><rect x="174" y="18" width="70" height="26" rx="8" fill="#b39ddb" fill-opacity="0.5"/><text x="209" y="36" font-size="15" text-anchor="middle" fill="currentColor">+ 2⟨u, v⟩</text><text x="280" y="36" font-size="15" text-anchor="middle" fill="currentColor">+ ||v||²</text><text x="104" y="76" font-size="15" text-anchor="end" fill="currentColor">||u − v||² =</text><text x="144" y="76" font-size="15" text-anchor="middle" fill="currentColor">||u||²</text><rect x="174" y="58" width="70" height="26" rx="8" fill="#b39ddb" fill-opacity="0.5"/><text x="209" y="76" font-size="15" text-anchor="middle" fill="currentColor">− 2⟨u, v⟩</text><text x="280" y="76" font-size="15" text-anchor="middle" fill="currentColor">+ ||v||²</text></svg>'
          - 2 つの式を足すと、どの部分が残るかを見ます。
        paths:
          - ["||u + v||² = ||u||² + 2⟨u, v⟩ + ||v||²", "||u − v||² = ||u||² − 2⟨u, v⟩ + ||v||²", "足すと 2⟨u, v⟩ が消える"]
          - [図：平行四辺形の 2 本の対角線, 長方形なら三平方で、2 本とも ||u||² + ||v||², "ふつうは ⟨u, v⟩ のずれが + と − で打ち消し合う"]
        explain: 「||u + v||² = ⟨u + v, u + v⟩ = ||u||² + 2⟨u, v⟩ + ||v||²、||u − v||² = ||u||² − 2⟨u, v⟩ + ||v||²。2 つを足すと ±2⟨u, v⟩ が打ち消して、2||u||² + 2||v||²。」と書ければよい。① 2 本の対角線の長さの 2 乗をてんかい、② 足すと 2⟨u, v⟩ が消える。図では、平行四辺形の 2 本の対角線の長さの 2 乗の和が、4 つの辺の長さの 2 乗の和に等しいということです。子どもには、u = (1, 0)、v = (1, 1) でたしかめさせます。

