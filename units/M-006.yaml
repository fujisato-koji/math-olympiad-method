  - day: 5
    items:
      - part: 見本
        id: "9ab5d3d8f4"
        text: "ユニタリ行列 U は、U†U = UU† = I をみたすふくそすうの行列です。U† は、U を転置して、各成分のふくそきょうやくをとった行列です（図の上）。\nだから U⁻¹ = U†。ユニタリ行列も、長さと内積を変えません。\nUv = λv となる 0 でないベクトル v があるとき、数 λ を U のこゆうちといいます。対角行列では、対角にならぶ数がこゆうちです。\nユニタリ行列のこゆうちは、ぜったいちが 1 のふくそすうです（図の下：半径 1 の円の上）。"
        svg: '<svg viewBox="0 0 320 204" xmlns="http://www.w3.org/2000/svg"><path d="M52 16 Q44 44 52 72" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M116 16 Q124 44 116 72" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="69" y="37.8" font-size="16" text-anchor="middle" fill="currentColor">i</text><text x="99" y="37.8" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="69" y="61.8" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="99" y="61.8" font-size="16" text-anchor="middle" fill="currentColor">−1</text><text x="38" y="50" font-size="16" text-anchor="end" fill="currentColor">U =</text><line x1="126" y1="44" x2="176.5" y2="44" stroke="#b39ddb" stroke-width="2.4" stroke-linecap="round"/><polygon points="186,44 175,49.5 175,38.5" fill="#b39ddb"/><text x="156" y="32" font-size="12" text-anchor="middle" fill="currentColor">転置して共役</text><path d="M234 16 Q226 44 234 72" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M298 16 Q306 44 298 72" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="251" y="37.8" font-size="16" text-anchor="middle" fill="currentColor">−i</text><text x="281" y="37.8" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="251" y="61.8" font-size="16" text-anchor="middle" fill="currentColor">0</text><text x="281" y="61.8" font-size="16" text-anchor="middle" fill="currentColor">−1</text><text x="220" y="50" font-size="16" text-anchor="end" fill="currentColor">U† =</text><line x1="27.8" y1="146" x2="132.2" y2="146" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><polygon points="138.2,146 129.2,141.5 129.2,150.5" fill="currentColor" fill-opacity="1"/><line x1="80" y1="198.2" x2="80" y2="93.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><polygon points="80,87.8 75.5,96.8 84.5,96.8" fill="currentColor" fill-opacity="1"/><circle cx="80" cy="146" r="36" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="80" cy="110" r="6" fill="#f3c969" fill-opacity="1" stroke="currentColor" stroke-width="1"/><circle cx="44" cy="146" r="6" fill="#f3c969" fill-opacity="1" stroke="currentColor" stroke-width="1"/><text x="88" y="104" font-size="14" text-anchor="start" font-style="italic" fill="currentColor">i</text><text x="40" y="138" font-size="14" text-anchor="end" fill="currentColor">−1</text><text x="150" y="132" font-size="14" text-anchor="start" fill="currentColor">U のこゆうち：i と −1</text><text x="150" y="156" font-size="13" text-anchor="start" fill="currentColor">どちらも半径 1 の円の上</text><text x="150" y="178" font-size="13" text-anchor="start" fill="currentColor">（ぜったいち 1）</text></svg>'
        explain: "実数の直交行列を、ふくそすうに広げたものがユニタリ行列です。\nU†U の成分は、U の列どうしの内積です。ふくそすうのベクトルの内積は ⟨u, v⟩ = (u₁ の共役) × v₁ + (u₂ の共役) × v₂ のように、左の成分に共役をとります（z の共役 × z = |z|²）。\n例（図）：U = (i 0；0 −1) なら U† = (−i 0；0 −1)。U†U の左上は (−i) × i = 1、右下は (−1) × (−1) = 1 で、U†U = I。こゆうちは i と −1 で、どちらもぜったいちが 1 です。"
        note: U†U=I。U⁻¹=U†。固有値の絶対値は 1。
