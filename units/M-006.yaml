# M-006 内積空間
#
# 段 6・水準 3・8 日。前提は M-004（行列式）。
# 内積とノルム、直交と正規直交基底、グラム–シュミット、直交行列、ユニタリ行列を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。

id: M-006
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          内積：u = (u₁, u₂)、v = (v₁, v₂) のとき、⟨u, v⟩ = u₁v₁ + u₂v₂。
          ノルム：||u|| = √⟨u, u⟩。ベクトルの長さです。
          u と v が直交するのは、⟨u, v⟩ = 0 のとき。
          コーシー・シュワルツの不等式：|⟨u, v⟩| ≦ ||u|| ||v||。
        explain: |-
          内積は、2 つのベクトルの「同じ向きの成分」の積の和です。
          例：u=(1,2)、v=(3,4) なら、⟨u,v⟩ = 1×3 + 2×4 = 11。
          ||u|| = √(1+4) = √5。⟨u,v⟩=0 なら直交します。
        note: ⟨u,v⟩ = Σuᵢvᵢ。||u|| = √⟨u,u⟩。直交は内積 0。
      - part: 思い出す
        text: u = (1, 2)、v = (3, 4) の内積はいくつですか。
        choices: [7, 10, 11, 14]
        answer: 11
        check: "1 * 3 + 2 * 4"
        hints:
          - 内積は成分ごとの積の和です。
          - 1×3 + 2×4 を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1×3 + 2×4 = 11]
      - part: 今日
        text: u = (3, 4) のノルムはいくつですか。
        choices: [3, 4, 5, 7]
        answer: 5
        check: "f'{(3 ** 2 + 4 ** 2) ** 0.5:.0f}'"
        hints:
          - "||u|| = √(3²+4²) です。"
          - 9 + 16 = 25 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - ["||u|| = √25", 5]
      - part: 今日
        text: u = (1, 0)、v = (0, 1) は直交しますか。
        choices: ["直交する", "直交しない", "平行", "同じ"]
        answer: "直交する"
        check: "'直交する'"
        hints:
          - 直交は内積 0 です。
          - 1×0 + 0×1 = 0 です。
          - 直交します。
        paths:
          - [内積 0, 直交]
      - part: 挑戦
        text: u = (1, 2)、v = (2, −1) の内積はいくつですか。
        choices: [−4, 0, 3, 4]
        answer: 0
        check: "1 * 2 + 2 * (-1)"
        hints:
          - 1×2 + 2×(−1) を計算します。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1×2 + 2×(−1), 0]
    extra:
      - part: 今日
        text: u = (2, 1) のノルムはどれですか。
        choices: ["√3", "√5", "3", "5"]
        answer: "√5"
        check: "'√5'"
        hints:
          - "||u|| = √(2²+1²) です。"
          - 4 + 1 = 5 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [√(4+1), √5]
      - part: 今日
        text: コーシー・シュワルツの不等式はどれですか。
        choices: ["|⟨u,v⟩| ≦ ||u|| ||v||", "⟨u,v⟩ = ||u|| ||v||", "|⟨u,v⟩| ≧ ||u|| ||v||", "⟨u,v⟩ ≦ 0"]
        answer: "|⟨u,v⟩| ≦ ||u|| ||v||"
        check: "'|⟨u,v⟩| ≦ ||u|| ||v||'"
        hints:
          - 内積の大きさは、2 つの長さの積をこえません。
          - 等号は平行なときです。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [内積 ≦ 長さの積, 等号は平行]
      - part: わけ
        text: ベクトル u と v が直交するとき、||u+v||² = ||u||² + ||v||² になるわけを説明しましょう。
        explain: 「||u+v||² = ⟨u+v,u+v⟩ = ⟨u,u⟩ + 2⟨u,v⟩ + ⟨v,v⟩。直交するので ⟨u,v⟩=0。よって ||u+v||² = ||u||² + ||v||²。三平方の定理と同じ形です。」と書ければよい。① 内積を展開、② 直交で交差項 0、③ 三平方。子どもには、(1,0) と (0,1) で確かめさせます。
        hints:
          - "||u+v||² を内積で展開します。"
          - 直交するので ⟨u,v⟩ = 0 です。
          - "||u||² + ||v||² になります。"
        paths:
          - [展開, ⟨u,v⟩=0, "||u||²+||v||²"]

  - day: 2
    items:
      - part: 見本
        text: |-
          ベクトルの組が直交するとは、どの 2 つをとっても内積が 0 になることです。
          正規直交基底は、どの 2 つも直交し、それぞれのノルムが 1 の基底です。
          標準基底 (1,0)、(0,1) は正規直交基底です。
          正規直交基底 e₁、e₂ を使うと、u = ⟨u,e₁⟩e₁ + ⟨u,e₂⟩e₂ と書けます。
        explain: |-
          直交基底は、互いに垂直なベクトルの組。正規直交は、さらに長さが 1。
          (1,0)、(0,1) は内積 0、ノルム 1 です。
          (1,1)、(1,−1) は直交しますが、ノルム √2 なので、正規化すると 1/√2 倍します。
        note: 直交は内積 0。正規直交は長さも 1。標準基底は正規直交。
      - part: 思い出す
        text: ベクトル u = (1, 1) を正規化するとどれですか。
        choices: ["(1, 1)", "(1/2, 1/2)", "(1/√2, 1/√2)", "(√2, √2)"]
        answer: "(1/√2, 1/√2)"
        check: "'(1/√2, 1/√2)'"
        hints:
          - 正規化は、ノルムでわります。
          - "||(1,1)|| = √2 です。"
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [ノルム √2, 1/√2 倍, (1/√2, 1/√2)]
      - part: 今日
        text: (1, 1) と (1, −1) は直交しますか。
        choices: ["直交する", "直交しない", "平行", "同じ"]
        answer: "直交する"
        check: "'直交する'"
        hints:
          - 内積を計算します。
          - 1×1 + 1×(−1) = 0 です。
          - 直交します。
        paths:
          - [内積 1−1=0, 直交]
      - part: 今日
        text: (1, 1) と (1, −1) を正規化した正規直交基底はどれですか。
        choices: ["(1,1)、(1,−1)", "(1/√2,1/√2)、(1/√2,−1/√2)", "(1/2,1/2)、(1/2,−1/2)", "(1,0)、(0,1)"]
        answer: "(1/√2,1/√2)、(1/√2,−1/√2)"
        check: "'(1/√2,1/√2)、(1/√2,−1/√2)'"
        hints:
          - どちらもノルム √2 です。
          - 1/√2 倍します。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [ノルム √2, 1/√2 倍, 正規直交]
      - part: 挑戦
        text: 正規直交基底 e₁、e₂ で、u = (3, 4) の e₁ 成分はどれですか。
        choices: ["3", "4", "5", "7"]
        answer: 3
        check: "3"
        hints:
          - e₁ = (1,0) です。
          - 成分は内積 ⟨u,e₁⟩ です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [e₁=(1,0), ⟨u,e₁⟩=3]
    extra:
      - part: 今日
        text: 標準基底 (1,0)、(0,1) は正規直交基底ですか。
        choices: ["はい", "いいえ", "直交するが正規でない", "正規だが直交しない"]
        answer: "はい"
        check: "'はい'"
        hints:
          - 内積は 0、ノルムは 1 です。
          - 正規直交の条件を満たします。
          - はい。
        paths:
          - [内積 0、ノルム 1, 正規直交]
      - part: 今日
        text: 直交基底のベクトルのノルムは、必ず 1 ですか。
        choices: ["必ず 1", "1 とは限らない", "必ず 0", "必ず √2"]
        answer: "1 とは限らない"
        check: "'1 とは限らない'"
        hints:
          - 直交は内積 0 だけの条件です。
          - 長さは 1 でなくてもかまいません。
          - 1 とは限りません。
        paths:
          - [直交は内積 0, 長さは自由, 1 とは限らない]
      - part: わけ
        text: 正規直交基底 e₁、e₂ で u = ⟨u,e₁⟩e₁ + ⟨u,e₂⟩e₂ と書けるわけを説明しましょう。
        explain: 「u を e₁、e₂ の 1 次結合 u = a e₁ + b e₂ と書く。両辺と e₁ の内積をとると、⟨u,e₁⟩ = a⟨e₁,e₁⟩ + b⟨e₂,e₁⟩。正規直交なので ⟨e₁,e₁⟩=1、⟨e₂,e₁⟩=0。よって a=⟨u,e₁⟩。b も同じ。」と書ければよい。① 1 次結合、② 内積をとる、③ 正規直交の条件。子どもには、標準基底で確かめさせます。
        hints:
          - u = a e₁ + b e₂ と書きます。
          - 両辺と e₁ の内積をとります。
          - 正規直交なので a = ⟨u,e₁⟩ です。
        paths:
          - [1 次結合, 内積, 正規直交, a=⟨u,e₁⟩]

  - day: 3
    items:
      - part: 見本
        text: |-
          グラム–シュミット：1 次独立なベクトル u₁、u₂ から、直交するベクトルを作る方法です。
          v₁ = u₁。
          v₂ = u₂ − (⟨u₂, v₁⟩ / ⟨v₁, v₁⟩) v₁。
          v₂ は v₁ に垂直です。最後にそれぞれをノルムでわると、正規直交基底になります。
        explain: |-
          u₂ から、v₁ の方向の成分を引くと、v₁ に垂直な残りが出ます。
          係数 ⟨u₂,v₁⟩/⟨v₁,v₁⟩ は、u₂ の v₁ 方向の成分の割合です。
          例：u₁=(1,1)、u₂=(1,0)。v₁=(1,1)、v₂=(1,0) − (1/2)(1,1) = (1/2,−1/2)。
        note: v₂ = u₂ − (⟨u₂,v₁⟩/⟨v₁,v₁⟩)v₁。v₁ の方向の成分を引く。
      - part: 思い出す
        text: u = (2, 1)、v = (1, 0) の内積 ⟨u, v⟩ はいくつですか。
        choices: [1, 2, 3, 4]
        answer: 2
        check: "2 * 1 + 1 * 0"
        hints:
          - 内積は成分の積の和です。
          - 2×1 + 1×0 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [2×1 + 1×0 = 2]
      - part: 今日
        text: u₁ = (1, 1)、u₂ = (1, 0) のとき、グラム–シュミットの v₂ はどれですか。
        choices: ["(1/2, −1/2)", "(1/2, 1/2)", "(1, −1)", "(0, 1)"]
        answer: "(1/2, −1/2)"
        check: "'(1/2, −1/2)'"
        hints:
          - v₁ = (1,1) です。
          - ⟨u₂,v₁⟩=1、⟨v₁,v₁⟩=2 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [v₁=(1,1), 係数 1/2, v₂=(1/2,−1/2)]
      - part: 今日
        text: グラム–シュミットで作った v₂ は、v₁ とどうなっていますか。
        choices: ["直交する", "平行になる", "同じになる", "0 になる"]
        answer: "直交する"
        check: "'直交する'"
        hints:
          - v₁ の方向の成分を引きました。
          - 残りは v₁ に垂直です。
          - 直交します。
        paths:
          - [v₁ の成分を引く, 残りは垂直, 直交]
      - part: 挑戦
        text: u₁ = (1, 0)、u₂ = (1, 1) のとき、グラム–シュミットの v₂ はどれですか。
        choices: ["(0, 1)", "(1, 0)", "(1, 1)", "(0, 0)"]
        answer: "(0, 1)"
        check: "'(0, 1)'"
        hints:
          - v₁ = (1,0) です。
          - ⟨u₂,v₁⟩=1、⟨v₁,v₁⟩=1 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [v₁=(1,0), 係数 1, v₂=(0,1)]
    extra:
      - part: 今日
        text: グラム–シュミットの最初のベクトル v₁ はどれですか。
        choices: ["u₁", "u₂", "0", "u₁+u₂"]
        answer: "u₁"
        check: "'u₁'"
        hints:
          - 最初はそのまま使います。
          - ここまでの考えを、自分の言葉でまとめましょう。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [v₁ = u₁]
      - part: 今日
        text: グラム–シュミットで最後にノルムでわるのは、何のためですか。
        choices: ["正規化するため", "直交させるため", "0 にするため", "長さを 2 倍するため"]
        answer: "正規化するため"
        check: "'正規化するため'"
        hints:
          - 直交はすでにできています。
          - 長さを 1 にします。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [直交はできている, 長さ 1, 正規化]
      - part: わけ
        text: グラム–シュミットの v₂ = u₂ − (⟨u₂,v₁⟩/⟨v₁,v₁⟩)v₁ が v₁ と直交するわけを説明しましょう。
        explain: 「v₂ と v₁ の内積をとると、⟨u₂,v₁⟩ − (⟨u₂,v₁⟩/⟨v₁,v₁⟩)⟨v₁,v₁⟩ = ⟨u₂,v₁⟩ − ⟨u₂,v₁⟩ = 0。だから v₂ は v₁ と直交する。」と書ければよい。① 内積をとる、② 係数が打ち消す、③ 0。子どもには、具体例で確かめさせます。
        hints:
          - v₂ と v₁ の内積をとります。
          - 係数の部分が ⟨v₁,v₁⟩ と打ち消し合います。
          - 0 になります。
        paths:
          - [内積, 係数が打ち消す, 0, 直交]

  - day: 4
    items:
      - part: 見本
        text: |-
          直交行列 Q は、Qᵀ Q = Q Qᵀ = I を満たす行列です。Q⁻¹ = Qᵀ。
          直交行列は、ベクトルの長さと内積を変えません。||Q u|| = ||u||、⟨Qu,Qv⟩ = ⟨u,v⟩。
          回転行列 (cos θ −sin θ；sin θ cos θ) は直交行列で、det = 1。
          鏡映行列 (1 0；0 −1) も直交行列で、det = −1。
        explain: |-
          直交行列の列は、正規直交基底です。
          回転は向きを保つので det = 1。鏡映は向きを反転するので det = −1。
          例：(0 −1；1 0) は 90° 回転で、det = 0×0 − (−1)×1 = 1。
        note: QᵀQ=I。長さと内積を保つ。det は ±1。回転 det=1、鏡映 det=−1。
      - part: 思い出す
        text: 直交行列 Q の逆行列はどれですか。
        choices: ["Q", "Qᵀ", "−Q", "Q²"]
        answer: "Qᵀ"
        check: "'Qᵀ'"
        hints:
          - Qᵀ Q = I です。
          - 逆行列は Qᵀ です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [QᵀQ=I, Q⁻¹=Qᵀ]
      - part: 今日
        text: 回転行列の行列式はいくつですか。
        choices: [−1, 0, 1, 2]
        answer: 1
        check: "1"
        hints:
          - 回転は向きを保ちます。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [回転は向きを保つ, det=1]
      - part: 今日
        text: 鏡映行列 (1 0；0 −1) の行列式はいくつですか。
        choices: [−1, 0, 1, 2]
        answer: −1
        check: "'−1'"
        hints:
          - det = 1×(−1) − 0×0 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1×(−1), −1]
      - part: 挑戦
        text: 直交行列 Q でベクトル u を移すと、||Q u|| はどうなりますか。
        choices: ["||u|| のまま", "2||u||", "||u||/2", "0"]
        answer: "||u|| のまま"
        check: "'||u|| のまま'"
        hints:
          - 直交行列は長さを変えません。
          - "||Qu|| = ||u|| です。"
          - そのままです。
        paths:
          - [長さを保つ, "||Qu||=||u||"]
    extra:
      - part: 今日
        text: 直交行列の列は、どんな基底ですか。
        choices: ["正規直交基底", "直交基底だが正規でない", "1 次従属", "零ベクトル"]
        answer: "正規直交基底"
        check: "'正規直交基底'"
        hints:
          - QᵀQ=I の成分を見ます。
          - 列の内積が 0、ノルムが 1 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [QᵀQ=I, 列の内積 0、ノルム 1, 正規直交]
      - part: 今日
        text: 直交行列の行列式は、どんな値ですか。
        choices: ["±1", "0", "2", "任意の実数"]
        answer: "±1"
        check: "'±1'"
        hints:
          - det(QᵀQ)=det I です。
          - det(Q)²=1 です。
          - ここまでの考えを、自分の言葉でまとめましょう。
        paths:
          - [det(QᵀQ)=1, det(Q)²=1, ±1]
      - part: わけ
        text: 直交行列がベクトルの長さを保つわけを説明しましょう。
        explain: 「||Q u||² = ⟨Qu,Qu⟩ = (Qu)ᵀ(Qu) = uᵀQᵀQ u。QᵀQ=I なので、= uᵀu = ||u||²。長さの 2 乗が等しいので、長さも等しい。」と書ければよい。① ノルムの 2 乗、② QᵀQ=I、③ ||u||²。子どもには、回転で確かめさせます。
        hints:
          - "||Qu||² を内積で書きます。"
          - QᵀQ = I です。
          - uᵀu = ||u||² になります。
        paths:
          - ["||Qu||²", "QᵀQ=I", "||u||²"]

  - day: 5
    items:
      - part: 見本
        text: |-
          ユニタリ行列 U は、U† U = U U† = I を満たす複素行列です。U† は転置して複素共役をとった行列。
          U⁻¹ = U†。ユニタリ行列も、長さと内積を保ちます。
          ユニタリ行列の固有値は、絶対値 1 の複素数です。
          例：U = (i 0；0 1) はユニタリ行列。固有値は i と 1 で、どちらも絶対値 1。
        explain: |-
          実数の直交行列を複素数に広げたものがユニタリ行列です。
          U†U=I は、列が正規直交基底であることと同じ。
          固有値が e^{iθ} の形になるので、絶対値は 1 です。
        note: U†U=I。U⁻¹=U†。固有値の絶対値は 1。
      - part: 思い出す
        text: ユニタリ行列 U の逆行列はどれですか。
        choices: ["U", "U†", "−U", "U²"]
        answer: "U†"
