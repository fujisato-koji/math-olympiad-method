      - part: 見本
        id: "214c83eea4"
        text: "どの 2 つをとっても内積が 0 になるベクトルの組を、直交する組といいます。\n長さを 1 にそろえること（ノルムでわること）を、せいきかといいます。\nせいきちょっこうきていは、どの 2 つも直交し、どれもノルムが 1 のきていです。ひょうじゅんきてい (1, 0)、(0, 1) もその 1 つです。\nせいきちょっこうきてい e₁、e₂ を使うと、u = ⟨u, e₁⟩e₁ + ⟨u, e₂⟩e₂ と書けます（図）。"
        svg: '<svg viewBox="0 0 320 205" xmlns="http://www.w3.org/2000/svg"><circle cx="112" cy="150" r="48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="87.1" y1="164.4" x2="236.7" y2="78" stroke="#c8ccd6" stroke-width="1.4" stroke-linecap="round"/><line x1="131.2" y1="183.3" x2="61.6" y2="62.7" stroke="#c8ccd6" stroke-width="1.4" stroke-linecap="round"/><line x1="175.8" y1="30" x2="211.8" y2="92.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="175.8" y1="30" x2="76" y2="87.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="120.7,145 115.7,136.3 107,141.3" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="112" y1="150" x2="171.3" y2="38.4" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="175.8,30 175.5,42.3 165.7,37.2" fill="#7fc8f8"/><text x="181.8" y="28" font-size="15" text-anchor="start" font-style="italic" fill="currentColor">u</text><line x1="112" y1="150" x2="145.3" y2="130.8" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="153.6,126 146.8,136.3 141.3,126.7" fill="#f08080"/><text x="157.6" y="140" font-size="14" text-anchor="start" fill="currentColor">e₁</text><line x1="112" y1="150" x2="92.8" y2="116.7" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="88,108.4 98.3,115.2 88.7,120.7" fill="#7bc96f"/><text x="82" y="120.4" font-size="14" text-anchor="end" fill="currentColor">e₂</text><circle cx="211.8" cy="92.4" r="4" fill="#f08080" fill-opacity="1" stroke="currentColor" stroke-width="1"/><circle cx="76" cy="87.6" r="4" fill="#7bc96f" fill-opacity="1" stroke="currentColor" stroke-width="1"/><text x="219.8" y="104.4" font-size="13" text-anchor="start" fill="currentColor">⟨u, e₁⟩</text><text x="68" y="83.6" font-size="13" text-anchor="end" fill="currentColor">⟨u, e₂⟩</text><text x="204" y="132" font-size="13" text-anchor="start" fill="currentColor">e₁、e₂ は</text><text x="204" y="150" font-size="13" text-anchor="start" fill="currentColor">長さ 1 で直角</text><text x="204" y="176" font-size="13" text-anchor="start" fill="currentColor">u = ⟨u, e₁⟩e₁</text><text x="214" y="196" font-size="13" text-anchor="start" fill="currentColor">+ ⟨u, e₂⟩e₂</text></svg>'
        explain: "ちょっこうきていは、たがいにすいちょくなベクトルの組。せいきちょっこうきていは、さらにどれも長さが 1。\n図の e₁、e₂ は、半径 1 の円の上にあって直角です。u の先から e₁ の直線にすいちょくに下ろした足までの長さが ⟨u, e₁⟩ です。\n例：(3, 4) はノルムが 5 なので、せいきかすると (3/5, 4/5) です。"
        note: 直交は内積 0。正規直交は長さも 1。標準基底は正規直交。
