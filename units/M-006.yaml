        text: "直交行列 Q は、QᵀQ = QQᵀ = I をみたす行列です。だから Q⁻¹ = Qᵀ。\n直交行列は、ベクトルの長さと内積を変えません。||Qu|| = ||u||、⟨Qu, Qv⟩ = ⟨u, v⟩。図の正方形は、形も大きさもそのままです。\n回転（左）とうら返し（鏡映、右）は直交行列です。赤から緑へ回る向きは、回転ではそのまま、うら返しでは反対になります。"
