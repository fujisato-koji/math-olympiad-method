# M-006 内積空間
#
# 水準 3・8 日。前提は M-004（行列式）。内積とノルム、直交と正規直交基底、グラム–シュミット、直交行列、ユニタリ行列を学ぶ。
# 子の画面には text、svg、choices、ヒントと、見本の explain、わけの paths の 1 本目を出す。answer、check、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる（答えの点や矢印は図にかかない）。
# 書き方：ベクトルは (1, 2)、内積は ⟨u, v⟩、ノルムは ||u||。行列は M-002、M-004 と同じく、文の中では (a b；c d)、図ではかっこでくくった形。
# 図とイラストの多い形に直した（D-131、直す係 3）。座標平面の矢印と直角の印、半径 1 の円、成分を色の帯でくくった表、
#   正方形が回る・裏返る絵、複素数平面の円を、見本と答える問題とヒントに付けた。
#   同じ問題のくり返し（D-191）は、数や場面を変えた新しい問題に作り直した（その問題は id を消した）。

id: M-006
days:
  - day: 1
    items:
      - part: 見本
        id: "14025516f2"
        text: |-
          内積：u = (u₁, u₂)、v = (v₁, v₂) のとき、⟨u, v⟩ = u₁v₁ + u₂v₂（同じ場所の成分の積の和）。
          ノルム：||u|| = √(⟨u, u⟩)。矢印 u の長さです（三平方の定理）。
          ⟨u, v⟩ = 0 のとき、u と v は直交する（直角に交わる）といいます。
          コーシー・シュワルツの不等式：|⟨u, v⟩| ≦ ||u|| ||v||。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="172" x2="30" y2="36" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="64" y1="172" x2="64" y2="36" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="98" y1="172" x2="98" y2="36" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="132" y1="172" x2="132" y2="36" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="166" y1="172" x2="166" y2="36" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="30" y1="172" x2="166" y2="172" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="30" y1="138" x2="166" y2="138" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="30" y1="104" x2="166" y2="104" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="30" y1="70" x2="166" y2="70" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="30" y1="36" x2="166" y2="36" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="19.8" y1="172" x2="175.3" y2="172" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="181.3,172 172.3,167.5 172.3,176.5" fill="currentColor" fill-opacity="1"/><line x1="30" y1="182.2" x2="30" y2="26.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="30,20.7 25.5,29.7 34.5,29.7" fill="currentColor" fill-opacity="1"/><text x="179.3" y="188" font-size="13" text-anchor="end" font-style="italic" fill="currentColor">x</text><text x="38" y="28.7" font-size="13" text-anchor="start" font-style="italic" fill="currentColor">y</text><text x="26" y="186" font-size="12" text-anchor="end" fill="currentColor">O</text><line x1="30" y1="172" x2="30" y2="70" stroke="#f08080" stroke-width="7" stroke-linecap="round" stroke-opacity="0.35"/><line x1="30" y1="70" x2="64" y2="70" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="30" y1="172" x2="61" y2="79" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="64,70 65.7,82.2 55.3,78.7" fill="#f08080"/><text x="70" y="66" font-size="14" text-anchor="start" fill="currentColor">u</text><line x1="30" y1="172" x2="123" y2="141" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="132,138 123.3,146.7 119.8,136.3" fill="#7bc96f"/><text x="138" y="134" font-size="14" text-anchor="start" fill="currentColor">v</text><text x="47" y="64" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor">1</text><text x="22" y="121" font-size="13" text-anchor="end" font-weight="bold" fill="currentColor">3</text><circle cx="199" cy="29.5" r="5" fill="#f08080" fill-opacity="0.9"/><text x="209" y="34" font-size="14" text-anchor="start" fill="currentColor">u = (1, 3)</text><circle cx="199" cy="53.5" r="5" fill="#7bc96f" fill-opacity="0.9"/><text x="209" y="58" font-size="14" text-anchor="start" fill="currentColor">v = (3, 1)</text><text x="194" y="90" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor">内積 ⟨u, v⟩</text><text x="200" y="112" font-size="14" text-anchor="start" fill="currentColor">= 1×3 + 3×1 = 6</text><text x="194" y="146" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor">ノルム ||u||</text><text x="200" y="168" font-size="14" text-anchor="start" fill="currentColor">= √(1² + 3²)</text><text x="200" y="190" font-size="14" text-anchor="start" fill="currentColor">= √10</text></svg>'
        explain: |-
          【定義】内積は、2 つのベクトルの同じ場所の成分をかけて足した数です。
          例（図）：u = (1, 3)、v = (3, 1) なら、⟨u, v⟩ = 1×3 + 3×1 = 6。
          ||u|| = √(1² + 3²) = √10。図の、横 1・たて 3 の直角三角形のななめの辺の長さです。
          ⟨u, v⟩ = ||u|| ||v|| cos θ（θ は u と v のあいだの角、G-027）なので、内積が 0 なら θ = 90° で、直交します。
        note: ⟨u,v⟩ = Σuᵢvᵢ。||u|| = √(⟨u,u⟩)。直交は内積 0。
