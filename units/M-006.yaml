-weight="bold" fill="currentColor">直交</text><text x="266" y="95" font-size="11" text-anchor="middle" fill="currentColor">内積が 0</text><line x1="246" y1="62" x2="280.9" y2="50.9" stroke="#f08080" stroke-width="2.4" stroke-linecap="round"/><polygon points="290,48 281.2,56.6 277.9,46.1" fill="#f08080"/><line x1="246" y1="62" x2="236.9" y2="33.1" stroke="#7bc96f" stroke-width="2.4" stroke-linecap="round"/><polygon points="234,24 242.6,32.8 232.1,36.1" fill="#7bc96f"/><polyline points="253.6,59.6 251.2,51.9 243.6,54.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="8" y="106" width="100" height="94" rx="10" fill="none" stroke="#c8ccd6" stroke-width="1.4"/><circle cx="20" cy="118" r="9" fill="#f3c969" fill-opacity="0.8"/><text x="20" y="122" font-size="11" text-anchor="middle" fill="currentColor">④</text><text x="58" y="180" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor">せいきか</text><text x="58" y="195" font-size="11" text-anchor="middle" fill="currentColor">長さを 1 に</text><circle cx="50" cy="152" r="22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="50" y1="152" x2="89.5" y2="132.2" stroke="#f08080" stroke-width="2.4" stroke-linecap="round"/><polygon points="98,128 90.6,137.8 85.7,128" fill="#f08080"/><circle cx="69.7" cy="142.2" r="4" fill="#f3c969" fill-opacity="1" stroke="currentColor" stroke-width="1"/><rect x="112" y="106" width="100" height="94" rx="10" fill="none" stroke="#c8ccd6" stroke-width="1.4"/><circle cx="124" cy="118" r="9" fill="#f3c969" fill-opacity="0.8"/><text x="124" y="122" font-size="11" text-anchor="middle" fill="currentColor">⑤</text><text x="162" y="180" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor">グラム–シュミット</text><text x="162" y="195" font-size="11" text-anchor="middle" fill="currentColor">向きの部分を引く</text><line x1="138" y1="164" x2="202" y2="132" stroke="#c8ccd6" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="142" y1="162" x2="173.5" y2="146.2" stroke="#f08080" stroke-width="2.4" stroke-linecap="round"/><polygon points="182,142 174.6,151.8 169.7,142" fill="#f08080"/><line x1="142" y1="162" x2="152.9" y2="131" stroke="#7fc8f8" stroke-width="2.4" stroke-linecap="round"/><polygon points="156,122 157.6,134.2 147.2,130.6" fill="#7fc8f8"/><line x1="156" y1="122" x2="169.2" y2="148.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="216" y="106" width="100" height="94" rx="10" fill="none" stroke="#c8ccd6" stroke-width="1.4"/><circle cx="228" cy="118" r="9" fill="#f3c969" fill-opacity="0.8"/><text x="228" y="122" font-size="11" text-anchor="middle" fill="currentColor">⑥</text><text x="266" y="180" font-size="13" text-anchor="middle" font-weight="bold" fill="currentColor">直交・ユニタリ</text><text x="266" y="195" font-size="11" text-anchor="middle" fill="currentColor">長さそのまま</text><polygon points="250,164 280,164 280,134 250,134" fill="#7fc8f8" fill-opacity="0.15" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3"/><polygon points="250,164 276.5,149.9 262.4,123.4 235.9,137.5" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>'
        explain: "例：u = (1, 3)、v = (−3, 1) は内積 −3 + 3 = 0 で直交。||u|| = √10 で、せいきかすると (1/√10, 3/√10)。\nu₁ = (1, 2)、u₂ = (3, 1) なら、グラム–シュミットで v₂ = (2, −1)。\n(3/5 −4/5；4/5 3/5) は直交行列で、det = 9/25 + 16/25 = 1（回転）。"
        note: 内積→ノルム→直交→正規化→直交・ユニタリの順。
      - part: 今日
