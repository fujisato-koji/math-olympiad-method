        id: "ae892e5f2b"
        text: ベクトル u と v が直交するとき、||u + v||² = ||u||² + ||v||² になるわけを説明しましょう。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><polygon points="150,175 240,145 210,55 120,85" fill="#7fc8f8" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 3"/><line x1="150" y1="175" x2="231" y2="148" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="240,145 231.3,153.7 227.8,143.3" fill="#f08080"/><text x="246" y="149" font-size="14" text-anchor="start" font-style="italic" fill="currentColor">u</text><line x1="150" y1="175" x2="123" y2="94" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="120,85 128.7,93.7 118.3,97.2" fill="#7bc96f"/><text x="112" y="81" font-size="14" text-anchor="end" font-style="italic" fill="currentColor">v</text><line x1="150" y1="175" x2="205.8" y2="63.5" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="210,55 210,67.3 200.2,62.4" fill="#7fc8f8"/><text x="216" y="51" font-size="14" text-anchor="start" font-style="italic" fill="currentColor">u + v</text><polyline points="160.4,171.5 157,161.1 146.5,164.6" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="160" y="22" font-size="13" text-anchor="middle" fill="currentColor">直交する u、v と、対角線の u + v</text></svg>'
        hints:
          - "||u + v||² = ⟨u + v, u + v⟩ と書いて、かっこをひらきます。"
          - text: ひらくと 4 つの内積が出ます。むらさきの 2 つに、直交のじょうけんを使います。
            svg: '<svg viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg"><text x="150" y="24" font-size="15" text-anchor="middle" font-style="italic" fill="currentColor">u</text><text x="230" y="24" font-size="15" text-anchor="middle" font-style="italic" fill="currentColor">v</text><text x="98" y="56" font-size="15" text-anchor="end" font-style="italic" fill="currentColor">u</text><text x="98" y="90" font-size="15" text-anchor="end" font-style="italic" fill="currentColor">v</text><rect x="112" y="36" width="76" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="150" y="56" font-size="14" text-anchor="middle" fill="currentColor">⟨u, u⟩</text><rect x="192" y="36" width="76" height="30" rx="6" fill="#b39ddb" fill-opacity="0.5" stroke="currentColor" stroke-width="1.2"/><text x="230" y="56" font-size="14" text-anchor="middle" fill="currentColor">⟨u, v⟩</text><rect x="112" y="70" width="76" height="30" rx="6" fill="#b39ddb" fill-opacity="0.5" stroke="currentColor" stroke-width="1.2"/><text x="150" y="90" font-size="14" text-anchor="middle" fill="currentColor">⟨v, u⟩</text><rect x="192" y="70" width="76" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="230" y="90" font-size="14" text-anchor="middle" fill="currentColor">⟨v, v⟩</text><text x="160" y="128" font-size="13" text-anchor="middle" fill="currentColor">||u + v||² は、この 4 つの和</text></svg>'
          - 残った 2 つが、||u||² と ||v||² になっているかを見ます。
        paths:
          - ["⟨u + v, u + v⟩ をてんかい", "⟨u, v⟩ = 0 でまん中が消える", "||u||² + ||v||²"]
          - [図：u と v を 2 辺とする長方形, u + v は対角線, 三平方の定理]
        explain: 「||u + v||² = ⟨u + v, u + v⟩ = ⟨u, u⟩ + 2⟨u, v⟩ + ⟨v, v⟩。直交するので ⟨u, v⟩ = 0。よって ||u + v||² = ||u||² + ||v||²。図の長方形の対角線で、三平方の定理と同じ形です。」と書ければよい。① 内積をてんかい、② 直交でまん中の 2⟨u, v⟩ が 0、③ 三平方。子どもには、(1, 0) と (0, 1) でたしかめさせます。

