          - ["⟨v₂, v₁⟩ を計算", "係数と ⟨v₁, v₁⟩ が約分される", "⟨u₂, v₁⟩ − ⟨u₂, v₁⟩ = 0", 直交する]
          - [図：u₂ の先から v₁ の直線にすいちょくに下ろした足を引く, 残りは、足から u₂ の先への矢印と同じ, それは v₁ にすいちょく]
        explain: 「v₂ と v₁ の内積をとると、⟨u₂, v₁⟩ − (⟨u₂, v₁⟩ / ⟨v₁, v₁⟩)⟨v₁, v₁⟩ = ⟨u₂, v₁⟩ − ⟨u₂, v₁⟩ = 0。だから v₂ は v₁ と直交する。」と書ければよい。① 内積をとる、② 係数が打ち消す、③ 0。子どもには、具体例でたしかめさせます。

