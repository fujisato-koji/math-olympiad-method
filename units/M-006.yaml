            svg: '<svg viewBox="0 0 320 104" xmlns="http://www.w3.org/2000/svg"><text x="160" y="30" font-size="16" text-anchor="middle" fill="currentColor">⟨u, e₁⟩ = a⟨e₁, e₁⟩ + b⟨e₂, e₁⟩</text><rect x="150" y="42" width="70" height="26" rx="8" fill="#b39ddb" fill-opacity="0.5"/><text x="185" y="60" font-size="13" text-anchor="middle" fill="currentColor">長さ 1</text><rect x="232" y="42" width="70" height="26" rx="8" fill="#b39ddb" fill-opacity="0.5"/><text x="267" y="60" font-size="13" text-anchor="middle" fill="currentColor">直交</text><text x="185" y="90" font-size="13" text-anchor="middle" fill="currentColor">⟨e₁, e₁⟩ = ?</text><text x="267" y="90" font-size="13" text-anchor="middle" fill="currentColor">⟨e₂, e₁⟩ = ?</text></svg>'
          - 残った式から、a が何の内積になるかを読みます。
        paths:
          - [u = a e₁ + b e₂, e₁ との内積をとる, "⟨e₁, e₁⟩ = 1、⟨e₂, e₁⟩ = 0", "a = ⟨u, e₁⟩"]
          - [図：u の先から e₁ の直線にすいちょくに下ろす, 足までの長さが a, "それは ||u|| cos θ = ⟨u, e₁⟩"]
        explain: 「u を e₁、e₂ の 1 次結合 u = a e₁ + b e₂ と書く。両辺と e₁ の内積をとると、⟨u, e₁⟩ = a⟨e₁, e₁⟩ + b⟨e₂, e₁⟩。せいきちょっこうなので ⟨e₁, e₁⟩ = 1、⟨e₂, e₁⟩ = 0。よって a = ⟨u, e₁⟩。b も同じ。」と書ければよい。① 1 次結合、② 内積をとる、③ せいきちょっこうのじょうけん。子どもには、ひょうじゅんきていでたしかめさせます。

  - day: 3
    items:
      - part: 見本
        id: "f6bf9bf0dc"
        text: "グラム–シュミット：1 次どくりつなベクトル u₁、u₂ から、直交するベクトルを作る方法です（図）。\n① v₁ = u₁。\n② v₂ = u₂ − (⟨u₂, v₁⟩ / ⟨v₁, v₁⟩) v₁。u₂ から、v₁ の向きの部分を引きます。\n③ v₂ は v₁ にすいちょくです。最後にそれぞれをノルムでわると、せいきちょっこうきていになります。"
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><line x1="56" y1="166" x2="56" y2="58" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="92" y1="166" x2="92" y2="58" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="128" y1="166" x2="128" y2="58" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="164" y1="166" x2="164" y2="58" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="56" y1="166" x2="164" y2="166" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="56" y1="130" x2="164" y2="130" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="56" y1="94" x2="164" y2="94" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="56" y1="58" x2="164" y2="58" stroke="#c8ccd6" stroke-width="1" stroke-linecap="round"/><line x1="45.2" y1="130" x2="174.2" y2="130" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="180.2,130 171.2,125.5 171.2,134.5" fill="currentColor" fill-opacity="1"/><line x1="56" y1="176.8" x2="56" y2="47.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><polygon points="56,41.8 51.5,50.8 60.5,50.8" fill="currentColor" fill-opacity="1"/><text x="178.2" y="146" font-size="13" text-anchor="end" font-style="italic" fill="currentColor">x</text><text x="64" y="49.8" font-size="13" text-anchor="start" font-style="italic" fill="currentColor">y</text><text x="52" y="144" font-size="12" text-anchor="end" fill="currentColor">O</text><line x1="45.2" y1="151.6" x2="108.2" y2="25.6" stroke="#c8ccd6" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="164" y1="94" x2="92" y2="58" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="88,66 96,70.1 100,62" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="56" y1="130" x2="87.8" y2="66.5" stroke="#f08080" stroke-width="3" stroke-linecap="round"/><polygon points="92,58 92,70.3 82.2,65.4" fill="#f08080"/><text x="110" y="50" font-size="14" text-anchor="start" fill="currentColor">u₁ = v₁</text><line x1="56" y1="130" x2="155" y2="97" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="164,94 155.3,102.7 151.8,92.3" fill="#7fc8f8"/><text x="170" y="100" font-size="14" text-anchor="start" fill="currentColor">u₂</text><line x1="56" y1="130" x2="119.5" y2="161.8" stroke="#7bc96f" stroke-width="3" stroke-linecap="round"/><polygon points="128,166 115.7,166 120.6,156.2" fill="#7bc96f"/><text x="134" y="174" font-size="14" text-anchor="start" fill="currentColor">v₂</text><polyline points="60.5,121.1 69.4,125.5 64.9,134.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="92" cy="58" r="5" fill="#f3c969" fill-opacity="1" stroke="currentColor" stroke-width="1"/><text x="196" y="36" font-size="14" text-anchor="start" fill="currentColor">① v₁ = u₁</text><text x="196" y="66" font-size="14" text-anchor="start" fill="currentColor">② u₂ から v₁ の</text><text x="210" y="86" font-size="14" text-anchor="start" fill="currentColor">向きの部分（黄）</text><text x="210" y="106" font-size="14" text-anchor="start" fill="currentColor">を引く</text><text x="196" y="136" font-size="14" text-anchor="start" fill="currentColor">③ 残りが v₂。</text><text x="210" y="156" font-size="14" text-anchor="start" fill="currentColor">v₁ と直角</text></svg>'
        explain: "u₂ の先から v₁ の直線にすいちょくに下ろした足（図の黄の点）が、(⟨u₂, v₁⟩ / ⟨v₁, v₁⟩) v₁ です。係数は、u₂ の v₁ 方向の成分のわりあいです。\n例（図）：u₁ = (1, 2)、u₂ = (3, 1)。v₁ = (1, 2)、⟨u₂, v₁⟩ = 5、⟨v₁, v₁⟩ = 5 なので、v₂ = (3, 1) − 1 × (1, 2) = (2, −1)。\n⟨v₂, v₁⟩ = 2 − 2 = 0 で直交しています。せいきかすると e₁ = (1/√5, 2/√5)、e₂ = (2/√5, −1/√5)。"
        note: v₂ = u₂ − (⟨u₂,v₁⟩/⟨v₁,v₁⟩)v₁。v₁ の方向の成分を引く。
