        text: "内積空間の問題では、図の ① から ⑥ の道具を組み合わせて使います。\n・内積 ⟨u, v⟩ = u₁v₁ + u₂v₂ と、ノルム ||u|| = √(⟨u, u⟩)。\n・直交は内積 0。せいきかはノルムでわる。\n・グラム–シュミットは、前のベクトルの向きの部分を引いて直交させる。\n・直交行列 QᵀQ = I、ユニタリ行列 U†U = I は、長さと内積を変えない。"
