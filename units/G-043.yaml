    text: 正方形 ABCD の外接円の、弧 AB（C、D をふくまないほう）の上に点 P があります。PA = 7 cm、PC = 17 cm のとき、PB の長さは何 cm ですか。
    svg: '<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="80" r="64" stroke="currentColor" stroke-width="2" fill="none"/><polygon points="74.7,34.7 165.3,34.7 165.3,125.3 74.7,125.3" stroke="currentColor" stroke-width="2" fill="none"/><line x1="119.7" y1="16" x2="74.7" y2="34.7" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="119.7" y1="16" x2="165.3" y2="34.7" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="119.7" y1="16" x2="165.3" y2="125.3" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="66.2" y="34.5" font-size="14" text-anchor="middle">A</text><text x="173.8" y="34.5" font-size="14" text-anchor="middle">B</text><text x="173.8" y="135.3" font-size="14" text-anchor="middle">C</text><text x="66.2" y="135.3" font-size="14" text-anchor="middle">D</text><text x="119.7" y="10.9" font-size="14" text-anchor="middle">P</text></svg>'
    choices: [5√2, 5√3, 6√2, 10]
    answer: 5√2
    check: "[c for c, v in {'5√2': 5 * math.sqrt(2), '5√3': 5 * math.sqrt(3), '6√2': 6 * math.sqrt(2), '10': 10}.items() if math.isclose(v * math.sqrt(2), 17 - 7)][0]"
    hints:
      - 正方形の 1 辺を a とすると、対角線は a の何倍かな。正方形 ABCD にもトレミーの定理が使えるよ。
      - 4 点 A、P、B、C は円の上にあるね。四角形 APBC にトレミーの定理を使おう。
      - 四角形 APBC の対角線は AB と PC。向かい合う辺の組は AP と BC、PB と CA だよ。
    paths:
      - [正方形の 1 辺を a とすると、正方形 ABCD のトレミーの定理で AC × AC = a × a + a × a、AC = a × √2, 四角形 APBC でトレミーの定理 AB × PC = AP × BC + PB × CA, a × 17 = 7 × a + PB × a√2, 両辺を a でわって PB × √2 = 10, PB = 10/√2 = 5√2 cm]
    note: どの 4 点の四角形にトレミーの定理を使うかを選ぶのが道筋の要点（APBC を選ぶと、正方形の 1 辺 a がすべての項にかかって消える）。正方形の大きさがわからないまま答えが出る。対角線と辺の組を取りちがえやすい。
  - part: 離
    kinds: [総動員, 数]
    uses: [G-019]
    text: 円に内接する四角形 ABCD で、対角線 AC は円の直径で、AC = 65 cm です。AB = 16 cm、AD = 25 cm のとき、対角線 BD は何 cm ですか。
    svg: '<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="80" r="64" stroke="currentColor" stroke-width="2" fill="none"/><polygon points="56,80 63.8,49.5 184,80 74.9,125.4" stroke="currentColor" stroke-width="2" fill="none"/><line x1="56" y1="80" x2="184" y2="80" stroke="currentColor" stroke-width="2" fill="none"/><line x1="63.8" y1="49.5" x2="74.9" y2="125.4" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="120" cy="80" r="2.6" fill="currentColor"/><text x="123.2" y="95.4" font-size="14" text-anchor="middle">O</text><text x="46" y="84.9" font-size="14" text-anchor="middle">A</text><text x="60.9" y="44.8" font-size="14" text-anchor="middle">B</text><text x="194" y="84.9" font-size="14" text-anchor="middle">C</text><text x="72.1" y="139.9" font-size="14" text-anchor="middle">D</text></svg>'
    answer: 39
    check: "Fraction(16 * math.isqrt(65 ** 2 - 25 ** 2) + 25 * math.isqrt(65 ** 2 - 16 ** 2), 65)"
    hints:
      - AC は直径なので、∠ABC と ∠ADC は何度かな。
      - 三平方の定理で BC と CD を求めよう。65 × 65 = 4225 だよ。
      - 4 つの辺と AC がそろったら、トレミーの定理で BD を求めよう。
    paths:
      - [AC は直径なので ∠ABC = ∠ADC = 90°, BC = √(4225 − 256) = √3969 = 63, CD = √(4225 − 625) = √3600 = 60, トレミーの定理で AC × BD = AB × CD + AD × BC, 65 × BD = 16 × 60 + 25 × 63 = 2535, BD = 39 cm]
    note: 直径に対する円周角（G-018）と三平方の定理（G-019）で残りの 2 辺を出してから、トレミーの定理を使う。√3969 のような大きな数の平方根を、一の位が 9 になる数（63 か 67）から見当をつけるところが数の難しさ。
  - part: 離
    kinds: [手数]
    text: 円に内接する等脚台形 ABCD で、AD ∥ BC、AD = 5 cm、BC = 16 cm、AB = CD = 8 cm です。対角線 AC と BD の交点を P とします。AP は何 cm ですか。
    svg: '<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="80" r="64" stroke="currentColor" stroke-width="2" fill="none"/><polygon points="100.6,19 58,64 182,64 139.4,19" stroke="currentColor" stroke-width="2" fill="none"/><line x1="100.6" y1="19" x2="182" y2="64" stroke="currentColor" stroke-width="2" fill="none"/><line x1="58" y1="64" x2="139.4" y2="19" stroke="currentColor" stroke-width="2" fill="none"/><line x1="76.8" y1="39.1" x2="81.9" y2="43.9" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="158.1" y1="43.9" x2="163.2" y2="39.1" stroke="currentColor" stroke-width="1.5" fill="none"/><polyline points="117,23 123,19 117,15" stroke="currentColor" stroke-width="1.5" fill="none"/><polyline points="117,68 123,64 117,60" stroke="currentColor" stroke-width="1.5" fill="none"/><text x="95.5" y="15.3" font-size="14" text-anchor="middle">A</text><text x="48.5" y="71.8" font-size="14" text-anchor="middle">B</text><text x="191.5" y="71.8" font-size="14" text-anchor="middle">C</text><text x="144.5" y="15.3" font-size="14" text-anchor="middle">D</text><text x="120" y="46.6" font-size="14" text-anchor="middle">P</text></svg>'
    answer: 20/7
    check: "Fraction(math.isqrt(8 * 8 + 5 * 16) * 5, 5 + 16)"
    hints:
      - 等脚台形の 2 本の対角線の長さは等しいね。トレミーの定理で対角線の長さを求めよう。
      - AC × BD = AC × AC = AB × CD + AD × BC だよ。
      - AD ∥ BC なので、△PAD と △PCB は相似だね。AP:PC はいくつかな。
    paths:
      - [等脚台形なので AC = BD, トレミーの定理で AC × AC = 8 × 8 + 5 × 16 = 144, AC = 12, AD ∥ BC で △PAD ∽ △PCB、AP:PC = 5:16, AP = 12 × 5/21 = 20/7 cm]
    note: トレミーの定理で対角線を出し（2 本が等しいので AC × AC になる）、相似（G-020）で比に分ける 2 段の手数の問題。AP:PC = AD:BC の対応と、12 を 5 + 16 = 21 に分けるところでつまずきやすい。
  - part: 離
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - G-018
    - G-019
    - G-028
    - G-030
    - G-050
    - G-054
    - A-011
    text: 三角形 ABC は AB = 14 cm、BC = 15 cm、CA = 13 cm です。三角形の 3 つの辺すべてにふれる円（内接円）の中心を I とします。直線 AI は、三角形の 3 つの頂点を通る円（外接円）と、A でないもう 1 つの点 D で交わります。AI × AD は何 cm² ですか。
    answer: 117
    check: '(lambda a, b, c: (lambda Ax: (lambda Ay: (lambda Ix, Iy, Oy: (lambda dx, dy, ux, uy: (-2 * (ux * dx + uy * dy) / (dx * dx + dy * dy)) * (dx * dx + dy * dy))(Ix - Ax, Iy - Ay, Ax - Fraction(a, 2), Ay - Oy))((a * Ax + c * a) / (a + b + c), a * Ay / (a + b + c), (Ax * Ax + Ay * Ay - a * Ax) / (2 * Ay)))((lambda s: Fraction(math.isqrt(s.numerator), math.isqrt(s.denominator)))(c * c - Ax * Ax)))(Fraction(c * c + a * a - b * b, 2 * a)))(15, 13, 14)'
    hints:
    - まず三角形 ABC の面積と、内接円の半径を出そう。A から内接円がふれる点までの長さも出せるかな。
    - 直線 AI は ∠A を 2 等分しているね。D は外接円のどこにあるかな。
    - D から B、C、I までの長さに、何か関係はないかな。
    paths:
    - - A から BC に垂線をひき、足を H として BH = x とする。AH² = 14² − x² = 13² − (15 − x)² から 196 = −56 + 30x、x = 42/5。AH² = 196 − 1764/25 = 3136/25 で高さ AH = 56/5、面積は 15 × 56/5 ÷ 2 = 84。内接円の半径 r は、面積 = r × (3 辺の和) ÷ 2 から r = 84 × 2 ÷ (14 + 15 + 13) = 4。点 A から内接円がふれる点までは、接線の長さが等しいことから (14 + 13 − 15) ÷ 2 = 6。I からその点への半径は接線に直角なので AI² = 6² + 4² = 52
      - AI は ∠A を 2 等分するので、∠BAD = ∠CAD。等しい円周角に対する弧は等しいから弧 BD = 弧 DC、よって DB = DC。次に ∠DBI = ∠DBC + ∠CBI。∠DBC = ∠DAC（同じ弧 DC に対する円周角）= ∠A/2、∠CBI = ∠B/2（BI は ∠B の 2 等分線）なので ∠DBI = ∠A/2 + ∠B/2。一方、三角形 ABI の外角として ∠DIB = ∠IAB + ∠IBA = ∠A/2 + ∠B/2。2 つの角が等しいので三角形 DBI は二等辺三角形で DB = DI
      - 四角形 ABDC は円に入っている。対角線は AD と BC で、向かい合う辺の組は AB と DC、AC と DB。トレミーの定理から AD × BC = AB × DC + AC × DB。DC = DB を入れると AD × 15 = (14 + 13) × DB なので AD = 27/15 × DB = 9/5 × DB
      - 'I は AD の上にあり、DI = DB なので AI = AD − DI = 9/5 × DB − DB = 4/5 × DB。したがって AD : AI = 9/5 : 4/5 = 9 : 4 で AD = 9/4 × AI'
      - AI × AD = AI × 9/4 × AI = 9/4 × AI² = 9/4 × 52 = 117
    - - B を原点、C を x 軸の上にとって B(0, 0)、C(15, 0)、A(x, y) とする。AB² = x² + y² = 196、AC² = (x − 15)² + y² = 169。引くと 30x − 225 = 27 で x = 42/5。y² = 196 − 1764/25 = 3136/25 で y = 56/5。A(42/5, 56/5)
      - 三角形の面積は 15 × 56/5 ÷ 2 = 84 で、内接円の半径は r = 84 × 2 ÷ 42 = 4。B から内接円がふれる点までは接線の長さが等しいことから (14 + 15 − 13) ÷ 2 = 8。この点は BC の上で B から 8 の所、I はそこから真上に r = 4 の所なので I(8, 4)。AI² = (42/5 − 8)² + (56/5 − 4)² = (2/5)² + (36/5)² = 4/25 + 1296/25 = 52
      - 外接円の中心 O は OB = OC なので BC のまん中の真上にあり、O(15/2, y) と書ける。OB² = OA² から (15/2)² + y² = (42/5 − 15/2)² + (56/5 − y)² = (9/10)² + (56/5 − y)²。y² を消して 225/4 = 81/100 + 3136/25 − 112y/5 より y = 25/8。半径は R² = (15/2)² + (25/8)² = 4225/64 で R = 65/8。OI² = (8 − 15/2)² + (4 − 25/8)² = (1/2)² + (7/8)² = 65/64
      - I を通る外接円の直径を 1 本ひく。I は円の内がわにあり、この直径を R − OI と R + OI の 2 つに分ける。I を通る弦 AD とこの直径について、方べきの定理から AI × ID = (R − OI) × (R + OI) = R² − OI² = 4225/64 − 65/64 = 65
      - I は三角形の内がわの点なので外接円の内がわにあり、A と D の間にある。だから AD = AI + ID。AI × AD = AI × (AI + ID) = AI² + AI × ID = 52 + 65 = 117
    note: '考えどころは 3 つ：①内接円の半径（面積 × 2 ÷ 3 辺の和 = 4）と接線の長さ（6）から、直角三角形で AI² = 52 を出す、②D は弧 BC のまん中なので DB = DC。さらに角を追って DB = DC = DI を見つける（内心と、外接円の弧のまん中の点の知られた性質）、③四角形 ABDC にトレミーの定理を使って AD : DB = 9 : 5 を出し、AI : ID = 4 : 5、AD : AI = 9 : 4 にして AI × AD = 9/4 × 52 = 117。2 本目は DB = DI もトレミーも使わず、座標と方べきの定理で AI × ID = 65 を直接出して AI × AD = 52 + 65 = 117 とする（1 本目は弧のまん中とトレミーで比を出す道、2 本目は座標で長さを出す道）。check は辺の長さから A の座標を出し、I を (a・A + b・B + c・C) ÷ (a + b + c)、O を OA = OB = OC から出して、直線 A + t(I − A) を外接円の式に入れ、A でない交点（t ≠ 0）から AI × AD を分数のまま返す。道の数 52、65 はなぞらない。既出・出典：DB = DC = DI は内心と外接円の弧のまん中の知られた性質で、AI × ID が 2 × R × r に等しいことも知られている（ここでは 2 × 65/8 × 4 = 65）。問いの形（AI × AD）と数は自作。3 本目の道もある：AD と BC の交点を L とすると、角の二等分線の定理を 2 回使って AI：IL = (AB + AC)：BC = 27：15、円周角で △ABL ∽ △ADC から AL × AD = AB × AC = 182 なので、AI × AD = 27/42 × 182 = 117（DB = DI もトレミーも使わない）。どの道も、考えどころは 3 つある。わな：AI = ID と思って 52 × 2 = 104 とする、AI × ID の 65 でとまる。'
