          - ∠DAE と ∠CAB が等しいことを使って、もう 1 組の相似な三角形を見つけよう。
          - 2 つの相似から出る積の式を足して、BE + DE = BD を使おう。
        paths:
          - [△ABE ∽ △ACD で AB × CD = AC × BE, ∠DAE = ∠CAB, △ADE ∽ △ACB で AD × BC = AC × DE, 足して AC × (BE + DE) = AC × BD]
