        explain: AC × BD = 8 × 8 = 64、AB × CD + AD × BC = 7 × 7 + 3 × 5 = 49 + 15 = 64 で、等しくなります。円に内接する四角形 ABCD では、いつも AC × BD = AB × CD + AD × BC が成り立ちます。これをトレミーの定理といいます（わけは 4 日目）。左は 2 本の対角線の積、右は向かい合う辺の積 2 つの和です。どの辺とどの辺が向かい合うか（AB と CD、AD と BC）を、図で確かめてから使います。
