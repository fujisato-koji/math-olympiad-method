# G-043 トレミーの定理
#
# 書き方は N-001 の頭の注のとおり。
# トレミーの定理：円に内接する四角形 ABCD で AC × BD = AB × CD + AD × BC（2 本の対角線の積 = 向かい合う辺の積の和）。
# 前提は G-018（円周角の定理、直径に対する円周角）と G-020（相似の条件、相似比）。
# わけは、対角線 BD の上に ∠BAE = ∠CAD となる点 E をとり、△ABE ∽ △ACD と △ADE ∽ △ACB の 2 組の相似を足す形。
# 円に内接する四角形の角の性質（向かい合う角の和が 180°、G-023）は前提にないので使わない。
# 三平方の定理（G-019）と平方根（A-016）は前提にない。対角線を求める問題は AC × AC が平方数になる値にするか、
#   「AC × BD はいくつか」を問う。2 日目の挑戦とわけの 3 問目で、長方形にトレミーの定理を使うと
#   三平方の定理と同じ式になることを見る（G-019 を先に学んでいなくても、ここから式が出る）。
# 問題の四角形は、実際に円に内接するものにした：直径 AC を共有する 2 つの直角三角形（3、4、5 や 25、60、65 と 39、52、65）、
#   等脚台形（上底 3、下底 5、脚 7、対角線 8 など）、正三角形と外接円の上の点、正方形、正五角形、正六角形、長方形。
#   図はそれぞれの長さのとおりに作図した。
# D-026：トレミーの定理は、昔の天文学で弦の表をつくるのに使われ、三角関数の加法定理（G-025）と同じ内容を持つ。
#   3 日目の挑戦の正五角形の対角線と 1 辺の比は黄金比で、5 回対称の準結晶（2011 年ノーベル化学賞）につながる。
# 円に内接しない四角形では AC × BD < AB × CD + AD × BC（トレミーの不等式）。3 日目と確認の日に数で確かめるだけにし、
#   わけは G-034（幾何の不等式）にまわす。
# 地図に plan がないので既定の並び（導入・練習 2 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 トレミーの定理で対角線を求める　2 日目 特別な形（正三角形と円の上の点、正方形、正六角形、長方形）
#   3 日目 辺を求める、円に内接しない四角形では成り立たない　4 日目 わけ（相似で示す、PA = PB + PC、長方形と三平方）
#   5 日目 G-018（円周角）・G-020（相似）と混ぜる　6 日目 確認
# check：積と和の式（Fraction）、対角線は math.isqrt。くらべる問題は積の和をくらべる式。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-016 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# ただし腕だめしの最難関（内心 I と外接円の交点 D の AI × AD）だけは例外で、uses に G-019、G-028、G-030、G-050、G-054、A-011 を挙げて、三平方の定理、内接円と接線の長さ、方べきの定理、座標、1 次方程式を使う。
# ことば（最難関）：頂点、垂線、弧、x 軸。

