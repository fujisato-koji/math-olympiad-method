ntColor">+ ?</text><path d="M242 76 Q262 90 242 104" fill="none" stroke="currentColor" stroke-width="1.8"/><polygon points="242,104 245.5,96.8 249.9,103.1" fill="currentColor"/><text x="268" y="95" font-size="14" text-anchor="start" fill="currentColor">+ ?</text></svg>'
