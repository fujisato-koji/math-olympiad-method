    text: あるパン屋では、1 日に売るパンの目標を 50 こにしています。月曜日から金曜日までの 5 日間、売った数が目標より多い日は +、少ない日は − をつけて、目標とのちがいを図のように記録しました。土曜日の目標とのちがいがいくつなら、6 日間のちがいの平均が +1 になりますか。
