        explain: 例：「(−24) ÷ (−6) = □ は、□ × (−6) = −24 となる □ のことである（わり算はかけ算の逆）。かけ算の符号のきまりから、□ が正なら □ × (−6) は負、□ が負なら □ × (−6) は正になる。−24 は負なので、□ は正の数である。− をとった数で見ると □ × 6 = 24 なので □ = 4。よって (−24) ÷ (−6) = 4。」と書ければよい。① 約束したこと（わり算はかけ算の逆、かけ算の符号のきまり）、② □ の符号を正の場合と負の場合に分けて決める、③ − をとった数を九九で決めて結ぶ、の 3 つを見る。4 × (−6) = −24 と確かめただけのときは、それで答えが合うことは分かるが、わり算の符号のきまりが、かけ算の符号のきまりから出てくることまで書けるとよいと話す。
        hints:
