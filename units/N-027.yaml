# N-027 正負の数のかけ算とわり算
#
# 書き方は N-001 の頭の注、負の数の書き方と check は N-010 の頭の注のとおり（「−」は U+2212、式の中の負の数は ( ) で囲む、
#   check は (lambda v: f'−{-v}' if v < 0 else f'{v}')(式) で「−12」の形にそろえる）。段 4 なので子に見せる文は普通の文。
# 前提は N-010（正負の数のたし算とひき算）、N-014（わり算とあまり）、N-015（計算のきまり）。
#   数は 100 まで（N-009 は前提のたどりにない）。かけ算は九九と、N-015 の「分ける」で 100 まで。
#   わり算は N-014 と同じく、わる数が 1〜9 で、− をとった商が 9 まで。わり切れないわり算と、商が分数になるわり算は扱わない。
# かけ算は N-013 の読み方「1 つ分の数 × いくつ分」で、(−2) × 3 を「(−2) の 3 つ分」とする。3 × (−2) は入れかえのきまり（N-015）で (−2) × 3 と同じ。
#   負 × 負は、N-013 で九九をつくったきまり（かける数が 1 へると答えはかけられる数だけへる）を続けて決める（1 日目の見本）。
# 文字（A-010）、累乗（A-009）、分数（N-016）、絶対値（N-011）は前提にないので使わない。絶対値の代わりに「− をとった数」と言う。
# わけは段 4 の深さ。文字が前提にないので、「〜とする」で文字を決める形は使わず、約束した事実（分配のきまりが負の数でも成り立つ、
#   0 をかけると 0、わり算はかけ算の逆、かけ算の符号のきまり）から、具体的な数で筋道を立てて書く（③）。水準 2 の単元なので、
#   表のきまりを続けて言う ② を 1 問置いた。
# 日の並び（既定）：1 日目 かけ算（正 × 負、負 × 正、負 × 負）、2 日目 わり算（かけ算の逆）と 3 つの数の積、3 日目 わけ、
#   4 日目 N-010・N-014・N-015 と混ぜる（× を先に計算する、入れかえとまとめ、分配のきまり）、5 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-009、N-016 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

