        explain: 例：「分配のきまりが負の数でも成り立つとする。まず、2 + (−2) = 0 なので、(2 + (−2)) × (−3) = 0 × (−3) = 0。次に、分配のきまりで、(2 + (−2)) × (−3) = 2 × (−3) + (−2) × (−3) = −6 + (−2) × (−3)。2 つは同じ式を計算したものなので、−6 + (−2) × (−3) = 0。−6 にたして 0 になる数は 6 だけなので、(−2) × (−3) = 6。」と書ければよい。① 約束したこと（分配のきまりが負の数でも成り立つ、0 をかけると 0、2 × (−3) = −6）をはじめに書く、② 同じ式を 2 通りに計算する、③「−6 にたして 0 になる数は 6 だけ」で結ぶ、の 3 つがそろっているかを見る。文字（A-010）はまだ使わないので、数は (−2) と (−3) のままでよい。ほかの数でも同じ筋道で説明できることを口で確かめ、「どの数でも」を文字で書くのは A-010 の後であることを話す。
