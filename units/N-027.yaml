 stroke-width="2"/><text x="71" y="268" font-size="14" text-anchor="middle" fill="currentColor">(−1) × 2 × (−3)</text><line x1="136" y1="263" x2="150" y2="263" stroke="currentColor" stroke-width="2"/><polygon points="156,263 149,267 149,259" fill="currentColor"/><rect x="160" y="248" width="96" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="208" y="268" font-size="14" text-anchor="middle" fill="currentColor">(−2) × (−3)</text><line x1="260" y1="263" x2="274" y2="263" stroke="currentColor" stroke-width="2"/><polygon points="280,263 273,267 273,259" fill="currentColor"/><rect x="284" y="248" width="28" height="30" rx="6" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="298" y="268" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">6</text></svg>'
        explain: わり算は、かけ算の逆です。(−12) ÷ 3 = □ は、□ × 3 = −12 となる □ をさがすことです。(−4) × 3 = −12 なので、□ = −4 です。符号のきまりは、かけ算と同じになります。同じ符号どうしのわり算は正、ちがう符号のわり算は負です。符号を先に決めて、− をとった数どうしでわります（12 ÷ 3 = 4 なので −4）。3 つ以上の数をかけるときは、前から順に 2 つずつかけていきます。
