        text: |-
          (−2) × 3 は (−2) の 3 つ分です。数直線で、0 から左へ 2 ずつ 3 回進んで −6 になります。
          かける数を 1 ずつへらすと、答えは 2 ずつ大きくなります。このきまりを続けると、(−2) × (−1) = 2、(−2) × (−2) = 4 です。
          同じ符号どうしの積は正、ちがう符号どうしの積は負になります。
