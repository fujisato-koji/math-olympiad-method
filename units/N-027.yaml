        text: |-
          (−12) ÷ 3 は、□ × 3 = −12 となる □ をさがす計算です。
          数直線で −12 を 3 つに等しく分けると、1 つ分は −4 です。だから (−12) ÷ 3 = −4 です。
          わり算の符号も、かけ算と同じきまりで決まります。
          3 つの数のかけ算は、前から順に 2 つずつかけます。
