    paths:
      - [5 日間の合計は (−4) + 7 + (−9) + 2 + (−6) = −10, 平均が +1 なら 6 日間の合計は 1 × 6 = 6, 土曜日は 6 − (−10), 16]
      - [売った数で考える, 5 日間は 46、57、41、52、44 で合計 240, 平均が 51 こなら 6 日間の合計は 306, 土曜日は 66 こで目標より 16 多い]
    note: 平均 × 日数 ＝ 合計（S-028）を、負の数の入った「ちがい」に使う。目標とのちがいで計算すると数が小さくすむ（S-028 の仮の平均の考え）。5 日間の合計 −10 をひくところで 6 − 10 = −4 とする符号のまちがいが多い。売った数そのもので計算する 2 本目と答えが合うことを確かめると、ちがいで考えてよいわけが分かる。
