# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数]
    text: (−6) × 25 × (−7) × (−4) ÷ (−15) ÷ 7 を計算しましょう。
    answer: 40
    check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-6) * 25 * (-7) * (-4) / (-15) / 7)"
    hints:
      - はじめに符号を決めよう。負の数はいくつあるかな。
      - わり算は、わる数の《逆数》をかけることと同じだね。× 7 と ÷ 7 はどうなるかな。
      - 25 × 4 や 6 ÷ 15 のように、計算しやすい組を作ろう。
    paths:
      - [負の数は −6、−7、−4、−15 の 4 つで符号は +, × 7 と ÷ 7 で打ち消し合う, 25 × 4 = 100、6 ÷ 15 = 2/5, 2/5 × 100, 40]
      - [1 つの《分数》にまとめる, (6 × 25 × 7 × 4)/(15 × 7), 7 どうし、6 と 15、25 と 5 で約分すると 2 × 5 × 4, 40]
    note: 6 つの数のかけ算とわり算。符号は負の数の個数（4 個で正）で先に決め、数の部分は ×7 と ÷7、25 × 4 のような組を見つけて小さくする（N-015 の入れかえとまとめ）。左から順に計算すると 4200 のような大きな数が出て、まちがえやすい。÷ のある式で順番を入れかえるときは、わる数を逆数のかけ算に直してから入れかえる（N-078）。
  - part: 離
    kinds: [道筋]
    text: −3、−2、−1、4、5 の 5 つの数から、ちがう 3 つを選んでかけます。積がいちばん大きくなるときと、いちばん小さくなるときの、積の差はいくつですか。
    answer: 90
    check: "max([a * b * c for a, b, c in itertools.combinations([-3, -2, -1, 4, 5], 3)]) - min([a * b * c for a, b, c in itertools.combinations([-3, -2, -1, 4, 5], 3)])"
    hints:
      - 積の符号は、選んだ負の数の個数で決まるね。
      - いちばん大きい積は正の数。負の数を 2 つ、正の数を 1 つ選ぶ組から探そう。
      - いちばん小さい積は負の数。負の数を 1 つと正の数を 2 つ、または負の数を 3 つ選ぶ組を比べよう。
    paths:
      - [いちばん大きい積は負 2 つと正 1 つ, (−3) × (−2) × 5 = 30, いちばん小さい積は (−3) × 4 × 5 = −60 と (−3) × (−2) × (−1) = −6 のうち −60, 30 − (−60), 90]
    note: 選び方は 10 通りあるが、積の符号を負の数の個数で場合分けすると、調べる組がしぼれる。いちばん小さい積を −6 と取りちがえる誤りが多い（負の数では、− をとった数が大きいほど小さい）。差を 30 − 60 とする符号の誤りにも気をつける。
  - part: 離
    kinds: [総動員, 手数, 読み取り]
    uses: [S-028]
    text: あるパン屋では、1 日に売るパンの目標を 50 個にしています。月曜日から金曜日までの 5 日間、売った数が目標より多い日は +、少ない日は − をつけて、目標とのちがいを記録しました。土曜日の目標とのちがいがいくつなら、6 日間のちがいの平均が +1 になりますか。
    figure: "月　−4\n火　+7\n水　−9\n木　+2\n金　−6"
    answer: 16
    check: "1 * 6 - ((-4) + 7 + (-9) + 2 + (-6))"
    hints:
      - 5 日間のちがいを、全部たすといくつかな。
      - 6 日間のちがいの平均が +1 なら、6 日間のちがいの合計はいくつになるかな。
      - 土曜日のちがいは、6 日間の合計から 5 日間の合計をひいた数だね。
    paths:
      - [5 日間の合計は (−4) + 7 + (−9) + 2 + (−6) = −10, 平均が +1 なら 6 日間の合計は 1 × 6 = 6, 土曜日は 6 − (−10), 16]
      - [売った数で考える, 5 日間は 46、57、41、52、44 で合計 240, 平均が 51 個なら 6 日間の合計は 306, 土曜日は 66 個で目標より 16 多い]
    note: 平均 × 個数 ＝ 合計（S-028）を、負の数の入った「ちがい」に使う。目標とのちがいで計算すると数が小さくすむ（S-028 の仮の平均の考え）。5 日間の合計 −10 をひくところで 6 − 10 = −4 とする符号の誤りが多い。売った数そのもので計算する 2 本目と答えが合うことを確かめると、ちがいで考えてよいわけが分かる。
