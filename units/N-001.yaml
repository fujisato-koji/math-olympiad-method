# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [数, 道筋]
    text: あめが ぜんぶで 9 こ あります。あかい さらと あおい さらに わけて のせました。あかい さらの ほうが、あおい さらより 1 こ おおく なりました。あかい さらの あめは なんこですか。
    figure: "🍬🍬🍬🍬🍬🍬🍬🍬🍬"
    answer: 5
    check: "[a for a in range(n('🍬') + 1) if a == n('🍬') - a + 1][0]"
    hints:
      - 9 は いくつと いくつに わけられるかな。
      - 「8 と 1」「7 と 2」と、じゅんに ためしてみよう。
      - 2 つの かずが、となりどうしの かずに なるのは どれかな。
    paths:
      - [9 を 2 つに わける, 8 と 1、7 と 2、6 と 3、5 と 4, 5 は 4 より 1 おおい, 5 こ]
      - [2 つの さらに 1 こずつ のせていく, 4 こずつ のせると 1 こ のこる, のこりを あかい さらに のせて 5 こ]
    note: 「合わせて 9」と「1 多い」の 2 つの条件を同時に満たす分け方をさがす。いくつといくつ（3 日目）を順に試すのが基本の道。4 と 5 のどちらが赤い皿かを取りちがえやすい。2 本目は 1 個ずつ配る見方（ふたりで同じ数ずつ分ける、の続き）。式で解く方法（A-012 の連立方程式）は使わない。
  - part: 離
    kinds: [読み取り]
    text: かくれて いる かずは どれかな。3 より おおきくて、10 より ちいさい かずです。その かずの あめは、ふたりで おなじ かずずつ わけられます。その かずより 1 おおきい かずも、1 ちいさい かずも、7 では ありません。
    answer: 4
    check: "[k for k in range(4, 10) if k % 2 == 0 and k + 1 != 7 and k - 1 != 7][0]"
    hints:
      - 「3 より おおきくて、10 より ちいさい」に あてはまる かずを、ぜんぶ かきだそう。
      - ふたりで おなじ かずずつ わけられる かずは どれかな。あめを ならべて たしかめよう。
      - のこった かずの となりに 7 が ないか みよう。
    paths:
      - [4、5、6、7、8、9 に しぼる, ふたりで わけられるのは 4、6、8, 6 と 8 は となりが 7, 4]
    note: 条件を 1 つずつ使って候補を消していく。「1 大きい数も 1 小さい数も 7 ではない」は、7 の両どなりの 6 と 8 を消すという意味で、ここで迷いやすい。候補を紙に書いて、条件ごとに消させるとよい。
  - part: 離
    kinds: [総動員, 手数]
    uses: [A-001]
    text: てんびんが 2 つ、どちらも つりあって います。🟥 1 こと 🟦 1 こを いっしょに のせると、🟨 なんこと つりあいますか。
    balance: [{left: "🟥", right: "🟦🟦", tilt: level}, {left: "🟦", right: "🟨🟨", tilt: level}]
    answer: 6
    check: "bal[0]['right'].count('🟦') * bal[1]['right'].count('🟨') + bal[1]['right'].count('🟨')"
    hints:
      - 🟦 1 こは、🟨 なんこと おなじ おもさかな。
      - 🟥 は 🟦 2 こと おなじ。その 🟦 を 1 こずつ 🟨 に とりかえよう。
      - 🟥 の ぶんの 🟨 と、🟦 の ぶんの 🟨 を ならべて かぞえよう。
    paths:
      - [🟦 1 こは 🟨 2 こ, 🟥 は 🟦 2 こなので 🟨 4 こ, 🟦 の ぶんの 🟨 2 こも ならべる, 🟨 6 こ]
    note: A-001 の「1 個ずつとりかえて数える」を 2 回続ける。🟥 を 🟨 2 個と読んでしまう（🟦 を経ずに読む）誤りが多い。🟨 を実際に並べて数えさせる（たし算の式は使わない）。
