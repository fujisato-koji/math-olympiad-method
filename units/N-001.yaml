# N-001 10 までの数
#
# 段 1・水準 1・5 日。10 までの数を数える、どちらが多いか少ないか、いくつといくつ（10 までの合成と分解）、1〜3 日目の型を混ぜる、確認。
# 子の画面には text、figure、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# part: わけ は、わけを口で言う問題（保護者が聞いて「言えた」を押す）。explain は保護者が見る手本（D-016）。
# paths は解答のみちすじ。1 本目が基本、2 本目からは別の道。
# check は答えを確かめる式（fig は図の文字列、n(c) は図の中の c の数）。
# extra は、その日の結果が 6 割に届かなかったときの「おさらいの日」に使う予備の問題（R-33、R-36）。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる（D-129〜D-131）。
# 図（svg）：物は文字の図（figure）と同じ絵文字・同じ並び（行ごとに中よせ）でかく。きいろのまるの 1、2、3 は数えたじゅんで、とちゅうまでにする。
#   うすい絵は「数えない物」。1〜10 のますは「かぞえるじゅん」、むらさきのわは「見るところ」。せんでむすぶのは、はじめの 2 くみまで。
#   いくつといくつは、3 日目の見本の「さくらんぼの図」（上にぜんぶの数、下にわけた 2 つの数。？ がたずねる数）でかく。ヒントのまるの図は、ぬったまるが「わけた 1 つめ」。
#   腕だめしのてんびんは A-001 と同じ上皿てんびんの svg にした（balance は答えを見ない解き直しと図の PNG に出ないため）。check は問題の数から計算する式（bal は使わない）。

