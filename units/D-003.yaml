    paths:
      - ["分子は (2x − 3)(2x + 3)", "分母は x²(2x + 3) + (2x + 3) = (2x + 3)(x² + 1)", 約分して (2x − 3)/(x² + 1), "(−6)/(9/4 + 1) = −6 × 4/13 = −24/13"]
    note: x = −3/2 で 0 になることから 2x + 3 が共通な因数だと見抜き、分母の 4 項を 2 項ずつ組にしてくくる。分数を代入したあとの繁分数の計算と、符号でつまずきやすい。
  - part: 離
    kinds: [道筋, 手数]
    text: f(x) は x の多項式で、lim (x→∞) f(x)/(x² + 1) = 3 と lim (x→1) f(x)/(x² − 1) = 2 を満たします。f(3) はいくつですか。
    answer: 20
    check: "[3 * 9 + 3 * p + q for p in range(-20, 21) for q in range(-20, 21) if 3 + p + q == 0 and abs((lambda x: (3 * x * x + p * x + q) / (x * x - 1))(1 + 1e-6) - 2) < 1e-4][0]"
    hints:
      - f(x) の次数が 2 より大きいとき、2 より小さいとき、f(x)/(x² + 1) は x → ∞ でどうなるかな。そこから f(x) の形を決めよう。
      - x → 1 で分母 x² − 1 は 0 に近づくのに、極限は有限の値だね。f(1) はいくつになるかな（6 日目のわけ）。
      - f(x) = (x − 1)(3x + r) とおいて、2 つ目の極限の条件から r を求めよう。
    paths:
      - [次数が 2 より大きいと ±∞、小さいと 0 になるので f(x) は 2 次式で x² の係数は 3, x → 1 で分母 → 0 なので f(1) = 0, "f(x) = (x − 1)(3x + r) とおくと f(x)/(x² − 1) = (3x + r)/(x + 1) → (3 + r)/2", (3 + r)/2 = 2 で r = 1, f(3) = 2 × 10 = 20]
    note: 2 つの極限の条件を、「次数と最高次の係数が決まる」「x − 1 を因数にもつ」と言いかえるのが道筋。f(x) = ax² + bx + c と 3 つの文字のままおくと、条件の数が足りるかどうかが見えにくい。
