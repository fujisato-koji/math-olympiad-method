# D-003 関数の極限と連続（高校）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   導入の日と、新しいきまりが出る練習の日（2〜5 日目）は頭に見本を 1 つ置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入、練習、練習、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：関数の極限 lim (x→a) f(x)（x ≠ a のまま a に近づける）、極限の性質（和・差・定数倍・積・商）、多項式と分数関数は代入、
#     0/0 の形は因数分解して約分（A-015、A-037）。
#   2 日目：0/0 の形のいろいろ（3 次式は x − a でわる、√ の差は有理化、分数式は通分してから約分）。
#   3 日目：片側からの極限（x → a + 0、x → a − 0）、右と左がちがうと極限は存在しない、±∞ に発散する（1/(x − a)²）、分数関数の縦の漸近線。
#   4 日目：x → ∞、x → −∞ の極限（1/x → 0、最高次の項でわる、√ の差は有理化、x → −∞ では √(x²) = −x）、横の漸近線、はさみうちの原理。
#   5 日目：連続（定義 lim (x→a) f(x) = f(a)、場合分けで決まる関数、分数関数の不連続な点）、中間値の定理（解がどの整数の間にあるか）。
#   6 日目：わけ（3 問とも ③：(x² − a²)/(x − a) → 2a、x → ∞ の分数関数の極限を 1/x → 0 と極限の性質で、
#     極限が有限なら分子 → 0 になること）。7 日目：A-038、A-037、A-020 と混ぜる（漸近線、約分、最小値、係数を決める、解の個数）。8 日目：確認。
# 前提は A-038（分数関数と無理関数）。たどると A-037（分数式と部分分数分解）、A-020（2 次関数）、A-019、A-017、A-016、A-015 まで。
#   A-038、A-037、A-020 は別の係が同時に作っているので、次の中身とみなした。A-038：y = k/(x − p) + q のグラフと漸近線、
#   y = √(a(x − p)) のグラフと定義域。A-037：約分、分数式の計算、多項式のわり算（x³ − 8 を x − 2 でわる）。A-020：平方完成、頂点、最小値。
# 指数・対数（D-001）、数列の極限（D-002）、三角関数（G-024、G-025）はたどりにないので使わない（sin x/x → 1 は D-005 で扱う）。
#   不等式（A-013）もたどりにないので、不等式の性質は使わず、x < 2 や 2 − 1/x ≦ f(x) の形は読むだけにした（はさみうちの原理も、
#   約束した事実として述べ、両側の式の極限を求めさせる）。3 次方程式の解がいくつ以下かは前提にないので、中間値の定理で
#   「少なくともいくつあるか」を聞く。ε-δ による極限の定義は水準 4 なので扱わず、「限りなく近づく」の言い方で定義する。
# 記号：極限は「lim (x→2) f(x)」と 1 行で書き（教科書では x→2 を lim の下に書く、と 1 日目の見本で教える）、
#   「x → 2 のとき f(x) → 4」の書き方も使う。片側は「x → 2 + 0」「x → 2 − 0」、無限大は「∞」「−∞」。絶対値（N-011）はたどりにないので使わず、左右で式が変わる関数は場合分けで書く。
#   場合分けで決まる関数は「f(x) = x² + a（x < 2 のとき）、f(x) = 3x − a（x > 2 のとき）」と書く。
# 答えは数を打つ。∞、−∞、「極限は存在しない」、漸近線の組、式は choices。
# check：有限の極限は、x = a ± 0.000001 の 2 つの値の平均を Fraction(…).limit_denominator(100) で分数にそろえる（片側は片方だけ）。
#   x → ±∞ は x = ±10⁸ の値を同じくそろえる。∞ を選ぶ問題は、a のすぐ右と左の値の符号と大きさで選び出す。
#   式を選ぶ問題は、選択肢ごとの式（lambda）が元の式とどの値でも等しいものを選ぶ。係数を決める問題と中間値の定理は総当たりで求める。
# グラフは svg（D-040）。極限の値が答えの問題には、その値を示すグラフを付けない（グラフを読む問題は、方眼と目盛りだけで答えは書かない）。
# この単元で約束したこと（後ろの D-004 微分の考え、D-005、D-006 が使う）：関数の極限と極限の性質、0/0 の形の約分と有理化、
#   片側からの極限、±∞ への発散、1/x → 0（x → ±∞）、はさみうちの原理、連続の定義、多項式・分数関数（分母が 0 でないところ）・
#   √ の関数はそれぞれの定義域で連続であること、中間値の定理。
# 関数の極限と連続は、微分係数（D-004）、数値計算の二分法（K-160）、実数の理論（ε-δ）の入口になる（D-026）。

