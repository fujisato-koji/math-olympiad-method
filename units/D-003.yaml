        explain: x を 0.9、0.99、0.999 と 1 に近づけると f(x) は 1.9、1.99、1.999 となり、x を 1.1、1.01、1.001 と近づけると 2.1、2.01、2.001 となります。x が 1 と異なる値をとりながら 1 に限りなく近づくとき、f(x) の値が 2 に限りなく近づくことを、lim (x→1) f(x) = 2 と書き、2 を x → 1 のときの f(x) の極限値といいます（教科書では x→1 を lim の下に書きます）。「x → 1 のとき f(x) → 2」とも書きます。x ≠ 1 なので x − 1 は 0 でなく、f(x) = (x + 1)(x − 1)/(x − 1) = x + 1 と約分できます。x → 1 のとき x + 1 → 2 なので、極限値は 2 です。グラフは直線 y = x + 1 から点 (1, 2) を除いたもので、白丸がその穴です。極限は x = 1 での値ではなく、x = 1 の近くの値の行き先です。多項式の関数や、x = a で分母が 0 にならない分数関数は、x に a を代入した値が極限値になります（例：lim (x→2) (x² + 3x) = 10）。また、lim f(x) = α、lim g(x) = β のとき、f(x) + g(x) → α + β、f(x) − g(x) → α − β、kf(x) → kα、f(x)g(x) → αβ、f(x)/g(x) → α/β（β ≠ 0）となります（極限の性質）。代入すると 0/0 になる形は、まず分子と分母を因数分解して約分します。
      - part: 思い出す
        text: x² − 5x + 6 を因数分解したものはどれですか。
        choices: [(x − 2)(x − 3), (x + 2)(x + 3), (x − 1)(x − 6), (x + 1)(x − 6)]
        answer: (x − 2)(x − 3)
        check: "[c for c, g in {'(x − 2)(x − 3)': lambda x: (x - 2) * (x - 3), '(x + 2)(x + 3)': lambda x: (x + 2) * (x + 3), '(x − 1)(x − 6)': lambda x: (x - 1) * (x - 6), '(x + 1)(x − 6)': lambda x: (x + 1) * (x - 6)}.items() if all(g(x) == x * x - 5 * x + 6 for x in range(-5, 6))][0]"
        hints:
          - かけて 6、たして −5 になる 2 つの数をさがしましょう（A-015）。
          - 2 つの数はどちらも負の数です。
          - 展開して、元の式にもどるかを確かめましょう。
        paths:
          - [かけて 6、たして −5 の 2 数は −2 と −3, (x − 2)(x − 3)]
      - part: 思い出す
        text: 分数式 (x² − 9)/(x² + x − 6) を約分したものはどれですか（x ≠ −3、x ≠ 2 とします）。
        choices: [(x − 3)/(x − 2), (x + 3)/(x − 2), (x − 3)/(x + 2), −9/(x − 6)]
        answer: (x − 3)/(x − 2)
        check: "[c for c, g in {'(x − 3)/(x − 2)': lambda x: (x - 3) / (x - 2), '(x + 3)/(x − 2)': lambda x: (x + 3) / (x - 2), '(x − 3)/(x + 2)': lambda x: (x - 3) / (x + 2), '−9/(x − 6)': lambda x: -9 / (x - 6)}.items() if all(abs(g(x) - (x * x - 9) / (x * x + x - 6)) < 1e-9 for x in (0.5, 1.7, 3.3, 4.1, 7.5))][0]"
        hints:
          - 分子と分母を、それぞれ因数分解しましょう（A-037）。
          - 分子は (x + 3)(x − 3) です。
          - 分子と分母に共通な因数で割りましょう。
        paths:
          - [分子は (x + 3)(x − 3), 分母は (x + 3)(x − 2), 共通な因数 x + 3 で約分して (x − 3)/(x − 2)]
        note: 分子と分母の x² を消して −9/(x − 6) とするのは、約分ではない（項は割れない）。
      - part: 今日
        text: lim (x→3) (2x² − x + 4) を求めましょう。
        answer: 19
        check: "(lambda f, a: (lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((f(a + 1e-6) + f(a - 1e-6)) / 2).limit_denominator(100)))(lambda x: 2 * x * x - x + 4, 3)"
        hints:
          - 多項式の関数の極限は、どうやって求められるでしょう。
          - x に 3 を代入した値が極限値になります。
          - 2 × 3² を先に計算しましょう。
        paths:
          - [多項式なので代入してよい, 2 × 9 − 3 + 4, 19]
      - part: 今日
        text: lim (x→−2) (x² − 4)/(x + 2) を求めましょう。
        answer: −4
        check: "(lambda f, a: (lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((f(a + 1e-6) + f(a - 1e-6)) / 2).limit_denominator(100)))(lambda x: (x * x - 4) / (x + 2), -2)"
        hints:
          - x = −2 を代入すると、分子も分母も 0 になります。
          - 分子を因数分解しましょう。
          - x ≠ −2 なので、x + 2 で約分できます。
        paths:
          - ["(x² − 4)/(x + 2) = (x + 2)(x − 2)/(x + 2) = x − 2", x → −2 のとき x − 2 → −4]
        note: 0/0 を「0」や「1」としやすい。0/0 は値ではなく、約分してから近づける形と覚えさせる。
      - part: 挑戦
        text: lim (x→3) (x² − 2x − 3)/(x² − 9) を求めましょう。
        answer: 2/3
        check: "(lambda f, a: (lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((f(a + 1e-6) + f(a - 1e-6)) / 2).limit_denominator(100)))(lambda x: (x * x - 2 * x - 3) / (x * x - 9), 3)"
        hints:
          - x = 3 を代入すると、どんな形になるでしょう。
          - 分子と分母を、それぞれ因数分解しましょう。
          - 共通な因数で約分してから、x を 3 に近づけましょう。
        paths:
          - ["分子は (x − 3)(x + 1)、分母は (x − 3)(x + 3)", 約分して (x + 1)/(x + 3), x → 3 で 4/6 = 2/3]
        note: 約分したあとの (x + 1)/(x + 3) は x = 3 で分母が 0 でないので、代入してよい。4/6 の約分を忘れやすい。
