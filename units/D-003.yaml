        answer: 極限は存在しない
        check: "(lambda f, a: [c for c, ok in {'7': abs(f(a + 1e-6) - 7) < 1e-4 and abs(f(a - 1e-6) - 7) < 1e-4, '9': abs(f(a + 1e-6) - 9) < 1e-4 and abs(f(a - 1e-6) - 9) < 1e-4, '8': abs(f(a + 1e-6) - 8) < 1e-4 and abs(f(a - 1e-6) - 8) < 1e-4, '極限は存在しない': abs(f(a + 1e-6) - f(a - 1e-6)) > 0.5}.items() if ok][0])(lambda x: x * x - 2 if x < 3 else 2 * x + 3, 3)"
