          - 左側からの極限は、x² − 4x + a に x = 3 を代入した値です。
          - f(3) は 2x − 1 で計算します。
        paths:
          - [左側からの極限は 9 − 12 + a = a − 3, f(3) = 5, a − 3 = 5 より a = 8]
      - part: 挑戦
        text: lim (x→∞) (√(x² + ax + 1) − x) = 5 となるような定数 a はいくつですか。
        answer: 10
        check: "[a for a in range(-30, 31) if abs((lambda x: math.sqrt(x * x + a * x + 1) - x)(1e8) - 5) < 1e-4][0]"
        hints:
          - まず、a のまま有理化して極限を求めましょう。
          - 分子は ax + 1、分母は √(x² + ax + 1) + x になります。
          - 分子と分母を x でわって、極限を a の式で表しましょう。
        paths:
          - ["(ax + 1)/(√(x² + ax + 1) + x)", x でわると (a + 1/x)/(√(1 + a/x + 1/x²) + 1) → a/2, a/2 = 5 より a = 10]

