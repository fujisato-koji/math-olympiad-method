        explain: x が 1 より大きい値をとりながら 1 に近づくことを x → 1 + 0、1 より小さい値をとりながら近づくことを x → 1 − 0 と書きます。f(x) は x < 1 では x²、x ≧ 1 では x + 2 です。x → 1 − 0 では x² → 1 なので lim (x→1−0) f(x) = 1（左側からの極限）、x → 1 + 0 では x + 2 → 3 なので lim (x→1+0) f(x) = 3（右側からの極限）です。右側と左側からの極限が一致するときに限り lim (x→1) f(x) が存在して、その値になります。ここでは一致しないので、f(1) = 3 という値はあっても、lim (x→1) f(x) は存在しません。図の白丸はその点をふくまないこと、黒丸はふくむことを表します。また、g(x) = 1/x² は、x を 0 に近づけると、右からも左からも限りなく大きくなります。これを lim (x→0) 1/x² = ∞ と書き、正の無限大に発散するといいます（∞ は数ではありません）。負の値をとりながら限りなく小さくなる（−100、−10000、… のように）ときは −∞ と書き、負の無限大に発散するといいます。1/x は x → 0 + 0 で ∞、x → 0 − 0 で −∞ なので、lim (x→0) 1/x は存在しません。分数関数 y = k/(x − p) + q（A-038）のグラフが直線 x = p に近づくのは、x → p + 0 や x → p − 0 で y が ∞ か −∞ になるからです。この直線を縦の漸近線といいます。
