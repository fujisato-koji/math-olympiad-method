        text: lim (x→9) (√x − 3)/(x − 9) と lim (x→2) (x³ − 8)/(x − 2) を求めてみましょう。
        explain: どちらも代入すると 0/0 の形です。√ の差があるときは、分子と分母に √x + 3 をかけます（有理化、A-016）。(√x − 3)(√x + 3) = x − 9 なので、(√x − 3)/(x − 9) = (x − 9)/{(x − 9)(√x + 3)} = 1/(√x + 3) です。x ≠ 9 なので約分でき、x → 9 のとき √x + 3 → 6 なので、極限値は 1/6 です（√x は x ≧ 0 で、x に 9 を近づけると √x は 3 に近づきます）。3 次式の分子 x³ − 8 は、x = 2 を代入すると 0 になるので、x − 2 でわってみます（A-037 の多項式のわり算）。商は x² + 2x + 4、余りは 0 なので、x³ − 8 = (x − 2)(x² + 2x + 4) です。約分すると x² + 2x + 4 で、x → 2 のとき 4 + 4 + 4 = 12 に近づきます。分数式が分子や分母にあるときは、先に通分してまとめてから約分します。どの形でも、「0 になる因数を見つけて約分する」ことが目あてです。
