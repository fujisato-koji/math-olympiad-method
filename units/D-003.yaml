        explain: 関数 f(x) が x = a で値をもち、lim (x→a) f(x) = f(a) となるとき、f(x) は x = a で連続であるといいます。x = a の近くの値の行き先と、x = a での値が一致するということです。多項式の関数はすべての x で連続、分数関数は分母が 0 でない x で連続、√(x + 2) のような関数は根号の中が 0 以上の x（定義域）で連続です（1 日目の「代入した値が極限値」はこのことです）。1 日目の f(x) = (x² − 1)/(x − 1) は x = 1 で値がないので連続ではありませんが、f(1) = 2 と決めれば連続になります。3 日目の見本の関数（x < 1 で x²、x ≧ 1 で x + 2）のように右と左で行き先がちがうと、x = 1 での値をどう決めても連続になりません。ある区間のすべての x で連続な関数を、その区間で連続であるといいます。区間 a ≦ x ≦ b で連続な関数 f(x) で、f(a) と f(b) の符号がちがうなら、方程式 f(x) = 0 は a < x < b の範囲に少なくとも 1 つの解をもちます。これを中間値の定理といいます。グラフがつながっているので、x 軸の下から上へ行くには、どこかで x 軸を横切るということです。f(x) = x³ + x − 3 は、f(1) = −1 で負、f(2) = 7 で正なので、x³ + x − 3 = 0 は 1 < x < 2 の範囲に解をもちます。
