      - part: 挑戦
        text: lim (x→−3) (2x² + 5x − 3)/(x² + 2x − 3) を求めましょう。
        answer: 7/4
        accept: [1.75]
        check: "(lambda f, a: (lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction((f(a + 1e-6) + f(a - 1e-6)) / 2).limit_denominator(100)))(lambda x: (2 * x * x + 5 * x - 3) / (x * x + 2 * x - 3), -3)"
        hints:
