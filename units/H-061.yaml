# H-061 色が変わる
#
# 段 1・水準 1・4 日。むらさきキャベツの色水（はっぱを手でちぎり、水といっしょにもむ）と、色水にすっぱい物（おす、レモンのしる）を入れるとピンクに、石けん水を入れるとみどりに色が変わることを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 色水をつくる（もむほど、水がすくないほど色がこい）、2 日目 すっぱい物と石けん水で色が変わる（水やさとう水、しお水ではむらさきのまま）、3 日目 わけ（色を見れば、なめずに物のなかまがわかる）、4 日目 確認。
# 図の約束：色水はむらさき、すっぱい物を入れた色水はピンク、石けん水を入れた色水はみどり。すきとおった水はうすいはいいろとなみせん、石けん水は白っぽい水とあわ。まだわからない色は、てんせんのコップに ? でかく。いろのもとは、てんでかく。
# 火や湯、刃物は使わない（はっぱは手でちぎり、水ともむ）。しらべた水はのまない・なめない、と explain に書いた。
# 腕だめし（離）は 2 問とも、絵の色を読む読み取り（kinds: 読み取り）。
# 酸性・中性・アルカリ性と指示薬のことばは H-005（段 2）で扱うので、ここでは使わない。

id: H-061
