        explain: |-
          「いろ水は、すっぱい ものを 入れると ピンクに、石けん水を 入れると みどりに なり、水や さとう水では むらさきの ままだった。どの いろに なるかは なかまで きまって いるので、なぞの 水を すこし 入れて いろを 見れば、なめなくても どの なかまか わかる。」の ように いえれば よい。
          ① いろ水の いろは、入れた ものに よって かわる、② どの いろに なるかは なかまで きまって いる、③ だから いろを 見れば なかまが わかる、の 3 つが 入れば よい。わからない ものを なめて しらべるのは あぶないので、いろで しらべる よさにも ふれる。
