        explain: |-
          むらさきキャベツの はっぱには、むらさきの いろの もと（アントシアニン）が 入って います。手で ちぎって 水と もむと、きれめから いろの もとが 水に 出て きて、むらさきの いろ水に なります。ふつうの みどりの キャベツでは、水に いろは ほとんど つきません。
          はっぱ 2〜3 まいと コップ 1 ぱいほどの 水で できる。ふくろの 口を しっかり とじて もむと こぼれない。もんだ あと はっぱを とりだし、いろ水を コップに うつして 2 日目から つかう。いろ水は のまない。
