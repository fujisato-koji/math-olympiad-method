  - day: 1
    items:
      - part: 見本
        text: |-
          むらさきキャベツの はっぱを、手で 小さく ちぎります。
          ふくろに 入れて 水を 入れ、よく もみます。
          はっぱの 中の むらさきの いろの もとが 水に 出て、むらさきの いろ水が できます。
