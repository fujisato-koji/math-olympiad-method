        explain: |-
          むらさきキャベツの いろの もと（アントシアニン）は、まざった ものに よって いろを かえます。おすや レモンの しるの ような すっぱい ものでは ピンク（たくさん 入れると あかっぽく）に、石けん水では みどりに なります。水や さとう水、しお水では むらさきの まま です。
          石けん水は、かたまりの 石けんを 水に とかした ものを つかう。だいどころの あらいものの せんざいは、まぜても むらさきの ままの ものが おおいので つかわない。いろ水も、まぜた 水も のまない・なめない。石けん水が 目に 入らない よう 見まもる。
