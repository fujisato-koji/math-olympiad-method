  - day: 4
    items:
      - part: 見本
        id: "5412800b79"
        text: いくつかの物を 1 つの点で代表させたものが「重心」。重心の位置 = (質量 × 位置の合計) ÷ 質量の合計。2 kg が 0 m の所に、1 kg が 3 m の所にあると、重心は (2 × 0 + 1 × 3) ÷ 3 = 1 m の所。重心の速さ = 運動量の合計 ÷ 質量の合計。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="130" x2="290" y2="130" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="50" cy="105" r="24" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="50" y="110" font-size="14" text-anchor="middle" fill="currentColor">2 kg</text><circle cx="260" cy="110" r="16" fill="#7bc96f" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="260" y="115" font-size="14" text-anchor="middle" fill="currentColor">1 kg</text><polygon points="120,130 112,148 128,148" fill="#f08080" fill-opacity="0.7" stroke="currentColor" stroke-width="2"/><text x="120" y="168" font-size="14" text-anchor="middle" fill="currentColor">重心 G</text><text x="50" y="160" font-size="14" text-anchor="middle" fill="currentColor">0 m</text><text x="260" y="160" font-size="14" text-anchor="middle" fill="currentColor">3 m</text></svg>'
        explain: 重心の位置 x_G = Σ m x ÷ Σ m。運動量の合計は P = M v_G（M は全質量）なので、外力が 0 なら重心の速度は一定。2 物体の衝突でも、衝突の前後で重心の速度は変わらない（内力だけだから）。重心から見ると、全体の運動量は 0 になる。
