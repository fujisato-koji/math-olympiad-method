      - part: 今日
        text: 2 kg で右へ 8 m/s の台車が、止まっている 2 kg の台車にぶつかった。反発係数は 0.5。そのあと、手前の台車（はじめに動いていた方）の速さは何 m/s か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="40" y="122" width="60" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="70" y="142" font-size="14" text-anchor="middle" fill="currentColor">2 kg</text><circle cx="55" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="85" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="70" y1="106" x2="120" y2="106" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="130,106 120,111 120,101" fill="currentColor"/><text x="100" y="100" font-size="14" text-anchor="middle" fill="currentColor">8 m/s</text><rect x="170" y="122" width="60" height="30" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="200" y="142" font-size="14" text-anchor="middle" fill="currentColor">2 kg</text><circle cx="185" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="215" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="250" y="70" font-size="16" text-anchor="middle" fill="currentColor">e = 0.5</text></svg>'
