# P-006 運動量と衝突（運動量と力積、運動量保存、衝突と力学的エネルギー、重心運動と相対運動、二体問題、可変質量とロケット方程式）
#
# 水準 5・8 日。前提は P-003、P-004。運動量、力積、運動量保存、衝突（弾性・非弾性、反発係数）、重心運動と相対運動、二体問題、ロケットの加速。
# 一直線上の運動だけ。単位は kg、m/s、N、s、N·s、kg·m/s、J。ロケットは対数を使わず、ガスを何回かに分けて出す形で足し算にする。
id: P-006
days:
  - day: 1
    items:
      - part: 見本
        id: "a22461388f"
        text: 動いている物には「運動量」がある。運動量 = 質量 × 速さ。2 kg の台車が 3 m/s なら、2 × 3 = 6 kg·m/s。また、力 × 時間を「力積」という。力積 = 運動量の変わり。右向きを正とすると、左向きは負。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="80" y="122" width="60" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="110" y="142" font-size="14" text-anchor="middle" fill="currentColor">2 kg</text><circle cx="95" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="125" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="110" y1="106" x2="170" y2="106" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="180,106 170,111 170,101" fill="currentColor"/><text x="145" y="100" font-size="14" text-anchor="middle" fill="currentColor">3 m/s</text><text x="250" y="90" font-size="16" text-anchor="middle" fill="currentColor">運動量</text><text x="250" y="115" font-size="16" text-anchor="middle" fill="currentColor">2 × 3 = 6</text><text x="250" y="150" font-size="14" text-anchor="middle" fill="currentColor">力積 = 力 × 時間</text></svg>'
        explain: 運動量 p = m v は向きをもつ量（ベクトル）。一直線の運動では、向きを正負で表す。力積 I = F t は、力が時間のあいだはたらいた効果で、運動量の変化 m v₂ − m v₁ に等しい（運動方程式 m a = F を時間でまとめたもの）。単位は N·s と kg·m/s で同じ。
