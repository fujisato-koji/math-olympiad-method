      - part: 今日
        text: 3 kg で右へ 4 m/s の台車が、止まっている 1 kg の台車に弾性衝突した。そのあと、1 kg の台車は右へ何 m/s か。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="40" y="122" width="60" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="70" y="142" font-size="14" text-anchor="middle" fill="currentColor">3 kg</text><circle cx="55" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="85" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="70" y1="106" x2="120" y2="106" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="130,106 120,111 120,101" fill="currentColor"/><text x="100" y="100" font-size="14" text-anchor="middle" fill="currentColor">4 m/s</text><rect x="178" y="122" width="44" height="30" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="200" y="142" font-size="14" text-anchor="middle" fill="currentColor">1 kg</text><circle cx="189" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="211" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
        answer: 6
        check: "6"
        hints:
