        answer: 9
        check: "18-9"
        hints:
          - まず衝突後の 2 つの速さを出す。運動量の式と e の式を使う。
          - text: はなれる速さは、近づく速さ 6 に e をかけた数。1 kg の台車の速さを a、2 kg の台車の速さを b とする。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="80" font-size="16" text-anchor="middle" fill="currentColor">6 = a + 2 b</text><text x="160" y="120" font-size="16" text-anchor="middle" fill="currentColor">b − a = 3</text></svg>'
          - 前の運動エネルギーと、後の運動エネルギーの差を求める。
        paths:
          - [速さを先に出す, a + 2 b = 6 と b − a = 3 から b = 3、a = 0, 後の運動エネルギーは 2 × 3 × 3 ÷ 2 = 9 J, 前は 1 × 6 × 6 ÷ 2 = 18 J、失った分は 18 − 9 = 9 J]
          - [重心から考える, 重心の速さは 6 ÷ 3 = 2 m/s, 重心から見た運動エネルギーは前 18 − 3 × 2 × 2 ÷ 2 = 12 J、e = 0.5 で 4 分の 1 になるので後は 3 J, 失った分は 12 − 3 = 9 J]
