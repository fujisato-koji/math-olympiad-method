  - day: 2
    items:
      - part: 見本
        text: ぶつかったり、はなれたりするとき、まわりから力がなければ、全部の運動量の合計は変わらない。これを運動量保存という。3 kg で 4 m/s の台車が、止まっている 1 kg の台車に当たってくっつく。前の合計は 3 × 4 = 12。後は 4 kg だから、速さは 12 ÷ 4 = 3 m/s。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="40" y="122" width="60" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="70" y="142" font-size="14" text-anchor="middle" fill="currentColor">3 kg</text><circle cx="55" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="85" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="70" y1="106" x2="120" y2="106" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="130,106 120,111 120,101" fill="currentColor"/><text x="100" y="100" font-size="14" text-anchor="middle" fill="currentColor">4 m/s</text><rect x="168" y="122" width="44" height="30" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="190" y="142" font-size="14" text-anchor="middle" fill="currentColor">1 kg</text><circle cx="179" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="201" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="235" y="122" width="70" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="270" y="142" font-size="14" text-anchor="middle" fill="currentColor">4 kg</text><circle cx="252.5" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="287.5" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="250" y="60" font-size="14" text-anchor="middle" fill="currentColor">前 12 = 後 12</text></svg>'
        explain: 内力（物体どうしの力）は作用反作用で大きさが等しく向きが逆なので、2 物体の運動量の変化の合計は 0 になる。外力が 0（またはほとんどないほど短い時間）なら、合計の運動量が保存する。くっつく場合は後の質量を足して 1 つの物体とみなす。
