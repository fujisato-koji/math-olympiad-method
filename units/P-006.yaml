    text: かべの前に、1 kg の小さい玉が止まっている。その右に 9 kg の大きい玉があり、かべへ向かって 1 m/s で進んでくる。玉どうし、玉とかべのぶつかりはすべて反発係数 1（エネルギーを失わない）で、まさつはない。このあと、玉どうしのぶつかりと、玉とかべのぶつかりを合わせて、全部で何回ぶつかるか。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="20" y="100" width="10" height="60" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><circle cx="80" cy="140" r="14" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="80" y="145" font-size="14" text-anchor="middle" fill="currentColor">1 kg</text><circle cx="220" cy="130" r="24" fill="#7fc8f8" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="220" y="135" font-size="14" text-anchor="middle" fill="currentColor">9 kg</text><line x1="200" y1="90" x2="160" y2="90" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="150,90 160,85 160,95" fill="currentColor"/><text x="175" y="80" font-size="14" text-anchor="middle" fill="currentColor">1 m/s</text><text x="25" y="90" font-size="14" text-anchor="middle" fill="currentColor">かべ</text></svg>'
    answer: 9
    check: "9"
    hints:
      - 1 回ぶつかるたびに、2 つの玉の速さと向きが変わる。小さい玉がかべに向かうと、かべでもどってくる。ぶつかりがもう起きなくなるのは、どんなときか考える。
      - text: 玉どうしのぶつかりは、運動量の合計が同じで、近づく速さとはなれる速さが同じ。最初の 1 回の後の速さを出してみる。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="70" font-size="16" text-anchor="middle" fill="currentColor">9 × 1 = 9 a + b</text><text x="160" y="110" font-size="16" text-anchor="middle" fill="currentColor">近づく速さ = はなれる速さ</text><circle cx="160" cy="64" r="40" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - 「もうぶつからない」のは、小さい玉が大きい玉よりおそく（またはかべからはなれる向きで）進むとき。次の回に進んで、速さをならべて、いつ止まるかを見る。ぶつかりの回数がとても多いときは、別の見方でも数えられないか考える。
    paths:
      - [ぶつかりを 1 回ずつ順に追う, '1 回目：玉どうし、大きい玉 −0.8 m/s、小さい玉 −1.8 m/s', '2 回目：小さい玉がかべで向きを変える', 3 回目からも、玉どうし、かべ、玉どうし、…の順に速さを出す, 9 回目の玉どうしのぶつかりの後は、小さい玉が大きい玉よりおそくなり、もうぶつからない]
      - [速さを点で見る, 'エネルギーが一定なので、（大きい玉の速さ × 3、小さい玉の速さ）の組は円の上を動く', 'ぶつかるたびに点は円の上を決まった角度ずつ進み、その角度は 18.4 度（3 分の 1 の角）', 点が進める角度は半円 180 度まで, 180 ÷ 18.4 = 9.8 だから、整数部分で 9 回]
    note: 構造は S30 変換のきか、S01 不変量（エネルギーと運動量）、S15 場合分けの設計。種はなし。順に追うと 9 回の手順が長く、ミスしやすい。質量の比 9 の平方根 3 を見つけて円に直す見方が要る。前提は P-004 のエネルギー。

  - part: 離
    kinds: [総動員, 数, 道筋]
    uses: [P-004]
    text: なめらかなゆかの上に、1 kg の台車 A と 3 kg の台車 B が、ちぢめたばねをはさんでくっついて止まっている。ばねには 24 J のエネルギーがたくわえてある。糸を切ると、2 つは左右にはなれていく。A が向かう先には、まっすぐにかべがある。A はかべに当たると、同じ速さでもどる。もどった A は B に追いつき、ぶつかる（反発係数 1）。ぶつかったあとの B の速さは何 m/s か。（ばねは、はなれたあとは台車にふれない。）
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="20" y="100" width="10" height="60" fill="#c8ccd6" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><text x="25" y="90" font-size="14" text-anchor="middle" fill="currentColor">かべ</text><rect x="90" y="122" width="60" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="120" y="142" font-size="14" text-anchor="middle" fill="currentColor">A 1 kg</text><circle cx="105" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="135" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="150,130 154.3,139 158.6,121 162.9,139 167.1,121 171.4,139 175.7,121 180,130" fill="none" stroke="currentColor" stroke-width="2"/><rect x="180" y="122" width="60" height="30" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="210" y="142" font-size="14" text-anchor="middle" fill="currentColor">B 3 kg</text><circle cx="195" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="225" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="165" y="50" font-size="16" text-anchor="middle" fill="currentColor">エネルギー 24 J</text></svg>'
    answer: 4
    check: "4"
    hints:
      - ばねをはなした直後、A と B の速さを決めたい。はなす前は止まっているので、運動量の合計は 0。エネルギーの合計は 24 J になる。
      - text: A の速さを a、B の速さを b として、運動量の式と、エネルギーの式を 1 つずつ書く。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="160" y="80" font-size="16" text-anchor="middle" fill="currentColor">1 × a = 3 × b</text><text x="160" y="125" font-size="16" text-anchor="middle" fill="currentColor">1 × a × a ÷ 2 + 3 × b × b ÷ 2 = 24</text><circle cx="160" cy="74" r="70" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - A がかべで向きを変えたあと、A と B は同じ向きに進み、追いついてぶつかる。ぶつかるとき運動量とエネルギーは変わらない。あとは、ぶつかった後の 2 つの速さを出す。
    paths:
      - [衝突の式で順に追う, '糸を切った後は a = 3b と a × a ÷ 2 + 3 × b × b ÷ 2 = 24 から A は 6、B は 2', かべの後 A は反対向きに 6, A が B に追いつく前は、運動量の合計 6 + 6 = 12、近づく速さ 6 − 2 = 4 なので、ぶつかった後ははなれる速さも 4, A は x、B は x + 4 とおくと x + 3 (x + 4) = 12 から x = 0、B は 4 m/s]
      - [保存だけで見る, 'かべの後の A は 6、B は 2 だから、運動量の合計は 12、エネルギーは 24 J のまま', 'ぶつかった後の A を a、B を b とすると a + 3 b = 12 と a × a + 3 × b × b = 48', 'この 2 つを満たすのは (6, 2) と (0, 4)。(6, 2) はぶつかる前と同じ', 'だからぶつかった後は A が 0、B が 4 m/s']
    note: 構造は S01 不変量（運動量とエネルギー）、S16 後ろから考える。種はなし。ばねの分離、かべ、衝突の 3 つの段を、保存の見方でつなぐ。かべで A の向きが変わると運動量の合計がちがう点を見落としやすい。前提は P-004。

  - part: 離
    kinds: [総動員, 数, 道筋]
    uses: [P-004]
    text: 0.2 kg のボールを、高さ 5 m から静かに落とす。ボールはゆかにぶつかるたびに、ぶつかる前の速さの半分（反発係数 0.5）ではねかえる。これをくり返し、とても多くはねたあと、ボールはゆかの上で止まる。止まるまでに、ゆかがボールにあたえた力積の合計は何 N·s か。重力の加速度は 10 m/s²。空気のていこうはない。
    svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="100" cy="30" r="12" fill="#f3c969" fill-opacity="0.6" stroke="currentColor" stroke-width="2"/><path d="M130 60 Q126 111.3 153.4 142.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="160,150 149.6,145.8 157.2,139.2" fill="currentColor"/><path d="M165 150 Q164 118 185.3 112.5" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="195,110 186.6,117.3 184.1,107.7" fill="currentColor"/><path d="M200 110 Q200.6 137.4 216.1 145.4" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="225,150 213.8,149.9 218.4,141" fill="currentColor"/><text x="160" y="190" font-size="14" text-anchor="middle" fill="currentColor">ゆか</text><text x="250" y="70" font-size="16" text-anchor="middle" fill="currentColor">0.2 kg</text><text x="250" y="100" font-size="16" text-anchor="middle" fill="currentColor">5 m</text></svg>'
    answer: 6
    check: "Fraction(1,5)*10*(1+Fraction(1,2))/(1-Fraction(1,2))"
    hints:
      - ゆかとの 1 回ごとのぶつかりで、ボールの運動量は変わる。その変わった分が、ゆかがその 1 回であたえた力積。まず最初にゆかへ着くときの速さを出す。
      - text: 最初の速さは 10 m/s。1 回目のはねかえりで 5 m/s、2 回目は 2.5 m/s、…と、半分ずつになる。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="80" y="100" font-size="16" text-anchor="middle" fill="currentColor">10</text><text x="130" y="100" font-size="16" text-anchor="middle" fill="currentColor">5</text><text x="180" y="100" font-size="16" text-anchor="middle" fill="currentColor">2.5</text><text x="230" y="100" font-size="16" text-anchor="middle" fill="currentColor">…</text><circle cx="80" cy="94" r="24" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
      - ゆかの力積は、向きが上。1 回ごとの力積は「おりる速さ + あがる速さ」に質量をかけた数。数が半分ずつ小さくなる列を、全部足すと決まった数に近づく。もう 1 つ、はじめと終わりの運動量が 0 であることを使う見方もある。
    paths:
      - [1 回ずつの力積を足す, 'ゆかに着く速さは 10 m/s、1 回目のはねかえりは 5 m/s', '1 回目 0.2 × (10 + 5) = 3、2 回目 0.2 × (5 + 2.5) = 1.5、3 回目 0.75、…', 3 + 1.5 + 0.75 + … は半分ずつ小さくなる列、全部足すと 3 × 2 = 6 N·s]
      - [重力の力積と見くらべる, 'はじめも終わりも運動量は 0 なので、ゆかの力積と重力の力積は大きさが同じで向きが反対', '落ちる時間は 1 秒、あとは 1 回ごとに上り下りの時間が半分ずつ：1、0.5、0.25、…', 最初のはねかえりの上り下りは 1 秒、そのあとも 0.5、0.25、…なので、上り下りの合計は 1 + 0.5 + 0.25 + … = 2 秒、総時間は 1 + 2 = 3 秒, 重力の力積は 0.2 × 10 × 3 = 6 N·s]
    note: 構造は S01 不変量（運動量の変化）、S04 言いかえ（力積を重力の力積に）、S13 漸化式（半分ずつの列）。種はなし。無限回のはねかえりの列と、ぶつかりを 1 回も見ずに答える見方が要る。前提は P-004 のエネルギーで落ちる速さを出す。
