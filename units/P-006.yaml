        text: ぶつかるとき、運動量の合計は変わらないが、運動エネルギーは変わることがある。変わらない衝突を「弾性衝突」、くっついて速さが同じになる衝突は運動エネルギーが減る。ちがいは「反発係数」e = はなれる速さ ÷ 近づく速さで表す。弾性衝突は e = 1、くっつく衝突は e = 0。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="30" y="122" width="60" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="60" y="142" font-size="14" text-anchor="middle" fill="currentColor">1 kg</text><circle cx="45" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="75" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="60" y1="106" x2="110" y2="106" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="120,106 110,111 110,101" fill="currentColor"/><text x="90" y="100" font-size="14" text-anchor="middle" fill="currentColor">4 m/s</text><rect x="160" y="122" width="60" height="30" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="190" y="142" font-size="14" text-anchor="middle" fill="currentColor">1 kg</text><circle cx="175" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="205" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="160" y="40" font-size="14" text-anchor="middle" fill="currentColor">近づく速さ 4</text><text x="160" y="62" font-size="14" text-anchor="middle" fill="currentColor">e = 1 なら 4</text></svg>'
        explain: 反発係数 e は、衝突の前後での相対速度の比（大きさ）。弾性衝突（e = 1）は力学的エネルギーが保存し、完全非弾性衝突（e = 0）は最も多く失う。0 < e < 1 はその中間。一直線上の衝突は、運動量保存の式と e の式の 2 つの式で、衝突後の 2 つの速さが決まる。
      - part: 今日
        id: "5b815f9c54"
        text: 2 kg で 3 m/s の台車が、止まっている 4 kg の台車にぶつかってくっついた（速さは 1 m/s）。この衝突で失われた運動エネルギーは何 J か。運動エネルギーは質量 × 速さ × 速さ ÷ 2。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="160" x2="310" y2="160" fill="none" stroke="currentColor" stroke-width="2"/><rect x="40" y="122" width="60" height="30" rx="4" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="70" y="142" font-size="14" text-anchor="middle" fill="currentColor">2 kg</text><circle cx="55" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="85" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="70" y1="106" x2="120" y2="106" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="130,106 120,111 120,101" fill="currentColor"/><text x="100" y="100" font-size="14" text-anchor="middle" fill="currentColor">3 m/s</text><rect x="165" y="122" width="70" height="30" rx="4" fill="#7bc96f" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="200" y="142" font-size="14" text-anchor="middle" fill="currentColor">4 kg</text><circle cx="182.5" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="217.5" cy="156" r="5" fill="none" stroke="currentColor" stroke-width="2"/><text x="260" y="70" font-size="14" text-anchor="middle" fill="currentColor">合体後 1 m/s</text></svg>'
        answer: 6
        check: "2*3*3//2-6*1*1//2"
        hints:
          - 失われた分は、前の運動エネルギーと後の運動エネルギーの差。
          - text: 前に動いているのは 2 kg の台車だけ。後は 2 つがくっついて 1 つ。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="100" y="90" font-size="16" text-anchor="middle" fill="currentColor">前 2 kg 3 m/s</text><text x="230" y="90" font-size="16" text-anchor="middle" fill="currentColor">後 ？ kg 1 m/s</text><circle cx="100" cy="84" r="20" fill="none" stroke="#f08080" stroke-width="3" stroke-dasharray="6 4"/></svg>'
          - 前は 2 × 3 × 3 ÷ 2、後は合計の質量 × 1 × 1 ÷ 2 で計算して、ひく。
