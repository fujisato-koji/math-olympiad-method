# L-003 本当とうその推理
#
# 書き方は N-001 の頭の注のとおり。段 2 なので、子に見せる文は ひらがなと カタカナの 分かち書き。
# 前提は L-002 だけ（たし算は前提にない）なので、数は かぞえるだけで 10 まで。人の代わりに どうぶつを使う。
# 日の並びは地図の既定（導入、練習、わけ、混ぜる、確認）。ねらいは次のとおりにした。
#   1 日目 導入：えと くらべて ほんとうか うそかを決める。うその はんたいが ほんとうになる（うそしか いわない どうぶつの ことば）。
#   2 日目 練習：「ひとりだけ うそ」の推理。だれかを はんにんと かりに決めて、うその数を かぞえて確かめる（場合分けの入口）。「ひとりだけ ほんとう」も。
#   3 日目 わけ：うその はんたい、かりに決めて確かめる、ヒントが たりないと きまらない、の わけを口で言う。
#   4 日目 混ぜる：L-002 の型（だれのものか、ならぶ じゅんばん）に うそが まじる。しょうじきものと うそつきの 2 ひき。
#   5 日目 確認。
# 「しょうじきもの（いつも ほんとう）と うそつき（いつも うそ）」は、えや そとの ようすと くらべて決まる 2 ひきまでにした。
# ことばが ほかの どうぶつの ことばを さす推理や、3 ひき以上の組み合わせを表にして整理するのは L-008（条件を整理する推理）にまわす。
# check は、ありうる場合（はんにん、ならび、もちもの）をすべて並べ、それぞれの ことばが ほんとうか うそかを計算し、
# 問題の条件（うそが ひとりだけ など）に合う場合だけを残す。たずねた答えが 1 つでないときは「きまらない」を返す。

id: L-003
days:
  - day: 1
    items:
      - part: 見本
        text: えを みて、ほんとうか うそか きめよう。
        figure: 🍎🍎🍎🍌
        explain: 「りんごは 3 こ ある」は、えと あって いるので ほんとう です。「バナナは 2 ほん ある」は、えでは 1 ぽん なので うそ です。
      - part: 思い出す
        text: いぬ、ねこ、うさぎが、🍎 🍌 🍇 を ひとつずつ たべました。ねこは 🍇 です。いぬは 🍌 では ありません。いぬが たべたのは どれですか。
        figure: "🐶🐱🐰\n🍎🍌🍇"
        choices: [🍎, 🍌, 🍇]
        answer: 🍎
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[0] for p in itertools.permutations(['🍎', '🍌', '🍇']) if p[1] == '🍇' and p[0] != '🍌'])))"
        hints:
          - ねこは 🍇 と わかって いるね。
          - いぬに のこって いるのは どれと どれかな。
          - そのうち、いぬでは ない ほうに ばつを つけよう。
        paths:
          - [ねこは 🍇, いぬは 🍎 か 🍌, 🍌 では ない, 🍎]
      - part: 思い出す
        text: くま、さる、ぶたが 1 れつに ならんで います。くまは さるの まえ です。ぶたは くまの まえ です。いちばん うしろは だれですか。
        choices: [くま, さる, ぶた]
        answer: さる
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')(sorted(set([p[2] for p in itertools.permutations(['くま', 'さる', 'ぶた']) if p.index('くま') < p.index('さる') and p.index('ぶた') < p.index('くま')])))"
        hints:
          - 「くまは さるの まえ」を、かみに かいてみよう。
          - ぶたは どこに はいるかな。
          - かいた ならびの いちばん うしろを みよう。
        paths:
          - [くま、さる の じゅん, ぶたは くまの まえ, ぶた、くま、さる, いちばん うしろは さる]
      - part: 今日
        text: 「いぬは 3 びき いる」。これは ほんとうですか、うそですか。
        figure: 🐶🐶🐱🐱🐱
        choices: [ほんとう, うそ]
        answer: うそ
        check: "'ほんとう' if n('🐶') == 3 else 'うそ'"
        hints:
          - いぬを かぞえよう。
          - 「3 びき」と いって いるね。かぞえた かずと おなじかな。
          - おなじなら ほんとう、ちがえば うそだよ。
        paths:
          - [いぬを かぞえる, 2 ひき, 3 びきでは ない, うそ]
        note: ねこの 3 びきと まぜて「3 びき いる」から ほんとうと こたえやすい。だれの ことかを たしかめる。
      - part: 今日
        text: えを みて、いぬ、ねこ、うさぎが いいました。いぬ「いちごは 4 こ」、ねこ「ぶどうは 2 こ」、うさぎ「ぶどうの ほうが おおい」。うそを いって いるのは だれですか。
        figure: 🍓🍓🍓🍓🍇🍇
        choices: [いぬ, ねこ, うさぎ]
        answer: うさぎ
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([x for x, ok in [('いぬ', n('🍓') == 4), ('ねこ', n('🍇') == 2), ('うさぎ', n('🍇') > n('🍓'))] if not ok])"
        hints:
          - いちごと ぶどうを かぞえよう。
          - ひとりずつ、えと あって いるか たしかめよう。
          - えと あわないのは、だれの ことばかな。
        paths:
          - [いちごは 4 こ ぶどうは 2 こ, いぬと ねこは あって いる, ぶどうの ほうが すくない, うさぎ]
      - part: 今日
        text: くまが「ぼくは 🍰 を たべて いない」と いいました。でも、これは うそ でした。くまは 🍰 を たべましたか。
        figure: 🐻🍰
        choices: [たべた, たべて いない]
        answer: たべた
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([s for s in ['たべた', 'たべて いない'] if (s == 'たべて いない') == False])"
        hints:
          - くまは「たべて いない」と いったね。
          - それが うそ なら、ほんとうは どちらかな。
          - 「たべて いない」の はんたいは なにかな。
        paths:
          - [「たべて いない」は うそ, うその はんたいが ほんとう, たべた]
        note: くまの ことばを そのまま こたえて「たべて いない」と えらびやすい。「うそ だった」を もう いちど よませる。
      - part: 挑戦
        text: ぶたは いつも うそしか いいません。ぶたが「ぼくの ぼうしは あかい」と いいました。ぼうしは、あかか あおの どちらかです。ぶたの ぼうしは なにいろですか。
        figure: 🐷
        choices: [あか, あお]
        answer: あお
        check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([x for x in ['あか', 'あお'] if (x == 'あか') == False])"
        hints:
          - ぶたの いった ことは、ほんとうかな、うそかな。
          - 「あかい」が うそ なら、あかでは ないね。
          - あかで ない ほうの いろは どれかな。
        paths:
          - [ぶたは うそしか いわない, 「あかい」は うそ, あかでは ない, あお]
          - ["もし ぼうしが あか なら、ぶたの「あかい」は ほんとう", "でも ぶたは うそしか いわない", "だから あかでは ない。あお"]
