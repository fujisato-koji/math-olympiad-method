    uses: [N-008]
    text: はこの なかに、あめが 1 こから 10 この どれかの かずだけ はいって います。いぬ「6 こより おおいよ」、ねこ「7 こより おおいよ」、うさぎ「ぐうすうだよ」。うそを ついて いるのは 1 ぴき だけ です。あめは なんこ ありますか。
