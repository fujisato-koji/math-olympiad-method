    kinds: [道筋]
    text: 🍩 を たべたのは、いぬ、ねこ、うさぎ、くまの だれか 1 ぴきです。いぬ「ねこが たべたよ」、ねこ「くまが たべたよ」、うさぎ「ぼくは たべて いないよ」、くま「ぼくは たべて いないよ」。ほんとうを いって いるのは 1 ぴき だけ です。たべたのは だれですか。
    figure: "🐶🐱🐰🐻🍩"
    choices: [いぬ, ねこ, うさぎ, くま]
    answer: うさぎ
    check: "(lambda c: c[0] if len(c) == 1 else 'きまらない')([x for x in ['いぬ', 'ねこ', 'うさぎ', 'くま'] if [x == 'ねこ', x == 'くま', x != 'うさぎ', x != 'くま'].count(True) == 1])"
    hints:
      - ねこと くまの ことばを くらべて みよう。
      - ねこと くまの どちらか 1 ぴきは、かならず ほんとうを いって いるね。
      - それなら、いぬと うさぎの ことばは どうなるかな。
    paths:
      - [ねこと くまの ことばは はんたい, どちらか 1 ぴきが ほんとう, いぬと うさぎは うそ, うさぎの「たべて いない」が うそ, うさぎ]
