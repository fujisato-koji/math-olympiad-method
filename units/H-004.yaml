        explain: |-
          空気の 中みは、ちっそ が やく 78 %、さんそ が やく 21 %、にさんかたんそ は やく 0.04 % です。えの 10 この つぶは、ちっそ 8、さんそ 2 で その わりあいを あらわしました（H-003 の「ものは 小さな つぶで できて いる」を つかいます）。
          さんそ には ものを もやす はたらきが あり、ちっそ や にさんかたんそ には ありません。さんそ そのものは もえません。もえる ものが さんそ と むすびつく ことが「もえる」です。えの 右上の びんは、さんそ を ふやした 空気（10 この つぶの うち 7 こ が さんそ）で、ほのおが 空気の 中より 大きく なります。さんそ だけの びんでは、もっと はげしく もえます。
          にさんかたんそ が まざると、せっかいすい という すきとおった 水が 白く にごります（えの 下の だん）。ふつうの 空気にも にさんかたんそ は やく 0.04 % ありますが、びんに 入れて ふる くらいでは にごりません。せっかいすいや、さんそ・ちっそ だけの びんは 学校の じっけんで つかう ものです。せっかいすいは 目や 手に つかない ように します。
