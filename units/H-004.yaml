            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><text x="20" y="81" font-size="14" text-anchor="start" fill="currentColor">もえる まえ</text><circle cx="140" cy="76" r="10" fill="#f08080" fill-opacity=".9" stroke="currentColor" stroke-width="1.5"/><circle cx="170" cy="76" r="10" fill="#f08080" fill-opacity=".9" stroke="currentColor" stroke-width="1.5"/><text x="20" y="141" font-size="14" text-anchor="start" fill="currentColor">きえた あと</text><circle cx="140" cy="136" r="10" fill="#f08080" fill-opacity=".9" stroke="currentColor" stroke-width="1.5"/><circle cx="170" cy="136" r="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/></svg>'
          - ふたが あると、そとの 新しい 空気は 入って こられるかな。
        paths:
          - [もえると さんそ が つかわれて へる, ふたが あるので 新しい 空気が 入らない, さんそ が 少なく なると 火が きえる]
          - [もえると にさんかたんそ が できる, にさんかたんそ には もやす はたらきが ない, もやす さんそ が たりなく なって 火が きえる]
        explain: |-
          「ろうそくが もえると、さんそ が つかわれて へり、かわりに にさんかたんそ が できる。ふたが あるので、そとから 新しい 空気（さんそ）が 入って こない。さんそ が 少なく なると、ろうそくは もえつづけられなく なって、火が きえる。」と 言えれば よい。
          ① もえると さんそ が へり、にさんかたんそ が ふえる、② ふたで 新しい 空気が 入らない、③ さんそ が 少なく なると 火が きえる（さんそ が ぜんぶ なくなる わけでは ない）、の 3 つが 入れば よい。ちっそ は もえる まえと あとで かわりません。
          じっさいには、さんそ は やく 21 % から やく 17 % に へり、にさんかたんそ は やく 0.04 % から 3〜4 % くらいに ふえます。えでは わかりやすく 1 つぶだけ かえて かきました。1 日目の「空気が 入れかわらないと きえる」の わけが、ここで わかります。
