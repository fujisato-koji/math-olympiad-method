# H-004 物の燃え方と空気
#
# 段 2・水準 2・5 日。物が燃えつづけるには新しい空気が入れかわることがいる、空気はちっそ・さんそ・にさんかたんそなどがまざったもので、物を燃やすはたらきがあるのはさんそ、燃えるとさんそが使われてへり、にさんかたんそができる、燃えた後の物（燃えた後の空気、木の灰はもう燃えず軽くなる）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、explain、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。1 日目 燃えつづけるには空気の入れかわりがいる（コップ、そこのないびん、せんこうのけむり、まき、うちわ）、2 日目 空気の中みとさんそのはたらき、せっかいすい（石灰水）、3 日目 わけ（ふたをしたびんで火が消えるわけ）と燃えた後の物、4 日目 混ぜる、5 日目 確認。
# 図の約束：空気は 10 このつぶでかく（ちっそ＝灰色 8、さんそ＝赤 2。にさんかたんそはほんの少しなのでかかない）。燃えた後はさんその 1 つをにさんかたんそ（紫）にかえてかく（実際はさんそ約 21 % → 約 17 %、にさんかたんそ約 0.04 % → 約 3〜4 %）。
# びんは口が上。すきまの実験だけ、そこのないびんをねんど（茶）の上にかぶせる。空色のやじるしは空気の動き。消えたろうそくはほのおの代わりにけむりをかく。せっかいすいはすきとおった空色、白くにごると灰色に白い点。
# 火を使う場面にはすべて「おうちの ひとと いっしょに」を付けた。せっかいすいやさんそ・ちっそだけのびんは学校の実験として出す。
# 腕だめし（離）は 2 問とも読み取り（火が消えるまでの時間のぼうグラフ、燃やす前と後の気体の量のぼうグラフ）。
# 粒の考え（H-003）を空気のつぶの絵で使う。呼吸（B-020）、植物の養分（B-019）、原子と化学変化・金属を燃やすと重くなること（H-008）はここでは問わない。

id: H-004
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          火は、まわりの 空気の 中で もえて います。
          アルコールランプの 火に ガラスの ふたを かぶせると、火が きえます。ふたの 中の 空気が、そとの 新しい 空気と 入れかわらなく なる からです。
          ものが もえつづけるには、新しい 空気が 入れかわる ことが いります。
