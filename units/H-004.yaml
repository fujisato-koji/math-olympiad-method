      - part: 見本
        text: |-
          空気は、ちっそ、さんそ、にさんかたんそ などが まざった ものです。どれも 目に 見えません。
          えでは、空気を 10 この つぶで あらわします。はいいろの つぶが ちっそ、赤い つぶが さんそ です。にさんかたんそ は ほんの 少しなので かきません。
          ものを もやす はたらきが あるのは、さんそ です。さんそ を ふやした びんの 中では、ろうそくが 空気の 中より はげしく もえます。
          せっかいすい という すきとおった 水に、にさんかたんそ が まざると、白く にごります。ふつうの 空気では、にさんかたんそ が ほんの 少しなので、にごりません。
