        explain: |-
          ものが もえるには、もえる もの、空気、火を つける あつさ の 3 つが いります。アルコールランプに ふたを かぶせると、ふたの 中の 空気が そとの 空気と 入れかわらないので、火が きえます（アルコールランプは 学校の じっけんで つかう どうぐで、火を けす ときは ふたを かぶせます）。今日の もんだいでは、同じ ことを ろうそくと コップで たしかめます。空気の 中の なにが いるのかは 2 日目、どうして きえるのかは 3 日目に あつかいます。
          コップの じっけんを いえで ためす ときは、おうちの ひとと いっしょに、ろうそくを おさらに 立て、あつさに 強い ガラスの コップを つかいます。きえた あとも コップは しばらく あついので、すぐに さわらない ように します。
      - part: 今日
        text: ろうそく ア には ガラスの コップを かぶせ、ろうそく イ には なにも かぶせませんでした。しばらく して、まだ 火が もえて いる のは どちらかな。（おうちの ひとと いっしょに）
