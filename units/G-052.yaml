ay="5 4"/><text x="34.6" y="49.7" font-size="14" text-anchor="middle">A</text><text x="160.6" y="56.1" font-size="14" text-anchor="middle">B</text><text x="204.5" y="16.4" font-size="14" text-anchor="middle">C</text><text x="83.9" y="12" font-size="14" text-anchor="middle">D</text><text x="35.5" y="163.4" font-size="14" text-anchor="middle">E</text><text x="160.6" y="163.4" font-size="14" text-anchor="middle">F</text><text x="205.6" y="128.1" font-size="14" text-anchor="middle">G</text><text x="79.4" y="123.7" font-size="14" text-anchor="middle">H</text><text x="98" y="169.2" font-size="12" text-anchor="middle">6 cm</text></svg>'
