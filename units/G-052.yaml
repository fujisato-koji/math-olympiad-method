# G-052 錐体と球の体積と表面積（角錐、円錐、球）
#
# 書き方は N-001 の頭の注のとおり。
# ことば：角錐（四角錐、三角錐、正四角錐）、円錐、錐体、頂点、母線、球、半球、π（円周率を表す文字）。
#   柱体（角柱、円柱）、底面、側面、底面積、表面積は G-011 のことば。
# 円周率は文字 π で表す（A-010 の文字。G-010・G-011 の「□ × 円周率」を「□π」と書く）。π は 1 日目の見本で約束する。
#   答えは π を残した形（12π cm³）で、鍵盤では「□π cm³ の □」に入る数を打つ。□ が分数になるときは分数で答える。3.14 は使わない。
# 式は「底面積 × 高さ ÷ 3」と書き、文字では V = Sh/3、V = πr²h/3、球は V = 4πr³/3、S = 4πr²（A-010 のきまりで ÷ は分数の形、
#   r² と r³ は A-009 の累乗）。分数のかけ算（N-078）は前提にないので「1/3 × 底面積 × 高さ」とは書かず、
#   おうぎ形の面積も G-010 と同じく「円の面積を l こに分けた r こ分」と言う。
# 三平方の定理は前提にないので、円錐の母線と正四角錐の側面の三角形の高さは問題文で与える。
#   高さと母線（または側面の高さ）を両方出す図は、3・4・5、6・8・10、5・12・13 の組にそろえ、図の長さが食いちがわないようにした。
# 相似（G-013）は前提にないので、円錐台は、切り取る小さな円錐の大きさも与えて、2 つの円錐の差で求める。回転体（G-015）は扱わない。
# わけ（3 日目）：① 立方体を合同な 3 つの四角錐に分けて「÷ 3」を代表の例で示す（段 4 でも水準 2 の単元なので、② の深さを 1 問）。
#   ② 円錐の側面積 πrl を、展開図のおうぎ形が円の r/l にあたることから文字で示す。③ 球の表面積 4πr² を、球を中心が頂点の
#   細い錐体に分けて、球の体積の式から導く。どんな錐体でも柱体の 3 分の 1 になること（底面積と高さが同じなら体積も同じ）と、
#   球の体積の式そのもののわけは、前提の道具で示せないので約束した事実として使い、積分の単元 D-081 へ回す。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 体積（角錐、円錐、球）　2 日目 表面積（正四角錐、円錐の展開図、球）
#   3 日目 わけ（3 分の 1、円錐の側面積、球の表面積）　4 日目 G-011（柱体）・G-010（おうぎ形）・A-010（文字の式）と混ぜる　5 日目 確認
# check：□π の □ を出す式（割り切れないときは Fraction）。中心角は 360 × 半径 ÷ 母線。式を選ぶ問題は、選択肢ごとの式（lambda）に
#   r の値を入れ、π の係数が場面の計算とどの r でも等しいものを選ぶ。
# 図は svg（D-040）。見取り図は斜めから見た図で、見えない線と高さは点線。長さの比はおおよそ合わせた。

