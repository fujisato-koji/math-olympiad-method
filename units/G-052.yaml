  - part: 離
    kinds: [数]
    text: 半径 2 cm の鉄の球が 27 個あります。これをすべてとかして、1 つの大きな球をつくります。大きな球の表面積は、もとの 27 個の球の表面積の合計の何分のいくつですか。
    answer: 1/3
    check: "(lambda R: Fraction(4 * R * R, 27 * 4 * 2 * 2))([R for R in range(1, 50) if R ** 3 == 27 * 2 ** 3][0])"
    hints:
      - とかしても、鉄の体積は変わらないね。大きな球の体積は、もとの 1 個の何倍かな。
      - 球の体積は 4/3 × π × 半径³。半径を 3 回かけた数が 27 個分になるのは、半径がいくつのときかな。
      - 表面積は 4 × π × 半径²。大きな球の表面積と、27 個の合計をくらべよう。
    paths:
      - [体積は変わらないので、大きな球の体積は 27 個分, 半径³ = 2 × 2 × 2 × 27 = 216 = 6 × 6 × 6 で半径 6 cm, 大きな球の表面積 = 4 × π × 36 = 144π, 27 個の合計 = 27 × 4 × π × 4 = 432π, 144π ÷ 432π = 1/3]
      - [半径は 3 倍なので、1 個の表面積は 3 × 3 = 9 倍, 27 個の合計は 1 個の 27 倍, 9 ÷ 27 = 1/3]
    note: とかしても変わらない体積に目をつけて半径を出し（216 が 6 の 3 乗だと気づく、A-009 の累乗）、表面積の式でくらべる。2 本目の「半径が 3 倍なら表面積は 9 倍、体積は 27 倍」は、のちの相似な立体（G-021）につながる見方。表面積も 27 倍のままと思いこみやすい。
