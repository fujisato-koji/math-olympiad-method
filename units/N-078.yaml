            <rect x="20" y="30" width="200" height="90" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="60" y1="30" x2="60" y2="120" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="100" y1="30" x2="100" y2="120" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="140" y1="30" x2="140" y2="120" stroke="currentColor" fill="none" stroke-width="2"/>
            <line x1="180" y1="30" x2="180" y2="120" stroke="currentColor" fill="none" stroke-width="2"/>
