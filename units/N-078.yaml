# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋, 読み取り]
    text: 本を、1 日目に全体の 1/3 読み、2 日目に残りの 2/5 を読み、3 日目にその残りの 3/4 を読んだところ、24 ページ残りました。この本は全部で何ページですか。
    answer: 240
    check: "24 / ((1 - Fraction(1, 3)) * (1 - Fraction(2, 5)) * (1 - Fraction(3, 4)))"
    hints:
      - 1 日目に読んだあと、残りは全体の何分のいくつかな。
      - 2 日目は「残りの 2/5」を読んだので、2 日目のあとの残りは、1 日目のあとの残りの 3/5 だね。全体の何分のいくつかな。
      - 3 日目のあとの残りが全体の何分のいくつかがわかれば、24 ページから全体にもどせるね。
    paths:
      - [1 日目のあとの残りは全体の 2/3, 2 日目のあとは 2/3 × 3/5 = 2/5, 3 日目のあとは 2/5 × 1/4 = 1/10, 全体の 1/10 が 24 ページなので 24 ÷ 1/10 = 240 ページ]
      - [後ろからたどる, 3 日目に読む前は 24 ÷ 1/4 = 96 ページ, 2 日目に読む前は 96 ÷ 3/5 = 160 ページ, 1 日目に読む前は 160 ÷ 2/3 = 240 ページ]
    note: 「全体の」と「残りの」でもとにする量が変わる。残りの割合を《分数》のかけ算で重ねるか（1 本目）、後ろから分数のわり算でもどす（2 本目）。2/5 や 3/4 を全体に対する割合と読むまちがいが多い。
  - part: 離
    kinds: [総動員, 手数]
    uses: [G-008]
    text: 面積が 5/6 m² の長方形があります。たての長さは 2/3 m です。この長方形のまわりの長さは何 m ですか。答えは仮分数で打ちましょう。
    answer: 23/6
    check: "(Fraction(2, 3) + Fraction(5, 6) / Fraction(2, 3)) * 2"
    hints:
      - 長方形の面積は たて × よこ だね。よこの長さは、どんな計算で求められるかな。
      - よこ = 面積 ÷ たて だね。5/6 ÷ 2/3 を計算しよう。
      - まわりの長さは、たてとよこをたした長さの 2 つ分だよ。
    paths:
      - [よこ = 5/6 ÷ 2/3 = 5/6 × 3/2 = 5/4 m, たて + よこ = 2/3 + 5/4 = 8/12 + 15/12 = 23/12 m, まわりは 23/12 × 2 = 23/6 m]
    note: 面積の式（G-008、たて × よこ）を逆に使って分数のわり算でよこを出し、通分のたし算（N-019）と × 2 でまわりの長さにする。よこの 5/4 で止めたり、たてとよこの和を 2 倍し忘れたりしやすい。
  - part: 離
    kinds: [数]
    text: 1 と 1/4 × 1 と 1/5 × 1 と 1/6 × 1 と 1/7 × 1 と 1/8 × 1 と 1/9 × 1 と 1/10 × 1 と 1/11 を計算しましょう。
    answer: 3
    check: "math.prod(1 + Fraction(1, k) for k in range(4, 12))"
    hints:
      - 帯分数を仮分数になおそう。1 と 1/4 = 5/4、1 と 1/5 = 6/5 だね。
      - 仮分数にしてならべると、分子と分母にどんな数がならぶかな。
      - かける前に約分しよう。となりどうしで、同じ数が分子と分母に出てくるね。
    paths:
      - [仮分数にすると 5/4 × 6/5 × 7/6 × 8/7 × 9/8 × 10/9 × 11/10 × 12/11, 分子の 5 と分母の 5、分子の 6 と分母の 6、… が約分で消える, 最初の分母 4 と最後の分子 12 が残る, 12/4 = 3]
    note: 8 つの帯分数のかけ算に見えるが、仮分数にすると約分で次々に消える（かける前に約分する、のくり返し）。そのまま分子どうし・分母どうしをかけると、とても大きな数になる。
