# N-078 分数のかけ算とわり算
#
# 書き方は N-001 の頭の注、分数の答えと check は N-019 の頭の注のとおり（答えは約分した形、1 より大きい答えは仮分数で打つ、
#   帯分数は「2 と 1/4」と書く、check は Fraction で計算する）。段 3 なので、子に見せる文は小 6 までの漢字で書く。分かち書きはしない。
#   数の前後には空白を入れる。「×」は U+00D7、「÷」は U+00F7、「−」は U+2212。
# 前提は N-019（約分と通分、分数 × 整数 は同じ分数を何回かたす）と N-014（わり算）。N-016（a ÷ b = a/b、□ の 3/4）と
#   N-017・N-018（約数と公約数）も前提のたどりにある。
#   分数 ÷ 整数 は分母に整数をかける（1/5 を 3 つに分けると、1 は 15 こに分かれるので 1/15）。
#   × 分数 は「□ こに分けた ○ こ分」と言う（× 4/5 は 5 こに分けた 4 こ分）。分数 × 分数 は分母どうし・分子どうしをかける。
#   わけは、1 を 3 だんに分けて 5 れつに分けると 15 こに分かれる図（svg）で示す。面積（G-008）は前提にないので、図は
#   「全体を 1 とした何こ分」として読み、面積の式は使わない。
#   分数 ÷ 分数 は、通分して「1/15 が 12 この中に 1/15 が 10 こがいくつ分か」= 12 ÷ 10 = 12/10（N-016）にもどし、わる数の分母と
#   分子を入れかえた数をかけるのと同じになることを示す。「逆数」の語は 3 日目の見本で出す。
#   かける前（わる数を逆数にしてかける前）に約分してよい。答えは約分した形。
# 整数は分母が 1 の分数とみる（6 = 6/1）。整数 × 分数 は「18 の 5/6」（N-016 の「□ の 3/4」）と同じ計算として出す。
# 小数（N-020）は前提にないので、分数と小数のまじった計算はしない。計算の順序（N-076）と ( ) のきまり（N-015）は前提にないので、
#   + − と × ÷ がまじった式は書かない。× と ÷ だけの 3 つの数の式は、問題文で「前から順に」と言う（N-019 の「前から順にひこう」と同じ）。
#   2 つの計算がいる場面は文でたずね、みちすじで 2 回に分ける。
# 大小をくらべる選ぶ問題の check は、選択肢ごとの式を Fraction で計算して、大きいほうの文字を返す。
# 場面は L、m、kg（N-016、N-019 と同じ）。
# 日の並び（既定）：1 日目 分数 × 整数・分数 ÷ 整数、2 日目 分数 × 分数・整数 × 分数（頭に見本）、3 日目 分数 ÷ 分数・整数 ÷ 分数
#   （頭に見本）、4 日目 わけ、5 日目 N-019・N-016 と混ぜる（通分のたし算とひき算、帯分数、場面）、6 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-015、N-076 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

