        explain: 長方形全体を 1 とします。たての線で 5 つに分けた 4 つ分が 4/5 です。4/5 は 1/5 が 4 こです。1/5 をそれぞれ点線で 3 つに分けると、全体は 5 × 3 = 15 こに分かれるので、1 つ分は 1/15 です。4/5 ÷ 3 は、色をぬったところで、1/15 が 4 こなので 4/15 です。《分数》 ÷ 《整数》 は、分子はそのままで、分母に整数をかけます。分子が整数でわり切れるときは、分子をわっても同じです（4/5 ÷ 2 = 2/5）。分数 × 整数 は、分母はそのままで、分子に整数をかけます。
