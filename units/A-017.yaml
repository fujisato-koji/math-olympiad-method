# A-017 2 次方程式
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011、A-016 に合わせる（負の数は「−」U+2212）。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：2 次方程式とその解（代入して確かめる）、x² = k と ax² = b（平方根で解く）、(x + p)² = q。
#   2 日目：因数分解で解く（AB = 0 ならば A = 0 または B = 0）、くくり出し、解が 1 つのもの、移項して右辺を 0 にしてから解く。
#   3 日目：平方完成で解く、解の公式（図）、解の個数（b² − 4ac の符号）。
#   4 日目：わけ。5 日目：A-015、A-016 と混ぜる（文章題、解から係数を求める）。6 日目：確認。
# 前提は A-015（展開と因数分解）、A-016（平方根）。地図の前提に 1 次方程式（A-011）がないが、2 次方程式も方程式なので、
#   方程式の解と等式の性質（両辺に同じ数を足す・ひく、両辺を 0 でない同じ数でわる、移項）は A-011 で学んだものとして使った
#   （A-017 の前提に A-011 を足す案を出した）。文章題の面積は、A-015 と同じく長方形の たて × 横 だけを使う。
# 解が 2 つあるときは鍵盤で 1 度に打てないので、解の組は choices（「x = 2、x = −7」「x = ±5」）にし、
#   打つ問題は「正の解」「大きいほうの解」のように 1 つを聞く。√ を含む解も choices にする。
#   解の組を選ぶ check は、整数の解なら −30〜30 の総当たりで求めた解の集まりと等しいものを、√ を含む解なら
#   2 つの値をどちらも元の式に代入して 0 になる（math.isclose）ものを選び出す。打つ問題の check は総当たりか Fraction で求める。
#   解の個数の check は、b² − 4ac の符号で数える。
# b² − 4ac が負のときは「解はない」とし、複素数（A-021）は扱わない。解と係数の関係（A-026）、2 次関数のグラフ（A-020）、
#   2 次不等式は扱わない。解の公式のわけは、x² の係数が 1 の形（x² + px + q = 0）で示し、一般の形は両辺を a でわればよいと話す。
# 2 次方程式は、2 次関数（A-020）、落下の時間や面積の計算、化学平衡の濃度（H-024）、不等式の証明（A-025）の道具になる（D-026）。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-011 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-017
days:
  - day: 1
    items:
      - part: 見本
        text: 方程式 x² − 5x + 6 = 0 の解を、代入して確かめてみましょう。また、方程式 x² = 9 と (x − 1)² = 5 を解いてみましょう。
        explain: 移項して整理すると (x の 2 次式) = 0 の形になる方程式を、x の 2 次方程式といいます。x² − 5x + 6 = 0 に x = 2 を入れると 4 − 10 + 6 = 0、x = 3 を入れると 9 − 15 + 6 = 0 で、どちらも成り立ちます。x = 1 では 1 − 5 + 6 = 2 で、成り立ちません。方程式を成り立たせる x の値を解といい、2 次方程式の解はふつう 2 つあります。x² = 9 は、x が 9 の平方根（A-016）であることを表すので、解は x = 3 と x = −3 です。まとめて x = ±3 と書きます。2x² = 18 なら、両辺を 2 でわって x² = 9 にしてから解きます。(x − 1)² = 5 は、x − 1 が 5 の平方根なので x − 1 = ±√5、両辺に 1 を足して x = 1 ± √5 です。これは x = 1 + √5 と x = 1 − √5 の 2 つの解を、まとめて書いたものです。
      - part: 思い出す
        text: x² − 7x + 12 を因数分解すると、どれになりますか。
        choices: [(x − 3)(x − 4), (x + 3)(x + 4), (x − 2)(x − 6)]
        answer: (x − 3)(x − 4)
        check: "[c for c, f in {'(x − 3)(x − 4)': lambda x: (x - 3) * (x - 4), '(x + 3)(x + 4)': lambda x: (x + 3) * (x + 4), '(x − 2)(x − 6)': lambda x: (x - 2) * (x - 6)}.items() if all(f(x) == x ** 2 - 7 * x + 12 for x in range(-5, 6))][0]"
        hints:
          - 積が 12、和が −7 になる 2 つの数をさがしましょう。
          - 積が正で和が負なので、2 つの数はどちらも負の数です。
          - 選んだ式を展開して、元の式にもどるか確かめましょう。
        paths:
          - [積が 12 で和が −7 の 2 数は −3 と −4, (x − 3)(x − 4)]
      - part: 思い出す
        text: √48 を a√b の形（b はできるだけ小さい自然数）に表すと、どれになりますか。
        choices: [4√3, 2√6, 6√2]
        answer: 4√3
        check: "[c for c, v in {'4√3': 4 * math.sqrt(3), '2√6': 2 * math.sqrt(6), '6√2': 6 * math.sqrt(2)}.items() if math.isclose(v, math.sqrt(48))][0]"
        hints:
          - 48 を素因数分解しましょう。
          - 48 の中で、いちばん大きい 2 乗の因数をさがしましょう。
          - 2 乗の因数を、根号の外に出しましょう。
        paths:
          - [48 = 4² × 3, √(4²) × √3, 4√3]
      - part: 今日
        text: 次のうち、方程式 x² + 2x − 15 = 0 の解はどれですか。
        choices: [3, −3, 5]
        answer: 3
        check: "[c for c, v in {'3': 3, '−3': -3, '5': 5}.items() if v * v + 2 * v - 15 == 0][0]"
        hints:
          - 選択肢の数を、1 つずつ x に代入しましょう。
          - 代入して、左辺が 0 になるものが解です。
          - 負の数を代入するときは、かっこをつけて計算しましょう。
        paths:
          - [x = 3 を代入すると 9 + 6 − 15 = 0, 成り立つので解]
        note: −3 を代入すると 9 − 6 − 15 = −12 で成り立たない。もう 1 つの解は −5 で、選択肢にはない。
      - part: 今日
        text: 方程式 3x² = 75 を解くと、どれになりますか。
        choices: [x = ±5, x = 5, x = ±25]
        answer: x = ±5
        check: "[c for c, rs in {'x = ±5': (5, -5), 'x = 5': (5,), 'x = ±25': (25, -25)}.items() if set(rs) == set(x for x in range(-60, 61) if 3 * x * x == 75)][0]"
        hints:
          - まず、両辺を 3 でわりましょう。
          - x² = 25 になる x は、25 の平方根です。
          - 正の数の平方根は、いくつあるでしょう。
        paths:
          - [x² = 25, x は 25 の平方根, x = ±5]
        note: x = 5 だけを答えやすい。(−5)² = 25 なので −5 も解になる。
      - part: 今日
        text: 方程式 (x + 2)² = 7 を解くと、どれになりますか。
        choices: [x = −2 ± √7, x = 2 ± √7, x = −2 + √7]
        answer: x = −2 ± √7
        check: "[c for c, rs in {'x = −2 ± √7': (-2 + math.sqrt(7), -2 - math.sqrt(7)), 'x = 2 ± √7': (2 + math.sqrt(7), 2 - math.sqrt(7)), 'x = −2 + √7': (-2 + math.sqrt(7),)}.items() if len(rs) == 2 and all(math.isclose((r + 2) ** 2, 7) for r in rs)][0]"
        hints:
          - x + 2 を 1 つのまとまりと見ましょう。
          - x + 2 は、7 の平方根です。
          - x + 2 = ±√7 から、x を求めましょう。
        paths:
          - [x + 2 = ±√7, 両辺から 2 をひく, x = −2 ± √7]
        note: x + 2 = ±√7 から x = 2 ± √7 としやすい。両辺から 2 をひくので −2 になる。
      - part: 挑戦
        text: 方程式 4(x − 1)² = 9 の解のうち、大きいほうの解はいくつですか。
        answer: 5/2
        accept: [2.5]
        check: "max(x for x in [Fraction(k, 2) for k in range(-40, 41)] if 4 * (x - 1) ** 2 == 9)"
        hints:
          - まず、両辺を 4 でわりましょう。
          - x − 1 は、9/4 の平方根です。
          - √(9/4) は √9 ÷ √4 と同じです。
        paths:
          - [(x − 1)² = 9/4, x − 1 = ±3/2, x = 1 + 3/2 と x = 1 − 3/2, 大きいほうは 5/2]
        note: 4 でわらずに x − 1 = ±3 としやすい。小さいほうの解は −1/2。
    extra:
      - part: 今日
        text: 方程式 x² − 64 = 0 を解くと、どれになりますか。
        choices: [x = ±8, x = 8, x = ±32]
        answer: x = ±8
        check: "[c for c, rs in {'x = ±8': (8, -8), 'x = 8': (8,), 'x = ±32': (32, -32)}.items() if set(rs) == set(x for x in range(-60, 61) if x * x - 64 == 0)][0]"
        hints:
          - −64 を移項しましょう。
          - x² = 64 になる x をさがしましょう。
          - 解は 1 つだけでしょうか。
        paths:
          - [x² = 64, x = ±8]
      - part: 今日
        text: 方程式 (x − 3)² = 16 の解のうち、小さいほうの解はいくつですか。
        answer: −1
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(min(x for x in range(-30, 31) if (x - 3) ** 2 == 16))"
        hints:
          - x − 3 は、16 の平方根です。
          - 16 の平方根は、正と負の 2 つあります。
          - x − 3 が正のときと負のときに分けて、x を求めましょう。
        paths:
          - [x − 3 = ±4, x = 7 と x = −1, 小さいほうは −1]
        note: x − 3 = 4 だけを考えて 7 と答えやすい。
      - part: 挑戦
        text: 方程式 (2x − 1)² = 25 の解のうち、正の解はいくつですか。
        answer: 3
        check: "[x for x in [Fraction(k, 2) for k in range(1, 41)] if (2 * x - 1) ** 2 == 25][0]"
        hints:
          - 2x − 1 は、25 の平方根です。
          - 2x − 1 が正のときと負のときに分けましょう。
          - それぞれの 1 次方程式を解いて、正のほうを選びましょう。
        paths:
          - [2x − 1 = ±5, 2x = 6 または 2x = −4, x = 3 と x = −2, 正の解は 3]

  - day: 2
    items:
      - part: 見本
        text: 方程式 x² + x − 12 = 0 を、因数分解を使って解いてみましょう。
        explain: 左辺を因数分解すると (x + 4)(x − 3) = 0 です。2 つの数をかけて 0 になるのは、少なくとも一方が 0 のときです（AB = 0 ならば A = 0 または B = 0。わけは 4 日目）。だから x + 4 = 0 または x − 3 = 0 で、解は x = −4、x = 3 です。代入すると 16 − 4 − 12 = 0、9 + 3 − 12 = 0 で、確かに成り立ちます。x² − 5x = 0 のように数の項がないときは、x をくくり出して x(x − 5) = 0 とし、x = 0、x = 5 です（両辺を x でわると、x = 0 の解を落とします）。x² − 6x + 9 = 0 は (x − 3)² = 0 なので、解は x = 3 の 1 つだけです。x² = 2x + 8 のように右辺に項があるときは、移項して x² − 2x − 8 = 0 の形にしてから因数分解します。(x − 4)(x + 2) = 0 で、x = 4、x = −2 です。
      - part: 思い出す
        text: 方程式 x² = 81 を解くと、どれになりますか。
        choices: [x = ±9, x = 9, x = −9]
        answer: x = ±9
        check: "[c for c, rs in {'x = ±9': (9, -9), 'x = 9': (9,), 'x = −9': (-9,)}.items() if set(rs) == set(x for x in range(-60, 61) if x * x == 81)][0]"
        hints:
          - x は、81 の平方根です。
          - 9² と (−9)² を、それぞれ計算しましょう。
          - 解は 1 つだけでしょうか。
        paths:
          - [x は 81 の平方根, x = ±9]
      - part: 思い出す
        text: x² − 16 を因数分解すると、どれになりますか。
        choices: [(x + 4)(x − 4), (x − 4)², (x + 8)(x − 2)]
        answer: (x + 4)(x − 4)
        check: "[c for c, f in {'(x + 4)(x − 4)': lambda x: (x + 4) * (x - 4), '(x − 4)²': lambda x: (x - 4) ** 2, '(x + 8)(x − 2)': lambda x: (x + 8) * (x - 2)}.items() if all(f(x) == x ** 2 - 16 for x in range(-5, 6))][0]"
        hints:
          - x² − 16 は、2 乗から 2 乗をひいた形です。
          - 16 は、何の 2 乗でしょう。
          - a² − b² = (a + b)(a − b) を使いましょう。
        paths:
          - [16 = 4², (x + 4)(x − 4)]
      - part: 今日
        text: 方程式 (x − 2)(x + 7) = 0 を解くと、どれになりますか。
        choices: [x = 2、x = −7, x = −2、x = 7, x = 2、x = 7]
        answer: x = 2、x = −7
        check: "[c for c, rs in {'x = 2、x = −7': (2, -7), 'x = −2、x = 7': (-2, 7), 'x = 2、x = 7': (2, 7)}.items() if set(rs) == set(x for x in range(-30, 31) if (x - 2) * (x + 7) == 0)][0]"
        hints:
          - 2 つの数の積が 0 になるのは、どんなときでしょう。
          - x − 2 = 0 または x + 7 = 0 です。
          - それぞれの式を満たす x を求めましょう。
        paths:
          - [x − 2 = 0 または x + 7 = 0, x = 2、x = −7]
        note: 符号を逆にして x = −2、x = 7 としやすい。x = 2 を代入して確かめさせる。
      - part: 今日
        text: 方程式 x² − 9x + 20 = 0 の解のうち、大きいほうの解はいくつですか。
        answer: 5
        check: "max(x for x in range(-30, 31) if x * x - 9 * x + 20 == 0)"
        hints:
          - 積が 20、和が −9 になる 2 つの数をさがしましょう。
          - 左辺を (x + a)(x + b) の形にしましょう。
          - 2 つの解のうち、大きいほうを答えます。
        paths:
          - [(x − 4)(x − 5) = 0, x = 4、x = 5, 大きいほうは 5]
      - part: 今日
        text: 方程式 x² + 6x = 0 を解くと、どれになりますか。
        choices: [x = 0、x = −6, x = −6, x = 0、x = 6]
        answer: x = 0、x = −6
        check: "[c for c, rs in {'x = 0、x = −6': (0, -6), 'x = −6': (-6,), 'x = 0、x = 6': (0, 6)}.items() if set(rs) == set(x for x in range(-30, 31) if x * x + 6 * x == 0)][0]"
        hints:
          - 2 つの項に共通な因数をくくり出しましょう。
          - くくり出すと、x と (x + 6) の積が 0 という形になります。
          - 両辺を x でわると、どんな解を落としてしまうでしょう。
        paths:
          - [x(x + 6) = 0, x = 0 または x + 6 = 0, x = 0、x = −6]
        note: 両辺を x でわって x = −6 だけにしやすい。x = 0 のときは x でわれない。
      - part: 挑戦
        text: 方程式 (x − 2)(x + 3) = 14 の解のうち、正の解はいくつですか。
        answer: 4
        check: "[x for x in range(1, 31) if (x - 2) * (x + 3) == 14][0]"
        hints:
          - 右辺が 0 ではないので、このままでは「どちらかが 0」は使えません。
          - 左辺を展開して、14 を移項しましょう。
          - 右辺を 0 にした式を、因数分解しましょう。
        paths:
          - [x² + x − 6 = 14, x² + x − 20 = 0, (x + 5)(x − 4) = 0, 正の解は 4]
        note: x − 2 = 14 や x + 3 = 14 としやすい。積が 0 のときだけ、どちらかが 0 と言える。
    extra:
      - part: 今日
        text: 方程式 x² + 8x + 16 = 0 を解くと、どれになりますか。
        choices: [x = −4, x = 4, x = ±4]
        answer: x = −4
        check: "[c for c, rs in {'x = −4': (-4,), 'x = 4': (4,), 'x = ±4': (4, -4)}.items() if set(rs) == set(x for x in range(-30, 31) if x * x + 8 * x + 16 == 0)][0]"
        hints:
          - 左辺は、乗法公式 (x + a)² の形です。
          - (x + 4)² = 0 になります。
          - 2 乗して 0 になる数は、何でしょう。
        paths:
          - [(x + 4)² = 0, x + 4 = 0, x = −4]
        note: ±4 としやすい。この方程式の解は 1 つだけ。
      - part: 今日
        text: 方程式 x² − 3x − 28 = 0 の解のうち、小さいほうの解はいくつですか。
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(min(x for x in range(-30, 31) if x * x - 3 * x - 28 == 0))"
        hints:
          - 積が −28、和が −3 になる 2 つの数をさがしましょう。
          - 積が負なので、2 つの数の符号はちがいます。
          - 因数分解できたら、小さいほうの解を答えます。
        paths:
          - [(x − 7)(x + 4) = 0, x = 7、x = −4, 小さいほうは −4]
      - part: 挑戦
        text: 方程式 x² = 4x + 21 の解のうち、正の解はいくつですか。
        answer: 7
        check: "[x for x in range(1, 31) if x * x == 4 * x + 21][0]"
        hints:
          - 右辺の項を移項して、右辺を 0 にしましょう。
          - x² − 4x − 21 = 0 を因数分解しましょう。
          - 積が −21、和が −4 になる 2 つの数です。
        paths:
          - [x² − 4x − 21 = 0, (x − 7)(x + 3) = 0, 正の解は 7]

  - day: 3
    items:
      - part: 見本
        text: 方程式 x² + 6x + 2 = 0 を、(x + p)² = q の形にして解いてみましょう。図の解の公式でも解いてみましょう。
        svg: |
          <svg viewBox="0 0 240 92" xmlns="http://www.w3.org/2000/svg">
            <text x="18" y="54" font-size="20"><tspan font-style="italic">x</tspan> =</text>
            <text x="70" y="38" font-size="18">−<tspan font-style="italic">b</tspan> ±</text>
            <path d="M120 30 L125 27 L131 42 L138 14 L226 14" stroke="currentColor" fill="none" stroke-width="1.6"/>
            <text x="142" y="38" font-size="18"><tspan font-style="italic">b</tspan>² − 4<tspan font-style="italic">a</tspan><tspan font-style="italic">c</tspan></text>
            <line x1="64" y1="48" x2="230" y2="48" stroke="currentColor" fill="none" stroke-width="2"/>
            <text x="147" y="76" font-size="18" text-anchor="middle">2<tspan font-style="italic">a</tspan></text>
          </svg>
        explain: 左辺は因数分解できないので、(x + p)² = q の形にします。数の項 2 を移項して x² + 6x = −2。x の係数 6 の半分 3 の 2 乗 9 を両辺に足すと x² + 6x + 9 = 7 で、左辺は (x + 3)² です。(x + 3)² = 7 から x + 3 = ±√7、x = −3 ± √7 です。このように式を (x + p)² の形にすることを、平方完成といいます。同じことを ax² + bx + c = 0 で行うと、図の解の公式 x = (−b ± √(b² − 4ac))/(2a) が出ます（4 日目）。x² + 6x + 2 = 0 では a = 1、b = 6、c = 2 なので、x = (−6 ± √(36 − 8))/2 = (−6 ± √28)/2 = (−6 ± 2√7)/2 = −3 ± √7 で、同じ解になります。根号の中の b² − 4ac が正なら解は 2 つ、0 なら 1 つです。負のときは、2 乗して負になる数はないので、解はありません。
      - part: 思い出す
        text: 方程式 x² − x − 30 = 0 を解くと、どれになりますか。
        choices: [x = 6、x = −5, x = −6、x = 5, x = 6、x = 5]
        answer: x = 6、x = −5
        check: "[c for c, rs in {'x = 6、x = −5': (6, -5), 'x = −6、x = 5': (-6, 5), 'x = 6、x = 5': (6, 5)}.items() if set(rs) == set(x for x in range(-30, 31) if x * x - x - 30 == 0)][0]"
        hints:
          - 積が −30、和が −1 になる 2 つの数をさがしましょう。
          - 積が負なので、2 つの数の符号はちがいます。
          - 因数分解したら、それぞれのかっこが 0 になる x を求めましょう。
        paths:
          - [(x − 6)(x + 5) = 0, x = 6、x = −5]
      - part: 思い出す
        text: √20 を a√b の形（b はできるだけ小さい自然数）に表すと、どれになりますか。
