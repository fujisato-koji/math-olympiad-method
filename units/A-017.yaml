    id: "4499f9c13c"
    kinds: [道筋]
    uses: [A-016]
    text: x⁴ − 5x² + 4 = 0 の解はどれですか。
    choices: ["x = ±1、x = ±2", "x = ±1", "x = ±2", "x = 1、x = 4"]
    answer: "x = ±1、x = ±2"
    check: "'x = ±1、x = ±2'"
    hints:
      - text: x⁴ は (x²)² だね。x² を 1 つの箱と見ると、箱の 2 次方程式になるよ。
        svg: '<svg viewBox="0 0 320 122" xmlns="http://www.w3.org/2000/svg"><text x="160" y="24" font-size="14" text-anchor="middle" fill="currentColor">x⁴ − 5x² + 4 = 0</text><rect x="53.9" y="52" width="48.3" height="25.7" rx="5" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><rect x="168.8" y="52" width="27" height="25.7" rx="5" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="78" y="70" font-size="19" text-anchor="middle" fill="currentColor">(x²)²</text><text x="122.7" y="70" font-size="19" text-anchor="middle" fill="currentColor">− 5</text><text x="156.7" y="70" font-size="19" text-anchor="middle" fill="currentColor">×</text><text x="182.3" y="70" font-size="19" text-anchor="middle" fill="currentColor">x²</text><text x="212.7" y="70" font-size="19" text-anchor="middle" fill="currentColor">+ 4</text><text x="247.9" y="70" font-size="19" text-anchor="middle" fill="currentColor">= 0</text><text x="160" y="110" font-size="14" text-anchor="middle" fill="currentColor">x² = t とおくと t² − 5t + 4 = 0</text></svg>'
      - t² − 5t + 4 = 0 を因数分解しよう。
      - t の値を出したら、x² = t にもどして、x を求めよう。
    paths:
      - [t = x² とおく, t² − 5t + 4 = 0, (t − 1)(t − 4) = 0, t = 1、4, x² = 1 より x = ±1、x² = 4 より x = ±2]
      - [(x² − 1)(x² − 4) = 0 と因数分解する, (x + 1)(x − 1)(x + 2)(x − 2) = 0, x = ±1、±2]
    note: x² = t とおいたら、最後に t を x² にもどす。t = 4 から x = ±2 と、負の解もわすれない。
