      - part: わけ
        text: 「2 つの数 A、B について、AB = 0 ならば、A = 0 または B = 0 である」ことを、等式の性質を使って、筋道を立てて書きましょう。
        explain: 例：「AB = 0 とする。A = 0 のときは、それで成り立つ。A が 0 でないときは、等式の両辺を 0 でない同じ数 A でわってよい（等式の性質、A-011）。AB ÷ A = B、0 ÷ A = 0 なので B = 0 になる。よって、どちらのときも A = 0 または B = 0 である。」と書ければよい。①「〜とする」で AB = 0 を出発点に置く、② A が 0 のときと 0 でないときに分けて、両辺を A でわる、③ 約束した事実（等式の性質、0 を 0 でない数でわると 0）で結ぶ、の 3 つがそろっているかを見る。2 × 0 = 0 のような例だけで終わっていたら、例ではすべての場合を示せないことを話す。積が 0 でないとき（AB = 6 など）は、A や B の値は決まらないので、この性質は使えないことにも触れる（2 日目の挑戦）。
        hints:
          - 「AB = 0 とする」から書き始め、A が 0 のときと 0 でないときに分けましょう。
          - A が 0 でないとき、両辺を A でわるとどうなるでしょう。
          - 0 を 0 でない数でわると、いくつでしょう。
        paths:
          - [AB = 0 とする, A = 0 なら成り立つ, A が 0 でなければ両辺を A でわって B = 0, どちらでも A = 0 または B = 0]
      - part: わけ
        text: 方程式 x² + px + q = 0 の解が x = (−p ± √(p² − 4q))/2 になることを、平方完成を使って、筋道を立てて書きましょう（p² − 4q は 0 以上とします）。
        explain: 例：「p、q を数とし、p² − 4q は 0 以上とする。q を移項すると x² + px = −q。両辺に x の係数の半分の 2 乗 (p/2)² = p²/4 を足すと、x² + px + p²/4 = p²/4 − q。左辺は乗法公式で (x + p/2)²、右辺は通分して (p² − 4q)/4 になる。よって (x + p/2)² = (p² − 4q)/4。x + p/2 は (p² − 4q)/4 の平方根なので、x + p/2 = ±√(p² − 4q) ÷ √4 = ±√(p² − 4q)/2（√a ÷ √b = √(a/b)、A-016）。p/2 を移項して、x = (−p ± √(p² − 4q))/2 である。」と書ければよい。①「〜とする」で p、q を決める、② 移項と平方完成で式を変形する、③ 約束した事実（等式の性質、乗法公式、平方根の意味）で結ぶ、の 3 つがそろっているかを見る。p² − 4q が負なら、2 乗して負になる数はないので解はないことにも触れる。ax² + bx + c = 0 は、両辺を a でわって p = b/a、q = c/a とすれば同じ筋道で図の解の公式になる。x² + 6x + 2 = 0 のような例で確かめただけで終わっていたら、例ではすべての p、q について示せないことを話す。
        hints:
          - q を移項してから、両辺に (p/2)² を足しましょう。
          - 左辺を (x + p/2)² の形にし、右辺を通分しましょう。
          - x + p/2 は右辺の数の平方根です。√4 = 2 を使いましょう。
        paths:
          - [x² + px = −q, 両辺に p²/4 を足す, (x + p/2)² = (p² − 4q)/4, x + p/2 = ±√(p² − 4q)/2, x = (−p ± √(p² − 4q))/2]
      - part: わけ
        text: 方程式 x² − 10x + 25 = 0 の解が 1 つだけであるわけを、文で書きましょう。
