    kinds: [数]
    text: 方程式 9x² − 25 = 0 の解はどれですか。
    choices: ["x = ±5/3", "x = ±3/5", "x = ±25/9", "x = ±5"]
    answer: "x = ±5/3"
    check: "[c for c, roots in {'x = ±5/3': (Fraction(5, 3), Fraction(-5, 3)), 'x = ±3/5': (Fraction(3, 5), Fraction(-3, 5)), 'x = ±25/9': (Fraction(25, 9), Fraction(-25, 9)), 'x = ±5': (5, -5)}.items() if sorted(roots) == sorted(x for x in [Fraction(k, 3) for k in range(-30, 31)] if 9 * x ** 2 - 25 == 0)][0]"
    hints:
      - 25 を移項して、9x² = 25 の形にしよう。
      - text: 9x² は (3x)² だね。3x を 1 つの箱と見よう。
        svg: '<svg viewBox="0 0 320 88" xmlns="http://www.w3.org/2000/svg"><text x="160" y="22" font-size="14" text-anchor="middle" fill="currentColor">9x² = (3x)²</text><text x="114.9" y="58" font-size="17" text-anchor="end" fill="currentColor">(</text><rect x="116.9" y="36" width="39.7" height="32" rx="6" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="136.8" y="58" font-size="17" text-anchor="middle" fill="currentColor">3x</text><text x="158.6" y="58" font-size="17" text-anchor="start" fill="currentColor">)²  = 25</text></svg>'
      - 箱に入る数は 2 つあるね。それぞれ 3 でわろう。
    paths:
      - [25 を移項する, 9x² = 25, 両辺の平方根をとる, 3x = ±5, x = ±5/3]
      - [両辺を 9 でわって x² = 25/9, x は 25/9 の平方根, x = ±5/3]
    note: 9x² の平方根は 3x。x² の係数が 1 でないときは、両辺をその係数でわってから平方根をとってもよい。
  - part: 離
    id: "75893cfd7a"
    kinds: [数]
    text: 方程式 (x − 3)² = 8 の解はどれですか。
    choices: ["x = 3 ± 2√2", "x = 3 ± 4√2", "x = −3 ± 2√2", "x = 3 ± 2√3"]
    answer: "x = 3 ± 2√2"
    check: "[c for c, roots in {'x = 3 ± 2√2': (3 + 2 * math.sqrt(2), 3 - 2 * math.sqrt(2)), 'x = 3 ± 4√2': (3 + 4 * math.sqrt(2), 3 - 4 * math.sqrt(2)), 'x = −3 ± 2√2': (-3 + 2 * math.sqrt(2), -3 - 2 * math.sqrt(2)), 'x = 3 ± 2√3': (3 + 2 * math.sqrt(3), 3 - 2 * math.sqrt(3))}.items() if all(math.isclose((v - 3) ** 2, 8, abs_tol=1e-9) for v in roots)][0]"
    hints:
      - text: x − 3 を 1 つの箱と見ましょう。箱は、2 乗すると 8 になる数です。
        svg: '<svg viewBox="0 0 320 76" xmlns="http://www.w3.org/2000/svg"><text x="106.2" y="46" font-size="17" text-anchor="end" fill="currentColor">(</text><rect x="108.2" y="24" width="66.9" height="32" rx="6" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="141.7" y="46" font-size="17" text-anchor="middle" fill="currentColor">x − 3</text><text x="177.1" y="46" font-size="17" text-anchor="start" fill="currentColor">)²  = 8</text></svg>'
      - 箱は 8 の平方根で、正と負の 2 つだね。
      - √8 を a√b の形に直そう。
    paths:
      - [x − 3 = ±√8, √8 = 2√2, x = 3 ± 2√2]
      - [展開して x² − 6x + 1 = 0, 解の公式で x = (6 ± √32)/2, √32 = 4√2 より x = 3 ± 2√2]
    note: (x + p)² = q は、x + p = ±√q として解く。√8 は 2√2 に直す。
  - part: 離
