# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員]
    uses: [A-004]
    text: 7、11、15、19、… と、4 ずつ増える数を、初めから順に足していきます。何番目の数まで足すと、和が 348 になりますか。
    answer: 12
    check: "[n for n in range(1, 100) if sum(7 + 4 * k for k in range(n)) == 348][0]"
    hints:
      - n 番目の数を n の式で表そう。
      - 初めから n 番目までの和は、(初めの数 + n 番目の数) × n ÷ 2 だね。
      - 和 = 348 として 2 次方程式を立てよう。n は自然数だよ。
    paths:
      - [n 番目の数は 4n + 3, 和は (7 + 4n + 3) × n ÷ 2 = n(2n + 5), n(2n + 5) = 348 より 2n² + 5n − 348 = 0, (n − 12)(2n + 29) = 0 で n は自然数なので 12]
      - [解の公式で n = (−5 ± √2809)/4 = (−5 ± 53)/4, 自然数なのは n = 12]
    note: 等差数列の和（A-004）を n の式にして 2 次方程式を立てる。負の解 −29/2 を捨てる理由（n は自然数）を言わせたい。因数分解が見つけにくいときは解の公式でもよい（√2809 = 53 に気づけるか）。
  - part: 離
    kinds: [道筋]
    text: 2 次方程式 x² − 4x + 1 = 0 の解の 1 つを a とします。a² + 1/a² の値はいくつですか。
    answer: 14
    check: "[k for k in range(0, 100) if math.isclose((2 + math.sqrt(3)) ** 2 + 1 / (2 + math.sqrt(3)) ** 2, k) and math.isclose((2 - math.sqrt(3)) ** 2 + 1 / (2 - math.sqrt(3)) ** 2, k)][0]"
    hints:
      - a は方程式の解なので、a² − 4a + 1 = 0 が成り立つね。
      - その式の両辺を a でわると、a + 1/a の値がわかるよ（a は 0 ではない）。
      - (a + 1/a)² を展開してみよう。
    paths:
      - [a² − 4a + 1 = 0 の両辺を a でわって a − 4 + 1/a = 0, a + 1/a = 4, (a + 1/a)² = a² + 2 + 1/a² = 16, a² + 1/a² = 14]
      - [解の公式で a = 2 ± √3, a = 2 + √3 なら 1/a = 2 − √3, a² + 1/a² = (7 + 4√3) + (7 − 4√3) = 14]
    note: 解を求めずに、方程式そのものを変形して a + 1/a を作るのが道筋。解を求めて代入しても解けるが、有理化と根号の計算が続く。どちらの解を a にしても同じ値になる（2 つの解がたがいに《逆数》）ことにもふれたい。
  - part: 離
    kinds: [読み取り]
    text: ある品物は、1 個 200 円で売ると、1 日に 300 個売れます。値段を 10 円上げるごとに、1 日に売れる個数は 10 個ずつ減ります。1 日の売り上げが 61600 円になるような値段は 2 つあります。そのうち高いほうは何円ですか。
    answer: 280
    check: "max(200 + 10 * k for k in range(0, 30) if (200 + 10 * k) * (300 - 10 * k) == 61600)"
    hints:
      - 値段を 10 円ずつ x 回上げたとすると、値段と売れる個数はどう表せるかな。
      - 売り上げ = 値段 × 個数 で方程式を立てよう。
      - 両辺を 100 でわると、数が小さくなって解きやすいよ。
    paths:
      - [x 回上げるとして 値段は 200 + 10x 円、個数は 300 − 10x 個, (200 + 10x)(300 − 10x) = 61600, 100 でわって (20 + x)(30 − x) = 616 より x² − 10x + 16 = 0, x = 2 と 8 で 値段は 220 円と 280 円、高いほうは 280 円]
    note: 「10 円上げるごとに 10 個減る」を、上げた回数 x で値段と個数の両方に表すのが読み取りの要点。x の値（8）をそのまま答えたり、安いほうの 220 円を答えたりしやすい。

