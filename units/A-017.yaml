    kinds: [道筋]
    text: x² − 8x + 12 = 0 を平方完成して解くと、解はどれですか。
    choices: ["x = 2、x = 6", "x = −2、x = −6", "x = 3、x = 4", "x = 1、x = 12"]
    answer: "x = 2、x = 6"
    check: "'x = 2、x = 6'"
    hints:
      - text: x の係数 −8 の半分を 2 乗した数を考えよう。
        svg: '<svg viewBox="0 0 320 136" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="34" width="112" height="38" rx="6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="70" y="59" font-size="15" text-anchor="middle" fill="currentColor">x の係数 −8</text><rect x="164" y="34" width="64" height="38" rx="6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="196" y="59" font-size="17" text-anchor="middle" fill="currentColor">−4</text><rect x="252" y="34" width="56" height="38" rx="6" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="280" y="59" font-size="17" text-anchor="middle" fill="currentColor" fill-opacity="0.6">?</text><line x1="130" y1="53" x2="157" y2="53" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,53 152.8,56.5 152.8,49.5" fill="currentColor"/><text x="145" y="28" font-size="13" text-anchor="middle" fill="currentColor">半分</text><line x1="232" y1="53" x2="245" y2="53" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="248,53 240.8,56.5 240.8,49.5" fill="currentColor"/><text x="240" y="28" font-size="13" text-anchor="middle" fill="currentColor">2 乗</text><text x="160" y="118" font-size="16" text-anchor="middle" fill="currentColor">x² − 8x + ? = (x − 4)²</text></svg>'
      - x² − 8x = (x − 4)² − 16 です。
      - (x − 4)² = □ の形にしてから、x − 4 になる数を 2 つ考えよう。
    paths:
      - [x² − 8x = (x − 4)² − 16, (x − 4)² − 16 + 12 = 0, (x − 4)² = 4, x − 4 = ±2, x = 2、6]
      - [因数分解でたしかめる, (x − 2)(x − 6) = 0, x = 2、6]
    note: 平方完成のとき、引いた 16 を足しわすれない。(x − 4)² = 4 から x − 4 = ±2 と、両方の符号を考える。
