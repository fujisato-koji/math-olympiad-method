        id: "7f65a876ac"
        text: x² + x − 12 = 0 は、左辺を因数分解すると (x + 4)(x − 3) = 0 です。2 つの数をかけて 0 になるのは、どちらかが 0 のときです（図）。だから x + 4 = 0 または x − 3 = 0 で、解は x = −4、x = 3 です。
        svg: '<svg viewBox="0 0 320 206" xmlns="http://www.w3.org/2000/svg"><text x="160" y="26" font-size="15" text-anchor="middle" fill="currentColor">x² + x − 12 = 0  →  (x + 4)(x − 3) = 0</text><rect x="49.6" y="46" width="66.5" height="36" rx="6" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="82.8" y="70" font-size="17" text-anchor="middle" fill="currentColor">x + 4</text><text x="133" y="70" font-size="17" text-anchor="middle" fill="currentColor">×</text><rect x="150" y="46" width="72.9" height="36" rx="6" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="186.5" y="70" font-size="17" text-anchor="middle" fill="currentColor">x − 3</text><text x="234.9" y="70" font-size="17" text-anchor="start" fill="currentColor">= 0</text><line x1="82.8" y1="88" x2="89.5" y2="129" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="90,132 85.4,125.5 92.3,124.3" fill="currentColor"/><line x1="186.5" y1="88" x2="227.9" y2="129.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="230,132 222.5,129.3 227.4,124.4" fill="currentColor"/><text x="90" y="156" font-size="16" text-anchor="middle" fill="currentColor">x + 4 = 0</text><text x="230" y="156" font-size="16" text-anchor="middle" fill="currentColor">x − 3 = 0</text><text x="160" y="156" font-size="14" text-anchor="middle" fill="currentColor">または</text><text x="90" y="194" font-size="16" text-anchor="middle" fill="currentColor">x = −4</text><text x="230" y="194" font-size="16" text-anchor="middle" fill="currentColor">x = 3</text><line x1="90" y1="163" x2="90" y2="173" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="90,176 86.5,168.8 93.5,168.8" fill="currentColor"/><line x1="230" y1="163" x2="230" y2="173" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="230,176 226.5,168.8 233.5,168.8" fill="currentColor"/></svg>'
        explain: 左辺を因数分解すると (x + 4)(x − 3) = 0 です。2 つの数をかけて 0 になるのは、少なくとも一方が 0 のときです（AB = 0 ならば A = 0 または B = 0。わけは 4 日目）。だから x + 4 = 0 または x − 3 = 0 で、解は x = −4、x = 3 です。代入すると 16 − 4 − 12 = 0、9 + 3 − 12 = 0 で、たしかに成り立ちます。x² − 5x = 0 のように数の項がないときは、x をくくり出して x(x − 5) = 0 とし、x = 0、x = 5 です（両辺を x でわると、x = 0 の解を落とします）。x² − 6x + 9 = 0 は (x − 3)² = 0 なので、解は x = 3 の 1 つだけです。x² = 2x + 8 のように右辺に項があるときは、移項して x² − 2x − 8 = 0 の形にしてから因数分解します。(x − 4)(x + 2) = 0 で、x = 4、x = −2 です。
