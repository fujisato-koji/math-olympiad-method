      - part: 挑戦
        id: "e73aee2180"
        text: 方程式 (x − 2)(x + 3) = 14 の解のうち、正の解はいくつですか。
        svg: '<svg viewBox="0 0 320 122" xmlns="http://www.w3.org/2000/svg"><rect x="96" y="50" width="168" height="48" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="180" y="80" font-size="17" text-anchor="middle" fill="currentColor">面積 14</text><text x="180" y="40" font-size="15" text-anchor="middle" fill="currentColor">横 x + 3</text><text x="88" y="79" font-size="15" text-anchor="end" fill="currentColor">たて x − 2</text></svg>'
        answer: 4
        check: "[x for x in range(1, 31) if (x - 2) * (x + 3) == 14][0]"
        hints:
          - 右辺が 0 ではないので、このままでは「どちらかが 0」は使えません。
          - 左辺を展開して 14 を移項し、右辺を 0 にした式を因数分解しましょう。
          - text: 図で考えると、横はたてより 5 長く、面積は 14 です。かけて 14 になる 2 つの数で調べることもできます。
            svg: '<svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg"><rect x="96" y="54" width="168" height="48" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="180" y="84" font-size="17" text-anchor="middle" fill="currentColor">14</text><text x="180" y="44" font-size="15" text-anchor="middle" fill="currentColor">x + 3</text><text x="88" y="83" font-size="15" text-anchor="end" fill="currentColor">x − 2</text><line x1="96" y1="116" x2="144" y2="116" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="144" y1="108" x2="144" y2="124" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="96" y1="108" x2="96" y2="124" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="264" y1="108" x2="264" y2="124" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="146" y1="116" x2="261" y2="116" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="264,116 256.8,119.5 256.8,112.5" fill="currentColor"/><text x="120" y="138" font-size="12" text-anchor="middle" fill="currentColor">たてと同じ</text><text x="204" y="138" font-size="13" text-anchor="middle" fill="currentColor">5 長い</text><rect x="96" y="54" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/></svg>'
        paths:
          - [x² + x − 6 = 14, x² + x − 20 = 0, (x + 5)(x − 4) = 0, 正の解は 4]
          - [横 x + 3 はたて x − 2 より 5 長い, かけて 14 で差が 5 の正の数は 2 と 7, x − 2 = 2 より x = 4]
        note: x − 2 = 14 や x + 3 = 14 としやすい。積が 0 のときだけ、どちらかが 0 と言える。
