      - (x + 1)² = 5 になります。
      - x + 1 は 5 の平方根。正と負の 2 つあるよ。
    paths:
      - [両辺を 2 でわる, (x + 1)² = 5, x + 1 = ±√5, x = −1 ± √5]
      - [展開して 2x² + 4x − 8 = 0、両辺を 2 でわって x² + 2x − 4 = 0, 解の公式で x = (−2 ± √20)/2, x = −1 ± √5]
    note: 先に係数 2 でわると、平方完成の形が見える。最後に −1 を移項する。
