hor="middle" fill="currentColor">4</text><line x1="164" y1="66" x2="164" y2="52" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/><line x1="164" y1="52" x2="251" y2="52" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="254,52 246.8,55.5 246.8,48.5" fill="currentColor"/><text x="209" y="46" font-size="13" text-anchor="middle" fill="currentColor">3</text><line x1="164" y1="66" x2="164" y2="52" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/><line x1="164" y1="52" x2="77" y2="52" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="74,52 81.2,48.5 81.2,55.5" fill="currentColor"/><text x="119" y="46" font-size="13" text-anchor="middle" fill="currentColor">3</text><circle cx="254" cy="74" r="6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="2"/><circle cx="74" cy="74" r="6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="2"/><text x="254" y="112" font-size="13" text-anchor="middle" fill="currentColor">3² = 9</text><text x="74" y="112" font-size="13" text-anchor="middle" fill="currentColor">(−3)² = 9</text><text x="8" y="136" font-size="15" text-anchor="start" fill="currentColor">(x − 1)² = 5</text><line x1="34" y1="180" x2="292" y2="180" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="298,180 290.8,183.5 290.8,176.5" fill="currentColor"/><line x1="44" y1="175" x2="44" y2="185" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="44" y="200" font-size="12" text-anchor="middle" fill="currentColor">−2</text><line x1="84" y1="175" x2="84" y2="185" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="84" y="200" font-size="12" text-anchor="middle" fill="currentColor">−1</text><line x1="124" y1="175" x2="124" y2="185" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="124" y="200" font-size="12" text-anchor="middle" fill="currentColor">0</text><line x1="164" y1="175" x2="164" y2="185" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="164" y="200" font-size="12" text-anchor="middle" fill="currentColor">1</text><line x1="204" y1="175" x2="204" y2="185" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="204" y="200" font-size="12" text-anchor="middle" fill="currentColor">2</text><line x1="244" y1="175" x2="244" y2="185" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="244" y="200" font-size="12" text-anchor="middle" fill="currentColor">3</text><line x1="284" y1="175" x2="284" y2="185" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="284" y="200" font-size="12" text-anchor="middle" fill="currentColor">4</text><circle cx="164" cy="180" r="6" fill="#7fc8f8" fill-opacity="0.9" stroke="currentColor" stroke-width="2"/><line x1="164" y1="172" x2="164" y2="158" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/><line x1="164" y1="158" x2="250.4" y2="158" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="253.4,158 246.2,161.5 246.2,154.5" fill="currentColor"/><text x="208.7" y="152" font-size="13" text-anchor="middle" fill="currentColor">√5</text><line x1="164" y1="172" x2="164" y2="158" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/><line x1="164" y1="158" x2="77.6" y2="158" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="74.6,158 81.8,154.5 81.8,161.5" fill="currentColor"/><text x="119.3" y="152" font-size="13" text-anchor="middle" fill="currentColor">√5</text><circle cx="253.4" cy="180" r="6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="2"/><circle cx="74.6" cy="180" r="6" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="2"/><text x="253.4" y="218" font-size="13" text-anchor="middle" fill="currentColor">1 + √5</text><text x="74.6" y="218" font-size="13" text-anchor="middle" fill="currentColor">1 − √5</text></svg>'
        explain: 移項して整理すると (x の 2 次式) = 0 の形になる方程式を、x の 2 次方程式といいます。x² − 5x + 6 = 0 に x = 2 を入れると 4 − 10 + 6 = 0、x = 3 を入れると 9 − 15 + 6 = 0 で、どちらも成り立ちます。x = 1 では 1 − 5 + 6 = 2 で、成り立ちません。方程式を成り立たせる x の値を解といい、2 次方程式の解はふつう 2 つあります。x² = 9 は、x が 9 の平方根（A-016）であることを表すので、解は x = 3 と x = −3 です。まとめて x = ±3 と書きます。2x² = 18 なら、両辺を 2 でわって x² = 9 にしてから解きます。(x − 1)² = 5 は、x − 1 が 5 の平方根なので x − 1 = ±√5、両辺に 1 を足して x = 1 ± √5 です。これは x = 1 + √5 と x = 1 − √5 の 2 つの解を、まとめて書いたものです。
      - part: 思い出す
        id: "2ff576c043"
        text: x² − 7x + 12 を因数分解すると、どれになりますか。
        choices: [(x − 3)(x − 4), (x + 3)(x + 4), (x − 2)(x − 6)]
        answer: (x − 3)(x − 4)
        check: "[c for c, f in {'(x − 3)(x − 4)': lambda x: (x - 3) * (x - 4), '(x + 3)(x + 4)': lambda x: (x + 3) * (x + 4), '(x − 2)(x − 6)': lambda x: (x - 2) * (x - 6)}.items() if all(f(x) == x ** 2 - 7 * x + 12 for x in range(-5, 6))][0]"
        hints:
          - text: 表の右下が 12 です。空色の 2 つのますを合わせると −7x になる 2 つの数を、? に入れましょう。
            svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="81.6" y="53" width="96" height="46" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="177.6" y="53" width="96" height="46" fill="#7fc8f8" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><rect x="81.6" y="99" width="96" height="46" fill="#7fc8f8" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><rect x="177.6" y="99" width="96" height="46" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="129.6" y="81.2" font-size="15" text-anchor="middle" fill="currentColor">x²</text><text x="225.6" y="81.2" font-size="15" text-anchor="middle" fill="currentColor" fill-opacity="0.55">?</text><text x="129.6" y="127.2" font-size="15" text-anchor="middle" fill="currentColor" fill-opacity="0.55">?</text><text x="225.6" y="127.2" font-size="15" text-anchor="middle" fill="currentColor">12</text><text x="129.6" y="44" font-size="16" text-anchor="middle" fill="currentColor">x</text><text x="225.6" y="44" font-size="16" text-anchor="middle" fill="currentColor" fill-opacity="0.55">?</text><text x="72.6" y="81.5" font-size="16" text-anchor="end" fill="currentColor">x</text><text x="72.6" y="127.5" font-size="16" text-anchor="end" fill="currentColor" fill-opacity="0.55">?</text><text x="72.6" y="44" font-size="15" text-anchor="end" fill="currentColor" fill-opacity="0.6">×</text><text x="160" y="171" font-size="15" text-anchor="middle" fill="currentColor">かけて 12、たして −7 の 2 つの数</text></svg>'
          - 積が正で和が負なので、2 つの数はどちらも負の数です。
          - 選んだ式を展開して、もとの式にもどるか、たしかめましょう。
        paths:
