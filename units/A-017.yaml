# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "2f38153511"
    kinds: [総動員]
    uses: [A-004]
    text: 7、11、15、19、… と、4 ずつふえる数を、初めから順に足していきます。何番目の数まで足すと、和が 348 になりますか。
    svg: '<svg viewBox="0 0 320 184" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="144.2" width="30" height="23.8" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="45" y="138.2" font-size="13" text-anchor="middle" fill="currentColor">7</text><rect x="66" y="130.6" width="30" height="37.4" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="81" y="124.6" font-size="13" text-anchor="middle" fill="currentColor">11</text><rect x="102" y="117" width="30" height="51" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="117" y="111" font-size="13" text-anchor="middle" fill="currentColor">15</text><rect x="138" y="103.4" width="30" height="64.6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="153" y="97.4" font-size="13" text-anchor="middle" fill="currentColor">19</text><rect x="174" y="89.8" width="30" height="78.2" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="189" y="83.8" font-size="13" text-anchor="middle" fill="currentColor">…</text><text x="266" y="90" font-size="14" text-anchor="middle" fill="currentColor">足していくと</text><text x="266" y="112" font-size="14" text-anchor="middle" fill="currentColor">348 になるのは</text><text x="266" y="134" font-size="14" text-anchor="middle" fill="currentColor">何番目まで？</text><line x1="20" y1="168" x2="220" y2="168" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
    answer: 12
    check: "[n for n in range(1, 100) if sum(7 + 4 * k for k in range(n)) == 348][0]"
    hints:
      - n 番目の数を n の式で表そう。
      - text: 同じ階だんをさかさにして重ねると、長方形になるね。和は、その長方形の半分だよ。
        svg: '<svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="108.2" width="30" height="23.8" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="40" y="30" width="30" height="78.2" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="70" y="94.6" width="30" height="37.4" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="70" y="30" width="30" height="64.6" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="100" y="81" width="30" height="51" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="100" y="30" width="30" height="51" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="130" y="67.4" width="30" height="64.6" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="130" y="30" width="30" height="37.4" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="160" y="53.8" width="30" height="78.2" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><rect x="160" y="30" width="30" height="23.8" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><path d="M198,30 h8 V132.0 h-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><text x="214" y="73" font-size="13" text-anchor="start" fill="currentColor">初めの数</text><text x="214" y="91" font-size="13" text-anchor="start" fill="currentColor">+ 終わりの数</text><path d="M40,140.0 v8 H190 v-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><text x="115" y="166" font-size="13" text-anchor="middle" fill="currentColor">いくつ足したか</text></svg>'
      - 和 = 348 として 2 次方程式を立てよう。n は自然数だよ。
    paths:
      - [n 番目の数は 4n + 3, 和は (7 + 4n + 3) × n ÷ 2 = n(2n + 5), n(2n + 5) = 348 より 2n² + 5n − 348 = 0, (n − 12)(2n + 29) = 0 で n は自然数なので 12]
      - [解の公式で n = (−5 ± √2809)/4 = (−5 ± 53)/4, 自然数なのは n = 12]
    note: 等差数列の和（A-004）を n の式にして 2 次方程式を立てる。負の解 −29/2 をすてる理由（n は自然数）を言わせたい。因数分解が見つけにくいときは解の公式でもよい（√2809 = 53 に気づけるか）。
  - part: 離
    id: "0cea0e7a08"
    kinds: [道筋]
    text: 2 次方程式 x² − 4x + 1 = 0 の解の 1 つを a とします。a² + 1/a² の値はいくつですか。
    answer: 14
    check: "[k for k in range(0, 100) if math.isclose((2 + math.sqrt(3)) ** 2 + 1 / (2 + math.sqrt(3)) ** 2, k) and math.isclose((2 - math.sqrt(3)) ** 2 + 1 / (2 - math.sqrt(3)) ** 2, k)][0]"
    hints:
      - a は方程式の解なので、a² − 4a + 1 = 0 が成り立つね。
      - その式の両辺を a でわると、a + 1/a の値がわかるよ（a は 0 ではない）。
      - text: (a + 1/a)² を、表でかけ算してみよう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="81.6" y="53" width="96" height="46" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="177.6" y="53" width="96" height="46" fill="#7fc8f8" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><rect x="81.6" y="99" width="96" height="46" fill="#7fc8f8" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><rect x="177.6" y="99" width="96" height="46" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><text x="129.6" y="81.2" font-size="15" text-anchor="middle" fill="currentColor">a²</text><text x="225.6" y="81.2" font-size="15" text-anchor="middle" fill="currentColor" fill-opacity="0.55">?</text><text x="129.6" y="127.2" font-size="15" text-anchor="middle" fill="currentColor" fill-opacity="0.55">?</text><text x="225.6" y="127.2" font-size="15" text-anchor="middle" fill="currentColor">1/a²</text><text x="129.6" y="44" font-size="16" text-anchor="middle" fill="currentColor">a</text><text x="225.6" y="44" font-size="16" text-anchor="middle" fill="currentColor">1/a</text><text x="72.6" y="81.5" font-size="16" text-anchor="end" fill="currentColor">a</text><text x="72.6" y="127.5" font-size="16" text-anchor="end" fill="currentColor">1/a</text><text x="72.6" y="44" font-size="15" text-anchor="end" fill="currentColor" fill-opacity="0.6">×</text><text x="160" y="171" font-size="15" text-anchor="middle" fill="currentColor">(a + 1/a)²</text></svg>'
    paths:
      - [a² − 4a + 1 = 0 の両辺を a でわって a − 4 + 1/a = 0, a + 1/a = 4, (a + 1/a)² = a² + 2 + 1/a² = 16, a² + 1/a² = 14]
      - [解の公式で a = 2 ± √3, a = 2 + √3 なら 1/a = 2 − √3, a² + 1/a² = (7 + 4√3) + (7 − 4√3) = 14]
    note: 解を求めずに、方程式そのものを変形して a + 1/a を作るのがすじ道。解を求めて代入しても解けるが、有理化と根号の計算が続く。どちらの解を a にしても同じ値になる（2 つの解がたがいに《逆数》）ことにもふれたい。
