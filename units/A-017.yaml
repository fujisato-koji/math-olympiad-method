      - [短い辺を x とする, 3 辺は x、x + 1、x + 2, x² + (x + 1)² = (x + 2)², 2x² + 2x + 1 = x² + 4x + 4, x² − 2x − 3 = 0, (x − 3)(x + 1) = 0, x = 3]
    note: 連続する 3 辺では、いちばん長い辺が斜辺。x = −1 は辺の長さにならないので捨てる。
