  - part: 離
    id: "eebc5237bb"
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - A-015
    - A-016
    - A-013
    text: a、b、c は整数で、a は正です。2 次方程式 ax² + bx + c = 0 が、0 より大きく 1/2 より小さい、ちがう 2 つの実数の解をもつとき、a のいちばん小さい値は何ですか。それより小さくできないわけも書きましょう。
    answer: 11
    check: min(a for a in range(1, 40) if any(b * b - 4 * a * c > 0 and all(0 < (-b + s * math.sqrt(b * b - 4 * a * c)) / (2 * a) < 0.5 for s in (1, -1)) for b in range(-2 * a, 2 * a + 1) for c in range(-2 * a, 2 * a + 1)))
    hints:
    - 2 つの解を r、s として、ax² + bx + c = a(x − r)(x − s) と書いて、右がわを展開してみよう。b と c を a、r、s で表すと、b と c の大きさについてどんなことがいえるかな。
    - c は 0 より大きい整数だね。また、x = 1/2 を入れた値も、r と s が 0 と 1/2 の間にあることから、どんな数か考えてみよう。a、b、c で表すと整数をつかった式になるよ。
    - c と、x = 1/2 を入れた値は、どちらも、ある数より小さくはなれないね。a が小さいと、どのきまりと合わなくなるかな。
    paths:
    - - 2 つの解を r、s（0 < r < 1/2、0 < s < 1/2、r ≠ s）として、a(x − r)(x − s) を展開すると ax² − a(r + s)x + a × r × s。これが ax² + bx + c と同じなので、b = −a(r + s)、c = a × r × s。r + s は 0 と 1 の間なので 0 < −b < a。r × s は 0 と 1/4 の間なので 0 < c < a/4。c は整数なので、c は 1 以上
      - x = 1/2 を入れた値は a(1/2 − r)(1/2 − s) = a/4 + b/2 + c = (a + 2b + 4c)/4。r、s は 1/2 より小さいので、この値は正。a + 2b + 4c は整数で正だから 1 以上で、値は 1/4 以上。また r(1/2 − r) = 1/16 − (r − 1/4)² ≦ 1/16。s(1/2 − s) も同じ。r ≠ s なので、2 つが同時に 1/16 になることはなく（1/16 になるのは r = 1/4 のときだけ）、r(1/2 − r) × s(1/2 − s) < 1/16 × 1/16 = 1/256
      - c × (a + 2b + 4c)/4 = (a × r × s) × a(1/2 − r)(1/2 − s) = a² × r(1/2 − r) × s(1/2 − s) < a²/256。左は 1 × 1/4 以上なので 1/4 < a²/256、a² > 64。だから a は 9 以上
      - a = 9、10 のときは、c < a/4 から c は 1 か 2。ちがう 2 つの解なので b² > 4ac、さらに a + 2b + 4c ≧ 1 と −b < a。a = 9、c = 1：b² > 36 から −b ≧ 7、a + 2b + 4c ≧ 1 から 13 + 2b ≧ 1 で b ≧ −6。合わない。a = 9、c = 2：b² > 72 から −b ≧ 9 だが −b < 9。合わない。a = 10、c = 1：b² > 40 から −b ≧ 7、14 + 2b ≧ 1 から b ≧ −6。合わない。a = 10、c = 2：b² > 80 から −b ≧ 9、18 + 2b ≧ 1 から b ≧ −8。合わない。だから a は 11 以上
      - a = 11 は 11x² − 7x + 1 = 0 でできる。b² − 4ac = 49 − 44 = 5 > 0 で、解は (7 ± √5)/22。2 < √5 < 4 なので、小さいほうは (7 − 4)/22 より大きいから 0 より大きい。大きいほうは (7 + 4)/22 = 1/2 より小さい。よって答えは 11
    - - r、s を 2 つの解として展開し、b = −a(r + s)、c = a × r × s から 0 < −b < a、0 < c < a/4（c は 1 以上の整数）。ちがう 2 つの解なので b² − 4ac > 0 で、整数どうしだから b² ≧ 4ac + 1。x = 1/2 を入れた値 (a + 2b + 4c)/4 は正で、a + 2b + 4c は整数だから a + 2b + 4c ≧ 1、つまり −2b ≦ a + 4c − 1。ここから先は整数の不等式だけで組む
      - 0 < −2b ≦ a + 4c − 1 の両辺を 2 乗して 4b² ≦ (a + 4c − 1)²。一方 b² ≧ 4ac + 1 から 4b² ≧ 16ac + 4。だから 16ac + 4 ≦ (a + 4c − 1)² = (a + 4c)² − 2(a + 4c) + 1。(a + 4c)² − 16ac = (a − 4c)² なので、(a − 4c)² ≧ 2a + 8c + 3
      - c = 1 のとき：(a − 4)² ≧ 2a + 11、つまり a² − 10a + 5 ≧ 0。a が 1 から 9 のときは a(a − 10) ≦ −9 なので a² − 10a + 5 は負。だから a は 10 以上。a = 10 とすると b² ≧ 41 から −b ≧ 7、−2b ≦ 10 + 4 − 1 = 13 から −b ≦ 6。合わない。だから c = 1 のとき a は 11 以上
      - c が 2 以上のとき：c < a/4 なので a = 4c + t（t は 1 以上の整数）とおける。(a − 4c)² ≧ 2a + 8c + 3 に入れると t² ≧ 2(4c + t) + 8c + 3 = 16c + 2t + 3、つまり t² − 2t ≧ 16c + 3 ≧ 35。t = 6 だと t² − 2t = 24 で足りず、t = 7 で 35。だから t は 7 以上、a = 4c + t は 4 × 2 + 7 = 15 以上
      - どちらの場合も a は 11 以上。a = 11 は 11x² − 7x + 1 = 0 でできる（解は (7 ± √5)/22。2 < √5 < 4 なので 0 と 1/2 の間にある）。だから答えは 11
    note: 考えどころは 3 つ：①解を r、s として展開し、c が 1 以上の整数であること、x = 1/2 を入れた値が 1/4 以上であること、をとり出す、②1 本目：r(1/2 − r) の大きさを 1/16 以下におさえ（r ≠ s なので 1/256 を下回る）、a² > 64 を出して a ≧ 9 にする、③a = 9、10 を場合ごとにしらべて落とし、11 でできることを見せる。2 本目は、おさえる計算をせず、b² ≧ 4ac + 1 と −2b ≦ a + 4c − 1 という整数のきまりどうしをくみ合わせて (a − 4c)² ≧ 2a + 8c + 3 を作り、c = 1 と c が 2 以上に分ける道。1 本目は 2 つの値のかけ算を上からおさえ、2 本目は整数のきまりをくみ合わせる。check は a を 1 から 39、b と c を −2a から 2a まで広くしらべ（0 < −b < a、0 < c < a/4 なので足りる）、math.sqrt で解を出して、0 と 1/2 の間のちがう 2 つの解になるいちばん小さい a をさがす。区間が 0 から 1 で a のいちばん小さい値が 5 になる問題は昔から知られた型。区間を 1/2 にすると、かけ算のおさえが 9 どまりで、9 と 10 を落とす場合がふえる。「9 や 10」と答えるわなに注意。
