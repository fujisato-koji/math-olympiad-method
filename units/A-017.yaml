  - part: 離
    id: "c758828f85"
    kinds: [数]
    text: 方程式 x² − 6x + k = 0 が、ちがう 2 つの解をもつのは、k がどんなときですか。
    choices: ["k < 9", "k > 9", "k ≦ 9", "k ≧ 9"]
    answer: "k < 9"
    check: "'k < 9'"
    hints:
      - text: ちがう 2 つの解をもつのは、b² − 4ac がどんなときかな。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="10" width="96" height="182" rx="8" fill="#c8ccd6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/><text x="56" y="32" font-size="13" text-anchor="middle" fill="currentColor">b² − 4ac が</text><text x="56" y="50" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">正の数</text><line x1="18" y1="102" x2="94" y2="102" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="56" y1="98" x2="56" y2="106" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="30" cy="102" r="5.5" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="2"/><circle cx="82" cy="102" r="5.5" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="2"/><text x="56" y="142" font-size="14" text-anchor="middle" fill="currentColor">解は 2 つ</text><rect x="112" y="10" width="96" height="182" rx="8" fill="#c8ccd6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/><text x="160" y="32" font-size="13" text-anchor="middle" fill="currentColor">b² − 4ac が</text><text x="160" y="50" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">0</text><line x1="122" y1="102" x2="198" y2="102" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="160" y1="98" x2="160" y2="106" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="160" cy="102" r="5.5" fill="#f08080" fill-opacity="0.85" stroke="currentColor" stroke-width="2"/><text x="160" y="142" font-size="14" text-anchor="middle" fill="currentColor">解は 1 つ</text><rect x="216" y="10" width="96" height="182" rx="8" fill="#c8ccd6" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/><text x="264" y="32" font-size="13" text-anchor="middle" fill="currentColor">b² − 4ac が</text><text x="264" y="50" font-size="15" text-anchor="middle" fill="currentColor" font-weight="bold">負の数</text><line x1="226" y1="102" x2="302" y2="102" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="264" y1="98" x2="264" y2="106" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="264" y="90" font-size="12" text-anchor="middle" fill="currentColor" fill-opacity="0.7">点がない</text><text x="264" y="142" font-size="14" text-anchor="middle" fill="currentColor">解はない</text></svg>'
      - b² − 4ac は、ここでは (−6)² − 4 × 1 × k = 36 − 4k です。
      - k = 8、9、10 のように数を入れて、36 − 4k が正になるか調べよう。
    paths:
      - [b² − 4ac = (−6)² − 4 × 1 × k = 36 − 4k, ちがう 2 つの解をもつので 36 − 4k は正, 36 − 4k > 0 より k < 9]
      - [(x − 3)² = 9 − k と平方完成する, 右辺が正なら解は 2 つ, 9 − k > 0 より k < 9]
    note: b² − 4ac が正なら「ちがう 2 つの解」、0 なら「解は 1 つ（重解）」、負なら「解なし」。不等号の向きをまちがえやすい。
