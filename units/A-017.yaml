        id: "18ad57c5a0"
        text: x² − 5x + 6 = 0 のように、x の 2 乗のある方程式を 2 次方程式といいます。x = 2 も x = 3 も、入れると左辺が 0 になるので、どちらも解です。x² = 9 の解は、2 乗して 9 になる 3 と −3 の 2 つで、まとめて x = ±3 と書きます（図の上）。(x − 1)² = 5 なら x − 1 = ±√5 で、x = 1 ± √5 です（図の下）。
