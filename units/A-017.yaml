102" x2="302" y2="102" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="264" y1="98" x2="264" y2="106" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><text x="264" y="90" font-size="12" text-anchor="middle" fill="currentColor" fill-opacity="0.7">点がない</text><text x="264" y="142" font-size="14" text-anchor="middle" fill="currentColor">解はない</text></svg>'
