      - part: わけ
        id: "9386a6de0f"
        text: 「2 つの数 A、B について、AB = 0 ならば、A = 0 または B = 0 である」ことを、等式の性質を使って、すじ道を立てて書きましょう。
        explain: 例：「AB = 0 とする。A = 0 のときは、それで成り立つ。A が 0 でないときは、等式の両辺を 0 でない同じ数 A でわってよい（等式の性質、A-011）。AB ÷ A = B、0 ÷ A = 0 なので B = 0 になる。よって、どちらのときも A = 0 または B = 0 である。」と書ければよい。①「〜とする」で AB = 0 を出発点に置く、② A が 0 のときと 0 でないときに分けて、両辺を A でわる、③ 約束した事実（等式の性質、0 を 0 でない数でわると 0）で結ぶ、の 3 つがそろっているかを見る。2 × 0 = 0 のような例だけで終わっていたら、例ではすべての場合をしめせないことを話す。積が 0 でないとき（AB = 6 など）は、A や B の値は決まらないので、この性質は使えないことにもふれる（2 日目のちょう戦）。
        hints:
          - text: 「AB = 0 とする」から書き始め、A が 0 のときと 0 でないときに分けましょう。
            svg: '<svg viewBox="0 0 320 192" xmlns="http://www.w3.org/2000/svg"><text x="160" y="28" font-size="18" text-anchor="middle" fill="currentColor">AB = 0</text><line x1="140" y1="38" x2="82.6" y2="68.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="80,70 84.7,63.5 88,69.7" fill="currentColor"/><line x1="180" y1="38" x2="237.4" y2="68.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="240,70 232,69.7 235.3,63.5" fill="currentColor"/><rect x="10" y="76" width="140" height="56" rx="8" fill="#f3c969" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="80" y="98" font-size="15" text-anchor="middle" fill="currentColor">A = 0 のとき</text><text x="80" y="120" font-size="13" text-anchor="middle" fill="currentColor">それで成り立つ</text><rect x="170" y="76" width="140" height="56" rx="8" fill="#7fc8f8" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="240" y="98" font-size="15" text-anchor="middle" fill="currentColor">A が 0 でないとき</text><text x="240" y="120" font-size="13" text-anchor="middle" fill="currentColor">両辺を A でわる</text><line x1="240" y1="136" x2="240" y2="155" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="240,158 236.5,150.8 243.5,150.8" fill="currentColor"/><text x="240" y="180" font-size="16" text-anchor="middle" fill="currentColor">B = ?</text></svg>'
          - A が 0 でないとき、両辺を A でわるとどうなるでしょう。
          - 0 を 0 でない数でわると、いくつでしょう。
        paths:
          - [AB = 0 とする, A = 0 なら成り立つ, A が 0 でなければ両辺を A でわって B = 0, どちらでも A = 0 または B = 0]
          - [A も B も 0 でないとしてみる, 0 でない数どうしの積は 0 にならない（正 × 正、正 × 負、負 × 負 のどれも）, AB = 0 と合わないので、A か B のどちらかは 0]
      - part: わけ
        id: "9385d1f45e"
        text: 方程式 x² + px + q = 0 の解が x = (−p ± √(p² − 4q))/2 になることを、平方完成を使って、すじ道を立てて書きましょう（p² − 4q は 0 以上とします）。
        explain: 例：「p、q を数とし、p² − 4q は 0 以上とする。q を移項すると x² + px = −q。両辺に x の係数の半分の 2 乗 (p/2)² = p²/4 を足すと、x² + px + p²/4 = p²/4 − q。左辺は乗法公式で (x + p/2)²、右辺は通分して (p² − 4q)/4 になる。よって (x + p/2)² = (p² − 4q)/4。x + p/2 は (p² − 4q)/4 の平方根なので、x + p/2 = ±√(p² − 4q) ÷ √4 = ±√(p² − 4q)/2（√a ÷ √b = √(a/b)、A-016）。p/2 を移項して、x = (−p ± √(p² − 4q))/2 である。」と書ければよい。①「〜とする」で p、q を決める、② 移項と平方完成で式を変形する、③ 約束した事実（等式の性質、乗法公式、平方根の意味）で結ぶ、の 3 つがそろっているかを見る。p² − 4q が負なら、2 乗して負になる数はないので解はないことにもふれる。ax² + bx + c = 0 は、両辺を a でわって p = b/a、q = c/a とすれば同じすじ道で図の解の公式になる。x² + 6x + 2 = 0 のような例でたしかめただけで終わっていたら、例ではすべての p、q についてしめせないことを話す。
        hints:
          - text: q を移項してから、図の角の正方形の面積を両辺に足しましょう。
            svg: '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><rect x="46" y="30" width="86" height="86" fill="#f3c969" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="132" y="30" width="50" height="86" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="46" y="116" width="86" height="50" fill="#7fc8f8" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/><rect x="132" y="116" width="50" height="50" fill="#7bc96f" fill-opacity="0.35" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/><text x="157" y="146" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="0.6">?</text><text x="89" y="79" font-size="18" text-anchor="middle" fill="currentColor">x²</text><text x="157" y="78" font-size="14" text-anchor="middle" fill="currentColor">(p/2)x</text><text x="89" y="146" font-size="14" text-anchor="middle" fill="currentColor">(p/2)x</text><text x="89" y="22" font-size="15" text-anchor="middle" fill="currentColor">x</text><text x="157" y="22" font-size="15" text-anchor="middle" fill="currentColor">p/2</text><text x="38" y="78" font-size="15" text-anchor="end" fill="currentColor">x</text><text x="38" y="146" font-size="15" text-anchor="end" fill="currentColor">p/2</text><text x="252" y="70" font-size="15" text-anchor="middle" fill="currentColor">x² + px + ?</text><text x="252" y="100" font-size="15" text-anchor="middle" fill="currentColor">= (x + p/2)²</text></svg>'
          - 左辺を (x + p/2)² の形にし、右辺を通分しましょう。
          - x + p/2 は右辺の数の平方根です。√4 = 2 を使いましょう。
        paths:
          - [x² + px = −q, 両辺に p²/4 を足す, (x + p/2)² = (p² − 4q)/4, x + p/2 = ±√(p² − 4q)/2, x = (−p ± √(p² − 4q))/2]
          - [両辺を 4 倍して 4x² + 4px + 4q = 0, 両辺に p² − 4q を足して 4x² + 4px + p² = p² − 4q、つまり (2x + p)² = p² − 4q, 2x + p = ±√(p² − 4q), x = (−p ± √(p² − 4q))/2]
