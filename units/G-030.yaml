        explain: 例：「△PAD と △PCB で、∠APD = ∠CPB（共通の角）、∠PDA = ∠PBC（どちらも弧 AC に対する円周角）。2 組の角がそれぞれ等しいので △PAD ∽ △PCB。相似比を k とすると、PA は PC の k 倍、PD は PB の k 倍。よって PA × PB = k × PC × PB、PC × PD = PC × k × PB となり、PA × PB = PC × PD。」と書ければよい。1 問目と同じく、三角形を決める、相似から式にする、積で結ぶ、の 3 つを見る。どの頂点どうしが対応するかを取り違えやすいので、等しい角の頂点から順に書かせる。
