      - '△AED と △ADB で、∠A は共通、∠AED = ∠ADB = 90° なので相似（2 組の角が等しい）。AE : AD = AD : AB から AE × AB = AD²。同じように △AFD ∽ △ADC から AF × AC = AD²。だから AE × AB = AF × AC（= 64）。E は AB の上、F は AC の上なので、E と B は A から同じ向き、F と C も A から同じ向き。方べきの定理の逆から、B、C、F、E は 1 つの円の上にある（これを円ア）'
      - ∠AED = ∠AFD = 90° なので、E と F は AD を直径とする円の上にある（円周角の定理の逆。これを円イ）。AD ⊥ BC で、AD は円イの直径なので、直線 BC は D で円イに接する（半径のはしで半径に垂直な直線は接線。G-054）
      - G は直線 BC の上の点で D とはちがう（D は円イの上にあり、直線 EF が円イと交わるのは E、F だけ）。接線の上の D 以外の点は円イの外にあるので、接線と割線の方べきの定理で GD² = GE × GF で、E と F は G から同じ向きにある。すると G は線分 EF の外にあり、円ア（直線 EF との交点は E、F だけ）の外にもある。円アについて方べきの定理で GE × GF = GB × GC で、B と C も G から同じ向き。だから GD² = GB × GC で、G は線分 BC の上にはない
      - DG = x cm とする。G が C がわ（C の先）にあるとすると GC = x − 15、GB = x + 6 で x² = (x + 6)(x − 15) = x² − 9x − 90。9x = −90 となり x がマイナスで合わない。G が B がわ（B の先）にあるとすると GB = x − 6、GC = x + 15 で x² = (x − 6)(x + 15) = x² + 9x − 90。9x = 90、x = 10。DG = 10 cm（G は BC を B の先にのばした所で、B から 4 cm）
    - - 三平方の定理で BD、DC、AD を出す。BD = x cm とすると DC = (21 − x) cm。AD² を 2 通りに書くと 10² − x² = 17² − (21 − x)²。100 − x² = 289 − 441 + 42x − x² から 42x = 252、x = 6。BD = 6 cm、DC = 15 cm、AD² = 100 − 36 = 64 なので AD = 8 cm
      - '△BED と △BDA で、∠B は共通、∠BED = ∠BDA = 90° なので相似。DE : AD = BD : AB から DE = 8 × 6 ÷ 10 = 24/5 cm。同じように △CFD ∽ △CDA（∠C は共通、∠CFD = ∠CDA = 90°）から DF : AD = CD : CA で DF = 8 × 15 ÷ 17 = 120/17 cm'
      - 'E、F から BC に垂線 EP、FQ をひく。E は AD について B と同じがわ、F は C と同じがわにあるので、P は D から B の向き、Q は D から C の向きの所にできる。△DPE は P が直角で、∠PDE = ∠EDB = 90° − ∠B。△ADB も D が直角で、∠DAB = 90° − ∠B。よって △DPE ∽ △ADB（D、P、E が A、D、B の順に重なる）で、相似比は DE : AB = 24/5 : 10 = 12 : 25。DP = AD × 12/25 = 96/25 cm、EP = BD × 12/25 = 72/25 cm。同じように △DQF ∽ △ADC で、相似比は DF : AC = 120/17 : 17 = 120 : 289。DQ = 8 × 120/289 = 960/289 cm、FQ = DC × 120/289 = 1800/289 cm'
      - 'EP と FQ はどちらも BC に垂直なので平行。直線 EF が BC と交わる点 G で △GPE ∽ △GQF となり、GP : GQ = EP : FQ = 72/25 : 1800/289 = 289 : 625。E も F も三角形の辺の上にあるので、BC から見て同じがわ（A のがわ）にある。だから直線 EF は線分 PQ の外で BC と交わる。EP のほうが短いので、G は P のがわにあり、G、P、Q の順にならぶ。P は D から B の向きなので、G は D から B の向きにあり、DG = x cm とすると GP = x − 96/25、GQ = x + 960/289'
      - '(x − 96/25) : (x + 960/289) = 289 : 625 から 625 × (x − 96/25) = 289 × (x + 960/289)。625x − 2400 = 289x + 960。336x = 3360、x = 10。DG = 10 cm'
    note: '考えどころは 3 つ：①∠AED = ∠AFD = 90° から E と F は AD を直径とする円の上にあり、直角三角形の高さの関係 AE × AB = AD² = AF × AC から B、C、F、E も 1 つの円の上にある（かくれた 2 つの円）、②AD ⊥ BC なので、BC は AD を直径とする円に D で接する、③G からの方べきで GD² = GE × GF = GB × GC にし、G が線分 BC の外にあることから、C がわと B がわを調べて 1 次方程式で DG を出す。答えは AD の長さによらず、BD、DC だけで DG = BD × DC ÷ (DC − BD) = 6 × 15 ÷ 9 = 10 と決まる。2 本目は円も接線も使わず、E、F から BC への垂線の足 P、Q を相似で出し（D からのきょりと高さ）、平行な EP、FQ から GP : GQ = EP : FQ とおいて DG の 1 次方程式にする（1 本目はかくれた円と方べき、2 本目は相似と比）。check は辺の長さから A の位置（x と y の数）を出し、D から AB、AC への垂線の足 E、F を Fraction で求め、直線 EF が BC（x 軸）と交わる点 G を出して DG を返す（2 本の道に出てくる 6、15、289 : 625 は使わない）。3 本目の道として、この先の単元のメネラウスの定理を知っていれば、AE：EB = 16：9、CF：FA = 225：64 から BG：GC = 4：25 と出て、BG = 4、DG = 6 + 4 = 10。答えの 10 が AB と同じなのは、たまたま。既出・出典：「B、C、F、E が 1 つの円の上にある」は知られた性質。DG = BD × DC ÷ (DC − BD) となる形を問う大会の同じ問いは見つけていない。わな：G を C がわに置く、EF と BC が交わらないと思う。図は辺の長さのとおりにかき、EF、G、円はかかない（G を図に入れると、位置が見えてしまうため）。'
