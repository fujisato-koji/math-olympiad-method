# G-030 方べきの定理
#
# 書き方は N-001 の頭の注のとおり。
# 方べきの定理：点 P を通る 2 本の直線が円と A、B と C、D で交わるとき PA × PB = PC × PD（P が円の中でも外でも）。
#   接線のとき（T は接点）PT × PT = PA × PB。逆：PA × PB = PC × PD なら 4 点 A、B、C、D は 1 つの円の上にある。
# 前提は G-018（円周角の定理とその逆、直径に対する円周角）と G-020（相似の条件、相似比、平行線と線分の比）。
#   接線が接点を通る半径に垂直なこと、接線の長さが等しいこと、接弦定理は G-054 で扱う（作ったときは G-018 で扱うものとして使った。
#   G-018 は接線を扱わないので、2026-11-08 に G-054 を足して前提にした）。
# 作ったときは三平方の定理（G-019）と平方根（A-016）が前提になかった（2026-11-08 に前提に足した）。PT を求める問題は PT × PT が平方数（36、64、144 など）になる値にし、
#   「2 回かけると 36 になる数」として求める。中心からの距離は、P を通る直径を 2 本目の弦とみて
#   (半径 − OP) × (半径 + OP) で扱い、三平方の定理は使わない。
# 2 次方程式（A-017）も前提にないので、PA と PB の和と積から求める問題は、かけて 18、たして 11 になる整数の組を探す形にした。
# 文字の式（A-010）も前提にないので、未知の長さは文字で置かず「PD = 24 ÷ 3」のように積と商で求める。
#   わけの日だけ、相似比を k と置いて「PA は PD の k 倍」と書く。
# 根軸と 2 つの円（G-032）、円に内接する四角形の性質（G-023）、三角形の五心（G-028）は先取りしない。
# 長さの単位は cm。図の円の上の点は、問題の長さのとおりに作図した（地平線の図だけは高さを大きくかいた）。
# D-026：6 日目の挑戦の「地平線までの距離」は、電波塔や人工衛星からどこまで見通せるかを見積もる式と同じ形。
# 地図に plan がないので既定の並び（導入・練習 5 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 円の中で交わる 2 本の弦　2 日目 円の外の点からの 2 本の直線（割線）　3 日目 接線と割線
#   4 日目 直径を使う（半径と中心からの距離）、弓形の高さから半径　5 日目 方べきの定理の逆（4 点が 1 つの円の上にあるか）
#   6 日目 P を通るどの直線でも積は同じ、和と積から長さ、地平線　7 日目 わけ（相似で示す 3 つの場合）
#   8 日目 G-018（円周角）・G-020（相似）と混ぜる　9 日目 確認
# check：長さは積と商の式（Fraction）、PT は math.isqrt。同じ円の上にあるかを選ぶ問題は、積をくらべる式。
#   和と積から求める問題は、1 から順に試す式。地平線は math.sqrt で近い選択肢を選ぶ式。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-017、G-054 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。
# ただし腕だめしの最難関（AB = BC の円に内接する四角形の対角線 AC）だけは例外で、uses に G-015、G-023、G-043 を挙げて、点を中心にした回転（G-015）、円に内接する四角形の向かい合う角の和（G-023）、トレミーの定理（G-043）を使う。

