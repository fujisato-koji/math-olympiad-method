    text: 円に内接する四角形 ABCD があり、AB = BC = 5 cm、CD = 4 cm、DA = 6 cm です。対角線 AC の長さは何 cm ですか。図は長さのとおりにかいてあるとはかぎりません。答えは分数で書きましょう。
    svg: <svg viewBox="0 0 220 226" xmlns="http://www.w3.org/2000/svg"><circle cx="110.0" cy="116.0" r="92.9" stroke="currentColor" stroke-width="1.5" fill="none"/><polygon points="17.1,114.1 110.0,23.1 202.9,114.1 146.4,201.4" stroke="currentColor" stroke-width="2" fill="none"/><line x1="60.8" y1="65.8" x2="66.4" y2="71.5" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="159.2" y1="65.8" x2="153.6" y2="71.5" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="17.1" cy="114.1" r="2.2" fill="currentColor"/><circle cx="110.0" cy="23.1" r="2.2" fill="currentColor"/><circle cx="202.9" cy="114.1" r="2.2" fill="currentColor"/><circle cx="146.4" cy="201.4" r="2.2" fill="currentColor"/><text x="7.1" y="118.1" font-size="12" text-anchor="middle">A</text><text x="110.0" y="16.1" font-size="12" text-anchor="middle">B</text><text x="212.9" y="118.1" font-size="12" text-anchor="middle">C</text><text x="155.4" y="215.4" font-size="12" text-anchor="middle">D</text></svg>
    answer: 50/7
    check: '(lambda a, b, c, d: (lambda s: (lambda r: r if r * r == s else -1)(Fraction(math.isqrt(s.numerator), math.isqrt(s.denominator))))(Fraction((a * a + b * b) * c * d + (c * c + d * d) * a * b, c * d + a * b)))(5, 5, 4, 6)'
    hints:
    - AB = BC であることを、ほかのことばで言いかえてみよう。
    - 2 本の対角線について、辺の長さで書ける関係はなかったかな。
    - AB = BC を使って、三角形を 1 つ、別の場所へうつしてみよう。
    paths:
    - - AB に対する円周角で ∠ADB = ∠ACB、BC に対する円周角で ∠BDC = ∠BAC。△BAC は AB = BC の二等辺三角形なので ∠ACB = ∠BAC。よって ∠ADB = ∠BDC で、DB は ∠ADC を 2 等分する（四角形はへこんでいないので、DB は ∠ADC の内がわを通る）
      - 半直線 DA の上に DC′ = DC = 4 cm となる点 C′ をとる（DA = 6 cm なので C′ は D と A の間）。△DBC と △DBC′ で、DB は共通、DC = DC′、∠BDC = ∠BDC′ なので合同（2 組の辺とその間の角）。よって BC′ = BC = 5 cm
      - BA = BC′ = 5 cm なので、B を中心とする半径 5 cm の円は A と C′ を通る。D から出る直線 DA はこの円と C′ と A で交わり、C′ も A も D から同じ向きにあるので、D はこの円の外にある。DB > 5 cm
      - D と円の中心 B を通る直線は、この円と、D から DB − 5 と DB + 5 の所で交わる。方べきの定理から DC′ × DA = (DB − 5) × (DB + 5)。4 × 6 = DB × DB − 25、DB × DB = 49。2 回かけて 49 になる数は 7 なので DB = 7 cm
      - トレミーの定理（円に内接する四角形 ABCD で AC × BD = AB × CD + BC × DA）から AC × 7 = 5 × 4 + 5 × 6 = 50。AC = 50/7 cm
    - - △BCD を B のまわりに回して、C が A に重なるようにする（回す角は ∠CBA）。D がうつる点を D′ とする。回しても長さと角は変わらないので、AD′ = CD = 4 cm、BD′ = BD、∠BAD′ = ∠BCD
      - 四角形 ABCD は円に内接するので、向かい合う角の和は ∠BAD + ∠BCD = 180°。∠BAD′ = ∠BCD なので ∠BAD + ∠BAD′ = 180°
      - 回す向きに気をつける。C が A に重なる向きに回すと、直線 BC は直線 BA に重なる。このとき A 自身は直線 BA から C と反対がわへ出ていくので、直線 BC について A と同じがわの点は、回すと直線 BA について C と反対がわの点にうつる。D は直線 BC について A と同じがわにあるので、D′ は直線 AB について C と反対がわにある。一方、D は直線 AB について C と同じがわ（四角形 ABCD はへこんでいない）。だから D と D′ は直線 AB の反対がわにあり、∠BAD + ∠BAD′ = 180° から D、A、D′ は一直線。DD′ = DA + AD′ = 6 + 4 = 10 cm
      - △BDD′ は BD = BD′ の二等辺三角形。DD′ のまん中を N とすると BN ⊥ DD′ で、DN = 10 ÷ 2 = 5 cm。DA = 6 cm なので N は D と A の間にあり、AN = 6 − 5 = 1 cm。直角三角形 ABN で BN² = 5² − 1² = 24、直角三角形 DBN で BD² = BN² + DN² = 24 + 25 = 49。2 回かけて 49 になる数は 7 なので BD = 7 cm
      - '△BDD′ と △BCA で、BD : BC = 7 : 5、BD′ : BA = 7 : 5、∠DBD′ = ∠CBA（どちらも回した角）。2 組の辺の比とその間の角が等しいので △BDD′ ∽ △BCA。DD′ : CA = 7 : 5 から AC = 10 × 5 ÷ 7 = 50/7 cm'
    note: 考えどころは 3 つ：①AB = BC から、BD が ∠ADC を 2 等分する（等しい辺に対する円周角が等しい）、または B のまわりに C を A へ回せる、②新しい点（C′ または D′）をつくって BD² = AB² + DA × DC = 25 + 24 = 49、BD = 7 を出す（1 本目は DC′ = DC の点 C′ と、B を中心とする半径 5 の円への方べき、2 本目は D、A、D′ を一直線にならべる）、③BD から AC を出す（トレミーの定理、または相似）。2 本目は回転、二等辺三角形の三平方の定理、相似で長さを出し、方べきもトレミーも使わない（1 本目は円周角、方べき、トレミーの円の定理、2 本目は回転と相似）。check は、三角形 ABC と ADC の 3 辺から ∠B と ∠D のコサイン（cos）を出し、円に内接するので ∠B + ∠D = 180°、cos B + cos D = 0 とおいて AC × AC を Fraction で求め、分子と分母の平方根（math.isqrt）を取って返す（50/7）。さらに、円の半径を二分法で求めて 4 点を円に置き、AC = 7.142857…、BD = 7 になることも確かめた。3 本目の道として、この先の単元の余弦定理（G-024）を知っていれば、∠B + ∠D = 180° から 2 つの三角形の式をならべて AC × AC を直接出せる（check と同じ式）。2 本とも BD を先に出し、BD² = AB² + DA × DC を別の考えで示す（1 本目は方べき、2 本目は回転と三平方の定理）。この式を知っていれば 2〜3 行で終わるが、この単元の道具だけでとく子には、AB = BC の使い方（円周角か回転）、新しい点、BD から AC の 3 つの考えどころが残る。BD を通らない道として、直線 AB と DC をのばした交わる点 Q で △QAD ∽ △QCB（相似比 6：5）から QA = 300/11、QD = 294/11 などを出し、△QAC ∽ △QDB で AC：BD = 50：49、トレミーの定理で AC × BD = 50 とする道もある。同じ単元の DG の問題とは、方べきを使う所が重なる。既出・出典：「AB = BC の内接四角形で BD² = AB² + AD × CD」は知られた式。大会の同じ問いは見つけていない。わな：BD = 7 を AC と答える、AC を直径とみて √50 と答える（図は長さのとおりにかいたので、∠B は約 91° で直角に見える）。図に対角線と円の中心はかかない（AC が直径に近く見え、答えにつながるため）。
