        explain: 例：「△PAC と △PDB で、∠PAC = ∠PDB（どちらも弧 BC に対する円周角）、∠APC = ∠DPB（対頂角）。2 組の角がそれぞれ等しいので △PAC ∽ △PDB。相似比を k とすると、PA は PD の k 倍、PC は PB の k 倍。よって PA × PB = k × PD × PB、PC × PD = k × PB × PD となり、PA × PB = PC × PD。」と書ければよい。① △PAC と △PDB を選び、等しい角を言う、② 相似から辺の関係を式にする、③ 積が等しいと結ぶ、の 3 つがそろっているかを見る。比例式 PA:PD = PC:PB から、外側の 2 つの積と内側の 2 つの積が等しいとして PA × PB = PC × PD としてもよい。いくつかの数で確かめただけでは、すべての弦について示したことにならない（例ではすべての場合を示せない）ことに触れる。
