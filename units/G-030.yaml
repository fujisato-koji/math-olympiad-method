        explain: PA × PB = 4 × 6 = 24、PC × PD = 3 × 8 = 24 で、等しくなります。円の 2 本の弦 AB、CD が点 P で交わるとき、いつも PA × PB = PC × PD が成り立ちます。これを方べきの定理といいます（わけは 7 日目）。長さは、どれも交わる点 P から測ります。4 つの長さのうち 3 つがわかれば、残りの 1 つは「積が等しい」ことから求められます。たとえば PD がわからなければ、3 × PD = 24 なので PD = 24 ÷ 3 = 8 cm です。
