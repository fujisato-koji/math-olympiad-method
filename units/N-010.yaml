  - part: 離
    kinds: [読み取り]
    text: ある日の朝の気温は −3℃、昼は 7℃、夜は −1℃ でした。昼と夜の気温差は何℃ですか。
    answer: 8
    check: "7 - (-1)"
    hints:
      - 気温差は、高いほうの気温から低いほうの気温をひく。
      - 昼は 7℃、夜は −1℃。
      - 7 − (−1) を計算しよう。
    paths:
      - [昼の気温 7℃、夜の気温 −1℃, 差は 7 − (−1), 7 + 1 = 8]
    note: 負の数をひくことは、その数の反対の数をたすこと。気温差は 7 − (−1) = 8℃。
