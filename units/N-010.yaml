      - [2 つずつくみにする, 1 − 2 = −1、3 − 4 = −1、……、19 − 20 = −1, 1 と 2 から 19 と 20 までくみは 10 こ, −1 を 10 こ あわせて −10]
    note: 順に計算すると 19 回の計算になる。2 つずつ組にすると、どの組も −1 になることに気づくのが道筋（組になるものを探す）。組の数を 20 や 19 と数える誤りに気をつける。プラスの数どうし・マイナスの数どうしを集めると 100 をこえるので、この単元の範囲では組にする道が自然。
