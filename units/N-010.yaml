# N-010 正負の数のたし算とひき算
#
# 書き方は N-001 の頭の注のとおり。図と答えの形は N-004 に合わせる：
#   0 より小さい数は「−3」（U+2212）と書いて「マイナス 3」と読む。数直線は「 ─ 」（前後に空白）で目もりを区切る。
#   この単元は地図の keys: [−] で段 2 でも鍵盤に − が出るので、符号のつく計算の答えは打つ問題にする（− を付けるかを自分で決める）。
#   選ぶ問題は「どれ」と聞くものだけ。check で「−3」の形にするのは N-004 と同じ (lambda v: f'−{-v}' if v < 0 else f'{v}')(式)。
# 式の中の 0 より小さい数は ( ) で囲む（(−2) + 5、4 + (−3)）。ひく数が大きいひき算（2 − 5）は N-004 で済んでいるので、思い出すにだけ使う。
# D-014 により、たし算とひき算をプラスとマイナスの数へ広げる。日の並び：
#   1 日目 0 より小さい数から始める式、2 日目 マイナスの数をたす（向きが反対で左へ）、
#   3 日目 マイナスの数をひく（ひき算は「ちがい」：2 − (−3) は「−3 から 2 まで いくつ」。動きは右へ）、4 日目 わけ、5 日目 N-004 と N-007 と混ぜる。
# 「地下の階」は N-004 と同じく使わない（0 階がない）。温度とゲームの点で場面を作る。
# かけ算とわり算（N-027）、絶対値（N-011）は扱わない。

id: N-010
days:
  - day: 1
    items:
      - part: 見本
        text: (−2) + 5 を、かずの せんで かんがえよう。
        figure: "−2 ─ −1 ─ 0 ─ 1 ─ 2 ─ 3"
        explain: (−2) は「マイナス 2」です。しきの なかの マイナスの かずは、( ) で かこみます。−2 に ゆびを おいて、5 を たすので、みぎへ 5 つ すすみます。−1、0、1、2、3。(−2) + 5 = 3 です。ひく ときは、ひだりへ もどります。
      - part: 思い出す
        text: 2 − 5 は いくつですか。
        figure: "−4 ─ −3 ─ −2 ─ −1 ─ 0 ─ 1 ─ 2"
        answer: −3
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(2 - 5)"
        hints:
          - 2 に ゆびを おこう。
          - ひだりへ 5 かい もどろう。
          - 0 を こえても、そのまま ひだりへ もどろう。
        paths:
          - [2 から ひだりへ 1、0、−1、−2、−3, −3]
      - part: 思い出す
        text: 53 − 21 は いくつですか。
        answer: 32
        check: "53 - 21"
        hints:
          - いちの くらいから ひこう。
          - いちの くらいは 3 − 1 だね。
          - じゅうの くらいは 5 − 2 だね。
        paths:
          - [3 − 1 = 2, 5 − 2 = 3, 32]
      - part: 今日
        text: (−3) + 5 は いくつですか。
        figure: "−3 ─ −2 ─ −1 ─ 0 ─ 1 ─ 2 ─ 3"
        answer: 2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((-3) + 5)"
        hints:
