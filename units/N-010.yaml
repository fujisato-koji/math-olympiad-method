          - たす ときは、みぎへ すすむよ。
          - とちゅうで 0 を とおっても、そのまま すすもう。
        paths:
          - [−3 から みぎへ −2、−1、0、1、2, 5 かい すすんだ, 2]
        note: こたえに − を つけるか どうかで まよいやすい。ついた ところが 0 の みぎか ひだりかを みる。
