# D-008 1 変数関数の微分
#
# 段 6・水準 3・8 日。前提は D-006（微分係数と導関数）。
# 平均値の定理、ロルの定理、応用、テイラーの定理、テイラー展開と近似を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: D-008
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          平均値の定理：f が [a, b] で連続、(a, b) で微分可能なら、
          f'(c) = (f(b) − f(a)) / (b − a) となる c が (a, b) にあります。
          右辺は、2 点 (a, f(a))、(b, f(b)) を結ぶ直線の傾きです。
          どこかの点で、接線の傾きが平均の傾きに等しくなります。
        explain: |-
          平均値の定理は「平均の速さと同じ瞬間の速さが、どこかにある」という定理です。
          例：f(x)=x²、[0,2]。平均の傾きは (4−0)/2=2。f'(x)=2x なので、2c=2 となる c は 1。
          走る速さの平均が時速 10 km なら、どこかで時速 10 km になった瞬間があります。
        note: f'(c) = (f(b)−f(a))/(b−a)。平均の傾きと同じ接線の傾きがある。
      - part: 今日
        text: f(x) = x² の [0, 2] における平均の傾きはどれですか。
        choices: [1, 2, 4, 8]
        answer: 2
        check: "f'{(2 ** 2 - 0 ** 2) / (2 - 0):.0f}'"
        hints:
          - 平均の傾きは (f(b)−f(a))/(b−a) です。
          - f(0) と f(2) を計算します。
          - 差を区間の幅でわります。
        paths:
          - [(f(2)−f(0))/(2−0), 差と幅を計算, 平均の傾き]
      - part: 今日
        text: f(x) = x² の [0, 2] で、平均値の定理を満たす c はどれですか。
        choices: [0.5, 1, 1.5, 2]
        answer: 1
        check: "1"
        hints:
          - f'(x) を計算します。
          - f'(c) が平均の傾きに等しいとおきます。
          - 方程式を解きます。
        paths:
          - [f'(x)=2x, 2c=平均の傾き, c を求める]
      - part: 挑戦
        text: 平均値の定理で、c はどの区間の点ですか。
        choices: ["(a, b) の内部", "a だけ", "b だけ", "区間の外"]
        answer: "(a, b) の内部"
        check: "'(a, b) の内部'"
        hints:
          - 定理の条件を思い出します。
          - c は開区間 (a, b) にあります。
          - 端ではありません。
        paths:
          - [開区間 (a,b), 内部の点]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          ロルの定理：f が [a, b] で連続、(a, b) で微分可能で、f(a) = f(b) なら、
          f'(c) = 0 となる c が (a, b) にあります。
          平均値の定理で、平均の傾きが 0 の場合です。
          山の頂上や谷の底では、接線が水平になります。
        explain: |-
          f(a)=f(b) なら、平均の傾きは 0。平均値の定理から f'(c)=0 となる c があります。
          例：f(x)=x²−2x、[0,2]。f(0)=0、f(2)=0。f'(x)=2x−2 なので、2c−2=0 となる c は 1。
          微分可能でない点があると、定理は使えません。
        note: f(a)=f(b) なら f'(c)=0 となる c がある。平均値の定理の特別な場合。
      - part: 今日
        text: f(x) = x² − 2x の [0, 2] で、ロルの定理を満たす c はどれですか。
        choices: [0, 1, 2, 3]
        answer: 1
        check: "1"
        hints:
          - f(0) と f(2) を確かめます。
          - f'(x) を計算します。
          - f'(c)=0 を解きます。
        paths:
          - [f(0)=f(2), f'(x)=2x−2, f'(c)=0]
      - part: 今日
        text: ロルの定理で、f(a) = f(b) のときに言えることはどれですか。
        choices: ["f'(c)=0 となる c がある", "f'(c)=1 となる c がある", "f は定数", "c は存在しない"]
        answer: "f'(c)=0 となる c がある"
        check: "\"f'(c)=0 となる c がある\""
        hints:
          - 平均値の定理で、平均の傾きを考えます。
          - f(a)=f(b) なので、平均の傾きは 0 です。
          - 接線が水平になる点があります。
        paths:
          - [平均の傾き 0, 接線が水平, f'(c)=0]
      - part: 挑戦
        text: ロルの定理を使うのに必要な条件はどれですか。
        choices: ["連続で微分可能", "単調増加", "f(a)≠f(b)", "f が 1 次関数"]
        answer: "連続で微分可能"
        check: "'連続で微分可能'"
        hints:
          - 平均値の定理の条件と同じです。
          - 区間で連続、内部で微分可能が必要です。
          - そのうえで f(a)=f(b) です。
        paths:
          - [連続, 微分可能, f(a)=f(b)]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          平均値の定理の応用：
          ・f'(x) > 0 なら f は単調増加。f'(x) < 0 なら単調減少。
          ・f'(x) = 0 が区間全体で成り立つなら、f は定数。
          ・不等式を示すとき、差の関数を作って、その微分の符号を見ます。
          例：x > 0 で e^x > 1 + x を示すには、f(x)=e^x−1−x とおき、f(0)=0、f'(x)=e^x−1>0 を使います。
        explain: |-
          2 点を結ぶ平均の傾きの符号が、f の増減を決めます。
          f'(x)>0 なら、どの 2 点でも平均の傾きが正なので、f は増えます。
          不等式は「差の関数」を作り、端点の値と微分の符号で示します。
        note: f'>0 で増加、f'<0 で減少、f'=0 で定数。不等式は差の関数の微分を見る。
      - part: 今日
        text: f'(x) > 0 が区間全体で成り立つとき、f はどうなりますか。
        choices: ["単調増加", "単調減少", "定数", "振動する"]
        answer: "単調増加"
        check: "'単調増加'"
        hints:
          - 平均値の定理で、2 点の平均の傾きを考えます。
          - 平均の傾きは f'(c) に等しく、正です。
          - どの 2 点でも右へ行くほど値が大きくなります。
        paths:
          - [平均の傾き f'(c)>0, 右へ行くほど大きい, 単調増加]
      - part: 今日
        text: f'(x) = 0 が区間全体で成り立つとき、f はどうなりますか。
        choices: ["単調増加", "単調減少", "定数", "振動する"]
        answer: "定数"
        check: "'定数'"
        hints:
          - どの 2 点でも平均の傾きは 0 です。
          - f(b)−f(a)=0 です。
          - すべての点で同じ値になります。
        paths:
          - [平均の傾き 0, f(b)=f(a), 定数]
      - part: 挑戦
        text: x > 0 で e^x > 1 + x を示すとき、差の関数 f(x) はどれですか。
        choices: ["e^x − 1 − x", "e^x + 1 + x", "1 + x − e^x", "e^x − x"]
        answer: "e^x − 1 − x"
        check: "'e^x − 1 − x'"
        hints:
          - 示したい不等式の左辺から右辺を引きます。
          - 差が正であることを示します。
          - f(x)=e^x−(1+x) とおきます。
        paths:
          - [左辺−右辺, e^x−1−x, 差が正]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          テイラーの定理：f が a のまわりで n+1 回微分可能なら、
          f(x) = f(a) + f'(a)(x−a) + f''(a)/2! (x−a)² + … + f⁽ⁿ⁾(a)/n! (x−a)ⁿ + Rₙ(x)。
          Rₙ は剰余項で、f⁽ⁿ⁺¹⁾(c)/(n+1)! (x−a)ⁿ⁺¹ の形に書けます。
          a=0 のときをマクローリン展開といいます。
        explain: |-
          テイラー展開は、関数を多項式で近似する方法です。
          項を増やすほど、a の近くでよく合います。剰余項は近似の誤差を表します。
          例：e^x = 1 + x + x²/2! + x³/3! + …。
        note: テイラー展開は多項式近似。剰余項が誤差。a=0 はマクローリン展開。
      - part: 今日
        text: e^x の x=0 における 3 次のテイラー多項式はどれですか。
        choices: ["1 + x + x²/2 + x³/6", "1 + x + x² + x³", "x + x²/2 + x³/6", "1 + x²/2 + x³/6"]
        answer: "1 + x + x²/2 + x³/6"
        check: "'1 + x + x²/2 + x³/6'"
        hints:
          - e^x の x=0 での値を順に求めます。
          - 何回微分しても e^x です。
          - 係数は 1/n! です。
        paths:
          - [e^0=1, 何回微分しても e^x, 係数 1/n!]
      - part: 今日
        text: sin x の x=0 における 3 次のテイラー多項式はどれですか。
        choices: ["x − x³/6", "x + x³/6", "1 − x²/2", "x − x²/2"]
        answer: "x − x³/6"
        check: "'x − x³/6'"
        hints:
          - sin 0、cos 0、−sin 0、−cos 0 を順に使います。
          - 奇数次の項だけが残ります。
          - 3 次の係数は −1/3! です。
        paths:
          - [sin 0=0、cos 0=1, 奇数次のみ, 係数 −1/6]
      - part: 挑戦
        text: テイラー展開の剰余項 Rₙ は、何を表しますか。
        choices: ["近似の誤差", "関数の最大値", "微分の回数", "積分の値"]
        answer: "近似の誤差"
        check: "'近似の誤差'"
        hints:
          - 多項式で近似したときの、残りの部分です。
          - 実際の値と近似値の差です。
          - 誤差を表します。
        paths:
          - [残りの部分, 実際の値との差, 誤差]
    extra: []

  - day: 5
    items:
      - part: 見本
        text: |-
          テイラー展開の例：
          e^x = 1 + x + x²/2! + x³/3! + …
          sin x = x − x³/3! + x⁵/5! − …
          cos x = 1 − x²/2! + x⁴/4! − …
          ln(1+x) = x − x²/2 + x³/3 − …（|x| < 1）
          (1+x)^α = 1 + αx + α(α−1)/2! x² + …
        explain: |-
          小さな x では、最初の数項でよい近似になります。
          例：e^0.1 ≈ 1 + 0.1 + 0.01/2 = 1.105。
          sin 0.1 ≈ 0.1。cos 0.1 ≈ 1 − 0.01/2 = 0.995。
          項を増やすと、誤差は小さくなります。
        note: e^x、sin、cos、ln(1+x)、(1+x)^α の展開。小さい x で最初の項がよい近似。
      - part: 今日
        text: e^0.1 を 2 次の項までで近似すると、いくつですか。
        choices: [1.1, 1.105, 1.11, 1.2]
        answer: 1.105
        check: "1 + 0.1 + 0.1 ** 2 / 2"
        hints:
          - e^x = 1 + x + x²/2 + … を使います。
          - x = 0.1 を入れます。
          - 1、0.1、0.005 を足します。
        paths:
          - [1 + x + x²/2, x=0.1, 項を足す]
      - part: 今日
        text: sin 0.1 を 1 次の項までで近似すると、いくつですか。
        choices: [0.01, 0.1, 1, 0.995]
        answer: 0.1
        check: "0.1"
        hints:
          - sin x = x − x³/6 + … を使います。
          - 1 次の項は x です。
          - x = 0.1 を入れます。
        paths:
          - [sin x ≈ x, x=0.1, 1 次の項]
      - part: 挑戦
        text: e^0.1 の 2 次近似の誤差は、およそ何の桁ですか。
        choices: ["10⁻³", "10⁻⁴", "10⁻²", "10⁻¹"]
        answer: "10⁻⁴"
        check: "'10⁻⁴'"
        hints:
          - 次の項は x³/6 です。
          - x=0.1 を入れて大きさを見ます。
          - 0.001/6 は約 0.00017 です。
        paths:
          - [次の項 x³/6, 0.001/6, 約 10⁻⁴]
    extra: []

  - day: 6
    items:
      - part: わけ
        text: 平均値の定理が成り立つわけを、グラフの平均の傾きから説明しましょう。
        explain: 「2 点 (a,f(a))、(b,f(b)) を結ぶ直線の傾きが平均の傾き。グラフをその直線から上下にずらして考えると、どこかで接線が直線と平行になる。その点 c で f'(c) が平均の傾きに等しい。」と書ければよい。① 平均の傾き、② 平行な接線、③ c の存在。子どもには、x² の例で確かめさせます。
        hints:
          - 2 点を結ぶ直線の傾きが平均の傾きです。
          - グラフを上下にずらすと、どこかで接線が平行になります。
          - その点で f'(c) が平均の傾きに等しくなります。
        paths:
          - [平均の傾き, 平行な接線, c の存在]
      - part: わけ
        text: ロルの定理が平均値の定理から出るわけを説明しましょう。
        explain: 「f(a)=f(b) なら、平均の傾き (f(b)−f(a))/(b−a) は 0。平均値の定理から、f'(c) が平均の傾きに等しい c があります。よって f'(c)=0。」と書ければよい。① 平均の傾き 0、② 平均値の定理、③ f'(c)=0。子どもには、山の頂上で接線が水平になる図で確かめさせます。
        hints:
          - f(a)=f(b) のとき、平均の傾きはいくつですか。
          - 平均値の定理をそのまま使います。
          - f'(c) が平均の傾きに等しくなります。
        paths:
          - [平均の傾き 0, 平均値の定理, f'(c)=0]
      - part: わけ
        text: テイラー展開が関数を多項式で近似できるわけを説明しましょう。
        explain: 「テイラーの定理は、f(x) を a のまわりの多項式と剰余項の和に書ける、と述べています。多項式の係数は f(a)、f'(a)、f''(a)/2!、… で決まります。剰余項を無視すれば、多項式の近似になります。項を増やすほど、a の近くでよく合います。」と書ければよい。① 多項式と剰余項、② 係数は微分の値、③ 項を増やすとよく合う。子どもには、e^x の展開で確かめさせます。
        hints:
          - テイラーの定理は、多項式と剰余項の和に書けると言います。
          - 係数は、a での微分の値で決まります。
          - 剰余項を無視すると近似になります。
        paths:
          - [多項式と剰余項, 係数は微分の値, 近似]

