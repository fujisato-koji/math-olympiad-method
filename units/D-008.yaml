            <g stroke="currentColor" fill="none" stroke-width="1.2" opacity=".55">
              <line x1="20" y1="155" x2="350" y2="155"/>
              <line x1="35" y1="30" x2="35" y2="170"/>
            </g>
            <g stroke="currentColor" fill="none">
              <path d="M35.0 151.5 L50.0 150.9 L65.0 150.1 L80.0 149.2 L95.0 148.1 L110.0 146.8 L125.0 145.3 L140.0 143.5 L155.0 141.4 L170.0 138.9 L185.0 135.9 L200.0 132.3 L215.0 128.1 L230.0 123.1 L245.0 117.2 L260.0 110.2 L275.0 101.9 L290.0 92.1 L305.0 80.4 L320.0 66.6 L335.0 50.2" stroke-width="2.6"/>
              <path d="M105.6 155.0 L120.9 151.3 L136.2 147.7 L151.5 144.0 L166.8 140.3 L182.1 136.7 L197.4 133.0 L212.6 129.3 L227.9 125.7 L243.2 122.0 L258.5 118.3 L273.8 114.7 L289.1 111.0 L304.4 107.3 L319.7 103.7 L335.0 100.0" stroke-width="1.4" stroke-dasharray="6 4"/>
              <path d="M35.0 137.7 L50.0 140.2 L65.0 142.2 L80.0 143.5 L95.0 144.3 L110.0 144.4 L125.0 143.9 L140.0 142.8 L155.0 141.1 L170.0 138.8 L185.0 135.9 L200.0 132.3 L215.0 128.2 L230.0 123.4 L245.0 118.0 L260.0 112.0 L275.0 105.4 L290.0 98.2 L305.0 90.4 L320.0 82.0 L335.0 72.9" stroke-width="1.4" stroke-dasharray="10 4 2 4"/>
              <path d="M35.0 158.2 L50.0 155.5 L65.0 153.2 L80.0 151.1 L95.0 149.2 L110.0 147.4 L125.0 145.6 L140.0 143.6 L155.0 141.4 L170.0 138.9 L185.0 135.9 L200.0 132.3 L215.0 128.1 L230.0 123.2 L245.0 117.3 L260.0 110.5 L275.0 102.7 L290.0 93.7 L305.0 83.3 L320.0 71.7 L335.0 58.5" stroke-width="1.4" stroke-dasharray="2 4"/>
            </g>
            <line x1="193.8" y1="133.8" x2="193.8" y2="155" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>
            <circle cx="193.8" cy="133.8" r="3.2" fill="currentColor"/>
            <g font-size="10.5" fill="currentColor">
              <line x1="40" y1="17" x2="55" y2="17" stroke="currentColor" stroke-width="2.6"/><text x="58" y="21">e^x</text>
              <line x1="105" y1="17" x2="120" y2="17" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4"/><text x="123" y="21">1+x</text>
              <line x1="165" y1="17" x2="180" y2="17" stroke="currentColor" stroke-width="1.4" stroke-dasharray="10 4 2 4"/><text x="183" y="21">2 次</text>
