# D-008 1 変数関数の微分
#
# 段 6・水準 3・8 日。前提は D-006（微分係数と導関数）。
# 平均値の定理、ロルの定理、応用、テイラーの定理、テイラー展開と近似を扱う。
# 答えは子の画面に出さない（保護者の表示だけ）。ヒントは答えを書かず、手順だけを示す。

id: D-008
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          平均値の定理：f が [a, b] で連続、(a, b) で微分可能なら、
          f'(c) = (f(b) − f(a)) / (b − a) となる c が (a, b) にあります。
          右辺は、2 点 (a, f(a))、(b, f(b)) を結ぶ直線の傾きです。
          どこかの点で、接線の傾きが平均の傾きに等しくなります。
        explain: |-
          平均値の定理は「平均の速さと同じ瞬間の速さが、どこかにある」という定理です。
          例：f(x)=x²、[0,2]。平均の傾きは (4−0)/2=2。f'(x)=2x なので、2c=2 となる c は 1。
          走る速さの平均が時速 10 km なら、どこかで時速 10 km になった瞬間があります。
        note: f'(c) = (f(b)−f(a))/(b−a)。平均の傾きと同じ接線の傾きがある。
        svg: |-
          <svg viewBox="0 0 360 180" role="img" aria-label="平均値の定理のグラフ">
            <line x1="30" y1="150" x2="340" y2="150" stroke="currentColor" stroke-width="1" opacity=".45"/>
            <line x1="30" y1="20" x2="30" y2="150" stroke="currentColor" stroke-width="1" opacity=".45"/>
            <path d="M40 140 C 100 55, 220 40, 320 95" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <line x1="40" y1="140" x2="320" y2="95" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" opacity=".6"/>
            <line x1="110" y1="105" x2="230" y2="78" stroke="currentColor" stroke-width="2"/>
            <circle cx="40" cy="140" r="3.5" fill="currentColor"/>
            <circle cx="320" cy="95" r="3.5" fill="currentColor"/>
            <circle cx="170" cy="91" r="3.5" fill="currentColor"/>
            <text x="32" y="166" font-size="12" fill="currentColor">a</text>
            <text x="316" y="114" font-size="12" fill="currentColor">b</text>
            <text x="166" y="112" font-size="12" fill="currentColor">c</text>
          </svg>
      - part: 今日
        text: f(x) = x² の [0, 2] における平均の傾きはどれですか。
        choices: [1, 2, 4, 8]
        answer: 2
        check: "f'{(2 ** 2 - 0 ** 2) / (2 - 0):.0f}'"
        hints:
          - 平均の傾きは (f(b)−f(a))/(b−a) です。
          - f(0) と f(2) を計算します。
          - 差を区間の幅でわります。
        paths:
          - [(f(2)−f(0))/(2−0), 差と幅を計算, 平均の傾き]
      - part: 今日
        text: f(x) = x² の [0, 2] で、平均値の定理を満たす c はどれですか。
        choices: [0.5, 1, 1.5, 2]
        answer: 1
        check: "1"
        hints:
          - f'(x) を計算します。
          - f'(c) が平均の傾きに等しいとおきます。
          - 方程式を解きます。
        paths:
          - [f'(x)=2x, 2c=平均の傾き, c を求める]
      - part: 挑戦
        text: 平均値の定理で、c はどの区間の点ですか。
        choices: ["(a, b) の内部", "a だけ", "b だけ", "区間の外"]
        answer: "(a, b) の内部"
        check: "'(a, b) の内部'"
        hints:
          - 定理の条件を思い出します。
          - c は開区間 (a, b) にあります。
          - 端ではありません。
        paths:
          - [開区間 (a,b), 内部の点]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          ロルの定理：f が [a, b] で連続、(a, b) で微分可能で、f(a) = f(b) なら、
          f'(c) = 0 となる c が (a, b) にあります。
          平均値の定理で、平均の傾きが 0 の場合です。
          山の頂上や谷の底では、接線が水平になります。
        explain: |-
          f(a)=f(b) なら、平均の傾きは 0。平均値の定理から f'(c)=0 となる c があります。
          例：f(x)=x²−2x、[0,2]。f(0)=0、f(2)=0。f'(x)=2x−2 なので、2c−2=0 となる c は 1。
          微分可能でない点があると、定理は使えません。
        note: f(a)=f(b) なら f'(c)=0 となる c がある。平均値の定理の特別な場合。
      - part: 今日
        text: f(x) = x² − 2x の [0, 2] で、ロルの定理を満たす c はどれですか。
        choices: [0, 1, 2, 3]
        answer: 1
        check: "1"
        hints:
          - f(0) と f(2) を確かめます。
          - f'(x) を計算します。
          - f'(c)=0 を解きます。
        paths:
          - [f(0)=f(2), f'(x)=2x−2, f'(c)=0]
      - part: 今日
        text: ロルの定理で、f(a) = f(b) のときに言えることはどれですか。
        choices: ["f'(c)=0 となる c がある", "f'(c)=1 となる c がある", "f は定数", "c は存在しない"]
        answer: "f'(c)=0 となる c がある"
        check: "\"f'(c)=0 となる c がある\""
        hints:
          - 平均値の定理で、平均の傾きを考えます。
          - f(a)=f(b) なので、平均の傾きは 0 です。
          - 接線が水平になる点があります。
        paths:
          - [平均の傾き 0, 接線が水平, f'(c)=0]
      - part: 挑戦
        text: ロルの定理を使うのに必要な条件はどれですか。
        choices: ["連続で微分可能", "単調増加", "f(a)≠f(b)", "f が 1 次関数"]
        answer: "連続で微分可能"
        check: "'連続で微分可能'"
        hints:
          - 平均値の定理の条件と同じです。
          - 区間で連続、内部で微分可能が必要です。
          - そのうえで f(a)=f(b) です。
        paths:
          - [連続, 微分可能, f(a)=f(b)]
    extra: []

  - day: 3
    items:
      - part: 見本
        text: |-
          平均値の定理の応用：
          ・f'(x) > 0 なら f は単調増加。f'(x) < 0 なら単調減少。
          ・f'(x) = 0 が区間全体で成り立つなら、f は定数。
          ・不等式を示すとき、差の関数を作って、その微分の符号を見ます。
          例：x > 0 で e^x > 1 + x を示すには、f(x)=e^x−1−x とおき、f(0)=0、f'(x)=e^x−1>0 を使います。
        explain: |-
          2 点を結ぶ平均の傾きの符号が、f の増減を決めます。
          f'(x)>0 なら、どの 2 点でも平均の傾きが正なので、f は増えます。
          不等式は「差の関数」を作り、端点の値と微分の符号で示します。
        note: f'>0 で増加、f'<0 で減少、f'=0 で定数。不等式は差の関数の微分を見る。
      - part: 今日
        text: f'(x) > 0 が区間全体で成り立つとき、f はどうなりますか。
        choices: ["単調増加", "単調減少", "定数", "振動する"]
        answer: "単調増加"
        check: "'単調増加'"
        hints:
          - 平均値の定理で、2 点の平均の傾きを考えます。
          - 平均の傾きは f'(c) に等しく、正です。
          - どの 2 点でも右へ行くほど値が大きくなります。
        paths:
          - [平均の傾き f'(c)>0, 右へ行くほど大きい, 単調増加]
      - part: 今日
        text: f'(x) = 0 が区間全体で成り立つとき、f はどうなりますか。
        choices: ["単調増加", "単調減少", "定数", "振動する"]
        answer: "定数"
        check: "'定数'"
        hints:
          - どの 2 点でも平均の傾きは 0 です。
          - f(b)−f(a)=0 です。
          - すべての点で同じ値になります。
        paths:
          - [平均の傾き 0, f(b)=f(a), 定数]
      - part: 挑戦
        text: x > 0 で e^x > 1 + x を示すとき、差の関数 f(x) はどれですか。
        choices: ["e^x − 1 − x", "e^x + 1 + x", "1 + x − e^x", "e^x − x"]
        answer: "e^x − 1 − x"
        check: "'e^x − 1 − x'"
        hints:
          - 示したい不等式の左辺から右辺を引きます。
          - 差が正であることを示します。
          - f(x)=e^x−(1+x) とおきます。
        paths:
          - [左辺−右辺, e^x−1−x, 差が正]
    extra: []

  - day: 4
    items:
      - part: 見本
        text: |-
          テイラーの定理：f が a のまわりで n+1 回微分可能なら、
          f(x) = f(a) + f'(a)(x−a) + f''(a)/(2!) (x−a)² + … + f⁽ⁿ⁾(a)/(n!) (x−a)ⁿ + Rₙ(x)。
          Rₙ は剰余項で、f⁽ⁿ⁺¹⁾(c)/((n+1)!) (x−a)ⁿ⁺¹ の形に書けます。
          a=0 のときをマクローリン展開といいます。
        explain: |-
          テイラー展開は、曲線を 1 点のまわりで多項式に置きかえる方法です。
          ｜記号｜意味｜
          ｜f(x)｜近似したい関数｜
          ｜a｜展開の中心｜
          ｜n｜多項式の次数｜
          ｜f⁽ᵏ⁾(a)｜f を k 回微分した値｜
          ｜R_n(x)｜剰余項（近似の誤差）｜
          x=0 の近くでは、1 + x は e^x の接線、1 + x + x²/2 は曲がりまで合わせた近似、1 + x + x²/2 + x³/6 はさらに近い近似です。
          項を増やすほど、a の近くでよく合います。遠く離れると近似は外れ、その誤差が剰余項です。
          例：e^x = 1 + x + x²/(2!) + x³/(3!) + …。
        note: テイラー展開は多項式近似。剰余項が誤差。a=0 はマクローリン展開。
