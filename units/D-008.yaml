        explain: |-
          小さな x では、はじめの数項でよい近似になります。
          例：x = 0.3 のとき、eˣ ≈ 1 + 0.3 + 0.09/2 = 1.345（本当は 1.3498…）。sin 0.3 ≈ 0.3。cos 0.3 ≈ 1 − 0.09/2 = 0.955。
          項を増やすと、誤差は小さくなります。近似で使わなかった次の項の大きさが、誤差のおよその大きさです。
        note: eˣ、sin、cos の展開。小さい x で最初の項がよい近似。
