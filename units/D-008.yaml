        explain: "平均値の定理は「平均の速さと同じ速さのしゅんかんが、とちゅうのどこかにある」という定理です。\n例：f(x) = x²、[1, 3]。平均の傾きは (9 − 1)/(3 − 1) = 4。f′(x) = 2x なので、2c = 4 となる c = 2 が、1 と 3 の間にあります。\n赤の点線を平行にずらしていくと、曲線に 1 点だけでふれる所があり、そこが C です。"
        note: f′(c) = (f(b)−f(a))/(b−a)。平均の傾きと同じ傾きの接線がある。
