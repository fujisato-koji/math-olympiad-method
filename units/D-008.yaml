          - 1 点だけでふれる直線は、その点での接線です。その傾きは、何と等しいですか。
        paths:
          - ["赤の点線の傾き = 平均の傾き", "平行にずらして、1 点でふれる点 C", "C での接線の傾き f′(c) = 平均の傾き"]
          - ["F(x) = f(x) − （A と B を結ぶ直線の式）", "F(a) = F(b) = 0 なので、ロルの定理で F′(c) = 0", "f′(c) = 平均の傾き"]
        explain: 「2 点 A、B を結ぶ赤の点線の傾きが、平均の傾き。この直線を、傾きを変えずに上下にずらしていくと、曲線からはなれる直前に、曲線と 1 点だけでふれる。その点 C での接線は赤の点線と平行なので、f′(c) が平均の傾きに等しい。」と書ければよい。① 平均の傾き、② 平行な接線、③ c があること。きちんと示すには、F(x) = f(x) − （A と B を結ぶ直線の式）とおくと F(a) = F(b) = 0 なので、ロルの定理から F′(c) = 0、つまり f′(c) = 平均の傾き。子どもには、y = x² の例で確かめさせます。
