    items:
      - part: 見本
        id: "bb30c2d83d"
        text: |-
          f″(x) は f′(x) をもう 1 回微分したもの、f⁽ⁿ⁾(x) は n 回微分したものです。n! = n × (n − 1) × … × 1（3! = 6）。
          テイラーの定理：x = a の近くで、f(x) = f(a) + f′(a)(x − a) + f″(a)/2! × (x − a)² + … + f⁽ⁿ⁾(a)/n! × (x − a)ⁿ + Rₙ。
          多項式で近似した残りの Rₙ を、剰余項といいます。a = 0 のときを、マクローリン展開といいます。
          eˣ は、何回微分しても eˣ で、e⁰ = 1 です。図は、eˣ と、x = 0 での 1 次・2 次・3 次の多項式です。
