      - part: 今日
        text: e^x の x=0 における 3 次のテイラー多項式はどれですか。
        choices: ["1 + x + x²/2 + x³/6", "1 + x + x² + x³", "x + x²/2 + x³/6", "1 + x²/2 + x³/6"]
        answer: "1 + x + x²/2 + x³/6"
        check: "'1 + x + x²/2 + x³/6'"
        hints:
          - e^x の x=0 での値を順に求めます。
          - 何回微分しても e^x です。
          - 係数は 1/(n!) です。
        paths:
          - [e^0=1, 何回微分しても e^x, 係数 1/(n!)]
      - part: 今日
        text: sin x の x=0 における 3 次のテイラー多項式はどれですか。
        choices: ["x − x³/6", "x + x³/6", "1 − x²/2", "x − x²/2"]
        answer: "x − x³/6"
        check: "'x − x³/6'"
        hints:
          - sin 0、cos 0、−sin 0、−cos 0 を順に使います。
          - 奇数次の項だけが残ります。
          - 3 次の係数は −1/3! です。
        paths:
          - [sin 0=0、cos 0=1, 奇数次のみ, 係数 −1/6]
      - part: 挑戦
        text: テイラー展開の剰余項 Rₙ は、何を表しますか。
        choices: ["近似の誤差", "関数の最大値", "微分の回数", "積分の値"]
        answer: "近似の誤差"
        check: "'近似の誤差'"
        hints:
          - 多項式で近似したときの、残りの部分です。
          - 実際の値と近似値の差です。
          - 誤差を表します。
        paths:
          - [残りの部分, 実際の値との差, 誤差]
    extra: []

  - day: 5
    items:
      - part: 見本
        text: |-
          テイラー展開の例：
          e^x = 1 + x + x²/(2!) + x³/(3!) + …
          sin x = x − x³/(3!) + x⁵/5! − …
          cos x = 1 − x²/(2!) + x⁴/(4!) − …
          ln(1+x) = x − x²/2 + x³/3 − …（|x| < 1）
          (1+x)^α = 1 + αx + α(α−1)/(2!) x² + …
        explain: |-
          小さな x では、最初の数項でよい近似になります。
          例：e^0.1 ≈ 1 + 0.1 + 0.01/2 = 1.105。
          sin 0.1 ≈ 0.1。cos 0.1 ≈ 1 − 0.01/2 = 0.995。
          項を増やすと、誤差は小さくなります。
        note: e^x、sin、cos、ln(1+x)、(1+x)^α の展開。小さい x で最初の項がよい近似。
      - part: 今日
        text: e^0.1 を 2 次の項までで近似すると、いくつですか。
        choices: [1.1, 1.105, 1.11, 1.2]
        answer: 1.105
        check: "1 + 0.1 + 0.1 ** 2 / 2"
        hints:
          - e^x = 1 + x + x²/2 + … を使います。
          - x = 0.1 を入れます。
          - 1、0.1、0.005 を足します。
        paths:
          - [1 + x + x²/2, x=0.1, 項を足す]
      - part: 今日
        text: sin 0.1 を 1 次の項までで近似すると、いくつですか。
        choices: [0.01, 0.1, 1, 0.995]
        answer: 0.1
        check: "0.1"
        hints:
          - sin x = x − x³/6 + … を使います。
          - 1 次の項は x です。
          - x = 0.1 を入れます。
        paths:
          - [sin x ≈ x, x=0.1, 1 次の項]
      - part: 挑戦
        text: e^0.1 の 2 次近似の誤差は、およそ何の桁ですか。
        choices: ["10⁻³", "10⁻⁴", "10⁻²", "10⁻¹"]
        answer: "10⁻⁴"
        check: "'10⁻⁴'"
        hints:
          - 次の項は x³/6 です。
          - x=0.1 を入れて大きさを見ます。
          - 0.001/6 は約 0.00017 です。
        paths:
          - [次の項 x³/6, 0.001/6, 約 10⁻⁴]
    extra: []

  - day: 6
    items:
      - part: わけ
        text: 平均値の定理が成り立つわけを、グラフの平均の傾きから説明しましょう。
        explain: 「2 点 (a,f(a))、(b,f(b)) を結ぶ直線の傾きが平均の傾き。グラフをその直線から上下にずらして考えると、どこかで接線が直線と平行になる。その点 c で f'(c) が平均の傾きに等しい。」と書ければよい。① 平均の傾き、② 平行な接線、③ c の存在。子どもには、x² の例で確かめさせます。
        hints:
          - 2 点を結ぶ直線の傾きが平均の傾きです。
          - グラフを上下にずらすと、どこかで接線が平行になります。
          - その点で f'(c) が平均の傾きに等しくなります。
        paths:
          - [平均の傾き, 平行な接線, c の存在]
      - part: わけ
        text: ロルの定理が平均値の定理から出るわけを説明しましょう。
        explain: 「f(a)=f(b) なら、平均の傾き (f(b)−f(a))/(b−a) は 0。平均値の定理から、f'(c) が平均の傾きに等しい c があります。よって f'(c)=0。」と書ければよい。① 平均の傾き 0、② 平均値の定理、③ f'(c)=0。子どもには、山の頂上で接線が水平になる図で確かめさせます。
        hints:
          - f(a)=f(b) のとき、平均の傾きはいくつですか。
          - 平均値の定理をそのまま使います。
          - f'(c) が平均の傾きに等しくなります。
        paths:
          - [平均の傾き 0, 平均値の定理, f'(c)=0]
      - part: わけ
        text: テイラー展開が関数を多項式で近似できるわけを説明しましょう。
        explain: 「テイラーの定理は、f(x) を a のまわりの多項式と剰余項の和に書ける、と述べています。多項式の係数は f(a)、f'(a)、f''(a)/(2!)、… で決まります。剰余項を無視すれば、多項式の近似になります。項を増やすほど、a の近くでよく合います。」と書ければよい。① 多項式と剰余項、② 係数は微分の値、③ 項を増やすとよく合う。子どもには、e^x の展開で確かめさせます。
        hints:
          - テイラーの定理は、多項式と剰余項の和に書けると言います。
          - 係数は、a での微分の値で決まります。
          - 剰余項を無視すると近似になります。
        paths:
          - [多項式と剰余項, 係数は微分の値, 多項式で近似する]

