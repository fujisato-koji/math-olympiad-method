          - ["テイラーの定理：f(x) = 多項式 + Rₙ", "a の近くでは Rₙ が小さい", "多項式で近似できる"]
        explain: 「テイラーの定理は、f(x) を a のまわりの多項式と剰余項の和に書ける、と言っている。多項式の係数は f(a)、f′(a)、f″(a)/2!、… で決まり、x = a での高さ・傾き・曲がり方が f と合う。剰余項を無視すれば、多項式の近似になる。項を増やすほど、a の近くでよく合う。」と書ければよい。① 多項式と剰余項、② 係数は微分の値、③ 項を増やすとよく合う。子どもには、eˣ の展開で確かめさせます。

