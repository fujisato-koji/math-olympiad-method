        id: "1507e51e0e"
        text: |-
          平均値の定理 f(x₂) − f(x₁) = f′(c)(x₂ − x₁) から、次のことが言えます。
          ・どこでも f′(x) > 0 なら、f は単調増加（右へ行くほど大きい）。
          ・どこでも f′(x) < 0 なら単調減少。どこでも f′(x) = 0 なら f は定数。
          ・不等式は、差の関数を作り、その微分の符号を見て示します。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="14" width="98" height="114" rx="8" fill="#ffffff" fill-opacity="0" stroke="#c8ccd6" stroke-width="1.2"/><polyline points="19,107.6 21.5,106.4 23.5,105.5 25.5,104.4 27.5,103.3 29.5,102.2 31.5,101 33.5,99.7 35.5,98.4 37.5,96.9 39.5,95.5 41.5,93.9 43.5,92.4 45.5,90.7 47.5,89 49.5,87.2 51.5,85.3 53.5,83.4 55.5,81.5 57.5,79.4 59.5,77.3 61,75.7 62.5,74.1 64,72.4 65.5,70.7 67,68.9 68.5,67.1 70,65.3 71.5,63.5 73,61.6 74.5,59.6 76,57.7 77.5,55.7 79,53.6 80.5,51.6 82,49.4 83.5,47.3 85,45.1 86.5,42.9 88,40.7 89.5,38.4 91,36.1 92.5,33.7 94,31.3 95.5,28.9 97,26.4 98.5,23.9 99,23.1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><line x1="25.2" y1="105.6" x2="47.8" y2="89.7" stroke="#7fc8f8" stroke-width="2.6"/><circle cx="36.5" cy="97.7" r="3" fill="currentColor"/><line x1="65.2" y1="72" x2="87.8" y2="42" stroke="#7fc8f8" stroke-width="2.6"/><circle cx="76.5" cy="57" r="3" fill="currentColor"/><text x="57" y="150" font-size="14" text-anchor="middle" fill="currentColor">f′(x) &gt; 0</text><text x="57" y="172" font-size="13" text-anchor="middle" fill="currentColor">↓</text><text x="57" y="192" font-size="14" text-anchor="middle" fill="currentColor">単調増加</text><rect x="112" y="14" width="98" height="114" rx="8" fill="#ffffff" fill-opacity="0" stroke="#c8ccd6" stroke-width="1.2"/><polyline points="123,38.3 125,39.3 127,40.3 129,41.4 131,42.6 133,43.8 135,45.1 137,46.4 139,47.8 141,49.2 143,50.7 145,52.2 147,53.8 149,55.5 151,57.2 153,58.9 155,60.7 157,62.6 159,64.5 161,66.5 163,68.5 165,70.6 167,72.7 168.5,74.3 170,76 171.5,77.7 173,79.4 174.5,81.2 176,83 177.5,84.8 179,86.6 180.5,88.5 182,90.4 183.5,92.3 185,94.3 186.5,96.3 188,98.3 189.5,100.4 191,102.5 192.5,104.6 194,106.7 195.5,108.9 197,111.1 198.5,113.4 200,115.6 201.5,117.9 202.8,120" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><line x1="129.2" y1="40.7" x2="151.8" y2="57" stroke="#7fc8f8" stroke-width="2.6"/><circle cx="140.5" cy="48.9" r="3" fill="currentColor"/><line x1="169.2" y1="74.3" x2="191.8" y2="102.7" stroke="#7fc8f8" stroke-width="2.6"/><circle cx="180.5" cy="88.5" r="3" fill="currentColor"/><text x="161" y="150" font-size="14" text-anchor="middle" fill="currentColor">f′(x) &lt; 0</text><text x="161" y="172" font-size="13" text-anchor="middle" fill="currentColor">↓</text><text x="161" y="192" font-size="14" text-anchor="middle" fill="currentColor">単調減少</text><rect x="216" y="14" width="98" height="114" rx="8" fill="#ffffff" fill-opacity="0" stroke="#c8ccd6" stroke-width="1.2"/><polyline points="227,74.5 229.5,74.5 232,74.5 234.5,74.5 237,74.5 239.5,74.5 242,74.5 244.5,74.5 247,74.5 249.5,74.5 252,74.5 254.5,74.5 257,74.5 259.5,74.5 262,74.5 264.5,74.5 267,74.5 269.5,74.5 272,74.5 274.5,74.5 277,74.5 279.5,74.5 282,74.5 284.5,74.5 287,74.5 289.5,74.5 292,74.5 294.5,74.5 297,74.5 299.5,74.5 302,74.5 304.5,74.5 307,74.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><line x1="233.2" y1="74.5" x2="255.8" y2="74.5" stroke="#7fc8f8" stroke-width="2.6"/><circle cx="244.5" cy="74.5" r="3" fill="currentColor"/><line x1="273.2" y1="74.5" x2="295.8" y2="74.5" stroke="#7fc8f8" stroke-width="2.6"/><circle cx="284.5" cy="74.5" r="3" fill="currentColor"/><text x="265" y="150" font-size="14" text-anchor="middle" fill="currentColor">f′(x) = 0</text><text x="265" y="172" font-size="13" text-anchor="middle" fill="currentColor">↓</text><text x="265" y="192" font-size="14" text-anchor="middle" fill="currentColor">定数</text></svg>'
        explain: |-
          x₁ < x₂ の 2 点をとると、平均値の定理から f(x₂) − f(x₁) = f′(c)(x₂ − x₁) となる c があります。x₂ − x₁ は正なので、f(x₂) − f(x₁) の符号は f′(c) の符号と同じです。
          例：x > 1 で x³ > 3x − 2 を示すには、f(x) = x³ − 3x + 2 とおきます。f(1) = 0 で、x > 1 では f′(x) = 3x² − 3 > 0 なので f は増加し、f(x) > f(1) = 0 です。
        note: f'>0 で増加、f'<0 で減少、f'=0 で定数。不等式は差の関数の微分を見る。
