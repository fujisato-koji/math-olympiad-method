          - 平均値の定理の f′(c) = (f(b) − f(a))/(b − a) に、そのまま当てはめます。
        paths:
          - ["分子 f(b) − f(a) = 0", "平均の傾き 0", "平均値の定理で f′(c) = 0"]
          - ["f が定数なら、どこでも f′ = 0", "定数でなければ、いちばん高い点か低い点が a と b の間にある", "そこで接線が水平、f′(c) = 0"]
        explain: 「f(a) = f(b) なら、平均の傾き (f(b) − f(a))/(b − a) は 0。平均値の定理から、f′(c) が平均の傾きに等しい c がある。よって f′(c) = 0。」と書ければよい。① 平均の傾き 0、② 平均値の定理、③ f′(c) = 0。子どもには、山の頂上で接線が水平になる図で確かめさせます。
