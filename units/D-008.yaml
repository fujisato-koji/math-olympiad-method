        explain: |-
          テイラー展開は、曲線を 1 点のまわりで多項式に置きかえる方法です。
          ｜記号｜意味｜
          ｜f(x)｜近似したい関数｜
          ｜a｜展開の中心｜
          ｜n｜多項式の次数｜
          ｜f⁽ᵏ⁾(a)｜f を k 回微分して、x = a を入れた値｜
          ｜Rₙ(x)｜剰余項（本当の値と近似の値の差、近似の誤差）｜
          剰余項は Rₙ(x) = f⁽ⁿ⁺¹⁾(c)/(n + 1)! × (x − a)ⁿ⁺¹（c は a と x の間の数）と書けます。n = 0 のときが平均値の定理です。
          x = 0 の近くでは、1 次の多項式は eˣ の接線、2 次は曲がり方まで合わせた近似、3 次はさらに近い近似です。項を増やすほど、a の近くでよく合い、遠くはなれると外れます。
        note: テイラー展開は多項式近似。剰余項が誤差。a=0 はマクローリン展開。
