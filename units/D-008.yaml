        explain: |-
          f(a) = f(b) なら、平均の傾き (f(b) − f(a))/(b − a) は 0。平均値の定理から、f′(c) = 0 となる c があります。
          例：f(x) = x² − 4x、[0, 4]。f(0) = 0、f(4) = 0。f′(x) = 2x − 4 なので、2c − 4 = 0 となる c = 2 が、0 と 4 の間にあります。
          条件の 1 つでも欠けると、c があるとは言えなくなります。
        note: f(a)=f(b) なら f′(c)=0 となる c がある。平均値の定理の特別な場合。
