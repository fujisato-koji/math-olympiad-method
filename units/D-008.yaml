# D-008 1 変数関数の微分（平均値の定理、テイラーの定理）
#
# 水準 4・8 日。前提は D-005（導関数の計算と関数のグラフ）。
# 1 日目 平均値の定理、2 日目 ロルの定理、3 日目 平均値の定理の応用（増加・減少、定数、差の関数で不等式）、
#   4 日目 テイラーの定理（f″ と n 回の微分、階乗、剰余項）、5 日目 テイラー展開と近似（eˣ、sin x、cos x）、
#   6 日目 わけ、7 日目 混ぜる、8 日目 確認。
# 単元のことば（子の文で使う）：平均の傾き、接線の傾き、符号、項、剰余項、テイラー多項式、マクローリン展開。
# eˣ は D-001（指数関数と対数関数）の中身で、前提のたどりにない。3 日目の挑戦は「左辺 − 右辺」を選ぶだけにし、
#   4 日目の見本で「eˣ は何回微分しても eˣ、e⁰ = 1」を約束した事実として言う。log x と (1 + x)^α の展開は取り上げない。
# f″（第 2 次導関数）は D-005 にないので、4 日目の見本で「f′ をもう 1 回微分したもの」と言う。
# 書き方：導関数は f′(x)、f″(x)（′ は U+2032、″ は U+2033）。[a, b] は a ≦ x ≦ b、(a, b) は a < x < b（1 日目の見本で言う）。
# 子の画面には text、svg、choices、ヒント、explain、paths を出す。answer、check、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる（c の点や近似の値はかかない）。
# 図は svg（D-129〜D-131）：曲線は黒、2 点を結ぶ直線（平均の傾き）は赤の点線、接線は水色、近似の多項式は緑（1 次・2 次・3 次をならべるときは水色・緑・紫）。
#   c を求める問題の一部は、グラフのまん中を灰色の箱でかくし、見ただけで答えが出ないようにした。
# 7・8 日目と腕だめしは、前の日と同じ問題のくり返しだったので、関数や区間を変えた新しい問題にした（D-191）。

id: D-008
days:
  - day: 1
    items:
      - part: 見本
        id: "03d7d1cc43"
        text: |-
          曲線の上の 2 点 A(a, f(a))、B(b, f(b)) を結ぶ直線（赤の点線）の傾き (f(b) − f(a))/(b − a) を、a から b までの「平均の傾き」といいます。
          f が [a, b]（a ≦ x ≦ b）で連続、(a, b)（a < x < b）で微分可能なら、A と B の間に、接線（水色）が赤の点線と平行になる点 C があります。
          C の x 座標を c とすると、f′(c) = (f(b) − f(a))/(b − a)。これを平均値の定理といいます。
