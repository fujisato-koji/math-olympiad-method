      - part: 見本
        id: "48855c7949"
        text: |-
          x = 0 のまわりのテイラー展開（マクローリン展開）の例：
          eˣ = 1 + x + x²/2! + x³/3! + …
          sin x = x − x³/3! + x⁵/5! − …
