        explain: |-
          ゆでる・やく、こげる、さびる、すっぱい ものと じゅうそうの あわ は、もとの ものが べつの ものに かわる かわりかたです。だから、ひやしても、かわかしても、まっても もとには もどりません。たまごの すきとおった ところ（白み）は、あたためると 白く かたまり、ひえても その ままです（ゆでたまごでも 目玉やきでも おなじ）。こげは さかなや パンが あつさで くろい べつの ものに かわった もの、さびは てつが 水と 空気に ふれて できた べつの もの、あわは すっぱい もの（レモンの しるや す）と じゅうそうが まざって できた あたらしい もの です（べつの ものが できる わけは 3 日目に あつかいます）。見本は ゆでたまご・さかな・クリップ・レモンの しるで かき、きょうの もんだいは 目玉やき・パン・くぎ・す に して、見本を そのまま うつしても こたえが 出ない ように して あります。
          じっけんは かんたんです。めっきの ない てつくぎを ぬれた ティッシュに のせて、なん日か 見る。す か レモンの しるに じゅうそうを 小さじ 1 ぱい 入れて、あわを 見る（のまない、目に 入れない）。たまごを ゆでる ときや、さかなや パンを やく ときは、おうちの ひとと いっしょに。
