      - イ と ウ も、おなじ ように たどろう。
    paths:
      - [ア は はじめと ひやした あとが おなじ, ウ も おなじ, イ は 目玉やきの まま, ア と ウ]
      - [とける ものは もとに もどる, やく ものは もどらない, ア と ウ]
    note: とける・こおる は もとに もどり、やく は もどらない。
