        explain: |-
          「チョコは とけても チョコの まま で、すがたが かわった だけ。だから ひやすと、かたい チョコに もどる。パンは こげると、くろくて にがい べつの ものに かわって しまう。べつの ものに なったら、ひやしても もとの パンには もどらない。」と いえれば よい。
          ① とける・こおる・かたまる は、おなじ ものの まま すがたが かわる だけ、② やく・こげる・さびる・す と じゅうそうの あわ は、べつの ものが できる、③ べつの ものが できると、ひやしても あたためても もどらない、の 3 つが 入れば よい。とけた チョコは なめても チョコの あじ、こげた ところは にがい、と あじで くらべると わかりやすい（こげは ほんの すこし だけ）。
