# H-062 もどる変化ともどらない変化
#
# 水準 2・5 日。とける・こおる（こおり、チョコ、バター、ろうは、あたためるととけ、ひやすとかたまって、もとのすがたにもどる）と、もどらない変化（やく・こげる・さびる・すとじゅうそうのあわは、ひやしても、かわかしても、まっても、もとにもどらない）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。1 日目 とける・かたまるはもどる、2 日目 やく・こげる・さびる・すとじゅうそうのあわはもどらない、3 日目 わけ（おなじもののまますがたがかわるだけならもどり、べつのものができるともどらない）、4 日目 混ぜる、5 日目 確認。
# 図の約束：赤い矢印は「あたためる」、青い矢印は「ひやす」（H-002 と同じ）、黒い矢印は時がたつ・うつす・こする。✕の付いた曲がった青い矢印は「ひやしても もとにもどらない」（2 日目の見本で子に言う）。もどるかを問うところは、てんせんの曲がった青い矢印と ? でかく。
# とけた物はカップの中の波線の液でかく（水は空色、チョコは茶、バターは黄、ろうはクリーム色、すとレモンのしるはうすい黄）。こげは黒、さびは赤茶色。なまのたまごの白みはうすい空色（すきとおっている）、やいた白みは白。わからないところはてんせんの四角に ? でかく。
# 2 日目の見本は、その日の問い（目玉やき・パン・くぎ・す）とおなじものにならないよう、ゆでたまご・さかな・クリップ・レモンのしるでかく（D-193）。
# 火、湯、トースター、とけたろうを使う場面には「おうちの ひとと いっしょに」を付けた。すとじゅうそうは飲まない・目に入れない、こげは少しだけなめる、と explain に書いた。
# 腕だめし（離）は 2 問とも、絵を読む読み取り（kinds: 読み取り）。
# 粒で説明すること・重さは H-003、燃えること（酸素と二酸化炭素）は H-004、酸性・アルカリ性は H-005、化学変化・原子のことばは H-008 で扱うので、ここでは使わない。れいぞうこでは水がこおらないことは問わない（水をこおらせるのはれいとうこ）。

id: H-062
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          こおりを あたためると、とけて 水に なります。その 水を ひやすと、また こおりに なります。
          あたためて かわった ものが、ひやすと まえの すがたに かえる ことを「もとに もどる」と いいます。
          こおりの ほかにも、あたためると とけて、ひやすと かたまる ものが あります。
          あかい やじるしは「あたためる」、あおい やじるしは「ひやす」の しるしです。
