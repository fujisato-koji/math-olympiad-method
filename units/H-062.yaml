  - day: 2
    items:
      - part: 見本
        text: |-
          なまの たまごを おゆで ゆでると、すきとおった ところが 白く かたく なり、ゆでたまごに なります。ゆでたまごを ひやしても、なまの たまごには もどりません。
          さかなを やきすぎて くろく こげるのも、てつの クリップが 水に ぬれた まま さびて 赤茶色に なるのも、もとに もどりません。
          レモンの しるの ような すっぱい ものに、白い こなの「じゅうそう」を 入れると、あわが たくさん 出ます。これも もとに もどりません。
          ✕の ついた まがった やじるしは「もとに もどらない」の しるしです。
