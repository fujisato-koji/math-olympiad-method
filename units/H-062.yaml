        explain: |-
          こおり、チョコ、バター、ろうは、あたためると とけて とろとろに なり、ひやすと かたまって もとの すがたに もどります。とけても かたまっても、もの そのものは かわらず、すがたが かわる だけ だからです（この わけは 3 日目に あつかいます）。
          きょうは「とける と かたまる（こおる）は、いったり きたり できる」が つかめれば よい。チョコを おゆで とかして かたに 入れ、れいぞうこで かためて みると よく わかります（おゆを つかう ので、おうちの ひとと いっしょに）。
