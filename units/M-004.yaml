  - day: 4
    items:
      - part: 見本
        text: |-
          積の行列式：det(AB) = det A × det B。
          逆行列：det(A⁻¹) = 1 / det A（det A ≠ 0 のとき）。
          転置：det(Aᵀ) = det A。
          定数倍：n×n の A と数 k について、det(kA) = kⁿ det A。
          A に逆行列があることと、det A ≠ 0 は同値です。
        explain: |-
          det(AB) = det A det B は、2 つの変換を続けて行うと、面積の倍率が掛け合わさることから分かります。
          逆行列は面積の倍率を打ち消すので、det(A⁻¹) = 1/det A。転置しても面積は同じ。kA は各辺を k 倍するので、n 次元では kⁿ 倍。
          det A = 0 なら面積が 0 につぶれ、逆に戻せないので、逆行列はありません。
        note: det(AB) は det A × det B。逆行列の行列式は《逆数》。det A = 0 なら逆行列なし。
      - part: 思い出す
        text: det (1 2；3 4) はいくつですか。
        choices: [−2, 2, 5, 10]
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(1 * 4 - 2 * 3)"
        hints:
          - ad − bc を計算しましょう。
          - 1×4 − 2×3 です。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1×4 − 2×3 = −2]
      - part: 今日
        text: det A = 2、det B = 3 のとき、det(AB) はいくつですか。
        choices: [1, 5, 6, 9]
        answer: 6
        check: "2 * 3"
        hints:
          - det(AB) = det A × det B です。
          - 2 × 3 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [2 × 3 = 6]
      - part: 今日
        text: det A = 2 のとき、det(A⁻¹) はいくつですか。
        choices: ["1/2", "2", "4", "−2"]
        answer: "1/2"
        check: "Fraction(1, 2)"
        hints:
          - det(A⁻¹) = 1 / det A です。
          - 1 / 2 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1 / 2 = 1/2]
      - part: 挑戦
        text: 2×2 の A と数 3 について、det(3A) はどれですか。
        choices: ["3 det A", "6 det A", "9 det A", "det A"]
        answer: "9 det A"
        check: "'9 det A'"
        hints:
          - n×n の A を k 倍すると、行列式は kⁿ 倍です。
          - n = 2、k = 3 です。
          - 3² = 9 倍です。
        paths:
          - [kⁿ = 3² = 9, 9 det A]
      - part: わけ
        text: A に逆行列があることと det A ≠ 0 が同値であるわけを説明しましょう。
        explain: 「A に逆行列 B があると、AB = I。行列式をとると det A × det B = det I = 1。よって det A ≠ 0。逆に det A ≠ 0 なら、M-002/M-003 の公式で逆行列を作れる。よって同値。」と書ければよい。① AB = I、② det(AB) = detA detB、③ detI = 1 から detA ≠ 0、逆も示す。子どもには、2×2 の公式で確かめさせます。
        hints:
          - 逆行列 B があると、AB = I です。
          - 行列式をとると、det A × det B = 1 です。
          - det A ≠ 0 でなければ、この式は成り立ちません。
        paths:
          - [AB=I, detA detB = 1, detA ≠ 0, 逆に detA≠0 なら逆行列を作れる, 同値]
