# M-004 行列式
#
# 段 6・水準 3・8 日。前提は M-003（行列の演算と連立一次方程式）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 行列の書き方は M-002、M-003 と同じ：(a b；c d)、(a b c；d e f；g h i)。
# 行列式の性質（入れかえ・定数倍・行の加算・転置・三角行列）、余因子展開、det(AB)、逆行列、クラメルの公式、面積・体積を扱う。

id: M-004
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          行列式 det A は、2×2 では det (a b；c d) = ad − bc。3×3 は余因子展開で求めます。
          行列式は、行を入れかえると符号が変わり、1 つの行を k 倍すると k 倍になり、行の定数倍を別の行にたしても変わりません。
          例：det (1 2；3 4) = 1×4 − 2×3 = −2。
        explain: |-
          【定義】2×2 の行列式は ad − bc。det (1 2；3 4) = 4 − 6 = −2。
          3×3 は、1 行目で余因子展開して 2×2 の行列式 3 つに分けます。
          行列式は「面積や体積の倍率」を表し、0 ならつぶれている、負なら向きが反転している、と読めます。
        note: 行列式は、行列が空間をどれだけ拡大・縮小するかの倍率。2×2 は面積、3×3 は体積の倍率。
      - part: 思い出す
        text: (2 1；1 3) の行列式はいくつですか。
        choices: [3, 4, 5, 6]
        answer: 5
        check: "2 * 3 - 1 * 1"
        hints:
          - 2×2 の行列式は ad − bc です。
          - 2×3 − 1×1 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [2×3 − 1×1 = 5]
      - part: 思い出す
        text: (1 2；1 3) の逆行列はどれですか。
        choices: ["(3 −2；−1 1)", "(3 2；1 1)", "(−3 2；1 −1)", "(1 −2；−1 3)"]
        answer: "(3 −2；−1 1)"
        check: "(lambda a, b, c, d: (lambda det, F: f'({F(d)} {F(-b)}；{F(-c)} {F(a)})')(a * d - b * c, lambda x: f'−{-x}' if x < 0 else f'{x}'))(1, 2, 1, 3)"
        hints:
          - det = 1 です。
          - 成分ごとの計算を、行列の形にまとめましょう。
          - 逆行列は (3 −2；−1 1) です。
        paths:
          - [det=1, (3 −2；−1 1)]
      - part: 今日
        text: det (1 2；3 4) はいくつですか。
        choices: [−2, 2, 5, 10]
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(1 * 4 - 2 * 3)"
        hints:
          - 2×2 の行列式は ad − bc です。
          - 1×4 − 2×3 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [1×4 − 2×3 = −2]
      - part: 今日
        text: det (2 0；0 3) はいくつですか。
        choices: [0, 2, 3, 6]
        answer: 6
        check: "2 * 3 - 0 * 0"
        hints:
          - 対角行列の行列式は、対角の積です。
          - 2 × 3 を計算しましょう。
          - 計算の最後の一歩まで、自分で書いてみましょう。
        paths:
          - [2×3 = 6]
      - part: 挑戦
        text: det (1 2 3；0 1 4；5 6 0) はいくつですか。
        choices: [−1, 0, 1, 2]
        answer: 1
        check: "(lambda a, b, c, d, e, f, g, h, i: a * (e * i - f * h) - b * (d * i - f * g) + c * (d * h - e * g))(1, 2, 3, 0, 1, 4, 5, 6, 0)"
        hints:
