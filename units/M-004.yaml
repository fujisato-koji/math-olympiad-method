          ・三角行列の行列式は、対角の積。
        explain: |-
          行の入れかえは、面積の向きを反転させるので符号が変わります。1 つの行を k 倍すると、面積も k 倍。行の定数倍を別の行にたすのは、平行四辺形を平行にずらすだけで、面積は変わりません。
          転置しても面積は同じ。三角行列は、対角の積が面積の倍率になります。
        note: 行列式は、行基本変形でどれだけ変わるかを覚える。入れかえは符号、定数倍は k 倍、行の加算はそのまま。
