          - [x の列を右辺に置きかえた行列式 det (p b；q d) に p = ax + by、q = cx + dy を入れる, 2 列目の y 倍を引いても行列式は変わらないので x det A, x = det (p b；q d) / det A]
        explain: 「1 番目の式を d 倍し、2 番目の式を b 倍して引くと、(ad−bc)x = pd−bq。これは det A × x = det (p b；q d)。よって x = det (p b；q d)/det A。y は 1 番目を c 倍、2 番目を a 倍して引くと、(bc−ad)y = pc−aq、つまり det A × y = det (a p；c q)。よって y = det (a p；c q)/det A。」と書ければよい。① y を消す、② 行列式で表す、③ x を消して y も同じ。子どもには、数字で確かめさせます。
