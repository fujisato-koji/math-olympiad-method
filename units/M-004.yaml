面積 2</text><text x="78" y="30" font-size="13" text-anchor="middle" fill="currentColor">もとの正方形</text><text x="236" y="30" font-size="13" text-anchor="middle" fill="currentColor">A で移した形</text><text x="160" y="182" font-size="14" text-anchor="middle" fill="currentColor">A = (3 1；1 1)</text><text x="160" y="202" font-size="13" text-anchor="middle" fill="currentColor">赤 (1, 0) → (3, 1)　緑 (0, 1) → (1, 1)</text></svg>'
        explain: |-
          【定義】行列式 det A は、A が面積（3×3 なら体積）を何倍にするかを表す数です。
          ・2×2 の A = (a b；c d) は、(1, 0) を (a, c)、(0, 1) を (b, d) に移します。
          ・だから、1 辺 1 の正方形は、列ベクトル (a, c) と (b, d) が作る平行四辺形に移ります。
          ・この平行四辺形の面積は |ad − bc| です。これが行列式の正体です。
          【例】A = (3 1；1 1) は、(1, 0) を (3, 1)、(0, 1) を (1, 1) に移します。平行四辺形の頂点は (0, 0)、(3, 1)、(4, 2)、(1, 1) で、面積は |3×1 − 1×1| = 2 です。
          【符号】列を入れかえた (1 3；1 1) では 1×1 − 3×1 = −2。面積は同じ 2 で、1 列目から 2 列目へ回る向きが右回り（反対）になります。2 本の列が一直線に並ぶと、ad − bc = 0 で面積 0（つぶれ）、逆行列はありません。
          【まとめ】2×2 の行列式は ad − bc。面積の倍率で、符号は向き、0 はつぶれを表します。
        note: 2×2 の行列式は ad−bc。面積の倍率。正なら向きそのまま、負なら反転、0 ならつぶれ。
