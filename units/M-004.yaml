oke-linecap="round" stroke-opacity="0.7"/><line x1="159.5" y1="35" x2="159.5" y2="111" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/><path d="M119 30 Q111 73 119 116" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M200 30 Q208 73 200 116" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="160" y="22" font-size="13" text-anchor="middle" fill="currentColor">2 の項</text><text x="160" y="134" font-size="13" text-anchor="middle" fill="currentColor">det (0 4；5 0)</text><text x="160" y="152" font-size="13" text-anchor="middle" fill="currentColor">− 2 × (−20)</text><rect x="228.7" y="36" width="75" height="22" rx="4" fill="#c8ccd6" fill-opacity="0.7"/><rect x="280.7" y="33" width="21" height="80" rx="4" fill="#c8ccd6" fill-opacity="0.7"/><circle cx="241.2" cy="73" r="11.5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.2"/><circle cx="266.2" cy="73" r="11.5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.2"/><circle cx="241.2" cy="99" r="11.5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.2"/><circle cx="266.2" cy="99" r="11.5" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.2"/><circle cx="291.2" cy="47" r="11.5" fill="#f08080" fill-opacity="0.55" stroke="currentColor" stroke-width="1.2"/><text x="241.2" y="52.4" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="266.2" y="52.4" font-size="15" text-anchor="middle" fill="currentColor">2</text><text x="291.2" y="52.4" font-size="15" text-anchor="middle" fill="currentColor">3</text><text x="241.2" y="78.4" font-size="15" text-anchor="middle" fill="currentColor">0</text><text x="266.2" y="78.4" font-size="15" text-anchor="middle" fill="currentColor">1</text><text x="291.2" y="78.4" font-size="15" text-anchor="middle" fill="currentColor">4</text><text x="241.2" y="104.4" font-size="15" text-anchor="middle" fill="currentColor">5</text><text x="266.2" y="104.4" font-size="15" text-anchor="middle" fill="currentColor">6</text><text x="291.2" y="104.4" font-size="15" text-anchor="middle" fill="currentColor">0</text><line x1="230.7" y1="47" x2="301.7" y2="47" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/><line x1="291.2" y1="35" x2="291.2" y2="111" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/><path d="M225.7 30 Q217.7 73 225.7 116" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M306.7 30 Q314.7 73 306.7 116" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="266.7" y="22" font-size="13" text-anchor="middle" fill="currentColor">3 の項</text><text x="266.7" y="134" font-size="13" text-anchor="middle" fill="currentColor">det (0 1；5 6)</text><text x="266.7" y="152" font-size="13" text-anchor="middle" fill="currentColor">+ 3 × (−5)</text><text x="160" y="194" font-size="13" text-anchor="middle" fill="currentColor">赤の行と列を消す → 残る 4 つ（青）の行列式</text></svg>'
        explain: |-
          余因子展開は、3×3 の行列式を 2×2 の行列式 3 つに分ける方法です。
          ① 1 行目の a について、1 行目と 1 列目を消すと (e f；h i)。det = ei − fh。a をかけて +。
          ② b について、1 行目と 2 列目を消すと (d f；g i)。det = di − fg。b をかけて −。
          ③ c について、1 行目と 3 列目を消すと (d e；g h)。det = dh − eg。c をかけて +。
          3 つを足すと、a(ei − fh) − b(di − fg) + c(dh − eg) です。
          例：det (1 2 3；0 1 4；5 6 0) で、
          ① a=1：(1 4；6 0) の det = −24 → 1×(−24) = −24。
          ② b=2：(0 4；5 0) の det = −20 → −2×(−20) = +40。
          ③ c=3：(0 1；5 6) の det = −5 → 3×(−5) = −15。
          合計：−24 + 40 − 15 = 1。
          1 行目だけでなく、どの行・列でも展開できます。符号は (+ − +；− + −；+ − +) のもようで、場所で決まります。0 が多い行や列を選ぶと、0 の項が消えて楽です。
          ｜項｜使う小行列式｜符号｜
          ｜a(ei − fh)｜(e f；h i)｜+｜
          ｜b(di − fg)｜(d f；g i)｜−｜
          ｜c(dh − eg)｜(d e；g h)｜+｜
        note: 余因子展開は、1 行目（または 0 が多い行・列）で、小行列式に + − + の符号をつけて足す。
