      - part: 見本
        id: "6c1cdb43cb"
        text: |-
          行列 A = (a b；c d) は、点 (1, 0) を (a, c) に、点 (0, 1) を (b, d) に移します。
          だから、1 辺 1 の正方形（面積 1）は、2 本の列 (a, c) と (b, d) が作る平行四辺形に移ります。
          この平行四辺形の面積は |ad − bc| です。ad − bc を A の行列式といい、det A と書きます。
          符号は向きを表します。1 列目から 2 列目へ左回りなら +、右回りなら − です。3×3 の行列式は体積の倍率です（3 日目）。
          例（図）：A = (3 1；1 1) では、det A = 3×1 − 1×1 = 2。面積 1 の正方形が、面積 2 の平行四辺形になります。
