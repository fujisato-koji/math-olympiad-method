        text: |-
          行列式の性質（行で見ます。行の矢印 (a, b) と (c, d) が作る平行四辺形の面積も |ad − bc| です）：
          ・行を入れかえると、回る向きが反対になり、符号が変わる。
          ・1 つの行を k 倍すると、行列式は k 倍になる。
          ・1 つの行の何倍かを別の行にたしても、行列式は変わらない（形がずれるだけ）。
          ・転置しても、行列式は変わらない。
          ・《三角行列》（対角より下がすべて 0）の行列式は、対角の積。
