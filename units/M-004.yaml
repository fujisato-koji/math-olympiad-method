        svg: '<svg viewBox="0 0 320 112" xmlns="http://www.w3.org/2000/svg"><line x1="78" y1="39" x2="116" y2="73" stroke="#f08080" stroke-width="20" stroke-linecap="round" stroke-opacity=".55"/><line x1="116" y1="39" x2="78" y2="73" stroke="#7fc8f8" stroke-width="20" stroke-linecap="round" stroke-opacity=".55"/><text x="78" y="45.5" font-size="18" text-anchor="middle" fill="currentColor">3</text><text x="116" y="45.5" font-size="18" text-anchor="middle" fill="currentColor">0</text><text x="78" y="79.5" font-size="18" text-anchor="middle" fill="currentColor">0</text><text x="116" y="79.5" font-size="18" text-anchor="middle" fill="currentColor">4</text><path d="M56 18 Q48 56 56 94" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M138 18 Q146 56 138 94" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="12" y="62" font-size="16" fill="currentColor">det</text><rect x="161" y="28" width="24" height="14" rx="4" fill="#f08080" fill-opacity="0.6"/><text x="191" y="40" font-size="13" fill="currentColor">の 2 つをかける</text><rect x="161" y="54" width="24" height="14" rx="4" fill="#7fc8f8" fill-opacity="0.6"/><text x="191" y="66" font-size="13" fill="currentColor">の 2 つをかける</text><text x="161" y="96" font-size="14" fill="currentColor">赤の積 − 青の積</text></svg>'
      - 長方形の たて × よこ とくらべましょう。
    paths:
      - [det = 3×4 = 12, 面積は |12| = 12]
      - [長方形のよこ 3、たて 4, 3 × 4 = 12]
    note: 2×2 の行列式の絶対値は、2 つの列ベクトルが作る平行四辺形の面積。
