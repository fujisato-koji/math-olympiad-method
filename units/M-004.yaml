        text: |-
          3×3 の行列式は、3 本の列が作る平行六面体の体積の倍率です。
          計算は余因子展開を使います。1 行目の成分ごとに、その行と列を消して残る 2×2 の行列式（小行列式）を求め、+、−、+ の符号を付けて足します（図）。
          det (a b c；d e f；g h i) = a(ei − fh) − b(di − fg) + c(dh − eg)。
          ほかの行や列でも展開できます。符号は場所で決まり、(+ − +；− + −；+ − +) のもようです。0 が多い行や列を選ぶと楽です。
          例（図）：det (1 2 3；0 1 4；5 6 0) = 1×(0 − 24) − 2×(0 − 20) + 3×(0 − 5) = 1。
