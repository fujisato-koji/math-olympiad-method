        explain: |-
          クラメルの公式は、連立方程式を「行列式の比」で解く方法です。x の列を右辺に置きかえた行列式を、もとの det A でわります。
          2×2 の例：2x + y = 4、x + 3y = 7。det A = 2×3 − 1×1 = 5、x = det (4 1；7 3) / 5 = (12 − 7) / 5 = 1、y = det (2 4；1 7) / 5 = (14 − 4) / 5 = 2。
          面積：列ベクトル (3, 1)、(1, 1) が作る平行四辺形の面積は |3×1 − 1×1| = 2（1 日目の図）。行列式の大きさ（絶対値）が面積です。
        note: クラメルの公式は det A ≠ 0 のときだけ使える。面積・体積は行列式の絶対値。
