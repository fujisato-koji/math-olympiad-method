# M-004 行列式
#
# 段 6・水準 3・8 日。前提は M-003（行列の演算と連立一次方程式）。
# 施主の方針（2026-11-10）：答えを先に用意せず、関連する単元とヒントから子が自分で導く。
#   子の画面には answer を出さない（保護者の表示だけ）。ヒントは答えを言わない（R-14）。
#   見本の explain は例として子の画面に出る（答えを書いてよい）。わけの explain は保護者の表示にだけ出る。
# 行列の書き方は M-002、M-003 と同じ：(a b；c d)、(a b c；d e f；g h i)。
# 行列式の性質（入れかえ・定数倍・行の加算・転置・三角行列）、余因子展開、det(AB)、逆行列、クラメルの公式、面積・体積を扱う。
# ことば：行列式 det A、符号、余因子展開とその項、小行列式、三角行列、クラメルの公式、平行六面体。
# 図とイラストの多い形に直した（D-131、直す係 3）。見本に、正方形が平行四辺形に移る図、3 つの性質の図、余因子展開で消す行と列、
#   面積の倍率の流れ、列を右辺に置きかえる図、流れ図を付けた。答える問題に、2 本の列が作る平行四辺形、直方体、平行六面体、
#   面積の倍率の流れ、行列の図を付け、ヒントの 1〜2 段に、たすきがけ、消す行と列、符号のもよう、外の長方形から引く図を付けた（答えの数は図に書かない）。
#   同じ問題のくり返し（D-191）7 問と、答えが 2 つに読めた 3 日目の展開の問い、1 日目と同じ数だった 5 日目の予備を、新しい問題にした（id を消した）。

