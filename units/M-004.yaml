  - day: 7
    items:
      - part: 見本
        id: "8ad5dc1f26"
        text: |-
          行列式・逆行列・連立方程式は、1 つの問題で組み合わせられます（図）。
          ・det A ≠ 0 なら逆行列があり、A x = b は x = A⁻¹ b と解ける。クラメルの公式でも、同じ解が行列式の比で出る。
          ・det A = 0 なら逆行列はなく、解は「なし」か「無数」。
          例：A = (3 2；1 1) は det A = 3×1 − 2×1 = 1。A⁻¹ = (1 −2；−1 3)。A x = (8；3) の解は x = A⁻¹(8；3) = (2；1)。
        svg: '<svg viewBox="0 0 320 196" xmlns="http://www.w3.org/2000/svg"><rect x="105" y="8" width="110" height="30" rx="10" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/><text x="160" y="28" font-size="15" text-anchor="middle" font-style="italic" fill="currentColor">A x = b</text><line x1="160" y1="40" x2="160" y2="55" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="160,62 156,54 164,54" fill="currentColor"/><rect x="95" y="64" width="130" height="30" rx="10" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/><text x="160" y="84" font-size="14" text-anchor="middle" fill="currentColor">det A を求める</text><line x1="130" y1="96" x2="86.1" y2="120.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="80,124 85,116.6 88.9,123.6" fill="currentColor"/><line x1="190" y1="96" x2="233.9" y2="120.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="240,124 231.1,123.6 235,116.6" fill="currentColor"/><text x="92" y="108" font-size="14" text-anchor="end" fill="currentColor">≠ 0</text><text x="228" y="108" font-size="14" fill="currentColor">= 0</text><rect x="8" y="126" width="150" height="62" rx="10" fill="#7bc96f" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/><text x="83" y="146" font-size="13" text-anchor="middle" fill="currentColor">逆行列 A⁻¹ がある</text><text x="83" y="164" font-size="14" text-anchor="middle" font-style="italic" fill="currentColor">x = A⁻¹ b</text><text x="83" y="181" font-size="12" text-anchor="middle" fill="currentColor">（クラメルでも同じ）</text><rect x="170" y="126" width="142" height="62" rx="10" fill="#f08080" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="241" y="150" font-size="13" text-anchor="middle" fill="currentColor">逆行列はない</text><text x="241" y="172" font-size="13" text-anchor="middle" fill="currentColor">解は「なし」か「無数」</text></svg>'
        explain: |-
          A = (3 2；1 1) の det は 3×1 − 2×1 = 1。逆行列は (1 −2；−1 3)。
          (3 2；1 1)(x；y) = (8；3) は、x = 1×8 + (−2)×3 = 2、y = (−1)×8 + 3×3 = 1。
          クラメルでも、x = det (8 2；3 1)/1 = 8 − 6 = 2、y = det (3 8；1 3)/1 = 9 − 8 = 1 で同じです。
        note: det A = 0 のときは逆行列がない。連立方程式は「解なし」か「無数」になる。
