  - day: 3
    items:
      - part: 見本
        text: |-
          余因子展開：3×3 の行列式は、1 行目だけでなく、どの行・列でも展開できます。
          det (a b c；d e f；g h i) = a(ei − fh) − b(di − fg) + c(dh − eg)。
          0 が多い行や列を選ぶと、計算が楽です。
          例：det (1 2 3；0 1 4；5 6 0) = 1(0−24) − 2(0−20) + 3(0−5) = 1。
        explain: |-
          余因子展開は、選んだ行の各成分に、その行と列を除いた 2×2 の行列式をかけ、符号 +、−、+ で足します。
          1 行目で展開すると、a、b、c の順に +、−、+。0 が多い行を選ぶと、0 の項が消えて楽になります。
        note: 余因子展開は、どの行・列でもできる。0 が多い行・列を選ぶ。
