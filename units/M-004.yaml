          - 2 つを引くと、y の項が消えます。
          - 残った式の x の係数と右辺を、それぞれ 2×2 の行列式で表しましょう。
        paths:
          - [d 倍と b 倍, 引いて y を消す, (ad−bc)x = pd−bq, x = det(p b；q d)/det A]
          - [det (p b；q d) の p、q に ax + by、cx + dy を入れる, 1 列目の by、dy の部分は 2 列目の y 倍なので、行列式は変わらない, det (p b；q d) = x det A]
        explain: 「a x + b y = p の両辺を d 倍し、c x + d y = q の両辺を b 倍して引くと、(ad − bc)x = pd − bq。左辺の係数は det A、右辺は det (p b；q d)。よって x = det (p b；q d) / det A。y も同じように x を消して求める。」と書ければよい。① d 倍と b 倍、② 引いて y を消す、③ 行列式で表す。子どもには、具体的な係数で確かめさせます。
  - day: 6
    items:
      - part: わけ
        id: "f2ed645763"
        text: 2×2 の A = (a b；c d)、B = (e f；g h) について、det(AB) = det A × det B が成り立つわけを、成分を計算して説明しましょう。
        hints:
          - AB の成分を、a、b、c、d、e、f、g、h で書きましょう。
          - det(AB) を展開すると、acef や afce のように消える項が出ます。
          - 残りを (ad−bc)(eh−fg) にまとめましょう。
        paths:
          - [AB の成分, det(AB) を展開, 消える項をまとめる, (ad−bc)(eh−fg) = det A det B]
          - [面積の倍率で見る, B で det B 倍、A でさらに det A 倍, det(AB) = det A × det B]
        explain: 「AB = (ae+bg af+bh；ce+dg cf+dh)。det(AB) = (ae+bg)(cf+dh) − (af+bh)(ce+dg)。展開すると acef + aedh + bgcf + bgdh − afce − afdg − bhce − bhdg。消える項をまとめると ad(eh−fg) − bc(eh−fg) = (ad−bc)(eh−fg) = det A × det B。」と書ければよい。① 積の成分、② 行列式を展開、③ (ad−bc)(eh−fg) にまとめる。子どもには、数字の行列で確かめさせます。
