  - day: 5
    items:
      - part: 見本
        id: "c81477c55b"
        text: |-
          クラメルの公式：a x + b y = p、c x + d y = q は、det A = ad − bc ≠ 0 のとき
          x = det (p b；q d) / det A、y = det (a p；c q) / det A と解けます。
          x を求めるときは、A の 1 列目（x の係数、赤）を右辺 (p；q)（青）に置きかえます。y は 2 列目（緑）を置きかえます（図）。3×3 も同じです。
          面積と体積：2×2 の行列式の大きさ（符号を取った値）は、2 本の列が作る平行四辺形の面積。3×3 は、3 本の列が作る平行六面体の体積です。
          例（図）：2x + y = 4、x + 3y = 7 では、det A = 2×3 − 1×1 = 5、x = 5 / 5 = 1、y = 10 / 5 = 2。
