      - part: 見本
        id: "101295ede6"
        text: |-
          積の行列式：det(AB) = det A × det B（AB は、B で移してから A で移す。面積の倍率がかけ合わさる。図）。
          逆行列：det(A⁻¹) = 1 / det A（det A ≠ 0 のとき。A⁻¹ はもとにもどす）。
          転置：det(Aᵀ) = det A。
          定数倍：n×n の A と数 k について、det(kA) = kⁿ det A。
          A に逆行列があることと、det A ≠ 0 は同値です。
        svg: '<svg viewBox="0 0 320 122" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="78" width="18" height="18" fill="#7fc8f8" fill-opacity="0.55" stroke="currentColor" stroke-width="1.6"/><text x="21" y="114" font-size="13" text-anchor="middle" fill="currentColor">面積 1</text><line x1="38" y1="87" x2="109" y2="87" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="118,87 108,92 108,82" fill="currentColor"/><text x="78" y="62" font-size="15" text-anchor="middle" font-style="italic" fill="currentColor">B</text><text x="78" y="79" font-size="13" text-anchor="middle" fill="currentColor">det B = 3</text><rect x="126" y="42" width="18" height="54" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1.6"/><line x1="126" y1="60" x2="144" y2="60" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/><line x1="126" y1="78" x2="144" y2="78" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/><text x="135" y="114" font-size="13" text-anchor="middle" fill="currentColor">面積 3</text><line x1="152" y1="87" x2="223" y2="87" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="232,87 222,92 222,82" fill="currentColor"/><text x="192" y="62" font-size="15" text-anchor="middle" font-style="italic" fill="currentColor">A</text><text x="192" y="79" font-size="13" text-anchor="middle" fill="currentColor">det A = 4</text><rect x="240" y="42" width="72" height="54" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="1.6"/><line x1="258" y1="42" x2="258" y2="96" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/><line x1="276" y1="42" x2="276" y2="96" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/><line x1="294" y1="42" x2="294" y2="96" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/><line x1="240" y1="60" x2="312" y2="60" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/><line x1="240" y1="78" x2="312" y2="78" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.5"/><text x="276" y="114" font-size="13" text-anchor="middle" fill="currentColor">面積 12</text><text x="160" y="16" font-size="13" text-anchor="middle" fill="currentColor">AB：B で 3 倍、続けて A で 4 倍 → 3 × 4 = 12 倍</text></svg>'
        explain: |-
          det(AB) = det A det B は、(AB)x = A(Bx) なので、B で移してから A で移すと、面積の倍率がかけ合わさることからわかります。
          逆行列はもとにもどすので、面積の倍率も打ち消して det(A⁻¹) = 1/det A。転置しても面積は同じ。kA は n 本の列をどれも k 倍するので、n 次元では kⁿ 倍。
          det A = 0 なら面積が 0 につぶれ、もとにもどせないので、逆行列はありません。
        note: det(AB) は det A × det B。逆行列の行列式は《逆数》。det A = 0 なら逆行列なし。
