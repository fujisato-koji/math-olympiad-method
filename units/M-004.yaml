        text: 2×2 の行列式 det (a b；c d) = ad − bc が、面積の倍率になるわけを説明しましょう。
        explain: 「ベクトル (a, c) と (b, d) が作る平行四辺形の面積は |ad − bc|。行列式は、その符号付きの面積。ad − bc が正なら向きが同じ、負なら向きが反転、0 なら 2 つのベクトルが一直線で面積が 0。」と書ければよい。① 2 つの列ベクトル、② 平行四辺形の面積、③ 符号と 0 の意味。子どもには、具体例で面積を確かめさせます。
        hints:
          - 行列の 2 つの列をベクトルとみましょう。
          - 2 つのベクトルが作る平行四辺形の面積は |ad − bc| です。
          - 符号は向き、0 はつぶれていることを表します。
        paths:
          - [列ベクトル (a,c)、(b,d), 面積 |ad−bc|, 符号は向き、0 はつぶれ]

