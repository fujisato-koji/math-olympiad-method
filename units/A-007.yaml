# A-007 速さ、仕事、濃度を比例で解く
#
# 書き方は N-001 の頭の注のとおり。
# 地図に plan がないので、既定の並び（導入、練習 4 日、わけ、混ぜる、確認）で作った。
#   1 日目：速さ（1 時間・1 分あたりに進む道のり）。道のりは時間に比例し、決まった数が速さ。
#   2 日目：単位をそろえる（時速・分速・秒速、km と m、時間と分）。
#   3 日目：同じ道のりなら時間は速さに反比例する、出会いと追いつき（1 分に近づく道のりは速さの和と差）。
#   4 日目：仕事（1 時間あたりの仕事、全体の仕事をわり切れる数にする、人数と日数の反比例）。
#   5 日目：濃度（食塩の重さは食塩水の重さに比例し、決まった数が濃度）。6 日目：わけ。7 日目：A-006、G-046、N-059 と混ぜる。8 日目：確認。
# 前提は A-006（→ A-005）、G-046（長さ・重さ・かさの単位）、N-059（時刻と時間）。
#   1 km = 1000 m、1 kg = 1000 g、1 時間 = 60 分、1 分 = 60 秒 は G-046 と N-059 で学んだものとして使う（ヒントでも思い出させる）。
#   文字（A-010）は前提にないので、ことばの式（道のり ＝ 速さ × 時間）で表す。
# A-005、A-006 と同じく、小数のかけ算とわり算と N-015 は前提にないので、計算は九九と、何十・何百の計算でできる数にした。
#   数は数千まで（A-005 と同じ）。万の位（N-073）は前提にないので、時速を m にするときは「10 分で何 m」と比例で考える。
# 仕事は「全体の仕事を、かかる時間のどれでもわり切れる数（公倍数、N-018）にする」を本線にした（通分と同じ考え、N-019）。
#   「全体を 1 とする」道は、分数のわり算が前提にないので別の道にだけ書いた。
# 旅人算は出会いと追いつきの基本だけにし、通過算と流水算は扱わない（方程式の後で、同じ考えで解ける）。
# 濃度は計算だけで、食塩水を作る実験はしない。濃度の答えは「何 %」の数だけを打つ。
# 時刻を答える問題は choices にし、check は分にそろえて divmod(…, 60) で時と分にもどす。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-015、N-073 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: A-007
days:
  - day: 1
    items:
      - part: 見本
        text: 車が 2 時間で 80 km 進みました。いつも同じ速さで進むとき、この車の速さはどう表すかな。
        explain: 同じ速さで進むとき、進む道のりは時間に比例します。決まった数は、1 時間あたりに進む道のりで、これを速さといいます。80 ÷ 2 = 40 なので、1 時間に 40 km 進みます。これを時速 40 km と書きます。1 分あたりなら分速、1 秒あたりなら秒速です。ことばの式で、速さ ＝ 道のり ÷ 時間、道のり ＝ 速さ × 時間、時間 ＝ 道のり ÷ 速さ です。
      - part: 思い出す
        text: 水の深さは時間に比例します。4 分で 12 cm になりました。20 分では何 cm になりますか。
        answer: 60
        check: "12 * (20 // 4)"
        hints:
          - 4 分から 20 分へ、時間は何倍になったかな。
          - 比例しているので、深さも同じだけ倍になるよ。
          - 12 cm に、その数をかけよう。
        paths:
          - [4 分 → 20 分で 5 倍, 12 cm の 5 倍, 60 cm]
      - part: 思い出す
        text: 36 このあめを同じ数ずつ分けます。4 人で分けると 1 人 9 こです。12 人で分けると、1 人何こですか。
        answer: 3
        check: "36 // 12"
        hints:
          - 人数は、4 人から 12 人へ何倍になったかな。
          - 1 人分は人数に反比例するね。
          - 9 こを、その数でわろう。
        paths:
          - [4 人 → 12 人で 3 倍, 1 人分は 9 この 1/3, 3 こ]
      - part: 今日
        text: 3 時間で 150 km 進む車があります。この車の速さは時速何 km ですか。
        answer: 50
        check: "150 // 3"
        hints:
          - 時速は、1 時間あたりに進む道のりだよ。
          - 速さ ＝ 道のり ÷ 時間 だね。
          - 15 ÷ 3 を考えて、10 倍しよう。
        paths:
          - [150 ÷ 3 = 50, 時速 50 km]
      - part: 今日
        text: 時速 60 km で 4 時間進むと、何 km 進みますか。
        answer: 240
        check: "60 * 4"
        hints:
          - 1 時間に 60 km 進むね。
          - 4 時間では、60 km が何つ分かな。
          - 道のり ＝ 速さ × 時間 だよ。
        paths:
          - [60 × 4 = 240, 240 km]
      - part: 今日
        text: 時速 40 km の車で 280 km 進むと、何時間かかりますか。
        answer: 7
        check: "280 // 40"
        hints:
          - 1 時間に 40 km 進むね。
          - 280 km は、40 km の何つ分かな。
          - 時間 ＝ 道のり ÷ 速さ だよ。
        paths:
          - [280 ÷ 40 = 7, 7 時間]
        note: 280 × 40 のように、かけ算にしやすい。何を何でわるのかを、1 時間あたりの道のりから考えさせる。
      - part: 挑戦
        text: 兄は 5 分で 400 m、弟は 6 分で 420 m 歩きます。速いのはどちらですか。
        choices: [兄, 弟, 同じ]
        answer: 兄
        check: "'兄' if Fraction(400, 5) > Fraction(420, 6) else ('弟' if Fraction(400, 5) < Fraction(420, 6) else '同じ')"
        hints:
          - 時間も道のりもちがうので、そのままでは比べにくいね。
          - 1 分あたりに歩く道のり（分速）をそれぞれ求めよう。
          - 分速が大きいほうが速いよ。
        paths:
          - [兄は 400 ÷ 5 = 分速 80 m, 弟は 420 ÷ 6 = 分速 70 m, 兄が速い]
        note: 道のりの長い弟を速いと考えやすい。1 分あたりにそろえて比べる。
    extra:
