# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [総動員, 数]
    uses: [G-009]
    text: 時計の長い針は 1 時間で 1 回転し、短い針は 12 時間で 1 回転します。3 時ちょうどから、2 本の針が初めて重なるのは何分後ですか。《分数》で答えましょう。
    answer: 180/11
    check: "Fraction(90) / (Fraction(360, 60) - Fraction(360, 12 * 60))"
    hints:
      - 長い針と短い針は、1 分に何度ずつ進むかな。
      - 3 時ちょうどのとき、2 本の針の間は何度あいているかな。
      - 長い針は短い針に、1 分に何度ずつ追いつくかな。追いつきの考えを使おう。
    paths:
      - [長い針は 1 分に 6 度、短い針は 1 分に 0.5 度, 3 時の 2 本の針の間は 90 度, 1 分に 5.5 度ずつ追いつく, 90 ÷ 5.5 = 180/11 分後]
    note: 時計の針の角度（G-009）を速さとみて、旅人算の追いつきで解く。短い針が 1 分に 0.5 度進むことを見落として 15 分後と答えやすい。答えは 16 と 4/11 分のようなきりの悪い数になるので、分数のままわり算をさせる。
  - part: 離
    kinds: [道筋]
    text: 濃度 8 % の食塩水が 300 g あります。これに食塩を何 g か加えてよくとかしたら、濃度が 20 % になりました。加えた食塩は何 g ですか。
    answer: 45
    check: "300 * (100 - 8) // (100 - 20) - 300"
    hints:
      - 食塩を加えても、変わらないものは何かな。
      - はじめの食塩水の中の水は何 g かな。
      - 濃度 20 % のとき、水は食塩水全体の何 % かな。
    paths:
      - [はじめの食塩は 24 g、水は 276 g, 食塩を加えても水は 276 g のまま, 濃度 20 % のとき水は全体の 80 % なので 全体は 276 ÷ 0.8 = 345 g, 加えた食塩は 345 − 300 = 45 g]
    note: 食塩を加えると食塩も全体も変わるので、変わらない水の重さに目をつけるのが道筋。「12 % ふえたので 300 g の 12 % で 36 g」とする間ちがいが多い。答えを出したら、345 g の 20 % が 24 + 45 = 69 g になるかで確かめさせる。
  - part: 離
    kinds: [読み取り, 手数]
    text: ある仕事を、A さん 1 人ですると 9 日、B さん 1 人ですると 18 日かかります。この仕事を 2 人でいっしょに始めましたが、とちゅうで A さんが何日か休んだので、始めてから終わるまでに 8 日かかりました。B さんは 1 日も休みませんでした。A さんが休んだのは何日ですか。
    answer: 3
    check: "8 - (18 - 18 // 18 * 8) // (18 // 9)"
    hints:
      - 仕事全体を、9 と 18 のどちらでもわり切れる数にしよう。
      - B さんは 8 日間ずっと働いたね。B さんがした仕事はいくつかな。
      - 残りの仕事を A さんがしたよ。A さんは何日働いたかな。
    paths:
      - [仕事全体を 18 とする, 1 日に A さんは 2、B さんは 1 の仕事をする, B さんは 8 日で 8, 残り 10 を A さんが 5 日でした, 休んだのは 8 − 5 = 3 日]
    note: 「休んだ」日数を直接求めるのではなく、休まなかった B さんの仕事から先に決めるのが手がかり。A さんが働いた日数 5 を答えにしてしまう間ちがいに注意。
