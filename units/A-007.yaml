  - day: 2
    items:
      - part: 見本
        text: 時速 3 km で歩く人がいます。この人の速さは、分速何 m かな。
        explain: まず単位をそろえます。3 km は 3000 m、1 時間は 60 分です。1 時間（60 分）に 3000 m 進むので、1 分あたりは 3000 ÷ 60 = 50 m、分速 50 m です。逆に、分速 50 m で 60 分歩くと 50 × 60 = 3000 m = 3 km なので、時速 3 km にもどります。時速 ＝ 分速 × 60、分速 ＝ 秒速 × 60 です。
      - part: 思い出す
        text: 5 時間で 300 km 進む車があります。この車の速さは時速何 km ですか。
        answer: 60
        check: "300 // 5"
        hints:
          - 時速は、1 時間あたりに進む道のりだよ。
          - 速さ ＝ 道のり ÷ 時間 だね。
          - 30 ÷ 5 を考えて、10 倍しよう。
        paths:
          - [300 ÷ 5 = 60, 時速 60 km]
      - part: 思い出す
        text: 2 時間 15 分は、何分ですか。
        answer: 135
        check: "2 * 60 + 15"
        hints:
          - 1 時間は何分だったかな。
          - 2 時間は何分かな。
          - 2 時間の分に、15 分を足そう。
        paths:
          - [2 時間は 60 + 60 = 120 分, 120 + 15 = 135 分]
      - part: 今日
        text: 分速 50 m は、時速何 km ですか。
        answer: 3
        check: "50 * 60 // 1000"
        hints:
          - 1 時間は何分かな。
          - 1 時間に何 m 進むかを求めよう。
          - 1000 m が 1 km だね。
        paths:
          - [1 時間は 60 分, 50 × 60 = 3000 m, 3000 m = 3 km で時速 3 km]
      - part: 今日
        text: 時速 6 km は、分速何 m ですか。
        answer: 100
        check: "6 * 1000 // 60"
        hints:
          - 6 km は何 m かな。
          - 1 時間は何分かな。
          - 60 分で進む道のりを、60 でわろう。
        paths:
          - [6 km = 6000 m, 6000 ÷ 60 = 100, 分速 100 m]
          - [10 分では 6000 m の 1/6 で 1000 m, 1 分では 100 m]
      - part: 今日
        text: 秒速 5 m は、分速何 m ですか。
        answer: 300
        check: "5 * 60"
        hints:
          - 1 分は何秒かな。
          - 1 秒に 5 m 進むね。
          - 60 秒では、5 m が何つ分かな。
        paths:
          - [1 分は 60 秒, 5 × 60 = 300, 分速 300 m]
        note: 60 でわって 1/12 としやすい。分速のほうが秒速より大きい数になることを、1 分のほうが長いことから確かめさせる。
      - part: 挑戦
        text: 家から駅まで 1 km 200 m あります。分速 60 m で歩くと、何分かかりますか。
        answer: 20
        check: "(1000 + 200) // 60"
        hints:
          - 1 km 200 m は、何 m かな。
          - 1 分に 60 m 歩くね。
          - 時間 ＝ 道のり ÷ 速さ だよ。
        paths:
          - [1 km 200 m = 1200 m, 1200 ÷ 60 = 20, 20 分]
        note: 1 km 200 m を 1200 m に直さず、200 ÷ 60 などとしやすい。単位をそろえてから計算する。
    extra:
