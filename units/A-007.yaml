        note: 速さの和の 160 m でわりやすい。向かい合うときは和、追いかけるときは差。
      - part: 挑戦
        text: 家から公園まで、兄は 12 分、弟は 18 分かかります。兄と弟の速さの比は、どれですか。
        choices: ["3:2", "2:3", "6:5"]
        answer: "3:2"
