        choices: [3 時間で 120 km の車, 4 時間で 200 km の車, 同じ]
        answer: 4 時間で 200 km の車
        check: "'3 時間で 120 km の車' if Fraction(120, 3) > Fraction(200, 4) else ('4 時間で 200 km の車' if Fraction(120, 3) < Fraction(200, 4) else '同じ')"
        hints:
          - 1 時間あたりに走る道のりにそろえよう。
          - それぞれの時速を求めよう。
          - 時速が大きいほうが速いよ。
