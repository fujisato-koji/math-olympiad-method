        text: 600 m の道を、分速 60 m で歩くと 10 分、分速 120 m で走ると 5 分かかります。速さと時間には、どんな関係があるかな。
        explain: 道のりが同じとき、速さが 2 倍になると時間は 1/2 になります。時間は速さに反比例し、速さ × 時間 はいつも道のりの 600 m です。また、2 人が向かい合って同時に進むと、1 分ごとに 2 人の速さの和だけ近づきます。同じ向きに進んで後ろから追いかけると、1 分ごとに速さの差だけ近づきます。
      - part: 思い出す
        text: 秒速 6 m は、分速何 m ですか。
        answer: 360
        check: "6 * 60"
        hints:
          - 1 分は何秒かな。
          - 1 秒に 6 m 進むね。
          - 60 秒では、6 m が何つ分かな。
        paths:
          - [6 × 60 = 360, 分速 360 m]
      - part: 思い出す
        text: 時速 50 km で 3 時間進むと、何 km 進みますか。
        answer: 150
        check: "50 * 3"
        hints:
