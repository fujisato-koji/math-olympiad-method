        explain: 形を変えずに、どの辺の長さも同じ倍にのばした図を拡大図、ちぢめた図を縮図といいます。あ の横の辺は 3 目、たての辺は 2 目。い では 6 目と 4 目で、どちらも 2 倍です。ななめの辺も 2 倍になっています。い は あ の 2 倍の拡大図、あ は い の 1/2 の縮図です。拡大図や縮図では、かどの開きぐあい（角）は変わりません。重なる位置にある頂点や辺を、対応する頂点、対応する辺といいます。
