# G-013 拡大と縮小（相似の入口）
#
# 書き方は N-001 の頭の注のとおり。
# 拡大図は「形を変えずに、どの辺の長さも同じ倍にのばした図」、縮図は「同じ倍にちぢめた図」。○ 倍の拡大図、□ 分の 1 の縮図と言う。
# ことば：拡大図、縮図、対応する頂点・辺、縮尺（1/100、1:100）、O を中心にした拡大図。相似という言葉は G-020 で使う。
# 角の大きさ（度）の G-009 は前提にないので、角は「かどの開きぐあいは変わらない」と言うだけにし、角度の計算はしない。
# 長さの単位は cm のまま扱う。G-046（長さの単位）が前提にないので、縮尺の答えを m に直すことはしない。
#   N-073（万の位）も前提にないので、実際の長さは 1000 cm まで（縮尺は 1/50〜1/500）。
# 前提の計算は A-005 まで（N-074 のかけ算の筆算、N-077 の小数のかけ算とわり算を含む）。何倍かは整数・小数・分数で答える。
#   「何倍」の答えが小数になる問題は、分数も正しいとして accept に入れた。「分数で答えましょう」の問題には入れない。
# 拡大図の面積は 5 日目（2 倍の拡大図は 4 倍）。立体の体積の倍（8 倍）は、G-011 が前提にないので扱わない。
# 相似の条件と証明は G-020 で扱う。3 日目の「DE と BC が平行なら 三角形 ADE は 三角形 ABC の縮図」は、ここでは文で約束して使う。
# 図は svg（D-040）。方眼の図の 1 目は 1 cm。長さの比はおおよそ合わせた。
# 地図に plan がないので既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 拡大図と縮図（方眼で、どの辺も同じ倍）　2 日目 対応する辺と何倍か、辺の長さを求める
#   3 日目 1 つの点を中心にした拡大と縮小、平行な辺で切った三角形　4 日目 縮尺と影（縮図で実際の長さを求める）
#   5 日目 拡大図の面積　6 日目 わけ（面積が 4 倍になる、拡大図にならない形、影で高さがわかる）
#   7 日目 G-008（面積）・A-005（比と割合）と混ぜる　8 日目 確認
# check：長さは「何倍か」をかける式（Fraction）。方眼で拡大図を選ぶ問題は、頂点の座標が同じ倍になっているかを調べる式。
#   拡大図かどうかを選ぶ問題は、対応する辺の倍が等しいかを Fraction でくらべる式。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした G-009 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

