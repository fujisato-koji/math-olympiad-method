# C-002 書き出して数える
#
# 書き方は N-001 の頭の注のとおり。
# 前提は C-001 と N-001 だけなので、数は 10 まで。並べ方と選び方の数は書き出して数えるだけにし、
# かけ算や公式（順列 C-006、組合せ C-007）は使わない。
# 並びは左から右へ書く。「ひだりに くる」は並びの先頭。
# check は itertools で全部の並び（permutations）や選び方（combinations）を作って数える。
# 足りない並び・2 回書いた並びは、図の行（fig.splitlines()）と比べて出す。選び方の重なりは、行の文字を sorted でそろえて比べる。

id: C-002
days:
  - day: 1
    items:
      - part: 思い出す
        text: ✅ は もう かぞえた ひよこです。まだ かぞえて いない ひよこは なんわ ですか。
        figure: "✅🐥✅\n🐥🐥✅\n✅🐥"
        answer: 4
        check: "n('🐥')"
        hints:
          - ✅ の ついた ものは、もう かぞえて あるよ。
          - ✅ の ない ひよこだけを ゆびで さそう。
          - さした ひよこを かぞえよう。
        paths:
          - [✅ の ない ひよこを さがす, かぞえる, 4 わ]
      - part: 思い出す
        text: いちばん おおいのは どれですか。
        figure: "🍎🍌🍎\n🍇🍎🍌\n🍌🍎"
        choices: [りんご, バナナ, ぶどう]
        answer: りんご
        check: "max(['りんご', 'バナナ', 'ぶどう'], key=lambda k: {'りんご': n('🍎'), 'バナナ': n('🍌'), 'ぶどう': n('🍇')}[k])"
        hints:
          - 1 しゅるいずつ かぞえよう。
          - りんご、バナナ、ぶどうの かずを かいておこう。
          - いちばん おおきい かずは どれかな。
        paths:
          - [りんご 4、バナナ 3、ぶどう 1 と かぞえる, いちばん おおきいのは 4, りんご]
      - part: 見本
        text: 🐶 と 🐱 が 1 れつに ならびます。ならびかたを ぜんぶ かきだそう。
        figure: "🐶🐱\n🐱🐶"
        explain: ひだりに くるのが 🐶 なら 🐶🐱、🐱 なら 🐱🐶 です。ならびかたは この 2 とおりです。かいた ならびを かぞえると、なんとおり あるかが わかります。
      - part: 今日
        text: 🍙 と 🍞 を 1 れつに ならべます。ならべかたは 🍙🍞 と、もう 1 つ あります。どれですか。
        choices: [🍙🍞, 🍞🍙, 🍙🍙]
        answer: 🍞🍙
        check: "(set(''.join(p) for p in itertools.permutations('🍙🍞')) - {'🍙🍞'}).pop()"
        hints:
          - 🍙🍞 は、ひだりが 🍙 の ならびだね。
          - ひだりに 🍞 を おくと、どう なるかな。
          - 🍙 も 🍞 も 1 つずつ つかうよ。
        paths:
          - [ひだりが 🍙 なら 🍙🍞, ひだりが 🍞 なら 🍞🍙, 🍞🍙]
        note: 🍙🍙 を選んだら、🍞 がなくなり 🍙 が 2 つになっていることを確かめる。
      - part: 今日
        text: 🐶🐱🐰 の 3 びきの ならびかたを かきだしました。たりない ならびは どれですか。
        figure: "🐶🐱🐰\n🐶🐰🐱\n🐱🐶🐰\n🐰🐶🐱\n🐰🐱🐶"
        choices: [🐱🐰🐶, 🐶🐱🐰, 🐰🐶🐱]
        answer: 🐱🐰🐶
        check: "(set(''.join(p) for p in itertools.permutations('🐶🐱🐰')) - set(fig.splitlines())).pop()"
        hints:
          - ひだりが 🐶 の ならびは いくつ あるかな。
          - ひだりが 🐱 の ならびも さがしてみよう。
          - ひだりが 🐱 で、まだ かいて いない ならびを かんがえよう。
        paths:
          - [ひだりが 🐶 は 2 つ, ひだりが 🐱 は 1 つ しか ない, 🐱 の あとが 🐰 の ならびが ない, 🐱🐰🐶]
        note: 選択肢の 🐶🐱🐰 と 🐰🐶🐱 は、もう書いてある。図と 1 つずつ見比べさせる。
      - part: 今日
        text: 🍓 と 🍋 と 🍇 を 1 れつに ならべます。ならべかたは なんとおり ありますか。
        answer: 6
        check: "len(set(itertools.permutations('🍓🍋🍇')))"
        hints:
          - かみに ならびを かきだしてみよう。
          - ひだりに くる ものを 1 つ きめて、のこりの ならべかたを かこう。
          - かいた ならびに、おなじ ものが ないか みよう。
        paths:
          - [ひだりが 🍓 の ならびを かく（2 つ）, ひだりが 🍋 の ならびを かく（2 つ）, ひだりが 🍇 の ならびを かく（2 つ）, かぞえて 6 とおり]
        note: 思いついた順に書くと、もれや重なりが出やすい。書いたものを数える前に、同じ並びがないかを確かめる。
      - part: 挑戦
        text: あかい たま 2 こと、あおい たま 1 こを 1 れつに ならべます。ならべかたは なんとおり ありますか。
        figure: 🔴🔴🔵
        answer: 3
        check: "len(set(itertools.permutations('🔴🔴🔵')))"
        hints:
          - あおい たまが どこに くるかを かんがえよう。
          - あおい たまは、ひだり、まんなか、みぎの どこに おけるかな。
          - あかい たまどうしを いれかえても、みた ならびは かわらないよ。
        paths:
          - [あおが ひだり　🔵🔴🔴, あおが まんなか　🔴🔵🔴, あおが みぎ　🔴🔴🔵, 3 とおり]
          - ["3 つの位置から、青い玉を置く位置を選ぶ", "C(3, 1) = 3", "3 とおり"]
        note: 赤い玉を別のものとみて 6 と答えやすい。同じ色を入れかえても見た目の並びは同じになる。
