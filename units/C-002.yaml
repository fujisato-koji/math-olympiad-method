# C-002 書き出して数える
#
# 段 1・水準 1・5 日。並べ方を全部書き出す（2〜3 個）、決まった順で書き出す（もれと重なりを防ぐ）、選び方を書き出す、C-001 と混ぜる、確認。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note、explain は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 前提は C-001 と N-001 だけなので、数は 10 まで。かけ算や公式（順列 C-006、組合せ C-007）は使わない。
# 並びは左から右へ書く。「ひだりに くる」は並びの先頭。
# 図の約束（D-129）：物は絵文字で、たまは丸でかく。書き出した並びは灰色の行（左の数は書いた順）、点線の ？ はまだ書いていないところ、
# 黄色のマスは先に決めたところ、かごは「えらぶ」（中の順は考えない）。
# check は itertools で全部の並び（permutations）や選び方（combinations）を作って数える。書き出した並びは、図と同じものを check の中に書く。
# てんびんの図は A-001 と同じ svg（上皿てんびん、おもい ほうの さらが さがる）。balance は tools/blind.py と tools/unitqc.py に見えないので使わない（2026-11-13）。

