# E-171 つくって試す
#
# 段 1・水準 1・5 日。紙の塔（紙コップを積む）やゴムで走る車をつくり、試して、うまくいかない所を見つけて直すことを扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 紙コップの塔（ずれたコップ・すきまのあるコップを見つけて直す、つくる所を選ぶ、いる数を数える）
#   2 日目 ゴムで走る車（ななめのタイヤ、はこにこすれるタイヤ、はずれたゴム、まるくないタイヤを見つけて直す、走った長さを床の板で数える）
#   3 日目 わけ（直したらもう一度試す。うまくいくまで 試す → 見つける → 直す をくりかえす）、1 つずつ直して試すと、うまくいかない元がわかる
#   4 日目 混ぜる　5 日目 確認
# 場面は家でできる工作にした：ふせた紙コップをピラミッドの形に積み、上にうすい本をのせて試す。
#   車は牛乳パックなどの箱、ペットボトルのふたのタイヤ、ストローとわりばしの軸、わゴム。ふたに穴をあける所には「おうちの ひとと いっしょに」を付けた。
# 図の約束：紙コップは口を下にした台形で、口のふちに線。本は赤い表紙に白い紙。
#   車はよこから見た図（まえは右、ゴムは紫の線）と、上から見た図（まえは上、黒い矢印がすすむ向き、タイヤは灰色の細長い四角）。
#   赤い丸は「うまくいかない所」の印で、見本と、文がその所を知らせる問い・ヒントだけに使う（答えの場所には付けない）。
#   床の板は茶色の濃い・うすいを交互に並べ、スタートの線から車のまえのはしまでの枚数を数える。
#   上から見た車で、はこにこすれるタイヤは、はこに 3.5 くいこませる（ほかのタイヤとはこのすきまは 8.5〜10）。3 日目の「1 つずつなおしてためす」問いでは、なおしたタイヤをみどりの丸でかこむ。
# 三角の骨組・紙を折る・丸める・アーチで強くすることは E-172、ゴムをのばす長さと走る遠さは P-185、重心とつり合いは P-184 で扱うので、ここでは問わない。
# 腕だめし（離）は 2 問とも読み取り：3 枚の絵を順に並べる、3 回の試しの板の枚数を比べる。

id: E-171
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          かみコップを つんで、とうを つくりました。
          つくったら、上に 本を のせて ためします。
          コップが ずれて いたり、下の コップの あいだに すきまが あったり すると、くずれます。
          うまく いかない ところを 見つけて なおすと、くずれにくく なります。
