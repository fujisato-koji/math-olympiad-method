        explain: |-
          はこ（ぎゅうにゅうパックなど）に ストローを とおし、その 中に わりばしなどを とおして じくに し、ペットボトルの ふたを タイヤに します。わゴムの かたほうを はこの まえに かけ、もう かたほうを うしろの じくに かけて、車を うしろへ ころがすと、ゴムが じくに まきつきます。手を はなすと、ゴムが もとに もどる 力で じくと タイヤが まわります。
          タイヤが ななめに ついて いると、タイヤは むいて いる ほうへ ころがろうと するので、車が まがります。タイヤが はこに こすれると、まわりにくく なって すぐ とまります。うまく いかない ときは、上から 見たり よこから 見たり して、どこが いけないか さがします。ふたに あなを あける ところは、おうちの ひとと いっしょに。
