oke-width="2" stroke-linejoin="round"/><line x1="224.6" y1="145" x2="259.4" y2="145" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="262,150 302,150 294.8,116 269.2,116" fill="#f3c969" fill-opacity=".5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="264.6" y1="145" x2="299.4" y2="145" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="242,116 282,116 274.8,82 249.2,82" fill="#f3c969" fill-opacity=".5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="244.6" y1="111" x2="279.4" y2="111" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="230,69 294,69 294,82 230,82" fill="#f08080" fill-opacity=".6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><polygon points="235,72 292,72 292,79 235,79" fill="#fff" fill-opacity=".85"/><text x="58" y="178" font-size="13" text-anchor="middle" fill="currentColor">ずれて いる</text><text x="160" y="178" font-size="13" text-anchor="middle" fill="currentColor">すきまが ある</text><text x="262" y="178" font-size="13" text-anchor="middle" fill="currentColor">なおした</text></svg>'
        explain: |-
          ふせた かみコップを、下の だんの 2 つの コップに またがる ように のせて いくと、ピラミッドの ような とうが できます。上の コップの ふちは、下の 2 つの コップの そこに のって ささえられて います。まん中から ずれて いたり、下の コップが はなれて いたり すると、ふちが かたほうに すこし しか のらないので、本の おもさで かたむいて くずれます。
          この たんげんでは「つくる → ためす → うまく いかない ところを 見つける → なおす」の じゅんを つかみます。かみコップと うすい 本が あれば、いっしょに つんで ためして みると よい。
