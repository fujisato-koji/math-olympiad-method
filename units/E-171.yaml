  - day: 2
    items:
      - part: 見本
        text: |-
          はこと ペットボトルの ふたで、ゴムで はしる 車を つくりました。ゴムを まいて 手を はなすと、ゴムが もどる 力で タイヤが まわって はしります。
          ふたに あなを あける ときは、おうちの ひとと いっしょに。
          ためすと、車は まっすぐ はしらずに まがりました。
          上から 見ると、ななめに ついた タイヤが ありました（上から 見た えでは、車は 上へ すすみます）。
          タイヤが ななめだったり、はこに こすれて いたり すると、うまく はしりません。
          ゆかに いたを ならべて、スタートの せんから 車が どこまで すすむか、いたの かずを かぞえます。
