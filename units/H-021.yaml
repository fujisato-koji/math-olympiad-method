# H-021 溶液の性質（質量モル濃度、溶解度と温度、沸点上昇・凝固点降下、浸透圧、コロイド）
#
# 水準 4・7 日。1 日目：質量モル濃度、2 日目：溶解度と温度、3 日目：沸点上昇・凝固点降下、4 日目：浸透圧、5 日目：コロイド（そのわけ）、6 日目：混ぜる、7 日目：確認。溶質、溶媒、飽和、結晶、半透膜、チンダル現象、ブラウン運動。
id: H-021
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          水に物をとかした液では、とけている物の量を mol で数えます。
          とかした水 1 kg あたりに、とけている物が何 mol あるかを、質量モルのうど（mol/kg）といいます。
          水 1 kg に A を 2 mol とかした液は、2 mol/kg です。わる数は、とかした水の kg です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="110" y="63.2" width="100" height="86.8" fill="#7fc8f8" fill-opacity="0.35"/><path d="M104 26 L110 32 L110 150 L210 150 L210 32 L216 26" fill="none" stroke="currentColor" stroke-width="2"/><line x1="110" y1="63.2" x2="210" y2="63.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="190" cy="81.3" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="128" cy="107.6" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="160" y="167" font-size="14" text-anchor="middle" fill="currentColor">水 1 kg に A 2 mol</text></svg>'
        explain: 質量モル濃度 ＝ 溶質の物質量（mol）÷ 溶媒の質量（kg）。分母は溶液全体ではなく溶媒だけの質量。体積を使うモル濃度（mol/L）とは ちがい、温度で体積が変わっても数は変わらない。
      - part: 今日
        text: 水 2 kg に A を 6 mol とかしました。質量モルのうどは何 mol/kg？
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="110" y="63.2" width="100" height="86.8" fill="#7fc8f8" fill-opacity="0.35"/><path d="M104 26 L110 32 L110 150 L210 150 L210 32 L216 26" fill="none" stroke="currentColor" stroke-width="2"/><line x1="110" y1="63.2" x2="210" y2="63.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="190" cy="81.3" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="128" cy="107.6" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="188" cy="130.9" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="187" cy="108.6" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="132" cy="78.3" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="134.9" r="9" fill="#c8ccd6" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="160" y="167" font-size="14" text-anchor="middle" fill="currentColor">水 2 kg に A 6 mol</text></svg>'
        answer: 3
        check: "6 * 1 // 2"
        hints:
          - 水 1 kg あたりでは、A は何 mol かな。
          - text: 水 2 kg を、1 kg ずつの 2 つに分けて考えます。
