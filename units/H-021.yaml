  - day: 3
    items:
      - part: 見本
        text: |-
          水に物をとかすと、まざり物のない水より、高い温度でふっとうし、低い温度でこおり始めます。
          水では、質量モルのうど 1 mol/kg ごとに、ふっとう点が 0.5 ℃ 上がり、ぎょうこ点が 1.9 ℃ 下がります。
          食塩 NaCl は、水の中で Na⁺ と Cl⁻ の 2 つに分かれるので、1 mol とかすと、とけているつぶは 2 mol です。変わる大きさは、とけているつぶ全部の mol/kg で決まります。
