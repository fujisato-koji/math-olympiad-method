    items:
      - part: 見本
        text: |-
          水のつぶだけを通して、とけている物を通さない膜を、はんとうまくといいます。
          はんとうまくで、水とこい液をへだてると、水がこい液のほうへ入っていきます。この水の動きを止めるのに、液にかける圧力が、しんとう圧です。
          しんとう圧は、のうどが高いほど、温度（K）が高いほど大きくなります。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="72" y="70" width="88" height="88" fill="#7fc8f8" fill-opacity="0.5"/><rect x="160" y="70" width="88" height="88" fill="#7fc8f8" fill-opacity="0.5"/><rect x="70" y="40" width="180" height="120" fill="none" stroke="currentColor" stroke-width="2"/><line x1="160" y1="40" x2="160" y2="90" fill="none" stroke="currentColor" stroke-width="2"/><line x1="160" y1="90" x2="160" y2="160" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/><circle cx="172" cy="150" r="5" fill="#b39ddb"/><circle cx="188" cy="150" r="5" fill="#b39ddb"/><circle cx="204" cy="150" r="5" fill="#b39ddb"/><circle cx="220" cy="150" r="5" fill="#b39ddb"/><circle cx="236" cy="150" r="5" fill="#b39ddb"/><circle cx="172" cy="134" r="5" fill="#b39ddb"/><text x="115" y="32" font-size="16" text-anchor="middle" fill="currentColor">ア</text><text x="205" y="32" font-size="16" text-anchor="middle" fill="currentColor">イ</text><text x="160" y="180" font-size="13" text-anchor="middle" fill="currentColor">まん中の点線がはんとうまく</text></svg>'
        explain: 半透膜をはさんで溶媒と溶液を ふれさせると、溶媒が溶液側へ移動する（浸透）。これを止めるために溶液側にかける圧力が浸透圧 Π。ファントホッフの式 Π ＝ cRT（c はモル濃度、T は絶対温度）。うすい溶液では溶質の種類によらず、溶けているつぶの総数で決まる。
