    items:
      - part: 見本
        text: |-
          水 100 g に、とかせる物の量には、かぎりがあります。そのかぎりの量（g）を、その温度でのようかいどといいます。
          ようかいどまでとけた液を、ほうわ液といいます。温度が高いほど、ようかいどが大きい物が多いです。
          物 X のようかいどは、表のとおりです。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="40" width="60" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="70" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">温度</text><rect x="100" y="40" width="60" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="130" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">20 ℃</text><rect x="160" y="40" width="60" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="190" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">40 ℃</text><rect x="220" y="40" width="60" height="26" fill="#c8ccd6" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/><text x="250" y="57.9" font-size="14" text-anchor="middle" fill="currentColor">60 ℃</text><rect x="40" y="66" width="60" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="70" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">X</text><rect x="100" y="66" width="60" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="130" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">30 g</text><rect x="160" y="66" width="60" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="190" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">40 g</text><rect x="220" y="66" width="60" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="250" y="83.9" font-size="14" text-anchor="middle" fill="currentColor">55 g</text><text x="160" y="120" font-size="14" text-anchor="middle" fill="currentColor">水 100 g にとける最大の量</text></svg>'
