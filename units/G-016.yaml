# G-016 平行線と角、合同の証明
#
# 書き方は N-001 の頭の注のとおり。
# ことば：対頂角、同位角、錯角、平行（ℓ ∥ m）、補助線、内角、外角、多角形、正多角形、合同（≡）、対応する頂点・辺・角、
#   三角形の合同条件、仮定、結論、証明、根拠。
# 約束した事実（証明の根拠に使ってよいもの）：一直線の角は 180°、平行線の同位角・錯角は等しい、同位角か錯角が等しければ平行、
#   合同な図形の対応する辺・角は等しい、三角形の合同条件（3 組の辺／2 組の辺とその間の角／1 組の辺とその両端の角）。
#   ここで示すもの：対頂角は等しい、三角形の内角の和は 180°（G-009 では切って集めた例だった）、外角はとなり合わない 2 つの内角の和、
#   多角形の内角の和、合同を使った証明。
# 前提は G-009 だけなので、数の計算は G-009 と同じ範囲（1000 まで、九九の範囲のわり算と、何十 ÷ 1 けた）にした。
#   多角形の内角の和は七角形の 900° まで、正多角形の 1 つの角は 360 ÷ 6、360 ÷ 9 のように割り切れるものだけ。
# 角の名前は ∠x、∠a のように文字で書くが、文字の式（A-010）は前提にないので、問題の答えはすべて数で出す。
#   わけの日の証明だけ ∠a + ∠c = 180° のような等式と、両辺から同じものをひく変形を使う（□ の式と同じ扱い）。
#   多角形の内角の和も「180° ×（頂点の数 − 2）」と言葉で書き、n は使わない。
# 二等辺三角形と平行四辺形の性質は G-017、相似は G-020 で扱うので、ここでは「2 つの角が等しい三角形」と言うだけにした。
# 図は svg（D-040）。角は本当の大きさで描いた。平行のしるしは線の上の ＞、等しい辺は辺の上の短い線、等しい角は同じ数の弧。
# 地図に plan がないので既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 対頂角・同位角・錯角　2 日目 平行線の角の計算、補助線、平行の見分け方　3 日目 三角形の外角、多角形の内角の和
#   4 日目 合同と三角形の合同条件　5 日目 証明のしくみ（仮定、結論、根拠）　6 日目 わけ（対頂角、内角の和 180°、合同から平行）
#   7 日目 G-009 と 1〜5 日目を混ぜる　8 日目 確認
# check：角の大きさは計算の式。平行な 2 本を選ぶ問題は、同位角が等しい組を選ぶ式。
#   合同条件・根拠・仮定と結論を選ぶ問題は約束ごとなので check を付けない。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした A-010 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

id: G-016
