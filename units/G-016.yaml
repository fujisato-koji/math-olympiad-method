      - [右に開いた角の和と、左に開いた角の和は等しい, 27 + 76 + 52 = 155, ∠x = 155 − 68 = 87, 87°]
    note: 補助線を 3 本ひき、途中の角を書きこんで覚えておく手数の問題。補助線が 1 本の挑戦（2 日目）より折れが多い。2 本目の「右に開いた角の和 = 左に開いた角の和」は 1 本目をくり返すと出てくるきまりで、わけを言えるなら使ってよい。
  - part: 離
    kinds: [総動員, 数]
    uses: [N-024]
    text: 正三角形の 1 つの内角は 60°、正方形は 90° のように、正多角形の 1 つの内角の大きさは決まっています。1 つの内角の大きさが《整数》（度）になる正多角形は、全部で何種類ありますか。
    answer: 22
    check: "len([n for n in range(3, 361) if 360 % n == 0])"
    hints:
      - 正多角形の 1 つの外角は、360° を頂点の数でわった大きさだね。
      - 内角 = 180° − 外角。内角が整数になるのは、外角が整数になるときだよ。
      - 360 の《約数》のうち、3 以上のものを数えよう。360 を素因数分解すると速いよ。
    paths:
      - [内角が整数になるのは、外角 360 ÷（頂点の数）が整数のとき, 頂点の数は 360 の約数で 3 以上, 360 = 2³ × 3² × 5 で約数は 4 × 3 × 2 = 24 こ, 1 と 2 をのぞいて 22, 22 種類]
      - [360 の約数を、かけて 360 になる組で書き出す, 1 × 360 から 18 × 20 まで 12 組で 24 こ, 1 と 2 をのぞいて 22 種類]
    note: 正多角形の角（この単元）と約数の個数（N-024）を合わせる。内角のままでは考えにくく、外角に言いかえると約数の問題になるのが要点。頂点の数 1 と 2 は多角形にならないので除く（ここでつまずきやすい）。いちばん頂点の多いものは正 360 角形（内角 179°）。
