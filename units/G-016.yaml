    hints:
      - 折れ曲がった点 P、Q、R のそれぞれを通って、ℓ に平行な直線をひいてみよう。
      - 平行な直線で角を 2 つに分けると、錯角で上や下の角に移せるね。P の角は 27° と何度に分かれるかな。
      - 上から順に、分けた角を 1 つずつ書きこもう。R の角の下の部分は、B の角と錯角だよ。
