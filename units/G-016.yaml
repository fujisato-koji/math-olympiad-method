    check: "(68 + 2 * 35) // 2 - 35"
    hints:
      - ∠B を 2 等分した 1 つ分を ∠b のように文字でおいてみよう。∠ACE は △ABC の外角だね。
      - ∠ACE = ∠A + ∠B だから、その半分の ∠DCE は何と何の和になるかな。
      - ∠DCE は △DBC の外角でもあるよ。2 つの見方をくらべよう。
