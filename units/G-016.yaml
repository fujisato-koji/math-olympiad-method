      - [∠ABD = ∠DBC = ∠b とする, △ABC の外角で ∠ACE = 68° + 2∠b, 半分にして ∠DCE = 34° + ∠b, △DBC の外角で ∠DCE = ∠b + ∠x, ∠x = 34°]
      - [たとえば ∠B = 70° とすると ∠ACB = 42°, ∠DBC = 35°、∠DCB = 42 + 69 = 111°, ∠x = 180 − 35 − 111 = 34°]
    note: ∠B と ∠C がわからないのに答えが決まる、変わらない量に気づけるかが要点。外角の定理を 2 回使い、文字 ∠b をおいて消す（A-010 の文字）。2 本目のように例の数で求めてもよいが、例ではすべての場合を示せないことを話す。答えはいつも ∠A の半分になる。
