# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [道筋]
    text: 3 けたの数を 24 でわると、商とあまりが同じ数になりました。このような 3 けたの数のうち、一番大きい数はいくつですか。
    answer: 575
    check: "max(n for n in range(100, 1000) if n // 24 == n % 24)"
    hints:
      - 商もあまりも □ とすると、わられる数は 24 × □ + □ だね。
      - 24 × □ + □ は、□ のいくつ分かな。
      - あまりはわる数の 24 より小さいね。□ は一番大きくていくつかな。
    paths:
      - [わられる数は 24 × □ + □ = 25 × □, あまりは 24 より小さいので □ は 23 まで, 25 × 23 = 575, 575]
    note: 「わる数 × 商 + あまり = わられる数」（たしかめの式）に、商とあまりが同じという条件を入れると 25 × □ にまとまる。あまりは 24 より小さいことを忘れて、999 に近い数（25 × 39 = 975）を答えやすい。
  - part: 離
    kinds: [総動員, 読み取り]
    uses: [N-022]
    text: ある年の 1 月 1 日は木曜日です。この年の 1 月 1 日を 1 日目として数えると、300 日目は何曜日ですか。
    choices: [月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日, 日曜日]
    answer: 火曜日
    check: "'木金土日月火水'[(300 - 1) % 7] + '曜日'"
    hints:
      - 1 日目が木曜日だね。300 日目は、1 日目の何日後かな。
      - 曜日は 7 日ごとにくり返すね。何日後かを 7 でわったあまりを考えよう。
      - 筆算で 7 でわって、あまりの分だけ木曜日から曜日を進めよう。
    paths:
      - [300 日目は 1 日目の 299 日後, 299 ÷ 7 = 42 あまり 5, 木曜日から 5 つ進めると火曜日]
    note: 曜日のくり返し（N-022）を、3 けたのわり算の筆算で決める。300 日目を 300 日後とすると 1 日ずれる（300 ÷ 7 のあまり 6 で水曜日にしやすい）。
  - part: 離
    kinds: [数, 手数]
    text: ある数を 37 でわると、商が 24 で、あまりが 19 になりました。この数を 29 でわると、商とあまりはいくつになりますか。
    choices: [31 あまり 8, 30 あまり 18, 31 あまり 18]
    answer: 31 あまり 8
    check: "(lambda q, r: f'{q} あまり {r}')(*divmod(37 * 24 + 19, 29))"
    hints:
      - はじめに、ある数を求めよう。わる数 × 商 + あまり = わられる数 だったね。
      - 37 × 24 を筆算して、19 をたそう。
      - 出た数を 29 でわる筆算をしよう。商の見当は、29 を 30 とみて考えるといいよ。
    paths:
      - [ある数は 37 × 24 + 19, 37 × 24 = 888、888 + 19 = 907, 907 ÷ 29 は 90 ÷ 30 とみて十の位に 3、29 × 3 = 87、90 − 87 = 3, 7 をおろして 37 ÷ 29 = 1 あまり 8, 31 あまり 8]
    note: かけ算の筆算（たしかめの式）でもとの数を出し、2 けたでわる筆算をする 2 段の手数の問題。19 をたし忘れると 888 ÷ 29 = 30 あまり 18 になる。
