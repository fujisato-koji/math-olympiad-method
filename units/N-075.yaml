# N-075 わり算の筆算（わる数が 1 けた・2 けた、商の見当）
#
# 書き方は N-001 の頭の注のとおり。段 3 なので、子に見せる文は小 4 までの漢字で書く（位・商・続 は漢字。確・仮・余・比・個・枚・班
#   などはかなで書く。かりの商、あまり、たしかめ、まい、グループ）。分かち書きはしない。数の前後には空白を入れる。
# 「÷」は U+00F7。check は「//」「%」と divmod で書く。あまりのある答えは「21 あまり 3」と書き、鍵盤で打てないので choices にする
#   （N-014 と同じ）。check は (lambda q, r: f'{q} あまり {r}')(*divmod(わられる数, わる数))。
# 前提は N-014（わり算とあまり）と N-074（かけ算の筆算）。数は 1000 まで（N-074 と同じ。4 けたの数は N-073 で、前提にない）。
#   わられる数は 3 けたまで、商は 1〜3 けた。わる数が 2 けたのときの商は 1 けたと 2 けた。
#   わる数 × 商 は N-074 の筆算（何けた × 1 けた、2 けた × 2 けた）で計算できる大きさにした。
# 筆算は「たてる、かける、ひく、おろす」のくり返し。商の立たない上の位には何も書かず（256 ÷ 4 は十の位から）、
#   とちゅうの位にわる数が入らないときは商に 0 を立てる（624 ÷ 3 = 208）。
# 何十・何百 ÷ 1 けた（80 ÷ 4、600 ÷ 3）と何十 ÷ 何十（80 ÷ 20）は、10 や 100 のまとまりの数で九九のわり算にする。
# 商の見当：わる数を近い何十とみて、わられる数は上の位の数で考える（89 ÷ 21 は 80 ÷ 20 とみて 8 ÷ 2 = 4）。見当で立てた商を
#   「かりの商」と言い、わる数 × かりの商 がひけないほど大きければ 1 小さく、ひいた答えがわる数より小さくなければ 1 大きくする。
#   概数（N-061）は前提にないので「がい数」「四捨五入」の語は使わず、「近い何十とみる」と言う。
# 答えのたしかめは「わる数 × 商 + あまり = わられる数」（N-014 のわけ）を、N-074 の筆算で計算する。
# 小数の商（N-077）と分数（N-016）は使わない。お金（N-060）と長さ（G-046）は前提にないので、場面は、こ数、人数、本数、まい数にした。
# 筆算の図は svg（D-040）。わる数、かっこ、わられる数を同じはばの列に置く。問題の図はわられる数とわる数だけで、商は書かない
#   （見本とわけの図には、商ととちゅうの計算を書く）。
# 決まった形の筆算の問題（「○ ÷ ○ を筆算で…」）のヒントとみちすじは、位ごとの計算と商の見当から作った（下書きの道具）。
# 日の並び（既定）：1 日目 何十・何百 ÷ 1 けた、2 けた ÷ 1 けた（商が 2 けた）、2 日目 3 けた ÷ 1 けた・あまり・0 を立てる（頭に見本）、
#   3 日目 わる数が 2 けた（何十でわる、商の見当、かりの商を直す、頭に見本）、4 日目 わけ、5 日目 N-014・N-074 と混ぜる
#   （たしかめの式、あまりの考え方、場面の問題）、6 日目 確認。
# 前提の更新（2026-11-08）：作ったあとで地図の前提が増え、上の注で「前提にない」とした N-073 は、いまは前提のたどりに入っている。問題はそのときの前提の範囲で作ってあり、この道具を使う問題は足してよい。

