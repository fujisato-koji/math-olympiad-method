 fill="#3c9a4a" font-weight="bold" font-style="italic">c</text><text x="84" y="180" font-size="14" text-anchor="middle"><tspan font-style="italic" fill="#d9534f" font-weight="bold">a</tspan>/sin <tspan fill="#d9534f" font-weight="bold">A</tspan> = <tspan font-style="italic" fill="#2f80c8" font-weight="bold">b</tspan>/sin <tspan fill="#2f80c8" font-weight="bold">B</tspan></text><text x="84" y="202" font-size="14" text-anchor="middle">= <tspan font-style="italic" fill="#3c9a4a" font-weight="bold">c</tspan>/sin <tspan fill="#3c9a4a" font-weight="bold">C</tspan> = 2R</text><polygon points="182,148 314,148 218,58" fill="#f3c969" fill-opacity="0.35" stroke="none"/><path d="M182 148 L200 148 A18 18 0 0 0 188.7 131.3 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M200 148 A18 18 0 0 0 188.7 131.3" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="182,148 314,148 218,58" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="218" y1="58" x2="182" y2="148" stroke="#2f80c8" stroke-width="3.5" stroke-linecap="round"/><line x1="182" y1="148" x2="314" y2="148" stroke="#2f80c8" stroke-width="3.5" stroke-linecap="round"/><line x1="218" y1="58" x2="218" y2="148" stroke="#d9534f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="218,140 226,140 226,148" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><text x="176" y="162" font-size="15" text-anchor="middle">A</text><text x="316" y="164" font-size="15" text-anchor="middle">B</text><text x="218" y="50" font-size="15" text-anchor="middle">C</text><text x="193" y="105" font-size="16" text-anchor="end" fill="#2f80c8" font-weight="bold" font-style="italic">b</text><text x="262" y="165" font-size="16" text-anchor="middle" fill="#2f80c8" font-weight="bold" font-style="italic">c</text><text x="224" y="108" font-size="13" text-anchor="start" fill="#d9534f">高さ</text><text x="224" y="125" font-size="13" text-anchor="start" fill="#d9534f" font-weight="bold">b sin A</text><text x="248" y="180" font-size="14" text-anchor="middle">S = (1/2)<tspan font-style="italic" fill="#2f80c8" font-weight="bold">b</tspan><tspan font-style="italic" fill="#2f80c8" font-weight="bold">c</tspan> sin A</text><text x="248" y="202" font-size="12" text-anchor="middle">（高さ × 底辺 ÷ 2）</text></svg>'
        explain: △ABC で、∠A、∠B、∠C の大きさを A、B、C、それと向かい合う辺 BC、CA、AB の長さを a、b、c と書きます。外接円の半径を R とすると、a/sin A = b/sin B = c/sin C = 2R が成り立ちます。これを正弦定理といいます（わけは 6 日目）。例：A = 30°、a = 5 なら、5 ÷ sin 30° = 5 ÷ (1/2) = 10 = 2R なので、R = 5 です。2 つの角と 1 つの辺がわかれば、ほかの辺が求められます（3 つめの角は内角の和から）。また、△ABC の面積 S は S = (1/2)bc sin A です。C から直線 AB にひいた垂線の長さ（高さ）は、A が鋭角なら b sin A、A が鈍角でも b sin(180° − A) = b sin A になるからです。例：b = 6、c = 5、A = 150° なら、S = (1/2) × 6 × 5 × sin 150° = (1/2) × 6 × 5 × (1/2) = 15/2 です。
