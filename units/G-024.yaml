# G-024 三角比と正弦・余弦定理
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 と G-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 前の段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（前の水準 3）。
#   新しいきまりが出る日（1〜5 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 鋭角の三角比（直角三角形の辺の比。相似なので角だけで決まる）、30°・45°・60° の値、辺を求める
#   2 日目 相互関係（sin²θ + cos²θ = 1、tan θ = sin θ/cos θ、1 + tan²θ = 1/cos²θ）と 90° − θ
#   3 日目 0°〜180° の三角比（半円の上の点で定める）、180° − θ、sin θ = 1/2 のような θ を求める
#   4 日目 正弦定理と外接円の半径、三角形の面積 S = (1/2)bc sin A　5 日目 余弦定理（辺を求める、3 辺から角、鋭角か鈍角か）
#   6 日目 わけ（sin²θ + cos²θ = 1、余弦定理、正弦定理。どれも ③）　7 日目 G-019・G-020・G-018・G-017 と混ぜる（高さの測量、
#   円に内接する三角形、平行四辺形の対角線、角の二等分線を面積で）　8 日目 確認
# 前提は G-019（三平方の定理）、G-020（相似）、G-018（円周角の定理）。前提のたどりに A-016（平方根と有理化）、A-017（2 次方程式）、
#   A-015（展開）、G-017（二等辺三角形と平行四辺形）、G-016（平行線と角）がある。
#   座標平面（G-050、A-006）は前提のたどりにないので、鈍角の三角比は「半円の上の点 P の、O からの横の位置 x（右を正、左を負）と高さ y」で
#   定めた（負の数は N-027 まで済んでいる）。単位円と一般角、弧度法は G-025 で扱うので、角は度だけを使い、0° ≦ θ ≦ 180° に限った。
#   加法定理（G-025）は使わない（sin 75° のような値が要らないように、向かい合う辺と角の組を選ばせる）。
#   内接四角形の性質（G-023）とヘロンの公式は前提にないので日の問題では使わない（正弦定理のわけの鈍角の場合は注で触れるだけ）。
#   角の二等分線の定理（G-042）も前提にないので、二等分線の長さは面積の和で求めた。
# 角の大きさの答えは選ぶ問題にした（前の段 5 の決まり）。√ を含む答えも選ぶ問題にし、check は選択肢ごとの値（math.sqrt）が
#   問題の量（math.sin、math.cos で計算した値）と近い（math.isclose）ものを選び出す。打つ答えは Fraction で計算する。
#   θ を求める問題の check は、0°〜180° の整数の角で条件を満たすものの集まりと、選択肢の角の集まりをくらべる。
# 「√3/2」は画面で 3/2 だけが上下に重なり √(3/2) に見えるので、「(√3)/2」のように √ をかっこでくくって書いた（D-042 のかっこの決まり）。
# 図は svg（D-040）。三角形は問題の長さと角のとおりに描き、求める辺や角の値は図に書かない。直角のしるしは直角とわかっている角だけ。
# ことば：三角比、斜辺（直角と向かい合う辺）、向かい合う辺、となりの辺、垂線、頂点、外接円、正弦定理、余弦定理。
# 図の色（D-131 の直し）：見る角はうすむらさき、向かい合う辺は赤、となりの辺は青、斜辺は太い線、求める長さは赤の「？」。
#   正弦定理の図では、向かい合う角と辺（A と a など）を同じ色にする。鈍角は半円の上の点 P と、P からの垂線でできる直角三角形（緑）で見せる。
# 三角比は、ベクトルの内積（G-027）、三角関数と加法定理（G-025）、測量と天体の距離、力の分解（P-002）、交流と波の計算の入口になる（D-026）。

id: G-024
days:
  - day: 1
    items:
      - part: 見本
        id: "ce5e524f7b"
        text: 直角三角形 ABC（∠C = 90°）で ∠A = θ とします。θ と向かい合う辺（赤）、θ のとなりの辺（青）、斜辺（太い線）の長さの比を、sin θ（サイン）、cos θ（コサイン）、tan θ（タンジェント）といいます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="26,145.8 172,145.8 172,36.2" fill="#f3c969" fill-opacity="0.35" stroke="none"/><path d="M26 145.8 L52 145.8 A26 26 0 0 0 46.8 130.2 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M52 145.8 A26 26 0 0 0 46.8 130.2" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="63.9" y="138" font-size="14" text-anchor="middle">θ</text><polygon points="26,145.8 172,145.8 172,36.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="26" y1="145.8" x2="172" y2="36.2" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="172" y1="36.2" x2="172" y2="145.8" stroke="#d9534f" stroke-width="4" stroke-linecap="round"/><line x1="172" y1="145.8" x2="26" y2="145.8" stroke="#2f80c8" stroke-width="4" stroke-linecap="round"/><polyline points="162,145.8 162,135.8 172,135.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><text x="13.8" y="155.6" font-size="15" text-anchor="middle">A</text><text x="182.4" y="158.8" font-size="15" text-anchor="middle">C</text><text x="179.2" y="30.7" font-size="15" text-anchor="middle">B</text><text x="182" y="87" font-size="17" text-anchor="start" fill="#d9534f" font-weight="bold">3</text><text x="182" y="106" font-size="13" text-anchor="start" fill="#d9534f">向かい合う辺</text><text x="99" y="164.8" font-size="14" text-anchor="middle" fill="#2f80c8" font-weight="bold">となりの辺 4</text><text x="93.6" y="84.2" font-size="15" text-anchor="end" font-weight="bold">斜辺 5</text><text x="304" y="132" font-size="15" text-anchor="end">sin θ = <tspan fill="#d9534f" font-weight="bold">3</tspan>/<tspan font-weight="bold">5</tspan></text><text x="304" y="156" font-size="15" text-anchor="end">cos θ = <tspan fill="#2f80c8" font-weight="bold">4</tspan>/<tspan font-weight="bold">5</tspan></text><text x="304" y="180" font-size="15" text-anchor="end">tan θ = <tspan fill="#d9534f" font-weight="bold">3</tspan>/<tspan fill="#2f80c8" font-weight="bold">4</tspan></text></svg>'
        explain: ∠C = 90° の直角三角形で ∠A = θ と決めると、2 つの角が等しいので、どの大きさの三角形も相似です（G-020）。だから、辺の長さの比は θ だけで決まります。斜辺 AB、A と向かい合う辺 BC、A のとなりの辺 AC を使って、sin θ = BC/AB、cos θ = AC/AB、tan θ = BC/AC と定めます。これらをまとめて三角比といい、sin をサイン（正弦）、cos をコサイン（余弦）、tan をタンジェント（正接）と読みます。図の三角形では、sin θ = 3/5、cos θ = 4/5、tan θ = 3/4 です。直角二等辺三角形（辺の比 1:1:√2）から sin 45° = cos 45° = 1/√2、tan 45° = 1、30°・60°・90° の直角三角形（辺の比 1:2:√3）から sin 30° = 1/2、cos 30° = (√3)/2、tan 30° = 1/√3、sin 60° = (√3)/2、cos 60° = 1/2、tan 60° = √3 です。式を変形すると BC = AB sin θ、AC = AB cos θ、BC = AC tan θ で、斜辺と角から ほかの辺が求められます。
