        id: "f405915468"
        text: △ABC で、2 つの辺 b、c（青）とその間の角 A から、A と向かい合う辺 a（赤）が求められます（余弦定理）。3 辺がわかれば、角の cos も求められます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="70,125.7 250,125.7 126.2,28.3" fill="#f3c969" fill-opacity="0.35" stroke="none"/><path d="M70 125.7 L92 125.7 A22 22 0 0 0 81 106.7 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M92 125.7 A22 22 0 0 0 81 106.7" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="70,125.7 250,125.7 126.2,28.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="70" y1="125.7" x2="250" y2="125.7" stroke="#2f80c8" stroke-width="4" stroke-linecap="round"/><line x1="126.2" y1="28.3" x2="70" y2="125.7" stroke="#2f80c8" stroke-width="4" stroke-linecap="round"/><line x1="250" y1="125.7" x2="126.2" y2="28.3" stroke="#d9534f" stroke-width="4" stroke-linecap="round"/><text x="58" y="135.9" font-size="15" text-anchor="middle">A</text><text x="262.4" y="134.9" font-size="15" text-anchor="middle">B</text><text x="122" y="21.3" font-size="15" text-anchor="middle">C</text><text x="90.1" y="77" font-size="17" text-anchor="end" fill="#2f80c8" font-weight="bold" font-style="italic">b</text><text x="160" y="145.7" font-size="17" text-anchor="middle" fill="#2f80c8" font-weight="bold" font-style="italic">c</text><text x="198.1" y="73" font-size="17" text-anchor="start" fill="#d9534f" font-weight="bold" font-style="italic">a</text><text x="160" y="170" font-size="16" text-anchor="middle"><tspan font-style="italic" fill="#d9534f" font-weight="bold">a</tspan>² = <tspan font-style="italic" fill="#2f80c8" font-weight="bold">b</tspan>² + <tspan font-style="italic" fill="#2f80c8" font-weight="bold">c</tspan>² − 2<tspan font-style="italic" fill="#2f80c8" font-weight="bold">b</tspan><tspan font-style="italic" fill="#2f80c8" font-weight="bold">c</tspan> cos A</text><text x="160" y="194" font-size="14" text-anchor="middle">cos A = (<tspan font-style="italic" fill="#2f80c8" font-weight="bold">b</tspan>² + <tspan font-style="italic" fill="#2f80c8" font-weight="bold">c</tspan>² − <tspan font-style="italic" fill="#d9534f" font-weight="bold">a</tspan>²) ÷ 2<tspan font-style="italic" fill="#2f80c8" font-weight="bold">b</tspan><tspan font-style="italic" fill="#2f80c8" font-weight="bold">c</tspan></text></svg>'
        explain: △ABC で、a² = b² + c² − 2bc cos A が成り立ちます。同じように、b² = c² + a² − 2ca cos B、c² = a² + b² − 2ab cos C です。これを余弦定理といいます（わけは 6 日目）。A = 90° なら cos A = 0 で、三平方の定理 a² = b² + c² になります。例：b = 5、c = 8、A = 60° なら、a² = 25 + 64 − 2 × 5 × 8 × (1/2) = 49 で、a = 7 です。式を変形すると cos A = (b² + c² − a²)/(2bc) なので、3 辺から角が求められます。例：a = 7、b = 3、c = 5 なら、cos A = (9 + 25 − 49)/30 = −1/2 で、A = 120° です。b² + c² − a² が正なら A は鋭角、0 なら直角、負なら鈍角です。
