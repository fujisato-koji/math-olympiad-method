      - ["C の角で考える：cos C = (25 + 36 − 49)/(2 × 5 × 6) = 1/5", "sin C = √(1 − 1/25) = (2√6)/5", "2R = 7 ÷ ((2√6)/5) = 35/(2√6)", "R = 35/(4√6) = (35√6)/24"]
    note: 《分数》と √ が重なる計算が続く。どの角で求めても答えは同じだが、A（辺 5 と向かい合う角）を選ぶと cos A = 5/7 で計算が軽い。2R を R と取り違えると (35√6)/12 になる。
