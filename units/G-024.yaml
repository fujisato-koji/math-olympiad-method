  - day: 2
    items:
      - part: 見本
        text: θ を鋭角とします。sin θ、cos θ、tan θ の間の関係を調べてみましょう。
        svg: '<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><polygon points="50,124 190,124 190,26" stroke="none" fill="#f3c969" fill-opacity=".35"/><polygon points="50,124 190,124 190,26" stroke="currentColor" fill="none" stroke-width="2"/><polyline points="181,124 181,115 190,115" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M63.1 114.8 A16 16 0 0 1 66 124" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="81.7" y="118" font-size="12" text-anchor="middle">θ</text><path d="M190 42 A16 16 0 0 1 176.9 35.2" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="113.7" y="70" font-size="12" text-anchor="end">1</text><text x="201" y="79" font-size="12" text-anchor="start">sin θ</text><text x="120" y="139" font-size="12" text-anchor="middle">cos θ</text><text x="38.7" y="132.5" font-size="13" text-anchor="middle">A</text><text x="199.8" y="135.4" font-size="13" text-anchor="middle">C</text><text x="197" y="20.7" font-size="13" text-anchor="middle">B</text></svg>'
        explain: 斜辺の長さが 1 の直角三角形 ABC（∠C = 90°、∠A = θ）では、BC = sin θ、AC = cos θ です。三平方の定理から BC² + AC² = AB² なので、(sin θ)² + (cos θ)² = 1 です。(sin θ)² を sin²θ と書いて、sin²θ + cos²θ = 1 と表します。また、tan θ = BC ÷ AC なので、tan θ = sin θ/cos θ です。sin²θ + cos²θ = 1 の両辺を cos²θ でわると、tan²θ + 1 = 1/cos²θ になります。さらに、∠B = 90° − θ で、角 B から見ると向かい合う辺ととなりの辺が入れかわるので、sin(90° − θ) = cos θ、cos(90° − θ) = sin θ、tan(90° − θ) = 1/tan θ です。例：θ が鋭角で sin θ = 3/5 のとき、cos²θ = 1 − 9/25 = 16/25 で、cos θ は正の数なので cos θ = 4/5、tan θ = (3/5) ÷ (4/5) = 3/4 です。1 つの三角比がわかれば、残りの 2 つが求められます。
