        explain: 例：「C から直線 AB にひいた垂線の足を H とする。直角三角形 ACH で、三角比の定め方から CH = b sin A、AH = b cos A である。H が辺 AB の上にあるとき BH = c − b cos A、H が B の外側にあるとき BH = b cos A − c で、どちらでも BH² = (c − b cos A)² である。直角三角形 BCH で三平方の定理から、a² = CH² + BH² = b²sin²A + c² − 2bc cos A + b²cos²A = b²(sin²A + cos²A) + c² − 2bc cos A。sin²A + cos²A = 1 なので、a² = b² + c² − 2bc cos A である。」と書ければよい。① H を決め、CH と AH を b と A で表す、② a² を展開して式を変形する（b² でくくる）、③ 約束した事実（三角比の定め方、三平方の定理、sin²A + cos²A = 1）で結ぶ、の 3 つを見る。A が鈍角のときは H が A の外側に出て AH = b cos(180° − A) = −b cos A となり、BH = c − b cos A は同じ式になるので、同じ筋道で成り立つことにも触れる。A = 90° なら cos A = 0 で、三平方の定理そのものになる。
