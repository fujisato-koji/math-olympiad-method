  - part: 離
    kinds: [総動員, 手数]
    uses: [G-023]
    text: 図のように、円に内接する四角形 ABCD で、AB = 3、BC = 3、CD = 5、DA = 8 です。対角線 BD の長さはいくつですか。
    svg: '<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="90" r="64" stroke="currentColor" fill="none" stroke-width="2"/><polygon points="59.9,111.9 91.5,147.3 138.9,151.2 183.9,86" stroke="none" fill="#f3c969" fill-opacity=".35"/><polygon points="59.9,111.9 91.5,147.3 138.9,151.2 183.9,86" stroke="currentColor" fill="none" stroke-width="2"/><text x="67.5" y="140.9" font-size="12" text-anchor="end">3</text><text x="114.3" y="164.2" font-size="12" text-anchor="middle">3</text><text x="170.4" y="128.8" font-size="12" text-anchor="start">5</text><text x="119.6" y="92.2" font-size="12" text-anchor="middle">8</text><text x="48.1" y="113.9" font-size="13" text-anchor="middle">A</text><text x="82.4" y="159.6" font-size="13" text-anchor="middle">B</text><text x="146.1" y="165.2" font-size="13" text-anchor="middle">C</text><text x="194.2" y="84.5" font-size="13" text-anchor="middle">D</text></svg>'
    answer: 7
    check: "(lambda cA: [d for d in range(1, 20) if d * d == 9 + 64 - 2 * 3 * 8 * cA][0])(Fraction((9 + 64) - (9 + 25), 2 * 3 * 8 + 2 * 3 * 5))"
    hints:
      - 円に内接する四角形の向かい合う角の和は 180° です（G-023）。cos A と cos C の間には、どんな関係があるでしょう。
      - △ABD と △CBD のそれぞれで、BD² を余弦定理で表しましょう。
      - 2 つの式を等しいとおいて、cos A を求めましょう。
    paths:
      - ["C = 180° − A なので cos C = −cos A", "BD² = 9 + 64 − 48cos A = 73 − 48cos A", "BD² = 9 + 25 − 30cos C = 34 + 30cos A", "73 − 48cos A = 34 + 30cos A で cos A = 1/2", "BD² = 73 − 24 = 49 で BD = 7"]
    note: 内接四角形の対角の和（G-023）と cos(180° − θ) = −cos θ をつなぎ、2 つの余弦定理を 1 つの方程式にする。A = 60° までわかるので、面積 (39√3)/4 まで求めさせてもよい。
  - part: 離
    kinds: [数, 手数]
    text: 3 辺の長さが BC = 5、CA = 6、AB = 7 の △ABC があります。この三角形の外接円の半径はどれですか。
    svg: '<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><polygon points="141.7,26 78.3,124 161.7,124" stroke="none" fill="#f3c969" fill-opacity=".35"/><polygon points="141.7,26 78.3,124 161.7,124" stroke="currentColor" fill="none" stroke-width="2"/><text x="120" y="139" font-size="12" text-anchor="middle">5</text><text x="162.5" y="76.8" font-size="12" text-anchor="start">6</text><text x="100.8" y="73" font-size="12" text-anchor="end">7</text><text x="68.3" y="135.2" font-size="13" text-anchor="middle">B</text><text x="170.4" y="136.8" font-size="13" text-anchor="middle">C</text><text x="144.3" y="18.8" font-size="13" text-anchor="middle">A</text></svg>'
    choices: ["(35√6)/24", "(35√6)/12", "(5√6)/4", "(7√6)/6"]
    answer: (35√6)/24
    check: "[k for k, v in {'(35√6)/24': 35 * math.sqrt(6) / 24, '(35√6)/12': 35 * math.sqrt(6) / 12, '(5√6)/4': 5 * math.sqrt(6) / 4, '(7√6)/6': 7 * math.sqrt(6) / 6}.items() if math.isclose(v, 5 * 6 * 7 / (4 * math.sqrt(9 * 4 * 3 * 2)))][0]"
    hints:
      - まず、1 つの角の cos を余弦定理で求めましょう。どの角を選ぶと計算が楽でしょう。
      - その角の sin を、sin² + cos² = 1 で求めましょう。
      - 正弦定理で 2R を求め、分母を有理化しましょう。
    paths:
      - ["cos A = (36 + 49 − 25)/(2 × 6 × 7) = 60/84 = 5/7", "sin A = √(1 − 25/49) = (2√6)/7", "2R = 5 ÷ ((2√6)/7) = 35/(2√6)", "R = 35/(4√6) = (35√6)/24"]
    note: 分数と √ が重なる計算が続く。どの角で求めても答えは同じだが、A（辺 5 と向かい合う角）を選ぶと cos A = 5/7 で計算が軽い。2R を R と取り違えると (35√6)/12 になる。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [G-020, A-017]
    text: 図の △ABC は、AB = AC = 1、∠A = 36° の二等辺三角形です。∠B の二等分線が辺 AC と交わる点を D とします。この図を使って cos 36° の値を求めると、どれになりますか。
    svg: '<svg viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg"><polygon points="100,26 55.2,164 144.8,164" stroke="none" fill="#f3c969" fill-opacity=".35"/><polygon points="100,26 55.2,164 144.8,164" stroke="currentColor" fill="none" stroke-width="2"/><line x1="55.2" y1="164" x2="127.7" y2="111.3" stroke="currentColor" fill="none" stroke-width="2"/><path d="M104.9 41.2 A16 16 0 0 1 95.1 41.2" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="100" y="62.4" font-size="12" text-anchor="middle">36°</text><text x="67.1" y="95.6" font-size="12" text-anchor="end">1</text><text x="132.9" y="95.6" font-size="12" text-anchor="start">1</text><text x="99.1" y="18.5" font-size="13" text-anchor="middle">A</text><text x="46.3" y="176.6" font-size="13" text-anchor="middle">B</text><text x="152.3" y="177.9" font-size="13" text-anchor="middle">C</text><text x="139.4" y="113" font-size="13" text-anchor="middle">D</text></svg>'
    choices: ["(1 + √5)/4", "(√5 − 1)/4", "(1 + √5)/2", "(√5)/4"]
    answer: (1 + √5)/4
    check: "[k for k, v in {'(1 + √5)/4': (1 + math.sqrt(5)) / 4, '(√5 − 1)/4': (math.sqrt(5) - 1) / 4, '(1 + √5)/2': (1 + math.sqrt(5)) / 2, '(√5)/4': math.sqrt(5) / 4}.items() if math.isclose(v, math.cos(math.radians(36)))][0]"
    hints:
      - △ABC と △BCD の角の大きさを調べましょう。どんな関係があるでしょう。
      - BC = x とおくと、BD、AD、CD はどう表せるでしょう（二等辺三角形をさがしましょう）。
      - 相似から x の 2 次方程式をつくり、x がわかったら △ABC で余弦定理を使いましょう。
    paths:
      - ["∠B = ∠C = 72°、∠DBC = 36° なので △ABC ∽ △BCD", "BC = BD = AD = x、CD = 1 − x", "AB:BC = BC:CD から x² + x − 1 = 0 で x = (√5 − 1)/2", "余弦定理 x² = 1 + 1 − 2cos 36° より cos 36° = (2 − x²)/2 = (1 + x)/2 = (1 + √5)/4"]
      - ["AD = BD なので D から AB にひいた垂線は AB を 2 等分する", "cos 36° = (1/2) ÷ x = 1/(√5 − 1) = (√5 + 1)/4"]
    note: 補助線（角の二等分線）でできる 2 つの二等辺三角形に気づき、相似（G-020）、2 次方程式（A-017）、余弦定理をつなぐ。x² = 1 − x を使うと cos 36° の計算が軽くなる。正五角形の対角線と辺の比（黄金比）につながる。
