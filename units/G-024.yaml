        text: 鈍角の三角比を、半円を使って定めましょう。
        svg: '<svg viewBox="0 0 260 150" xmlns="http://www.w3.org/2000/svg"><line x1="30" y1="118" x2="232" y2="118" stroke="currentColor" fill="none" stroke-width="2"/><path d="M232 118 L224 114 L224 122 Z" fill="currentColor"/><path d="M208 118 A78 78 0 0 0 52 118" stroke="currentColor" fill="none" stroke-width="2"/><line x1="130" y1="118" x2="91" y2="50.5" stroke="currentColor" fill="none" stroke-width="2.5"/><line x1="91" y1="50.5" x2="91" y2="118" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="91" cy="50.5" r="3.5" fill="currentColor"/><text x="85" y="42.5" font-size="13" text-anchor="end">P</text><text x="130" y="133" font-size="12" text-anchor="middle">O</text><text x="212" y="133" font-size="12" text-anchor="middle">A</text><path d="M148 118 A18 18 0 0 0 121 102.4" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="152" y="96" font-size="13" text-anchor="start">θ</text><text x="120.5" y="86.2" font-size="13" text-anchor="middle"><tspan font-style="italic">r</tspan></text><text x="110.5" y="133" font-size="13" text-anchor="middle"><tspan font-style="italic">x</tspan></text><text x="81" y="88.2" font-size="13" text-anchor="middle"><tspan font-style="italic">y</tspan></text></svg>'
        explain: 点 O を中心とする半径 r の半円をかき、右のはしを A とします。半円の上に点 P をとり、∠AOP = θ とします。P から直線 OA にひいた垂線の足の、O からの位置を x（O より右なら正の数、左なら負の数）、P の高さを y とします。このとき、sin θ = y/r、cos θ = x/r、tan θ = y/x と定めます（θ = 90° のときは x = 0 なので、tan 90° は定めません）。θ が鋭角なら、直角三角形で定めた三角比と同じです。θ = 120° のとき、∠POA の外側の角が 60° なので、r = 2 とすると x = −1、y = √3 で、sin 120° = (√3)/2、cos 120° = −1/2、tan 120° = −√3 です。O を通り OA に垂直な直線について P と対称な点を P′ とすると、∠AOP′ = 180° − θ で、高さは同じ、横の位置は符号だけが変わります。よって sin(180° − θ) = sin θ、cos(180° − θ) = −cos θ、tan(180° − θ) = −tan θ です。θ = 0° では P が A に重なるので sin 0° = 0、cos 0° = 1、tan 0° = 0、θ = 90° では sin 90° = 1、cos 90° = 0、θ = 180° では sin 180° = 0、cos 180° = −1、tan 180° = 0 です。0° ≦ θ ≦ 180° では sin θ は 0 以上で、θ が鈍角なら cos θ と tan θ は負の数になります。x² + y² = r²（三平方の定理）なので、sin²θ + cos²θ = 1 は鈍角でも成り立ちます。
