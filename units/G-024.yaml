      - part: 見本
        id: "cfd454f307"
        text: 半径 r の半円の上に点 P をとり、∠AOP = θ とします。P の横の位置 x（O より左は負の数）と高さ y を使って、鈍角でも sin θ = y/r、cos θ = x/r、tan θ = y/x と決めます。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="4" y1="170" x2="232" y2="170" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="240,170 232,174.4 232,165.6" fill="currentColor" stroke="none"/><path d="M216 170 A98 98 0 0 0 20 170" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="118" cy="170" r="3" fill="currentColor"/><text x="118" y="188" font-size="15" text-anchor="middle">O</text><circle cx="216" cy="170" r="3" fill="currentColor"/><text x="216" y="188" font-size="15" text-anchor="middle">A</text><path d="M118 170 L140 170 A22 22 0 0 0 106.3 151.3 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M140 170 A22 22 0 0 0 106.3 151.3" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="118" y1="170" x2="66.1" y2="170" stroke="#2f80c8" stroke-width="5" stroke-linecap="round"/><line x1="66.1" y1="86.9" x2="66.1" y2="170" stroke="#d9534f" stroke-width="4" stroke-linecap="round"/><line x1="118" y1="170" x2="66.1" y2="86.9" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><polyline points="66.1,162 74.1,162 74.1,170" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="66.1" cy="86.9" r="4" fill="currentColor"/><text x="58.1" y="78.9" font-size="15" text-anchor="end">P</text><text x="148" y="146" font-size="15" text-anchor="start">θ</text><text x="58.1" y="133.4" font-size="16" text-anchor="end" fill="#d9534f" font-weight="bold" font-style="italic">y</text><text x="92" y="188" font-size="16" text-anchor="middle" fill="#2f80c8" font-weight="bold" font-style="italic">x</text><text x="102" y="126.4" font-size="16" text-anchor="start" font-weight="bold" font-style="italic">r</text><text x="312" y="36" font-size="16" text-anchor="end">sin θ = <tspan fill="#d9534f" font-weight="bold">y</tspan>/r</text><text x="312" y="60" font-size="16" text-anchor="end">cos θ = <tspan fill="#2f80c8" font-weight="bold">x</tspan>/r</text><text x="312" y="84" font-size="16" text-anchor="end">tan θ = <tspan fill="#d9534f" font-weight="bold">y</tspan>/<tspan fill="#2f80c8" font-weight="bold">x</tspan></text><text x="312" y="116" font-size="13" text-anchor="end" fill="#2f80c8">P が O より左なら</text><text x="312" y="134" font-size="13" text-anchor="end" fill="#2f80c8">x は負の数</text></svg>'
        explain: 点 O を中心とする半径 r の半円をかき、右のはしを A とします。半円の上に点 P をとり、∠AOP = θ とします。P から直線 OA にひいた垂線の足の、O からの位置を x（O より右なら正の数、左なら負の数）、P の高さを y とします。このとき、sin θ = y/r、cos θ = x/r、tan θ = y/x と定めます（θ = 90° のときは x = 0 なので、tan 90° は定めません）。θ が鋭角なら、直角三角形で定めた三角比と同じです。θ = 120° のとき、∠POA の外側の角が 60° なので、r = 2 とすると x = −1、y = √3 で、sin 120° = (√3)/2、cos 120° = −1/2、tan 120° = −√3 です。O を通り OA に垂直な直線について P と対称な点を P′ とすると、∠AOP′ = 180° − θ で、高さは同じで、横の位置は正と負が入れかわります。よって sin(180° − θ) = sin θ、cos(180° − θ) = −cos θ、tan(180° − θ) = −tan θ です。θ = 0° では P が A に重なるので sin 0° = 0、cos 0° = 1、tan 0° = 0、θ = 90° では sin 90° = 1、cos 90° = 0、θ = 180° では sin 180° = 0、cos 180° = −1、tan 180° = 0 です。0° ≦ θ ≦ 180° では sin θ は 0 以上で、θ が鈍角なら cos θ と tan θ は負の数になります。x² + y² = r²（三平方の定理）なので、sin²θ + cos²θ = 1 は鈍角でも成り立ちます。
