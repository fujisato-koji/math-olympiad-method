# G-024 三角比と正弦・余弦定理
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019 と G-019 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜5 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# 地図に plan がないので、既定の並び（導入・練習 4 日・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 鋭角の三角比（直角三角形の辺の比。相似なので角だけで決まる）、30°・45°・60° の値、辺を求める
#   2 日目 相互関係（sin²θ + cos²θ = 1、tan θ = sin θ/cos θ、1 + tan²θ = 1/cos²θ）と 90° − θ
#   3 日目 0°〜180° の三角比（半円の上の点で定める）、180° − θ、sin θ = 1/2 のような θ を求める
#   4 日目 正弦定理と外接円の半径、三角形の面積 S = (1/2)bc sin A　5 日目 余弦定理（辺を求める、3 辺から角、鋭角か鈍角か）
#   6 日目 わけ（sin²θ + cos²θ = 1、余弦定理、正弦定理。どれも ③）　7 日目 G-019・G-020・G-018・G-017 と混ぜる（高さの測量、
#   円に内接する三角形、平行四辺形の対角線、角の二等分線を面積で）　8 日目 確認
# 前提は G-019（三平方の定理）、G-020（相似）、G-018（円周角の定理）。前提のたどりに A-016（平方根と有理化）、A-017（2 次方程式）、
#   A-015（展開）、G-017（二等辺三角形と平行四辺形）、G-016（平行線と角）がある。
#   座標平面（G-050、A-006）は前提のたどりにないので、鈍角の三角比は「半円の上の点 P の、O からの横の位置 x（右を正、左を負）と高さ y」で
#   定めた（負の数は N-027 まで済んでいる）。単位円と一般角、弧度法は G-025 で扱うので、角は度だけを使い、0° ≦ θ ≦ 180° に限った。
#   加法定理（G-025）は使わない（sin 75° のような値が要らないように、向かい合う辺と角の組を選ばせる）。
#   内接四角形の性質（G-023）とヘロンの公式は前提にないので日の問題では使わない（正弦定理のわけの鈍角の場合は注で触れるだけ）。
#   角の二等分線の定理（G-042）も前提にないので、二等分線の長さは面積の和で求めた。
# 角の大きさの答えは選ぶ問題にした（段 5 の決まり）。√ を含む答えも選ぶ問題にし、check は選択肢ごとの値（math.sqrt）が
#   問題の量（math.sin、math.cos で計算した値）と近い（math.isclose）ものを選び出す。打つ答えは Fraction で計算する。
#   θ を求める問題の check は、0°〜180° の整数の角で条件を満たすものの集まりと、選択肢の角の集まりをくらべる。
# 「√3/2」は画面で 3/2 だけが上下に重なり √(3/2) に見えるので、「(√3)/2」のように √ をかっこでくくって書いた（D-042 のかっこの決まり）。
# 図は svg（D-040）。三角形は問題の長さと角のとおりに描き、求める辺や角の値は図に書かない。直角のしるしは直角とわかっている角だけ。
# 三角比は、ベクトルの内積（G-027）、三角関数と加法定理（G-025）、測量と天体の距離、力の分解（P-002）、交流と波の計算の入口になる（D-026）。

id: G-024
days:
  - day: 1
    items:
      - part: 見本
        text: 直角三角形 ABC（∠C = 90°）で、∠A = θ とします。辺の長さの比で、角 θ の大きさを表してみましょう。
        svg: '<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><polygon points="54.7,124 185.3,124 185.3,26" stroke="none" fill="#f3c969" fill-opacity=".35"/><polygon points="54.7,124 185.3,124 185.3,26" stroke="currentColor" fill="none" stroke-width="2"/><polyline points="176.3,124 176.3,115 185.3,115" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M67.5 114.4 A16 16 0 0 1 70.7 124" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="84.7" y="118" font-size="12" text-anchor="middle">θ</text><text x="113.4" y="70.2" font-size="12" text-anchor="end">5</text><text x="196.3" y="79" font-size="12" text-anchor="start">3</text><text x="120" y="139" font-size="12" text-anchor="middle">4</text><text x="43.4" y="132.7" font-size="13" text-anchor="middle">A</text><text x="194.9" y="135.7" font-size="13" text-anchor="middle">C</text><text x="192" y="20.5" font-size="13" text-anchor="middle">B</text></svg>'
        explain: ∠C = 90° の直角三角形で ∠A = θ と決めると、2 つの角が等しいので、どの大きさの三角形も相似です（G-020）。だから、辺の長さの比は θ だけで決まります。斜辺 AB、A と向かい合う辺 BC、A のとなりの辺 AC を使って、sin θ = BC/AB、cos θ = AC/AB、tan θ = BC/AC と定めます。これらをまとめて三角比といい、sin をサイン（正弦）、cos をコサイン（余弦）、tan をタンジェント（正接）と読みます。図の三角形では、sin θ = 3/5、cos θ = 4/5、tan θ = 3/4 です。直角二等辺三角形（辺の比 1:1:√2）から sin 45° = cos 45° = 1/√2、tan 45° = 1、30°・60°・90° の直角三角形（辺の比 1:2:√3）から sin 30° = 1/2、cos 30° = (√3)/2、tan 30° = 1/√3、sin 60° = (√3)/2、cos 60° = 1/2、tan 60° = √3 です。式を変形すると BC = AB sin θ、AC = AB cos θ、BC = AC tan θ で、斜辺と角から ほかの辺が求められます。
      - part: 思い出す
        text: 直角三角形で、直角をはさむ 2 辺の長さが 5 と 12 のとき、斜辺の長さはいくつですか。
        answer: 13
        check: "[c for c in range(1, 100) if c * c == 5 * 5 + 12 * 12][0]"
        hints:
          - 三平方の定理を使いましょう（G-019）。
          - 5² + 12² を計算しましょう。
          - 2 乗すると その数になる正の数をさがしましょう。
        paths:
          - ["5² + 12² = 25 + 144 = 169", "13² = 169", "斜辺は 13"]
      - part: 思い出す
        text: △ABC ∽ △DEF で、AB = 6、BC = 10、DE = 9 です。EF の長さはいくつですか。
        answer: 15
        check: "Fraction(10 * 9, 6)"
        hints:
          - 相似な図形では、対応する辺の比が等しくなります（G-020）。
          - AB と DE、BC と EF が対応します。
          - DE は AB の何倍でしょう。
        paths:
          - ["DE は AB の 9/6 = 3/2 倍", "EF = 10 × 3/2 = 15"]
      - part: 今日
        text: 図の直角三角形 ABC で、sin A の値はいくつですか。
