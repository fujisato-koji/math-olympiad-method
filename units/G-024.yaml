      - part: 挑戦
        text: 直角三角形 ABC（∠C = 90°）で、AB = 20、cos A = 3/5 です。この三角形の面積はいくつですか。
        svg: '<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><polygon points="83.2,124 156.8,124 156.8,26" stroke="none" fill="#f3c969" fill-opacity=".35"/><polygon points="83.2,124 156.8,124 156.8,26" stroke="currentColor" fill="none" stroke-width="2"/><polyline points="147.8,124 147.8,115 156.8,115" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="111.2" y="72.4" font-size="12" text-anchor="end">20</text><text x="73.3" y="135.2" font-size="13" text-anchor="middle">A</text><text x="163.9" y="138.1" font-size="13" text-anchor="middle">C</text><text x="161" y="19.3" font-size="13" text-anchor="middle">B</text></svg>'
        answer: 96
        check: "(lambda ac: ac * [b for b in range(1, 40) if b * b + ac * ac == 400][0] / 2)(20 * Fraction(3, 5))"
