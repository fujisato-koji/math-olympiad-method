        note: cos A と取り違えて 15/17 としやすい。斜辺がどれかを最初に決めさせる。
      - part: 今日
        text: 図の直角三角形 ABC で、tan B の値はいくつですか。
        svg: '<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg"><polygon points="99.6,26 99.6,124 140.4,124" stroke="none" fill="#f3c969" fill-opacity=".35"/><polygon points="99.6,26 99.6,124 140.4,124" stroke="currentColor" fill="none" stroke-width="2"/><polyline points="99.6,115 108.6,115 108.6,124" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="130.2" y="74.8" font-size="12" text-anchor="start">13</text><text x="120" y="139" font-size="12" text-anchor="middle">5</text><text x="88.6" y="79" font-size="12" text-anchor="end">12</text><text x="97.1" y="18.8" font-size="13" text-anchor="middle">A</text><text x="95" y="139.6" font-size="13" text-anchor="middle">C</text><text x="148.1" y="137.7" font-size="13" text-anchor="middle">B</text></svg>'
        answer: 12/5
        check: "Fraction(12, 5)"
        hints:
          - tan B は、(B と向かい合う辺) ÷ (B のとなりの辺) です。となりの辺は、斜辺でないほうです。
          - B と向かい合う辺は、B を通らない辺です。
          - 角 B から見ると、角 A から見るときと、向かい合う辺ととなりの辺が入れかわります。
        paths:
