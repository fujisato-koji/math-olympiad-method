        text: 0° ≦ θ ≦ 180° のどの θ でも、sin²θ + cos²θ = 1 が成り立ちます。このわけを、半円を使った三角比の定め方から、筋道を立てて書きましょう。
        explain: 例：「半径 r の半円の上の点 P で ∠AOP = θ とし、P の横の位置を x、高さを y とする。定め方から sin θ = y/r、cos θ = x/r である。P から直線 OA にひいた垂線の足を H とすると、OH は x の大きさ、PH = y、OP = r の直角三角形 OPH ができ、三平方の定理（G-019）から x² + y² = r² である（x が負の数でも、2 乗すれば OH² と等しい）。両辺を r² でわると (x/r)² + (y/r)² = 1、すなわち cos²θ + sin²θ = 1 である。θ = 0°、90°、180° のときは直角三角形ができないが、P は A、真上、左のはしにあり、x² + y² = r² はそのまま成り立つ。」と書ければよい。①「〜とする」で r、θ、x、y を決める、② x² + y² = r² の両辺を r² でわって式を変形する、③ 約束した事実（三角比の定め方、三平方の定理）で結ぶ、の 3 つがそろっているかを見る。30° や 120° で確かめただけで終わっていたら、例ではすべての θ を示せないことを話す。鈍角で x が負の数でも、2 乗すれば正になることに気づいているかを見る。
        hints:
          - 「半径 r の半円の上に P をとり、∠AOP = θ とする」から書き始めましょう。
          - P の横の位置 x、高さ y、半径 r の間には、どんな関係があるでしょう。
          - sin θ と cos θ を x、y、r で表し、2 乗して足しましょう。
        paths:
