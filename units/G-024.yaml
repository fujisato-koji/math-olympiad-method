        text: A が鋭角の △ABC で、外接円の半径を R とすると、a/sin A = 2R（正弦定理）が成り立ちます。外接円の中心を O とし、図のように B を通る直径 BD をひきます（D は直線 BC について A と同じ側にあります）。このわけを、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><circle cx="160" cy="100" r="76" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="160" cy="100" r="2.8" fill="currentColor"/><text x="166" y="118" font-size="14" text-anchor="start">O</text><polygon points="173.2,25.2 103.5,150.9 216.5,150.9" fill="#f3c969" fill-opacity="0.35" stroke="none"/><polygon points="173.2,25.2 103.5,150.9 216.5,150.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="175.6" y="16.4" font-size="15" text-anchor="middle">A</text><text x="93.1" y="165.2" font-size="15" text-anchor="middle">B</text><text x="226.9" y="165.2" font-size="15" text-anchor="middle">C</text><line x1="103.5" y1="150.9" x2="216.5" y2="49.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="216.5" y1="150.9" x2="216.5" y2="49.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text x="226.5" y="45.1" font-size="15" text-anchor="start">D</text><path d="M173.2 25.2 L164.5 40.9 A18 18 0 0 0 179.1 42.2 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M164.5 40.9 A18 18 0 0 0 179.1 42.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M216.5 49.1 L203.1 61.2 A18 18 0 0 0 216.5 67.1 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M203.1 61.2 A18 18 0 0 0 216.5 67.1" fill="none" stroke="currentColor" stroke-width="1.5"/><polyline points="207.5,150.9 207.5,141.9 216.5,141.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><text x="160" y="168.9" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic">a</text></svg>'
        explain: 例：「∠BDC と ∠BAC は、同じ弧 BC に対する円周角なので、∠BDC = ∠BAC = A である（円周角の定理、G-018）。BD は直径なので、半円の弧に対する円周角 ∠BCD = 90° である（G-018）。直角三角形 BCD で、三角比の定め方から sin ∠BDC = BC/BD、つまり sin A = a/(2R)。両辺に 2R をかけて sin A でわると、a/sin A = 2R である。」と書ければよい。① D を決め、∠BDC と ∠BCD の大きさを示す、② sin の式を変形する、③ 約束した事実（円周角の定理、半円の弧に対する円周角は 90°、三角比の定め方）で結ぶ、の 3 つを見る。BC が直径のとき（A = 90°）は sin A = 1 で、a = 2R がそのまま成り立つ。A が鈍角のときは D が A と反対側に来て ∠BDC = 180° − A になるが、sin(180° − A) = sin A なので同じ式になる（円に内接する四角形の向かい合う角の和が 180° であることを使う。G-023）。b/sin B、c/sin C も、同じすじ道で 2R に等しい。
