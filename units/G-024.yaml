        text: △ABC の角 A、B、C と向かい合う辺の長さを a、b、c（同じ色）とし、外接円（3 つの頂点を通る円）の半径を R とします。a/sin A = b/sin B = c/sin C = 2R（正弦定理）、面積は S = (1/2)bc sin A です。
