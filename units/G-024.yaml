      - part: 見本
        id: "f16926e8d2"
        text: 斜辺が 1 の直角三角形では、θ と向かい合う辺が sin θ、となりの辺が cos θ になります。三平方の定理から sin²θ + cos²θ = 1、辺の比から tan θ = sin θ/cos θ です。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="22,147.4 158,147.4 158,48.6" fill="#f3c969" fill-opacity="0.35" stroke="none"/><path d="M22 147.4 L48 147.4 A26 26 0 0 0 43 132.1 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M48 147.4 A26 26 0 0 0 43 132.1" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="60" y="139.9" font-size="14" text-anchor="middle">θ</text><path d="M158 48.6 L145.1 58 A16 16 0 0 0 158 64.6 Z" fill="#7bc96f" fill-opacity="0.75" stroke="none"/><path d="M145.1 58 A16 16 0 0 0 158 64.6" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="22,147.4 158,147.4 158,48.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="22" y1="147.4" x2="158" y2="48.6" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><line x1="158" y1="48.6" x2="158" y2="147.4" stroke="#d9534f" stroke-width="4" stroke-linecap="round"/><line x1="158" y1="147.4" x2="22" y2="147.4" stroke="#2f80c8" stroke-width="4" stroke-linecap="round"/><polyline points="148,147.4 148,137.4 158,137.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><text x="9.8" y="157.1" font-size="15" text-anchor="middle">A</text><text x="168.5" y="160.3" font-size="15" text-anchor="middle">C</text><text x="165.4" y="43.1" font-size="15" text-anchor="middle">B</text><text x="84.7" y="91.1" font-size="16" text-anchor="end" font-weight="bold">1</text><text x="167" y="103" font-size="15" text-anchor="start" fill="#d9534f" font-weight="bold">sin θ</text><text x="90" y="167.4" font-size="15" text-anchor="middle" fill="#2f80c8" font-weight="bold">cos θ</text><text x="144" y="52.6" font-size="13" text-anchor="end">90° − θ</text><text x="312" y="40" font-size="13" text-anchor="end">三平方の定理から</text><text x="312" y="64" font-size="16" text-anchor="end"><tspan fill="#d9534f" font-weight="bold">sin</tspan>²θ + <tspan fill="#2f80c8" font-weight="bold">cos</tspan>²θ = 1</text><text x="312" y="118" font-size="13" text-anchor="end">辺の比から</text><text x="312" y="142" font-size="16" text-anchor="end">tan θ = <tspan fill="#d9534f" font-weight="bold">sin θ</tspan>/<tspan fill="#2f80c8" font-weight="bold">cos θ</tspan></text></svg>'
        explain: 斜辺の長さが 1 の直角三角形 ABC（∠C = 90°、∠A = θ）では、BC = sin θ、AC = cos θ です。三平方の定理から BC² + AC² = AB² なので、(sin θ)² + (cos θ)² = 1 です。(sin θ)² を sin²θ と書いて、sin²θ + cos²θ = 1 と表します。また、tan θ = BC ÷ AC なので、tan θ = sin θ/cos θ です。sin²θ + cos²θ = 1 の両辺を cos²θ でわると、tan²θ + 1 = 1/cos²θ になります。さらに、∠B = 90° − θ で、角 B から見ると向かい合う辺ととなりの辺が入れかわるので、sin(90° − θ) = cos θ、cos(90° − θ) = sin θ、tan(90° − θ) = 1/tan θ です。例：θ が鋭角で sin θ = 3/5 のとき、cos²θ = 1 − 9/25 = 16/25 で、cos θ は正の数なので cos θ = 4/5、tan θ = (3/5) ÷ (4/5) = 3/4 です。1 つの三角比がわかれば、残りの 2 つが求められます。
