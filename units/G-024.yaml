        text: A が鋭角の △ABC で、a² = b² + c² − 2bc cos A（余弦定理）が成り立ちます。このわけを、C から直線 AB にひいた垂線 CH を使って、すじ道を立てて書きましょう。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><polygon points="46.1,156 273.9,156 139.9,22" fill="#f3c969" fill-opacity="0.35" stroke="none"/><path d="M46.1 156 L68.1 156 A22 22 0 0 0 58.7 138 Z" fill="#b39ddb" fill-opacity="0.75" stroke="none"/><path d="M68.1 156 A22 22 0 0 0 58.7 138" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="78" y="144.3" font-size="14" text-anchor="middle">A</text><polygon points="46.1,156 273.9,156 139.9,22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="200" y="177" font-size="16" text-anchor="middle">c</text><text x="85.6" y="85.8" font-size="16" text-anchor="end">b</text><text x="213.3" y="83.7" font-size="16" text-anchor="start">a</text><text x="34.1" y="166.2" font-size="15" text-anchor="middle">A</text><text x="286.1" y="165.8" font-size="15" text-anchor="middle">B</text><text x="138" y="14.4" font-size="15" text-anchor="middle">C</text><line x1="139.9" y1="22" x2="139.9" y2="156" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="139.9,148 147.9,148 147.9,156" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><text x="139.9" y="173" font-size="15" text-anchor="middle">H</text></svg>'
        explain: 例：「C から直線 AB にひいた垂線の足を H とする。直角三角形 ACH で、三角比の定め方から CH = b sin A、AH = b cos A である。H が辺 AB の上にあるとき BH = c − b cos A、H が B の外側にあるとき BH = b cos A − c で、どちらでも BH² = (c − b cos A)² である。直角三角形 BCH で三平方の定理から、a² = CH² + BH² = b²sin²A + c² − 2bc cos A + b²cos²A = b²(sin²A + cos²A) + c² − 2bc cos A。sin²A + cos²A = 1 なので、a² = b² + c² − 2bc cos A である。」と書ければよい。① H を決め、CH と AH を b と A で表す、② a² を展開して式を変形する（b² でくくる）、③ 約束した事実（三角比の定め方、三平方の定理、sin²A + cos²A = 1）で結ぶ、の 3 つを見る。A が鈍角のときは H が A の外側に出て AH = b cos(180° − A) = −b cos A となり、BH = c − b cos A は同じ式になるので、同じすじ道で成り立つことにもふれる。A = 90° なら cos A = 0 で、三平方の定理そのものになる。
        hints:
