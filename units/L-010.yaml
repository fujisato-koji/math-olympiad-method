    kinds: [道筋]
    text: たて 5 だん、横 4 れつのマス目の左下のマスにコマ（🔵）があります。2 人が交代で、コマを「右へ 1 マス」「上へ 1 マス」「右上へ 1 マス（ななめ）」のどれかで動かします。右上のすみ（🏁）にコマを動かした人の勝ちです。あなたが先です。勝つには、最初にどう動かせばよいですか。
    figure: "⬜⬜⬜🏁\n⬜⬜⬜⬜\n⬜⬜⬜⬜\n⬜⬜⬜⬜\n🔵⬜⬜⬜"
    choices: [右へ 1 マス, 上へ 1 マス, 右上へ 1 マス]
    answer: 右へ 1 マス
    check: "(lambda W: (lambda c: c[0] if len(c) == 1 else 'きまらない')([t for t, a, b in [('右へ 1 マス', 1, 0), ('上へ 1 マス', 0, 1), ('右上へ 1 マス', 1, 1)] if not W(W, 3 - a, 4 - b)]))(lambda f, x, y: any(not f(f, x - a, y - b) for a, b in [(1, 0), (0, 1), (1, 1)] if a <= x and b <= y))"
    hints:
      - 🏁 から後ろへ、マスごとに ⭕（そこで自分の番なら勝てる）と ❌ を書いていきましょう。
      - 🏁 のすぐ左、すぐ下、ななめ左下のマスは ⭕ ですか、❌ ですか。その次はどうですか。
      - コマを ❌ のマスに動かせば勝てます。
    paths:
      - [🏁 から後ろへ ⭕ と ❌ の表を作る, ❌ は 🏁 から右へも上へも 0・2・4 マスはなれたマス, 右へ 1 マスで 🏁 から右へ 2、上へ 4 の ❌ に動かす, 右へ 1 マス]
    note: 1 列の表（のこりの数）を、マス目の表に広げる。🏁 から数えて、右へも上へも偶数マスはなれたマスが ❌ になる。後ろから表を作る方法は同じだが、表が 2 つの向きに広がるのが離の要点。
