    paths:
    - - 自分の番のとき、のこりの数と、相手が前に取った数（さいしょは「なし」）の 2 つで勝ち負けが決まる。この 2 つの組ごとに、勝てる（⭕）か勝てない（❌）かを、のこり 0 こから後ろへ順に調べる
      - のこり 0 こは取れないので、どの場合も ❌。のこり m このときは、取れる数 k（k は 1、3、4 のうち、のこり以下で、前に相手が取った数とちがうもの）のうち、k を取ってできる（のこり m − k こ、前が k）の組が ❌ になるものが 1 つでもあれば ⭕。表にすると（のこり 0 こから 10 こ）、前なし：❌⭕⭕⭕⭕❌⭕⭕⭕⭕❌、前が 1：❌❌❌⭕⭕❌❌❌⭕⭕❌、前が 3：前なしと同じ、前が 4：❌⭕⭕⭕❌❌⭕⭕⭕❌❌
      - のこり 5 こから 9 この列が、のこり 0 こから 4 この列と同じになる。のこり m の列は、のこり m − 1、m − 3、m − 4 の列だけで決まるので、4 つの列が同じなら、このあとも 5 こずつくり返す。だから、勝ち負けは、のこりを 5 でわったあまりで決まる
      - 2027 を 5 でわると 405 あまり 2。1 こ取ると、のこり 2026 こ（あまり 1）で、前が 1。表で「前が 1、あまり 1」は ❌ なので、相手は勝てない。3 こ取ると、のこり 2024 こ（あまり 4）で前が 3。表で「前が 3、あまり 4」は ⭕ で、相手が勝つ。4 こ取ると、のこり 2023 こ（あまり 3）で前が 4。表で「前が 4、あまり 3」は ⭕ で、相手が勝つ。だから 1 こ
    - - 小さい数で調べると、相手にわたすと相手が負ける形は、（のこりを 5 でわったあまり、前）で（1、1）、（2、1）、（0、4）の 3 つが見つかる。先に 1 こ取ると、のこり 2026 こで、5 でわったあまりは 1。いま取った数を「前」とし、（あまり、前）の組で書く。（1、1）をアとする。ほかに（2、1）をイ、（0、4）をウとする。相手の番にア、イ、ウのどれかをわたせば、相手が何を取っても、こちらはア、イ、ウのどれかを相手にわたせることをたしかめる
      - アでは、相手は 1 を取れない。相手が 3 なら、こちらは 1 を返してイ。相手が 4 なら、こちらは 1 を返してア。イでは、相手は 1 を取れない。相手が 3 なら、こちらは 4 を返してウ。相手が 4 なら、こちらは 1 を返してイ。ウでは、相手は 4 を取れない。相手が 1 なら、こちらは 4 を返してウ。相手が 3 なら、こちらは 1 を返してア。つまり、相手の 1 には 4、4 には 1、3 には 1 で返す。ただし、イで相手が 3 を取ったときだけは 4 を返す
      - 返す数が足りなくなることはない。どの場合も、相手が取ったあとののこりを 5 でわったあまりは、返す数以上だから（アで 3 のあと：あまり 3 で 1、4 のあと：あまり 2 で 1。イで 3 のあと：あまり 4 で 4、4 のあと：あまり 3 で 1。ウで 1 のあと：あまり 4 で 4、3 のあと：あまり 2 で 1）。取った数が相手と同じになることもない
      - のこりはへっていき、相手の番でアは 1 こ、イは 2 こ、ウは 0 このときに、相手が取れなくなる（アで 1 こ：1 は前と同じで取れず、3、4 は多すぎる。イで 2 こ：同じ。ウで 0 こ）。こちらはかならず返せるので、こちらが先に取れなくなることはなく、勝てる
      - 3 こ取ると、のこり 2024 こ（あまり 4）、前が 3 で、相手が 4 を取るとウ（0、4）がこちらの番にまわってくる。4 こ取ると、のこり 2023 こ（あまり 3）、前が 4 で、相手が 1 を取るとイ（2、1）がこちらの番にまわってくる。ア、イ、ウをわたされた人は、上の返し方を相手に使われて、負けてしまう。だから、勝てるのは 1 こ
    note: 考えどころは 3 つ：①「のこりの数」と「直前に相手が取った数（なし、1、3、4）」の組を状態にする、②後ろから 4 行（直前なし、1、3、4）の表を作り、のこり 5 こずつのくり返しを見つける（のこり m の列は m − 1、m − 3、m − 4 の列で決まるので、4 列が同じになれば、そのあともくり返す）、③2027 を 5 でわったあまり 2 に当てはめ、1、3、4 の 3 つの取り方をくらべる。2 本目は、表を作らず、相手に わたす 3 つの形（あまり、前）= （1、1）（2、1）（0、4）を決め、相手の 1 には 4、4 には 1、3 には 1 で返す（ただし形イで相手が 3 のときだけ 4 を返す、という例外のある返し方）で、かならず返せることを調べる道。取れる数のきまり（直前と同じ数は取れない）がないと、1、3、4 を取るゲームは 7 ずつのくり返しになり、2027 = 7 × 289 + 4 から「4 こ取る」と答えてしまうわなになる。check は、ゲームの表を後ろから全部作る式で、のこり 0 こから 2027 こまで、直前の数 4 通り（なし、1、3、4）の勝ち負けを、前の 4 列から順に計算する（itertools.accumulate と lambda）。そのあと、さいしょに 1、3、4 を取ってできる状態が相手の負けになるものを数え、ちょうど 1 つのときだけその数を返す（0 こか 2 つ以上なら −1）ので、答えが 1 つに決まることも確かめられる。みちすじの 5 のくり返しは使っていない。似た既出（取れる数が決まっているだけのゲーム、1 こか 3 こなど）とのちがい：そちらはのこりの数だけで表が 1 行ですむが、ここは直前の数も状態に入るので 4 行になり、勝ち負けの表からくり返しを見つける段がふえる。
