# G-009 角度
#
# 書き方は N-001 の頭の注のとおり。
# 角の大きさは、2 つの辺の開きぐあい。直角を 90 に等しく分けた 1 つ分が 1 度（1°）。辺の長さには関係しない。
# 図は svg（D-040）で、角は本当の大きさで描いた（三角形と四角形は、決めた角から頂点を計算した）。わからない角は あ、い。
#   分度器の図は、右の 0 から左の 180 へ 1 つの目もりだけをかき、10° ごとの目もり、30° ごとの数字にした。
#   本物の分度器には内と外の 2 つの目もりがあるので、どちらの 0 から読むかは、実物で一緒に確かめる。
# 前提の数は N-009（1000 まで）。角は 5° きざみにし、3 けたのひき算は 180 − 35、360 − 120 − 125 のような形にした。
#   わり算は N-014 の九九の範囲と、何十 ÷ 1 けた（180 ÷ 3 は 18 ÷ 3 = 6 の 10 こ分）まで。
# 三角形の角の和 180° は、3 日目の見本で「3 つの角を切って集めると一直線」と見せ、4 日目のわけで文に書く（代表の例）。
#   どんな三角形でも一直線になるわけ（平行線の錯角・同位角）は G-016 で扱うので、ここでは使わない。
#   二等辺三角形の性質は G-017 で扱うので、「2 つの角が等しい三角形」と問題文で言うだけにした。外角の性質も名前は出さない。
# 時計の針の角度は N-059（時刻）が前提にないので扱わない。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 角の大きさと度、分度器　2 日目 一直線・1 回転・三角定規の角の計算　3 日目 三角形と四角形の角の和
#   4 日目 わけ（三角形 180°、四角形 360°、90° より大きい角は 2 つない）　5 日目 G-006（直角、長方形、正方形）・N-014 と混ぜる　6 日目 確認
# check：角の計算の式。分度器は「数字の目もり + 10° の目もりの数」の式。角の大きさが辺の長さによらないことを選ぶ問題は約束ごとなので check を付けない。

id: G-009
days:
  - day: 1
    items:
      - part: 見本
        text: 角の大きさを、数で表そう。
        svg: '<svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><line x1="77.6" y1="122" x2="165.6" y2="122" stroke="currentColor" stroke-width="2" fill="none"/><line x1="77.6" y1="122" x2="77.6" y2="34" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="77.6" cy="122" r="2.5" fill="currentColor"/><polyline points="88.6,122 88.6,111 77.6,111" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>'
        explain: 角の大きさは、2 つの辺の開きぐあいです。直角を 90 に等しく分けた 1 つ分の大きさを 1 度といい、1° と書きます。直角は 90° です。角の大きさは分度器で測ります。分度器の中心を角の頂点に、0 の線を 1 つの辺に合わせて、もう 1 つの辺が通る目もりを読みます。辺を長くかいても、角の大きさは変わりません。
      - part: 思い出す
        text: 長方形には、直角のかどがいくつありますか。
        choices: [2 つ, 3 つ, 4 つ]
        answer: 4 つ
        hints:
          - 長方形のかどを、1 つずつ見よう。
          - 長方形のかどは、どれも同じ形かな。
          - 直角のかどを数えよう。
        paths:
          - [長方形のかどは 4 つ, どれも直角, 4 つ]
      - part: 思い出す
        text: 90 + 90 はいくつですか。
        answer: 180
        check: "90 + 90"
        hints:
          - 90 は 10 が 9 こだね。
          - 10 が 9 こと 9 こで、10 が何こになるかな。
          - 10 が 18 こは、いくつかな。
        paths:
          - [10 が 9 + 9 = 18 こ, 180]
      - part: 今日
        text: "45° の角と 45° の角をあわせると、何度になりますか。"
        answer: 90
