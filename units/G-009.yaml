      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="70" r="62" stroke="currentColor" stroke-width="2" fill="none"/><line x1="120" y1="8" x2="120" y2="14" stroke="currentColor" stroke-width="1.5"/><text x="120" y="27" font-size="10" text-anchor="middle">12</text><line x1="151" y1="16.3" x2="148" y2="21.5" stroke="currentColor" stroke-width="1.5"/><text x="143.5" y="33.3" font-size="10" text-anchor="middle">1</text><line x1="173.7" y1="39" x2="168.5" y2="42" stroke="currentColor" stroke-width="1.5"/><text x="160.7" y="50.5" font-size="10" text-anchor="middle">2</text><line x1="182" y1="70" x2="176" y2="70" stroke="currentColor" stroke-width="1.5"/><text x="167" y="74" font-size="10" text-anchor="middle">3</text><line x1="173.7" y1="101" x2="168.5" y2="98" stroke="currentColor" stroke-width="1.5"/><text x="160.7" y="97.5" font-size="10" text-anchor="middle">4</text><line x1="151" y1="123.7" x2="148" y2="118.5" stroke="currentColor" stroke-width="1.5"/><text x="143.5" y="114.7" font-size="10" text-anchor="middle">5</text><line x1="120" y1="132" x2="120" y2="126" stroke="currentColor" stroke-width="1.5"/><text x="120" y="121" font-size="10" text-anchor="middle">6</text><line x1="89" y1="123.7" x2="92" y2="118.5" stroke="currentColor" stroke-width="1.5"/><text x="96.5" y="114.7" font-size="10" text-anchor="middle">7</text><line x1="66.3" y1="101" x2="71.5" y2="98" stroke="currentColor" stroke-width="1.5"/><text x="79.3" y="97.5" font-size="10" text-anchor="middle">8</text><line x1="58" y1="70" x2="64" y2="70" stroke="currentColor" stroke-width="1.5"/><text x="73" y="74" font-size="10" text-anchor="middle">9</text><line x1="66.3" y1="39" x2="71.5" y2="42" stroke="currentColor" stroke-width="1.5"/><text x="79.3" y="50.5" font-size="10" text-anchor="middle">10</text><line x1="89" y1="16.3" x2="92" y2="21.5" stroke="currentColor" stroke-width="1.5"/><text x="96.5" y="33.3" font-size="10" text-anchor="middle">11</text><line x1="120" y1="70" x2="85.4" y2="90" stroke="currentColor" stroke-width="2"/><line x1="120" y1="70" x2="144.4" y2="78.9" stroke="currentColor" stroke-width="3.5"/><circle cx="120" cy="70" r="3" fill="currentColor"/></svg>
    answer: 130
    check: "abs(40 * 6 - (3 * 30 + 40 // 2))"
    hints:
      - となりの数字と数字の間は何度かな。12 から 3 までが直角だよ。
      - 40 分のとき、長いはりはどの数字をさしているかな。
      - 短いはりは、60 分で数字 1 つ分進むよ。40 分ではどれだけ進むかな。
    paths:
      - [数字 1 つ分は 90 ÷ 3 = 30°, 長いはりは 8・短いはりは 3 から 10 分で 5° ずつ進み 40 分で 20°, 3 から 8 までは 30 × 5 = 150°, 150 − 20 = 130°]
    note: 短いはりが 3 の上にあると考えて 150° と答えやすい。短いはりは 60 分で 30° なので、10 分で 5°、40 分で 20° 進んでいる。時刻（N-059）と角度を合わせる問題。
  - part: 離
    kinds: [総動員, 道筋]
    uses: [G-004]
    text: 長方形の紙 ABCD を、辺 AB の上の点 E と辺 BC の上の点 F を結ぶ直線で折ると、頂点 B が点 G に重なりました。角 BEF は 35° です。あの角（角 CFG）は何度ですか。
    svg: |
      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><polygon points="40,20 40,60 82,120 200,120 200,20" stroke="currentColor" stroke-width="2" fill="none"/><polygon points="40,60 96.4,80.5 82,120" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".35"/><line x1="40" y1="60" x2="40" y2="120" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><line x1="40" y1="120" x2="82" y2="120" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><text x="32" y="24" font-size="12" text-anchor="middle">A</text><text x="32" y="124" font-size="12" text-anchor="middle">B</text><text x="208" y="124" font-size="12" text-anchor="middle">C</text><text x="208" y="24" font-size="12" text-anchor="middle">D</text><text x="32" y="64" font-size="12" text-anchor="middle">E</text><text x="82" y="134" font-size="12" text-anchor="middle">F</text><text x="100.4" y="74.5" font-size="12" text-anchor="middle">G</text><text x="48" y="82" font-size="10" text-anchor="middle">35°</text><text x="104" y="114" font-size="12" text-anchor="middle">あ</text></svg>
    answer: 70
    check: "180 - (180 - 90 - 35) * 2"
    hints:
      - 三角形 EBF の 3 つの角のうち、角 B と角 BEF が分かっているね。
      - 折って重なった角は等しいよ。角 EFG は、どの角と同じかな。
      - 点 F のところで、一直線の角は 180° だよ。
    paths:
      - [角 BFE は 180 − 90 − 35 = 55°, 折ったので角 GFE も 55°, 一直線なので あ は 180 − 55 − 55 = 70°, 70°]
    note: 折ると重なる部分の角は等しい（G-004 の折る）ことを、三角形の角の和と一直線の 180° に合わせる。角 BFE を出さずに 35° を 2 倍してしまいやすい。
  - part: 離
    kinds: [手数, 読み取り]
    text: 六角形の 6 つの角のうち、5 つの角の大きさが分かっています。残りの角 あ は何度ですか。
    svg: |
      <svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg"><polygon points="40,128 104.9,128 124.4,86 102.9,39.8 54.7,12 20,53.4" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity=".35"/><text x="49" y="118.1" font-size="12" text-anchor="middle">あ</text><text x="97" y="118.1" font-size="10" text-anchor="middle">115°</text><text x="111.5" y="87" font-size="10" text-anchor="middle">130°</text><text x="95.5" y="52.8" font-size="10" text-anchor="middle">145°</text><text x="59.9" y="32.3" font-size="10" text-anchor="middle">100°</text><text x="34.2" y="62.9" font-size="10" text-anchor="middle">125°</text></svg>
    answer: 105
    check: "180 * 4 - (115 + 130 + 145 + 100 + 125)"
    hints:
      - 1 つの頂点から対角線をひいて、六角形を三角形に分けてみよう。
      - 三角形はいくつできるかな。三角形の 3 つの角の和は 180° だね。
      - 六角形の 6 つの角の和から、分かっている 5 つの角をひこう。
    paths:
      - [1 つの頂点から対角線を 3 本ひくと 三角形が 4 つ, 角の和は 180 × 4 = 720°, 720 − (115 + 130 + 145 + 100 + 125) = 720 − 615 = 105, 105°]
      - [対角線 1 本で 四角形 2 つに分ける, 角の和は 360 + 360 = 720°, 720 − 615 = 105°]
    note: 三角形 180°、四角形 360° から、六角形の角の和を自分で作る（4 日目のわけを広げる）。対角線を 1 つの頂点から引かないと、三角形の角が六角形の角にならない所ができる。5 つの角の和は 3 けたのたし算なので、2 つずつ足すとまちがえにくい。
