        id: "01bb9b4ad8"
        text: 3x + 5y = 31 の解 x = 2、y = 5 から、x を 5 ふやし、y を 3 へらしても解になります。そのわけを、x = 7、y = 2 を例にして文に書きましょう。
        explain: 例：「x = 2、y = 5 のとき 3 × 2 + 5 × 5 = 6 + 25 = 31。x を 5 ふやして 7 にすると 3x は 3 × 5 = 15 ふえて 21、y を 3 へらして 2 にすると 5y は 5 × 3 = 15 へって 10。ふえた分とへった分が同じ 15 なので、21 + 10 = 31 のまま変わらない。だから x = 7、y = 2 も解になる。」と書ければよい（代表の例で書く ②）。15 が 3 と 5 の公倍数であることに気づければ、なおよい。文字で書くと 3(x + 5) + 5(y − 3) = 3x + 15 + 5y − 15 = 3x + 5y で、どの解からでも同じことが言える。
        hints:
          - x を 5 ふやすと、3x はいくつふえるかな。
          - text: 3 が 5 こと 5 が 3 こをくらべた図だよ。y を 3 へらすと、5y はいくつへるかな。
            svg: '<svg viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg"><text x="50" y="24" font-size="14" text-anchor="start" fill="currentColor">3x は 3 が 5 こふえる</text><rect x="50" y="32" width="36" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity="0.5"/><text x="68" y="50.7" font-size="13" text-anchor="middle" fill="currentColor">3</text><rect x="86" y="32" width="36" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity="0.5"/><text x="104" y="50.7" font-size="13" text-anchor="middle" fill="currentColor">3</text><rect x="122" y="32" width="36" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity="0.5"/><text x="140" y="50.7" font-size="13" text-anchor="middle" fill="currentColor">3</text><rect x="158" y="32" width="36" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity="0.5"/><text x="176" y="50.7" font-size="13" text-anchor="middle" fill="currentColor">3</text><rect x="194" y="32" width="36" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity="0.5"/><text x="212" y="50.7" font-size="13" text-anchor="middle" fill="currentColor">3</text><text x="50" y="92" font-size="14" text-anchor="start" fill="currentColor">5y は 5 が 3 こへる</text><rect x="50" y="100" width="60" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#b39ddb" fill-opacity="0.5" stroke-dasharray="5 4"/><text x="80" y="118.7" font-size="13" text-anchor="middle" fill="currentColor">5</text><rect x="110" y="100" width="60" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#b39ddb" fill-opacity="0.5" stroke-dasharray="5 4"/><text x="140" y="118.7" font-size="13" text-anchor="middle" fill="currentColor">5</text><rect x="170" y="100" width="60" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#b39ddb" fill-opacity="0.5" stroke-dasharray="5 4"/><text x="200" y="118.7" font-size="13" text-anchor="middle" fill="currentColor">5</text><line x1="230" y1="60" x2="230" y2="100" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/></svg>'
          - 「〜ふえて、〜へるので、和は〜。だから〜。」と書いてみよう。
        paths:
          - [3x は 15 ふえる, 5y は 15 へる, 和は 31 のまま, だから x = 7、y = 2 も解]
          - ["文字で書く：3(x + 5) + 5(y − 3) = 3x + 15 + 5y − 15", "= 3x + 5y なので、x = 2、y = 5 で 31 なら、x = 7、y = 2 でも 31"]
