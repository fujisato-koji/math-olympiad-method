    text: 5 円の切手と 8 円の切手が、どちらもたくさんあります。この 2 種類の切手だけでちょうどはらえる金がく（1 円以上）のうち、切手の組み合わせが 1 通りしかない金がくは、全部でいくつありますか。どちらかの切手を 1 まいも使わないはらい方もよいことにします。たとえば 13 円は、5 円 1 まいと 8 円 1 まいの 1 通りだけです。40 円は、5 円の切手 8 まいだけと、8 円の切手 5 まいだけの 2 通りがあるので、数に入れません。わけも書きましょう。
    answer: 39
    check: sum(1 for n in range(1, 300) if sum(1 for x in range(n // 5 + 1) if (n - 5 * x) % 8 == 0) == 1)
    hints:
    - 13 円と 40 円をくらべてみよう。
    - 同じ金がくを 2 通りではらうとき、5 円の切手のまい数のちがいと 8 円の切手のまい数のちがいには、どんな関係があるかな。
    - どちらかの切手のまい数が多すぎると、別のはらい方ができないかな。
    paths:
    - - 同じ金がくを、5 円 x まいと 8 円 y まい、5 円 x′ まいと 8 円 y′ まいではらえたとする。すると 5 × x + 8 × y = 5 × x′ + 8 × y′ なので、5 × (x − x′) = 8 × (y′ − y)。5 と 8 には 1 のほかに公約数がないので、5 × m が 8 の倍数になるのは m が 8 の倍数のときだけ（m = 1〜7 なら 5 × m = 5、10、…、35 で、どれも 8 の倍数ではない）。だから x − x′ は 8 の倍数で、x − x′ = 8 × k とすると、5 × 8 × k = 8 × (y′ − y) より y′ − y = 5 × k。ほかのはらい方は、5 円 8 まいを 8 円 5 まいにかえることを何回かくり返した形（またはその反対）だけ
      - x が 8 以上なら、5 円 8 まい（40 円分）を 8 円 5 まいにかえた別のはらい方がある。y が 5 以上なら、8 円 5 まいを 5 円 8 まいにかえた別のはらい方がある。だから 1 通りしかないはらい方は、x が 7 以下、y が 4 以下のものだけ
      - 反対に x が 7 以下、y が 4 以下なら、別のはらい方 (x − 8 × k、y + 5 × k) は、k が 1 以上だと 5 円のまい数が負、k が 0 より小さいと 8 円のまい数が負になって、作れない。だから 1 通りしかない。x は 0〜7 の 8 とおり、y は 0〜4 の 5 とおりで、(x、y) は 8 × 5 = 40 組
      - 40 組のうち 2 つの組 (x、y) と (x′、y′) が同じ金がくなら、1 段目のとおり x − x′ は 8 の倍数。x も x′ も 0〜7 なので、ちがいは 7 以下で、8 の倍数なら 0。x = x′ なら 5 円の分が同じなので、y = y′ でもある。つまり 40 組の金がくはみなちがう
      - 40 組には、0 まいと 0 まい（0 円）が入っている。0 円は 1 円以上ではないのでのぞいて、40 − 1 = 39
    - - 8 円の切手を 0〜4 まい使うと、0、8、16、24、32 円。5 でわったあまりは 0、3、1、4、2 で、みなちがう。8 円の切手が y まいなら、y を 5 でわって y = 5 × j + y0（y0 は 0〜4）と書け、8 × y = 8 × y0 + 40 × j。だからはらえる金がくは 8 × y0 + 5 × (まい数) の形で、5 でわったあまりが 8 × y0 と同じで、8 × y0 以上。反対に、5 でわったあまりが 8 × y0 と同じで 8 × y0 以上の金がくは、8 × y0 から 5 円ずつふやした金がくなので、5 円の切手を足してはらえる
      - 5 でわったあまりごとに、いちばん小さいはらえる金がくは 0（あまり 0）、8（あまり 3）、16（あまり 1）、24（あまり 4）、32（あまり 2）。それより小さく、同じあまりの金がくははらえない。はらえない金がくは 1、2、3、4、6、7、9、11、12、14、17、19、22、27 の 14 こで、いちばん大きいのは 27
      - 金がく n が 2 通り以上ではらえるのは、n − 40 が 0 円か、はらえる金がくのときだけ。はらえるなら、そのはらい方に 5 円 8 まいか 8 円 5 まいを足すと、ちがう 2 通りになる。反対に 2 通りあれば、5 × (x − x′) = 8 × (y′ − y) で、5 と 8 には 1 のほかに公約数がないので（8 × m が 5 の倍数になるのは、m が 5 の倍数のときだけ）、8 円のまい数のちがいは 5 の倍数。8 円のまい数が多いほうは少ないほうより 5 まい以上多いので、8 円 5 まいをのぞくと、n − 40 がはらえる
      - 1〜39 円：n − 40 が負なので、2 通りにならない。はらえる金がくはどれも 1 通り。はらえない 14 こは全部 39 円以下なので、1 通りの金がくは 39 − 14 = 25 こ
      - 40〜79 円：n − 40 は 0〜39。40〜79 円の金がくは 27 より大きいので、どれもはらえる。1 通りになるのは、n − 40 がはらえないときで、0〜39 の中のはらえない 14 こ（0 円の 40 円は 2 通り）。80 円より上は n − 40 が 40 より上で 27 をこえるのではらえ、2 通り以上。全部で 25 + 14 = 39
    note: 考えどころは 3 つ：①同じ金がくの別のはらい方は、5 円 8 まいと 8 円 5 まいの入れかえだけ（5 と 8 に 1 のほかに公約数がないから、5 × (x − x′) = 8 × (y′ − y) で x − x′ は 8 の倍数、y′ − y は 5 の倍数）、②1 通りしかない ⇔ 5 円が 7 まい以下で 8 円が 4 まい以下、③その 8 × 5 = 40 組の金がくはみなちがうので、0 円をのぞいて 40 − 1 = 39。2 本目は 1 本目とちがい、はらい方の組を数えず、金がくを数の線で見る。5 でわったあまりごとの表からはらえない金がく 14 こ（最大 27）を出し、2 通りになる金がくは 40 円ずらした n − 40 がはらえる金がくだと見て、1〜39 円の 25 こと 40〜79 円の 14 こを足す。check は、1 円から 299 円まで、5 円のまい数 x を 0 から順に調べ、のこりが 8 でわり切れるはらい方の数をかぞえ、ちょうど 1 通りの金がくを数える式（80 円より上は 2 通り以上なので 300 までで足りる）。はらえない金がくの最大 27 = 5 × 8 − 5 − 8 は、古典の「切手の問題」として知られる。ここでは、1 通りだけの金がくの数を問う。一般に、5 と 8 のかわりに 1 のほかに公約数のない a と b なら、a × b − 1 になる。わなは、はらえない金がくの 14 こと答えることや、箱の 40 組をそのまま 40 と答えて、0 円を数えること。
