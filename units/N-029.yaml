entColor">(</text><rect x="132" y="110" width="24" height="21" rx="4" stroke="none" stroke-width="0" fill="#f3c969" fill-opacity="0.55"/><text x="144" y="124" font-size="15" text-anchor="middle" fill="currentColor">17</text><rect x="156" y="110" width="17" height="21" rx="4" stroke="none" stroke-width="0" fill="#f3c969" fill-opacity="0.55"/><text x="164.5" y="124" font-size="15" text-anchor="middle" fill="currentColor">−</text><rect x="173" y="110" width="15" height="21" rx="4" stroke="none" stroke-width="0" fill="#f3c969" fill-opacity="0.55"/><text x="180.5" y="124" font-size="15" text-anchor="middle" fill="currentColor">5</text><rect x="188" y="110" width="17" height="21" rx="4" stroke="none" stroke-width="0" fill="#f3c969" fill-opacity="0.55"/><text x="196.5" y="124" font-size="15" text-anchor="middle" fill="currentColor">×</text><rect x="205" y="110" width="15" height="21" rx="4" stroke="none" stroke-width="0" fill="#f3c969" fill-opacity="0.55"/><text x="212.5" y="124" font-size="15" text-anchor="middle" fill="currentColor">3</text><rect x="220" y="110" width="15" height="21" rx="4" stroke="none" stroke-width="0" fill="#f3c969" fill-opacity="0.55"/><text x="227.5" y="124" font-size="15" text-anchor="middle" fill="currentColor">)</text><text x="243.5" y="124" font-size="15" text-anchor="middle" fill="currentColor">×</text><text x="259.5" y="124" font-size="15" text-anchor="middle" fill="currentColor">2</text><rect x="60.6" y="148" width="198.8" height="30" rx="6" stroke="currentColor" stroke-width="2" fill="#7bc96f" fill-opacity="0.3"/><text x="74.4" y="168" font-size="16" text-anchor="middle" fill="currentColor">1</text><text x="91" y="168" font-size="16" text-anchor="middle" fill="currentColor">=</text><text x="112.4" y="168" font-size="16" text-anchor="middle" fill="currentColor">17</text><text x="133.8" y="168" font-size="16" text-anchor="middle" fill="currentColor">×</text><text x="164.8" y="168" font-size="16" text-anchor="middle" fill="currentColor">(−2)</text><text x="195.8" y="168" font-size="16" text-anchor="middle" fill="currentColor">+</text><text x="212.4" y="168" font-size="16" text-anchor="middle" fill="currentColor">5</text><text x="229" y="168" font-size="16" text-anchor="middle" fill="currentColor">×</text><text x="245.6" y="168" font-size="16" text-anchor="middle" fill="currentColor">7</text></svg>'
        explain: まず 17 と 5 で互除法をします。17 = 5 × 3 + 2、5 = 2 × 2 + 1。あまりの 1 から逆にたどります。下の式から 1 = 5 − 2 × 2。上の式から 2 = 17 − 5 × 3 なので、これを入れると 1 = 5 − (17 − 5 × 3) × 2 = 5 − 17 × 2 + 5 × 6 = 17 × (−2) + 5 × 7。だから x = −2、y = 7 が解です（17 × (−2) + 5 × 7 = −34 + 35 = 1）。1 つ解が見つかれば、4 日目のずらし方ですべての解が分かります。また、ax + by の値は、x と y がどんな整数でも a と b の最大公《約数》の《倍数》です。だから 6x + 9y = 20 のように、右辺が最大公約数（3）の倍数でない式には整数解がありません。
