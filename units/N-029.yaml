e="14" text-anchor="middle" fill="currentColor" font-weight="bold">6</text><text x="62.4" y="58" font-size="13" text-anchor="middle" fill="currentColor">点数</text><text x="134.7" y="58" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="162.5" y="58" font-size="14" text-anchor="middle" fill="currentColor">11</text><text x="190.4" y="58" font-size="14" text-anchor="middle" fill="currentColor">22</text><text x="218.3" y="58" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text><text x="246.2" y="58" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text><text x="274.1" y="58" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text><text x="302.1" y="58" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text><text x="62.4" y="88" font-size="13" text-anchor="middle" fill="currentColor">7 でわったあまり</text><text x="134.7" y="88" font-size="14" text-anchor="middle" fill="currentColor">0</text><text x="162.5" y="88" font-size="14" text-anchor="middle" fill="currentColor">4</text><text x="190.4" y="88" font-size="14" text-anchor="middle" fill="currentColor">1</text><text x="218.3" y="88" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text><text x="246.2" y="88" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text><text x="274.1" y="88" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text><text x="302.1" y="88" font-size="14" text-anchor="middle" fill="#8a8fa0">?</text></svg>'
