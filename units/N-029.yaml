    note: 連立方程式（A-012）のかげん法で 1 つの文字を消し、残った 1 次不定方程式を整数の条件で解く。文字が 3 つで式が 2 つなので、答えが 1 つに決まらないことにとまどう子が多い。x を 1 から順に入れて調べてもよいが、1 つの解から x を 4 ずつ、y を 7 ずつずらす（4 日目）と早い。z が 1 個以上の条件を確かめわすれやすい。
