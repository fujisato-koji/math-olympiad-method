text-anchor="middle" fill="currentColor"></text></svg>'
        explain: y に 1、2、3 … を順に入れて、x を 1 次方程式で求めます。y = 1 のとき 3x = 26 で、x は整数になりません。y = 2 のとき 3x = 21 で x = 7。y = 3 のとき 3x = 16、y = 4 のとき 3x = 11 で、どちらも整数になりません。y = 5 のとき 3x = 6 で x = 2。y = 6 のとき 3x = 1 で、x は整数になりません。y = 7 からは 5y が 31 をこえます。だから、正の整数の組は x = 7、y = 2 と x = 2、y = 5 の 2 組です。このように、解が整数になるものをさがす方程式を不定方程式といいます。y が 3 ふえると x が 5 へっていることにも注目しましょう。
