    note: 3 けたの数の互除法で、わり算が 5 回と多い（日の問題は 2 けた）。391 と 667 は 2、3、5、7 などの小さい数でわり切れないので、約数を小さい順に試すと見つけにくい。途中のあまり（276、115、46）をまちがえると最後が 1 になってしまうので、23 で 391 と 667 の両方がわり切れるか確かめさせる。
