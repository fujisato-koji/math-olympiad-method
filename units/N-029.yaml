    items:
      - part: 見本
        text: 91 と 65 の最大公《約数》を、大きいほうから小さいほうをひくことをくり返して求めましょう。
        figure: "91 と 65 → 65 と 26 → 39 と 26 → 26 と 13 → 13 と 13"
        explain: 2 つの数の公約数は、大きいほうから小さいほうをひいた差もわり切ります（13 が 91 と 65 をわり切るので、91 − 65 = 26 も 13 でわり切れる）。反対に、小さいほうと差の公約数は、2 つをたしたもとの大きいほうもわり切ります。だから、大きいほうを差におきかえても、公約数は変わりません。91 − 65 = 26 で 65 と 26、65 − 26 = 39 で 39 と 26、39 − 26 = 13 で 26 と 13、26 − 13 = 13 で 13 と 13。2 つが同じ数になったら、それが最大公約数で、91 と 65 の最大公約数は 13 です。この方法をユークリッドの互除法といいます。約数を書き出さなくても、ひき算だけで最大公約数が求められます。
