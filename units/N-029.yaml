# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "eb5bc706de"
    kinds: [数]
    text: たて 391 cm、横 667 cm の長方形のゆかに、同じ大きさの正方形のタイルを、すき間なく、重ならないようにしきつめます。タイルの 1 辺の長さは《整数》（cm）で、できるだけ大きくします。タイルの 1 辺は何 cm ですか。
    svg: '<svg viewBox="0 0 320 167" xmlns="http://www.w3.org/2000/svg"><text x="197" y="20" font-size="14" text-anchor="middle" fill="currentColor">横 667 cm</text><text x="84" y="89.6" font-size="14" text-anchor="end" fill="currentColor">たて</text><text x="84" y="107.6" font-size="14" text-anchor="end" fill="currentColor">391 cm</text><rect x="92" y="30" width="210" height="123.1" rx="2" stroke="currentColor" stroke-width="2" fill="#c9a36b" fill-opacity="0.25"/><rect x="92" y="30" width="22" height="22" rx="1" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity="0.45"/><rect x="92" y="52" width="22" height="22" rx="1" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity="0.45"/><rect x="114" y="30" width="22" height="22" rx="1" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity="0.45"/><rect x="114" y="52" width="22" height="22" rx="1" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity="0.45"/><rect x="136" y="30" width="22" height="22" rx="1" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity="0.45"/><rect x="136" y="52" width="22" height="22" rx="1" stroke="currentColor" stroke-width="1.5" fill="#7fc8f8" fill-opacity="0.45"/><text x="194" y="57" font-size="13" text-anchor="start" fill="currentColor">正方形のタイル</text><line x1="190" y1="52" x2="166.2" y2="52" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polygon points="162,52 168.1,48.5 168.1,55.5" fill="currentColor"/></svg>'
    answer: 23
    check: "math.gcd(391, 667)"
    hints:
      - タイルの 1 辺は、391 と 667 のどちらもわり切る数だね。
      - text: 横 667 cm、たて 391 cm の長方形から、1 辺 391 cm の正方形を切りとると、のこりの横は何 cm かな。のこりの長方形でも、同じように正方形を切りとっていこう。
        svg: '<svg viewBox="0 0 320 169" xmlns="http://www.w3.org/2000/svg"><text x="196" y="24" font-size="14" text-anchor="middle" fill="currentColor">横 667 cm</text><text x="88" y="90.6" font-size="14" text-anchor="end" fill="currentColor">たて</text><text x="88" y="108.6" font-size="14" text-anchor="end" fill="currentColor">391 cm</text><rect x="96" y="34" width="117.2" height="117.2" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.5"/><text x="154.6" y="97.6" font-size="13" text-anchor="middle" fill="currentColor">391 の正方形</text><rect x="213.2" y="34" width="82.8" height="117.2" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.5" stroke-dasharray="5 4"/><text x="254.6" y="97.6" font-size="15" text-anchor="middle" fill="currentColor">?</text></svg>'
      - 667 ÷ 391 のあまり、391 ÷ そのあまり、……と、わり切れるまで続けよう。
    paths:
      - [1 辺は 391 と 667 の最大公《約数》, 667 = 391 × 1 + 276、391 = 276 × 1 + 115, 276 = 115 × 2 + 46、115 = 46 × 2 + 23, 46 = 23 × 2 であまり 0, 23 cm]
      - ["ひき算の互除法：667 − 391 = 276、391 − 276 = 115", "276 から 115 を 2 回ひいて 46、115 から 46 を 2 回ひいて 23", "46 − 23 = 23 で同じになり、23 cm"]
    note: 3 けたの数の互除法で、わり算が 5 回と多い（日の問題は 2 けた）。391 と 667 は 2、3、5、7 などの小さい数でわり切れないので、約数を小さい順に試すと見つけにくい。とちゅうのあまり（276、115、46）をまちがえると最後が 1 になってしまうので、23 で 391 と 667 の両方がわり切れるか確かめさせる。
  - part: 離
