# N-029 互除法と 1 次不定方程式
#
# 書き方は N-001 の頭の注、負の数の書き方と check は N-010 の頭の注、式を選ぶ問題の check は A-010 の頭の注のとおり。段 4 なので普通の文。
# 前提は N-018（公約数と公倍数）と A-011（1 次方程式）。A-011 の前提をたどると A-010（文字と式）、N-027（正負の数のかけ算）、N-014（わり算）が入る。
# 数は 100 まで（N-009 は前提のたどりにない）。互除法の数は 2 けたにする。
#   N-014 のわり算はわる数が 1 けたなので、1 日目は大きいほうから小さいほうをひくくり返し（ひき算の互除法）で始め、
#   2 日目に「ひけるだけひく = わったあまり」とまとめる。2 けたでわる商は「わる数を何回ひけるか」で決める（91 = 26 × 3 + 13）。
# 1 次不定方程式は ax + by = c（a、b は 1 けたか 2 けた）。整数解は、一方の文字に順に数を入れて A-011 のように解く（3 日目）、
#   1 つの解から x を b ずつ・y を a ずつずらす（4 日目）、互除法を逆にたどる（5 日目）、の 3 つで求める。
#   「a と b に 1 以外の公約数がなければ、整数解は x = x₀ + bt、y = y₀ − at（t は整数）ですべて」は事実として使い、
#   すべてであることの証明（b が a(x − x₀) をわり切れば b が x − x₀ をわり切る）は、素数の性質の N-030 以降にまわす。
#   解をもつのは c が a と b の最大公約数の倍数のときだけ。この単元では、解がないほう（左辺がいつも最大公約数の倍数）を 6 日目のわけで示す。
# 2 つのあまりの条件をみたす数（3 でわると 2 あまり、5 でわると 1 あまる数）は、1 次不定方程式の場面として 7・8 日目に 2 けたの範囲で出すだけにした。
#   合同式で一般に扱うのは N-036（中国剰余定理）。
# 場面は、まとの点、ボートの人数、品物を分ける人数にした（お金は N-060 が前提にないので使わない）。
# check は math.gcd と、解を range で全部さがす式で確かめる。すべての整数解を表す式を選ぶ問題は、選択肢の式で作った解の集まりと、
#   range でさがした解の集まりが一致するものを選ぶ。「x がいちばん小さい正の整数の解」を問う問題は、x を 1 から順に調べる。
# 日の並び（既定）：1 日目 ひき算の互除法、2 日目 わり算の互除法と約分、3 日目 整数解をさがす（正の整数解とその個数）、
#   4 日目 1 つの解からすべての整数解へ、5 日目 互除法を逆にたどって ax + by = 1 を解く・整数解をもたない式、6 日目 わけ、
#   7 日目 N-018・A-011 と混ぜる、8 日目 確認。

id: N-029
days:
  - day: 1
    items:
      - part: 見本
        id: "37b43e9203"
        text: 91 と 65 の最大公《約数》を、大きいほうから小さいほうをひくことをくり返して求めましょう。図のように、長いテープから短いテープの長さを切りとり、のこりと短いほうの 2 つにします。
        svg: '<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg"><text x="76" y="28" font-size="14" text-anchor="end" fill="currentColor">91 と 65</text><rect x="84" y="10" width="158.6" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.5"/><text x="163.3" y="27.7" font-size="13" text-anchor="middle" fill="currentColor">65</text><rect x="242.6" y="10" width="63.4" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.5"/><text x="274.3" y="27.7" font-size="13" text-anchor="middle" fill="currentColor">26</text><text x="76" y="64" font-size="14" text-anchor="end" fill="currentColor">65 と 26</text><rect x="84" y="46" width="63.4" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.5"/><text x="115.7" y="63.7" font-size="13" text-anchor="middle" fill="currentColor">26</text><rect x="147.4" y="46" width="95.1" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.5"/><text x="195" y="63.7" font-size="13" text-anchor="middle" fill="currentColor">39</text><text x="76" y="100" font-size="14" text-anchor="end" fill="currentColor">39 と 26</text><rect x="84" y="82" width="63.4" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.5"/><text x="115.7" y="99.7" font-size="13" text-anchor="middle" fill="currentColor">26</text><rect x="147.4" y="82" width="31.7" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.5"/><text x="163.3" y="99.7" font-size="13" text-anchor="middle" fill="currentColor">13</text><text x="76" y="136" font-size="14" text-anchor="end" fill="currentColor">26 と 13</text><rect x="84" y="118" width="31.7" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.5"/><text x="99.9" y="135.7" font-size="13" text-anchor="middle" fill="currentColor">13</text><rect x="115.7" y="118" width="31.7" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#f3c969" fill-opacity="0.5"/><text x="131.6" y="135.7" font-size="13" text-anchor="middle" fill="currentColor">13</text><text x="76" y="172" font-size="14" text-anchor="end" fill="currentColor">13 と 13</text><rect x="84" y="154" width="31.7" height="26" rx="2" stroke="currentColor" stroke-width="2" fill="#7fc8f8" fill-opacity="0.5"/><text x="99.9" y="171.7" font-size="13" text-anchor="middle" fill="currentColor">13</text><text x="125.7" y="172" font-size="14" text-anchor="start" fill="#f08080" font-weight="bold">同じになった</text></svg>'
        figure: "91 と 65 → 65 と 26 → 39 と 26 → 26 と 13 → 13 と 13"
        explain: 2 つの数の公約数は、大きいほうから小さいほうをひいた差もわり切ります（13 が 91 と 65 をわり切るので、91 − 65 = 26 も 13 でわり切れる）。反対に、小さいほうと差の公約数は、2 つをたしたもとの大きいほうもわり切ります。だから、大きいほうを差におきかえても、公約数は変わりません。91 − 65 = 26 で 65 と 26、65 − 26 = 39 で 39 と 26、39 − 26 = 13 で 26 と 13、26 − 13 = 13 で 13 と 13。2 つが同じ数になったら、それが最大公約数で、91 と 65 の最大公約数は 13 です。この方法をユークリッドの互除法といいます。約数を書き出さなくても、ひき算だけで最大公約数が求められます。
