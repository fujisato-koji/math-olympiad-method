"end" fill="currentColor">12 と 6</text><rect x="76" y="112" width="82" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.5"/><text x="117" y="130.7" font-size="13" text-anchor="middle" fill="currentColor">6</text><rect x="158" y="112" width="82" height="28" rx="2" stroke="currentColor" stroke-width="2" fill="#c8ccd6" fill-opacity="0.5"/><text x="199" y="130.7" font-size="13" text-anchor="middle" fill="currentColor">6</text><text x="248" y="131" font-size="14" text-anchor="start" fill="#f08080" font-weight="bold">あまり 0</text></svg>'
        explain: ひき算の互除法で、96 から 42 は 2 回ひけて 12 が残ります。これは 96 を 42 でわったあまりです（96 = 42 × 2 + 12）。ひけるだけひくかわりに、わったあまりにおきかえます。次に 42 を 12 でわると 42 = 12 × 3 + 6、12 を 6 でわると 12 = 6 × 2 であまりは 0。あまりが 0 になったときのわる数 6 が、最大公約数です。わる数とあまりで次のわり算をし、あまりが 0 になるまで続けます。商は、わる数を何回ひけるかで決めます。
