# P-184 シーソーとやじろべえ
#
# 段 1・水準 1・4 日。おもさと おく ばしょで シーソーの かたむきが かわる（1 日目）、つりあう おきかたを さがす（2 日目）、
#   つりあう わけ（3 日目）、まとめ（4 日目）。やじろべえ（3 日目の 挑戦）と、ぼうを ゆびで ささえる ばしょ（4 日目）で、
#   ささえる ところで たてる ことを あつかう。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 図の かきかた（D-129〜D-131）：シーソー＝ちゃいろの いたと はいいろの ▲（ささえ）。めもりは ▲から 1〜4。
#   つみき＝きいろの しかく（どれも おなじ おもさ）。問題の 図は 手で おさえて いる ところなので、いたは まっすぐに かく。
#   かたむいた いたは 見本と ヒントだけ。あかい やじるし＝下がる ほう、むらさきの わ＝見る ところ、
#   あおい やじるし＝▲からの きょり、てんせんの しかく＝おく まえ・うごかす まえの つみき。
# ● の かぞえかた：つみき 1 こに、おいた めもりの かずだけ ● を かく。左右の ● の かずが おなじなら つりあい、
#   おおい ほうが 下がる（おもさ × きょり を、かけざんや たしざんを つかわず かぞえて くらべる。前提は A-001 だけ）。
# 直した（2026-11-13、D-131）：kg を つみきの かずに、「3 の きょり」を めもりの 絵に かえた。えらぶ ものから
#   「動かない」（つりあうと まぎれる）を けした。くりかえしだった 3・4 日目と 腕だめしの 問題、1 日目の 挑戦
#   （かたむきを きめる もの）を、ちがう おきかた・つりあう ばしょを さがす 問題・やじろべえ・ぼうを ささえる 問題に
#   かえ、id を けした。1 日目の 今日 2 は 左右を 入れかえた（答えが かわるので id を けした）。
# 4 日目の ぼう：ねんどが ぼうと おなじ くらいの おもさなら、つりあう ところは 左の はしから 4 ぶんの 1（ア）。
#   イ（まんなか）と ウでは かならず 左が 下がるので、答えは ア に きまる。
# 直した（2026-11-13、答えを 見ない ときなおし）：2 日目の 挑戦と 腕だめし 1 の「?」の つみきが、右の めもり 2 と 3 の
#   あいだに うかんで いて、おく ばしょの 手がかりに 見えた。左上の はこ（右に おく）に うつした（答えと いみは おなじ）。

