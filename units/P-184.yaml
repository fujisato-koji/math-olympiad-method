# P-184 シーソーとやじろべえ
#
# 段 1・水準 1・4 日。重さと置く位置でかたむきが変わること、つり合う置き方、重心を扱う。
# 子の画面には text、figure、choices、ヒントだけを出す。answer、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。

id: P-184
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          シーソーは、重い ほうに かたむきます。
          同じ 重さなら、遠くに 置いた ほうに かたむきます。
          重さと 置く 位置の 両方で、かたむきが 決まります。
        explain: |-
          【性質】シーソーの 左右で、重さが ちがうと、重い ほうが 下に なります。
          同じ 重さでも、支点から 遠い ほうが 下に なります。
          重さ × 支点からの きょり が、かたむきを 決める 目安です。
        note: 重いほう、遠いほうにかたむく。重さ×きょりが目安。
      - part: 今日
        text: 左に 2 kg、右に 3 kg を 同じ きょりで 置くと、どちらに かたむくかな。
        figure: ⚖️
        choices: [左, 右, つり合う, 動かない]
        answer: 右
        check: "'右'"
        hints:
          - 左右の 重さを くらべよう。
          - 重い ほうに かたむきます。
          - 重い ほうに かたむく ことを おもいだそう。
        paths:
          - [重さを くらべる, 重い ほう, 右]
      - part: 今日
        text: 左に 2 kg、右に 2 kg を 置き、右だけ 遠くに 置くと、どちらに かたむくかな。
        choices: [左, 右, つり合う, 動かない]
        answer: 右
        check: "'右'"
        hints:
          - 重さは 同じかな。
          - 同じ 重さなら、遠い ほうに かたむきます。
          - どちらが 遠いか を くらべよう。
        paths:
          - [重さが 同じ, 遠い ほう, 右]
      - part: 挑戦
        text: シーソーの かたむきを 決める ものは どれかな。
        choices: [重さと きょり, 色と 形, 音, 明るさ]
        answer: 重さと きょり
        check: "'重さと きょり'"
        hints:
          - 重さだけでは 決まりません。
          - 置く 位置も 関係します。
          - 重さと 置く 位置の 両方を 考えよう。
        paths:
          - [重さ, 置く 位置, 重さと きょり]
    extra: []

  - day: 2
    items:
      - part: 見本
        text: |-
          重さ × 支点からの きょり が 左右で 同じに なると、シーソーは つり合います。
          左の 重さ × 左の きょり = 右の 重さ × 右の きょり。
          この きまりを てこの つり合いと いいます。
        explain: |-
          左に 2 kg を 3 の きょり、右に 3 kg を 2 の きょりに 置くと、2×3=6、3×2=6 で つり合います。
          重い ものは 支点に 近く、軽い ものは 遠くに 置くと つり合います。
        note: 重さ×きょりが左右で同じならつり合う。
      - part: 今日
        text: 左に 2 kg を 3 の きょり、右に 3 kg を 2 の きょりに 置くと、どうなるかな。
        choices: [左に かたむく, 右に かたむく, つり合う, 動かない]
        answer: つり合う
        check: "'つり合う'"
        hints:
          - 左右の 重さ×きょり を 計算しよう。
          - 左は 2×3、右は 3×2 です。
          - 2 つの 数を くらべよう。
        paths:
          - [左 2×3, 右 3×2, くらべる, つり合う]
      - part: 今日
        text: 左に 1 kg を 4 の きょり、右に 2 kg を 2 の きょりに 置くと、どうなるかな。
        choices: [左に かたむく, 右に かたむく, つり合う, 動かない]
        answer: つり合う
        check: "'つり合う'"
        hints:
          - 左は 1×4、右は 2×2 です。
          - 2 つの かけ算の 答えを くらべよう。
          - 同じに なれば つり合います。
        paths:
          - [左 1×4, 右 2×2, くらべる, つり合う]
      - part: 挑戦
        text: 左に 2 kg を 1 の きょり、右に 1 kg を 2 の きょりに 置くと、どうなるかな。
        choices: [左に かたむく, 右に かたむく, つり合う, 動かない]
        answer: つり合う
        check: "'つり合う'"
        hints:
          - 左は 2×1、右は 1×2 です。
          - 2 つの かけ算の 答えを くらべよう。
          - 同じに なれば つり合います。
        paths:
          - [左 2×1, 右 1×2, くらべる, つり合う]
    extra: []

