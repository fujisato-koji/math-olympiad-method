        explain: |-
          こおりは あたためると とけて 水に なり、水は もっと あたためると すいじょうきに なります。ぶくぶく 出る あわの 中みも すいじょうきです。すいじょうきは 空気と おなじ ように 目に 見えないので、なべの 水は だんだん へって いきます。白い ゆげは、すいじょうきが 空気で ひえて できた 小さな 水の つぶで、2 日目に あつかいます。
          きょうは「あたためると こおり → 水 → すいじょうき」の じゅんが つかめれば よい。こおりを おさらに のせて へやや ひなたに おき、とけて いく ようすを いっしょに 見ると よい。
