  - day: 2
    items:
      - part: 見本
        text: |-
          水を つめたい ところで ひやすと、こおりに なります。
          すいじょうきを ひやすと、水に もどります。
          なべの ふたの うらに つく 水の つぶや 白い ゆげは、すいじょうきが ひえて できた 水です。
          あおい やじるしは「ひやす」の しるしです。
        svg: '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"><line x1="14" y1="22" x2="36" y2="22" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="46,22 36,28.2 36,15.8" fill="#7fc8f8"/><text x="52" y="27" font-size="13" text-anchor="start" fill="currentColor">ひやす</text><path d="M22.5 126.8A12.7 12.7 0 0 1 24.6 105.7A16.9 16.9 0 0 1 52.1 95.1A14.8 14.8 0 0 1 77.5 107.8A10.6 10.6 0 0 1 77.5 126.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/><text x="50" y="117" font-size="12" text-anchor="middle" fill="currentColor">見えない</text><text x="50" y="172" font-size="15" text-anchor="middle" fill="currentColor">すいじょうき</text><line x1="90" y1="112" x2="114" y2="112" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="124,112 114,118.2 114,105.8" fill="#7fc8f8"/><path d="M136.6 103.6Q148.3 100.6 160 103.6T183.4 103.6L180.6 141L139.4 141Z" fill="#7fc8f8" fill-opacity=".55"/><path d="M136.6 103.6Q148.3 100.6 160 103.6T183.4 103.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M133 80L138.4 142L181.6 142L187 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><text x="160" y="172" font-size="15" text-anchor="middle" fill="currentColor">水</text><line x1="196" y1="112" x2="224" y2="112" stroke="#7fc8f8" stroke-width="3" stroke-linecap="round"/><polygon points="234,112 224,118.2 224,105.8" fill="#7fc8f8"/><rect x="249" y="89" width="46" height="46" rx="8.3" fill="#7fc8f8" fill-opacity=".6" stroke="currentColor" stroke-width="2"/><path d="M260 112V100H272" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="272" y="172" font-size="15" text-anchor="middle" fill="currentColor">こおり</text></svg>'
        explain: |-
          ひやすと、1 日目の ぎゃくの じゅんに すがたが もどります。水は れいとうこで ひやすと こおりに なり、すいじょうきは つめたい ものに ふれて ひえると 水に なります。なべの ふたの うらの 水てきが その れいです。
          白い ゆげは、すいじょうきが まわりの 空気で ひえて できた 小さな 水の つぶです。すいじょうきそのものは 見えません。こどもは「ゆげ＝すいじょうき」と おぼえがちなので、「見えるのは 水の つぶ」と いっしょに たしかめると よい。こおりの トレーに 水を 入れて れいとうこに 入れ、つぎの 日に 見る じっけんが かんたんです。
