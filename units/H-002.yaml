# H-002 水と氷と水蒸気
#
# 段 1・水準 1・4 日。あたためる（氷が水に、水が水蒸気に）、ひやす（水が氷に、水蒸気が水に）、すがたが変わる（どれも同じ水で、行き来できる）を扱う。
# 子の画面には text、svg、choices、ヒントだけを出す。answer、check、paths、note は保護者用。
# ヒントは答えを書かず、見方・調べ方だけを示す。図の付いたヒントは、答えの手前までを絵で見せる。
# 地図に plan がないので既定の並び（導入・練習・わけ・確認）。1 日目 あたためる、2 日目 ひやす（ふたの水てき、白い湯気）、3 日目 わけ（すがたが変わっても同じ水）、4 日目 確認。
# 図の約束：赤い矢印は「あたためる」、青い矢印は「ひやす」。水蒸気は目に見えないので点線の雲でかく。湯気は水蒸気でなく小さな水のつぶとして扱う。
# 火や湯を使う場面には「おうちの ひとと いっしょに」を付けた。
# 腕だめし（離）は 2 問とも、絵の変化を読む読み取り（kinds: 読み取り）。
# 形とかさは H-060、温度計と 0 度は P-189、水たまりと冷たいコップの水てきは W-048、氷が浮く・雪・霜は W-100 で扱うので、ここでは問わない。

id: H-002
days:
  - day: 1
    items:
      - part: 見本
        text: |-
          こおりを あたためると、とけて 水に なります。
          水を もっと あたためると、ぶくぶく あわが 出て、すいじょうきに なり、空気の 中へ 出て いきます。
          すいじょうきは 目に 見えないので、えでは てんせんの くもで かきます。
          あかい やじるしは「あたためる」の しるしです。
