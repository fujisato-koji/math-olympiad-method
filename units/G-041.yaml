# G-041 2 次曲線（放物線・楕円・双曲線の標準形、焦点と準線、離心率、接線）
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-019、A-020 に合わせる（負の数は「−」U+2212、分数は約分した形）。
# 段 5 の単元なので、1 日の組は 思い出す 2・今日 2・挑戦 1（stages の day）、わけの深さは ③（水準 3）。
#   新しいきまりが出る日（1〜3 日目）は頭に見本を置いた。わけの日は 思い出す 2・今日 1・わけ 3、確認の日は 7 問。
# ことば：放物線（焦点 F と準線 ℓ から等しい距離にある点の全体）、楕円（2 つの焦点からの距離の和が一定）、双曲線（差が一定）、
#   標準形 y² = 4px、x² = 4py、x²/a² + y²/b² = 1、x²/a² − y²/b² = 1（と = −1）、頂点、長軸と短軸、中心、漸近線、離心率 e、接線。
# 前提は G-026（座標と図形の方程式）と A-020（2 次関数と平方完成、平行移動）。G-026 からは、2 点間の距離、直線の式、
#   点と直線の距離、円の式（平方完成で中心と半径を読む）、円と直線の共有点（b² − 4ac の符号）、円の上の点の接線 x₀x + y₀y = r² を使う。
#   G-026 は軌跡を扱っていないので、「条件を満たす点の全体を式で表す」ことは 1 日目の見本で初めて行う。
#   前提のたどりに A-017（判別式で解の個数）、A-016（平方根）、A-015（展開）がある。
# 接線は「直線と曲線の式から 1 文字を消した 2 次方程式が重解をもつ」で定め（円の接線と同じ考え）、微分（D-005）は使わない。
#   曲線の上の点の接線の公式（x₀x/a² + y₀y/b² = 1 など）は 3 日目の見本で知らせ、わけの日に放物線の場合を重解で示す。
# 三角関数（G-024、G-025）は前提のたどりにないので、楕円の媒介変数表示 (a cos θ, b sin θ) は扱わない。
#   xy の項がある式（回転した 2 次曲線）、極方程式、2 次曲線の一般の分類、2 次不等式（A-013 が前提のたどりにない）は扱わない。
# わけの日は、(1) 焦点と準線の条件から y² = 4px を導く、(2) 楕円の上の点で PF + PF′ = 2a（PF = a − (c/a)x₀ を示す）、
#   (3) 放物線の上の点 (x₀, y₀) の接線が y₀y = 2p(x + x₀) になる（代入すると (y − y₀)² = 0）。
# 地図に plan がないので既定の並び（導入・練習・練習・わけ・混ぜる・確認）。各日のねらいは次のように決めた。
#   1 日目 放物線（焦点と準線、標準形、y = ax² との関係、焦点までの距離 = 準線までの距離）
#   2 日目 楕円と双曲線（距離の和と差、標準形、焦点、長軸と短軸、漸近線）
#   3 日目 離心率（焦点と準線で 3 つをまとめる）と接線（重解、接線の公式）
#   4 日目 わけ　5 日目 G-026・A-020 と混ぜる（平行移動した 2 次曲線、平方完成で焦点を求める、円の接線、共有点の個数）　6 日目 確認
# 答えは数を打つ（焦点の座標の 1 つ、離心率、長さ）。式・直線・漸近線は choices にした。
#   式を選ぶ check は、定義（焦点と準線からの距離、焦点からの距離の和や差）を満たす点をいくつかとり、選択肢の式がそれらを
#   すべて満たすか、曲線の上の点で定義の距離の条件が成り立つか（math.isclose）で選ぶ。接線を選ぶ check は、点を通ることと、
#   代入した 2 次方程式の判別式が 0 になることを、整数と Fraction で調べる。
# 図は svg（D-040）。座標平面に方眼、軸、原点、目盛りを描き、曲線は 60〜96 区間の折れ線。焦点の座標を問う問題では焦点の点を描かず、
#   漸近線を問う問題では漸近線を描かない。準線と漸近線は点線。
# 2 次曲線は、惑星と彗星の軌道（P-009）、射影幾何（G-037）、パラボラアンテナと反射望遠鏡、楕円の反射を使う結石の破砕の入口になる（D-026）。

