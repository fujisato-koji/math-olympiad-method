      - part: わけ
        text: "点 F(p, 0)（p は正の数）と直線 ℓ: x = −p から等しい距離にある点 P(x, y) の全体が、放物線 y² = 4px になるわけを、筋道を立てて書きましょう。"
        explain: 例：「P(x, y) から ℓ にひいた垂線を PH とすると、H(−p, y) で PH = |x + p| である。2 点の距離の式（G-026）より PF = √((x − p)² + y²) である。PF と PH はどちらも 0 以上なので、PF = PH は、2 乗した (x − p)² + y² = (x + p)² と同じことである。展開すると x² − 2px + p² + y² = x² + 2px + p² で、整理すると y² = 4px となる。逆に y² = 4px を満たす点は、この変形を逆にたどって PF = PH を満たす。」と書ければよい。①「〜とする」で P(x, y) と H を決める、② 距離を式で表し、2 乗して展開・整理する、③ 約束した事実（2 点の距離、0 以上の 2 つの数は 2 乗が等しければ等しい）で結び、逆向きにもたどれることを述べる、の 3 つがそろっているかを見る。2 乗してよいわけ（どちらも 0 以上）が抜けやすい。いくつかの点で距離を確かめただけで終わっていたら、例ではすべての点を示せないことを話す。
        hints:
          - P(x, y) から準線にひいた垂線の足 H の座標を書きましょう。
          - PF と PH を、x、y、p の式で表しましょう。
          - PF = PH の両辺を 2 乗してよいわけを書き、展開して整理しましょう。
        paths:
          - ["\"P(x, y)、H(−p, y) とする\"", "PF = √((x − p)² + y²)、PH = |x + p|", "どちらも 0 以上なので 2 乗して (x − p)² + y² = (x + p)²", "y² = 4px"]
      - part: わけ
        text: 楕円 x²/a² + y²/b² = 1（a > b > 0）の焦点を F(c, 0)、F′(−c, 0)（c = √(a² − b²)）とします。楕円の上のどの点 P(x₀, y₀) でも PF + PF′ = 2a となるわけを、PF = a − (c/a)x₀ を示して、筋道を立てて書きましょう。
        explain: 例：「P(x₀, y₀) を楕円の上の点とすると、y₀² = b² − (b²/a²)x₀² である。PF² = (x₀ − c)² + y₀² = x₀² − 2cx₀ + c² + b² − (b²/a²)x₀²。c² + b² = a²、1 − b²/a² = c²/a² なので、PF² = (c²/a²)x₀² − 2cx₀ + a² = (a − (c/a)x₀)² である。−a ≦ x₀ ≦ a で 0 < c < a なので a − (c/a)x₀ > 0 で、PF = a − (c/a)x₀ である。同じく PF′² = (x₀ + c)² + y₀² = (a + (c/a)x₀)² で、PF′ = a + (c/a)x₀ である。よって PF + PF′ = 2a である。」と書ければよい。①「〜とする」で P(x₀, y₀) を決め、楕円の式から y₀² を表す、② PF² を展開し、c² = a² − b² を使って平方の形にまとめる、③ 約束した事実（X が 0 以上なら √(X²) = X、A-016）で PF を求め、和を出す、の 3 つがそろっているかを見る。a − (c/a)x₀ が正であるわけが抜けやすい。この式から PF ÷ (a²/c − x₀) = c/a = e となり、3 日目の離心率の性質も示せることに触れる。
        hints:
          - 楕円の式から、y₀² を x₀ の式で表しましょう。
          - PF² を展開し、c² + b² = a² を使って (a − (c/a)x₀)² の形にまとめましょう。
          - a − (c/a)x₀ が正であるわけを書き、PF′ も同じように求めましょう。
        paths:
          - ["\"P(x₀, y₀) とし、y₀² = b² − (b²/a²)x₀²\"", "PF² = (a − (c/a)x₀)²、PF′² = (a + (c/a)x₀)²", "どちらも正なので PF = a − (c/a)x₀、PF′ = a + (c/a)x₀", "PF + PF′ = 2a"]
      - part: わけ
        text: 放物線 y² = 4px の上の点 (x₀, y₀)（y₀ は 0 でない）における接線が y₀y = 2p(x + x₀) になるわけを、この直線と放物線の式から x を消した 2 次方程式が重解をもつことを示して、筋道を立てて書きましょう。
        explain: 例：「(x₀, y₀) は放物線の上の点なので y₀² = 4px₀ である。直線 y₀y = 2p(x + x₀) の式から 2px = y₀y − 2px₀ で、これを y² = 4px = 2 × 2px に代入すると y² = 2y₀y − 4px₀ = 2y₀y − y₀² となる。移項すると y² − 2y₀y + y₀² = 0、つまり (y − y₀)² = 0 で、y = y₀ の重解をもつ。よって直線と放物線の共有点は (x₀, y₀) の 1 つだけで、重解なので、この直線は (x₀, y₀) における接線である。」と書ければよい。①「〜とする」で (x₀, y₀) を決め、y₀² = 4px₀ を使えるようにする、② 直線の式を代入して 2 次方程式にし、(y − y₀)² = 0 に変形する、③ 約束した事実（重解をもつとき接する、3 日目の接線の定め方）で結ぶ、の 3 つがそろっているかを見る。軸に平行な直線 y = k も放物線と 1 点で交わるが、代入すると 1 次方程式になり重解ではないので接線ではないことを話す。頂点（y₀ = 0）の接線は y 軸で、式に x₀ = 0、y₀ = 0 を入れた x = 0 と合う。
        hints:
