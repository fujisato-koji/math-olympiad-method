        text: 放物線 x² = −8y の焦点の y 座標はいくつですか。
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-8, 4))"
        hints:
          - x² = 4py の形で、4p はいくつでしょう。
