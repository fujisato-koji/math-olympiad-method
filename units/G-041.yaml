    hints:
      - PF + PF′ と FF′ は、それぞれいくつでしょう。
      - ∠FPF′ = 90° なので、三平方の定理で PF² + PF′² がわかります（G-019）。
      - (PF + PF′)² を展開すると、PF × PF′ が出てきます（A-015）。
    paths:
      - [PF + PF′ = 10、FF′ = 8, PF² + PF′² = 64, (PF + PF′)² = 100 なので 2 × PF × PF′ = 36, 面積 = PF × PF′ ÷ 2 = 9]
    note: P の座標を求めずに、和と 2 乗の和から積を出す道筋。どの楕円でも、∠FPF′ = 90° のときの面積は b²（ここでは 9）になる。P の座標から求める道は √ が続いて重い。
  - part: 離
    kinds: [数, 手数]
    text: 放物線 y² = 6x の焦点を通り、傾きが 1 の直線が、放物線と 2 点 A、B で交わります。線分 AB の長さはいくつですか。
    answer: 12
    check: "[d for d in range(1, 100) if math.isclose(math.sqrt(2) * math.sqrt(9 ** 2 - 4 * Fraction(9, 4)), d)][0]"
    hints:
      - 焦点の座標を求め、直線の式を書きましょう。
      - 交点の x 座標を x₁、x₂ とすると、AF と BF は準線までの距離に等しくなります。
      - AB = AF + BF を、x₁ + x₂ で表しましょう。
    paths:
      - ["\"焦点は (3/2, 0)、直線は y = x − 3/2\"", "代入して x² − 9x + 9/4 = 0", "AF = x₁ + 3/2、BF = x₂ + 3/2", "解の公式で x₁ + x₂ = 9 なので AB = 9 + 3 = 12"]
      - [解の公式で x₁ − x₂ = 6√2, 傾き 1 なので AB = √2 × 6√2 = 12]
    note: 《分数》の焦点と √ を含む解が出るが、焦点までの距離を準線までの距離に言いかえると √ が消える。2 本目は 2 点の距離で直接求める道。
  - part: 離
    kinds: [読み取り, 道筋]
    text: ある彗星は、太陽を 1 つの焦点とする楕円の軌道を回っています。太陽にいちばん近づくときの距離は 2 億 km、いちばん遠ざかるときの距離は 18 億 km です。軌道の上で、太陽からの距離がちょうど 10 億 km になる点は 2 つあります。その点から、楕円の長軸（いちばん近い点といちばん遠い点を結ぶ直線）までの距離は何億 km ですか。
    answer: 6
    check: "[y for x in range(-10, 11) for y in range(1, 20) if Fraction(x * x, 100) + Fraction(y * y, 100 - 64) == 1 and (x - 8) ** 2 + y * y == 10 * 10][0]"
    hints:
      - いちばん近い距離と遠い距離から、楕円の a と c を求めましょう。
      - 楕円の上の点と焦点の距離は a − (c/a)x₀ です（4 日目のわけ）。
      - 距離が a になるのは、どこにある点でしょう。
    paths:
      - [a − c = 2、a + c = 18 なので a = 10、c = 8, b² = 100 − 64 = 36, 10 − (4/5)x₀ = 10 より x₀ = 0, 短軸の端の点で、長軸までの距離は b = 6, 6 億 km]
    note: 場面の言葉（いちばん近い、遠い、長軸）を a − c、a + c に読みかえる。焦点からの距離が a になるのは短軸の端（PF + PF′ = 2a で PF = PF′）と気づけば、計算はほとんど要らない。
