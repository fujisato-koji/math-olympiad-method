          - 1 回変形するごとに、不等式の性質のどれを使ったか、向きが変わるかを書きましょう。
        paths:
          - [2x + 3 < 11 とする, 両辺から 3 をひく（向きはそのまま）, 正の数 2 でわる（向きはそのまま）, x < 4, 逆にたどって元の式にもどる]
          - [x < 4 とする, 両辺に 2 をかけ、3 を足して 2x + 3 < 11, 逆に 2x + 3 < 11 とすると、3 をひき 2 でわって x < 4, 両方の向きが言えたので、解は x < 4]
