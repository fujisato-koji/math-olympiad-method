 stroke="#f3c969" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250.8,95 245.3,85 256.3,85" fill="#f3c969"/><path d="M190.8 47 C190.8 68.6 117.2 73.4 117.2 88" fill="none" stroke="#7fc8f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="117.2,95 111.7,85 122.7,85" fill="#7fc8f8"/><text x="160" y="144" font-size="13" text-anchor="middle" fill="currentColor">反対の辺にうつすと、＋ と − が入れかわる</text></svg>'
