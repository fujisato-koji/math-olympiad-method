      - part: わけ
        id: "2710545120"
        text: a < b のとき、両辺に負の数 c をかけると ac > bc となる（向きが反対になる）ことを、すじ道を立てて書きましょう。「p < q は、q − p が正の数であること」と、《正負の数》のかけ算のきまりを使います。
        explain: 例：「a < b、c は負の数とする。a < b なので b − a は正の数で、a − b は負の数である。分配法則で ac − bc = (a − b)c と変形できる。a − b も c も負の数なので、その積 (a − b)c は正の数である（負の数どうしの積は正）。よって ac − bc は正の数なので、bc < ac、つまり ac > bc である。」と書ければよい。①「〜とする」で a、b、c を決める、② ac − bc を (a − b)c と式を変形する、③ 約束した事実（p < q は q − p が正、負の数どうしの積は正、N-027）で結ぶ、の 3 つがそろっているかを見る。3 < 5 に −2 をかけた例だけで終わっていたら、例だけでは、すべての a、b、c について言えないことを話す。
        hints:
          - 「a < b、c は負の数とする」から書き始めましょう。
          - ac > bc を言うには、ac − bc が正の数であることを言えばよいです。ac − bc を分配法則でまとめましょう。
          - text: まとめた式は、図のように 2 つの数のかけ算です。それぞれが正の数か負の数かを考え、かけ算のきまりで結びましょう。
            svg: '<svg viewBox="0 0 320 134" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="26" width="92" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="58" y="48" font-size="16" text-anchor="middle" fill="currentColor">(a − b)</text><text x="118" y="49" font-size="18" text-anchor="middle" fill="currentColor">×</text><rect x="132" y="26" width="44" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="154" y="48" font-size="16" text-anchor="middle" fill="currentColor">c</text><text x="190" y="49" font-size="18" text-anchor="middle" fill="currentColor">=</text><rect x="204" y="26" width="104" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="256" y="48" font-size="16" text-anchor="middle" fill="currentColor">ac − bc</text><rect x="30" y="75" width="56" height="22" rx="9" fill="#f08080" fill-opacity="0.45"/><text x="58" y="90" font-size="14" text-anchor="middle" fill="currentColor">負の数</text><rect x="126" y="75" width="56" height="22" rx="9" fill="#f08080" fill-opacity="0.45"/><text x="154" y="90" font-size="14" text-anchor="middle" fill="currentColor">負の数</text><rect x="244.5" y="74" width="23" height="23" rx="9" fill="#f3c969" fill-opacity="0.45"/><text x="256" y="90" font-size="15" text-anchor="middle" fill="currentColor">?</text><text x="160" y="122" font-size="14" text-anchor="middle" fill="currentColor">負の数 × 負の数 は？</text></svg>'
        paths:
          - [a < b、c < 0 とする, a − b は負の数, ac − bc = (a − b)c, 負の数どうしの積は正, ac − bc > 0 で ac > bc]
          - [a < b なので b − a は正の数、c < 0 なので −c は正の数, 正の数どうしの積 (b − a) × (−c) は正の数, (b − a) × (−c) = ac − bc, ac − bc は正の数なので ac > bc]
      - part: わけ
        id: "6fb04a4575"
        text: 不等式 2x + 3 < 11 の解が x < 4 であることを、不等式の性質を使って、すじ道を立てて書きましょう。x < 4 を満たす数がすべて解であること（逆の向き）も書きます。
        explain: 例：「x が 2x + 3 < 11 を成り立たせる数だとする。両辺から 3 をひいても向きは変わらないので 2x < 8。両辺を正の数 2 でわっても向きは変わらないので x < 4。逆に、x < 4 とする。両辺に正の数 2 をかけて 2x < 8、両辺に 3 を足して 2x + 3 < 11。よって、2x + 3 < 11 の解は x < 4 である。」と書ければよい。①「〜とする」、② 式を変形する、③ どの変形も不等式の性質で結ぶ、の 3 つがそろっているかを見る。x = 3 や x = 0 を入れてたしかめただけでは、「4 より小さいすべての数」が解で、それ以外は解でないことまでは言えないことを話す。
        hints:
          - 「x が 2x + 3 < 11 を成り立たせる数だとする」から書き始めましょう。
          - text: 図のように、上から下へ（行き）と、下から上へ（帰り）の両方の向きをたどります。? には、使った不等式の性質を書きましょう。
