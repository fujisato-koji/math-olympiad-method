        explain: 代金は 3x 円で、500 円より安いので、3x < 500 と書きます。<、>、≦、≧ を不等号といい、不等号を使って数量の大小の関係を表した式を不等式といいます。a < b は「a は b より小さい（a は b 未満）」、a ≦ b は「a は b と等しいか小さい（a は b 以下）」です。> は「より大きい」、≧ は「以上（等しいか大きい）」です。不等式を成り立たせる x の値を、その不等式の解といいます。x − 3 > 2 では、x = 6 は 6 − 3 = 3 で 3 > 2 なので解ですが、x = 5 は 2 > 2 が成り立たないので解ではありません。x − 3 > 2 の解は 5 より大きいすべての数で、x > 5 と書き、図の下の 2 本の《数直線》のうち、上のように表します。○ は 5 をふくまないこと、太い線が解の範囲です。5 をふくむ x ≦ 5（5 以下）は、下のように ● で表します。方程式とちがって、不等式の解はふつう、たくさんあります。
