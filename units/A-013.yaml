        explain: 例：「3 も 5 も 0 の右にあり、5 のほうが 0 から遠い。−2 をかけると、0 からのきょりはどちらも 2 倍になって 6 と 10 になり、場所は 0 の左側に移る。0 の左側では、0 から遠い数ほど小さいので、0 から遠い −10 のほうが小さく、−6 > −10 となる。だから向きが反対になる。」と書ければよい。「負の数をかけると 0 の反対側に移り、0 から遠い順はそのままなので、大小が入れかわる」が書けているかを見る（代表の例で書くわけ ②）。0 からのきょりを絶対値（N-011）で |3| < |5|、|−6| < |−10| と書いていれば、なおよい。
