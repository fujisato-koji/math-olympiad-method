  - part: 離
    id: "5620c3194a"
    kinds:
    - 最難関
    level: 10
    time: 1500
    uses:
    - A-015
    text: 正の整数 x、y、z が x + y + z = 23 になるとき、2x² + 3y² + 6z² のいちばん小さい数はいくつですか。また、それより小さくならないわけを書きましょう。
    answer: 530
    check: min(2 * x * x + 3 * y * y + 6 * z * z for x in range(1, 22) for y in range(1, 22) for z in range(1, 22) if x + y + z == 23)
    hints:
    - x、y、z は 23 を 3 つに分けた数。まず、いくつかためして、どんなときに小さくなりそうか見てみよう。
    - x + y + z = 23 のとき、(x + y + z)² はいつも 529。2x² + 3y² + 6z² を、(x + y + z)² と、いくつかの 2 乗に分けられないかな。
    - (x + y + z)² をひいたのこりの式で、x の 2 乗はいくつ分のこるかな。
    paths:
    - - (x + y + z)² + (x − y − z)² を展開すると 2x² + 2y² + 2z² + 4yz。(y − 2z)² を展開すると y² − 4yz + 4z²。この 2 つを足すと、2x² + 3y² + 6z² になる
      - x + y + z = 23 なので (x + y + z)² = 529。また y + z = 23 − x なので、x − y − z = x − (23 − x) = 2x − 23。だから 2x² + 3y² + 6z² = 529 + (2x − 23)² + (y − 2z)²
      - 23 は 2 でわり切れない数なので、2x − 23 も 2 でわり切れない数。2 でわり切れない数の 2 乗は 1 か、それより大きい。(y − 2z)² は 0 か、それより大きい。だから 2x² + 3y² + 6z² は 529 + 1 + 0 = 530 か、それより大きい
      - x = 11、y = 8、z = 4 のとき、x + y + z = 23 で、2 × 121 + 3 × 64 + 6 × 16 = 242 + 192 + 96 = 530。530 になる場合がある
      - だから、いちばん小さい数は 530
    - - x、y、z を 1 ずつからふやしていく。(1、1、1) のときの 2x² + 3y² + 6z² は 2 + 3 + 6 = 11。合計 23 まで、あと 20 を 1 ずつくばる
      - x を 1 ふやすと、2x² は 2(x + 1)² − 2x² = 4x + 2 だけふえる。x が 1 → 2、2 → 3、… のとき 6、10、14、18、…。同じように y は 6y + 3 で 9、15、21、…、z は 12z + 6 で 18、30、42、…。どれも だんだん大きくなる
      - 20 回のふえ方の合計を小さくしたい。どの文字も、ふえ方は 6、10、14、18、…のように大きくなる一方なので、3 つのならびをあわせて小さいほうから 20 こ取ると、どの文字でもかならず頭から順に取った形になり、本当にできるくばり方になる。どんなくばり方も、20 このふえ方を取ることなので、その合計は、ぜんぶのふえ方から小さいほうに 20 こ取った合計より小さくならない
      - 小さいほうから 20 こ取ると、6、9、10、14、15、18、18、21、22、26、27、30、30、33、34、38、39、42、42、45。合計は 519。x のふえ方が 10 こ、y が 7 こ、z が 3 こ
      - x = 1 + 10 = 11、y = 1 + 7 = 8、z = 1 + 3 = 4。2x² + 3y² + 6z² は 11 + 519 = 530
    note: 考えどころは 3 つ：①2x² + 3y² + 6z² = (x + y + z)² + (x − y − z)² + (y − 2z)² と分ける（展開でたしかめる）、②x + y + z = 23 を使うと 529 + (2x − 23)² + (y − 2z)² で、23 が 2 でわり切れない数なので (2x − 23)² は 1 以上、③x = 11、y = 8、z = 4 で 530（等号が成り立つ）。2 本目は、1 ずつふやすときのふえ方が x、y、z どれも大きくなる一方であることを使い、小さい順に 20 こ取る。check は、x、y、z を全部調べて x + y + z = 23 のものの最小を出す（530。530 になるのは x = 11、y = 8、z = 4 のときだけ）。実数なら 529（= 23 × 23。x = 11.5、y = 23/3、z = 23/6）まで下がるので、そう答えるのがわな。重みのついた 2 乗の和のコーシーの不等式の、整数の形にあたる。
