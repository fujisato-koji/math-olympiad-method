# A-013 不等式の性質と 1 次不等式
#
# 書き方は N-001 の頭の注のとおり。答えの形と check は A-011 に合わせる（負の数は「−」U+2212）。
# 地図に plan がないので、既定の並び（導入、練習、練習、わけ、混ぜる、確認）で作った。
#   1 日目：不等号（<、>、≦、≧）と不等式、以上・以下・未満、不等式の解（代入して確かめる）、数直線の ● と ○。
#   2 日目：不等式の性質（足す・ひくは向きはそのまま、正の数をかける・わるは向きはそのまま、負の数をかける・わると向きが反対）と、
#     x + a < b、ax < b の形を解く。
#   3 日目：移項して解く、かっこと分母のある不等式、解のうち自然数の個数・いちばん大きい（小さい）整数。
#   4 日目：わけ。5 日目：A-011、N-027、N-011 と混ぜる（代金の文章題、0 からのきょりの範囲）。6 日目：確認。
# 前提は A-011（1 次方程式）、N-027（正負の数のかけ算とわり算）、N-011（絶対値）。不等号は日本の中学の書き方（≦、≧）にした。
# 不等式の解（x > 4 など）は鍵盤で打てないので choices にする。解の範囲を選ぶ問題の check は、選択肢ごとの範囲（lambda）が、
#   元の不等式とどの数でも同じ真偽になるものを選び出す（−20〜20 の整数、境目が分数になる問題は 1/6 きざみで確かめる）。
#   打つ問題は、解のうちの自然数の個数、いちばん大きい（小さい）整数、代金の文章題の個数にし、check は総当たりで数える。
# 文章を不等式に表す問題と、数直線の図（svg）を読む問題は、書き方のきまりを問うので check を付けない。
# 絶対値は N-011 の「0 からのきょり」の意味で使い、|x| ≦ 3 を満たす整数を数直線で数えるところまでにした。
#   |x − 2| の書き方、連立不等式（2 つの不等式を同時に満たす範囲）、2 次不等式は扱わない（「2 からのきょり」は言葉で聞く）。
# 不等式は、予算や安全の上限の中で量を決める計算と、後の最適化（K の流れ）や評価の不等式（L の流れ）の入口になる（D-026）。

id: A-013
days:
  - day: 1
    items:
      - part: 見本
        text: 1 個 x 円のパンを 3 個買うと、代金は 500 円より安くなりました。この関係を式に表してみましょう。
        svg: |
          <svg viewBox="0 0 240 70" xmlns="http://www.w3.org/2000/svg">
            <line x1="8" y1="35" x2="232" y2="35" stroke="currentColor" fill="none" stroke-width="2"/>
            <g stroke="currentColor" fill="none" stroke-width="2">
              <line x1="20" y1="30" x2="20" y2="40"/><line x1="45" y1="30" x2="45" y2="40"/><line x1="70" y1="30" x2="70" y2="40"/>
              <line x1="95" y1="30" x2="95" y2="40"/><line x1="120" y1="30" x2="120" y2="40"/><line x1="145" y1="30" x2="145" y2="40"/>
              <line x1="170" y1="30" x2="170" y2="40"/><line x1="195" y1="30" x2="195" y2="40"/><line x1="220" y1="30" x2="220" y2="40"/>
            </g>
            <line x1="151" y1="35" x2="224" y2="35" stroke="currentColor" fill="none" stroke-width="5"/>
            <path d="M224 28 L236 35 L224 42 Z" fill="currentColor"/>
            <circle cx="145" cy="35" r="6" stroke="currentColor" fill="none" stroke-width="2"/>
            <text x="20" y="62" font-size="14" text-anchor="middle">0</text><text x="45" y="62" font-size="14" text-anchor="middle">1</text>
            <text x="70" y="62" font-size="14" text-anchor="middle">2</text><text x="95" y="62" font-size="14" text-anchor="middle">3</text>
            <text x="120" y="62" font-size="14" text-anchor="middle">4</text><text x="145" y="62" font-size="14" text-anchor="middle">5</text>
            <text x="170" y="62" font-size="14" text-anchor="middle">6</text><text x="195" y="62" font-size="14" text-anchor="middle">7</text>
            <text x="220" y="62" font-size="14" text-anchor="middle">8</text>
          </svg>
        explain: 代金は 3x 円で、500 円より安いので 3x < 500 と書きます。<、>、≦、≧ を不等号といい、不等号を使って数量の大小の関係を表した式を不等式といいます。a < b は「a は b より小さい（a は b 未満）」、a ≦ b は「a は b と等しいか小さい（a は b 以下）」です。不等式を成り立たせる x の値を、その不等式の解といいます。たとえば x − 3 > 2 では、x = 6 は 6 − 3 = 3 で 3 > 2 なので解です。x = 5 は 5 − 3 = 2 で、2 > 2 は成り立たないので解ではありません。x − 3 > 2 の解は 5 より大きいすべての数で、まとめて x > 5 と書きます。図の数直線のように、○ はその数をふくまないこと、● はふくむことを表し、太い線が解の範囲です。方程式とちがって、不等式の解はふつう、たくさんあります。
      - part: 思い出す
        text: 方程式 5x + 3 = 2x − 9 を解きましょう。x はいくつですか。
        answer: −4
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(Fraction(-9 - 3, 5 - 2))"
        hints:
          - x の項を左辺に、数の項を右辺に集めましょう。
          - 右辺は −9 − 3 になります。
          - 両辺をまとめてから、x の係数でわりましょう。
        paths:
          - [5x − 2x = −9 − 3, 3x = −12, x = −4]
      - part: 思い出す
        text: (−6) × (−3) − 4 × 5 を計算しましょう。
        answer: −2
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')((-6) * (-3) - 4 * 5)"
        hints:
          - かけ算を先に計算しましょう。
          - 負の数どうしのかけ算の符号は、どうなるでしょう。
          - 18 − 20 を計算しましょう。
        paths:
          - [(−6) × (−3) = 18, 4 × 5 = 20, 18 − 20 = −2]
      - part: 今日
        text: 「x の 2 倍に 3 を足した数は、15 以上」を表す不等式はどれですか。
        choices: [2x + 3 ≧ 15, 2x + 3 > 15, 2x + 3 ≦ 15]
        answer: 2x + 3 ≧ 15
        hints:
          - 「以上」は、その数と等しい場合もふくみます。
          - 「15 以上」は「15 と等しいか、15 より大きい」です。
          - 等しい場合をふくむ不等号には、下に線があります。
        paths:
          - [x の 2 倍に 3 を足した数は 2x + 3, 15 以上は ≧ 15, 2x + 3 ≧ 15]
        note: 「以上」「以下」は等しい場合をふくみ、「より大きい」「より小さい（未満）」はふくまない。
      - part: 今日
        text: 次のうち、不等式 3x − 2 > 7 の解はどれですか。
        choices: [x = 4, x = 3, x = 2]
        answer: x = 4
        check: "[c for c, v in {'x = 4': 4, 'x = 3': 3, 'x = 2': 2}.items() if 3 * v - 2 > 7][0]"
        hints:
          - それぞれの値を、左辺の 3x − 2 に代入しましょう。
          - 左辺の値が 7 より大きくなるものをさがしましょう。
          - 7 と等しいときは、「7 より大きい」でしょうか。
        paths:
          - [x = 3 のとき 3 × 3 − 2 = 7、7 > 7 は成り立たない, x = 4 のとき 10 > 7, x = 4]
        note: x = 3 のとき左辺はちょうど 7 になる。等しいときは > は成り立たない。
      - part: 今日
        text: x が −2、−1、0、1、2、3 のとき、不等式 2x − 1 ≦ 3 を成り立たせるものは何こありますか。
        answer: 5
        check: "sum(1 for x in range(-2, 4) if 2 * x - 1 <= 3)"
        hints:
          - 1 つずつ、左辺の 2x − 1 に代入しましょう。
          - 負の数を代入するときは、かっこをつけましょう。
          - 3 と等しいときも、≦ は成り立ちます。
        paths:
          - [左辺は −5、−3、−1、1、3、5, 3 以下は 5 つ, 5 こ]
        note: x = 2 のとき左辺はちょうど 3。≦ は等しいときもふくむので解になる。
      - part: 挑戦
        text: 不等式 |x| ≦ 3 を満たす整数 x は何こありますか。
        answer: 7
        check: "sum(1 for x in range(-20, 21) if abs(x) <= 3)"
        hints:
          - 記号 |x| は、数直線の上で x が 0 からどれだけはなれているかです。
          - 0 からのきょりが 3 以下の整数を、数直線の上でさがしましょう。
          - 負の数と 0 も、忘れずに数えましょう。
        paths:
          - [0 からのきょりが 3 以下, −3、−2、−1、0、1、2、3, 7 こ]
        note: 正の数だけ数えて 3 とする、0 を数え忘れて 6 とする、が多い。
    extra:
      - part: 今日
        text: 「ある数 x から 4 をひいた数は、−1 より小さい」を表す不等式はどれですか。
        choices: [x − 4 < −1, x − 4 > −1, x − 4 ≦ −1]
        answer: x − 4 < −1
        hints:
          - x から 4 をひいた数を、式で書きましょう。
          - 「より小さい」は、等しい場合をふくみません。
          - 不等号の開いているほうが、大きいほうです。
        paths:
          - [x から 4 をひいた数は x − 4, −1 より小さいは < −1, x − 4 < −1]
      - part: 今日
        text: 不等式 4 − x > 1 を成り立たせる自然数 x は何こありますか。
        answer: 2
        check: "sum(1 for x in range(1, 100) if 4 - x > 1)"
        hints:
          - 自然数は、1 から始まる整数です。
          - x = 1 から順に代入してみましょう。
          - x を大きくすると、左辺は大きくなるでしょうか、小さくなるでしょうか。
        paths:
          - [x = 1 で 3 > 1、x = 2 で 2 > 1, x = 3 で 1 > 1 は成り立たない, 2 こ]
      - part: 挑戦
        text: 数直線の太い線は、x の範囲を表しています。どの不等式ですか。
        svg: |
          <svg viewBox="0 0 240 70" xmlns="http://www.w3.org/2000/svg">
            <line x1="8" y1="35" x2="232" y2="35" stroke="currentColor" fill="none" stroke-width="2"/>
            <g stroke="currentColor" fill="none" stroke-width="2">
              <line x1="20" y1="30" x2="20" y2="40"/><line x1="45" y1="30" x2="45" y2="40"/><line x1="70" y1="30" x2="70" y2="40"/>
              <line x1="95" y1="30" x2="95" y2="40"/><line x1="120" y1="30" x2="120" y2="40"/><line x1="145" y1="30" x2="145" y2="40"/>
              <line x1="170" y1="30" x2="170" y2="40"/><line x1="195" y1="30" x2="195" y2="40"/><line x1="220" y1="30" x2="220" y2="40"/>
            </g>
            <line x1="70" y1="35" x2="224" y2="35" stroke="currentColor" fill="none" stroke-width="5"/>
            <path d="M224 28 L236 35 L224 42 Z" fill="currentColor"/>
            <circle cx="70" cy="35" r="6" fill="currentColor"/>
            <text x="20" y="62" font-size="14" text-anchor="middle">−3</text><text x="45" y="62" font-size="14" text-anchor="middle">−2</text>
            <text x="70" y="62" font-size="14" text-anchor="middle">−1</text><text x="95" y="62" font-size="14" text-anchor="middle">0</text>
            <text x="120" y="62" font-size="14" text-anchor="middle">1</text><text x="145" y="62" font-size="14" text-anchor="middle">2</text>
            <text x="170" y="62" font-size="14" text-anchor="middle">3</text><text x="195" y="62" font-size="14" text-anchor="middle">4</text>
            <text x="220" y="62" font-size="14" text-anchor="middle">5</text>
          </svg>
        choices: [x ≧ −1, x > −1, x ≦ −1]
        answer: x ≧ −1
        hints:
          - 太い線は、どの数から、どちらの向きにのびていますか。
          - −1 のところの丸は、● でしょうか、○ でしょうか。
          - ● はその数をふくむ、○ はふくまない、という意味です。
        paths:
          - [−1 から右へのびる, ● なので −1 をふくむ, x ≧ −1]

  - day: 2
    items:
      - part: 見本
        text: 不等式 3 < 5 の両辺に、同じ数を足したり、かけたりしてみましょう。
        explain: 3 < 5 の両辺に 2 を足すと 5 < 7、2 をひくと 1 < 3 で、不等号の向きは変わりません。両辺に 2 をかけると 6 < 10、2 でわると 3/2 < 5/2 で、これも向きは変わりません。ところが、両辺に −2 をかけると −6 と −10 になり、−6 > −10 で、向きが反対になります。まとめると、① 両辺に同じ数を足しても、ひいても、向きは変わらない。② 両辺に同じ正の数をかけても、わっても、向きは変わらない。③ 両辺に同じ負の数をかけたり、わったりすると、向きが反対になる。これを不等式の性質といいます。方程式と同じように、この性質を使って不等式を解きます。x + 4 < 1 は両辺から 4 をひいて x < −3、−2x < 6 は両辺を −2 でわり、向きを変えて x > −3 です。
      - part: 思い出す
        text: 次のうち、不等式 x + 5 ≧ 8 の解はどれですか。
        choices: [x = 3, x = 2, x = −3]
        answer: x = 3
        check: "[c for c, v in {'x = 3': 3, 'x = 2': 2, 'x = −3': -3}.items() if v + 5 >= 8][0]"
        hints:
          - それぞれの値を、左辺の x + 5 に代入しましょう。
          - 左辺の値が 8 以上になるものをさがしましょう。
          - 8 と等しいときも、≧ は成り立ちます。
        paths:
          - [x = 3 のとき 8 ≧ 8 で成り立つ, x = 2 のとき 7, x = 3]
      - part: 思い出す
        text: x が −4、−3、−2、−1、0、1 のとき、不等式 1 − 2x ≧ 5 を成り立たせるものは何こありますか。
        answer: 3
        check: "sum(1 for x in range(-4, 2) if 1 - 2 * x >= 5)"
        hints:
          - 1 つずつ、左辺の 1 − 2x に代入しましょう。
          - −2 × (−4) の符号に気をつけましょう。
          - 5 と等しいときも、≧ は成り立ちます。
        paths:
          - [左辺は 9、7、5、3、1、−1, 5 以上は 9、7、5, 3 こ]
      - part: 今日
        text: 不等式 x − 5 ≦ 2 を解くと、どれになりますか。
        choices: [x ≦ 7, x ≦ −3, x ≧ 7]
        answer: x ≦ 7
        check: "[c for c, f in {'x ≦ 7': lambda x: x <= 7, 'x ≦ −3': lambda x: x <= -3, 'x ≧ 7': lambda x: x >= 7}.items() if all(f(x) == (x - 5 <= 2) for x in range(-20, 21))][0]"
        hints:
          - 左辺を x だけにするには、両辺に何を足せばよいでしょう。
          - 両辺に同じ数を足しても、不等号の向きは変わりません。
          - 2 + 5 を計算しましょう。
        paths:
          - [両辺に 5 を足す, x ≦ 2 + 5, x ≦ 7]
      - part: 今日
        text: 不等式 4x > −12 を解くと、どれになりますか。
        choices: [x > −3, x < −3, x > −16]
        answer: x > −3
        check: "[c for c, f in {'x > −3': lambda x: x > -3, 'x < −3': lambda x: x < -3, 'x > −16': lambda x: x > -16}.items() if all(f(x) == (4 * x > -12) for x in range(-20, 21))][0]"
        hints:
          - 両辺を 4 でわりましょう。
          - 4 は正の数でしょうか、負の数でしょうか。
          - 正の数でわるとき、向きは変わりません。
        paths:
          - [両辺を正の数 4 でわる, 向きはそのまま, x > −3]
        note: 右辺が負の数なので、向きを変えてしまいやすい。向きを変えるのは、負の数をかける・わるときだけ。
      - part: 今日
        text: 不等式 −3x ≧ 15 を解くと、どれになりますか。
        choices: [x ≦ −5, x ≧ −5, x ≦ 5]
        answer: x ≦ −5
        check: "[c for c, f in {'x ≦ −5': lambda x: x <= -5, 'x ≧ −5': lambda x: x >= -5, 'x ≦ 5': lambda x: x <= 5}.items() if all(f(x) == (-3 * x >= 15) for x in range(-20, 21))][0]"
        hints:
          - 両辺を −3 でわりましょう。
          - 負の数でわると、不等号の向きはどうなるでしょう。
          - 15 ÷ (−3) の符号にも気をつけましょう。
        paths:
          - [両辺を負の数 −3 でわる, 向きが反対になる, x ≦ −5]
        note: 向きを変え忘れて x ≧ −5 としやすい。答えの範囲から 1 つ（x = −6 など）選んで、元の式に入れて確かめさせる。
      - part: 挑戦
        text: 不等式 −x/2 < 3 を満たす整数のうち、いちばん小さいものはいくつですか。
        answer: −5
        check: "(lambda v: f'−{-v}' if v < 0 else f'{v}')(min(x for x in range(-50, 51) if Fraction(-x, 2) < 3))"
        hints:
          - 両辺に −2 をかけると、左辺が x だけになります。
          - 負の数をかけると、不等号の向きはどうなるでしょう。
          - 範囲の境目の数は、解にふくまれるでしょうか。
        paths:
          - [両辺に −2 をかけて向きを変える, x > −6, −6 はふくまないので −5]
        note: 境目の −6 を答えやすい。> は等しい場合をふくまない。
    extra:
      - part: 今日
        text: 不等式 x + 8 > 3 を解くと、どれになりますか。
        choices: [x > −5, x > 11, x < −5]
        answer: x > −5
        check: "[c for c, f in {'x > −5': lambda x: x > -5, 'x > 11': lambda x: x > 11, 'x < −5': lambda x: x < -5}.items() if all(f(x) == (x + 8 > 3) for x in range(-20, 21))][0]"
        hints:
          - 左辺を x だけにするには、両辺から何をひけばよいでしょう。
          - 両辺から同じ数をひいても、向きは変わりません。
          - 3 − 8 を計算しましょう。
        paths:
          - [両辺から 8 をひく, x > 3 − 8, x > −5]
      - part: 今日
        text: 不等式 x/3 ≦ −2 を解くと、どれになりますか。
        choices: [x ≦ −6, x ≧ −6, x ≦ −1]
        answer: x ≦ −6
        check: "[c for c, f in {'x ≦ −6': lambda x: x <= -6, 'x ≧ −6': lambda x: x >= -6, 'x ≦ −1': lambda x: x <= -1}.items() if all(f(x) == (Fraction(x, 3) <= -2) for x in range(-20, 21))][0]"
        hints:
          - 両辺に 3 をかけましょう。
          - 3 は正の数なので、向きはどうなるでしょう。
          - (−2) × 3 を計算しましょう。
        paths:
          - [両辺に正の数 3 をかける, 向きはそのまま, x ≦ −6]
      - part: 挑戦
        text: 不等式 −5x < −20 を解くと、どれになりますか。
        choices: [x > 4, x < 4, x > −4]
        answer: x > 4
        check: "[c for c, f in {'x > 4': lambda x: x > 4, 'x < 4': lambda x: x < 4, 'x > −4': lambda x: x > -4}.items() if all(f(x) == (-5 * x < -20) for x in range(-20, 21))][0]"
        hints:
          - 両辺を −5 でわりましょう。
          - 負の数でわると、向きは反対になります。
          - (−20) ÷ (−5) の符号に気をつけましょう。
        paths:
          - [両辺を負の数 −5 でわる, 向きが反対になる, x > 4]

  - day: 3
    items:
      - part: 見本
        text: 不等式 5x − 3 > 2x + 9 と 2x + 7 ≧ 5x − 2 を解いてみましょう。
        explain: 両辺に同じ数を足しても、ひいても向きは変わらないので、不等式でも方程式と同じように移項できます。5x − 3 > 2x + 9 は 5x − 2x > 9 + 3、3x > 12 で、両辺を正の数 3 でわって x > 4 です。2x + 7 ≧ 5x − 2 は 2x − 5x ≧ −2 − 7、−3x ≧ −9 で、両辺を負の数 −3 でわるので、向きを変えて x ≦ 3 です。x の項を右辺に集めて 9 ≧ 3x、3 ≧ x としても、同じ答えになります。このように移項して ax > b のような形にし、x の範囲を求めることを、不等式を解くといいます。かっこや分母があるときも、方程式と同じように、かっこを外し、分母をはらってから解きます。
      - part: 思い出す
