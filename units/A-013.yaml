        explain: 3 < 5 の両辺に 2 を足すと 5 < 7、2 をかけると 6 < 10 で、不等号の向きは変わりません（ひく、正の数でわるときも同じです）。ところが、両辺に −2 をかけると −6 と −10 になり、−6 > −10 で、向きが反対になります。図のように、負の数をかけると 0 の反対側に移って、左右のならびが入れかわるからです。まとめると、① 両辺に同じ数を足しても、ひいても、向きは変わらない。② 両辺に同じ正の数をかけても、わっても、向きは変わらない。③ 両辺に同じ負の数をかけたり、わったりすると、向きが反対になる。これを不等式の性質といいます。方程式と同じように、この性質を使って不等式を解きます。x + 4 < 1 は両辺から 4 をひいて x < −3、−2x < 6 は両辺を −2 でわり、向きを変えて x > −3 です。
      - part: 思い出す
        id: "5b79824445"
        text: 次のうち、不等式 x + 5 ≧ 8 の解はどれですか。
        choices: [x = 3, x = 2, x = −3]
        answer: x = 3
        check: "[c for c, v in {'x = 3': 3, 'x = 2': 2, 'x = −3': -3}.items() if v + 5 >= 8][0]"
        hints:
