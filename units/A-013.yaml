          - text: 両辺に 2 をかけて、分母をはらいましょう。右辺は、x − 3 の全体に 2 をかけます。
            svg: '<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg"><text x="113.4" y="80" font-size="18" text-anchor="middle" fill="currentColor">(x + 1)/2</text><text x="172.7" y="80" font-size="18" text-anchor="middle" fill="currentColor">&gt;</text><text x="219.3" y="80" font-size="18" text-anchor="middle" fill="currentColor">x − 3</text><rect x="94.4" y="18" width="38" height="22" rx="8" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="113.4" y="34" font-size="14" text-anchor="middle" fill="currentColor">×2</text><line x1="113.4" y1="42" x2="113.4" y2="51.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="113.4,58 109,50 117.8,50" fill="currentColor"/><rect x="200.3" y="18" width="38" height="22" rx="8" fill="#f3c969" fill-opacity="0.55" stroke="currentColor" stroke-width="2"/><text x="219.3" y="34" font-size="14" text-anchor="middle" fill="currentColor">×2</text><line x1="219.3" y1="42" x2="219.3" y2="51.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polygon points="219.3,58 214.9,50 223.7,50" fill="currentColor"/><text x="160" y="108" font-size="13" text-anchor="middle" fill="currentColor">両辺の全体に 2 をかける</text></svg>'
          - かっこを外して移項すると、−x > □ の形になります。
          - −x > □ の両辺に −1 をかけると、向きはどうなるでしょう。
