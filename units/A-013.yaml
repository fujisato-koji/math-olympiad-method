      - part: 今日
        id: "019582103b"
        text: 不等式 (x + 1)/2 > x − 3 を解くと、どれになりますか。
        choices: [x < 7, x > 7, x < 4]
        answer: x < 7
        check: "[c for c, f in {'x < 7': lambda x: x < 7, 'x > 7': lambda x: x > 7, 'x < 4': lambda x: x < 4}.items() if all(f(x) == (Fraction(x + 1, 2) > x - 3) for x in range(-20, 21))][0]"
