      - part: わけ
        text: a < b のとき、両辺に負の数 c をかけると ac > bc となる（向きが反対になる）ことを、筋道を立てて書きましょう。「p < q は、q − p が正の数であること」と、正負の数のかけ算のきまりを使います。
        explain: 例：「a < b、c は負の数とする。a < b なので b − a は正の数で、a − b は負の数である。分配法則で ac − bc = (a − b)c と変形できる。a − b も c も負の数なので、その積 (a − b)c は正の数である（負の数どうしの積は正）。よって ac − bc は正の数なので、bc < ac、つまり ac > bc である。」と書ければよい。①「〜とする」で a、b、c を決める、② ac − bc を (a − b)c と式を変形する、③ 約束した事実（p < q は q − p が正、負の数どうしの積は正、N-027）で結ぶ、の 3 つがそろっているかを見る。3 < 5 に −2 をかけた例だけで終わっていたら、例ではすべての a、b、c について示せないことを話す。
        hints:
          - 「a < b、c は負の数とする」から書き始めましょう。
          - ac > bc を示すには、ac − bc が正の数であることを言えばよいです。ac − bc を分配法則でまとめましょう。
          - まとめた式の 2 つの因数の符号を考え、正負の数のかけ算のきまりで結びましょう。
        paths:
          - [a < b、c < 0 とする, a − b は負の数, ac − bc = (a − b)c, 負の数どうしの積は正, ac − bc > 0 で ac > bc]
      - part: わけ
        text: 不等式 2x + 3 < 11 の解が x < 4 であることを、不等式の性質を使って、筋道を立てて書きましょう。x < 4 を満たす数がすべて解であること（逆の向き）も書きます。
        explain: 例：「x が 2x + 3 < 11 を成り立たせる数だとする。両辺から 3 をひいても向きは変わらないので 2x < 8。両辺を正の数 2 でわっても向きは変わらないので x < 4。逆に、x < 4 とする。両辺に正の数 2 をかけて 2x < 8、両辺に 3 を足して 2x + 3 < 11。よって、2x + 3 < 11 の解は x < 4 である。」と書ければよい。①「〜とする」、② 式を変形する、③ どの変形も不等式の性質で結ぶ、の 3 つがそろっているかを見る。x = 3 や x = 0 を入れて確かめただけでは、「4 より小さいすべての数」が解で、それ以外は解でないことまでは示せないことを話す。
        hints:
