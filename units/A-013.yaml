# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    id: "1ab4ce7456"
    kinds: [読み取り]
    text: びじゅつかんの入り口に、図のお知らせがあります。ふつうの料金ではらうより、30 人分のだんたい料金をはらうほうが安くなるのは、何人以上のときですか。
    svg: '<svg viewBox="0 0 320 184" xmlns="http://www.w3.org/2000/svg"><line x1="52" y1="150" x2="40" y2="180" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line x1="268" y1="150" x2="280" y2="180" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><rect x="14" y="8" width="292" height="150" rx="8" fill="#f3c969" fill-opacity="0.18" stroke="currentColor" stroke-width="2"/><text x="160" y="34" font-size="16" text-anchor="middle" fill="currentColor" font-weight="bold">入館料</text><text x="160" y="60" font-size="15" text-anchor="middle" fill="currentColor">1 人 800 円</text><text x="160" y="88" font-size="13" text-anchor="middle" fill="currentColor">30 人以上のだんたいは、全員 20% 引き</text><text x="160" y="114" font-size="13" text-anchor="middle" fill="currentColor">30 人に足りなくても、30 人分の</text><text x="160" y="136" font-size="13" text-anchor="middle" fill="currentColor">だんたい料金をはらえば、だんたいで入れます</text></svg>'
    answer: 25
    check: "min(n for n in range(1, 30) if 800 * n > 30 * 800 * 80 // 100)"
    hints:
      - 30 人分のだんたい料金は、いくらかな。
      - text: x 人のふつうの料金と、30 人分のだんたい料金をくらべよう。ふつうの料金のほうが高くなるときを、不等式で表そう。
