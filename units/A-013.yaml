        text: 不等式 5x − 3 > 2x + 9 と 2x + 7 ≧ 5x − 2 を解いてみましょう。
        svg: '<svg viewBox="0 0 320 222" xmlns="http://www.w3.org/2000/svg"><rect x="57.2" y="15" width="35.2" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><text x="74.8" y="36" font-size="16" text-anchor="middle" fill="currentColor">5x</text><rect x="100.4" y="15" width="46.4" height="30" rx="7" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="123.6" y="36" font-size="16" text-anchor="middle" fill="currentColor">− 3</text><text x="163.2" y="37" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">&gt;</text><rect x="179.6" y="15" width="35.2" height="30" rx="7" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="197.2" y="36" font-size="16" text-anchor="middle" fill="currentColor">2x</text><rect x="222.8" y="15" width="40" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><text x="242.8" y="36" font-size="16" text-anchor="middle" fill="currentColor">+ 9</text><rect x="54" y="97" width="35.2" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><text x="71.6" y="118" font-size="16" text-anchor="middle" fill="currentColor">5x</text><rect x="97.2" y="97" width="56" height="30" rx="7" fill="#7fc8f8" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="125.2" y="118" font-size="16" text-anchor="middle" fill="currentColor">− 2x</text><text x="169.6" y="119" font-size="18" text-anchor="middle" fill="currentColor" font-weight="bold">&gt;</text><rect x="186" y="97" width="32" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><text x="202" y="118" font-size="16" text-anchor="middle" fill="currentColor">9</text><rect x="226" y="97" width="40" height="30" rx="7" fill="#f3c969" fill-opacity="0.5" stroke="currentColor" stroke-width="2"/><text x="246" y="118" font-size="16" text-anchor="middle" fill="currentColor">+ 3</text><path d="M123.6 47 C123.6 68.6 246 73.4 246 88" fill="none" stroke="#f3c969" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="246,95 240.5,85 251.5,85" fill="#f3c969"/><path d="M197.2 47 C197.2 68.6 125.2 73.4 125.2 88" fill="none" stroke="#7fc8f8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="125.2,95 119.7,85 130.7,85" fill="#7fc8f8"/><text x="72" y="150" font-size="17" text-anchor="middle" fill="currentColor">3x &gt; 12</text><text x="118" y="149" font-size="13" text-anchor="start" fill="currentColor">左辺と右辺をまとめる</text><text x="72" y="184" font-size="17" text-anchor="middle" fill="currentColor">x &gt; 4</text><text x="118" y="183" font-size="13" text-anchor="start" fill="currentColor">正の数 3 でわる（向きはそのまま）</text><text x="160" y="212" font-size="13" text-anchor="middle" fill="currentColor">反対の辺にうつすと、＋ と − が入れかわる</text></svg>'
        explain: 両辺に同じ数を足しても、ひいても向きは変わらないので、不等式でも方程式と同じように移項できます。図のように、5x − 3 > 2x + 9 の −3 を右辺に、2x を左辺に移項すると 5x − 2x > 9 + 3、まとめて 3x > 12 で、両辺を正の数 3 でわって x > 4 です。2x + 7 ≧ 5x − 2 は 2x − 5x ≧ −2 − 7、−3x ≧ −9 で、両辺を負の数 −3 でわるので、向きを変えて x ≦ 3 です。x の項を右辺に集めて 9 ≧ 3x、3 ≧ x としても、同じ答えになります。このように移項して ax > b のような形にし、x の範囲を求めることを、不等式を解くといいます。かっこや分母があるときも、方程式と同じように、かっこを外し、分母をはらってから解きます。
