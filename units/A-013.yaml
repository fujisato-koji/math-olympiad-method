# 腕だめし（離、D-047）：型を離れた問題。単元が済になってから開き、済の判定には入れない。
ri:
  - part: 離
    kinds: [読み取り]
    text: ある美術館の入館料は 1 人 800 円です。30 人以上の団体は、全員の入館料が 20% 引きになります。30 人に足りないときでも、30 人分の団体料金をはらえば、団体として入れます。何人以上のときに、30 人分の団体料金をはらうほうが安くなりますか。
    answer: 25
    check: "min(n for n in range(1, 30) if 800 * n > 30 * 800 * 80 // 100)"
    hints:
      - 30 人分の団体料金は、いくらかな。
      - x 人がふつうの料金ではらうといくらかな。それが団体料金より高くなるときを、不等式で表そう。
      - 「安くなる」なので、等しいときはふくまないよ。
    paths:
      - [団体料金は 800 × 0.8 × 30 = 19200 円, x 人のふつうの料金は 800x 円, 800x > 19200 より x > 24, 25 人以上]
    note: 割合（20% 引き）で団体料金を出し、不等式を立てて整数の範囲を読む。24 人のときはちょうど同じ金額なので「安くなる」には入らない。24 と答える間ちがいに注意。
  - part: 離
    kinds: [道筋]
    text: x についての不等式 3x + 2 ≦ a を満たす自然数 x が、ちょうど 4 こあります。このような整数 a のうち、いちばん大きいものはいくつですか。
    answer: 16
    check: "max(a for a in range(-50, 100) if sum(1 for x in range(1, 100) if 3 * x + 2 <= a) == 4)"
    hints:
      - 不等式を x ≦ … の形に解こう。
      - 自然数 x がちょうど 4 こ（1、2、3、4）になるのは、右辺がどんな範囲のときかな。数直線にかこう。
      - 5 が入ってはいけないね。等号が入るかどうかに気をつけよう。
    paths:
      - [x ≦ (a − 2)/3, 自然数が 1、2、3、4 の 4 こだけになるのは 4 ≦ (a − 2)/3 < 5, 14 ≦ a < 17, いちばん大きい整数は 16]
      - [a を 1 ずつ変えて調べる, a = 14 で x は 4 こになり a = 17 で 5 こになる, 16]
    note: 解の範囲の端（境目）に何が入るかを考える問題。「4 ≦ … < 5」の等号の付き方を取りちがえると 17 や 13 にずれる。数直線に 4 と 5 をかいて、5 が入らない条件を確かめさせる。
  - part: 離
    kinds: [総動員]
    uses: [G-050]
    text: t を整数とします。座標平面上の点 P(2t − 5, 9 − t) が第 1 象限にあり、さらに P の x 座標は y 座標より大きいとします。このような整数 t は、いくつありますか。ただし、座標軸の上の点は第 1 象限にふくめません。
    answer: 4
    check: "sum(1 for t in range(-50, 51) if 2 * t - 5 > 0 and 9 - t > 0 and 2 * t - 5 > 9 - t)"
    hints:
      - 第 1 象限の点は、x 座標と y 座標の符号がどうなっているかな。
      - 条件を 3 つの不等式に書こう。
      - 3 つの不等式をすべて満たす t の範囲を、数直線に重ねてかこう。
    paths:
      - [2t − 5 > 0 より t > 5/2, 9 − t > 0 より t < 9, 2t − 5 > 9 − t より t > 14/3, 14/3 < t < 9 の整数は 5、6、7、8 の 4 こ]
    note: 座標平面の象限（G-050）の条件を不等式に直し、3 つを同時に満たす範囲を数直線で重ねる。t > 5/2 だけを使って 3 と 4 も数える間ちがいが出やすい。
