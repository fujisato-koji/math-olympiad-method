# 概念の目録（D-231、D-240）：R-006 が初めて教える概念。1 つの概念に 1 項目。種類ごとに要る欄は docs/concepts.md の第 3 節。
# 試し（2026-11-21、D-234〜D-236）で書いた項目。書く係と確かめる係（Sonnet）が書き、取りまとめが当てた。
concepts:
- id: general-linear-group
  name: 一般線形群
  aka: ['GL(n, R)']
  kind: 定義
  claim: n を正の整数とし、成分が実数の n×n の行列全体を Mₙ(R) と書く。行列式が 0 でない行列の全体 GL(n, R) = {A ∈ Mₙ(R) | det A ≠ 0} に、行列の積を演算として考えたものを、一般線形群といい、GL(n, R) と書く。
  why: '群には《逆元》が要る。行列の積での逆元は逆行列で、逆行列をもつのは行列式が 0 でないときだけである（《逆行列の存在条件》）。そこで「行列式が 0 でない」で行列を集めると、逆行列をもつ行列をちょうど全部集めたものになる。ほかの決め方とのちがいは次のとおりである。Mₙ(R) 全体では、行列式 0 の行列に逆行列がなく、積について群にならない。行列式が 1 のものだけ集めると、より小さな集合（《SL(n, R)》）になる。

    名前に「群」と入っていても、この定義は名前を付けるだけで、群であることは言わない。それは定理《GL(n, R) は群》で示す。'
  examples: [(2 0；0 1)：行列式 2, (1 0；0 −1)：行列式 −1, (1 1；0 1)：行列式 1, 単位行列 I：行列式 1]
  nonexamples: [(1 1；1 1)：行列式 0, (1 0；0 0)：行列式 0, 零行列：行列式 0]
  uses: [det-2x2, invertibility-det-criterion]
  home: {unit: R-006, day: 1}
  background: 'GL は general linear（一般線形）の頭文字。幾何では、GL(n, R) の行列は、空間をつぶさない（次元を落とさない）n 次元の 1 次変換を表す。行列式の絶対値が面積（体積）の倍率、符号が向きである（《面積の倍率としての行列式》）。複素数の成分の GL(n, C) や、ベクトル空間 V の GL(V) も同じように決める。

    M-004 で示すのは 2×2 の場合で、n×n の行列式の性質（積の定理、逆行列の存在条件）は、まだ目録に項目がない（docs/concepts.md の 6.5）。'
- id: gl-is-group
  name: GL(n, R) は群
  kind: 定理
  claim: 'n を正の整数とする。GL(n, R) は、行列の積について《群》である。すなわち、次の 4 つが成り立つ。

    ① A、B ∈ GL(n, R) ならば AB ∈ GL(n, R)。

    ② すべての A、B、C ∈ GL(n, R) について (AB)C = A(BC)。

    ③ 単位行列 I ∈ GL(n, R) で、すべての A ∈ GL(n, R) について IA = AI = A。

    ④ A ∈ GL(n, R) ならば、逆行列 A⁻¹ があり、A⁻¹ ∈ GL(n, R) で AA⁻¹ = A⁻¹A = I。'
  sketch: 行列式の積の定理で積が行列式 0 にならないことを、逆行列の存在条件と逆行列の行列式で逆元がまた入ることを示す。結合法則は行列の積の成分の和の順を入れかえるだけである。
  proof: '① A、B ∈ GL(n, R) とする。det A ≠ 0、det B ≠ 0 で、《行列式の積の定理》より det(AB) = det A · det B ≠ 0。よって AB ∈ GL(n, R)（閉じている）。

    ② (AB)C の (i, l) 成分は、a_(ij)b_(jk)c_(kl) を j と k のすべての組について足したものである。A(BC) の (i, l) 成分も同じ和である。足す順を入れかえても和は変わらないので (AB)C = A(BC)（結合法則）。

    ③ I は、IA = AI = A を満たす。また II = I なので I は逆行列 I をもち、《逆行列の存在条件》より det I ≠ 0。よって I ∈ GL(n, R)。I がこの群の単位元である。

    ④ A ∈ GL(n, R) とする。det A ≠ 0 なので、《逆行列の存在条件》より逆行列 A⁻¹ があり、AA⁻¹ = A⁻¹A = I。《逆行列の行列式》より det(A⁻¹) = 1/det A ≠ 0。よって A⁻¹ ∈ GL(n, R)（逆元がある）。

    ⑤ ①〜④ で《群》の 4 つの条件が成り立つ。'
  uses: [group, closure, associativity, identity-element, inverse-element, general-linear-group, det-product, det-inverse, invertibility-det-criterion, M-016]
  home: {unit: R-006, day: 1}
  background: 'GL(n, R) はふつう非可換である（n ≥ 2 では AB ≠ BA となる行列がある）。群であることが分かって初めて、《行列群》の「GL の部分群」という言い方ができる。複素数の成分の GL(n, C) でも、証明はそのまま通る。

    M-004 で示すのは 2×2 の場合で、n×n の行列式の性質（積の定理、逆行列の存在条件）は、まだ目録に項目がない（docs/concepts.md の 6.5）。'
- id: special-linear-group
  name: 特殊線形群
  aka: ['SL(n, R)']
  kind: 定義
  claim: n を正の整数とする。《一般線形群》GL(n, R) のうち、行列式が 1 の行列の全体 SL(n, R) = {A ∈ GL(n, R) | det A = 1} に、行列の積を演算として考えたものを、特殊線形群といい、SL(n, R) と書く。
  why: '行列式の絶対値は面積（体積）の倍率、符号は向きを表す（《面積の倍率としての行列式》）。行列式が 1 の行列は、面積（体積）も向きもかえない 1 次変換を表す。区別したいのは、行列式が 1 のものと、行列式が 1 か −1 のものである。後者は面積をかえないが、向きを裏返す変換（行列式 −1）を含む。向きまでたもつ変換だけを集めたいので「1」と決める。det A = 1 なら det A ≠ 0 なので、A ∈ GL(n, R) は自動的に成り立つ。

    名前に「群」と入っていても、この定義は名前を付けるだけで、群であることは言わない。それは定理《SL(n, R) は GL(n, R) の部分群》で示す。'
  examples: [(1 1；0 1)：行列式 1, (1 2；0 1)：行列式 1, (0 −1；1 0)：行列式 1（90° の回転）, 単位行列 I]
  nonexamples: [(1 0；0 −1)：行列式 −1（向きが裏返る）, (2 0；0 1)：行列式 2（面積が 2 倍）, (1 1；1 1)：行列式 0（GL にも入らない）]
  uses: [general-linear-group, det-area-scale, det-2x2]
  home: {unit: R-006, day: 1}
  background: 'SL は special linear（特殊線形）の頭文字。SL(n, R) は、行列式を GL(n, R) から 0 でない実数のかけ算の群への対応と見たときの、単位元（1）に写るものの全体（核）になっている。複素数の成分の SL(n, C) も同じように決める。

    M-004 で示すのは 2×2 の場合で、n×n の行列式の性質（積の定理、逆行列の存在条件）は、まだ目録に項目がない（docs/concepts.md の 6.5）。'
- id: sl-is-subgroup
  name: SL(n, R) は GL(n, R) の部分群
  kind: 定理
  claim: n を正の整数とする。《特殊線形群》SL(n, R) は、行列の積について、《一般線形群》GL(n, R) の《部分群》である。
  sketch: 部分群の判定法の 3 条件を確かめる。I が入る、積の行列式は 1 の積で 1、逆行列の行列式は 1 の逆数で 1。
  proof: 'GL(n, R) は《GL(n, R) は群》で、行列の積について群であり、単位元は I である。SL(n, R) ⊂ GL(n, R) について、《部分群の判定法》の 3 つを確かめる。

    ① 空でない：I ∈ GL(n, R) で、I·I = I より det I = (det I)²。det I ≠ 0 なので det I = 1。よって I ∈ SL(n, R)。

    ② 積で閉じている：A、B ∈ SL(n, R) とする。AB ∈ GL(n, R) で、《行列式の積の定理》より det(AB) = det A · det B = 1·1 = 1。よって AB ∈ SL(n, R)。

    ③ 逆元で閉じている：A ∈ SL(n, R) とする。A⁻¹ ∈ GL(n, R) で、《逆行列の行列式》より det(A⁻¹) = 1/det A = 1。よって A⁻¹ ∈ SL(n, R)。

    ④ ①〜③ より、判定法から SL(n, R) は GL(n, R) の部分群である。'
  uses: [subgroup-test, subgroup, gl-is-group, general-linear-group, special-linear-group, det-product, det-inverse, invertibility-det-criterion]
  home: {unit: R-006, day: 1}
  background: '図の 1 つの例（ある A、B で面積が 1 のままだった）からは言えない。どの A、B でも言えることを、行列式の積と逆数で示すのが要点である。別の見方では、det が GL(n, R) から 0 でない実数のかけ算の群への準同型で、SL(n, R) はその核になる。準同型の核が部分群になることは R-001 で習う。

    M-004 で示すのは 2×2 の場合で、n×n の行列式の性質（積の定理、逆行列の存在条件）は、まだ目録に項目がない（docs/concepts.md の 6.5）。'
- id: matrix-group
  name: 行列群
  aka: [線形群]
  kind: 定義
  claim: n を正の整数とする。n×n の実行列の集まり G が、行列の積について、単位行列 I を単位元として《群》の 4 つの条件（《閉じている》・《結合法則》・《単位元》・《逆元》）を満たすとき、G を n 次の行列群という。
  why: 群の要素を具体的な行列で表すと、群の計算を行列の計算として実際にできる。ここで「行列の積について群になる行列の集まり」とだけ決めると、ねらいにないものまで入る。例えば {(t 0；0 0) | t は 0 でない実数} は積について群をなすが、単位元は (1 0；0 0) で I ではなく、どの要素も行列式が 0 である。そこで「単位行列 I を単位元とする」と決める。こうすると、どの要素も逆行列をもち、行列群はどれも《一般線形群》の部分群になる（定理《行列群は GL(n, R) の部分群》）。
  examples: ['《一般線形群》GL(n, R)', '《特殊線形群》SL(n, R)', '{I, −I}（2 次）：(−I)(−I) = I', 回転の行列 (cosθ −sinθ；sinθ cosθ) の全体（2 次）, '{I}']
  nonexamples: ['{(t 0；0 0) | t ≠ 0}：積で群だが、行列式が 0 で GL(2, R) に入らない', 行列式が 2 の行列の全体：I が入らず、積の行列式は 4 で閉じていない, 零行列を含む集合：逆行列がない]
  uses: [group]
  home: {unit: R-006, day: 1}
  background: 行列群の例として、直交行列の群 O(n)、回転の群 SO(n)、ユニタリ行列の群 U(n)、SU(n) などが R-006 の後の日で出る。リー群論では、さらに閉部分群という条件を付けて行列群とする本もある。ここでは代数だけで決まる形にした。
- id: matrix-group-in-gl
  name: 行列群は GL(n, R) の部分群
  kind: 定理
  claim: n を正の整数とする。n 次の《行列群》G は、どれも《一般線形群》GL(n, R) の《部分群》である。逆に、GL(n, R) の部分群は、どれも n 次の行列群である。
  proof: '① G を n 次の行列群とし、A ∈ G とする。G の単位元は I なので、G の中に AB = BA = I となる B がある。

    ② 《行列式の積の定理》より det A · det B = det I = 1 なので、det A ≠ 0 である。よって A ∈ GL(n, R) で、G ⊂ GL(n, R) である。

    ③ AB = BA = I なので、B は GL(n, R) での A の逆元で、《逆元の一意性》より B = A⁻¹ である。

    ④ G は I を含むので空でなく、積について閉じていて、どの A ∈ G についても A⁻¹ ∈ G である。《部分群の判定法》より、G は GL(n, R) の部分群である。

    ⑤ 逆に、H を GL(n, R) の部分群とし、H の単位元を e とする。e·e = e の両辺に、左から GL(n, R) での e の逆元をかけると e = I である。H は積について閉じ、結合法則を満たし、どの要素にも H の中に逆元があるので、I を単位元として群の 4 つの条件を満たす。よって H は n 次の行列群である。'
  uses: [matrix-group, general-linear-group, subgroup, subgroup-test, det-product, inverse-uniqueness, gl-is-group]
  home: {unit: R-006, day: 1}
  background: 'R-006 の 1 日目の見本は、行列群を「単位行列 I を単位元として群の条件を満たす正方行列の集まり」と決める。教科書によっては「GL(n, R) の部分群」と決めるが、この定理から、2 つの決め方は同じものを指す。

    M-004 で示すのは 2×2 の場合で、n×n の行列式の性質（積の定理、逆行列の存在条件）は、まだ目録に項目がない（docs/concepts.md の 6.5）。'
