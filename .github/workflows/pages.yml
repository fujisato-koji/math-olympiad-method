name: pages

# 画面（site/）を gh-pages ブランチに置き、GitHub Pages で公開する。
# マージ前の確認のため、作業のブランチ design/roadmap からも置く。
on:
  push:
    branches: [main, design/roadmap]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 地図と問題を確かめ、画面のデータを作る
        run: python tools/roadmap.py build
      - name: site/ を gh-pages に置く
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "site from ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
