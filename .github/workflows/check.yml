name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 地図と問題を確かめ、作ったものが最新かを見る
        run: |
          python tools/roadmap.py build
          git diff --exit-code site/data.js docs/roadmap.md docs/coverage.md || (git status --short; exit 1)
