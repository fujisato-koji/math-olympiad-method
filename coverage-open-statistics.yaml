items:
- id: T-01
  field: 推測の基礎
  topic: ベーレンス–フィッシャー問題：分散の違う 2 つの正規母集団の平均の差を検定する（未解決（限定付き）。完全十分統計量に基づく正確な検定はないと示され（リンニク）、近似の解が使われる）
  sources:
  - OP145
  units:
  - S-019
  - S-021
  - S-033
- id: T-02
  field: 因果
  topic: 観察データからの因果推論：無作為化できないとき、原因と結果をどう見分けるか（一部解決。自然実験の方法で 2021 年のノーベル経済学賞。測っていない交絡には一般の解がない）
  sources:
  - OP140
  - OP148
  units:
  - S-042
  - S-031
  - F-033
- id: T-03
  field: 再現性
  topic: 再現性の危機と p 値：研究の結果がくり返し確かめられないのはなぜか、どう推論すべきか（未決着。2014 年の報告は再現性の危機を最初の課題に挙げ、ASA は 2016 年に p 値の誤用を戒める 6 原則を出した）
  sources:
  - OP141
  - OP142
  units:
  - S-019
  - S-040
  - S-022
- id: T-04
  field: 学習の理論
  topic: 過剰パラメータのモデルの汎化：データより多いパラメータの深層網はなぜ当たるのか（一部解決。二重降下（2019）は線形モデルなどで定量的に説明されたが、深層網の一般の理論はない）
  sources:
  - OP140
  - OP143
  - OP144
