- id: T-06
  field: 学習の理論
  topic: 分布によらない不確かさの定量化：AI の予測の幅を、分布を仮定せずに保証できるか（一部解決。コンフォーマル予測で平均の被覆は保証されるが、条件付きの被覆は仮定なしには不可能と示された）
