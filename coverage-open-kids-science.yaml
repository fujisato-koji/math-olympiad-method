  - S-009
- id: T-15
  field: 問い
  topic: 地球には何種類の生き物がいるか（問い）：名前の付いた生き物は約 120 万種あるが、まだ見つかっていない生き物はどれだけいるのか（未解決）
  sources:
  - OP111
  - OP113
  units:
  - B-018
  - B-025
  - N-061
  - S-028
- id: T-16
  field: 攻め方
  topic: 地球には何種類の生き物がいるかの攻め方：分類の階層（属、科、目）ごとの数の規則から種の数を推定する（真核生物で約 870 万種、2011）、標識再捕法などの調査の統計、DNA の配列で生き物を見分ける
  sources:
