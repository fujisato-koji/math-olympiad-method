- id: T-03
  field: 回路
  topic: 脳の配線図から働きへ：結線図で脳の計算を説明できるか（一部解決。成虫のショウジョウバエの全脳 139,255 ニューロン（2024）とマウスの視覚野 約 1 mm³（2025）の結線図はできたが、働きの説明は途上）
  sources:
