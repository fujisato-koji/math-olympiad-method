kinds:
  わけ: その段の深さで、わけを示す（口で言う、文で書く、定義から筋道を立てて書く）
  導入: 見本（解いた例）を見せてから解く
  練習: 同じ型を少しずつ変えて解く
  混ぜる: 前の日や前の単元の型と混ぜて解く（交互練習）
  確認: 8 割できたら単元を済にする

units:
  # ---- 段 1 もの ----
  - id: N-001
    title: 10 までの数
    stage: 1
    region: kazu
    needs: []
    plan:
      - 導入: 10 までの数を数える
      - 練習: どちらが多いか、少ないか
      - 導入: いくつといくつ（10 までの合成と分解）
      - 混ぜる: 1〜3 日目の型を混ぜる
      - 確認: 10 までの数
  - id: N-002
    title: 数直線
    stage: 1
    region: kazu
    needs: [N-001]
    plan:
      - 導入: 数直線に数をならべる
      - 練習: 右へ進むとふえる、左へもどるとへる
      - 練習: いくつ進んだか、いくつもどったか
      - 混ぜる: N-001 と混ぜる
      - 確認: 数直線
  - id: N-003
    title: たし算とひき算（数直線で進む、もどる）
