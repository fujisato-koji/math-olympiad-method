# 地図：単元と前提（組み合わせなしのフロー）
#
# 単元の記号は「流れ-通し番号」（例 N-001 は「数」の流れの 1 番）。段は stage に書く（D-016）。
# needs は前提（済んでから始める単元）。流れをまたぐ前提は、知識として欠かせないものだけにする。
# 2 つの流れの考えを合わせて解く単元（組み合わせ）は、ここには入れない（D-008）。
# 単元は論題で名付ける。「IMO の○○」のような寄せ集めは作らず、本番の水準の総合演習は組み合わせの層で扱う（D-013）。
# 並べる順は、学年や学習指導要領ではなく、人がその考えを理解できる順にする（D-014）。
# もっと広く使える道具を理解できるなら、それを本線にし、特別な解き方は問題の別のみちすじにする。
# IMO に要る論題を受け持っているかは coverage.yaml で確かめる（R-09）。
# measure: true は、目標には要らないが、段の物差しの大会（算数オリンピックなど）で問われるので置く単元。
# plan があれば 1 日分ずつのねらい、なければ days の日数で既定の並び（導入、練習…、混ぜる、確認）。

lanes:
  - {id: N, name: 数, note: 数と整数}
  - {id: A, name: 式, note: 式と代数}
  - {id: C, name: 数える, note: 数え上げと組合せ}
  - {id: G, name: 図形, note: 図形と幾何}
  - {id: L, name: 論理, note: 論理と証明}
  - {id: D, name: 解析, note: 微積分、実解析、複素解析、微分方程式、関数解析}
  - {id: M, name: 線形代数, note: 行列と線形の計算、抽象的なベクトル空間}
  - {id: R, name: 代数学, note: 群・環・体・加群・表現・リー理論・可換環・ホモロジー代数・圏論}
  - {id: T, name: 幾何と位相, note: 位相、多様体、代数的位相、代数幾何}
  - {id: S, name: 確率と統計, note: 大学の確率、測度論的確率、確率過程、統計}
  - {id: K, name: 計算, note: 数値解析と最適化}
  - {id: P, name: 物理, note: 力学から場の量子論、宇宙論まで}
  - {id: E, name: 工学, note: 流体、熱と推進、構造、制御、宇宙機、回路と信号、通信、土木と建築、音響、化学工学、環境工学、生体工学、産業バイオ}
  - {id: H, name: 化学, note: 物質と反応、原子と結合、熱力学と反応速度、無機、有機、分析（C は数えるで使うので水素の H）}
  - {id: B, name: 生物, note: 生き物のつくり、細胞、遺伝、分子生物学、生理、進化と生態}
  - {id: F, name: 経済と金融, note: 金利と現在価値、保険数理、年金、投資と派生商品、会計と経済の入口}
  - {id: W, name: 地球科学, note: 鉱物と岩石、地層と地球の歴史、プレートと地球の内部、地震と火山、地球化学と古気候、水と氷（大気と海洋の力学は物理の流れ）}
  - {id: I, name: 医学と健康, note: 人体の構造と機能、病気のしくみ、薬と毒、感染と免疫、臨床医学、疫学と公衆衛生、栄養、医療の最前線（神経科学は B に残す）}
  - {id: Q, name: 心理学と認知科学, note: 知覚、注意と記憶、学習、言語と思考、判断と意思決定、発達、社会の認知、感情と動機、研究の方法と心理測定、臨床心理の科学的な基礎、計算論的認知科学（検証で支持されなかった古い説は、置き換えた現代の知見の形で扱う）}
  - {id: V, name: 農学と獣医学, note: 作物の栽培化と育種（ゲノム育種）、作物の生理と収量、土と植物の栄養、病害虫と防除、農業と気候、家畜と養殖と動物の福祉、獣医学（比較の病理、人獣共通感染症とワンヘルス）、食品の科学と安全}
  - {id: Y, name: 社会科学（実証）, note: 実証の部分だけ。解釈と規範の判断は入れない（D-115、D-118）。社会科学の方法（調査の設計、測定、社会実験、準実験による因果推論、社会ネットワーク、計算社会科学）、社会学（人口学、階層と移動、家族、犯罪、近隣）、政治学（政治行動、比較政治、武力紛争、公共政策の評価）、メディアの効果、教育の効果と学力の測定}


stages:
  - {id: 1, name: もの, about: ものを数える、比べる、形を全体で見る、並びのきまりに気づく, minutes: 15, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [1, 1]}
  - {id: 2, name: 数, about: 数えた結果を数として扱う、位、数直線の上の位置と向き、偶奇、□, minutes: 20, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [1, 2]}
  - {id: 3, name: 量と比, about: 「いくつ分」で掛ける、割る、分ける。分数を 1 つの数とみる、比と割合、面積、倍数と約数、累乗、確率、比例, minutes: 30, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [2, 2]}
  - {id: 4, name: 一般の数, about: 文字を「わからない数」と「どの数でも」として使う。等式の変形、展開、平方根、不等式、帰納法、背理法、合同と相似, minutes: 40, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [2, 3]}
  - {id: 5, name: 関係, about: 文字を変わる数として扱う。関数と写像、座標、三角関数、数列、ベクトル、期待値, minutes: 45, day: {思い出す: 2, 今日: 2, 挑戦: 1}, reason: [3, 3]}
  - {id: 6, name: 構造, about: 操作と同じとみなす組を対象にする。余りの類、多項式、関数方程式、不変量、グラフ、不等式の形、図形の配置, minutes: 60, day: {思い出す: 1, 今日: 2, 挑戦: 1}, reason: [3, 3]}
  - {id: 7, name: 構造を移す, about: 問題を別の構造に写して解く。複素数や重心座標、母関数、確率、射影変換, minutes: 90, day: {思い出す: 1, 今日: 1, 挑戦: 1}, reason: [3, 3]}
  - {id: 8, name: 公理の構造, about: 定義と公理から世界をつくる。群、環、体、ベクトル空間、ε-δ、距離と位相, minutes: 90, day: {思い出す: 1, 今日: 1, 挑戦: 1}, reason: [4, 4]}
  - {id: 9, name: 構造のあいだ, about: 構造を保つ写像そのものを対象にする。同型、表現、分類、圏と関手, minutes: 120, day: {思い出す: 0, 今日: 1, 挑戦: 1}, reason: [4, 4]}
  - {id: 10, name: 新しい対象をつくる, about: 定義を選び、予想し、反例で直す。理解を人に伝える, minutes: 120, day: {思い出す: 0, 今日: 1, 挑戦: 1}, reason: [5, 5]}

