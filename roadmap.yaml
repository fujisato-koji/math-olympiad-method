  - {id: open-physics, name: "物理学の大きな未解決問題（統一理論、暗黒物質、物質と反物質など）", kind: 未解決問題, field: 物理, level: "大学院（博士）以上", region: "国際", note: "重力と量子の法則を 1 つにまとめる、宇宙の見えない物質の正体を突き止める、反物質がなぜ消えたのかを解く、といった物理学者がまだ答えを出せていない問いに挑む。", coverage: coverage-open-physics.yaml, basis: "米国の素粒子物理の計画 P5（2023、6 つの科学の駆動要因）、欧州素粒子物理戦略 2020 の Physics Briefing Book（強い CP 問題と階層性問題）、Science 誌の特集 \"What Don't We Know?\"（2005）の物理の問い。2026 年の状況は各実験の論文と公式発表で確かめた（2026-11-08）。", beyond: "解けたと言えるのは、実験の発見（5σ）が別の実験でも確かめられ、理論が査読誌に載って受け入れられたとき。大型の実験は数百〜数千人の共同研究で、加速器・検出器・計算の技術と長い年月の計画が要る。LZ が 2026 年に報告した 1 事象（大域 2.6σ）は発見に数えない。"}
  - {id: open-chemistry, name: "化学の大きな未解決問題（生命のキラリティ、人工光合成、周期表の果てなど）", kind: 未解決問題, field: 化学, level: "大学院（博士）以上", region: "国際", note: "生き物の分子はなぜ片方の「手」の形だけなのか、太陽の光と水から燃料をつくれるか、周期表はどこまで続くのか、といった化学の謎に挑む。", coverage: coverage-open-chemistry.yaml, basis: "上海交通大学と Science 誌の \"125 Questions: Exploration and Discovery\"（2021）の化学の問い（周期表は完成するか、生命はなぜキラリティを必要とするか）と、Science 誌の \"What Don't We Know?\"（2005、自己組織化）。窒素固定、人工光合成、結晶構造の予測、交換相関汎関数は、それぞれの分野の一次資料（Nature の手順の論文、CCDC のブラインドテスト、総説）で未解決と確かめた（2026-11-08）。", beyond: "新しい元素は IUPAC と IUPAP の合同作業部会が認めて初めて発見になる。触媒や光触媒は、同位体で汚染を除いた再現と長時間の耐久の試験が要る。合成と測定の実験の腕と、大きな計算資源。"}
  - {id: open-biology, name: "生物学の大きな未解決問題（生命の起源、真核細胞の誕生、再生など）", kind: 未解決問題, field: 生物, level: "大学院（博士）以上", region: "国際", note: "生命はどう始まったのか、私たちの体の細胞はどう生まれたのか、イモリは手足が生えかわるのに人はなぜできないのか、といった生き物の大きな謎に挑む。", coverage: coverage-open-biology.yaml, basis: "Science 誌の特集 \"What Don't We Know?\"（2005）の生命科学の問い（生命の起源、器官の再生、細胞の運命、人に固有の遺伝的変化）。進展は Nature の論文とノーベル賞の公式の発表で確かめた（2026-11-08）。", beyond: "培養、ゲノム編集、顕微鏡、配列決定などの実験の技術と、何年も続く実験の計画。人の胚や遺伝子を扱う研究は、倫理審査と規制に従う。"}
  - {id: open-medicine, name: "医学の大きな未解決問題（HIV のワクチン、アルツハイマー病、がん、薬剤耐性菌など）", kind: 未解決問題, field: 医学, level: "大学院（博士）以上", region: "国際", note: "エイズを防ぐワクチン、アルツハイマー病やがんを治す方法、薬の効かない細菌への対策、老化を遅らせる方法など、多くの人の命にかかわる、まだ解けていない問題に挑む。", coverage: coverage-open-medicine.yaml, basis: "Science 誌の \"What Don't We Know?\"（2005、HIV のワクチン、免疫の選択的な抑制、寿命の延長）、上海交通大学と Science 誌の 125 Questions（2021、老化、がん、神経変性疾患）、WHO の細菌の優先病原体の一覧（2024）、NIAID の万能インフルエンザワクチンの戦略計画（2018）、Cancer Grand Challenges（2023）。2026 年の状況は FDA の記録と論文で確かめた（2026-11-08）。", beyond: "治療が解決と言えるのは、無作為化比較試験で効果と安全が示され、規制当局が承認したとき。臨床研究の資格、倫理審査、何千人もの参加者、10 年を超える開発と大きな費用が要る。"}
  - {id: open-earth, name: "地球科学の大きな未解決問題（地震の予知、プレートテクトニクスの始まり、気候感度など）", kind: 未解決問題, field: 地球科学, level: "大学院（博士）以上", region: "国際", note: "地震はいつ起きるか分かるのか、地球の磁場はどう生まれるのか、地球の水はどこから来たのか、二酸化炭素が増えると地球は何度暖まるのか、といった地球の謎に挑む。", coverage: coverage-open-earth.yaml, basis: "米国科学アカデミーの \"A Vision for NSF Earth Sciences 2020-2030: Earth in Time\"（2020）の 12 の優先の問い、USGS の地震予知の FAQ（2026-11-04 更新）、IPCC 第 6 次評価報告書 第 1 作業部会の政策決定者向け要約（2021、ipcc.ch は取れず気象庁の暫定訳で確かめた）。", beyond: "地震計の網、掘削、岩石の採取などの野外の観測と、長期の観測網の運用、地球規模のモデルの計算資源。災害の予測は、外れたときの社会への影響を考えて出す責任が伴う。"}
  - {id: open-astronomy, name: "天文学の大きな未解決問題（暗黒エネルギー、ハッブル定数の食い違い、地球外生命など）", kind: 未解決問題, field: 天文学, level: "大学院（博士）以上", region: "国際", note: "宇宙の膨張を速めているものは何か、最初の銀河やブラックホールはどう生まれたのか、地球の外に生命はいるのか、といった宇宙の謎に挑む。", coverage: coverage-open-astronomy.yaml, basis: "米国科学アカデミーの天文学の 10 年計画 Astro2020（\"Pathways to Discovery in Astronomy and Astrophysics for the 2020s\"、2021）の 3 つの優先の科学領域と、太陽・宇宙物理の 10 年計画（2024）。2026 年の状況は DESI、SH0ES、CCHP、JWST などの論文で確かめた（2026-11-08）。", beyond: "大型望遠鏡や宇宙望遠鏡の観測時間を提案で勝ち取ること、国際共同研究、膨大なデータの解析。DESI の時間変化する暗黒エネルギーの兆し（3σ 前後）や K2-18b の生命の兆候の主張は確定していないので、解決に数えない。"}
  - {id: open-ecology, name: "生態学の大きな未解決問題（種の多様性、共存、生態系の転換点など）", kind: 未解決問題, field: 生態学, level: "大学院（博士）以上", region: "国際", note: "熱帯にはなぜ生き物の種類が多いのか、地球には何種類の生き物がいるのか、森や湖が急に別の姿に変わる前に気づけるか、といった生き物どうしと環境の謎に挑む。", coverage: coverage-open-ecology.yaml, basis: "英国生態学会の会員などが選んだ \"Identification of 100 fundamental ecological questions\"（Sutherland ほか、J. Ecology 2013）と、Science 誌の \"What Don't We Know?\"（2005、種の多様性を決めるもの、協力行動の進化）。地球の種の数は Mora ほか（PLoS Biology 2011）による。", beyond: "何十年も同じ場所を測る長期の野外調査、標本の同定と分類の技能、野外の許可と保全の倫理、統計とモデルの両方。"}
  - {id: open-neuro, name: "神経科学の大きな未解決問題（意識、記憶、眠り、脳の配線と働き）", kind: 未解決問題, field: 神経科学, level: "大学院（博士）以上", region: "国際", note: "意識とは何か、記憶は脳のどこにどう残るのか、なぜ眠らなければならないのか、脳の配線図から考えるしくみが分かるか、といった脳の謎に挑む。", coverage: coverage-open-neuro.yaml, basis: "Science 誌の \"What Don't We Know?\"（2005、意識の生物学的基盤、記憶の蓄えと取り出し）と、NIH の BRAIN Initiative の計画 \"BRAIN 2025: A Scientific Vision\"（2014）の 7 つの優先領域（報告の本文は取れず、Koroshetz ほか 2018 の説明で確かめた）。2026 年の状況は Nature などの論文で確かめた（2026-11-08）。", beyond: "動物実験と人の脳の測定の倫理審査、電気生理・イメージング・光遺伝学などの実験の技術、巨大なデータの解析、国際共同研究。"}
  - {id: open-materials, name: "材料科学の大きな未解決問題（常温超伝導、ガラス、金属水素など）", kind: 未解決問題, field: 材料, level: "大学院（博士）以上", region: "国際", note: "電気抵抗がゼロになる物質を室温で使えるか、ガラスはなぜ固いのに液体のように乱れた並びなのか、水素を押しつぶして金属にできるか、といった物質の謎に挑む。", coverage: coverage-open-materials.yaml, basis: "米国科学アカデミーの \"Frontiers of Materials Research: A Decadal Survey\"（2019）と、P. W. Anderson の Science 誌の論説（1995、ガラス転移）。2026 年の状況は Nature の論文、撤回の通知、査読の記録で確かめた（2026-11-08）。", beyond: "試料の合成と結晶成長、極低温・高圧・強磁場の測定、放射光や中性子の大型施設。常温超伝導の主張（LK-99、窒素をドープした水素化ルテチウム）は否定または撤回されたので、別の研究室での再現が欠かせない。"}
  - {id: open-cs, name: "計算機科学の大きな未解決問題（P 対 NP、行列の積、量子計算など）", kind: 未解決問題, field: 計算機科学, level: "大学院（博士）以上", region: "国際", note: "答えを確かめるのが簡単な問題は解くのも簡単なのか、乱数は計算を速くするのか、量子計算機はいまの計算機より本当に速いのか、といった計算の限界の謎に挑む。", coverage: coverage-open-cs.yaml, basis: "クレイ数学研究所の P vs NP、Wigderson \"Mathematics and Computation\"（2019、プリンストン大学出版局。著者の公開版は取れず、arXiv の 1 章で確かめた）の未解決問題と、各問題の論文（arXiv）。P 対 NP はミレニアム懸賞問題の目標と重なる。", beyond: "解けたと言えるのは、査読誌に載って理論計算機科学の研究者に受け入れられたとき。P 対 NP の証明には、相対化や自然な証明などの障壁を越える新しい方法が要るとされる。量子計算の実証には大規模な実験装置が要る。"}
  - {id: open-statistics, name: "統計学の大きな未解決問題（因果推論、再現性、過剰パラメータのモデルの汎化など）", kind: 未解決問題, field: 統計学, level: "大学院（博士）以上", region: "国際", note: "データから原因と結果を見分けるにはどうすればよいか、研究の結果がくり返し確かめられないのはなぜか、巨大な AI のモデルがなぜ当たるのか、といったデータから知る方法の謎に挑む。", coverage: coverage-open-statistics.yaml, basis: "NSF 向けの報告 \"Statistics at a Crossroads: Who Is For the Challenge?\"（2019）と、ASA・RSS など 6 団体の \"Statistics and Science: A Report of the London Workshop on the Future of the Statistical Sciences\"（2014）が挙げた課題、ASA の p 値に関する声明（2016）。", beyond: "医学・社会科学・物理などの応用の分野の知識と共同研究、データの扱いの倫理とプライバシー、大規模な計算。"}
  - {id: open-engineering, name: "工学の大きな未解決問題（核融合の発電、炭素の回収、きれいな水など）", kind: 未解決問題, field: 工学, level: "大学院（博士）以上", region: "国際", note: "太陽と同じしくみで電気をつくる、二酸化炭素を集めて地下に閉じ込める、世界のすべての人に安全な水を届ける、といった技術で人類の課題を解く問題に挑む。", coverage: coverage-open-engineering.yaml, basis: "米国工学アカデミー（NAE）の Grand Challenges for Engineering（2008、14 の課題）。2026 年の状況は DOE と LLNL、IRENA、IEA、WHO と UNICEF の公式の資料で確かめた（2026-11-08）。誤り耐性の量子計算機は NAE の一覧の外から足した。", beyond: "課題は技術だけでなく、費用、規制、社会の受け入れで決まる。技術士（PE）などの資格、大規模な事業の管理、長い年月の実証が要る。"}
  - {id: open-economics, name: "経済学の大きな未解決問題（株式プレミアムの謎、国の豊かさの違い、生産性の鈍化など）", kind: 未解決問題, field: 経済学, level: "大学院（博士）以上", region: "国際", note: "株は国債よりなぜずっと多くもうかってきたのか、豊かな国と貧しい国の差はなぜ縮まらないのか、為替はなぜ予測できないのか、といった経済の謎に挑む。", coverage: coverage-open-economics.yaml, basis: "Mehra と Prescott（1985）の株式プレミアムの謎、Obstfeld と Rogoff（2000）の国際マクロ経済学の 6 つの謎、Meese と Rogoff（1983）、2024 年のノーベル経済学賞の発表、Syverson（2017）、Bernanke と Blanchard（2025）。経済学には学会の公式の未解決問題の一覧がないので、謎として名づけられ長く引用されているものを選んだ。", beyond: "経済では実験が難しく、自然実験や政策の変化を使った因果推論が要る。中央銀行や国際機関のデータと、政策の現場との協働。"}
  - {id: open-kids-science, name: "子どもでも問いが分かる理科の未解決問題（宇宙はなぜ物質でできているのか、生命はどう始まったかなど）", kind: 未解決問題, fields: [物理, 天文学, 化学, 生物, 神経科学, 地球科学, 生態学], level: "小学〜研究", region: "国際", note: "宇宙はなぜ物質でできているのか、生命はどう始まったのか、なぜ眠るのか、地震は予知できるのか、のように小学生でも問いの意味は分かるのに、世界中の科学者がまだ答えを出せていない問題に挑む。", coverage: coverage-open-kids-science.yaml, basis: "Science 誌の \"What Don't We Know?\"（2005）と、上海交通大学と Science 誌の \"125 Questions: Exploration and Discovery\"（2021）の問いのうち、子どもでも問いが分かるもの。状況は CERN、USGS、各分野の論文で確かめた（2026-11-08）。", beyond: "問いの理解は小学校の理科の単元で足りるが、攻め方は大学院以上の素粒子物理、生化学、神経科学、地震学になる。解けたと言えるのは、実験や観測で確かめられ、査読誌に載って受け入れられたとき。"}
  - {id: wfp-laureate, name: 食料と農業の研究者（世界食糧賞の研究に届く知識）, kind: 研究の頂点, field: 農学と獣医学, level: 大学院（博士）, region: 米国（世界食糧賞財団の選考。授賞は国際）, note: 作物や家畜や魚を、より多く、より安全に、土や気候をこわさずに育てる方法を見つけて、世界の飢えを減らす。, coverage: coverage-wfp-laureate.yaml, basis: 世界食糧賞の 1987〜2026 年の受賞理由（worldfoodprize.org の受賞者の一覧と受賞者ごとの頁）による（2026-11-08 取得）。本体の頁はボット対策で中身が返らなかったので、Internet Archive の写し（2024〜2026 年）で読んだ。研究と技術の業績で受けた回だけを論題にし、政策・援助・組織や事業づくりで受けた回（1988、1989、1993、1994、1998、2001、2003、2008、2010、2011、2015、2017、2018、2019、2023）は除いた。論題と単元の対応は名称による, beyond: 何年もの畑や養殖池での試験、農家と各国の研究機関と政府との協働、品種や技術を何百万の農家へ広める仕組みづくり（受賞理由はどれも、成果が広まって収量や栄養や所得が変わったことを挙げる）}
  - {id: cimmyt-breeder, name: CIMMYT の小麦・トウモロコシの育種の研究者（量的遺伝とゲノム選抜）, kind: 第一線の仕事, field: 農学と獣医学, level: 大学院（博士）, region: 国際（メキシコ・ケニアほか、CGIAR の研究所）, note: 世界の農家のために、病気や暑さや乾燥に強く栄養の多い小麦やトウモロコシを、遺伝子のデータと畑の試験で速くつくり出す仕事。, coverage: coverage-cimmyt-breeder.yaml, basis: "CGIAR の求人の頁に載った CIMMYT の 2 件（IRS22146 Applied Quantitative Geneticist, Bread Wheat Breeding、2022-10-19 掲載。IRS22173 Quantitative Genetics、2022-12-20 掲載）による（2026-11-08 取得）。どちらも今は頁がなく（404）、Internet Archive の写し（2025 年）で読んだ。博士の直後の最初の研究職。論題と単元の対応は名称による", beyond: 育種か遺伝学か生物統計の博士、ゲノムを使う育種の研究の経験 1〜3 年、R による統計の解析、査読のある論文の実績、南アジアやアフリカへの多くの出張、英語で多文化のチームと協働し人を育てる力、3 年の有期}
  - {id: woah-vet, name: 国の獣医当局と WOAH・FAO の獣医官（動物の病気と食の安全を守る）, kind: 第一線の仕事, field: 農学と獣医学, level: 大学（獣医学の学位）, region: 国際（WOAH の加盟国の獣医当局と国際機関）, note: 家畜の伝染病が国境をこえて広がるのを止め、動物から人にうつる病気を防ぎ、肉や卵や牛乳の安全を守る仕事。, coverage: coverage-woah-vet.yaml, basis: OIE（今の WOAH）の「獣医の卒業時の能力の勧告（Day 1 graduates）」（2012 年 5 月）による（2026-11-08 取得）。基本の能力のうち具体的な 11 項目と、獣医当局で働くのに要る高度な能力 8 項目を論題にした（陸の動物と水の動物の両方）。意思疎通の力は beyond に書いた。WOAH は 2025 年から改訂を始めたが、改訂版は見つからなかった。国際機関（FAO の Animal Health Officer など）の求人は、第三者の転載しか見つからなかったので出典にしていない。論題と単元の対応は名称による, beyond: 獣医師の免許（国の獣医の法定機関による）、臨床の基礎の能力（この文書は詳しく扱わない）、飼い主・農家・他の分野の専門家・報道との意思疎通、生涯の学び。国際機関では、さらに大学院の資格（獣医の疫学など）と数年の経験、英語ほかの国連の言語}
  - {id: navle, name: 北米の獣医師国家試験（NAVLE）, kind: 資格, field: 農学と獣医学, level: 大学（獣医学の学位）, region: 米国とカナダ, note: アメリカとカナダで獣医師として働くために受ける試験。犬や猫から牛や馬まで、病気を見つけて治す力をためす。, coverage: coverage-navle.yaml, basis: "ICVA の NAVLE の出題の設計（exam blueprint の頁の能力の領域と動物種の配分）と、能力の領域の文書（NAVLE Competency Domains）、2017 年の業務の分析の要旨による（2026-11-08 取得）。今の出題の設計は 2017 年の分析にもとづく。能力の領域は臨床 70%、予防医学と動物の福祉 15%、意思疎通 8%、職業と経営と健康 7%。動物種は犬 25.6%、猫 24.3%、馬 14.7%、牛 13.3%、豚 5% ほか。意思疎通と職業は beyond に書いた。論題と単元の対応は名称による", beyond: 認定を受けた獣医学校の卒業（または最終学年）、臨床の実習、飼い主や他の専門家との意思疎通、獣医の診療の経営、生涯の学び、州や州の免許の手続き}
