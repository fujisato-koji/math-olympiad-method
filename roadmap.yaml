# 網羅表が指す単元と、その前提をすべてたどった単元が、その目標までの道のりになる。
goals:
  - {id: imo, name: IMO, kind: 大会, level: 高校, region: 国際, note: 世界中の高校生が、2 日間で 6 問の難しい問題に挑む数学の大会。, basis: IMO の公式の頁と過去問の論題の調べ（coverage.yaml の出典 O01〜O13）による, coverage: coverage.yaml}
  - {id: todai-suuri, name: 東京大学大学院数理科学研究科（修士課程入試）, kind: 入試, level: 大学院, region: 日本, note: 東京大学の大学院で、数学の研究を始めるための試験。, basis: "令和 9 年度の募集要項と出題の意図、2015〜2026 年度の過去問 300 題（研究科の公開、一部は Internet Archive の控え）の型付けによる。専門科目 A は 7 題（A1・A2 が必答、A3〜A7 から 2 題）で、範囲の 5 分野はどれも学部の基礎なので道のりに入れる。専門科目 B は 18 題から 3 題を選ぶので、選んで解く論題として道のりに入れない。物理を題材にする問題は B に毎年 0〜2 題で、選ばずに済む", coverage: coverage-todai-suuri.yaml}
  - {id: gre-math, name: GRE Mathematics Subject Test（ETS）, kind: 入試, level: 大学院, region: 米国, note: アメリカの大学院で数学を学ぶときに使う、大学の数学の力をはかる試験。, basis: "ETS の内容の頁と練習帳による出題比率は微積分 50%、代数 25%、その他 25%。論題と単元の対応は名称による", coverage: coverage-gre-math.yaml}
  - {id: berkeley-prelim, name: UC Berkeley Preliminary Examination, kind: 入試, level: 大学院, region: 米国, note: カリフォルニア大学バークレー校の大学院で、数学の研究に進む前に受ける試験。, basis: 範囲の PDF（2003-12-09 付、現在も頁から参照）による。Math 1A-1B-53-54、104、113、110、185 の範囲。論題と単元の対応は名称による, coverage: coverage-berkeley-prelim.yaml}
  - {id: ipho, name: 国際物理オリンピック（IPhO）Syllabus, kind: 大会, level: 高校, region: 国際, note: 世界中の高校生が、物理の問題と実験に挑む大会。, basis: IPhO 公式サイトの Statutes and Syllabus による（2026-11-07 取得、シラバスの版の表示なし）。論題と単元の対応は名称による。シラバス外の概念は問題文で説明すれば出してよい。数学は「中等学校の生徒が標準的な高校の数学で解けること」が条件, coverage: coverage-ipho.yaml}
  - {id: todai-butsuri, name: 東京大学大学院理学系研究科物理学専攻（修士課程入試）, kind: 入試, level: 大学院, region: 日本, note: 東京大学の大学院で、物理の研究を始めるための試験。, basis: "令和 9 年度の募集要項（筆記は数学 1 問と物理学 3 問の全問必答、240 分）と、専攻が公開する平成 27〜令和 8 年度の過去問 68 問（一部は Internet Archive の写し）の型付けによる。旧形式の実験・計測の選択問題は令和 4 年度から出ていないので入れない", coverage: coverage-todai-butsuri.yaml}
  - {id: gre-physics, name: GRE Physics Test（ETS）, kind: 入試, level: 大学, region: 米国, note: アメリカの大学院で物理を学ぶときに使う、大学の物理の力をはかる試験。, basis: "ETS の内容の頁と練習帳による。約 70 問で、大半は学部の最初の 3 年の物理で解ける。出題比率は古典力学 20%、電磁気学 18%、光学と波動 8%、熱力学と統計力学 10%、量子力学 13%、原子物理 10%、特殊相対論 6%、実験の方法 6%、専門の話題 9%。各分野は「such as」で例示されるだけなので、論題と単元の対応は名称による。数学の方法は ETS が挙げる多変数の微積分、ベクトル解析、フーリエ級数、偏微分方程式、行列と行列式、複素関数", coverage: coverage-gre-physics.yaml}
  - {id: step, name: University of Cambridge ほか（STEP 2・3）, kind: 入試, level: 大学, region: 英国, note: ケンブリッジ大学などで数学を学ぶ人が、長い問題をじっくり解く入学の試験。, basis: STEP 2 と STEP 3 の仕様書（2026 年 6 月以降）による。両方とも Mathematics 1（A Level 相当）を前提とし、STEP 3 は STEP 2 の範囲も含む。力学と確率統計も範囲に入る。論題と単元の対応は名称による, coverage: coverage-step.yaml}
  - {id: jee-advanced, name: "Indian Institutes of Technology（JEE Advanced、数学・物理・化学）", kind: 入試, fields: [数学, 物理, 化学], level: "大学", region: "インド", note: "インド工科大学に入るための、数学・物理・化学のとても難しいことで知られる試験。", coverage: coverage-jee-advanced.yaml, basis: "JEE (Advanced) 2026 の案内書（IIT Roorkee）の付録 I（Syllabi）による。Paper 1 と Paper 2 の両方の受験が必須で、どちらも物理・化学・数学の 3 部に分かれる。論題は付録の見出しと文から取った。建築の適性試験（AAT）は B.Arch. に進む人だけなので入れない。論題と単元の対応は名称による", beyond: "JEE (Main) の Paper 1 で上位約 25 万人に入ること、受験は続く 2 年で 2 回まで、年齢の条件（2001 年 10 月 1 日以降の生まれ、一部は 5 年緩和）、IIT への入学には 12 年生の修了試験（物理・化学・数学を含む）で 75%（SC・ST・障害のある人は 65%）以上か、上位 20 パーセンタイル以内"}
  - {id: jee-main, name: "National Testing Agency（JEE Main、数学・物理・化学）", kind: 入試, fields: [数学, 物理, 化学], level: "大学", region: "インド", note: "インドの工学の大学に入るための全国の試験。数学・物理・化学が出る。", coverage: coverage-jee-main.yaml, basis: "JEE (Main) 2027 の Paper 1（B.E./B.Tech.）のシラバス（2026 年 10 月 24 日付で掲示）の数学・物理・化学による。論題は物理と化学では各 20 の Unit。論題と単元の対応は名称による", beyond: "12 年生の修了試験（入学の条件は大学ごと）、席の割り当て。Paper 2（B.Arch.・B.Planning）の製図と適性は入れない"}
  - {id: tmua, name: University of Oxford ほか（TMUA）, kind: 入試, level: 大学, region: 英国, note: オックスフォード大学などで数学を学ぶ人の、考える力をためす入学の試験。, basis: TMUA の Content Specification（2026 年 10 月・2027 年 1 月の試験）による。Section 1 は AS level の純粋数学と GCSE 上級、Section 2 は論理と証明。どの大学・学科が課すかは調べていない。論題と単元の対応は名称による, coverage: coverage-tmua.yaml}
  - {id: todai-rika, name: "東京大学（理科の入学試験、数学と理科）", kind: 入試, fields: [数学, 物理, 化学, 生物, 地球科学, 天文学], level: "大学", region: "日本", note: "東京大学の理科の学部に入るための試験の、数学と、物理・化学・生物・地学から選ぶ 2 科目の理科。", coverage: coverage-todai-rika.yaml, basis: "令和 9（2027）年度の入学者選抜要項と高等学校学習指導要領（平成 30 年告示）による。第 2 次学力試験の数学は、数学 I・II・III・A は全範囲、数学 B は「数列」「統計的な推測」、数学 C は「ベクトル」「平面上の曲線と複素数平面」。理科は「物理基礎・物理」「化学基礎・化学」「生物基礎・生物」「地学基礎・地学」から 2 科目を選び、どれも基礎を付した科目と付さない科目の全範囲から出る。理科の論題は学習指導要領の中項目による（「物理学が拓く世界」などの結びの項目は除く）。理科は選んで解く論題として道のりに入れず、論題の少ない 2 科目分（31）まで数える。論題と単元の対応は名称による", beyond: "大学入学共通テスト（国語、地理歴史・公民、外国語、情報 I を含む）と第 1 段階選抜、第 2 次学力試験の国語と外国語、調査書。理科三類は面接（医学への適性）"}
  - {id: gaokao, name: "中国の普通高等学校招生全国統一考試（高考、数学と理科）", kind: 入試, fields: [数学, 物理, 化学, 生物, 地球科学], level: "大学", region: "中国", note: "中国の高校生が大学に入るための全国の試験の、数学と、物理・化学・生物・地理から選ぶ科目。", coverage: coverage-gaokao.yaml, basis: "数学は全国卷で、範囲は普通高中数学課程標準（2017 年版 2020 年修訂）の必修課程と選択性必修課程。選学の印が付いた項目（複素数の三角表示、数学的帰納法、ベイズの公式）は考試の要求としないので含めない。積分の項目はない。選んで受ける科目の組み方は省ごとの実施方案による。ここでは多くの省が使う 3+1+2 の型（例：広東省の実施方案）で表す。首選科目は物理か歴史から 1 つ、再選科目は思想政治・地理・化学・生物から 2 つで、考試の内容は国の課程標準による。表には物理・化学・生物と、地理の自然地理（地理 1 と選択性必修 1）を載せた。論題は各科の課程標準の必修と選択性必修の内容要求を、番号ごとにまとめた。選ぶ科目は道のりに入れず、首選の物理は 20 論題、再選は単元のある論題の少ない 2 科目分（35）まで数える。論題と単元の対応は名称による", beyond: "語文と外国語、首選で歴史を選ぶ場合の歴史、再選の思想政治と地理の人文地理（地理 2、区域発展、資源・環境と国家安全）、学業水準の合格性考試、総合素質評価、省ごとの志願と投档"}
  - {id: suneung, name: "韓国の大学修学能力試験（修能、数学と科学探究）", kind: 入試, fields: [数学, 物理, 化学, 生物, 地球科学, 天文学], level: "大学", region: "韓国", note: "韓国の高校生が大学に入るために受ける全国の試験の、数学と、8 つから 2 つを選ぶ科学探究。", coverage: coverage-suneung.yaml, basis: "2027 学年度（2026-11-19 実施）。数学は共通科目「数学 I」「数学 II」（約 75%）と、「確率と統計」「微積分」「幾何」から 1 つを選ぶ選択科目（約 25%）。科学探究は物理学Ⅰ・化学Ⅰ・生命科学Ⅰ・地球科学Ⅰ・物理学Ⅱ・化学Ⅱ・生命科学Ⅱ・地球科学Ⅱ の 8 科目で、社会探究と合わせた 17 科目から最大 2 科目を選ぶ。科学の範囲は 2015 改訂の科学科教育課程（教育部告示第 2015-74 号 別冊 9）で、論題は単元と成就基準からまとめた。科学探究は選んで解く論題として道のりに入れず、単元のある論題の少ない 2 科目分（18）まで数える。数学は KICE の 2027 学年度の施行基本計画による。共通科目の論題は道のりに入れ、選択科目は選んで解く論題として道のりに入れず、1 科目分（9）まで数える。論題と単元の対応は名称による", beyond: "国語、英語、韓国史（必須）、大学ごとの学生簿・論述・面接、自然系の学科が求める科学探究の指定"}
  - {id: alevel-maths, name: A level Mathematics（Pearson Edexcel）, kind: 入試, level: 大学, region: 英国, note: イギリスの高校生が、大学に進む前に受ける数学の試験。, basis: Pearson Edexcel Level 3 Advanced GCE in Mathematics (9MA0) の仕様書（Issue 4、2020 年 2 月）による。純粋数学、統計、力学。論題と単元の対応は名称による, coverage: coverage-alevel-maths.yaml}
  - {id: alevel-further, name: A level Further Mathematics（Pearson Edexcel）, kind: 入試, level: 大学, region: 英国, note: イギリスの高校生が、数学をさらに深く学んで受ける試験。, basis: Pearson Edexcel Level 3 Advanced GCE in Further Mathematics (9FM0) の仕様書（Issue 4、2023 年 6 月）による。必修の Core Pure と、Further Pure、Further Statistics、Further Mechanics、Decision の選択部分を全部並べた。論題と単元の対応は名称による, coverage: coverage-alevel-further.yaml}
  - {id: ib-aa-hl, name: "IB Mathematics: Analysis and Approaches HL", kind: 入試, level: 大学, region: 国際, note: 世界の学校で使われる国際バカロレアで、数学をいちばん深く学ぶ科目の試験。, basis: 国際バカロレア・ディプロマ・プログラムの数学（AA）HL。公開の subject brief（2021 年初回試験版）が示すのは 5 分野と時間数だけで、細目は有料の科目ガイドにあり取得していない。このため論題は分野の単位とし、単元の対応は分野の名称による, coverage: coverage-ib-aa-hl.yaml}
  - {id: sat-math, name: SAT Math（College Board）, kind: 入試, level: 大学, region: 米国, note: アメリカの大学に入るときに使う試験の数学。, basis: SAT Suite の Math Specifications と Assessment Framework（version 4、2026 年 9 月）による。代数、発展的な数学、問題解決とデータ分析、幾何と三角法の 4 分野。論題と単元の対応は名称による, coverage: coverage-sat-math.yaml}
  - {id: ap-calc-bc, name: AP Calculus BC, kind: 入試, level: 大学, region: 米国, note: アメリカの高校生が、大学の微分と積分を先に学んで受ける試験。, basis: College Board の AP Calculus AB and BC Course and Exam Description（Effective Fall 2020）による。BC だけの項目（級数、媒介変数、極座標、ベクトル値関数など）を含む。論題と単元の対応は名称による, coverage: coverage-ap-calc-bc.yaml}
  - {id: ap-stats, name: AP Statistics, kind: 入試, level: 大学, region: 米国, note: アメリカの高校生が、大学の統計を先に学んで受ける試験。, basis: College Board の AP Statistics Course and Exam Description（Effective Fall 2026、5 単位に改訂、初回の試験は 2027 年 5 月）による。論題と単元の対応は名称による, coverage: coverage-ap-stats.yaml}
  - {id: ege-profile, name: "ЕГЭ（数学 профильный уровень と、物理・化学・生物・情報）", kind: 入試, fields: [数学, 物理, 化学, 生物, 計算機科学], level: "大学", region: "ロシア", note: "ロシアの高校生が大学に入るために受ける全国の試験の、数学の詳しい版と、大学が求める理科か情報の科目。", coverage: coverage-ege-profile.yaml, basis: "ФИПИ の 2027 年の кодификатор と спецификация による。これらは確定版ではなく案（ПРОЕКТ、2026 年 8〜9 月付）。数学の論題は кодификатор の内容の要素と要件から取った。選ぶ科目は物理・化学・生物・情報のうち大学と学科が求めるもので、論題は各 кодификатор の第 2 部（検査する内容の要素）の節を、近いものはまとめて並べた。選ぶ科目は道のりに入れず、論題のいちばん少ない科目の分（16）まで数える。論題と単元の対応は名称による", beyond: "ロシア語の ЕГЭ（必須）、学科によっては 2 つ目の選択科目や社会・外国語、各大学の追加の試験と個人の業績"}
  - {id: ce-11plus, name: "ISEB Common Entrance 11+（数学と理科）", kind: 入試, fields: [数学, 物理, 化学, 生物, 地球科学], level: "小学", region: "英国", note: "イギリスの私立の学校に 11 歳で入るための試験の、算数と理科。", coverage: coverage-ce-11plus.yaml, basis: "数学は ISEB の Mathematics CE at 11+ & 13+ and CASE Specification（2020 年 9 月版、2021 年 9 月から教える、2022 年 11 月から実施）による。Year 6（10〜11 歳）、60 分、電卓なし。理科は ISEB の Science CE at 11+ & 13+ Specification（2020 年 9 月、V4.2）による。生物・化学・物理をほぼ同じ重みで 1 冊 60 分、電卓あり。Year 3〜6 の論題のうち 11+ で試験に出るものを載せ、Year 6 の「教えるが 11+ の試験には出ない」論題（人の循環、進化と遺伝、光）は除いた。論題と単元の対応は名称による", beyond: "英語（読解と作文）、学校によっては面接や推論の試験、前の学校の報告"}
  - {id: ce-13plus, name: "ISEB Common Entrance 13+（数学と理科）", kind: 入試, fields: [数学, 物理, 化学, 生物], level: "中学", region: "英国", note: "イギリスの私立の学校に 13 歳で入るための試験の、数学と理科。", coverage: coverage-ce-13plus.yaml, basis: "数学は ISEB の Mathematics CE at 11+ & 13+ and CASE Specification による。Year 8（12〜13 歳）、Core と Foundation の論題表に、任意の Additional（と奨学金試験 CASE）の論題を加えた。Core は電卓なし 60 分と電卓あり 60 分、暗算 10 分。理科は ISEB の Science CE at 11+ & 13+ Specification（2020 年 9 月、V4.2）の 13+ の論題表による。Core は生物・化学・物理の 3 冊（各 40 分）、Foundation は 1 冊。11+ の理科の内容は前提として出てよい。論題と単元の対応は名称による", beyond: "英語、学校によってはフランス語・ラテン語・歴史・地理・宗教などの科目、面接と前の学校の報告"}
  - {id: gcse-higher, name: GCSE Mathematics Higher（Pearson Edexcel）, kind: 修了試験, level: 高校, region: 英国, note: イギリスの 16 歳が、中学校の終わりに受ける数学の試験の難しいほうの版。, basis: Pearson Edexcel GCSE (9-1) Mathematics (1MA1) Specification（Issue 2、2015 年 6 月）の Higher tier。Year 11（15〜16 歳）、3 冊子各 1 時間 30 分。AQA 版は取得していない。論題と単元の対応は名称による, coverage: coverage-gcse-higher.yaml}
  - {id: psle, name: "PSLE（シンガポール、算数と理科）", kind: 修了試験, fields: [数学, 物理, 化学, 生物], level: "小学", region: "シンガポール", note: "シンガポールの小学生が、小学校の終わりに受ける試験の算数と理科。", coverage: coverage-psle.yaml, basis: "SEAB の PSLE Mathematics (0008) は目的だけを書き、論題は MOE の Mathematics Syllabus Primary One to Six（2021 年入学の学年から、2025 年 10 月更新）にある。PSLE Science (0009) は 2023 年の理科のシラバスでの到達を問うとし、論題は MOE の Science Syllabus Primary Three to Six（2026 年 1 月更新）の学年ごとの論題表による。理科は選択 30 問と記述 10〜11 問、1 時間 45 分。Primary 6（12 歳前後）。学年ごとの論題を 1 行ずつ載せ、学年を論題の前に書いた。どの学年の論題をどれだけ出すかの割り振りは SEAB の文書にない。Foundation の科目は扱わない。論題と単元の対応は名称による", beyond: "英語と母語（Mother Tongue Language）、中学校の割り振り（Achievement Level と志望）"}
  - {id: olevel-math, name: GCE O-Level Mathematics（シンガポール）, kind: 修了試験, level: 高校, region: シンガポール, note: シンガポールの中高生が、4 年間の終わりに受ける数学の試験。, basis: Syllabus 4052（2026 年まで）。2027 年から Singapore-Cambridge SEC の G3 Mathematics（Syllabus K310）に代わり、SEAB の文書の本文は内容が同じ（題名と著作権年の違いだけ）。論題は K310 による。Secondary 4（16 歳前後）。論題と単元の対応は名称による, coverage: coverage-olevel-math.yaml}
