  - {id: C-004, title: 道順を数える, stage: 2, needs: [C-003], days: 5}
  - {id: G-005, title: 長さとまわりの長さ, stage: 2, needs: [G-002, N-007], days: 5}
  - {id: G-006, title: 直角と平行、三角形と四角形, stage: 2, needs: [G-002], days: 5}
