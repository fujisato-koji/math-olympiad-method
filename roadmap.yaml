# 地図：単元と前提（組み合わせなしのフロー）
#
# 単元の記号は「流れ・段-番号」（例 N1-01 は「数」の流れの段 1 の 1 番）。
# needs は前提（済んでから始める単元）。流れをまたぐ前提は、知識として欠かせないものだけにする。
# 2 つの流れの考えを合わせて解く単元（組み合わせ）は、ここには入れない（D-008）。
# 単元は論題で名付ける。「IMO の○○」のような寄せ集めは作らず、本番の水準の総合演習は組み合わせの層で扱う（D-013）。
# 並べる順は、学年や学習指導要領ではなく、人がその考えを理解できる順にする（D-014）。
# もっと広く使える道具を理解できるなら、それを本線にし、特別な解き方は問題の別のみちすじにする。
# IMO に要る論題を受け持っているかは coverage.yaml で確かめる（R-09）。
# plan があれば 1 日分ずつのねらい、なければ days の日数で既定の並び（導入、練習…、混ぜる、確認）。

lanes:
  - {id: N, name: 数, note: 数と整数}
  - {id: A, name: 式, note: 式と代数}
  - {id: C, name: 数える, note: 数え上げと組合せ}
  - {id: G, name: 図形, note: 図形と幾何}
  - {id: L, name: 論理, note: 論理と証明}

stages:
  - {id: 1, name: 入口, measure: マスカンガルー（年長〜小 2）, minutes: 15, day: {思い出す: 2, 今日: 3, 挑戦: 1}}
  - {id: 2, name: キッズ BEE, measure: キッズ BEE（小 1〜3）, minutes: 20, day: {思い出す: 2, 今日: 3, 挑戦: 1}}
  - {id: 3, name: ジュニア算数, measure: ジュニア算数オリンピック（小 5 以下）, minutes: 30, day: {思い出す: 2, 今日: 3, 挑戦: 1}}
  - {id: 4, name: 算数オリンピック, measure: 算数オリンピック（小 6）, minutes: 40, day: {思い出す: 2, 今日: 3, 挑戦: 1}}
  - {id: 5, name: 中学の入口, measure: ジュニア広中杯、広中杯、JJMO 予選, minutes: 45, day: {思い出す: 2, 今日: 2, 挑戦: 1}}
  - {id: 6, name: 証明の入口, measure: JMO 予選、JJMO 本選, minutes: 60, day: {思い出す: 1, 今日: 2, 挑戦: 1}}
  - {id: 7, name: 本選, measure: JMO 本選、APMO, minutes: 90, day: {思い出す: 1, 今日: 1, 挑戦: 1}}
  - {id: 8, name: IMO, measure: IMO, minutes: 120, day: {思い出す: 0, 今日: 1, 挑戦: 1}}

kinds:
  導入: 見本（解いた例）を見せてから解く
  練習: 同じ型を少しずつ変えて解く
  混ぜる: 前の日や前の単元の型と混ぜて解く（交互練習）
  確認: 8 割できたら単元を済にする

units:
  # ---- 段 1 入口 ----
  - id: N1-01
    title: 10 までの数
    needs: []
    plan:
      - 導入: 10 までの数を数える
      - 練習: どちらが多いか、少ないか
      - 導入: いくつといくつ（10 までの合成と分解）
      - 混ぜる: 1〜3 日目の型を混ぜる
      - 確認: 10 までの数
  - id: N1-02
    title: 数直線
    needs: [N1-01]
    plan:
      - 導入: 数直線に数をならべる
      - 練習: 右へ進むとふえる、左へもどるとへる
      - 練習: いくつ進んだか、いくつもどったか
      - 混ぜる: N1-01 と混ぜる
      - 確認: 数直線
  - id: N1-03
    title: たし算とひき算（数直線で進む、もどる）
    needs: [N1-01]
    plan:
      - 導入: 右へ進むとたし算、左へもどるとひき算
      - 練習: のこりはいくつ、ちがいはいくつ
      - 練習: 0 のたし算とひき算、たし算とひき算の関係
      - 混ぜる: N1-02 と混ぜる
      - 確認: 10 までのたし算とひき算
  - id: N1-04
    title: 0 より小さい数
    needs: [N1-03]
    plan:
      - 導入: 0 の左にも数がある（温度、地下の階）
      - 練習: 0 をこえてもどる
      - 練習: 0 より小さい数の大きさくらべ
      - 混ぜる: N1-03 と混ぜる
      - 確認: 0 より小さい数
  - id: N1-05
    title: 20 までの数とくり上がり
    needs: [N1-03]
    plan:
      - 導入: 20 までの数（10 といくつ）
      - 練習: くり上がりのあるたし算（10 をつくる）
      - 導入: くり下がりのあるひき算（10 からひく）
      - 練習: 3 つの数の計算
      - 混ぜる: N1-03 と混ぜる
      - 確認: 20 までの計算
  - id: N1-06
    title: 100 までの数
    needs: [N1-05]
    plan:
      - 導入: 十のまとまりで数える
      - 練習: 十の位と一の位、数の線
      - 練習: 大きさくらべと、とびとびの数え方
      - 混ぜる: N1-05 と混ぜる
      - 確認: 100 までの数
  - id: N1-07
    title: 2 けたのたし算とひき算
    needs: [N1-06]
    plan:
      - 導入: 何十のたし算とひき算
      - 練習: 2 けた＋1 けた
      - 練習: 2 けた＋2 けた（筆算の入口）
      - 練習: 2 けたのひき算（くり下がり）
      - 混ぜる: N1-06 と混ぜる
      - 確認: 2 けたの計算
  - id: C1-01
    title: もれなく数える
    needs: [N1-01]
    plan:
      - 導入: 印をつけて数える（数え落としと二重に数えるのを防ぐ）
      - 練習: 並べ直して、まとめて数える
      - 練習: 散らばったものを種類ごとに数える
      - 混ぜる: N1-01 と混ぜる
      - 確認: もれなく数える
  - id: C1-02
    title: 書き出して数える
    needs: [C1-01]
    plan:
      - 導入: 並べ方を全部書き出す（2〜3 個）
      - 練習: 決まった順で書き出す（もれと重なりを防ぐ）
      - 練習: 選び方を書き出す
      - 混ぜる: C1-01 と混ぜる
      - 確認: 書き出して数える
  - id: G1-01
    title: 形を見分ける
    needs: []
    plan:
      - 導入: さんかく、しかく、まるを見分ける
      - 練習: 辺と角（かど）の数
      - 練習: 同じ形の仲間分け
      - 混ぜる: 1〜3 日目の型を混ぜる
      - 確認: 形を見分ける
  - id: G1-02
    title: 形を分ける、組み合わせる
    needs: [G1-01]
    plan:
      - 導入: 色板で形をつくる
      - 練習: 形を線で分ける
      - 練習: タングラム（影の形をうめる）
      - 混ぜる: G1-01 と混ぜる
      - 確認: 形を分ける、組み合わせる
  - id: G1-03
    title: 積み木と立体
    needs: [G1-01, N1-01]
    plan:
      - 導入: 箱の形、筒の形、ボールの形
      - 練習: 見える積み木を数える
      - 練習: 見えない積み木を数える
      - 混ぜる: G1-01 と混ぜる
      - 確認: 積み木と立体
  - id: G1-04
    title: 折る、映す、回す
    needs: [G1-02]
    plan:
      - 導入: 半分に折ると重なる形
      - 練習: 鏡に映した形
      - 練習: 回した形（向きを変えても同じか）
      - 混ぜる: G1-02 と混ぜる
      - 確認: 折る、映す、回す
  - id: L1-01
    title: きまりを見つける
    needs: []
    plan:
      - 導入: 形や色の並びのきまり
      - 練習: 数の並びのきまり（1 ずつ、2 ずつ）
      - 練習: くり返しのきまり
      - 混ぜる: 1〜3 日目の型を混ぜる
      - 確認: きまりを見つける
  - id: L1-02
    title: 推理パズル
    needs: [L1-01]
    plan:
      - 導入: ヒントから 1 つに決める（だれのものか）
      - 練習: 表に〇と×を書いて整理する
      - 練習: 順番の推理（だれが前か、後ろか）
      - 混ぜる: L1-01 と混ぜる
      - 確認: 推理パズル
  - id: L1-03
    title: てんびんと重さくらべ
    needs: [L1-01, N1-01]
    plan:
      - 導入: どちらが重いか（てんびん 1 つ）
      - 練習: 3 つを重い順に並べる
      - 練習: つり合いで置きかえる
      - 混ぜる: L1-02 と混ぜる
      - 確認: てんびんと重さくらべ
  - id: L1-04
    title: わけを言う
    needs: [L1-02]
    plan:
      - 導入: 「どうしてそう思ったの」に答える
      - 練習: 「だから」でつないで言う
      - 練習: ほかの答えがないわけを言う
      - 混ぜる: L1-02 と混ぜる
      - 確認: 口で説明できるか（保護者が見る）

