# 地図：単元と前提（組み合わせなしのフロー）
#
# 単元の記号は「流れ-通し番号」（例 N-001 は「数」の流れの 1 番）。段は stage に書く（D-016）。
# needs は前提（済んでから始める単元）。流れをまたぐ前提は、知識として欠かせないものだけにする。
# 2 つの流れの考えを合わせて解く単元（組み合わせ）は、ここには入れない（D-008）。
# 単元は論題で名付ける。「IMO の○○」のような寄せ集めは作らず、本番の水準の総合演習は組み合わせの層で扱う（D-013）。
# 並べる順は、学年や学習指導要領ではなく、人がその考えを理解できる順にする（D-014）。
# もっと広く使える道具を理解できるなら、それを本線にし、特別な解き方は問題の別のみちすじにする。
# IMO に要る論題を受け持っているかは coverage.yaml で確かめる（R-09）。
# measure: true は、目標には要らないが、段の物差しの大会（算数オリンピックなど）で問われるので置く単元。
# plan があれば 1 日分ずつのねらい、なければ days の日数で既定の並び（導入、練習…、混ぜる、確認）。

lanes:
  - {id: N, name: 数, note: 数と整数}
  - {id: A, name: 式, note: 式と代数}
  - {id: C, name: 数える, note: 数え上げと組合せ}
  - {id: G, name: 図形, note: 図形と幾何}
  - {id: L, name: 論理, note: 論理と証明}


stages:
  - {id: 1, name: もの, about: ものを数える、比べる、形を全体で見る、並びのきまりに気づく, minutes: 15, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [1, 1]}
  - {id: 2, name: 数, about: 数えた結果を数として扱う、位、数直線の上の位置と向き、偶奇、□, minutes: 20, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [1, 2]}
  - {id: 3, name: 量と比, about: 「いくつ分」で掛ける、割る、分ける。分数を 1 つの数とみる、比と割合、面積、倍数と約数、累乗、確率、比例, minutes: 30, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [2, 2]}
  - {id: 4, name: 一般の数, about: 文字を「わからない数」と「どの数でも」として使う。等式の変形、展開、平方根、不等式、帰納法、背理法、合同と相似, minutes: 40, day: {思い出す: 2, 今日: 3, 挑戦: 1}, reason: [2, 3]}
  - {id: 5, name: 関係, about: 文字を変わる数として扱う。関数と写像、座標、三角関数、数列、ベクトル、期待値, minutes: 45, day: {思い出す: 2, 今日: 2, 挑戦: 1}, reason: [3, 3]}
  - {id: 6, name: 構造, about: 操作と同じとみなす組を対象にする。余りの類、多項式、関数方程式、不変量、グラフ、不等式の形、図形の配置, minutes: 60, day: {思い出す: 1, 今日: 2, 挑戦: 1}, reason: [3, 3]}
  - {id: 7, name: 構造を移す, about: 問題を別の構造に写して解く。複素数や重心座標、母関数、確率、射影変換, minutes: 90, day: {思い出す: 1, 今日: 1, 挑戦: 1}, reason: [3, 3]}
  - {id: 8, name: 公理の構造, about: 定義と公理から世界をつくる。群、環、体、ベクトル空間、ε-δ、距離と位相, minutes: 90, day: {思い出す: 1, 今日: 1, 挑戦: 1}, reason: [4, 4]}
  - {id: 9, name: 構造のあいだ, about: 構造を保つ写像そのものを対象にする。同型、表現、分類、圏と関手, minutes: 120, day: {思い出す: 0, 今日: 1, 挑戦: 1}, reason: [4, 4]}
  - {id: 10, name: 新しい対象をつくる, about: 定義を選び、予想し、反例で直す。理解を人に伝える, minutes: 120, day: {思い出す: 0, 今日: 1, 挑戦: 1}, reason: [5, 5]}

# 目標（大会や入試）。単元を組み合わせた結果として届く場所で、地図に重ねて見せる（D-015）。
# 網羅表が指す単元と、その前提をすべてたどった単元が、その目標までの道のりになる。
goals:
  - {id: imo, name: IMO, kind: 大会, level: 高校, region: 国際, note: 国際数学オリンピック（とその手前の JMO）, coverage: coverage.yaml}

kinds:
  わけ: その段の深さで、わけを示す（口で言う、文で書く、定義から筋道を立てて書く）
  導入: 見本（解いた例）を見せてから解く
  練習: 同じ型を少しずつ変えて解く
  混ぜる: 前の日や前の単元の型と混ぜて解く（交互練習）
  確認: 8 割できたら単元を済にする

units:
  # ---- 段 1 もの ----
  - id: N-001
    title: 10 までの数
    stage: 1
    needs: []
    plan:
      - 導入: 10 までの数を数える
      - 練習: どちらが多いか、少ないか
      - 導入: いくつといくつ（10 までの合成と分解）
      - 混ぜる: 1〜3 日目の型を混ぜる
      - 確認: 10 までの数
  - id: N-002
    title: 数直線
    stage: 1
    needs: [N-001]
    plan:
      - 導入: 数直線に数をならべる
      - 練習: 右へ進むとふえる、左へもどるとへる
      - 練習: いくつ進んだか、いくつもどったか
      - 混ぜる: N-001 と混ぜる
      - 確認: 数直線
  - id: N-003
    title: たし算とひき算（数直線で進む、もどる）
    stage: 1
    needs: [N-002]
    plan:
      - 導入: 右へ進むとたし算、左へもどるとひき算
      - 練習: のこりはいくつ、ちがいはいくつ
      - 練習: 0 のたし算とひき算、たし算とひき算の関係
      - 混ぜる: N-002 と混ぜる
      - 確認: 10 までのたし算とひき算
  - id: A-001
    title: てんびんと重さくらべ
    stage: 1
    needs: [N-001]
    plan:
      - 導入: どちらが重いか（てんびん 1 つ）
      - 練習: 3 つを重い順に並べる
      - 練習: つり合いで置きかえる
      - 混ぜる: L-002 と混ぜる
      - 確認: てんびんと重さくらべ
  - id: C-001
    title: もれなく数える
    stage: 1
    needs: [N-001]
    plan:
      - 導入: 印をつけて数える（数え落としと二重に数えるのを防ぐ）
      - 練習: 並べ直して、まとめて数える
      - 練習: 散らばったものを種類ごとに数える
      - 混ぜる: N-001 と混ぜる
      - 確認: もれなく数える
  - id: C-002
    title: 書き出して数える
    stage: 1
    needs: [C-001]
    plan:
      - 導入: 並べ方を全部書き出す（2〜3 個）
      - 練習: 決まった順で書き出す（もれと重なりを防ぐ）
      - 練習: 選び方を書き出す
      - 混ぜる: C-001 と混ぜる
      - 確認: 書き出して数える
  - id: G-001
    title: 形を見分ける
    stage: 1
    needs: []
    plan:
      - 導入: さんかく、しかく、まるを見分ける
      - 練習: 辺と角（かど）の数
      - 練習: 同じ形の仲間分け
      - 混ぜる: 1〜3 日目の型を混ぜる
      - 確認: 形を見分ける
  - id: G-002
    title: 形を分ける、組み合わせる
    stage: 1
    needs: [G-001]
    plan:
      - 導入: 色板で形をつくる
      - 練習: 形を線で分ける
      - 練習: タングラム（影の形をうめる）
      - 混ぜる: G-001 と混ぜる
      - 確認: 形を分ける、組み合わせる
  - id: G-003
    title: 積み木と立体
    stage: 1
    needs: [G-001, N-001]
    plan:
      - 導入: 箱の形、筒の形、ボールの形
      - 練習: 見える積み木を数える
      - 練習: 見えない積み木を数える
      - 混ぜる: G-001 と混ぜる
      - 確認: 積み木と立体
  - id: G-004
    title: 折る、映す、回す
    stage: 1
    needs: [G-002]
    plan:
      - 導入: 半分に折ると重なる形
      - 練習: 鏡に映した形
      - 練習: 回した形（向きを変えても同じか）
      - 混ぜる: G-002 と混ぜる
      - 確認: 折る、映す、回す
  - id: L-001
    title: きまりを見つける
    stage: 1
    needs: []
    plan:
      - 導入: 形や色の並びのきまり
      - 練習: 数の並びのきまり（1 ずつ、2 ずつ）
      - 練習: くり返しのきまり
      - 混ぜる: 1〜3 日目の型を混ぜる
      - 確認: きまりを見つける
  - id: L-002
    title: 推理パズル
    stage: 1
    needs: [L-001]
    plan:
      - 導入: ヒントから 1 つに決める（だれのものか）
      - 練習: 表に〇と×を書いて整理する
      - 練習: 順番の推理（だれが前か、後ろか）
      - 混ぜる: L-001 と混ぜる
      - 確認: 推理パズル

  # ---- 段 2 数 ----
  - id: N-004
    title: 0 より小さい数
    stage: 2
    needs: [N-003]
