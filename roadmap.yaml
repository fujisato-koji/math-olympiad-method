      - 練習: くり上がりのあるたし算（10 をつくる）
      - 導入: くり下がりのあるひき算（10 からひく）
      - 練習: 3 つの数の計算
      - 混ぜる: N-003 と混ぜる
      - 確認: 20 までの計算
  - id: N-006
    title: 100 までの数
    stage: 2
    needs: [N-005]
    plan:
      - 導入: 十のまとまりで数える
