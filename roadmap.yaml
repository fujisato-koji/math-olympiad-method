# 目標（大会や入試）。単元を組み合わせた結果として届く場所で、地図に重ねて見せる（D-015）。
# kind は 大会、検定、修了試験、入試、資格、夢 のどれか（画面ではこの順にまとめる、2.12）。
# 網羅表が指す単元と、その前提をすべてたどった単元が、その目標までの道のりになる。
goals:
  - {id: imo, name: IMO, kind: 大会, level: 高校, region: 国際, note: 世界中の高校生が、2 日間で 6 問の難しい問題に挑む数学の大会。, basis: IMO の公式の頁と過去問の論題の調べ（coverage.yaml の出典 O01〜O13）による, coverage: coverage.yaml}
  - {id: todai-suuri, name: 東京大学大学院数理科学研究科（修士課程入試）, kind: 入試, level: 大学院, region: 日本, note: 東京大学の大学院で、数学の研究を始めるための試験。, basis: "令和 9 年度の募集要項と出題の意図、2015〜2026 年度の過去問 300 題（研究科の公開、一部は Internet Archive の控え）の型付けによる。専門科目 A は 7 題（A1・A2 が必答、A3〜A7 から 2 題）で、範囲の 5 分野はどれも学部の基礎なので道のりに入れる。専門科目 B は 18 題から 3 題を選ぶので、選んで解く論題として道のりに入れない。物理を題材にする問題は B に毎年 0〜2 題で、選ばずに済む", coverage: coverage-todai-suuri.yaml}
  - {id: gre-math, name: GRE Mathematics Subject Test（ETS）, kind: 入試, level: 大学院, region: 米国, note: アメリカの大学院で数学を学ぶときに使う、大学の数学の力をはかる試験。, basis: "ETS の内容の頁と練習帳による出題比率は微積分 50%、代数 25%、その他 25%。論題と単元の対応は名称による", coverage: coverage-gre-math.yaml}
  - {id: berkeley-prelim, name: UC Berkeley Preliminary Examination, kind: 入試, level: 大学院, region: 米国, note: カリフォルニア大学バークレー校の大学院で、数学の研究に進む前に受ける試験。, basis: 範囲の PDF（2003-12-09 付、現在も頁から参照）による。Math 1A-1B-53-54、104、113、110、185 の範囲。論題と単元の対応は名称による, coverage: coverage-berkeley-prelim.yaml}
  - {id: ipho, name: 国際物理オリンピック（IPhO）Syllabus, kind: 大会, level: 高校, region: 国際, note: 世界中の高校生が、物理の問題と実験に挑む大会。, basis: IPhO 公式サイトの Statutes and Syllabus による（2026-11-07 取得、シラバスの版の表示なし）。論題と単元の対応は名称による。シラバス外の概念は問題文で説明すれば出してよい。数学は「中等学校の生徒が標準的な高校の数学で解けること」が条件, coverage: coverage-ipho.yaml}
  - {id: todai-butsuri, name: 東京大学大学院理学系研究科物理学専攻（修士課程入試）, kind: 入試, level: 大学院, region: 日本, note: 東京大学の大学院で、物理の研究を始めるための試験。, basis: "令和 9 年度の募集要項（筆記は数学 1 問と物理学 3 問の全問必答、240 分）と、専攻が公開する平成 27〜令和 8 年度の過去問 68 問（一部は Internet Archive の写し）の型付けによる。旧形式の実験・計測の選択問題は令和 4 年度から出ていないので入れない", coverage: coverage-todai-butsuri.yaml}
  - {id: gre-physics, name: GRE Physics Test（ETS）, kind: 入試, level: 大学, region: 米国, note: アメリカの大学院で物理を学ぶときに使う、大学の物理の力をはかる試験。, basis: "ETS の内容の頁と練習帳による。約 70 問で、大半は学部の最初の 3 年の物理で解ける。出題比率は古典力学 20%、電磁気学 18%、光学と波動 8%、熱力学と統計力学 10%、量子力学 13%、原子物理 10%、特殊相対論 6%、実験の方法 6%、専門の話題 9%。各分野は「such as」で例示されるだけなので、論題と単元の対応は名称による。数学の方法は ETS が挙げる多変数の微積分、ベクトル解析、フーリエ級数、偏微分方程式、行列と行列式、複素関数", coverage: coverage-gre-physics.yaml}
  - {id: step, name: University of Cambridge ほか（STEP 2・3）, kind: 入試, level: 大学, region: 英国, note: ケンブリッジ大学などで数学を学ぶ人が、長い問題をじっくり解く入学の試験。, basis: STEP 2 と STEP 3 の仕様書（2026 年 6 月以降）による。両方とも Mathematics 1（A Level 相当）を前提とし、STEP 3 は STEP 2 の範囲も含む。力学と確率統計も範囲に入る。論題と単元の対応は名称による, coverage: coverage-step.yaml}
  - {id: jee-advanced, name: Indian Institutes of Technology（JEE Advanced）, kind: 入試, level: 大学, region: インド, note: インド工科大学に入るための、とても難しいことで知られる試験。, basis: JEE (Advanced) 2026 の案内書の付録 I（数学の範囲）による。物理の範囲にある力学は含めない。論題と単元の対応は名称による, coverage: coverage-jee-advanced.yaml}
  - {id: jee-main, name: National Testing Agency（JEE Main）, kind: 入試, level: 大学, region: インド, note: インドの工学の大学に入るための全国の試験。, basis: JEE (Main) 2027 の数学（Paper 1、B.E./B.Tech.）のシラバスによる。2026 年 10 月 24 日付で掲示。論題と単元の対応は名称による, coverage: coverage-jee-main.yaml}
  - {id: tmua, name: University of Oxford ほか（TMUA）, kind: 入試, level: 大学, region: 英国, note: オックスフォード大学などで数学を学ぶ人の、考える力をためす入学の試験。, basis: TMUA の Content Specification（2026 年 10 月・2027 年 1 月の試験）による。Section 1 は AS level の純粋数学と GCSE 上級、Section 2 は論理と証明。どの大学・学科が課すかは調べていない。論題と単元の対応は名称による, coverage: coverage-tmua.yaml}
  - {id: todai-rika, name: 東京大学（理科の入学試験、数学）, kind: 入試, level: 大学, region: 日本, note: 東京大学の理科の学部に入るための数学の試験。, basis: 令和 9（2027）年度の入学者選抜要項と学習指導要領による。数学 I・II・III・A は全範囲、数学 B は「数列」「統計的な推測」、数学 C は「ベクトル」「平面上の曲線と複素数平面」。論題と単元の対応は名称による, coverage: coverage-todai-rika.yaml}
  - {id: gaokao, name: 中国の普通高等学校招生全国統一考試（高考、数学）, kind: 入試, level: 大学, region: 中国, note: 中国の高校生が大学に入るために受ける、全国の試験の数学。, basis: 全国卷の数学。範囲は普通高中数学課程標準（2017 年版 2020 年修訂）の必修課程と選択性必修課程。選学の印が付いた項目（複素数の三角表示、数学的帰納法、ベイズの公式）は考試の要求としないので含めない。積分の項目はない。論題と単元の対応は名称による, coverage: coverage-gaokao.yaml}
