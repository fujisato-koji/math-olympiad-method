      - 練習: 大きさくらべと、とびとびの数え方
      - 混ぜる: N-005 と混ぜる
      - 確認: 100 までの数
  - id: N-007
    title: 2 けたのたし算とひき算
    stage: 2
    needs: [N-006]
    plan:
      - 導入: 何十のたし算とひき算
      - 練習: 2 けた＋1 けた
      - 練習: 2 けた＋2 けた（筆算の入口）
      - 練習: 2 けたのひき算（くり下がり）
      - 混ぜる: N-006 と混ぜる
      - 確認: 2 けたの計算
  - {id: N-008, title: 偶数と奇数, stage: 2, needs: [N-007], days: 5}
