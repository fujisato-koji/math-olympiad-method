# 前提の線の種類と強さ（D-117）。キーは「前の単元>先の単元」（前の単元が先の単元の前提）。
#
# 種類（type）：
#   土台：前の単元の概念・定義・事実を、先の単元がそのまま土台にする（別の概念）
#   道具：前の単元の技法・計算・手続きを、先の単元の中で使う（先の単元には別の主題がある）
#   一般化：先の単元は、前の単元を含む広い枠・抽象化
#   応用：先の単元の主な中身が、前の単元の考えを別の対象・場面に当てはめること
#   深める：同じ論題を、先の単元が次の段で深める
#   成熟：前の単元の中身は直接使わないが、考え方・読み書きの慣れが要る
#   疑い：先の単元の中身から見て、前提として要らないように見える（見直しの候補）
# 強さ（strength）：3 は欠けると始められない、2 は一部で使う、1 はあると助かる（疑いは 1）
#
# 付け方（2026-11-12）：sonnet の係が、単元の名前（かっこの中の中身）と頭注の前提にふれた行を読んで、65 束で付けた。
#   1 割（417 本、線の名前のハッシュで選んだ）を別の係が最初の答えを見ずに付けなおした。
#   種類の一致 71%（κ 0.56）、強さの一致 76%、強さの差 1 以内 100%。疑いは、付けなおしでも 37 本中 25 本が疑い。
#   食いちがいの多い組は 土台と道具、土台と深める。種類は目安、強さは確かめられた値として使う。
