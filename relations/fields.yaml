  note: 工学が約 7 割、物理が約 3 割。「〇と〇」を避け、案 A・B 共通の「電気・電子工学と信号処理」の代わりに、信号処理・通信・制御まで含む確立した名前「電気電子工学」を採った。段は 1〜9 に広く散らばり、段では集まっていない。小学校理科の電気・力(sub66)、てこ・設計の入門(sub68)、ロボット入門(sub73)が低い段でまざる。核融合、重力波、医用画像、電波天文学、医療 AI が周辺に少数まざる。
