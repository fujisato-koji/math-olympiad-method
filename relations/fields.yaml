# 関係から見つけた分野（D-117、D-118）。地図の流れ（lanes）とは独立に、単元どうしの関係だけから見つけた塊に名前を付けたもの。
# 作り方（2026-11-12）：関係を 4 層（前提の線、代わりの前提、網羅表の同じ論題、問題が使う単元）にし、
#   同じ論題の重みを変えた 3 つの設定それぞれで Louvain を 30 回回した合意をとり、3 設定の合意をもう一度とった（1 段目）。
#   注意：前提の線に relations/needs.yaml の強さと種類で重みを付けるつもりだったが、この版では重みが配線されておらず、どの線も 1 だった。
#   また 3 設定のうち「そのまま」は 13:50 より前のデータ（最難関 7 問の uses を足す前）で回した。「強さつき」は実際には重みなしで新しいデータの「そのまま」と同じ。
#   地図を広げる 4 セッションのあと、tools/fields/ の正の手順（強さ×種類の重み、層の比だけを変えた 3 設定）で作りなおす。
#   1 段目の塊ごとに、もう一度合意をとって細かく分けた（2 段目）。10 単元に満たない塊は、関係のいちばん多い分野に入れた。
#   boundary は境目の単元（3 設定のどれかで仲間がかわるか、関係を 1 割抜くゆさぶりで 8 割未満しか同じ塊に残らない）。
# 名前：塊ごとに 2 つの係が別々に付け、3 つ目の係がくらべて決めた（確立した分野名、「〇と〇」で寄せ集めない）。
# くわしくは docs/research/relation-structure.md。地図の画面にはまだ使っていない（施主の確認のあと）。

