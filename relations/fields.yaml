# 関係から見つけた分野（D-117、D-118）。地図の流れ（lanes）とは独立に、単元どうしの関係だけから見つけた塊に名前を付けたもの。
# 作り方（2026-11-12）：関係を 4 層（前提の線は relations/needs.yaml の強さと種類で重み、代わりの前提、網羅表の同じ論題、問題が使う単元）にし、
#   同じ論題の重みを変えた 3 つの設定それぞれで Louvain を 30 回回した合意をとり、3 設定の合意をもう一度とった（1 段目）。
#   1 段目の塊ごとに、もう一度合意をとって細かく分けた（2 段目）。10 単元に満たない塊は、関係のいちばん多い分野に入れた。
#   boundary は境目の単元（3 設定のどれかで仲間がかわるか、関係を 1 割抜くゆさぶりで 8 割未満しか同じ塊に残らない）。
# 名前：塊ごとに 2 つの係が別々に付け、3 つ目の係がくらべて決めた（確立した分野名、「〇と〇」で寄せ集めない）。
# くわしくは docs/research/relation-structure.md。地図の画面にはまだ使っていない（施主の確認のあと）。
# 再作成（tools/fields/run.py）：3 設定はどれも前提の線を強さ×種類で重み付けした。名前は旧の分野との単元の重なり（Jaccard 0.5 以上）で引き継ぎ、引き継げない塊は name が null（要命名）。
# 手直し：relations/field-moves.yaml（中身で見て明らかに違う単元と細かい分野を移す、D-198）を当ててある。tools/fields/moves.py。

fields:
- id: F01
  name: 生命科学
  name_en: Life Sciences
  about: 分子・細胞から個体、生態系までの生物学を中心に、人体の生理と病気を扱う医学、家畜・作物を扱う農学と獣医学、計算生物学を含む広い分野。小学校の生き物観察から研究の最前線までを通して学ぶ。
  note: 生物 106、医学と健康 52、農学と獣医学 25 がまざっているので、包む名前として生命科学を使った。計算生物学（計算 17）と創薬化学も少し入る。小学校から大学院までの段が混在し、段ではなく内容の近さで集まっている。小学校から中学の生き物・からだの単元は細かい塊 51 に、分子・細胞・遺伝子は 61 に、生態は 62 に集まる。名前は主な中身の分野で付け、細かい塊は分野ごとに分かれる。
