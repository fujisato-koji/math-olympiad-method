  note: 心理学の単元が 20 で中心（Q-005、Q-009、Q-015、Q-016 など）。神経科学 8 と生体工学 4 は境目の単元で縁にあり、名前は中心の心理学で決めた（認知神経科学だと縁を中心に見せてしまう）。行動経済学 1（F-049）は判断と意思決定（Q-009）の隣。UX・人間工学（Q-020〜022）は人の情報処理でつながって入っている。学ぶ段は 7〜9 の大学・大学院が中心で、段 2〜3 の入口（Q-002、Q-003）が少し混じる。
