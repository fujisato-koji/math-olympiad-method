  name: 地球科学
  name_en: Earth Science
  about: 固体地球（岩石・鉱物・地震・火山・内部構造）、大気・海洋・気候、年代と地球化学、氷と水までを含む、地球を対象とする分野。小学校の観察から大学院の力学・数値モデルまで段をまたいで集まっている。
  note: 固体地球科学（岩石・地震・火山・地球化学）と大気海洋科学（気象・気候・流体力学・数値予報）が大きく二つにまざるため、両方を包む確立した上位の名前として地球科学を採用した（「・」でつなぐ名前は避けた）。内わけは地球科学 56、物理 42（ほぼ気象と気候）。段は細かい塊ごとに分かれ、岩石・鉱物は小学校から、気象力学は大学から大学院、気候システムと数値予報は大学院寄り。数値予報、保険数理、資源の塊は境目の単元が多く、計算・統計・工学への橋になっている。保険数理（生命表）や待ち行列は地球科学ではない。
