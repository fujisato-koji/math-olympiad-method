# 関係から見つけた分野（D-117、D-118、D-122）。地図の流れ（lanes）とは独立に、単元どうしの関係だけから見つけた塊に名前を付けたもの。
# 作り方（2026-11-12、tools/fields/run.py）：関係を 4 層（前提の線は relations/needs.yaml の強さ×種類で重み、代わりの前提、網羅表の同じ論題、問題が使う単元）にし、
#   層の比を変えた 3 つの設定（同じ論題 1 倍、2 倍、問題が使う単元 2 倍）それぞれで Louvain を 30 回回した合意をとり、3 設定の合意をもう一度とった（1 段目）。
#   1 段目の塊ごとに、もう一度合意をとって細かく分けた（2 段目）。10 単元に満たない塊は、関係のいちばん多い分野に入れた（「小さな塊」か、中身の名前の細かい分野）。
#   boundary は境目の単元（3 設定のどれかで仲間がかわるか、関係を 1 割抜くゆさぶりで 8 割未満しか同じ塊に残らない）。
# 名前：はじめの版の分野と単元の重なり（Jaccard 0.5 以上）があれば引き継ぎ、ほかは塊ごとに 2 つの係が別々に付け、3 つ目の係がくらべて決めた。
#   取りまとめが全部を読み、重なる名前、「〇・〇」の寄せ集め、中身に合わなくなった名前を直した（確立した分野名、「〇と〇」で寄せ集めない）。
#   単元を別の塊へ移す案は採らない（塊は関係から計算で決める）。混じっている単元は about に書いた。
# くわしくは docs/research/relation-structure.md の「作りなおした分野」。地図の画面にはまだ使っていない（施主の確認のあと）。

