- id: F14
  name: 航空宇宙工学
  name_en: Aerospace Engineering
  about: 古典力学を土台に、流体力学・熱工学・空気力学、ロケットや電気推進、軌道・姿勢・制御まで、航空機と宇宙機を成り立たせる力学と工学の塊。
  note: 物理の力学・解析力学（段 5〜8、20 単元）と工学（流体・熱・推進・軌道、段 7〜9、42 単元）がまざる。力学と流体力学を包み、航空機と宇宙機へ向かう確立した名前として航空宇宙工学を選んだ。力学の基礎は段 5〜7 で、工学は段 7〜9 と、学ぶ段の順に連なる。流体・熱・空力の単元の大半は境目で、中心は力学と推進・軌道。水理学・水文学、移動ロボット、車両運動は周辺にあたる。
