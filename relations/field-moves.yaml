# 関係から見つけた分野（relations/fields.yaml）の手直し（D-198、2026-11-20、施主「生物の分野の中に振り子の単元が入っています。不適切」）。
#
# 分野は単元どうしの関係だけから見つける（D-117）。関係の薄い単元や、ある網羅表の同じ論題で別の分野の単元とつながる単元
# （小学校の理科の網羅表で、振り子が生き物の単元とつながるなど）が、中身の違う分野や細かい分野に入ることがある。
# 中身で見て明らかに違うものだけを、ここで移す。境目で、どちらとも言えるものは移さない。
#
# 当て方：tools/fields/save_fields.py が塊を書く前に当てる。tools/fields/moves.py --write で、いまの relations/fields.yaml にも当てる。
#   同じ手直しを何度当てても変わらない。当てられなかったもの（名前が見つからない）は、道具が一覧に出す。
#   当てたあとは tools/fields/order2d.py（2D の行の並び）と python tools/roadmap.py build。
# 分野と細かい分野は名前で指す（作りなおすと記号 F01-01 は変わるが、名前は単元の重なりで引き継ぐ）。
# 当てる順：rename → new → subs → units。units の行き先は「分野/細かい分野」で、そこへ移す単元を並べる。

# 中身に合わない名前と「小さな塊」の名前を変える
rename:
- {field: 純粋数学, sub: 微分積分学, name: 線形代数学, name_en: Linear Algebra, about: 行列と連立一次方程式、行列式、固有値と対角化、ジョルダン標準形、ベクトル空間と線形写像、双対空間、多重線形代数、特異値分解。}
- {field: 生命科学, sub: 小さな塊, name: 進化生物学, name_en: Evolutionary Biology, about: 進化のしくみと生物の歴史、系統樹の推定と系統比較法、真核細胞の起源、動物の体の設計の比較、系統ゲノミクス、人類の進化。}
- {field: 数学, sub: 小さな塊, name: 関数方程式, name_en: Functional Equations, about: 大会の水準の関数方程式（代入、単射と全射、コーシーの方程式、病的な解）。}

# 新しい細かい分野（受け皿）
new:
- {field: 純粋数学, name: 組合せ論, name_en: Combinatorics, about: 研究の水準の組合せ論（加法的組合せ論、セメレディの定理、マトロイドと対数凹性、組合せ凸性）。大会の水準の組合せ論は分野「数学」の組合せ論。}
- {field: 計算機科学, name: 数理最適化, name_en: Mathematical Optimization, about: 凸最適化、ラグランジュ法と双対性、線形計画法、整数計画と組合せ最適化。}
- {field: 計算機科学, name: 暗号理論, name_en: Cryptography, about: 暗号の基礎、ブロック暗号とハッシュ関数、ゼロ知識証明と秘密分散、格子暗号、暗号とセキュリティの形式手法。}
- {field: 地球科学, name: 測量学, name_en: Surveying, about: 地図と GIS、基準点測量、写真測量、レーザ測量、リモートセンシング、衛星測位と宇宙測地学、地理空間データの解析。}
- {field: 現代物理学, name: 一般相対性理論, name_en: General Relativity, about: 等価原理と曲がった時空、テンソル解析、アインシュタイン方程式、ブラックホール、重力波とその観測、曲がった時空の場の量子論。}
- {field: 生命科学, name: 農学, name_en: Agricultural Science, about: 作物の栽培化と遺伝資源、作物の生理と収量、育種（量的遺伝とゲノム育種）、土と植物の栄養、病害虫の防除、持続可能な農業、水産と養殖、食品の科学と安全。}

# 細かい分野ごと、別の分野へ移す
subs:
- {sub: 発生生物学, from: 純粋数学, to: 生命科学}       # 形態形成・進化発生学・1 細胞で見る発生。数理の単元とつながっていた
- {sub: 多項式, from: 純粋数学, to: 数学}               # 整数係数の多項式・多項式の応用（段 6〜7、大会の水準）
- {sub: 天文学, from: 化学, to: 地球科学}               # 小学校から中学の太陽・月・星の観察
- {sub: 水文気象学, from: 化学, to: 地球科学}           # 天気・雲と雨・水のめぐり・地下水
- {sub: 水文学, from: 機械工学, to: 地球科学}           # 流域の水文学・陸水・水理学
- {sub: 動物福祉学, from: 統計学, to: 生命科学}         # 家畜とペットの世話、動物の福祉の科学
- {sub: 行動経済学, from: 統計学, to: 経済学}
- {sub: 地震リスク解析, from: 統計学, to: 構造工学}     # 地震ハザード解析、建築物の地震リスク（耐震工学のとなり）
- {sub: 経営工学, from: 数学, to: 経済学}               # 生産管理、在庫管理（経営学・管理会計のとなり）

