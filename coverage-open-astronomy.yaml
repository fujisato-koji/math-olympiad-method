items:
- id: T-01
  field: 宇宙論
  topic: 暗黒エネルギーの正体：宇宙の膨張を加速させているものは何か、時間で変わるか（未解決。DESI DR2（2025）は時間変化の兆しを 2.8〜4.2σ、2026 年の解析は約 3σ とし、発見の水準に届いていない）
  sources:
  - OP020
  - OP021
  - OP022
  units:
  - P-064
  - P-066
  - P-228
- id: T-02
  field: 宇宙論
  topic: ハッブル定数の食い違い：近くの宇宙の距離はしごで測った膨張の速さと、初期宇宙から予測した値が合わないのはなぜか（未解決。局所の距離の網（2026）は 73.50 ± 0.81 km/s/Mpc、赤色巨星の先端を使う CCHP は 70.4）
  sources:
  - OP020
  - OP023
  - OP024
  - OP025
  units:
  - P-162
  - P-166
  - P-065
  - P-228
- id: T-03
  field: 銀河とブラックホール
  topic: 最初の銀河と超大質量ブラックホールの起源：宇宙の夜明けに銀河とブラックホールはどう生まれ、なぜ早く大きくなれたか（未解決。JWST が見つけた赤くて小さい天体（リトル・レッド・ドット）の正体を研究中）
  sources:
  - OP020
  - OP026
  units:
  - P-170
  - P-068
  - P-165
  - P-229
- id: T-04
  field: 系外惑星と生命
  topic: 生命の住める惑星と地球外生命：地球に似た惑星に生命の兆しはあるか（未解決。K2-18b のジメチルスルフィドの主張（2025）は、再解析で有意でないとされた）
  sources:
  - OP020
  - OP027
  - OP028
  units:
  - P-171
  - P-131
  - B-111
- id: T-05
  field: 宇宙論
  topic: インフレーションの証拠：宇宙のはじめの急な膨張が残す原始重力波は見つかるか（未解決。BICEP/Keck の上限は r < 0.036）
  sources:
  - OP030
  units:
  - P-067
  - P-065
  - P-228
- id: T-06
  field: 突発天体
  topic: 高速電波バーストの起源：千分の一秒ほど光る電波の閃光は何が出しているか（一部解決。2020 年に銀河系のマグネター SGR 1935+2154 から観測されたが、古い球状星団の中の繰り返し源などは説明しきれない）
  sources:
  - OP029
  units:
  - P-167
  - P-168
- id: T-07
  field: 高エネルギー天体
  topic: 最高エネルギー宇宙線の起源：10^20 電子ボルトを超える粒子はどこで加速されるか（未解決。2023 年に報告された約 244 EeV の粒子の到来方向に、対応する天体がない）
  sources:
  - OP031
  units:
  - P-168
  - P-107
  - P-163
- id: T-08
  field: 太陽
  topic: 太陽コロナの加熱：表面よりはるかに熱いコロナを何が温め、太陽風を何が加速しているか（未解決。米国の太陽・宇宙物理の 10 年計画（2024）が 70 年来の問いとして挙げる）
  sources:
