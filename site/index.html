<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みちすじ</title>
<meta name="description" content="ものを数えるところから研究の最前線まで。知の宇宙と、1 日分ずつの問題">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M6 32 C 14 32, 14 20, 20 20 S 26 8, 34 8' fill='none' stroke='%231c2230' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='6' cy='32' r='4.2' fill='%233466f0'/%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%230d9c96'/%3E%3Ccircle cx='34' cy='8' r='4.2' fill='%23ea5a34'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/" aria-label="みちすじ（全体の地図へ）">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M6 32 C 14 32, 14 20, 20 20 S 26 8, 34 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="6" cy="32" r="4.2" fill="var(--lane-N)"/>
      <circle cx="20" cy="20" r="4.2" fill="var(--lane-C)"/>
      <circle cx="34" cy="8" r="4.2" fill="var(--lane-G)"/>
    </svg>
    <span class="brand-name">みちすじ</span>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="いまの場所"></nav>
  <div class="tools">
    <button id="btn-who" class="pill who-chip" type="button" title="だれの記録か（押すと切り替え）"></button>
    <button id="btn-today" class="pill solid" type="button">今日の課題</button>
    <button id="btn-music" class="icon" type="button" aria-label="音楽" title="音楽">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg>
    </button>
    <button id="btn-parent" class="icon" type="button" aria-label="保護者の表示" title="保護者の表示">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 20c.6-3.6 2.8-5.5 5.5-5.5s4.9 1.9 5.5 5.5M13.5 20c.4-2.4 1.7-3.8 3.5-3.8s3.1 1.4 3.5 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-menu" class="icon" type="button" aria-label="記録" title="記録">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<section id="explore" class="explore" aria-label="知の宇宙" hidden></section>
<main id="view" tabindex="-1"></main>

<dialog id="menu" class="sheet">
  <form method="dialog">
    <h2>記録</h2>
    <p class="muted">進み具合は、人ごとに、この端末のブラウザの中にだけ保存しています。別の端末へ移すときや、非公開の記録に残すときは書き出してください。問題が新しくなっても、済んだ単元と日の記録は引き継ぎます。</p>
    <div class="who-box">
      <div class="k">だれの記録</div>
      <div class="row who-list" id="who-list"></div>
      <div class="row">
        <button type="button" class="pill" id="btn-who-add">人を足す</button>
        <button type="button" class="pill" id="btn-who-rename">呼び名を変える</button>
      </div>
    </div>
    <div class="row">
      <button type="button" class="pill" id="btn-export">この人の記録を書き出す</button>
      <label class="pill file">読み込む<input type="file" id="file-import" accept="application/json"></label>
    </div>
    <div class="row">
      <button type="button" class="pill danger" id="btn-reset">この人の記録を消す</button>
      <button class="pill solid" value="close">とじる</button>
    </div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="problems.js"></script>
<script src="music.js"></script>
<script src="app.js"></script>
<script type="module" src="space.js"></script>
</body>
</html>
