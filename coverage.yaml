# 網羅表：IMO と JMO に要る論題と、それを受け持つ単元（R-09）
#
# 論題は docs/research/olympiad-topics.md（公開資料の章立てと範囲の記述を突き合わせた一覧）から取った。
# どの論題にも、受け持つ単元（units）か、入れない理由（none）のどちらかを書く。tools/roadmap.py が確かめる。
# 学習指導要領には合わせない（D-011）。「学校の道具」は、IMO の道具として要る学校の内容。

