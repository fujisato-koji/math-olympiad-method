# 用語の説明（マウスオーバー）
#
# 画面では、単元の原稿に《用語》と書いた所だけに説明が付く（D-063）。
# 日本語は語の切れ目がなく、字面の走査では「原子核」の「核」と「準同型の核」を区別できない。
# どの語がどの意味で使われているかは、原稿を書く側が一番よく知っているので、原稿で決める。
# ここにない用語を《》で囲むと、tools/roadmap.py check が誤りとして報告する。
#
# term: 原稿に書く語（《term》）。text: 説明。unit: 詳しい単元（あればリンクにする）。

- term: 'Q \ {0}'
  text: 0 を除いた有理数全体。かけ算の群で使います。
  unit: A-024
- term: 部分集合
  text: A のどの要素も B の要素であるとき、A は B の部分集合。
  unit: A-024
- term: 部分群
  text: 群 G の部分集合で、G と同じ演算で群になるもの。
- term: 準同型
  text: f(a·b) = f(a)·f(b) を満たす、群の間の写像。
- term: 巡回群
  text: 1 つの要素の累乗で全体が書ける群。
- term: 生成元
  text: 群のすべての要素を累乗で作れる要素。
- term: 単位元
  text: e·a = a·e = a となる要素 e。
- term: 結合法則
  text: (a·b)·c = a·(b·c) が成り立つこと。
- term: 数直線
  text: 数を一直線に並べたもの。右へ進むと増える。
  unit: N-002
- term: 正負の数
  text: 0 より小さい負の数と、0 より大きい正の数。
  unit: N-027
- term: 対称移動
  text: 回転や裏返しで、図形をもとの図形に重ねる移動。
  unit: G-015
- term: 写像
  text: 集合の各要素に、行き先の要素を 1 つ対応させるもの。
  unit: A-024
- term: 全単射
  text: 単射で全射な写像。
  unit: A-024
- term: 単射
  text: f(a) = f(b) ならば a = b となる写像。
  unit: A-024
- term: 全射
  text: 行き先のどの要素にも写ってくる要素がある写像。
  unit: A-024
- term: 同型
  text: 全単射で準同型な写像があること。
- term: 位数
  text: g^n = e となる最小の正の整数 n。
- term: 有理数
  text: 分数で書ける数。
  unit: N-016
- term: 整数
  text: …, −2, −1, 0, 1, 2, … の数。
  unit: N-027
- term: 倍数
  text: a = bk となる整数 k があるとき、a は b の倍数。
  unit: N-017
- term: 約数
  text: b = ak となる整数 k があるとき、a は b の約数。
  unit: N-017
- term: 余り
  text: わり切れずに残る数。
  unit: N-014
- term: 分数
  text: a/b の形で書ける数。
  unit: N-016
- term: 逆数
  text: かけると 1 になる数。a/b の逆数は b/a。
  unit: N-078
- term: 逆元
  text: a·b = b·a = e となる要素 b。
- term: 鏡映
  text: 鏡に映したように裏返す移動。
  unit: G-015
- term: 群
  text: 集合と演算の組で、閉じている・結合法則・単位元・逆元を満たすもの。
- term: Z
  text: 整数全体の集合 {…, −2, −1, 0, 1, 2, …}。
  unit: A-024
- term: Q
  text: 有理数全体の集合。分数で書ける数。正の有理数だけの集合は Q_{>0}。
  unit: A-024
- term: 2Z
  text: 2 の倍数全体 {…, −4, −2, 0, 2, 4, …}。
- term: 3Z
  text: 3 の倍数全体。
- term: 4Z
  text: 4 の倍数全体。
- term: 5Z
  text: 5 の倍数全体。
- term: 6Z
  text: 6 の倍数全体。
- term: 7Z
  text: 7 の倍数全体。
- term: 像
  text: 写像によって移った先の値。写像 f の像全体は im f = {f(x) | x は定義域の要素}。
- term: 核
  text: 準同型 f で、単位元に写る要素全体。ker f = {g | f(g) = e_H}。
- term: 閉じている
  text: G の要素どうしの演算の結果が、また G に入ること。
- term: 波長
  text: 1 つの波の山から次の山までの距離。λ と書く。
  unit: P-021
- term: 周期
  text: 1 つの振動にかかる時間。T と書く。
  unit: P-021
- term: 振動数
  text: 1 秒あたりの振動の回数。f = 1/T。
  unit: P-021
- term: 群速度
  text: 波の束（包絡線）が進む速さ。2 つの波では Δω/Δk。位相速度とはちがうことがある。
  unit: P-021
- term: 位相速度
  text: 山（位相）が進む速さ。v_p = ω/k。
  unit: P-021
- term: うなり
  text: 振動数の近い 2 つの音が重なって、大きくなったり小さくなったりすること。うなりの振動数は |f₁ − f₂|。
  unit: P-021
- term: 定常波
  text: 逆向きに進む同じ波が重なって、節と腹ができる波。
  unit: P-021
- term: 節
  text: 定常波で、まったく動かない点。
  unit: P-021
- term: 腹
  text: 定常波で、もっとも大きく振動する点。
  unit: P-021
- term: 屈折率
  text: 光の速さが媒質でどれだけ遅くなるかを表す数。v = c/n。
  unit: P-021
- term: 回折
  text: 波が障害物の陰に回り込むこと。
  unit: P-021
- term: 干渉
  text: 2 つの波が重なって、強め合ったり弱め合ったりすること。
  unit: P-021
- term: 反射
  text: 波が境界で返ること。
  unit: P-021
- term: 屈折
  text: 波が境界で速さを変え、進む向きが変わること。
  unit: P-021
- term: 仕事関数
  text: 金属から電子 1 つを取り出すのに必要な最小のエネルギー。W と書く。光子のエネルギーがこれより小さいと、光電子は出ない。
  unit: P-069
- term: 光電子
  text: 光電効果で、金属から飛び出す電子。
  unit: P-069
- term: 限界振動数
  text: 光電効果で電子が出る最小の振動数。これより低い振動数では、光を強くしても電子は出ない。
  unit: P-069
- term: 光子
  text: 光の粒。1 つのエネルギーは E = hf。
  unit: P-069
- term: 光電効果
  text: 金属に光を当てると、電子が飛び出す現象。
  unit: P-069
- term: コンプトン散乱
  text: X 線の光子が電子と衝突し、光子がエネルギーを失って波長が長くなる散乱。
  unit: P-069
- term: 物質波
  text: 運動量 p の粒子がもつ、波長 λ = h/p の波。ド・ブロイ波。
  unit: P-069
- term: ボーア模型
  text: 電子の角運動量を量子化し、水素のエネルギー準位を説明した原子模型。
  unit: P-069
- term: 定義
  text: 言葉の意味を決めるもの。証明するものではなく、その言葉を使うときの約束。
- term: 定理
  text: 定義や公理から証明できるもの。前の単元で証明した定理は、その単元へのリンクを付ける。
- term: 法則
  text: 実験や観測で成り立つと確かめられ、広く認められた規則。証明ではなく、多くの事実から支えられている。
- term: 公理
  text: 議論の出発点として認めるもの。証明しない。
- term: 公式
  text: 定義や定理から導かれる、計算の形。
- term: 原理
  text: 広い範囲の現象を支配する基本の決まり。法則より広い出発点に置かれることが多い。
- term: 性質
  text: 定義から導かれる基本的な特徴。
- term: 約束
  text: 記号の書き方や言葉の使い方の取り決め。
- term: 予想
  text: まだ証明されていないが、成り立つと考えられている命題。
- term: モデル
  text: 現象を説明するために作られた考え方。現実そのものではなく、分かりやすくした像。
- term: 近似
  text: ある条件のもとで成り立つ、近似的な関係。
- term: 方法
  text: 目的を達するための手順。
- term: 現象
  text: 実験や観測で見られる出来事。
- term: 仮説
  text: まだ十分に確かめられていないが、現象を説明するために立てられた考え。
- term: オームの法則
  text: 1827 年にオームが実験で見つけた、電圧と電流が比例する関係。V = R I。
  unit: P-029
- term: クーロンの法則
  text: 1785 年にクーロンがねじり秤の実験で確かめた、電荷の間の力の法則。F = kQ₁Q₂/r²。
  unit: P-030
- term: ガウスの法則
  text: クーロンの法則から導かれる、閉じた面を貫く電束と中の電荷の関係。Φ = Q/ε₀。
  unit: P-031
- term: ファラデーの法則
  text: 電磁誘導の実験から見つかった、磁束の変化が起電力を生むという法則。V = −N ΔΦ/Δt。
  unit: P-033
- term: レンツの法則
  text: 誘導電流が磁束の変化を妨げる向きに流れるという実験則。
  unit: P-033
- term: キルヒホッフの法則
  text: 電荷保存とエネルギーの保存から導かれる、回路の電流・電圧の法則。
  unit: P-029
- term: パウリの原理
  text: 電子などのフェルミオンは、同じ量子状態に 2 個以上入れないという原理。実験事実から立てられた。
  unit: P-088
- term: 平均値の定理
  text: 微分積分の定理。区間の平均の傾きと同じ傾きの接線が、内部のどこかにある。
  unit: D-008
- term: ロルの定理
  text: 平均値の定理の特別な場合。f(a)=f(b) なら f'(c)=0 となる c がある。
  unit: D-008
- term: テイラーの定理
  text: 関数を多項式と剰余項で表す定理。
  unit: D-008
- term: 微積分の基本定理
  text: 微分と積分が互いに逆の操作であることを述べる定理。
  unit: D-009
- term: ビーベルバッハの定理
  text: 離散的な等長変換群が格子の並進を有限指数でもつ、という定理。
  unit: R-006
- term: 三角行列
  text: 対角より下（または上）の成分がすべて 0 の行列。例：(1 2；0 3)。行列式は対角の積になる。
  unit: M-004
- term: 三角関数
  text: 角 θ に対して sin θ、cos θ、tan θ を対応させる関数。単位円の座標で定める。
  unit: G-025
- term: マルコフ行列
  text: 成分が 0 以上で、各列の和が 1 の行列。確率の移り方を表す。
  unit: M-007
- term: 定常状態
  text: マルコフ行列をかけても変わらない状態。固有値 1 の固有ベクトル。
  unit: M-007
- term: バリオン数
  text: 陽子や中性子などの粒子の数を、反粒子を −1 として数えた量。
  unit: P-105
- term: レプトン数
  text: 電子やニュートリノなどの軽い粒子の数を、反粒子を −1 として数えた量。
  unit: P-105
- term: 積分因子
  text: 1 階線形微分方程式の両辺にかけ、左辺を積の微分の形にする関数 e^(∫P dx)。
  unit: D-044
- term: イオン化
  text: 原子から電子を取り去ること。外では E = 0 とみなせる。
  unit: P-069
- term: 平行板コンデンサー
  text: 2 枚の平行な金属板を向かい合わせた装置。板の間の電場は E = σ/ε₀、電圧は V = E d。
  unit: P-031
